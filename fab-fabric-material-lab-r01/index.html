<!doctype html><html lang="zh-CN"><head><link rel="icon" href="data:,"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>KAOPU · Fab Fabric Material Lab R01</title><style>
*{box-sizing:border-box}body{margin:0;background:#171819;color:#e8e5df;font:14px/1.5 system-ui,-apple-system,sans-serif}header{height:54px;border-bottom:1px solid #383a3b;display:flex;align-items:center;padding:0 20px;gap:18px}header strong{font-weight:600;letter-spacing:.04em}header small{color:#9b9b96}main{height:calc(100vh - 54px);display:grid;grid-template-columns:minmax(500px,1.08fr) minmax(430px,.92fr);gap:14px;padding:14px}.left{min-width:0;display:grid;grid-template-rows:minmax(310px,1fr) auto;gap:12px}.viewport{position:relative;background:#252728;border:1px solid #3a3c3d;min-height:0;overflow:hidden}canvas{width:100%;height:100%;display:block;touch-action:none;cursor:grab}canvas:active{cursor:grabbing}.overlay{position:absolute;left:15px;top:12px;pointer-events:none}.overlay b{display:block;font-size:15px;font-weight:550}.overlay span{color:#aaa;font-size:11px}.hint{position:absolute;bottom:10px;left:14px;color:#999;font-size:11px;pointer-events:none}.panel{border:1px solid #3a3c3d;background:#202223;padding:13px 15px;display:grid;grid-template-columns:1fr 1fr;gap:12px 18px;align-content:start}.panel h2{grid-column:1/-1;margin:0;font-size:13px;font-weight:600;color:#d9c9ae}.control{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center}.control label{color:#bbb;font-size:12px}.control output{font-variant-numeric:tabular-nums;color:#e3d0b0;font-size:12px}.control input[type=range]{grid-column:1/-1;width:100%;accent-color:#c7a77c}.control select,.control input[type=color]{grid-column:1/-1;width:100%}select,button{background:#2a2c2d;color:#eee;border:1px solid #505253;border-radius:3px;padding:7px 9px;font:inherit}button{cursor:pointer}button:hover{background:#383a3b}.buttons{grid-column:1/-1;display:flex;gap:7px;flex-wrap:wrap}.right{min-width:0;border:1px solid #3a3c3d;background:#1e2021;display:grid;grid-template-rows:auto 1fr auto;min-height:0}.rightHead{padding:11px 14px;border-bottom:1px solid #3a3c3d;display:flex;align-items:center;justify-content:space-between}.rightHead b{font-size:13px}.rightHead span{color:#999;font-size:11px}textarea{width:100%;height:100%;min-height:0;resize:none;border:0;outline:none;background:#17191a;color:#c7d5c2;padding:15px;font:12px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace;tab-size:2;white-space:pre;overflow:auto}.rightFoot{padding:10px 14px;border-top:1px solid #3a3c3d;display:flex;align-items:center;justify-content:space-between;gap:12px}.status{font-size:11px;color:#aaa}.error{color:#e7a28b}.primary{background:#c8ad87;color:#1b1b1a;border-color:#c8ad87}.sources{font-size:11px;color:#898b8a}.sources a{color:#cbb18c;margin-right:10px}.device{font-size:10px;color:#7e8585}@media(max-width:950px){main{height:auto;min-height:calc(100vh - 54px);grid-template-columns:1fr;grid-template-rows:minmax(420px,60vh) minmax(500px,70vh)}.right{min-height:500px}.panel{grid-template-columns:1fr 1fr}}@media(max-width:560px){main{padding:8px;gap:8px;grid-template-rows:48vh auto}.panel{grid-template-columns:1fr}.right{min-height:65vh}}
</style></head><body><header><strong>KAOPU / FAB FABRIC LAB</strong><small>织物材质研究 · WebGPU · R01</small><span style="margin-left:auto" class="device" id="device">WebGPU starting…</span></header><main><section class="left"><div class="viewport"><canvas id="view" width="960" height="600"></canvas><div class="overlay"><b id="name">Plain weave · 平纹棉布</b><span id="description">交错经纬，方格状组织，适合棉布与基础衬布</span></div><div class="hint">拖动旋转视角 · 滚轮缩放 · 左上为实时三维布面</div></div><section class="panel"><h2>材质参数 · 当前设置作用于左侧实时布面</h2><div class="control"><label for="material">材质样本</label><output>7 个独立模型</output><select id="material"></select></div><div class="control"><label for="tile">织造密度 / 细节频率</label><output id="tileValue">78</output><input id="tile" type="range" min="12" max="180" value="78"></div><div class="control"><label for="relief">纤维与织造起伏</label><output id="reliefValue">0.025</output><input id="relief" type="range" min="0" max=".14" step=".001" value=".025"></div><div class="control"><label for="rough">表面粗糙度</label><output id="roughValue">0.82</output><input id="rough" type="range" min=".08" max="1" step=".01" value=".82"></div><div class="control"><label for="colorA">主色</label><input id="colorA" type="color" value="#b9a68c"></div><div class="control"><label for="colorB">纱线 / 图案副色</label><input id="colorB" type="color" value="#665a4b"></div><div class="buttons"><button id="reset">恢复样本参数</button><button id="import">导入材质</button><button id="export" class="primary">导出材质 JSON</button><input id="file" type="file" accept=".json,application/json" hidden></div><div class="sources" style="grid-column:1/-1">Fab 参考：<a href="https://www.fab.com/listings/56541b76-497a-4b76-b497-0016761b98ef" target="_blank">9种程序织物</a><a href="https://www.fab.com/listings/b30a59a7-963d-4939-a3aa-b5fc7fdaeab1" target="_blank">Fabric Pack5</a><a href="https://www.fab.com/listings/85bf282f-33f3-4ab8-846a-d7916cd0ba4c" target="_blank">Free Weave</a><a href="https://www.fab.com/listings/5154d3cb-4371-428a-a12c-b51a03d650e1" target="_blank">Tent Pack</a></div></section></section><section class="right"><div class="rightHead"><b>完整材质函数 · WGSL</b><span>编辑后点击编译 / Ctrl + Enter</span></div><textarea id="code" spellcheck="false"></textarea><div class="rightFoot"><span id="status" class="status">等待 WebGPU…</span><button id="compile" class="primary">编译并应用代码</button></div></section></main><script src="./app.js"></script></body></html>
