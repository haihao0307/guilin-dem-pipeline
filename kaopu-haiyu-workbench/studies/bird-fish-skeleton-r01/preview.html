function frameBounds(view){const key=view==='orbit'?[s.azimuth,s.elevation].join('/'):'fixed',old=framingCache[view];if(old?.key===key)return old;let xmin=Infinity,xmax=-Infinity,ymin=Infinity,ymax=-Infinity;for(const v of framingPoints){const q=project(v,view,s.azimuth,s.elevation);xmin=Math.min(xmin,q[0]);xmax=Math.max(xmax,q[0]);ymin=Math.min(ymin,q[1]);ymax=Math.max(ymax,q[1])}return framingCache[view]={key,cx:(xmin+xmax)/2,cy:(ymin+ymax)/2,width:Math.max(.1,xmax-xmin),height:Math.max(.1,ymax-ymin)}}
function screen(v,view,w,h,zoom=1){const q=project(v,view,s.azimuth,s.elevation),f=frameBounds(view),scale=Math.min(w/f.width,h/f.height)*.84*zoom;return[w/2+(q[0]-f.cx)*scale,h/2+(q[1]-f.cy)*scale,q[2]]}
function fingerprint(){const str=JSON.stringify(packet.lines.map(l=>l.points));let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return(h>>>0).toString(16)}

 c.fillStyle='#748b97';c.font=(11*dpr)+'px system-ui';c.fillText(view==='xy'?'XY · 顶视':view==='xz'?'XZ · 侧视':view==='yz'?'YZ · 轴端':'自由观察',12*dpr,20*dpr);let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;for(const {line:l}of rows)for(const p of l.points){const q=screen(p,view,w,h,zoom);minX=Math.min(minX,q[0]);maxX=Math.max(maxX,q[0]);minY=Math.min(minY,q[1]);maxY=Math.max(maxY,q[1])}evidence[canvas.id]={revision,time:s.time,worldFingerprint:fingerprint(),lines:packet.lines.length,cycleFramingSamples:framingSampleCount,pixelBounds:{minX,maxX,minY,maxY},canvas:{width:w,height:h},zoom};
}
function render(){prepareFraming();for(const id of['scene','xy','xz','yz'])draw($(id),id==='scene'?s.view:id);$('time').value=s.time;$('clock').textContent=s.time.toFixed(2)+' / '+packet.duration.toFixed(2)+' s';$('play').textContent=s.playing?'暂停':'播放';const m=inspect(packet);$('status').textContent=`${m.lines} 条结构线 · ${m.points} 个三维点 · 根部误差 ${m.attachmentError}`;$('data').textContent=JSON.stringify({kind,parameters:packet.parameters,checks:m,motion:packet.motion,unknown:packet.unknown},null,2);document.body.dataset.ready='true';document.body.dataset.case=kind;dirty=false}

$('layer').onchange=e=>{s.layer=e.target.value;dirty=true;schedule()};$('neutral').onclick=()=>{s.neutral=!s.neutral;$('neutral').textContent=s.neutral?'中性骨架':'结构分组色';dirty=true;schedule()};$('resetView').onclick=()=>{s.azimuth=packet.camera.azimuth;s.elevation=packet.camera.elevation;s.zoom=1;view('orbit')};$('play').onclick=()=>{s.playing=!s.playing;last=0;dirty=true;schedule()};$('reset').onclick=()=>{pause();s.time=0;geometryDirty=true;schedule()};$('time').oninput=e=>{pause();s.time=Number(e.target.value);geometryDirty=true;schedule()};for(const id of['amplitude','span','chest'])$(id).onchange=e=>{s[id]=Number(e.target.value);geometryDirty=true;schedule()};
const scene=$('scene');scene.onpointerdown=e=>{if(e.button!==0)return;drag={id:e.pointerId,x:e.clientX,y:e.clientY,az:s.azimuth,el:s.elevation};scene.setPointerCapture(e.pointerId)};scene.onpointermove=e=>{if(!drag||drag.id!==e.pointerId)return;s.azimuth=drag.az+(e.clientX-drag.x)*.006;s.elevation=Math.max(-1.3,Math.min(1.3,drag.el-(e.clientY-drag.y)*.006));view('orbit')};for(const ev of['pointerup','pointercancel','lostpointercapture'])scene.addEventListener(ev,()=>drag=null);scene.addEventListener('wheel',e=>{e.preventDefault();s.zoom=Math.max(.6,Math.min(2.6,s.zoom*Math.exp(-e.deltaY*.001)));dirty=true;schedule()},{passive:false});
