<section id="axisLift" hidden>
  <div class="experiment-head"><div><div class="eyebrow">三维工作台 · 躯轴、侧肢与尾部共同生长</div><h2 id="liftTitle">04 多频羽化 · 羽肢生物</h2></div><span class="quiet" id="liftStatus"></span></div>
  <p class="quiet" id="liftCandidateNote">形态候选：从原式的弯曲躯轴和局部谐波，长出有厚度的躯干、双侧附肢和尾部。</p>
  <div class="exp-grid">
    <div>
      <div class="exp-scene"><canvas id="liftCanvas" width="1080" height="720" aria-label="有躯干、双侧羽肢和尾部的三维函数生物，可拖动旋转"></canvas><span class="scene-hint">拖动旋转 · 滚轮缩放 · 相机只观察三维对象</span></div>
      <div class="exp-projections"><figure><canvas id="liftSide" width="600" height="240" aria-label="同一三维对象的正面投影"></canvas><figcaption>正面轮廓 · X / Y</figcaption></figure><figure><canvas id="liftTop" width="600" height="240" aria-label="同一三维对象的厚度投影"></canvas><figcaption>侧向厚度 · X / Z</figcaption></figure></div>
    </div>
    <aside>
      <div class="controls"><button id="liftPlay">播放小样</button><button id="liftReset">回到起点</button><button id="liftView">复位视角</button><button id="liftExport">保存三维谱</button></div>
      <label for="liftSpeed">观察速度</label><select id="liftSpeed"><option value="0.25">¼ 速</option><option value="0.5" selected>½ 速</option><option value="1">原速</option></select>
      <label for="liftTime">共同时间 · 原式 t</label><input id="liftTime" type="range" min="0" max="480" value="0"><div class="meta"><span id="liftClock">t = 0.000</span><span id="liftState">暂停</span></div>
      <div class="controls"><button id="liftSpine" aria-pressed="true">显示中轴</button><button id="liftSections" aria-pressed="false">结构线</button><button id="liftSurface" aria-pressed="true">显示实体</button><button id="liftLight" aria-pressed="true">冷暖光</button></div>
      <label for="liftThickness">附肢厚度 <output id="liftThicknessValue">0.50</output></label><input id="liftThickness" type="range" min="0" max="100" value="50">
      <label for="liftDepth">躯干立体深度 <output id="liftDepthValue">0.50</output></label><input id="liftDepth" type="range" min="0" max="100" value="50">
      <label for="liftMotion">全身联动幅度 <output id="liftMotionValue">1.00</output></label><input id="liftMotion" type="range" min="0" max="100" value="100">
      <div class="score-route"><span>原式参数场</span><b>→</b><span>弯曲躯轴</span><b>→</b><span>躯干 / 侧肢 / 尾部</span><b>→</b><span>共同时间</span></div>
      <p class="quiet" id="liftBoundary">原式决定发生位置、谐波分叶和时间关系；躯干截面、附肢厚度与区域分工是本次三维解释。去掉整体转圈后，内部波动每 2π 重复；全源时钟仍保留 16π。</p>
      <details><summary>二维关系怎样升成三维</summary><pre id="liftFormula"></pre><p class="quiet">01–03 继续保留原二维运行。04/05 原程序仍保留在本工作台源码和历史版本中；这里只对这两项做三维升档。</p></details>
    </aside>
  </div>
</section>
