<!doctype html><html><head><meta charset="utf-8"><title>R045.08 fixed-view audit</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#e7e4d8;color:#17231f;font:13px system-ui,sans-serif}header{height:72px;padding:14px 22px;background:#163a32;color:#f1f1df}header b{letter-spacing:.12em;font-size:11px}header h1{font:500 22px Georgia,serif;margin:4px 0}.grid{display:grid;grid-template-columns:1.75fr 1fr;gap:10px;height:calc(100% - 72px);padding:10px}.card{position:relative;border:1px solid #53685e;background:#cdd8ce;overflow:hidden}.card canvas{width:100%;height:100%;display:block}.label{position:absolute;left:12px;top:10px;padding:7px 9px;background:#f7f4e7dc;border:1px solid #64756c;font-size:11px;z-index:2}.legend{position:absolute;right:10px;bottom:10px;padding:8px 10px;background:#102f29dd;color:#f6f4e9;font-size:10px;line-height:1.45;z-index:2}.status{color:#d8e8c7}</style></head><body><header><b>FARMLAND MOTHER · R045.08</b><h1>Fixed-view audit · bounded foothill phase + varied bench/riser family</h1></header><div class="grid"><section class="card"><div class="label">A · full chain: ridge → slope → foothill → plain → receiver</div><canvas id="macro"></canvas><div class="legend"><span class="status" id="macroStatus">rendering…</span></div></section><section class="card"><div class="label">B · terrace-family close audit</div><canvas id="pilot"></canvas><div class="legend" id="pilotStatus">rendering…</div></section></div><script type="module">
import * as K from './r045_round08_kernel.mjs';
const dpr=1;const SAT=x=>Math.max(0,Math.min(1,x));
function setup(c){const r=c.getBoundingClientRect();c.width=Math.max(1,Math.round(r.width*dpr));c.height=Math.max(1,Math.round(r.height*dpr));return c.getContext('2d')}
const norm=v=>{const L=Math.hypot(...v)||1;return v.map(x=>x/L)},sub=(a,b)=>a.map((v,i)=>v-b[i]),dot=(a,b)=>a.reduce((s,v,i)=>s+v*b[i],0),cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
function cam(pos,target,f){const fw=norm(sub(target,pos)),rt=norm(cross(fw,[0,1,0])),up=norm(cross(rt,fw));return{pos,fw,rt,up,f}}
function project(P,C,w,h){const v=sub(P,C.pos),d=dot(v,C.fw);if(d<1)return null;return[w/2+dot(v,C.rt)*C.f/d,h/2-dot(v,C.up)*C.f/d,d]}
function terrainColor(h,s,pilot=false,riser=false){let H=92-SAT((h-1)/75)*32,Sa=34+SAT(s/.5)*12,L=33+SAT((h+4)/95)*27;if(pilot){H=75;Sa=37;L+=5}if(riser){H=61;Sa=30;L-=9}return`hsl(${H} ${Sa}% ${L}%)`}
function renderTerrain(canvas,heightFn,camera,box,step,opt={}){const g=setup(canvas),W=canvas.width,H=canvas.height;g.fillStyle=opt.sky||'#c6d6d7';g.fillRect(0,0,W,H);const cells=[];for(let z=box.z0;z<box.z1;z+=step)for(let x=box.x0;x<box.x1;x+=step){const pts=[[x,heightFn(x,z),z],[x+step,heightFn(x+step,z),z],[x+step,heightFn(x+step,z+step),z+step],[x,heightFn(x,z+step),z+step]],pp=pts.map(p=>project(p,camera,W,H));if(pp.some(p=>!p))continue;const dep=pp.reduce((s,p)=>s+p[2],0)/4,hv=pts.reduce((s,p)=>s+p[1],0)/4,sl=K.slope(x+step/2,z+step/2),px=x+step/2,pz=z+step/2;cells.push({pp,dep,hv,sl,px,pz})}cells.sort((a,b)=>b.dep-a.dep);for(const q of cells){const pil=opt.pilot&&K.pilotInfluence(q.px,q.pz)>.05,ris=opt.pilot&&K.pilotRiserInfluence(q.px,q.pz)>.15;g.beginPath();g.moveTo(q.pp[0][0],q.pp[0][1]);for(let i=1;i<4;i++)g.lineTo(q.pp[i][0],q.pp[i][1]);g.closePath();g.fillStyle=terrainColor(q.hv,q.sl,pil,ris);g.fill();g.strokeStyle='rgba(31,55,44,.10)';g.lineWidth=.45;g.stroke()}return{g,W,H}}
function drawPath(ctx,canvas,camera,path,color,width=1.5,yOff=.15,heightFn=K.height){if(!path||path.length<2)return;ctx.beginPath();let begun=false;for(const [x,z] of path){const p=project([x,heightFn(x,z)+yOff,z],camera,canvas.width,canvas.height);if(!p)continue;if(!begun){ctx.moveTo(p[0],p[1]);begun=true}else ctx.lineTo(p[0],p[1])}if(begun){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.stroke()}}
const receiver=[];for(let x=-230;x<=230;x+=5)receiver.push([x,K.riverZ(x)]);
const macro=document.getElementById('macro'),mc=cam([300,155,350],[0,16,-58],780),A=renderTerrain(macro,K.height,mc,{x0:-235,x1:235,z0:-315,z1:205},7.0);for(const s of K.naturalStreams)drawPath(A.g,macro,mc,s.p,'rgba(42,96,111,.72)',s.o===2?2.0:1.2,.28);drawPath(A.g,macro,mc,receiver,'rgba(34,86,111,.96)',4.6,.34);for(const l of K.terracePilot.lines)drawPath(A.g,macro,mc,l.points,'rgba(235,210,118,.95)',1.8,.32);document.getElementById('macroStatus').textContent=`receiver river explicitly framed · ${K.terracePilot.lines.length} terrace-family traces · production generator remains locked`;
const seed=K.terracePilot.seed,pilot=document.getElementById('pilot'),pc=cam([seed.x+70,K.height(seed.x,seed.z)+40,seed.z+72],[seed.x,K.height(seed.x,seed.z),seed.z],700),B=renderTerrain(pilot,K.terracedPilotHeight,pc,{x0:Math.max(-215,seed.x-82),x1:Math.min(215,seed.x+82),z0:Math.max(-158,seed.z-74),z1:Math.min(10,seed.z+70)},2.0,{pilot:true,sky:'#ccd8d2'});for(const s of K.naturalStreams)drawPath(B.g,pilot,pc,s.p,'rgba(43,96,111,.68)',1.4,.18,K.terracedPilotHeight);for(const l of K.terracePilot.lines){drawPath(B.g,pilot,pc,l.points,'rgba(243,222,129,.98)',2.5,.22,K.terracedPilotHeight)}document.getElementById('pilotStatus').innerHTML=`preview-only · synthetic full-width range ${K.terracePilot.widthRange[0].toFixed(1)}–${K.terracePilot.widthRange[1].toFixed(1)} m<br>seed permission ${K.terracePilot.seed.permission.toFixed(3)} · drainage clearance ${K.terracePilot.seed.drainageDistance.toFixed(1)} m<br>varied bench/riser morphology probe · not local survey truth · no parcels/water state implied`;
document.documentElement.dataset.ready='true';window.__R045_AUDIT__={version:K.VERSION,ready:true,seed:K.terracePilot.seed,lines:K.terracePilot.lines.map(x=>({id:x.id,n:x.points.length,length:x.length,width:x.fullWidth}))};
</script></body></html>
