12?'#6b91a0':'rgba(100,140,90,.22)';g.fillRect(x,y,820/S.nx+1,150/S.nz+1)}for(const q of D.exactChanges){const x=30+(q.x-S.x0)/(S.x1-S.x0)*820,y=15+(q.z-S.z0)/(S.z1-S.z0)*150;g.fillStyle='#df7023';g.beginPath();g.arc(x,y,2.0,0,6.4);g.fill();if(q.projected){g.strokeStyle='#a62424';g.beginPath();g.arc(x,y,3.8,0,6.4);g.stroke()}}const s=document.querySelector('#s'),h=s.getContext('2d');s.width=430;s.height=190;h.fillStyle='#eef0e8';h.fillRect(0,0,430,190);h.fillStyle='#17372f';h.font='13px system-ui';const z=D.state,ls=['query changes '+z.changedQueries+'/'+z.sampleCount,'node changes '+z.nodeChanged,'riser mean '+(z.riserMean*1000).toFixed(2)+' mm','bench mean '+(z.benchMean*1000).toFixed(3)+' mm','concentration '+z.concentration.toFixed(1)+'x','max micro '+(z.maxChange*1000).toFixed(1)+' mm','max 3m '+z.maxInc.toFixed(4)+' m','visualAcceptance=false'];ls.forEach((t,i)=>h.fillText(t,15,20+i*21));document.documentElement.setAttribute('data-ready',D.state.qaPassed?'true':'qa-failed');</script>
