le='#a62424';g.beginPath();g.arc(x,y,4.8,0,6.4);g.stroke()}}const s=document.querySelector('#s'),h=s.getContext('2d');s.width=430;s.height=190;h.fillStyle='#eef0e8';h.fillRect(0,0,430,190);h.fillStyle='#17372f';h.font='13px system-ui';const z=D.state,ls=['changed '+z.exactChanged+'/'+z.candidates,'median added '+(z.medianAdded*1000).toFixed(1)+' mm','p75 added '+(z.p75Added*1000).toFixed(1)+' mm','contrast '+z.contrastRatio.toFixed(2)+'x','long runs '+z.longRuns,'max 3m '+z.maxInc.toFixed(4)+' m','visualAcceptance=false'];ls.forEach((t,i)=>h.fillText(t,15,24+i*23));document.documentElement.setAttribute('data-ready',D.state.qaPassed?'true':'qa-failed');</script>
