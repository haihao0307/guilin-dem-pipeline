<!doctype html><meta charset="utf-8"><title>R045.89 audit</title><style>body{margin:0;font:13px system-ui;background:#d9ded8;color:#17372f}header{padding:10px 16px;background:#17372f;color:white}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px}.panel{background:white;border:1px solid #748078;padding:6px}canvas{width:100%;height:340px}.bottom{display:grid;grid-template-columns:2fr 1fr;gap:8px;padding:0 8px 8px}.bottom canvas{height:190px}</style><header><b>FARMLAND MOTHER R045.89</b> — accepted R045.88 vs spatially coherent riser run · common hillshade diagnostic</header><div class="grid"><div class="panel">A · R045.88 accepted<canvas id="a"></canvas></div><div class="panel">B · R045.89 candidate<canvas id="b"></canvas></div></div><div class="bottom"><div class="panel">plan audit · orange = coherence change · magenta = authority node · blue-grey = drainage core<canvas id="p"></canvas></div><div class="panel">QA summary<canvas id="s"></canvas></div></div><script type="module">import{AUDIT as D}from'./r045_round89_audit_cache.mjs';function terrain(id,H){const c=document.querySelector(id),g=c.getContext('2d');c.width=650;c.height=340;g.fillStyle='#cad7d3';g.fillRect(0,0,c.width,c.height);const mn=D.terrain.sharedMin,mx=D.terrain.sharedMax,nz=H.length-1,nx=H[0].length-1;for(let j=0;j<nz;j++)for(let i=0;i<nx;i++){const v=(H[j][i]-mn)/(mx-mn||1),il=Math.max(0,i-1),ir=Math.min(nx,i+1),ju=Math.max(0,j-1),jd=Math.min(nz,j+1),gx=.5*(H[j][ir]-H[j][il]),gz=.5*(H[jd][i]-H[ju][i]),gm=Math.hypot(gx,gz),lit=Math.max(-13,Math.min(13,-4*gx+5.2*gz)),edge=Math.min(10,3.4*gm),x=i*c.width/nx,y=j*c.height/nz,L=45+v*20+lit-edge;g.fillStyle='hsl('+(108-v*50)+' 30% '+Math.max(16,Math.min(80,L))+'%)';g.fillRect(x,y,c.width/nx+1,c.height/nz+1)}}terrain('#a',D.terrain.before);terrain('#b',D.terrain.after);const p=document.querySelector('#p'),g=p.getContext('2d');p.width=900;p.height=190;g.fillStyle='#eef0e8';g.fillRect(0,0,p.width,p.height);const S=D.planSpec;for(const q of D.plan){const x=30+q.i*(820/S.nx),y=15+q.j*(150/S.nz);g.fillStyle=q.dd<=12?'#6b91a0':'rgba(100,140,90,.22)';g.fillRect(x,y,820/S.nx+1,150/S.nz+1)}for(const q of D.exactChanges){const x=30+(q.x-S.x0)/(S.x1-S.x0)*820,y=15+(q.z-S.z0)/(S.z1-S.z0)*150;g.fillStyle='#df7023';g.beginPath();g.arc(x,y,1.8,0,6.4);g.fill()}for(const q of D.nodeChanges){const x=30+q.i*(820/S.nx),y=15+q.j*(150/S.nz);g.strokeStyle='#9c2aa0';g.beginPath();g.arc(x,y,3.1,0,6.4);g.stroke()}const s=document.querySelector('#s'),h=s.getContext('2d');s.width=430;s.height=190;h.fillStyle='#eef0e8';h.fillRect(0,0,430,190);h.fillStyle='#17372f';h.font='13px system-ui';const z=D.state,ls=['supported queries '+z.supportedQueries+'/'+z.sampleCount,'physical coherence changes '+z.changedQueries,'authority nodes '+z.nodeChanged,'families '+z.groups.join(',')+' · halves '+z.halves.join(','),'support residual '+(z.residualBefore*1000).toFixed(1)+'→'+(z.residualAfter*1000).toFixed(1)+' mm','residual improvement '+(z.residualImprovement*1000).toFixed(1)+' mm','max new delta '+(z.maxChange*1000).toFixed(2)+' mm','global 3m '+z.maxBeforeInc.toFixed(4)+'→'+z.maxAfterInc.toFixed(4)+' m','visual acceptance remains false'];ls.forEach((t,i)=>h.fillText(t,15,17+i*18));document.documentElement.setAttribute('data-ready',D.state.qaPassed?'true':'qa-failed');</script>
