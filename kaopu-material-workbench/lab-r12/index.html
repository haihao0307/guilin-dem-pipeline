<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KAOPU 石头材质工作台 · R12</title><link rel="stylesheet" href="lab-r12/ui.css"><link rel="icon" href="data:,"></head><body><main>
<header><div><small>KAOPU / MATERIAL STUDIO / R12</small><h1>石头材质工作台</h1></div><nav><button data-go="wet">01 Wet Stone</button><button data-go="iq">02 IQ 岩石</button><button data-go="home" class="ghostHome">总台</button></nav></header>
<div id="error" role="alert" hidden></div><div class="catalog" id="catalog"><button class="case" data-go="wet"><canvas id="thumb-wet" width="384" height="216"></canvas><span><b>01 Wet Stone</b></span></button><button class="case" data-go="iq"><canvas id="thumb-iq" width="384" height="216"></canvas><span><b>02 IQ 岩石</b></span></button></div>
<section id="workspace" hidden><div class="titleRow"><div><h2 id="objectTitle"></h2><p id="objectHint"></p></div><span id="stateLabel" class="badge"></span></div>
<div class="toolbar"><button id="resetAll" class="gold">恢复本石头原版</button><button id="compare">显示原版对照</button><button id="focus">只看作品</button><button id="restoreWindows">恢复窗口</button><button id="rotate">自动旋转</button><button id="cameraReset">恢复镜头</button><span class="spacer"></span><label>观察 <select id="channel"><option value="0">完整材质</option></select></label><button id="export">保存参数谱</button><button id="import">载入参数谱</button></div>
<div id="stage" class="stage single"><section class="pane" id="referencePane" hidden><div class="paneHead"><b>对照</b><div><button data-pane="ref" data-act="out">−</button><output id="refZoom">100%</output><button data-pane="ref" data-act="in">＋</button><button data-pane="ref" data-act="reset">复位</button><button data-pane="ref" data-act="focus">独看</button><button data-pane="ref" data-act="close">关闭 ×</button></div></div><div class="viewport" id="referenceView"><canvas id="referenceCanvas" width="960" height="540"></canvas></div></section>
<section class="pane" id="resultPane"><div class="paneHead"><b id="resultTitle">石头</b><div><button data-pane="result" data-act="out">−</button><output id="resultZoom">100%</output><button data-pane="result" data-act="in">＋</button><button data-pane="result" data-act="reset">复位</button><button data-pane="result" data-act="focus">独看</button><button data-pane="result" data-act="close">关闭 ×</button></div></div><div class="viewport" id="resultView"><canvas id="resultCanvas" width="960" height="540"></canvas><span class="stamp" id="renderLabel">LIVE 3D</span></div></section></div>
<div id="closed" hidden></div><p class="hint">拖动旋转 · 滚轮 / 双指缩放 · Shift＋拖动平移</p>
<section class="panel"><div class="sectionHead"><h3>颜色与表面</h3><div id="lookButtons"><button id="iqOriginal">白灰云母</button><button id="darkLook">蓝灰斑纹</button></div></div><div id="palettes" class="palettes"></div><div id="wetEffects" class="row"></div><div id="wetControls" class="controls"></div><div id="iqBase" class="controls"></div><div class="row legacyGallery"><button id="galleryButton">十色总览</button></div><div id="gallery" class="gallery" hidden></div></section>
<section class="panel" id="shapePanel"><div class="sectionHead"><h3>形状</h3><button id="resetShape">恢复原始形状</button></div><div id="seedButtons" class="row"></div><div id="shapeControls" class="controls"></div></section>
<section class="panel" id="layersPanel"><div class="sectionHead"><h3>斑纹层</h3></div><div id="layers" class="layers"></div></section>
<details class="panel" id="rigPanel" open><summary>灯光</summary><div class="row"><label><input id="sharedRig" type="checkbox">启用双灯</label><button id="rigReset">恢复统一双灯</button><button id="warmCool">暖主光 · 冷次光</button></div><p class="muted"></p><div id="rigControls" class="controls"></div></details>
<details class="panel" id="teacherPanel"><summary>老师</summary><div class="row"><button id="loadTeacher">载入</button><button id="closeTeacher">关闭</button><span id="mediaInfo" class="muted"></span></div><div id="mediaHolder" hidden><video id="teacherVideo" playsinline controls hidden></video><img id="teacherImage" alt="老师原图" hidden></div></details>
<details class="panel" id="functions"><summary>函数</summary><pre id="relation"></pre><details><summary>源码</summary><pre id="source"></pre></details></details></section>
<footer><span id="status">启动中…</span></footer><input id="scoreFile" type="file" accept=".json" hidden><input id="teacherFile" type="file" accept="image/*,video/*" hidden></main><script src="lab-r12/app.js"></script></body></html>
