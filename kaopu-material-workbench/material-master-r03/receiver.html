<!doctype html><html lang="zh-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>木材与实体玻璃 · 香港PBR材质大师</title><link rel="stylesheet" href="style.css"></head><body><main><section class="stage"><div id="viewport"><canvas id="canvas" aria-label="可旋转的木材或玻璃对照"></canvas><div class="compare"><span>01 <b>原预设 / 基准</b><small>固定参数</small></span><span>02 <b>研究状态</b><small>实时参数</small></span></div><div id="error" hidden></div></div><div class="viewbar"><span>拖动旋转 · 滚轮缩放</span><div><button data-view="front" class="active">整体</button><button data-view="angle">侧看</button><button data-view="close">近看</button><button id="resetView">复位视角</button></div></div><div class="legend"><span>统一摄影棚光照</span><span id="dimensions">米制真实构件</span><span>无照片贴图</span></div></section><aside><div class="sectionlabel">MATERIAL RECEIVER <span id="status">正在准备</span></div><h2 id="familyTitle" style="margin-top:24px">木材</h2><p class="detail" id="familyDetail"></p><div id="controls"><label id="wearLabel">表面使用痕迹 <output id="wearOut">0.55</output><input id="wear" type="range" min="0" max="1" step=".01" value=".55"></label><label>研究响应强度 <output id="strengthOut">1.00</output><input id="strength" type="range" min="0" max="1" step=".01" value="1"></label><label id="thicknessLabel" hidden>右侧玻璃厚度 / mm <output id="thicknessOut">14</output><input id="thickness" type="range" min="4" max="60" step="1" value="14"></label></div><button id="reset" class="reset">重置研究参数 <span>↺</span></button><div class="note"><b>模型边界</b><p id="limits"></p><p>同一原母体来源不等于本接收器已完成艺术验收。这里是可审查的独立研究案例。</p></div></aside></main><script type="module" src="receiver.mjs"></script></body></html>
