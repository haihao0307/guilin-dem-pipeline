function inspectObj(text){
  if(typeof text!=='string'||text.length>32*1024*1024)throw new Error('OBJ 必须是 32 MiB 以内的文本文件');
  const positions=[];let uv=0,normals=0,faces=0,triangles=0;const issues=[];let lineNumber=0;
  const min=[Infinity,Infinity,Infinity],max=[-Infinity,-Infinity,-Infinity];
  for(const raw of text.split(/\r?\n/)){
    lineNumber++;const line=raw.trim();if(!line||line.startsWith('#'))continue;const fields=line.split(/\s+/),kind=fields.shift();
    if(kind==='v'){
      if(fields.length<3||!fields.slice(0,3).every(x=>Number.isFinite(Number(x))))throw new Error(`第 ${lineNumber} 行顶点无效`);
      if(fields.length===4&&Number(fields[3])!==1)throw new Error(`第 ${lineNumber} 行使用非单位齐次坐标，当前检查器不支持`);
      const v=fields.slice(0,3).map(Number);positions.push(v);for(let i=0;i<3;i++){min[i]=Math.min(min[i],v[i]);max[i]=Math.max(max[i],v[i]);}
    }else if(kind==='vt'){
      if(fields.length<2||!fields.slice(0,2).every(x=>Number.isFinite(Number(x))))throw new Error(`第 ${lineNumber} 行 UV 无效`);uv++;
    }else if(kind==='vn'){
      if(fields.length<3||!fields.slice(0,3).every(x=>Number.isFinite(Number(x))))throw new Error(`第 ${lineNumber} 行法线无效`);normals++;
    }else if(kind==='f'){
      if(fields.length<3)throw new Error(`第 ${lineNumber} 行面少于三个顶点`);
      const seen=[];
      for(const token of fields){
        const parts=token.split('/');if(parts.length>3)throw new Error(`第 ${lineNumber} 行面索引无效`);
        for(let i=0;i<parts.length;i++){
          if(parts[i]===''&&i>0)continue;
          if(!/^-?\d+$/.test(parts[i]))throw new Error(`第 ${lineNumber} 行面索引不是整数`);
          const idx=Number(parts[i]),count=[positions.length,uv,normals][i];
          if(idx===0||idx>count||idx < -count)throw new Error(`第 ${lineNumber} 行索引越界`);
          if(i===0)seen.push(idx>0?idx-1:count+idx);
        }
      }
      if(new Set(seen).size<3)issues.push(`第 ${lineNumber} 行退化面`);
      faces++;triangles+=fields.length-2;
    }else if(kind==='mtllib')issues.push('OBJ 引用了外部 MTL；本检查器不加载外部文件');
  }
  if(!positions.length||!faces)throw new Error('没有可检查的顶点与面；这不是有效的网格输出');
  return {schema:'kaopu/obj-inspection@1',vertices:positions.length,uvCoordinates:uv,normals,faces,trianglesAfterFan:triangles,bounds:{min,max,extent:max.map((x,i)=>x-min[i]),units:'source_unspecified'},issues:[...new Set(issues)].slice(0,50),checks:{finiteCoordinates:true,faceIndices:true},notChecked:['曲面拓扑一致性','UV 贴图内容','毛根和表面绑定','骨骼与动作','生物身份或视觉真实性']};
}

function validateObservation(record){
  if(!record||record.schema!=='kaopu/manual-animal-observation@1')throw new Error('不是本模块的人工观察记录');
  if(record.origin!=='manual_annotation')throw new Error('观察来源必须明确为 manual_annotation');
  if(!record.image||!Number.isInteger(record.image.width)||!Number.isInteger(record.image.height)||record.image.width<1||record.image.height<1)throw new Error('缺少有效图片尺寸');
  if(!Array.isArray(record.points)||record.points.length>200)throw new Error('点位必须是最多 200 项的数组');
  const names=new Set();
  for(const p of record.points){
    if(typeof p.label!=='string'||!p.label.trim()||p.label.length>60)throw new Error('每个点必须有 1–60 字的名称');
    if(names.has(p.label))throw new Error('点位名称不可重复');names.add(p.label);
    if(!Number.isFinite(p.x)||!Number.isFinite(p.y)||p.x<0||p.y<0||p.x>record.image.width||p.y>record.image.height)throw new Error('点位超出图片边界');
    if(p.visibility!=='visible')throw new Error('本工具只记录真实可见点，不补猜遮挡点');
  }
  return record;
}

function saveText(name,text,type='application/json'){
  const url=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
}

function homeMarkup(){return `<div class="hero"><div><div class="kicker">ANIMAL METHODS / LEARNING</div><h1>从图像中，留下可信的动物信息</h1><p class="lede">先分清我们看到了什么，再决定能重建什么。三位观察与重建老师、一条视频动作实验、五层观察证据，集中在这个独立的方法学习区。</p></div><div><span class="status">研究模块 · 未接入模型推理</span><p class="stamp">来源核查 ${ESC(TEACHERS_DATA.verifiedAtUtc)}</p></div></div><div class="notice">本页可做<strong>本地视频动作观察与三维骨架对齐</strong>、<strong>人工点位记录</strong>及<strong>OBJ 数值检查</strong>。没有安装三项原模型，也没有将示意图作为重建结果。</div><div class="section-title"><h2>三位老师，三种不同任务</h2><span class="muted small">点击卡片逐项检查，浏览器后退回到这里</span></div><div class="teacher-grid">${TEACHERS_DATA.teachers.map(t=>`<article class="teacher"><div class="teacher-visual">${methodGraphic(t.id)}<span class="visual-label">自绘方法示意 · 非模型输出</span></div><div class="teacher-copy"><div class="teacher-name">${ESC(t.name)}</div><h3>${ESC(t.title)}</h3><span class="tag">${ESC(t.category)}</span><p>${ESC(t.input)} → ${ESC(t.output)}</p><button class="open" data-open="${ESC(t.id)}">检查方法与输出 <span>→</span></button></div></article>`).join('')}</div>${motionSection()}<div class="section-title"><h2>观察分成五层</h2><span class="muted small">承接既有 AMADEUS / CoTracker / DeepLabCut / idtracker / DINO 方法卡</span></div><div class="layers">${TEACHERS_DATA.observationLayers.map(l=>`<article class="layer"><b>${ESC(l.label)}</b><p>${ESC(l.meaning)}</p><p>${l.methods.map(ESC).join(' / ')}</p><p class="not">不能据此证明：${ESC(l.notEvidenceFor)}</p></article>`).join('')}</div><div class="section-title"><h2>现在能做的检查</h2><span class="muted small">全部在当前浏览器本地处理，不上传素材</span></div><div class="tools"><article class="tool"><h3>图片 → 人工观察记录</h3><p>打开自己的图片，只标真实可见部位。导出像素坐标、图像身份与不确定性备注，供以后核验模型。</p><button data-open="annotate">打开点位记录</button></article><article class="tool"><h3>OBJ → 几何数值检查</h3><p>检查离线重建导出的顶点、面、UV 与包围盒。不把文件可解析当作形体、毛发或动作已通过。</p><button data-open="obj">打开文件检查</button></article></div><div class="footer">这里是独立的方法学习入口。原 Animal Atlas 19 个动物的完整离线工作台没有在这里上线；方法卡不构成模型推理、生产集成或视觉验收。</div>`;}

function overviewMarkup(){return `<div class="detail-head"><button data-open="home" class="return">← 返回学习总览</button></div><div class="tool-intro"><div class="kicker">PRESERVED / WORKBENCH ENTRIES</div><h1>既有动物、人物与服装入口</h1><p class="lede">沿用同一份动物工作总览的入口，不替换旧网址，不把研究卡变成新的模型版本。</p></div><div class="notice">入口来源：${ESC(TEACHERS_DATA.existingOverview.sourceTitle)}，记录更新于 2026-10-04。下面的质量状态<strong>尚未在本轮重新验收</strong>；离线条目不编造网页按钮。</div><div class="teacher-grid">${TEACHERS_DATA.existingOverview.entries.map(e=>`<article class="tool"><div class="kicker">${ESC(e.group)}</div><h3>${ESC(e.name)}</h3><p>${ESC(e.note)}</p>${e.url?`<a href="${ESC(e.url)}" target="_self" rel="noopener noreferrer">打开原工作台 ↗</a>`:'<span class="tag">暂无核实网页入口</span>'}</article>`).join('')}</div>`;}
function toolMarkup(kind){
 const head=`<div class="detail-head"><button data-open="home" class="return">← 返回学习总览</button></div>`;
 if(kind==='obj')return head+`<div class="tool-intro"><div class="kicker">LOCAL / FILE INSPECTION</div><h1>检查真实 OBJ 文件</h1><p class="lede">只计算你导入文件的数据。不生成、不修复网格，不会去加载 MTL 或纹理。</p></div><section class="pane"><label class="field"><span>选择已有重建结果（文本 OBJ，最大 32 MiB）</span><input type="file" id="obj-file" accept=".obj,text/plain"></label><p class="safe">本地处理，无上传、网络请求或持久保存</p><p class="note-status" id="obj-status" role="status">尚未导入文件</p><div id="obj-metrics"></div><pre id="obj-result" class="result" hidden></pre><button id="obj-export" disabled>下载检查记录</button><div class="note">解析与索引通过，只说明数值结构可读。还需要核查统一拓扑、纹理、毛根映射、骨架、视角和形体真实性。</div></section>`;
 return `<div class="annotation-intro"><div><h1>从可见像素开始记</h1><p class="lede">命名真实可见部位，再点击图片标点。人工标注，不是模型识别，也不补猜遮挡点。</p></div><button data-open="home" class="return">← 学习总览</button></div><div class="annotation-workspace"><section class="pane annotation-viewer" aria-label="本地图片与可见点位"><div class="image-viewport"><div class="image-empty">在观察记录中选择本地图片<br>图片会留在这里，观察记录可独立滚动</div><div class="image-stage" id="image-stage" hidden><img id="observation-image" alt="待人工观察的本地动物图片"><svg id="point-overlay" aria-label="点击记录可见身体部位" role="img"></svg></div></div><p id="image-status" class="note-status" role="status">尚未选择图片</p></section><details class="pane annotation-controls" open><summary><span>观察记录</span><span class="summary-hint"><span class="summary-close">收起 ↓</span><span class="summary-open">展开 ↑</span></span></summary><div class="controls-scroll"><label class="field image-input"><span>本地图片 · 最大 20 MiB</span><input type="file" id="image-file" accept="image/png,image/jpeg,image/webp" aria-label="选择 PNG、JPEG 或 WebP 图片，最大 20 MiB"></label><p class="safe">PNG / JPEG / WebP · 不上传、不自动保存</p><label class="field"><span>下一个可见部位的名称</span><input id="point-label" maxlength="60" placeholder="例如：左前蹄接地点"></label><p class="small muted">记录最多 200 点；坐标以原图像素计。只标能确定看见的点，左右按动物自身命名。</p><label class="field"><span>不能确认的地方 / 观察条件</span><textarea id="observation-note" maxlength="3000" placeholder="例如：右后足被遮挡，不记录；图像没有尺度标尺"></textarea></label><ul class="points-list" id="points-list"></ul><div class="note">不会据此给出物种、个体身份、身体尺度或三维。照片本体不放入导出的记录。</div><div class="actions"><button id="point-undo" disabled>撤销最后一点</button><button id="observation-export" disabled>导出观察 JSON</button></div></div></details></div>`;
}

function mountLearning(element,{embedded=false,onClose=null}={}){
 if(!element||typeof element.attachShadow!=='function')throw new Error('需要可挂载的页面元素');
 const shadow=element.shadowRoot||element.attachShadow({mode:'open'});
 let motionController=null;
 let route='home',objectUrl=null,imageInfo=null,points=[],note='',inspection=null,loadToken=0;
 const allowed=new Set(['home','overview','annotate','obj',...TEACHERS_DATA.teachers.map(t=>t.id),...(TEACHERS_DATA.motionWorkflows||[]).map(w=>w.id)]);
 const fromHash=()=>{const h=location.hash.match(/^#animal-learning(?:\/([^/?#]+))?$/);return h&&allowed.has(h[1]||'home')?(h[1]||'home'):null;};
 const rootTop=()=>{element.scrollTop=0;shadow.querySelector('.shell')?.scrollIntoView({block:'start'});};
 const navigate=(target,{history=true}={})=>{if(!allowed.has(target))return;loadToken++;route=target;if(history){historyPush(target);}render();rootTop();};
 const historyPush=target=>{const current=window.history.state||{}, prior=fromHash()?current.atlasLearning:null;window.history.pushState({...current,atlasLearning:{depth:(prior?.depth||0)+1,returnUrl:prior?.returnUrl||(location.pathname+location.search+(fromHash()?'':location.hash))}},'',`#animal-learning${target==='home'?'':'/'+target}`);};
 function releaseImage(){loadToken++;if(objectUrl)URL.revokeObjectURL(objectUrl);objectUrl=null;imageInfo=null;points=[];note='';}
 function render(){
  motionController?.destroy();motionController=null;
  const teacher=TEACHERS_DATA.teachers.find(t=>t.id===route);
  const workflow=(TEACHERS_DATA.motionWorkflows||[]).find(w=>w.id===route);
  shadow.innerHTML=`<style>${css}</style><div class="shell" data-route="${route}"><nav class="top" aria-label="动物学习导航"><div class="brand">动物学习<span class="small">方法与观察 / R02</span></div><div class="top-actions"><a class="overview-return" href="../kaopu-human-overview/" target="_self">← 返回总工作台</a><button data-open="home">学习总览</button><button data-open="overview">既有入口</button>${embedded?'<button id="close-learning">返回动物工作台 ×</button>':''}</div></nav><main>${route==='home'?homeMarkup():route==='overview'?overviewMarkup():teacher?teacherMarkup(teacher):workflow?videoMotionMarkup()+'<details class="pane"><summary>展开原方法来源与研究边界</summary>'+workflowMarkup(workflow)+'</details>':toolMarkup(route)}</main></div>`;
  shadow.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',()=>navigate(b.dataset.open)));
  shadow.querySelectorAll('[data-download-teacher]').forEach(b=>b.addEventListener('click',()=>{const t=TEACHERS_DATA.teachers.find(x=>x.id===b.dataset.downloadTeacher);saveText(t.id+'-method.json',JSON.stringify({schema:TEACHERS_DATA.schema,verifiedAtUtc:TEACHERS_DATA.verifiedAtUtc,status:TEACHERS_DATA.status,teacher:t},null,2));}));
  shadow.querySelectorAll('[data-download-workflow]').forEach(b=>b.addEventListener('click',()=>{const w=(TEACHERS_DATA.motionWorkflows||[]).find(x=>x.id===b.dataset.downloadWorkflow);saveText(w.id+'-method.json',JSON.stringify({schema:'kaopu/video-motion-method@1',verifiedAtUtc:TEACHERS_DATA.verifiedAtUtc,workflow:w},null,2));}));
  shadow.querySelector('#close-learning')?.addEventListener('click',()=>onClose?.());
  if(workflow)motionController=mountVideoMotion(shadow);
  if(route==='obj')bindObj();if(route==='annotate')bindAnnotation();
 }
 function bindObj(){
  const input=shadow.querySelector('#obj-file'),status=shadow.querySelector('#obj-status'),result=shadow.querySelector('#obj-result'),metrics=shadow.querySelector('#obj-metrics'),exp=shadow.querySelector('#obj-export');
  const show=()=>{if(!inspection)return;result.hidden=false;result.textContent=JSON.stringify(inspection,null,2);metrics.innerHTML=`<div class="metrics"><div><strong>${inspection.vertices.toLocaleString()}</strong><small>顶点</small></div><div><strong>${inspection.faces.toLocaleString()}</strong><small>面</small></div><div><strong>${inspection.uvCoordinates.toLocaleString()}</strong><small>UV 坐标</small></div></div>`;status.textContent='数值读取与面索引检查通过；下方列出未检查项';exp.disabled=false;};show();
  input.addEventListener('change',async()=>{const file=input.files?.[0];if(!file)return;const token=++loadToken;inspection=null;exp.disabled=true;metrics.textContent='';result.hidden=true;status.textContent='正在本地检查…';status.classList.remove('error');try{if(!/\.obj$/i.test(file.name)||file.size>32*1024*1024)throw new Error('请选择最大 32 MiB 的 .obj 文本文件');const data=await file.text();if(token!==loadToken||route!=='obj')return;inspection={...inspectObj(data),filename:file.name,checkedAtUtc:new Date().toISOString()};show();}catch(e){if(token!==loadToken)return;status.textContent=e.message;status.classList.add('error');}});
  exp.addEventListener('click',()=>inspection&&saveText('animal-obj-inspection.json',JSON.stringify(inspection,null,2)));
 }
 function bindAnnotation(){
  const input=shadow.querySelector('#image-file'),img=shadow.querySelector('#observation-image'),stage=shadow.querySelector('#image-stage'),overlay=shadow.querySelector('#point-overlay'),status=shadow.querySelector('#image-status'),label=shadow.querySelector('#point-label'),notes=shadow.querySelector('#observation-note'),undo=shadow.querySelector('#point-undo'),exp=shadow.querySelector('#observation-export'),list=shadow.querySelector('#points-list');
  notes.value=note;notes.addEventListener('input',()=>note=notes.value);
  const draw=()=>{if(!imageInfo)return;const r=Math.max(imageInfo.width,imageInfo.height)*.008;overlay.setAttribute('viewBox',`0 0 ${imageInfo.width} ${imageInfo.height}`);overlay.innerHTML=points.map((p,i)=>`<circle cx="${p.x}" cy="${p.y}" r="${r}" fill="#acdabc" stroke="#10261d" stroke-width="${r*.3}"/><text x="${p.x+r*1.3}" y="${p.y-r}" fill="#fff" stroke="#10261d" stroke-width="${r*.12}" paint-order="stroke" font-size="${r*2.2}" font-family="sans-serif">${i+1}</text>`).join('');list.innerHTML=points.map((p,i)=>`<li><span>${i+1}. ${ESC(p.label)} · (${p.x}, ${p.y})</span><button data-remove="${i}" aria-label="删除点位 ${ESC(p.label)}">移除</button></li>`).join('');list.querySelectorAll('[data-remove]').forEach(b=>b.addEventListener('click',()=>{points.splice(Number(b.dataset.remove),1);draw();}));undo.disabled=!points.length;exp.disabled=!points.length;};
  if(objectUrl&&imageInfo){img.src=objectUrl;stage.hidden=false;status.textContent=`${imageInfo.width} × ${imageInfo.height} 像素 · ${points.length} 个人工可见点`;draw();}
  input.addEventListener('change',async()=>{const file=input.files?.[0];if(!file)return;releaseImage();const token=loadToken;stage.hidden=true;undo.disabled=true;exp.disabled=true;overlay.innerHTML='';list.innerHTML='';notes.value='';status.classList.remove('error');status.textContent='正在本地读取图片…';try{if(!['image/png','image/jpeg','image/webp'].includes(file.type)||file.size>20*1024*1024)throw new Error('请选择最大 20 MiB 的 PNG、JPEG 或 WebP 图片');const url=URL.createObjectURL(file);objectUrl=url;const probe=new Image();await new Promise((resolve,reject)=>{probe.onload=resolve;probe.onerror=()=>reject(new Error('图片无法解码'));probe.src=url;});if(token!==loadToken||route!=='annotate')return;if(probe.naturalWidth*probe.naturalHeight>40000000)throw new Error('图片超过 4000 万像素，请先缩小副本');let sha256=null;if(globalThis.crypto?.subtle){const bytes=await file.arrayBuffer(),digest=await crypto.subtle.digest('SHA-256',bytes);sha256=Array.from(new Uint8Array(digest)).map(x=>x.toString(16).padStart(2,'0')).join('');}if(token!==loadToken||route!=='annotate')return;imageInfo={filename:file.name,width:probe.naturalWidth,height:probe.naturalHeight,sha256};img.src=url;stage.hidden=false;status.textContent=`${imageInfo.width} × ${imageInfo.height} 像素 · 请命名并点击可见点`;draw();}catch(e){if(token!==loadToken)return;releaseImage();status.textContent=e.message;status.classList.add('error');}});
