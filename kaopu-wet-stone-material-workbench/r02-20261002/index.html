<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KAOPU Wet Stone Material Workbench</title><style>html,body{margin:0;height:100%;background:#080a0c;color:#eef3f7;font-family:system-ui,"Microsoft YaHei",sans-serif}.loading{height:100%;display:grid;place-items:center;text-align:center}.box{max-width:560px;padding:28px}.bar{height:4px;background:#1d252d;border-radius:99px;overflow:hidden;margin-top:14px}.bar:after{content:"";display:block;width:42%;height:100%;background:#dfc8a2;animation:move 1.1s infinite ease-in-out}@keyframes move{0%{transform:translateX(-110%)}100%{transform:translateX(340%)}}small{color:#98a4b0}</style></head><body><div class="loading"><div class="box"><h2>KAOPU Wet Stone 材质复刻工作台</h2><div id="status">正在加载老师视频与实时复刻系统……</div><div class="bar"></div><p><small>第一阶段：只复刻老师，不替换、不美化、不创造。</small></p></div></div><script>(async()=>{try{const names=['00','01','02','03','04'];const parts=[];for(const n of names){document.getElementById('status').textContent=`正在组装工作台 ${Number(n)+1}/${names.length}……`;const r=await fetch(`page/${n}.txt`,{cache:'no-store'});if(!r.ok)throw new Error(`page/${n}.txt HTTP ${r.status}`);parts.push(await r.text())}document.open();document.write(parts.join(''));document.close()}catch(e){document.getElementById('status').innerHTML=`工作台加载失败：${e.message}<br><small>请刷新页面重试。</small>`;console.error(e)}})();</script></body></html>
