<!doctype html>
<meta charset="utf-8">
<title>KAOPU N12 WebGL2 module derivative probe</title>
<style>body{font:14px system-ui;background:#111;color:#eee;margin:24px}pre{white-space:pre-wrap}</style>
<h1>N12 WebGL2 module derivative probe</h1>
<p>Integer framebuffer capture of normalized screen-space derivatives around modular seams.</p>
<script>
(() => {
  const WIDTH = 256, HEIGHT = 4, H = 1 / 128;
  const PHASES = [-.75, -.5, -.25, 0, .25, .5, .75];
  const FIELDS = ['linear', 'fract', 'floor', 'closed_sine', 'abs', 'triangle'];
  const VERT = `#version 300 es
    void main() {
      vec2 p = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2);
      gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
    }`;
  const FRAG = `#version 300 es
    precision highp float;
    precision highp int;
    uniform int uField;
    uniform float uPhase;
    layout(location=0) out uvec4 outBits;
    const float H = 0.0078125;
    const float TAU = 6.28318530717958647692;
    float scalarField(float x) {
      if (uField == 0) return x;
      if (uField == 1) return fract(x);
      if (uField == 2) return floor(x);
      if (uField == 3) return sin(TAU * fract(x));
      if (uField == 4) return abs(x);
      return 1.0 - abs(2.0 * fract(x) - 1.0);
    }
    void main() {
      float x = (gl_FragCoord.x - 128.0 + uPhase) * H;
      float v = scalarField(x);
      float dx = dFdx(v) / H;
      float dy = dFdy(v) / H;
      uint bx = floatBitsToUint(dx);
      uint by = floatBitsToUint(dy);
      if (gl_FragCoord.y < 2.0) {
        outBits = uvec4(bx & 255u, (bx >> 8u) & 255u, (bx >> 16u) & 255u, bx >> 24u);
      } else {
        outBits = uvec4(by & 255u, (by >> 8u) & 255u, (by >> 16u) & 255u, by >> 24u);
      }
    }`;

  function shader(gl, type, source) {
    const s = gl.createShader(type);
    gl.shaderSource(s, source); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  }
  function makeProgram(gl) {
    const p = gl.createProgram();
    gl.attachShader(p, shader(gl, gl.VERTEX_SHADER, VERT));
    gl.attachShader(p, shader(gl, gl.FRAGMENT_SHADER, FRAG));
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
    return p;
  }
  function unpackFloat(r, g, b, a) {
    const bytes = new Uint8Array([r, g, b, a]);
    return new DataView(bytes.buffer).getFloat32(0, true);
  }
  function summarize(values) {
    const finite = values.filter(Number.isFinite);
    return {
      count: values.length,
      finiteCount: finite.length,
      min: Math.min(...finite),
      max: Math.max(...finite),
      maxAbs: Math.max(...finite.map(Math.abs))
    };
  }
  function run() {
    const canvas = document.createElement('canvas');
    canvas.width = WIDTH; canvas.height = HEIGHT;
    const gl = canvas.getContext('webgl2', {antialias:false, preserveDrawingBuffer:true});
    if (!gl) throw new Error('WebGL2 unavailable');
    const texture = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, texture);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8UI, WIDTH, HEIGHT, 0, gl.RGBA_INTEGER, gl.UNSIGNED_BYTE, null);
    const framebuffer = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, framebuffer);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texture, 0);
    const framebufferStatus = gl.checkFramebufferStatus(gl.FRAMEBUFFER);
    if (framebufferStatus !== gl.FRAMEBUFFER_COMPLETE) throw new Error(`integer framebuffer incomplete: ${framebufferStatus}`);
    const program = makeProgram(gl); gl.useProgram(program); gl.viewport(0, 0, WIDTH, HEIGHT);
    const fieldLoc = gl.getUniformLocation(program, 'uField');
    const phaseLoc = gl.getUniformLocation(program, 'uPhase');
    const output = {schema:'kaopu-webgl2-module-derivative-n12-v1', width:WIDTH, height:HEIGHT, coordinateStep:H, phases:PHASES, fields:{}};
    for (let field = 0; field < FIELDS.length; field++) {
      const allDx = [], allDy = [], seamDx = [];
      for (const phase of PHASES) {
        gl.uniform1i(fieldLoc, field); gl.uniform1f(phaseLoc, phase);
        gl.clearBufferuiv(gl.COLOR, 0, new Uint32Array([0,0,0,0]));
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        const px = new Uint8Array(WIDTH * HEIGHT * 4);
        gl.readPixels(0, 0, WIDTH, HEIGHT, gl.RGBA_INTEGER, gl.UNSIGNED_BYTE, px);
        const err = gl.getError(); if (err !== gl.NO_ERROR) throw new Error(`readPixels error ${err}`);
        for (let y = 0; y < HEIGHT; y++) for (let x = 0; x < WIDTH; x++) {
          const i = (y * WIDTH + x) * 4;
          const value = unpackFloat(px[i], px[i+1], px[i+2], px[i+3]);
          if (y < 2) {
            allDx.push(value);
            const coordinate = (x + .5 - 128.0 + phase) * H;
            if (Math.abs(coordinate) <= 4 * H) seamDx.push(value);
          } else allDy.push(value);
        }
      }
      output.fields[FIELDS[field]] = {dx:summarize(allDx), seamDx:summarize(seamDx), dy:summarize(allDy)};
    }
    const dbg = gl.getExtension('WEBGL_debug_renderer_info');
    output.runtime = {
      userAgent:navigator.userAgent,
      webglVersion:gl.getParameter(gl.VERSION),
      shadingLanguageVersion:gl.getParameter(gl.SHADING_LANGUAGE_VERSION),
      vendor:gl.getParameter(gl.VENDOR), renderer:gl.getParameter(gl.RENDERER),
      unmaskedVendor:dbg ? gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL) : null,
      unmaskedRenderer:dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : null,
      framebufferStatus
    };
    return output;
  }
  addEventListener('load', () => {
    const pre = document.createElement('pre');
    try { pre.id='result'; pre.textContent=JSON.stringify(run(), null, 2); document.body.dataset.probe='pass'; }
    catch (error) { pre.id='error'; pre.textContent=String(error && error.stack || error); document.body.dataset.probe='fail'; }
    document.body.append(pre);
  });
})();
</script>
