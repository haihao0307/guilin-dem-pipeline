<!doctype html>
<meta charset="utf-8">
<title>KAOPU N13 WebGL2 precision query</title>
<pre id="pending">pending</pre>
<script>
(() => {
  function fmt(gl, stage, kind) {
    const f = gl.getShaderPrecisionFormat(stage, kind);
    if (!f) return null;
    return {rangeMin:f.rangeMin, rangeMax:f.rangeMax, precision:f.precision};
  }
  addEventListener('load', () => {
    const pre = document.querySelector('pre');
    try {
      const canvas = document.createElement('canvas');
      const gl = canvas.getContext('webgl2');
      if (!gl) throw new Error('WebGL2 unavailable');
      const dbg = gl.getExtension('WEBGL_debug_renderer_info');
      const result = {
        schema:'kaopu-webgl2-precision-query-n13-v1',
        fragment:{
          low:fmt(gl, gl.FRAGMENT_SHADER, gl.LOW_FLOAT),
          medium:fmt(gl, gl.FRAGMENT_SHADER, gl.MEDIUM_FLOAT),
          high:fmt(gl, gl.FRAGMENT_SHADER, gl.HIGH_FLOAT)
        },
        vertex:{
          low:fmt(gl, gl.VERTEX_SHADER, gl.LOW_FLOAT),
          medium:fmt(gl, gl.VERTEX_SHADER, gl.MEDIUM_FLOAT),
          high:fmt(gl, gl.VERTEX_SHADER, gl.HIGH_FLOAT)
        },
        runtime:{
          userAgent:navigator.userAgent,
          webglVersion:gl.getParameter(gl.VERSION),
          shadingLanguageVersion:gl.getParameter(gl.SHADING_LANGUAGE_VERSION),
          unmaskedRenderer:dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : null
        }
      };
      result.fragmentMediumpEqualsHighp = JSON.stringify(result.fragment.medium) === JSON.stringify(result.fragment.high);
      pre.id='result'; pre.textContent=JSON.stringify(result, null, 2);
    } catch (e) { pre.id='error'; pre.textContent=String(e && e.stack || e); }
  });
})();
</script>
