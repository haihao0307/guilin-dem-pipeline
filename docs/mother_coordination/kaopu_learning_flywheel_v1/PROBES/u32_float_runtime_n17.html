<title>KAOPU N17 u32 float runtime</title>

        case 4:return 0xffffff7fu;case 5:return 0xffffff80u;case 6:return 0xfffffffeu;default:return 0xffffffffu;}
    }

    const p=gl.createProgram();gl.attachShader(p,compile(gl,gl.VERTEX_SHADER,vs));gl.attachShader(p,compile(gl,gl.FRAGMENT_SHADER,fs));gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(p));
