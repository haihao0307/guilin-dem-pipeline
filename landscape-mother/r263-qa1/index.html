<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Landscape Mother · R263-QA1</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0d1110;color:#eee9df;font:14px/1.5 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}body{display:grid;place-items:center}main{width:min(520px,86vw);padding:24px;border:1px solid #ffffff24;border-radius:16px;background:#141a18;box-shadow:0 20px 60px #0008;text-align:center}b{display:block;font-size:18px}span{display:block;margin-top:9px;color:#aab2ad}.err{color:#ffd2c9;white-space:pre-wrap;text-align:left}
</style>
</head>
<body>
<main id="status"><b>正在打开 Landscape Mother R263-QA1</b><span>加载三维工作台……</span></main>
<script>
(async()=>{
  const status=document.getElementById('status');
  try{
    if(!('DecompressionStream' in window)) throw new Error('当前浏览器不支持 DecompressionStream，请使用最新版 Chrome、Edge 或 Safari。');
    const version='bb1f3cf8';
    const parts=await Promise.all(Array.from({length:8},(_,i)=>fetch(`p${i}.txt?v=${version}`,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(`载荷 p${i} 获取失败：HTTP ${r.status}`);return r.text();})));
    const b64=parts.join('').trim();
    if(b64.length!==22748) throw new Error(`载荷长度校验失败：${b64.length} / 22748`);
    const compressed=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
    const stream=new Blob([compressed]).stream().pipeThrough(new DecompressionStream('gzip'));
    const bytes=new Uint8Array(await new Response(stream).arrayBuffer());
    if(bytes.byteLength!==48082) throw new Error(`工作台长度校验失败：${bytes.byteLength} / 48082`);
    if(crypto?.subtle){
      const digest=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',bytes))).map(v=>v.toString(16).padStart(2,'0')).join('');
      if(digest!=='2ab3140503666a7d25a47a4a1f22f3be140475571dea0318edc461176de7bc1d') throw new Error('工作台完整性校验失败。');
    }
    const html=new TextDecoder().decode(bytes);
    document.open();document.write(html);document.close();
  }catch(error){
    status.className='err';
    status.innerHTML='<b>工作台未能打开</b><span class="err"></span>';
    status.querySelector('span').textContent=String(error&&error.stack||error);
    console.error(error);
  }
})();
</script>
</body>
</html>
