<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>桂林阳朔喀斯特蒸馏知识档案 v2.3</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#06110e;color:#eef7ef;font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}.loader{width:min(560px,calc(100% - 36px));padding:30px;border:1px solid #28453a;border-radius:22px;background:#0b1c17;box-shadow:0 22px 70px #0008}.eyebrow{color:#d7b45f;font:700 12px/1.4 ui-monospace,monospace;letter-spacing:.12em}.loader h1{font-size:clamp(26px,5vw,44px);line-height:1.08;margin:12px 0}.loader p{color:#a8beb2;line-height:1.8}.bar{height:6px;border-radius:99px;background:#173127;overflow:hidden;margin-top:20px}.bar::after{content:"";display:block;height:100%;width:38%;border-radius:inherit;background:#d7b45f;animation:move 1.2s ease-in-out infinite alternate}@keyframes move{to{transform:translateX(165%)}}code{font-family:ui-monospace,monospace;color:#d7b45f}.error{white-space:pre-wrap;color:#ffb5a7}
</style>
</head>
<body>
<main class="loader" id="loader">
<div class="eyebrow">GUILIN DISTILLED KNOWLEDGE · v2.3</div>
<h1>正在打开桂林阳朔喀斯特蒸馏知识档案</h1>
<p>正在载入 18 张照片证据卡、6 类稳定地貌关系、11 类地貌原型和 13 个机器可执行节点。</p>
<div class="bar" aria-hidden="true"></div>
</main>
<script>
(async()=>{
  const files=[1,2,3,4,5].map(n=>`./guilin-distilled-knowledge.payload.b64.${n}`);
  const responses=await Promise.all(files.map(file=>fetch(file,{cache:'no-store'})));
  for(const response of responses){if(!response.ok)throw new Error(`知识页面载荷 HTTP ${response.status}`)}
  const base64=(await Promise.all(responses.map(response=>response.text()))).join('').replace(/\s+/g,'');
  const binary=atob(base64);
  const bytes=Uint8Array.from(binary,character=>character.charCodeAt(0));
  const digest=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',bytes))).map(value=>value.toString(16).padStart(2,'0')).join('');
  if(digest!=='3d2a21a23f79517081436b70a9d7ee1df231ef457dec3f8dda2eabc0f2e4ba66')throw new Error(`知识页面载荷校验失败：${digest}`);
  if(typeof DecompressionStream!=='function')throw new Error('当前浏览器缺少 DecompressionStream，请使用新版 Chrome、Edge、Firefox 或 Safari。');
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  const html=await new Response(stream).text();
  document.open();
  document.write(html);
  document.close();
})().catch(error=>{
  const loader=document.getElementById('loader');
  loader.innerHTML='<div class="eyebrow">LOAD FAILED</div><h1>知识页面载入失败</h1><p class="error"></p>';
  loader.querySelector('.error').textContent=String(error?.stack||error);
  document.documentElement.dataset.knowledgeReady='failed';
});
</script>
</body>
</html>
