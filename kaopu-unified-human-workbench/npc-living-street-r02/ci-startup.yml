name: NPC living street R02 startup observation
on:
  push:
    branches: [feature/npc-living-street-r02-20261020]
    paths:
      - 'kaopu-unified-human-workbench/npc-living-street-r02/**'
      - '.github/workflows/npc-living-street-r02-startup.yml'
permissions:
  contents: read
concurrency:
  group: npc-living-street-r02-startup-${{ github.sha }}
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SOURCE_HEAD: ${{ github.sha }}
      NPC_BOOT_TIMEOUT_MS: 900000
      NPC_TOTAL_TIMEOUT_MS: 1800000
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: kaopu-unified-human-workbench/npc-living-street-r02
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare verified canonical dependencies
        working-directory: kaopu-unified-human-workbench/npc-living-street-r02
        run: |
          node prepare.cjs --all-native
      - name: Check life rules and build current candidate
        working-directory: kaopu-unified-human-workbench/npc-living-street-r02
        run: |
          node src/life-tests.mjs
          node build.cjs --check-host
          node build.cjs
      - name: Prepare the repository browser verification runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Observe six complete native people and current actual resource requests
        timeout-minutes: 31
        env:
          NPC_QA_PHASE: startup
          NPC_QA_OUT: /tmp/street-browser
        run: node kaopu-unified-human-workbench/npc-living-street-r02/verify-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: street-startup-${{ github.sha }}
          path: |
            /tmp/street-browser
            kaopu-unified-human-workbench/npc-living-street-r02/BUILD.json
          retention-days: 14
