</style></head><body><header><strong>人物 R54 · 发眼候选</strong><a href="../../index.html">人物总台</a><span id="version">R54 · 启动诊断5</span><span id="status" role="status">载入中</span></header><div class="tools"><button data-view="U05" disabled>正面</button><button data-view="E04" disabled>斜侧</button><button data-view="profile" disabled>侧面</button><button data-view="back" disabled>背面</button><button id="hair-toggle" aria-pressed="true" disabled>覆盖发层：开</button><button id="eye-toggle" aria-pressed="true" disabled>程序眼表：开</button></div><main><div id="viewport"><iframe id="native" title="固定 R52 原生三维人物"></iframe><div id="loading"><strong id="loading-title">正在载入固定脸型与发眼候选</strong><p id="progress">初次载入需要读取原生人体；随后生成当前头皮上的静态发束。</p><p id="elapsed" aria-live="off">已等待 0 秒</p><button id="retry" hidden>重新载入</button><section id="device-diagnostic" hidden><strong>本机完整诊断</strong><pre id="diagnostic-text"></pre><div id="diagnostic-actions"><button id="copy-diagnostic">复制完整结果</button><button id="download-diagnostic">下载诊断 JSON</button></div><p id="diagnostic-action-status" role="status"></p></section><section id="startup-diagnostic" hidden><strong>本机启动记录</strong><p id="startup-summary"></p><div class="diagnostic-actions"><button id="copy-startup">复制启动记录</button><button id="download-startup">下载启动记录</button></div><p id="startup-action-status" role="status"></p><details><summary>查看完整启动记录</summary><pre id="startup-text"></pre></details></section></div></div></main><footer>脸型保持 R52。毛发仍粗糙、短长层衔接未成熟；眼表不代表眼睑接触或肖像相似度已验收。拖动环视，滚轮缩放。静态发束，无毛发物理。</footer><script src="./StartupLedger.js?v=r54-startup-guard-5"></script>
<script>
(function(){
 var start=Date.now(),timer,stableTimer,ledger,storage;try{storage=window.sessionStorage;}catch(_){}
 var status=document.getElementById('status'),progress=document.getElementById('progress'),loading=document.getElementById('loading'),retry=document.getElementById('retry'),title=document.getElementById('loading-title'),elapsed=document.getElementById('elapsed');
 var token=String(start)+'-'+Math.random().toString(36).slice(2),state=window.r54PreviewState={phase:'boot',stage:'正在加载页面脚本',error:null,startedAt:start,stageStartedAt:start,bootToken:token};
 function showRecord(){if(!ledger)return;var report=window.r54StartupReport=ledger.report();document.getElementById('startup-diagnostic').hidden=false;document.getElementById('startup-summary').textContent='记录仅保存在本机，没有自动上传。版本 '+report.version+'；阶段 '+report.stage+'。';document.getElementById('startup-text').textContent=JSON.stringify(report,null,2);}
 window.r54Boot={token:token,ledger:null,allowed:false,
  stage:function(text){if(state.phase==='ready'||state.phase==='error')return false;var result=ledger?ledger.progress(text):{ok:true};if(!result.ok){this.fail(result.reason);return false;}if(state.stage!==text)state.stageStartedAt=Date.now();state.phase='loading';state.stage=text;status.textContent=text;progress.textContent=text;return true;},
  fail:function(error){if(state.phase==='error')return;clearInterval(timer);clearTimeout(stableTimer);var message=String(error&&error.message||error);if(ledger)ledger.fail(message);document.body.classList.add('has-error');state.phase='error';state.error=message;title.textContent='载入已停止';status.textContent='载入已停止';progress.textContent=message;retry.hidden=false;loading.hidden=false;document.getElementById('native').style.visibility='hidden';document.querySelectorAll('.tools button').forEach(function(b){b.disabled=true;});showRecord();},
  ready:function(){if(state.phase==='error'||state.phase==='ready')return false;var result=ledger.ready();if(!result.ok){this.fail(result.reason);return false;}state.phase='ready';state.error=null;clearInterval(timer);loading.hidden=true;stableTimer=setTimeout(function(){ledger.stable();window.r54StartupReport=ledger.report();},10000);return true;},
  active:function(){return !!ledger&&ledger.active()&&state.phase!=='error';},
  accepts:function(boot,doc){var r=ledger&&ledger.report();return !!r&&boot===r.bootToken&&doc===r.documentToken&&r.phase!=='error'&&r.phase!=='blocked'&&r.phase!=='retry';},
  record:function(kind,payload){if(!ledger)return;ledger.record(kind,payload);window.r54StartupReport=ledger.report();},
  retry:function(){if(ledger)ledger.prepareRetry();retry.disabled=true;location.reload();}
 };
 retry.onclick=function(){window.r54Boot.retry();};
 if(!window.R54StartupLedger){window.r54Boot.fail('启动保护脚本未能载入，已停止三维初始化。');return;}
 ledger=window.R54StartupLedger.create({storage:storage,key:'kaopu-r54-startup-ledger',version:'R54-startup/5',now:Date.now,token:token});window.r54Boot.ledger=ledger;
 window.r54Boot.record('parent-created',{navigationType:performance.getEntriesByType('navigation')[0]?.type||'unknown',timeOrigin:performance.timeOrigin,visibility:document.visibilityState,devicePixelRatio:devicePixelRatio,viewport:{width:innerWidth,height:innerHeight}});
 if(!ledger.active()){window.r54Boot.fail(ledger.report().reason||'上一次启动没有记录完成，已停止自动重新载入。');return;}
 window.r54Boot.allowed=true;
 timer=setInterval(function(){var seconds=Math.floor((Date.now()-start)/1000);elapsed.textContent='已等待 '+seconds+' 秒';if(seconds>=45&&state.phase!=='ready')retry.hidden=false;
 if((state.phase==='boot'||state.phase==='loading'&&state.stage.indexOf('1/5 ')===0)&&Date.now()-state.stageStartedAt>=30000){window.r54Boot.fail(state.stage+'：30秒内未能完成，请重新载入。');document.getElementById('native').src='about:blank';}},1000);
 window.addEventListener('error',function(e){if(e.message)window.r54Boot.fail('页面启动失败：'+e.message);});
 window.addEventListener('unhandledrejection',function(e){window.r54Boot.fail('页面启动失败：'+String(e.reason&&e.reason.message||e.reason));});
 window.addEventListener('pagehide',function(e){window.r54Boot.record('parent-pagehide',{persisted:e.persisted});});
 window.addEventListener('pageshow',function(e){window.r54Boot.record('parent-pageshow',{persisted:e.persisted});});
 document.addEventListener('visibilitychange',function(){window.r54Boot.record('visibility',{state:document.visibilityState});});
})();
</script>
