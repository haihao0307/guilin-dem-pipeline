import * as T from '../source/registration-vendor/three.module.js';import{OrbitControls}from'../ui/vendor/OrbitControls.js';import{BoxingArena}from'./Arena.mjs';const renderer=new T.WebGLRenderer({canvas:document.getElementById('canvas'),antialias:true});renderer.setPixelRatio(1);renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;const scene=new T.Scene();scene.background=new T.Color(0x24343e);const camera=new T.PerspectiveCamera(36,1,.02,100),orbit=new OrbitControls(camera,renderer.domElement);scene.add(new T.HemisphereLight(0xe2eff3,0x465661,2.8));const sun=new T.DirectionalLight(0xffe8d0,3);sun.position.set(3,8,4);scene.add(sun);const arena=new BoxingArena(0);arena.group.position.y=1;scene.add(arena.group);const ground=new T.Mesh(new T.PlaneGeometry(70,70),new T.MeshStandardMaterial({color:0x1a2a32,roughness:1}));ground.rotation.x=-Math.PI/2;ground.position.y=-.02;scene.add(ground);const render=()=>renderer.render(scene,camera);orbit.addEventListener('change',render);function view(v){if(v==='corner'){camera.position.set(-5.2,2.5,5.1);orbit.target.set(-3.07,1.85,3.07);}else if(v==='low'){camera.position.set(4.7,2.15,7.0);orbit.target.set(1.25,.8,3.25);}else{camera.position.set(8.8,7.5,10.3);orbit.target.set(0,1,0);}orbit.update();render();}for(const id of['front','corner','low'])document.getElementById(id).onclick=()=>view(id);document.getElementById('ropes').onchange=e=>{arena.setRopeMode(e.target.value);render();};function resize(){renderer.setSize(innerWidth,innerHeight-54,false);camera.aspect=innerWidth/(innerHeight-54);camera.updateProjectionMatrix();render();}addEventListener('resize',resize);resize();view('front');window.arenaShowcase={view,report:()=>arena.report(),render};
