<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06141b"><title>Stone Money Island · Palau R03F</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#06141b;color:#e8f3ef;font:15px/1.5 system-ui,-apple-system,"Microsoft YaHei",sans-serif}body{display:grid;place-items:center}.box{width:min(700px,86vw);padding:24px;border:1px solid #cfffff25;border-radius:24px;background:#0a2229;box-shadow:0 24px 80px #0008}.title{font-size:22px;font-weight:800}.sub{margin-top:5px;color:#adc5c1}.bar{height:7px;margin-top:17px;overflow:hidden;border-radius:10px;background:#ffffff14}.bar i{display:block;width:3%;height:100%;background:linear-gradient(90deg,#61d8c2,#c0e9a8);transition:width .18s}pre{white-space:pre-wrap;color:#ffd1c8;font-size:12px}</style></head><body><div class="box"><div class="title">正在打开 Palau 统一波场</div><div id="status" class="sub">连接在线三维工作台…</div><div class="bar"><i id="bar"></i></div><pre id="error"></pre></div><script>
(async()=>{const status=document.querySelector('#status'),bar=document.querySelector('#bar'),err=document.querySelector('#error');try{if(!('DecompressionStream' in window))throw new Error('当前浏览器不支持在线解压，请改用 Safari 16.4 或更新版本。');const names=Array.from({length:12},(_,i)=>`part-${String(i).padStart(2,'0')}.txt`);const chunks=[];for(let i=0;i<names.length;i++){status.textContent=`读取统一波场 ${i+1}/${names.length}…`;bar.style.width=`${5+Math.round((i+1)/names.length*55)}%`;const r=await fetch(names[i],{cache:'no-store'});if(!r.ok)throw new Error(`${names[i]}：HTTP ${r.status}`);chunks.push((await r.text()).trim())}const b64=chunks.join('');if(b64.length!==93644)throw new Error(`载荷长度不一致：${b64.length}/93644`);status.textContent='恢复经纬耦合波场…';bar.style.width='72%';const raw=atob(b64),bytes=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();if(html.length!==432066)throw new Error(`三维工作台长度不一致：${html.length}/432066`);status.textContent='启动 WebGL2 三维世界…';bar.style.width='94%';document.open();document.write(html);document.close()}catch(e){status.textContent='打开失败';bar.style.width='100%';err.textContent=(e&&e.stack)||String(e)}})();
</script></body></html>
