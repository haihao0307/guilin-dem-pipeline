<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06141b"><title>Stone Money Island · Palau R03F2</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#06141b;color:#e8f3ef;font:15px/1.5 system-ui,-apple-system,"Microsoft YaHei",sans-serif}body{display:grid;place-items:center}.box{width:min(700px,86vw);padding:24px;border:1px solid #cfffff25;border-radius:24px;background:#0a2229;box-shadow:0 24px 80px #0008}.title{font-size:22px;font-weight:800}.sub{margin-top:5px;color:#adc5c1}.bar{height:7px;margin-top:17px;overflow:hidden;border-radius:10px;background:#ffffff14}.bar i{display:block;width:3%;height:100%;background:linear-gradient(90deg,#61d8c2,#c0e9a8);transition:width .18s}pre{white-space:pre-wrap;color:#ffd1c8;font-size:12px}</style></head><body><div class="box"><div class="title">正在打开 Palau 统一波场</div><div id="status" class="sub">连接在线三维工作台…</div><div class="bar"><i id="bar"></i></div><pre id="error"></pre></div><script>(async()=>{const status=document.querySelector('#status'),bar=document.querySelector('#bar'),err=document.querySelector('#error');let stage='启动';try{if(!('DecompressionStream'in window))throw new Error('当前浏览器不支持在线解压，请使用 Safari 16.4 或更新版本。');const names=['part-00.txt','part-01.txt','part-02.txt','part-03.txt','part-04.txt','part-05.txt','part-06a.txt','part-06b.txt','part-07a1.txt','part-07a2.txt','part-07b.txt','part-08.txt','part-09.txt','part-10a.txt','part-10b1.txt','part-10b2.txt','part-11.txt'];const chunks=[];stage='读取载荷';for(let i=0;i<names.length;i++){status.textContent=`读取统一波场 ${i+1}/${names.length}…`;bar.style.width=`${5+Math.round((i+1)/names.length*55)}%`;const r=await fetch(names[i],{cache:'no-store'});if(!r.ok)throw new Error(`${names[i]}：HTTP ${r.status}`);chunks.push((await r.text()).trim())}const b64=chunks.join('');if(b64.length!==93644)throw new Error(`载荷长度不一致：${b64.length}/93644`);stage='解码载荷';status.textContent='恢复经纬耦合波场…';bar.style.width='72%';const raw=atob(b64),compressed=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)compressed[i]=raw.charCodeAt(i);stage='解压工作台';const stream=new Blob([compressed]).stream().pipeThrough(new DecompressionStream('gzip'));const buffer=await new Response(stream).arrayBuffer();if(buffer.byteLength!==432066)throw new Error(`三维工作台字节长度不一致：${buffer.byteLength}/432066`);stage='解码工作台';const html=new TextDecoder('utf-8',{fatal:true}).decode(buffer);if(!html.includes('PALAU_AIRAI_STONE_MONEY_R03F_IOS_SAFE'))throw new Error('工作台身份校验失败');stage='启动 WebGL2';status.textContent='启动 WebGL2 三维世界…';bar.style.width='94%';document.open();document.write(html);document.close()}catch(e){status.textContent='打开失败';bar.style.width='100%';const message=e&&e.message?e.message:String(e);err.textContent=`阶段：${stage}\n错误：${message}\n\n${e&&e.stack?e.stack:''}`}})();</script></body></html>
