<style id="palau-v0160-interface">
/* The player HUD is deliberately independent of the retained engineering controls. */
body{background:#0a4155;color:#f7f5e8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif}
.topbar,#sceneTitle,#cameraBar,#gameDock,#boatMission,#coastFooter,#cameraHint{display:none!important}
#playerHUD{position:fixed;z-index:40;inset:0;pointer-events:none}#playerHUD button,#playerHUD details,#playerHUD .sheet{pointer-events:auto}
#playerHUD button{touch-action:manipulation;min-height:46px;min-width:46px;border:1px solid #ffffff35;background:#113d45dc;color:#fbf8eb;box-shadow:0 3px 14px #001f2a18;border-radius:16px;padding:11px 17px;font-weight:550;letter-spacing:.02em}
#playerHUD button:hover{background:#22545de8}#playerHUD button:active{transform:translateY(1px)}
#playerTop{position:absolute;top:max(21px,env(safe-area-inset-top));left:max(24px,env(safe-area-inset-left));right:max(24px,env(safe-area-inset-right));display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
#palauWordmark{color:#fbf9ef;text-shadow:0 2px 12px #00304678;display:flex;flex-direction:column;line-height:1}#palauWordmark small{font-size:9px;letter-spacing:.34em;margin-left:2px}#palauWordmark strong{font:500 38px/1.16 Georgia,"Times New Roman",serif;letter-spacing:.12em}#palauWordmark span{font-size:10px;letter-spacing:.07em;opacity:.94;margin-top:6px}
#playerTools{display:flex;gap:7px}#playerTools button{font-size:12px;background:#123d466b;border-radius:50%;padding:9px;min-width:45px}
#playerBottom{position:absolute;left:max(24px,env(safe-area-inset-left));right:max(24px,env(safe-area-inset-right));bottom:max(24px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:flex-end;gap:16px}
#journeyLabel{font-size:11px;line-height:1.8;text-shadow:0 2px 8px #052c45;max-width:300px}#journeyLabel b{font-size:10px;letter-spacing:.14em;font-weight:550;display:block}#journeyLabel span{opacity:.9}
#playerActions{display:flex;gap:8px;align-items:center}#playerHUD #actionFish{background:#e9d29a;color:#263f3b;border-color:#fff0c1;min-width:100px}#playerHUD #actionFish:hover{background:#f2deac}
#fishCard{position:absolute;bottom:94px;right:24px;width:300px;border:1px solid #ffffff42;border-radius:19px;background:#103b43ed;padding:17px 18px;color:#f7f5e8;pointer-events:auto;box-shadow:0 10px 36px #002a351a}
#fishCard small{font-size:9px;letter-spacing:.16em;color:#c6dacd}#fishCard h3{font:500 20px/1.3 Georgia,serif;margin:6px 0}#fishCard p{margin:5px 0 12px;font-size:12px;line-height:1.6;color:#dce7df}#fishCancel{position:absolute;top:6px;right:6px;background:transparent!important;border:0!important;font-size:18px;padding:5px!important;min-width:36px!important;min-height:36px!important}
.meterHead{display:flex;justify-content:space-between;font-size:10px;margin:8px 0 4px;color:#deeadf}.meter{height:5px;background:#ffffff24;border-radius:8px;overflow:hidden}.meter i{display:block;width:0;height:100%;background:#95d8c4;transition:width .08s linear}#tensionFill{background:#e6be77}#fishCard[data-phase=bite]{outline:2px solid #ffe2a0}#fishCard[data-phase=bite] h3{color:#ffe2a0}
#exploreSheet{position:absolute;right:24px;top:88px;width:278px;padding:12px;background:#123d45f5;border:1px solid #ffffff38;border-radius:19px;box-shadow:0 12px 40px #06313929}#exploreSheet button{display:block;width:100%;text-align:left;border:0;background:transparent;box-shadow:none;font-size:12px;border-radius:9px}#exploreSheet p{font-size:10px;line-height:1.65;padding:5px 7px;color:#cbdcd8;margin:2px 0}
#boatPad{left:max(24px,env(safe-area-inset-left));right:auto;bottom:100px;grid-template-columns:46px 46px 46px;grid-template-rows:44px 44px;gap:3px;z-index:42}
#boatPad button{min-width:44px;min-height:44px;padding:7px;border:1px solid #ffffff50;border-radius:15px!important;background:#123f46bb!important;color:#f5f4e7;font-size:14px}
#panel{z-index:55!important;color:#173b41;background:#eef2e8fa!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;top:85px;bottom:24px;max-height:calc(100dvh - 110px)}
#loading{background:#113c48;color:#f6f0dd}#loading span{color:#bbd3ce}#loading .loadingMark{border-color:#d6cea4;color:#eee8d1;background:none;box-shadow:none}
@media(max-width:760px){#playerTop{top:max(15px,env(safe-area-inset-top));left:17px;right:15px;gap:6px}#palauWordmark small{font-size:8px}#palauWordmark strong{font-size:30px}#palauWordmark span{font-size:9px}#playerTools{gap:5px}#playerTools button{font-size:11px;min-width:42px;min-height:42px}#playerBottom{left:16px;right:16px;bottom:max(18px,env(safe-area-inset-bottom));gap:8px;display:block}#journeyLabel{font-size:10px;margin:0 0 10px;max-width:100%;min-height:33px}#journeyLabel b{font-size:9px}#playerActions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}#playerHUD button{font-size:12px;padding:10px 12px;border-radius:14px}#playerHUD #actionFish{min-width:0}#fishCard{left:16px;right:16px;width:auto;bottom:max(131px,calc(env(safe-area-inset-bottom) + 112px));padding:15px 17px}#fishCard h3{font-size:19px}#exploreSheet{right:15px;top:80px;width:260px}#boatPad{left:16px;bottom:145px;grid-template-columns:43px 43px 43px;grid-template-rows:43px 43px}}
@media(max-height:500px){#palauWordmark strong{font-size:26px}#palauWordmark span{display:none}#playerBottom{left:20px;right:20px;bottom:12px;display:flex}#playerActions{display:flex}#journeyLabel{max-width:280px;margin:0}#fishCard{left:auto;right:20px;bottom:74px;width:280px;padding:11px 14px}#fishCard h3{font-size:17px}#fishCard p{margin:3px 0 7px;font-size:11px}#boatPad{bottom:72px}#exploreSheet{top:64px;max-height:calc(100dvh - 75px);overflow:auto}}
</style>
