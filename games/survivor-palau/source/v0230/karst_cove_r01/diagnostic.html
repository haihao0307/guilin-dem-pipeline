<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SMI Karst Cove R01 diagnostic</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#a9c6d3;font:12px system-ui;color:#f4f1e8}canvas{display:block;width:100%;height:100%;touch-action:none}.hud{position:fixed;left:12px;top:12px;max-width:min(460px,calc(100vw - 24px));padding:9px 11px;background:#17232bbb;border:1px solid #ffffff33;border-radius:10px;backdrop-filter:blur(6px);line-height:1.35}.hud b{font-size:13px}.tag{opacity:.75}.ok{color:#bde8c7}.warn{color:#ffd59a}@media(max-width:500px){.hud{font-size:10px;padding:7px 8px}.hud b{font-size:11px}}
</style>
<canvas id="c"></canvas><div class="hud"><b>Stone Money Island · Karst Cove R01</b><br><span class="ok">query-driven 3D diagnostic</span> · candidate authored dimensions<br><span class="tag">drag orbit · wheel zoom · same field drives mesh/contact/occlusion</span><br><span class="warn">not scene-integrated / not surveyed / visualAcceptance=false</span><div id="stats"></div></div>
<script src="./karst_cove.cjs"></script>
<script>
(()=>{'use strict';
const K=globalThis.SMIKarstCove,c=document.getElementById('c'),gl=c.getContext('webgl2',{antialias:true,alpha:false});
if(!K||!gl){document.body.dataset.ready='error';throw Error('WebGL2 or Karst module unavailable');}
const mesh=K.buildDiagnosticMesh({step:.24});
const positions=new Float32Array(mesh.positions),normals=new Float32Array(mesh.normals),indices=new Uint32Array(mesh.indices);
const vs=`#version 300 es\nprecision highp float;layout(location=0)in vec3 p;layout(location=1)in vec3 n;uniform mat4 P,V;out vec3 N,W;void main(){W=p;N=n;gl_Position=P*V*vec4(p,1.);}`;
const fs=`#version 300 es\nprecision highp float;in vec3 N,W;out vec4 o;uniform vec3 eye;void main(){vec3 nn=normalize(N),sun=normalize(vec3(-.5,.9,.35));float d=max(.08,dot(nn,sun));float rim=pow(1.-max(0.,dot(nn,normalize(eye-W))),2.);vec3 rock=mix(vec3(.18,.20,.17),vec3(.47,.45,.36),d);float moss=.10*(.5+.5*sin(W.x*1.7+W.z*.8));rock+=vec3(.02,.055,.012)*moss*10.;rock+=rim*.07;o=vec4(pow(rock,vec3(.9)),1.);}`;
function sh(t,s){const x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);if(!gl.getShaderParameter(x,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(x));return x}const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,vs));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(pr);if(!gl.getProgramParameter(pr,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(pr));
const vao=gl.createVertexArray();gl.bindVertexArray(vao);const pb=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,pb);gl.bufferData(gl.ARRAY_BUFFER,positions,gl.STATIC_DRAW);gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,3,gl.FLOAT,false,0,0);const nb=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,nb);gl.bufferData(gl.ARRAY_BUFFER,normals,gl.STATIC_DRAW);gl.enableVertexAttribArray(1);gl.vertexAttribPointer(1,3,gl.FLOAT,false,0,0);const ib=gl.createBuffer();gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ib);gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,indices,gl.STATIC_DRAW);
const lp=gl.getUniformLocation(pr,'P'),lv=gl.getUniformLocation(pr,'V'),le=gl.getUniformLocation(pr,'eye');
function persp(fovy,asp,n,f){const t=1/Math.tan(fovy/2),nf=1/(n-f);return new Float32Array([t/asp,0,0,0,0,t,0,0,0,0,(f+n)*nf,-1,0,0,2*f*n*nf,0])}
const sub=(a,b)=>a.map((v,i)=>v-b[i]),cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],dot=(a,b)=>a.reduce((s,v,i)=>s+v*b[i],0),norm=v=>{const l=Math.hypot(...v)||1;return v.map(x=>x/l)};
function look(eye,at,up=[0,1,0]){const z=norm(sub(eye,at)),x=norm(cross(up,z)),y=cross(z,x);return new Float32Array([x[0],y[0],z[0],0,x[1],y[1],z[1],0,x[2],y[2],z[2],0,-dot(x,eye),-dot(y,eye),-dot(z,eye),1])}
let yaw=0,pitch=.08,dist=13.4,drag=null;const at=[27,3.0,14.2];
c.addEventListener('pointerdown',e=>{drag=[e.clientX,e.clientY];c.setPointerCapture(e.pointerId)});c.addEventListener('pointermove',e=>{if(!drag)return;yaw-=(e.clientX-drag[0])*.008;pitch=Math.max(-.45,Math.min(.65,pitch+(e.clientY-drag[1])*.006));drag=[e.clientX,e.clientY]});c.addEventListener('pointerup',()=>drag=null);c.addEventListener('wheel',e=>{e.preventDefault();dist=Math.max(7,Math.min(23,dist+e.deltaY*.012))},{passive:false});
function resize(){const d=Math.min(2,devicePixelRatio||1),w=Math.max(1,Math.floor(innerWidth*d)),h=Math.max(1,Math.floor(innerHeight*d));if(c.width!==w||c.height!==h){c.width=w;c.height=h}gl.viewport(0,0,w,h)}
function render(){resize();const eye=[at[0]+Math.sin(yaw)*Math.cos(pitch)*dist,at[1]+Math.sin(pitch)*dist,at[2]+Math.cos(yaw)*Math.cos(pitch)*dist];gl.enable(gl.DEPTH_TEST);gl.enable(gl.CULL_FACE);gl.clearColor(.56,.70,.76,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.useProgram(pr);gl.uniformMatrix4fv(lp,false,persp(Math.PI/3,c.width/c.height,.08,80));gl.uniformMatrix4fv(lv,false,look(eye,at));gl.uniform3fv(le,eye);gl.bindVertexArray(vao);gl.drawElements(gl.TRIANGLES,indices.length,gl.UNSIGNED_INT,0);requestAnimationFrame(render)}
document.getElementById('stats').textContent=`triangles ${mesh.triangles.toLocaleString()} · step ${mesh.step.toFixed(2)} m`;
document.body.dataset.ready='true';render();
})();
</script>
