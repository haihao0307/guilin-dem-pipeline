<style id="palau-v0172-observation-visual-interface">
/* Thin screen-space aviation-goggle rim. Transparent centers are mandatory: the frame may
   communicate worn improvised optics but may never hide the fish, bait or horizon. */
#pilotLensOverlay{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none;overflow:visible;filter:drop-shadow(0 2px 3px #041a1b78)}
#pilotLensOverlay .outer{fill:none;stroke:#182827b8;stroke-width:13;vector-effect:non-scaling-stroke}
#pilotLensOverlay .inner{fill:none;stroke:#a7b9ae66;stroke-width:2;vector-effect:non-scaling-stroke}
#pilotLensOverlay .bridge{fill:none;stroke:#5a4b3fbd;stroke-width:10;stroke-linecap:round;vector-effect:non-scaling-stroke}
#pilotLensOverlay .strap{fill:none;stroke:#24302da8;stroke-width:8;stroke-linecap:round;vector-effect:non-scaling-stroke}
#pilotSurvivalLayer>#survivalRibbon,#pilotSurvivalLayer>#observeCard,#pilotSurvivalLayer>#pilotNotice,#pilotSurvivalLayer>#storySheet{z-index:5}
@media(max-width:760px){#pilotLensOverlay .outer{stroke-width:9}#pilotLensOverlay .bridge{stroke-width:7}#pilotLensOverlay .strap{stroke-width:6}}
</style>
