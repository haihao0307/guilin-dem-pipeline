<style id="palau-v0172-observation-visual-interface">
/* Low-profile improvised observation goggles. The glass remains essentially clear; only a thin
   edge may enter the player's view. This must never become two opaque discs or a binocular mask. */
#pilotLensOverlay{position:fixed!important;inset:0;width:100%;height:100%;display:block!important;z-index:4;pointer-events:none;overflow:visible;opacity:1;visibility:visible;filter:drop-shadow(0 1px 2px #041a1b52)}
#pilotLensOverlay[hidden]{display:block!important;opacity:0;visibility:hidden}
#pilotLensOverlay .lensGlass{fill:#d9f2ef0a;stroke:none}
#pilotLensOverlay .outer{fill:none;stroke:#1b2b2a9e;stroke-width:8;vector-effect:non-scaling-stroke}
#pilotLensOverlay .inner{fill:none;stroke:#d4e7df5c;stroke-width:1.5;vector-effect:non-scaling-stroke}
#pilotLensOverlay .bridge{fill:none;stroke:#544b43a8;stroke-width:5;stroke-linecap:round;vector-effect:non-scaling-stroke}
#pilotLensOverlay .nose{fill:none;stroke:#544b4388;stroke-width:3;stroke-linecap:round;vector-effect:non-scaling-stroke}
#pilotSurvivalLayer>#survivalRibbon,#pilotSurvivalLayer>#observeCard,#pilotSurvivalLayer>#pilotNotice,#pilotSurvivalLayer>#storySheet{z-index:5}
@media(max-width:760px){#pilotLensOverlay .outer{stroke-width:6}#pilotLensOverlay .bridge{stroke-width:4}#pilotLensOverlay .nose{stroke-width:2.5}}
</style>
