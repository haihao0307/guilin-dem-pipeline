<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>KAOPU · 试衣工作台</title><link rel="stylesheet" href="board.css"></head><body>
<header class="app-header"><a class="brand" href="./"><span class="brand-mark">K</span><strong>KAOPU<small>服装工作台</small></strong></a><span class="header-caption">在人物上看版型，近距离看质感。</span><div class="header-actions"><button id="board-load">打开搭配</button><button id="board-save" class="outline">保存搭配 ↗</button></div></header>
<main class="workspace">
<section class="work-surface"><div class="surface-heading"><div><span class="mode-dot"></span><strong>试衣台</strong><span id="surface-subtitle">上衣与下装 · 实时试穿</span></div><nav class="focus-buttons" aria-label="展示范围"><button data-focus="whole">全身</button><button data-focus="top">上衣</button><button data-focus="bottom">下装</button></nav></div><div class="viewport"><div id="stage"><canvas id="canvas" aria-label="人物与服装的实时三维试穿"></canvas></div><div id="build-overlay"><span class="spinner"></span><strong>正在穿好默认搭配</strong><p id="build-message">载入人物与服装，请稍候。</p></div><div class="stage-label"><small>LIVE FITTING</small><span id="look-caption">V领上衣 · 基础短裤</span></div><nav class="scene-view-controls" aria-label="观察角度"><button data-view="three">斜前</button><button data-view="front">正面</button><button data-view="rear">背面</button><button data-view="side">侧面</button><button id="compare" aria-pressed="false">结构</button></nav><div class="scene-tip">拖动旋转 · 滚轮缩放 · 双击衣服看织纹</div></div><div class="motion-strip"><div class="motion-label"><span class="mode-dot"></span><span id="preview-state">正在准备试穿</span></div><nav class="motion-buttons" aria-label="人物动作"><button data-motion="walk">走路</button><button data-motion="run">跑步</button><button data-motion="jump">跳跃</button><button id="action-cycle" disabled>连续演示</button><button id="motion-pause">暂停</button><button id="physics-reset" disabled>重置</button></nav></div></section>
<aside class="selection-panel" aria-label="服装与材质调整"><div class="panel-title"><small>YOUR WARDROBE</small><h1>搭配与调整</h1><p>先换版型，再挑材质，最后调整细节。</p></div><nav class="role-tabs" aria-label="调整的衣物"><button data-role="top" aria-pressed="true">上衣</button><button data-role="bottom" aria-pressed="false">下装</button></nav><div id="outfit-summary"></div>
<details id="garment-selector" class="selector-box" open><summary><span>选择版型与材质</span><span class="fold-label">收起 −</span></summary><div class="selector-content"><nav class="selection-tabs" aria-label="服装选择步骤"><button data-step="patterns" aria-selected="true">01 版型</button><button data-step="materials" aria-selected="false">02 材质</button></nav><div class="catalog-tools"><span id="catalog-caption">上衣版型</span><span id="catalog-count"></span></div><nav id="fabric-filters" aria-label="材质分类" hidden><button data-family="all" aria-pressed="true">全部</button><button data-family="denim">牛仔</button><button data-family="knit">针织</button><button data-family="leather">皮革</button></nav><div id="pattern-cards" class="card-grid"></div><div id="fabric-cards" class="card-grid" hidden></div><p class="selection-hint" id="selection-progress">缩略图均为人物上的实际三维效果。</p><button id="next-step" class="primary">下一步 · 选材质 →</button></div></details>
<section class="parameter-section"><div class="section-heading"><div><small>DETAILS</small><h2 id="parameter-title">上衣参数</h2></div><span id="parameter-family"></span></div><p id="parameter-context"></p><section class="parameter-box"><select id="edit-role" hidden aria-label="参数衣物"><option value="top">上衣</option><option value="bottom">下装</option></select><div id="parameter-fields"></div><p id="parameter-description"></p><button id="apply-parameters" class="primary" disabled>应用参数</button><div class="macro-buttons"><button id="material-closeup">查看当前材质特写 ↗</button></div></section></section>
<details class="lighting-section"><summary>棚拍灯光</summary><label class="field-label">光线<select id="studio-select"><option value="warm">冷暖棚拍</option><option value="cool">冷主暖边</option><option value="neutral">中性商品</option><option value="window">窗侧柔光</option></select></label><label class="field-label">亮度<input id="exposure" type="range" min="0.1" max="2" step="0.05" value="0.7"></label></details>
<details class="technical-drawer" hidden><summary>开发记录</summary><p id="runtime-note">正在载入。</p><p id="status" role="status">准备试衣台…</p><p id="physics-status"></p><pre id="provenance"></pre><section class="physics-box"></section></details>
</aside></main>
<div class="compatibility-controls" hidden><h2 id="look-name"></h2><span id="look-id"></span><div id="filters"></div><div id="looks"></div><div id="current-materials"></div><select id="top-material"></select><select id="bottom-material"></select><button id="restore"></button><button id="retry"></button><button id="save-settings"></button><button id="load-settings"></button><button id="cloth-preview"></button><button id="native-preview"></button><button id="physics-play"></button><button id="physics-tug"></button><button id="physics-settle"></button><button id="physics-step"></button><input id="gravity" type="checkbox" checked><input id="bend" value="1"><input id="clearance" value="4"><select id="motion-execution"><option value="realtime">实时动作</option><option value="test">逐帧检查</option></select><button data-motion="raise"></button><button data-motion="twist"></button><button data-motion="step"></button><button data-light="warm"></button><button data-light="cool"></button><button data-light="neutral"></button><button data-light="window"></button><button id="light-orbit"></button><button id="light-pause"></button><button id="light-studio"></button><button id="inspect-inside"></button><input id="light-angle" value="35"><input id="body-visible" type="checkbox" checked></div><div id="toast" role="status" hidden></div><script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script><script type="module" src="app.mjs"></script><script type="module" src="board-ui.mjs"></script><script type="module" src="live-ui.mjs"></script></body></html>
