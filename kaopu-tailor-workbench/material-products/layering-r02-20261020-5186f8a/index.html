div>\n  \u003c/header>\n\n  \u003cdiv class=\"layer-workspace\">\n    \u003caside class=\"layer-wardrobe\" aria-label=\"衣物清单\">\n      \u003cdiv class=\"layer-section-heading\">\n        \u003cdiv>\u003cspan class=\"layer-kicker\">OUTFIT\u003c/span>\u003ch2>这一套穿着\u003c/h2>\u003c/div>\n        \u003csvg class=\"layer-section-icon\" aria-hidden=\"true\">\u003cuse href=\"#layer-icon-layer\"/>\u003c/svg>\n      \u003c/div>\n      \u003cp class=\"layer-panel-note\">每件衣服独立保留。\u003cbr>选择一件，检查它的材料与接触。\u003c/p>\n\n      \u003cdiv class=\"layer-list-caption\">\u003cspan>独立衣物\u003c/span>\u003cspan>选择检查\u003c/span>\u003c/div>\n      \u003cdiv id=\"layer-list\" aria-label=\"已穿衣物列表\">\u003c/div>\n\n      \u003cdiv class=\"layer-add-block\">\n        \u003ch3>添加衣物\u003c/h3>\n        \u003cdiv class=\"layer-add-options\">\n          \u003cbutton id=\"add-inner\" type=\"button\">\u003csvg aria-hidden=\"true\">\u003cuse href=\"#layer-icon-plus\"/>\u003c/svg>\u003cspan>高领内搭\u003c/span>\u003cspan class=\"layer-button-meta\">内层\u003c/span>\u003c/button>\n          \u003cbutton id=\"add-outer\" type=\"button\">\u003csvg aria-hidden=\"true\">\u003cuse href=\"#layer-icon-plus\"/>\u003c/svg>\u003cspan>V领外层\u003c/span>\u003cspan class=\"layer-button-meta\">外层\u003c/span>\u003c/button>\n          \u003cbutton id=\"add-pants\" type=\"button\">\u003csvg aria-hidden=\"true\">\u003cuse href=\"#layer-icon-plus\"/>\u003c/svg>\u003cspan>原款短裤\u003c/span>\u003cspan class=\"layer-button-meta\">下装\u003c/span>\u003c/button>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"layer-selection-tools\">\n        \u003cbutton id=\"isolate-selected\" type=\"button\">\u003csvg aria-hidden=\"true\">\u003cuse href=\"#layer-icon-eye\"/>\u003c/svg>单独查看\u003c/button>\n        \u003cbutton id=\"all-visible\" type=\"button\">显示全部\u003c/button>\n        \u003cbutton id=\"remove-selected\" class=\"layer-remove\" type=\"button\">卸下所选衣物\u003c/button>\n      \u003c/div>\n\n      \u003cdiv class=\"layer-wardrobe-foot\">\n        \u003cdiv class=\"layer-small-rule\">\u003c/div>\n        \u003cp>独立版型，独立材料。\u003cbr>在同一次穿着中观察相互影响。\u003c/p>\n        \u003ca id=\"source-link\" href=\"https://haihao0307.github.io/guilin-dem-pipeline/kaopu-tailor-workbench/material-products/mp05-studio-r10-3fc034fa91ef/\" target=\"_blank\" rel=\"noopener noreferrer\">打开原裁缝总台\u003csvg aria-hidden=\"true\">\u003cuse href=\"#layer-icon-arrow\"/>\u003c/svg>\u003c/a>\n      \u003c/div>\n    \u003c/aside>\n\n    \u003cmain class=\"layer-view\" aria-label=\"三维穿着检查\">\n      \u003cdiv class=\"layer-view-heading\">\n        \u003cdiv>\u003cspan class=\"layer-kicker\">FITTING ROOM\u003c/span>\u003ch2>高领内搭 \u003cspan>×\u003c/span> V领外层\u003c/h2>\u003c/div>\n        \u003cp>各件独立 · 拖动/轻推检查接触\u003c/p>\n      \u003c/div>\n\n      \u003cdiv class=\"layer-stage-wrap\">\n        \u003cdiv id=\"layer-stage\" aria-label=\"可旋转的三维人物与衣物\">\n          \u003cdiv id=\"layer-loading\" role=\"status\" aria-live=\"polite\">\n            \u003cdiv class=\"layer-loading-card\">\n              \u003cspan class=\"layer-loader\" aria-hidden=\"true\">\u003c/span>\n              \u003cstrong id=\"load-text\">正在准备人物与衣物…\u003c/strong>\n              \u003cspan>准备完成后，即可检查独立衣层。\u003c/span>\n            \u003c/div>\n          \u003c/div>\n        \u003c/div>\n        \u003cnav class=\"layer-view-tools\" aria-label=\"观察视角\">\n          \u003cbutton id=\"view-front\" type=\"button\" title=\"正面观察\">正面\u003c/button>\n          \u003cbutton id=\"view-side\" type=\"button\" title=\"侧面观察\">侧面\u003c/button>\n          \u003cbutton id=\"view-back\" type=\"button\" title=\"背面观察\">背面\u003c/button>\n          \u003cspan aria-hidden=\"true\">\u003c/span>\n          \u003cbutton id=\"view-detail\" type=\"button\" title=\"靠近衣物观察\">近看衣层\u003c/button>\n        \u003c/nav>\n        \u003cdiv class=\"layer-stage-hint\" aria-hidden=\"true\">\u003cspan class=\"layer-hint-mouse\">\u003c/span>\u003cspan class=\"layer-navigation-hint\">普通拖动旋转 · 滚轮缩放\u003cbr> value=\"0\" aria-describedby=\"thickness-note\">\n          \u003cdiv class=\"layer-range-scale\" aria-hidden=\"true\">\u003cspan>无额外余量\u003c/span>\u003cspan>+6 mm\u003c/span>\u003c/div>\n          \u003cp id=\"thickness-note\" class=\"layer-field-note\">按实体纱线包络计算基础间隙；此处只增加接触余量。\u003c/p>\n        \u003c/div>\n        \u003cdiv class=\"layer-range-field\">\n          \u003cdiv class=\"layer-range-label\">\u003clabel for=\"friction\">衣间摩擦\u003c/label>\u003coutput id=\"friction-value\" for=\"friction\">0.30\u003c/output>\u003c/div>\n          \u003cinput id=\"friction\" type=\"range\" min=\"0\" max=\"1\" step=\"0.05\" value=\"0.3\">\n          \u003cdiv class=\"layer-range-scale\" aria-hidden=\"true\">\u003cspan>易滑动\u003c/span>\u003cspan>阻力较大\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/section>\n\n      \u003csection class=\"layer-control-section\">\n        \u003cdiv class=\"layer-subheading\">\u003ch3>布料模拟\u003c/h3>\u003cspan>观察相互作用\u003c/span>\u003c/div>\n        \u003cbutton id=\"play\" class=\"layer-primary\" type=\"button\">开始布料模拟\u003c/button>\n        \u003cdiv class=\"layer-two-buttons\">\u003cbutton id=\"reset\" type=\"button\">\u003csvg aria-hidden=\"true\">\u003cuse href=\"#layer-icon-reset\"/>\u003c/svg>重新穿着\u003c/button>\u003cbutton id=\"step\" type=\"button\">推进一步\u003c/button>\u003c/div>\n\n        \u003cdiv class=\"layer-range-field layer-wind-field\">\n          \u003cdiv class=\"layer-range-label\">\u003clabel for=\"wind\">风力\u003c/label>\u003coutput id=\"wind-value\" for=\"wind\">0.0\u003c/output>\u003c/div>\n          \u003cinput id=\"wind\" type=\"range\" min=\"0\" max=\"2\" step=\"0.1\" value=\"0\">\n          \u003cdiv class=\"layer-range-scale\" aria-hidden=\"true\">\u003cspan>无风\u003c/span>\u003cspan>较强\u003c/span>\u003c/div>\n        \u003c/div>\n\n        \u003cdiv class=\"layer-touch-actions\">\u003cbutton id=\"tug\" type=\"button\">轻拉所选衣摆\u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/button>\u003cbutton id=\"push\" type=\"button\">轻推外层\u003cspan aria-hidden=\"true\">↘\u003c/span>\u003c/button>\u003c/div>\n      \u003c/section>\n\n      \u003csection class=\"layer-control-section layer-check-section\">\n        \u003ch3>检查方式\u003c/h3>\n        \u003clabel class=\"layer-check\">\u003cinput id=\"exploded\" type=\"checkbox\">\u003cspan>分开查看衣层\u003c/span>\u003c/label>\n        \u003clabel class=\"layer-check\">\u003cinput id=\"contacts\" type=\"checkbox\">\u003cspan>显示残余接触样本\u003c/span>\u003c/label>\n        \u003clabel class=\"layer-check\">\u003cinput id=\"cloth-contact\" type=\"checkbox\" checked>\u003cspan>衣物间碰撞\u003c/span>\u003cspan class=\"layer-check-tag\">参与模拟\u003c/span>\u003c/label>\n        \u003clabel class=\"layer-check\">\u003cinput id=\"render-demand\" type=\"checkbox\" checked>\u003cspan>按需更新画面\u003c/span>\u003cspan class=\"layer-check-tag\">节省显示计算\u003c/span>\u003c/label>\n        \u003cp class=\"layer-field-note\">单独查看时暂缓隐藏衣物的画面更新；各件衣服仍共同参与碰撞。\u003c/p>\n        \u003cp id=\"render-work\" class=\"layer-work-count\" aria-live=\"off\">等待显示更新数据。\u003c/p>\n        \u003cbutton id=\"audit-contact\" type=\"button\">检查当前接触\u003c/button>\n      \u003c/section>\n\n      \u003cdetails id=\"help\" class=\"layer-help\">\n        \u003csummary>\u003csvg aria-hidden=\"true\">\u003cuse href=\"#layer-icon-info\"/>\u003c/svg>\u003cspan>研究说明与验证边界\u003c/span>\u003cspan class=\"layer-chevron\" aria-hidden=\"true\">⌄\u003c/span>\u003c/summary>\n        \u003cdiv class=\"layer-help-content\">\n          \u003cp>每件衣物保留独立对象、材料与形变。这里研究的是衣物穿在一起之后的接触关系。\u003c/p>\n          \u003cp>初始穿着顺序与运动中的碰撞需要分别处理。接触基础间隙按原实体纱线的几何包络计算，滑杆只增加余量。这不是现实织物的实测厚度。\u003c/p>\n          \u003cp>当前摩擦采用切向相对位移阻尼近似。普通接触按实际距离处理，真实穿越才保留恢复方向；碰撞检查覆盖部分线性点面与边边穿越，人体接触还检查布面内部的最近特征。尚不具备完整连续碰撞、自碰撞或高速动作保证。\u003c/p>\n          \u003cp>“本批接触约束”统计最近一批求解遇到的约束；橙点只显示本步最终复测仍有残余的样本。两者不一一对应，未显示样本不代表全部表面没有相交。\u003c/p>\n          \u003cp>本轮限定两种上衣与原款短裤、静止人物；上身两层叠穿。三件衣物分别保留对象，并参与同一模拟流程。连续防穿插、任意动作和其他衣物组合仍待验证。\u003c/p>\n          \u003cp>按需更新不改变布料求解、实体纱线或采样质量。看不见但仍接触外层的布料继续运算；针织孔隙、袖口和领口可能露出内层，因此未按“被外套盖住”直接删除内层几何。关闭此开关可在同一场景比较重复显示更新的开销。\u003c/p>\n          \u003cp>“检查当前接触”只复测当前衣形与接触余量，不推进模拟。卸下衣物会释放其显示对象，并把对应物理内存留作后续穿着复用；单独查看只是隐藏画面，衣物仍在穿着中。\u003c/p>\n          \u003cdiv class=\"layer-help-links\">\u003ca href=\"https://support.clo3d.com/hc/en-us/articles/115000294487-Use-Layer-Drape-Additional-Garment\" target=\"_blank\" rel=\"noopener noreferrer\">CLO · 初始层序\u003c/a>\u003ca href=\"https://www.sidefx.com/docs/houdini/nodes/sop/vellumsolver.html\" target=\"_blank\" rel=\"noopener noreferrer\">Vellum · 层间接触\u003c/a>\u003c/div>\n          \u003ch4>当前诊断\u003c/h4>\n          \u003cpre id=\"diagnostics\" aria-live=\"polite\">等待模拟数据。\u003c/pre>\n        \u003c/div>\n      \u003c/details>\n    \u003c/aside>\n  \u003c/div>\n\u003c/section>\n\n\u003cscript type=\"module\" src=\"./app.mjs\">\u003c/script>\n\u003c/body>"]];
