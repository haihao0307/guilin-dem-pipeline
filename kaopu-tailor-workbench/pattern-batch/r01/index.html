<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>服装版型 · 整批工作台</title><link rel="stylesheet" href="style.css"></head>
<body><header><div class="brand"><span class="brand-mark">裁</span><div><div class="eyebrow">KAOPU / PATTERN COLLECTION</div><h1>服装版型</h1></div></div><div class="header-actions"><span id="summary" role="status">正在读取版型…</span><button id="export-all" class="primary" disabled>导出全部版型</button></div></header>
<main><section class="intro"><div><p class="eyebrow">从一片布开始</p><h2>先把版型做完整。</h2><p>上装、裤装、半裙与连体组合。查看真实裁片，以及它们如何连接。</p></div><div class="phase"><span class="phase-current">01 版型与裁片</span><span>02 叠穿关系</span><span>03 布料与动态</span></div></section>
<section class="collection"><div class="toolbar"><nav id="categories" aria-label="服装类别"></nav><label class="search"><span>搜索</span><input id="search" placeholder="款式名称或编号" aria-label="搜索款式"></label></div><div class="results-line"><span id="results"></span><span>参考尺码 · 二维纸样</span></div><div id="gallery" class="gallery"></div><p id="empty" hidden>没有找到这个款式。</p></section>
<footer>裁片保持原尺寸与曲线。当前验收范围为二维纸样及连接结构；三维布料问题保留到后续阶段。</footer></main>
<dialog id="detail" aria-labelledby="detail-title"><div class="detail-top"><div><p class="eyebrow" id="detail-category"></p><h2 id="detail-title"></h2></div><button id="close-detail" class="icon" aria-label="关闭详情">×</button></div><div class="detail-grid"><div class="paper-stage"><div id="paper"></div><div class="paper-controls"><label><input type="checkbox" id="show-seams" checked>接缝与自由边</label><label><input type="checkbox" id="show-grain">布纹方向</label><button id="fit-paper">重置视图</button></div></div><aside class="detail-info"><p id="intent"></p><dl id="piece-stats"></dl><div class="legend"><span><i class="sewn"></i>配对缝边</span><span><i class="free"></i>保留的自由边</span></div><p id="seam-hint" class="hint">点击一条缝边，查看配对裁片。</p><div id="seam-info" aria-live="polite"></div><div class="detail-actions"><button id="export-svg" class="primary">导出二维 SVG</button><button id="export-json">导出当前版型</button><button id="import-toggle">检查导入的版型</button><input id="import-file" type="file" accept="application/json,.json" hidden></div><details><summary>范围与来源</summary><div id="source-info"></div></details><p class="hint">净缝线纸样，尚未加入真实缝份。自由边保留，不代表折边和包边已经完成。</p></aside></div></dialog>
<div id="toast" role="status" hidden></div><script type="module" src="app.mjs"></script></body></html>
