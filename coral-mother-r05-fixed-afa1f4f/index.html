mit),()=>textFetch('https://haihao0307.github.io/guilin-dem-pipeline/'+base+'/'+name+'?v='+commit),async()=>{const u='https://api.github.com/repos/haihao0307/guilin-dem-pipeline/contents/'+base+'/'+name+'?ref=gh-pages';const r=await fetch(u,{cache:'no-store',signal:timeout(12000),headers:{Accept:'application/vnd.github+json'}});if(!r.ok)throw new Error(r.status+' '+u);const j=await r.json();return atob(String(j.content||'').replace(/\s+/g,''))}];let last;for(const run of tries){try{return (await run()).trim()}catch(e){last=e}}throw last||new Error('all mirrors failed: '+name)}try{let s='';for(let i=0;i<N;i++){const name='coral-runtime-'+String(i).padStart(2,'0')+'.b64';status.textContent='载入函数形体核 '+(i+1)+' / '+N;s+=await part(name);bar.style.width=(8+(i+1)/N*82)+'%'}const clean=s.replace(/\s+/g,'');const bin=Uint8Array.from(atob(clean),c=>c.charCodeAt(0));if(typeof DecompressionStream==='undefined')throw new Error('浏览器不支持 DecompressionStream');status.textContent='解压并启动工作台';const html=await new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'))).text();bar.style.width='100%';document.open();document.write(html);document.close()}catch(e){document.querySelector('.m').style.display='none';document.getElementById('title').textContent='Coral Mother R05 启动失败';status.textContent='已启用三路重试，但仍未取得运行数据';err.textContent=String(e&&e.message||e);console.error(e)}})();</script></body></html>
