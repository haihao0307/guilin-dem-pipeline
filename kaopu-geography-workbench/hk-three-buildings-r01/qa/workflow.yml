name: HK three measured buildings material trial QA
on:
  push:
    branches: ['qa/hk-three-buildings-r01-20261015']
    paths:
      - 'kaopu-geography-workbench/hk-three-buildings-r01/**'
      - '.github/workflows/hk-three-buildings-r01.yml'
permissions:
  contents: read
concurrency:
  group: hk-three-buildings-r01-${{ github.ref }}
  cancel-in-progress: false
jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: kaopu-geography-workbench/hk-three-buildings-r01
      - name: Install pinned browser runner
        run: |
          npm install --prefix "$RUNNER_TEMP/runner" --no-save --ignore-scripts --no-audit --no-fund playwright@1.57.0
          echo "NODE_PATH=$RUNNER_TEMP/runner/node_modules" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/runner/node_modules/.bin/playwright" install --with-deps chromium
          sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Check JavaScript syntax and scope
        run: |
          node --check kaopu-geography-workbench/hk-three-buildings-r01/qa/browser.cjs
          THREE_MODULE="$PWD/kaopu-geography-workbench/hk-three-buildings-r01/viewer/vendor/three.module.js" node kaopu-geography-workbench/hk-three-buildings-r01/geometry/test_reconstruction.mjs
          node --test kaopu-geography-workbench/hk-three-buildings-r01/viewer/tests/*.mjs
          python kaopu-geography-workbench/hk-three-buildings-r01/qa/check_package.py
          node kaopu-geography-workbench/hk-three-buildings-r01/qa/benchmark-reconstruction.mjs
      - name: Final focused shadow and close-view browser acceptance
        run: node kaopu-geography-workbench/hk-three-buildings-r01/qa/review-shadow.cjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: hk-three-buildings-r01-${{ github.sha }}
          path: kaopu-geography-workbench/hk-three-buildings-r01/evidence
          if-no-files-found: error
          retention-days: 14
