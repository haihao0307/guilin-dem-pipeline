<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>三栋建筑 · 构件淡色形体检查</title><link rel="stylesheet" href="semantic-style.css"></head><body><header><strong>三栋建筑 · 构件淡色检查</strong><span>淡色区分类别 · 保留原形体明暗 · 不调材质</span></header><main><aside><label>建筑<select id="case"><option value="lowrise">喇沙利道33號</option><option value="kcc">龍總大廈</option><option value="warehouse">協記貨倉第二倉</option></select></label><div id="legend"></div><div class="buttons quick"><button data-class="wall">看墙 / 厚度</button><button data-class="floor">看楼板</button><button data-class="roof">看屋顶</button><button data-class="door">看门</button><button data-class="window">看窗</button></div><p class="warning">墙 / 屋面源面是朝向推定，未确认结构。楼板、楼梯及内构为原有设计，不冒充实测。柱、梁没有已识别对象，不补造。</p><div class="buttons"><button data-view="whole">原形体全貌</button><button data-view="cut">整栋剖开</button><button data-view="source">完整源外壳</button><button data-view="design">仅原有内构</button><button data-view="level">选中楼层</button><button id="plan" data-view="plan">龍總资料平面</button></div><label>设计楼层<select id="floor"></select></label><label>剖切位置<input type="range" id="cutPosition" min="0" max="1" step=".02" value=".5"></label><button id="reset">恢复视角</button><p id="scope"></p><hr><label>构件分类<select id="classFilter"><option value="">全部类别</option></select></label><label>实际对象<select id="objects"></select></label><button id="inspect">标出所选构件 / 归属</button><button id="focus">拉近查看所选构件</button><p>单击3D构件可标边并读取原 hit ID。拖动旋转，滚轮缩放，Shift拖动平移。</p><pre id="selected">选择构件查看身份与证据。</pre></aside><article><div id="viewport"><canvas id="view"></canvas><div id="loading">正在加载原函数几何…</div></div><p id="status" role="status"></p><p id="counts"></p><p id="note">淡色只表达类别；中性明暗与边线仅帮助看形体，不是材质效果。灰色为 UNKNOWN。玻璃暂按窗类别不透明显示。源壳是零厚面，实际墙厚未知；已有实体的设计厚度在选中说明里显示。</p></article></main><script type="module" src="semantic-app.mjs"></script></body></html>
