<!doctype html><meta charset="utf-8"><canvas id="view"></canvas><script type="module">
import {controllerFor} from '../whole-building-ground-r01/controller.mjs';
import {WholeRenderer} from '../whole-building-floor-study-r01/renderer.mjs';
import {deriveEvidenceFloorPlan} from '../whole-building-floor-study-r01/floor-layout.mjs';
import {deriveMeasuredCase} from '../r07/cases.mjs';import {profileFor} from '../r07/profiles.mjs';
import {buildFloorMaterialProbeShader,FLOOR_PROBE_VERTEX_GLSL,FLOOR_GPU_PROBES,verifyFloorMaterialReadback,verifyFloorMaterialProbeVariation} from '../floor-materials-r01/gpu-probe.mjs';
import {PERIODIC_COVERAGE_GLSL,periodicBox2D} from '../floor-materials-r01/periodic-coverage.mjs';
const api=window.probe={ready:true};
api.setup=async()=>{const profile=profileFor('kcc'),score=await(await fetch(new URL(profile.scoreUrl,new URL('../r07/profiles.mjs',location.href)))).json(),official=await(await fetch('../r07/sources/official-footprints.json')).json(),registration=await(await fetch('../whole-building-floor-study-r01/sources/plan-registration.json')).json();const measured=deriveMeasuredCase(score),base=controllerFor('kcc').derive(measured,official);api.study=deriveEvidenceFloorPlan(base,measured,{registration});api.renderer=new WholeRenderer(document.getElementById('view'));api.renderer.setModel(api.study.evidenceModel,measured);Object.assign(api.renderer.options,{eye:[-18,22,18],target:[-5,0,0],cut:false,sliceY:null});return {compile:api.renderer.compileStats,metadata:api.study.metadata,validation:api.study.validation,bounds:api.study.evidenceModel.bounds};};
api.draw=async(width=160)=>{const r=api.renderer,stats=await r.render({width,height:Math.floor(width*.85),presentWidth:width,presentHeight:Math.floor(width*.85),source:false,design:true,tileSize:96});return {stats,error:r.gl.getError()};};
api.materialProbe=()=>{const g=api.renderer.gl,shaders=[];for(const[type,text]of[[g.VERTEX_SHADER,FLOOR_PROBE_VERTEX_GLSL],[g.FRAGMENT_SHADER,buildFloorMaterialProbeShader()]]){const s=g.createShader(type);g.shaderSource(s,text);g.compileShader(s);if(!g.getShaderParameter(s,g.COMPILE_STATUS))throw Error(g.getShaderInfoLog(s));shaders.push(s);}const p=g.createProgram();shaders.forEach(s=>g.attachShader(p,s));g.linkProgram(p);if(!g.getProgramParameter(p,g.LINK_STATUS))throw Error(g.getProgramInfoLog(p));const fb=g.createFramebuffer(),textures=[];g.bindFramebuffer(g.FRAMEBUFFER,fb);for(let i=0;i<4;i++){const t=g.createTexture();g.bindTexture(g.TEXTURE_2D,t);g.texImage2D(g.TEXTURE_2D,0,g.RGBA32F,1,1,0,g.RGBA,g.FLOAT,null);g.texParameteri(g.TEXTURE_2D,g.TEXTURE_MIN_FILTER,g.NEAREST);g.texParameteri(g.TEXTURE_2D,g.TEXTURE_MAG_FILTER,g.NEAREST);g.framebufferTexture2D(g.FRAMEBUFFER,g.COLOR_ATTACHMENT0+i,g.TEXTURE_2D,t,0);textures.push(t);}g.drawBuffers([0,1,2,3].map(i=>g.COLOR_ATTACHMENT0+i));g.useProgram(p);g.viewport(0,0,1,1);g.bindVertexArray(api.renderer.vao);const out={};for(const q of FLOOR_GPU_PROBES){for(const[k,v]of Object.entries({uRole:q.role,uFp:q.footprintM,uObject:q.objectId}))g.uniform1f(g.getUniformLocation(p,k),v);g.uniform3fv(g.getUniformLocation(p,'uPoint'),q.point);g.uniform3fv(g.getUniformLocation(p,'uN'),q.normal);g.drawArrays(g.TRIANGLES,0,3);const channels=[0,1,2,3].map(i=>{g.readBuffer(g.COLOR_ATTACHMENT0+i);const a=new Float32Array(4);g.readPixels(0,0,1,1,g.RGBA,g.FLOAT,a);return [...a];});out[q.name]=verifyFloorMaterialReadback(q,channels);}verifyFloorMaterialProbeVariation(out);g.bindFramebuffer(g.FRAMEBUFFER,null);g.deleteFramebuffer(fb);textures.forEach(t=>g.deleteTexture(t));shaders.forEach(s=>g.deleteShader(s));g.deleteProgram(p);return{samples:out,error:g.getError()};};

api.coverageProbe=()=>{const g=api.renderer.gl,N=256,params=[];for(let i=0;i<N;i++)params.push({uv:[Math.sin(i*2.31)*31,Math.cos(i*.73)*31],width:[.004+Math.abs(Math.sin(i))*.12,.004+Math.abs(Math.cos(i*2))*.2]});
 const source='#version 300 es\nprecision highp float;precision highp int;\n'+PERIODIC_COVERAGE_GLSL+'\nuniform sampler2D uSamples;out vec4 result;void main(){vec4 p=texelFetch(uSamples,ivec2(int(gl_FragCoord.x),0),0);result=vec4(pcBox2D(p.xy,vec2(.198,.048),vec2(.003),p.zw),1.);}';
 const shaders=[];for(const [type,src]of [[g.VERTEX_SHADER,FLOOR_PROBE_VERTEX_GLSL],[g.FRAGMENT_SHADER,source]]){const s=g.createShader(type);g.shaderSource(s,src);g.compileShader(s);if(!g.getShaderParameter(s,g.COMPILE_STATUS))throw Error(g.getShaderInfoLog(s));shaders.push(s);}const program=g.createProgram();shaders.forEach(s=>g.attachShader(program,s));g.linkProgram(program);if(!g.getProgramParameter(program,g.LINK_STATUS))throw Error(g.getProgramInfoLog(program));
 const textures=[],texture=(data)=>{const t=g.createTexture();textures.push(t);g.bindTexture(g.TEXTURE_2D,t);g.texImage2D(g.TEXTURE_2D,0,g.RGBA32F,N,1,0,g.RGBA,g.FLOAT,data);g.texParameteri(g.TEXTURE_2D,g.TEXTURE_MIN_FILTER,g.NEAREST);g.texParameteri(g.TEXTURE_2D,g.TEXTURE_MAG_FILTER,g.NEAREST);return t;};const data=new Float32Array(params.flatMap(p=>[...p.uv,...p.width])),input=texture(data),output=texture(null),fb=g.createFramebuffer();g.bindFramebuffer(g.FRAMEBUFFER,fb);g.framebufferTexture2D(g.FRAMEBUFFER,g.COLOR_ATTACHMENT0,g.TEXTURE_2D,output,0);g.drawBuffers([g.COLOR_ATTACHMENT0]);if(g.checkFramebufferStatus(g.FRAMEBUFFER)!==g.FRAMEBUFFER_COMPLETE)throw Error('coverage target');g.disable(g.SCISSOR_TEST);g.viewport(0,0,N,1);g.useProgram(program);g.bindVertexArray(api.renderer.vao);g.activeTexture(g.TEXTURE0);g.bindTexture(g.TEXTURE_2D,input);g.uniform1i(g.getUniformLocation(program,'uSamples'),0);g.drawArrays(g.TRIANGLES,0,3);const pixels=new Float32Array(N*4);g.readBuffer(g.COLOR_ATTACHMENT0);g.readPixels(0,0,N,1,g.RGBA,g.FLOAT,pixels);let maxError=0;for(let i=0;i<N;i++){const p=data.slice(i*4,i*4+4),ref=periodicBox2D([...p.slice(0,2)],[Math.fround(.198),Math.fround(.048)],Math.fround(.003),[...p.slice(2)]);maxError=Math.max(maxError,Math.abs(ref.coverage-pixels[i*4]));}if(maxError>.001)throw Error('coverage CPU/GPU difference '+maxError);g.bindFramebuffer(g.FRAMEBUFFER,null);g.deleteFramebuffer(fb);textures.forEach(t=>g.deleteTexture(t));shaders.forEach(s=>g.deleteShader(s));g.deleteProgram(program);return{samples:N,maxCoverageError:maxError,tolerance:.001,error:g.getError()};};

api.hitHash=async()=>{const r=api.renderer,g=r.gl,chunks=[];for(const tile of r.hitTiles){g.bindFramebuffer(g.FRAMEBUFFER,tile.target.fbo);for(let i=0;i<3;i++){g.readBuffer(g.COLOR_ATTACHMENT0+i);const a=new Float32Array(tile.width*tile.height*4);g.readPixels(tile.x,tile.y,tile.width,tile.height,g.RGBA,g.FLOAT,a);chunks.push(new Uint8Array(a.buffer));}}g.bindFramebuffer(g.FRAMEBUFFER,null);const all=new Uint8Array(chunks.reduce((s,c)=>s+c.length,0));let offset=0;for(const c of chunks){all.set(c,offset);offset+=c.length;}return Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',all))).map(b=>b.toString(16).padStart(2,'0')).join('');};
</script>
