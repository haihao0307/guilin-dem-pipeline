<!doctype html><meta charset="utf-8"><canvas id="view"></canvas><script type="module">
import{traceStairRails}from'../whole-building-r01/rails.mjs';import{WholeRenderer}from'../whole-building-floor-study-r01/renderer.mjs';import{deriveEvidenceFloorPlan}from'../whole-building-floor-study-r01/floor-layout.mjs';import{connectEvidenceStair,stairRoutePose}from'../whole-building-floor-study-r01/stair-connection.mjs';import{controllerFor}from'../whole-building-ground-r01/controller.mjs';import{deriveMeasuredCase}from'../r07/cases.mjs';import{profileFor}from'../r07/profiles.mjs';import{deriveAperture}from'../r07/apertures.mjs';
import{deriveLiftBinding,createBoundLift,liftFields,liftRouteEdges,canBoard,command,step}from'../whole-building-floor-study-r01/lift-host-binding.mjs';import{traceLiftFields}from'../whole-building-floor-study-r01/lift-field-pass.mjs';
const p=window.probe={ready:true},sha=async a=>Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',a))).map(v=>v.toString(16).padStart(2,'0')).join('');
p.setup=async()=>{const profile=profileFor('kcc'),score=await(await fetch(new URL(profile.scoreUrl,new URL('../r07/profiles.mjs',location.href)))).json(),official=await(await fetch('../r07/sources/official-footprints.json')).json();p.measured=deriveMeasuredCase(score);p.base=controllerFor('kcc').derive(p.measured,official);p.renderer=new WholeRenderer(document.getElementById('view'));p.scene();p.renderer.compileLift();return{gpu:p.renderer.gpu,compile:p.renderer.compileStats,validation:p.study.stairValidation};};
p.scene=({connected=true,windowOpenT=.32,doorOpenT=1}={})=>{const base=deriveEvidenceFloorPlan(p.base,p.measured,{upperFloor:{},windowOpenT});p.study=connected?connectEvidenceStair(base):base;if(doorOpenT!==1)p.study.evidenceModel.floorStudy.apertures=p.study.apertures.map(a=>{if(a.config.kind!=='door'||a.config.hingeOrSlider==='fixed')return a;const n=deriveAperture({...a.config,openT:doorOpenT});for(const q of n.primitives)q.materialRole=q.part==='glass'?6:q.part==='host'?11:q.part==='leaf'?14:13;return n;});p.renderer.setModel(p.study.evidenceModel,p.measured);Object.assign(p.renderer.options,{eye:[1,6.4,6],target:[-.6,1.5,1.65],fov:55*Math.PI/180,cut:false,sliceY:null});p.visible=['evidence-plan','evidence-upper-reference'];p.binding=deriveLiftBinding(p.study);p.lift=createBoundLift(p.binding);p.fields=liftFields(p.binding,p.lift);return{counts:p.study.evidenceModel.counts,railGroups:p.renderer.railGroups.length};};
p.draw=async({width=640,indexed=true,clip=false,shadow=true,diagnostic=0,enabled=true,cullTiles=true}={})=>{const r=p.renderer;Object.assign(r.options,{primitiveTileIndex:indexed,apertureTileIndex:indexed,boundedShadow:shadow,correctCoatG:true,diagnostic});const stats=await r.render({width,height:Math.floor(width*.85),presentWidth:width,presentHeight:Math.floor(width*.85),source:false,design:true,clipDesign:clip,tileSize:96,visibleFloorIds:p.visible,dynamicFields:enabled?p.fields:[],cullTiles}),g=r.gl,ids={},status={},buffers=[],unresolved=[];for(const tile of r.hitTiles){g.bindFramebuffer(g.FRAMEBUFFER,tile.target.fbo);for(let attachment=0;attachment<3;attachment++){g.readBuffer(g.COLOR_ATTACHMENT0+attachment);const a=new Float32Array(tile.width*tile.height*4);g.readPixels(tile.x,tile.y,tile.width,tile.height,g.RGBA,g.FLOAT,a);buffers.push(new Uint8Array(a.buffer));if(attachment===0)for(let i=0;i<a.length;i+=4){status[a[i+3]]=(status[a[i+3]]??0)+1;if(a[i+3]===3&&unresolved.length<96)unresolved.push({x:tile.x+(i/4)%tile.width,y:tile.y+Math.floor(i/4/tile.width),t:a[i]});if(a[i+3]===1)ids[a[i+1]]=(ids[a[i+1]]??0)+1;}}}g.bindFramebuffer(g.FRAMEBUFFER,null);const packed=new Uint8Array(buffers.reduce((n,a)=>n+a.length,0));let o=0;for(const b of buffers){packed.set(b,o);o+=b.length;}for(const q of unresolved){const norm=a=>{const l=Math.hypot(...a);return a.map(v=>v/l)},cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],f=norm(r.options.target.map((v,k)=>v-r.options.eye[k])),right=norm(cross(f,Math.abs(f[1])>.999?[0,0,1]:[0,1,0])),up=cross(right,f),height=Math.floor(width*.85),uv=[(2*(q.x+.5)-width)/height,(2*(q.y+.5)-height)/height];q.origin=r.options.eye;q.direction=norm(f.map((v,k)=>v+Math.tan(r.options.fov/2)*(uv[0]*right[k]+uv[1]*up[k])));q.cpu160=traceStairRails(p.study.railInstance,q.origin,q.direction);q.cpuDiagnostic2000=traceStairRails(p.study.railInstance,q.origin,q.direction,{maxSteps:2000});}const witnesses=width===640?[[284,482],[283,487]].map(([x,y])=>({x,y,hit:r.readHit(x,y)})):[];return{stats,ids,status,unresolved,witnesses,error:g.getError(),hitSha256:await sha(packed),rgbaSha256:await sha(r.readPixels())};};
p.fixtures=async controls=>{const r=p.renderer,old=structuredClone(r.options),out=[];try{for(const c of controls){Object.assign(r.options,{eye:c.origin,target:c.origin.map((v,k)=>v+c.direction[k]),fov:1e-8,cut:false,sliceY:null,boundedShadow:false});await r.render({width:33,height:33,presentWidth:33,presentHeight:33,source:false,design:true,tileSize:96,visibleFloorIds:p.visible});const hit=r.readHit(16,16),tolerance=c.expected.objectId===30000?.0005:.00005;if(Boolean(hit.status===1)!==c.expected.hit||hit.status===3||c.expected.hit&&(Math.abs(hit.t-c.expected.t)>tolerance||hit.objectId!==c.expected.objectId))throw Error('Stair GPU ray '+c.name+' '+JSON.stringify({hit,expected:c.expected}));out.push({name:c.name,expected:c.expected.hit?{t:c.expected.t,id:c.expected.objectId}:null,actual:hit});}return{points:out,error:r.gl.getError()};}finally{r.options=old;}};
p.walk=t=>{const a=stairRoutePose(p.study,t);Object.assign(p.renderer.options,{eye:a.eye,target:a.target,fov:60*Math.PI/180,cut:false,sliceY:null});return a;};

p.act=({action,seconds=0}={})=>{const accepted=action?command(p.lift,action):null;for(let t=0;t<seconds;t+=.02)step(p.lift,Math.min(.02,seconds-t));p.fields=liftFields(p.binding,p.lift);return{accepted,state:structuredClone(p.lift),edges:liftRouteEdges(p.binding,p.lift),fields:p.fields.length};};
p.camera=name=>{const r=p.renderer,b=p.binding,c=b.car.center;Object.assign(r.options,{cut:false,sliceY:null,fov:60*Math.PI/180});if(name==='lower')Object.assign(r.options,{eye:[c[0],1.6,.4],target:[c[0],1.2,-2.4]});else if(name==='upper')Object.assign(r.options,{eye:[c[0]+1.8,4.7,1.1],target:[c[0],4.2,-1.7]});else if(name==='inside')Object.assign(r.options,{eye:[c[0],p.lift.y+1.6,c[2]],target:[c[0],p.lift.y+1.3,.1]});else if(name==='shaft')Object.assign(r.options,{eye:[-.8,4.8,1.2],target:[c[0],2.5,-2.05],fov:52*Math.PI/180,cut:true,clipNormal:[0,0,-1],clipOffset:1.9});return structuredClone(r.options);};
p.dynamicFixtures=async()=>{const r=p.renderer,old={a:r.archetypes,p:r.apertures,g:r.railGroups,o:structuredClone(r.options)},out=[];r.archetypes=[];r.apertures=[];r.railGroups=[];try{const fixtures=[];for(const f of p.fields){const ro=[f.center[0],f.center[1],f.center[2]+f.half[2]+.2],rd=[0,0,-1];fixtures.push({name:f.id,ro,rd});}fixtures.push({name:'inside-solid',ro:p.fields.find(f=>f.kind==='car-wall').center,rd:[1,0,0]});for(const q of fixtures){const expected=traceLiftFields(p.fields,q.ro,q.rd);Object.assign(r.options,{eye:q.ro,target:q.ro.map((v,k)=>v+q.rd[k]),fov:1e-8,cut:false,sliceY:null,boundedShadow:false});await r.render({width:33,height:33,presentWidth:33,presentHeight:33,source:false,design:true,tileSize:96,visibleFloorIds:p.visible,dynamicFields:p.fields});const h=r.readHit(16,16);if(!expected||h.status!==1||h.objectId!==expected.objectId||Math.abs(h.t-expected.t)>.00002||h.normal.some((v,k)=>Math.abs(v-expected.normal[k])>.00001))throw Error(JSON.stringify({name:q.name,expected,h}));out.push({name:q.name,expected:{id:expected.objectId,t:expected.t,normal:expected.normal},actual:h});}return{controls:out,error:r.gl.getError()};}finally{r.archetypes=old.a;r.apertures=old.p;r.railGroups=old.g;r.options=old.o;}};

</script>
