<!doctype html><meta charset="utf-8"><canvas id="new"></canvas><canvas id="old"></canvas><script type="module">
import {controllerFor,groundFor} from '../whole-building-ground-r01/controller.mjs';
import {controllerFor as baseControllerFor} from '../whole-building-r02/mother-system.mjs';
import {WholeRenderer as GroundRenderer} from '../whole-building-ground-r01/renderer.mjs';
import {WholeRenderer as OldRenderer} from '../whole-building-mobile-r01/renderer.mjs';
import {deriveMeasuredCase} from '../r07/cases.mjs';import {profileFor} from '../r07/profiles.mjs';
const api=window.probe={ready:true};let current,base,measured,controller;
api.setup=async id=>{const profile=profileFor(id),score=await(await fetch(new URL(profile.scoreUrl,new URL('../r07/profiles.mjs',location.href)))).json(),official=await(await fetch('../r07/sources/official-footprints.json')).json();measured=deriveMeasuredCase(score);controller=controllerFor(id);current=controller.derive(measured,official);base=groundFor(current).baseModel;api.newRenderer=new GroundRenderer(document.getElementById('new'));api.oldRenderer=new OldRenderer(document.getElementById('old'));api.newRenderer.setModel(current,measured);api.oldRenderer.setModel(base,measured);return {caseId:id,compile:api.newRenderer.compileStats,basementIds:current.levels.filter(l=>!base.levels.some(b=>b.id===l.id)).map(l=>l.id),metadata:groundFor(current).metadata};};
const digest=async b=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',b))].map(x=>x.toString(16).padStart(2,'0')).join('');
api.sourceParity=async()=>{const b=measured.bounds,c=b.min.map((v,i)=>(v+b.max[i])/2),s=Math.max(...b.max.map((v,i)=>v-b.min[i])),camera={target:c,eye:[c[0]+s*.9,c[1]+s*.55,c[2]-s*1.1],cut:false,source:true,design:false,datum:{visible:false},sliceY:null};let out={};for(const[k,r]of[['old',api.oldRenderer],['ground',api.newRenderer]]){Object.assign(r.options,camera);const stats=await r.render({width:320,height:272,presentWidth:320,presentHeight:272,source:true,design:false});out[k]={sha:await digest(r.readPixels()),stats,error:r.gl.getError()};}return out;};
api.designRayParity=async()=>{const sys=groundFor(current),ids=sys.model.levels.filter(l=>!base.levels.some(b=>b.id===l.id)).map(l=>l.id);if(!ids.length)return {skipped:'no invented basement'};const b=current.bounds,c=b.min.map((v,i)=>(v+b.max[i])/2);c[1]=(current.levels[0].elevation+base.levels[0].elevation)/2;const r=api.newRenderer;Object.assign(r.options,{eye:[c[0]+20,c[1]+7,c[2]-23],target:c,cut:false,sliceY:null,datum:{visible:false},source:false,design:true});await r.render({width:160,height:136,presentWidth:160,presentHeight:136,source:false,design:true});const normalize=v=>{const n=Math.hypot(...v);return v.map(x=>x/n)},sub=(a,b)=>a.map((x,i)=>x-b[i]),cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],f=normalize(sub(r.options.target,r.options.eye)),right=normalize(cross(f,[0,1,0])),up=cross(right,f),out=[];for(const[x,y]of[[80,68],[48,40],[112,40],[48,95],[112,95]]){const u=(2*(x+.5)-160)/136,v=(2*(y+.5)-136)/136,tan=Math.tan(r.options.fov/2),d=normalize(f.map((a,i)=>a+tan*(u*right[i]+v*up[i])));const cpu=controller.ray(current,r.options.eye,d),gpu=r.readHit(x,y);out.push({pixel:[x,y],cpu,gpu});}return out;};
api.basementRayParity=async()=>{const sys=groundFor(current),out=[];for(const floor of sys.additions.levels){let p=null;const b=current.bounds;for(let iz=1;iz<9&&!p;iz++)for(let ix=1;ix<9&&!p;ix++){const q=[b.min[0]+(b.max[0]-b.min[0])*ix/10,floor.elevation-.05,b.min[2]+(b.max[2]-b.min[2])*iz/10],h=controller.query(current,q);if(h.inside&&h.floorId===floor.id)p=q;}if(!p)throw Error('No real basement slab witness');const origin=[p[0],floor.elevation-.8,p[2]],direction=[0,1,0],cpu=controller.ray(current,origin,direction,{maxDistance:2}),r=api.newRenderer;Object.assign(r.options,{eye:origin,target:origin.map((x,i)=>x+(i===1?1:0)),cut:false,sliceY:null,datum:{visible:false}});await r.render({width:1,height:1,presentWidth:1,presentHeight:1,tileSize:32,source:false,design:true});const gpu=r.readHit(0,0);out.push({floorId:floor.id,origin,cpu,gpu,error:r.gl.getError()});}return out;};
</script>
