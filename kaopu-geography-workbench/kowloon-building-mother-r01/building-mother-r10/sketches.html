<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>建筑 Mother · 三维规则草图</title><style>*{box-sizing:border-box}body{margin:0;background:#edf0f1;color:#283a40;font:16px/1.55 system-ui,sans-serif}main{max-width:1400px;margin:auto;padding:20px}h1{font-size:24px;margin:0}.note{color:#705c33;background:#f3ebd9;padding:9px 13px;border-radius:7px}button,select,input{font:inherit;padding:7px 10px;border:1px solid #acb9bd;border-radius:6px;background:#fff;color:#25383e}button{cursor:pointer}button.active{background:#d9e7e4;border-color:#648981}nav,.controls{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:16px}canvas{width:100%;height:560px;display:block;touch-action:none;background:#e9edf0;border:1px solid #c9d1d5;border-radius:9px}aside{background:#fff;border-radius:9px;padding:16px}pre{white-space:pre-wrap;font:13px/1.5 system-ui}#status{font-size:14px}label{display:inline-flex;align-items:center;gap:6px}input[type=number]{width:85px}.legend{font-size:14px;color:#53656b}.step{min-width:180px}@media(max-width:800px){main{padding:12px}.layout{grid-template-columns:1fr}canvas{height:440px}aside{min-height:140px}}</style><main><h1>建筑 Mother · 三维规则草图</h1><p class="note">独立规则示意，尺寸是假设，不是香港三栋楼的复刻或施工设计。原三栋楼和旧版不变。</p><nav><button data-case="cell" class="active">① 一个开间</button><button data-case="vertical">② 向上长两层</button><button data-case="connected">③ 横向扩展与通达</button></nav><div class="controls"><label>生长阶段 <select id="stage"><option value="1">1 基础</option><option value="2">2 基础梁</option><option value="3">3 立柱</option><option value="4" selected>4 搭梁</option><option value="5">5 楼板与屋顶</option><option value="6">6 楼梯 / 走廊 / 核心</option><option value="7">7 墙、门与窗</option></select></label><button id="previous">上一步</button><button id="next">下一步</button><button id="fit">完整显示</button><button id="cut">剖开查看</button><button id="roof">隐藏 / 显示屋顶</button></div><div class="controls"><label>底层示意层高 <input id="groundHeight" type="number" min="3" max="4.2" step="0.2" value="3.6">m</label><label>上层示意层高 <input id="typicalHeight" type="number" min="2.8" max="3.6" step="0.2" value="3">m</label><button id="door">开 / 关门</button><button id="lift">电梯示意：切换停层</button><button id="liftDoor">开 / 关电梯门</button></div><div class="layout"><section><canvas id="sketch"></canvas><p id="status">正在准备函数草图…</p><p class="legend">淡褐：柱　淡黄：梁　淡绿：板　淡紫：梯　淡粉：墙　淡蓝：窗 / 电梯。拖动旋转，滚轮缩放。点击构件检查归属和支承。</p></section><aside><strong id="caseTitle">一个开间</strong><p id="explain"></p><strong>构件关系</strong><pre id="selection">点击三维构件，不是贴图。</pre><details><summary>验证边界</summary><p>采用现有解析求交显示路线，无建筑三角网格。此页验证生成与空间关系，不证明真实结构、消防合规或电梯安全。电梯停层切换不是升降动力学。</p><pre id="checks"></pre></details></aside></div></main><script type="module" src="./sketch-viewer.mjs"></script></html>
