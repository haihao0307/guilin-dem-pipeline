<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Stone Money Island｜1944 日军小木船工作台</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101214;color:#edf1f3;font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif}#app{display:grid;grid-template-columns:300px 1fr;height:100%}aside{padding:15px;background:#171a1d;border-right:1px solid #343a3f;overflow:auto}main{position:relative;min-width:0;background:radial-gradient(circle at 50% 30%,#edf0f1,#c5cbd0);touch-action:none}canvas{width:100%;height:100%;display:block}h1{font-size:18px;margin:0 0 7px}.sub{font-size:12px;line-height:1.5;color:#aab2b8}.tags{margin:9px 0}.tag{display:inline-block;font-size:10px;padding:3px 7px;margin:0 5px 5px 0;border:1px solid #3e454a;border-radius:999px;background:#252a2e}section{border-top:1px solid #2e3438;margin-top:12px;padding-top:11px}h2{font-size:11px;letter-spacing:.08em;margin:0 0 8px;color:#d6dce0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}button{padding:8px 5px;border:1px solid #444c52;border-radius:6px;background:#272d31;color:#f3f5f6;cursor:pointer}button.active{background:#5b4932;border-color:#b99762}.toggle{display:flex;justify-content:space-between;align-items:center;margin:8px 0;font-size:12px}.row{margin:8px 0}label{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px}.val{color:#9ed7ff}input[type=range]{width:100%;accent-color:#c6a36a}input[type=checkbox]{accent-color:#c6a36a}.note{font-size:11px;color:#939ca3;line-height:1.45}#hud{position:absolute;left:12px;bottom:12px;padding:9px 11px;border:1px solid rgba(255,255,255,.18);border-radius:9px;background:rgba(6,8,10,.62);font-size:12px;line-height:1.45;backdrop-filter:blur(5px)}#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#d4d9dc;color:#20262a;z-index:2}#err{display:none;color:#ffd0d0;background:#321e20;border:1px solid #7d4547;border-radius:6px;padding:7px;font-size:11px;margin-top:8px}@media(max-width:720px){#app{grid-template-columns:1fr;grid-template-rows:1fr 230px}main{grid-row:1}aside{grid-row:2;border-right:0;border-top:1px solid #343a3f;padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:0 10px}aside>h1,aside>.sub,aside>.tags,aside>#err{grid-column:1/-1}section{margin-top:4px;padding-top:6px}}
</style></head><body><div id="app"><aside><h1>1944 日军小木船工作台</h1><div class="sub">小型、低舷、平艉、尖首，可乘三至四人。现代舷外机已去掉，换成旧式内置低速发动机、轴传动、三叶桨、艉外舵叶和舵柄；旭日旗位于船头高杆并随风摆动。</div><div class="tags"><span class="tag">STONE MONEY ISLAND</span><span class="tag">1944 PALAU</span><span class="tag">DIRECT WEBGL</span></div><div id="err"></div>
<section><h2>视角</h2><div class="grid"><button data-v="hero" class="active">总览</button><button data-v="top">俯视</button><button data-v="bow">船头旗杆</button><button data-v="stern">船尾转向</button><button data-v="engine">发动机</button><button data-v="side">侧面</button></div></section>
<section><h2>显示</h2><div class="toggle"><span>自动转台</span><input id="auto" type="checkbox"></div><div class="toggle"><span>网格地面</span><input id="grid" type="checkbox" checked></div><div class="toggle"><span>结构线检查</span><input id="wire" type="checkbox"></div><div class="toggle"><span>发动机防护盖</span><input id="cover" type="checkbox"></div><div class="toggle"><span>显示旗帜</span><input id="showFlag" type="checkbox" checked></div></section>
<section><h2>旗帜 / 风</h2><div class="row"><label><span>风速</span><span id="windVal" class="val">0.65</span></label><input id="wind" type="range" min="0" max="1.4" step=".01" value=".65"></div><div class="row"><label><span>旗杆高度</span><span id="poleVal" class="val">1.85 m</span></label><input id="pole" type="range" min="1.25" max="2.35" step=".01" value="1.85"></div></section>
<section><h2>结构</h2><div class="note">推进：内置低速机＋直轴三叶桨<br>转向：艉外舵叶＋木质舵柄<br>操作：左键旋转，右键平移，滚轮缩放；手机单指旋转、双指缩放。</div></section></aside>
<main id="view"><div id="loading">正在建立三维船体…</div><canvas id="c"></canvas><div id="hud">左键旋转 · 右键平移 · 滚轮缩放<br><span id="status">启动中</span></div></main></div>
<script src="core.js"></script><script src="app.js"></script></body></html>
