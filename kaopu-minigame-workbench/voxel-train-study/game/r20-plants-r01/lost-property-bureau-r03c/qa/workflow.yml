name: Bureau R03c orthogonal sign coordinate audit
on:
  push:
    branches: ['qa/bureau-r03c-arcaded-tower-20261011']
permissions:
  contents: read
jobs:
  bureau-webgpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01/lost-property-bureau-r03c
      - name: Install official pinned Playwright
        run: |
          npm install --prefix "$RUNNER_TEMP/wgpu" --no-save --ignore-scripts --no-audit --no-fund playwright@1.57.0
          "$RUNNER_TEMP/wgpu/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/wgpu/node_modules" >> "$GITHUB_ENV"
      - name: Source and inventory contracts
        run: |
          node kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01/lost-property-bureau-r03c/qa/source.test.mjs
          node --test kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01/lost-property-bureau-r03c/qa/inventory.test.mjs
      - name: Same-resolution orthogonal close view of procedural letters
        run: node kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01/lost-property-bureau-r03c/qa/sign-audit.cjs
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: bureau-r03c-sign-audit-${{ github.sha }}
          path: bureau-r03c-sign-audit/
          retention-days: 7
