<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KAOPU 函數房間 · WebGPU 檢查候選</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#1a272a;color:#ede7d6;font:14px system-ui}canvas{width:100%;height:100%;display:block;touch-action:none}#status{position:fixed;left:12px;top:12px;padding:10px;background:#102527dc;max-width:calc(100% - 48px);white-space:pre-wrap;border-radius:5px}nav{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:6px;max-width:96%;overflow:auto;padding:8px;background:#122729dd;border-radius:7px}button{white-space:nowrap;background:#354b47;color:#e5dfca;border:1px solid #899789;border-radius:4px;padding:9px}#failure{position:fixed;inset:0;padding:6vw;background:#1c2224;white-space:pre-wrap;overflow:auto}#failure[hidden]{display:none}</style><canvas id="c"></canvas><div id="status">準備原函數與 WebGPU…</div><nav><button data-view="room">完整房間</button><button data-view="door">門洞・石框</button><button data-view="window">玻璃・欄杆</button><button data-view="inside">木床・布料</button><button data-view="grazing">側角檢查</button><button id="age">切換新／舊</button><button id="debug">材質／法線</button></nav><pre id="failure" hidden></pre><script type="module" src="app.mjs"></script></html>
