name: Kowloon station R04 whole function QA
on:
  push:
    branches: ['qa/kowloon-station-r04-20261012']
permissions:
  contents: read
jobs:
  station-webgpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01/kowloon-station-r04
      - name: Source and field contracts
        run: node --test kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01/kowloon-station-r04/qa/source.test.mjs
      - name: Install official pinned GPU QA runner
        run: |
          npm install --prefix "$RUNNER_TEMP/station" --no-save --ignore-scripts --no-audit --no-fund playwright@1.57.0
          "$RUNNER_TEMP/station/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/station/node_modules" >> "$GITHUB_ENV"
      - name: Launch same commit whole station QA
        run: |
          mkdir -p "$RUNNER_TEMP/kowloon-r04"
          (
            set +e
            node kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01/kowloon-station-r04/qa/station-webgpu.cjs > "$RUNNER_TEMP/kowloon-r04/log" 2>&1
            echo "$?" > "$RUNNER_TEMP/kowloon-r04/exit"
          ) </dev/null >/dev/null 2>&1 &
          sleep 30
      - name: Preserve compiler and live progress diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: kowloon-station-r04-diagnostic-${{ github.sha }}
          path: kowloon-station-r04-results/receipt.json
          retention-days: 7
      - name: Await actual exterior frame
        run: |
          while [ ! -f kowloon-station-r04-results/exterior.png ]; do
            if [ -f "$RUNNER_TEMP/kowloon-r04/exit" ]; then cat "$RUNNER_TEMP/kowloon-r04/log"; exit 1; fi
            sleep 5
          done
          cat "$RUNNER_TEMP/kowloon-r04/log"
      - name: Preserve first complete station frame for review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: kowloon-station-r04-first-${{ github.sha }}
          path: |
            kowloon-station-r04-results/exterior.png
            kowloon-station-r04-results/receipt.json
          retention-days: 7
      - name: Finish same browser hall platform and material views
        run: |
          while [ ! -f "$RUNNER_TEMP/kowloon-r04/exit" ]; do sleep 5; done
          cat "$RUNNER_TEMP/kowloon-r04/log"
          exit "$(cat "$RUNNER_TEMP/kowloon-r04/exit")"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: kowloon-station-r04-${{ github.sha }}
          path: kowloon-station-r04-results/
          retention-days: 7
          compression-level: 0
