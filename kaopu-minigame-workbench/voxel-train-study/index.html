<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b2425"><title>KAOPU · 体素列车循环场景</title>
<link rel="stylesheet" href="./style.css">
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
</head>
<body>
<main id="stage" aria-label="实时三维体素列车循环场景">
  <canvas id="scene" aria-label="绿色柴油机车、燃料罐车与循环折返的轨道草地" tabindex="0"></canvas>
  <header class="masthead"><div><p class="eyebrow">KAOPU / 小游戏生产线</p><h1>体素列车</h1><p class="subtitle">循环场景复现研究 · R01</p></div><button id="aboutOpen" class="text-button" aria-expanded="false" aria-controls="about">参考与说明 ↗</button></header>
  <p id="loading" role="status">正在构建三维场景…</p>
  <section id="about" aria-label="参考与研究边界" hidden><button id="aboutClose" class="close" aria-label="关闭说明">×</button><h2>从画面，到实时三维</h2><p>参考 Thibault Simar / Voxelmade 的 Voxel train。机车、罐车、草地、轨道和拱桥均为独立编写的程序化模型。</p><p>已按原片 6 秒循环研究地景方向和桥的进出时序；仍是首轮复现，烟雾、灯光、几何细节和镜头有差异。</p><p>这里没有另加玩法。原作图像、视频及模型不随本页发布。</p><a href="https://www.voxelmade.com/portfolio-item/voxeltrain/" target="_blank" rel="noopener noreferrer">查看作者原作 ↗</a><p class="fine">Three.js r170 · MIT · <a href="./licenses/THREE-LICENSE.txt">许可</a></p></section>
  <footer class="controls"><div class="control-row"><button id="playPause" aria-label="暂停循环">Ⅱ <span>暂停</span></button><button id="resetView">↺ <span>原镜头</span></button><button id="rotate" aria-pressed="false">⤧ <span>自由观察</span></button><button id="smoke" aria-pressed="true">◌ <span>烟雾</span></button><label class="speed-label"><span>速度</span><select id="speed" aria-label="播放速度"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option></select></label></div><div class="timeline"><label for="time">循环</label><input id="time" type="range" min="0" max="6" step="0.01" value="0" aria-label="循环时间"><output id="timeValue" for="time">0.00 / 6 s</output></div><p id="hint">空格暂停 · R 回到原镜头</p></footer>
</main>
<script type="module" src="./app.mjs"></script>
</body></html>
