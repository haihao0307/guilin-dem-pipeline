<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="icon" type="image/svg+xml" href="./icon.svg">
<link rel="stylesheet" href="./style.css">

</head>
<body>
<main id="stage" aria-label="实时三维体素列车循环场景">
  <canvas id="scene" aria-label="绿色柴油机车、燃料罐车与循环折返的轨道草地" tabindex="0"></canvas>
  <header class="masthead"><div><p class="eyebrow"><a href="../" aria-label="返回小游戏生产线"><span class="full-workbench-label">← KAOPU / 小游戏生产线</span><span class="short-workbench-label" aria-hidden="true">← 小游戏生产线</span></a></p><h1>体素列车</h1><p class="subtitle">循环场景复现研究 · R01</p></div><nav class="view-actions" aria-label="视图与说明"><button id="layoutToggle" class="text-button" aria-label="切换到原版视图">原版视图</button><button id="fullscreenToggle" class="text-button" aria-label="进入全屏" aria-pressed="false">⛶ <span>全屏</span></button><button id="aboutOpen" class="text-button" aria-expanded="false" aria-controls="about"><span class="about-label">参考与说明</span><span class="about-short" aria-hidden="true">说明</span> ↗</button></nav></header>
  <p id="viewStatus" class="view-status" role="status" aria-live="polite" hidden></p>
  <p id="loading" role="status">正在构建三维场景…</p>
  <section id="about" aria-label="参考与研究边界" hidden><button id="aboutClose" class="close" aria-label="关闭说明">×</button><h2>从画面，到实时三维</h2><p>参考 Thibault Simar / Voxelmade 的 Voxel train。机车、罐车、草地、轨道和拱桥均为独立编写的程序化模型。</p><p>已按原片 6 秒循环研究地景方向和桥的进出时序；仍是首轮复现，烟雾、灯光、几何细节和镜头有差异。</p><p>这里没有另加玩法。原作图像、视频及模型不随本页发布。</p><a href="https://www.voxelmade.com/portfolio-item/voxeltrain/" target="_blank" rel="noopener noreferrer">查看作者原作 ↗</a><p class="fine">Three.js r170 · MIT · <a href="./licenses/THREE-LICENSE.txt">许可</a></p></section>
  <footer class="controls" data-expanded="false"><div class="control-row"><button id="playPause" aria-label="暂停循环">Ⅱ <span>暂停</span></button><div class="advanced-controls"><button id="resetView">↺ <span>原镜头</span></button><button id="rotate" aria-pressed="false">⤧ <span>自由观察</span></button><button id="smoke" aria-pressed="true">◌ <span>烟雾</span></button></div><label class="speed-label"><span>速度</span><select id="speed" aria-label="播放速度"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option></select></label><button id="toolsToggle" aria-label="展开控制工具" aria-controls="resetView rotate smoke" aria-expanded="false">⋯</button></div><div class="timeline"><label for="time">循环</label><input id="time" type="range" min="0" max="6" step="0.01" value="0" aria-label="循环时间"><output id="timeValue" for="time">0.00 / 6 s</output></div><p id="hint">空格暂停 · R 回到原镜头</p></footer>
</main>
<script type="module" src="./app.mjs"></script>
</body></html>
