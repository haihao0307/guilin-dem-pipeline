<title>小温州 V0.5.8 连续世界样板</title>
<style>
:root{--glass-x:50%;--glass-y:20%;--glass-flow:0deg;--safe-t:max(12px,env(safe-area-inset-top));--safe-r:max(12px,env(safe-area-inset-right));--safe-b:max(12px,env(safe-area-inset-bottom));--safe-l:max(12px,env(safe-area-inset-left));}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#91bad2;color:#f7fbff;font-family:Inter,"SF Pro Display","PingFang SC",system-ui,sans-serif}
#app,#world{position:fixed;inset:0;width:100%;height:100%}
#world{display:block;touch-action:none;outline:none}
.ui{position:fixed;z-index:20;pointer-events:none}
.glass{position:relative;overflow:hidden;background:linear-gradient(140deg,rgba(255,255,255,.24),rgba(255,255,255,.075) 42%,rgba(116,178,211,.10));border:1px solid rgba(255,255,255,.40);box-shadow:inset 0 1px 0 rgba(255,255,255,.42),inset 0 -1px 0 rgba(68,118,148,.16),0 16px 44px rgba(14,44,61,.20);backdrop-filter:blur(17px) saturate(1.28);-webkit-backdrop-filter:blur(17px) saturate(1.28);transform:translateZ(0)}
.glass::before{content:"";position:absolute;inset:-45%;pointer-events:none;background:radial-gradient(circle at var(--glass-x) var(--glass-y),rgba(255,255,255,.48),rgba(255,255,255,.10) 17%,transparent 38%),conic-gradient(from var(--glass-flow),transparent 0 32%,rgba(255,255,255,.16) 39%,transparent 47% 100%);mix-blend-mode:screen;transform:translate3d(var(--flow-x,0),var(--flow-y,0),0) rotate(var(--glass-flow));transition:transform .28s cubic-bezier(.2,.8,.2,1)}
#identity{left:var(--safe-l);top:var(--safe-t);padding:10px 13px 9px;border-radius:18px;min-width:154px;opacity:.97}
#identity b{display:block;font-size:14px;letter-spacing:.08em;font-weight:680;text-shadow:0 1px 8px rgba(14,35,48,.28)}
#identity span{display:block;margin-top:3px;font-size:10px;letter-spacing:.04em;color:rgba(245,252,255,.82)}
#quality{right:calc(var(--safe-r) + 60px);top:calc(var(--safe-t) + 2px);padding:7px 10px;border-radius:15px;font-size:10px;color:rgba(247,252,255,.88);opacity:0;transform:translateY(-6px);transition:opacity .25s,transform .25s}
#quality.show{opacity:.92;transform:none}
#menuBtn{pointer-events:auto;right:var(--safe-r);top:var(--safe-t);width:48px;height:48px;border-radius:24px;display:grid;place-items:center;border:0;color:#fff;cursor:pointer;transition:width .55s cubic-bezier(.22,.9,.2,1),height .55s cubic-bezier(.22,.9,.2,1),border-radius .55s cubic-bezier(.22,.9,.2,1),transform .22s}
#menuBtn:active{transform:scale(.94)}
#menuBtn i,#menuBtn i::before,#menuBtn i::after{display:block;width:18px;height:1.5px;background:rgba(255,255,255,.96);border-radius:2px;content:"";transition:transform .35s,opacity .25s}
#menuBtn i::before{transform:translateY(-5px)}#menuBtn i::after{transform:translateY(3.5px)}
#menuBtn.open i{background:transparent}#menuBtn.open i::before{transform:translateY(0) rotate(45deg)}#menuBtn.open i::after{transform:translateY(-1.5px) rotate(-45deg)}
#panel{pointer-events:auto;right:var(--safe-r);top:calc(var(--safe-t) + 58px);width:min(328px,calc(100vw - var(--safe-l) - var(--safe-r)));max-height:min(72vh,560px);padding:14px;border-radius:27px;opacity:0;transform:translate3d(12px,-22px,0) scale(.68);transform-origin:92% 0;clip-path:circle(3% at 92% 0);transition:opacity .28s,transform .58s cubic-bezier(.18,.9,.18,1),clip-path .58s cubic-bezier(.18,.9,.18,1);overflow:auto;overscroll-behavior:contain}
#panel.open{opacity:1;transform:none;clip-path:circle(145% at 92% 0)}
.panelTitle{font-size:12px;letter-spacing:.08em;font-weight:680;margin:2px 2px 10px;color:rgba(255,255,255,.95)}
.group{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-bottom:12px}
.group button{appearance:none;border:1px solid rgba(255,255,255,.26);background:rgba(16,55,76,.22);color:rgba(255,255,255,.92);min-height:42px;border-radius:15px;padding:8px 9px;font-size:12px;text-align:left;cursor:pointer;transition:transform .18s,background .25s,border-color .25s}
.group button:active{transform:scale(.96)}.group button.active{background:rgba(225,246,255,.23);border-color:rgba(255,255,255,.58)}
.readout{display:grid;grid-template-columns:1fr auto;gap:5px 12px;padding:9px 10px;border-radius:15px;background:rgba(6,35,51,.18);font-size:10px;line-height:1.45;color:rgba(240,249,253,.78)}
.readout strong{font-weight:620;color:#fff}
#hint{left:50%;bottom:var(--safe-b);transform:translateX(-50%);padding:8px 13px;border-radius:17px;font-size:10px;white-space:nowrap;opacity:.76;transition:opacity .5s}
#hint.hide{opacity:0}
#loading{inset:0;display:grid;place-items:center;background:linear-gradient(#8fb8d0,#d5e6df);z-index:50;transition:opacity .75s;pointer-events:auto}
#loading.done{opacity:0;pointer-events:none}
.loader{width:min(340px,82vw);padding:22px 24px;border-radius:28px;text-align:center;color:#f8fdff}
.loader b{display:block;font-size:18px;letter-spacing:.08em;margin-bottom:8px}.loader small{font-size:11px;color:rgba(255,255,255,.78)}
.progress{height:3px;background:rgba(255,255,255,.17);border-radius:3px;margin-top:16px;overflow:hidden}.progress i{display:block;width:8%;height:100%;background:rgba(255,255,255,.88);border-radius:3px;transition:width .4s}
@media(max-width:620px){#identity{min-width:0;padding:8px 11px;border-radius:16px}#identity b{font-size:12px}#identity span{font-size:9px}#menuBtn{width:44px;height:44px}#panel{top:calc(var(--safe-t) + 53px);max-height:73vh}#hint{font-size:9px;max-width:86vw;overflow:hidden;text-overflow:ellipsis}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important}}
</style>

const $=s=>document.querySelector(s);
const canvas=$('#world'), loading=$('#loading'), loadText=$('#loadText'), loadBar=$('#loadBar');
function progress(p,t){loadBar.style.width=Math.round(p*100)+'%'; if(t)loadText.textContent=t;}
async function gunzipB64(s){
  const raw=Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  if('DecompressionStream' in window){const ds=new DecompressionStream('gzip');return new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(ds)).arrayBuffer());}
  throw new Error('浏览器缺少 gzip 解码能力');
}
function i16(bytes){return new Int16Array(bytes.buffer,bytes.byteOffset,bytes.byteLength/2)}
function clamp(x,a,b){return Math.max(a,Math.min(b,x))}
function smooth(a,b,x){x=clamp((x-a)/(b-a),0,1);return x*x*(3-2*x)}
function hash2(x,z){return (Math.sin(x*0.000781+z*0.001173)*43758.5453)%1}

function sampleOverview(wx,wz){
  const fx=(wx/DATA.world.width+.5)*(DATA.overview.cols-1);
  const fz=(wz/DATA.world.depth+.5)*(DATA.overview.rows-1);
  const x0=clamp(Math.floor(fx),0,DATA.overview.cols-1), z0=clamp(Math.floor(fz),0,DATA.overview.rows-1);
  const x1=Math.min(DATA.overview.cols-1,x0+1), z1=Math.min(DATA.overview.rows-1,z0+1);
  const tx=clamp(fx-x0,0,1),tz=clamp(fz-z0,0,1);
  const a=overview[z0*DATA.overview.cols+x0],b=overview[z0*DATA.overview.cols+x1],c=overview[z1*DATA.overview.cols+x0],d=overview[z1*DATA.overview.cols+x1];
  return THREE.MathUtils.lerp(THREE.MathUtils.lerp(a,b,tx),THREE.MathUtils.lerp(c,d,tx),tz);
}

const terrainVertex=`
  varying vec3 vWorld; varying vec3 vN; varying float vFeather;
  attribute float feather;
  void main(){vWorld=(modelMatrix*vec4(position,1.)).xyz;vN=normalize(mat3(modelMatrix)*normal);vFeather=feather;gl_Position=projectionMatrix*viewMatrix*vec4(vWorld,1.);}`;
const terrainFragment=`
  precision highp float; varying vec3 vWorld; varying vec3 vN; varying float vFeather;
  uniform vec3 uSun; uniform vec3 uFog; uniform vec3 uCam; uniform float uDetail; uniform float uIsDetail; uniform float uTime;
  float h21(vec2 p){p=fract(p*vec2(123.34,345.45));p+=dot(p,p+34.345);return fract(p.x*p.y);}
  float n2(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h21(i),h21(i+vec2(1,0)),f.x),mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),f.x),f.y);}
  void main(){
    if(uIsDetail>.5){float a=vFeather*uDetail;float d=h21(gl_FragCoord.xy+floor(uTime*3.));if(d>a)discard;}
    float y=vWorld.y; float slope=1.-clamp(vN.y,0.,1.);
    float wet=1.-smoothstep(4.,34.,y); float alpine=smoothstep(650.,1150.,y);
    vec3 low=vec3(.255,.335,.190), mid=vec3(.315,.410,.225), rock=vec3(.38,.37,.31), high=vec3(.43,.45,.39);
    vec3 col=mix(low,mid,smoothstep(20.,360.,y)); col=mix(col,rock,smoothstep(.25,.72,slope)); col=mix(col,high,alpine*.65);
    float micro=(n2(vWorld.xz*.013)+.55*n2(vWorld.xz*.041)-.78); col*=.91+micro*.12; col=mix(col,vec3(.18,.30,.21),wet*.28);
    float ndl=max(dot(normalize(vN),normalize(uSun)),0.); float hemi=.36+.64*clamp(vN.y*.72+.28,0.,1.); col*=.48+ndl*.58+hemi*.24;
    float dist=distance(vWorld,uCam); float fog=1.-exp(-dist*dist*0.000000000095); col=mix(col,uFog,clamp(fog,0.,.78));
    gl_FragColor=vec4(col,1.);
  }`;
function terrainMaterial(isDetail){return new THREE.ShaderMaterial({vertexShader:terrainVertex,fragmentShader:terrainFragment,uniforms:{uSun:{value:new THREE.Vector3(.42,.82,.36).normalize()},uFog:{value:new THREE.Color(0xb8d2dc)},uCam:{value:camera.position},uDetail:{value:isDetail?0:1},uIsDetail:{value:isDetail?1:0},uTime:{value:0}},side:THREE.FrontSide})}

function buildOverview(){
  const r=DATA.overview.rows,c=DATA.overview.cols,w=DATA.world.width,d=DATA.world.depth;
  const pos=new Float32Array(r*c*3), feather=new Float32Array(r*c); let k=0;
  for(let z=0;z<r;z++)for(let x=0;x<c;x++){const i=z*c+x;const wx=(x/(c-1)-.5)*w,wz=(z/(r-1)-.5)*d;let y=overview[i];if(marine[i])y=Math.min(-3,y);else y=Math.max(.35,y);pos[k++]=wx;pos[k++]=y;pos[k++]=wz;feather[i]=1;}
  const idx=new Uint32Array((r-1)*(c-1)*6);k=0;
  for(let z=0;z<r-1;z++)for(let x=0;x<c-1;x++){const a=z*c+x,b=a+1,dd=(z+1)*c+x,e=dd+1;idx[k++]=a;idx[k++]=dd;idx[k++]=b;idx[k++]=b;idx[k++]=dd;idx[k++]=e;}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));g.setAttribute('feather',new THREE.BufferAttribute(feather,1));g.setIndex(new THREE.BufferAttribute(idx,1));g.computeVertexNormals();g.computeBoundingSphere();
  const m=terrainMaterial(false);const mesh=new THREE.Mesh(g,m);mesh.frustumCulled=true;scene.add(mesh);return mesh;
}
const overviewMesh=buildOverview();
progress(.56,'衔接洞头 12.5 米近域');

function buildDetail(){
  const r=DATA.detail.rows,c=DATA.detail.cols,s=DATA.detail.spacing,size=(c-1)*s,cx=DATA.detail.center[0],cz=DATA.detail.center[1];
  const pos=new Float32Array(r*c*3),feather=new Float32Array(r*c);let k=0;
  for(let z=0;z<r;z++)for(let x=0;x<c;x++){
    const i=z*c+x, u=x/(c-1)*2-1,v=z/(r-1)*2-1,wx=cx+u*size*.5,wz=cz+v*size*.5;
    const rr=Math.pow(Math.pow(Math.abs(u),4)+Math.pow(Math.abs(v),4),.25); const organic=.965+.018*Math.sin(u*13.7+v*7.1)+.012*Math.sin(u*29.2-v*17.4);
    const f=1-smooth(.76,organic,rr); const coarse=sampleOverview(wx,wz); const fine=detail[i]; const y=THREE.MathUtils.lerp(coarse,fine,f);
    pos[k++]=wx;pos[k++]=Math.max(.38,y);pos[k++]=wz;feather[i]=f;
  }
  const arr=[];
  for(let z=0;z<r-1;z++)for(let x=0;x<c-1;x++){const a=z*c+x,b=a+1,dd=(z+1)*c+x,e=dd+1;const av=(feather[a]+feather[b]+feather[dd]+feather[e])*.25;if(av>.004)arr.push(a,dd,b,b,dd,e);}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));g.setAttribute('feather',new THREE.BufferAttribute(feather,1));g.setIndex(arr);g.computeVertexNormals();g.computeBoundingSphere();
  const m=terrainMaterial(true);m.polygonOffset=true;m.polygonOffsetFactor=-1;m.polygonOffsetUnits=-1;
  const mesh=new THREE.Mesh(g,m);mesh.visible=false;mesh.frustumCulled=true;scene.add(mesh);return mesh;
}
const detailMesh=buildDetail();

// Physical sky
const skyGeo=new THREE.SphereGeometry(420000,32,16);
const skyMat=new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,uniforms:{uSunY:{value:.82},uMorning:{value:0}},vertexShader:`varying vec3 vD;void main(){vD=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,fragmentShader:`varying vec3 vD;uniform float uMorning;void main(){float h=clamp(vD.y*.5+.5,0.,1.);vec3 zen=mix(vec3(.24,.45,.67),vec3(.17,.38,.65),h);vec3 hor=mix(vec3(.88,.76,.61),vec3(.68,.82,.89),1.-uMorning);float band=pow(1.-abs(vD.y),5.);vec3 c=mix(hor,zen,smoothstep(0.,.72,h));c+=vec3(1.,.56,.28)*band*uMorning*.22;gl_FragColor=vec4(c,1.);}`});
const sky=new THREE.Mesh(skyGeo,skyMat);sky.frustumCulled=false;scene.add(sky);

// Flowing ocean, one continuous surface under terrain
const oceanGeo=new THREE.PlaneGeometry(DATA.world.width*1.28,DATA.world.depth*1.28,160,160);oceanGeo.rotateX(-Math.PI/2);
const oceanMat=new THREE.ShaderMaterial({transparent:false,depthWrite:true,uniforms:{uTime:{value:0},uCam:{value:camera.position},uSun:{value:new THREE.Vector3(.42,.82,.36).normalize()}},vertexShader:`uniform float uTime;varying vec3 vW;varying vec3 vN;void main(){vec3 p=position;float a=sin((p.x+p.z*.37)*.00145+uTime*.66);float b=sin((p.x*.34-p.z)*.0025-uTime*.82);float c=sin((p.x*.71+p.z)*.0041+uTime*1.07);p.y=-1.6+a*.55+b*.28+c*.12;float dx=cos((p.x+p.z*.37)*.00145+uTime*.66)*.0008+cos((p.x*.34-p.z)*.0025-uTime*.82)*.00024;float dz=cos((p.x+p.z*.37)*.00145+uTime*.66)*.0003-cos((p.x*.34-p.z)*.0025-uTime*.82)*.0007;vN=normalize(vec3(-dx,1.,-dz));vW=(modelMatrix*vec4(p,1.)).xyz;gl_Position=projectionMatrix*viewMatrix*vec4(vW,1.);}`,fragmentShader:`uniform vec3 uCam;uniform vec3 uSun;varying vec3 vW;varying vec3 vN;void main(){vec3 V=normalize(uCam-vW),N=normalize(vN);float fr=pow(1.-max(dot(V,N),0.),3.);float gl=pow(max(dot(reflect(-uSun,N),V),0.),90.);float d=clamp(length(uCam.xz-vW.xz)/180000.,0.,1.);vec3 c=mix(vec3(.025,.235,.325),vec3(.30,.58,.70),fr);c+=gl*vec3(1.,.91,.70)*.9;c=mix(c,vec3(.49,.69,.75),d*.26);gl_FragColor=vec4(c,1.);}`});
const ocean=new THREE.Mesh(oceanGeo,oceanMat);ocean.renderOrder=-1;scene.add(ocean);

// Clouds are world objects with fixed metre heights
function cloudTexture(){const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d');x.clearRect(0,0,256,256);for(let i=0;i<44;i++){const px=52+Math.random()*152,py=82+Math.random()*94,rr=18+Math.random()*42;const g=x.createRadialGradient(px-rr*.18,py-rr*.22,2,px,py,rr);g.addColorStop(0,'rgba(255,255,255,.9)');g.addColorStop(.42,'rgba(246,250,251,.66)');g.addColorStop(1,'rgba(230,240,243,0)');x.fillStyle=g;x.beginPath();x.arc(px,py,rr,0,Math.PI*2);x.fill();}return new THREE.CanvasTexture(c)}
const cloudTex=cloudTexture(),cloudGroup=new THREE.Group();scene.add(cloudGroup);const cloudItems=[];
const rng=(i)=>((Math.sin(i*127.1)*43758.5453)%1+1)%1;
for(let i=0;i<86;i++){const band=i%10<6?0:i%10<9?1:2;const h=band===0?900+rng(i+2)*1800:band===1?3200+rng(i+4)*3000:7600+rng(i+8)*2500;const mat=new THREE.SpriteMaterial({map:cloudTex,transparent:true,depthWrite:false,opacity:band===2?.18:.42,color:band===2?0xe9f0f5:0xffffff,fog:true});const sp=new THREE.Sprite(mat);const sx=(rng(i+13)-.5)*DATA.world.width*1.05,sz=(rng(i+31)-.5)*DATA.world.depth*1.02;sp.position.set(sx,h,sz);const sc=band===0?3600+rng(i+9)*6200:band===1?7000+rng(i+11)*10000:15000+rng(i+17)*17000;sp.scale.set(sc,sc*(.36+rng(i+3)*.18),1);sp.material.rotation=(rng(i+5)-.5)*.18;cloudGroup.add(sp);cloudItems.push({sp,band,baseX:sx,baseZ:sz})}

progress(.78,'配置移动端清晰画幅');
let qualityTimer=0,qualityMode='settled',lastCssW=0,lastCssH=0;
function applyResolution(mode,force=false){
  qualityMode=mode;const w=innerWidth,h=innerHeight,long=Math.max(w,h);let target=mode==='settled'?2048:1280;
  if(w>=1800&&h>=1000)target=Math.min(2560,long);const ratio=clamp(target/long,.72,2.75);
  if(force||w!==lastCssW||h!==lastCssH){renderer.setPixelRatio(ratio);renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();lastCssW=w;lastCssH=h;}
  else renderer.setPixelRatio(ratio),renderer.setSize(w,h,false);
  $('#bufferRead').textContent=renderer.domElement.width+' × '+renderer.domElement.height;
  $('#quality').textContent=mode==='settled'?'近景 '+Math.max(renderer.domElement.width,renderer.domElement.height)+' px 收敛':'交互响应模式';
  $('#quality').classList.add('show');clearTimeout(applyResolution.hide);applyResolution.hide=setTimeout(()=>$('#quality').classList.remove('show'),1300);
}
function markMoving(){WORLD.view.moving=true;WORLD.view.settled=false;applyResolution('interactive');clearTimeout(qualityTimer);qualityTimer=setTimeout(()=>{WORLD.view.moving=false;WORLD.view.settled=true;applyResolution('settled');},310)}
controls.addEventListener('start',markMoving);controls.addEventListener('change',()=>{clearTimeout(qualityTimer);qualityTimer=setTimeout(()=>{WORLD.view.moving=false;WORLD.view.settled=true;applyResolution('settled');},330)});controls.addEventListener('end',()=>{clearTimeout(qualityTimer);qualityTimer=setTimeout(()=>{WORLD.view.moving=false;WORLD.view.settled=true;applyResolution('settled');},180)});
addEventListener('resize',()=>applyResolution(qualityMode,true),{passive:true});applyResolution('settled',true);

const views={
 all:{name:'整个温州',target:new THREE.Vector3(0,120,0),pos:new THREE.Vector3(-DATA.world.width*.40,Math.max(DATA.world.width,DATA.world.depth)*.93,DATA.world.depth*.58)},
 approach:{name:'洞头接近',target:new THREE.Vector3(DATA.detail.center[0],80,DATA.detail.center[1]),pos:new THREE.Vector3(DATA.detail.center[0]-23500,17800,DATA.detail.center[1]+29800)},
 flight:{name:'1200 米飞行',target:new THREE.Vector3(DATA.detail.center[0]+1100,90,DATA.detail.center[1]-700),pos:new THREE.Vector3(DATA.detail.center[0]-7500,1290,DATA.detail.center[1]+10300)},
 coast:{name:'海岸低空',target:new THREE.Vector3(DATA.detail.center[0]+450,62,DATA.detail.center[1]-350),pos:new THREE.Vector3(DATA.detail.center[0]-1550,320,DATA.detail.center[1]+2600)}
};
camera.position.copy(views.all.pos);controls.target.copy(views.all.target);controls.update();
let flight=null;
function flyTo(key){const v=views[key];if(!v)return;WORLD.view.mode=key;flight={t:0,d:1.75,aPos:camera.position.clone(),bPos:v.pos.clone(),aTar:controls.target.clone(),bTar:v.target.clone()};document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===key));$('#viewRead').textContent=v.name;markMoving();}
function ease(x){return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2}

// Ray focus keeps one world and one camera
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();let lastTap=0;
canvas.addEventListener('pointerup',e=>{const now=performance.now();if(now-lastTap<330){const r=canvas.getBoundingClientRect();ndc.set((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1);ray.setFromCamera(ndc,camera);const hits=ray.intersectObjects([detailMesh,overviewMesh],false);if(hits[0]){const p=hits[0].point;flight={t:0,d:1.0,aPos:camera.position.clone(),bPos:camera.position.clone().lerp(p.clone().add(new THREE.Vector3(0,2500,3600)),.48),aTar:controls.target.clone(),bTar:p};markMoving();}}lastTap=now},{passive:true});

// Liquid glass follows pointer and world motion
addEventListener('pointermove',e=>{document.documentElement.style.setProperty('--glass-x',(e.clientX/innerWidth*100).toFixed(1)+'%');document.documentElement.style.setProperty('--glass-y',(e.clientY/innerHeight*100).toFixed(1)+'%')},{passive:true});
const menuBtn=$('#menuBtn'),panel=$('#panel');menuBtn.addEventListener('click',()=>{const open=!panel.classList.contains('open');panel.classList.toggle('open',open);menuBtn.classList.toggle('open',open);panel.setAttribute('aria-hidden',String(!open));});
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>flyTo(b.dataset.view)));
document.querySelectorAll('[data-cloud]').forEach(b=>b.addEventListener('click',()=>{WORLD.state.cloud=b.dataset.cloud;document.querySelectorAll('[data-cloud]').forEach(x=>x.classList.toggle('active',x===b));}));
document.querySelectorAll('[data-time]').forEach(b=>b.addEventListener('click',()=>{WORLD.state.time=b.dataset.time;document.querySelectorAll('[data-time]').forEach(x=>x.classList.toggle('active',x===b));skyMat.uniforms.uMorning.value=WORLD.state.time==='morning'?1:0;oceanMat.uniforms.uSun.value.set(WORLD.state.time==='morning'?-.65:.42,WORLD.state.time==='morning'?.32:.82,.36).normalize();terrainMaterial;}));

progress(.94,'校准全景到近景的连续关系');
let prev=performance.now(),elapsed=0,lastRender=0;
function animate(now){requestAnimationFrame(animate);const dt=Math.min(.05,(now-prev)/1000);prev=now;elapsed+=dt;
  if(flight){flight.t+=dt/flight.d;const q=ease(clamp(flight.t,0,1));camera.position.lerpVectors(flight.aPos,flight.bPos,q);controls.target.lerpVectors(flight.aTar,flight.bTar,q);if(flight.t>=1){flight=null;WORLD.view.moving=false;WORLD.view.settled=true;applyResolution('settled');}}
  controls.update();
  const cx=DATA.detail.center[0],cz=DATA.detail.center[1];const hd=Math.hypot(controls.target.x-cx,controls.target.z-cz);const total=hd+camera.position.y*.43;const act=1-smooth(28000,73000,total);detailMesh.visible=act>.006;detailMesh.material.uniforms.uDetail.value=act;
  overviewMesh.material.uniforms.uCam.value.copy(camera.position);detailMesh.material.uniforms.uCam.value.copy(camera.position);oceanMat.uniforms.uCam.value.copy(camera.position);
  overviewMesh.material.uniforms.uTime.value=elapsed;detailMesh.material.uniforms.uTime.value=elapsed;oceanMat.uniforms.uTime.value=elapsed;
  cloudGroup.visible=WORLD.state.cloud!=='clear';const cov=WORLD.state.cloud==='clear'?.18:1;for(let i=0;i<cloudItems.length;i++){const o=cloudItems[i],speed=o.band===2?12:o.band===1?8:5;o.sp.position.x=o.baseX+((elapsed*speed+i*37)%(DATA.world.width*1.18))-DATA.world.width*.59;o.sp.position.z=o.baseZ+Math.sin(elapsed*.018+i)*190;o.sp.material.opacity=(o.band===2?.16:.38)*cov*(camera.position.y>90000?.58:1);}
  document.documentElement.style.setProperty('--glass-flow',((elapsed*7+camera.rotation.y*40)%360).toFixed(1)+'deg');document.documentElement.style.setProperty('--flow-x',(Math.sin(elapsed*.55)*4).toFixed(1)+'px');document.documentElement.style.setProperty('--flow-y',(Math.cos(elapsed*.43)*3).toFixed(1)+'px');
  const cap=qualityMode==='settled'?30:45;if(now-lastRender<1000/cap)return;lastRender=now;renderer.render(scene,camera);
}
requestAnimationFrame(animate);
setTimeout(()=>{loading.classList.add('done');progress(1,'完成');setTimeout(()=>$('#hint').classList.add('hide'),5600)},420);
</script>
