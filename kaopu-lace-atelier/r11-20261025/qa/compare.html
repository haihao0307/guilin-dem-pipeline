1</button><a href="../index.html">打开三维工作台</a><a href="short-stitch-compare.html">查看九条针脚局部修复</a></div><p class="foot">R11 增加可关闭的不规则纤维表面。默认49条短裁切针脚仅调整内部拱高，其中9条为原有异常、40条为同判据预防调整；保持端点、XY、线径与三角形数量。真实样布、完整运动稳定性和多设备性能仍待验收。</p><p class="foot">截图对照用于查看差异；材质和结构参数请在独立三维工作台内调整。</p></main><script>const pairs={"backlight":{"label":"背光","before":"data:image/png;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBQYFBAYGBQYHBwYIChAKCgkJChQODwwQFxQYGBcUFhYaHSUfGhsjHBYWICwgIyYnKSopGR8tMC0oMCUoKSj/2wBDAQcHBwoIChMKChMoGhYaKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCj/wAARCALQBQADASIAAhEBAxEB/8QAHAABAAEFAQEAAAAAAAAAAAAAAAYCAwQFBwEI/8QAXBAAAQMDAgIFBwUHEAgGAgEFAQACAwQFERIhBjETIkFRYQcUMlJxgZFCU6Gx0RUjM3J0weEIFhckNDU2VFVWYpKkwtLTN0OChJOUtPBjc6Kys/FEg3WjJWTiRf/EABgBAQEBAQEAAAAAAAAAAAAAAAABAgME/8QAJxEBAQEAAwACAgIDAQADAQAAAAERAiExEkFRcSJhAxMy8FKB0cH/2gAMAwEAAhEDEQA/APpxERYUREQEWDU3e20szoam4UcMzcamSTta4ZGdwT3K1937P/K1v/5ln2qGtmi1n3fs/wDK1v8A+ZZ9qqjvlpke1kd0oHPcQGtbUMJJPYN0NbFERUEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEUW8qFwqbXwJdauhldDUNaxrXt5t1SNaceOCV82/rgvP8AK9x/5l/2o58/8k43H12i+RP1wXn+V7j/AMy/7U/XBef5XuP/ADL/ALUY/wB8/D67RfIn64Lz/K9x/wCZf9qfrgvP8r3H/mX/AGof75+H12i+RP1wXn+V7j/zL/tT9cF5/le4/wDMv+1D/fPw+u0XyJ+uC8/yvcf+Zf8Aan64Lz/K9x/5l/2of75+H12i+RP1wXn+V7j/AMy/7U/XBef5XuP/ADL/ALUP98/D67RfIn64Lz/K9x/5l/2qaeR/iC7S8d0NJUXCqnp6hsjZI5pXPBxG5wIydjloRZ/mluY+h0REdhERAREQEREGqt8scNVfZZntjjZVBznvOA0CniySewK3+urh7+XrT/zkf2q7bGtfW3tr2hzTVtBBGQR0ES+c5aK2U36pmSnmp6SK2xzGR0bmNETQKbWSRyAzunHvl8UvXHX0dVX6z0nR+d3W3wdKwSM6WpY3W08nDJ3HiqKqupLjZ5prfVQVUOQ3XBIHtzkbZCg9LR2nyo3KK4SMpp+HLVM6OnhABdUyjYuf2tjHyW/K5nbAU6rKSmorNJBRU8VPC3GI4mBjRuOwJ9FbNaC48WWu3cQmz1j5IqgUTq90rmjo2xNOCSc8/ct+uJeVzhS6cT8fmG3NqGD7iO0yBpEUr2y6uhe7l1scsjsUV1bhW/0/EtmiulFBVQ0sxPRGoYGOe0fKAydj2ZWv4P43s/FtVcae0PldJQvDZOkYGh4JIDmbnLctO6jtbxRVzeR6praGz1tJdRT+
