<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>KAOPU 算法树权 R03</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b0e0f;color:#e6ece8;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft Yahei",sans-serif}header{height:66px;padding:13px 18px;border-bottom:1px solid #2d3638;display:flex;justify-content:space-between;align-items:center}h1{font-size:18px;margin:0}.sub{font-size:11px;color:#8e9c9a}.grid{display:grid;grid-template-columns:1fr 340px;height:calc(100vh - 66px)}main{position:relative;overflow:hidden;background:radial-gradient(circle at 50% 50%,#20292b,#0b0e0f 72%)}canvas{width:100%;height:100%;display:block;touch-action:none}.bar{position:absolute;left:14px;top:14px;display:flex;gap:6px;flex-wrap:wrap}.bar button,.panel button{background:#172022;color:#e6ece8;border:1px solid #425052;border-radius:6px;padding:7px 9px}.bar button.on,.panel button.on{background:#405149}.info{position:absolute;left:16px;bottom:13px;color:#a2b0ad;font-size:11px}.panel{overflow:auto;border-left:1px solid #2d3638;padding:18px;background:#14191b}.panel h2{font-size:14px;margin:0 0 6px}.note{font-size:11px;color:#8f9c9a;line-height:1.5;margin-bottom:16px}.row{margin:0 0 14px}.row label{display:flex;justify-content:space-between;font-size:12px}.row output{color:#bfd2c8}.row input[type=range]{width:100%;accent-color:#c4d8ce}.presets{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0 18px}.divider{border-top:1px solid #2d3638;margin:16px 0}.legend{font-size:11px;line-height:1.65;color:#98a7a3}.legend b{color:#dce5e0;font-weight:500}.status{font-size:11px;color:#abc5b7;margin-top:12px}@media(max-width:760px){header{height:61px}.grid{display:block;height:auto}main{height:57svh;min-height:420px}.panel{border-left:0;border-top:1px solid #2d3638}.controls{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}}
</style></head><body>
<header><div><h1>KAOPU · 算法树权练习 R03</h1><div class="sub">信息场 → 节点 → Delaunay → 寻路树 → 末端果实</div></div><div class="sub">方法练习 · 非原作者算法复刻</div></header>
<div class="grid"><main><canvas id="c"></canvas><div class="bar"><button data-m="field">信息场</button><button data-m="mesh">网格</button><button data-m="tree" class="on">树权</button><button data-m="fruit">果实</button><button id="seed">换种子</button></div><div class="info" id="info">生成中…</div></main>
<aside class="panel"><h2>这一版只练四个声部</h2><div class="note">不是为了马上做漂亮珊瑚，而是看“场—网—路—末端”是否能够稳定组成同一套树状结构。</div>
<div class="presets"><button data-p="fan" class="on">扇面场</button><button data-p="island">岛状场</button><button data-p="vein">叶脉场</button></div>
<div class="controls">
<div class="row"><label>采样节点 <output id="countO"></output></label><input id="count" type="range" min="90" max="420" step="10"></div>
<div class="row"><label>场阈值 <output id="thresholdO"></output></label><input id="threshold" type="range" min=".12" max=".72" step=".01"></div>
<div class="row"><label>最小间距 <output id="spacingO"></output></label><input id="spacing" type="range" min="7" max="26" step="1"></div>
<div class="row"><label>路径弯曲偏好 <output id="bendO"></output></label><input id="bend" type="range" min="0" max="2" step=".05"></div>
<div class="row"><label>终端数量 <output id="terminalsO"></output></label><input id="terminals" type="range" min="12" max="120" step="4"></div>
<div class="row"><label>果实缩放 <output id="fruitO"></output></label><input id="fruit" type="range" min=".2" max="2.4" step=".1"></div>
</div>
<div class="divider"></div>
<div class="legend"><b>批判性学习：</b><br>① Delaunay 只负责建立局部邻接，不等于植物生长。<br>② 寻路树取决于代价函数；换代价函数就会换“演奏风格”。<br>③ 枝条粗细仍由下游终端数量反算，不按层级硬缩放。<br>④ 果实大小读取信息场，只示范“末端读取局部事实”，不是植物学模型。<br>⑤ 当前是二维算法练习；以后只有在值得的时候才提升到三维。</div><div class="status" id="status"></div>
</aside></div>
<script>
const $=x=>document.getElementById(x),C=$('c'),X=C.getContext('2d'),TAU=Math.PI*2,clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
let seed=93017,preset='fan',mode='tree',pts=[],tris=[],edges=[],treeEdges=[],fruits=[];
const P={fan:{count:260,threshold:.26,spacing:12,bend:.55,terminals:64,fruit:1.15},island:{count:320,threshold:.22,spacing:11,bend:.85,terminals:84,fruit:1.3},vein:{count:240,threshold:.28,spacing:12,bend:.35,terminals:56,fruit:1.0}};let p={...P.fan};
function rng(){seed|=0;seed=seed+0x6D2B79F5|0;let t=seed;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}
function field(x,y){x=(x-.5)*2;y=(y-.5)*2;
 if(preset==='fan'){let r=Math.hypot(x*.85,(y+.48)*.72),a=Math.atan2(x,y+.48);let crown=Math.exp(-Math.pow((r-.68)/.36,2))*clamp((y+1.05)*.9,0,1);let lobes=.56+.44*(.5+.5*Math.cos(a*7+Math.sin(r*10)*.9));return crown*lobes}
 if(preset==='island'){let q=Math.exp(-((x+.15)*(x+.15)*1.8+(y+.04)*(y+.04)*2.1));let q2=.72*Math.exp(-((x-.52)*(x-.52)*7+(y-.25)*(y-.25)*6));let q3=.58*Math.exp(-((x+.48)*(x+.48)*8+(y-.42)*(y-.42)*9));return clamp(q+q2+q3,0,1)}
 let main=Math.exp(-Math.pow(x*.55+Math.sin(y*4)*.12,2)*18)*clamp(1-Math.abs(y)*.55,0,1);let side=.55*Math.exp(-Math.pow(Math.abs(x)-(.18+.45*(1-y*y)),2)*45);return clamp(main+side,0,1)
}
function sample(){pts=[];let tries=0,max=p.count*90;while(pts.length<p.count&&tries++<max){let x=rng(),y=rng(),v=field(x,y);if(v<p.threshold||rng()>v)continue;let px=(x-.5)*560,py=(y-.5)*560;if(pts.every(q=>Math.hypot(q.x-px,q.y-py)>=p.spacing))pts.push({x:px,y:py,v})}
 pts.push({x:0,y:300,v:1,root:true})
}
function circum(a,b,c){let d=2*(a.x*(b.y-c.y)+b.x*(c.y-a.y)+c.x*(a.y-b.y));if(Math.abs(d)<1e-9)return{x:0,y:0,r2:1e18};let ux=((a.x*a.x+a.y*a.y)*(b.y-c.y)+(b.x*b.x+b.y*b.y)*(c.y-a.y)+(c.x*c.x+c.y*c.y)*(a.y-b.y))/d;let uy=((a.x*a.x+a.y*a.y)*(c.x-b.x)+(b.x*b.x+b.y*b.y)*(a.x-c.x)+(c.x*c.x+c.y*c.y)*(b.x-a.x))/d;return{x:ux,y:uy,r2:(ux-a.x)**2+(uy-a.y)**2}}
function delaunay(){let n=pts.length,all=pts.slice(),R=1200;all.push({x:-R,y:R},{x:R,y:R},{x:0,y:-R});let T=[[n,n+1,n+2]];
 for(let i=0;i<n;i++){let bad=[],boundary=[];for(let ti=0;ti<T.length;ti++){let [a,b,c]=T[ti],cc=circum(all[a],all[b],all[c]);if((all[i].x-cc.x)**2+(all[i].y-cc.y)**2<=cc.r2+1e-6)bad.push(ti)}
  let seen=new Map();for(const ti of bad){let t=T[ti];for(const e of [[t[0],t[1]],[t[1],t[2]],[t[2],t[0]]]){let k=e[0]<e[1]?e[0]+','+e[1]:e[1]+','+e[0];seen.set(k,(seen.get(k)||0)+1)}}
  boundary=[...seen.entries()].filter(x=>x[1]===1).map(x=>x[0].split(',').map(Number));T=T.filter((_,idx)=>!bad.includes(idx));for(const [a,b] of boundary)T.push([a,b,i])
 }
 tris=T.filter(t=>t.every(i=>i<n));let map=new Map();for(const t of tris)for(const [a,b] of [[t[0],t[1]],[t[1],t[2]],[t[2],t[0]]]){let k=a<b?a+','+b:b+','+a;if(!map.has(k))map.set(k,[Math.min(a,b),Math.max(a,b)])}edges=[...map.values()]
}
function buildTree(){let n=pts.length,root=n-1,adj=Array.from({length:n},()=>[]);for(const [a,b] of edges){let dx=pts[a].x-pts[b].x,dy=pts[a].y-pts[b].y,d=Math.hypot(dx,dy);adj[a].push([b,d]);adj[b].push([a,d])}
 let dist=Array(n).fill(Infinity),prev=Array(n).fill(-1),used=Array(n).fill(false);dist[root]=0;
 for(let k=0;k<n;k++){let u=-1,best=Infinity;for(let i=0;i<n;i++)if(!used[i]&&dist[i]<best){best=dist[i];u=i}if(u<0)break;used[u]=true;for(const [v,d] of adj[u]){let dy=pts[v].y-pts[u].y,upPenalty=dy>0?0:Math.abs(dy)*p.bend;let centerPenalty=Math.abs(pts[v].x)*.002*p.bend;let w=d+upPenalty+centerPenalty;if(dist[u]+w<dist[v]){dist[v]=dist[u]+w;prev[v]=u}}}
 let candidates=pts.map((q,i)=>({i,score:q.v*1.4+(-q.y/560+.5)})).filter(o=>o.i!==root&&prev[o.i]>=0).sort((a,b)=>b.score-a.score).slice(0,p.terminals);
 let usedEdge=new Map(),terminalSet=new Set(candidates.map(o=>o.i));for(const t of terminalSet){let u=t;while(u!==root&&prev[u]>=0){let a=u,b=prev[u],k=a<b?a+','+b:b+','+a;usedEdge.set(k,[a,b]);u=b}}
 treeEdges=[...usedEdge.values()];
 let children=Array.from({length:n},()=>[]);for(const [a,b] of treeEdges){let pa=prev[a]===b?[b,a]:[a,b];children[pa[0]].push(pa[1])}
 let load=Array(n).fill(0);function calc(u){let s=terminalSet.has(u)?1:0;for(const c of children[u])s+=calc(c);return load[u]=s}calc(root);
 treeEdges=treeEdges.map(([a,b])=>{let child=prev[a]===b?a:b;return{a,b,w:.7+5*Math.pow(load[child]/Math.max(1,load[root]),.45)}});
 fruits=[...terminalSet].map(i=>({i,r:(2+10*pts[i].v)*p.fruit}))
}
function sync(){for(const k of ['count','threshold','spacing','bend','terminals','fruit']){p[k]=+$ (k).value;$(k+'O').textContent=(k==='count'||k==='spacing'||k==='terminals')?p[k]:p[k].toFixed(2)}}
function setPreset(name){preset=name;p={...P[name]};for(const k of ['count','threshold','spacing','bend','terminals','fruit'])$(k).value=p[k];document.querySelectorAll('[data-p]').forEach(b=>b.classList.toggle('on',b.dataset.p===name));sync();rebuild()}
function rebuild(){let saved=seed;sample();delaunay();buildTree();seed=saved;$('info').textContent=`${pts.length-1} 节点 · ${edges.length} Delaunay 边 · ${treeEdges.length} 树边`;$('status').textContent=pts.length>20?'场→网→路→树：链路完成':'采样不足，请降低阈值或间距';draw()}
function view(q,w,h){let s=Math.min(w,h)/690;return[w/2+q.x*s,h/2+q.y*s]}
function draw(){let r=C.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2),w=C.width=Math.round(r.width*d),h=C.height=Math.round(r.height*d);X.clearRect(0,0,w,h);X.lineCap='round';
 if(mode==='field'){let cols=90,rows=90,cw=w/cols,ch=h/rows;for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){let v=field(i/(cols-1),j/(rows-1));let a=clamp((v-p.threshold)/(1-p.threshold),0,1);X.fillStyle=`rgba(190,218,205,${a*.88})`;X.fillRect(i*cw,j*ch,cw+1,ch+1)}}
 if(mode==='mesh'){X.strokeStyle='rgba(138,160,154,.22)';X.lineWidth=1*d;for(const [a,b] of edges){let A=view(pts[a],w,h),B=view(pts[b],w,h);X.beginPath();X.moveTo(...A);X.lineTo(...B);X.stroke()}for(const q of pts){let A=view(q,w,h);X.fillStyle='rgba(218,233,225,.7)';X.beginPath();X.arc(A[0],A[1],1.4*d,0,TAU);X.fill()}}
 if(mode==='tree'||mode==='fruit'){for(const e of treeEdges){let A=view(pts[e.a],w,h),B=view(pts[e.b],w,h);X.strokeStyle='rgba(208,219,215,.86)';X.lineWidth=e.w*d;X.beginPath();X.moveTo(...A);X.lineTo(...B);X.stroke()}if(mode==='fruit')for(const f of fruits){let q=pts[f.i],A=view(q,w,h);let hue=12+q.v*25;X.fillStyle=`hsla(${hue},70%,76%,.92)`;X.beginPath();X.arc(A[0],A[1],f.r*d*.45,0,TAU);X.fill()}}
}
for(const k of ['count','threshold','spacing','bend','terminals','fruit'])$(k).oninput=()=>{sync();clearTimeout(window._r);window._r=setTimeout(rebuild,90)};
document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>setPreset(b.dataset.p));document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{mode=b.dataset.m;document.querySelectorAll('[data-m]').forEach(x=>x.classList.toggle('on',x===b));draw()});$('seed').onclick=()=>{seed=(seed+7919)|0;rebuild()};addEventListener('resize',draw);setPreset('fan');
</script></body></html>
