<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>KAOPU 多语法合奏 R04</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b0e0f;color:#e6ece8;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft Yahei",sans-serif}header{padding:13px 18px;border-bottom:1px solid #2c3637;display:flex;justify-content:space-between}h1{font-size:18px;margin:0}.sub{font-size:11px;color:#8f9c99}.layout{display:grid;grid-template-columns:1fr 340px;height:calc(100vh - 66px)}main{position:relative;overflow:hidden;background:#0b0e0f}canvas{width:100%;height:100%;display:block}.bar{position:absolute;top:12px;left:12px;display:flex;gap:6px}.bar button,.panel button{background:#172022;color:#e5ece8;border:1px solid #425052;border-radius:6px;padding:7px 9px}.bar button.on,.panel button.on{background:#405149}.info{position:absolute;left:14px;bottom:12px;color:#9caaa7;font-size:11px}.panel{overflow:auto;background:#14191b;border-left:1px solid #2c3637;padding:17px}.panel h2{font-size:14px;margin:0 0 5px}.note{font-size:11px;color:#8e9b98;line-height:1.55}.grammars{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0 18px}.row{margin:0 0 13px}.row label{display:flex;justify-content:space-between;font-size:12px}.row output{color:#bdd1c7}.row input{width:100%;accent-color:#c4d8ce}.divider{border-top:1px solid #2c3637;margin:16px 0}.legend{font-size:11px;line-height:1.65;color:#97a6a2}.status{font-size:11px;color:#a8c4b5;margin-top:10px}@media(max-width:760px){.layout{display:block;height:auto}main{height:57svh;min-height:430px}.panel{border-left:0;border-top:1px solid #2c3637}.controls{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}}
</style></head><body><header><div><h1>KAOPU · 多语法合奏 R04</h1><div class="sub">一次调多个语法，不再一次只看一棵</div></div><div class="sub">6 Scores · same engine</div></header><div class="layout"><main><canvas id="c"></canvas><div class="bar"><button id="all" class="on">六种一起</button><button id="shuffle">换种子</button><button id="animate">生长</button></div><div class="info" id="info"></div></main><aside class="panel"><h2>六种语法同时比较</h2><div class="note">每格都是同一套 Forward / Branch / Wave / Field / Stop，只换 Score。下面参数会同时作用于六格，方便比较“同一次调音”对不同语法的影响。</div><div class="grammars"><button data-g="fan">扇面</button><button data-g="crown">树冠</button><button data-g="cascade">垂枝</button><button data-g="coral">团簇</button><button data-g="vein">叶脉</button><button data-g="radial">放射</button></div><div class="controls">
<div class="row"><label>共同分叉角 <output id="angleO"></output></label><input id="angle" type="range" min="12" max="72" step="1" value="34"></div>
<div class="row"><label>共同弯曲 <output id="waveO"></output></label><input id="wave" type="range" min="0" max=".7" step=".01" value=".22"></div>
<div class="row"><label>共同不规则度 <output id="randomO"></output></label><input id="random" type="range" min="0" max=".8" step=".01" value=".24"></div>
<div class="row"><label>共同密度 <output id="densityO"></output></label><input id="density" type="range" min=".45" max="1.5" step=".05" value="1"></div>
<div class="row"><label>Field 影响 <output id="fieldO"></output></label><input id="field" type="range" min="0" max="1" step=".02" value=".42"></div>
<div class="row"><label>生长进度 <output id="growthO"></output></label><input id="growth" type="range" min="0" max="1" step=".005" value="1"></div></div><div class="divider"></div><div class="legend">这一版故意不追求“漂亮成品”。目标是练习<strong>语法之间的差异</strong>：分叉节奏、主轴优势、重力/流场偏向、平面约束、放射方向、末端密度。自然感如果只能靠换种子，而不能靠结构参数稳定出现，就不算学会。</div><div class="status" id="status"></div></aside></div><script>
const $=x=>document.getElementById(x),C=$('c'),X=C.getContext('2d'),TAU=Math.PI*2;let seed=94031,growth=1,playing=false,last=0,focus=null;
const G={
fan:{label:'扇面',levels:6,children:2,ratio:.70,flat:.96,gravity:-.03,spread:.92,trunk:1.0,curve:.9},
crown:{label:'树冠',levels:6,children:2,ratio:.69,flat:.45,gravity:-.18,spread:.72,trunk:1.25,curve:.65},
cascade:{label:'垂枝',levels:6,children:2,ratio:.72,flat:.62,gravity:.38,spread:.72,trunk:.95,curve:1.1},
coral:{label:'团簇',levels:6,children:3,ratio:.61,flat:.20,gravity:-.06,spread:.82,trunk:.75,curve:1.25},
vein:{label:'叶脉',levels:7,children:2,ratio:.66,flat:.99,gravity:-.02,spread:.48,trunk:1.35,curve:.35},
radial:{label:'放射',levels:5,children:3,ratio:.65,flat:.12,gravity:0,spread:1.0,trunk:.55,curve:.8}};
let P={angle:34,wave:.22,random:.24,density:1,field:.42};function hash(a,b){let x=Math.imul((a+b*101)|0,1597334677);x^=x>>>15;x=Math.imul(x,3812015801);return((x^(x>>>16))>>>0)/4294967296}
function sync(){for(const k of ['angle','wave','random','density','field']){P[k]=+$ (k).value;$(k+'O').textContent=P[k].toFixed(k==='angle'?0:2)}$('growthO').textContent=Math.round(growth*100)+'%'}
function generate(name,idx){let g=G[name],seg=[],terminal=[];let budget=Math.round(1450*P.density),count=0;function grow(x,y,a,len,level,key,birth,width){if(level>g.levels||len<2||count++>budget){terminal.push({x,y,birth});return}let steps=4,px=x,py=y;for(let s=1;s<=steps;s++){let u=s/steps,phase=key*.17+level*.71;let bend=Math.sin(u*2.4+phase)*P.wave*g.curve*.12;let grav=g.gravity*P.field*u;let aa=a+bend+grav;let nx=px+Math.cos(aa)*len/steps,ny=py+Math.sin(aa)*len/steps;seg.push({x1:px,y1:py,x2:nx,y2:ny,birth:birth+u*.035+level*.075,w:width});px=nx;py=ny}
if(level===g.levels){terminal.push({x:px,y:py,birth:birth+level*.075});return}
let n=g.children;if(hash(key,level)>.56+P.density*.18)n=Math.max(1,n-1);for(let c=0;c<n;c++){let sign=n===1?(hash(key,c)-.5)*2:(c/(n-1)*2-1);let jitter=(hash(key*7+c,level)-.5)*P.random;let da=(P.angle*Math.PI/180)*g.spread*(sign+jitter);let na=a+da+g.gravity*P.field*.28;let nl=len*g.ratio*(.88+hash(key,c+9)*.20);grow(px,py,na,nl,level+1,key*3+c+11,birth+.07,width*g.ratio)}}
if(name==='radial'){for(let r=0;r<7;r++)grow(0,0,-Math.PI/2+r*TAU/7,36,1,seed+idx*997+r,.02,3.2)}
else grow(0,32,-Math.PI/2,58*g.trunk,1,seed+idx*997,.02,4.4*g.trunk);return{seg,terminal}}
function draw(){let box=C.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2),w=C.width=Math.round(box.width*d),h=C.height=Math.round(box.height*d);X.clearRect(0,0,w,h);let names=focus?[focus]:Object.keys(G),cols=focus?1:(box.width<650?2:3),rows=Math.ceil(names.length/cols),cw=w/cols,ch=h/rows;names.forEach((name,i)=>{let col=i%cols,row=Math.floor(i/cols),cx=col*cw+cw/2,cy=row*ch+ch*.58,data=generate(name,i),scale=Math.min(cw,ch)/155;X.save();X.beginPath();X.rect(col*cw,row*ch,cw,ch);X.clip();X.strokeStyle='rgba(214,225,219,.88)';X.lineCap='round';for(const s of data.seg){if(s.birth>growth)continue;X.lineWidth=Math.max(.7,s.w*scale*.46);X.beginPath();X.moveTo(cx+s.x1*scale,cy+s.y1*scale);X.lineTo(cx+s.x2*scale,cy+s.y2*scale);X.stroke()}X.fillStyle='rgba(221,169,158,.86)';for(const t of data.terminal){if(t.birth>growth)continue;X.beginPath();X.arc(cx+t.x*scale,cy+t.y*scale,Math.max(1.1,1.6*scale),0,TAU);X.fill()}X.fillStyle='rgba(184,201,194,.85)';X.font=(11*d)+'px sans-serif';X.fillText(G[name].label,col*cw+12*d,row*ch+20*d);X.restore();if(!focus){X.strokeStyle='rgba(65,77,78,.45)';X.strokeRect(col*cw,row*ch,cw,ch)}});$('info').textContent=focus?'单看：'+G[focus].label:'六种语法同时演奏 · 参数同步';$('status').textContent='同一参数改变六种 Score；比较差异，不挑一棵最好看的'}
function tick(t){if(playing){growth=Math.min(1,growth+(t-last)/1000*.16);$('growth').value=growth;sync();draw();if(growth>=1)playing=false}last=t;requestAnimationFrame(tick)}
for(const k of ['angle','wave','random','density','field'])$(k).oninput=()=>{sync();draw()};$('growth').oninput=()=>{growth=+$('growth').value;playing=false;sync();draw()};document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{focus=focus===b.dataset.g?null:b.dataset.g;document.querySelectorAll('[data-g]').forEach(x=>x.classList.toggle('on',focus===x.dataset.g));$('all').classList.toggle('on',!focus);draw()});$('all').onclick=()=>{focus=null;$('all').classList.add('on');document.querySelectorAll('[data-g]').forEach(x=>x.classList.remove('on'));draw()};$('shuffle').onclick=()=>{seed+=7919;draw()};$('animate').onclick=()=>{growth=0;$('growth').value=0;playing=true};addEventListener('resize',draw);sync();draw();requestAnimationFrame(tick);
</script></body></html>
