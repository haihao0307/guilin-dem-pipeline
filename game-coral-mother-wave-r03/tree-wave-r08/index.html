<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>KAOPU Fractal Wave Studies</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0f10;color:#e6ece8;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft Yahei",sans-serif}header{padding:15px 18px;border-bottom:1px solid #30393a}h1{font-size:18px;margin:0}small{color:#8d9b98}.g{display:grid;grid-template-columns:1fr 330px;height:calc(100vh - 65px)}main{position:relative;overflow:hidden;background:radial-gradient(circle,#202a2c,#0b0f10 70%)}canvas{width:100%;height:100%;display:block}.p{padding:18px;overflow:auto;background:#141a1b;border-left:1px solid #30393a}h2{font-size:14px}.row{margin:14px 0}.row label{display:flex;justify-content:space-between;font-size:12px}.row input{width:100%;accent-color:#c7d9d0}button{background:#182123;color:#e6ece8;border:1px solid #465355;border-radius:6px;padding:7px 9px;margin:3px}.bar{position:absolute;top:12px;left:12px}.info{position:absolute;bottom:12px;left:14px;color:#9daba8;font-size:11px}.note{font-size:11px;color:#91a09d;line-height:1.6}@media(max-width:760px){.g{display:block;height:auto}main{height:57svh;min-height:420px}.p{border-left:0;border-top:1px solid #30393a}}</style><header><h1>KAOPU · R08 四类分形脉同台</h1><small>珊瑚、羽毛、树、河网同时调音；检查基础能力是否真正可复用。</small></header><div class=g><main><canvas></canvas><div class=bar><button id=seed>换种子</button></div><div class=info id=info></div></main><aside class=p><h2>共同演奏旋钮</h2><div class=note>珊瑚、羽毛、树、河网同时调音；检查基础能力是否真正可复用。<br>本轮重点是练习结构关系，不把随机性当自然性。</div><div class=row><label>分叉角 <output id=ao></output></label><input id=a type=range min=10 max=70 value=34></div><div class=row><label>Wave <output id=wo></output></label><input id=w type=range min=0 max=.7 step=.01 value=.22></div><div class=row><label>层级密度 <output id=do></output></label><input id=d type=range min=.2 max=1 step=.01 value=.72></div><div class=row><label>Field <output id=fo></output></label><input id=f type=range min=0 max=1 step=.01 value=.38></div><p class=note>观察任务：主干优势、二级枝节律、末端收敛、发散/汇聚方向是否合理。</p></aside></div><script>const C=document.querySelector('canvas'),X=C.getContext('2d'),$=x=>document.getElementById(x),TAU=Math.PI*2;let seed=95101,phase=1;function h(a,b=0){let x=Math.imul((a+b*97+seed)|0,1597334677);x^=x>>>15;return((x^(x>>>16))>>>0)/4294967296}let P={a:34,w:.22,d:.72,f:.38};function sync(){for(let k of ['a','w','d','f']){P[k]=+$(k).value;$(k+'o').textContent=P[k].toFixed(k==='a'?0:2)}draw()}function branch(out,x,y,ang,len,dep,key,mode){if(dep>7||len<2)return;let n=4,px=x,py=y;for(let i=1;i<=n;i++){let u=i/n,curve=Math.sin(u*2.7+key*.31)*P.w*.16+(mode==='river'?P.f*.035:mode==='feather'?Math.sin(dep)*.015:-P.f*.018);let aa=ang+curve,nx=px+Math.cos(aa)*len/n,ny=py+Math.sin(aa)*len/n;out.push([px,py,nx,ny,dep,u]);px=nx;py=ny}let children=mode==='coral'?(dep<3?3:2):2,ratio=mode==='feather'?.68:mode==='river'?.73:.66;for(let j=0;j<children;j++){let s=children===2?(j?1:-1):(j-1),jitter=(h(key,j)-.5)*.35,da=(P.a*Math.PI/180)*(s+jitter);branch(out,px,py,ang+da,len*ratio,dep+1,key*3+j+7,mode)}}function draw(){let r=C.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2),W=C.width=r.width*d,H=C.height=r.height*d;X.clearRect(0,0,W,H);let modes='compare'==='compare'?['coral','feather','tree','river']:['compare'],cols=modes.length>1?2:1,rows=Math.ceil(modes.length/cols);modes.forEach((m,ii)=>{let out=[];if(m==='feather'){branch(out,0,0,-Math.PI/2,72,1,ii+2,m);for(let q=0;q<9;q++){let y=-15-q*8,l=36*(1-q*.055);branch(out,0,y,Math.PI+P.a*Math.PI/180,l,3,50+q,m);branch(out,0,y,-P.a*Math.PI/180,l,3,90+q,m)}}else if(m==='river'){for(let k=0;k<4;k++)branch(out,(k-1.5)*24,0,-Math.PI/2,62,1,20+k,m)}else branch(out,0,0,-Math.PI/2,72,1,ii+4,m);let cw=W/cols,ch=H/rows,cx=(ii%cols)*cw+cw/2,cy=Math.floor(ii/cols)*ch+ch*.78,sc=Math.min(cw,ch)/190;X.save();X.beginPath();X.rect((ii%cols)*cw,Math.floor(ii/cols)*ch,cw,ch);X.clip();X.lineCap='round';for(let s of out){let thick=m==='river'?Math.max(.7,(8-s[4])*.35):Math.max(.65,(8-s[4])*.42);X.strokeStyle=m==='river'?'rgba(170,207,218,.84)':'rgba(218,225,221,.88)';X.lineWidth=thick*d;X.beginPath();X.moveTo(cx+s[0]*sc,cy+s[1]*sc);X.lineTo(cx+s[2]*sc,cy+s[3]*sc);X.stroke()}X.fillStyle='#aebbb7';X.font=11*d+'px sans-serif';X.fillText({coral:'珊瑚 / Fan-Trunk',feather:'羽毛 / Pinnate',tree:'树 / Crown',river:'河网 / Convergent'}[m],(ii%cols)*cw+12*d,Math.floor(ii/cols)*ch+20*d);X.restore()});$('info').textContent='同一组旋钮 · 不同分形脉 · seed '+seed}for(let k of ['a','w','d','f'])$(k).oninput=sync;$('seed').onclick=()=>{seed+=7919;draw()};addEventListener('resize',draw);sync();</script>
