<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>KAOPU 生长波 R02</title><style>
*{box-sizing:border-box}body{margin:0;background:#0d1112;color:#e7ece9;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft Yahei",sans-serif}header{height:66px;padding:13px 18px;border-bottom:1px solid #30393b;display:flex;justify-content:space-between;align-items:center}h1{font-size:18px;margin:0}small{color:#91a09e}.grid{display:grid;grid-template-columns:1fr 330px;height:calc(100vh - 66px)}main{position:relative;background:radial-gradient(circle at 50% 46%,#263033,#0d1112 70%);overflow:hidden}canvas{width:100%;height:100%;display:block;touch-action:none}.top{position:absolute;left:14px;top:14px;display:flex;gap:6px;flex-wrap:wrap}button,select{background:#192123;color:#e7ece9;border:1px solid #465355;border-radius:6px;padding:7px 9px}button.on{background:#40514b}.info{position:absolute;left:16px;bottom:14px;color:#aab5b2;font-size:11px}.panel{overflow:auto;border-left:1px solid #30393b;padding:18px;background:#151b1d}h2{font-size:14px;margin:0 0 6px}.note{font-size:11px;color:#91a09e;line-height:1.5}.preset{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:13px 0 20px}.row{margin:0 0 13px}.row label{display:flex;justify-content:space-between;font-size:12px}.row output{color:#bad0c6}input[type=range]{width:100%;accent-color:#c5d8cf}.divider{border-top:1px solid #30393b;margin:16px 0}.legend{font-size:11px;line-height:1.7;color:#9eadaa}.legend b{color:#dce6e1;font-weight:500}.status{font-size:11px;color:#a8c4b6;margin-top:10px}@media(max-width:760px){.grid{display:block;height:auto}main{height:56svh;min-height:410px}.panel{border-left:0;border-top:1px solid #30393b}.controls{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}header{height:61px}.grid{height:auto}}
</style></head><body><header><div><h1>KAOPU · 生长波练习 R02</h1><small>语法 × 波 × 场 × 空间竞争</small></div><small>非物种复刻</small></header><div class="grid"><main><canvas id="c"></canvas><div class="top"><button id="solid" class="on">粗细结构</button><button id="line">骨架</button><button id="play">重播</button><button id="seed">换种子</button></div><div class="info" id="info">生成中…</div></main><aside class="panel"><h2>同一套演奏能力，三张谱</h2><div class="note">不是三个生成器。只换 Score；底层仍是 Forward / Branch / Wave / Field / Space / Stop。</div><div class="preset"><button data-p="fan" class="on">扇面</button><button data-p="radial">放射</button><button data-p="volume">立体</button></div><div class="controls">
<div class="row"><label>主干粗细 <output id="thickO"></output></label><input id="thick" type="range" min="1.2" max="8" step=".1"></div>
<div class="row"><label>步长 <output id="stepO"></output></label><input id="step" type="range" min="2.5" max="10" step=".1"></div>
<div class="row"><label>分叉倾向 <output id="branchO"></output></label><input id="branch" type="range" min=".02" max=".18" step=".005"></div>
<div class="row"><label>Wave 弯曲 <output id="waveO"></output></label><input id="wave" type="range" min="0" max=".7" step=".01"></div>
<div class="row"><label>Field 强度 <output id="fieldO"></output></label><input id="field" type="range" min="0" max=".8" step=".01"></div>
<div class="row"><label>空间避让 <output id="spaceO"></output></label><input id="space" type="range" min="0" max="1" step=".02"></div>
<div class="row"><label>末端密度 <output id="tipsO"></output></label><input id="tips" type="range" min="40" max="360" step="10"></div>
<div class="row"><label>生长进度 <output id="growO"></output></label><input id="grow" type="range" min="0" max="1" step=".005" value="1"></div></div>
<div class="divider"></div><div class="legend"><b>本版新增：</b><br>① L-system 学“状态保存/恢复与递归语法”，不照搬固定字符串。<br>② Space Colonization 学“空间吸引点”，让枝条竞争空白区域。<br>③ Wave 只负责局部连续弯曲，不负责拓扑。<br>④ 粗细先生成拓扑，再按下游负载反算；不再简单每级 ×0.7。<br>⑤ 三种谱测试“能力是否通用”，而不是做三种珊瑚。</div><div class="status" id="status"></div></aside></div>
<script>
const $=x=>document.getElementById(x),C=$('c'),X=C.getContext('2d'),TAU=Math.PI*2,clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
let seed=92817,preset='fan',mode='solid',playing=false,growth=1,last=0,segments=[],tips=[],pts=[];
const P={fan:{thick:5.5,step:5.2,branch:.095,wave:.19,field:.55,space:.74,tips:260,flat:.92,up:.46,spread:.78},radial:{thick:3.6,step:6.2,branch:.07,wave:.28,field:.42,space:.46,tips:180,flat:.18,up:.05,spread:1},volume:{thick:6.2,step:5.4,branch:.11,wave:.34,field:.48,space:.68,tips:310,flat:.35,up:.36,spread:.82}};let p={...P.fan};
function rng(){seed|=0;seed=seed+0x6D2B79F5|0;let t=seed;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}
function V(x=0,y=0,z=0){return{x,y,z}}function add(a,b){return V(a.x+b.x,a.y+b.y,a.z+b.z)}function sub(a,b){return V(a.x-b.x,a.y-b.y,a.z-b.z)}function mul(a,s){return V(a.x*s,a.y*s,a.z*s)}function len(a){return Math.hypot(a.x,a.y,a.z)}function norm(a){let l=len(a)||1;return mul(a,1/l)}
function setPreset(name){preset=name;p={...P[name]};for(const k of ['thick','step','branch','wave','field','space','tips'])$(k).value=p[k];document.querySelectorAll('[data-p]').forEach(b=>b.classList.toggle('on',b.dataset.p===name));sync();build()}
function sync(){for(const k of ['thick','step','branch','wave','field','space','tips']){p[k]=+$ (k).value;$(k+'O').textContent=k==='tips'?p[k]:p[k].toFixed(k==='step'||k==='thick'?1:2)}$('growO').textContent=Math.round(growth*100)+'%'}
function nearest(q,arr,max=1e9){let best=max,hit=null;for(const a of arr){let d=len(sub(q,a));if(d<best){best=d;hit=a}}return[hit,best]}
function build(){let saved=seed;segments=[];tips=[];pts=[];let targets=[];let n=p.tips;
for(let i=0;i<n;i++){let a=(rng()-.5)*2,b=rng(),r=Math.sqrt(b);let x,z,y;if(preset==='radial'){let th=rng()*TAU,ph=Math.acos(2*rng()-1);x=Math.sin(ph)*Math.cos(th)*r*160;y=Math.cos(ph)*r*160;z=Math.sin(ph)*Math.sin(th)*r*160}else{x=a*150*r;y=20+r*245*(.72+.28*rng());z=(rng()-.5)*2*160*(1-p.flat);x+=Math.sin(y*.025)*18*p.wave}targets.push(V(x,y,z))}
let nodes=[{p:V(0,-150,0),d:V(0,1,0),parent:-1,load:1,birth:0}],active=[0],iter=0,maxIter=520;
while(targets.length&&active.length&&iter++<maxIter){let influence=new Map(),kill=new Set();
for(let ti=0;ti<targets.length;ti++){let t=targets[ti],best=1e9,bi=-1;for(let ai=0;ai<active.length;ai++){let ni=active[ai],d=len(sub(t,nodes[ni].p));if(d<11){kill.add(ti);bi=-1;break}if(d<72&&d<best){best=d;bi=ni}}if(bi>=0){let v=norm(sub(t,nodes[bi].p));if(!influence.has(bi))influence.set(bi,[]);influence.get(bi).push(v)}}
targets=targets.filter((_,i)=>!kill.has(i));let next=[];
for(const [ni,dirs] of influence){let n0=nodes[ni],avg=V();for(const d of dirs)avg=add(avg,d);avg=norm(avg);let phase=(ni*1.618+saved*.0001);let wave=V(Math.sin(iter*.23+phase)*p.wave,Math.sin(iter*.17+phase)*p.wave*.22,Math.cos(iter*.19+phase)*p.wave*(1-p.flat));let field=preset==='fan'?V(0,p.up,0):preset==='volume'?V(0,p.up,.08):V();let d=norm(add(add(mul(n0.d,.42),mul(avg,.9)),add(mul(wave,.32),mul(field,p.field))));
if(p.space>0){let repel=V();for(let j=Math.max(0,nodes.length-100);j<nodes.length;j++){if(j===ni)continue;let dv=sub(n0.p,nodes[j].p),dl=len(dv);if(dl>0&&dl<18)repel=add(repel,mul(norm(dv),(18-dl)/18))}d=norm(add(d,mul(repel,p.space*.75)))}
let np=add(n0.p,mul(d,p.step)),idx=nodes.length;nodes.push({p:np,d,parent:ni,load:1,birth:iter/maxIter});segments.push({a:n0.p,b:np,node:idx,birth:iter/maxIter});next.push(idx)}
active=[...new Set([...active.filter(i=>!influence.has(i)),...next])];if(active.length>220)active=active.slice(-220)}
for(let i=nodes.length-1;i>0;i--){let n0=nodes[i];if(n0.parent>=0)nodes[n0.parent].load+=Math.pow(n0.load,.86)}
for(const s of segments)s.w=.32+p.thick*Math.pow(nodes[s.node].load,.42)/Math.pow(Math.max(1,nodes[1]?.load||1),.42);
tips=active.map(i=>nodes[i].p);seed=saved;$('info').textContent=`${segments.length} 段 · ${targets.length} 个未占领目标 · Score: ${preset}`;$('status').textContent='拓扑→下游负载→粗细；参数改变会重新演奏同一套函数';draw()}
function camera(v,w,h){let ang=.36,ca=Math.cos(ang),sa=Math.sin(ang),x=v.x*ca-v.z*sa,z=v.x*sa+v.z*ca;let sc=Math.min(w,h)/430,depth=1+z/700;return[w/2+x*sc/depth,h*.77-v.y*sc/depth,z]}
function draw(){let r=C.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2),w=C.width=Math.round(r.width*d),h=C.height=Math.round(r.height*d);X.setTransform(1,0,0,1,0,0);X.clearRect(0,0,w,h);let arr=segments.filter(s=>s.birth<=growth).map(s=>{let a=camera(s.a,w,h),b=camera(s.b,w,h);return{s,a,b,z:(a[2]+b[2])/2}}).sort((a,b)=>a.z-b.z);X.lineCap='round';for(const q of arr){let alpha=.36+.64*clamp((q.z+180)/360,0,1);X.strokeStyle=mode==='line'?`rgba(190,220,207,${alpha})`:`rgba(220,225,221,${alpha})`;X.lineWidth=(mode==='line'?1:Math.max(1,q.s.w))*d;X.beginPath();X.moveTo(q.a[0],q.a[1]);X.lineTo(q.b[0],q.b[1]);X.stroke()}requestAnimationFrame(()=>{})}
function tick(t){if(playing){let dt=(t-last)/1000||0;growth=Math.min(1,growth+dt*.18);$('grow').value=growth;sync();draw();if(growth>=1)playing=false}last=t;requestAnimationFrame(tick)}
for(const k of ['thick','step','branch','wave','field','space','tips'])$(k).oninput=()=>{sync();clearTimeout(window._b);window._b=setTimeout(build,80)};$('grow').oninput=()=>{growth=+$('grow').value;playing=false;sync();draw()};document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>setPreset(b.dataset.p));$('solid').onclick=()=>{mode='solid';$('solid').classList.add('on');$('line').classList.remove('on');draw()};$('line').onclick=()=>{mode='line';$('line').classList.add('on');$('solid').classList.remove('on');draw()};$('play').onclick=()=>{growth=0;$('grow').value=0;playing=true};$('seed').onclick=()=>{seed=(seed+7919)|0;build()};addEventListener('resize',draw);setPreset('fan');requestAnimationFrame(tick);
</script></body></html>
