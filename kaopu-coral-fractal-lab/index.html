<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>KAOPU Tree Life R06</title><style>
*{box-sizing:border-box}body{margin:0;background:#0f1515;color:#e8ede9;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft Yahei",sans-serif}header{padding:12px 15px;border-bottom:1px solid #34413e;display:flex;justify-content:space-between;align-items:center}h1{font-size:17px;margin:0}.sub{font-size:10px;color:#91a09b}.stage{height:70svh;min-height:540px;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 43%,#293431,#0f1515 71%)}canvas{width:100%;height:100%;display:block;touch-action:none}.bar{position:absolute;left:10px;top:10px;right:10px;display:flex;gap:5px;flex-wrap:wrap}button{background:#182220d9;color:#e7ece9;border:1px solid #4b5c56;border-radius:6px;padding:8px 9px;min-height:38px}button.on{background:#40574e}.ground{position:absolute;left:0;right:0;top:55%;border-top:1px solid rgba(198,218,209,.3);pointer-events:none}.ground span{position:absolute;right:8px;top:4px;color:#84928e;font-size:9px}.info{position:absolute;left:12px;bottom:10px;color:#a1aea9;font-size:10px}.panel{padding:16px;background:#171e1d;border-top:1px solid #34413e}.panel h2{font-size:14px;margin:0 0 4px}.note{font-size:11px;color:#94a19d;line-height:1.55}.controls{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}.row{margin:12px 0}.row label{display:flex;justify-content:space-between;font-size:12px}.row output{color:#bfd2c8}.row input{width:100%;accent-color:#c6d9cf}.status{font-size:11px;color:#abc4b7;margin-top:8px}@media(min-width:760px){.wrap{display:grid;grid-template-columns:1fr 340px}.stage{height:calc(100vh - 64px)}.panel{border-top:0;border-left:1px solid #34413e}.controls{display:block}}</style></head><body><header><div><h1>KAOPU · TREE LIFE GRAMMAR R06</h1><div class="sub">annual whole-tree update · crown release · structural roots</div></div><div class="sub">Mobile 3D</div></header><div class="wrap"><main class="stage"><canvas id="c"></canvas><div class="bar"><button id="play">1→120年</button><button id="roots" class="on">Roots</button><button id="buds">Buds</button><button id="orbit">转动</button><button id="front">正面</button></div><div class="ground"><span>SOIL SURFACE · ROOT FLARE</span></div><div class="info" id="info"></div></main><aside class="panel"><h2>R06：年龄必须改变生命结构</h2><div class="note">修正 R05 的 leader 独占问题：提高侧芽释放频率，并让一级枝获得足够寿命形成树冠；根盘继续保持独立规则。</div><div class="controls">
<div class="row"><label>年龄 <output id="ageO"></output></label><input id="age" type="range" min="1" max="120" value="55"></div>
<div class="row"><label>光方向 <output id="lightO"></output></label><input id="light" type="range" min="-1" max="1" step=".02" value=".22"></div>
<div class="row"><label>水分方向 <output id="waterO"></output></label><input id="water" type="range" min="-1" max="1" step=".02" value="-.25"></div>
<div class="row"><label>顶端优势 <output id="apicalO"></output></label><input id="apical" type="range" min=".3" max=".95" step=".01" value=".72"></div>
<div class="row"><label>资源历史 <output id="resourceO"></output></label><input id="resource" type="range" min=".35" max="1" step=".01" value=".76"></div>
<div class="row"><label>冠层空间 <output id="spaceO"></output></label><input id="space" type="range" min=".3" max="1" step=".01" value=".78"></div></div><div class="status" id="status"></div></aside></div><script>
const $=x=>document.getElementById(x),C=$('c'),X=C.getContext('2d'),TAU=Math.PI*2,clamp=(x,a,b)=>Math.max(a,Math.min(b,x));let P={age:55,light:.22,water:-.25,apical:.72,resource:.76,space:.78},seed=50505,yaw=.15,pitch=.03,zoom=1,auto=false,showRoots=true,showBuds=false,playing=false,last=0,nodes=[],edges=[],rootEdges=[],buds=[];
function H(a,b=0){let x=Math.imul((a+b*137+seed)|0,1597334677);x^=x>>>15;x=Math.imul(x,3812015801);return((x^(x>>>16))>>>0)/4294967296}const V={add:(a,b)=>a.map((v,i)=>v+b[i]),sub:(a,b)=>a.map((v,i)=>v-b[i]),mul:(a,s)=>a.map(v=>v*s),len:a=>Math.hypot(...a),norm:a=>{let l=Math.hypot(...a)||1;return a.map(v=>v/l)},cross:(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]]};function frame(d){let n=V.norm(V.cross(Math.abs(d[1])>.9?[1,0,0]:[0,1,0],d));return[n,V.norm(V.cross(d,n))]}
function addNode(p,parent,depth,birth,dir,key,leader=false){let i=nodes.length;nodes.push({p,parent,depth,birth,dir,key,leader,alive:true,load:1});if(parent>=0)edges.push({a:parent,b:i,birth,depth});return i}
function nearCrowd(p,ignore){let s=0;for(let i=Math.max(0,nodes.length-220);i<nodes.length;i++){if(i===ignore)continue;let d=V.len(V.sub(p,nodes[i].p));if(d<.12)s+=(.12-d)/.12}return s}
function growShoot(parent,years,depth,key,leader){if(years<=0||depth>5||nodes.length>850)return;let n=nodes[parent],dir=n.dir,step=.035*(.72+.42*P.resource)*Math.pow(.84,depth),segs=Math.min(years,depth===0?10:7),cur=parent;for(let y=0;y<segs;y++){let old=nodes[cur],light=[P.light*.08,.13*(leader?P.apical:.38),0],j=[(H(key,y)-.5)*.04,0,(H(key+9,y)-.5)*.04],d=V.norm(V.add(dir,V.add(light,j))),trial=V.add(old.p,V.mul(d,step)),crowd=nearCrowd(trial,cur);if(crowd>P.space*2.1&&!leader){old.alive=false;break}let ni=addNode(trial,cur,depth,old.birth+1,d,key+y,leader);cur=ni;dir=d;if(y>0){let fr=frame(d),side=(y%2?1:-1),lat=V.add(V.mul(fr[0],side),V.mul(fr[1],(H(key,y+31)-.5)*.5)),lightScore=clamp(.55+.35*P.light*Math.sign(lat[0])-.12*crowd,0,1),activate=(1-P.apical*.5)*P.resource*lightScore*(.7+.3*P.space);buds.push({p:nodes[cur].p,birth:nodes[cur].birth,active:H(key,y+55)<activate});if(H(key,y+55)<activate&&years-y>3)growShoot(cur,Math.floor((years-y)*(.68+.16*H(key,y))),depth+1,key*11+y+17,false)}}if(leader&&years>segs)growShoot(cur,years-segs,depth,key+211,true)}
function rootBranch(o,dir,len,depth,key,birth){if(depth>4||len<.025||rootEdges.length>420)return;let pos=o,d=V.norm(dir),steps=6,prev=null;for(let i=1;i<=steps;i++){let u=i/steps,moist=[P.water*.12,depth===0?.01:-.035,0],noise=[(H(key,i)-.5)*.10,0,(H(key+4,i)-.5)*.10];d=V.norm(V.add(d,V.add(moist,noise)));if(depth===0)d[1]*=.18;let q=V.add(pos,V.mul(d,len/steps));rootEdges.push({a:pos,b:q,depth,birth:birth+u});pos=q}let n=depth===0?3:2;for(let k=0;k<n;k++){let fr=frame(d),az=k*TAU/n+H(key,k)*.7,lat=V.add(V.mul(fr[0],Math.cos(az)),V.mul(fr[1],Math.sin(az))),aim=V.norm(V.add(V.mul(d,.42),V.mul(lat,.92)));aim[1]-=depth===0?.02:.12;rootBranch(pos,aim,len*.58,depth+1,key*7+k+29,birth+2)}}
function build(){nodes=[];edges=[];rootEdges=[];buds=[];let years=Math.round(P.age),root=addNode([0,0,0],-1,0,0,[0,1,0],1,true);growShoot(root,Math.max(1,Math.floor(years/1.35)),0,11,true);let flareCount=clamp(Math.floor(3+years/18),3,8),spread=.14+.0022*years;for(let k=0;k<flareCount;k++){let a=TAU*k/flareCount+H(k,9)*.35,dir=V.norm([Math.cos(a),-.05,Math.sin(a)]);rootBranch([Math.cos(a)*.012,-.004,Math.sin(a)*.012],dir,spread,0,301+k,1)}for(let i=nodes.length-1;i>0;i--){let n=nodes[i];if(n.parent>=0)nodes[n.parent].load+=n.load}for(const e of edges)e.load=nodes[e.b].load;$('status').textContent=nodes.length+' shoot nodes · '+rootEdges.length+' root links · '+buds.filter(b=>b.active).length+'/'+buds.length+' buds';draw()}
function proj(p,w,h){let cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch),x=p[0]*cy-p[2]*sy,z=p[0]*sy+p[2]*cy,y=p[1],yy=y*cp-z*sp,zz=y*sp+z*cp,sc=Math.min(w,h)*.78/zoom,q=1/(1+zz*.38);return[w/2+x*sc*q,h*.55-yy*sc*q,zz]}
function draw(){let r=C.getBoundingClientRect(),D=Math.min(devicePixelRatio||1,1.7),w=C.width=r.width*D,h=C.height=r.height*D;X.clearRect(0,0,w,h);let list=[];for(const e of edges){let A=proj(nodes[e.a].p,w,h),B=proj(nodes[e.b].p,w,h);list.push({A,B,z:(A[2]+B[2])/2,type:'shoot',e})}if(showRoots)for(const e of rootEdges){let A=proj(e.a,w,h),B=proj(e.b,w,h);list.push({A,B,z:(A[2]+B[2])/2,type:'root',e})}list.sort((a,b)=>a.z-b.z);X.lineCap='round';for(const o of list){let age=Math.max(1,P.age-o.e.birth),th;if(o.type==='shoot')th=(.7+3.7*Math.pow((o.e.load||1),.34))*Math.pow(.82,o.e.depth)*(1+.10*Math.log1p(age));else th=(o.e.depth===0?5.4:3.2)*Math.pow(.62,o.e.depth)*(1+.08*Math.log1p(age));X.lineWidth=Math.max(.65,th*D);X.strokeStyle=o.type==='root'?'rgba(178,187,180,.78)':'rgba(221,228,223,.94)';X.beginPath();X.moveTo(o.A[0],o.A[1]);X.lineTo(o.B[0],o.B[1]);X.stroke()}if(showBuds)for(const b of buds){let p=proj(b.p,w,h);X.fillStyle=b.active?'#b9d8b8':'#68746f';X.beginPath();X.arc(p[0],p[1],(b.active?2.2:1.3)*D,0,TAU);X.fill()}let s=proj([0,0,0],w,h);let flare=clamp(2.5+P.age*.055,3,9)*D;X.fillStyle='#d9dfdb';X.beginPath();X.ellipse(s[0],s[1],flare,flare*.48,0,0,TAU);X.fill();$('info').textContent='T '+Math.round(P.age)+'y · root plate '+(0.28+.0044*P.age).toFixed(2)+'m · crown competition active'}
function sync(){for(const k of Object.keys(P)){P[k]=+$ (k).value;$(k+'O').textContent=k==='age'?Math.round(P[k])+' 年':P[k].toFixed(2)}build()}for(const k of Object.keys(P))$(k).oninput=()=>{playing=false;clearTimeout(window._x);window._x=setTimeout(sync,45)};$('roots').onclick=()=>{showRoots=!showRoots;$('roots').classList.toggle('on',showRoots);draw()};$('buds').onclick=()=>{showBuds=!showBuds;$('buds').classList.toggle('on',showBuds);draw()};$('orbit').onclick=()=>{auto=!auto;$('orbit').classList.toggle('on',auto)};$('front').onclick=()=>{yaw=.15;pitch=.03;zoom=1;draw()};$('play').onclick=()=>{P.age=1;$('age').value=1;playing=true};let drag=null;C.onpointerdown=e=>{drag=[e.clientX,e.clientY];C.setPointerCapture(e.pointerId)};C.onpointermove=e=>{if(!drag)return;yaw+=(e.clientX-drag[0])*.008;pitch=clamp(pitch+(e.clientY-drag[1])*.006,-.7,.8);drag=[e.clientX,e.clientY];draw()};C.onpointerup=()=>drag=null;C.onwheel=e=>{e.preventDefault();zoom=clamp(zoom*Math.exp(e.deltaY*.001),.6,2.3);draw()};function tick(t){let dt=(t-last)/1000||0;last=t;if(auto)yaw+=dt*.16;if(playing){P.age=Math.min(120,P.age+dt*8);$('age').value=P.age;sync();if(P.age>=120)playing=false}else if(auto)draw();requestAnimationFrame(tick)}addEventListener('resize',draw);sync();requestAnimationFrame(tick);
</script></body></html>
