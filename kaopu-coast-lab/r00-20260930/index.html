<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#071116" />
<title>KaoPu Coast Lab R00</title>
<style>
:root{color-scheme:dark;--bg:#071116;--panel:rgba(7,17,22,.86);--line:rgba(204,234,242,.22);--text:#e7f3f6;--muted:#91aab1}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--text)}#stage{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none;background:linear-gradient(#0b2028,#061014)}.top{position:fixed;left:14px;right:14px;top:14px;display:flex;justify-content:space-between;gap:12px;pointer-events:none}.brand,.status,.panel{background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);box-shadow:0 12px 40px rgba(0,0,0,.28)}.brand{padding:10px 12px;border-radius:13px;pointer-events:auto;max-width:min(600px,72vw)}.brand b{display:block;font-size:14px;letter-spacing:.08em}.brand small{display:block;color:var(--muted);margin-top:3px;font-size:11px}.status{padding:9px 11px;border-radius:13px;font:11px ui-monospace,SFMono-Regular,Menlo,monospace;color:#b7d1d7;white-space:nowrap}.controls{position:fixed;left:14px;right:14px;bottom:14px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;pointer-events:none}.panel{border-radius:14px;padding:10px;pointer-events:auto}.modes{display:flex;gap:6px;flex-wrap:wrap;max-width:650px}button{appearance:none;border:1px solid rgba(211,237,244,.25);background:#0a171d;color:#cfe4e9;border-radius:9px;padding:8px 10px;font-size:12px;cursor:pointer}button.on{background:#d8f4fb;color:#071116;border-color:#eefcff}.sliders{display:grid;grid-template-columns:auto 140px auto 140px;gap:7px 8px;align-items:center;color:#9fb5bb;font-size:11px}input[type=range]{width:140px;accent-color:#d7f6ff}.legend{position:fixed;right:14px;top:82px;width:min(310px,42vw);padding:10px 12px;border-radius:13px;font-size:11px;line-height:1.45;color:#a9c0c6;pointer-events:none}.legend strong{color:#e8f6f8}.legend code{color:#d8f4fb}.tag{display:inline-block;border:1px solid rgba(215,246,255,.22);border-radius:999px;padding:2px 6px;margin:2px 3px 0 0;color:#bcd2d7}@media(max-width:760px){.legend{display:none}.controls{flex-direction:column;align-items:stretch}.sliders{grid-template-columns:auto 1fr}.sliders input{width:100%}.brand{max-width:85vw}.status{display:none}}
</style>
</head>
<body>
<canvas id="stage" aria-label="KaoPu coast diagnostic prototype"></canvas>
<div class="top"><div class="brand"><b>KAOPU COAST LAB R00</b><small>同一海床 · 同一时间 · 近岸场 + 湿度历史 + 局部粒子事件</small></div><div class="status" id="status">initializing</div></div>
<div class="legend panel"><strong>这不是最终海洋。</strong><br>本样只验证：<br><code>Ocean Boundary → Variable Depth → Obstacle → Wet/Dry Contact → Wetness History → Local Splash Patch</code><br><span class="tag">Field</span><span class="tag">State</span><span class="tag">History</span><span class="tag">Active Region</span><br>拖动白色圆圈可移动“高成本局部计算区”。全局波场仍持续，只有粒子飞溅跟随活动区。</div>
<div class="controls"><div class="panel modes"><button data-mode="composite" class="on">01 Composite</button><button data-mode="bathymetry">02 Bathymetry</button><button data-mode="flow">03 Flow</button><button data-mode="wetness">04 Wetness</button><button data-mode="coupling">05 Coupling</button><button id="pause">Pause</button><button id="reset">Reset</button></div><div class="panel sliders"><label for="amp">Wave</label><input id="amp" type="range" min="0.03" max="0.24" step="0.01" value="0.13"><label for="tide">Tide</label><input id="tide" type="range" min="-0.12" max="0.18" step="0.01" value="0"><label for="radius">Active</label><input id="radius" type="range" min="8" max="35" step="1" value="22"><label for="particles">Particles</label><input id="particles" type="range" min="0" max="1" step="1" value="1"></div></div>
<script>
(()=>{'use strict';const canvas=document.getElementById('stage'),ctx=canvas.getContext('2d',{alpha:false}),statusEl=document.getElementById('status'),ampEl=document.getElementById('amp'),tideEl=document.getElementById('tide'),radiusEl=document.getElementById('radius'),particlesEl=document.getElementById('particles');const NX=192,NY=112,N=NX*NY,g=9.81,dx=.11,dy=.11;let dpr=1,W=0,H=0,mode='composite',paused=false,worldTime=0,last=performance.now(),acc=0,activeX=NX*.52,activeY=NY*.62,activeRadius=+radiusEl.value;const bed=new Float32Array(N),depth=new Float32Array(N),eta=new Float32Array(N),eta2=new Float32Array(N),u=new Float32Array(N),v=new Float32Array(N),u2=new Float32Array(N),v2=new Float32Array(N),wet=new Float32Array(N),foam=new Float32Array(N),obstacle=new Uint8Array(N),energy=new Float32Array(N);const imgCanvas=document.createElement('canvas');imgCanvas.width=NX;imgCanvas.height=NY;const imgCtx=imgCanvas.getContext('2d'),image=imgCtx.createImageData(NX,NY),droplets=[],idx=(x,y)=>y*NX+x,clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)};
function buildWorld(){const tide=+tideEl.value;for(let y=0;y<NY;y++){const q=y/(NY-1);for(let x=0;x<NX;x++){const k=idx(x,y),along=.045*Math.sin(x*.075)+.025*Math.sin(x*.19+1.2),berm=.08*Math.exp(-Math.pow((q-.86)/.075,2))*(.55+.45*Math.sin(x*.11+.4));let b=-1.65+2.05*q+along*smooth(.55,.95,q)+berm;const ox=x-NX*.54,oy=y-NY*.57,r=Math.hypot(ox,oy),rock=r<10.5;obstacle[k]=rock?1:0;if(rock)b=.62+.12*Math.cos(r*.42);bed[k]=b;const h=tide-b;depth[k]=rock?0:(b<tide+.25?Math.max(h,.018):0)}}}
function reset(){eta.fill(0);eta2.fill(0);u.fill(0);v.fill(0);u2.fill(0);v2.fill(0);wet.fill(0);foam.fill(0);energy.fill(0);droplets.length=0;worldTime=0;buildWorld()}reset();
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=Math.max(1,Math.floor(W*dpr));canvas.height=Math.max(1,Math.floor(H*dpr));canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function step(dt){const amp=+ampEl.value,tide=+tideEl.value;worldTime+=dt;for(let x=2;x<NX-2;x++){const k=idx(x,1);eta[k]=amp*(Math.sin(worldTime*2.35+x*.024)+.34*Math.sin(worldTime*3.8-x*.041+1.4));v[k]=.55*amp*Math.cos(worldTime*2.35+x*.024)}for(let y=2;y<NY-2;y++)for(let x=2;x<NX-2;x++){const k=idx(x,y),h=depth[k];if(obstacle[k]||h<=0){u2[k]=v2[k]=0;continue}const ex=(eta[k+1]-eta[k-1])/(2*dx),ey=(eta[k+NX]-eta[k-NX])/(2*dy),shallow=1-smooth(.03,.65,h),friction=.035+.72*shallow*shallow;u2[k]=(u[k]-g*ex*dt)/(1+friction*dt);v2[k]=(v[k]-g*ey*dt)/(1+friction*dt);if(obstacle[k+1]&&u2[k]>0)u2[k]=0;if(obstacle[k-1]&&u2[k]<0)u2[k]=0;if(obstacle[k+NX]&&v2[k]>0)v2[k]=0;if(obstacle[k-NX]&&v2[k]<0)v2[k]=0}for(let y=2;y<NY-2;y++)for(let x=2;x<NX-2;x++){const k=idx(x,y),h=depth[k];if(obstacle[k]||h<=0){eta2[k]=0;continue}const fxR=.5*(depth[k]+depth[k+1])*.5*(u2[k]+u2[k+1]),fxL=.5*(depth[k]+depth[k-1])*.5*(u2[k]+u2[k-1]),fyR=.5*(depth[k]+depth[k+NX])*.5*(v2[k]+v2[k+NX]),fyL=.5*(depth[k]+depth[k-NX])*.5*(v2[k]+v2[k-NX]),lap=eta[k+1]+eta[k-1]+eta[k+NX]+eta[k-NX]-4*eta[k];eta2[k]=clamp(eta[k]-dt*((fxR-fxL)/dx+(fyR-fyL)/dy)+.018*lap,-.34,.34)}eta.set(eta2);u.set(u2);v.set(v2);for(let y=2;y<NY-2;y++)for(let x=2;x<NX-2;x++){const k=idx(x,y),surface=tide+eta[k],speed=Math.hypot(u[k],v[k]),gx=Math.abs(eta[k+1]-eta[k-1])/(2*dx),gy=Math.abs(eta[k+NX]-eta[k-NX])/(2*dy),contact=surface>bed[k]+.004&&!obstacle[k];wet[k]=contact?1:wet[k]*Math.exp(-dt/18);const shallow=1-smooth(.05,.55,Math.max(tide-bed[k],0)),gen=clamp((speed*.75+(gx+gy)*1.15+Math.max(eta[k],0)*1.8-.065)*shallow,0,1);foam[k]=Math.max(foam[k]*Math.exp(-dt/2.8),gen);energy[k]=gen;if(+particlesEl.value>0&&gen>.33){const ax=x-activeX,ay=y-activeY;if(ax*ax+ay*ay<activeRadius*activeRadius&&droplets.length<900&&Math.random()<gen*.045)droplets.push({x,y,z:.1+Math.random()*.1,vx:u[k]*5+(Math.random()-.5)*1.8,vy:v[k]*5+(Math.random()-.5),vz:1.2+Math.random()*1.8,life:.7+Math.random()*.7})}}for(let i=droplets.length-1;i>=0;i--){const p=droplets[i];p.life-=dt;p.x+=p.vx*dt/dx;p.y+=p.vy*dt/dy;p.z+=p.vz*dt;p.vz-=4.8*dt;if(p.life<=0||p.z<0||p.x<0||p.x>=NX||p.y<0||p.y>=NY)droplets.splice(i,1)}}
function colors(k,x,y){const tide=+tideEl.value,surface=tide+eta[k],water=Math.max(surface-bed[k],0),sp=Math.hypot(u[k],v[k]);if(mode==='bathymetry'){const t=clamp((bed[k]+1.7)/2.4,0,1),c=Math.floor(22+210*t);return[c,c,c,255]}if(mode==='flow'){const c=Math.floor(18+230*clamp(sp/1.1,0,1));return obstacle[k]?[24,22,20,255]:[10,c,c+5,255]}if(mode==='wetness'){const w=wet[k],f=foam[k];return obstacle[k]?[24,21,19,255]:[Math.floor(8+245*f),Math.floor(10+210*w),Math.floor(12+235*w),255]}if(mode==='coupling'){const local=(x-activeX)**2+(y-activeY)**2<activeRadius**2,c=Math.floor(35+190*clamp(energy[k],0,1));return obstacle[k]?[34,28,24,255]:local?[12,c,c+18,255]:[8,22+Math.floor(45*wet[k]),30+Math.floor(70*wet[k]),255]}if(obstacle[k])return[37,31,28,255];const sandDry=[118,111,101],sandWet=[54,58,58];let r=sandDry[0]*(1-wet[k])+sandWet[0]*wet[k],gg=sandDry[1]*(1-wet[k])+sandWet[1]*wet[k],b=sandDry[2]*(1-wet[k])+sandWet[2]*wet[k];if(water>.001){const deep=clamp((tide-bed[k])/.9,0,1),crest=clamp((eta[k]+.16)/.32,0,1),wr=24+18*crest,wg=74+48*crest+20*(1-deep),wb=86+60*crest+34*(1-deep),a=clamp(.42+.4*deep+.16*water/.18,0,1);r=r*(1-a)+wr*a;gg=gg*(1-a)+wg*a;b=b*(1-a)+wb*a}const cb=smooth(.018,.10,eta[k])*(water>.001),tb=smooth(.02,.13,-eta[k])*(water>.001);r=(r+78*cb)*(1-.22*tb);gg=(gg+92*cb)*(1-.20*tb);b=(b+98*cb)*(1-.16*tb);const f=foam[k];r=r*(1-f)+236*f;gg=gg*(1-f)+244*f;b=b*(1-f)+244*f;return[r|0,gg|0,b|0,255]}
function render(){const data=image.data;for(let y=0;y<NY;y++)for(let x=0;x<NX;x++){const k=idx(x,y),o=k*4,c=colors(k,x,y);data[o]=c[0];data[o+1]=c[1];data[o+2]=c[2];data[o+3]=255}imgCtx.putImageData(image,0,0);ctx.fillStyle='#061014';ctx.fillRect(0,0,W,H);const margin=26,rw=W-2*margin,rh=H-2*margin;ctx.imageSmoothingEnabled=true;ctx.drawImage(imgCanvas,margin,margin,rw,rh);ctx.fillStyle='rgba(235,248,250,.65)';ctx.font='11px ui-monospace,SFMono-Regular,Menlo,monospace';ctx.fillText('OFFSHORE / OCEAN BOUNDARY',margin+12,margin+18);ctx.fillText('RUN-UP / BEACH STATE',margin+12,margin+rh-12);const sx=margin+activeX/NX*rw,sy=margin+activeY/NY*rh,sr=activeRadius/NX*rw;ctx.strokeStyle='rgba(236,250,252,.82)';ctx.lineWidth=1.2;ctx.setLineDash([7,5]);ctx.beginPath();ctx.arc(sx,sy,sr,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='rgba(240,250,252,.8)';ctx.fillText('LOCAL 3D PATCH',sx-sr+5,sy-sr-7);if(mode==='composite'||mode==='coupling')for(const p of droplets){const px=margin+p.x/NX*rw,py=margin+p.y/NY*rh-p.z*8;ctx.fillStyle=`rgba(242,250,252,${clamp(p.life,0,1)})`;ctx.beginPath();ctx.arc(px,py,1.2+p.z*.35,0,Math.PI*2);ctx.fill()}const graphW=Math.min(360,rw*.42),graphH=72,gx=margin+rw-graphW-12,gy=margin+rh-graphH-12;ctx.fillStyle='rgba(4,12,16,.72)';ctx.fillRect(gx,gy,graphW,graphH);ctx.strokeStyle='rgba(216,241,246,.28)';ctx.strokeRect(gx+.5,gy+.5,graphW-1,graphH-1);const xi=clamp(Math.floor(activeX),2,NX-3);ctx.beginPath();for(let y=0;y<NY;y++){const k=idx(xi,y),xx=gx+y/(NY-1)*graphW,yy=gy+graphH-(bed[k]+1.8)/2.45*graphH;y?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy)}ctx.strokeStyle='rgba(198,176,145,.9)';ctx.stroke();ctx.beginPath();for(let y=0;y<NY;y++){const k=idx(xi,y),xx=gx+y/(NY-1)*graphW,yy=gy+graphH-(+tideEl.value+eta[k]+1.8)/2.45*graphH;y?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy)}ctx.strokeStyle='rgba(206,244,250,.95)';ctx.stroke();ctx.fillStyle='rgba(215,239,244,.72)';ctx.fillText('BED + WATER CROSS-SECTION',gx+8,gy+14);statusEl.textContent=`t=${worldTime.toFixed(1)}s · droplets=${droplets.length} · mode=${mode}`}
function frame(now){const elapsed=Math.min(.08,(now-last)/1000);last=now;if(!paused){acc+=elapsed;const fixed=1/120;let n=0;while(acc>=fixed&&n<8){step(fixed);acc-=fixed;n++}if(n===8)acc=0}render();requestAnimationFrame(frame)}requestAnimationFrame(frame);document.querySelectorAll('[data-mode]').forEach(btn=>btn.addEventListener('click',()=>{mode=btn.dataset.mode;document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('on',b===btn))}));document.getElementById('pause').addEventListener('click',e=>{paused=!paused;e.currentTarget.textContent=paused?'Resume':'Pause'});document.getElementById('reset').addEventListener('click',reset);tideEl.addEventListener('input',buildWorld);radiusEl.addEventListener('input',()=>activeRadius=+radiusEl.value);let dragging=false;canvas.addEventListener('pointerdown',e=>{dragging=true;canvas.setPointerCapture(e.pointerId);moveActive(e)});canvas.addEventListener('pointermove',e=>{if(dragging)moveActive(e)});canvas.addEventListener('pointerup',()=>dragging=false);canvas.addEventListener('pointercancel',()=>dragging=false);function moveActive(e){const r=canvas.getBoundingClientRect(),margin=26,rw=r.width-2*margin,rh=r.height-2*margin;activeX=clamp((e.clientX-r.left-margin)/rw*NX,0,NX-1);activeY=clamp((e.clientY-r.top-margin)/rh*NY,0,NY-1)}})();
</script>
</body>
