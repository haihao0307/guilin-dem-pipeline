<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#031916"><title>Coral Mother R05</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#031310;color:#eef7f1;font:14px/1.6 system-ui,"Microsoft YaHei",sans-serif}.s{height:100%;display:grid;place-items:center}.b{width:min(450px,calc(100% - 40px));padding:26px;border:1px solid #ffffff1c;border-radius:20px;background:#0a1d19;box-shadow:0 24px 90px #0009;text-align:center}.m{width:66px;height:66px;margin:0 auto 15px;border:2px solid #72d7cf30;border-top-color:#e7b46f;border-radius:50%;animation:r 1s linear infinite}small{display:block;margin-top:7px;color:#93aaa2}@keyframes r{to{transform:rotate(1turn)}}</style></head><body><div class="s"><div class="b"><div class="m"></div><b>Coral Mother R05 正在打开</b><small>八类独立函数母体 · 上方显示 / 下方控制</small></div></div><script>(async()=>{try{const files=["coral-runtime-00.b64", "coral-runtime-01.b64", "coral-runtime-02.b64", "coral-runtime-03.b64", "coral-runtime-04.b64", "coral-runtime-05.b64", "coral-runtime-06.b64", "coral-runtime-07.b64"];let s='';for(const f of files){const r=await fetch(f,{cache:'force-cache'});if(!r.ok)throw new Error(f+' '+r.status);s+=await r.text()}const bin=Uint8Array.from(atob(s.trim()),c=>c.charCodeAt(0));if(typeof DecompressionStream==='undefined')throw new Error('Browser lacks DecompressionStream');const text=await new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'))).text();document.open();document.write(text);document.close()}catch(e){document.body.innerHTML='<div class="s"><div class="b"><b>Coral Mother R05 启动失败</b><small>'+String(e.message||e)+'</small></div></div>';console.error(e)}})();</script></body></html>
