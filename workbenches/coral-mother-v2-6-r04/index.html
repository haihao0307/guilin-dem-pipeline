<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#061513"><title>Coral Mother R04 · Staghorn Growth</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#041311;color:#eee8dc;font:13px/1.45 system-ui,"Microsoft YaHei",sans-serif}:root{--g:#d7a66b;--m:#91a098;--l:#ffffff1a}
#view{position:fixed;inset:0 0 34vh 0;background:radial-gradient(circle at 50% 18%,#17443d,#071a17 48%,#020a09);overflow:hidden}canvas{width:100%;height:100%;display:block;touch-action:none}
.hud{position:absolute;left:14px;top:12px;z-index:4;padding:9px 11px;border:1px solid var(--l);border-radius:10px;background:#07110fdd;max-width:min(470px,78vw)}.hud b{color:var(--g)}.hud small{display:block;color:var(--m);margin-top:2px}
#panel{position:fixed;left:0;right:0;bottom:0;height:34vh;background:#07110ff5;border-top:1px solid var(--l);box-shadow:0 -20px 60px #0008;padding:10px 12px;overflow:auto;display:grid;grid-template-columns:1.15fr .9fr .9fr;gap:10px;z-index:10}
.card{border:1px solid var(--l);border-radius:12px;background:#0c1b18;padding:10px;min-width:0}.k{font-size:9px;letter-spacing:.14em;color:var(--g);font-weight:800}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:7px}.big{font-size:22px;font-weight:750;color:white}.muted{color:var(--m);font-size:10px}
input[type=range]{width:100%;accent-color:var(--g)}button{border:1px solid var(--l);background:#ffffff08;color:#ddd6ca;border-radius:8px;padding:6px 8px;cursor:pointer}button.on,button:hover{border-color:#d7a66b88;background:#d7a66b18}
.metric{display:grid;grid-template-columns:1fr auto;gap:4px 10px;margin-top:6px;font-size:10px}.metric span:nth-child(odd){color:var(--m)}.metric span:nth-child(even){font-variant-numeric:tabular-nums;color:#e9e4dc}.badge{display:inline-block;border:1px solid #ffffff18;border-radius:999px;padding:3px 7px;color:#b6c9bf;font-size:9px;margin:5px 4px 0 0}
@media(max-width:760px){#view{bottom:36vh}#panel{height:36vh;display:flex;overflow-x:auto;overflow-y:hidden}.card{flex:0 0 84vw;overflow:auto}}
</style></head><body>
<div id="view"><canvas id="gl"></canvas><div class="hud"><b>Coral Mother R04 · 鹿角生长核</b><small>固定生长事件图谱 · 上 2/3 展示 / 下 1/3 控制 · 不重复随机生成</small></div></div>
<div id="panel">
<section class="card"><div class="k">AGE / GROWTH</div><div class="row"><span>年龄</span><span class="big" id="ageOut">10 年</span></div><input id="age" type="range" min="0" max="220" step=".2" value="10"><div class="row"><button data-a="1">1年</button><button data-a="10" class="on">10年</button><button data-a="50">50年</button><button data-a="100">100年</button><button data-a="200">200年</button></div><div class="muted" id="stageText"></div><span class="badge">中央主干</span><span class="badge">60–90°二级分枝候选</span><span class="badge">断片再附着</span></section>
<section class="card"><div class="k">MEASURED STATE</div><div class="metric"><span>可见枝段</span><span id="segOut">0</span><span>启动群体</span><span id="colOut">1</span><span>群落宽度 X</span><span id="xOut">0 m</span><span>群落高度 Y</span><span id="yOut">0 m</span><span>群落深度 Z</span><span id="zOut">0 m</span><span>冻结种子</span><span>194410–194417</span></div><div class="muted" style="margin-top:7px">年龄滑块只读取已冻结事件；改变年份不会重新找随机形态。</div></section>
<section class="card"><div class="k">SURFACE / VIEW</div><label class="muted">微表面 <span id="microOut">0.62</span></label><input id="micro" type="range" min="0" max="1.2" step=".01" value=".62"><label class="muted">水流摆动 <span id="flowOut">0.22</span></label><input id="flow" type="range" min="0" max="1" step=".01" value=".22"><div class="row"><button data-pal="0" class="on">自然褐</button><button data-pal="1">紫</button><button data-pal="2">蓝</button><button data-pal="3">红</button></div><div class="muted" style="margin-top:7px">颜色是材质表达候选，不作为 Palau 物种鉴定。拖动旋转，滚轮缩放。</div></section>
</div>
<script>
(async()=>{const data=await fetch('frozen-staghorn-growth.json',{cache:'force-cache'}).then(r=>r.json()),EVENTS=data.events,c=document.getElementById('gl'),gl=c.getContext('webgl2',{antialias:true,alpha:false});if(!gl){document.body.innerHTML='<div style="padding:30px">需要 WebGL2</div>';return}
const VS='#version 300 es\nprecision highp float;layout(location=0)in vec3 p;layout(location=1)in vec3 n;layout(location=2)in float b;uniform mat4 mvp;uniform float t,f;out vec3 P,N;out float B;void main(){vec3 q=p;float h=max(q.y,0.);q.x+=sin(t*.85+q.y*4.+q.x*1.7)*.012*f*min(h,1.2);P=q;N=n;B=b;gl_Position=mvp*vec4(q,1.);}';
const FS='#version 300 es\nprecision highp float;in vec3 P,N;in float B;out vec4 o;uniform float micro;uniform int pal;float h(vec3 p){p=fract(p*.3183099+.1);p*=17.;return fract(p.x*p.y*p.z*(p.x+p.y+p.z));}float no(vec3 p){vec3 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);float a=h(i),b=h(i+vec3(1,0,0)),c=h(i+vec3(0,1,0)),d=h(i+vec3(1,1,0)),e=h(i+vec3(0,0,1)),g=h(i+vec3(1,0,1)),j=h(i+vec3(0,1,1)),k=h(i+vec3(1,1,1));return mix(mix(mix(a,b,f.x),mix(c,d,f.x),f.y),mix(mix(e,g,f.x),mix(j,k,f.x),f.y),f.z);}void main(){vec3 n=normalize(N),L=normalize(vec3(.55,.82,.34));float nd=max(dot(n,L),0.);vec3 base=pal==1?vec3(.34,.14,.48):pal==2?vec3(.12,.33,.47):pal==3?vec3(.56,.16,.12):vec3(.46,.35,.20);float x=no(P*(18.+micro*26.)),po=smoothstep(.68,.92,x)*micro;base*=.82+.32*no(P*3.2);base=mix(base,base*.42,po*.58);float tip=smoothstep(.72,.98,fract(B*.137+P.y*1.7));base=mix(base,vec3(.92,.86,.72),tip*.12);vec3 col=base*(.20+.86*nd)+vec3(.08,.16,.14)*.32;o=vec4(pow(col,vec3(1./2.2)),1.);}';
function S(type,src){let s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s}const pr=gl.createProgram();gl.attachShader(pr,S(gl.VERTEX_SHADER,VS));gl.attachShader(pr,S(gl.FRAGMENT_SHADER,FS));gl.linkProgram(pr);gl.useProgram(pr);
const va=gl.createVertexArray(),pb=gl.createBuffer(),nb=gl.createBuffer(),bb=gl.createBuffer();gl.bindVertexArray(va);function up(loc,buf,a,size){gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(a),gl.DYNAMIC_DRAW);gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,size,gl.FLOAT,false,0,0)}
const add=(a,b)=>a.map((x,i)=>x+b[i]),sub=(a,b)=>a.map((x,i)=>x-b[i]),mul=(a,s)=>a.map(x=>x*s),len=a=>Math.hypot(...a),norm=a=>{let l=len(a)||1;return mul(a,1/l)},cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
let age=10,count=0,pal=0,micro=.62,flow=.22,rx=-.18,ry=.62,zoom=5.2,drag=false,lx=0,ly=0;
function rebuild(){let P=[],N=[],B=[],pts=[],cols=new Set(),vis=0,SIDES=8;for(const e of EVENTS){if(age<e.birth)continue;let q=Math.min(1,Math.max(0,(age-e.birth)/e.duration)),a=e.a,b=add(e.a,mul(sub(e.b,e.a),q));if(q<=0)continue;vis++;cols.add(e.colony);pts.push(a,b);let d=norm(sub(b,a)),ref=Math.abs(d[1])<.92?[0,1,0]:[1,0,0],u=norm(cross(d,ref)),v=norm(cross(d,u));for(let i=0;i<SIDES;i++){let a0=i/SIDES*Math.PI*2,a1=(i+1)/SIDES*Math.PI*2,n0=norm(add(mul(u,Math.cos(a0)),mul(v,Math.sin(a0)))),n1=norm(add(mul(u,Math.cos(a1)),mul(v,Math.sin(a1)))),c0=add(a,add(mul(u,Math.cos(a0)*e.r0),mul(v,Math.sin(a0)*e.r0))),c1=add(a,add(mul(u,Math.cos(a1)*e.r0),mul(v,Math.sin(a1)*e.r0))),d0=add(b,add(mul(u,Math.cos(a0)*e.r1),mul(v,Math.sin(a0)*e.r1))),d1=add(b,add(mul(u,Math.cos(a1)*e.r1),mul(v,Math.sin(a1)*e.r1)));for(const z of [[c0,n0],[d0,n0],[d1,n1],[c0,n0],[d1,n1],[c1,n1]]){P.push(...z[0]);N.push(...z[1]);B.push(e.birth)}}}up(0,pb,P,3);up(1,nb,N,3);up(2,bb,B,1);count=P.length/3;let dims=[0,0,0];if(pts.length){let mn=[Infinity,Infinity,Infinity],mx=[-Infinity,-Infinity,-Infinity];for(const p of pts)for(let k=0;k<3;k++){mn[k]=Math.min(mn[k],p[k]);mx[k]=Math.max(mx[k],p[k])}dims=mx.map((x,k)=>x-mn[k])}segOut.textContent=vis;colOut.textContent=cols.size;xOut.textContent=dims[0].toFixed(2)+' m';yOut.textContent=dims[1].toFixed(2)+' m';zOut.textContent=dims[2].toFixed(2)+' m';ageOut.textContent=(age<10?age.toFixed(1):age.toFixed(0))+' 年';stageText.textContent=age<3?'附着芽体 / 主轴建立':age<15?'单株一级、二级分枝建立':age<35?'成熟单株 / 第一轮断片候选':age<90?'断片再附着 / 小型 thicket 形成':age<160?'多株 thicket 横向扩张':'成熟 thicket / 群落扩张平台期'}
function mm(a,b){let o=Array(16).fill(0);for(let r=0;r<4;r++)for(let c=0;c<4;c++)for(let k=0;k<4;k++)o[c*4+r]+=a[k*4+r]*b[c*4+k];return o}function pe(fv,as,n,f){let q=1/Math.tan(fv/2),nf=1/(n-f);return[q/as,0,0,0,0,q,0,0,0,0,(f+n)*nf,-1,0,0,2*f*n*nf,0]}function la(e,c,u){let z=norm(sub(e,c)),x=norm(cross(u,z)),y=cross(z,x);return[x[0],y[0],z[0],0,x[1],y[1],z[1],0,x[2],y[2],z[2],0,-x[0]*e[0]-x[1]*e[1]-x[2]*e[2],-y[0]*e[0]-y[1]*e[1]-y[2]*e[2],-z[0]*e[0]-z[1]*e[1]-z[2]*e[2],1]}
function render(T){let d=Math.min(devicePixelRatio||1,2),w=Math.max(1,Math.floor(c.clientWidth*d)),h=Math.max(1,Math.floor(c.clientHeight*d));if(c.width!=w||c.height!=h){c.width=w;c.height=h}gl.viewport(0,0,w,h);gl.enable(gl.DEPTH_TEST);gl.enable(gl.CULL_FACE);gl.clearColor(.015,.055,.048,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);let ctr=[0,.45,0],eye=[Math.sin(ry)*Math.cos(rx)*zoom,.45+Math.sin(rx)*zoom,Math.cos(ry)*Math.cos(rx)*zoom],mvp=mm(pe(.75,w/h,.02,50),la(eye,ctr,[0,1,0]));gl.useProgram(pr);gl.bindVertexArray(va);gl.uniformMatrix4fv(gl.getUniformLocation(pr,'mvp'),false,new Float32Array(mvp));gl.uniform1f(gl.getUniformLocation(pr,'t'),T*.001);gl.uniform1f(gl.getUniformLocation(pr,'f'),flow);gl.uniform1f(gl.getUniformLocation(pr,'micro'),micro);gl.uniform1i(gl.getUniformLocation(pr,'pal'),pal);gl.drawArrays(gl.TRIANGLES,0,count);requestAnimationFrame(render)}
age.oninput=()=>{window.age=+age.value;document.querySelectorAll('[data-a]').forEach(b=>b.classList.toggle('on',Math.abs(+b.dataset.a-window.age)<.2));age=window.age;rebuild()};document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{age.value=b.dataset.a;age.dispatchEvent(new Event('input'))});document.getElementById('micro').oninput=e=>{micro=+e.target.value;microOut.textContent=micro.toFixed(2)};document.getElementById('flow').oninput=e=>{flow=+e.target.value;flowOut.textContent=flow.toFixed(2)};document.querySelectorAll('[data-pal]').forEach(b=>b.onclick=()=>{pal=+b.dataset.pal;document.querySelectorAll('[data-pal]').forEach(x=>x.classList.toggle('on',x===b))});
c.onpointerdown=e=>{drag=true;lx=e.clientX;ly=e.clientY;c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(!drag)return;ry+=(e.clientX-lx)*.008;rx=Math.max(-1.1,Math.min(.65,rx+(e.clientY-ly)*.006));lx=e.clientX;ly=e.clientY};c.onpointerup=()=>drag=false;c.onwheel=e=>{e.preventDefault();zoom=Math.max(1.5,Math.min(14,zoom*Math.exp(e.deltaY*.001)))};
rebuild();requestAnimationFrame(render)})().catch(e=>{document.body.innerHTML='<div style="padding:30px;color:white">R04 启动失败：'+e.message+'</div>';console.error(e)})
</script></body></html>
