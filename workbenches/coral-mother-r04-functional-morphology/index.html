<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#041311"><title>Coral Mother R04</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#03110f;color:#f3f4ec;font:14px/1.55 system-ui,"Microsoft YaHei",sans-serif}.s{height:100%;display:grid;place-items:center}.b{width:min(440px,calc(100% - 40px));padding:25px;border:1px solid #d8f6e51c;border-radius:20px;background:#0b1715;box-shadow:0 24px 90px #0009;text-align:center}.m{width:66px;height:66px;margin:0 auto 15px;border:2px solid #76d8cf35;border-top-color:#e5b26c;border-radius:50%;animation:r 1s linear infinite}small{display:block;margin-top:6px;color:#9fb1aa}@keyframes r{to{transform:rotate(1turn)}}</style></head><body><div class="s"><div class="b"><div class="m"></div><b>Coral Mother R04 正在打开</b><small>独立形态核 · 多尺度表面场 · 上方显示 / 下方控制</small></div></div><script>(async()=>{try{const files=["coral-runtime-00.b64", "coral-runtime-01.b64"];let s='';for(const f of files){const r=await fetch(f,{cache:'force-cache'});if(!r.ok)throw new Error(f+' '+r.status);s+=await r.text()}const bin=Uint8Array.from(atob(s.trim()),c=>c.charCodeAt(0));if(typeof DecompressionStream==='undefined')throw new Error('Browser lacks DecompressionStream');const text=await new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'))).text();document.open();document.write(text);document.close()}catch(e){document.body.innerHTML='<div class="s"><div class="b"><b>Coral Mother R04 启动失败</b><small>'+String(e.message||e)+'</small></div></div>';console.error(e)}})();</script></body></html>
