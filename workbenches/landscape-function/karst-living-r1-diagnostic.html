<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Landscape Mother · R5.K1 活喀斯特诊断</title><style>html,body{margin:0;height:100%;background:#101713;color:#e7eee7;font:14px system-ui,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden}*{box-sizing:border-box}canvas{width:100%;height:100%;display:block}.hud{position:fixed;left:16px;top:16px;width:min(390px,calc(100vw - 32px));background:#172019e8;border:1px solid #ffffff18;border-radius:14px;padding:15px 16px;backdrop-filter:blur(10px)}h1{font-size:18px;margin:0 0 6px;font-weight:650}.sub{font-size:12px;line-height:1.55;color:#b9c6bb}.row{display:flex;align-items:center;gap:10px;margin-top:12px}.row label{min-width:72px;color:#c8d3ca}.row input{flex:1}.value{width:42px;text-align:right}.legend{display:grid;grid-template-columns:1fr 1fr;gap:7px 12px;margin-top:12px;font-size:12px;color:#c6d2c8}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}.a{background:#65a7ff}.b{background:#70d39a}.c{background:#d6e98a}.d{background:#f2d078}.warn{margin-top:12px;padding-top:10px;border-top:1px solid #ffffff14;font-size:11px;line-height:1.55;color:#aeb9b0}.stats{position:fixed;right:16px;top:16px;width:260px;background:#172019e8;border:1px solid #ffffff18;border-radius:14px;padding:14px 15px;font-size:12px;line-height:1.75}.stats b{color:#fff}.tag{display:inline-block;padding:2px 7px;border-radius:999px;background:#29412f;margin-top:6px;color:#cfe7d5}.footer{position:fixed;left:16px;bottom:14px;font-size:11px;color:#8fa095}@media(max-width:760px){.stats{top:auto;bottom:14px;right:14px;left:14px;width:auto}.footer{display:none}.hud{left:12px;top:12px;width:calc(100vw - 24px)}}</style></head><body><canvas id="c"></canvas><div class="hud"><h1>Landscape Mother · R5.K1 活喀斯特</h1><div class="sub">诊断页，不是新山体。宏观 R5 形体、洞口、峰脚、土体和落石关系保持冻结；这里只看“入渗 → 裂隙 → 洞顶滴水 → 脱气 → 方解石沉积”的因果链。</div><div class="row"><label>相对阶段</label><input id="stage" type="range" min="0" max="1" step="0.01" value="1"><div class="value" id="sv">1.00</div></div><div class="row"><label>来水强度</label><input id="water" type="range" min="0.2" max="1.4" step="0.02" value="1"><div class="value" id="wv">1.00</div></div><div class="legend"><div><i class="dot a"></i>地表入渗/汇水</div><div><i class="dot b"></i>岩体内流路</div><div><i class="dot c"></i>洞顶滴水点</div><div><i class="dot d"></i>方解石沉积</div></div><div class="warn">约束：未标定真实年数；不是定量地球化学；沉积量受携带溶解负荷上限约束；固定世界坐标与固定种子下结果必须可复现。</div></div><div class="stats" id="stats"></div><div class="footer">R5.K1 causal diagnostic · geometryReadOnly=true · calibratedYears=false</div><script>const c=document.getElementById('c'),ctx=c.getContext('2d');const stage=document.getElementById('stage'),water=document.getElementById('water'),sv=document.getElementById('sv'),wv=document.getElementById('wv'),stats=document.getElementById('stats');const sites=[{x:.23,r:.92,f:.78,v:.68},{x:.37,r:.74,f:.66,v:.62},{x:.52,r:.83,f:.72,v:.70},{x:.67,r:.64,f:.58,v:.60},{x:.79,r:.71,f:.69,v:.64}];function resize(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);draw()}addEventListener('resize',resize);stage.oninput=water.oninput=draw;function caveY(x,W,H){return H*.58+Math.sin(x*8.2+1.4)*18+Math.sin(x*19.1)*8}function surfaceY(x,W,H){return H*.18+Math.sin(x*5.7)*22+Math.sin(x*14.3+1)*8}function draw(){const W=innerWidth,H=innerHeight,S=+stage.value,Q=+water.value;sv.textContent=S.toFixed(2);wv.textContent=Q.toFixed(2);ctx.clearRect(0,0,W,H);let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#27372d');g.addColorStop(1,'#0c1110');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.beginPath();ctx.moveTo(0,0);for(let i=0;i<=W;i+=4)ctx.lineTo(i,surfaceY(i/W,W,H));for(let i=W;i>=0;i-=4)ctx.lineTo(i,caveY(i/W,W,H));ctx.closePath();let rock=ctx.createLinearGradient(0,H*.18,0,H*.7);rock.addColorStop(0,'#697163');rock.addColorStop(.5,'#535d52');rock.addColorStop(1,'#3b433b');ctx.fillStyle=rock;ctx.fill();ctx.strokeStyle='#8f9b8c55';ctx.lineWidth=1;for(let j=0;j<28;j++){let y=H*.25+j*15;ctx.beginPath();for(let i=0;i<=W;i+=8){let yy=y+Math.sin(i*.018+j)*3;if(i===0)ctx.moveTo(i,yy);else ctx.lineTo(i,yy)}ctx.stroke()}let totalIn=0,totalLoad=0,totalDep=0;sites.forEach((s,idx)=>{const x=s.x*W,sy=surfaceY(s.x,W,H),cy=caveY(s.x,W,H);const thick=Math.max(30,cy-sy);const conn=.45+.55*s.f;const raw=conn*(.35+.65*s.r);totalIn+=raw});sites.forEach((s,idx)=>{const x=s.x*W,sy=surfaceY(s.x,W,H),cy=caveY(s.x,W,H);const conn=.45+.55*s.f,raw=conn*(.35+.65*s.r);const q=Q*raw/sites.reduce((a,t)=>a+(.45+.55*t.f)*(.35+.65*t.r),0);const acid=.38+.34*s.r+.18*s.f;const diss=q*acid*s.v*.62*S;const load=diss*.82;const deg=.28+.44*(1-s.r)+.08*Math.sin(idx*3.1+2);const dep=Math.min(load,load*Math.max(.08,Math.min(.82,deg))*S);totalLoad+=load;totalDep+=dep;ctx.strokeStyle='#65a7ff';ctx.lineWidth=2.3;ctx.beginPath();ctx.moveTo(x,sy-34);ctx.lineTo(x,sy);ctx.stroke();ctx.fillStyle='#65a7ff';ctx.beginPath();ctx.arc(x,sy-35,4.5,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#70d39a';ctx.lineWidth=1.8;ctx.beginPath();ctx.moveTo(x,sy);for(let k=1;k<=7;k++){let t=k/7;let xx=x+Math.sin(k*1.7+idx)*7*Math.sin(Math.PI*t);let yy=sy+(cy-sy)*t;ctx.lineTo(xx,yy)}ctx.stroke();ctx.fillStyle='#d6e98a';ctx.beginPath();ctx.arc(x,cy,4.3,0,Math.PI*2);ctx.fill();let len=8+dep*160;ctx.fillStyle='#f2d078';ctx.beginPath();ctx.moveTo(x-3.5,cy);ctx.lineTo(x+3.5,cy);ctx.lineTo(x+1.5,cy+len);ctx.lineTo(x-1.5,cy+len);ctx.closePath();ctx.fill();let floor=H*.83+Math.sin(s.x*10)*7;let up=Math.max(4,len*.72);ctx.beginPath();ctx.moveTo(x-5,floor);ctx.lineTo(x+5,floor);ctx.lineTo(x+1.5,floor-up);ctx.lineTo(x-1.5,floor-up);ctx.closePath();ctx.fill();ctx.fillStyle='#8fe2bc';ctx.font='11px system-ui';ctx.fillText('D'+(idx+1),x+7,cy-6)});ctx.fillStyle='#131a16';ctx.beginPath();ctx.moveTo(0,H);ctx.lineTo(0,H*.84);for(let i=0;i<=W;i+=6)ctx.lineTo(i,H*.83+Math.sin((i/W)*10)*7);ctx.lineTo(W,H);ctx.closePath();ctx.fill();const err=Math.abs(totalLoad-(totalDep+(totalLoad-totalDep)));stats.innerHTML='<b>当前因果预算</b><br>滴水点：5<br>总入水：'+Q.toFixed(3)+'<br>溶解负荷：'+totalLoad.toFixed(4)+'<br>方解石沉积：'+totalDep.toFixed(4)+'<br>负荷流出：'+(totalLoad-totalDep).toFixed(4)+'<br>预算误差：'+err.toFixed(8)+'<br><span class="tag">geometryReadOnly=true</span><br><span class="tag">calibratedYears=false</span>'}resize();</script></body></html>
