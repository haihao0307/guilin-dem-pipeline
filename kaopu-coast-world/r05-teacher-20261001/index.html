<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#aeb7b9">
<title>KaoPu Coast Teacher Replica R05</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:
radial-gradient(ellipse at 68% 14%,rgba(255,255,255,.60),transparent 33%),
radial-gradient(ellipse at 28% 24%,rgba(255,255,255,.24),transparent 28%),
linear-gradient(#b9c2c4 0%,#aeb9bb 43%,#899a9d 65%,#667d82 100%);
font-family:system-ui,-apple-system,"PingFang SC",sans-serif;color:#eef5f5}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:
radial-gradient(ellipse at 50% 10%,transparent 0 34%,rgba(37,48,52,.08) 72%,rgba(11,21,24,.18) 100%)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.glass{background:rgba(18,29,33,.50);border:1px solid rgba(255,255,255,.18);
box-shadow:0 12px 36px rgba(5,12,15,.18);backdrop-filter:blur(13px);-webkit-backdrop-filter:blur(13px)}
#brand{position:fixed;z-index:8;left:14px;top:max(14px,env(safe-area-inset-top));padding:9px 12px;border-radius:12px}
#brand b{font-size:11px;letter-spacing:.12em} #brand small{display:block;margin-top:2px;color:#c6d1d2;font-size:8px;letter-spacing:.08em}
#views{position:fixed;z-index:8;left:50%;bottom:max(13px,env(safe-area-inset-bottom));transform:translateX(-50%);
display:flex;gap:5px;padding:5px;border-radius:999px;max-width:calc(100vw - 18px);overflow:auto;scrollbar-width:none}
button{border:1px solid rgba(255,255,255,.14);background:rgba(10,22,27,.56);color:#edf5f5;border-radius:999px;padding:8px 12px;white-space:nowrap}
button.on{background:rgba(224,239,239,.18);border-color:rgba(255,255,255,.46)}
#atlasBtn{position:fixed;right:14px;top:max(14px,env(safe-area-inset-top));z-index:9}
#atlas{position:fixed;z-index:10;right:12px;top:62px;bottom:65px;width:min(330px,calc(100vw - 24px));padding:14px;border-radius:18px;
transform:translateX(calc(100% + 24px));opacity:0;pointer-events:none;transition:.22s}
#atlas.open{transform:none;opacity:1;pointer-events:auto}
#atlas h2{font-size:17px;margin:0 0 5px}#atlas p{font-size:10px;color:#c3d0d1;line-height:1.55}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
#status{position:fixed;z-index:7;left:14px;bottom:66px;padding:7px 10px;border-radius:11px;font-size:9px;color:#d4dede;max-width:310px}
#fail{display:none;position:fixed;inset:0;z-index:30;place-items:center;background:#21373c;text-align:center;padding:30px}
#fail.show{display:grid}#fail h1{font-size:21px}#fail p{color:#c5d2d4;line-height:1.55}
@media(max-width:700px){#brand small,#status{display:none}button{font-size:10px;padding:8px 10px}#atlasBtn{font-size:0;width:42px;height:38px;padding:0}#atlasBtn:after{content:"≡";font-size:18px}}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="fail"><div><h1>图形初始化失败</h1><p id="failmsg">请刷新页面。</p></div></div>
<div id="brand" class="glass"><b>KAOPU COAST · TEACHER R05</b><small>BLACK SAND · WET FILM · BREAKERS · BASALT · SEA STACKS</small></div>
<button id="atlasBtn" class="glass">Field Atlas</button>
<div id="status" class="glass">拖动观察 · 双指 / 滚轮缩放 · Teacher Match：先复刻，再抽象</div>
<nav id="views" class="glass">
<button class="on" data-v="world">老师构图</button><button data-v="shore">海岸</button><button data-v="breaker">破浪</button><button data-v="stack">海蚀柱</button><button data-v="top">俯视</button>
</nav>
<aside id="atlas" class="glass">
<h2>Field Atlas</h2>
<p>同一世界的第二层诊断，不替代最终画面。</p>
<div class="row"><button class="on" data-m="0">World</button><button data-m="1">Depth</button><button data-m="2">Wetness</button><button data-m="3">Wave</button></div>
<p><b>本版只做 Teacher Match：固定镜头、黑砂、湿膜、灰绿海水、连续破浪、玄武岩柱和海蚀柱。诊断层不替代最终画面。</p>
</aside>
<script>
(()=>{"use strict";
const C=document.getElementById("gl");
const G=C.getContext("webgl",{alpha:true,antialias:true,powerPreference:"high-performance"});
if(!G){fail("Safari/Chrome 没有提供可用 WebGL context。");return}
const ext=G.getExtension("OES_standard_derivatives");
const VS=`precision mediump float;
attribute vec3 p,n;attribute vec4 c;
uniform mat4 m;uniform vec3 cam;uniform float t,kind;
varying vec3 vP,vN;varying vec4 vC;varying float vD;
float coast(float x){return -4.5+.050*x+1.45*sin(x*.052)+.48*sin(x*.121+1.7);}
void main(){
 vec3 q=p; vec3 nn=n;
 if(kind>1.5&&kind<2.5){
   float w1=.34*sin(q.x*.105+t*.86+q.z*.030);
   float w2=.19*sin(q.x*.035-q.z*.125+t*.58);
   float w3=.095*sin((q.x+q.z)*.26+t*1.42);
   float w4=.045*sin(q.x*.58-q.z*.41+t*2.05);
   q.y+=w1+w2+w3+w4;
   float dx=.34*.105*cos(q.x*.105+t*.86+q.z*.030)+.19*.035*cos(q.x*.035-q.z*.125+t*.58)+.095*.26*cos((q.x+q.z)*.26+t*1.42)+.045*.58*cos(q.x*.58-q.z*.41+t*2.05);
   float dz=.34*.030*cos(q.x*.105+t*.86+q.z*.030)-.19*.125*cos(q.x*.035-q.z*.125+t*.58)+.095*.26*cos((q.x+q.z)*.26+t*1.42)-.045*.41*cos(q.x*.58-q.z*.41+t*2.05);
   nn=normalize(vec3(-dx,1.0,-dz));
 }
 vP=q;vN=nn;vC=c;vD=distance(cam,q);gl_Position=m*vec4(q,1.0);
}`;
const FS=`precision mediump float;
varying vec3 vP,vN;varying vec4 vC;varying float vD;
uniform vec3 cam;uniform float t,kind,mode;
float coast(float x){return -4.5+.050*x+1.45*sin(x*.052)+.48*sin(x*.121+1.7);}
float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.0-2.0*f);return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);}float fbm(vec2 p){float s=0.,a=.5;for(int i=0;i<4;i++){s+=a*noise(p);p*=2.03;a*=.5;}return s;}
void main(){
 vec3 N=normalize(vN),V=normalize(cam-vP);
 vec3 fog=vec3(.64,.69,.70);
 vec3 col=vC.rgb;
 if(kind>1.5&&kind<2.5){
   float sd=vP.z-coast(vP.x);
   float depth=clamp(sd/46.0,0.0,1.0);
   vec3 shallow=vec3(.30,.39,.39),deep=vec3(.115,.19,.20);
   float fres=pow(1.0-max(dot(N,V),0.0),4.0);
   vec3 sky=mix(vec3(.56,.59,.59),vec3(.82,.84,.83),clamp(N.y*.55+.35,0.0,1.0));
   col=mix(shallow,deep,depth*.90);
   col=mix(col,sky,.16+.49*fres);
   float crest=smoothstep(.42,.76,1.0-N.y);
   float b0=2.6+1.25*sin(vP.x*.052+t*.23);
   float b1=exp(-pow((sd-b0)/1.00,2.0));
   float b2=.58*exp(-pow((sd-(6.7+1.45*sin(vP.x*.044+t*.20)))/1.48,2.0));
   float b3=.28*exp(-pow((sd-(10.8+1.7*sin(vP.x*.038+t*.16)))/1.85,2.0));
   float lace=.42+.58*fbm(vP.xz*.43+vec2(t*.07,-t*.05));
   float holes=smoothstep(.35,.68,fbm(vP.xz*.91+vec2(2.7,-1.3)));
   float foam=clamp((b1+b2+b3)*lace*(.52+.48*holes)+crest*.12,0.0,1.0);
   col=mix(col,vec3(.88,.895,.88),foam*.80);
   if(mode>.5&&mode<1.5)col=mix(vec3(.18,.45,.46),vec3(.035,.08,.095),depth);
   if(mode>2.5)col=mix(col,vec3(.79,.88,.88),(.5+.5*sin(vP.x*.18+vP.z*.21+t*1.7))*.22);
 }else{
   vec3 L=normalize(vec3(-.25,.82,.42));
   float diff=.30+.70*max(dot(N,L),0.0);
   float spec=pow(max(dot(reflect(-L,N),V),0.0),22.0);
   col*=diff; col+=spec*.11;
   if(vC.a>.52&&vC.a<.80){ // black sand + wet film
     float d=coast(vP.x)-vP.z;
     float grain=.76+.24*fbm(vP.xz*2.6)+.07*noise(vP.xz*9.0);
     float wet=1.0-smoothstep(2.2,9.5,d);
     float film=1.0-smoothstep(.1,4.4,d);
     vec3 dry=vec3(.090,.087,.082)*grain;
     vec3 soaked=vec3(.031,.033,.032)*(.9+.1*grain);
     col=mix(dry,soaked,clamp(wet*.82+film*.18,0.,1.));
     float gl=pow(max(dot(reflect(-L,N),V),0.0),64.0);
     col+=gl*(.018+.24*film);
     col*=.97+.03*sin(vP.x*17.0+2.0*noise(vP.xz*5.0));
   }
   if(kind>2.5&&kind<3.5){ // rock / basalt
     float stripe=.83+.17*sin(vP.y*5.9+vP.x*.17+vP.z*.11);
     col*=stripe;
   }
   if(mode>1.5&&mode<2.5){
     float wet=1.0-smoothstep(.0,8.0,coast(vP.x)-vP.z);
     col=mix(col,vec3(.10,.52,.41),wet*.60);
   }
 }
 float haze=1.0-exp(-vD*vD*.000045);
 col=mix(col,fog,clamp(haze,0.0,.82));
 gl_FragColor=vec4(col,1.0);
}`;
function fail(s){document.getElementById("fail").classList.add("show");document.getElementById("failmsg").textContent=s}
function shader(type,src){const x=G.createShader(type);G.shaderSource(x,src);G.compileShader(x);if(!G.getShaderParameter(x,G.COMPILE_STATUS))throw Error(G.getShaderInfoLog(x));return x}
let P;
try{P=G.createProgram();G.attachShader(P,shader(G.VERTEX_SHADER,VS));G.attachShader(P,shader(G.FRAGMENT_SHADER,FS));G.linkProgram(P);if(!G.getProgramParameter(P,G.LINK_STATUS))throw Error(G.getProgramInfoLog(P))}
catch(e){fail(e.message);return}
const AP=G.getAttribLocation(P,"p"),AN=G.getAttribLocation(P,"n"),AC=G.getAttribLocation(P,"c");
const UM=G.getUniformLocation(P,"m"),UCAM=G.getUniformLocation(P,"cam"),UT=G.getUniformLocation(P,"t"),UK=G.getUniformLocation(P,"kind"),UMODE=G.getUniformLocation(P,"mode");

function normalise(a){const l=Math.hypot(a[0],a[1],a[2])||1;return[a[0]/l,a[1]/l,a[2]/l]}
function coast(x){return -4.5+.050*x+1.45*Math.sin(x*.052)+.48*Math.sin(x*.121+1.7)}
function terrainY(x,z){
 const d=coast(x)-z;
 if(d<0)return -Math.min(13,0.085*(-d)+0.0035*(-d)*(-d));
 let y=.035*d+.0017*d*d;
 y+=.19*Math.sin(x*.055+z*.031)+.08*Math.sin(x*.17-z*.11);
 if(z<-25)y+=Math.max(0,(-z-25))*.24;
 return y;
}
function rgbaForTerrain(x,z,y){
 const d=coast(x)-z;
 if(d<-1.0)return [.07,.10,.10,0];
 if(d<2.0)return [.030,.031,.030,.72];       // saturated volcanic black sand
 if(d<7.0)return [.050,.049,.046,.66];       // wet black sand
 if(d<14.0)return [.078,.074,.068,.60];      // drying black sand
 return [.100,.096,.088,.56];
}
function mesh(pos,nor,col,idx,kind){
 const o={kind,n:idx.length};
 function buf(data){const b=G.createBuffer();G.bindBuffer(G.ARRAY_BUFFER,b);G.bufferData(G.ARRAY_BUFFER,new Float32Array(data),G.STATIC_DRAW);return b}
 o.p=buf(pos);o.nm=buf(nor);o.c=buf(col);o.i=G.createBuffer();G.bindBuffer(G.ELEMENT_ARRAY_BUFFER,o.i);G.bufferData(G.ELEMENT_ARRAY_BUFFER,new Uint16Array(idx),G.STATIC_DRAW);return o
}
function grid(nx,nz,dx,dz,water){
 const p=[],n=[],c=[],idx=[],x0=-72,z0=-42;
 for(let j=0;j<=nz;j++)for(let i=0;i<=nx;i++){
   const x=x0+i*dx,z=z0+j*dz,y=water?.08:terrainY(x,z);
   p.push(x,y,z);
   if(water){n.push(0,1,0);c.push(.12,.28,.29,1)}
   else{
     const e=.22, yx1=terrainY(x+e,z),yx0=terrainY(x-e,z),yz1=terrainY(x,z+e),yz0=terrainY(x,z-e);
     const nn=normalise([-(yx1-yx0)/(2*e),1,-(yz1-yz0)/(2*e)]);
     n.push(...nn);c.push(...rgbaForTerrain(x,z,y));
   }
 }
 for(let j=0;j<nz;j++)for(let i=0;i<nx;i++){const a=j*(nx+1)+i,b=a+1,d=a+nx+1,e=d+1;idx.push(a,d,b,b,d,e)}
 return mesh(p,n,c,idx,water?2:1)
}
const land=grid(124,78,1.65,1.50,false),water=grid(112,76,1.82,1.62,true);

function rock(cx,cz,h,rx,rz,seg=18,rings=13,seed=1){
 const p=[],n=[],c=[],idx=[];
 for(let j=0;j<=rings;j++){
   const v=j/rings, yy=.05+h*v;
   const taper=Math.pow(Math.sin(Math.min(.96,v)*Math.PI*.78+.24),.35)*(1-.28*v);
   for(let i=0;i<seg;i++){
     const a=i/seg*Math.PI*2;
     const jag=1+.10*Math.sin(a*3+seed)+.055*Math.sin(a*7-seed*.4)+.035*Math.sin(j*1.7+i*.8);
     const x=cx+Math.cos(a)*rx*taper*jag,z=cz+Math.sin(a)*rz*taper*jag;
     p.push(x,yy,z);
     const nn=normalise([Math.cos(a),.18,Math.sin(a)]);n.push(...nn);
     const shade=.105+.028*Math.sin(i*2.1+j*.7+seed);
     c.push(shade,shade*.98,shade*.92,1);
   }
 }
 const top=p.length/3;p.push(cx,h*1.04,cz);n.push(0,1,0);c.push(.09,.09,.085,1);
 for(let j=0;j<rings;j++)for(let i=0;i<seg;i++){const a=j*seg+i,b=j*seg+(i+1)%seg,d=(j+1)*seg+i,e=(j+1)*seg+(i+1)%seg;idx.push(a,d,b,b,d,e)}
 for(let i=0;i<seg;i++)idx.push(rings*seg+i,top,rings*seg+(i+1)%seg);
 return mesh(p,n,c,idx,3)
}
const stacks=[
 rock(48,24,33,8.8,6.8,26,28,2.7),
 rock(80,32,24,3.1,2.4,22,26,5.1),
 rock(31,12,5.2,4.2,3.2,18,12,7.3)
];

function cliff(){
 const p=[],n=[],c=[],idx=[],cols=64,sides=6;
 for(let q=0;q<cols;q++){
   const x=-72+q*1.66,z=-34+1.6*Math.sin(q*.19)+.35*Math.sin(q*.71);
   const base=terrainY(x,z+2),H=16+13*Math.pow(q/(cols-1),.70)+4*Math.sin(q*.22)+1.5*Math.sin(q*.93);
   const r=.95*(.82+.18*Math.sin(q*.73));
   const baseIdx=p.length/3;
   for(let y=0;y<2;y++)for(let s=0;s<sides;s++){
     const a=s/sides*Math.PI*2+(q%2)*.18,rr=r*(.9+.1*Math.sin(s*1.7+q*.3));
     p.push(x+Math.cos(a)*rr,base+(y?H:0),z+Math.sin(a)*rr*.72);
     n.push(...normalise([Math.cos(a),.04,Math.sin(a)]));
     let v=.048+.015*Math.sin(q*.61+s*1.8);c.push(v,v*.98,v*.93,1);
   }
   const top=p.length/3;p.push(x,base+H+r*.25,z);n.push(0,1,0);c.push(.055,.055,.052,1);
   for(let s=0;s<sides;s++){const s2=(s+1)%sides,a=baseIdx+s,b=baseIdx+s2,d=baseIdx+sides+s,e=baseIdx+sides+s2;idx.push(a,d,b,b,d,e,d,top,e)}
 }
 return mesh(p,n,c,idx,3)
}
const cliffs=cliff();

const all=[land,cliffs,...stacks,water];

function sub(a,b){return[a[0]-b[0],a[1]-b[1],a[2]-b[2]]}
function dot(a,b){return a[0]*b[0]+a[1]*b[1]+a[2]*b[2]}
function cross(a,b){return[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]]}
function look(e,t){let z=normalise(sub(e,t)),x=normalise(cross([0,1,0],z)),y=cross(z,x),o=new Float32Array([x[0],y[0],z[0],0,x[1],y[1],z[1],0,x[2],y[2],z[2],0,0,0,0,1]);o[12]=-dot(x,e);o[13]=-dot(y,e);o[14]=-dot(z,e);return o}
function perspective(f,a,n,F){const s=1/Math.tan(f/2),o=new Float32Array(16);o[0]=s/a;o[5]=s;o[10]=(F+n)/(n-F);o[11]=-1;o[14]=2*F*n/(n-F);return o}
function mul(a,b){const o=new Float32Array(16);for(let r=0;r<4;r++)for(let cc=0;cc<4;cc++)o[cc*4+r]=a[r]*b[cc*4]+a[4+r]*b[cc*4+1]+a[8+r]*b[cc*4+2]+a[12+r]*b[cc*4+3];return o}

let cams={
 world:[[-58,2.75,-10],[50,5.5,22]],
 shore:[[-44,1.95,-7],[31,.35,4]],
 breaker:[[-31,1.55,-1],[26,.25,7]],
 stack:[[-22,4.3,-2],[51,12,27]],
 top:[[12,112,-2],[15,0,8]]
},view="world",cam=cams.world.map(x=>x.slice()),mode=0,t=0,last=performance.now(),drag=null,pinch=0,touches=new Map();

function resize(){const d=Math.min(devicePixelRatio||1,1.35),w=Math.max(2,innerWidth*d|0),h=Math.max(2,innerHeight*d|0);if(C.width!==w||C.height!==h){C.width=w;C.height=h;G.viewport(0,0,w,h)}}
function bind(o,M){
 G.bindBuffer(G.ARRAY_BUFFER,o.p);G.enableVertexAttribArray(AP);G.vertexAttribPointer(AP,3,G.FLOAT,false,0,0);
 G.bindBuffer(G.ARRAY_BUFFER,o.nm);G.enableVertexAttribArray(AN);G.vertexAttribPointer(AN,3,G.FLOAT,false,0,0);
 G.bindBuffer(G.ARRAY_BUFFER,o.c);G.enableVertexAttribArray(AC);G.vertexAttribPointer(AC,4,G.FLOAT,false,0,0);
 G.bindBuffer(G.ELEMENT_ARRAY_BUFFER,o.i);G.uniformMatrix4fv(UM,false,M);G.uniform1f(UK,o.kind);G.drawElements(G.TRIANGLES,o.n,G.UNSIGNED_SHORT,0);
}
function frame(now){
 resize();t+=Math.min(.04,(now-last)/1000);last=now;
 const target=cams[view];for(let j=0;j<3;j++){cam[0][j]+=(target[0][j]-cam[0][j])*.075;cam[1][j]+=(target[1][j]-cam[1][j])*.075}
 G.clearColor(0,0,0,0);G.clear(G.COLOR_BUFFER_BIT|G.DEPTH_BUFFER_BIT);G.enable(G.DEPTH_TEST);G.enable(G.CULL_FACE);G.useProgram(P);
 G.uniform3f(UCAM,cam[0][0],cam[0][1],cam[0][2]);G.uniform1f(UT,t);G.uniform1f(UMODE,mode);
 const M=mul(perspective(Math.PI/3.18,C.width/C.height,.12,420),look(cam[0],cam[1]));
 for(const o of all){
   if(o.kind===2){G.enable(G.BLEND);G.blendFunc(G.SRC_ALPHA,G.ONE_MINUS_SRC_ALPHA);G.depthMask(false);G.disable(G.CULL_FACE)}
   else{G.disable(G.BLEND);G.depthMask(true);G.enable(G.CULL_FACE)}
   bind(o,M)
 }
 G.depthMask(true);requestAnimationFrame(frame)
}
requestAnimationFrame(frame);

document.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{view=b.dataset.v;document.querySelectorAll("[data-v]").forEach(x=>x.classList.toggle("on",x===b))});
const atlas=document.getElementById("atlas"),ab=document.getElementById("atlasBtn");ab.onclick=()=>{atlas.classList.toggle("open");ab.classList.toggle("on",atlas.classList.contains("open"))};
document.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{mode=+b.dataset.m;document.querySelectorAll("[data-m]").forEach(x=>x.classList.toggle("on",x===b))});
C.onpointerdown=e=>{C.setPointerCapture(e.pointerId);drag=[e.pointerId,e.clientX,e.clientY];if(e.pointerType==="touch"){touches.set(e.pointerId,[e.clientX,e.clientY]);if(touches.size===2){const a=[...touches.values()];pinch=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1])}}};
C.onpointermove=e=>{
 if(e.pointerType==="touch"&&touches.has(e.pointerId)){touches.set(e.pointerId,[e.clientX,e.clientY]);if(touches.size===2){const a=[...touches.values()],d=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);if(pinch){const q=cams[view],dir=sub(q[0],q[1]),s=pinch/d;q[0]=q[1].map((v,k)=>v+dir[k]*s)}pinch=d;return}}
