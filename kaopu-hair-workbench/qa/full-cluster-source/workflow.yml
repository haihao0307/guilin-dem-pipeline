name: QA KuKo full cluster material transfer
on:
  push:
    branches: [gh-pages]
    paths:
      - kaopu-hair-workbench/qa/kuko-anemone-candidate.html
      - kaopu-hair-workbench/qa/full-cluster-source/tests/browser-qa.cjs
      - .github/workflows/kaopu-kuko-anemone-qa.yml
  workflow_dispatch:
permissions:
  contents: read
# Identical assertions are partitioned by purpose. The aggregate job requires
# all eight exact-byte reports; timeout, omission or a failed group cannot pass.
jobs:
  browser-groups:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        phase: [file, public]
        group: [core, catalog, orbit, touch]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: kaopu-hair-workbench
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned official browser test dependency
        run: |
          npm install --prefix .hair-qa --no-save --ignore-scripts --no-audit --no-fund playwright@1.55.0
          ./.hair-qa/node_modules/.bin/playwright install chromium
      - name: Install readable Chinese test fonts
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Run exact-byte browser group
        env:
          NODE_PATH: ${{ github.workspace }}/.hair-qa/node_modules
          HAIR_KUKO_HTML: ${{ github.workspace }}/kaopu-hair-workbench/qa/kuko-anemone-candidate.html
          HAIR_QA_OUT: ${{ github.workspace }}/hair-kuko-${{ matrix.phase }}-${{ matrix.group }}-results
          HAIR_KUKO_PHASE: ${{ matrix.phase }}
          HAIR_QA_GROUP: ${{ matrix.group }}
        run: node kaopu-hair-workbench/qa/full-cluster-source/tests/browser-qa.cjs
      - name: Keep browser group evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaopu-cluster-${{ matrix.phase }}-${{ matrix.group }}-${{ github.sha }}
          path: hair-kuko-${{ matrix.phase }}-${{ matrix.group }}-results/
          if-no-files-found: error
  aggregate:
    if: always()
    needs: browser-groups
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: kaopu-hair-workbench
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: kaopu-cluster-*-${{ github.sha }}
          path: hair-kuko-group-evidence
      - name: Require every unchanged assertion group and exact runtime hashes
        env:
          HAIR_QA_MATRIX_RESULT: ${{ needs.browser-groups.result }}
        run: |
          node kaopu-hair-workbench/qa/full-cluster-source/tests/aggregate-groups.cjs hair-kuko-group-evidence kaopu-hair-workbench/qa/kuko-anemone-candidate.html kaopu-hair-workbench/qa/kuko-anemone-standalone.html
      - name: Keep aggregate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaopu-cluster-aggregate-${{ github.sha }}
          path: hair-kuko-group-evidence/aggregate-results.json
          if-no-files-found: error
