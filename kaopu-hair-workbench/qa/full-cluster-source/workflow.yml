name: QA KuKo full cluster material transfer
on:
  push:
    branches: [gh-pages]
    paths:
      - kaopu-hair-workbench/qa/kuko-anemone-candidate.html
      - kaopu-hair-workbench/qa/full-cluster-source/tests/browser-qa.cjs
      - .github/workflows/kaopu-kuko-anemone-qa.yml
  workflow_dispatch:
permissions:
  contents: read
# Recovery tag is used only after exact-byte file evidence has already passed.
# Normal pushes run both independent phases with unchanged tests and timeout.
jobs:
  standalone-file:
    if: ${{ !contains(github.event.head_commit.message, '[verified-file-public-only]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: kaopu-hair-workbench
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned official browser test dependency
        run: |
          npm install --prefix .hair-qa --no-save --ignore-scripts --no-audit --no-fund playwright@1.55.0
          ./.hair-qa/node_modules/.bin/playwright install chromium
      - name: Install readable Chinese test fonts
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Test file exact standalone/browser interactions
        env:
          NODE_PATH: ${{ github.workspace }}/.hair-qa/node_modules
          HAIR_KUKO_HTML: ${{ github.workspace }}/kaopu-hair-workbench/qa/kuko-anemone-candidate.html
          HAIR_QA_OUT: ${{ github.workspace }}/hair-kuko-file-results
          HAIR_KUKO_PHASE: file
        run: node kaopu-hair-workbench/qa/full-cluster-source/tests/browser-qa.cjs
      - name: Keep file browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaopu-cluster-file-${{ github.sha }}
          path: hair-kuko-file-results/
          if-no-files-found: warn
  standalone-public:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: kaopu-hair-workbench
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned official browser test dependency
        run: |
          npm install --prefix .hair-qa --no-save --ignore-scripts --no-audit --no-fund playwright@1.55.0
          ./.hair-qa/node_modules/.bin/playwright install chromium
      - name: Install readable Chinese test fonts
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Test public exact standalone/browser interactions
        env:
          NODE_PATH: ${{ github.workspace }}/.hair-qa/node_modules
          HAIR_KUKO_HTML: ${{ github.workspace }}/kaopu-hair-workbench/qa/kuko-anemone-candidate.html
          HAIR_QA_OUT: ${{ github.workspace }}/hair-kuko-public-results
          HAIR_KUKO_PHASE: public
        run: node kaopu-hair-workbench/qa/full-cluster-source/tests/browser-qa.cjs
      - name: Keep public browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaopu-cluster-public-${{ github.sha }}
          path: hair-kuko-public-results/
          if-no-files-found: warn
