<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>小桂林 · 桂林 DEM V0.7.9 在线三维</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,"Noto Sans CJK SC","Microsoft YaHei",system-ui,sans-serif;--bg:#071013;--panel:rgba(6,14,17,.92);--line:rgba(194,225,208,.2);--text:#f2f7f3;--muted:#9eb2a8;--accent:#c7edc3}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text)}
    .shell{display:grid;grid-template-rows:auto 1fr;width:100%;height:100%}.bar{z-index:5;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel);backdrop-filter:blur(16px)}
    .brand{min-width:0}.brand strong{display:block;font-size:15px;letter-spacing:.02em}.brand span{display:block;margin-top:2px;color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .tabs{display:flex;gap:8px}.tabs button{border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.05);color:#dce8e0;padding:8px 12px;cursor:pointer;font:inherit;font-size:12px}.tabs button.active{border-color:rgba(199,237,195,.58);background:rgba(170,222,171,.18);color:var(--accent)}
    .frame-wrap{position:relative;min-height:0}.frame-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#081115}.tip{position:absolute;right:14px;bottom:14px;z-index:3;padding:7px 10px;border:1px solid var(--line);border-radius:999px;background:rgba(5,12,15,.76);color:#b8c9c0;font-size:11px;pointer-events:none;backdrop-filter:blur(10px)}
    @media(max-width:760px){.bar{align-items:flex-start;flex-direction:column;padding:8px 10px}.tabs{width:100%}.tabs button{flex:1;padding:7px 8px}.brand span{max-width:90vw}.tip{display:none}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="bar">
      <div class="brand"><strong>小桂林 · 桂林 DEM V0.7.9 在线三维</strong><span>全域河网可交互观察 · 54 块原生 12.5 米地形可切换</span></div>
      <nav class="tabs" aria-label="三维查看模式">
        <button id="overviewTab" class="active" type="button">全域河网 3D</button>
        <button id="nativeTab" type="button">12.5 米原生细节</button>
      </nav>
    </header>
    <section class="frame-wrap">
      <iframe id="viewerFrame" title="桂林 DEM 在线三维查看器" src="overview/index.html" allow="fullscreen"></iframe>
      <div class="tip">左键旋转 · Shift 拖动平移 · 滚轮缩放</div>
    </section>
  </main>
  <script>
    (()=>{const frame=document.getElementById('viewerFrame');const o=document.getElementById('overviewTab');const n=document.getElementById('nativeTab');function open(mode){const native=mode==='native';frame.src=native?'native/index.html?anchor=guilin':'overview/index.html';o.classList.toggle('active',!native);n.classList.toggle('active',native);history.replaceState(null,'',native?'?view=native':'?view=overview')}o.addEventListener('click',()=>open('overview'));n.addEventListener('click',()=>open('native'));if(new URLSearchParams(location.search).get('view')==='native')open('native')})();
  </script>
</body>
</html>
