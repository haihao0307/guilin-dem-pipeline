<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小温州 · 全域工作台</title><link rel="icon" href="data:,"><style>
:root{color-scheme:dark;--bg:#0d2227;--bar:#102a30;--line:#355258;--ink:#e7f0ef;--muted:#9db4b6;--accent:#9fd0c2;--hover:#31575a}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}body{display:grid;grid-template-rows:36px minmax(0,1fr) 20px;background:var(--bg);color:var(--ink);font:11px/1.15 system-ui,"Microsoft YaHei",sans-serif}.topbar{display:flex;align-items:center;gap:5px;min-width:0;padding:3px 5px;background:var(--bar);border-bottom:1px solid var(--line)}.title{flex:0 0 auto;min-width:76px;padding:0 3px}.title b{display:block;font-size:12px;white-space:nowrap}.title small{display:none}.tools{display:flex;align-items:center;gap:3px;min-width:0;overflow-x:auto;scrollbar-width:none}.tools::-webkit-scrollbar{display:none}.group{display:flex;align-items:center;gap:2px;flex:0 0 auto}.sep{width:1px;height:18px;background:var(--line);margin:0 2px;flex:0 0 auto}button,select{height:24px;border:1px solid var(--line);border-radius:4px;background:#19343a;color:var(--ink);padding:0 7px;font:10px system-ui,"Microsoft YaHei",sans-serif;cursor:pointer;white-space:nowrap}button:hover,button.active,select:focus{background:var(--hover);border-color:#6e9992;outline:0}button.icon{min-width:25px;padding:0 5px;font-size:13px}select{max-width:132px}.toggle{height:24px;display:flex;align-items:center;gap:3px;padding:0 5px;border:1px solid var(--line);border-radius:4px;white-space:nowrap;color:var(--muted)}.toggle input{margin:0;accent-color:var(--accent)}.identity{margin-left:auto;flex:0 0 auto;color:var(--muted);font-size:8px;text-align:right;white-space:nowrap}.stage{position:relative;min-width:0;min-height:0;background:#b7cacc}.stage iframe{border:0}#terrain{position:absolute;inset:0;width:100%;height:100%;background:#b7cacc}#weather{position:fixed;left:-16000px;top:-8000px;width:720px;height:540px;opacity:0;visibility:hidden;pointer-events:none}.statusbar{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:9px;padding:0 6px;background:#0b1e22;border-top:1px solid var(--line);color:var(--muted);font-size:8px;white-space:nowrap;overflow:hidden}.statusbar span{overflow:hidden;text-overflow:ellipsis}.warning{color:#dfc384}#errors{display:none;position:fixed;z-index:20;inset:14%;padding:18px;overflow:auto;white-space:pre-wrap;background:#422b2b;border:1px solid #c28b7a;border-radius:8px;color:#ffe8df}dialog{width:min(900px,94vw);max-height:84vh;background:#132d33;color:var(--ink);border:1px solid #638487;border-radius:8px}dialog pre{white-space:pre-wrap;font-size:10px}dialog button{float:right}.hidden-note{font-size:10px;color:var(--muted)}@media(max-width:1150px){.identity{display:none}.toggle span{display:none}select{max-width:112px}}@media(max-width:650px){body{grid-template-rows:40px minmax(0,1fr) 30px}.topbar{padding:4px}.title{display:none}.tools{width:100%}.statusbar{grid-template-columns:1fr;font-size:8px;line-height:1.1;padding:3px 5px;white-space:normal}.statusbar #metrics,.statusbar .warning{display:none}button,select,.toggle{height:27px}.sep{height:22px}}
</style></head><body><header class="topbar" id="topbar"><div class="title"><b>温州全域</b><small>V200 数值总览</small></div><div class="tools"><div class="group"><button id="viewHome">全图</button><button id="viewTop">俯视</button><button id="viewCoast">沿海</button><button id="zoomIn" class="icon" title="放大">＋</button><button id="zoomOut" class="icon" title="缩小">－</button><button id="panelToggle">面板</button></div><div class="sep"></div><div class="group"><select id="mode" aria-label="显示模式"><option value="environment">天气联动</option><option value="neutral">中性检查</option><option value="studio">工作室</option><option value="diagnostic">诊断</option></select><select id="case" aria-label="天气案例" disabled><option>核对天气包</option></select><button id="pause" disabled>暂停</button><button id="play" disabled>播放</button><label class="toggle"><input id="couple" type="checkbox" checked><span>联动</span></label><button id="inspect">证据</button></div></div><div class="identity"><span id="buildId">核对版本中</span><br><span id="mapState">等待地图</span> · <span id="weatherState">等待天气</span></div></header><main class="stage" id="stage"><iframe id="terrain" title="完整温州数值地形工作台"></iframe><iframe id="weather" title="天气计算内核" aria-hidden="true" tabindex="-1"></iframe></main><footer class="statusbar" id="statusbar"><span id="status">核对地图和天气运行文件。</span><span id="metrics">尚未读取环境</span><span class="warning">全域 800 米概览 · 源节点 12.5 米 · 原生流式层待接</span></footer><pre id="errors"></pre><dialog id="receipt"><button id="close">关闭</button><h2>当前参数与验证状态</h2><p class="hidden-note">天气计算在隐藏内核中运行，画面只保留完整地图和紧凑控制。当前状态不代表人工视觉批准。</p><pre id="receiptText"></pre></dialog><script type="module" src="./workbench.js"></script></body></html>
