Existing: Yes
Operational: No
Satellite_Transmission: No
Distribution: 1975-1997
Reference_Level:
- The sea level heights are referred to the zero point assigned to the tide gauge.
  Bench mark information is available upon request from the contributors.
Comments:
- The residual series are very noisy which are probably due to shallow water tides
  that are not resolved by the harmonic analysis.  Also the daily plot shows noise
  due to a great amount of energy with periods from 1 to 5 days.
Missing_Data_Table_Comment: For each year, data with dates are given as the nth day
  of the year starting from 1 January. Hours are in parentheses.
