Time_Interval:
  Hourly:
  - spot hourly
  Daily:
  - 119-point convolution filter (Bloomfield, 1976) centered on noon applied to the
    hourly data with respective periods of the 95, 50, and 5% amplitude points at
    124.0, 60.2, and 40.2 hours
  Monthly:
  - Simple average of all daily values
  - ' calculated if 7 or fewer days are missing'
