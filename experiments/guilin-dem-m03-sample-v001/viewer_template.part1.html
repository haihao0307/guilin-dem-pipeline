<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>桂林 DEM-M03 一平方公里地貌母体试验</title>
<style>
:root{--bg:#09110f;--panel:rgba(12,22,18,.86);--line:rgba(222,238,218,.13);--ink:#eef5e8;--muted:#a8b7aa;--gold:#d8bd72;--green:#72b47d;--cyan:#66bac2;--danger:#e39782}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif}canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;background:radial-gradient(circle at 66% 25%,#183127 0,#09110f 58%,#060b0a 100%)}.shade{position:fixed;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(3,8,7,.38),transparent 28%,transparent 72%,rgba(3,8,7,.28));z-index:1}.panel{position:fixed;z-index:3;border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(18px);box-shadow:0 24px 70px rgba(0,0,0,.28)}.left{left:16px;top:16px;width:min(332px,calc(100vw - 32px));max-height:calc(100vh - 32px);overflow:auto;border-radius:18px;padding:18px}.right{right:16px;top:16px;width:292px;border-radius:18px;padding:15px}.eyebrow{font-size:10px;letter-spacing:.18em;color:#a9c4ac;text-transform:uppercase}.title{margin:7px 0 6px;font-size:25px;line-height:1.08;font-weight:780}.lead{margin:0 0 14px;color:var(--muted);font-size:11px;line-height:1.58}.chips{display:flex;flex-wrap:wrap;gap:6px;margin:11px 0 15px}.chip{border:1px solid var(--line);border-radius:999px;padding:5px 8px;font-size:9px;color:#cbd6ca;background:rgba(255,255,255,.035)}.chip.good{color:#a7e5b0;border-color:rgba(104,190,116,.3)}.chip.warn{color:#f3d391;border-color:rgba(220,177,91,.3)}.section{margin-top:14px;padding-top:13px;border-top:1px solid var(--line)}.section h2{font-size:10px;letter-spacing:.12em;margin:0 0 9px;color:#b8c8b8}.modes{display:grid;grid-template-columns:1fr 1fr;gap:7px}.modes button,.row button{appearance:none;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.035);color:#d5ded3;padding:9px 8px;font-size:10px;cursor:pointer;transition:.15s}.modes button:hover,.row button:hover{background:rgba(255,255,255,.08)}.modes button.active{background:rgba(113,161,96,.22);border-color:rgba(137,194,119,.42);color:#f4f8ef}.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.025)}.toggle span{font-size:10px;color:#d0dbce}.toggle small{display:block;margin-top:3px;font-size:8px;color:#87968a}.toggle input{accent-color:#83b77b}.facts{display:grid;grid-template-columns:1fr 1fr;gap:7px}.fact{padding:9px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.026)}.fact span{display:block;color:#849386;font-size:8px;margin-bottom:3px}.fact b{font-size:10px;line-height:1.25;word-break:break-word}.legend{display:grid;gap:6px;margin-top:10px}.leg{display:flex;align-items:center;gap:7px;font-size:9px;color:#aab7aa}.sw{width:18px;height:7px;border-radius:5px}.note{margin-top:10px;padding:9px 10px;border-radius:10px;background:rgba(217,189,114,.07);border:1px solid rgba(217,189,114,.18);font-size:9px;line-height:1.55;color:#cfc5a8}.status{position:fixed;z-index:4;left:50%;bottom:14px;transform:translateX(-50%);min-width:310px;max-width:calc(100vw - 32px);padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:rgba(8,15,13,.78);backdrop-filter:blur(12px);font-size:9px;color:#c5d0c5;text-align:center}.compare-label{position:fixed;z-index:4;top:16px;padding:7px 10px;border-radius:999px;background:rgba(7,13,11,.76);border:1px solid var(--line);font-size:9px;color:#dbe4da;display:none}.compare-label.left-label{left:calc(50% - 190px)}.compare-label.right-label{right:calc(50% - 190px)}.divider{position:fixed;z-index:3;left:50%;top:0;bottom:0;width:1px;background:rgba(255,255,255,.48);display:none}.error{position:fixed;z-index:10;inset:0;display:none;place-items:center;padding:24px;background:#08100e}.error div{max-width:720px;padding:22px;border:1px solid rgba(227,151,130,.35);border-radius:16px;background:#171816;color:#f4d9d1}.error pre{white-space:pre-wrap;font-size:11px}.hint{font-size:8px;color:#819085;margin-top:8px}.mobile-title{display:none}@media(max-width:860px){.right{display:none}.left{top:auto;bottom:10px;left:10px;max-height:48vh;width:calc(100vw - 20px);padding:14px}.title{font-size:20px}.lead,.chips{display:none}.status{top:10px;bottom:auto;min-width:0}.mobile-title{display:block;position:fixed;z-index:3;left:10px;top:49px;padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:rgba(8,15,13,.72);font-size:10px}.compare-label{top:49px}.modes{grid-template-columns:repeat(3,1fr)}.section{margin-top:10px;padding-top:10px}}@media(max-width:520px){.modes{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr 1fr}.row button:last-child{grid-column:1/-1}.facts{display:none}}
</style>
</head>
<body>
<canvas id="terrain" aria-label="桂林一平方公里真实12.5米高程与DEM-M03地表增量交互样板"></canvas>
<div class="shade"></div>
<div class="mobile-title">桂林 DEM-M03 · 1 km² 技术试验</div>
<section class="panel left">
  <div class="eyebrow">GEOMORPHOLOGY MOTHER · DEM-M03 FIELD TEST</div>
  <h1 class="title">桂林一平方公里<br>地表母体试验</h1>
  <p class="lead">从唯一 12.5 米数值真值中抽取 81 × 81 整数像元窗口，再叠加小李的田块、田面、田埂、灌排、湿度、裸岩和生态适生字段。所有程序结果保持独立、可关闭、可回滚。</p>
  <div class="chips"><span class="chip good">真值只读</span><span class="chip good">原生 12.5 m</span><span class="chip warn">视觉试验</span><span class="chip warn">未获人工批准</span></div>
  <div class="section"><h2>分层查看</h2><div class="modes" id="modes">
    <button data-mode="0">真实高程</button><button data-mode="1">坡度与裸岩</button>
    <button data-mode="2">湿度与真水系</button><button data-mode="3">稻田候选</button>
    <button data-mode="4">田块微地形</button><button data-mode="5" class="active">合成样板</button>
    <button data-mode="6">生态适生场</button><button data-mode="7">原始 / 合成对照</button>
  </div></div>
  <div class="section"><h2>显示开关</h2>
    <label class="toggle"><span>程序高程增量<small>最大约 ±0.24 m，源高程始终不改</small></span><input id="deltaToggle" type="checkbox" checked></label>
    <label class="toggle"><span>真实线状水系<small>只读 OSM river / stream / canal</small></span><input id="waterToggle" type="checkbox" checked></label>
