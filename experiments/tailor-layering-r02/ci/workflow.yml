# Install as .github/workflows/tailor-layering-r02.yml in the parent repository.
# Phase one captures the actual browser world input. It does not publish or
# certify rendering/continuous simulation; those gates follow this baseline.
name: Tailor layering R02 — native input capture

on:
  pull_request:
    paths:
      - 'experiments/tailor-layering-r02/**'
      - '.github/workflows/tailor-layering-r02.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tailor-layering-r02-capture-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-capture:
    name: Capture current native body and garment inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        shell: bash
        working-directory: experiments/tailor-layering-r02
    steps:
      - name: Check out only the R02 experiment
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
          sparse-checkout: experiments/tailor-layering-r02
          sparse-checkout-cone-mode: true

      - name: Use Node 22
        uses: actions/setup-node@v6.4.0
        with:
          node-version: '22'

      - name: Use Python 3
        uses: actions/setup-python@v6.3.0
        with:
          python-version: '3.12'

      - name: Prepare evidence and pinned real Chromium
        run: |
          mkdir -p evidence
          npm install --prefix .ci-runtime --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.64.0
          .ci-runtime/node_modules/.bin/playwright install --with-deps chromium

      - name: Download and verify the retained native runtime
        run: python tools/download-reference.py

      - name: Build the application and check capture syntax
        run: |
          python tools/build.py | tee evidence/build.log
          node --check tests/capture-native-ci.mjs

      - name: Observe the original native cloth Worker initialization
        env:
          CI: 'true'
        run: |
          python -m http.server 8765 --bind 127.0.0.1 --directory dist > evidence/http-server.log 2>&1 &
          layer_server_pid=$!
          trap 'kill "$layer_server_pid" 2>/dev/null || true' EXIT
          node tests/capture-native-ci.mjs | tee evidence/native-capture.log

      - name: Retain exact native inputs and provenance even on failure
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          name: tailor-layering-r02-native-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: experiments/tailor-layering-r02/evidence/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6

# Exact release versions checked against the official upstream release pages:
# https://github.com/actions/checkout/releases/tag/v6.0.2
# https://github.com/actions/setup-node/releases/tag/v6.4.0
# https://github.com/actions/setup-python/releases/tag/v6.3.0
# https://github.com/actions/upload-artifact/releases/tag/v6.0.0
# https://github.com/microsoft/playwright/releases/tag/v1.64.0
# https://playwright.dev/docs/ci
# https://playwright.dev/docs/browsers
