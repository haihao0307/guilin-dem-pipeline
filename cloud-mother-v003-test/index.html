<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cloud Mother V0.3</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#07111a;color:#edf4ff;font:12px system-ui,-apple-system,Segoe UI,sans-serif}canvas{display:block;width:100%;height:100%}.p{position:fixed;left:10px;top:10px;z-index:5;width:275px;max-height:calc(100% - 20px);overflow:auto;padding:12px 14px;border-radius:14px;background:#0a1523d0;border:1px solid #ffffff24;backdrop-filter:blur(10px);box-shadow:0 12px 40px #0008}.p h1{margin:0 0 4px;font-size:15px}.sub{opacity:.7;line-height:1.35;margin:0 0 8px}.r{display:grid;grid-template-columns:74px 1fr 42px;gap:8px;align-items:center;margin:6px 0}.r select,.r input{width:100%;min-width:0}.r select{grid-column:2/4;padding:5px;border-radius:8px;border:1px solid #ffffff26;background:#132436;color:#eef4ff}.v{text-align:right;opacity:.8;font-variant-numeric:tabular-nums}.b{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}.b button{padding:8px;border:1px solid #ffffff2a;background:#183048;color:#f2f7ff;border-radius:9px;cursor:pointer}.b button:hover{background:#244968}.s{position:fixed;left:10px;bottom:10px;z-index:4;padding:7px 10px;border-radius:9px;background:#0a1523bb;backdrop-filter:blur(8px);font-variant-numeric:tabular-nums;opacity:.88}.tip{margin-top:7px;opacity:.58;line-height:1.45}@media(max-width:700px){.p{width:220px;padding:10px 11px}.r{grid-template-columns:58px 1fr 36px}.s{left:8px;bottom:8px}}</style><body><div class=p><h1>CLOUD MOTHER · V0.3</h1><div class=sub>体积天气系统 · 多云型 · 山体抬升 · 彩虹</div><div class=r><label>天气</label><select id=weather><option value=fair>晴空对流</option><option value=mountain>山地抬升</option><option value=coast>海岸湿流</option><option value=warm>暖锋云幕</option><option value=rain>持续降雨</option><option value=storm selected>强对流雷暴</option><option value=rainbow>雨后彩虹</option><option value=jet>高空急流</option></select></div><div class=r><label>云型</label><select id=type><option value=0>卷云 Cirrus</option><option value=1>卷积云 Cirrocumulus</option><option value=2>高积云 Altocumulus</option><option value=3>层积云 Stratocumulus</option><option value=4>积云 Cumulus</option><option value=5>积雨云 Cumulonimbus</option><option value=6>雨层云 Nimbostratus</option></select></div><div class=r><label>浓度</label><input id=density type=range min=.1 max=1.7 step=.01><span class=v></span></div><div class=r><label>数量</label><input id=coverage type=range min=.05 max=.98 step=.01><span class=v></span></div><div class=r><label>碎块</label><input id=cell type=range min=.2 max=1.8 step=.01><span class=v></span></div><div class=r><label>风速</label><input id=wind type=range min=0 max=1.2 step=.01><span class=v></span></div><div class=r><label>降水</label><input id=rain type=range min=0 max=1 step=.01><span class=v></span></div><div class=r><label>不稳</label><input id=inst type=range min=0 max=1 step=.01><span class=v></span></div><div class=r><label>湿度</label><input id=humid type=range min=0 max=1 step=.01><span class=v></span></div><div class=r><label>太阳</label><input id=sun type=range min=-5 max=80 step=1><span class=v></span></div><div class=r><label>山效</label><input id=oro type=range min=0 max=1 step=.01><span class=v></span></div><div class=r><label>高度</label><input id=alt type=range min=.1 max=5 step=.01><span class=v></span></div><div class=b><button id=auto>天气匹配</button><button id=pause>暂停</button></div><div class=tip>拖动旋转，滚轮缩放。云体不再用方盒子边界切割，支持多团云、薄云、厚云、山体抬升和彩虹。</div></div><div class=s id=status></div><canvas id=c></canvas><script>
const cv=c,gl=cv.getContext('webgl2',{antialias:false,powerPreference:'high-performance'});if(!gl)throw Error('WebGL2 required');
const vs=`#version 300 es
void main(){vec2 p=vec2((gl_VertexID<<1)&2,gl_VertexID&2);gl_Position=vec4(p*2.-1.,0,1);}`;
const fs=`#version 300 es
precision highp float;out vec4 O;uniform vec2 R;uniform float tm;uniform vec4 cam;uniform vec4 met;uniform vec4 parA;uniform vec4 parB;uniform int type;uniform int steps;uniform float rainOn;
#define PI 3.14159265359
float h11(float p){return fract(sin(p*127.1)*43758.5453);}float h21(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}float h31(vec3 p){return fract(sin(dot(p,vec3(127.1,311.7,74.7)))*43758.5453);}float n2(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);float a=h21(i),b=h21(i+vec2(1,0)),c=h21(i+vec2(0,1)),d=h21(i+1.);return mix(mix(a,b,f.x),mix(c,d,f.x),f.y);}float n3(vec3 p){vec3 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);float a=h31(i),b=h31(i+vec3(1,0,0)),c=h31(i+vec3(0,1,0)),d=h31(i+vec3(1,1,0)),e=h31(i+vec3(0,0,1)),g=h31(i+vec3(1,0,1)),h=h31(i+vec3(0,1,1)),j=h31(i+vec3(1,1,1));return mix(mix(mix(a,b,f.x),mix(c,d,f.x),f.y),mix(mix(e,g,f.x),mix(h,j,f.x),f.y),f.z);}float fbm2(vec2 p){float s=0.,a=.5;for(int i=0;i<5;i++){s+=n2(p)*a;p=p*2.02+11.7;a*=.5;}return s;}float fbm3(vec3 p){float s=0.,a=.52;for(int i=0;i<5;i++){s+=n3(p)*a;p=p*2.03+17.1;a*=.52;}return s;}float ridge(vec2 p){float f=0.,a=.5;for(int i=0;i<4;i++){float n=abs(n2(p)*2.-1.);f+=(1.-n)*a;p=p*2.15+3.3;a*=.55;}return f;}vec3 sunDir(){float e=radians(parB.x),a=radians(18.);return normalize(vec3(cos(e)*sin(a),sin(e),cos(e)*cos(a)));}vec3 sunCol(){float k=smoothstep(-.1,.35,sunDir().y);return mix(vec3(1.65,.46,.16),vec3(1.08,1.02,.96),k);}float hg(float g,float mu){float g2=g*g;return (1.-g2)/(4.*PI*pow(max(1.+g2-2.*g*mu,.001),1.5));}
float terrain(vec2 x){float r=fbm2(x*.035);float m=pow(max(ridge(x*.022)-.12,0.),1.6)*1.6;float p=pow(max(ridge((x+vec2(40.,-30.))*.016)-.08,0.),2.3)*2.8;return m+p*.8+r*.18;}
vec3 sky(vec3 d){vec3 s=sunDir();float y=max(d.y,0.),mu=max(dot(d,s),0.);float day=smoothstep(-.08,.18,s.y),sunset=1.-smoothstep(.08,.45,s.y);vec3 hz=mix(vec3(.01,.02,.05),vec3(.38,.61,.89),day)+vec3(.95,.22,.06)*sunset*.4;vec3 zn=mix(vec3(.002,.005,.018),vec3(.045,.19,.56),day);vec3 c=mix(hz,zn,pow(y,.34));c+=vec3(.07,.17,.42)*.11*(1.+dot(d,s)*dot(d,s));c+=sunCol()*hg(.78,dot(d,s))*(.01+.055*sunset);c+=sunCol()*pow(mu,1100.)*8.;return c;}
float slabBase(){return mix(1.2,7.2,step(3.5,float(type))*0.5+step(4.5,float(type))*0.2+step(5.5,float(type))*0.1);}float slabTop(){if(type==0)return 9.5; if(type==1)return 8.4; if(type==2)return 5.6; if(type==3)return 2.5; if(type==4)return 4.8; if(type==5)return 11.5; return 4.7;}
float cloudShape(vec3 p){float base=slabBase(),top=slabTop(),th=max(top-base,.01),h=(p.y-base)/th; if(h<0.||h>1.) return 0.; float dens=parA.x,cov=parA.y,cell=parA.z,wind=parB.y,rain=met.z,inst=met.y,humid=met.x,oro=parB.z; vec2 adv=vec2(tm*wind*.22,tm*wind*.08); vec2 xz=p.xz; float mtn=terrain(xz), lift=max((mtn-0.25)*oro,0.); float windward=smoothstep(-1.4,.6,(xz.x+mtn*3.)*.12); float orographic=lift*windward*(1.-smoothstep(.55,1.,h)); vec2 cp=xz*(.11*cell); float cells=fbm2(cp+adv*.6); float many=smoothstep(1.-cov,1.-cov+.2,cells+humid*.08+orographic*.25); float d=0.;
 if(type==0){ float wispy=ridge(xz*.33+adv*1.5+vec2(0.,h*7.)); float str=fbm3(vec3(xz*.14+adv*1.2,h*6.)); d=smoothstep(.34,.72,wispy*.72+str*.55); d*=smoothstep(.06,.3,h)*(1.-smoothstep(.68,.98,h)); d*=many*.85; }
 else if(type==1){ vec2 g=floor(cp*1.6),f=fract(cp*1.6)-.5; vec2 id=g; vec2 r=vec2(h21(id),h21(id+6.2))-.5; float puff=1.-length((f-r)*vec2(1.,1.35))*1.8; d=smoothstep(.1,.56,puff)*many; d*=smoothstep(.12,.44,h)*(1.-smoothstep(.65,.94,h)); }
 else if(type==2){ vec2 g=floor(cp*1.2),f=fract(cp*1.2)-.5; vec2 id=g; vec2 r=vec2(h21(id+2.),h21(id+8.))-.5; float puff=1.-length((f-r)*vec2(1.1,1.2))*1.6; d=smoothstep(.06,.5,puff)*many; d*=smoothstep(.08,.25,h)*(1.-smoothstep(.72,.96,h)); d=mix(d,many*.52,.25); }
 else if(type==3){ float layer=fbm2(cp*.8+adv*.7); d=smoothstep(1.-cov,1.-cov+.18,layer+.2*orographic); d*=smoothstep(.03,.16,h)*(1.-smoothstep(.62,.95,h)); float puffs=smoothstep(.48,.75,fbm3(vec3(xz*.13+adv,h*5.))); d=mix(d,puffs*d,.55); }
 else if(type==4){ vec2 g=floor(cp*.75),f=fract(cp*.75)-.5; vec2 id=g; vec2 r=vec2(h21(id+11.),h21(id+21.))-.5; float tower=1.-length((f-r)*vec2(1.,1.25))*1.65; tower=smoothstep(.1,.72,tower)*many; float grow=mix(.22,1.0,h); float billow=fbm3(vec3(xz*.18+adv,h*6.)); d=tower*(grow)*(smoothstep(.18,.72,billow+.35)); d*=1.-smoothstep(.92,1.,h); d+=orographic*.28*smoothstep(.15,.7,h); }
 else if(type==5){ vec2 g=floor(cp*.62),f=fract(cp*.62)-.5; vec2 id=g; vec2 r=vec2(h21(id+17.),h21(id+28.))-.5; float core=1.-length((f-r)*vec2(.95,1.15))*1.55; core=smoothstep(.08,.74,core)*many; float tower=(smoothstep(.05,.85,h))*(1.-smoothstep(.98,1.02,h)); float detail=fbm3(vec3(xz*.16+adv*.9,h*7.)); d=core*tower*smoothstep(.18,.8,detail+.32); float anvil=smoothstep(.72,.88,h)*(1.-smoothstep(.93,1.01,h)); float shelf=smoothstep(.12,.42,core)*(1.-smoothstep(.82,1.,core)); d=max(d,anvil*smoothstep(.28,.8,many)*(1.-smoothstep(.18,.95,length(f*vec2(1.7,.65)+vec2(-h*1.4+.9,0.))))); d+=shelf*rain*.18*(1.-smoothstep(.16,.42,h)); d+=orographic*.22; }
 else { float over=fbm2(cp*.62+adv*.5); d=smoothstep(1.-cov,1.-cov+.14,over+.humid*.12); d*=smoothstep(.01,.18,h)*(1.-smoothstep(.88,1.,h)); d=mix(d,1.,rain*.45); }
 vec3 q=vec3(xz*.19*cell+adv*1.1,h*4.6); float micro=fbm3(q+vec3(0.,0.,tm*.02)); d=smoothstep(.05,.94,d-(1.-micro)*mix(.82,.4,rain)); d*=smoothstep(0.,.1,h)*(1.-smoothstep(.95,1.,h)); d*=dens; return max(d,0.); }
float lightMarch(vec3 p){vec3 s=sunDir(); float sum=0.; float ds=.28; for(int i=0;i<6;i++){p+=s*ds*(1.+float(i)*.35); sum+=cloudShape(p)*ds;} return exp(-sum*1.9); }
vec3 rainbow(vec3 rd){if(rainOn<.5||met.z<.15||sunDir().y>sin(radians(45.)))return vec3(0); float ang=acos(clamp(dot(rd,-sunDir()),-1.,1.)); float x=(ang-radians(42.))/radians(1.8); float band=exp(-x*x*2.6); vec3 sp=clamp(vec3(1.6-abs(5.*x-4.),1.6-abs(5.*x-2.5),1.6-abs(5.*x-1.)),0.,1.); float sec=exp(-pow((ang-radians(51.))/radians(1.7),2.))*0.13; return (sp*band+sp.bgr*sec)*met.z*smoothstep(-.02,.2,rd.y)*.58; }
float groundT(vec3 ro,vec3 rd){float t=0.; for(int i=0;i<80;i++){vec3 p=ro+rd*t; float h=p.y-terrain(p.xz); if(abs(h)<.02||t>90.) break; t+=max(.05,h*.55);} return t; }
vec3 ground(vec3 ro,vec3 rd,float t){vec3 p=ro+rd*t; float h=terrain(p.xz); float eps=.03; vec3 n=normalize(vec3(terrain(p.xz+vec2(eps,0.))-h,eps,terrain(p.xz+vec2(0.,eps))-h)); float l=max(dot(n,sunDir()),0.); float s=exp(-pow(max(dot(rd,-sunDir()),0.),18.))*met.z*.08; vec3 c=mix(vec3(.06,.09,.07),vec3(.23,.32,.16),fbm2(p.xz*.08)); c*=0.22+l*.95; c*=mix(1.,.58,smoothstep(.3,1.1,h)); c+=vec3(.08,.09,.11)*s; return c; }
void main(){ vec2 uv=(2.*gl_FragCoord.xy-R)/R.y; float tf=tan(radians(cam.z)*.5); vec3 fw=normalize(vec3(cos(cam.y)*sin(cam.x),sin(cam.y),cos(cam.y)*cos(cam.x))); vec3 rt=normalize(cross(fw,vec3(0,1,0))); vec3 up=cross(rt,fw); vec3 rd=normalize(fw+rt*uv.x*tf+up*uv.y*tf); vec3 ro=vec3(0.,met.w,0.); float tg=groundT(ro,rd); vec3 col=sky(rd); if(tg<90.) col=mix(col,ground(ro,rd,tg),1.-exp(-tg*.08)); float base=slabBase(),top=slabTop(); float t0=(base-ro.y)/rd.y, t1=(top-ro.y)/rd.y; if(abs(rd.y)<.0001){ t0=0.; t1=80.; } if(t0>t1){float z=t0;t0=t1;t1=z;} t0=max(t0,0.); t1=min(t1,tg); vec3 acc=vec3(0); float tr=1.; if(t1>t0){ float stepL=(t1-t0)/float(steps); float jitter=h21(gl_FragCoord.xy+tm)*stepL; float t=t0+jitter; for(int i=0;i<96;i++){ if(i>=steps||t>t1||tr<.01) break; vec3 p=ro+rd*t; float d=cloudShape(p); if(d>.004){ float lt=lightMarch(p),mu=dot(rd,sunDir()); float ph=mix(hg(.68,mu),hg(-.18,mu),.22); float h=clamp((p.y-slabBase())/max(slabTop()-slabBase(),.01),0.,1.); vec3 amb=mix(vec3(.05,.08,.12),sky(vec3(0,1,0))*.33,h); float powder=1.-exp(-d*4.6); float silver=pow(max(mu,0.),5.)*pow(lt,2.1); vec3 lgt=amb+sunCol()*lt*(.12+ph*5.3)*mix(.32,1.26,powder)+sunCol()*silver*.62; if(type==6) lgt*=vec3(.82,.89,1.02); if(type==0) lgt*=vec3(1.03,1.02,1.08); float a=1.-exp(-d*stepL*1.9); acc+=tr*lgt*a; tr*=1.-a; } t+=stepL; } col=acc+col*tr; } float rainCurt=0.; if(met.z>.12&&(type==5||type==6)){ vec3 p=ro+rd*min(tg,28.); float d=cloudShape(vec3(p.x,slabBase()+.08,p.z)); rainCurt=d*met.z*smoothstep(.25,-.22,rd.y)*.16; col=mix(col,col*vec3(.72,.8,.92),rainCurt);} col+=rainbow(rd); float flash=step(.992,h11(floor(tm*1.2)+4.))*exp(-fract(tm*1.2)*12.)*met.z*met.y; col+=vec3(.45,.6,1.)*flash*(1.-tr)*1.7; col=1.-exp(-col*1.15); O=vec4(pow(max(col,0.),vec3(.4545)),1.); }`;
function S(t,s){const sh=gl.createShader(t);gl.shaderSource(sh,s);gl.compileShader(sh);if(!gl.getShaderParameter(sh,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(sh));return sh}const p=gl.createProgram();gl.attachShader(p,S(gl.VERTEX_SHADER,vs));gl.attachShader(p,S(gl.FRAGMENT_SHADER,fs));gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(p));gl.useProgram(p);gl.bindVertexArray(gl.createVertexArray());
const L={R:gl.getUniformLocation(p,'R'),tm:gl.getUniformLocation(p,'tm'),cam:gl.getUniformLocation(p,'cam'),met:gl.getUniformLocation(p,'met'),parA:gl.getUniformLocation(p,'parA'),parB:gl.getUniformLocation(p,'parB'),type:gl.getUniformLocation(p,'type'),steps:gl.getUniformLocation(p,'steps'),rainOn:gl.getUniformLocation(p,'rainOn')};
const ids=['density','coverage','cell','wind','rain','inst','humid','sun','oro','alt'],E=Object.fromEntries(ids.map(x=>[x,document.getElementById(x)]));
const presets={fair:[4,.62,.52,.65,.18,.04,.62,42,.10,1.3],mountain:[4,.72,.58,.52,.22,.08,.8,34,.92,1.5],coast:[3,.75,.66,.72,.32,.08,.86,28,.35,1.2],warm:[2,.72,.82,.5,.28,.12,.74,22,.18,1.4],rain:[6,1.12,.9,.45,.26,.78,.95,12,.25,1.4],storm:[5,1.25,.68,.68,.55,.96,.93,18,.42,1.7],rainbow:[4,.78,.55,.46,.28,.32,.7,24,.18,1.4],jet:[0,.42,.36,.95,.95,0,.42,32,.04,2.0]};
let yaw=.0,pitch=.18,fov=55,drag=0,lx=0,ly=0,tm=0,last=performance.now(),run=1; const steps=matchMedia('(max-width:700px)').matches?40:54; gl.uniform1i(L.steps,steps);
function resize(){cv.width=Math.max(2,innerWidth*devicePixelRatio*.7|0);cv.height=Math.max(2,innerHeight*devicePixelRatio*.7|0);cv.style.width=innerWidth+'px';cv.style.height=innerHeight+'px';gl.viewport(0,0,cv.width,cv.height);gl.uniform2f(L.R,cv.width,cv.height)} addEventListener('resize',resize); resize();
function valSpan(el){return el.parentNode.querySelector('.v')} function sync(){ids.forEach(k=>valSpan(E[k]).textContent=(k==='sun'?((+E[k].value|0)+'°'):(+E[k].value).toFixed(2))); gl.uniform4f(L.parA,+E.density.value,+E.coverage.value,+E.cell.value,0); gl.uniform4f(L.parB,+E.sun.value,+E.wind.value,+E.oro.value,0); gl.uniform4f(L.met,+E.humid.value,+E.inst.value,+E.rain.value,+E.alt.value); gl.uniform1i(L.type,+type.value); gl.uniform1f(L.rainOn,weather.value==='rainbow'||(+E.rain.value>.18&&+E.sun.value<45)?1:0); const name=type.options[type.selectedIndex].textContent; status.textContent=`${name} · ${weather.options[weather.selectedIndex].textContent} · 步进 ${steps} · 无方盒切边` }
ids.forEach(k=>E[k].oninput=sync); type.onchange=sync; weather.onchange=()=>apply(weather.value); auto.onclick=()=>apply(weather.value); pause.onclick=e=>{run=!run;e.target.textContent=run?'暂停':'继续'};
function apply(name){const a=presets[name]; if(!a)return; type.value=a[0]; E.density.value=a[1]; E.coverage.value=a[2]; E.cell.value=a[3]; E.wind.value=a[4]; E.rain.value=a[5]; E.inst.value=a[6]; E.humid.value=a[7]; E.sun.value=a[8]; E.oro.value=a[9]; E.alt.value=a[10]; if(name==='rainbow'){E.sun.value=24;E.rain.value=.42;type.value=4;yaw=-2.9;pitch=.08} if(name==='storm'){yaw=.2;pitch=.18} sync();}
cv.onpointerdown=e=>{drag=1;lx=e.clientX;ly=e.clientY;cv.setPointerCapture(e.pointerId)}; cv.onpointerup=()=>drag=0; cv.onpointermove=e=>{if(!drag)return; yaw-=(e.clientX-lx)*.004; pitch=Math.max(-.4,Math.min(.6,pitch+(e.clientY-ly)*.003)); lx=e.clientX; ly=e.clientY}; cv.onwheel=e=>{e.preventDefault(); fov=Math.max(28,Math.min(80,fov+e.deltaY*.02))};
apply('storm');
(function loop(n){requestAnimationFrame(loop); const dt=Math.min(.05,(n-last)/1000); last=n; if(run)tm+=dt; gl.uniform1f(L.tm,tm); gl.uniform4f(L.cam,yaw,pitch,fov,0); gl.drawArrays(gl.TRIANGLES,0,3) })(last);
