</style></head><body><canvas id="c"></canvas><div class="p"><h1>CLOUD MOTHER · V0.3.2</h1><div class="sub">高速兼容体积云 · 无硬切边 · 多云型天气</div><div class="r"><label>天气</label><select id="weather"><option value="fair">晴空对流</option><option value="mountain">山地抬升</option><option value="coast">海岸湿流</option><option value="warm">暖锋云幕</option><option value="rain">持续降雨</option><option value="storm" selected>强对流雷暴</option><option value="rainbow">雨后彩虹</option><option value="jet">高空急流</option></select></div><div class="r"><label>云型</label><select id="kind"><option value="0">卷云 Cirrus</option><option value="1">卷积云 Cirrocumulus</option><option value="2">高积云 Altocumulus</option><option value="3">层积云 Stratocumulus</option><option value="4">积云 Cumulus</option><option value="5" selected>积雨云 Cumulonimbus</option><option value="6">雨层云 Nimbostratus</option></select></div><div class="r"><label>浓度</label><input id="density" type="range" min=".15" max="1.8" step=".01"><span class="v"></span></div><div class="r"><label>云团数</label><input id="amount" type="range" min="0" max="1" step=".01"><span class="v"></span></div><div class="r"><label>碎块度</label><input id="fragment" type="range" min=".2" max="1.8" step=".01"><span class="v"></span></div><div class="r"><label>风速</label><input id="wind" type="range" min="0" max="1.2" step=".01"><span class="v"></span></div><div class="r"><label>湿度</label><input id="humid" type="range" min="0" max="1" step=".01"><span class="v"></span></div><div class="r"><label>不稳定</label><input id="inst" type="range" min="0" max="1" step=".01"><span class="v"></span></div><div class="r"><label>降水</label><input id="rain" type="range" min="0" max="1" step=".01"><span class="v"></span></div><div class="r"><label>太阳</label><input id="sun" type="range" min="-5" max="75" step="1"><span class="v"></span></div><div class="r"><label>山地效应</label><input id="oro" type="range" min="0" max="1" step=".01"><span class="v"></span></div><div class="b"><button id="match">天气匹配</button><button id="pa float baseShape(vec3 p){float d=-9.0;if(uKind<.5){float y=1.0-abs((p.y-6.3)/.56);float w=texture2D(uNoise,p.xz*.028+vec2(p.y*.018,uTime*uWind*.004)).r;float wis=1.0-abs(w*2.0-1.0);d=min(y+sin(p.x*.32+p.z*.14+w*3.0)*.18,wis*1.35-.38);}else if(uKind<1.5){d=cellPuff(p+vec3(uTime*uWind*.08,0,0),1.55,5.45,.5);}else if(uKind<2.5){d=cellPuff(p+vec3(uTime*uWind*.07,0,0),2.45,3.8,.74);}else if(uKind<3.5){float w=weather(p.xz+uTime*uWind*.12),y=1.0-abs((p.y-2.2)/.9);d=min(y,smoothstep(1.0-uAmount,1.0-uAmount+.18,w)*1.4-.22);d=smax(d,cellPuff(p,3.1,2.25,.72)*.68+y*.5-.7,.2);}else if(uKind<4.5){d=cumulus(p);}else if(uKind<5.5){d=storm(p);}else{float w=weather(p.xz+uTime*uWind*.08),y=1.0-abs((p.y-2.75)/1.62);d=min(y,smoothstep(1.0-uAmount,1.0-uAmount+.13,w)*1.52-.18)+uRain*.16;}return d;}
