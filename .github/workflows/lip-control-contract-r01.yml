name: Lip control contract R01 independent before-after verification
on:
  push:
    branches: [feature/lip-control-contract-r01-20261017]
    paths:
      - 'kaopu-unified-human-workbench/lip-control-contract-r01/*.js'
      - 'kaopu-unified-human-workbench/lip-control-contract-r01/*.cjs'
      - 'kaopu-unified-human-workbench/lip-control-contract-r01/TASK_ANCHOR.json'
      - '.github/workflows/lip-control-contract-r01.yml'
permissions:
  contents: write
concurrency:
  group: lip-control-contract-r01
  cancel-in-progress: false
jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SCOPE: kaopu-unified-human-workbench/lip-control-contract-r01
      BASELINE_PATH: kaopu-unified-human-workbench/human-integrated-r07/preview.html
      CANDIDATE_PATH: kaopu-unified-human-workbench/lip-control-contract-r01/preview.html
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            kaopu-unified-human-workbench/human-integrated-r07
            kaopu-unified-human-workbench/lip-control-contract-r01
            .github/workflows
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install fixed browser verification dependencies
        run: |
          npm install --no-save --ignore-scripts playwright@1.58.2 pngjs@7.0.0
          npx playwright install --with-deps chromium
      - name: Compile append-only candidate without editing the original host
        run: node "$SCOPE/build.cjs"
      - name: Establish original defect before testing the candidate
        env:
          MODE: all
          QA_OUT: kaopu-unified-human-workbench/lip-control-contract-r01/evidence/local
        run: node "$SCOPE/verify-wetness.cjs"
      - name: Publish verified preview on the isolated feature branch
        id: preview
        run: |
          test "$GITHUB_REF_NAME" = feature/lip-control-contract-r01-20261017
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$SCOPE/preview.html" "$SCOPE/BUILD_MANIFEST.json"
          git add -f "$SCOPE/evidence/local"
          git commit -m 'Publish verified R07 lip control contract candidate [skip ci]'
          git push origin "HEAD:$GITHUB_REF_NAME"
          printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Verify the exact fixed public HTTPS page
        env:
          MODE: public
          CANDIDATE_URL: https://htmlpreview.github.io/?https://raw.githubusercontent.com/haihao0307/guilin-dem-pipeline/${{ steps.preview.outputs.sha }}/kaopu-unified-human-workbench/lip-control-contract-r01/preview.html
          LOCAL_QA_PATH: kaopu-unified-human-workbench/lip-control-contract-r01/evidence/local/qa.json
          QA_OUT: kaopu-unified-human-workbench/lip-control-contract-r01/evidence/public
          PUBLIC_COMMIT: ${{ steps.preview.outputs.sha }}
        run: node "$SCOPE/verify-wetness.cjs"
      - name: Preserve public readback evidence on the same feature branch
        run: |
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse FETCH_HEAD)" = "$(git rev-parse HEAD)"
          git add -f "$SCOPE/evidence/public"
          git commit -m 'Record fixed HTTPS lip control contract readback [skip ci]'
          git push origin "HEAD:$GITHUB_REF_NAME"
      - name: Retain independent results and real browser captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lip-control-contract-r01-${{ github.run_id }}
          path: |
            kaopu-unified-human-workbench/lip-control-contract-r01/evidence
            kaopu-unified-human-workbench/lip-control-contract-r01/BUILD_MANIFEST.json
          retention-days: 30
