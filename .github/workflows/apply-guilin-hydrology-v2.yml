name: Apply Guilin hydrology visual connectivity v2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-guilin-hydrology-v2.yml
      - tools/apply_guilin_hydrology_v2.py.gz.b64
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-guilin-hydrology-v2
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode and apply the reviewed migration
        run: |
          set -euo pipefail
          base64 -d tools/apply_guilin_hydrology_v2.py.gz.b64 | gzip -d > /tmp/apply_guilin_hydrology_v2.py
          python /tmp/apply_guilin_hydrology_v2.py

      - name: Verify thin hierarchy and continuous joins
        run: |
          set -euo pipefail
          node --check viewer/app.js
          python -m py_compile tests/browser_full_map_cdp.py
          grep -q "thin-hierarchical-continuous-v2" viewer/app.js
          grep -q "hydrology_visual_join_gap_px" viewer/app.js
          grep -q "overlapped-segments-and-degree-caps" viewer/app.js
          grep -q 'value="0.82"' viewer/index.html
          grep -q 'max="1.6"' viewer/index.html
          git diff --check

      - name: Commit the corrected renderer and remove migration scaffolding
        run: |
          set -euo pipefail
          git config user.name "Haihao_Nature Grace HK"
          git config user.email "haihao0307@gmail.com"
          git add viewer/app.js viewer/index.html tests/browser_full_map_cdp.py
          git rm tools/apply_guilin_hydrology_v2.py.gz.b64 .github/workflows/apply-guilin-hydrology-v2.yml
          git commit -m "fix(guilin): thin and connect OSM waterways"
          git push origin HEAD:main
