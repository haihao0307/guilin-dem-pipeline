name: Human boxing R01 published full-mesh verification
on:
  push:
    branches: ['qa/human-boxing-r01-20261009']
permissions:
  contents: read
concurrency:
  group: human-boxing-r01
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            kaopu-unified-human-workbench
            kaopu-anny-workbench
            kaopu-mhr-workbench
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm install --prefix "$RUNNER_TEMP/human-qa" --no-save --ignore-scripts playwright@1.57.0
      - run: '"$RUNNER_TEMP/human-qa/node_modules/.bin/playwright" install --with-deps chromium'
      - run: echo "NODE_PATH=$RUNNER_TEMP/human-qa/node_modules" >> "$GITHUB_ENV"
      - run: python3 -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/human-server.log" 2>&1 &
      - name: Wait for exact public boxing release marker
        run: |
          python3 - <<'PYWAIT'
          import urllib.request,json,time,hashlib
          url='https://haihao0307.github.io/guilin-dem-pipeline/kaopu-unified-human-workbench/full/research/boxing-r01/RELEASE.json?v=boxing-r01-20261009'
          deadline=time.monotonic()+900
          while time.monotonic()<deadline:
              try:
                  data=json.load(urllib.request.urlopen(url,timeout=20))
                  if data.get('testedRuntimeCommit')=='3d1702ac791dc11dfa982c940cf798d31012d8ec':
                      print('Exact boxing release marker is public.');break
              except Exception as e: print(type(e).__name__,str(e))
              time.sleep(20)
          else: raise RuntimeError('Expected Pages marker did not arrive; inspect deployment before retrying.')
          base='https://haihao0307.github.io/guilin-dem-pipeline/kaopu-unified-human-workbench/'
          manifest=json.load(open('kaopu-unified-human-workbench/tests/boxing-public-hashes.json'))
          for path,expected in manifest.items():
              data=urllib.request.urlopen(base+path+'?qa=3afeed63482d5a9e0d403cb40627679a37305ee5',timeout=30).read()
              actual=hashlib.sha256(data).hexdigest()
              if actual!=expected:raise RuntimeError('Public hash mismatch: '+path)
          print(str(len(manifest))+' public release file hashes match.')
          PYWAIT
      - run: node kaopu-unified-human-workbench/tests/boxing-browser.cjs
        env:
          BOXING_VIDEO: '1'
          BOXING_URL: https://haihao0307.github.io/guilin-dem-pipeline/kaopu-unified-human-workbench/boxing.html?v=boxing-r01-20261009
      - name: Encode deterministic actual WebGL sequence
        if: always()
        run: |
          if [ -f boxing-qa-results/frames/0143.png ]; then
            ffmpeg -y -framerate 24 -i boxing-qa-results/frames/%04d.png -c:v libx264 -crf 20 -pix_fmt yuv420p boxing-qa-results/boxing-consecutive-frames.mp4
            python3 -c "import shutil;shutil.rmtree('boxing-qa-results/frames')"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: human-boxing-r01-${{ github.sha }}
          path: |
            boxing-qa-results/*.png
            boxing-qa-results/*.json
            boxing-qa-results/*.mp4
          retention-days: 7
