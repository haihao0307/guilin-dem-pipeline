name: Wenzhou R3.8 Lean Handoff

on:
  workflow_dispatch:
  push:
    branches:
      - feature/wenzhou-r3-8-overlay-transform-contract-20260913
    paths:
      - 'handoffs/wenzhou-r3-8-current-full-20260912/LEAN_PACKAGE_TRIGGER'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate lean handoff builder
        run: |
          set -euo pipefail
          python -m py_compile tools/r3-handoff/build_current_lean_handoff.py
          python -m py_compile tools/r3-9/benchmark_soil_pair_codec.py
          python -m py_compile tools/r3-9/build_soil_pair_payloads.py
          test -f handoffs/wenzhou-r3-8-current-full-20260912/06_PACKAGE_SCOPE.md
          test ! -f tools/r3-handoff/build_current_full_handoff.py
          test ! -f handoffs/wenzhou-r3-8-current-full-20260912/PACKAGE_TRIGGER

      - name: Benchmark lossless soil pair codec
        run: |
          set -euo pipefail
          python tools/r3-9/benchmark_soil_pair_codec.py | tee /tmp/soil-codec-benchmark.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/soil-codec-benchmark.json'))
          assert r['passed'] is True
          assert r['pairs'] == 48
          assert r['shuffleGzip'] < r['raw']
          print({k:r[k] for k in ['raw','concatGzip','shuffleGzip','concatReduction','shuffleReduction']})
          PY

      - name: Build lean continuation package
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/wenzhou-lean
          python tools/r3-handoff/build_current_lean_handoff.py \
            --repo-root "$GITHUB_WORKSPACE" \
            --output-zip /tmp/wenzhou-lean/Wenzhou_R3_8_LEAN_HANDOFF_${SOURCE_SHA}.zip \
            --source-commit "$SOURCE_SHA" | tee /tmp/wenzhou-lean/build-report.log
          python -m zipfile -t /tmp/wenzhou-lean/Wenzhou_R3_8_LEAN_HANDOFF_${SOURCE_SHA}.zip
          test -s /tmp/wenzhou-lean/Wenzhou_R3_8_LEAN_HANDOFF_${SOURCE_SHA}.zip.report.json

      - name: Enforce carry-size and dedup gates
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os, pathlib
          sha=os.environ['SOURCE_SHA']
          p=pathlib.Path(f'/tmp/wenzhou-lean/Wenzhou_R3_8_LEAN_HANDOFF_{sha}.zip.report.json')
          r=json.loads(p.read_text(encoding='utf-8'))
          assert r['fullRestartBaseEmbedded'] is False
          assert r['permanentEvidenceEmbedded'] is False
          assert r['browserBinaryPayloadsEmbedded'] is False
          assert r['contentDeduplicated'] is True
          assert r['uniqueUncompressedBytes'] <= 8 * 1024 * 1024
          assert r['bytes'] <= 8 * 1024 * 1024
          print(r)
          PY

      - name: Upload lean handoff artifact
        uses: actions/upload-artifact@v4
        with:
          name: wenzhou-r3-8-lean-handoff-${{ github.sha }}
          path: |
            /tmp/wenzhou-lean/Wenzhou_R3_8_LEAN_HANDOFF_${{ github.sha }}.zip
            /tmp/wenzhou-lean/Wenzhou_R3_8_LEAN_HANDOFF_${{ github.sha }}.zip.report.json
            /tmp/wenzhou-lean/build-report.log
            /tmp/soil-codec-benchmark.json
          if-no-files-found: error
          retention-days: 30

      - name: Build lossless dual-channel soil payloads
        run: |
          set -euo pipefail
          python tools/r3-9/build_soil_pair_payloads.py | tee /tmp/soil-pair-build.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/soil-pair-build.json'))
          assert r['passed'] is True
          assert r['pairs'] == 48
          assert r['compressedBytes'] < 40 * 1024 * 1024
          assert r['reduction'] > 0.75
          print(r)
          PY

      - name: Commit generated soil pair payloads
        run: |
          set -euo pipefail
          BRANCH='feature/wenzhou-r3-8-overlay-transform-contract-20260913'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/dist/r3-8/data/soil-pairs
          if git diff --cached --quiet; then
            echo 'soil pair payloads already current'
          else
            git commit -m 'data(wenzhou): add lossless dual-channel soil payloads'
            git fetch origin "$BRANCH"
            git rebase "origin/$BRANCH"
            git push origin HEAD:"$BRANCH"
          fi
