name: Ear ET18 licensed reference intake
on:
  push:
    branches: [feature/ear-anatomy-et18-20261011]
    paths: [.github/workflows/ear-et18-reference.yml]
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download and verify original publicly licensed reference
        run: |
          mkdir -p reference/extracted
          curl --fail --location --retry 3 'https://cdn.artec3d.com/content-hub-3dmodels/ear_obj.zip?VersionId=mCOZqtBT85vCVgF1g56N5W3v1BE4Dunw' -o reference/artec-ear.zip
          unzip -q reference/artec-ear.zip -d reference/extracted
          test -s reference/extracted/Ear_obj.obj
          grep -q 'Creative Commons Attribution 3.0 Unported License' reference/extracted/license.txt
          sha256sum reference/artec-ear.zip reference/extracted/Ear_obj.obj reference/extracted/license.txt > reference/SHA256.txt
          printf '%s\n' 'Title: Ear' 'Author/licensor: Artec Group Inc.' 'Source: https://www.artec3d.com/3d-models/ear' 'Downloaded OBJ package license: CC BY 3.0 Unported (see extracted/license.txt)' 'Use in ET18: measurement and visual inspection only; the scan mesh is not spliced into the character or shipped in the public preview.' > reference/ATTRIBUTION.txt
          python3 - <<'PY'
          p='reference/extracted/Ear_obj.obj'
          v=f=0
          with open(p,errors='ignore') as h:
            for line in h:
              v += line.startswith('v ')
              f += line.startswith('f ')
          open('reference/MESH_COUNTS.txt','w').write(f'vertices={v}\nfaces={f}\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ear-et18-licensed-reference
          path: reference
          retention-days: 14
