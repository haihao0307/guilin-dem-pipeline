name: KAOPU Noise Domain Warp N04

on:
  push:
    branches:
      - coordination/kaopu-learning-flywheel-r1-20260909
    paths:
      - docs/mother_coordination/kaopu_learning_flywheel_v1/PROBES/noise_domain_warp_probe_n04.cpp
      - docs/mother_coordination/kaopu_learning_flywheel_v1/PROBES/noise_domain_warp_result_n04.json
      - docs/mother_coordination/kaopu_learning_flywheel_v1/references/noise-domain-warp-n04/SOURCE_LOCK.json
      - .github/workflows/kaopu-noise-domain-warp-n04.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and verify pinned FastNoiseLite source
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/Auburn/FastNoiseLite/785f37a9ad76e283586a379675085f2063ae03f7/Cpp/FastNoiseLite.h -o /tmp/FastNoiseLite.h
          echo 'bcba859a43bb5daa506e911bb1b27b1785c12afa0e0aed15b611e5c2e29df142  /tmp/FastNoiseLite.h' | sha256sum --check --strict
      - name: Build and run bounded CPU probe
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++17 -O2 -I /tmp docs/mother_coordination/kaopu_learning_flywheel_v1/PROBES/noise_domain_warp_probe_n04.cpp -o /tmp/noise-domain-warp-n04
          /tmp/noise-domain-warp-n04 /tmp/noise_domain_warp_result_n04.json >/tmp/noise-domain-warp-n04.log
      - name: Check semantic result and deterministic fields
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.status == "pass" and .summary.checks == 24 and .summary.passed == 24 and .summary.failed == 0' /tmp/noise_domain_warp_result_n04.json
          jq -e 'all(.kernels[]; .cpuBenchmark.baselineNs > 0 and .cpuBenchmark.warpPlusNoiseNs > 0 and .cpuBenchmark.ratio > 1)' /tmp/noise_domain_warp_result_n04.json
          jq -S '(.kernels[] |= del(.cpuBenchmark))' docs/mother_coordination/kaopu_learning_flywheel_v1/PROBES/noise_domain_warp_result_n04.json >/tmp/expected.json
          jq -S '(.kernels[] |= del(.cpuBenchmark))' /tmp/noise_domain_warp_result_n04.json >/tmp/actual.json
          diff -u /tmp/expected.json /tmp/actual.json
      - name: Preserve replay artifact
        uses: actions/upload-artifact@v4
        with:
          name: kaopu-noise-domain-warp-n04
          path: |
            /tmp/noise_domain_warp_result_n04.json
            /tmp/noise-domain-warp-n04.log
          if-no-files-found: error
