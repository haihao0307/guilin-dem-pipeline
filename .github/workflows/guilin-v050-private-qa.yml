name: Guilin v0.5 private unified-workbench QA

on:
  pull_request:
    paths:
      - ".github/workflows/guilin-v050-private-qa.yml"
      - "web/guilin-v050/**"
      - "tests/test_guilin_v050_recovery_runtime.py"
      - "tests/test_guilin_v050_stage_a_workbench.py"
      - "projects/guilin/config/release_gate_v050.json"
  push:
    branches:
      - "fix/guilin-v050-restore-v130-workbench"
    paths:
      - ".github/workflows/guilin-v050-private-qa.yml"
      - "web/guilin-v050/**"
      - "tests/test_guilin_v050_recovery_runtime.py"
      - "tests/test_guilin_v050_stage_a_workbench.py"
      - "projects/guilin/config/release_gate_v050.json"
  workflow_dispatch:

concurrency:
  group: guilin-v050-private-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  private-unified-workbench-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate JSON, assets, and runtime contracts
        run: |
          python -m json.tool web/guilin-v050/manifest.json >/dev/null
          python -m json.tool projects/guilin/config/release_gate_v050.json >/dev/null
          python -m unittest discover -s tests -v
          for module in \
            web/guilin-v050/runtime.js \
            web/guilin-v050/core-loader.js \
            web/guilin-v050/gaea-bridge.js \
            web/guilin-v050/hydrology-runtime.js \
            web/guilin-v050/ecology-core-runtime.js; do
            node --check "$module"
          done

      - name: Assemble route-faithful private artifact
        run: |
          set -euo pipefail
          PROJECT="DEM-Map-Pipeline/guilin-zhenbaoding-yangshuo-pingle"
          OUT="_private_guilin_v050"
          rm -rf "$OUT"
          mkdir -p "$OUT/guilin-v050" "$OUT/$PROJECT/metadata"
          cp -a "$PROJECT/web/." "$OUT/"
          cp -a web/guilin-v050/. "$OUT/guilin-v050/"
          mkdir -p "$OUT/$PROJECT/web"
          cp -a "$PROJECT/web/assets" "$OUT/$PROJECT/web/assets"
          cp "$PROJECT/metadata/waterways_osm.geojson" "$OUT/$PROJECT/metadata/"
          cp "$PROJECT/metadata/lijiang_osm.geojson" "$OUT/$PROJECT/metadata/"
          touch "$OUT/.nojekyll"

      - name: Verify HTTP routes and runtime assets
        run: |
          set -euo pipefail
          python -m http.server 8765 --directory _private_guilin_v050 >/tmp/guilin-v050-http.log 2>&1 &
          PID=$!
          trap 'kill $PID' EXIT
          python - <<'PY'
          import time
          import urllib.request
          for _ in range(30):
              try:
                  urllib.request.urlopen("http://127.0.0.1:8765/guilin-v050/", timeout=1)
                  break
              except OSError:
                  time.sleep(0.2)
          else:
              raise SystemExit("private preview server did not start")
          PY
          for path in \
            /guilin-v050/ \
            /guilin-v050/manifest.json \
            /guilin-v050/runtime.js \
            /guilin-v050/core-loader.js \
            /guilin-v050/gaea-bridge.js \
            /guilin-v050/hydrology-runtime.js \
            /guilin-v050/ecology-core-runtime.js \
            /guilin-v050/assets/cores/zhenbao-ding/manifest.json \
            /guilin-v050/assets/cores/guilin-old-city/height_u16.bin \
            /guilin-v050/assets/cores/yangtang-airfield/mask_u8.bin \
            /guilin-v050/assets/cores/yangshuo-county-seat/manifest.json \
            /DEM-Map-Pipeline/guilin-zhenbaoding-yangshuo-pingle/web/assets/height_u16.bin \
            /DEM-Map-Pipeline/guilin-zhenbaoding-yangshuo-pingle/web/assets/mask_u8.bin \
            /DEM-Map-Pipeline/guilin-zhenbaoding-yangshuo-pingle/metadata/waterways_osm.geojson \
            /DEM-Map-Pipeline/guilin-zhenbaoding-yangshuo-pingle/metadata/lijiang_osm.geojson; do
            curl --fail --silent --show-error "http://127.0.0.1:8765${path}" >/dev/null
          done

      - name: Verify Draft and publication gates remain closed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          gate = json.loads(Path("projects/guilin/config/release_gate_v050.json").read_text(encoding="utf-8"))
          manifest = json.loads(Path("web/guilin-v050/manifest.json").read_text(encoding="utf-8"))
          assert gate["public_release_allowed"] is False
          assert gate["automatic_publication_allowed"] is False
          assert manifest["publication"]["allowed"] is False
          assert manifest["publication"]["automatic"] is False
          assert manifest["publication"]["pullRequestMustRemainDraft"] is True
          assert manifest["publication"]["mergeAllowed"] is False
          PY

      - name: Upload private unified-workbench preview
        uses: actions/upload-artifact@v4
        with:
          name: guilin-v050-private-unified-workbench-${{ github.sha }}
          path: _private_guilin_v050
          if-no-files-found: error
          compression-level: 3
          retention-days: 30
