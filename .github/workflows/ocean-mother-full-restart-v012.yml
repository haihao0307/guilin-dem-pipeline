name: Ocean Mother full restart V012
on:
  push:
    branches: [work/ocean-mother-handoff-20260901]
    paths: [.github/workflows/ocean-mother-full-restart-v012.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: ocean-mother-full-restart-v012
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Reconstruct exact package publisher from verified source segments
        run: |
          python3 - <<'PY'
          import base64,hashlib,os,pathlib,urllib.request,zlib
          repo='haihao0307/guilin-dem-pipeline';ref=os.environ['GITHUB_SHA']
          assert os.environ['GITHUB_REPOSITORY']==repo
          def read(path):
              url=f'https://raw.githubusercontent.com/{repo}/{ref}/{path}'
              with urllib.request.urlopen(url,timeout=60) as r:
                  assert r.status==200
                  return r.read().decode().strip()
          first=''.join(read(f'ocean-mother/package-v012/corrections/p1s{i}.b64') for i in range(1,4))
          second=''.join(read(f'ocean-mother/package-v012/corrections/p2s{i}.b64') for i in range(1,4))
          assert len(first)==9000 and len(second)==9000
          third=read('ocean-mother/package-v012/chunks/part03.b64')
          fourth=read('ocean-mother/package-v012/chunks/part04.b64')
          assert len(third)==9000 and len(fourth)==8196
          packed=base64.b64decode(first+second+third+fourth,validate=True)
          assert hashlib.sha256(packed).hexdigest()=='c6b7a6cc275a67a2e738418a2904ead6ecf835a5384ddfca8a37385f193c1698'
          script=zlib.decompress(packed)
          assert hashlib.sha256(script).hexdigest()=='5d595aa17d8e24dae8e2cf45a2a20d90a6fef85297d3f7d4cf6d54b10580b629'
          assert script.count(b'assert len(actual)==60')==1
          script=script.replace(b'assert len(actual)==60',b'assert len(actual)==57')
          assert hashlib.sha256(script).hexdigest()=='1b92d79106af6199bdb81561eb5ef3e39bbfb059d0cc7ce57b6553d02b3dca2c'
          pathlib.Path('build_package.py').write_bytes(script)
          PY
      - name: Build exact ZIP, rerun tests, push package and freeze restart pointer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -B build_package.py
      - name: Remove temporary correction segments from the final branch state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json,os,time,urllib.error,urllib.request,pathlib
          repo='haihao0307/guilin-dem-pipeline';branch='work/ocean-mother-handoff-20260901'
          base='https://api.github.com/repos/'+repo
          def api(path,body=None,method=None):
              req=urllib.request.Request(base+path,data=None if body is None else json.dumps(body).encode(),method=method or ('GET' if body is None else 'POST'),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=60) as r:return json.load(r)
          head=api('/git/ref/heads/'+branch+'?nonce='+str(time.time_ns()))['object']['sha']
          package='ocean-mother/handoffs/Ocean_Mother_Full_Restart_Handoff_2026-09-02_V0.1.2.zip'
          meta=api('/contents/'+package+'?ref='+head)
          assert meta['size']==143130
          paths=[f'ocean-mother/package-v012/corrections/p{p}s{s}.b64' for p in (1,2) for s in range(1,4)]
          for path in paths:api('/contents/'+path+'?ref='+head)
          tree=api('/git/trees',{'base_tree':api('/git/commits/'+head)['tree']['sha'],'tree':[{'path':p,'mode':'100644','type':'blob','sha':None} for p in paths]})['sha']
          clean=api('/git/commits',{'message':'chore(ocean): remove temporary full-package correction segments','tree':tree,'parents':[head]})['sha']
          assert api('/git/ref/heads/'+branch+'?nonce='+str(time.time_ns()))['object']['sha']==head
          api('/git/refs/heads/'+branch,{'sha':clean,'force':False},'PATCH')
          assert api('/git/ref/heads/'+branch+'?nonce='+str(time.time_ns()))['object']['sha']==clean
          for path in paths:
              try:api('/contents/'+path+'?ref='+clean)
              except urllib.error.HTTPError as e:
                  assert e.code==404
              else:raise AssertionError(path+' was not removed')
          final_meta=api('/contents/'+package+'?ref='+clean)
          assert final_meta['sha']==meta['sha'] and final_meta['size']==143130
          pathlib.Path('_publication_evidence').mkdir(exist_ok=True)
          pathlib.Path('_publication_evidence/CLEANUP.json').write_text(json.dumps({'status':'TEMPORARY_SEGMENTS_REMOVED','packageCommit':head,'finalCleanCommit':clean,'removedFiles':len(paths),'packageGitBlobSha':meta['sha'],'packageBytes':meta['size'],'forcePush':False},indent=2)+'\n')
          print(clean)
          PY
      - name: Preserve package publication evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Ocean-Mother-Full-Restart-V0.1.2
          path: |
            _ocean_restart/Ocean_Mother_Full_Restart_Handoff_2026-09-02_V0.1.2.zip
            _publication_evidence/
          retention-days: 90
          if-no-files-found: warn
