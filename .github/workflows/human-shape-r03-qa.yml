name: R03 six human shapes same-camera review
on:
  push:
    branches: [qa/human-shape-r03-20261009]
permissions:
  contents: read
jobs:
  render-six:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            kaopu-unified-human-workbench
            kaopu-anny-workbench
            kaopu-mhr-workbench
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          npm install --prefix .human-qa --no-save --ignore-scripts --no-audit --no-fund playwright@1.55.0
          ./.human-qa/node_modules/.bin/playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/shape-r03-http.log 2>&1 &
          sleep 2
      - name: Render actual same-model geometry in 60 paired views
        env:
          NODE_PATH: ${{ github.workspace }}/.human-qa/node_modules
          SHAPE_R3_OUT: ${{ github.workspace }}/shape-r03-results
        run: node kaopu-unified-human-workbench/tests/shape-r03-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shape-r03-${{ github.sha }}
          path: shape-r03-results/
          if-no-files-found: warn
