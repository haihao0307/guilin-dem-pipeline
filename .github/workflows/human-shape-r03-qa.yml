name: R03 six human shapes same-camera review
on:
  push:
    branches: [qa/human-shape-r03-20261009]
permissions:
  contents: read
jobs:
  render-six:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            kaopu-unified-human-workbench
            kaopu-anny-workbench
            kaopu-mhr-workbench
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          npm install --prefix .human-qa --no-save --ignore-scripts --no-audit --no-fund playwright@1.55.0
          ./.human-qa/node_modules/.bin/playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/shape-r03-http.log 2>&1 &
          sleep 2
      - name: Verify six shape contracts and source field geometry
        env:
          SHAPE_R3_NUMERIC_OUT: ${{ github.workspace }}/shape-r03-results/numeric
        run: |
          for id in child-male-tall-slim child-female-rounded adult-male-tall-slim adult-male-short-heavy adult-female-rounded senior-female-short-slim; do
            ONLY=r03-$id node kaopu-unified-human-workbench/full/shape-r03/tests/contract.mjs
          done
          node kaopu-unified-human-workbench/full/shape-r03/tests/geometry.mjs
          node kaopu-unified-human-workbench/full/shape-r03/tests/same-identity.mjs
      - name: Render 76 actual same-camera geometry views
        env:
          NODE_PATH: ${{ github.workspace }}/.human-qa/node_modules
          SHAPE_R3_OUT: ${{ github.workspace }}/shape-r03-results
        run: node kaopu-unified-human-workbench/tests/shape-r03-browser.cjs
      - name: Match numeric and browser rest geometry fingerprints
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const r=JSON.parse(fs.readFileSync('shape-r03-results/report.json'));
          assert(r.numericPassed);for(const p of r.cases){const n=JSON.parse(fs.readFileSync('shape-r03-results/numeric/'+p.id+'.json')).cases[0];assert.equal(p.states.new.positionSHA256,n.geometrySHA256,p.id);}
          console.log('PASS six complete numeric/browser geometry fingerprints are exact');
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shape-r03-${{ github.sha }}
          path: shape-r03-results/
          if-no-files-found: warn
