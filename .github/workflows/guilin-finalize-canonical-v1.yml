name: Finalize Guilin canonical elevation main line

on:
  push:
    branches:
      - project/guilin-canonical-elevation-store-v1
    paths:
      - finalize/GUILIN_CANONICAL_MAIN_REQUEST.json

permissions:
  contents: write

concurrency:
  group: guilin-canonical-main-finalizer
  cancel-in-progress: false

jobs:
  finalize-main:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge the connector-prepared main baseline
        run: |
          set -euo pipefail
          git config user.name 'Haihao_Nature Grace HK'
          git config user.email 'haihao0307@gmail.com'
          git fetch origin main
          git merge --no-edit origin/main
          git push origin HEAD:project/guilin-canonical-elevation-store-v1

      - name: Fast-forward main to the verified canonical source tree
        run: |
          set -euo pipefail
          git push origin HEAD:main
          LOCAL_SHA="$(git rev-parse HEAD)"
          REMOTE_SHA="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$LOCAL_SHA" = "$REMOTE_SHA"
          echo "FINAL_MAIN_SHA=$LOCAL_SHA" >> "$GITHUB_ENV"

      - name: Summarize
        run: |
          {
            echo '## Guilin canonical main-line finalization'
            echo
            echo "* main SHA: $FINAL_MAIN_SHA"
            echo '* normal production elevation source: canonical pixel-exact store'
            echo '* source TIFF role: cold backup only'
            echo '* source TIFF reads in normal production: prohibited'
          } >> "$GITHUB_STEP_SUMMARY"
