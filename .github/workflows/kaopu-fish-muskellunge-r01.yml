name: Publish KAOPU Fish Muskellunge R01
on:
  push:
    branches: [work/kaopu-fish-muskellunge-r01-20260930]
    paths:
      - 'kaopu-fish-triad-r01/**'
      - '.bootstrap/kaopu-fish-r01/**'
      - '.github/workflows/kaopu-fish-muskellunge-r01.yml'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: kaopu-fish-muskellunge-r01-publish
  cancel-in-progress: false
env:
  PROJECT_DIR: kaopu-fish-triad-r01
  PUBLIC_SUBDIR: kaopu-fish-triad/muskellunge-r01-20260930
  PUBLIC_URL: https://haihao0307.github.io/guilin-dem-pipeline/kaopu-fish-triad/muskellunge-r01-20260930/
jobs:
  build-publish-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Restore and materialize audited source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/kaopu-fish-r01/chunk-* > /tmp/kaopu-fish-r01-src.tar.gz.b64
          base64 --decode /tmp/kaopu-fish-r01-src.tar.gz.b64 > /tmp/kaopu-fish-r01-src.tar.gz
          echo '00d9e46731fec9dd6096a19bc2bfd22fc861df43f81fa219b59e1e13593e02cb  /tmp/kaopu-fish-r01-src.tar.gz' | sha256sum -c -
          rm -rf "$PROJECT_DIR"
          tar -xzf /tmp/kaopu-fish-r01-src.tar.gz -C .
          test -s "$PROJECT_DIR/src/instrument.js"
          test -s "$PROJECT_DIR/scores/resolved/MUSKELLUNGE_RESOLVED_SCORE_R01.json"

          python <<'PY'
          from pathlib import Path
          path = Path('kaopu-fish-triad-r01/src/instrument.js')
          text = path.read_text(encoding='utf-8')

          old_update = "  handle.root.updateMatrixWorld(true);\n  return { mode: id, time, worldInputs: handle.state.worldInputs };"
          new_update = "  handle.root.updateMatrixWorld(true);\n  handle.skeleton.update();\n  return { mode: id, time, worldInputs: handle.state.worldInputs };"
          if old_update not in text:
              raise SystemExit('Expected skeleton update insertion point not found')
          text = text.replace(old_update, new_update, 1)

          old_curve = "function makeCurveTube(points, radius, segments = 28) {\n  const curve = new THREE.CatmullRomCurve3(points.map((point) => new THREE.Vector3(...point)), false, 'centripetal');\n  return new THREE.TubeGeometry(curve, segments, radius, 6, false);\n}"
          new_curve = "function makeCurveTube(points, radius, segments = 28) {\n  const vectors = points.map((point) => new THREE.Vector3(...point));\n  const curve = vectors.length === 2\n    ? new THREE.LineCurve3(vectors[0], vectors[1])\n    : new THREE.CatmullRomCurve3(vectors, false, 'centripetal');\n  return new THREE.TubeGeometry(curve, segments, radius, 6, false);\n}"
          if old_curve not in text:
              raise SystemExit('Expected curve helper replacement point not found')
          text = text.replace(old_curve, new_curve, 1)
          path.write_text(text, encoding='utf-8')
          PY

          git config user.name 'KAOPU Fish Triad CI'
          git config user.email 'kaopu-fish-ci@users.noreply.github.com'
          git add "$PROJECT_DIR"
          if ! git diff --cached --quiet; then
            git commit -m 'build(kaopu-fish): materialize muskellunge triad R01 sources [skip ci]'
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
          echo "MATERIALIZED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm install --no-audit --no-fund

      - name: Composer, score and instrument unit tests
        run: node "$PROJECT_DIR/tests/unit.mjs" | tee unit-results-fish-r01.txt

      - name: Install real browser
        working-directory: ${{ env.PROJECT_DIR }}
        run: npx playwright install --with-deps chromium

      - name: Build one-file workbench, player and separate triad artifacts
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm run build

      - name: Build complete source handoff package
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$PROJECT_DIR/dist/KAOPU_FISH_TRIAD_R01_FULL_PACKAGE.zip"
          zip -qr "$PROJECT_DIR/dist/KAOPU_FISH_TRIAD_R01_FULL_PACKAGE.zip" "$PROJECT_DIR" \
            -x "$PROJECT_DIR/node_modules/*" "$PROJECT_DIR/dist/*"
          test -s "$PROJECT_DIR/dist/KAOPU_FISH_TRIAD_R01_FULL_PACKAGE.zip"

      - name: Verify triad boundaries and release contents
        shell: bash
        run: |
          set -euo pipefail
          DIST="$PROJECT_DIR/dist"
          for f in index.html standalone-player.html KAOPU_FISH_COMPOSER_KC1.js KAOPU_FISH_INSTRUMENT_KF1.js FISH_AXIAL_BASE_KF1.json MUSKELLUNGE_SOURCE_SCORE_R01.json MUSKELLUNGE_RESOLVED_SCORE_R01.json instrument.manifest.json resolved-score.schema.json TASK_ANCHOR_R01.json REFERENCE_AUDIT.json BUILD_MANIFEST.json README.md KAOPU_FISH_TRIAD_R01_FULL_PACKAGE.zip; do
            test -s "$DIST/$f"
          done
          grep -q 'KAOPU Fish Triad R01' "$DIST/index.html"
          grep -q 'KAOPU Fish · Independent Replay' "$DIST/standalone-player.html"
          grep -q 'KF1.0.0' "$DIST/KAOPU_FISH_INSTRUMENT_KF1.js"
          grep -q 'KC1.0.0' "$DIST/KAOPU_FISH_COMPOSER_KC1.js"
          grep -q '"externalAssetInFormalBuild": false' "$DIST/MUSKELLUNGE_RESOLVED_SCORE_R01.json"
          if grep -Eqi '<script[^>]+src=|<link[^>]+stylesheet' "$DIST/index.html" "$DIST/standalone-player.html"; then
            echo 'Standalone HTML contains an external script or stylesheet.'; exit 1
          fi
          if find "$DIST" -type f | grep -Eqi '\.(fbx|glb|gltf|png|jpe?g|webp|ktx2)$'; then
            echo 'Teacher model or texture leaked into formal release.'; exit 1
          fi
          if grep -Eqi 'muskellunge|teacherVertexCount|b998f32f' "$DIST/KAOPU_FISH_INSTRUMENT_KF1.js"; then
            echo 'Object-specific teacher knowledge leaked into the pure instrument.'; exit 1
          fi
          if grep -Eqi 'SkinnedMesh|ExtrudeGeometry|SphereGeometry' "$DIST/KAOPU_FISH_COMPOSER_KC1.js"; then
            echo 'Composer contains formal geometry generation.'; exit 1
          fi
          if grep -Eqi 'FBXLoader|OrbitControls|querySelector' "$DIST/KAOPU_FISH_INSTRUMENT_KF1.js"; then
            echo 'Pure instrument contains workbench or reference-loader code.'; exit 1
          fi
          echo "WORKBENCH_SHA256 $(sha256sum "$DIST/index.html" | awk '{print $1}')"
          echo "PLAYER_SHA256 $(sha256sum "$DIST/standalone-player.html" | awk '{print $1}')"
          echo "INSTRUMENT_SHA256 $(sha256sum "$DIST/KAOPU_FISH_INSTRUMENT_KF1.js" | awk '{print $1}')"

      - name: Standalone desktop and mobile browser QA
        shell: bash
        run: |
          set -euo pipefail
          LOCAL_URL=$(node -e "console.log(require('node:url').pathToFileURL(process.argv[1]).href)" "$GITHUB_WORKSPACE/$PROJECT_DIR/dist/index.html")
          TARGET_URL="$LOCAL_URL" QA_DIR=qa-artifacts node "$PROJECT_DIR/tests/smoke.mjs"

      - name: Publish isolated R01 path
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          rm -rf /tmp/kaopu-fish-pages-r01
          git worktree add --detach /tmp/kaopu-fish-pages-r01 origin/gh-pages
          TARGET="/tmp/kaopu-fish-pages-r01/$PUBLIC_SUBDIR"
          rm -rf "$TARGET"
          mkdir -p "$TARGET"
          cp "$PROJECT_DIR/dist/"* "$TARGET/"
          cd /tmp/kaopu-fish-pages-r01
          git config user.name 'KAOPU Fish Triad CI'
          git config user.email 'kaopu-fish-ci@users.noreply.github.com'
          git add "$PUBLIC_SUBDIR"
          if ! git diff --cached --quiet; then
            git commit -m 'publish(kaopu-fish): muskellunge teacher reconstruction R01 [skip ci]'
            git push origin HEAD:gh-pages
          fi

      - name: Request Pages build when branch publishing is configured
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          type=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type' || echo unknown)
          echo "Pages build type: $type"
          if [ "$type" = legacy ]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --jq '.status' || true
          fi

      - name: Verify exact public workbench, player, instrument and score
        shell: bash
        run: |
          set -euo pipefail
          declare -A FILES=(
            [index.html]="$(sha256sum "$PROJECT_DIR/dist/index.html" | awk '{print $1}')"
            [standalone-player.html]="$(sha256sum "$PROJECT_DIR/dist/standalone-player.html" | awk '{print $1}')"
            [KAOPU_FISH_INSTRUMENT_KF1.js]="$(sha256sum "$PROJECT_DIR/dist/KAOPU_FISH_INSTRUMENT_KF1.js" | awk '{print $1}')"
            [MUSKELLUNGE_RESOLVED_SCORE_R01.json]="$(sha256sum "$PROJECT_DIR/dist/MUSKELLUNGE_RESOLVED_SCORE_R01.json" | awk '{print $1}')"
          )
          ok=0
          for attempt in $(seq 1 100); do
            ok=1
            for file in "${!FILES[@]}"; do
              remote="$file"
              [ "$file" = index.html ] && remote=''
              code=$(curl --max-time 20 -L -sS -H 'Cache-Control: no-cache' -o "/tmp/$file" -w '%{http_code}' "${PUBLIC_URL}${remote}" || true)
              actual=$(sha256sum "/tmp/$file" 2>/dev/null | awk '{print $1}' || true)
              if [ "$code" != 200 ] || [ "$actual" != "${FILES[$file]}" ]; then
                echo "Waiting exact payload: $file code=$code actual=$actual expected=${FILES[$file]} attempt=$attempt"
                ok=0
              fi
            done
            [ "$ok" = 1 ] && break
            sleep 5
          done
          test "$ok" = 1

      - name: Live desktop and mobile browser QA
        run: TARGET_URL="$PUBLIC_URL" QA_DIR=qa-artifacts node "$PROJECT_DIR/tests/smoke.mjs"

      - name: Write publication proof
        shell: bash
        run: |
          set -euo pipefail
          export WORKBENCH_SHA256=$(sha256sum "$PROJECT_DIR/dist/index.html" | awk '{print $1}')
          export PLAYER_SHA256=$(sha256sum "$PROJECT_DIR/dist/standalone-player.html" | awk '{print $1}')
          export INSTRUMENT_SHA256=$(sha256sum "$PROJECT_DIR/dist/KAOPU_FISH_INSTRUMENT_KF1.js" | awk '{print $1}')
          export SCORE_SHA256=$(sha256sum "$PROJECT_DIR/dist/MUSKELLUNGE_RESOLVED_SCORE_R01.json" | awk '{print $1}')
          node --input-type=module <<'JS'
          import { readFile, writeFile } from 'node:fs/promises';
          const e = process.env;
          const standalone = JSON.parse(await readFile('qa-artifacts/standalone-results.json', 'utf8'));
          const live = JSON.parse(await readFile('qa-artifacts/public-results.json', 'utf8'));
          const proof = {
            project: 'KAOPU Fish Triad R01',
            composerVersion: 'KC1.0.0',
            instrumentVersion: 'KF1.0.0',
            sourceRepository: e.GITHUB_REPOSITORY,
            sourceBranch: e.GITHUB_REF_NAME,
            sourceSha: e.MATERIALIZED_SHA,
            publicUrl: e.PUBLIC_URL,
            playerUrl: `${e.PUBLIC_URL}standalone-player.html`,
            instrumentUrl: `${e.PUBLIC_URL}KAOPU_FISH_INSTRUMENT_KF1.js`,
            scoreUrl: `${e.PUBLIC_URL}MUSKELLUNGE_RESOLVED_SCORE_R01.json`,
            fullPackageUrl: `${e.PUBLIC_URL}KAOPU_FISH_TRIAD_R01_FULL_PACKAGE.zip`,
            verifiedAtUtc: new Date().toISOString(),
            exactPublicBytesMatched: true,
            workbenchSha256: e.WORKBENCH_SHA256,
            playerSha256: e.PLAYER_SHA256,
            instrumentSha256: e.INSTRUMENT_SHA256,
            scoreSha256: e.SCORE_SHA256,
            interactive3D: true,
            formalSkinnedMesh: true,
            bodyBones: 11,
            branchBones: 3,
            teacherAssetInFormalBuild: false,
            externalModels: 0,
            externalTextures: 0,
            requiredNetworkRequests: 0,
            fileProtocolTested: true,
            desktopStandalonePassed: true,
            mobileViewportStandalonePassed: true,
            publicHttpsPassed: true,
            physicalMobileDeviceTested: false,
            visualAcceptance: false,
            motionAcceptance: false,
            productionReady: false,
            shareAllowed: true,
            standalone,
            live
          };
          await writeFile(`/tmp/kaopu-fish-pages-r01/${e.PUBLIC_SUBDIR}/PUBLICATION_PROOF.json`, JSON.stringify(proof, null, 2) + '\n');
          JS
          cd /tmp/kaopu-fish-pages-r01
          git add "$PUBLIC_SUBDIR/PUBLICATION_PROOF.json"
          git commit -m 'proof(kaopu-fish): R01 exact public replay [skip ci]'
          git fetch origin gh-pages
          git rebase origin/gh-pages
          git push origin HEAD:gh-pages
          for attempt in $(seq 1 40); do
            code=$(curl --max-time 20 -L -sS -H 'Cache-Control: no-cache' -o /tmp/kaopu-fish-proof.json -w '%{http_code}' "${PUBLIC_URL}PUBLICATION_PROOF.json" || true)
            if [ "$code" = 200 ] && grep -q '"shareAllowed": true' /tmp/kaopu-fish-proof.json && grep -q '"sourceSha": "'"$MATERIALIZED_SHA"'"' /tmp/kaopu-fish-proof.json; then
              echo "VERIFIED_PUBLIC_FISH_R01 $PUBLIC_URL"
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Upload evidence and release
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaopu-fish-muskellunge-r01-${{ github.sha }}
          path: |
            unit-results-fish-r01.txt
            qa-artifacts/
            kaopu-fish-triad-r01/dist/
            kaopu-fish-triad-r01/src/
            kaopu-fish-triad-r01/scores/
            kaopu-fish-triad-r01/contracts/
            kaopu-fish-triad-r01/docs/
            kaopu-fish-triad-r01/tests/
            kaopu-fish-triad-r01/scripts/
            kaopu-fish-triad-r01/package.json
            kaopu-fish-triad-r01/README.md
            kaopu-fish-triad-r01/TASK_ANCHOR_R01.json
          retention-days: 14
