name: Shorts R5 Public Browser Check
on:
  push:
    branches: [work/shorts-r5-original-human-20260930]
    paths: [.github/workflows/shorts-r5-public.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: shorts-r5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for the actual R5.2 public garment build
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk >/dev/null
          npm install --prefix .r5-deps --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.55.0
          READY=false
          for attempt in $(seq 1 72); do
            if curl -fsS "https://haihao0307.github.io/guilin-dem-pipeline/shorts-original-r5/FIT_CARD.json?qa=${GITHUB_RUN_ID}-${attempt}" -o /tmp/card.json && grep -q 'R5.2-bridge' /tmp/card.json; then
              READY=true
              break
            fi
            sleep 10
          done
          test "$READY" = true
      - name: Open public URL in a clean real browser
        shell: bash
        env:
          PUBLIC_SMOKE: '1'
          REVIEW_URL: https://haihao0307.github.io/guilin-dem-pipeline/shorts-original-r5/?v=r52-public
        run: |
          export CHROME_PATH="$(command -v google-chrome || command -v chromium || true)"
          test -n "$CHROME_PATH"
          node shorts-r5/qa.cjs
      - name: Preserve public browser proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shorts-r5-public-proof
          path: proof/
          if-no-files-found: warn
