name: Human overview R01 read-only QA
on:
  workflow_dispatch:
  pull_request:
    branches: [gh-pages]
    paths:
      - 'kaopu-human-overview/**'
      - '.github/workflows/human-overview-r01-qa.yml'
      - '.github/qa/overview-*.cjs'
      - '.github/qa/overview-*.json'
      - '.github/qa/overview-*.py'
permissions:
  contents: read
env:
  OVERVIEW_VERIFY_PUBLIC: 'false'
concurrency:
  group: human-overview-r01-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop-combination:
    if: github.event_name != 'pull_request' || github.head_ref == 'qa/human-overview-r01-20261006'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/qa
            kaopu-human-overview
            kaopu-face-workbench
            kaopu-anny-workbench
            kaopu-mhr-workbench
            kaopu-unified-human-workbench
            kaopu-skin-workbench
            kaopu-tailor-workbench
            kaopu-animal-learning
            kaopu-hair-workbench
      - name: Check static and exact reviewed bytes
        run: |
          python3 .github/qa/overview-release-static.py
          node --check .github/qa/overview-release-navigation.cjs
          node --check .github/qa/overview-ui-neck-combined.cjs
          python3 - <<'PYVERIFY'
          from pathlib import Path
          import hashlib,json
          manifest=json.loads(Path('.github/qa/overview-release-integrity.json').read_text())
          for item in manifest['files']:
              data=Path(item['path']).read_bytes()
              assert hashlib.sha256(data).hexdigest()==item['sha256'],item['path']+' candidate SHA256 mismatch'
              actual=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              assert actual==item['gitBlobSHA'],item['path']+' candidate Git blob mismatch'
          print('Exact reviewed release files:',len(manifest['files']))
          PYVERIFY
      - name: Verify real public bytes
        if: env.OVERVIEW_VERIFY_PUBLIC == 'true'
        run: |
          python3 - <<'PYVERIFY'
          from pathlib import Path
          from concurrent.futures import ThreadPoolExecutor
          import hashlib,json,urllib.request
          manifest=json.loads(Path('.github/qa/overview-release-integrity.json').read_text());base='https://haihao0307.github.io/guilin-dem-pipeline/'
          def check(item):
              request=urllib.request.Request(base+item['path']+'?verify=ui-neck-20261007',headers={'Cache-Control':'no-cache'})
              with urllib.request.urlopen(request,timeout=60) as response: data=response.read();status=response.status
              actual=hashlib.sha256(data).hexdigest()
              return {'path':item['path'],'status':status,'sha256':actual,'passed':status==200 and actual==item['sha256']}
          with ThreadPoolExecutor(max_workers=6) as pool: rows=list(pool.map(check,manifest['files']))
          Path('overview-public-release-bytes.json').write_text(json.dumps({'passed':all(r['passed'] for r in rows),'files':rows},indent=2))
          assert all(r['passed'] for r in rows),[r for r in rows if not r['passed']]
          print('Published release exact hashes:',len(rows))
          PYVERIFY
      - name: Install fixed official browser dependency
        run: |
          npm install --prefix "$RUNNER_TEMP/overview-test" --no-save --ignore-scripts playwright@1.57.0
          "$RUNNER_TEMP/overview-test/node_modules/.bin/playwright" install --with-deps ${{ matrix.engine }}
      - name: Desktop navigation, lifecycle and combined neck UI
        env:
          NODE_PATH: ${{ runner.temp }}/overview-test/node_modules
          OVERVIEW_BROWSER: ${{ matrix.engine }}
          OVERVIEW_URL: ${{ env.OVERVIEW_VERIFY_PUBLIC == 'true' && 'https://haihao0307.github.io/guilin-dem-pipeline/kaopu-human-overview/' || 'http://127.0.0.1:8765/kaopu-human-overview/' }}
          OVERVIEW_QA_DIR: combined-${{ matrix.engine }}
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/overview-server.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -fsS "$OVERVIEW_URL" > /dev/null && break || sleep 1; done
          node .github/qa/overview-release-navigation.cjs
          node .github/qa/overview-ui-neck-combined.cjs
      - name: Upload desktop screenshots and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: combined-ui-neck-${{ matrix.engine }}-evidence
          retention-days: 7
          if-no-files-found: warn
          path: |
            combined-${{ matrix.engine }}/*.json
            combined-${{ matrix.engine }}/*.jsonl
            combined-${{ matrix.engine }}/*.png
            overview-public-release-bytes.json
      - name: Upload desktop traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: combined-ui-neck-${{ matrix.engine }}-traces
          retention-days: 7
          if-no-files-found: warn
          path: combined-${{ matrix.engine }}/*.zip
