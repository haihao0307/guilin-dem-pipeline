name: Human overview R01 read-only QA
on:
  workflow_dispatch:
  pull_request:
    branches: [gh-pages]
    paths:
      - 'kaopu-human-overview/**'
      - '.github/workflows/human-overview-r01-qa.yml'
      - '.github/qa/overview-*.cjs'
permissions:
  contents: read
env:
  OVERVIEW_VERIFY_PUBLIC: 'false'
concurrency:
  group: human-overview-r01-${{ github.ref }}
  cancel-in-progress: true
jobs:
  overview-browser:
    if: github.event_name != 'pull_request' || github.head_ref == 'qa/human-overview-r01-20261006'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/qa
            kaopu-human-overview
            kaopu-face-workbench
            kaopu-anny-workbench
            kaopu-mhr-workbench
            kaopu-unified-human-workbench
            kaopu-skin-workbench
            kaopu-tailor-workbench
            kaopu-animal-learning
            kaopu-hair-workbench
          sparse-checkout-cone-mode: true
      - name: Validate static contracts
        run: |
          python3 kaopu-human-overview/tests/static.py
          node --check kaopu-human-overview/tests/browser.cjs
          node --check .github/qa/overview-browser-diagnostic.cjs
          node --check .github/qa/overview-lifecycle-evidence.cjs
          node --check .github/qa/overview-browser-single-context.cjs
      - name: Install fixed official browser test dependency
        run: |
          npm install --prefix "$RUNNER_TEMP/overview-test" --no-save --ignore-scripts playwright@1.57.0
          "$RUNNER_TEMP/overview-test/node_modules/.bin/playwright" install --with-deps chromium webkit
      - name: Test desktop mobile keyboard touch and Back in both engines
        if: env.OVERVIEW_VERIFY_PUBLIC != 'true'
        env:
          OVERVIEW_URL: http://127.0.0.1:8765/kaopu-human-overview/
          NODE_PATH: ${{ runner.temp }}/overview-test/node_modules
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/overview-server.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -fsS "$OVERVIEW_URL" > /dev/null && break || sleep 1; done
          OVERVIEW_QA_DIR=overview-chromium node .github/qa/overview-browser-single-context.cjs
          OVERVIEW_BROWSER=webkit OVERVIEW_QA_DIR=overview-webkit node .github/qa/overview-browser-single-context.cjs
      - name: Verify exact published bytes and real HTTPS navigation
        if: env.OVERVIEW_VERIFY_PUBLIC == 'true'
        env:
          OVERVIEW_URL: https://haihao0307.github.io/guilin-dem-pipeline/kaopu-human-overview/
          NODE_PATH: ${{ runner.temp }}/overview-test/node_modules
        run: |
          python3 - <<'PYVERIFY'
          from pathlib import Path
          import hashlib,json,os,urllib.request
          root=Path('kaopu-human-overview');base=os.environ['OVERVIEW_URL'];checks=[]
          for path in sorted(root.rglob('*')):
              if not path.is_file(): continue
              relative=path.relative_to(root).as_posix()
              request=urllib.request.Request(base+relative+'?overview=verified-r01',headers={'Cache-Control':'no-cache'})
              with urllib.request.urlopen(request,timeout=60) as response:
                  actual=response.read();status=response.status
              expected=hashlib.sha256(path.read_bytes()).hexdigest()
              assert status==200 and hashlib.sha256(actual).hexdigest()==expected,relative+' public mismatch'
              checks.append({'path':relative,'status':status,'sha256':expected,'bytes':len(actual)})
          Path('overview-public-bytes.json').write_text(json.dumps({'passed':True,'url':base,'files':checks},indent=2))
          print('Public overview exact file verification passed:',len(checks))
          PYVERIFY
          OVERVIEW_QA_DIR=overview-public-chromium node kaopu-human-overview/tests/browser.cjs
          OVERVIEW_BROWSER=webkit OVERVIEW_QA_DIR=overview-public-webkit node kaopu-human-overview/tests/browser.cjs
      - name: Upload overview QA screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: human-overview-r01-evidence
          retention-days: 7
          if-no-files-found: warn
          path: |
            overview-chromium/*
            overview-webkit/*
            overview-public-chromium/*
            overview-public-webkit/*
            overview-public-bytes.json
