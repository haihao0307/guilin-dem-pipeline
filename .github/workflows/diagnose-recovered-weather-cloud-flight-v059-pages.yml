name: Diagnose recovered Weather cloud flight V0.5.9 Pages

on:
  push:
    branches:
      - recovery/weather-mother-cloud-flight-v059-20260910
    paths:
      - .github/workflows/diagnose-recovered-weather-cloud-flight-v059-pages.yml

permissions:
  contents: write

jobs:
  diagnose-pages-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUBLIC_URL: https://haihao0307.github.io/guilin-dem-pipeline/wenzhou-v7-full/workbench-v059/
      OUT_DIR: weather-mother/handoffs/recovered-cloud-flight-v059-pages-diagnostic
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser harness
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/wm-cloud-flight-pages
          cd /tmp/wm-cloud-flight-pages
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Diagnose live Pages runtime and historical flight buttons
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR"
          cat > /tmp/wm-cloud-flight-pages/run.mjs <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import { chromium } from 'playwright';
          const url=process.env.PUBLIC_URL, outDir=process.env.OUT_DIR;
          const errors=[], consoleEvents=[], failedRequests=[];
          const browser=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-webgl','--ignore-gpu-blocklist','--disable-dev-shm-usage']});
          const context=await browser.newContext({viewport:{width:1440,height:1000},deviceScaleFactor:1});
          const page=await context.newPage();
          page.on('pageerror',e=>errors.push({type:'pageerror',message:String(e?.stack||e)}));
          page.on('console',m=>{consoleEvents.push({type:m.type(),text:m.text()}); if(m.type()==='error') errors.push({type:'console',message:m.text()});});
          page.on('requestfailed',r=>{failedRequests.push({url:r.url(),method:r.method(),error:r.failure()?.errorText||''});});
          const response=await page.goto(url,{waitUntil:'domcontentloaded',timeout:120000});
          const httpStatus=response?.status()||0;
          let ready=false;
          const checkpoints=[];
          for(let i=0;i<12;i++){
            await page.waitForTimeout(2500);
            const snap=await page.evaluate(()=>{
              const s=window.__WZ_FULL__||null;
              return {title:document.title,errorText:document.getElementById('error')?.textContent||'',errorVisible:getComputedStyle(document.getElementById('error')||document.body).display,release:window.__WZ_RELEASE__||null,state:s,resources:performance.getEntriesByType('resource').map(e=>({name:e.name,initiatorType:e.initiatorType,transferSize:e.transferSize,duration:e.duration})).slice(-120)};
            });
            checkpoints.push({seconds:(i+1)*2.5,snapshot:snap});
            if(snap.state?.ready && snap.state?.cloudRendered && snap.state?.sameWebGLContext && snap.state?.sharedDepth){ready=true;break;}
            if(snap.errorText) break;
          }
          const base=await page.evaluate(()=>({
            title:document.title,
            cloudViewExists:!!document.getElementById('cloudView'),
            flightViewExists:!!document.getElementById('flightView'),
            menuExists:!!document.getElementById('menuButton'),
            runtime:window.__WZ_FULL__||null,
            release:window.__WZ_RELEASE__||null,
            errorText:document.getElementById('error')?.textContent||''
          }));
          const views={};
          async function openView(){
            const panel=page.locator('#panel');
            if(await panel.count() && !(await panel.evaluate(el=>el.classList.contains('open')))) await page.locator('#menuButton').click();
            const tab=page.locator('[data-tab-button="view"]'); if(await tab.count()) await tab.click();
            await page.waitForTimeout(250);
          }
          async function capture(id,file){
            await openView();
            const btn=page.locator('#'+id); if(!(await btn.count())) return {exists:false};
            await btn.click(); await page.waitForTimeout(1200);
            const st=await page.evaluate((id)=>{const s=window.__WZ_FULL__||{};return {id,ready:!!s.ready,eye:s.eye||null,target:s.target||null,clearance:s.clearance??null,minClearance:s.minClearance??null,cloudRendered:!!s.cloudRendered,oneCanvas:!!s.oneCanvas,oneCamera:!!s.oneCamera,sameWebGLContext:!!s.sameWebGLContext,sharedDepth:!!s.sharedDepth,weatherReady:!!s.weather?.ready,caseId:s.weather?.caseId||null};},id);
            await page.screenshot({path:path.join(outDir,file),fullPage:false}); return st;
          }
          if(ready){views.cloudView=await capture('cloudView','PAGES_CLOUDVIEW_1440x1000.png');views.flightView=await capture('flightView','PAGES_FLIGHTVIEW_1440x1000.png');}
          await page.screenshot({path:path.join(outDir,'PAGES_DIAGNOSTIC_1440x1000.png'),fullPage:false});
          const report={schema:'weather-mother-cloud-flight-v059-pages-diagnostic/1',checkedAtUtc:new Date().toISOString(),publicURL:url,httpStatus,ready,base,views,errors,failedRequests,consoleEvents,checkpoints};
          fs.writeFileSync(path.join(outDir,'PAGES_DIAGNOSTIC.json'),JSON.stringify(report,null,2)+'\n');
          console.log(JSON.stringify({httpStatus,ready,errorCount:errors.length,failedRequests:failedRequests.slice(0,12),errorText:base.errorText,views},null,2));
          await context.close(); await browser.close();
          if(!ready) process.exitCode=2;
          JS
          cd /tmp/wm-cloud-flight-pages
          set +e
          NODE_PATH=/tmp/wm-cloud-flight-pages/node_modules PUBLIC_URL="$PUBLIC_URL" OUT_DIR="$GITHUB_WORKSPACE/$OUT_DIR" node run.mjs
          rc=$?
          set -e
          echo "$rc" > "$GITHUB_WORKSPACE/$OUT_DIR/DIAGNOSTIC_EXIT_CODE.txt"
          exit 0
      - name: Commit diagnostic evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Weather Mother CI'
          git config user.email 'weather-mother-ci@users.noreply.github.com'
          git add "$OUT_DIR"
          git commit -m 'diag(weather-mother): inspect live Pages cloud-flight runtime [skip ci]'
          git push origin HEAD:recovery/weather-mother-cloud-flight-v059-20260910
