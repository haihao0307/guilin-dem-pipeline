name: Head procedural C4 read-only public visual review
on:
  push:
    branches: [research/head-procedural-skin-r01-20261014]
    paths: ['.github/workflows/head-procedural-c4-public-review.yml']
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - name: Actual public controls and default recipe screenshots
        run: |
          mkdir -p evidence
          cat > inspect.cjs <<'JS'
          const {chromium}=require('playwright'),fs=require('fs'),crypto=require('crypto'),assert=require('node:assert/strict');
          (async()=>{let b,c,p;const q={version:'HEAD-PROCEDURAL-R01-C4',build:'7ca673bc5f2be9dc2462252ae94580e81f05ab8a',source:'3b4665635e6c3f6a0e2063c1486fab772cb2811f',url:'https://htmlpreview.github.io/?https://raw.githubusercontent.com/haihao0307/guilin-dem-pipeline/7ca673bc5f2be9dc2462252ae94580e81f05ab8a/kaopu-unified-human-workbench/head-procedural-r01/preview.html',runtimeModified:false,softwareRenderer:true,physicalPhone:false,errors:[],failedRequests:[],screenshots:[]};
          try{b=await chromium.launch({headless:true,args:['--no-sandbox','--use-angle=swiftshader','--enable-unsafe-swiftshader']});c=await b.newContext({viewport:{width:1440,height:960}});p=await c.newPage();p.on('pageerror',e=>q.errors.push(String(e)));p.on('requestfailed',r=>q.failedRequests.push({url:r.url(),error:r.failure()}));p.on('console',m=>{if(m.type()==='error'&&!m.location().url.includes('favicon'))q.errors.push(m.text())});
          await p.goto(q.url,{waitUntil:'domcontentloaded',timeout:90000});await p.waitForFunction(()=>window.__HEAD_PROC__?.ready,{},{timeout:240000});q.initial=await p.evaluate(()=>({source:__HEAD_PROC_SOURCE__,recipe:headProceduralSkin.settings(),expected:headProceduralSkin.referenceRecipe(),inspection:headProceduralSkin.inspection.report()}));assert.equal(q.initial.source,q.source);assert.deepEqual(q.initial.recipe,q.initial.expected);
          const cd=await c.newCDPSession(p);const shot=async n=>{const x=await cd.send('Page.captureScreenshot',{format:'png',captureBeyondViewport:false}),buf=Buffer.from(x.data,'base64');fs.writeFileSync('evidence/'+n+'.png',buf);q.screenshots.push({name:n,bytes:buf.length,sha256:crypto.createHash('sha256').update(buf).digest('hex')});};
          const frame=()=>p.evaluate(async()=>{const v=__IDENTITY_QA__.viewer();v.render();const gl=v.renderer.getContext(),x=new Uint8Array(gl.drawingBufferWidth*gl.drawingBufferHeight*4);gl.readPixels(0,0,gl.drawingBufferWidth,gl.drawingBufferHeight,gl.RGBA,gl.UNSIGNED_BYTE,x);return Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',x)),a=>a.toString(16).padStart(2,'0')).join('');});
          await p.click('[data-hc-light="neutral"]');const first=await frame();await shot('01-default-neutral-full');
          await p.click('[data-hc-light="native"]');const native=await frame();await shot('02-default-native-full');assert.notEqual(first,native);
          await p.click('[data-hc-light="neutral"]');const back=await frame();assert.equal(first,back);q.trustedLightButtons={neutral:first,native,return:back,exactRoundtrip:true};
          await p.click('[data-ps-action="cheek"]');await frame();await shot('03-default-cheek-macro');assert.deepEqual(await p.evaluate(()=>headProceduralSkin.settings()),q.initial.recipe);
          await p.click('[data-ps-view="front"]');await p.click('[data-ps-action="lip"]');await frame();await shot('04-default-lip-macro');
          await p.click('[data-ps-view="oblique"]');await p.click('[data-ps-action="reset"]');await frame();
          const pending=p.waitForEvent('download');await p.click('[data-ps-action="save"]');const download=await pending,file=await download.path(),data=JSON.parse(fs.readFileSync(file,'utf8'));assert.deepEqual(data.proceduralHeadSurface.settings,q.initial.recipe);assert(Object.keys(data).length>3);q.actualExport={filename:download.suggestedFilename(),fullPersonKeys:Object.keys(data),recipePreserved:true};
          await p.setViewportSize({width:390,height:844});await p.evaluate(()=>scrollTo(0,0));await frame();await shot('05-mobile-viewport-initial-recipe');assert.equal(q.errors.length,0);assert.equal(q.failedRequests.length,0);q.completed=true;
          }catch(e){q.completed=false;q.failure=String(e);console.error(e);process.exitCode=1;}finally{fs.writeFileSync('evidence/REVIEW_QA.json',JSON.stringify(q,null,2));console.log(JSON.stringify(q,null,2));await b?.close();}})();
          JS
          node inspect.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: head-procedural-c4-public-review
          path: evidence/
          retention-days: 14
