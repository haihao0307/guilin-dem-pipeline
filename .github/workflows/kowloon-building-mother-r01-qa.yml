name: Kowloon Building Mother R01 scoped browser QA
on:
  push:
    branches: ['trial/kowloon-building-mother-r01-20261020']
    paths:
      - 'kaopu-geography-workbench/kowloon-building-mother-r01/**'
      - '.github/workflows/kowloon-building-mother-r01-qa.yml'
permissions:
  contents: read
concurrency:
  group: kowloon-building-mother-r01-${{ github.ref }}
  cancel-in-progress: false
jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            kaopu-geography-workbench/kowloon-building-mother-r01
            kaopu-geography-workbench/hk-three-buildings-r01
      - name: Install pinned browser runner
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Source and dependency regression checks
        run: |
          node --experimental-default-type=module --test kaopu-geography-workbench/kowloon-building-mother-r01/tests/*.test.mjs
          node --check kaopu-geography-workbench/kowloon-building-mother-r01/r03/app.mjs
          node --check kaopu-geography-workbench/kowloon-building-mother-r01/r04/app.mjs
          node --check kaopu-geography-workbench/kowloon-building-mother-r01/r05/app.mjs
      - name: Render published r05 HTTPS and verify served hashes
        run: |
          python kaopu-geography-workbench/kowloon-building-mother-r01/tests/interior-browser.py --url https://haihao0307.github.io/guilin-dem-pipeline/kaopu-geography-workbench/kowloon-building-mother-r01/r05.html --output kaopu-geography-workbench/kowloon-building-mother-r01/evidence/r05-public-browser
      - name: Save r05 public visual evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: r05-public-${{ github.sha }}
          path: kaopu-geography-workbench/kowloon-building-mother-r01/evidence/r05-public-browser
          if-no-files-found: warn
          retention-days: 1
      - name: Render the published HTTPS checkpoint and verify served file hashes
        run: |
          python kaopu-geography-workbench/kowloon-building-mother-r01/tests/browser.py --url https://haihao0307.github.io/guilin-dem-pipeline/kaopu-geography-workbench/kowloon-building-mother-r01/ --expected-build 2026-10-20-floor-window-pbr-r03 --output kaopu-geography-workbench/kowloon-building-mother-r01/evidence/public-browser
      - name: Render published r04 HTTPS staircase and verify served hashes
        run: |
          python kaopu-geography-workbench/kowloon-building-mother-r01/tests/stairs-browser.py --url https://haihao0307.github.io/guilin-dem-pipeline/kaopu-geography-workbench/kowloon-building-mother-r01/r04.html --output kaopu-geography-workbench/kowloon-building-mother-r01/evidence/r04-public-browser
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: kowloon-building-mother-r01-${{ github.sha }}
          path: |
            kaopu-geography-workbench/kowloon-building-mother-r01/evidence/public-browser
            kaopu-geography-workbench/kowloon-building-mother-r01/evidence/r04-public-browser
            kaopu-geography-workbench/kowloon-building-mother-r01/evidence/r05-public-browser
          if-no-files-found: warn
          retention-days: 1
