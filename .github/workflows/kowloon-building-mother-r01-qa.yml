name: Kowloon R06 direct field scoped QA
on:
  push:
    branches: ['trial/kowloon-building-mother-r06-20261021']
    paths:
      - 'kaopu-geography-workbench/kowloon-building-mother-r01/**'
      - '.github/workflows/kowloon-building-mother-r01-qa.yml'
permissions:
  contents: read
concurrency:
  group: kowloon-r06-${{ github.ref }}
  cancel-in-progress: false
jobs:
  chromium:
    if: ${{ !contains(github.event.head_commit.message, '[capture-only]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      QA_PUBLIC: ${{ contains(github.event.head_commit.message, '[public-verify]') }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            kaopu-geography-workbench/kowloon-building-mother-r01
            kaopu-geography-workbench/hk-three-buildings-r01
      - name: Install pinned browser runner
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: All existing and new CPU tests
        run: node --experimental-default-type=module --test kaopu-geography-workbench/kowloon-building-mother-r01/tests/*.test.mjs
      - name: Candidate direct field WebGL parity and visual QA
        run: |
          python -m http.server 8765 >/tmp/r06-http.log 2>&1 &
          BASE=http://127.0.0.1:8765/kaopu-geography-workbench/kowloon-building-mother-r01
          if [[ "$QA_PUBLIC" == "true" ]]; then
            BASE=https://haihao0307.github.io/guilin-dem-pipeline/kaopu-geography-workbench/kowloon-building-mother-r01
          else
            python kaopu-geography-workbench/kowloon-building-mother-r01/tests/implicit-microbench.py --url "$BASE/r06.html" --output kaopu-geography-workbench/kowloon-building-mother-r01/evidence/r06-browser
          fi
          python kaopu-geography-workbench/kowloon-building-mother-r01/tests/implicit-browser.py --url "$BASE/r06.html" --output kaopu-geography-workbench/kowloon-building-mother-r01/evidence/r06-browser
      - name: Immutable R03 R04 R05 actual browser regression
        if: ${{ !cancelled() }}
        run: |
          BASE=http://127.0.0.1:8765/kaopu-geography-workbench/kowloon-building-mother-r01
          if [[ "$QA_PUBLIC" == "true" ]]; then BASE=https://haihao0307.github.io/guilin-dem-pipeline/kaopu-geography-workbench/kowloon-building-mother-r01; fi
          python kaopu-geography-workbench/kowloon-building-mother-r01/tests/implicit-regression.py --base-url "$BASE/" --output kaopu-geography-workbench/kowloon-building-mother-r01/evidence/r06-browser/old-regression
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: r06-field-${{ github.sha }}
          path: kaopu-geography-workbench/kowloon-building-mother-r01/evidence/r06-browser
          if-no-files-found: warn
          retention-days: 1

  source-preview:
    if: ${{ contains(github.event.head_commit.message, '[capture-only]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            kaopu-geography-workbench/kowloon-building-mother-r01
            kaopu-geography-workbench/hk-three-buildings-r01
      - name: Install pinned browser runner
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Capture actual case fields, not full acceptance
        env:
          CAPTURE_CASES: ${{ contains(github.event.head_commit.message, '[case-capture]') }}
        run: |
          python -m http.server 8765 >/tmp/r06-preview-http.log 2>&1 &
          if [[ "$CAPTURE_CASES" == "true" ]]; then
            python kaopu-geography-workbench/kowloon-building-mother-r01/tests/implicit-case-preview.py --url http://127.0.0.1:8765/kaopu-geography-workbench/kowloon-building-mother-r01/r06.html --output kaopu-geography-workbench/kowloon-building-mother-r01/evidence/r06-source-preview
          else
          python kaopu-geography-workbench/kowloon-building-mother-r01/tests/implicit-source-preview.py --url http://127.0.0.1:8765/kaopu-geography-workbench/kowloon-building-mother-r01/r06.html --output kaopu-geography-workbench/kowloon-building-mother-r01/evidence/r06-source-preview
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: r06-source-preview-${{ github.sha }}
          path: kaopu-geography-workbench/kowloon-building-mother-r01/evidence/r06-source-preview
          if-no-files-found: warn
          retention-days: 1
