name: Lips ET19 P1 startup optimization
on:
  push:
    branches: [perf/lips-et19-startup-20261013]
    paths:
      - kaopu-unified-human-workbench/lip-startup-r01/*.mjs
      - kaopu-unified-human-workbench/lip-startup-r01/*.cjs
      - .github/workflows/lips-et19-startup.yml
permissions:
  contents: write
  actions: read
concurrency:
  group: lips-et19-startup-only
  cancel-in-progress: true
jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            kaopu-unified-human-workbench
            qa/lips-startup-p1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned verification tools
        run: |
          mkdir -p /tmp/lip-tools
          cd /tmp/lip-tools
          npm init -y >/dev/null
          npm install esbuild@0.25.11 playwright@1.56.1 pngjs@7.0.0
          npx playwright install --with-deps chromium
      - name: Read the already measured immutable original baseline, not substitute a new character
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 38339123537
          name: lips-startup-p1-evidence
          path: /tmp/lip-golden
      - name: Verify original baseline evidence and require the final full-quality frame
        run: |
          mkdir -p lip-startup-evidence/build
          python3 - <<'PY'
          import hashlib,pathlib,shutil
          p=pathlib.Path('/tmp/lip-golden')
          pins={'baseline.json':'dd9dc0b3fa2b23f1bab0e0e7da266c23d8998b8a801e49b33dc32fe2d84421a7','baseline-macro.png':'01d4785355ed870424b3104ef115af466554a6f49afa87c4b1b10cbf6eafded6'}
          for name,h in pins.items():
              assert hashlib.sha256((p/name).read_bytes()).hexdigest()==h
              shutil.copy2(p/name,pathlib.Path('lip-startup-evidence')/name)
          pathlib.Path('lip-startup-evidence/baseline-origin.txt').write_text('Original public baseline measured in run 38339123537; reused only at these exact evidence hashes. This run measures candidate/public anew.\n')
          p=pathlib.Path('kaopu-unified-human-workbench/lip-startup-r01/verify.cjs');s=p.read_text();a='skin?.faceExtension?.ready);';b='skin?.faceExtension?.ready&&(!window.__LIP_STARTUP__||window.__IDENTITY_QA__.viewer().startupFinalFrame));'
          if b not in s:
              assert a in s
              s=s.replace(a,b)
          p.write_text(s)
          PY
      - name: Build exact native transport and run isolated cache logic checks
        env:
          NODE_PATH: /tmp/lip-tools/node_modules
          LIP_CACHE_REPORT: lip-startup-evidence/cache-unit.json
        run: |
          echo "$GITHUB_SHA" > lip-startup-evidence/source-commit.txt
          node kaopu-unified-human-workbench/lip-startup-r01/build.cjs
          node qa/lips-startup-p1/cache-unit.mjs
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('kaopu-unified-human-workbench/lip-startup-r01/BUILD.json');d=json.loads(p.read_text());d['changes']+=['coalesce asynchronous texture and initial layout draws until the final complete frame','stop shutdown draws before original pagehide cleanup; keep actual cleanup and archives'];p.write_text(json.dumps(d,indent=2)+'\n')
          PY
          cp -r kaopu-unified-human-workbench/lip-startup-r01/. lip-startup-evidence/build/
      - name: Verify optimized candidate, all retained geometry and independent lip interactions
        env:
          NODE_PATH: /tmp/lip-tools/node_modules
          PERF_MODE: candidate
          PERF_URL: http://127.0.0.1:8765/kaopu-unified-human-workbench/lip-startup-r01/index.html
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/lip-startup-http.log 2>&1 &
          node kaopu-unified-human-workbench/lip-startup-r01/verify.cjs
      - name: Publish immutable candidate without modifying the old workbench
        id: publish
        run: |
          test "$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)" = "$GITHUB_SHA"
          git diff --exit-code HEAD -- kaopu-unified-human-workbench/lip-structure kaopu-unified-human-workbench/eye-materials kaopu-unified-human-workbench/full kaopu-unified-human-workbench/face-transfer kaopu-unified-human-workbench/identity-lab
          git config user.name 'KAOPU Startup Verification'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kaopu-unified-human-workbench/lip-startup-r01
          git commit -m 'build(lips): P1 startup and reload lifecycle after exact full-geometry regressions [skip ci]'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          SHA=$(git rev-parse HEAD)
          URL="https://htmlpreview.github.io/?https://raw.githubusercontent.com/haihao0307/guilin-dem-pipeline/$SHA/kaopu-unified-human-workbench/lip-startup-r01/index.html"
          echo "$SHA" > lip-startup-evidence/published-commit.txt
          echo "$URL" > lip-startup-evidence/public-url.txt
          echo "url=$URL" >> "$GITHUB_OUTPUT"
      - name: Actual optimized HTTPS cold/warm loads and full retained behavior
        env:
          NODE_PATH: /tmp/lip-tools/node_modules
          PERF_MODE: public
          PERF_URL: ${{ steps.publish.outputs.url }}
        run: node kaopu-unified-human-workbench/lip-startup-r01/verify.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lips-startup-p1-evidence
          path: lip-startup-evidence
          retention-days: 14
