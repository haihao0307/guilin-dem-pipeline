name: Inspect Yangshuo river geometry v3.1.3

on:
  push:
    branches:
      - skill/dem-procedural-landscape-v010
    paths:
      - .github/workflows/inspect-yangshuo-river-geometry-v313.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Print exact river geometry ranges
        shell: bash
        run: |
          set -euo pipefail
          echo '===== river grid classification ====='
          sed -n '625,675p' web/yangshuo-noise-terrain-v310/index.html
          echo '===== water geometry functions ====='
          grep -nE 'function .*([Rr]iver|[Ww]ater)|waterCore|halfWidth|waterGroup|vertexCount|positions\.push|indices\.push' web/yangshuo-noise-terrain-v310/index.html
          echo '===== water geometry range 790-910 ====='
          sed -n '790,910p' web/yangshuo-noise-terrain-v310/index.html
