name: Guilin v0.7.6 full Codex handoff package

on:
  push:
    branches:
      - project/guilin-v076-hydrology-2048
    paths:
      - .github/workflows/guilin-v076-full-handoff.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build_package:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PACKAGE_NAME: Xiaogui_Guilin_DEM_V076_Full_Codex_Handoff_2026-08-29
      RAW_TIFF_URL: https://github.com/haihao0307/guilin-dem-pipeline/releases/download/guilin-v070-raw-mosaic-v001/guilin_raw_union_12_5m.tif
      RAW_TIFF_SHA256: 9490b1bd34f67336352cf448729f763ae4e241637d821961efd0290e29d6c9d4
      RAW_TIFF_BYTES: "124348471"
      QA_RUN_ID: "33225907299"
      QA_ARTIFACT_NAME: guilin-v075-2048-hydrology-evidence-33225907299-1

    steps:
      - name: Checkout source branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: project/guilin-v076-hydrology-2048
          fetch-depth: 0
          lfs: false

      - name: Assemble source, pages, truth data and QA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ROOT="/tmp/${PACKAGE_NAME}"
          OUT="/tmp/guilin-v076-package"
          rm -rf "${ROOT}" "${OUT}" /tmp/guilin-pages
          mkdir -p "${ROOT}/repository_snapshot" "${ROOT}/published_html" "${ROOT}/truth_data" "${ROOT}/qa_evidence" "${ROOT}/receipts" "${OUT}"

          rsync -a --exclude='.git' ./ "${ROOT}/repository_snapshot/"
          git rev-parse HEAD > "${ROOT}/receipts/source_head.txt"
          git rev-parse HEAD^{tree} > "${ROOT}/receipts/source_tree.txt"
          git status --short > "${ROOT}/receipts/source_status.txt"
          test ! -s "${ROOT}/receipts/source_status.txt"
          git log --date=iso-strict --pretty=format:'%H%x09%P%x09%ad%x09%an%x09%s' -n 120 > "${ROOT}/receipts/source_log_120.tsv"

          git fetch origin gh-pages --depth=1
          git worktree add --detach /tmp/guilin-pages origin/gh-pages
          git -C /tmp/guilin-pages rev-parse HEAD > "${ROOT}/receipts/gh_pages_head.txt"
          for DIR in guilin-current guilin-v076-hydrology-2048 guilin-v075-approved-aoi-terrain3d; do
            test -s "/tmp/guilin-pages/${DIR}/index.html"
            cp -a "/tmp/guilin-pages/${DIR}" "${ROOT}/published_html/"
          done
          test "$(wc -c < "${ROOT}/published_html/guilin-current/data/terrain_2048_u16.bin" | tr -d ' ')" = "8388608"
          test "$(wc -c < "${ROOT}/published_html/guilin-v076-hydrology-2048/data/terrain_2048_u16.bin" | tr -d ' ')" = "8388608"
          test -s "${ROOT}/published_html/guilin-current/data/hydrology_ribbons.f32.bin"
          test -s "${ROOT}/published_html/guilin-v076-hydrology-2048/data/hydrology_ribbons.f32.bin"

          curl -fL --retry 8 --retry-all-errors --connect-timeout 30 --max-time 2400 "${RAW_TIFF_URL}" -o "${ROOT}/truth_data/guilin_raw_union_12_5m.tif"
          test "$(wc -c < "${ROOT}/truth_data/guilin_raw_union_12_5m.tif" | tr -d ' ')" = "${RAW_TIFF_BYTES}"
          printf '%s  %s\n' "${RAW_TIFF_SHA256}" "${ROOT}/truth_data/guilin_raw_union_12_5m.tif" | sha256sum -c -
          printf 'bytes=%s\nsha256=%s\nsource_url=%s\n' "${RAW_TIFF_BYTES}" "${RAW_TIFF_SHA256}" "${RAW_TIFF_URL}" > "${ROOT}/truth_data/TRUTH_DATA_RECEIPT.txt"

          mkdir -p "${ROOT}/qa_evidence/workflow_run_${QA_RUN_ID}"
          gh run view "${QA_RUN_ID}" --repo haihao0307/guilin-dem-pipeline --json databaseId,name,displayTitle,event,status,conclusion,headBranch,headSha,createdAt,updatedAt,url > "${ROOT}/qa_evidence/workflow_run_${QA_RUN_ID}/run.json"
          gh run download "${QA_RUN_ID}" --repo haihao0307/guilin-dem-pipeline --name "${QA_ARTIFACT_NAME}" --dir "${ROOT}/qa_evidence/workflow_run_${QA_RUN_ID}/artifact"
          test -s "${ROOT}/qa_evidence/workflow_run_${QA_RUN_ID}/artifact/public/desktop-1600x1000.png"
          test -s "${ROOT}/qa_evidence/workflow_run_${QA_RUN_ID}/artifact/public/browser-qa.json"

          printf 'repository=haihao0307/guilin-dem-pipeline\nsource_branch=project/guilin-v076-hydrology-2048\nfrozen_branch=project/guilin-v075-approved-aoi-terrain3d-preview\nfrozen_commit=0496a8ad0d9f8fd58965b1461a1288c8462c97c4\naccepted_area_km2=33113.874\nterrain_grid=2048x2048\nsource_resolution_m=12.5\ngap_fill_applied=false\nfallback_30m_used=false\n' > "${ROOT}/receipts/CURRENT_STATE.txt"
          find "${ROOT}" -type f -print0 | sort -z | xargs -0 sha256sum > "${ROOT}/receipts/SHA256SUMS.absolute.txt"
          cd /tmp
          zip -9 -r "${OUT}/${PACKAGE_NAME}.zip" "${PACKAGE_NAME}" > "${OUT}/zip.log"
          sha256sum "${OUT}/${PACKAGE_NAME}.zip" > "${OUT}/${PACKAGE_NAME}.zip.sha256"
          stat -c '%n %s bytes' "${OUT}/${PACKAGE_NAME}.zip" > "${OUT}/package-size.txt"
          unzip -t "${OUT}/${PACKAGE_NAME}.zip" > "${OUT}/unzip-test.txt"

      - name: Upload package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Xiaogui-Guilin-DEM-V076-Full-Codex-Handoff
          path: /tmp/guilin-v076-package/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
