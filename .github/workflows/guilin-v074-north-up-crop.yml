name: Guilin v0.7.4 north-up crop page

on:
  push:
    branches:
      - project/guilin-v074-north-up-crop-and-distillation
    paths:
      - .github/workflows/guilin-v074-north-up-crop.yml
      - projects/guilin-v074-north-up-crop-and-distillation/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: guilin-v074-north-up-crop
  cancel-in-progress: false

jobs:
  verify-publish-public-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PROJECT_DIR: projects/guilin-v074-north-up-crop-and-distillation
      DESTINATION_DIR: guilin-v074-north-up-crop
      PUBLIC_URL: https://haihao0307.github.io/guilin-dem-pipeline/guilin-v074-north-up-crop/
      EVIDENCE_DIR: /tmp/guilin-v074-evidence
      DIST_DIR: /tmp/guilin-v074-dist
      PAGES_DIR: /tmp/guilin-v074-pages

    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          lfs: false

      - name: Install QA dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "project/guilin-v074-north-up-crop-and-distillation"
          test "${GITHUB_SHA}" = "$(git rev-parse HEAD)"
          mkdir -p "${EVIDENCE_DIR}/local" "${EVIDENCE_DIR}/public" "${DIST_DIR}"
          python -m pip install --disable-pip-version-check Pillow==11.1.0 requests==2.32.3 websocket-client==1.8.0
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -x "${browser}"
          printf '%s\n' "${browser}" > "${EVIDENCE_DIR}/browser-path.txt"

      - name: Run static and local browser QA
        shell: bash
        run: |
          set -euo pipefail
          node --check "${PROJECT_DIR}/web/geo.js"
          node --check "${PROJECT_DIR}/web/app.js"
          node "${PROJECT_DIR}/tests/static_contract_test.mjs" | tee "${EVIDENCE_DIR}/static-contract-qa.json"
          rsync -a "${PROJECT_DIR}/web/" "${DIST_DIR}/"
          SOURCE_SHA="${GITHUB_SHA}" python - "${DIST_DIR}" <<'PY'
          import json, os, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          data = {
              "schema": "guilin-v074-build-provenance/v1",
              "source_commit": os.environ["SOURCE_SHA"],
              "aoi_status": "UNCONFIRMED",
              "distillation_allowed": False,
              "source_hash_reconciliation_status": "BLOCKED_BEFORE_FORMAL_CROP_AND_DISTILLATION",
          }
          (root / "build_provenance.json").write_text(json.dumps(data, indent=2) + "\n")
          PY
          browser="$(cat "${EVIDENCE_DIR}/browser-path.txt")"
          python -m http.server 8123 --bind 127.0.0.1 --directory "${DIST_DIR}" >"${EVIDENCE_DIR}/local/server.log" 2>&1 &
          server_pid=$!
          trap 'kill "${server_pid}" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do curl -fsS http://127.0.0.1:8123/ >/dev/null && break; sleep 0.25; done
          python "${PROJECT_DIR}/tests/browser_cdp.py" --chromium "${browser}" --url "http://127.0.0.1:8123/?qa=1&fixture=1&v=${GITHUB_SHA}" --qa-timeout 180 --evidence-dir "${EVIDENCE_DIR}/local"
          python "${PROJECT_DIR}/tests/validate_browser_dump.py" "${EVIDENCE_DIR}/local/browser-dom.html" --output "${EVIDENCE_DIR}/local/browser-dom-qa.json"
          python "${PROJECT_DIR}/tests/check_screenshots.py" "${EVIDENCE_DIR}/local/desktop-1600x1000.png" "${EVIDENCE_DIR}/local/mobile-390x844.png" --output "${EVIDENCE_DIR}/local/screenshot-qa.json"

      - name: Publish page and run public real-asset QA
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          rm -rf "${PAGES_DIR}"
          git worktree add -b "v074-pages-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "${PAGES_DIR}" origin/gh-pages
          rm -rf "${PAGES_DIR}/${DESTINATION_DIR}"
          mkdir -p "${PAGES_DIR}/${DESTINATION_DIR}"
          rsync -a "${DIST_DIR}/" "${PAGES_DIR}/${DESTINATION_DIR}/"
          touch "${PAGES_DIR}/.nojekyll"
          git -C "${PAGES_DIR}" config user.name github-actions[bot]
          git -C "${PAGES_DIR}" config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C "${PAGES_DIR}" add .nojekyll "${DESTINATION_DIR}"
          git -C "${PAGES_DIR}" commit -m "Publish Guilin v0.7.4 north-up crop ${GITHUB_SHA}"
          git -C "${PAGES_DIR}" push origin HEAD:gh-pages
          ready=0
          for attempt in $(seq 1 90); do
            if curl -fsSL --connect-timeout 15 --max-time 60 "${PUBLIC_URL}?v=${GITHUB_SHA}-${attempt}" -o "${EVIDENCE_DIR}/public-page.html" && grep -Fq north-up-crop-unconfirmed "${EVIDENCE_DIR}/public-page.html"; then ready=1; break; fi
            sleep 10
          done
          test "${ready}" = 1
          browser="$(cat "${EVIDENCE_DIR}/browser-path.txt")"
          python "${PROJECT_DIR}/tests/browser_cdp.py" --chromium "${browser}" --url "${PUBLIC_URL}?qa=1&v=${GITHUB_SHA}" --expect-real-asset --qa-timeout 240 --evidence-dir "${EVIDENCE_DIR}/public"
          python "${PROJECT_DIR}/tests/validate_browser_dump.py" "${EVIDENCE_DIR}/public/browser-dom.html" --output "${EVIDENCE_DIR}/public/browser-dom-qa.json"
          python "${PROJECT_DIR}/tests/check_screenshots.py" "${EVIDENCE_DIR}/public/desktop-1600x1000.png" "${EVIDENCE_DIR}/public/mobile-390x844.png" --output "${EVIDENCE_DIR}/public/screenshot-qa.json"
          target="${PAGES_DIR}/${DESTINATION_DIR}/evidence/public"
          mkdir -p "${target}"
          cp "${EVIDENCE_DIR}/public/"*.json "${EVIDENCE_DIR}/public/"*.png "${target}/"
          SOURCE_SHA="${GITHUB_SHA}" python - "${target}" <<'PY'
          import json, os, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          qa = json.loads((root / "browser-qa.json").read_text())
          assert qa["passed"] and qa["real_asset_required"] and qa["real_asset_ok"]
          receipt = {
              "schema": "guilin-v074-public-evidence-receipt/v1",
              "source_commit": os.environ["SOURCE_SHA"],
              "public_browser_qa_passed": True,
              "real_asset_ok": True,
              "aoi_status": "UNCONFIRMED",
          }
          (root / "receipt.json").write_text(json.dumps(receipt, indent=2) + "\n")
          PY
          git -C "${PAGES_DIR}" add "${DESTINATION_DIR}"
          git -C "${PAGES_DIR}" commit -m "Add public QA evidence for Guilin v0.7.4 ${GITHUB_SHA}"
          git -C "${PAGES_DIR}" push origin HEAD:gh-pages

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: guilin-v074-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/guilin-v074-evidence/
          if-no-files-found: error
          retention-days: 90
