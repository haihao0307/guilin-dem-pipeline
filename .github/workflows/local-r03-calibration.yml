name: Local R03 read-only calibration audition
on:
  push:
    branches: [test/local-r03-calibration-20261013]
    paths: ['.github/workflows/local-r03-calibration.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: |
          mkdir -p calibration
          cat > calibration/probe.cjs <<'JS'
          const fs=require('fs'),{chromium}=require('playwright');
          (async()=>{const r={build:'68a791658f2a8224ba4834ee8c01a4cb91be96cd',privateParameterAudition:true,productBytesChanged:false,errors:[],stage:'start',images:[]};let b,p;const write=()=>fs.writeFileSync('calibration/report.json',JSON.stringify(r,null,2));try{b=await chromium.launch({headless:true,args:['--no-sandbox','--use-angle=swiftshader','--enable-unsafe-swiftshader']});p=await b.newPage({viewport:{width:1080,height:850},deviceScaleFactor:1});p.on('pageerror',e=>{r.errors.push(String(e));write();});const url='https://htmlpreview.github.io/?https://raw.githubusercontent.com/haihao0307/guilin-dem-pipeline/'+r.build+'/kaopu-unified-human-workbench/head-look-r03-local/preview.html';await p.goto(url,{waitUntil:'domcontentloaded',timeout:120000});await p.waitForFunction(()=>window.localFeatures,null,{timeout:240000});await p.evaluate(()=>lifelikeIdle.pause(true));await p.waitForFunction(()=>lifelikeIdle.ready(),null,{timeout:240000});await p.evaluate(async()=>{await Promise.all([__IDENTITY_QA__.viewer().skin.faceReady,__IDENTITY_QA__.viewer().skin.naturalEyesReady]);lifelikeIdle.seek(0);localFeatures.mode('both');localFeatures.view('lip');});
          const shot=async(name)=>{r.stage=name;write();await p.evaluate(()=>__IDENTITY_QA__.viewer().render());const c=await p.context().newCDPSession(p),s=await c.send('Page.captureScreenshot',{format:'png',fromSurface:true,captureBeyondViewport:false});fs.writeFileSync('calibration/'+name+'.png',Buffer.from(s.data,'base64'));await c.detach();r.images.push(name);write();};await shot('01-current-lip');
          await p.evaluate(()=>{const v=__IDENTITY_QA__.viewer();v.scene.traverse(l=>{if(['Neutral main','Neutral fill','Neutral rim'].includes(l.name)){Object.assign(l.shadow.camera,{left:-.24,right:.24,top:.24,bottom:-.24});l.shadow.camera.updateProjectionMatrix();}});localFeatures.shader().uniforms.uLFDepthScale.value=3.75/.48;v.renderer.shadowMap.needsUpdate=true;localFeatures.set({softness:16});});await shot('02-head-scale-soft-lip');
          await p.evaluate(()=>localFeatures.set({environment:.42,fill:.72,key:2.7,exposure:1.05}));await shot('03-calibrated-lip');await p.evaluate(()=>localFeatures.view('face'));await shot('04-calibrated-face');await p.evaluate(()=>{localFeatures.view('eye');const v=__IDENTITY_QA__.viewer();v.camera.zoom=2.1;v.camera.updateProjectionMatrix();});await shot('05-eye-macro');await p.evaluate(()=>localFeatures.view('ear'));await shot('06-ear');r.complete=true;}catch(e){r.failure=String(e);process.exitCode=1;}finally{write();await b?.close();}})();
          JS
          timeout 14m node calibration/probe.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-r03-calibration-audition
          path: calibration/
          retention-days: 7
