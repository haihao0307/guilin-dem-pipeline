name: Material R08 public browser check
on:
  push:
    branches: [main]
    paths:
      - 'kaopu-material-workbench/lab-r08/index.html'
      - '.github/workflows/material-r08-public-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser test tools
        run: |
          npm init -y
          npm install --save-dev playwright
          npx playwright install --with-deps chromium
      - name: Verify public HTML and real 3D interactions
        env:
          EXPECTED_BLOB: df66cd0ec4918cfd07f74c530a2747334412738e
        run: |
          mkdir -p evidence
          cat > smoke.cjs <<'JS'
          const {chromium}=require('playwright');
          const fs=require('fs');const crypto=require('crypto');
          const url='https://haihao0307.github.io/guilin-dem-pipeline/kaopu-material-workbench/?v=r08-click';
          const report={url,expectedBlob:process.env.EXPECTED_BLOB,environment:'GitHub Actions public HTTPS Chromium + SwiftShader',errors:[],checks:{}};
          const assert=(x,m)=>{if(!x)throw Error(m);};
          const wait=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{
            let source,hash,status;
            for(let i=0;i<36;i++){
              try{const r=await fetch(url+'&probe='+Date.now(),{signal:AbortSignal.timeout(20000)});status=r.status;source=await r.text();const buf=Buffer.from(source);hash=crypto.createHash('sha1').update(Buffer.from('blob '+buf.length+'\0')).update(buf).digest('hex');if(status===200&&hash===process.env.EXPECTED_BLOB)break;}catch(e){console.log(e.message);}
              await wait(10000);
            }
            assert(status===200&&hash===process.env.EXPECTED_BLOB,'public source/version mismatch');report.httpStatus=status;report.actualBlob=hash;
            const browser=await chromium.launch({headless:true,args:['--no-sandbox','--enable-unsafe-swiftshader','--use-angle=swiftshader']});
            try{
              const page=await browser.newPage({viewport:{width:1440,height:1000}});page.setDefaultTimeout(90000);
              page.on('pageerror',e=>report.errors.push(e.message));
              await page.goto(url,{waitUntil:'load',timeout:90000});
              await page.waitForFunction(()=>window.KAOPU_R08?.ready&&KAOPU_R08.frames()>0);
              report.checks.canvas=await page.evaluate(()=>{const c=document.getElementById('gl');return [c.width,c.height];});
              const initial=await page.evaluate(()=>KAOPU_R08.pixelHash());const original=await page.evaluate(()=>KAOPU_R08.getState());
              await page.screenshot({path:'evidence/desktop.png'});
              await page.locator('#zoomIn').click();await page.waitForFunction(()=>KAOPU_R08.getState().zoom>.6);await wait(150);
              const zoomed=await page.evaluate(()=>KAOPU_R08.pixelHash());assert(initial!==zoomed,'zoom did not change real rendered pixels');report.checks.zoom=true;
              await page.locator('#fit').click();await wait(150);report.checks.reset=(await page.evaluate(()=>KAOPU_R08.pixelHash()))===initial;assert(report.checks.reset,'reset mismatch');
              await page.locator('#baseA').evaluate(e=>{e.value='#124a85';e.dispatchEvent(new Event('input',{bubbles:true}));});await wait(150);
              assert((await page.evaluate(()=>KAOPU_R08.pixelHash()))!==initial,'color control did not change pixels');report.checks.color=true;
              await page.evaluate(s=>KAOPU_R08.importState(s),original);await wait(150);
              report.checks.noIframe=(await page.locator('iframe').count())===0;
              report.checks.glError=await page.evaluate(()=>KAOPU_R08.glError());assert(report.checks.glError===0,'WebGL error');
              await page.setViewportSize({width:390,height:844});await wait(150);await page.screenshot({path:'evidence/mobile.png'});
              report.checks.mobileNoOverflow=await page.evaluate(()=>document.documentElement.scrollWidth<=innerWidth);assert(report.checks.mobileNoOverflow,'mobile overflow');
              report.checks.mobileCanvasVisible=(await page.locator('#gl').boundingBox()).y<400;assert(report.checks.mobileCanvasVisible,'canvas below first screen');
              assert(report.errors.length===0,'JavaScript errors');report.browserPassed=true;report.shareAllowed=true;
            }finally{await browser.close();}
          })().catch(e=>{report.failure=e.message;report.shareAllowed=false;process.exitCode=1;}).finally(()=>{report.checkedAt=new Date().toISOString();fs.writeFileSync('evidence/PUBLICATION_PROOF.json',JSON.stringify(report,null,2));console.log(JSON.stringify(report,null,2));});
          JS
          xvfb-run -a node smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: material-r08-public-browser-proof
          path: evidence/
          retention-days: 14
