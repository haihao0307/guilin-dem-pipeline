name: Human R04 independent public loader and eyes
on:
  push:
    branches: [test/human-r04-public-loader-20261013]
    paths: ['.github/workflows/human-r04-loader-proof.yml']
permissions: {contents: read}
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: kaopu-unified-human-workbench/human-integrated-r04
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - name: Repeat identical prior passing tests on the new fixed HTML hash
        run: |
          mkdir -p proof
          git fetch --depth=1 origin 09c95e983a60949b66fab3fca83ec1ba7ce42d28
          python - <<'PY'
          import pathlib,subprocess
          old=subprocess.check_output(['git','show','09c95e983a60949b66fab3fca83ec1ba7ce42d28:.github/workflows/human-r04-loader-proof.yml'],text=True)
          code=old.split("cat > proof.cjs <<'JS'\n",1)[1].split('\n          JS',1)[0];code='\n'.join(x[10:] if x.startswith('          ') else x for x in code.splitlines())
          a='e5df3bcba13ba566d6da27d5cb051e91956055b3';b='26c2b26c8c888553d56d1be3eb9f5a890096350a';assert code.count(a)==1;code=code.replace(a,b)
          a='c8f1150714ac03d2aec7deb6df7dd1e31a4bb887b1ca4fa4a25b38e373377f8d';b='2f126bc1557a18a7c376444aaebf140a96dc4fbcf83f56239f687da9e683331e';assert code.count(a)==1;code=code.replace(a,b)
          pathlib.Path('proof.cjs').write_text(code);pathlib.Path('proof/test-source.cjs').write_text(code)
          PY
          node proof.cjs
          node kaopu-unified-human-workbench/human-integrated-r04/specialists/lip-startup-r03/unit.mjs | tee proof/transport-unit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: human-r04-independent-public-proof-final, path: proof/, retention-days: 14}
