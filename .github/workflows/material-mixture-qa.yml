name: Material mixture standalone browser QA
on:
  push:
    branches: ['qa/material-mixture-r01-20261022']
    paths:
      - 'kaopu-material-workbench/roughness-mixture-r01/**'
      - '.github/workflows/material-mixture-qa.yml'
permissions:
  contents: read
concurrency:
  group: material-mixture-${{ github.ref }}
  cancel-in-progress: false
jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            kaopu-material-workbench/roughness-mixture-r01
      - name: Install pinned official browser runner
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Numeric and dependency checks
        run: node kaopu-material-workbench/roughness-mixture-r01/numeric_qa.cjs
      - name: Offline desktop mobile and explicit failure checks
        run: python kaopu-material-workbench/roughness-mixture-r01/browser_qa.py
      - name: Public browser checks when requested
        run: |
          if [ -f kaopu-material-workbench/roughness-mixture-r01/PUBLIC_SMOKE ]; then
            python kaopu-material-workbench/roughness-mixture-r01/browser_qa.py https://haihao0307.github.io/guilin-dem-pipeline/kaopu-material-workbench/roughness-mixture-r01/
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: material-mixture-${{ github.sha }}
          path: kaopu-material-workbench/roughness-mixture-r01/qa
          if-no-files-found: warn
          retention-days: 3
