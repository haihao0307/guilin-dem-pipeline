name: Palau V0170 gameplay clock hotfix
on:
  push:
    branches: [work/survivor-palau-v0170-pilot-survival-20260921]
    paths:
      - .github/workflows/palau-v0170-gameplay-clock-hotfix.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
          persist-credentials: true
      - name: Apply exact independent gameplay clock patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def once(path, old, new):
              p=Path(path);s=p.read_text()
              assert s.count(old)==1,(path,s.count(old),old)
              p.write_text(s.replace(old,new,1))

          survival='games/survivor-palau/source/v0170/survival.mjs'
          once(survival,
            'let survivalGeo=null,surfaceFishGeo=null,surfaceGearGeo=null;',
            'let survivalGeo=null,surfaceFishGeo=null,surfaceGearGeo=null,pilotGameplayClockMs=performance.now();')
          once(survival,
            'behaviorClockIndependent:true,behaviorWallDtCapS:1.25',
            'behaviorClockIndependent:true,behaviorWallDtCapS:.5')
          once(survival,
            'function pilotAngleDelta(a,b){return Math.atan2(Math.sin(a-b),Math.cos(a-b))}\nfunction pilotNotice',
            'function pilotAngleDelta(a,b){return Math.atan2(Math.sin(a-b),Math.cos(a-b))}\nfunction pilotGameplayElapsed(elapsed){const now=performance.now(),wall=Math.max(0,(now-pilotGameplayClockMs)/1000);pilotGameplayClockMs=now;return Math.max(elapsed,Math.min(.5,wall))}\nfunction pilotNotice')
          once(survival,
            "function updatePilotSurvival(dt){\n if(!SURVIVAL.ready)return false;const o=SURVIVAL.observation;if(!o.active){o.uiClock+=dt;if(o.uiClock>.5){o.uiClock=0;pilotUpdateHUD()}return false}\n const now=performance.now(),wallDt=o.behaviorClockMs?Math.max(0,(now-o.behaviorClockMs)/1000):dt;o.behaviorClockMs=now;o.behaviorDtS=Math.max(dt,Math.min(1.25,wallDt));\n pilotUpdateObservation(dt,o.behaviorDtS);",
            "function updatePilotSurvival(dt,behaviorDt=dt){\n if(!SURVIVAL.ready)return false;const o=SURVIVAL.observation;if(!o.active){o.uiClock+=dt;if(o.uiClock>.5){o.uiClock=0;pilotUpdateHUD()}return false}\n o.behaviorDtS=behaviorDt;\n pilotUpdateObservation(dt,o.behaviorDtS);")

          build='games/survivor-palau/source/v0170/build.py'
          once(build,
            "    ' updateFishing(elapsed);\\n if(updatePilotSurvival(elapsed))changed=true;\\n updateCamera(canvas.width/canvas.height);',",
            "    ' const pilotElapsed=pilotGameplayElapsed(elapsed);\\n updateFishing(pilotElapsed);\\n if(updatePilotSurvival(elapsed,pilotElapsed))changed=true;\\n updateCamera(canvas.width/canvas.height);',")
          PY
          node --check games/survivor-palau/source/v0170/survival.mjs
          python3 -m py_compile games/survivor-palau/source/v0170/build.py
          git diff --check
      - name: Commit exact gameplay fix
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add games/survivor-palau/source/v0170/survival.mjs games/survivor-palau/source/v0170/build.py
          git commit -m 'fix(palau): decouple handline gameplay from render throughput'
          git push origin HEAD:${{ github.ref_name }}
