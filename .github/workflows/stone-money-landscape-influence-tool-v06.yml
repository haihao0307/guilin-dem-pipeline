name: Stone Money Landscape Influence Tool V06

on:
  push:
    branches:
      - feature/stone-money-landscape-influence-tool-v05-20261002
    paths:
      - tools/stone-money/build_landscape_terrain_influence_v06.py
      - .github/workflows/stone-money-landscape-influence-tool-v06.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-verify-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build V06 with same-origin worker
        run: |
          python -m py_compile tools/stone-money/build_landscape_terrain_influence_v06.py
          python tools/stone-money/build_landscape_terrain_influence_v06.py

      - name: Static contract verification
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,re
          root=Path('workbenches/landscape-terrain-influence-tool-v06')
          html=(root/'index.html').read_text(encoding='utf-8')
          worker=(root/'landscape-terrain-worker-v06.js').read_text(encoding='utf-8')
          meta=json.loads((root/'build.json').read_text(encoding='utf-8'))
          for token in ['地形影响工具体系 V0.6','P10 复合群峰','landscapeTerrainWorkerBridge','landscapeTerrainGenerationMonitor','LANDSCAPE_TERRAIN_INFLUENCE_INSTRUMENT_V1']:
              assert token in html, token
          for token in ['const World','function generateScene','self.onmessage','transfer']:
              assert token in worker, token
          assert '<iframe' not in html.lower()
          assert meta['iframeCount']==0
          assert meta['blobWorkerRedirected'] is True
          assert meta['presetCount']==10
          assert meta['bundleMode']=='same-origin-html-plus-worker'
          for sid,path in [('landscapeTerrainInfluenceTool','/tmp/lti-v06-tool.js'),('landscapeTerrainWorkerBridge','/tmp/lti-v06-bridge.js'),('landscapeTerrainGenerationMonitor','/tmp/lti-v06-monitor.js')]:
              m=re.search(rf'<script id="{sid}">(.*?)</script>',html,re.S);assert m,sid
              Path(path).write_text(m.group(1),encoding='utf-8')
          print({'htmlBytes':len(html),'workerBytes':len(worker),'iframeCount':0,'presetCount':10})
          PY
          node --check /tmp/lti-v06-tool.js
          node --check /tmp/lti-v06-bridge.js
          node --check /tmp/lti-v06-monitor.js
          node --check workbenches/landscape-terrain-influence-tool-v06/landscape-terrain-worker-v06.js

      - name: Local browser proof of actual terrain generation
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER || true' EXIT
          for i in $(seq 1 80); do
            if curl -fsS http://127.0.0.1:8000/ >/dev/null; then break; fi
            sleep .25
          done
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)
          if [ -z "$CHROME" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq chromium || sudo apt-get install -y -qq chromium-browser
            CHROME=$(command -v chromium || command -v chromium-browser)
          fi
          URL=http://127.0.0.1:8000/workbenches/landscape-terrain-influence-tool-v06/index.html
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage \
            --use-angle=swiftshader --enable-unsafe-swiftshader --ignore-gpu-blocklist \
            --run-all-compositor-stages-before-draw --virtual-time-budget=120000 \
            --window-size=1600,1000 --dump-dom "$URL" >/tmp/lti-v06-local-dom.html 2>/tmp/lti-v06-local-chrome.log
          grep -q 'data-landscape-generation-ready="true"' /tmp/lti-v06-local-dom.html
          grep -q 'data-landscape-worker-mode="external-same-origin"' /tmp/lti-v06-local-dom.html
          ! grep -q 'data-landscape-generation-failure' /tmp/lti-v06-local-dom.html
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage \
            --use-angle=swiftshader --enable-unsafe-swiftshader --ignore-gpu-blocklist \
            --run-all-compositor-stages-before-draw --virtual-time-budget=120000 \
            --window-size=1600,1000 --screenshot=/tmp/lti-v06-local.png "$URL" >/tmp/lti-v06-local-shot.log 2>&1
          test -s /tmp/lti-v06-local.png
          test $(stat -c%s /tmp/lti-v06-local.png) -gt 100000

      - name: Commit generated V06 bundle
        run: |
          git config user.name "Landscape Mother"
          git config user.email "actions@users.noreply.github.com"
          git add workbenches/landscape-terrain-influence-tool-v06/index.html \
                  workbenches/landscape-terrain-influence-tool-v06/landscape-terrain-worker-v06.js \
                  workbenches/landscape-terrain-influence-tool-v06/build.json
          if ! git diff --cached --quiet; then
            git commit -m "fix(landscape): materialize V06 same-origin worker bundle [skip ci]"
            git push
          fi

      - name: Deploy stable public path to gh-pages
        run: |
          git fetch origin gh-pages
          rm -rf /tmp/landscape-gh-pages
          git worktree add /tmp/landscape-gh-pages origin/gh-pages
          TARGET=/tmp/landscape-gh-pages/landscape-terrain-influence-tool-v06
          rm -rf "$TARGET"
          mkdir -p "$TARGET"
          cp workbenches/landscape-terrain-influence-tool-v06/index.html "$TARGET/index.html"
          cp workbenches/landscape-terrain-influence-tool-v06/landscape-terrain-worker-v06.js "$TARGET/landscape-terrain-worker-v06.js"
          cp workbenches/landscape-terrain-influence-tool-v06/build.json "$TARGET/build.json"
          cd /tmp/landscape-gh-pages
          git config user.name "Landscape Mother"
          git config user.email "actions@users.noreply.github.com"
          git add landscape-terrain-influence-tool-v06
          if ! git diff --cached --quiet; then
            git commit -m "publish: landscape terrain influence tool v06"
            git push origin HEAD:gh-pages
          fi

      - name: Verify public GitHub Pages route and real generation
        run: |
          PUBLIC=https://haihao0307.github.io/guilin-dem-pipeline/landscape-terrain-influence-tool-v06/index.html
          WORKER=https://haihao0307.github.io/guilin-dem-pipeline/landscape-terrain-influence-tool-v06/landscape-terrain-worker-v06.js
          for i in $(seq 1 120); do
            if curl -fsS "$PUBLIC" >/tmp/lti-v06-public.html && grep -q '地形影响工具体系 V0.6' /tmp/lti-v06-public.html && curl -fsS "$WORKER" >/tmp/lti-v06-public-worker.js; then
              break
            fi
            sleep 2
          done
          grep -q '地形影响工具体系 V0.6' /tmp/lti-v06-public.html
          grep -q 'self.onmessage' /tmp/lti-v06-public-worker.js
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage \
            --use-angle=swiftshader --enable-unsafe-swiftshader --ignore-gpu-blocklist \
            --run-all-compositor-stages-before-draw --virtual-time-budget=120000 \
            --window-size=1600,1000 --dump-dom "$PUBLIC" >/tmp/lti-v06-public-dom.html 2>/tmp/lti-v06-public-chrome.log
          grep -q 'data-landscape-generation-ready="true"' /tmp/lti-v06-public-dom.html
          ! grep -q 'data-landscape-generation-failure' /tmp/lti-v06-public-dom.html
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage \
            --use-angle=swiftshader --enable-unsafe-swiftshader --ignore-gpu-blocklist \
            --run-all-compositor-stages-before-draw --virtual-time-budget=120000 \
            --window-size=1600,1000 --screenshot=/tmp/lti-v06-public.png "$PUBLIC" >/tmp/lti-v06-public-shot.log 2>&1
          test -s /tmp/lti-v06-public.png
          test $(stat -c%s /tmp/lti-v06-public.png) -gt 100000

      - uses: actions/upload-artifact@v4
        with:
          name: stone-money-landscape-influence-tool-v06-proof
          path: |
            /tmp/lti-v06-local-dom.html
            /tmp/lti-v06-local.png
            /tmp/lti-v06-local-chrome.log
            /tmp/lti-v06-local-shot.log
            /tmp/lti-v06-public-dom.html
            /tmp/lti-v06-public.png
            /tmp/lti-v06-public-chrome.log
            /tmp/lti-v06-public-shot.log
            workbenches/landscape-terrain-influence-tool-v06/build.json
          retention-days: 7
