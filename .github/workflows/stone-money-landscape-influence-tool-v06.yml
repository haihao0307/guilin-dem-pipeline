name: Stone Money Landscape Influence Tool V06

on:
  push:
    branches:
      - feature/stone-money-landscape-influence-tool-v05-20261002
    paths:
      - tools/stone-money/build_landscape_terrain_influence_v06.py
      - .github/workflows/stone-money-landscape-influence-tool-v06.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-verify-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build V06 with same-origin worker
        run: |
          python -m py_compile tools/stone-money/build_landscape_terrain_influence_v06.py
          python tools/stone-money/build_landscape_terrain_influence_v06.py

      - name: Static contract verification
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,re
          root=Path('workbenches/landscape-terrain-influence-tool-v06')
          html=(root/'index.html').read_text(encoding='utf-8')
          worker=(root/'landscape-terrain-worker-v06.js').read_text(encoding='utf-8')
          meta=json.loads((root/'build.json').read_text(encoding='utf-8'))
          for token in ['地形影响工具体系 V0.6','P10 复合群峰','landscapeTerrainWorkerBridge','landscapeTerrainGenerationMonitor','LANDSCAPE_TERRAIN_INFLUENCE_INSTRUMENT_V1']:
              assert token in html, token
          for token in ['const World','function generateScene','self.onmessage','transfer']:
              assert token in worker, token
          assert '<iframe' not in html.lower()
          assert meta['iframeCount']==0
          assert meta['blobWorkerRedirected'] is True
          assert meta['presetCount']==10
          assert meta['bundleMode']=='same-origin-html-plus-worker'
          for sid,path in [('landscapeTerrainInfluenceTool','/tmp/lti-v06-tool.js'),('landscapeTerrainWorkerBridge','/tmp/lti-v06-bridge.js'),('landscapeTerrainGenerationMonitor','/tmp/lti-v06-monitor.js')]:
              m=re.search(rf'<script id="{sid}">(.*?)</script>',html,re.S);assert m,sid
              Path(path).write_text(m.group(1),encoding='utf-8')
          print({'htmlBytes':len(html),'workerBytes':len(worker),'iframeCount':0,'presetCount':10})
          PY
          node --check /tmp/lti-v06-tool.js
          node --check /tmp/lti-v06-bridge.js
          node --check /tmp/lti-v06-monitor.js
          node --check workbenches/landscape-terrain-influence-tool-v06/landscape-terrain-worker-v06.js

      - name: Install browser verification harness
        run: |
          python -m pip install -q playwright pillow
          cat > /tmp/lti_v06_browser_check.py <<'PY'
          from __future__ import annotations
          import json, os, time
          from pathlib import Path
          from PIL import Image, ImageStat
          from playwright.sync_api import sync_playwright

          url=os.environ['LTI_URL']
          chrome=os.environ['LTI_CHROME']
          prefix=Path(os.environ['LTI_PREFIX'])
          timeout_s=int(os.environ.get('LTI_TIMEOUT_SECONDS','420'))
          prefix.parent.mkdir(parents=True,exist_ok=True)
          console=[]
          page_errors=[]
          with sync_playwright() as p:
              browser=p.chromium.launch(
                  headless=True,
                  executable_path=chrome,
                  args=[
                      '--no-sandbox','--disable-dev-shm-usage',
                      '--use-gl=angle','--use-angle=swiftshader',
                      '--enable-unsafe-swiftshader','--ignore-gpu-blocklist',
                      '--disable-background-timer-throttling',
                      '--disable-renderer-backgrounding'
                  ],
              )
              page=browser.new_page(viewport={'width':1600,'height':1000},device_scale_factor=1)
              page.set_default_timeout(180000)
              page.on('console',lambda msg: console.append(f'{msg.type}: {msg.text}'))
              page.on('pageerror',lambda error: page_errors.append(str(error)))
              response=page.goto(url,wait_until='domcontentloaded',timeout=60000)
              if response is not None and response.status>=400:
                  raise RuntimeError(f'HTTP {response.status}: {url}')
              start=time.monotonic()
              last=''
              state={}
              while time.monotonic()-start<timeout_s:
                  state=page.evaluate("""() => ({
                    ready: window.__LM_READY__ === true,
                    error: window.__LM_ERROR__ || null,
                    step: document.getElementById('step')?.textContent || '',
                    status: document.getElementById('status')?.textContent || '',
                    toolStatus: document.getElementById('ltiStatus')?.textContent || '',
                    progress: document.getElementById('progress')?.style.width || '',
                    workerMode: document.documentElement.dataset.landscapeWorkerMode || '',
                    workerRedirects: window.__LTI_WORKER_REDIRECTS__ || 0,
                    failure: document.documentElement.dataset.landscapeGenerationFailure || ''
                  })""")
                  marker=f"{state.get('step')}|{state.get('progress')}|{state.get('toolStatus')}"
                  if marker!=last:
                      print(json.dumps({'elapsed_s':round(time.monotonic()-start,1),**state},ensure_ascii=False),flush=True)
                      last=marker
                  if state.get('error') or state.get('failure'):
                      raise RuntimeError(f"terrain generation failed: {state}")
                  if state.get('ready'):
                      break
                  time.sleep(1)
              else:
                  raise TimeoutError(f'terrain generation did not finish in {timeout_s}s; last state={state}')
              page.wait_for_timeout(1200)
              report=page.evaluate("""() => ({
                ready: window.__LM_READY__ === true,
                error: window.__LM_ERROR__ || null,
                workerMode: document.documentElement.dataset.landscapeWorkerMode || '',
                workerRedirects: window.__LTI_WORKER_REDIRECTS__ || 0,
                generationReady: document.documentElement.dataset.landscapeGenerationReady || '',
                builtInMs: window.__LM__?.report?.builtInMs || null,
                geometryGridM: window.__LM__?.report?.geometryGridM || null,
                partCount: window.__LM__?.report?.parts?.length || 0,
                triangles: window.__LM__?.report?.parts?.reduce((s,p)=>s+(p.triangles||0),0) || 0,
                signatures: window.__LM__?.signatures || [],
                runtimeErrors: window.__LM__?.errors || []
              })""")
              prefix.with_suffix('.html').write_text(page.content(),encoding='utf-8')
              prefix.with_suffix('.json').write_text(json.dumps({'state':state,'report':report,'console':console,'pageErrors':page_errors},ensure_ascii=False,indent=2),encoding='utf-8')
              screenshot=prefix.with_suffix('.png')
              page.screenshot(path=str(screenshot),full_page=False,timeout=180000,animations='disabled')
              browser.close()
          if not report['ready'] or report['error']:
              raise RuntimeError(f'not ready after wait: {report}')
          if report['workerMode']!='external-same-origin' or report['workerRedirects']<1:
              raise RuntimeError(f'worker bridge not used: {report}')
          if report['partCount']<2 or report['triangles']<1000:
              raise RuntimeError(f'generated scene is empty: {report}')
          if page_errors:
              raise RuntimeError(f'page errors: {page_errors}')
          image=Image.open(screenshot).convert('RGB')
          stat=ImageStat.Stat(image)
          spread=sum(hi-lo for lo,hi in stat.extrema)
          if spread<80:
              raise RuntimeError(f'screenshot has insufficient visual spread: {stat.extrema}')
          print(json.dumps({'url':url,'report':report,'screenshotBytes':screenshot.stat().st_size,'spread':spread},ensure_ascii=False),flush=True)
          PY

      - name: Verify actual local terrain generation
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/lti-v06-http.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER || true' EXIT
          READY=0
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:8765/ >/dev/null; then READY=1; break; fi
            sleep .25
          done
          if [ "$READY" != 1 ]; then cat /tmp/lti-v06-http.log; exit 1; fi
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)
          if [ -z "$CHROME" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq chromium || sudo apt-get install -y -qq chromium-browser
            CHROME=$(command -v chromium || command -v chromium-browser)
          fi
          LTI_URL=http://127.0.0.1:8765/workbenches/landscape-terrain-influence-tool-v06/index.html \
          LTI_CHROME="$CHROME" LTI_PREFIX=/tmp/lti-v06-local LTI_TIMEOUT_SECONDS=420 \
          python /tmp/lti_v06_browser_check.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stone-money-landscape-influence-tool-v06-local-proof
          path: |
            /tmp/lti-v06-local.html
            /tmp/lti-v06-local.json
            /tmp/lti-v06-local.png
            /tmp/lti-v06-http.log
            workbenches/landscape-terrain-influence-tool-v06/build.json
          retention-days: 7

      - name: Commit generated V06 bundle
        run: |
          git config user.name "Landscape Mother"
          git config user.email "actions@users.noreply.github.com"
          git add workbenches/landscape-terrain-influence-tool-v06/index.html \
                  workbenches/landscape-terrain-influence-tool-v06/landscape-terrain-worker-v06.js \
                  workbenches/landscape-terrain-influence-tool-v06/build.json
          if ! git diff --cached --quiet; then
            git commit -m "fix(landscape): materialize V06 same-origin worker bundle [skip ci]"
            git push
          fi

      - name: Deploy stable public path to gh-pages
        run: |
          git fetch origin gh-pages
          rm -rf /tmp/landscape-gh-pages
          git worktree add /tmp/landscape-gh-pages origin/gh-pages
          TARGET=/tmp/landscape-gh-pages/landscape-terrain-influence-tool-v06
          rm -rf "$TARGET"
          mkdir -p "$TARGET"
          cp workbenches/landscape-terrain-influence-tool-v06/index.html "$TARGET/index.html"
          cp workbenches/landscape-terrain-influence-tool-v06/landscape-terrain-worker-v06.js "$TARGET/landscape-terrain-worker-v06.js"
          cp workbenches/landscape-terrain-influence-tool-v06/build.json "$TARGET/build.json"
          cd /tmp/landscape-gh-pages
          git config user.name "Landscape Mother"
          git config user.email "actions@users.noreply.github.com"
          git add landscape-terrain-influence-tool-v06
          if ! git diff --cached --quiet; then
            git commit -m "publish: landscape terrain influence tool v06"
            git push origin HEAD:gh-pages
          fi

      - name: Verify public GitHub Pages route and actual generation
        run: |
          PUBLIC=https://haihao0307.github.io/guilin-dem-pipeline/landscape-terrain-influence-tool-v06/index.html
          WORKER=https://haihao0307.github.io/guilin-dem-pipeline/landscape-terrain-influence-tool-v06/landscape-terrain-worker-v06.js
          for i in $(seq 1 120); do
            if curl -fsS "$PUBLIC" >/tmp/lti-v06-public-source.html && grep -q '地形影响工具体系 V0.6' /tmp/lti-v06-public-source.html && curl -fsS "$WORKER" >/tmp/lti-v06-public-worker.js; then break; fi
            sleep 2
          done
          grep -q '地形影响工具体系 V0.6' /tmp/lti-v06-public-source.html
          grep -q 'self.onmessage' /tmp/lti-v06-public-worker.js
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)
          LTI_URL="$PUBLIC" LTI_CHROME="$CHROME" LTI_PREFIX=/tmp/lti-v06-public LTI_TIMEOUT_SECONDS=420 \
          python /tmp/lti_v06_browser_check.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stone-money-landscape-influence-tool-v06-public-proof
          path: |
            /tmp/lti-v06-public.html
            /tmp/lti-v06-public.json
            /tmp/lti-v06-public.png
            /tmp/lti-v06-public-source.html
            /tmp/lti-v06-public-worker.js
            workbenches/landscape-terrain-influence-tool-v06/build.json
          retention-days: 7
