name: Material R15 same-stone public check
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/material-r15-same-stone.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm init -y
          npm install --save-dev playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify public R15 same-SDF interaction
        run: |
          cat > check.cjs <<'JS'
          const {chromium}=require('playwright');const fs=require('fs');
          const url='https://haihao0307.github.io/guilin-dem-pipeline/kaopu-material-workbench/?case=iq&v=r15';
          const wait=ms=>new Promise(r=>setTimeout(r,ms));const assert=(x,m)=>{if(!x)throw Error(m)};
          async function waitPublic(){for(let i=0;i<36;i++){const r=await fetch(url+'&probe='+Date.now());const t=await r.text();if(r.status===200&&t.includes('MATERIAL STUDIO / R15')&&t.includes('lab-r15/app.js')&&!t.includes('iq-raster.js'))return;await wait(10000)}throw Error('R15 not propagated')}
          (async()=>{await waitPublic();const browser=await chromium.launch({headless:true,args:['--no-sandbox','--enable-unsafe-swiftshader','--use-angle=swiftshader']});const errors=[];try{
            const page=await browser.newPage({viewport:{width:390,height:844}});page.on('pageerror',e=>errors.push(e.message));await page.goto(url,{waitUntil:'load',timeout:90000});await page.waitForFunction(()=>window.KAOPU10?.ready&&KAOPU10.frames()>0,{timeout:90000});
            const before=await page.evaluate(()=>KAOPU10.performance());
            assert(before.path==='same-sdf','runtime is not same-sdf');
            assert((await page.locator('#iqMeshCanvas').count())===0,'substitute mesh canvas still exists');
            await page.locator('#rotate').click();await wait(1200);
            const during=await page.evaluate(()=>KAOPU10.performance());
            await page.screenshot({path:'r15-mobile-same-stone.png'});
            await page.locator('#rotate').click();await wait(300);
            const after=await page.evaluate(()=>KAOPU10.performance());
            const report={version:'R15',url,environment:'Public HTTPS Chromium 390px viewport + SwiftShader (not physical iPhone)',before,during,after,errors,checkedAt:new Date().toISOString()};
            report.sameSdf=before.path==='same-sdf'&&during.path==='same-sdf'&&after.path==='same-sdf';
            report.noSubstituteCanvas=(await page.locator('#iqMeshCanvas').count())===0;
            report.mobileMotionWidth=during.width;
            report.mobileStaticWidth=after.width;
            report.noErrors=errors.length===0;
            report.shareAllowed=report.sameSdf&&report.noSubstituteCanvas&&report.mobileMotionWidth<=560&&report.mobileStaticWidth<=896&&report.noErrors;
            fs.writeFileSync('R15_SAME_STONE_PROOF.json',JSON.stringify(report,null,2));console.log(JSON.stringify(report,null,2));assert(report.shareAllowed,'R15 checks failed');
          }finally{await browser.close()}})().catch(e=>{console.error(e);process.exit(1)});
          JS
          node check.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: material-r15-same-stone-proof
          path: |
            R15_SAME_STONE_PROOF.json
            r15-mobile-same-stone.png
          retention-days: 14
