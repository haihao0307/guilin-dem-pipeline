name: Train88 bounded independent query optimizations
on:
  push:
    branches: ['qa/train88-kowloon-function-r01-20261012']
concurrency:
  group: train88-shared-function-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  query-experiments:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: kaopu-minigame-workbench/voxel-train-study
      - name: Emit and test separate original-field candidates
        working-directory: kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01/kowloon-train88-r01
        run: |
          node emit-geometry-groups.mjs >/dev/null
          node experiments/spatial-query-r01/emit.mjs
          node --test experiments/spatial-query-r01/*.test.mjs experiments/candidate-storage-r01/*.test.mjs qa/bounded-browser.test.mjs qa/shader-closure.test.mjs
      - name: Compile pinned Naga and three independent query variants
        working-directory: kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01/kowloon-train88-r01/compiler
        run: |
          python - <<'PYLOCK'
          import tomllib
          p=next(p for p in tomllib.load(open('Cargo.lock','rb'))['package'] if p['name']=='naga')
          assert p['version']=='27.0.3' and p['checksum']=='066cf25f0e8b11ee0df221219010f213ad429855f57c494f995590c861a9a7d8'
          PYLOCK
          cargo build --release --locked
          for variant in reference hierarchy capacity; do
            target/release/kaopu-station-shader-bridge ../experiments/spatial-query-r01/generated/$variant.wgsl ../experiments/spatial-query-r01/generated/$variant.frag hierarchyProbe
          done
      - name: Install pinned official browser QA runner
        run: |
          npm install --prefix "$RUNNER_TEMP/station-bridge" --no-save --ignore-scripts --no-audit --no-fund playwright@1.57.0
          "$RUNNER_TEMP/station-bridge/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/station-bridge/node_modules" >> "$GITHUB_ENV"
      - name: Same-backend full HitField equality and cold versus warm cost
        run: node kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01/kowloon-train88-r01/experiments/spatial-query-r01/run.cjs
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: train88-query-experiments-${{ github.sha }}
          path: |
            train88-spatial-query-results/
            kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01/kowloon-train88-r01/experiments/spatial-query-r01/generated/
          retention-days: 7
