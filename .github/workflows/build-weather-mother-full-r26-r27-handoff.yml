name: Build Weather Mother R26 stable R27 candidate full handoff

on:
  push:
    branches:
      - handoff/weather-mother-full-r26-stable-r27-candidate-20260912
    paths:
      - .github/workflows/build-weather-mother-full-r26-r27-handoff.yml

permissions:
  contents: write

jobs:
  build-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Rebuild 2: verify the immutable R26 wrapper by its real R22-preserving identity.
      - name: Build and verify clean full package
        shell: bash
        run: bash weather-mother/handoffs/WEATHER_MOTHER_FULL_HANDOFF_R26_STABLE_R27_CANDIDATE_2026-09-12/build_package.sh

      - name: Commit package and receipts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Weather Mother CI"
          git config user.email "weather-mother-ci@users.noreply.github.com"
          git add \
            weather-mother/handoffs/WEATHER_MOTHER_FULL_HANDOFF_R26_STABLE_R27_CANDIDATE_2026-09-12.zip \
            weather-mother/handoffs/WEATHER_MOTHER_FULL_HANDOFF_R26_STABLE_R27_CANDIDATE_2026-09-12/PACKAGE_BUILD.json \
            weather-mother/handoffs/WEATHER_MOTHER_FULL_HANDOFF_R26_STABLE_R27_CANDIDATE_2026-09-12/PACKAGE_SHA256.txt
          git commit -m "package(weather-mother): full R26 stable R27 candidate handoff [skip ci]"
          git push origin HEAD:handoff/weather-mother-full-r26-stable-r27-candidate-20260912
