name: KAOPU Gaussian R57 WebGPU Swapchain

on:
  push:
    branches:
      - coordination/kaopu-learning-flywheel-r1-20260909
    paths:
      - docs/mother_coordination/kaopu_learning_flywheel_v1/PROBES/gaussian_three_webgpu_swapchain_r57.html
      - docs/mother_coordination/kaopu_learning_flywheel_v1/PROBES/run_gaussian_three_webgpu_swapchain_r57.js
      - docs/mother_coordination/kaopu_learning_flywheel_v1/ADAPTERS/gaussian_three_webgpu_swapchain_gate_r57.mjs
      - .github/workflows/kaopu-gaussian-r57-webgpu-swapchain.yml

permissions:
  contents: read

jobs:
  r57-webgpu-swapchain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned renderer and browser harness
        run: |
          npm init -y
          npm pkg set type=module
          npm install --no-save three@0.186.0 playwright@1.57.0 pngjs@7.0.0
          npx playwright install --with-deps chromium
      - name: Start local fixture server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/r57-http.log 2>&1 &
          sleep 2
          curl --fail --silent http://127.0.0.1:8765/docs/mother_coordination/kaopu_learning_flywheel_v1/PROBES/gaussian_three_webgpu_swapchain_r57.html > /dev/null
      - name: Run immediate WebGPU swapchain comparison
        run: node docs/mother_coordination/kaopu_learning_flywheel_v1/PROBES/run_gaussian_three_webgpu_swapchain_r57.js
      - name: Validate R57 swapchain contract
        run: |
          cat r57-comparison.json | node docs/mother_coordination/kaopu_learning_flywheel_v1/ADAPTERS/gaussian_three_webgpu_swapchain_gate_r57.mjs > r57-gate.json
          cat r57-gate.json
          node -e "const d=require('./r57-gate.json');if(d.status!=='Candidate-pass')process.exit(10)"
      - name: Upload R57 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaopu-gaussian-r57-webgpu-swapchain
          path: |
            r57-*.json
          if-no-files-found: warn
          retention-days: 30
