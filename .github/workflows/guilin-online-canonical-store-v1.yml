name: Guilin online canonical elevation production V1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - viewer/**
      - pipeline/build_online_assets.py
      - pipeline/build_online_assets_from_canonical_store.py
      - pipeline/canonical_elevation_store.py
      - pipeline/hydrology_network_v6.py
      - pipeline/distill_online_runtime.py
      - truth/CANONICAL_ELEVATION_STORE_POINTER.json
      - truth/CANONICAL_ELEVATION_VALIDATION_V1.json
      - truth/NATIVE_ELEVATION_MANIFEST.json
      - truth/OSM_HYDROLOGY_IMMUTABLE.geojson
      - contracts/GUILIN_DISTILLED_RUNTIME_CONTRACT_V1.json
      - tests/browser_full_map_cdp.py
      - tests/browser_canonical_store_cdp.py
      - tests/range_static_server.py
      - .github/workflows/guilin-online-canonical-store-v1.yml

permissions:
  contents: write

concurrency:
  group: guilin-online-canonical-elevation-production-v1
  cancel-in-progress: true

env:
  CANONICAL_RELEASE_TAG: guilin-canonical-elevation-store-12p5m-v1
  CANONICAL_STREAM_SHA256: 91154cbe7c29220c9da41efc98105f1d36b614a343636543f7dd230735da079a
  SOURCE_COLD_BACKUP_SHA256: 9490b1bd34f67336352cf448729f763ae4e241637d821961efd0290e29d6c9d4
  CANONICAL_BYTES: '423838710'
  STORE_CACHE: .cache/canonical-elevation-store
  GENERATED_DIR: out/generated
  DISTILLED_DIR: out/distilled
  SITE_DIR: out/site
  LOCAL_ROOT: out/local-root
  EVIDENCE_DIR: out/evidence
  PUBLIC_URL: https://haihao0307.github.io/guilin-dem-pipeline/guilin/
  PUBLIC_STORE_URL: https://haihao0307.github.io/guilin-dem-pipeline/guilin-elevation-store-v1/

jobs:
  build-publish-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout the authoritative main line
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deterministic dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            numpy==2.1.3 rasterio==1.4.3 pyproj==3.7.1 shapely==2.1.1 \
            requests==2.32.4 websocket-client==1.8.0
          if ! command -v google-chrome >/dev/null 2>&1 && \
             ! command -v google-chrome-stable >/dev/null 2>&1 && \
             ! command -v chromium >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y chromium
          fi

      - name: Enforce canonical-store-only production contracts
        run: |
          set -euo pipefail
          python -m py_compile \
            pipeline/canonical_elevation_store.py \
            pipeline/build_online_assets_from_canonical_store.py \
            pipeline/build_online_assets.py \
            pipeline/hydrology_network_v6.py \
            pipeline/distill_online_runtime.py \
            tests/browser_full_map_cdp.py \
            tests/browser_canonical_store_cdp.py \
            tests/range_static_server.py
          node --check viewer/canonical-store-runtime.js
          node --check viewer/app.js
          grep -q 'AUTHORITATIVE_PRODUCTION_SOURCE' pipeline/build_online_assets_from_canonical_store.py
          grep -q "$CANONICAL_STREAM_SHA256" viewer/canonical-store-runtime.js
          grep -q 'source_tiff_read: false' viewer/canonical-store-runtime.js
          ! grep -E 'createTexture|texImage2D|sampler2D|heightmap' viewer/app.js viewer/canonical-store-runtime.js
          python - <<'PY'
          import json
          from pathlib import Path
          pointer=json.loads(Path('truth/CANONICAL_ELEVATION_STORE_POINTER.json').read_text())
          validation=json.loads(Path('truth/CANONICAL_ELEVATION_VALIDATION_V1.json').read_text())
          assert pointer['status']=='AUTHORITATIVE_PRODUCTION_SOURCE'
          assert pointer['canonical_stream_sha256']=='91154cbe7c29220c9da41efc98105f1d36b614a343636543f7dd230735da079a'
          assert pointer['sample_count']==211919355
          assert pointer['data_bytes']==423838710
          assert pointer['chunk_count']==840
          assert pointer['shard_count']==7
          assert pointer['pixel_mismatch_count']==0
          assert pointer['normal_production_source_tiff_reads_allowed_after_cutover'] is False
          assert pointer['normal_production_elevation_source']=='canonical-pixel-exact-store'
          assert validation['passed'] is True
          assert validation['pixel_mismatch_count']==0
          assert validation['post_cutover_daily_source_tiff_reads_allowed'] is False
          PY

      - name: Download the immutable canonical store with no TIFF access
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf "$STORE_CACHE" out
          mkdir -p "$STORE_CACHE/shards" "$GENERATED_DIR" "$DISTILLED_DIR" "$SITE_DIR/data" "$EVIDENCE_DIR"
          gh release download "$CANONICAL_RELEASE_TAG" \
            --pattern CANONICAL_ELEVATION_MANIFEST.json \
            --dir "$STORE_CACHE" --clobber
          for index in 000 001 002 003 004 005 006; do
            gh release download "$CANONICAL_RELEASE_TAG" \
              --pattern "elevation-shard-${index}.i16pack" \
              --dir "$STORE_CACHE/shards" --clobber
          done
          test "$(find "$STORE_CACHE/shards" -name 'elevation-shard-*.i16pack' | wc -l)" = 7
          test "$(du -cb "$STORE_CACHE"/shards/elevation-shard-*.i16pack | tail -1 | cut -f1)" = "$CANONICAL_BYTES"
          test "$(find "$STORE_CACHE" -type f \( -iname '*.tif' -o -iname '*.tiff' \) | wc -l)" = 0

      - name: Verify the canonical stream directly from the seven shards
        run: |
          set -euo pipefail
          python - <<'PY' | tee "$EVIDENCE_DIR/CANONICAL_STORE_PRODUCTION_VALIDATION.log"
          import hashlib,json
          from pathlib import Path
          from pipeline.canonical_elevation_store import CanonicalElevationStore
          root=Path('.cache/canonical-elevation-store')
          manifest_path=root/'CANONICAL_ELEVATION_MANIFEST.json'
          manifest=json.loads(manifest_path.read_text())
          assert manifest['canonical_row_major_stream']['sha256']=='91154cbe7c29220c9da41efc98105f1d36b614a343636543f7dd230735da079a'
          assert manifest['canonical_row_major_stream']['bytes']==423838710
          assert manifest['logical_chunks']['chunk_count']==840
          assert manifest['logical_chunks']['overlap_samples']==0
          assert manifest['logical_chunks']['padding_samples']==0
          assert manifest['physical_shards']['shard_count']==7
          assert manifest['physical_shards']['compression']=='none'
          digest=hashlib.sha256()
          byte_count=0
          with CanonicalElevationStore(manifest_path) as store:
              assert store.width==11983 and store.height==17685
              for row in range(0,store.height,64):
                  height=min(64,store.height-row)
                  payload=store.read_aoi_window(0,row,store.width,height).astype('<i2',copy=False).tobytes(order='C')
                  digest.update(payload)
                  byte_count+=len(payload)
          assert byte_count==423838710
          assert digest.hexdigest()=='91154cbe7c29220c9da41efc98105f1d36b614a343636543f7dd230735da079a'
          receipt={
              'schema':'guilin-canonical-production-input-validation/v1',
              'passed':True,
              'source_tiff_read':False,
              'source_tiff_role':'cold-backup-only',
              'canonical_stream_sha256':digest.hexdigest(),
              'data_bytes':byte_count,
              'chunk_count':840,
              'shard_count':7,
              'overlap_samples':0,
              'padding_samples':0,
              'compression':'none'
          }
          Path('out/evidence/CANONICAL_PRODUCTION_INPUT_VALIDATION.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps(receipt,indent=2))
          PY

      - name: Build terrain and hydrology knowledge from the canonical store
        run: |
          set -euo pipefail
          python pipeline/build_online_assets_from_canonical_store.py \
            --elevation-store-manifest "$STORE_CACHE/CANONICAL_ELEVATION_MANIFEST.json" \
            --native-spatial-index truth/NATIVE_ELEVATION_MANIFEST.json \
            --store-pointer truth/CANONICAL_ELEVATION_STORE_POINTER.json \
            --hydrology truth/OSM_HYDROLOGY_IMMUTABLE.geojson \
            --output-dir "$GENERATED_DIR" \
            | tee "$EVIDENCE_DIR/CANONICAL_ASSET_BUILD.log"
          cp "$GENERATED_DIR/FULL_MAP_BUILD_RECEIPT.json" "$EVIDENCE_DIR/"
          python tests/validate_hydrology_flow_contract.py \
            --manifest "$GENERATED_DIR/osm-waterways-manifest.json" \
            --segments "$GENERATED_DIR/osm-waterway-segments.f32.bin" \
            | tee "$EVIDENCE_DIR/HYDROLOGY_CONTRACT.log"
          python - <<'PY'
          import json
          from pathlib import Path
          receipt=json.loads(Path('out/generated/FULL_MAP_BUILD_RECEIPT.json').read_text())
          assert receipt['passed'] is True
          assert receipt['source_tiff_read'] is False
          assert receipt['elevation_source']=='canonical-pixel-exact-store'
          assert receipt['canonical_stream_sha256']=='91154cbe7c29220c9da41efc98105f1d36b614a343636543f7dd230735da079a'
          hydro=json.loads(Path('out/generated/osm-waterways-manifest.json').read_text())
          assert hydro['topology']['segment_count']==155429
          assert hydro['topology']['dropped_segment_count']==0
          assert hydro['filter']['lake_surface_asset_emitted'] is False
          assert hydro['filter']['reservoir_surface_asset_emitted'] is False
          PY

      - name: Distill connected first-load waterway knowledge
        run: |
          set -euo pipefail
          python pipeline/distill_online_runtime.py \
            --native-manifest truth/NATIVE_ELEVATION_MANIFEST.json \
            --overview-manifest "$GENERATED_DIR/overview-direct-samples-manifest.json" \
            --hydrology-manifest "$GENERATED_DIR/osm-waterways-manifest.json" \
            --segments "$GENERATED_DIR/osm-waterway-segments.f32.bin" \
            --nodes "$GENERATED_DIR/osm-waterway-nodes.f32.bin" \
            --output-dir "$DISTILLED_DIR" \
            | tee "$EVIDENCE_DIR/DISTILLED_RUNTIME_BUILD.log"
          cp "$DISTILLED_DIR/DISTILLED_RUNTIME_BUILD_RECEIPT.json" "$EVIDENCE_DIR/"
          python - <<'PY'
          import json
          from pathlib import Path
          receipt=json.loads(Path('out/distilled/DISTILLED_RUNTIME_BUILD_RECEIPT.json').read_text())
          assert receipt['passed'] is True
          assert receipt['full_source_segment_count']==155429
          assert receipt['runtime_route_break_count']==0
          assert receipt['native_tiles_on_page_open']==0
          assert receipt['initial_numeric_data_bytes']<5_500_000
          PY

      - name: Assemble the lightweight viewer
        run: |
          set -euo pipefail
          rm -rf "$SITE_DIR"
          mkdir -p "$SITE_DIR/data"
          cp viewer/index.html viewer/styles.css viewer/app.js viewer/canonical-store-runtime.js "$SITE_DIR/"
          cp truth/NATIVE_ELEVATION_MANIFEST.json "$SITE_DIR/data/"
          cp truth/CANONICAL_ELEVATION_STORE_POINTER.json "$SITE_DIR/data/"
          cp truth/CANONICAL_ELEVATION_VALIDATION_V1.json "$SITE_DIR/data/"
          cp contracts/GUILIN_DISTILLED_RUNTIME_CONTRACT_V1.json "$SITE_DIR/data/"
          cp "$GENERATED_DIR/overview-direct-heights.i16.bin" "$SITE_DIR/data/"
          cp "$GENERATED_DIR/overview-direct-samples-manifest.json" "$SITE_DIR/data/"
          cp "$DISTILLED_DIR/osm-waterway-segments.f32.bin" "$SITE_DIR/data/"
          cp "$DISTILLED_DIR/osm-waterway-nodes.f32.bin" "$SITE_DIR/data/"
          cp "$DISTILLED_DIR/osm-waterways-manifest.json" "$SITE_DIR/data/"
          cp "$DISTILLED_DIR/guilin-distilled-knowledge.json" "$SITE_DIR/data/"
          touch "$SITE_DIR/.nojekyll"
          python - <<'PY'
          import json,os
          from pathlib import Path
          root=Path('out/site')
          knowledge=json.loads((root/'data/guilin-distilled-knowledge.json').read_text())
          version={
              'schema':'guilin-canonical-elevation-online-version/v1',
              'head':os.environ['GITHUB_SHA'],
              'run_id':int(os.environ['GITHUB_RUN_ID']),
              'source_tiff_role':'cold-backup-only',
              'source_tiff_read':False,
              'source_tiff_sha256':'9490b1bd34f67336352cf448729f763ae4e241637d821961efd0290e29d6c9d4',
              'canonical_stream_sha256':'91154cbe7c29220c9da41efc98105f1d36b614a343636543f7dd230735da079a',
              'canonical_sample_count':211919355,
              'canonical_data_bytes':423838710,
              'canonical_chunk_count':840,
              'canonical_shard_count':7,
              'canonical_overlap_samples':0,
              'canonical_padding_samples':0,
              'canonical_compression':'none',
              'native_spacing_m':12.5,
              'one_continuous_map':True,
              'continuous_zoom':True,
              'distilled_knowledge_runtime':True,
              'initial_numeric_data_bytes':knowledge['runtime']['initial_numeric_data_bytes'],
              'native_detail_delivery':'same-origin-canonical-byte-range',
              'canonical_store_path':'../guilin-elevation-store-v1/',
              'legacy_native_tile_store_required':False,
              'full_truth_downloaded_on_page_open':False,
              'height_image_texture_used':False,
              'lake_surface_asset_count':0,
              'reservoir_surface_asset_count':0,
              'visualAcceptance':False,
              'productionReady':False,
          }
          (root/'version.json').write_text(json.dumps(version,ensure_ascii=False,indent=2)+'\n')
          site_bytes=sum(path.stat().st_size for path in root.rglob('*') if path.is_file())
          assert site_bytes<=6_291_456,site_bytes
          Path('out/evidence/PUBLIC_SITE_SIZE.json').write_text(json.dumps({
              'viewer_directory_bytes':site_bytes,
              'initial_numeric_data_bytes':knowledge['runtime']['initial_numeric_data_bytes'],
              'source_tiff_read':False,
              'canonical_store_external_to_viewer':True,
          },indent=2)+'\n')
          PY
          (cd "$SITE_DIR" && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)

      - name: Verify the public canonical store before browser QA
        run: |
          set -euo pipefail
          curl --fail --silent "$PUBLIC_STORE_URL/STORE_VERSION.json?run=$GITHUB_RUN_ID" > "$EVIDENCE_DIR/PUBLIC_STORE_VERSION.json"
          grep -q "$CANONICAL_STREAM_SHA256" "$EVIDENCE_DIR/PUBLIC_STORE_VERSION.json"
          curl --fail --silent --header 'Range: bytes=0-1023' \
            --dump-header "$EVIDENCE_DIR/PUBLIC_STORE_RANGE_HEADERS.txt" \
            --output "$EVIDENCE_DIR/PUBLIC_STORE_RANGE.bin" \
            "$PUBLIC_STORE_URL/shards/elevation-shard-000.i16pack?run=$GITHUB_RUN_ID"
          test "$(stat -c '%s' "$EVIDENCE_DIR/PUBLIC_STORE_RANGE.bin")" = 1024
          grep -q '206' "$EVIDENCE_DIR/PUBLIC_STORE_RANGE_HEADERS.txt"

      - name: Run local full-map and canonical-store browser QA
        run: |
          set -euo pipefail
          rm -rf "$LOCAL_ROOT"
          mkdir -p "$LOCAL_ROOT/guilin" "$LOCAL_ROOT/guilin-elevation-store-v1"
          cp -a "$SITE_DIR/." "$LOCAL_ROOT/guilin/"
          cp "$STORE_CACHE/CANONICAL_ELEVATION_MANIFEST.json" "$LOCAL_ROOT/guilin-elevation-store-v1/"
          mkdir -p "$LOCAL_ROOT/guilin-elevation-store-v1/shards"
          cp "$STORE_CACHE"/shards/elevation-shard-*.i16pack "$LOCAL_ROOT/guilin-elevation-store-v1/shards/"
          python tests/range_static_server.py --root "$LOCAL_ROOT" --port 8765 > "$EVIDENCE_DIR/local-range-server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 80); do curl --fail --silent http://127.0.0.1:8765/guilin/ >/dev/null && break; sleep .25; done
          python tests/browser_full_map_cdp.py \
            --url http://127.0.0.1:8765/guilin/?build="$GITHUB_SHA" \
            --evidence-dir "$EVIDENCE_DIR/local-full-map" --timeout 900
          python tests/browser_canonical_store_cdp.py \
            --url http://127.0.0.1:8765/guilin/?build="$GITHUB_SHA" \
            --evidence-dir "$EVIDENCE_DIR/local-canonical" --timeout 900
          kill "$SERVER_PID" 2>/dev/null || true
          trap - EXIT

      - name: Publish only the lightweight Guilin viewer
        run: |
          set -euo pipefail
          git config user.name 'Haihao_Nature Grace HK'
          git config user.email 'haihao0307@gmail.com'
          git fetch origin gh-pages
          OLD_SHA="$(git rev-parse origin/gh-pages)"
          echo "OLD_GH_PAGES_SHA=$OLD_SHA" >> "$GITHUB_ENV"
          rm -rf /tmp/guilin-canonical-production-pages
          git worktree add /tmp/guilin-canonical-production-pages origin/gh-pages
          cd /tmp/guilin-canonical-production-pages
          git switch -C gh-pages origin/gh-pages
          rm -rf guilin
          mkdir -p guilin
          cp -a "$GITHUB_WORKSPACE/$SITE_DIR/." guilin/
          git add -A
          git commit -m "deploy(guilin): canonical elevation production $GITHUB_SHA"
          git push origin HEAD:gh-pages
          echo "PUBLIC_DEPLOYED=true" >> "$GITHUB_ENV"

      - name: Wait for the exact public viewer
        run: |
          set -euo pipefail
          for attempt in $(seq 1 180); do
            if curl --fail --silent "$PUBLIC_URL/version.json?build=$GITHUB_SHA" > "$EVIDENCE_DIR/PUBLIC_VERSION.json" && \
               grep -q "$CANONICAL_STREAM_SHA256" "$EVIDENCE_DIR/PUBLIC_VERSION.json" && \
               grep -q "$GITHUB_SHA" "$EVIDENCE_DIR/PUBLIC_VERSION.json"; then break; fi
            sleep 5
          done
          grep -q "$CANONICAL_STREAM_SHA256" "$EVIDENCE_DIR/PUBLIC_VERSION.json"
          grep -q "$GITHUB_SHA" "$EVIDENCE_DIR/PUBLIC_VERSION.json"

      - name: Run public full-map and canonical-store browser QA
        run: |
          set -euo pipefail
          python tests/browser_full_map_cdp.py \
            --url "$PUBLIC_URL?build=$GITHUB_SHA" \
            --evidence-dir "$EVIDENCE_DIR/public-full-map" --timeout 1200
          python tests/browser_canonical_store_cdp.py \
            --url "$PUBLIC_URL?build=$GITHUB_SHA" \
            --evidence-dir "$EVIDENCE_DIR/public-canonical" --timeout 1200
          python - <<'PY'
          import json,os
          from pathlib import Path
          canonical=json.loads(Path('out/evidence/public-canonical/canonical-browser-qa.json').read_text())
          viewer=json.loads(Path('out/evidence/public-full-map/browser-qa.json').read_text())
          assert canonical['passed'] is True
          assert viewer['passed'] is True
          receipt={
              'schema':'guilin-canonical-elevation-production-receipt/v1',
              'passed':True,
              'source_tiff_read':False,
              'source_tiff_role':'cold-backup-only',
              'canonical_stream_sha256':'91154cbe7c29220c9da41efc98105f1d36b614a343636543f7dd230735da079a',
              'canonical_sample_count':211919355,
              'canonical_data_bytes':423838710,
              'chunk_count':840,
              'shard_count':7,
              'overlap_samples':0,
              'padding_samples':0,
              'compression':'none',
              'http_range_verified':True,
              'legacy_native_tile_store_required':False,
              'public_url':'https://haihao0307.github.io/guilin-dem-pipeline/guilin/',
              'public_store_url':'https://haihao0307.github.io/guilin-dem-pipeline/guilin-elevation-store-v1/',
              'main_head':os.environ['GITHUB_SHA'],
              'visualAcceptance':False,
              'productionReady':False,
          }
          Path('out/evidence/CANONICAL_ELEVATION_PRODUCTION_RECEIPT.json').write_text(json.dumps(receipt,indent=2)+'\n')
          PY

      - name: Roll back the viewer if public verification failed
        if: failure() && env.PUBLIC_DEPLOYED == 'true'
        run: |
          set -euo pipefail
          git push origin "$OLD_GH_PAGES_SHA:refs/heads/gh-pages" --force
          echo "Viewer verification failed; gh-pages restored to $OLD_GH_PAGES_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload compact production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guilin-canonical-elevation-production-${{ github.run_id }}
          path: out/evidence
          retention-days: 90
          compression-level: 6

      - name: Summarize
        if: always()
        run: |
          {
            echo '## Guilin online canonical elevation production V1'
            echo
            echo "* public map: $PUBLIC_URL"
            echo "* canonical store: $PUBLIC_STORE_URL"
            echo '* source TIFF read: false'
            echo '* source TIFF role: cold backup only'
            echo '* canonical samples: 211,919,355'
            echo '* canonical data bytes: 423,838,710'
            echo '* chunks and shards: 840 / 7'
            echo '* overlap, padding, compression: 0 / 0 / none'
          } >> "$GITHUB_STEP_SUMMARY"
