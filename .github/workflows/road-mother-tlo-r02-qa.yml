name: Road Mother TLO R02 material QA
on:
  push:
    branches: [main]
    paths:
      - 'kaopu-geography-workbench/road-mother-tlo-r02/**'
      - '.github/workflows/road-mother-tlo-r02-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare official browser test tool
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Inspect R01 close material baseline
        run: node kaopu-geography-workbench/road-mother-tlo-r02/baseline-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: road-r02-material-proof
          path: road-r02-baseline
          retention-days: 14
