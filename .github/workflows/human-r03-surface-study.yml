name: Human R03 same-character surface study
on:
  push:
    branches: [test/human-r03-reference-recovery-20261013]
    paths: ['.github/workflows/human-r03-surface-study.yml']
permissions: {contents: read}
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {sparse-checkout: .github}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - name: Study existing licensed/inherited maps only; no third-party mesh or texture
        run: |
          mkdir -p study
          cat > study.cjs <<'JS'
          const fs=require('fs'),assert=require('node:assert/strict'),{chromium}=require('playwright');
          const url='https://htmlpreview.github.io/?https://raw.githubusercontent.com/haihao0307/guilin-dem-pipeline/3a4443bab9ee5a830024e7cbf3de51dc13160a8b/kaopu-unified-human-workbench/human-integrated-r03/preview.html';
          const patches=[
           ['vec3 rfDX=dFdx(-vViewPosition)','float rfReliefVisible=1.-smoothstep(.20,1.30,rfFoot);float rfRelief=((fData.r-.5)*.000016*uFDetail+(fData.g-.5)*.000065*uFMeso)*(1.-rfThin*.60)*fHostDetail*rfArea*rfReliefVisible;rfH+=rfRelief;\n  vec3 rfDX=dFdx(-vViewPosition)'],
           ['float rfMicroRough=(csNoise(vFRest*1120.)-.5)*.045;','float rfMicroRough=(csNoise(vFRest*1120.)-.5)*.035+(fData.b-.5)*.12+(csNoise(vFRest*32.)-.5)*.040;'],
           ['float rfRough=.60-','float rfRough=.57-'],
           ['cLobeWeight*=1.-rfArea*.82;','cLobeWeight*=1.-rfArea*.55;'],
           ['float rfChroma=(csNoise(vFRest*117.)-.5)*.020+(csNoise(vFRest*419.)-.5)*.008;','float rfChroma=(csNoise(vFRest*117.)-.5)*.035+(csNoise(vFRest*419.)-.5)*.012;']
          ];fs.writeFileSync('study/patches.json',JSON.stringify(patches,null,2));
          (async()=>{const b=await chromium.launch({headless:true,args:['--no-sandbox','--use-angle=swiftshader','--enable-unsafe-swiftshader']});const p=await b.newPage({viewport:{width:1300,height:1000},deviceScaleFactor:1});p.setDefaultTimeout(180000);const r={base:url,kind:'material experiment only, not delivered runtime',pageErrors:[],consoleErrors:[],screens:[],geometryUnchanged:false};p.on('pageerror',e=>r.pageErrors.push(String(e)));p.on('console',m=>{if(m.type()==='error')r.consoleErrors.push(m.text())});
          const snap=async n=>{await p.screenshot({path:'study/'+n+'.png',timeout:90000});r.screens.push(n);fs.writeFileSync('study/report.json',JSON.stringify(r,null,2));};
          try{await p.goto(url,{waitUntil:'domcontentloaded',timeout:120000});await p.waitForFunction(()=>window.unifiedHuman,null,{timeout:240000});await p.evaluate(()=>lifelikeIdle.pause(true));await p.waitForFunction(()=>lifelikeIdle.ready(),null,{timeout:240000});await p.evaluate(async()=>{const v=__IDENTITY_QA__.viewer();await v.skin.faceReady;await v.skin.naturalEyesReady;lifelikeIdle.seek(0);unifiedHuman.face();window.__studyOriginal=Array.from(v.geometry.attributes.position.array);window.__studyGeneration=lifelikeIdle.runtime().generation;});await snap('01-original-face');
          await p.evaluate(patches=>{const v=__IDENTITY_QA__.viewer(),m=v.skin.material,before=m.onBeforeCompile,key=m.customProgramCacheKey.bind(m);m.onBeforeCompile=s=>{before(s);for(const[a,b]of patches){if(s.fragmentShader.split(a).length!==2)throw Error('Study anchor changed '+a);s.fragmentShader=s.fragmentShader.replace(a,()=>b);}};m.customProgramCacheKey=()=>key()+'/regional-atlas-meso-study';m.needsUpdate=true;v.render();},patches);await snap('02-retained-atlas-face');
          await p.evaluate(()=>{const v=__IDENTITY_QA__.viewer();v.view('face');v.camera.zoom=2.2;v.camera.updateProjectionMatrix();v.render();});await snap('03-retained-atlas-close');
          r.geometryUnchanged=await p.evaluate(()=>{const v=__IDENTITY_QA__.viewer();return __studyOriginal.every((x,i)=>x===v.geometry.attributes.position.array[i])&&__studyGeneration===lifelikeIdle.runtime().generation;});assert(r.geometryUnchanged);assert.equal(r.pageErrors.length,0);assert.equal(r.consoleErrors.length,0);r.technicalPass=true;
          }catch(e){r.failure=String(e);await snap('failure').catch(()=>{});}finally{fs.writeFileSync('study/report.json',JSON.stringify(r,null,2));await b.close();}})().catch(e=>{console.error(e);process.exitCode=1});
          JS
          node study.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: human-r03-surface-study
          path: study/
          retention-days: 7
