name: Survivor Palau V0.1.4.1 cloud surf karst canoe release

on:
  push:
    branches: [game/survivor-palau-v001-20260917]
    paths: [.github/workflows/survivor-palau-v0141-release.yml]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: survivor-palau-v0141-release
  cancel-in-progress: true

jobs:
  verify-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Rebuild exact V0.1.4.1 candidate
        shell: bash
        run: |
          set -euo pipefail
          cat games/survivor-palau/source/v0141_builder.b64 | base64 -d | gzip -d > /tmp/build_v0141.py
          echo 'cd9f7ed67e3af07668d6f6c269f7fe34e0fa3ad6e1a0f1ecef220f2c4d699583  /tmp/build_v0141.py' | sha256sum -c -
          python3 /tmp/build_v0141.py
          OUT=games/survivor-palau/releases/v0.1.4.1/Survivor_Palau_V0.1.4.1_Cloud_Restore_Direct_Open.html
          echo '5e5e037cf97c28d93e85fb9e1b0e9e3a02e003fb3627b8d11ebe03025b71b749  '"$OUT" | sha256sum -c -
          test "$(wc -c < "$OUT")" -eq 147988
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('games/survivor-palau/releases/v0.1.4.1/Survivor_Palau_V0.1.4.1_Cloud_Restore_Direct_Open.html')
          s=p.read_text(encoding='utf-8')
          for marker in ['survivor-palau-0.1.4.1-cloud-restore','cloudVisibilityV2:true','breakerVisibilityV2:true','canoeReadabilityV3:true','data-view="deepfish"','data-view="karst"']:
              assert marker in s,marker
          assert s.count('<canvas')==1 and '<iframe' not in s
          m=re.search(r'<script type="module">(.*)</script>',s,re.S);assert m
          Path('/tmp/v0141.mjs').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/v0141.mjs

      - name: Real Chromium WebGL2 QA and review screenshots
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -q playwright
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          cat >/tmp/v0141_qa.py <<'PY'
          from playwright.sync_api import sync_playwright
          from pathlib import Path
          import json,shutil
          pth=Path('games/survivor-palau/releases/v0.1.4.1/Survivor_Palau_V0.1.4.1_Cloud_Restore_Direct_Open.html').resolve()
          r={'format':'survivor-palau-v0141-local-browser-qa','consoleErrors':[],'pageErrors':[],'requestFailures':[],'passed':False}
          chrome=shutil.which('google-chrome') or shutil.which('google-chrome-stable') or shutil.which('chromium');assert chrome
          with sync_playwright() as p:
              b=p.chromium.launch(executable_path=chrome,headless=False,args=['--no-sandbox','--enable-webgl','--ignore-gpu-blocklist','--use-angle=swiftshader','--enable-unsafe-swiftshader','--allow-file-access-from-files'])
              page=b.new_page(viewport={'width':1440,'height':900})
              page.on('console',lambda m:r['consoleErrors'].append(m.text) if m.type=='error' else None)
              page.on('pageerror',lambda e:r['pageErrors'].append(str(e)))
              page.on('requestfailed',lambda q:r['requestFailures'].append({'url':q.url,'failure':str(q.failure)}))
              page.goto(pth.as_uri()+'?qa=1',wait_until='load',timeout=30000)
              page.wait_for_function("() => document.body.dataset.qaReady==='true' && window.OceanMotherR018?.qa?.ready",timeout=120000)
              qa=page.evaluate("() => window.OceanMotherR018.qa")
              assert qa.get('webgl2') is True and qa.get('glError',0)==0 and not qa.get('errors')
              assert qa.get('karstFormationCount',0)>=10 and qa.get('treeCount',0)>=50 and qa.get('canoeCount',0)==1 and qa.get('foamActiveCells',0)>=20
              for v in ['overview','karst','breaker','canoe','deepfish']:
                  page.locator(f'[data-view="{v}"]').click();page.wait_for_timeout(1600);page.screenshot(path=f'/tmp/v0141-{v}.png',full_page=True)
              page.locator('#panelToggle').click();page.wait_for_timeout(250);assert page.locator('#panel').evaluate("e=>!e.classList.contains('closed')")
              page.locator('#pause').click();page.wait_for_timeout(250);assert page.evaluate("() => window.OceanMotherR018.getState().config.paused") is True
              page.locator('#pause').click();page.wait_for_timeout(250);assert page.evaluate("() => window.OceanMotherR018.getState().config.paused") is False
              r.update({'webgl2':qa.get('webgl2'),'glError':qa.get('glError',0),'qaErrors':qa.get('errors',[]),'visualProbe':qa.get('visualProbe'),'karstFormationCount':qa.get('karstFormationCount'),'treeCount':qa.get('treeCount'),'canoeCount':qa.get('canoeCount'),'foamActiveCells':qa.get('foamActiveCells'),'curlLayerTriangles':qa.get('curlLayerTriangles'),'viewsChecked':['overview','karst','breaker','canoe','deepfish']})
              r['passed']=not r['consoleErrors'] and not r['pageErrors'] and not r['requestFailures'];b.close()
          Path('/tmp/v0141_local_qa.json').write_text(json.dumps(r,ensure_ascii=False,indent=2)+'\n',encoding='utf-8');assert r['passed'],r
          PY
          xvfb-run -a python3 /tmp/v0141_qa.py

      - name: Publish fixed direct-open candidate
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          ROOT=games/survivor-palau/releases/v0.1.4.1
          cp /tmp/v0141_local_qa.json "$ROOT/BROWSER_QA.json"
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add "$ROOT"
          git commit -m 'publish(game): Survivor Palau V0.1.4.1 cloud surf karst canoe verified'
          git push origin HEAD:game/survivor-palau-v001-20260917
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify public fixed-commit bytes and Chromium
        shell: bash
        env:
          COMMIT: ${{ steps.publish.outputs.commit }}
        run: |
          set -euo pipefail
          P=games/survivor-palau/releases/v0.1.4.1/Survivor_Palau_V0.1.4.1_Cloud_Restore_Direct_Open.html
          U="https://raw.githack.com/haihao0307/guilin-dem-pipeline/$COMMIT/$P"
          for n in $(seq 1 30); do
            if curl -fsSL --retry 2 "$U" -o /tmp/v0141-public.html; then [ "$(sha256sum /tmp/v0141-public.html|cut -d' ' -f1)" = '5e5e037cf97c28d93e85fb9e1b0e9e3a02e003fb3627b8d11ebe03025b71b749' ] && break; fi
            sleep 4
          done
          echo '5e5e037cf97c28d93e85fb9e1b0e9e3a02e003fb3627b8d11ebe03025b71b749  /tmp/v0141-public.html' | sha256sum -c -
          cat >/tmp/v0141_public.py <<'PY'
          from playwright.sync_api import sync_playwright
          from pathlib import Path
          import json,os,shutil
          c=os.environ['COMMIT'];p='games/survivor-palau/releases/v0.1.4.1/Survivor_Palau_V0.1.4.1_Cloud_Restore_Direct_Open.html';u=f'https://raw.githack.com/haihao0307/guilin-dem-pipeline/{c}/{p}?qa=1'
          r={'format':'survivor-palau-v0141-public-browser-qa','url':u,'commit':c,'consoleErrors':[],'pageErrors':[],'requestFailures':[],'passed':False};chrome=shutil.which('google-chrome') or shutil.which('chromium');assert chrome
          with sync_playwright() as pw:
              b=pw.chromium.launch(executable_path=chrome,headless=False,args=['--no-sandbox','--enable-webgl','--ignore-gpu-blocklist','--use-angle=swiftshader','--enable-unsafe-swiftshader']);ctx=b.new_context(viewport={'width':1440,'height':900});ctx.add_cookies([{'name':'__Http-phish','value':'1','url':'https://raw.githack.com/','secure':True,'httpOnly':True,'sameSite':'Lax'}]);page=ctx.new_page()
              page.on('console',lambda m:r['consoleErrors'].append(m.text) if m.type=='error' else None);page.on('pageerror',lambda e:r['pageErrors'].append(str(e)));page.on('requestfailed',lambda q:r['requestFailures'].append({'url':q.url,'failure':str(q.failure)}))
              resp=page.goto(u,wait_until='load',timeout=60000);assert resp and resp.ok;page.wait_for_function("() => document.body.dataset.qaReady==='true' && window.OceanMotherR018?.qa?.ready",timeout=120000);qa=page.evaluate("() => window.OceanMotherR018.qa")
              assert qa.get('webgl2') and qa.get('glError',0)==0 and not qa.get('errors') and qa.get('karstFormationCount',0)>=10 and qa.get('treeCount',0)>=50 and qa.get('canoeCount',0)==1
              for v in ['overview','breaker','canoe']:
                  page.locator(f'[data-view="{v}"]').click();page.wait_for_timeout(1400);page.screenshot(path=f'/tmp/v0141-public-{v}.png',full_page=True)
              r.update({'httpStatus':resp.status,'webgl2':qa.get('webgl2'),'glError':qa.get('glError',0),'qaErrors':qa.get('errors',[]),'visualProbe':qa.get('visualProbe'),'karstFormationCount':qa.get('karstFormationCount'),'treeCount':qa.get('treeCount'),'canoeCount':qa.get('canoeCount'),'foamActiveCells':qa.get('foamActiveCells')});r['passed']=not r['consoleErrors'] and not r['pageErrors'] and not r['requestFailures'];b.close()
          Path('/tmp/v0141_public_qa.json').write_text(json.dumps(r,ensure_ascii=False,indent=2)+'\n',encoding='utf-8');assert r['passed'],r
          PY
          xvfb-run -a python3 /tmp/v0141_public.py

      - name: Upload review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Survivor_Palau_V0.1.4.1_Cloud_Surf_Karst_Canoe_QA
          path: |
            /tmp/v0141_local_qa.json
            /tmp/v0141-overview.png
            /tmp/v0141-karst.png
            /tmp/v0141-breaker.png
            /tmp/v0141-canoe.png
            /tmp/v0141-deepfish.png
            /tmp/v0141-public.html
            /tmp/v0141_public_qa.json
            /tmp/v0141-public-overview.png
            /tmp/v0141-public-breaker.png
            /tmp/v0141-public-canoe.png
          if-no-files-found: warn
          retention-days: 90
