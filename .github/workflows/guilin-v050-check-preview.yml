name: Publish Guilin v0.5 inspectable preview

# Visible inspection deployment. Stable root remains available; the recovery build is mounted at /guilin-v050-check/.
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/guilin-v050-check-preview.yml
  workflow_dispatch:

concurrency:
  group: guilin-v050-check-preview
  cancel-in-progress: true

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout stable site
        uses: actions/checkout@v6

      - name: Download the latest validated private recovery artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: '9483744971'
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            --output /tmp/guilin-v050-recovery.zip
          rm -rf /tmp/guilin-v050-recovery
          mkdir -p /tmp/guilin-v050-recovery
          unzip -q /tmp/guilin-v050-recovery.zip -d /tmp/guilin-v050-recovery
          test -f /tmp/guilin-v050-recovery/guilin-v050/index.html
          test -f /tmp/guilin-v050-recovery/guilin-v050/runtime.js
          test -f /tmp/guilin-v050-recovery/guilin-v050/manifest.json
          test -f /tmp/guilin-v050-recovery/guilin-v050/assets/height-grid.u16

      - name: Assemble stable website and the visible inspection build
        run: |
          set -euo pipefail
          STABLE="DEM-Map-Pipeline/guilin-zhenbaoding-yangshuo-pingle/web"
          OUT="_public_site"
          PREVIEW="$OUT/guilin-v050-check"
          test -f "$STABLE/index.html"
          rm -rf "$OUT"
          mkdir -p "$OUT" "$PREVIEW"
          cp -a "$STABLE/." "$OUT/"
          cp -a /tmp/guilin-v050-recovery/guilin-v050/. "$PREVIEW/"
          python - <<'PY'
          from pathlib import Path
          path = Path('_public_site/guilin-v050-check/index.html')
          html = path.read_text(encoding='utf-8')
          notice = '''<div id="inspection-build-notice" style="position:fixed;left:50%;top:10px;transform:translateX(-50%);z-index:99999;padding:8px 14px;border:1px solid rgba(255,255,255,.32);border-radius:999px;background:rgba(18,26,22,.88);color:#fff;font:600 13px/1.2 system-ui,sans-serif;backdrop-filter:blur(12px);box-shadow:0 8px 30px rgba(0,0,0,.28);pointer-events:none">桂林 v0.5 可视检查版 · 可旋转、缩放、切换图层和进入地面观察</div>'''
          if '<body' in html and 'inspection-build-notice' not in html:
              body_end = html.find('>', html.find('<body'))
              html = html[:body_end+1] + notice + html[body_end+1:]
          path.write_text(html, encoding='utf-8')
          PY
          touch "$OUT/.nojekyll"

      - name: Verify visible routes and required assets
        run: |
          set -euo pipefail
          python -m http.server 8765 --directory _public_site >/tmp/guilin-preview-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          sleep 2
          curl --fail --silent --show-error http://127.0.0.1:8765/ >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8765/guilin-v050-check/ >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8765/guilin-v050-check/runtime.js >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8765/guilin-v050-check/manifest.json >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8765/guilin-v050-check/assets/height-grid.u16 >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8765/assets/ecology/v0.3.1/trees.bin >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8765/assets/fine-regions/yangtang-airfield/height_u16.bin >/dev/null

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6.0.0

      - name: Upload stable site plus visible inspection build
        uses: actions/upload-pages-artifact@v5
        with:
          path: _public_site

  deploy:
    needs: assemble
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy visible Guilin inspection website
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Checkout repository to record successful deployment
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Record public inspection URL and deployment SHA
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          mkdir -p reports
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          payload = {
            "schema": "guilin_v050_check_deployment@1.0",
            "status": "deployed",
            "deployed_at": datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z'),
            "commit_sha": os.environ['GITHUB_SHA'],
            "pages_base_url": os.environ.get('PAGE_URL',''),
            "public_check_url": "https://guilin-dem-terrain.sunhaihao.chatgpt.site/guilin-v050-check/",
            "artifact_id": 9483744971
          }
          Path('reports/guilin-v050-check-deployment.json').write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/guilin-v050-check-deployment.json
          if ! git diff --cached --quiet; then
            git commit -m "Record Guilin v0.5 inspection deployment [skip ci]"
            git push origin HEAD:main
          fi
