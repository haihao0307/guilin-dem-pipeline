name: Publish Guilin v0.5 inspectable preview

# Builds a directly viewable public inspection website from the validated recovery artifact.
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/guilin-v050-check-preview.yml
  pull_request:
    branches:
      - main
    paths:
      - preview/guilin-v050-check-trigger.json
  workflow_dispatch:

concurrency:
  group: guilin-v050-check-preview-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download validated Guilin recovery artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: '9483744971'
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            --output /tmp/guilin-v050-recovery.zip
          rm -rf /tmp/guilin-v050-recovery
          mkdir -p /tmp/guilin-v050-recovery
          unzip -q /tmp/guilin-v050-recovery.zip -d /tmp/guilin-v050-recovery
          test -f /tmp/guilin-v050-recovery/guilin-v050/index.html
          test -f /tmp/guilin-v050-recovery/guilin-v050/runtime.js
          test -f /tmp/guilin-v050-recovery/guilin-v050/manifest.json
          test -f /tmp/guilin-v050-recovery/guilin-v050/assets/height-grid.u16

      - name: Assemble stable root and interactive Guilin inspection route
        run: |
          set -euo pipefail
          STABLE="DEM-Map-Pipeline/guilin-zhenbaoding-yangshuo-pingle/web"
          OUT="/tmp/guilin-v050-public-site"
          PREVIEW="$OUT/guilin-v050-check"
          test -f "$STABLE/index.html"
          rm -rf "$OUT"
          mkdir -p "$OUT" "$PREVIEW"
          cp -a "$STABLE/." "$OUT/"
          cp -a /tmp/guilin-v050-recovery/guilin-v050/. "$PREVIEW/"
          python - <<'PY'
          from pathlib import Path
          path = Path('/tmp/guilin-v050-public-site/guilin-v050-check/index.html')
          html = path.read_text(encoding='utf-8')
          notice = '''<div id="inspection-build-notice" style="position:fixed;left:50%;top:10px;transform:translateX(-50%);z-index:99999;padding:8px 14px;border:1px solid rgba(255,255,255,.32);border-radius:999px;background:rgba(18,26,22,.88);color:#fff;font:600 13px/1.2 system-ui,sans-serif;backdrop-filter:blur(12px);box-shadow:0 8px 30px rgba(0,0,0,.28);pointer-events:none">桂林 v0.5 可视检查版 · 可旋转、缩放、切换图层和进入地面观察</div>'''
          if '<body' in html and 'inspection-build-notice' not in html:
              body_end = html.find('>', html.find('<body'))
              html = html[:body_end+1] + notice + html[body_end+1:]
          path.write_text(html, encoding='utf-8')
          PY
          touch "$OUT/.nojekyll"

      - name: Verify site routes and required runtime assets
        run: |
          set -euo pipefail
          python -m http.server 8765 --directory /tmp/guilin-v050-public-site >/tmp/guilin-preview-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          sleep 2
          curl --fail --silent --show-error http://127.0.0.1:8765/ >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8765/guilin-v050-check/ >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8765/guilin-v050-check/runtime.js >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8765/guilin-v050-check/manifest.json >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8765/guilin-v050-check/assets/height-grid.u16 >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8765/assets/ecology/v0.3.1/trees.bin >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8765/assets/ecology/v0.3.1/shrubs.bin >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8765/assets/ecology/v0.3.1/rice.bin >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8765/assets/fine-regions/yangtang-airfield/height_u16.bin >/dev/null

      - name: Publish the verified website to a dedicated public branch
        env:
          PUBLIC_BRANCH: guilin-v050-check-site
        run: |
          set -euo pipefail
          rm -rf /tmp/guilin-site-git
          mkdir -p /tmp/guilin-site-git
          cp -a /tmp/guilin-v050-public-site/. /tmp/guilin-site-git/
          cd /tmp/guilin-site-git
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git"
          git checkout -b "$PUBLIC_BRANCH"
          cat > DEPLOYMENT.json <<EOF
          {
            "schema": "guilin_v050_visible_site@1.0",
            "source_artifact_id": 9483744971,
            "source_workflow_sha": "${GITHUB_SHA}",
            "inspection_path": "/guilin-v050-check/",
            "status": "published_for_visual_inspection"
          }
          EOF
          git add -A
          git commit -m "Publish Guilin v0.5 visual inspection website"
          git push --force origin "HEAD:${PUBLIC_BRANCH}"

      - name: Verify public branch files through GitHub raw endpoints
        run: |
          set -euo pipefail
          BASE="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/guilin-v050-check-site"
          for path in \
            "guilin-v050-check/index.html" \
            "guilin-v050-check/runtime.js" \
            "guilin-v050-check/manifest.json" \
            "guilin-v050-check/assets/height-grid.u16" \
            "assets/ecology/v0.3.1/trees.bin" \
            "DEPLOYMENT.json"; do
            for attempt in 1 2 3 4 5; do
              if curl --fail --silent --show-error "$BASE/$path" >/dev/null; then break; fi
              if [ "$attempt" = 5 ]; then exit 1; fi
              sleep 3
            done
          done

      - name: Write public inspection links to the job summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## 桂林 v0.5 可视检查网站

          - 交互网页: https://raw.githack.com/haihao0307/guilin-dem-pipeline/guilin-v050-check-site/guilin-v050-check/index.html
          - GitHub 文件: https://github.com/haihao0307/guilin-dem-pipeline/blob/guilin-v050-check-site/guilin-v050-check/index.html
          - 稳定旧版: https://guilin-dem-terrain.sunhaihao.chatgpt.site/
          EOF
