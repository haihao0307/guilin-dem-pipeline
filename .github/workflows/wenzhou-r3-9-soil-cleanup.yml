name: Wenzhou R3.9 Soil Pair Cleanup

on:
  push:
    branches:
      - feature/wenzhou-r3-8-overlay-transform-contract-20260913
    paths:
      - 'records/R3_9/SOIL_PAIR_CLEANUP_TRIGGER'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install validation dependencies
        run: |
          python -m pip install --disable-pip-version-check numpy==2.5.3
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify migration source and pre-clean state
        run: |
          set -euo pipefail
          python tools/r3-8/validate_static.py | tee /tmp/pre-clean-static.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=Path('site/dist/r3-8/data/soil')
          files=sorted(d.glob('*.i16le'))
          total=sum(p.stat().st_size for p in files)
          assert len(files)==80, len(files)
          assert total==141864320, total
          assert all('0-5cm' not in p.name for p in files)
          pair=json.loads(Path('site/dist/r3-8/data/soil-pairs/soil-pairs.json').read_text(encoding='utf-8'))
          assert pair['pairCount']==48 and pair['lossless'] is True
          assert pair['compressedBytes']==34571806
          print({'legacyFiles':len(files),'legacyBytes':total,'pairFiles':pair['pairCount'],'pairBytes':pair['compressedBytes']})
          PY

      - name: Remove superseded R3.8 split payloads and mark transport
        run: |
          set -euo pipefail
          git rm site/dist/r3-8/data/soil/*.i16le
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('site/dist/r3-8/data/soil/soil-context.json')
          m=json.loads(p.read_text(encoding='utf-8'))
          m['runtimeTransport']={
            'schema':'wenzhou-soil-pair-payloads/v1',
            'index':'../soil-pairs/soil-pairs.json',
            'codec':'i16le-pair-byte-shuffle-gzip-v1',
            'lossless':True,
            'activePhysicalPayloadCount':48,
            'supersededSplitPayloadsRemoved':80,
            'legacyLayerPathRole':'logical compatibility channel id and provenance pointer; active R3.8 runtime resolves through soil-pair-loader.js'
          }
          p.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          r=Path('records/R3_9');r.mkdir(parents=True,exist_ok=True)
          report={
            'schema':'wenzhou-r3.9-soil-pair-cleanup/v1','passed':True,
            'removedActiveSplitFiles':80,'removedActiveSplitBytes':141864320,
            'replacementPairFiles':48,'replacementCompressedBytes':34571806,
            'activePayloadReductionBytes':107292514,
            'activePayloadReductionRatio':1-34571806/141864320,
            'informationLoss':False,
            'r3_7HistoricalRuntimeChanged':False,
            'permanentEvidenceReleaseChanged':False
          }
          (r/'SOIL_PAIR_CLEANUP.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(report)
          PY
          git add site/dist/r3-8/data/soil/soil-context.json records/R3_9/SOIL_PAIR_CLEANUP.json

      - name: Validate cleaned working tree
        run: |
          set -euo pipefail
          test "$(find site/dist/r3-8/data/soil -maxdepth 1 -name '*.i16le' | wc -l)" = 0
          python tools/r3-8/validate_static.py | tee /tmp/post-clean-static.json
          python -m http.server 8768 >/tmp/r39-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8768/site/dist/r3-8/data/soil-pairs/soil-pairs.json >/dev/null; then break; fi
            sleep 1
          done
          R38_URL='http://127.0.0.1:8768/site/dist/r3-8/' node tools/r3-9/soil_pair_browser_qa.mjs | tee /tmp/post-clean-local-browser.json
          grep -q '"passed": true' /tmp/post-clean-local-browser.json

      - name: Commit and publish isolated cleanup candidate
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'data(wenzhou): remove superseded split soil payloads'
          echo "CANDIDATE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "VERIFY_BRANCH=verify/wenzhou-r3-9-soil-cleanup-${RUN_ID}" >> "$GITHUB_ENV"
          git push origin HEAD:"verify/wenzhou-r3-9-soil-cleanup-${RUN_ID}"

      - name: Fixed public QA on cleanup candidate
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          URL="https://raw.githack.com/${REPO}/${CANDIDATE_SHA}/site/dist/r3-8/index.html"
          INDEX="https://raw.githack.com/${REPO}/${CANDIDATE_SHA}/site/dist/r3-8/data/soil-pairs/soil-pairs.json"
          ready=0
          for i in $(seq 1 40); do
            if curl -fsS -H 'Cookie: __Http-phish=1' "$INDEX" | grep -q 'wenzhou-soil-pair-payloads'; then ready=1; break; fi
            sleep 3
          done
          test "$ready" = 1
          R38_URL="$URL" node tools/r3-9/soil_pair_browser_qa.mjs | tee /tmp/post-clean-public-browser.json
          grep -q '"passed": true' /tmp/post-clean-public-browser.json
          echo "$URL" > /tmp/post-clean-fixed-preview.txt

      - name: Promote verified cleanup to active branch
        env:
          TARGET: feature/wenzhou-r3-8-overlay-transform-contract-20260913
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch origin "$TARGET"
          test "$(git rev-parse origin/$TARGET)" = "$SOURCE_SHA"
          git push origin HEAD:"$TARGET"
          git push origin --delete "$VERIFY_BRANCH"

      - name: Upload cleanup proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wenzhou-r3-9-soil-cleanup-${{ github.sha }}
          path: |
            /tmp/pre-clean-static.json
            /tmp/post-clean-static.json
            /tmp/post-clean-local-browser.json
            /tmp/post-clean-public-browser.json
            /tmp/post-clean-fixed-preview.txt
          if-no-files-found: warn
          retention-days: 30
