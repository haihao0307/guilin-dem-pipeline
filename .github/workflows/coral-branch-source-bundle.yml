name: Coral branching source archive
on:
  push:
    branches: [work/coral-branch-public-r01-20261004]
    paths: [.github/workflows/coral-branch-source-bundle.yml]
permissions:
  contents: read
jobs:
  source-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Capture exact published workbench and related source code
        shell: python
        run: |
          from pathlib import Path
          from urllib.request import urlopen,Request
          import hashlib,json
          out=Path('/tmp/coral-branch-source-archive');out.mkdir(exist_ok=True)
          sha='7de3b5d2aa75daf86ae77288218bf228f03e7245'
          root='https://raw.githubusercontent.com/haihao0307/guilin-dem-pipeline/'+sha+'/coral-mother-core-seed-r01/'
          def read(url):
              with urlopen(Request(url,headers={'User-Agent':'Coral-source-archive'}),timeout=40) as r:
                  data=r.read(20000000)
                  assert len(data)<20000000,'unexpected source size'
                  return data
          m=read(root+'BRANCH_REPRODUCTION_R01_MANIFEST.json');manifest=json.loads(m)
          (out/'site').mkdir();(out/'site/BRANCH_REPRODUCTION_R01_MANIFEST.json').write_bytes(m)
          for name,h in manifest['files'].items():
              assert not name.startswith('/') and '..' not in Path(name).parts
              b=read(root+name);assert hashlib.sha256(b).hexdigest()==h,('workbench source mismatch',name)
              p=out/'site'/name;p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(b)
          refs=[
              ('nicknikolov/pex-space-colonization','README.md','0de44919003d241774f2dac5265e4e60416cb93f'),
              ('nicknikolov/pex-space-colonization','package.json','0cf4b0767016c6cc992dcb8843ae715bc75925de'),
              ('nicknikolov/pex-space-colonization','index.js','51e2b4b4dc2eb03e9e6588a60f1327e5a4db896f'),
              ('nicknikolov/space-colonization','README.md','efc597489fba3e6acafcbb5cced2367045696ca6'),
              ('nicknikolov/space-colonization','package.json','170c9dfcf48bb15261a84088233ab4f002d3a6cc'),
              ('nicknikolov/space-colonization','index.js','c2c1a1c1bcf554e1caf49d285fc485e48a63e58b')]
          records=[]
          for repo,name,h in refs:
              b=read('https://raw.githubusercontent.com/'+repo+'/master/'+name)
              assert hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()==h,('reference changed since verification',repo,name)
              p=out/'external-reference-source'/repo/name;p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(b)
              records.append({'repository':repo,'file':name,'git_blob':h,'sha256':hashlib.sha256(b).hexdigest(),'bytes':len(b)})
          source_trace={'date':'2026-10-04','workbench_commit':sha,'video_final_author_project_found':False,'reference_source_installed_into_workbench':False,'references':records,'findings':[
              {'kind':'matched documentation','url':'https://help.maxon.net/c4d/s26/en-us/Content/html/OMOSPLINE-MGMOSPLINEOBJECT_TURTLE_GROUP_TURTLE.html','note':'MoSpline/Turtle rule examples matching the documentary frames; not the creator final C4D scene'},
              {'kind':'matched research article lineage','url':'https://medium.com/thelabs/how-i-used-space-colonisation-to-build-an-alien-planet-db9c6fb73e34','note':'Lucas Milner / QUT, Marcin Ignac leaf venation and A.L. Bicho references match source-frame content'},
              {'kind':'related source','url':'https://github.com/nicknikolov/pex-space-colonization','note':'README credits Marcin Ignac and deprecates this package in favor of space-colonization'},
              {'kind':'successor source','url':'https://github.com/nicknikolov/space-colonization','note':'Actual source read and archived. package.json declares MIT. This is not proof of the video creator using this library.'}]}
          (out/'SOURCE_TRACE.json').write_text(json.dumps(source_trace,ensure_ascii=False,indent=2))
          (out/'README.md').write_text('''# Coral Mother — branching workbench source archive

The site folder contains the exact hashed public workbench snapshot. Start with the existing public URL, not a chat HTML attachment.

The external-reference-source folder contains unmodified upstream research code and its package metadata. It is NOT imported into the working branching generator. Preserve upstream attribution and package license declarations. Dependencies are not bundled or execution-tested here.

The original video creator final .c4d scene, complete growth parameters and materials remain unlocated. The two student outputs remain our visual reconstruction, not an exact original scene recovery.

Upstream pex-space-colonization is deprecated; its README points to nicknikolov/space-colonization. Neither repository establishes authorship of the user-supplied video.

Original user video and actual browser QA evidence are supplied separately in the conversation's full delivery archive.
''')
          print(json.dumps({'workbenchFiles':len(manifest['files']),'referenceFiles':len(records),'sourceHashesVerified':True,'productionModified':False},indent=2))
      - uses: actions/upload-artifact@v4
        with:
          name: coral-branch-workbench-source-and-lineage
          path: /tmp/coral-branch-source-archive/
          retention-days: 30
