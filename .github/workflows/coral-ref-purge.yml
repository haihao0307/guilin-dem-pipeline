name: Purge obsolete Coral Mother refs

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/coral-ref-purge.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coral-ref-purge-20260923
  cancel-in-progress: false

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Delete obsolete Coral Mother branch refs
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            'coral-blue-a02-direct-open-20260923'
            'cleanup/coral-line-closed-20260923'
            'cleanup/coral-ref-purge-20260923'
            'cleanup/coral-ref-purge-trigger-20260923'
            'handoff/coral-mother-r06-t06-full-20260921'
            'handoff/coral-mother-r06-t08-branching-approved-20260921'
            'handoff/coral-mother-r07-p13-palau-only-20260921'
            'restart/coral-pocillopora-teacher-r2-20260923'
            'restart/coral-porites-teacher-r2-20260923'
            'work/coral-blue-a04-hdf-exact-20260923'
            'work/coral-blue-teacher-a03-dissection-20260923'
            'work/coral-factory-r1-assembly-20260921'
            'work/coral-factory-r1-lane-a-branching-stage-a-20260921'
            'work/coral-factory-r1-lane-b-massive-stage-a-20260921'
            'work/coral-factory-r1-lane-c-seafan-stage-a-20260921'
            'work/coral-mother-r02-functional-growth-20260919'
            'work/coral-mother-r04-functional-morphology-20260920'
            'work/coral-mother-r05-growth-field-20260920'
            'work/coral-mother-r06-pocillopora-specimen-first-20260920'
            'work/coral-mother-r06-t05-continuous-tube-20260921'
            'work/coral-mother-r06-t06-compact-parameter-dock-20260921'
            'work/coral-mother-r06-t07-microscope-geometry-20260921'
            'work/coral-mother-r06-t08-uniform-microscope-warp-20260921'
            'work/coral-mother-r07-massive-porites-p00-20260921'
            'work/coral-mother-r07-massive-porites-p01-visual-fix-20260921'
            'work/coral-mother-r07-massive-porites-p02-outward-surface-20260921'
            'work/coral-mother-r07-massive-porites-p03-dense-corallites-20260921'
            'work/coral-mother-r07-massive-porites-p04-cellular-corallites-20260921'
            'work/coral-mother-r07-massive-porites-p08-integrated-voronoi-20260921'
            'work/coral-mother-r07-massive-porites-p09-shared-wall-voronoi-20260921'
            'work/coral-mother-r07-massive-porites-p10-poisson-corallites-20260921'
            'work/coral-mother-r07-massive-porites-p11-readable-corallites-20260921'
            'work/coral-mother-r07-massive-porites-p12-geodesic-surface-20260921'
            'work/coral-mother-r07-massive-porites-p13-palau-only-20260921'
            'work/coral-mother-r08-foliose-porites-rus-p00-palau-20260921'
            'work/coral-mother-r08-foliose-porites-rus-p01-shingle-colony-20260921'
            'work/coral-mother-r08-foliose-porites-rus-p02-terraced-shingles-20260921'
            'work/coral-mother-r09-heliopora-coerulea-restatement-r00-20260922'
          )

          deleted=0
          absent=0
          for branch in "${branches[@]}"; do
            if gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" >/dev/null 2>&1; then
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
              echo "DELETED ${branch}"
              deleted=$((deleted + 1))
            else
              echo "ABSENT ${branch}"
              absent=$((absent + 1))
            fi
          done

          echo "CORAL_REF_PURGE deleted=${deleted} absent=${absent}"

      - name: Verify no Coral Mother branch refs remain
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t remaining < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/branches?per_page=100" \
              --jq '.[].name' | \
              grep -E '^(coral-blue-|cleanup/coral-|handoff/coral-mother-|restart/coral-|work/coral-blue-|work/coral-factory-|work/coral-mother-)' || true
          )
          if ((${#remaining[@]})); then
            printf 'Unexpected Coral Mother refs remain:\n%s\n' "${remaining[*]}"
            exit 1
          fi
          echo 'CORAL_MOTHER_BRANCH_REFS_PURGED'
