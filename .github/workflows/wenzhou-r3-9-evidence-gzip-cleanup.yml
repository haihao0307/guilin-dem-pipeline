name: Wenzhou R3.9 Evidence Gzip Cleanup

on:
  push:
    branches:
      - feature/wenzhou-r3-8-overlay-transform-contract-20260913
    paths:
      - 'records/R3_9/EVIDENCE_GZIP_CLEANUP_TRIGGER'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install validation dependencies
        run: |
          python -m pip install --disable-pip-version-check numpy==2.5.3
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify migration source and pre-clean state
        run: |
          set -euo pipefail
          python tools/r3-8/validate_static.py | tee /tmp/evidence-pre-clean-static.json
          python - <<'PY'
          import json
          from pathlib import Path
          wrb=Path('site/dist/r3-8/data/wrb')
          water=Path('site/dist/r3-8/data/water')
          files=sorted(list(wrb.glob('*.u8'))+list(wrb.glob('*.u16le'))+list(water.glob('*.u8')))
          total=sum(p.stat().st_size for p in files)
          assert len(files)==41, len(files)
          assert total==37239384, total
          m=json.loads(Path('site/dist/r3-8/data/evidence-gzip/index.json').read_text(encoding='utf-8'))
          assert m['fileCount']==41 and m['lossless'] is True
          assert m['rawBytes']==37239384 and m['packedBytes']==3424064
          print({'legacyFiles':len(files),'legacyBytes':total,'gzipFiles':m['fileCount'],'gzipBytes':m['packedBytes']})
          PY

      - name: Remove superseded raw WRB JRC payloads and mark transport
        run: |
          set -euo pipefail
          git rm site/dist/r3-8/data/wrb/*.u8 site/dist/r3-8/data/wrb/*.u16le site/dist/r3-8/data/water/*.u8
          python - <<'PY'
          import json
          from pathlib import Path
          for family,manifest in [('wrb','site/dist/r3-8/data/wrb/wrb-context.json'),('water','site/dist/r3-8/data/water/water-context.json')]:
              p=Path(manifest);m=json.loads(p.read_text(encoding='utf-8'))
              m['runtimeTransport']={
                  'schema':'wenzhou-r3.9-evidence-gzip/v1',
                  'index':'../evidence-gzip/index.json',
                  'codec':'gzip-v1',
                  'lossless':True,
                  'family':family,
                  'legacyPathRole':'logical compatibility channel id and provenance pointer; active R3.8 runtime resolves through evidence-gzip-loader.js'
              }
              p.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          r=Path('records/R3_9');r.mkdir(parents=True,exist_ok=True)
          report={
              'schema':'wenzhou-r3.9-evidence-gzip-cleanup/v1','passed':True,
              'removedActiveRawFiles':41,'removedActiveRawBytes':37239384,
              'replacementGzipFiles':41,'replacementGzipBytes':3424064,
              'activePayloadReductionBytes':33815320,
              'activePayloadReductionRatio':1-3424064/37239384,
              'informationLoss':False,
              'r3_7HistoricalRuntimeChanged':False,
              'permanentEvidenceReleaseChanged':False
          }
          (r/'EVIDENCE_GZIP_CLEANUP.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(report)
          PY
          git add site/dist/r3-8/data/wrb/wrb-context.json site/dist/r3-8/data/water/water-context.json records/R3_9/EVIDENCE_GZIP_CLEANUP.json

      - name: Validate cleaned working tree locally
        run: |
          set -euo pipefail
          test "$(find site/dist/r3-8/data/wrb -maxdepth 1 \( -name '*.u8' -o -name '*.u16le' \) | wc -l)" = 0
          test "$(find site/dist/r3-8/data/water -maxdepth 1 -name '*.u8' | wc -l)" = 0
          python tools/r3-8/validate_static.py | tee /tmp/evidence-post-clean-static.json
          python -m http.server 8768 >/tmp/evidence-clean-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8768/site/dist/r3-8/data/evidence-gzip/index.json >/dev/null; then break; fi
            sleep 1
          done
          R38_URL='http://127.0.0.1:8768/site/dist/r3-8/' node tools/r3-9/evidence_gzip_browser_qa.mjs | tee /tmp/evidence-post-clean-local-browser.json
          grep -q '"passed": true' /tmp/evidence-post-clean-local-browser.json
          R38_URL='http://127.0.0.1:8768/site/dist/r3-8/' node tools/r3-9/soil_pair_browser_qa.mjs | tee /tmp/evidence-post-clean-soil-regression.json
          grep -q '"passed": true' /tmp/evidence-post-clean-soil-regression.json

      - name: Commit and publish isolated cleanup candidate
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'data(wenzhou): remove superseded raw WRB JRC payloads'
          echo "CANDIDATE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "VERIFY_BRANCH=verify/wenzhou-r3-9-evidence-cleanup-${RUN_ID}" >> "$GITHUB_ENV"
          git push origin HEAD:"verify/wenzhou-r3-9-evidence-cleanup-${RUN_ID}"

      - name: Fixed public QA on cleanup candidate
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          URL="https://raw.githack.com/${REPO}/${CANDIDATE_SHA}/site/dist/r3-8/index.html"
          INDEX="https://raw.githack.com/${REPO}/${CANDIDATE_SHA}/site/dist/r3-8/data/evidence-gzip/index.json"
          ready=0
          for i in $(seq 1 40); do
            if curl -fsS -H 'Cookie: __Http-phish=1' "$INDEX" | grep -q 'wenzhou-r3.9-evidence-gzip'; then ready=1; break; fi
            sleep 3
          done
          test "$ready" = 1
          R38_URL="$URL" node tools/r3-9/evidence_gzip_browser_qa.mjs | tee /tmp/evidence-post-clean-public-browser.json
          grep -q '"passed": true' /tmp/evidence-post-clean-public-browser.json
          R38_URL="$URL" node tools/r3-9/soil_pair_browser_qa.mjs | tee /tmp/evidence-post-clean-public-soil-regression.json
          grep -q '"passed": true' /tmp/evidence-post-clean-public-soil-regression.json
          echo "$URL" > /tmp/evidence-post-clean-fixed-preview.txt

      - name: Promote verified cleanup to active branch
        env:
          TARGET: feature/wenzhou-r3-8-overlay-transform-contract-20260913
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch origin "$TARGET"
          test "$(git rev-parse origin/$TARGET)" = "$SOURCE_SHA"
          git push origin HEAD:"$TARGET"
          git push origin --delete "$VERIFY_BRANCH"

      - name: Upload cleanup proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wenzhou-r3-9-evidence-cleanup-${{ github.sha }}
          path: |
            /tmp/evidence-pre-clean-static.json
            /tmp/evidence-post-clean-static.json
            /tmp/evidence-post-clean-local-browser.json
            /tmp/evidence-post-clean-soil-regression.json
            /tmp/evidence-post-clean-public-browser.json
            /tmp/evidence-post-clean-public-soil-regression.json
            /tmp/evidence-post-clean-fixed-preview.txt
          if-no-files-found: warn
          retention-days: 30
