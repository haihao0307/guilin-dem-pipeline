name: Verify fixed Weather Mother R27 public candidate v4

on:
  push:
    branches:
      - feature/weather-mother-r27-unified-cloud-dna-20260912
    paths:
      - .github/workflows/publish-verify-weather-mother-r27-unified-cloud-dna-v4.yml

permissions:
  contents: write

jobs:
  fixed-public-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OUT_DIR: weather-mother/full-weather-r27-unified-cloud-dna-20260912
      PAGE_COMMIT: d2f4ab4ce0b498c9a28e4b386c29109adbaf2283
      PUBLIC_URL: https://raw.githack.com/haihao0307/guilin-dem-pipeline/d2f4ab4ce0b498c9a28e4b386c29109adbaf2283/weather-mother/full-weather-r27-unified-cloud-dna-20260912/index.html
      EXPECTED_SHA256: a238fca33599b85361704e8e4aa2233ba5aaeb5d988ea048aa0ab018547bb188
      EXPECTED_BYTES: '37702'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconfirm immutable public bytes
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --connect-timeout 15 --max-time 60 "$PUBLIC_URL" -o /tmp/public-r27.html
          test "$(wc -c < /tmp/public-r27.html | tr -d ' ')" = "$EXPECTED_BYTES"
          test "$(sha256sum /tmp/public-r27.html | awk '{print $1}')" = "$EXPECTED_SHA256"
          grep -Fq 'Weather Mother · Cloud DNA Flight R27' /tmp/public-r27.html

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install browser QA harness
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet playwright==1.55.0 pillow
          python -m playwright install --with-deps chromium

      - name: Run fixed-public desktop and 390x844 browser QA
        shell: bash
        run: |
          set -euo pipefail
          python weather-mother/r27-tools/qa_public.py

      - name: Commit fixed-public evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Weather Mother CI'
          git config user.email 'weather-mother-ci@users.noreply.github.com'
          git add "$OUT_DIR/PUBLIC_QA.json" "$OUT_DIR/PUBLIC_R27_DESKTOP_640x400.png" "$OUT_DIR/PUBLIC_R27_MOBILE_390x844.png"
          git commit -m 'qa(weather-mother): prove fixed public R27 Cloud Object DNA [skip ci]'
          git push origin HEAD:feature/weather-mother-r27-unified-cloud-dna-20260912
