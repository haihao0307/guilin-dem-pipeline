name: Hair R14 roots and crown coverage
on:
  push:
    branches: [fix/hair-r14-root-coverage-20261012]
    paths: ['kaopu-hair-workbench/fusion/r14/**', '.github/workflows/hair-r14-root-coverage.yml']
permissions:
  contents: read
concurrency:
  group: hair-r14-root-coverage
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            kaopu-hair-workbench/fusion/r12
            kaopu-hair-workbench/fusion/r13c
            kaopu-hair-workbench/fusion/r14
            .github/workflows/hair-r14-root-coverage.yml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify frozen old source and install pinned compiler
        run: |
          git fetch --depth=1 origin dc36a8fc7b145ca3b217cd1a3e0c2987fa9b1877
          git fetch --depth=1 origin c0816ec8388195bb79b12fc82e11ce2d3fa07d56
          for p in kaopu-hair-workbench/fusion/r12 kaopu-hair-workbench/fusion/r13c; do
            test "$(git rev-parse HEAD:$p)" = "$(git rev-parse dc36a8fc7b145ca3b217cd1a3e0c2987fa9b1877:$p)"
          done
          test -z "$(git diff c0816ec8388195bb79b12fc82e11ce2d3fa07d56 HEAD -- kaopu-hair-workbench/fusion/r13c/src)"
          npm install --prefix /tmp/r14-tools --no-save esbuild@0.25.10
          ln -s /tmp/r14-tools/node_modules node_modules
          ln -s /tmp/r14-tools/node_modules /tmp/node_modules
      - name: Generate readable R14.2, root/contact tests and identical-width reference
        run: |
          python kaopu-hair-workbench/fusion/r14/upgrade.py
          python kaopu-hair-workbench/fusion/r14/crown-overlap.py
          find kaopu-hair-workbench/fusion/r14/src -name '*.js' -print0 | xargs -0 -n1 node --check
          node kaopu-hair-workbench/fusion/r14/tests/root-profile.mjs
          node kaopu-hair-workbench/fusion/r14/tests/crown-root-field.mjs
          node --input-type=module - <<'JS'
          import esbuild from 'esbuild';import path from 'node:path';
          const p=path.resolve('kaopu-hair-workbench/fusion/r14');
          await esbuild.build({entryPoints:[p+'/tests/coherence.mjs'],bundle:true,platform:'node',format:'esm',outfile:p+'/tests/coherence-bundled.mjs',alias:{three:p+'/vendor/three.module.js'}});
          JS
          node kaopu-hair-workbench/fusion/r14/tests/coherence-bundled.mjs
          rm kaopu-hair-workbench/fusion/r14/tests/coherence-bundled.mjs
          node kaopu-hair-workbench/fusion/r14/bundle.mjs
          python kaopu-hair-workbench/fusion/r14/package.py
          node /tmp/hair-r14-reference/bundle.mjs
          python /tmp/hair-r14-reference/package.py
          tar -czf /tmp/hair-r14-built.tar.gz kaopu-hair-workbench/fusion/r14
          tar -czf /tmp/hair-r14-reference.tar.gz -C /tmp/hair-r14-reference .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hair-r14-built
          path: |
            /tmp/hair-r14-built.tar.gz
            /tmp/hair-r14-reference.tar.gz
          retention-days: 14
  compare:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        style: [textured-fringe, side-flow, curtain-layer]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hair-r14-built
          path: /tmp/r14-build
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          tar -xzf /tmp/r14-build/hair-r14-built.tar.gz
          mkdir -p /tmp/hair-r14-reference
          tar -xzf /tmp/r14-build/hair-r14-reference.tar.gz -C /tmp/hair-r14-reference
          npm install --prefix /tmp/r14-tools --no-save playwright@1.55.1
          ln -s /tmp/r14-tools/node_modules node_modules
          /tmp/r14-tools/node_modules/.bin/playwright install --with-deps chromium
      - name: Same roots, actual native head, whole views and top visibility measurement
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/r14-http.log 2>&1 &
          python -m http.server 8766 --directory /tmp/hair-r14-reference --bind 127.0.0.1 >/tmp/r14-reference-http.log 2>&1 &
          timeout 900s node kaopu-hair-workbench/fusion/r14/tests/root-study.mjs http://127.0.0.1:8765/kaopu-hair-workbench/fusion/r14/public-lite.html http://127.0.0.1:8766/public-lite.html '${{ matrix.style }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hair-r14-compare-${{ matrix.style }}
          path: kaopu-hair-workbench/fusion/r14/evidence/root-study/${{ matrix.style }}
          retention-days: 30
  browser:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hair-r14-built
          path: /tmp/r14-build
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          tar -xzf /tmp/r14-build/hair-r14-built.tar.gz
          npm install --prefix /tmp/r14-tools --no-save playwright@1.55.1 pngjs@7.0.0
          ln -s /tmp/r14-tools/node_modules node_modules
          /tmp/r14-tools/node_modules/.bin/playwright install --with-deps chromium
      - name: Independent controls, all styles, storage, viewport and fallback regression
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/r14-http.log 2>&1 &
          timeout 1380s node kaopu-hair-workbench/fusion/r14/tests/browser.mjs http://127.0.0.1:8765/kaopu-hair-workbench/fusion/r14/public-lite.html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hair-r14-browser
          path: kaopu-hair-workbench/fusion/r14/evidence/candidate
          retention-days: 30
  publish:
    needs: [build, compare, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 22
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            kaopu-hair-workbench/fusion/r14
      - uses: actions/download-artifact@v4
        with:
          name: hair-r14-built
          path: /tmp/r14-build
      - run: tar -xzf /tmp/r14-build/hair-r14-built.tar.gz
      - uses: actions/download-artifact@v4
        with:
          name: hair-r14-browser
          path: kaopu-hair-workbench/fusion/r14/evidence/candidate
      - uses: actions/download-artifact@v4
        with:
          pattern: hair-r14-compare-*
          path: /tmp/r14-comparisons
      - name: Assemble independently passing evidence and publish only new directory
        id: publish
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, shutil, subprocess
          p=Path('kaopu-hair-workbench/fusion/r14')
          reports=[]
          for style in ['textured-fringe','side-flow','curtain-layer']:
              src=Path('/tmp/r14-comparisons')/('hair-r14-compare-'+style)
              r=json.loads((src/'report.json').read_text());assert r['success'],style
              assert len(r['candidate'])==1 and r['candidate'][0]['style']==style
              shutil.copytree(src,p/'evidence/root-study'/style,dirs_exist_ok=True);reports.append(r)
          combined={'success':True,'parallelStyles':3,'reference':sum([r['reference'] for r in reports],[]),'candidate':sum([r['candidate'] for r in reports],[]),'checks':sum([r['checks'] for r in reports],[]),'limitations':reports[0]['limitations']}
          (p/'evidence/root-study/report.json').write_text(json.dumps(combined,indent=2))
          assert json.loads((p/'evidence/candidate/report.json').read_text())['success']
          changed=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          assert all(x.startswith('kaopu-hair-workbench/fusion/r14/') for x in changed),changed
          PY
          git config user.name 'KAOPU Hair R14 Build'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add kaopu-hair-workbench/fusion/r14
          git diff --cached --quiet || git commit -m 'build(hair-r14.2): native root profile and root-preserving crown overlap with independent evidence'
          git push origin HEAD:refs/heads/fix/hair-r14-root-coverage-20261012
          sha=$(git rev-parse HEAD)
          url="https://htmlpreview.github.io/?https://raw.githubusercontent.com/haihao0307/guilin-dem-pipeline/$sha/kaopu-hair-workbench/fusion/r14/public-lite.html"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --prefix /tmp/r14-tools --no-save playwright@1.55.1 pngjs@7.0.0
          ln -s /tmp/r14-tools/node_modules node_modules
          /tmp/r14-tools/node_modules/.bin/playwright install --with-deps chromium
      - name: Actually render and operate immutable external webpage
        run: timeout 1080s node kaopu-hair-workbench/fusion/r14/tests/browser.mjs '${{ steps.publish.outputs.url }}' --public
      - name: Record public version and rendering evidence, keeping tested HTML unchanged
        env:
          PUBLIC_URL: ${{ steps.publish.outputs.url }}
          BUILD_SHA: ${{ steps.publish.outputs.sha }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,os,hashlib
          p=Path('kaopu-hair-workbench/fusion/r14')
          r=json.loads((p/'evidence/public/report.json').read_text());assert r['success']
          study=json.loads((p/'evidence/root-study/report.json').read_text());assert study['success']
          m=json.loads((p/'BUILD_MANIFEST.json').read_text())
          assert hashlib.sha256((p/'public-lite.html').read_bytes()).hexdigest()==m['htmlSha256']
          m.update(publicBrowserVerified=True,publicURL=os.environ['PUBLIC_URL'],buildRevision=os.environ['BUILD_SHA'],actionsRun=os.environ['GITHUB_RUN_ID'],rootStudy='evidence/root-study/report.json')
          (p/'BUILD_MANIFEST.json').write_text(json.dumps(m,indent=2))
          (p/'PUBLIC_URL.txt').write_text(os.environ['PUBLIC_URL']+'\n')
          rows=[]
          for a,b in zip(study['reference'],study['candidate']):
              rows.append(f"- {b['style']}: top-ROI visible scalp {a['coverage']['visibleFraction']:.6f} -> {b['coverage']['visibleFraction']:.6f}; sampled short-hair reversals {a['roots']['shortReversals']} -> {b['roots']['shortReversals']}.")
          (p/'DELIVERY.md').write_text('# R14.2 用户验收候选\n\n'+os.environ['PUBLIC_URL']+'\n\nBuild: '+os.environ['BUILD_SHA']+'\n\n'+ '\n'.join(rows)+'\n\nSame 64k potential roots, seed, radius, native head and lights. Root growth field retained; existing mid-shafts comb across the crown. No painted black scalp or duplicate hair shell.\n\nMeasurements are sampled/static and top-ROI-specific. Whole top/left/back views recorded. Physical phone, dynamic/self/garment collision and cinematic quality are not certified. Old workbenches unchanged. Draft PR228 remains unmerged.\n')
          PY
          git add kaopu-hair-workbench/fusion/r14
          git commit -m 'test(hair-r14.2): immutable external page, three-style evidence and honest limitations'
          git push origin HEAD:refs/heads/fix/hair-r14-root-coverage-20261012
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hair-r14-delivery
          path: kaopu-hair-workbench/fusion/r14
          retention-days: 30
