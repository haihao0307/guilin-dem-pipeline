name: Rebuild full common human sources and native channels
on:
  push:
    branches: [qa/unified-human-r01-20261006]
    paths: ['.github/qa/unified-full-20261007/**', '.github/workflows/unified-full-rebuild-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github/qa/unified-full-20261007
          filter: blob:none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recover immutable shared teachers and preserve accepted neck baseline
        working-directory: .github/qa/unified-full-20261007
        run: |
          python restore_sources.py
          python tools/prepare_common.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild fixed body correspondence once from immutable source bytes
        working-directory: .github/qa/unified-full-20261007
        env:
          OPENBLAS_NUM_THREADS: '2'
          MPLCONFIGDIR: /tmp/common-body-mpl
        run: |
          python -m pip install -r registration-requirements.txt
          node body-adapter/export-input.mjs
          node body-adapter/export-bind.mjs
          python body-adapter/register-body.py
          python body-adapter/generate-mapping.py
          python tools/verify_body_map.py
      - name: Native references, actual common channels and ownership
        working-directory: .github/qa/unified-full-20261007
        run: |
          node audit-teachers.mjs
          node tests/native-channels.mjs
          node tests/cranial-binding.mjs
          node body-adapter/test-common-body-driver.mjs
          node tests/common-body-integration.mjs
          node tools/export_common_body_cases.mjs
          node tools/export_common_cases.mjs
          node build_coverage.mjs
      - name: Produce real neutral teacher geometry and pinned semantic-proposal runtime
        working-directory: .github/qa/unified-full-20261007
        run: |
          node tools/export_geometry.mjs
          node tools/export_semantic_pose.mjs
          node tools/export_semantic_masks.mjs
          python restore_registration.py
          npm install --no-save --ignore-scripts --package-lock=false playwright@1.57.0
          npx playwright install --with-deps chromium webkit
          python -m http.server 8765 > /tmp/common-registration-server.log 2>&1 &
      - name: Render actual teachers and capture landmark-to-triangle evidence
        working-directory: .github/qa/unified-full-20261007
        run: node qa/registration.cjs
      - name: Real common-model Chromium native controls and profiles
        working-directory: .github/qa/unified-full-20261007
        env:
          NATIVE_BROWSER: chromium
        run: node qa/common-native.cjs
      - name: Real common-model WebKit native controls and profiles
        working-directory: .github/qa/unified-full-20261007
        env:
          NATIVE_BROWSER: webkit
        run: node qa/common-native.cjs
      - name: Real common-model Chromium Anny/MHR shared body and head attachment
        working-directory: .github/qa/unified-full-20261007
        env:
          NATIVE_BROWSER: chromium
          BODY_DRIVER: '1'
        run: node qa/common-native.cjs
      - name: Real common-model WebKit Anny/MHR shared body and head attachment
        working-directory: .github/qa/unified-full-20261007
        env:
          NATIVE_BROWSER: webkit
          BODY_DRIVER: '1'
        run: node qa/common-native.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unified-full-body-chromium
          retention-days: 21
          path: .github/qa/unified-full-20261007/qa-output/body-chromium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unified-full-body-webkit
          retention-days: 21
          path: .github/qa/unified-full-20261007/qa-output/body-webkit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unified-full-native-chromium
          retention-days: 21
          path: .github/qa/unified-full-20261007/qa-output/native-chromium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unified-full-native-webkit
          retention-days: 21
          path: .github/qa/unified-full-20261007/qa-output/native-webkit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unified-full-semantic-proposal
          retention-days: 21
          path: |
            .github/qa/unified-full-20261007/qa-output/registration
            .github/qa/unified-full-20261007/research/geometry/metadata.json
            .github/qa/unified-full-20261007/research/geometry/semantic-mask-report.json
            .github/qa/unified-full-20261007/research/registration-source-receipt.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unified-full-native-checkpoint
          retention-days: 21
          path: |
            .github/qa/unified-full-20261007/SOURCE-RESTORE-RECEIPT.json
            .github/qa/unified-full-20261007/COVERAGE.json
            .github/qa/unified-full-20261007/research/teacher-audit.json
            .github/qa/unified-full-20261007/research/native-channel-report.json
            .github/qa/unified-full-20261007/research/cranial-binding-report.json
            .github/qa/unified-full-20261007/research/common-body-integration-report.json
            .github/qa/unified-full-20261007/body-adapter/common-body-driver-report.json
            .github/qa/unified-full-20261007/body-adapter/mapping-report.json
            .github/qa/unified-full-20261007/body-adapter/map-indices.u32
            .github/qa/unified-full-20261007/body-adapter/map-bary.f32
            .github/qa/unified-full-20261007/research/body-map-rebuild.json
