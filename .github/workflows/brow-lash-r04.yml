name: Brow Lash R04 root domain and native65
on:
  push:
    branches: [feature/brow-lash-r04-domain-native65-20261014]
    paths: ['kaopu-unified-human-workbench/brow-lash-r04/**','.github/workflows/brow-lash-r04.yml']
permissions:
  contents: write
concurrency:
  group: brow-lash-r04
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_PATH: /tmp/bl-r04-tools/node_modules
      BL_DIR: kaopu-unified-human-workbench/brow-lash-r04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /kaopu-unified-human-workbench/brow-lash-r01/
            /kaopu-unified-human-workbench/brow-lash-r02/
            /kaopu-unified-human-workbench/brow-lash-r04/
            /kaopu-unified-human-workbench/human-integrated-r06/preview.html
            /kaopu-unified-human-workbench/full/source/registration-vendor/
            /kaopu-unified-human-workbench/vendor/
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pinned build and browser tools
        run: |
          npm install --prefix /tmp/bl-r04-tools esbuild@0.25.9 playwright@1.57.0
          /tmp/bl-r04-tools/node_modules/.bin/playwright install --with-deps chromium
      - name: Build original host plus requested changes
        run: |
          node "$BL_DIR/prepare.cjs"
          node "$BL_DIR/test.mjs" > "$BL_DIR/UNIT_QA.json"
          SOURCE_SHA=${{ github.sha }} node "$BL_DIR/build.cjs"
      - name: Actual candidate root domain and endpoint inspection
        env:
          QA_MODE: smoke
          QA_OUT: kaopu-unified-human-workbench/brow-lash-r04/acceptance/candidate
        run: node "$BL_DIR/verify.cjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brow-lash-r04-early
          path: kaopu-unified-human-workbench/brow-lash-r04/
          retention-days: 14
      - name: Immutable research snapshot only
        run: |
          git config user.name 'KAOPU Workbench Builder'
          git config user.email 'kaopu-builder@users.noreply.github.com'
          git add "$BL_DIR/preview.html" "$BL_DIR/BUILD_MANIFEST.json" "$BL_DIR/UNIT_QA.json" "$BL_DIR/Groom.mjs" "$BL_DIR/Growth.mjs" "$BL_DIR/FiberMaterial.mjs"
          git commit -m 'build(brow-lash-r04): domain and native65 inspected candidate [skip ci]'
          git push origin HEAD:feature/brow-lash-r04-domain-native65-20261014
          BUILD_SHA=$(git rev-parse HEAD)
          echo "BUILD_SHA=$BUILD_SHA" >> "$GITHUB_ENV"
          echo "PREVIEW_URL=https://htmlpreview.github.io/?https://raw.githubusercontent.com/haihao0307/guilin-dem-pipeline/$BUILD_SHA/$BL_DIR/preview.html" >> "$GITHUB_ENV"
      - name: Exact public page and independent predecessor65 comparison
        env:
          QA_MODE: full
          QA_OUT: kaopu-unified-human-workbench/brow-lash-r04/acceptance/public
        run: node "$BL_DIR/verify.cjs"
      - name: Preserve actual evidence and receipt
        run: |
          node - <<'NODE'
          const fs=require('fs'),dir=process.env.BL_DIR,q=JSON.parse(fs.readFileSync(dir+'/acceptance/public/qa.json'));if(!q.completed)throw Error('Public verification incomplete');fs.writeFileSync(dir+'/DELIVERY.json',JSON.stringify({version:'BROW-LASH-R04',sourceCommit:process.env.GITHUB_SHA,buildCommit:process.env.BUILD_SHA,preview:process.env.PREVIEW_URL,workflowRun:process.env.GITHUB_RUN_ID,checks:q.checks.length,screens:q.screens.length,publicRuntimeVerified:true,native65EqualsNew100:true,eyebrowDomainApproved:false,consumerGPUCertified:false,physicalPhone:false,userVisualAccepted:false},null,2));
          NODE
          git add "$BL_DIR/acceptance" "$BL_DIR/DELIVERY.json"
          git commit -m 'test(brow-lash-r04): preserve public domain and exact native endpoint evidence [skip ci]'
          git push origin HEAD:feature/brow-lash-r04-domain-native65-20261014
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brow-lash-r04-full
          path: kaopu-unified-human-workbench/brow-lash-r04/
          if-no-files-found: error
          retention-days: 14
