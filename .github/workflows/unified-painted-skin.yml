name: Registered Full Skin Painting
on:
  push:
    branches: [feature/unified-human-painted-skin-r03-20261008]
    paths:
      - kaopu-unified-human-workbench/skin-r03/**
      - .github/workflows/unified-painted-skin.yml
permissions:
  contents: write
concurrency:
  group: unified-painted-skin-r03
  cancel-in-progress: false
jobs:
  paint-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/unified-human-painted-skin-r03-20261008
          sparse-checkout: |
            kaopu-unified-human-workbench
            kaopu-anny-workbench/assets
            kaopu-anny-workbench/r02/assets
            kaopu-mhr-workbench/assets
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Restore checksum-verified source files
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,hashlib,io,zipfile
          root=Path('kaopu-unified-human-workbench/skin-r03');stage=root/'stage'
          if stage.exists():
              data=base64.b64decode(''.join((stage/f'part{i}.b64').read_text().strip() for i in range(5)),validate=True)
              assert hashlib.sha256(data).hexdigest()=='7a9ee3d37755506339539fc4f30cce00b6d427a6212ad7c5f6af4a3fa6e06f59'
              with zipfile.ZipFile(io.BytesIO(data)) as z:
                  assert set(z.namelist())=={'PaintedLayer.mjs','assemble.cjs','paint_maps.py','paint_body.py','qa-painted.cjs'}
                  for name in z.namelist():
                      assert len(z.read(name))<50000
                      (root/name).write_bytes(z.read(name))
          else:
              assert (root/'paint_maps.py').exists()
          PY
          node kaopu-unified-human-workbench/skin-r03/fix-diagnostics.cjs
      - name: Isolated render and painting tools
        run: |
          mkdir -p /tmp/paint-tools /tmp/paint-evidence /tmp/paint-donor
          cd /tmp/paint-tools
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.55.1 esbuild@0.25.10
          npx playwright install --with-deps chromium
          python -m pip install numpy scipy pillow
      - name: Read exact donor maps from user reference
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.request import urlretrieve
          root='https://raw.githubusercontent.com/haihao0307/Humanoid-Rig-Lab-Next/03aaa73a98987fbaa03857b71483045e73e5acd9/skin-quality-lab/'
          for name in ['r01/assets/head.glb','r01/assets/hires/albedo-4k.jpg','r01/assets/normal.jpg','r01/assets/specular.jpg','r02/assets/meso.webp','r02/assets/micro.webp']:
              dest=Path('/tmp/paint-donor')/name;dest.parent.mkdir(parents=True,exist_ok=True);urlretrieve(root+name,dest)
          PY
      - name: Bake full atlas and independent body pigmentation
        env:
          OPENBLAS_NUM_THREADS: '1'
          NODE_PATH: /tmp/paint-tools/node_modules
        run: |
          node kaopu-unified-human-workbench/skin-r03/assemble.cjs
          python kaopu-unified-human-workbench/skin-r03/paint_maps.py /tmp/paint-donor kaopu-unified-human-workbench/skin-r01/assets kaopu-unified-human-workbench/skin-r03/assets
          python kaopu-unified-human-workbench/skin-r03/paint_body.py kaopu-unified-human-workbench/skin-r03/assets
          node kaopu-unified-human-workbench/skin-r03/build.cjs --source-only
          node --check kaopu-unified-human-workbench/skin-r03/PaintedLayer.mjs
          cp kaopu-unified-human-workbench/skin-r03/assets/paint-manifest.json /tmp/paint-evidence/
      - name: Actual WebGL texture and unchanged-solver checks
        env:
          NODE_PATH: /tmp/paint-tools/node_modules
          QA_OUT: /tmp/paint-evidence/local
          CAPTURE_REFERENCE: '1'
        run: |
          python -m http.server 8765 >/tmp/paint-server.log 2>&1 &
          node kaopu-unified-human-workbench/skin-r03/qa-painted.cjs
          QA_OUT=/tmp/paint-evidence/geometry node kaopu-unified-human-workbench/skin-r03/native-regression.cjs
      - name: Commit only new material files and fixed preview
        env:
          NODE_PATH: /tmp/paint-tools/node_modules
        run: |
          git config user.name 'Registered Skin Build'
          git config user.email 'skin-build@users.noreply.github.com'
          git rm -r --ignore-unmatch kaopu-unified-human-workbench/skin-r03/stage kaopu-unified-human-workbench/skin-r03/source-stage.b64
          git add kaopu-unified-human-workbench/skin-r03
          git add -f kaopu-unified-human-workbench/skin-r03/assets/*
          python - <<'PY'
          import json,hashlib,subprocess
          from pathlib import Path
          root=Path('kaopu-unified-human-workbench/skin-r03/assets')
          for name,entry in json.loads((root/'paint-manifest.json').read_text())['files'].items():
              data=subprocess.check_output(['git','show',':'+str(root/name)])
              assert hashlib.sha256(data).hexdigest()==entry['sha256'],name
          PY
          if ! git diff --cached --quiet; then git commit -m 'feat(skin): publish complete registered 4K head channels and unique body colour [skip ci]'; fi
          git push origin HEAD:feature/unified-human-painted-skin-r03-20261008
          ASSET_COMMIT=$(git rev-parse HEAD) node kaopu-unified-human-workbench/skin-r03/build.cjs
          git add kaopu-unified-human-workbench/skin-r03/{preview.html,BUILD_MANIFEST.json}
          git commit -m 'build(skin): pin full photographic skin R03 preview [skip ci]'
          git push origin HEAD:feature/unified-human-painted-skin-r03-20261008
          echo "PUBLIC_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          cp kaopu-unified-human-workbench/skin-r03/BUILD_MANIFEST.json /tmp/paint-evidence/
      - name: Verify actual immutable public preview
        env:
          NODE_PATH: /tmp/paint-tools/node_modules
          QA_OUT: /tmp/paint-evidence/public
        run: |
          export QA_URL="https://htmlpreview.github.io/?https://raw.githubusercontent.com/haihao0307/guilin-dem-pipeline/${PUBLIC_COMMIT}/kaopu-unified-human-workbench/skin-r03/preview.html"
          echo "$QA_URL" | tee /tmp/paint-evidence/PUBLIC_URL.txt
          node kaopu-unified-human-workbench/skin-r03/qa-painted.cjs
      - name: Retain exact source and diagnostic evidence
        if: always()
        run: |
          mkdir -p /tmp/paint-evidence/source
          cp kaopu-unified-human-workbench/skin-r03/*.{mjs,cjs,py,json} /tmp/paint-evidence/source/ 2>/dev/null || true
          cp /tmp/paint-server.log /tmp/paint-evidence/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: painted-skin-evidence
          path: /tmp/paint-evidence
          retention-days: 7
