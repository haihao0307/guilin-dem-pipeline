name: Brow Lash R01 build and public inspection
on:
  push:
    branches: [feature/brow-lash-r01-cinematic-study-20261014]
    paths:
      - 'kaopu-unified-human-workbench/brow-lash-r01/**'
      - '.github/workflows/brow-lash-r01.yml'
permissions:
  contents: write
concurrency:
  group: brow-lash-r01
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NODE_PATH: /tmp/bl-tools/node_modules
      BL_DIR: kaopu-unified-human-workbench/brow-lash-r01
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/brow-lash-r01-cinematic-study-20261014
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /kaopu-unified-human-workbench/brow-lash-r01/
            /kaopu-unified-human-workbench/human-integrated-r06/preview.html
            /kaopu-unified-human-workbench/full/source/registration-vendor/
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated build and browser tools
        run: |
          npm install --prefix /tmp/bl-tools esbuild@0.25.9 playwright@1.57.0
          /tmp/bl-tools/node_modules/.bin/playwright install --with-deps chromium
      - name: Build preserved R06 plus specialist
        run: |
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          node "$BL_DIR/test.mjs" > "$BL_DIR/UNIT_QA.json"
          SOURCE_SHA=$(git rev-parse HEAD) node "$BL_DIR/build.cjs"
      - name: Candidate real-render inspection
        env:
          QA_MODE: smoke
          QA_OUT: kaopu-unified-human-workbench/brow-lash-r01/acceptance/candidate
        run: node "$BL_DIR/verify.cjs"
      - name: Publish immutable candidate on research branch only
        id: publish
        run: |
          git config user.name 'KAOPU Workbench Builder'
          git config user.email 'kaopu-builder@users.noreply.github.com'
          git add "$BL_DIR/preview.html" "$BL_DIR/BUILD_MANIFEST.json" "$BL_DIR/UNIT_QA.json"
          git diff --cached --quiet || git commit -m 'build(brow-lash): publish inspected R01 candidate [skip ci]'
          git push origin HEAD:feature/brow-lash-r01-cinematic-study-20261014
          BUILD_SHA=$(git rev-parse HEAD)
          echo "BUILD_SHA=$BUILD_SHA" >> "$GITHUB_ENV"
          echo "PREVIEW_URL=https://htmlpreview.github.io/?https://raw.githubusercontent.com/haihao0307/guilin-dem-pipeline/$BUILD_SHA/$BL_DIR/preview.html" >> "$GITHUB_ENV"
      - name: Exact-public full browser verification
        env:
          QA_MODE: full
          QA_OUT: kaopu-unified-human-workbench/brow-lash-r01/acceptance/public
        run: node "$BL_DIR/verify.cjs"
      - name: Preserve actual public evidence
        run: |
          node - <<'NODE'
          const fs=require('fs');const dir=process.env.BL_DIR;const qa=JSON.parse(fs.readFileSync(dir+'/acceptance/public/qa.json'));if(!qa.completed)throw Error('Public verification incomplete');const delivery={version:'BROW-LASH-R01',sourceCommit:process.env.SOURCE_SHA,buildCommit:process.env.BUILD_SHA,preview:process.env.PREVIEW_URL,workflowRun:process.env.GITHUB_RUN_ID,checks:qa.checks.length,screens:qa.screens.length,publicRuntimeVerified:true,userVisualAccepted:false,filmQualityAccepted:false,realConsumerGPU:false,physicalPhone:false};fs.writeFileSync(dir+'/DELIVERY.json',JSON.stringify(delivery,null,2)+'\n');
          NODE
          git add "$BL_DIR/acceptance" "$BL_DIR/DELIVERY.json"
          git diff --cached --quiet || git commit -m 'test(brow-lash): preserve public controls and native-blink evidence [skip ci]'
          git push origin HEAD:feature/brow-lash-r01-cinematic-study-20261014
      - name: Archive source and actual screenshots even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brow-lash-r01-${{ github.run_attempt }}
          path: kaopu-unified-human-workbench/brow-lash-r01/
          if-no-files-found: error
          retention-days: 14
