name: Landscape V07 Public End To End Proof
on:
  push:
    branches: [feature/stone-money-landscape-influence-tool-v05-20261002]
    paths: [.github/workflows/landscape-v07-public-proof.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Wait for actual published HTML and manifest
        run: |
          python - <<'PY'
          import urllib.request,time,json
          url='https://haihao0307.github.io/guilin-dem-pipeline/landscape-terrain-influence-tool-v07/'
          for i in range(60):
              try:
                  html=urllib.request.urlopen(url+'index.html?proof='+str(i),timeout=15).read().decode()
                  manifest=json.load(urllib.request.urlopen(url+'manifest.json?proof='+str(i),timeout=15))
                  if '地形影响工具体系 V0.7' in html and len(manifest['entries'])==10:
                      print('Public source is available',url,flush=True);break
              except Exception as e:
                  if i%6==0: print(type(e).__name__,str(e),flush=True)
              time.sleep(10)
          else:raise RuntimeError('Published route not ready; no public success claim permitted')
          PY
      - name: Test real browser with no request overrides
        run: |
          python -m pip install -q playwright pillow
          mkdir -p /tmp/lm07-public
          python -u - <<'PY'
          from playwright.sync_api import sync_playwright
          from pathlib import Path
          import json,shutil,time,hashlib
          root=Path('/tmp/lm07-public');url='https://haihao0307.github.io/guilin-dem-pipeline/landscape-terrain-influence-tool-v07/index.html'
          results=[]
          with sync_playwright() as p:
              b=p.chromium.launch(executable_path=shutil.which('google-chrome') or shutil.which('chromium'),headless=True,args=['--no-sandbox','--disable-dev-shm-usage','--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader','--ignore-gpu-blocklist'])
              for run in range(2):
                  context=b.new_context(viewport={'width':1600,'height':1000});page=context.new_page();page.set_default_timeout(45000)
                  errors=[];workers=[];bad=[]
                  page.on('pageerror',lambda e:errors.append(str(e)))
                  page.on('worker',lambda w:workers.append(w.url))
                  page.on('response',lambda r:bad.append({'url':r.url,'status':r.status}) if r.status>=400 and 'favicon' not in r.url else None)
                  case={'run':run,'url':url,'switches':[]}
                  def wait(count=None):
                      page.wait_for_function('n=>(window.__LM_READY__===true && (n===null||window.__LM__.performance.loads.length>n)) || !!window.__LM_ERROR__',arg=count,timeout=60000)
                      assert not page.evaluate('window.__LM_ERROR__'),page.evaluate('window.__LM_ERROR__')
                  try:
                      t=time.monotonic();response=page.goto(url,wait_until='domcontentloaded');assert response.status==200
                      assert page.locator('#view').count()==1
                      wait();case['coldWallSeconds']=time.monotonic()-t;case['startup']=page.evaluate('window.__LM__.performance');print('COLD',case,flush=True)
                      page.screenshot(path=str(root/f'cold-{run}.png'))
                      if run==0:
                          for i in range(10):
                              old=page.evaluate('window.__LM__.performance.loads.length')
                              page.locator('#ltiPresetGrid button').nth(i).click()
                              wait(old)
                              state=page.evaluate('''()=>({preset:window.__LM__.state.palauPreset,metrics:window.__LM__.performance.loads.at(-1),frame:window.__LM__.auditFrame(),errors:window.__LM__.errors})''')
                              assert state['preset']==i and state['frame']['unique']>100 and state['frame']['glError']==0,state
                              case['switches'].append(state);print('SWITCH',i,state['metrics'],flush=True)
                              if i in [0,2,5,9]:page.screenshot(path=str(root/f'P{i+1:02d}.png'))
                          a=page.evaluate('window.__LM__.state.theta');page.mouse.move(980,480);page.mouse.down();page.mouse.move(1090,525,steps=5);page.mouse.up();page.wait_for_timeout(350)
                          case['dragWorks']=page.evaluate('window.__LM__.state.theta')!=a;assert case['dragWorks']
                          page.locator('[data-lti-tab="ops"]').click() if page.locator('[data-lti-tab="ops"]').count() else None
                          page.evaluate('window.__LM__.setMaterial({heightScale:1.35,widthScale:1.12,wet:.55})');page.wait_for_timeout(500)
                          case['scaleAndWet']=page.evaluate('({height:__LM__.state.heightScale,width:__LM__.state.widthScale,wet:__LM__.state.wet})');assert case['scaleAndWet']['height']==1.35
                          page.evaluate('window.__LM__.goView("section")');page.wait_for_timeout(500);page.screenshot(path=str(root/'section.png'))
                      assert not errors,errors
                      assert not workers,workers
                      assert not bad,bad
                  finally:
                      case.update({'pageErrors':errors,'startupWorkers':workers,'failedResponses':bad});results.append(case)
                      (root/'PUBLIC_QA.json').write_text(json.dumps({'browser':'Chromium / SwiftShader','viewport':[1600,1000],'noNetworkOverrides':True,'results':results},ensure_ascii=False,indent=2))
                      (root/f'last-{run}.html').write_text(page.content());context.close()
              b.close()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: landscape-v07-public-evidence
          path: /tmp/lm07-public
          retention-days: 7
