name: KAOPU Gaussian R74 Covariance Cache

on:
  push:
    branches:
      - coordination/kaopu-learning-flywheel-r1-20260909
    paths:
      - docs/mother_coordination/kaopu_learning_flywheel_v1/PROBES/gaussian_three_covariance_cache_r74.html
      - docs/mother_coordination/kaopu_learning_flywheel_v1/PROBES/run_gaussian_covariance_cache_r74.js
      - docs/mother_coordination/kaopu_learning_flywheel_v1/ADAPTERS/gaussian_covariance_cache_gate_r74.mjs
      - .github/workflows/kaopu-gaussian-r74-covariance-cache.yml

permissions:
  contents: read

jobs:
  r74-covariance-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned renderer and browser harness
        run: |
          npm init -y
          npm pkg set type=module
          npm install --no-save three@0.186.0 playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Start local fixture server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/r74-http.log 2>&1 &
          sleep 2
          curl --fail --silent http://127.0.0.1:8765/docs/mother_coordination/kaopu_learning_flywheel_v1/PROBES/gaussian_three_covariance_cache_r74.html > /dev/null
      - name: Run preregistered covariance-cache invalidation probe
        run: node docs/mother_coordination/kaopu_learning_flywheel_v1/PROBES/run_gaussian_covariance_cache_r74.js
      - name: Validate R74 evidence contract
        run: |
          cat r74-comparison.json | node docs/mother_coordination/kaopu_learning_flywheel_v1/ADAPTERS/gaussian_covariance_cache_gate_r74.mjs > r74-gate.json
          cat r74-gate.json
          node -e "const d=require('./r74-gate.json');if(d.status!=='Candidate-pass')process.exit(10)"
      - name: Upload R74 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaopu-gaussian-r74-covariance-cache
          path: r74-*.json
          if-no-files-found: warn
          retention-days: 30
