name: Fish Tail Source R010
on:
  push:
    branches: [work/fish-yellowfin-tail-r010-20260924]
    paths:
      - restart/fish-yellowfin-teacher-r2/web-r010/**
      - .github/workflows/fish-tail-r010.yml
permissions:
  contents: write
concurrency:
  group: fish-yellowfin-single-publisher
  cancel-in-progress: false
jobs:
  verify-tail-source-study:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            apps/ocean-life-mother/fish-mother/yellowfin-source-copy-r001/source-workspace/source
            restart/fish-yellowfin-teacher-r2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reproduce all teacher fields, both merged studies, and original tail observations
        run: |
          python -m pip install numpy==2.2.6 Pillow==11.2.1
          R=restart/fish-yellowfin-teacher-r2
          O=dist/fish-mother-yellowfin
          python $R/web-r004/compile_teacher.py --source apps/ocean-life-mother/fish-mother/yellowfin-source-copy-r001/source-workspace/source/tuna_fish_4k.glb --out $O/canonical-r004
          cp $O/canonical-r004/EXTRACTION_QA.json SOURCE_IDENTITY_PROOF.json
          python $R/web-r005/compile_regions.py --package $O/canonical-r004 --out $O/parts-r005
          python $R/web-r006/compile_boundary.py --canonical $O/canonical-r004 --parts $O/parts-r005 --out $O/boundary-r006
          python $R/web-r007/compile_head.py --canonical $O/canonical-r004 --parts $O/parts-r005 --out $O/head-r007
          python $R/web-r008/compile_features.py --canonical $O/canonical-r004 --parts $O/parts-r005 --head $O/head-r007 --out $O/feature-r008
          python $R/web-r009/compile_oral.py --canonical $O/canonical-r004 --parts $O/parts-r005 --head $O/head-r007 --out $O/oral-r009
          python $R/web-r010/compile_tail.py --canonical $O/canonical-r004 --parts $O/parts-r005 --head $O/head-r007 --out $O/tail-r010
          python $R/web-r010/prepare_r010.py
      - name: Preserve single-file boot, full original 4K and immutable material state
        run: |
          npm install --no-save three@0.170.0 esbuild@0.24.2 playwright@1.51.1
          R=restart/fish-yellowfin-teacher-r2/web-r010
          node --check $R/main.mjs
          node --check $R/tail.mjs
          npx esbuild $R/main.mjs --bundle --format=esm --target=es2022 --minify --legal-comments=inline --outfile=$R/bundle.js
          python $R/build.py
          npx playwright install --with-deps chromium
      - name: Real offline full regression including two runtimes and 209 source tail times
        run: node restart/fish-yellowfin-teacher-r2/web-r010/qa_regression.mjs
      - name: Preserve cold load, truncated-file, context-loss and retry gates
        run: node restart/fish-yellowfin-teacher-r2/web-r010/qa_openfix.mjs
      - name: Preserve actual browser image evidence
        if: always()
        run: python restart/fish-yellowfin-teacher-r2/web-r010/delivery.py review
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fish-r010-code-data-browser-evidence
          path: |
            dist/fish-mother-yellowfin
            restart/fish-yellowfin-teacher-r2/web-r010
          retention-days: 30
      - name: Exact predecessor and single-publisher safety gate
        run: python restart/fish-yellowfin-teacher-r2/web-r010/delivery.py predecessor
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: public
          sparse-checkout: fish-mother-yellowfin
      - name: Archive exact merged R009 and publish only the Fish directory
        run: python restart/fish-yellowfin-teacher-r2/web-r010/delivery.py publish
      - name: Verify full bare and versioned public page hashes
        run: python restart/fish-yellowfin-teacher-r2/web-r010/delivery.py wait
      - name: Final-public full source-tail and inherited regressions
        env:
          PUBLIC_URL: https://haihao0307.github.io/guilin-dem-pipeline/fish-mother-yellowfin/?v=r010
        run: node restart/fish-yellowfin-teacher-r2/web-r010/qa_regression.mjs
      - name: Final-public cold-start and error recovery
        env:
          PUBLIC_URL: https://haihao0307.github.io/guilin-dem-pipeline/fish-mother-yellowfin/?v=r010
        run: node restart/fish-yellowfin-teacher-r2/web-r010/qa_openfix.mjs
      - name: Persist exact-head public proof, not biological or user-device approval
        run: python restart/fish-yellowfin-teacher-r2/web-r010/delivery.py proof
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fish-r010-public-proof
          path: |
            dist/fish-mother-yellowfin/PUBLIC_BROWSER_QA.json
            dist/fish-mother-yellowfin/PUBLICATION_PROOF.json
            dist/fish-mother-yellowfin/OPENFIX_QA.json
            dist/fish-mother-yellowfin/PUBLIC_OPENFIX_QA.json
