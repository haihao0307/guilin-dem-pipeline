name: A4 A6 public Pages fixed-axis verification
on:
  push:
    branches: ['qa/a4-a6-source-comparison-r01-20261017']
    paths: ['.github/workflows/a4-a6-source-comparison-qa.yml', 'kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01/a4-a6-source-comparison-r01/tests/browser.cjs']
permissions:
  contents: read
jobs:
  public-pages:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01/a4-a6-source-comparison-r01
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01/a4-a6-source-comparison-r01
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install approved pinned Chromium testing dependencies
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Wait for exact repaired public entry bytes, never test stale deployment
        env:
          ENTRY: https://haihao0307.github.io/guilin-dem-pipeline/kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01/a4-a6-source-comparison-r01/
        run: |
          for attempt in $(seq 1 80); do
            curl -fsSL --max-time 30 "$ENTRY?commit=abb101e5c84fa2941068c3155d5af505925efb74&attempt=$attempt" -o /tmp/public-entry.html || true
            if echo 'dcccf7614cf941f6976ed910f6e1a27b6b8915647052c73dcb1553c574604c0a  /tmp/public-entry.html' | sha256sum -c -; then exit 0; fi
            sleep 10
          done
          echo 'Expected repaired entry never became public'; exit 1
      - name: Verify actual public WebGL source scenes, animation and interactions
        env:
          TEST_URL: https://haihao0307.github.io/guilin-dem-pipeline/kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01/a4-a6-source-comparison-r01/?commit=abb101e5c84fa2941068c3155d5af505925efb74
          TEST_QA_DIR: qa/axis-public-final
          TEST_TIMEOUT_MS: '240000'
        run: npm run test:browser
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: a4-a6-public-fixed-axis-final-${{ github.sha }}
          path: kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01/a4-a6-source-comparison-r01/qa/axis-public-final/
          retention-days: 14
          if-no-files-found: error
