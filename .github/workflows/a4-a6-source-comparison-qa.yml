name: A4 A6 public Pages loading verification
on:
  push:
    branches: ['qa/a4-a6-source-comparison-r01-20261017']
    paths: ['.github/workflows/a4-a6-source-comparison-qa.yml']
permissions:
  contents: read
jobs:
  public-pages:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01/a4-a6-source-comparison-r01
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01/a4-a6-source-comparison-r01
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install approved pinned Chromium testing dependencies
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Wait for exact repaired public entry bytes, never test stale deployment
        env:
          ENTRY: https://haihao0307.github.io/guilin-dem-pipeline/kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01/a4-a6-source-comparison-r01/
        run: |
          for attempt in $(seq 1 80); do
            curl -fsSL --max-time 30 "$ENTRY?commit=7f0d366e48741abdd09c35f00d7767a2f554fa78&attempt=$attempt" -o /tmp/public-entry.html || true
            if echo '7f23db26218104d299ceb03b7563e4942f2262c94a87af83a43834ea2dbe5931  /tmp/public-entry.html' | sha256sum -c -; then exit 0; fi
            sleep 10
          done
          echo 'Expected repaired entry never became public'; exit 1
      - name: Verify actual public WebGL source scenes, animation and interactions
        env:
          TEST_URL: https://haihao0307.github.io/guilin-dem-pipeline/kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01/a4-a6-source-comparison-r01/?commit=7f0d366e48741abdd09c35f00d7767a2f554fa78
          TEST_QA_DIR: qa/public-final
          TEST_TIMEOUT_MS: '240000'
        run: npm run test:browser
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: a4-a6-public-loading-final-${{ github.sha }}
          path: kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01/a4-a6-source-comparison-r01/qa/public-final/
          retention-days: 14
          if-no-files-found: error
