name: Wenzhou Weather workbench build and public verification
on:
  push:
    branches: [project/wenzhou-v200-17tile-truth-hydrology-rebuild]
    paths:
      - .github/workflows/wenzhou-weather-workbench.yml
      - projects/wenzhou/v200/web/workbench/**
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: wenzhou-weather-workbench-publication
  cancel-in-progress: false
jobs:
  verified-workbench:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ROOT: projects/wenzhou/v200/web/workbench
      INPUTS: /tmp/wenzhou-weather-inputs
      SITE: /tmp/wenzhou-weather-site
      EVIDENCE: /tmp/wenzhou-weather-evidence
      URL: https://haihao0307.github.io/guilin-dem-pipeline/wenzhou-v7-full/workbench/?v=weather110-r1
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
          sparse-checkout: |
            projects/wenzhou/v200
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Acquire exact pinned package and source-backed numeric baseline
        run: |
          python - <<'PY'
          import hashlib,json,os,shutil,stat,urllib.request,zipfile
          from pathlib import Path,PurePosixPath
          root=Path(os.environ['INPUTS']);root.mkdir()
          evidence=Path(os.environ['EVIDENCE']);evidence.mkdir()
          ref='fa69b5c7fed1a71339127776d0f3e44f9152c5a0'
          base='https://raw.githubusercontent.com/haihao0307/guilin-dem-pipeline/'+ref+'/'
          def get(path):
              with urllib.request.urlopen(base+path,timeout=90) as r:return r.read()
          data=get('weather-mother/distributions/Weather_Mother_Full_Clean_V1.1.0.zip')
          assert len(data)==46075 and hashlib.sha256(data).hexdigest()=='ac1cd919b007eff60f2288106ca32cb8ff7f96ea8e02e52cec16d8045bb6ae6e'
          p=root/'Weather_Mother_Full_Clean_V1.1.0.zip';p.write_bytes(data)
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              for i in z.infolist():
                  n=PurePosixPath(i.filename);assert not n.is_absolute() and '..' not in n.parts and not stat.S_ISLNK(i.external_attr>>16)
              z.extractall(root/'weather')
          vectors=get('wenzhou-v7/data/vectors.json.gz')
          assert len(vectors)==6044961 and hashlib.sha256(vectors).hexdigest()=='30c3411dea02dfa85482772a1f3afdcd8fff487907786310c5415476370cad39'
          (root/'wenzhou-vectors.json.gz').write_bytes(vectors)
          shutil.copytree('projects/wenzhou/v200/web/v7-full',root/'wenzhou-full-source')
          shutil.copyfile('projects/wenzhou/v200/web/workbench/ADOPTION.json',evidence/'ADOPTION.json')
          report={'upstreamReadRef':ref,'zipSha256':hashlib.sha256(data).hexdigest(),'vectorSha256':hashlib.sha256(vectors).hexdigest(),'attachmentCompared':False,'sourceDeleted':False,'upstreamModified':False}
          (evidence/'INPUTS.json').write_text(json.dumps(report,indent=2)+'\n')
          PY
      - name: Install pinned numeric and browser dependencies
        run: |
          python -m pip install --quiet 'numpy<3' 'shapely==2.1.2' pillow playwright
          python -m playwright install --with-deps chromium
      - name: Build verified inputs and test adapter fixtures
        run: |
          set -euo pipefail
          python "$ROOT/assemble.py" "$INPUTS" "$ROOT" "$SITE"
          node --test "$ROOT/bridge.test.mjs" | tee "$EVIDENCE/bridge-fixture-tests.tap"
          for f in "$SITE"/*.js "$SITE"/*.mjs "$SITE"/terrain/*.js; do node --check "$f"; done
      - name: Actual desktop and mobile Chromium prepublication tests
        run: |
          set -euo pipefail
          python -m http.server 8765 --directory "$SITE" > "$EVIDENCE/local-http.log" 2>&1 &
          SERVER=$!
          trap 'kill "$SERVER" || true' EXIT
          sleep 2
          python "$ROOT/qa_workbench.py" --url http://127.0.0.1:8765/ --out "$EVIDENCE/local"
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: publication
          fetch-depth: 1
          lfs: false
          sparse-checkout: |
            wenzhou-v7-full/workbench
      - name: Publish only the checked Wenzhou workbench subtree
        run: |
          set -euo pipefail
          mkdir -p publication/wenzhou-v7-full/workbench
          rsync -a --delete "$SITE/" publication/wenzhou-v7-full/workbench/
          cd publication
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- wenzhou-v7-full/workbench
          test -z "$(git diff --cached --name-only | grep -v '^wenzhou-v7-full/workbench/' || true)"
          if ! git diff --cached --quiet; then
            git commit -m "Publish Wenzhou Weather workbench research preview from ${GITHUB_SHA}"
            pushed=0
            for attempt in 1 2 3; do
              if git push origin HEAD:gh-pages; then pushed=1; break; fi
              git fetch origin gh-pages --depth=30
              git rebase origin/gh-pages
            done
            test "$pushed" = '1'
          fi
          git rev-parse HEAD > "$EVIDENCE/publication-commit.txt"
      - name: Verify exact public HTML and all required assets
        run: |
          gh api --method POST repos/haihao0307/guilin-dem-pipeline/pages/builds > "$EVIDENCE/pages-request.json" 2> "$EVIDENCE/pages-request-error.txt" || true
          python - <<'PY'
          import json,hashlib,os,time,urllib.request
          from pathlib import Path
          from datetime import datetime,timezone
          root=Path(os.environ['SITE']);out=Path(os.environ['EVIDENCE']);base=os.environ['URL'].split('?')[0]
          expected=hashlib.sha256((root/'BUILD.json').read_bytes()).hexdigest()
          report={'url':os.environ['URL'],'checkedUtc':datetime.now(timezone.utc).isoformat(),'passed':False,'files':[],'attempts':[],'sourceCommit':os.environ['GITHUB_SHA'],'publicationCommit':(out/'publication-commit.txt').read_text().strip()}
          def get(url):
              req=urllib.request.Request(url,headers={'Accept-Encoding':'identity','Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=45) as r:return r.status,r.read()
          try:
              ready=False
              for n in range(80):
                  try:
                      status,b=get(base+'BUILD.json?check='+str(n));actual=hashlib.sha256(b).hexdigest();ready=status==200 and actual==expected
                      report['attempts'].append({'attempt':n,'status':status,'exactBuildMatch':ready})
                      if ready:break
                  except Exception as e:report['attempts'].append({'attempt':n,'error':str(e)})
                  time.sleep(6)
              assert ready,'Exact build did not become public'
              status,entry=get(os.environ['URL']);assert status==200 and entry==(root/'index.html').read_bytes()
              for p in sorted(root.rglob('*')):
                  if not p.is_file():continue
                  name=p.relative_to(root).as_posix();wanted=hashlib.sha256(p.read_bytes()).hexdigest();status,data=get(base+name+'?sha='+wanted[:16])
                  assert status==200 and hashlib.sha256(data).hexdigest()==wanted,(name,status)
                  report['files'].append({'path':name,'httpStatus':status,'sha256':wanted,'bytes':len(data),'exactMatch':True})
              report['passed']=True
          finally:(out/'PUBLIC_HTTP.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          PY
      - name: Fresh actual PUBLIC desktop and mobile Chromium verification
        run: python "$ROOT/qa_workbench.py" --url "$URL" --out "$EVIDENCE/public"
      - name: Record exact-build public receipt on Wenzhou branch
        run: |
          set -euo pipefail
          target=projects/wenzhou/v200/reports/weather-workbench
          mkdir -p "$target"
          cp "$EVIDENCE/PUBLIC_HTTP.json" "$target/"
          cp "$EVIDENCE/public/browser-qa.json" "$target/"
          cp "$SITE/BUILD.json" "$target/"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$target"
          git diff --cached --quiet || git commit -m 'Record actual public Wenzhou Weather workbench verification [skip ci]'
          git push origin HEAD:project/wenzhou-v200-17tile-truth-hydrology-rebuild
      - name: Retain actual success or failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wenzhou-weather-workbench-evidence
          path: |
            /tmp/wenzhou-weather-evidence
            /tmp/wenzhou-weather-site
          retention-days: 30
          if-no-files-found: error
      - name: Summarize only observed readiness
        if: always()
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ['EVIDENCE'])/'public/browser-qa.json';passed=p.exists() and json.loads(p.read_text()).get('passed') is True
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write('Actual public browser check passed: '+str(passed)+'\n\nTwo renderers; no shared depth. 800 m whole-domain overview. Full native tile loading incomplete. Source deleted: false. Human and production approvals: false.\n')
          PY
