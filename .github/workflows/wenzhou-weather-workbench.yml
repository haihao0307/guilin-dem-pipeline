name: Wenzhou visible Weather emergency publication
on:
  push:
    branches: [project/wenzhou-v200-17tile-truth-hydrology-rebuild]
    paths:
      - .github/workflows/wenzhou-weather-workbench.yml
  workflow_dispatch:
permissions:
  actions: read
  contents: write
  pages: write
concurrency:
  group: wenzhou-visible-weather-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      EVIDENCE: /tmp/wenzhou-visible-weather-evidence
      URL: https://haihao0307.github.io/guilin-dem-pipeline/wenzhou-v7-full/workbench/?v=visible-weather-r4
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recover the already built one-canvas site from verified run 11
        run: |
          set -euo pipefail
          mkdir -p /tmp/wenzhou-recovery "$EVIDENCE"
          gh run download 33636189112 \
            --repo haihao0307/guilin-dem-pipeline \
            --name wenzhou-single-scene-weather-workbench-evidence \
            --dir /tmp/wenzhou-recovery
          site="$(find /tmp/wenzhou-recovery -type f -path '*/wenzhou-weather-site/BUILD.json' -printf '%h\n' | head -n 1)"
          test -n "$site"
          test -f "$site/index.html"
          test -f "$site/runtime.js"
          test -f "$site/weather-scene.mjs"
          echo "SITE=$site" >> "$GITHUB_ENV"
          cp "$site/BUILD.json" "$EVIDENCE/source-BUILD.json"
      - name: Remove the GPU fence that froze weather animation at 2560 by 1600
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          path=Path(os.environ['SITE'])/'runtime.js'
          text=path.read_text(encoding='utf-8')
          old="if(S.fence){let r=g.clientWaitSync(S.fence,0,0);if(r===g.TIMEOUT_EXPIRED)return false;g.deleteSync(S.fence);S.fence=null;if(r===g.WAIT_FAILED)throw Error('GPU同步失败');}"
          old_tail="S.fence=g.fenceSync(g.SYNC_GPU_COMMANDS_COMPLETE,0);g.flush();"
          assert text.count(old)==1
          assert text.count(old_tail)==1
          text=text.replace(old,'').replace(old_tail,'g.flush();')
          path.write_text(text,encoding='utf-8')
          PY
          node --check "$SITE/runtime.js"
          node --check "$SITE/weather-scene.mjs"
      - name: Install Chromium QA
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Prove visible weather and moving frames before publication
        run: |
          set -euo pipefail
          python -m http.server 8765 --directory "$SITE" > "$EVIDENCE/local-http.log" 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          sleep 2
          python - <<'PY'
          import json,os
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          out=Path(os.environ['EVIDENCE'])
          report={'passed':False,'viewport':[2560,1600],'cases':[]}
          with sync_playwright() as p:
              browser=p.chromium.launch(
                  headless=True,
                  args=['--no-sandbox','--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader','--disable-dev-shm-usage']
              )
              context=browser.new_context(viewport={'width':2560,'height':1600},device_scale_factor=1)
              page=context.new_page()
              page.set_default_timeout(240000)
              errors=[]
              page.on('console',lambda m: errors.append(m.text) if m.type=='error' else None)
              page.on('pageerror',lambda e: errors.append(str(e)))
              response=page.goto('http://127.0.0.1:8765/',wait_until='domcontentloaded',timeout=120000)
              assert response and response.status==200
              page.wait_for_function("window.__WZ_FULL__?.ready && window.__WZ_FULL__?.weather?.ready && window.__WZ_FULL__?.cloudRendered",timeout=240000)
              page.locator('#coast').click()
              for case_id in ['coast','rain','typhoon']:
                  page.locator('#weatherCase').select_option(case_id)
                  page.wait_for_function(
                      "(id)=>window.__WZ_FULL__?.weather?.caseId===id && window.__WZ_FULL__?.weather?.ready && window.__WZ_FULL__?.cloudRendered",
                      arg=case_id,
                      timeout=240000
                  )
                  page.wait_for_timeout(900)
                  state=page.evaluate("window.__WZ_FULL__")
                  metrics=state['weather']['fieldMetrics']
                  assert metrics and metrics['baseM']>0 and metrics['topM']>metrics['baseM']
                  assert state['oneCanvas'] and state['oneCamera'] and state['iframeCount']==0
                  assert state['sameWebGLContext'] and state['sharedDepth']
                  assert state['errors']==[]
                  page.screenshot(path=str(out/f'prepublish-{case_id}-2560x1600.png'),timeout=120000)
                  report['cases'].append({'id':case_id,'baseM':metrics['baseM'],'topM':metrics['topM'],'frames':state['frames']})
              before=page.evaluate("window.__WZ_FULL__.frames")
              page.wait_for_timeout(3000)
              after=page.evaluate("window.__WZ_FULL__.frames")
              assert after-before>=3,(before,after)
              assert errors==[],errors
              report['frames']=[before,after]
              report['passed']=True
              context.close()
              browser.close()
          (out/'prepublish-qa.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: publication
          fetch-depth: 30
          lfs: false
          sparse-checkout: |
            wenzhou-v7-full/workbench
      - name: Publish only the proven Wenzhou workbench
        run: |
          set -euo pipefail
          mkdir -p publication/wenzhou-v7-full/workbench
          rsync -a --delete "$SITE/" publication/wenzhou-v7-full/workbench/
          cd publication
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- wenzhou-v7-full/workbench
          test -z "$(git diff --cached --name-only | grep -v '^wenzhou-v7-full/workbench/' || true)"
          if ! git diff --cached --quiet; then
            git commit -m "Publish visible Wenzhou Weather workbench from ${GITHUB_SHA}"
            pushed=0
            for attempt in 1 2 3; do
              if git push origin HEAD:gh-pages; then pushed=1; break; fi
              git fetch origin gh-pages --depth=30
              git rebase origin/gh-pages
            done
            test "$pushed" = '1'
          fi
          git rev-parse HEAD > "$EVIDENCE/publication-commit.txt"
      - name: Verify the exact public build and visible weather
        run: |
          python - <<'PY'
          import json,os,time,urllib.request
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          site=Path(os.environ['SITE'])
          out=Path(os.environ['EVIDENCE'])
          url=os.environ['URL']
          base=url.split('?')[0]
          expected=(site/'BUILD.json').read_bytes()
          def get(target):
              request=urllib.request.Request(target,headers={'Accept-Encoding':'identity','Cache-Control':'no-cache'})
              with urllib.request.urlopen(request,timeout=45) as response:
                  return response.status,response.read()
          for attempt in range(80):
              try:
                  status,data=get(base+'BUILD.json?attempt='+str(attempt))
                  if status==200 and data==expected:
                      break
              except Exception:
                  pass
              time.sleep(6)
          else:
              raise RuntimeError('exact public build did not appear')
          for name in ['index.html','runtime.js','weather-scene.mjs','BUILD.json','modules/weather-mother/field-worker.js']:
              status,data=get(base+name+'?proof='+str(time.time_ns()))
              wanted=(site/name).read_bytes()
              assert status==200 and data==wanted,(name,status,len(data),len(wanted))
          report={'passed':False,'url':url,'viewport':[2560,1600]}
          with sync_playwright() as p:
              browser=p.chromium.launch(
                  headless=True,
                  args=['--no-sandbox','--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader','--disable-dev-shm-usage']
              )
              context=browser.new_context(viewport={'width':2560,'height':1600},device_scale_factor=1)
              page=context.new_page()
              page.set_default_timeout(240000)
              errors=[]
              page.on('console',lambda m: errors.append(m.text) if m.type=='error' else None)
              page.on('pageerror',lambda e: errors.append(str(e)))
              response=page.goto(url,wait_until='domcontentloaded',timeout=120000)
              assert response and response.status==200
              page.wait_for_function("window.__WZ_FULL__?.ready && window.__WZ_FULL__?.weather?.ready && window.__WZ_FULL__?.cloudRendered",timeout=240000)
              page.locator('#coast').click()
              page.wait_for_timeout(1200)
              before=page.evaluate("window.__WZ_FULL__.frames")
              page.wait_for_timeout(3000)
              after=page.evaluate("window.__WZ_FULL__.frames")
              state=page.evaluate("window.__WZ_FULL__")
              assert after-before>=3,(before,after)
              assert state['oneCanvas'] and state['iframeCount']==0
              assert state['sameWebGLContext'] and state['sharedDepth']
              assert state['weather']['fieldMetrics']['baseM']>0
              assert errors==[],errors
              page.screenshot(path=str(out/'public-visible-weather-2560x1600.png'),timeout=120000)
              report.update({
                  'passed':True,
                  'frames':[before,after],
                  'caseId':state['weather']['caseId'],
                  'cloudBaseM':state['weather']['fieldMetrics']['baseM'],
                  'cloudTopM':state['weather']['fieldMetrics']['topM'],
                  'publicationCommit':(out/'publication-commit.txt').read_text().strip(),
                  'errors':errors
              })
              context.close()
              browser.close()
          (out/'public-qa.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wenzhou-visible-weather-publication-evidence
          path: |
            /tmp/wenzhou-visible-weather-evidence
            /tmp/wenzhou-recovery
          retention-days: 30
          if-no-files-found: error
