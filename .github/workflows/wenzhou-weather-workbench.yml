name: Wenzhou V0.5.4 real cloud public HTML
on:
  push:
    branches: [project/wenzhou-v200-17tile-truth-hydrology-rebuild]
    paths:
      - .github/workflows/wenzhou-weather-workbench.yml
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: wenzhou-v054-real-cloud-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
          lfs: false
          sparse-checkout: |
            .github/workflows/wenzhou-weather-workbench.yml
            projects/wenzhou/v200/web/workbench
            projects/wenzhou/v200/reports
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: publication
          fetch-depth: 50
          lfs: false
          sparse-checkout: |
            wenzhou-v7-full/workbench
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify, publish and publicly recheck V0.5.4
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat projects/wenzhou/v200/web/workbench/v054-deploy-bundle/part*.txt > /tmp/wz054-deploy.b64
          base64 -d /tmp/wz054-deploy.b64 > /tmp/wz054-deploy.sh
          echo '5c95c38210245ba127741dc9cb06ca73683c3d35557e3d5fdb7f16a27c0d82c7  /tmp/wz054-deploy.sh' | sha256sum -c -
          chmod +x /tmp/wz054-deploy.sh
          /tmp/wz054-deploy.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wenzhou-v054-real-cloud-publication-evidence
          path: /tmp/wenzhou-v054-evidence
          retention-days: 30
          if-no-files-found: error
