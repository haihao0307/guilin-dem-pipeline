name: Install Wenzhou single scene payload
on:
  push:
    branches: [project/wenzhou-v200-17tile-truth-hydrology-rebuild]
    paths:
      - .github/workflows/wenzhou-weather-workbench.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: wenzhou-single-scene-bootstrap
  cancel-in-progress: false
jobs:
  install-exact-payload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: project/wenzhou-v200-17tile-truth-hydrology-rebuild
          fetch-depth: 0
          lfs: false
      - name: Verify and install exact prepared payload
        run: |
          set -euo pipefail
          parts=(projects/wenzhou/v200/bootstrap/single-scene-v030.part*.b64)
          test "${#parts[@]}" -eq 6
          cat "${parts[@]}" | base64 --decode > /tmp/wenzhou-single-scene-v030.tar.gz
          echo "06dbd1c338a4b89ebe1b75a63273f4a746fdce1d6ba9855c548c334aefbc4387  /tmp/wenzhou-single-scene-v030.tar.gz" | sha256sum --check --strict
          tar -tzf /tmp/wenzhou-single-scene-v030.tar.gz > /tmp/payload-files.txt
          test "$(wc -l < /tmp/payload-files.txt)" -eq 9
          grep -Fx '.github/workflows/wenzhou-weather-workbench.yml' /tmp/payload-files.txt
          grep -Fx 'projects/wenzhou/v200/web/workbench/terrain-index.html' /tmp/payload-files.txt
          grep -Fx 'projects/wenzhou/v200/web/workbench/terrain-runtime.js' /tmp/payload-files.txt
          grep -Fx 'projects/wenzhou/v200/web/workbench/terrain-shaders.js' /tmp/payload-files.txt
          grep -Fx 'projects/wenzhou/v200/web/workbench/weather-scene.mjs' /tmp/payload-files.txt
          grep -Fx 'projects/wenzhou/v200/web/workbench/ADOPTION.json' /tmp/payload-files.txt
          grep -Fx 'projects/wenzhou/v200/web/workbench/assemble.py' /tmp/payload-files.txt
          grep -Fx 'projects/wenzhou/v200/web/workbench/qa_workbench.py' /tmp/payload-files.txt
          grep -Fx 'projects/wenzhou/v200/web/workbench/SINGLE_SCENE_ARCHITECTURE.md' /tmp/payload-files.txt
          tar -xzf /tmp/wenzhou-single-scene-v030.tar.gz -C .
          rm -- "${parts[@]}"
      - name: Check installed source without changing truth assets
        run: |
          set -euo pipefail
          root=projects/wenzhou/v200/web/workbench
          python -m py_compile "$root/assemble.py" "$root/qa_workbench.py"
          node --check "$root/terrain-runtime.js"
          node --check "$root/terrain-shaders.js"
          node --check "$root/weather-scene.mjs"
          python -m json.tool "$root/ADOPTION.json" > /dev/null
          test "$(grep -o '<canvas' "$root/terrain-index.html" | wc -l)" -eq 1
          test "$(grep -oi '<iframe' "$root/terrain-index.html" | wc -l)" -eq 0
          grep -F 'wenzhou-workbench-0.3.0-single-scene-weather110' "$root/assemble.py"
          grep -F 'oneCanvas' "$root/ADOPTION.json"
          grep -F 'sharedWebGLDepth' "$root/ADOPTION.json"
          grep -F 'fullNativeOnline' "$root/ADOPTION.json"
      - name: Commit only authorized Wenzhou paths
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- .github/workflows/wenzhou-weather-workbench.yml projects/wenzhou/v200/web/workbench projects/wenzhou/v200/bootstrap
          unexpected="$(git diff --cached --name-only | grep -vE '^(\.github/workflows/wenzhou-weather-workbench\.yml|projects/wenzhou/v200/web/workbench/|projects/wenzhou/v200/bootstrap/)' || true)"
          test -z "$unexpected"
          test -n "$(git diff --cached --name-only)"
          git commit -m 'Build Wenzhou single scene Weather workbench V0.3.0'
          git push origin HEAD:project/wenzhou-v200-17tile-truth-hydrology-rebuild
