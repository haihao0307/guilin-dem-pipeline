name: Test Guilin canonical release browser range

on:
  push:
    branches:
      - project/guilin-canonical-elevation-store-v1
    paths:
      - tests/browser_release_range_cors.py
      - .github/workflows/test-guilin-canonical-release-range.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  ASSET_URL: https://github.com/haihao0307/guilin-dem-pipeline/releases/download/guilin-canonical-elevation-store-12p5m-v1/elevation-shard-000.i16pack
  EVIDENCE_DIR: out/range-cors-evidence

jobs:
  browser-range-cors:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install browser test dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check requests==2.32.4 websocket-client==1.8.0
          if ! command -v google-chrome >/dev/null 2>&1 && \
             ! command -v google-chrome-stable >/dev/null 2>&1 && \
             ! command -v chromium >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y chromium
          fi

      - name: Serve a foreign-origin page
        run: |
          set -euo pipefail
          mkdir -p /tmp/guilin-range-page "$EVIDENCE_DIR"
          printf '%s\n' '<!doctype html><meta charset="utf-8"><title>Guilin range CORS probe</title>' > /tmp/guilin-range-page/index.html
          python -m http.server 8765 --bind 127.0.0.1 --directory /tmp/guilin-range-page > "$EVIDENCE_DIR/http.log" 2>&1 &
          echo $! > "$EVIDENCE_DIR/server.pid"
          for attempt in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:8765/ >/dev/null && break
            sleep .25
          done

      - name: Verify browser CORS and 1024-byte HTTP range
        run: |
          set -euo pipefail
          python tests/browser_release_range_cors.py \
            --page-url http://127.0.0.1:8765/ \
            --asset-url "$ASSET_URL" \
            --receipt "$EVIDENCE_DIR/BROWSER_RANGE_CORS.json"

      - name: Verify server-side range behavior
        if: always()
        run: |
          set -euo pipefail
          curl --fail --location \
            --header 'Range: bytes=0-1023' \
            --dump-header "$EVIDENCE_DIR/curl-headers.txt" \
            --output "$EVIDENCE_DIR/curl-range.bin" \
            "$ASSET_URL"
          test "$(stat -c '%s' "$EVIDENCE_DIR/curl-range.bin")" = 1024

      - name: Stop local server
        if: always()
        run: |
          kill "$(cat "$EVIDENCE_DIR/server.pid")" 2>/dev/null || true

      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guilin-canonical-release-range-cors-${{ github.run_id }}
          path: ${{ env.EVIDENCE_DIR }}
          retention-days: 30
          compression-level: 0
