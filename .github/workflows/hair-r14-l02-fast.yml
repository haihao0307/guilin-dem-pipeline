name: Hair L02 frozen release audit (manual read-only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-frozen-files:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            kaopu-hair-workbench/fusion/r14-fast
      - name: Verify committed native site and lossless chunks without rebuilding or publishing
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          p=Path('kaopu-hair-workbench/fusion/r14-fast')
          m=json.loads((p/'BUILD_MANIFEST.json').read_text())
          assert hashlib.sha256((p/'site/index.html').read_bytes()).hexdigest()==m['htmlSha256']
          a=json.loads((p/'ASSET_MANIFEST.json').read_text())
          chunks=0
          for item in a['assets'].values():
              for c in item['chunks']:
                  b=(p/'site'/c['path']).read_bytes()
                  assert len(b)==c['bytes'] and hashlib.sha256(b).hexdigest()==c['sha256'],c['path']
                  chunks+=1
          for f in json.loads((p/'UNCHANGED_RUNTIME.json').read_text())['files']:
              assert hashlib.sha256((p/f['path']).read_bytes()).hexdigest()==f['sha256'],f['path']
          print(json.dumps({'readOnly':True,'htmlSha256':m['htmlSha256'],'verifiedChunks':chunks,'changedFiles':0}))
          PY
