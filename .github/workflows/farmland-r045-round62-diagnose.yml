name: farmland-r045-round62-diagnose
on:
  push:
    branches: [restart/farmland-object-dna-v020-20260907]
    paths:
      - 'farmland-object-dna/research/r045-autonomous-rebuild/round-62/r045_round62_diagnose.mjs'
      - '.github/workflows/farmland-r045-round62-diagnose.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose frozen-seed companion rejection
        run: node farmland-object-dna/research/r045-autonomous-rebuild/round-62/r045_round62_diagnose.mjs
      - name: Persist diagnostic
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898242+github-actions[bot]@users.noreply.github.com'
          git add farmland-object-dna/research/r045-autonomous-rebuild/round-62/r045_round62_diagnostic_result.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'farmland R045.62 persist companion diagnostic [skip ci]'
          git push origin HEAD:${GITHUB_REF_NAME}
