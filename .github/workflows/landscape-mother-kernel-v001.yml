name: Landscape Mother Kernel V1

on:
  push:
    branches: [feature/landscape-mother-kernel-v001]
    paths:
      - landscape-mother/**
      - tests/landscape_mother_browser_qa.mjs
      - .github/workflows/landscape-mother-kernel-v001.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: landscape-mother-kernel-v001
  cancel-in-progress: true

env:
  SITE_DIR: build/landscape-mother-v001
  INPUT_DIR: build/landscape-mother-input
  DESTINATION_DIR: landscape-mother-v001
  SOURCE_TIFF_SHA256: 9490b1bd34f67336352cf448729f763ae4e241637d821961efd0290e29d6c9d4
  TILE_FILE: native-r07-c02-2048x2048-i16.bin
  TILE_SHA256: 5408050e693e4a4679dd39fe96b473067dec515c23a7f53954c707e74e303215
  TILE_BYTES: '8388608'

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}

      - name: Validate modular kernel and image-free source
        shell: bash
        run: |
          set -euo pipefail
          for f in landscape-mother/*.js tests/landscape_mother_browser_qa.mjs; do node --check "$f"; done
          python -m py_compile landscape-mother/tools/build_sample.py
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('landscape-mother')
          ext={'.png','.jpg','.jpeg','.webp','.gif','.svg','.bmp','.tif','.tiff','.ktx','.ktx2','.dds','.exr','.hdr'}
          bad=[p.as_posix() for p in root.rglob('*') if p.is_file() and p.suffix.lower() in ext]
          assert not bad,bad
          runtime=[root/'index.html',root/'style.css',*sorted(root.glob('*.js'))]
          text='\n'.join(p.read_text(encoding='utf-8') for p in runtime)
          tokens=['<img','<picture','<svg','data:image/','background-image','sampler2D','texture2D(','new Image(','createImageBitmap(','toDataURL(','toBlob(']
          assert not [t for t in tokens if t in text]
          c=json.loads((root/'contract.json').read_text(encoding='utf-8'))
          assert c['schema']=='landscape-mother-kernel/v1'
          assert c['renderMode']=='interactive-webgl2-3d'
          assert c['sample']['truthGrid']==[81,81] and c['sample']['truthSpacingM']==12.5
          assert c['sample']['desktopRenderGrid']==[641,641] and c['sample']['mobileRenderGrid']==[321,321]
          r=c['rules']
          assert r['truthOverwrite'] is False and r['sourceResampling'] is False and r['syntheticGapFill'] is False
          assert r['verticalScale']==1.0 and r['proceduralMacroMountains'] is False
          for k in ('materialTextureCount','terrainImageTextureCount','imageFileCount','screenshotArtifactCount','plantLayerCount','vegetationInstanceCount'): assert r[k]==0
          assert r['interactive3DRequired'] is True and r['numericQaOnly'] is True
          assert c['approvals']=={'visualAcceptance':False,'productionReady':False}
          print({'runtime_js_files':len(list(root.glob('*.js'))),'image_files':0,'texture_files':0})
          PY

      - name: Fetch locked canonical numeric inputs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$INPUT_DIR" "$SITE_DIR"
          mkdir -p "$INPUT_DIR" "$SITE_DIR/data" "$SITE_DIR/qa"
          git fetch --depth=1 origin gh-pages:refs/remotes/origin/gh-pages
          git show origin/gh-pages:guilin/data/NATIVE_ELEVATION_MANIFEST.json > "$INPUT_DIR/NATIVE_ELEVATION_MANIFEST.json"
          curl --fail --location --retry 5 --retry-all-errors \
            "https://github.com/haihao0307/guilin-dem-pipeline/releases/download/guilin-native-12p5m-single-truth-v001/$TILE_FILE" \
            --output "$INPUT_DIR/$TILE_FILE"
          git show origin/gh-pages:guilin/data/osm-waterways-manifest.json > "$INPUT_DIR/osm-waterways-manifest.json"
          SEGMENT_FILE="$(python - <<'PY'
          import json
          from pathlib import Path
          p=Path('build/landscape-mother-input/osm-waterways-manifest.json')
          print(json.loads(p.read_text(encoding='utf-8'))['segments']['file'])
          PY
          )"
          git show "origin/gh-pages:guilin/data/$SEGMENT_FILE" > "$INPUT_DIR/$SEGMENT_FILE"
          printf '%s' "$SEGMENT_FILE" > "$INPUT_DIR/segment-file.txt"
          test "$(stat -c '%s' "$INPUT_DIR/$TILE_FILE")" = "$TILE_BYTES"
          test "$(sha256sum "$INPUT_DIR/$TILE_FILE" | cut -d' ' -f1)" = "$TILE_SHA256"

      - name: Extract compact exact sample
        shell: bash
        run: |
          set -euo pipefail
          SEGMENT_FILE="$(cat "$INPUT_DIR/segment-file.txt")"
          python landscape-mother/tools/build_sample.py \
            --contract landscape-mother/contract.json \
            --dem-manifest "$INPUT_DIR/NATIVE_ELEVATION_MANIFEST.json" \
            --parent-tile "$INPUT_DIR/$TILE_FILE" \
            --hydrology-manifest "$INPUT_DIR/osm-waterways-manifest.json" \
            --hydrology-segments "$INPUT_DIR/$SEGMENT_FILE" \
            --output "$SITE_DIR/data"

      - name: Assemble compact procedural-only runtime
        shell: bash
        run: |
          set -euo pipefail
          cp landscape-mother/README.md landscape-mother/contract.json landscape-mother/index.html landscape-mother/style.css "$SITE_DIR/"
          cp landscape-mother/*.js "$SITE_DIR/"
          touch "$SITE_DIR/.nojekyll"
          rm -rf "$INPUT_DIR"
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('build/landscape-mother-v001')
          ext={'.png','.jpg','.jpeg','.webp','.gif','.svg','.bmp','.tif','.tiff','.ktx','.ktx2','.dds','.exr','.hdr'}
          bad=[p.as_posix() for p in root.rglob('*') if p.is_file() and p.suffix.lower() in ext]
          assert not bad,bad
          text='\n'.join(p.read_text(encoding='utf-8') for p in root.rglob('*') if p.is_file() and p.suffix.lower() in {'.html','.css','.js'})
          tokens=['<img','<picture','<svg','data:image/','background-image','sampler2D','texture2D(','new Image(','createImageBitmap(','toDataURL(','toBlob(']
          assert not [t for t in tokens if t in text]
          d=json.loads((root/'data/sample-manifest.json').read_text(encoding='utf-8'))
          data_bytes=sum(p.stat().st_size for p in (root/'data').iterdir() if p.is_file())
          code_bytes=sum(p.stat().st_size for p in root.iterdir() if p.is_file())
          assert data_bytes<131072,data_bytes
          assert code_bytes<240000,code_bytes
          assert d['receipt']['materialTextureCount']==0 and d['receipt']['imageFileCount']==0 and d['receipt']['plantLayerCount']==0
          print({'code_bytes':code_bytes,'data_bytes':data_bytes,'water_records':d['hydrology']['recordCount']})
          PY

      - name: Install browser QA runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run desktop and mobile numeric WebGL QA
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 4175 --directory "$SITE_DIR" >/tmp/landscape-mother-http.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 45); do curl -fsS http://127.0.0.1:4175/ >/dev/null && break; sleep 1; done
          node tests/landscape_mother_browser_qa.mjs http://127.0.0.1:4175/ "$SITE_DIR/qa"
          kill "$PID" 2>/dev/null || true
          trap - EXIT

      - name: Write numeric release evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          site=Path(os.environ['SITE_DIR'])
          browser=json.loads((site/'qa/browser-qa.json').read_text(encoding='utf-8'))
          sample=json.loads((site/'data/sample-manifest.json').read_text(encoding='utf-8'))
          desktop=browser['results'][0]['finalQa']; mobile=browser['results'][1]['finalQa']
          files={}
          for p in sorted(x for x in site.rglob('*') if x.is_file() and x.name not in {'SHA256SUMS.txt','release-evidence.json'}):
              rel=p.relative_to(site).as_posix(); files[rel]={'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()}
          e={'schema':'landscape-mother-release-evidence/v1','commit':os.environ['GITHUB_SHA'],'branch':os.environ['GITHUB_REF_NAME'],'destinationDir':os.environ['DESTINATION_DIR'],'passed':browser['passed'],'renderMode':desktop['renderMode'],'evidenceType':'numeric-webgl-frame-signatures','truthGrid':desktop['truthGrid'],'desktopRenderGrid':desktop['renderGrid'],'mobileRenderGrid':mobile['renderGrid'],'sourceNodeMaxErrorM':desktop['sourceNodeMaxErrorM'],'sourceCellMeanMaxAbsDeltaM':desktop['sourceCellMeanMaxAbsDeltaM'],'macroBlurMaxAbsDeltaM':desktop['macroBlurMaxAbsDeltaM'],'peakShiftM':desktop['peakShiftM'],'surfaceRangeM':desktop['surfaceRangeM'],'fieldRangeM':desktop['fieldRangeM'],'paddyCoverage':desktop['paddyCoverage'],'waterSegmentCount':desktop['waterSegmentCount'],'terrainVertexCount':desktop['terrainVertexCount'],'terrainTriangleCount':desktop['terrainTriangleCount'],'publicNumericDataBytes':sample['truth']['bytes']+sample['hydrology']['bytes'],'materialTextureCount':0,'terrainImageTextureCount':0,'imageFileCount':0,'screenshotArtifactCount':0,'plantLayerCount':0,'vegetationInstanceCount':0,'proceduralMacroMountains':False,'visualAcceptance':False,'productionReady':False,'sourceTiffSha256':os.environ['SOURCE_TIFF_SHA256'],'parentTileSha256':os.environ['TILE_SHA256'],'files':files}
          (site/'qa/release-evidence.json').write_text(json.dumps(e,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          lines=[]
          for p in sorted(x for x in site.rglob('*') if x.is_file() and x.name!='SHA256SUMS.txt'):
              lines.append(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.relative_to(site).as_posix()}")
          (site/'SHA256SUMS.txt').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY

      - name: Upload JSON-only numeric QA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: landscape-mother-kernel-v001-numeric-qa
          path: build/landscape-mother-v001/qa/*.json
          if-no-files-found: warn
          retention-days: 90

      - name: Publish clean runtime and retire image-bearing predecessors
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force origin gh-pages:refs/remotes/origin/gh-pages
          rm -rf /tmp/landscape-pages
          git worktree add -B landscape-mother-pages /tmp/landscape-pages origin/gh-pages
          rm -rf /tmp/landscape-pages/guilin-mother-sample-v001 /tmp/landscape-pages/guilin-mother-sample-v002 /tmp/landscape-pages/guilin-dem-m03-sample-v001 "/tmp/landscape-pages/$DESTINATION_DIR"
          mkdir -p "/tmp/landscape-pages/$DESTINATION_DIR"
          cp -a "$SITE_DIR"/. "/tmp/landscape-pages/$DESTINATION_DIR/"
          python - <<'PY'
          from pathlib import Path
          root=Path('/tmp/landscape-pages/landscape-mother-v001')
          ext={'.png','.jpg','.jpeg','.webp','.gif','.svg','.bmp','.tif','.tiff','.ktx','.ktx2','.dds','.exr','.hdr'}
          assert not [p.as_posix() for p in root.rglob('*') if p.is_file() and p.suffix.lower() in ext]
          assert not (root/'evidence').exists()
          PY
          cd /tmp/landscape-pages
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "publish: Landscape Mother compact image-free kernel ${GITHUB_SHA}"
            if ! git push origin HEAD:gh-pages; then git fetch origin gh-pages; git rebase origin/gh-pages; git push origin HEAD:gh-pages; fi
          fi

      - name: Verify published identity and no-image gate
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force origin gh-pages:refs/remotes/origin/gh-pages
          git show "origin/gh-pages:$DESTINATION_DIR/contract.json" | grep -q 'landscape-mother-kernel/v1'
          git show "origin/gh-pages:$DESTINATION_DIR/qa/release-evidence.json" | grep -q "${GITHUB_SHA}"
          ! git ls-tree -r --name-only origin/gh-pages "$DESTINATION_DIR" | grep -E '\.(png|jpe?g|webp|gif|svg|bmp|tiff?|ktx2?|dds|exr|hdr)$'
          ! git ls-tree -r --name-only origin/gh-pages | grep -E '^guilin-mother-sample-v00[12]/'

      - name: Write job summary
        if: always()
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          print('# Landscape Mother Kernel V1')
          p=Path('build/landscape-mother-v001/qa/release-evidence.json')
          if not p.exists(): print('\nRelease evidence was not generated.')
          else:
              d=json.loads(p.read_text(encoding='utf-8'))
              for k in ('passed','renderMode','truthGrid','desktopRenderGrid','mobileRenderGrid','sourceNodeMaxErrorM','sourceCellMeanMaxAbsDeltaM','macroBlurMaxAbsDeltaM','peakShiftM','surfaceRangeM','fieldRangeM','waterSegmentCount','publicNumericDataBytes','materialTextureCount','imageFileCount','screenshotArtifactCount','plantLayerCount','proceduralMacroMountains','visualAcceptance','productionReady'): print(f"- {k}: `{d[k]}`")
          PY
