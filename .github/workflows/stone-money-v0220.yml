name: Stone Money shared reef and fish candidate
on:
  push:
    branches: [work/stone-money-island-v0220-reef-reference-20260918]
    paths:
      - .github/workflows/stone-money-v0220.yml
      - .github/scripts/stone-money-public022.py
      - .github/scripts/stone-money-publish022.py
      - games/survivor-palau/source/v0200/**
permissions:
  contents: write
concurrency:
  group: stone-money-v0220
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      url: ${{ steps.publish.outputs.url }}
      sha256: ${{ steps.publish.outputs.sha256 }}
      source: ${{ steps.publish.outputs.source }}
      pages: ${{ steps.publish.outputs.pages }}
    steps:
      - uses: actions/checkout@v4
      - name: Build source and check navigation and shared reef definitions
        run: |
          node games/survivor-palau/source/v0200/fish_wet_navigation.test.cjs
          python games/survivor-palau/source/v0200/build.py
          python games/survivor-palau/source/v0200/verify_reef_reference.py > games/survivor-palau/releases/v0.2.2/REEF_SOURCE_QA.json
      - name: Append isolated immutable candidate
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/stone-money-publish022.py
      - uses: actions/upload-artifact@v4
        with:
          name: reef-candidate-build
          path: games/survivor-palau/releases/v0.2.2/
  fish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SMI_PUBLIC_URL: ${{ needs.build.outputs.url }}
      SMI_EXPECTED_SHA256: ${{ needs.build.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install playwright
      - name: Wait for exact candidate bytes
        run: |
          python - <<'PY'
          import os,time,hashlib,urllib.request
          for i in range(36):
              try:
                  with urllib.request.urlopen(os.environ['SMI_PUBLIC_URL'],timeout=20) as r:data=r.read()
                  assert hashlib.sha256(data).hexdigest()==os.environ['SMI_EXPECTED_SHA256']
                  break
              except Exception:
                  if i==35:raise
                  time.sleep(5)
          PY
      - name: Exercise fish in the real public runtime
        run: timeout 660s python -u games/survivor-palau/source/v0200/verify_fish_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reef-fish-runtime
          path: /tmp/smi-fish-qa/
  ordinary-entry:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SMI_PUBLIC_URL: ${{ needs.build.outputs.url }}
      SMI_EXPECTED_SHA256: ${{ needs.build.outputs.sha256 }}
      SMI_SOURCE_COMMIT: ${{ needs.build.outputs.source }}
      SMI_PAGES_COMMIT: ${{ needs.build.outputs.pages }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: reef-candidate-build
          path: games/survivor-palau/releases/v0.2.2/
      - run: python -m pip install playwright
      - name: Check ordinary desktop and touch entry without QA relocation
        run: timeout 480s python -u .github/scripts/stone-money-public022.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reef-public-entry
          path: |
            games/survivor-palau/releases/v0.2.2/PUBLICATION_PROOF.json
            /tmp/smi-public022/
  record:
    needs: [build,fish,ordinary-entry]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/reef-results
      - name: Preserve actual outcomes without replacing production
        env:
          FISH_JOB: ${{ needs.fish.result }}
          PUBLIC_JOB: ${{ needs.ordinary-entry.result }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,os,shutil
          root=Path('/tmp/reef-results');out=Path('games/survivor-palau/releases/v0.2.2');out.mkdir(parents=True,exist_ok=True)
          for p in (root/'reef-candidate-build').glob('*'):
              if p.is_file():shutil.copyfile(p,out/p.name)
          reports=list((root/'reef-public-entry').rglob('PUBLICATION_PROOF.json'))
          proof=json.loads(reports[0].read_text()) if reports else {'browserPassed':False,'publicHttpsPassed':False,'shareAllowed':False,'failure':'No ordinary public-entry report'}
          fish_path=root/'reef-fish-runtime/REPORT.json'
          fish=json.loads(fish_path.read_text()) if fish_path.exists() else {'browserPassed':False,'failure':'No fish regression report'}
          proof['chapterLoopPassed']=fish.get('browserPassed',False)
          proof['workflowJobs']={'fish':os.environ['FISH_JOB'],'ordinaryEntry':os.environ['PUBLIC_JOB']}
          proof['shareAllowed']=bool(proof.get('browserPassed') and proof.get('publicHttpsPassed') and proof['chapterLoopPassed'] and all(v=='success' for v in proof['workflowJobs'].values()))
          (out/'PUBLICATION_PROOF.json').write_text(json.dumps(proof,ensure_ascii=False,indent=2)+'\n')
          (out/'FISH_BROWSER_QA.json').write_text(json.dumps(fish,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps({'shareAllowed':proof['shareAllowed'],'jobs':proof['workflowJobs']}))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add games/survivor-palau/releases/v0.2.2
          git diff --cached --quiet || git commit -m 'verify(stone-money): record shared reef candidate and public runtime evidence'
          git pull --rebase origin work/stone-money-island-v0220-reef-reference-20260918
          git push origin HEAD:work/stone-money-island-v0220-reef-reference-20260918
      - name: Require actual complete verification
        run: python -c "import json; assert json.load(open('games/survivor-palau/releases/v0.2.2/PUBLICATION_PROOF.json'))['shareAllowed']"
