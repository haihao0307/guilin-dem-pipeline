name: Minigame R03 isolated QA
on:
  push:
    branches: [qa/minigame-r03-20261008]
    paths:
      - 'kaopu-minigame-workbench/experiments/math-space-002/**'
      - 'kaopu-minigame-workbench/experiments/pt-mechanism-001/**'
      - 'kaopu-minigame-workbench/direction-r01/**'
      - 'kaopu-minigame-workbench/index.html'
      - '.github/workflows/math-space-002-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: math-space-002-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: kaopu-minigame-workbench/experiments/math-space-002
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /kaopu-minigame-workbench/experiments/math-space-002/
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install declared test dependency
        run: npm install --no-audit --no-fund
      - name: Install Chromium and CJK fonts
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Run numerical and application checks
        run: npm test
      - name: Capture first real frames
        run: node tests/capture-first.cjs
      - name: Upload first frames immediately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: math-space-002-first-${{ github.sha }}
          path: |
            kaopu-minigame-workbench/experiments/math-space-002/screenshots/first-*.png
            kaopu-minigame-workbench/experiments/math-space-002/tests/first-capture-results.json
          if-no-files-found: warn
          retention-days: 14
      - name: Browser interaction and pixel checks
        run: npm run test:browser
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: math-space-002-qa-${{ github.sha }}
          path: |
            kaopu-minigame-workbench/experiments/math-space-002/screenshots/
            kaopu-minigame-workbench/experiments/math-space-002/tests/*-results.json
          if-no-files-found: warn
          retention-days: 14

  pt_verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      PT_DIR: kaopu-minigame-workbench/experiments/pt-mechanism-001
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /kaopu-minigame-workbench/experiments/pt-mechanism-001/
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare browser QA from official registry
        run: |
          npm install --prefix "$RUNNER_TEMP/pt-qa" playwright@1.62.1
          "$RUNNER_TEMP/pt-qa/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pt-qa/node_modules" >> "$GITHUB_ENV"
      - name: Check own code syntax and numerical contracts
        id: numeric
        continue-on-error: true
        working-directory: ${{ env.PT_DIR }}
        run: |
          node --check app.js
          node --check scene.js
          node --check integration/CommonPersonSceneAdapter.mjs
          node --check integration/load-approved-person.mjs
          node tests/core.test.mjs
          node tests/scene-numerical.mjs
          node tests/adapter-contract.mjs
      - name: Verify original room interaction and rendered pixels
        id: room
        continue-on-error: true
        working-directory: ${{ env.PT_DIR }}
        run: node tests/browser.cjs
      - name: Verify existing approved person and original skin integration
        id: person
        continue-on-error: true
        working-directory: ${{ env.PT_DIR }}
        run: node tests/human-browser.cjs
      - name: Preserve all actual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pt-mechanism-001-qa
          path: |
            ${{ env.PT_DIR }}/tests/*results.json
            ${{ env.PT_DIR }}/tests/*failure.json
            ${{ env.PT_DIR }}/screenshots/*.png
          if-no-files-found: warn
      - name: Reflect every required check in the job outcome
        if: always()
        env:
          NUMERIC: ${{ steps.numeric.outcome }}
          ROOM: ${{ steps.room.outcome }}
          PERSON: ${{ steps.person.outcome }}
        run: |
          test "$NUMERIC" = success
          test "$ROOM" = success
          test "$PERSON" = success
