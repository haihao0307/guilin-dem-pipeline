name: QA unified human presets and surface
on:
  push:
    branches: [qa/human-presets-skin-20261008]
permissions:
  contents: read
jobs:
  actual-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            kaopu-unified-human-workbench
            kaopu-anny-workbench
            kaopu-mhr-workbench
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned browser QA dependency
        run: |
          npm install --prefix .human-qa --no-save --ignore-scripts --no-audit --no-fund playwright@1.55.0
          ./.human-qa/node_modules/.bin/playwright install --with-deps chromium
      - name: Serve checked-out candidate
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/human-presets-http.log 2>&1 &
          for n in 1 2 3 4 5; do curl --fail --silent http://127.0.0.1:8765/kaopu-unified-human-workbench/ && break; sleep 1; done
      - name: Exercise native presets and capture the real model
        env:
          NODE_PATH: ${{ github.workspace }}/.human-qa/node_modules
          HUMAN_QA_URL: http://127.0.0.1:8765/kaopu-unified-human-workbench/
          HUMAN_QA_OUT: ${{ github.workspace }}/human-presets-qa-results
        run: node kaopu-unified-human-workbench/tests/presets-browser.cjs
      - name: Exercise material semantics on the same current geometry
        if: always()
        env:
          NODE_PATH: ${{ github.workspace }}/.human-qa/node_modules
          HUMAN_QA_URL: http://127.0.0.1:8765/kaopu-unified-human-workbench/
          SKIN_QA_OUT: ${{ github.workspace }}/human-skin-qa-results
        run: node kaopu-unified-human-workbench/tests/skin-browser.cjs
      - name: Keep screenshots and numerical report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: human-presets-surface-${{ github.sha }}
          path: |
            human-presets-qa-results/
            human-skin-qa-results/
          if-no-files-found: warn
