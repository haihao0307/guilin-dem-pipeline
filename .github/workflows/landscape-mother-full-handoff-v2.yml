name: Landscape Mother Full Handoff V2 Package

on:
  push:
    branches:
      - handoff/landscape-mother-full-20260904-v2.0.0
    paths:
      - ".github/workflows/landscape-mother-full-handoff-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: landscape-mother-full-handoff-v2
  cancel-in-progress: false

jobs:
  package-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: handoff/landscape-mother-full-20260904-v2.0.0
          fetch-depth: 0

      - name: Build deterministic full handoff ZIP
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          import stat
          import zipfile
          from pathlib import Path

          package_name = "Xiaowang_Landscape_Mother_Full_Handoff_2026-09-04_v2.0.0"
          root = Path("handoffs/landscape-mother") / package_name
          release_dir = Path("handoffs/landscape-mother/releases")
          release_dir.mkdir(parents=True, exist_ok=True)
          zip_path = release_dir / f"{package_name}.zip"
          sha_path = release_dir / f"{package_name}.zip.sha256"

          required = [
              "START_HERE.md",
              "FULL_HANDOFF.md",
              "CURRENT_STATE.json",
              "DECISIONS_AND_NONNEGOTIABLES.md",
              "VISUAL_FAILURE_REGISTER.md",
              "NEXT_TASK.md",
              "REPOSITORY_POINTERS.json",
              "REFERENCE_REGISTRY.json",
              "HANDOFF.json",
              "SOURCE_SNAPSHOT/V016_REPO_PAYLOAD/source.00.b64",
              "SOURCE_SNAPSHOT/V016_REJECTED_RUNTIME/index.html",
              "SOURCE_SNAPSHOT/LEGACY_FULL_HANDOFF_20260902/START_HERE.md",
          ]
          for rel in required:
              p = root / rel
              if not p.is_file() or p.stat().st_size == 0:
                  raise SystemExit(f"missing required handoff file: {rel}")

          manifest_files = []
          for p in sorted(root.rglob("*")):
              if not p.is_file() or p.name == "GITHUB_PACKAGE_MANIFEST.json":
                  continue
              data = p.read_bytes()
              manifest_files.append({
                  "path": p.relative_to(root).as_posix(),
                  "bytes": len(data),
                  "sha256": hashlib.sha256(data).hexdigest(),
              })
          manifest = {
              "schema": "landscape-mother-github-package-manifest/2.0.0",
              "package": package_name,
              "sourceBranch": "feature/landscape-mother-field-graph-v002",
              "sourceCommit": "3110fbaedb5ba65ca5d8ed6c88830653e63acefe",
              "handoffBranch": "handoff/landscape-mother-full-20260904-v2.0.0",
              "fileCount": len(manifest_files),
              "files": manifest_files,
              "visualApproved": False,
              "visualAcceptance": False,
              "productionReady": False,
          }
          (root / "GITHUB_PACKAGE_MANIFEST.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          fixed = (2026, 9, 4, 0, 0, 0)
          if zip_path.exists():
              zip_path.unlink()
          with zipfile.ZipFile(zip_path, "w", zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
              for p in sorted(root.rglob("*")):
                  if not p.is_file():
                      continue
                  arc = f"{package_name}/{p.relative_to(root).as_posix()}"
                  info = zipfile.ZipInfo(arc, fixed)
                  mode = 0o755 if p.stat().st_mode & stat.S_IXUSR else 0o644
                  info.external_attr = (stat.S_IFREG | mode) << 16
                  info.compress_type = zipfile.ZIP_DEFLATED
                  zf.writestr(info, p.read_bytes())

          digest = hashlib.sha256(zip_path.read_bytes()).hexdigest()
          sha_path.write_text(f"{digest}  {zip_path.name}\n", encoding="utf-8")
          print(json.dumps({
              "zip": str(zip_path),
              "bytes": zip_path.stat().st_size,
              "sha256": digest,
              "fileCount": len(manifest_files) + 1,
          }, ensure_ascii=False, indent=2))
          PY
          unzip -t handoffs/landscape-mother/releases/Xiaowang_Landscape_Mother_Full_Handoff_2026-09-04_v2.0.0.zip

      - name: Commit package to handoff branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f \
            handoffs/landscape-mother/Xiaowang_Landscape_Mother_Full_Handoff_2026-09-04_v2.0.0/GITHUB_PACKAGE_MANIFEST.json \
            handoffs/landscape-mother/releases/Xiaowang_Landscape_Mother_Full_Handoff_2026-09-04_v2.0.0.zip \
            handoffs/landscape-mother/releases/Xiaowang_Landscape_Mother_Full_Handoff_2026-09-04_v2.0.0.zip.sha256
          git commit -m "release(landscape-mother): publish full handoff v2.0.0 package"
          git push origin HEAD:handoff/landscape-mother-full-20260904-v2.0.0
