name: Fish Oral Feature Merge R009
on:
  push:
    branches: [work/fish-yellowfin-oral-merge-r009-20260924]
    paths:
      - restart/fish-yellowfin-teacher-r2/web-r009/**
      - .github/workflows/fish-oral-merge-r009.yml
permissions:
  contents: write
concurrency:
  group: fish-yellowfin-single-publisher
  cancel-in-progress: false
jobs:
  verify-merged-source-study:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            apps/ocean-life-mother/fish-mother/yellowfin-source-copy-r001/source-workspace/source
            restart/fish-yellowfin-teacher-r2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reproduce full teacher, old studies, source features and source oral ring
        run: |
          python -m pip install numpy==2.2.6 Pillow==11.2.1
          R=restart/fish-yellowfin-teacher-r2
          O=dist/fish-mother-yellowfin
          python $R/web-r004/compile_teacher.py --source apps/ocean-life-mother/fish-mother/yellowfin-source-copy-r001/source-workspace/source/tuna_fish_4k.glb --out $O/canonical-r004
          cp $O/canonical-r004/EXTRACTION_QA.json SOURCE_IDENTITY_PROOF.json
          python $R/web-r005/compile_regions.py --package $O/canonical-r004 --out $O/parts-r005
          python $R/web-r006/compile_boundary.py --canonical $O/canonical-r004 --parts $O/parts-r005 --out $O/boundary-r006
          python $R/web-r007/compile_head.py --canonical $O/canonical-r004 --parts $O/parts-r005 --out $O/head-r007
          python $R/web-r008/compile_features.py --canonical $O/canonical-r004 --parts $O/parts-r005 --head $O/head-r007 --out $O/feature-r008
          python $R/web-r009/compile_oral.py --canonical $O/canonical-r004 --parts $O/parts-r005 --head $O/head-r007 --out $O/oral-r009
          python $R/web-r009/prepare_r009.py
      - name: Preserve single HTML, repaired first paint, material restoration and original 4K textures
        run: |
          npm install --no-save three@0.170.0 esbuild@0.24.2 playwright@1.51.1
          R=restart/fish-yellowfin-teacher-r2/web-r009
          node --check $R/main.mjs
          node --check $R/oral_merged.mjs
          npx esbuild $R/main.mjs --bundle --format=esm --target=es2022 --minify --legal-comments=inline --outfile=$R/bundle.js
          python $R/build.py
          npx playwright install --with-deps chromium
      - name: Real file-protocol original, feature and oral independent source regressions
        run: node restart/fish-yellowfin-teacher-r2/web-r009/qa_regression.mjs
      - name: Delayed loading, incomplete file, context loss, retry and unavailable WebGL
        run: node restart/fish-yellowfin-teacher-r2/web-r009/qa_openfix.mjs
      - name: Preserve real browser pixel evidence
        if: always()
        run: python restart/fish-yellowfin-teacher-r2/web-r009/delivery.py review
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fish-r009-code-data-and-browser-evidence
          path: |
            dist/fish-mother-yellowfin
            restart/fish-yellowfin-teacher-r2/web-r009
          retention-days: 30
      - name: Do not race the preceding R008 writer or overwrite its evidence
        run: python restart/fish-yellowfin-teacher-r2/web-r009/delivery.py predecessor
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: public
          sparse-checkout: fish-mother-yellowfin
      - name: Archive exact R008 and publish additive R009 to Fish only
        run: python restart/fish-yellowfin-teacher-r2/web-r009/delivery.py publish
      - name: Verify complete exact public HTML at bare and versioned entry
        run: python restart/fish-yellowfin-teacher-r2/web-r009/delivery.py wait
      - name: Final public full 3D regression including both newly merged studies
        env:
          PUBLIC_URL: https://haihao0307.github.io/guilin-dem-pipeline/fish-mother-yellowfin/?v=r009
        run: node restart/fish-yellowfin-teacher-r2/web-r009/qa_regression.mjs
      - name: Final public cold-start and fault recovery
        env:
          PUBLIC_URL: https://haihao0307.github.io/guilin-dem-pipeline/fish-mother-yellowfin/?v=r009
        run: node restart/fish-yellowfin-teacher-r2/web-r009/qa_openfix.mjs
      - name: Persist exact public proof without claiming biological or device approval
        run: python restart/fish-yellowfin-teacher-r2/web-r009/delivery.py proof
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fish-r009-public-proof
          path: |
            dist/fish-mother-yellowfin/PUBLIC_BROWSER_QA.json
            dist/fish-mother-yellowfin/PUBLICATION_PROOF.json
            dist/fish-mother-yellowfin/OPENFIX_QA.json
            dist/fish-mother-yellowfin/PUBLIC_OPENFIX_QA.json
