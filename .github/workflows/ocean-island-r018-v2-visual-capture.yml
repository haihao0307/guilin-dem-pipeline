name: Ocean Island R018.2 visual capture

"on":
  push:
    branches:
      - work/ocean-mother-r018
    paths:
      - ".github/workflows/ocean-island-r018-v2-visual-capture.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Chromium
        run: |
          python3 -m pip install --quiet playwright pillow
          python3 -m playwright install --with-deps chromium
      - name: Capture verified public overview top shore breaker rocks and smoke views
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 - <<'PY'
          import base64
          import json
          from pathlib import Path
          from PIL import Image, ImageStat
          from playwright.sync_api import sync_playwright

          url = 'https://haihao0307.github.io/guilin-dem-pipeline/ocean-mother/island-r018-v2/index.html?capture=33827451543'
          report = {'url': url.split('?')[0], 'status': 'PASS', 'captures': {}, 'errors': []}

          def image_metrics(path):
              image = Image.open(path).convert('RGB')
              sample = image.resize((180, 120))
              stat = ImageStat.Stat(sample)
              return {
                  'size': list(image.size),
                  'mean': [round(x, 2) for x in stat.mean],
                  'stddev': [round(x, 2) for x in stat.stddev],
                  'uniqueSampleColors': len(set(sample.getdata()))
              }

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True, args=[
                  '--enable-webgl', '--ignore-gpu-blocklist', '--enable-unsafe-swiftshader', '--use-angle=swiftshader'
              ])
              context = browser.new_context(viewport={'width': 1280, 'height': 820}, device_scale_factor=1)
              page = context.new_page()
              page.on('pageerror', lambda exc: report['errors'].append(str(exc)))
              response = page.goto(url, wait_until='domcontentloaded', timeout=120000)
              assert response and response.status == 200
              page.wait_for_function("window.__OCEAN_QA__ && window.__OCEAN_QA__.ready === true", timeout=120000)
              page.wait_for_function("window.__OCEAN_QA__.time > 0.08", timeout=120000)
              page.locator('#panelClose').evaluate('e => e.click()')
              page.wait_for_timeout(250)
              session = context.new_cdp_session(page)

              views = ['overview', 'top', 'shore', 'breaker', 'rocks', 'fire']
              for view in views:
                  page.locator(f'[data-view="{view}"]').evaluate('e => e.click()')
                  page.wait_for_timeout(900)
                  page.locator('#pause').evaluate("e => { if (e.textContent === '暂停') e.click(); }")
                  page.wait_for_timeout(160)
                  result = session.send('Page.captureScreenshot', {
                      'format': 'png',
                      'fromSurface': True,
                      'captureBeyondViewport': False
                  })
                  path = Path('evidence', f'R018_V2_{view.upper()}.png')
                  path.write_bytes(base64.b64decode(result['data']))
                  metrics = image_metrics(path)
                  assert min(metrics['stddev']) > 4, (view, metrics)
                  assert metrics['uniqueSampleColors'] > 1200, (view, metrics)
                  report['captures'][view] = metrics
                  page.locator('#pause').evaluate("e => { if (e.textContent === '继续运行') e.click(); }")

              report['qa'] = page.evaluate('window.__OCEAN_QA__')
              context.close()
              browser.close()

          assert not report['errors'], report['errors']
          Path('evidence/VISUAL_CAPTURE.json').write_text(json.dumps(report, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ocean-island-r018-v2-visual-capture
          path: evidence/
          if-no-files-found: error
          retention-days: 90
          compression-level: 9
