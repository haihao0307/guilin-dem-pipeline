name: KAOPU Gaussian R59 SPZ Accumulation

on:
  push:
    branches:
      - coordination/kaopu-learning-flywheel-r1-20260909
    paths:
      - docs/mother_coordination/kaopu_learning_flywheel_v1/PROBES/gaussian_three_spz_accumulation_r59.html
      - docs/mother_coordination/kaopu_learning_flywheel_v1/PROBES/run_gaussian_three_spz_accumulation_r59.js
      - docs/mother_coordination/kaopu_learning_flywheel_v1/ADAPTERS/gaussian_three_spz_accumulation_gate_r59.mjs
      - .github/workflows/kaopu-gaussian-r59-spz-accumulation.yml

permissions:
  contents: read

jobs:
  r59-spz-accumulation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned renderer and browser harness
        run: |
          npm init -y
          npm pkg set type=module
          npm install --no-save three@0.186.0 playwright@1.57.0 pngjs@7.0.0
          npx playwright install --with-deps chromium
      - name: Start local fixture server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/r59-http.log 2>&1 &
          sleep 2
          curl --fail --silent http://127.0.0.1:8765/docs/mother_coordination/kaopu_learning_flywheel_v1/PROBES/gaussian_three_spz_accumulation_r59.html > /dev/null
      - name: Run actual SPZLoader and GaussianSplat accumulation comparison
        run: node docs/mother_coordination/kaopu_learning_flywheel_v1/PROBES/run_gaussian_three_spz_accumulation_r59.js
      - name: Validate R59 evidence contract
        run: |
          cat r59-comparison.json | node docs/mother_coordination/kaopu_learning_flywheel_v1/ADAPTERS/gaussian_three_spz_accumulation_gate_r59.mjs > r59-gate.json
          cat r59-gate.json
          node -e "const d=require('./r59-gate.json');if(d.status!=='Candidate-pass')process.exit(10)"
      - name: Upload R59 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaopu-gaussian-r59-spz-accumulation
          path: |
            r59-*.json
          if-no-files-found: warn
          retention-days: 30
