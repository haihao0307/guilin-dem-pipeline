name: Landscape Karst KAOPU R5 public HTTP proof

on:
  push:
    branches:
      - feature/landscape-karst-kaopu-r5-20260910
    paths:
      - .github/workflows/landscape-karst-kaopu-r5-public-http.yml

permissions:
  contents: read

jobs:
  public-http:
    runs-on: ubuntu-latest
    steps:
      - name: Verify immutable raw.githack R5
        shell: bash
        run: |
          set -euo pipefail
          FIXED=6b6034681189e1ffca6284a9ecb573d97467e701
          URL="https://raw.githack.com/haihao0307/guilin-dem-pipeline/${FIXED}/workbenches/landscape-karst-kaopu-r5/index.html"
          curl --fail --location --retry 12 --retry-delay 2 --connect-timeout 10 --max-time 60 -D /tmp/headers.txt "$URL" -o /tmp/public.html
          test "$(sha256sum /tmp/public.html | awk '{print $1}')" = "dc8ff6f1a00810e577ebd90c32aa177fe85051b59dbfcced4d69f35069a4393f"
          test "$(stat -c%s /tmp/public.html)" -eq 28990
          grep -qi 'content-type: text/html' /tmp/headers.txt
          grep -q 'LANDSCAPE MOTHER' /tmp/public.html
          grep -q 'KAOPU R5' /tmp/public.html
          grep -q 'R5 已就绪 · R2/R3 保留 · R4 技术对照保留 · 主形重构' /tmp/public.html
          grep -q '0 外部模型' /tmp/public.html
          grep -q '0 贴图' /tmp/public.html
          echo "PUBLIC_URL=$URL"
          echo "PUBLIC_SHA256=$(sha256sum /tmp/public.html | awk '{print $1}')"
          echo "PUBLIC_BYTES=$(stat -c%s /tmp/public.html)"
