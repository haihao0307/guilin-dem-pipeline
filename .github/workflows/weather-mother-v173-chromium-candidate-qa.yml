name: Weather Mother V1.7.3 Chromium candidate QA
on:
  push:
    branches: [gh-pages]
    paths:
      - '.github/workflows/weather-mother-v173-chromium-candidate-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Install Chromium
        run: |
          python3 -m pip install playwright==1.51.0
          python3 -m playwright install --with-deps chromium
      - name: Verify iPhone Max candidate and Liquid Rain controls
        run: |
          cat > /tmp/wm_chromium.py <<'PY'
          import json,time
          from playwright.sync_api import sync_playwright
          base='https://haihao0307.github.io/guilin-dem-pipeline/weather-mother/studio-v073/'
          out={}
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=['--no-sandbox','--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader'])
              for name,w,h,orientation,full in [('p430',430,932,'portrait',True),('p440',440,956,'portrait',False),('l932',932,430,'landscape',True),('l956',956,440,'landscape',False)]:
                  context=browser.new_context(viewport={'width':w,'height':h},screen={'width':w,'height':h},is_mobile=True,has_touch=True,device_scale_factor=3)
                  page=context.new_page();errors=[];failed=[]
                  page.on('pageerror',lambda e,errors=errors:errors.append(str(e)))
                  page.on('console',lambda m,errors=errors:errors.append(m.text) if m.type=='error' else None)
                  page.on('requestfailed',lambda r,failed=failed:failed.append(r.url))
                  page.add_init_script("window.WeatherMotherBoot={quality:'low',still:true,weather:'fair'}")
                  page.goto(base+'?module=world&case='+name+'&t='+str(time.time_ns()),wait_until='domcontentloaded',timeout=60000)
                  page.wait_for_function("window.__WEATHER_MOTHER_STUDIO__?.version==='0.7.3-iphone-max-adaptive'",timeout=60000)
                  page.wait_for_function("document.querySelector('#stage')?.contentWindow?.WeatherMother?.qa?.ready",timeout=120000)
                  state=page.evaluate('__WEATHER_MOTHER_STUDIO__.getState()')
                  assert state['module']=='world' and not state['sheetOpen'] and state['orientation']==orientation
                  launcher=page.evaluate("document.querySelector('#launcher').getBoundingClientRect().toJSON()")
                  assert round(launcher['width'])==48 and round(launcher['height'])==48
                  assert 0<=launcher['x'] and launcher['right']<=w+1 and 0<=launcher['y'] and launcher['bottom']<=h+1
                  assert page.evaluate('document.documentElement.scrollWidth-document.documentElement.clientWidth')==0
                  page.locator('#launcher').click();page.wait_for_function('__WEATHER_MOTHER_STUDIO__.getState().sheetOpen');page.wait_for_timeout(400)
                  sheet=page.evaluate("document.querySelector('#sheet').getBoundingClientRect().toJSON()")
                  assert page.locator('[data-module]').count()==6
                  assert 0<=sheet['x'] and sheet['right']<=w+1 and 0<=sheet['y'] and sheet['bottom']<=h+1
                  if orientation=='portrait':
                      assert sheet['width']>=w-20 and .38*h<=sheet['height']<=.52*h
                  else:
                      assert sheet['width']<=391 and sheet['height']>=h-20
                  if full:
                      page.locator('[data-module="rain"]').click()
                      page.wait_for_function("__WEATHER_MOTHER_STUDIO__.getState().module==='rain' && !__WEATHER_MOTHER_STUDIO__.getState().sheetOpen",timeout=30000)
                      page.wait_for_function("document.querySelector('#stage')?.contentWindow?.WeatherLiquid?.getState()?.frames>0",timeout=120000)
                      page.locator('#launcher').click();page.wait_for_function("__WEATHER_MOTHER_STUDIO__.getState().sheetOpen && __WEATHER_MOTHER_STUDIO__.getState().tab==='controls'",timeout=30000);page.wait_for_timeout(400)
                      controls=page.evaluate("document.querySelector('#sheet').getBoundingClientRect().toJSON()")
                      assert page.locator('[data-rain-section]').count()==6
                      assert 0<=controls['x'] and controls['right']<=w+1 and 0<=controls['y'] and controls['bottom']<=h+1
                      page.locator('[data-rain-section="glass"]').click()
                      page.wait_for_function("document.querySelector('#stage')?.contentWindow?.WeatherLiquidUI?.isOpen?.() && document.querySelector('#stage')?.contentWindow?.WeatherLiquidUI?.getSection?.()==='glass'",timeout=30000);page.wait_for_timeout(300)
                      panel=page.evaluate("""()=>{const f=document.querySelector('#stage'),d=f.contentDocument,p=d.querySelector('#panel'),b=p.getBoundingClientRect(),ui=f.contentWindow.WeatherLiquidUI;return{...b.toJSON(),open:ui.isOpen(),section:ui.getSection(),launcher:getComputedStyle(document.querySelector('#launcher')).pointerEvents}}""")
                      assert panel['open'] and panel['section']=='glass' and panel['launcher']=='none'
                      assert 0<=panel['x'] and panel['right']<=w+1 and 0<=panel['y'] and panel['bottom']<=h+1
                      if orientation=='portrait': assert panel['width']>=w-24 and panel['height']<=.70*h
                      else: assert panel['width']<=391 and panel['x']>w*.5
                      page.evaluate("document.querySelector('#stage').contentDocument.querySelector('#done').click()")
                      page.wait_for_function("!document.querySelector('#stage')?.contentWindow?.WeatherLiquidUI?.isOpen?.()",timeout=30000)
                  assert not errors and not failed,(name,errors,failed)
                  out[name]={'launcher':launcher,'sheet':sheet}
                  context.close()
              browser.close()
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
          xvfb-run -a python3 -u /tmp/wm_chromium.py
