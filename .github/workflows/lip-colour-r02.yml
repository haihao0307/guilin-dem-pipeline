name: Lip colour R02 actual comparison and fixed HTTPS verification
on:
  push:
    branches: [feature/lip-colour-r02-20261018]
    paths:
      - 'kaopu-unified-human-workbench/lip-realism-r02/*.js'
      - 'kaopu-unified-human-workbench/lip-realism-r02/*.cjs'
      - 'kaopu-unified-human-workbench/lip-realism-r02/TASK_ANCHOR.json'
      - '.github/workflows/lip-colour-r02.yml'
permissions:
  contents: write
concurrency:
  group: lip-colour-r02-${{ github.ref }}
  cancel-in-progress: false
jobs:
  compare-and-publish:
    if: github.ref == 'refs/heads/feature/lip-colour-r02-20261018'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SCOPE: kaopu-unified-human-workbench/lip-realism-r02
      CANDIDATE_PATH: kaopu-unified-human-workbench/lip-realism-r02/preview.html
      BASELINE_PATH: kaopu-unified-human-workbench/lip-realism-r02/baseline-r01.html
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          sparse-checkout: |
            kaopu-unified-human-workbench/human-integrated-r07
            kaopu-unified-human-workbench/lip-realism-r02
            .github/workflows
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated pinned real browser verification
        run: |
          npm install --prefix "$RUNNER_TEMP/lip-colour-runtime" --no-save --package-lock=false playwright@1.58.2 pngjs@7.0.0
          echo "NODE_PATH=$RUNNER_TEMP/lip-colour-runtime/node_modules" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/lip-colour-runtime/node_modules/.bin/playwright" install --with-deps chromium
      - name: Compile isolated candidate and byte-identical published R01 baseline
        run: |
          node --check "$SCOPE/LipSurface.js"
          node --check "$SCOPE/verify-colour.cjs"
          node "$SCOPE/build.cjs"
      - name: Diagnose baseline then measure the candidate in real Chromium
        env:
          MODE: core
          QA_OUT: kaopu-unified-human-workbench/lip-realism-r02/evidence/core
          QA_BUDGET_MS: '1200000'
        run: timeout --signal=TERM --kill-after=20s 21m node "$SCOPE/verify-colour.cjs"
      - name: Publish internally verified candidate with strict fast-forward guard
        id: build
        run: |
          test "$GITHUB_REF_NAME" = feature/lip-colour-r02-20261018
          python - <<'PY'
          import os,json,hashlib
          from pathlib import Path
          p=Path(os.environ['SCOPE'])
          q=json.loads((p/'evidence/core/qa.json').read_text())
          assert q['completed'] and q['browserPassed'] and q['interactive3D'] and q['necessityEstablished']
          assert q['baselineMatched'] and not q.get('cleanupError')
          assert q['sourceSHA']==os.environ['SOURCE_SHA']
          assert q['tests'] and all(t['passed'] for t in q['tests'])
          assert hashlib.sha256((p/'preview.html').read_bytes()).hexdigest()==q['previewSHA256']
          PY
          git fetch --no-tags origin "$GITHUB_REF_NAME"
          test "$(git rev-parse FETCH_HEAD)" = "$SOURCE_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- "$SCOPE/preview.html" "$SCOPE/BUILD_MANIFEST.json" "$SCOPE/evidence/core"
          git commit -m 'build: measured lip colour R02 candidate and R01 comparisons [skip ci]'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          build_sha="$(git rev-parse HEAD)"
          echo "sha=$build_sha" >> "$GITHUB_OUTPUT"
      - name: Verify exact fixed public page and desktop/mobile viewport interactions
        env:
          MODE: public
          CANDIDATE_URL: https://htmlpreview.github.io/?https://raw.githubusercontent.com/haihao0307/guilin-dem-pipeline/${{ steps.build.outputs.sha }}/kaopu-unified-human-workbench/lip-realism-r02/preview.html
          LOCAL_QA_PATH: kaopu-unified-human-workbench/lip-realism-r02/evidence/core/qa.json
          QA_OUT: kaopu-unified-human-workbench/lip-realism-r02/evidence/public
          QA_BUDGET_MS: '480000'
        run: timeout --signal=TERM --kill-after=20s 9m node "$SCOPE/verify-colour.cjs"
      - name: Preserve exact public readback proof without touching main
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ['SCOPE'])
          q=json.loads((p/'evidence/public/qa.json').read_text())
          assert q['completed'] and q['shareAllowed'] and q['publicHttpsPassed']
          assert not q.get('cleanupError')
          proof=json.loads((p/'evidence/public/PUBLICATION_PROOF.json').read_text())
          proof.update(runId=os.environ['GITHUB_RUN_ID'],runAttempt=os.environ['GITHUB_RUN_ATTEMPT'],previewSHA256=q['previewSHA256'],visualReview='PENDING_INDEPENDENT_IMAGE_REVIEW',physicalPhone=False,mainUnchanged=True)
          (p/'PUBLICATION_PROOF.json').write_text(json.dumps(proof,ensure_ascii=False,indent=2)+'\n')
          PY
          git fetch --no-tags origin "$GITHUB_REF_NAME"
          test "$(git rev-parse FETCH_HEAD)" = "$(git rev-parse HEAD)"
          git add -f -- "$SCOPE/PUBLICATION_PROOF.json" "$SCOPE/evidence/public"
          git commit -m 'test: fixed HTTPS lip colour R02 readback [skip ci]'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lip-colour-r02-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            kaopu-unified-human-workbench/lip-realism-r02/evidence/
            kaopu-unified-human-workbench/lip-realism-r02/BUILD_MANIFEST.json
            kaopu-unified-human-workbench/lip-realism-r02/PUBLICATION_PROOF.json
          retention-days: 30
