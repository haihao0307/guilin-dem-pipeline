name: Motion R02 Convert Captured References
on:
  push:
    branches: [feature/motion-r02-thumb-cycles-20261013]
    paths: [.github/workflows/motion-r02-convert.yml]
permissions:
  contents: write
jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/motion-r02-thumb-cycles-20261013
          sparse-checkout: |
            kaopu-unified-human-workbench/motion-review-r02
            kaopu-unified-human-workbench/full/activity-r01
            kaopu-unified-human-workbench/vendor
      - run: python -m pip install numpy scipy
      - run: python kaopu-unified-human-workbench/motion-review-r02/convert.py
      - name: Commit only new bounded source records
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kaopu-unified-human-workbench/motion-review-r02
          git commit -m 'data(motion-r02): CMU body-verified walk run wave stretch with chosen stride intervals'
          git fetch origin feature/motion-r02-thumb-cycles-20261013
          git merge --ff-only origin/feature/motion-r02-thumb-cycles-20261013 || true
          git push origin HEAD:feature/motion-r02-thumb-cycles-20261013
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: motion-r02-converted-sources
          path: |
            kaopu-unified-human-workbench/motion-review-r02
            kaopu-unified-human-workbench/vendor
          retention-days: 7
