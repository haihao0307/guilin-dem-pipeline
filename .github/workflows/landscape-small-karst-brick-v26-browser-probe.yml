name: Landscape Small Karst Brick V2.6 Browser Probe

on:
  push:
    branches:
      - feature/landscape-small-karst-brick-v26-r2-20260919
    paths:
      - workbenches/landscape-small-karst-field-r2-brick-v26/index.html
      - .github/workflows/landscape-small-karst-brick-v26-browser-probe.yml

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run page in Chromium SwiftShader
        run: |
          python3 -m http.server 8000 >/tmp/http.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/ >/dev/null && break; sleep .2; done
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)
          echo "CHROME=$CHROME"
          if [ -z "$CHROME" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq chromium-browser || sudo apt-get install -y -qq chromium
            CHROME=$(command -v chromium || command -v chromium-browser)
          fi
          set +e
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage \
            --use-angle=swiftshader --enable-unsafe-swiftshader \
            --run-all-compositor-stages-before-draw --virtual-time-budget=15000 \
            --enable-logging=stderr --v=1 \
            --dump-dom http://127.0.0.1:8000/workbenches/landscape-small-karst-field-r2-brick-v26/index.html \
            >/tmp/dom.html 2>/tmp/chrome.log
          CODE=$?
          set -e
          echo "chrome_exit=$CODE"
          echo '--- error box ---'
          grep -o '<div id="error"[^>]*>[^<]*' /tmp/dom.html || true
          echo '--- shader/link diagnostics ---'
          grep -Ei 'shader|program|link|webgl|error' /tmp/chrome.log | tail -n 160 || true
          echo '--- readiness ---'
          grep -o '__KARST_READY__[^<]*' /tmp/dom.html | head || true
          if grep -q '<div id="error" style="display: block;">' /tmp/dom.html; then
            echo 'browser probe detected runtime error'
            exit 1
          fi
