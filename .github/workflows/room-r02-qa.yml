name: Original-source room same-game GPU QA
on:
  push:
    branches: ['qa/walled-room-r01-20261011']
    paths:
      - 'kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01/room-unit-r02/**'
      - 'tests/room-r02-scene.cjs'
      - 'tests/room-r02-cost.cjs'
      - '.github/workflows/room-r02-qa.yml'
permissions:
  contents: read
jobs:
  native-wall-gpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ROOM_GAME: kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01
      ROOM_OUT: room-r02-results
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01
            kaopu-minigame-workbench/voxel-train-study/vendor
            tests/room-r02-scene.cjs
            tests/room-r02-cost.cjs
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
      - name: Verify original source pins and generate actual SQLite room
        run: |
          mkdir -p "$ROOM_OUT"
          python3 "$ROOM_GAME/room-unit-r02/native-codec/build_release.py"
          node "$ROOM_GAME/room-unit-r02/native-codec/write_sample.mjs" | tee "$ROOM_OUT/sample-manifest.json"
          python3 "$ROOM_GAME/room-unit-r02/native-codec/verify_sqlite.py" | tee "$ROOM_OUT/sqlite-verification.json"
          ROOM_HOST_GAME_ROOT="$GITHUB_WORKSPACE/$ROOM_GAME" node --test "$ROOM_GAME/room-unit-r02/native-codec/codec.test.mjs" "$ROOM_GAME/room-unit-r02/native-codec/native.test.mjs" | tee "$ROOM_OUT/native-tests.txt"
      - name: Install official pinned browser test runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/room-browser" --registry=https://registry.npmjs.org --no-save --ignore-scripts --no-audit --no-fund playwright@1.57.0
          "$RUNNER_TEMP/room-browser/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/room-browser/node_modules" >> "$GITHUB_ENV"
      - name: Measure separate original-source costs through complete framebuffer readback
        timeout-minutes: 3
        run: node tests/room-r02-cost.cjs
      - name: Preserve real screenshots and errors
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: original-source-room-${{ github.sha }}
          path: room-r02-results/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
