name: R06 Source Bootstrap

on:
  push:
    branches:
      - work/kaopu-mammal-r06-cat-dog-integration-20260930
    paths:
      - '.r06-bootstrap/**'
      - '.github/workflows/r06-source-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: r06-source-bootstrap
  cancel-in-progress: false

jobs:
  unpack-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out staged branch
        uses: actions/checkout@v5

      - name: Reconstruct exact R06 project source
        shell: bash
        run: |
          set -euo pipefail
          test -s .r06-bootstrap/chunk00.b64
          test -s .r06-bootstrap/chunk01.b64
          test -s .r06-bootstrap/chunk02.b64
          cat .r06-bootstrap/chunk*.b64 | base64 -d > /tmp/r06-src.tgz
          gzip -t /tmp/r06-src.tgz
          tar -xzf /tmp/r06-src.tgz kaopu-mammal-r06
          test -s kaopu-mammal-r06/src/instrument.js
          test -s kaopu-mammal-r06/src/scores.js
          test -s kaopu-mammal-r06/tests/unit.mjs

      - name: Commit production source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'KAOPU R06 Bootstrap'
          git config user.email 'kaopu-r06-bootstrap@users.noreply.github.com'
          git add kaopu-mammal-r06
          git commit -m 'feat(kaopu): add R06 mammal instrument integrating cat anatomy and dog teacher workflow'
          git push
