name: Stone Money exact GitHub-only publication
on:
  push:
    branches:
      - publish/stone-money-r0152-exact-20260924
    paths:
      - ops/stone-money-r0153/**
      - .github/workflows/smi-r0152-exact-publication.yml
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: stone-money-exact-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Reassemble exact R015.3 from repository chunks
        run: |
          mkdir -p publication-evidence
          python ops/stone-money-r0153/assemble_source.py --root ops/stone-money-r0153/source-chunks --out STONE_MONEY_ISLAND_R015_3_REAL_3D.html | tee publication-evidence/ASSEMBLY_PROOF.json
          test "$(sha256sum STONE_MONEY_ISLAND_R015_3_REAL_3D.html | cut -d' ' -f1)" = "5d3167af1127a9a9f2eeaa47957158312060e0bff114020befec6703bc88001c"
          test "$(wc -c < STONE_MONEY_ISLAND_R015_3_REAL_3D.html)" = "956838"
      - name: Install real Chromium verifier
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Test local real WebGL
        run: |
          python -m http.server 8765 >/tmp/smi-http.log 2>&1 &
          echo $! >/tmp/smi-http.pid
          sleep 2
          xvfb-run -a python ops/stone-money-r0153/qa_publication.py --url http://127.0.0.1:8765/STONE_MONEY_ISLAND_R015_3_REAL_3D.html --out publication-evidence/local
      - name: Publish the one approved Pages path and verify exact HTTPS bytes
        run: python ops/stone-money-r0153/publish_exact.py --source STONE_MONEY_ISLAND_R015_3_REAL_3D.html --out publication-evidence
      - name: Test public real WebGL
        run: xvfb-run -a python ops/stone-money-r0153/qa_publication.py --url "https://haihao0307.github.io/guilin-dem-pipeline/stone-money-island/?v=R0153-5d3167af1127" --out publication-evidence/public
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SMI-R0153-exact-publication-${{ github.run_id }}
          path: publication-evidence/
          retention-days: 30
          if-no-files-found: error
