name: Three existing buildings hosted component integration
on:
  push:
    branches: ['trial/three-case-host-integration-20261022']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            kaopu-geography-workbench/kowloon-building-mother-r01
            kaopu-geography-workbench/hk-three-buildings-r01
      - name: CPU host, source, opening, FFL and sampled clearance invariants
        run: node --test kaopu-geography-workbench/kowloon-building-mother-r01/tests/whole-integration.test.mjs
      - name: Install pinned supported browser
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Start isolated server
        run: python -m http.server 8765 >/tmp/server.log 2>&1 &
      - name: Render real three cases and mobile viewport
        run: timeout 720s python -u kaopu-geography-workbench/kowloon-building-mother-r01/tests/whole-integration-browser.py --output kaopu-geography-workbench/kowloon-building-mother-r01/evidence/whole-integration-r01
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: whole-integration-${{ github.sha }}
          path: kaopu-geography-workbench/kowloon-building-mother-r01/evidence/whole-integration-r01
          retention-days: 1
