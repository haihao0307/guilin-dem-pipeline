name: Coral R07 Massive P12

on:
  push:
    branches:
      - work/coral-mother-r07-massive-porites-p12-geodesic-surface-20260921
    paths:
      - tools/coral/coral_r07_massive_p12_geodesic_surface.py
      - tools/coral/coral_r07_massive_p12_browser_qa.py
      - tools/coral/coral_r07_massive_p11_browser_qa.py
      - tools/coral/coral_r07_massive_p00_browser_qa.py
      - .github/workflows/coral-r07-massive-p12.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coral-r07-massive-p12
  cancel-in-progress: true

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out R07 P12 work branch
        uses: actions/checkout@v4
        with:
          ref: work/coral-mother-r07-massive-porites-p12-geodesic-surface-20260921
          fetch-depth: 1
          path: work

      - name: Check out frozen GitHub Pages baseline
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 1
          path: pages

      - name: Build P12 from exact published P11 baseline
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=pages/coral-mother-r07-massive-porites-p11
          test -s "$SOURCE/index.html"
          test -s "$SOURCE/BUILD_R07_P00.json"
          rm -rf /tmp/coral-r07-p12
          cp -a "$SOURCE" /tmp/coral-r07-p12
          python3 work/tools/coral/coral_r07_massive_p12_geodesic_surface.py /tmp/coral-r07-p12
          printf '%s\n' \
            'https://haihao0307.github.io/guilin-dem-pipeline/coral-mother-r07-massive-porites-p12/' \
            > /tmp/coral-r07-p12/PUBLIC_URL.txt
          grep -q 'R07-P12' /tmp/coral-r07-p12/index.html
          grep -q "surfaceTopology:'geodesic-octahedron-hemisphere'" /tmp/coral-r07-p12/index.html
          grep -q "subdivisionLevel:8" /tmp/coral-r07-p12/index.html
          grep -q "latLongSingularity:false" /tmp/coral-r07-p12/index.html
          grep -q "apexDuplicateCount:1" /tmp/coral-r07-p12/index.html
          grep -q "meshResolution:'geodesic-subdivision-8'" /tmp/coral-r07-p12/index.html
          grep -q "microDisplacementSpace:'surface-normal-geodesic-voronoi'" /tmp/coral-r07-p12/index.html
          ! grep -q "meshResolution:'224x448-integrated-field'" /tmp/coral-r07-p12/index.html
          grep -q 'CORAL_MOTHER_R07_MASSIVE_P12_BUILD' /tmp/coral-r07-p12/BUILD_R07_P00.json
          test "$(grep -o 'type="range"' /tmp/coral-r07-p12/index.html | wc -l)" -eq 12
          test "$(grep -o 'id="gl"' /tmp/coral-r07-p12/index.html | wc -l)" -eq 1

      - name: Browser, geometry, and geodesic-surface gates
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet websocket-client pillow
          python3 -m http.server 8773 --directory /tmp/coral-r07-p12 >/tmp/coral-r07-p12-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          python3 work/tools/coral/coral_r07_massive_p12_browser_qa.py /tmp/coral-r07-p12

      - name: Assert P12 evidence survived browser QA
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'CORAL_MOTHER_R07_MASSIVE_P12_BUILD' /tmp/coral-r07-p12/BUILD_R07_P00.json
          grep -q 'geodesicOctahedronHemisphere' /tmp/coral-r07-p12/BUILD_R07_P00.json
          grep -q 'latLongSingularityRejected' /tmp/coral-r07-p12/BUILD_R07_P00.json
          grep -q 'singleApexVertex' /tmp/coral-r07-p12/BUILD_R07_P00.json
          grep -q 'triangleAspectGate' /tmp/coral-r07-p12/BUILD_R07_P00.json
          grep -q 'constantTopologyAcrossMicroscope' /tmp/coral-r07-p12/BUILD_R07_P00.json
          test -s /tmp/coral-r07-p12/QA_SCREENSHOT_ULTRAWIDE_2560X1080.png
          test -s /tmp/coral-r07-p12/QA_CLOSEUP_ULTRAWIDE_2560X1080.png
          test -s /tmp/coral-r07-p12/QA_MICROSCOPE_0.png
          test -s /tmp/coral-r07-p12/QA_MICROSCOPE_1.png
          test -s /tmp/coral-r07-p12/QA_WARP_0.png
          test -s /tmp/coral-r07-p12/QA_WARP_1.png

      - name: Upload complete P12 evidence
        uses: actions/upload-artifact@v4
        with:
          name: CORAL_R07_MASSIVE_P12_EVIDENCE_${{ github.sha }}
          path: /tmp/coral-r07-p12
          if-no-files-found: error
          retention-days: 90

      - name: Publish fixed P12 workbench
        shell: bash
        run: |
          set -euo pipefail
          TARGET=coral-mother-r07-massive-porites-p12
          rm -rf "pages/$TARGET"
          mkdir -p "pages/$TARGET"
          cp -a /tmp/coral-r07-p12/. "pages/$TARGET/"
          cd pages
          git config user.name 'Haihao_Nature Grace HK'
          git config user.email 'haihao0307@gmail.com'
          git add "$TARGET/"
          if git diff --cached --quiet; then
            echo 'No publication changes.'
          else
            git commit -m "publish(coral): R07 massive Porites P12 geodesic surface"
            git pull --rebase origin gh-pages
            git push origin gh-pages
          fi

      - name: Write run summary
        shell: bash
        run: |
          {
            echo '## Coral Mother R07-P12'
            echo
            echo '- NOAA: Hard / stony coral → Massive coral'
            echo '- Candidate: Porites lutea morphology prototype'
            echo '- P11 retained as latitude-longitude streak failure evidence'
            echo '- P12: subdivision-8 octahedral geodesic hemisphere'
            echo '- One apex vertex, 1,024 boundary vertices, no lat-long singularity'
            echo '- Poisson corallites integrated along geodesic surface normals'
            echo '- Uniform RGB species colour + non-RGB local lighting signal'
            echo '- Runtime assets: 0 GLB / 0 texture / 0 fetch'
            echo '- visualAcceptance: false'
            echo '- productionReady: false'
            echo
            echo 'Public workbench:'
            echo 'https://haihao0307.github.io/guilin-dem-pipeline/coral-mother-r07-massive-porites-p12/'
          } >> "$GITHUB_STEP_SUMMARY"
