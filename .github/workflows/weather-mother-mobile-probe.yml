name: Weather Mother mobile probe
on:
  push:
    branches: [gh-pages]
    paths:
      - '.github/workflows/weather-mother-mobile-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: |
          python3 -m pip install playwright==1.51.0
          python3 -m playwright install --with-deps chromium
      - run: |
          cat > /tmp/wm_probe.py <<'PY'
          import json
          from playwright.sync_api import sync_playwright
          URL='https://haihao0307.github.io/guilin-dem-pipeline/weather-mother/?module=rain&probe=3'
          with sync_playwright() as p:
            b=p.chromium.launch(headless=True,args=['--no-sandbox','--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader'])
            page=b.new_page(viewport={'width':430,'height':932},is_mobile=True,has_touch=True,device_scale_factor=3)
            page.goto(URL,wait_until='domcontentloaded',timeout=60000)
            page.wait_for_function("document.querySelector('#stage')?.contentWindow?.WeatherLiquid?.getState()?.frames>0",timeout=120000)
            data=page.evaluate("""()=>{const f=document.querySelector('#stage'),w=f.contentWindow,d=f.contentDocument;const all=[...d.querySelectorAll('*')];return {uiKeys:Object.keys(w.WeatherLiquidUI||{}),bodyClasses:d.body.className,ids:all.filter(x=>x.id).map(x=>({tag:x.tagName,id:x.id,cls:String(x.className)})).slice(0,120),groups:[...d.querySelectorAll('[data-section]')].map(x=>({tag:x.tagName,id:x.id,cls:String(x.className),section:x.dataset.section,open:x.open})),buttons:[...d.querySelectorAll('button')].map(x=>({id:x.id,cls:String(x.className),text:x.textContent.trim().slice(0,60)})),viewport:{w:d.documentElement.clientWidth,h:d.documentElement.clientHeight,sw:d.documentElement.scrollWidth,sh:d.documentElement.scrollHeight}}}""")
            print(json.dumps(data,ensure_ascii=False,indent=2))
            b.close()
          PY
          xvfb-run -a python3 -u /tmp/wm_probe.py
