name: Read knit surface reference
on:
  push:
    branches: [gh-pages]
    paths: [.github/workflows/knit-reference-read.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read public reference only
        run: |
          python3 - <<'PY'
          import urllib.request, json
          urls=['https://fragcoord.xyz/s/t0lzula9.md','https://fragcoord.xyz/t/ray-marching.md','https://fragcoord.xyz/t/domain-warp.md']
          for url in urls:
              print('REFERENCE_START',url,flush=True)
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'text/markdown,text/plain,text/html'})
                  with urllib.request.urlopen(req,timeout=30) as r:
                      text=r.read(120000).decode('utf-8','replace')
                      print('STATUS',r.status,'URL',r.url)
                      print(text)
              except Exception as e: print(type(e).__name__,str(e))
              print('REFERENCE_END',flush=True)
          PY
