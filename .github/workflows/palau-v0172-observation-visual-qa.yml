name: Palau V0172 observation visual QA

on:
  push:
    branches:
      - work/survivor-palau-v0172-observation-visual-20260921
    paths:
      - .github/workflows/palau-v0172-observation-visual-qa.yml
      - games/survivor-palau/source/v0170/**
      - games/survivor-palau/source/v0172/**

permissions:
  contents: write

jobs:
  browser-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install readable CJK evidence font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk

      - name: Build V0172 single-file candidate
        run: |
          python3 games/survivor-palau/source/v0172/build.py
          node --check games/survivor-palau/source/v0172/visual.mjs
          python3 -m py_compile \
            games/survivor-palau/source/v0172/build.py \
            games/survivor-palau/source/v0172/browser_qa.py \
            games/survivor-palau/source/v0172/browser_qa_dom_input.py
          grep -q 'pilotObservationVisualMetrics' games/survivor-palau/releases/v0.1.7.2/index.html
          grep -q 'pilotLensOverlay' games/survivor-palau/releases/v0.1.7.2/index.html
          grep -q 'installPilotReelInputGuard' games/survivor-palau/releases/v0.1.7.2/index.html
          git diff --check

      - name: Install browser QA runtime
        run: |
          python3 -m pip install --disable-pip-version-check playwright==1.55.0
          command -v google-chrome || command -v chromium
          command -v xvfb-run

      - name: Run technical and visual-readability QA
        run: |
          xvfb-run -a -s '-screen 0 1280x800x24' \
            python3 games/survivor-palau/source/v0172/browser_qa_dom_input.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          qa=Path('games/survivor-palau/releases/v0.1.7.2/BROWSER_QA.json')
          report=json.loads(qa.read_text())
          assert report.get('passed') is True, json.dumps(report, ensure_ascii=False, indent=2)
          visual=report.get('checks', {}).get('visualReadability')
          assert visual and visual['solidLensCount'] == 0, visual
          assert visual['candidateFishLengthPx'] >= 22, visual
          assert visual['baitDiameterPx'] >= 10, visual
          caught=report.get('checks', {}).get('reelControl_caught', {})
          history=caught.get('history', [])
          assert any(h.get('inputAck', {}).get('source') == 'mouse-fallback' for h in history), history[-12:]
          build=Path('games/survivor-palau/releases/v0.1.7.2/BUILD.json')
          meta=json.loads(build.read_text())
          meta['browserPassed']=True
          meta['shareAllowed']=True
          meta['visualAcceptancePending']=True
          meta['productionReady']=False
          build.write_text(json.dumps(meta, ensure_ascii=False, indent=2)+'\n')
          PY

      - name: Commit rebuilt review candidate and evidence
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add games/survivor-palau/releases/v0.1.7.2
          if git diff --cached --quiet; then
            echo 'No V0172 release changes to commit.'
          else
            git commit -m 'test(palau): capture V0172 observation visual evidence'
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Upload V0172 evidence and one-click HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: palau-v0172-observation-visual-qa
          path: |
            games/survivor-palau/releases/v0.1.7.2/index.html
            games/survivor-palau/releases/v0.1.7.2/BROWSER_QA.json
            games/survivor-palau/releases/v0.1.7.2/BUILD.json
            games/survivor-palau/releases/v0.1.7.2/evidence
          if-no-files-found: warn
