name: Wenzhou R3.6 Query01 Diagnostic

on:
  push:
    branches:
      - feature/wenzhou-r3-6-osm-runtime-20260911
    paths:
      - 'tools/r3-6/diagnose_query01.mjs'
      - '.github/workflows/wenzhou-r3-6-query01-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Probe query-01 state for 20 seconds
        run: |
          set -euo pipefail
          python -m http.server 8765 --directory . >/tmp/r36-diag-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/site/dist/r3-6/ >/dev/null && break || sleep 1; done
          R36_URL=http://127.0.0.1:8765/site/dist/r3-6/ node tools/r3-6/diagnose_query01.mjs | tee /tmp/r36-query01-diag.json
      - uses: actions/upload-artifact@v4
        with:
          name: wenzhou-r3-6-query01-diagnostic-${{ github.sha }}
          path: |
            /tmp/r36-query01-diag.json
            /tmp/r36-diag-http.log
          retention-days: 14
