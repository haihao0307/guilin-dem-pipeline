name: Verify published three-case whole-building system
on:
  push:
    branches: ['trial/kowloon-whole-building-r01-20261021']
    paths: ['kaopu-geography-workbench/kowloon-building-mother-r01/tests/public-whole-r02-request.json']
permissions:
  contents: read
jobs:
  public-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: kaopu-geography-workbench/kowloon-building-mother-r01
      - name: Install pinned browser
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: HTTPS exact bytes all three cases and old anchor regression
        run: timeout 600s python -u kaopu-geography-workbench/kowloon-building-mother-r01/tests/public-whole-r02.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: whole-r02-public-${{ github.sha }}
          path: kaopu-geography-workbench/kowloon-building-mother-r01/evidence/whole-r02-public
          retention-days: 1
