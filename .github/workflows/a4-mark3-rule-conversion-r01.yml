name: A4 Mark3 exact rule conversion QA
on:
  push:
    branches: ['qa/a4-mark3-rule-conversion-r01-20261017']
    paths:
      - '.github/workflows/a4-mark3-rule-conversion-r01.yml'
      - 'kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01/a4-mark3-rule-conversion-r01/**'
permissions:
  contents: read
jobs:
  exact-conversion:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01/a4-mark3-rule-conversion-r01
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01/a4-mark3-rule-conversion-r01
            kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01/a4-a6-source-comparison-r03
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned official browser test dependencies
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Execute generated exact program and original equality checks
        run: |
          mkdir -p reports
          node checkpoint-08-candidate/tools/verify-js.mjs
          node viewer-08/test-transport.mjs
          node viewer-08/test-storage.mjs
      - name: Real browser source versus converted world matrices and raster equality
        run: TEST_NONCOAL=1 TEST_NONCOAL_MASTER=1 node viewer-08/browser.cjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: a4-mark3-rule-conversion-${{ github.sha }}
          path: kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01/a4-mark3-rule-conversion-r01/qa/
          retention-days: 14
          if-no-files-found: error
