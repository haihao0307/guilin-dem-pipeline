name: Stone Money V0210 beach contact
on:
  push:
    branches: [work/stone-money-island-v0210-beach-contact-20260919]
    paths:
      - .github/workflows/stone-money-v0210-beach.yml
      - games/survivor-palau/source/v0200/**
permissions:
  contents: write
concurrency:
  group: stone-money-v0210-beach
  cancel-in-progress: true
jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/stone-money-island-v0210-beach-contact-20260919
      - name: Build the actual game from the frozen ocean baseline
        run: python games/survivor-palau/source/v0200/build.py
      - name: Run deterministic beach and contact checks
        run: python games/survivor-palau/source/v0200/verify_beach.py
      - name: Run desktop and 390x844 real-browser evidence
        run: |
          python -m pip install playwright pillow
          python -m playwright install --with-deps chromium
          timeout 600s python -u games/survivor-palau/source/v0200/verify_beach_browser.py
      - name: Preserve generated runtime and receipts
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add games/survivor-palau/releases/v0.2.1
          git diff --cached --quiet || git commit -m 'build(stone-money): record V0.2.1 beach profile and browser evidence'
          git pull --rebase origin work/stone-money-island-v0210-beach-contact-20260919
          git push origin HEAD:work/stone-money-island-v0210-beach-contact-20260919
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stone-money-v0210-beach-contact
          path: |
            games/survivor-palau/releases/v0.2.1/
            games/survivor-palau/source/v0200/KNOWN_LIMITATIONS_V0210.md
            /tmp/stone-money-v0210-qa/
          if-no-files-found: error
