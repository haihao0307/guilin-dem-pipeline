name: Build and verify Weather Mother R23 mobile cloud-first v2

on:
  push:
    branches:
      - feature/weather-mother-r23-from-r22-silver-flight
    paths:
      - .github/workflows/build-verify-weather-r23-mobile-cloud-first-v2.yml

permissions:
  contents: write

concurrency:
  group: weather-mother-r23-mobile-cloud-first-v2
  cancel-in-progress: false

jobs:
  public-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build single-file R23 from frozen R22
        shell: bash
        run: |
          set -euo pipefail
          python3 weather-mother/r23-mobile-recovery-src/build-r23.py
          OUT=weather-mother/full-weather-r23-mobile-cloud-first-20260910/index.html
          test -s "$OUT"
          grep -q 'Weather Mother · 完整天气恢复 R22' "$OUT"
          grep -q 'weather-mother-r23-mobile-cloud-first' "$OUT"
          grep -q '银边积云' "$OUT"
          grep -q '原自由飞行' "$OUT"

      - name: Freeze page commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Weather Mother CI'
          git config user.email 'weather-mother-ci@users.noreply.github.com'
          git add weather-mother/full-weather-r23-mobile-cloud-first-20260910/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'build(weather-mother): R23 mobile cloud-first candidate v2 [skip ci]'
            git push origin HEAD:feature/weather-mother-r23-from-r22-silver-flight
          fi
          PAGE_SHA=$(git rev-parse HEAD)
          PUBLIC_URL="https://raw.githack.com/haihao0307/guilin-dem-pipeline/$PAGE_SHA/weather-mother/full-weather-r23-mobile-cloud-first-20260910/index.html"
          echo "PAGE_SHA=$PAGE_SHA" >> "$GITHUB_ENV"
          echo "PUBLIC_URL=$PUBLIC_URL" >> "$GITHUB_ENV"
          echo "$PAGE_SHA" > /tmp/r23-page-sha

      - name: Wait for immutable public page
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 40); do
            code=$(curl -L -sS -o /tmp/r23.html -w '%{http_code}' --connect-timeout 10 --max-time 45 "$PUBLIC_URL?probe=$attempt" || true)
            if [ "$code" = 200 ] && grep -q 'weather-mother-r23-mobile-cloud-first' /tmp/r23.html; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = 1

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install playwright==1.55.0 >/dev/null
          python3 -m playwright install chromium >/dev/null

      - name: Verify cloud pixels flight controls and 390x844 layout
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a python3 -u weather-mother/r23-mobile-recovery-src/qa-public-r23.py

      - name: Commit public evidence
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p weather-mother/full-weather-r23-mobile-cloud-first-20260910
          cat > weather-mother/full-weather-r23-mobile-cloud-first-20260910/PUBLICATION_PROOF.json <<JSON
          {
            "schema": "weather-mother-r23-mobile-publication-proof/2",
            "pageCommit": "$PAGE_SHA",
            "url": "$PUBLIC_URL",
            "baseR22Commit": "8aeb8dac519f8bda851cfc998e07266870d3eaef",
            "acceptedR21CoreCommit": "d6796df38a2cb872f58ff1f8ce72b5f36d8d2322",
            "publicBrowser390x844": true,
            "nonUniformCloudPixels": true,
            "flightInputChangedState": true,
            "silverSeaSwitch": true,
            "mobileCloudFirstFallback": true,
            "realIPhoneAcceptance": false,
            "productionReady": false
          }
          JSON
          git config user.name 'Weather Mother CI'
          git config user.email 'weather-mother-ci@users.noreply.github.com'
          git add weather-mother/full-weather-r23-mobile-cloud-first-20260910/PUBLIC_QA_MOBILE_2026-09-10.json weather-mother/full-weather-r23-mobile-cloud-first-20260910/PUBLIC_R23_MOBILE_390x844.png weather-mother/full-weather-r23-mobile-cloud-first-20260910/PUBLICATION_PROOF.json
          git commit -m 'qa(weather-mother): prove R23 mobile cloud-first publicly [skip ci]'
          git push origin HEAD:feature/weather-mother-r23-from-r22-silver-flight
