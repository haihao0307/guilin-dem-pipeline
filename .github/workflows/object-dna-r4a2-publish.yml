name: Publish Object DNA R4A.2

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/object-dna-r4a2-publish.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Download verified R4A.2 public dist
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACT_URL='https://sdmntprwestus3.oaiusercontent.com/files/00000000-e160-81fd-9bdc-47f18131d349/raw?se=2026-09-13T07%3A49%3A40Z&sp=r&sv=2026-02-06&sr=b&scid=aae19052-4b3b-53a9-965c-06d09885ca85&skoid=c69179d1-5b5d-430f-afa3-b9bdcf9d6497&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-13T00%3A16%3A27Z&ske=2026-09-14T00%3A16%3A27Z&sks=b&skv=2026-02-06&sig=8lfoZ9GTSdpWll1gDG8VIDyHVemnWqQg4sRUX8JjM1w%3D'
          curl -L --fail --retry 3 --retry-delay 2 "$ARTIFACT_URL" -o /tmp/r4a2.zip
          echo 'c7c986e08f8b6d8238cce4a54b388bb718a9e5c24b3252af532f97562b765f6f  /tmp/r4a2.zip' | sha256sum -c -
          rm -rf /tmp/r4a2 && mkdir -p /tmp/r4a2
          unzip -q /tmp/r4a2.zip -d /tmp/r4a2
          test -s /tmp/r4a2/index.html
          test -s /tmp/r4a2/assets/r4a2-app.js
          test -s /tmp/r4a2/assets/r4a2-style.css
          test -s /tmp/r4a2/object/exterior-v3.json
          grep -q 'R4A.2' /tmp/r4a2/index.html
          grep -q 'measured-rivet-1' /tmp/r4a2/object/exterior-v3.json
      - name: Publish new fixed version without overwriting R4A.1
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          git worktree add /tmp/gh-pages origin/gh-pages
          rm -rf /tmp/gh-pages/object-dna/r4a2-20260913
          mkdir -p /tmp/gh-pages/object-dna/r4a2-20260913
          cp -R /tmp/r4a2/. /tmp/gh-pages/object-dna/r4a2-20260913/
          cd /tmp/gh-pages
          git config user.name 'Object DNA CI'
          git config user.email 'object-dna-ci@users.noreply.github.com'
          git add object-dna/r4a2-20260913
          git commit -m 'publish(object-dna): R4A.2 anti-regression review [skip ci]'
          git push origin HEAD:gh-pages
      - name: Verify live HTTPS payload
        shell: bash
        run: |
          set -euo pipefail
          URL='https://haihao0307.github.io/guilin-dem-pipeline/object-dna/r4a2-20260913/'
          ok=0
          for i in $(seq 1 36); do
            code=$(curl -L -sS -o /tmp/live.html -w '%{http_code}' "$URL" || true)
            if [ "$code" = '200' ] && grep -q 'R4A.2' /tmp/live.html; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = 1
          for p in assets/r4a2-app.js assets/r4a2-style.css object/exterior-v3.json object/r4a-physical-frame.json object/r4a1-visual-state.json; do
            test "$(curl -L -sS -o /tmp/live-asset -w '%{http_code}' "${URL}${p}")" = '200'
            test -s /tmp/live-asset
          done
          curl -L -sS "${URL}object/exterior-v3.json" | grep -q 'measured-rivet-1'
          echo "LIVE_R4A2_OK $URL"
