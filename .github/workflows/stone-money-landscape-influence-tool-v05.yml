name: Stone Money Landscape Influence Tool V05

on:
  push:
    branches:
      - feature/stone-money-landscape-influence-tool-v05-20261002
    paths:
      - tools/stone-money/build_landscape_terrain_influence_v05.py
      - .github/workflows/stone-money-landscape-influence-tool-v05.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build self-contained V05
        run: |
          python -m py_compile tools/stone-money/build_landscape_terrain_influence_v05.py
          python tools/stone-money/build_landscape_terrain_influence_v05.py

      - name: Static verification
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,re
          root=Path('workbenches/landscape-terrain-influence-tool-v05')
          html=(root/'index.html').read_text(encoding='utf-8')
          meta=json.loads((root/'build.json').read_text(encoding='utf-8'))
          required=['R5.K2.G3.T3','P10 复合群峰','landscapeTerrainInfluenceTool','LANDSCAPE_TERRAIN_INFLUENCE_INSTRUMENT_V1','solidDeltaSDF','waterOcclusionField','ltiPresetGrid']
          for token in required: assert token in html, token
          assert '<iframe' not in html.lower()
          assert meta['selfContained'] is True
          assert meta['iframeCount']==0
          assert meta['presetCount']==10
          m=re.search(r'<script id="landscapeTerrainInfluenceTool">(.*?)</script>',html,re.S)
          assert m
          Path('/tmp/lti-v05.js').write_text(m.group(1),encoding='utf-8')
          assert len(html)>130000
          print({'bytes':len(html),'iframeCount':0,'presetCount':10})
          PY
          node --check /tmp/lti-v05.js

      - name: Browser startup proof
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER || true' EXIT
          for i in $(seq 1 80); do
            if curl -fsS http://127.0.0.1:8000/ >/dev/null; then break; fi
            sleep .25
          done
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)
          if [ -z "$CHROME" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq chromium || sudo apt-get install -y -qq chromium-browser
            CHROME=$(command -v chromium || command -v chromium-browser)
          fi
          URL=http://127.0.0.1:8000/workbenches/landscape-terrain-influence-tool-v05/index.html
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage \
            --use-angle=swiftshader --enable-unsafe-swiftshader --ignore-gpu-blocklist \
            --run-all-compositor-stages-before-draw --virtual-time-budget=45000 \
            --window-size=1600,1000 --dump-dom "$URL" >/tmp/lti-v05-dom.html 2>/tmp/lti-v05-chrome.log
          grep -q 'data-lightscape-tool-ready="true"' /tmp/lti-v05-dom.html
          ! grep -q 'data-lightscape-tool-failure' /tmp/lti-v05-dom.html
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage \
            --use-angle=swiftshader --enable-unsafe-swiftshader --ignore-gpu-blocklist \
            --run-all-compositor-stages-before-draw --virtual-time-budget=45000 \
            --window-size=1600,1000 --screenshot=/tmp/lti-v05.png "$URL" >/tmp/lti-v05-shot.log 2>&1
          test -s /tmp/lti-v05.png
          test $(stat -c%s /tmp/lti-v05.png) -gt 100000

      - uses: actions/upload-artifact@v4
        with:
          name: stone-money-landscape-influence-tool-v05-proof
          path: |
            /tmp/lti-v05-dom.html
            /tmp/lti-v05.png
            /tmp/lti-v05-chrome.log
            workbenches/landscape-terrain-influence-tool-v05/build.json
          retention-days: 7

      - name: Commit generated workbench
        run: |
          git config user.name "Landscape Mother"
          git config user.email "actions@users.noreply.github.com"
          git add workbenches/landscape-terrain-influence-tool-v05/index.html \
                  workbenches/landscape-terrain-influence-tool-v05/build.json
          if git diff --cached --quiet; then
            echo "V05 already materialized"
            exit 0
          fi
          git commit -m "feat(landscape): materialize self-contained influence tool v05 [skip ci]"
          git push
