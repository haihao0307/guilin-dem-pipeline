name: Terrain V07 cache-removal feasibility QA
on:
  push:
    branches: ['trial/terrain-v07-cache-cleanup-20261021']
    paths:
      - 'landscape-terrain-influence-tool-v07/tests/**'
      - '.github/workflows/terrain-v07-cleanup-qa.yml'
permissions:
  contents: read
concurrency:
  group: terrain-v07-cleanup-${{ github.ref }}
  cancel-in-progress: false
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      QA_COMMIT: ${{ github.sha }}
    steps:
      - name: Fetch scoped QA scripts without checking out the full site
        env:
          QA_COMMIT: ${{ github.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/terrain-v07-qa"
          cd "$RUNNER_TEMP/terrain-v07-qa"
          ROOT="https://raw.githubusercontent.com/haihao0307/guilin-dem-pipeline/$QA_COMMIT/landscape-terrain-influence-tool-v07/tests"
          curl --fail --show-error --location "$ROOT/public-smoke.py" --output qa.py
          curl --fail --show-error --location "$ROOT/generator-equivalence.cjs" --output test-generator.cjs
      - name: Install the existing pinned official browser runner
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Verify deployed P01 startup and P03 full generation
        working-directory: ${{ runner.temp }}/terrain-v07-qa
        run: python qa.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: terrain-v07-feasibility-${{ github.sha }}
          path: ${{ runner.temp }}/terrain-v07-qa/qa-results
          if-no-files-found: warn
          retention-days: 1
