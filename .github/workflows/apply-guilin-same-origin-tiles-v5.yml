name: Apply Guilin same-origin tiles v5

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/apply_guilin_same_origin_tiles_v5.py
      - .github/workflows/apply-guilin-same-origin-tiles-v5.yml

permissions:
  contents: write

concurrency:
  group: apply-guilin-same-origin-tiles-v5
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply runtime source migration
        run: |
          set -euo pipefail
          python tools/apply_guilin_same_origin_tiles_v5.py
          node --check viewer/app.js
          python -m py_compile pipeline/distill_online_runtime.py tests/browser_full_map_cdp.py
          grep -q "../guilin-truth-data/native/" viewer/app.js
          grep -q "same-origin-on-demand" viewer/app.js
          grep -q "same-origin-on-demand" tests/browser_full_map_cdp.py
          grep -q "runtime_native_tile_store" pipeline/distill_online_runtime.py
          ! grep -q "TILE_RELEASE_BASE_URL" viewer/app.js
      - name: Commit production source
        run: |
          set -euo pipefail
          git config user.name 'Haihao_Nature Grace HK'
          git config user.email 'haihao0307@gmail.com'
          git add viewer/app.js tests/browser_full_map_cdp.py pipeline/distill_online_runtime.py
          git diff --cached --check
          git commit -m 'fix(guilin): serve native tiles from same-origin runtime store'
          git push origin HEAD:main
