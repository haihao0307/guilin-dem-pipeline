name: NPC living courtyard R01 candidate
on:
  push:
    branches: [feature/npc-living-courtyard-r01-20261020]
    paths:
      - 'kaopu-unified-human-workbench/npc-living-courtyard-r01/**'
      - '.github/workflows/npc-living-courtyard-r01.yml'
permissions:
  contents: write
  pages: write
concurrency:
  group: npc-living-courtyard-r01-${{ github.sha }}
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SOURCE_HEAD: ${{ github.sha }}
      NPC_BOOT_TIMEOUT_MS: 600000
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: kaopu-unified-human-workbench/npc-living-courtyard-r01
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the SHA-locked native candidate
        working-directory: kaopu-unified-human-workbench/npc-living-courtyard-r01
        run: |
          node prepare.cjs --all-native
          node prune-observed.cjs --evidence observed-assets.json --qa observed-assets-qa.json --output vendor/PACKETS.json
          node src/life-tests.mjs
          node build.cjs
      - name: Prepare isolated real Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Verify actual native interactions and UI disruptions
        timeout-minutes: 17
        env:
          NPC_QA_PHASE: suite
          NPC_QA_OUT: /tmp/courtyard-suite
        run: node kaopu-unified-human-workbench/npc-living-courtyard-r01/verify-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: courtyard-suite-${{ github.sha }}
          path: /tmp/courtyard-suite
          retention-days: 14
      - name: Package the same observed native packet set into one document
        working-directory: kaopu-unified-human-workbench/npc-living-courtyard-r01
        run: |
          node build.cjs --offline
      - name: Verify the standalone file and autonomous actions with networking disabled
        timeout-minutes: 17
        working-directory: kaopu-unified-human-workbench/npc-living-courtyard-r01
        env:
          NPC_QA_PHASE: offline
          NPC_QA_OUT: /tmp/courtyard-offline
          PREVIEW_FILE: standalone.html
          NPC_BUILD_FILE: BUILD.standalone.json
        run: node verify-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: courtyard-standalone-${{ github.sha }}
          path: |
            /tmp/courtyard-offline
            kaopu-unified-human-workbench/npc-living-courtyard-r01/standalone.html
            kaopu-unified-human-workbench/npc-living-courtyard-r01/BUILD.standalone.json
            kaopu-unified-human-workbench/npc-living-courtyard-r01/vendor/PACKETS.json
          retention-days: 30
      - name: Require executed gates and stage only exact candidate resources
        run: node kaopu-unified-human-workbench/npc-living-courtyard-r01/stage-public.cjs
      - name: Verify the existing Pages destination before any publication
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NPC_HTTP_OUT: /tmp/courtyard-public-http
        run: node kaopu-unified-human-workbench/npc-living-courtyard-r01/request-public-build.cjs --check
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: public-pages
          sparse-checkout: npc-living-courtyard
      - name: Publish one new version directory on the existing Pages site
        run: |
          cd public-pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          out="npc-living-courtyard/r01-20261020/${SOURCE_HEAD}"
          if test -e "$out"; then
            echo 'The immutable candidate directory already exists; refusing to overwrite it.'
            exit 1
          fi
          mkdir -p "$out"
          cp -R /tmp/courtyard-public/. "$out/"
          git add -- "$out"
          git commit -m "Publish isolated living courtyard candidate ${SOURCE_HEAD}"
          for attempt in 1 2 3; do
            git fetch origin gh-pages
            git rebase origin/gh-pages
            if git push origin HEAD:gh-pages; then
              printf 'PAGES_SOURCE_SHA=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          exit 1
      - name: Request a build of the existing branch-backed Pages site
        timeout-minutes: 22
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NPC_HTTP_OUT: /tmp/courtyard-public-http
        run: node kaopu-unified-human-workbench/npc-living-courtyard-r01/request-public-build.cjs
      - name: Wait for exact public HTML and source receipt
        timeout-minutes: 22
        env:
          NPC_HTTP_OUT: /tmp/courtyard-public-http
        run: node kaopu-unified-human-workbench/npc-living-courtyard-r01/wait-public.cjs
      - name: Verify the fixed public webpage through actual UI
        timeout-minutes: 17
        env:
          NPC_QA_PHASE: public
          NPC_QA_OUT: /tmp/courtyard-public-browser
          PREVIEW_URL: https://haihao0307.github.io/guilin-dem-pipeline/npc-living-courtyard/r01-20261020/${{ github.sha }}/
        run: node kaopu-unified-human-workbench/npc-living-courtyard-r01/verify-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: courtyard-public-${{ github.sha }}
          path: |
            /tmp/courtyard-public-browser
            /tmp/courtyard-public-http
            kaopu-unified-human-workbench/npc-living-courtyard-r01/BUILD.json
          retention-days: 30
