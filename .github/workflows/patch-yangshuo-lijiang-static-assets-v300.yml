name: Patch Yangshuo Lijiang viewer to same-origin assets v3.0

on:
  push:
    branches:
      - skill/dem-procedural-landscape-v010
    paths:
      - .github/workflows/patch-yangshuo-lijiang-static-assets-v300.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: patch-yangshuo-lijiang-static-assets-v300
  cancel-in-progress: false

jobs:
  patch-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Patch live viewer
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          git worktree add "$RUNNER_TEMP/gh-pages" origin/gh-pages
          page="$RUNNER_TEMP/gh-pages/yangshuo-lijiang-2048-v300/index.html"
          test -f "$page"
          test -f "$RUNNER_TEMP/gh-pages/yangshuo-lijiang-2048-v300/data/index.json"
          PAGE="$page" python - <<'PY'
          import os
          from pathlib import Path

          path = Path(os.environ['PAGE'])
          s = path.read_text(encoding='utf-8')
          old_import = "    import { fromUrl } from 'https://cdn.jsdelivr.net/npm/geotiff@2.1.3/+esm';\n"
          old_release = "    const RELEASE_URL = 'https://github.com/haihao0307/guilin-dem-pipeline/releases/download/guilin-v070-raw-mosaic-v001/guilin_raw_union_12_5m.tif';\n"
          old_expected = "    const EXPECTED = { width:17408, height:18867, resolution:12.5, sourceSha:'9490b1bd34f67336352cf448729f763ae4e241637d821961efd0290e29d6c9d4' };"
          old_vars = "    let renderer,scene,camera,controls,terrain,wire,texture,sourceHeights,baseVertexHeights,current=CANDIDATES.D,currentMin=0,currentMax=1,currentGrid=512,tiffImage,riverGeoJSON,riverGroup,verticalScale=1;"
          for needle in (old_import, old_release, old_expected, old_vars):
              if needle not in s:
                  raise SystemExit(f'Expected live page pattern missing: {needle[:90]}')

          s = s.replace(old_import, '')
          s = s.replace(old_release, "    const DATA_ROOT = './data';\n    const ASSET_VERSION = '3004';\n")
          s = s.replace(old_expected, "    const EXPECTED = { grid:[2048,2048], resolution:12.5, sourceSha:'9490b1bd34f67336352cf448729f763ae4e241637d821961efd0290e29d6c9d4' };")
          s = s.replace(old_vars, "    let renderer,scene,camera,controls,terrain,wire,texture,sourceHeights,baseVertexHeights,current=CANDIDATES.D,currentMin=0,currentMax=1,currentGrid=512,assetIndex,currentManifest,riverGeoJSON,riverGroup,verticalScale=1;\n    const assetCache=new Map();")

          start = s.index('    async function ensureSource(){')
          end = s.index('\n    function scanHeights', start)
          new_block = '''    async function sha256Hex(buffer){
              const digest=await crypto.subtle.digest('SHA-256',buffer);
              return Array.from(new Uint8Array(digest),b=>b.toString(16).padStart(2,'0')).join('');
            }

            async function ensureSource(){
              if(assetIndex)return;
              progress(8,'连接同源资产','读取已校验的 2048 原生高程索引。');
              const response=await fetch(`${DATA_ROOT}/index.json?v=${ASSET_VERSION}`,{cache:'no-cache'});
              if(!response.ok)throw new Error(`原生高程索引 HTTP ${response.status}`);
              assetIndex=await response.json();
              if(assetIndex?.source?.sha256!==EXPECTED.sourceSha)throw new Error('源 DEM SHA256 与锁定值不符');
              if(assetIndex?.source?.pixelSpacingMeters!==EXPECTED.resolution)throw new Error('源 DEM 分辨率与 12.5 米锁定值不符');
              if(assetIndex?.grid?.[0]!==2048||assetIndex?.grid?.[1]!==2048)throw new Error('发布资产并非 2048 × 2048 原生窗口');
              if(assetIndex?.resampling!==false||assetIndex?.gapFill!==false)throw new Error('发布资产违反无重采样或无补洞规则');
              for(const id of ORDER){if(!assetIndex?.candidates?.[id])throw new Error(`缺少候选 ${id} 的锁定清单`)}
              $('sourceCheck').className='dot ok';
            }

            async function readCandidate(candidate){
              if(assetCache.has(candidate.id))return assetCache.get(candidate.id);
              progress(18,'读取原生像元',`候选 ${candidate.id} · ${candidate.name} · 2048 × 2048`);
              const manifestResponse=await fetch(`${DATA_ROOT}/${candidate.id}/manifest.json?v=${ASSET_VERSION}`,{cache:'no-cache'});
              if(!manifestResponse.ok)throw new Error(`候选 ${candidate.id} 清单 HTTP ${manifestResponse.status}`);
              const manifest=await manifestResponse.json();
              if(manifest.sourceSha256!==EXPECTED.sourceSha)throw new Error(`候选 ${candidate.id} 源 SHA256 不符`);
              if(manifest.grid?.[0]!==2048||manifest.grid?.[1]!==2048||manifest.pixelSpacingMeters!==12.5)throw new Error(`候选 ${candidate.id} 网格规格不符`);
              if(manifest.resampling!==false||manifest.gapFill!==false)throw new Error(`候选 ${candidate.id} 违反原生像元规则`);
              if(JSON.stringify(manifest.window)!==JSON.stringify(candidate.window))throw new Error(`候选 ${candidate.id} 像元窗口不符`);
              const heightResponse=await fetch(`${DATA_ROOT}/${candidate.id}/${manifest.heightFile}?v=${ASSET_VERSION}`,{cache:'force-cache'});
              if(!heightResponse.ok)throw new Error(`候选 ${candidate.id} 高程 HTTP ${heightResponse.status}`);
              const buffer=await heightResponse.arrayBuffer();
              if(buffer.byteLength!==2048*2048*2||buffer.byteLength!==manifest.heightBytes)throw new Error(`候选 ${candidate.id} 高程字节数不符`);
              progress(28,'校验高程哈希',`候选 ${candidate.id} · SHA256`);
              const actualSha=await sha256Hex(buffer);
              if(actualSha!==manifest.heightSha256)throw new Error(`候选 ${candidate.id} 高程 SHA256 不符`);
              let data=new Int16Array(buffer);
              const littleEndian=new Uint8Array(new Uint16Array([1]).buffer)[0]===1;
              if(!littleEndian){
                const swapped=new Int16Array(data.length);
                const view=new DataView(buffer);
                for(let i=0;i<swapped.length;i++)swapped[i]=view.getInt16(i*2,true);
                data=swapped;
              }
              const result={data,manifest};
              assetCache.set(candidate.id,result);
              return result;
            }

            async function loadTerrainTexture(candidate,manifest){
              progress(54,'加载 2048 地表纹理',`候选 ${candidate.id} · 同源编译纹理`);
              const url=`${DATA_ROOT}/${candidate.id}/${manifest.textureFile}?v=${ASSET_VERSION}`;
              return await new Promise((resolve,reject)=>{
                new THREE.TextureLoader().load(url,tex=>{
                  tex.colorSpace=THREE.SRGBColorSpace;
                  tex.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());
                  tex.wrapS=tex.wrapT=THREE.ClampToEdgeWrapping;
                  resolve(tex);
                },undefined,error=>reject(new Error(`候选 ${candidate.id} 地表纹理加载失败：${error?.message||error}`)));
              });
            }
          '''
          s = s[:start] + new_block + s[end:]

          palette_start = s.index('    function palette(t){')
          dispose_start = s.index('\n    function disposeTerrain', palette_start)
          s = s[:palette_start] + s[dispose_start + 1:]

          old_load = """        await ensureSource();const data=await readWindow(current);progress(34,'验证像元覆盖');const stats=scanHeights(data);if(stats.fraction<.995)throw new Error(`有效覆盖率 ${(stats.fraction*100).toFixed(3)}%，低于 99.5% 门槛`);$('validFraction').textContent=(stats.fraction*100).toFixed(3)+'%';$('elevationRange').textContent=`${stats.min.toFixed(1)}–${stats.max.toFixed(1)} m`;$('windowCheck').className='dot ok';
                  const tex=await buildTexture(data,stats.min,stats.max);progress(72,'构建三维网格');buildTerrain(data,stats.min,stats.max,tex);await ensureRiverData();progress(88,'叠加漓江');buildRivers();viewPreset('overview');
          """
          new_load = """        await ensureSource();const {data,manifest}=await readCandidate(current);currentManifest=manifest;progress(38,'验证像元覆盖');const stats=scanHeights(data);if(stats.fraction<.995)throw new Error(`有效覆盖率 ${(stats.fraction*100).toFixed(3)}%，低于 99.5% 门槛`);if(Math.abs(stats.fraction-manifest.validFraction)>1e-7||stats.min!==manifest.minimumElevationMeters||stats.max!==manifest.maximumElevationMeters)throw new Error(`候选 ${current.id} 浏览器复核与编译清单不一致`);$('sourceGrid').textContent=`${manifest.grid[0]} × ${manifest.grid[1]}`;$('validFraction').textContent=(stats.fraction*100).toFixed(3)+'%';$('elevationRange').textContent=`${stats.min.toFixed(1)}–${stats.max.toFixed(1)} m`;$('windowCheck').className='dot ok';
                  const tex=await loadTerrainTexture(current,manifest);progress(72,'构建三维网格');buildTerrain(data,stats.min,stats.max,tex);await ensureRiverData();progress(88,'叠加漓江');buildRivers();viewPreset('overview');
          """
          if old_load not in s:
              raise SystemExit('Old live loadCandidate block missing')
          s = s.replace(old_load, new_load)
          s = s.replace('连接已锁定的 12.5 米 GeoTIFF，并读取候选 D。', '读取同源发布的 2048 原生高程资产，并打开候选 D。')

          if 'fromUrl' in s or 'RELEASE_URL' in s or 'buildTexture(' in s or 'readWindow(' in s:
              raise SystemExit('Cross-origin runtime code remains after patch')
          if "const DATA_ROOT = './data';" not in s or 'readCandidate(current)' not in s:
              raise SystemExit('Same-origin runtime patch is incomplete')
          path.write_text(s, encoding='utf-8')
          PY

          python - <<'PY'
          import os
          import re
          from pathlib import Path
          page = Path(os.environ['RUNNER_TEMP']) / 'gh-pages' / 'yangshuo-lijiang-2048-v300' / 'index.html'
          html = page.read_text(encoding='utf-8')
          script = re.search(r'<script type="module">(.*?)</script>', html, re.S).group(1)
          script = '\n'.join(line for line in script.splitlines() if not line.strip().startswith('import '))
          (Path(os.environ['RUNNER_TEMP']) / 'yangshuo-v300-page.js').write_text(script, encoding='utf-8')
          PY
          node --check "$RUNNER_TEMP/yangshuo-v300-page.js"

          cd "$RUNNER_TEMP/gh-pages"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add yangshuo-lijiang-2048-v300/index.html
          git commit -m 'Fix Yangshuo 2048 viewer with same-origin native assets'
          git pull --rebase origin gh-pages
          git push origin HEAD:gh-pages
