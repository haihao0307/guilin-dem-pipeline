name: Weather Mother V1.7.3 iPhone Max candidate gate
on:
  push:
    branches: [gh-pages]
    paths:
      - '.github/workflows/weather-mother-v173-candidate-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Verify candidate package identity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,gzip,hashlib,json
          root=Path('weather-mother')
          b=root/'studio-v072'; t=root/'studio-v073'
          bm=json.loads((b/'MANIFEST.json').read_text())
          base=gzip.decompress(base64.b64decode(''.join((b/c['file']).read_text() for c in bm['chunks'])))
          tm=json.loads((t/'MANIFEST.json').read_text())
          assert len(base)==tm['baseSourceBytes']
          assert hashlib.sha256(base).hexdigest()==tm['baseSourceSHA256']
          enc=''.join((t/c['file']).read_text() for c in tm['patchChunks'])
          for c in tm['patchChunks']:
              raw=(t/c['file']).read_bytes()
              assert len(raw)==c['bytes']
              assert hashlib.sha256(raw).hexdigest()==c['sha256']
          patch=json.loads(gzip.decompress(base64.b64decode(enc)))
          lines=base.decode().splitlines(keepends=True)
          final=''.join(''.join(lines[o[1]:o[2]]) if o[0]=='c' else o[1] for o in patch['ops']).encode()
          assert tm['version']=='0.7.3-iphone-max-adaptive'
          assert len(final)==tm['sourceBytes']
          assert hashlib.sha256(final).hexdigest()==tm['sourceSHA256']
          text=final.decode()
          assert text.count('data-module=')==6
          assert text.count('data-rain-section=')==6
          assert 'applySheetHeight' in text and '--wm-panel-h' in text
          assert '../v110-full/?embedded=1&studio=073' in text
          assert '../liquid-rain-v130/?embedded=1&studio=073&v=130' in text
          print('candidate identity passed')
          PY
      - name: Install current Chromium and WebKit
        run: |
          python3 -m pip install --upgrade playwright
          python3 -m playwright install --with-deps chromium webkit
      - name: Verify iPhone Max interaction
        run: |
          cat >/tmp/gate.py <<'PY'
          import json,time
          from playwright.sync_api import sync_playwright
          BASE='https://haihao0307.github.io/guilin-dem-pipeline/weather-mother/studio-v073/'
          result={}
          def inside(box,w,h):
              return box and box['x']>=-1 and box['y']>=-1 and box['right']<=w+1 and box['bottom']<=h+1 and box['width']>0 and box['height']>0
          with sync_playwright() as p:
              chromium=p.chromium.launch(headless=True,args=['--no-sandbox','--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader'])
              for name,w,h,ori,deep in [('portrait',430,932,'portrait',True),('landscape',932,430,'landscape',False)]:
                  ctx=chromium.new_context(viewport={'width':w,'height':h},screen={'width':w,'height':h},is_mobile=True,has_touch=True,device_scale_factor=3)
                  page=ctx.new_page(); errors=[]; failed=[]
                  page.on('pageerror',lambda e,errors=errors:errors.append(str(e)))
                  page.on('console',lambda m,errors=errors:errors.append(m.text) if m.type=='error' else None)
                  page.on('requestfailed',lambda r,failed=failed:failed.append(r.url))
                  page.add_init_script("window.WeatherMotherBoot={quality:'low',still:true,weather:'fair'}")
                  page.goto(BASE+'?module=world&gate='+name+'&t='+str(time.time_ns()),wait_until='domcontentloaded',timeout=60000)
                  page.wait_for_function("window.__WEATHER_MOTHER_STUDIO__?.version==='0.7.3-iphone-max-adaptive'",timeout=60000)
                  page.wait_for_function("document.querySelector('#stage')?.contentWindow?.WeatherMother?.qa?.ready",timeout=120000)
                  state=page.evaluate('__WEATHER_MOTHER_STUDIO__.getState()')
                  assert state['module']=='world' and not state['sheetOpen'] and state['orientation']==ori
                  launcher=page.evaluate("document.querySelector('#launcher').getBoundingClientRect().toJSON()")
                  assert inside(launcher,w,h) and round(launcher['width'])==48 and round(launcher['height'])==48
                  page.locator('#launcher').click(); page.wait_for_function('__WEATHER_MOTHER_STUDIO__.getState().sheetOpen'); page.wait_for_timeout(500)
                  sheet=page.evaluate("document.querySelector('#sheet').getBoundingClientRect().toJSON()")
                  assert inside(sheet,w,h)
                  assert page.locator('[data-module]').count()==6
                  if ori=='portrait':
                      assert sheet['width']>=w-24 and 250<=sheet['height']<=h*.75
                  else:
                      assert sheet['width']<=400 and sheet['height']>=h-30
                  page.locator('[data-module="rain"]').click()
                  page.wait_for_function("__WEATHER_MOTHER_STUDIO__.getState().module==='rain' && !__WEATHER_MOTHER_STUDIO__.getState().sheetOpen",timeout=30000)
                  page.wait_for_function("document.querySelector('#stage')?.contentWindow?.WeatherLiquid?.getState()?.frames>0",timeout=120000)
                  if deep:
                      page.locator('#launcher').click(); page.wait_for_function("__WEATHER_MOTHER_STUDIO__.getState().sheetOpen && __WEATHER_MOTHER_STUDIO__.getState().tab==='controls'",timeout=30000); page.wait_for_timeout(500)
                      assert page.locator('[data-rain-section]').count()==6
                      page.locator('[data-rain-section="glass"]').click()
                      page.wait_for_function("document.querySelector('#stage')?.contentWindow?.WeatherLiquidUI?.isOpen?.() && document.querySelector('#stage')?.contentWindow?.WeatherLiquidUI?.getSection?.()==='glass'",timeout=30000); page.wait_for_timeout(350)
                      panel=page.evaluate("""()=>{const f=document.querySelector('#stage'),d=f.contentDocument,p=d.querySelector('#panel'),b=p.getBoundingClientRect(),ui=f.contentWindow.WeatherLiquidUI;return{...b.toJSON(),open:ui.isOpen(),section:ui.getSection(),launcher:getComputedStyle(document.querySelector('#launcher')).pointerEvents}}""")
                      assert inside(panel,w,h) and panel['open'] and panel['section']=='glass' and panel['launcher']=='none'
                      assert panel['width']>=w-24 and panel['height']<=h*.75
                      page.evaluate("document.querySelector('#stage').contentDocument.querySelector('#done').click()")
                      page.wait_for_function("!document.querySelector('#stage')?.contentWindow?.WeatherLiquidUI?.isOpen?.()",timeout=30000)
                  assert page.evaluate('document.documentElement.scrollWidth-document.documentElement.clientWidth')==0
                  assert not errors and not failed,(name,errors,failed)
                  result['chromium-'+name]={'launcher':launcher,'sheet':sheet}
                  ctx.close()
              chromium.close()
              webkit=p.webkit.launch(headless=True)
              for name,w,h,ori in [('portrait',430,932,'portrait'),('landscape',932,430,'landscape')]:
                  ctx=webkit.new_context(viewport={'width':w,'height':h},screen={'width':w,'height':h},is_mobile=True,has_touch=True,device_scale_factor=3)
                  page=ctx.new_page(); errors=[]; failed=[]
                  page.on('pageerror',lambda e,errors=errors:errors.append(str(e)))
                  page.on('console',lambda m,errors=errors:errors.append(m.text) if m.type=='error' else None)
                  page.on('requestfailed',lambda r,failed=failed:failed.append(r.url))
                  page.goto(BASE+'?module=world&webkit='+name+'&t='+str(time.time_ns()),wait_until='domcontentloaded',timeout=60000)
                  page.wait_for_function("window.__WEATHER_MOTHER_STUDIO__?.version==='0.7.3-iphone-max-adaptive'",timeout=60000)
                  state=page.evaluate('__WEATHER_MOTHER_STUDIO__.getState()')
                  assert state['module']=='world' and not state['sheetOpen'] and state['orientation']==ori
                  launcher=page.evaluate("document.querySelector('#launcher').getBoundingClientRect().toJSON()")
                  assert inside(launcher,w,h) and round(launcher['width'])==48 and round(launcher['height'])==48
                  page.locator('#launcher').click(); page.wait_for_function('__WEATHER_MOTHER_STUDIO__.getState().sheetOpen'); page.wait_for_timeout(500)
                  sheet=page.evaluate("document.querySelector('#sheet').getBoundingClientRect().toJSON()")
                  assert inside(sheet,w,h) and page.locator('[data-module]').count()==6
                  if ori=='portrait': assert sheet['width']>=w-24 and 200<=sheet['height']<=h*.8
                  else: assert sheet['width']<=400 and sheet['height']>=h-30
                  assert page.evaluate('document.documentElement.scrollWidth-document.documentElement.clientWidth')==0
                  assert not errors and not failed,(name,errors,failed)
                  result['webkit-'+name]={'launcher':launcher,'sheet':sheet}
                  ctx.close()
              webkit.close()
          print(json.dumps(result,ensure_ascii=False,indent=2))
          PY
          xvfb-run -a python3 -u /tmp/gate.py
