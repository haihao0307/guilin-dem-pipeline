name: Landscape Small Karst Brick V2.6 R2.2 Exact

on:
  push:
    branches:
      - feature/landscape-small-karst-brick-v26-r2-20260919
    paths:
      - workbenches/landscape-small-karst-field-r2-2-brick-v26-exact/build_r22.py
      - .github/workflows/landscape-small-karst-brick-v26-r22-exact.yml

permissions:
  contents: write

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build exact V2.6 transfer
        run: |
          python -m py_compile workbenches/landscape-small-karst-field-r2-2-brick-v26-exact/build_r22.py
          python workbenches/landscape-small-karst-field-r2-2-brick-v26-exact/build_r22.py

      - name: Static contract and shader compilation
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,re
          root=Path('workbenches/landscape-small-karst-field-r2-2-brick-v26-exact')
          s=(root/'index.html').read_text(encoding='utf-8')
          b=json.loads((root/'build.json').read_text(encoding='utf-8'))
          required=[
            'STRICT_BRICK_V26_STONE_BLOCK_EXACT',
            'const GEOMETRY_FS=', 'const MATERIAL_FS=',
            'two-pass-exact-v26', 'uHoleSize', '孔洞大小',
            'Brick Mother V2.6 stone-block unmodified fragment path',
            'fixedUngatedPoreRings',
            'data-karst-ready'
          ]
          for token in required: assert token in s or token in json.dumps(b), token
          assert b['schema']=='LANDSCAPE_SMALL_KARST_BRICK_V26_R22_EXACT'
          assert b['removedLandscapeMaterialMixing'] is True
          assert b['fixedUngatedPoreRings'] is True
          for name,file in [('VS','/tmp/r22.vert'),('GEOMETRY_FS','/tmp/r22-geom.frag'),('MATERIAL_FS','/tmp/r22-mat.frag')]:
            m=re.search(rf'const {name}=`(.*?)`;',s,re.S);assert m,name
            Path(file).write_text(m.group(1),encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',s,re.S);assert scripts
          Path('/tmp/r22-app.js').write_text(scripts[-1],encoding='utf-8')
          PY
          node --check /tmp/r22-app.js
          sudo apt-get update -qq
          sudo apt-get install -y -qq glslang-tools
          glslangValidator -S vert /tmp/r22.vert
          glslangValidator -S frag /tmp/r22-geom.frag
          glslangValidator -S frag /tmp/r22-mat.frag

      - name: Run Chromium and capture proof
        run: |
          python3 -m http.server 8000 >/tmp/http.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/ >/dev/null && break; sleep .2; done
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)
          if [ -z "$CHROME" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq chromium-browser || sudo apt-get install -y -qq chromium
            CHROME=$(command -v chromium || command -v chromium-browser)
          fi
          URL=http://127.0.0.1:8000/workbenches/landscape-small-karst-field-r2-2-brick-v26-exact/index.html
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage \
            --use-angle=swiftshader --enable-unsafe-swiftshader --ignore-gpu-blocklist \
            --run-all-compositor-stages-before-draw --virtual-time-budget=22000 \
            --dump-dom "$URL" >/tmp/r22-dom.html 2>/tmp/r22-chrome.log
          grep -q 'data-karst-ready="true"' /tmp/r22-dom.html
          ! grep -q 'data-karst-failure="true"' /tmp/r22-dom.html
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage \
            --use-angle=swiftshader --enable-unsafe-swiftshader --ignore-gpu-blocklist \
            --run-all-compositor-stages-before-draw --virtual-time-budget=22000 \
            --window-size=1440,1000 --screenshot=/tmp/r22.png "$URL" \
            >/tmp/r22-shot.log 2>&1
          test -s /tmp/r22.png
          test $(stat -c%s /tmp/r22.png) -gt 100000
          mkdir -p /tmp/r22-proof
          cp /tmp/r22.png /tmp/r22-proof/r22.png
          cp /tmp/r22-dom.html /tmp/r22-proof/dom.html
          cp workbenches/landscape-small-karst-field-r2-2-brick-v26-exact/build.json /tmp/r22-proof/build.json

      - uses: actions/upload-artifact@v4
        with:
          name: landscape-small-karst-r22-exact-proof
          path: /tmp/r22-proof
          retention-days: 7

      - name: Materialize browser-tested R2.2
        run: |
          git config user.name "Landscape Mother"
          git config user.email "actions@users.noreply.github.com"
          git add workbenches/landscape-small-karst-field-r2-2-brick-v26-exact/index.html \
                  workbenches/landscape-small-karst-field-r2-2-brick-v26-exact/build.json
          if git diff --cached --quiet; then
            echo "R2.2 already materialized"
            exit 0
          fi
          git commit -m "fix(landscape): materialize exact Brick V2.6 R2.2 [skip ci]"
          git push
