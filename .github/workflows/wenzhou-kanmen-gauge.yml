name: Wenzhou Kanmen UHSLC gauge ingest

on:
  push:
    branches:
      - project/wenzhou-v100-bathymetry-tides-hydrology
    paths:
      - .github/workflows/wenzhou-kanmen-gauge.yml
      - projects/wenzhou/coastal/config/tide_points_v100.json
      - projects/wenzhou/coastal/config/kanmen_station_metadata_v100.json
      - projects/wenzhou/coastal/scripts/download_kanmen_uhslc.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wenzhou-kanmen-uhslc
  cancel-in-progress: true

jobs:
  ingest-kanmen:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      !contains(github.event.head_commit.message, '[skip kanmen gauge]')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout exact coastal branch
        uses: actions/checkout@v4
        with:
          ref: project/wenzhou-v100-bathymetry-tides-hydrology
          fetch-depth: 0
          lfs: false

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install station OPeNDAP runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check \
            'numpy>=2.0,<3' \
            'pandas>=2.2,<3' \
            'xarray>=2024.10,<2027' \
            'pydap>=3.5,<4'
          python - <<'PY'
          import numpy, pandas, pydap, xarray
          print('numpy', numpy.__version__)
          print('pandas', pandas.__version__)
          print('pydap', pydap.__version__)
          print('xarray', xarray.__version__)
          PY

      - name: Validate configuration and script
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = 'project/wenzhou-v100-bathymetry-tides-hydrology'
          python -m py_compile projects/wenzhou/coastal/scripts/download_kanmen_uhslc.py
          python -m json.tool projects/wenzhou/coastal/config/tide_points_v100.json >/dev/null
          python -m json.tool projects/wenzhou/coastal/config/kanmen_station_metadata_v100.json >/dev/null

      - name: Download and validate official UHSLC Kanmen station record
        shell: bash
        run: |
          set -euo pipefail
          python projects/wenzhou/coastal/scripts/download_kanmen_uhslc.py

      - name: Assert observation identity and QA
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          import hashlib
          import json
          from datetime import datetime
          from pathlib import Path

          root = Path('.')
          acquisition = json.loads((root / 'projects/wenzhou/coastal/reports/KANMEN_UHSLC_ACQUISITION.json').read_text())
          qa = json.loads((root / 'projects/wenzhou/coastal/reports/KANMEN_UHSLC_QA.json').read_text())
          assert acquisition['passed'] is True
          assert qa['passed'] is True
          assert acquisition['sourceMode'] == 'dedicated station OPeNDAP record'
          assert acquisition['uhslcId'] == 632
          assert acquisition['recordId'] == 6321
          assert acquisition['version'] == 'A'
          assert qa['identityPassed'] is True
          assert qa['qualityPassed'] is True
          assert qa['timePassed'] is True
          assert qa['coveragePassed'] is True
          assert qa['absoluteDatumTransformApplied'] is False
          assert qa['qualityHistogram'] == {'4': qa['validSampleCount']}
          assert qa['duplicateTimestampCount'] == 0
          assert qa['unexpectedTimestampCount'] == 0
          assert qa['completenessFraction'] >= 0.95
          assert len(acquisition['files']) == 5

          checked = []
          for item in acquisition['files']:
              path = root / item['path']
              assert path.is_file(), path
              digest = hashlib.sha256()
              with path.open('rb') as handle:
                  for chunk in iter(lambda: handle.read(8 * 1024 * 1024), b''):
                      digest.update(chunk)
              assert path.stat().st_size == item['bytes']
              assert digest.hexdigest() == item['sha256']
              checked.append(item)

          normalized_item = next(
              item for item in acquisition['files']
              if item['role'] == 'mean_removed_comparison_series'
          )
          normalized_path = root / normalized_item['path']
          with normalized_path.open(encoding='utf-8', newline='') as handle:
              rows = list(csv.DictReader(handle))
          assert len(rows) == qa['validSampleCount']
          assert rows
          previous = None
          for row in rows:
              current = datetime.fromisoformat(row['time_utc'].replace('Z', '+00:00'))
              if previous is not None:
                  assert current > previous
              previous = current
              assert int(row['uhslc_id']) == 632
              assert int(row['record_id']) == 6321
              assert row['version'] == 'A'
              assert int(row['quality']) == 4
          print(json.dumps({'qa': qa, 'checked': checked}, indent=2))
          PY

      - name: Commit Kanmen observation evidence
        id: commit_observations
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            projects/wenzhou/coastal/data/gauges/kanmen \
            projects/wenzhou/coastal/reports/KANMEN_UHSLC_ACQUISITION.json \
            projects/wenzhou/coastal/reports/KANMEN_UHSLC_QA.json
          test -n "$(git diff --cached --name-only)"
          git commit -m 'Add verified Kanmen UHSLC station window [skip kanmen gauge] [skip coastal stage-a]'
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git push origin HEAD:project/wenzhou-v100-bathymetry-tides-hydrology

      - name: Verify observations from a fresh clone
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/wenzhou-kanmen-fresh
          git clone --depth 1 --branch project/wenzhou-v100-bathymetry-tides-hydrology \
            "https://github.com/${GITHUB_REPOSITORY}.git" /tmp/wenzhou-kanmen-fresh
          cd /tmp/wenzhou-kanmen-fresh
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path('.')
          acquisition = json.loads((root / 'projects/wenzhou/coastal/reports/KANMEN_UHSLC_ACQUISITION.json').read_text())
          qa = json.loads((root / 'projects/wenzhou/coastal/reports/KANMEN_UHSLC_QA.json').read_text())
          assert acquisition['passed'] is True
          assert qa['passed'] is True
          checked = []
          for item in acquisition['files']:
              path = root / item['path']
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              assert path.stat().st_size == item['bytes']
              assert digest == item['sha256']
              checked.append({'role': item['role'], 'path': item['path'], 'bytes': item['bytes'], 'sha256': digest})
          evidence = {'freshDownloadVerified': True, 'files': checked}
          Path('/tmp/wenzhou-kanmen-fresh-verification.json').write_text(json.dumps(evidence, indent=2) + '\n')
          print(json.dumps(evidence, indent=2))
          PY

      - name: Record Kanmen round trip receipt
        shell: bash
        env:
          OBSERVATION_COMMIT: ${{ steps.commit_observations.outputs.commit }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          fresh = json.loads(Path('/tmp/wenzhou-kanmen-fresh-verification.json').read_text())
          acquisition = json.loads(Path('projects/wenzhou/coastal/reports/KANMEN_UHSLC_ACQUISITION.json').read_text())
          qa = json.loads(Path('projects/wenzhou/coastal/reports/KANMEN_UHSLC_QA.json').read_text())
          receipt = {
              'schema': 'wenzhou_kanmen_uhslc_receipt@1.1.0',
              'completedAtUtc': datetime.now(timezone.utc).isoformat(),
              'repository': os.environ['GITHUB_REPOSITORY'],
              'branch': 'project/wenzhou-v100-bathymetry-tides-hydrology',
              'observationCommit': os.environ['OBSERVATION_COMMIT'],
              'dataset': acquisition['dataset'],
              'sourceMode': acquisition['sourceMode'],
              'sourceUrl': acquisition['sourceUrl'],
              'uhslcId': 632,
              'recordId': 6321,
              'version': 'A',
              'requestedWindow': acquisition['requestedWindow'],
              'validSampleCount': qa['validSampleCount'],
              'completenessFraction': qa['completenessFraction'],
              'freshDownloadVerified': fresh['freshDownloadVerified'],
              'absoluteDatumTransformApplied': False,
              'files': fresh['files'],
          }
          path = Path('projects/wenzhou/coastal/reports/KANMEN_UHSLC_RECEIPT.json')
          path.write_text(json.dumps(receipt, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          git add -- projects/wenzhou/coastal/reports/KANMEN_UHSLC_RECEIPT.json
          git commit -m 'Record verified Kanmen station receipt [skip kanmen gauge] [skip coastal stage-a]'
          git push origin HEAD:project/wenzhou-v100-bathymetry-tides-hydrology

      - name: Preserve gauge evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wenzhou-kanmen-uhslc-evidence
          path: |
            projects/wenzhou/coastal/data/gauges/kanmen/*
            projects/wenzhou/coastal/reports/KANMEN_UHSLC_*.json
          if-no-files-found: warn
          retention-days: 90
