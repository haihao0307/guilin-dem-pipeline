name: Ocean Mother R018.9 final direct-open delivery

on:
  push:
    branches:
      - feature/ocean-mother-r0188-wave-deep-restore
    paths:
      - .github/workflows/ocean-r0189-final-publish.yml
      - tools/build_ocean_r0189.py
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: ocean-r0189-final-direct-open
  cancel-in-progress: true

jobs:
  build-verify-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Reconstruct locked R018.8 and original deep V001 inputs
        run: |
          set -euo pipefail
          mkdir -p /tmp/ocean-r0189/v001 dist/ocean-mother/island-r018-r0189 evidence
          base64 -d tools/build_ocean_r0188.py.xz.b64 | xz -d > /tmp/ocean-r0189/build_ocean_r0188.py
          python3 -m py_compile /tmp/ocean-r0189/build_ocean_r0188.py tools/build_ocean_r0189.py
          cat tools/ocean_v001_source.01.b64 tools/ocean_v001_source.02.b64 tools/ocean_v001_source.03.b64 tools/ocean_v001_source.04.b64 | base64 -d > /tmp/ocean-r0189/ocean_v001_source.tar.xz
          echo '01b987c9d6764562f6fce9a21ddf5aaef5540cc14e0853031a519e442a8b570c  /tmp/ocean-r0189/ocean_v001_source.tar.xz' | sha256sum -c -
          tar -xJf /tmp/ocean-r0189/ocean_v001_source.tar.xz -C /tmp/ocean-r0189/v001

      - name: Build one-file interactive R018.9 HTML
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          git show origin/gh-pages:ocean-mother/island-r018/index.html > /tmp/ocean-r0189/R018.7.html
          test "$(git hash-object /tmp/ocean-r0189/R018.7.html)" = '674fb6ffb85b70e0950035a357a1a3e0b7e3a3e3'
          python3 /tmp/ocean-r0189/build_ocean_r0188.py \
            --baseline /tmp/ocean-r0189/R018.7.html \
            --v001 /tmp/ocean-r0189/v001 \
            --output /tmp/ocean-r0189/R018.8.html \
            --report /tmp/ocean-r0189/R0188_BUILD_IDENTITY.json
          python3 tools/build_ocean_r0189.py \
            --r0188 /tmp/ocean-r0189/R018.8.html \
            --output dist/ocean-mother/island-r018-r0189/index.html \
            --report evidence/R0189_BUILD_IDENTITY.json
          cp dist/ocean-mother/island-r018-r0189/index.html dist/ocean-mother/island-r018-r0189/Ocean_Mother_R018.9_Direct_Open.html

      - name: Verify single-file integrity and output policy
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,re
          root=Path('dist/ocean-mother/island-r018-r0189')
          page=root/'index.html'; direct=root/'Ocean_Mother_R018.9_Direct_Open.html'
          text=page.read_text(encoding='utf-8')
          identity=json.loads(Path('evidence/R0189_BUILD_IDENTITY.json').read_text(encoding='utf-8'))
          policy=json.loads(Path('ocean-mother/OCEAN_OUTPUT_POLICY.json').read_text(encoding='utf-8'))
          assert page.read_bytes()==direct.read_bytes()
          assert page.stat().st_size>100000
          assert hashlib.sha256(page.read_bytes()).hexdigest()==identity['outputSha256']
          assert identity['startupZone']=='island'
          assert identity['runtimeImageAssets']==0
          assert identity['generatedImagesUsed'] is False
          assert policy['defaultDeliverable']=='interactive-3d-html-webgl'
          assert policy['imageGenerationAllowedOnlyWhenExplicitlyRequestedByUser'] is True
          required=[
            "window.__OCEAN_ZONE__=activeZone",
            "deepStartup:'lazy-original-v001'",
            "antialiased advected filament field",
            "three-layer crest lip and falling sheet",
            "Ocean Mother · 原始深海工作台 V001",
            "#loading{pointer-events:none!important}",
          ]
          for marker in required: assert marker in text,marker
          assert text.count('deepFrame.srcdoc=ORIGINAL_DEEP_HTML;')==1
          assert 'deepFrame.srcdoc=ORIGINAL_DEEP_HTML;\nlet activeZone' not in text
          assert not re.findall(r'https?://|data:image/|\.png\b|\.jpe?g\b|\.webp\b|\.glb\b|\.gltf\b',text,re.I)
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S|re.I)
          assert len(blocks)==2
          for i,block in enumerate(blocks): Path(f'/tmp/ocean-r0189-script-{i}.js').write_text(block,encoding='utf-8')
          PY
          node --check /tmp/ocean-r0189-script-0.js
          node --check /tmp/ocean-r0189-script-1.js

      - name: Confirm the HTML opens and both workspaces can be reached
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -q playwright
          python3 -m http.server 8129 --directory dist > evidence/server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          python3 - <<'PY'
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          import json

          url='http://127.0.0.1:8129/ocean-mother/island-r018-r0189/'
          report={'format':'ocean-r0189-openability-smoke','passed':False,'visualApproved':False,'productionApproved':False}
          with sync_playwright() as p:
              browser=p.chromium.launch(
                  executable_path='/usr/bin/google-chrome',
                  headless=True,
                  args=['--use-angle=swiftshader','--enable-unsafe-swiftshader','--ignore-gpu-blocklist','--no-sandbox','--disable-dev-shm-usage'],
              )
              page=browser.new_page(viewport={'width':640,'height':420})
              errors=[]
              page.on('pageerror',lambda error: errors.append(str(error)))
              page.goto(url,wait_until='domcontentloaded',timeout=90000)
              page.wait_for_function("window.__OCEAN_ZONE__==='island' && document.querySelector('canvas') && document.getElementById('deepFrame') && !document.getElementById('deepFrame').srcdoc",timeout=30000)
              initial=page.evaluate("""() => ({
                title:document.title,
                zone:window.__OCEAN_ZONE__,
                deepSrcdoc:document.getElementById('deepFrame').srcdoc.length,
                canvas:[document.querySelector('canvas').clientWidth,document.querySelector('canvas').clientHeight],
                fallback:document.getElementById('fallback').classList.contains('show'),
                loadingPointer:getComputedStyle(document.getElementById('loading')).pointerEvents
              })""")
              assert initial['zone']=='island'
              assert initial['deepSrcdoc']==0
              assert initial['canvas'][0]>300 and initial['canvas'][1]>200
              assert initial['fallback'] is False
              assert initial['loadingPointer']=='none'
              page.wait_for_function("window.__OCEAN_QA__ && window.__OCEAN_QA__.ready",timeout=240000)
              island=page.evaluate("({...window.__OCEAN_QA__})")
              assert island['version']=='0.3.9-island-r018-wave-refinement-lazy-deep'
              assert island['foamModel']=='antialiased advected filament field'
              assert island['curlModel']=='three-layer crest lip and falling sheet'
              page.locator('[data-zone="deep"]').click(timeout=30000)
              page.wait_for_function("window.__OCEAN_ZONE__==='deep' && document.getElementById('deepFrame').srcdoc.length>50000",timeout=30000)
              page.wait_for_function("document.getElementById('deepFrame').contentDocument?.readyState==='complete'",timeout=180000)
              deep=page.evaluate("""() => ({
                title:document.getElementById('deepFrame').contentDocument.title,
                hasCanvas:!!document.getElementById('deepFrame').contentDocument.querySelector('canvas'),
                restore:document.getElementById('deepFrame').contentWindow.__OCEAN_DEEP_RESTORED__||null
              })""")
              assert deep['hasCanvas']
              assert deep['restore']['source']=='frozen-ocean-mother-v001'
              page.locator('[data-zone="island"]').click(timeout=30000)
              page.wait_for_function("window.__OCEAN_ZONE__==='island' && !document.body.classList.contains('deep-mode')",timeout=30000)
              assert not errors,errors
              report.update({'passed':True,'initial':initial,'island':island,'deep':deep,'errors':errors})
              browser.close()
          Path('evidence/R0189_BROWSER_SMOKE.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Publish isolated R018.9 candidate
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          rm -rf /tmp/ocean-r0189-pages
          git worktree add --detach /tmp/ocean-r0189-pages origin/gh-pages
          cd /tmp/ocean-r0189-pages
          git checkout -B gh-pages
          rm -rf ocean-mother/island-r018-r0189
          mkdir -p ocean-mother/island-r018-r0189
          cp -R "$GITHUB_WORKSPACE/dist/ocean-mother/island-r018-r0189/." ocean-mother/island-r018-r0189/
          cp "$GITHUB_WORKSPACE/evidence/R0189_BUILD_IDENTITY.json" ocean-mother/island-r018-r0189/
          cp "$GITHUB_WORKSPACE/evidence/R0189_BROWSER_SMOKE.json" ocean-mother/island-r018-r0189/
          touch .nojekyll
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .nojekyll ocean-mother/island-r018-r0189
          git commit -m "publish(ocean): R018.9 openable direct HTML" || true
          for attempt in 1 2 3; do
            git push origin HEAD:gh-pages && exit 0
            git pull --rebase origin gh-pages
          done
          exit 1

      - name: Verify public bytes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,time,urllib.request
          local=Path('dist/ocean-mother/island-r018-r0189/index.html').read_bytes()
          urls=[
            'https://haihao0307.github.io/guilin-dem-pipeline/ocean-mother/island-r018-r0189/',
            'https://haihao0307.github.io/guilin-dem-pipeline/ocean-mother/island-r018-r0189/Ocean_Mother_R018.9_Direct_Open.html',
          ]
          files=[]
          for url in urls:
              remote=None
              error=None
              for _ in range(30):
                  try:
                      with urllib.request.urlopen(url+'?v='+str(int(time.time())),timeout=30) as response:
                          remote=response.read()
                      if remote==local: break
                  except Exception as exc:
                      error=str(exc)
                  time.sleep(5)
              assert remote==local,(url,len(remote or b''),len(local),error)
              files.append({'url':url,'bytes':len(remote),'sha256':hashlib.sha256(remote).hexdigest()})
          Path('evidence/R0189_PUBLIC_RECEIPT.json').write_text(json.dumps({'passed':True,'files':files},indent=2)+'\n',encoding='utf-8')
          PY

      - name: Upload exact R018.9 delivery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Ocean_Mother_R018.9_Final_Direct_Open
          path: |
            dist/ocean-mother/island-r018-r0189/index.html
            dist/ocean-mother/island-r018-r0189/Ocean_Mother_R018.9_Direct_Open.html
            evidence/R0189_BUILD_IDENTITY.json
            evidence/R0189_BROWSER_SMOKE.json
            evidence/R0189_PUBLIC_RECEIPT.json
            evidence/server.log
          if-no-files-found: warn
          retention-days: 90
