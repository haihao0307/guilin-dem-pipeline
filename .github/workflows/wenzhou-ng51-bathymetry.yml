name: Wenzhou NG51 Bathymetry Build

on:
  workflow_dispatch:
  push:
    branches:
      - wenzhou-island-relief-watermask-20260917
    paths:
      - 'records/R3_10/NG51_BATHYMETRY_BUILD_TRIGGER'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install raster reader
        run: pip install --disable-pip-version-check rasterio==1.4.3 numpy==2.1.3
      - name: Download NOAA ETOPO 2022 15 arc-second tile
        run: |
          set -euo pipefail
          mkdir -p /tmp/ng51-bathy
          curl -fL --retry 4 --retry-delay 3             'https://www.ngdc.noaa.gov/mgg/global/relief/ETOPO2022/data/15s/15s_surface_elev_gtif/ETOPO_2022_v1_15s_N30E120_surface.tif'             -o /tmp/ng51-bathy/source.tif
          sha256sum /tmp/ng51-bathy/source.tif | tee /tmp/ng51-bathy/source.sha256
      - name: Crop NG51-1 bathymetry basis
        run: |
          python - <<'PY'
          import json, hashlib
          from pathlib import Path
          import numpy as np
          import rasterio
          from rasterio.windows import from_bounds
          srcp=Path('/tmp/ng51-bathy/source.tif')
          out=Path('site/dist/r3-8/data/bathymetry'); out.mkdir(parents=True,exist_ok=True)
          with rasterio.open(srcp) as src:
              if str(src.crs) not in ('EPSG:4326','OGC:CRS84'):
                  raise SystemExit(f'unexpected CRS {src.crs}')
              w=from_bounds(120.0,27.0,121.5,28.0,src.transform).round_offsets().round_lengths()
              a=src.read(1,window=w,masked=True)
              tr=src.window_transform(w)
              data=np.asarray(a.filled(-32768),dtype='<i2')
          (out/'ng51-etopo2022-15s.i16').write_bytes(data.tobytes())
          raw=(out/'ng51-etopo2022-15s.i16').read_bytes()
          valid=data[data!=-32768]
          meta={
            'schema':'wenzhou-ng51-bathymetry-basis/v1',
            'source':'NOAA ETOPO 2022 v1 15 arc-second surface elevation',
            'sourceUrl':'https://www.ngdc.noaa.gov/mgg/global/relief/ETOPO2022/data/15s/15s_surface_elev_gtif/ETOPO_2022_v1_15s_N30E120_surface.tif',
            'sourceSha256':hashlib.sha256(srcp.read_bytes()).hexdigest(),
            'role':'derived broad seabed/terrain basis; not a 1940s sounding survey and not a sea-surface datum',
            'sheet':'NG51-1',
            'boundsLonLat':[120.0,27.0,121.5,28.0],
            'shape':list(data.shape),
            'dtype':'int16-le-m',
            'noData':-32768,
            'transform':[tr.a,tr.b,tr.c,tr.d,tr.e,tr.f],
            'heightRangeM':[int(valid.min()),int(valid.max())],
            'payloadSha256':hashlib.sha256(raw).hexdigest(),
            'payloadBytes':len(raw),
            'historicalControl':'JUI-AN NG51-1 user map; depth curves in fathoms',
            'truthBoundary':'ETOPO supplies broad derived relief only. Historical map controls coastline/islands/depth-curve consistency. Dynamic sea surface remains separate.'
          }
          (out/'ng51-etopo2022-15s.json').write_text(json.dumps(meta,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(meta,indent=2))
          PY
      - name: Commit compact bathymetry basis
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/dist/r3-8/data/bathymetry/ng51-etopo2022-15s.i16 site/dist/r3-8/data/bathymetry/ng51-etopo2022-15s.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data(wenzhou): add NG51 ETOPO derived bathymetry basis'
          git push origin HEAD:wenzhou-island-relief-watermask-20260917
