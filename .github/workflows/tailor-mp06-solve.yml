name: MP06 original-source garment contact solutions
on:
  push:
    branches: [feature/tailor-mp06-native-human-motion-eb1-20261013]
    paths: ['.github/workflows/tailor-mp06-solve.yml','kaopu-tailor-workbench/material-products/mp06-release/bake.mjs']
permissions:
  contents: read
  actions: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Require the actual integrated R05 source probe, not a substitute actor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import urllib.request,json,os,time
          url='https://api.github.com/repos/haihao0307/guilin-dem-pipeline/actions/runs/38389565687'
          for i in range(80):
            d=json.load(urllib.request.urlopen(urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN']})))
            if d['status']=='completed':
              assert d['conclusion']=='success',d['conclusion']
              break
            time.sleep(5)
          else:raise RuntimeError('Source probe did not finish')
          PY
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 38389565687
          name: mp06-native-integration
          path: pack
      - uses: actions/upload-artifact@v4
        with:
          name: mp06-solve-source
          path: pack
          retention-days: 30
  solve:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        look: [K04,L04,D01]
        action: [walk,run,jump,hand-reach-turn,hand-carry,detail-jab,detail-duck,detail-slip]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: kaopu-tailor-workbench/material-products/mp06-release
      - uses: actions/download-artifact@v4
        with:
          name: mp06-solve-source
          path: pack
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original WASM constraints and same-frame native body; retain all failed cases
        env:
          ACTION: ${{ matrix.action }}
          LOOK: ${{ matrix.look }}
        run: node kaopu-tailor-workbench/material-products/mp06-release/bake.mjs pack
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mp06-solved-${{ matrix.look }}-${{ matrix.action }}
          path: pack/solved
          retention-days: 30
