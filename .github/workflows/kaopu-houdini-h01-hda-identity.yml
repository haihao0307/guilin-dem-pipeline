name: KAOPU Houdini H01 HDA Identity Audit

on:
  push:
    branches:
      - coordination/kaopu-learning-flywheel-r1-20260909
    paths:
      - 'docs/mother_coordination/kaopu_learning_flywheel_v1/PROBES/houdini_hda_identity_h01.mjs'
      - '.github/workflows/kaopu-houdini-h01-hda-identity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate HDA identity contract and negative controls
        run: |
          node docs/mother_coordination/kaopu_learning_flywheel_v1/PROBES/houdini_hda_identity_h01.mjs \
            houdini_hda_identity_result_h01.json
      - uses: actions/upload-artifact@v4
        with:
          name: kaopu-houdini-h01-hda-identity
          path: houdini_hda_identity_result_h01.json
          if-no-files-found: error
