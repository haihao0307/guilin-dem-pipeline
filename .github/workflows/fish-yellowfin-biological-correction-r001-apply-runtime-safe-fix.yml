name: Fish Mother Yellowfin Biological Correction R001 Apply Runtime Safe Fix

on:
  workflow_dispatch:
  push:
    branches:
      - work/ocean-life-fish-mother-yellowfin-biological-correction-r001-20260921
    paths:
      - .github/workflows/fish-yellowfin-biological-correction-r001-apply-runtime-safe-fix.yml
      - apps/ocean-life-mother/fish-mother/yellowfin-biological-correction-r001/tools/apply_candidate_a_runtime_safe_fix.py
      - apps/ocean-life-mother/fish-mother/yellowfin-biological-correction-r001/tools/apply_candidate_a_runtime_safe_payload.py

permissions:
  contents: write

concurrency:
  group: fish-yellowfin-biological-correction-r001-apply-runtime-safe-fix
  cancel-in-progress: true

env:
  CORRECTION_ROOT: apps/ocean-life-mother/fish-mother/yellowfin-biological-correction-r001

jobs:
  apply-runtime-safe-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the biological correction branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Patch Candidate A runtime policy and browser semantic mapping
        shell: bash
        run: |
          set -euo pipefail
          python "$CORRECTION_ROOT/tools/apply_candidate_a_runtime_safe_payload.py"
          python -m py_compile \
            "$CORRECTION_ROOT/tools/apply_candidate_a_runtime_safe_fix.py" \
            "$CORRECTION_ROOT/tools/apply_candidate_a_runtime_safe_payload.py" \
            "$CORRECTION_ROOT/tools/build_candidate_a_runtime_safe.py"
          grep -F 'build_candidate_a_runtime_safe.py' .github/workflows/fish-yellowfin-biological-correction-r001-candidate-a.yml
          grep -F 'source-rig-byte-preserved' "$CORRECTION_ROOT/tests/candidate-a-r001.test.mjs"
          grep -F 'annotateSemanticRegions' "$CORRECTION_ROOT/candidate-a-qa.html"
          grep -F 'rigPreservationMachineGatesPassed' "$CORRECTION_ROOT/candidate-a-qa.html"

      - name: Commit runtime-safe Candidate A implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Fish Mother R001"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            "$CORRECTION_ROOT/tools/build_candidate_a_runtime_safe.py" \
            "$CORRECTION_ROOT/tests/candidate-a-r001.test.mjs" \
            "$CORRECTION_ROOT/candidate-a-qa.html"
          if git diff --cached --quiet; then
            echo "Candidate A runtime-safe implementation is already applied."
            exit 0
          fi
          git commit -m "fix(fish): preserve source rig and animation in Candidate A"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:${GITHUB_REF_NAME}"
