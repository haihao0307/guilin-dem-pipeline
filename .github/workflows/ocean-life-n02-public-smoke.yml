name: Ocean Life N02 public smoke
on:
  push:
    branches: [work/ocean-life-mother-r00-20260918]
    paths:
      - apps/ocean-life-mother/nature-core/n02/index.html
      - apps/ocean-life-mother/nature-core/n02/src/**
      - apps/ocean-life-mother/nature-core/n02/tools/**
      - .github/workflows/ocean-life-n02-public-smoke.yml
permissions:
  contents: read
jobs:
  public-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: apps/ocean-life-mother/nature-core/n02
          lfs: false
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Numeric regression
        run: node apps/ocean-life-mother/nature-core/n02/tools/numerical.cjs
      - name: Actual public HTTP and WebGL checks
        env:
          N02_SHA: ${{ github.sha }}
        run: |
          URL="https://raw.githack.com/haihao0307/guilin-dem-pipeline/${N02_SHA}/apps/ocean-life-mother/nature-core/n02/index.html"
          xvfb-run -a python apps/ocean-life-mother/nature-core/n02/tools/browser_qa.py --public-url "$URL"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: ocean-life-n02-public-proof
          path: apps/ocean-life-mother/nature-core/n02/qa/
          retention-days: 7
