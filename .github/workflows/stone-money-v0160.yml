name: Stone Money V0160 build and verify
on:
  push:
    branches: [work/stone-money-island-v0160-original-ocean-20260917]
    paths:
      - .github/workflows/stone-money-v0160.yml
      - games/survivor-palau/source/v0160/*.py
      - games/survivor-palau/source/v0160/bridge.js
permissions:
  contents: write
concurrency:
  group: stone-money-v0160
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/stone-money-island-v0160-original-ocean-20260917
      - name: Build from frozen source and readable integration source
        run: |
          python games/survivor-palau/source/v0160/build.py
          python games/survivor-palau/source/v0160/integration_checks.py
      - name: Run real-browser desktop and mobile diagnostics
        run: |
          python -m pip install playwright pillow
          python -m playwright install --with-deps chromium
          python games/survivor-palau/source/v0160/verify.py
      - name: Commit only game integration outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add games/survivor-palau
          git diff --cached --quiet || git commit -m 'build(stone-money): record original ocean integration and actual browser results'
          git push origin HEAD:work/stone-money-island-v0160-original-ocean-20260917
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stone-money-v0160-build-and-qa
          path: |
            games/survivor-palau/releases/v0.1.6.0/
            games/survivor-palau/source/v0160/
            /tmp/stone-money-qa/
          if-no-files-found: error
