name: Wenzhou R3.3 complete SoilGrids profile

on:
  push:
    branches:
      - feature/wenzhou-r33-environmental-data-intake-20260908
    paths:
      - .github/workflows/wenzhou-r33-soilgrids-complete-profile.yml
      - experiments/wenzhou-r33-environmental-data-intake/contracts/SOILGRIDS_COMPLETE_PROFILE_R33.json
      - experiments/wenzhou-r33-environmental-data-intake/scripts/acquire_soilgrids_group.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        group:
          - physical_texture
          - chemical_carbon
          - hydraulic
          - wrb
    steps:
      - name: Checkout fixed branch commit
        uses: actions/checkout@v4

      - name: Install geospatial acquisition tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gdal-bin python3-gdal
          python3 -m pip install --disable-pip-version-check requests
          gdalinfo --version

      - name: Acquire source-native and 250 metre aligned context layers
        run: |
          set -euo pipefail
          python3 experiments/wenzhou-r33-environmental-data-intake/scripts/acquire_soilgrids_group.py \
            --group "${{ matrix.group }}" \
            --output "${{ github.workspace }}/artifacts/soilgrids-${{ matrix.group }}"

      - name: Verify every recorded payload
        run: |
          set -euo pipefail
          python3 - "${{ github.workspace }}/artifacts/soilgrids-${{ matrix.group }}" <<'PY'
          from pathlib import Path
          import hashlib, json, sys

          root = Path(sys.argv[1])
          manifest = json.loads((root / "PAYLOAD_MANIFEST.json").read_text(encoding="utf-8"))
          errors = []
          for item in manifest["payloads"]:
              path = root / item["path"]
              if not path.is_file():
                  errors.append({"path": item["path"], "error": "missing"})
                  continue
              if path.stat().st_size != item["bytes"]:
                  errors.append({"path": item["path"], "error": "size"})
                  continue
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              if digest != item["sha256"]:
                  errors.append({"path": item["path"], "error": "sha256"})
          result = {
              "passed": not errors and bool(manifest.get("passed")),
              "checked": len(manifest["payloads"]),
              "group": manifest.get("group"),
              "errors": errors,
          }
          report = root / "reports" / "MANIFEST_VERIFICATION.json"
          report.write_text(json.dumps(result, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(result, ensure_ascii=False, indent=2))
          if not result["passed"]:
              raise SystemExit(2)
          PY

      - name: Upload independently recoverable data group
        uses: actions/upload-artifact@v4
        with:
          name: wenzhou-r33-soilgrids-${{ matrix.group }}
          path: artifacts/soilgrids-${{ matrix.group }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 3
