name: Ocean R018.14 safe default delivery

on:
  push:
    branches:
      - release/ocean-mother-r01814-safe-default-20260907
    paths:
      - .github/workflows/ocean-r01814-safe-default.yml

permissions:
  contents: write

concurrency:
  group: ocean-r01814-safe-default
  cancel-in-progress: false

jobs:
  build-verify-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct R018.13 and apply R018.14 safe-default patch
        shell: bash
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE"
          work=/tmp/ocean-r01814
          mkdir -p "$root/candidate" "$root/evidence"

          cat ocean-mother/releases/r01812-build/patch.part-*.b64 > /tmp/r01812.patch.gz.b64
          echo "9fc71f4eb0d619cae7a553bfb72220f1e3592096190207d35a7dde85221a1b4c  /tmp/r01812.patch.gz.b64" | sha256sum -c -
          base64 -d /tmp/r01812.patch.gz.b64 | gzip -dc > /tmp/r01812.patch

          rm -rf "$work"
          cp -a ocean-mother/restart-v0311 "$work"
          cd "$work"
          patch -p1 < /tmp/r01812.patch

          cat "$root"/ocean-mother/releases/r01813-build/patch.part-*.b64 > /tmp/r01813.patch.gz.b64
          test "$(wc -c < /tmp/r01813.patch.gz.b64)" -eq 20320
          echo "c0a6269951570b655bbe97b71faed1bb8b4a844bb5983bc9ba2c0bd189f50fd7  /tmp/r01813.patch.gz.b64" | sha256sum -c -
          base64 -d /tmp/r01813.patch.gz.b64 | gzip -dc > /tmp/r01813.patch
          echo "581b0b148c247089863efe32e115323d78b0413f1526256783d5ceb3c27cc617  /tmp/r01813.patch" | sha256sum -c -
          patch -p1 < /tmp/r01813.patch

          node --check source/inline-0.js
          python tools/build_single_html.py --output "$root/candidate/index.html"
          test "$(wc -c < "$root/candidate/index.html")" -eq 173729
          echo "8ad71fa0c54ae0aa48110fd922fd4b45e1d2c8df7c93040c7574939ecec1914d  $root/candidate/index.html" | sha256sum -c -

          cat "$root"/ocean-mother/releases/r01814-build/patch.part-*.b64 > /tmp/r01814.patch.gz.b64
          test "$(wc -c < /tmp/r01814.patch.gz.b64)" -eq 11500
          echo "e144de0778fbcc993b7dabc7a7982d53e5b1be9c5f58c3bc756947e4a1ad0119  /tmp/r01814.patch.gz.b64" | sha256sum -c -
          base64 -d /tmp/r01814.patch.gz.b64 | gzip -dc > /tmp/r01814.patch
          echo "133ca5a7997fcd976baab48885b960281453f9bd593a8b35b4d032bba5c9746a  /tmp/r01814.patch" | sha256sum -c -
          cd "$root/candidate"
          patch -p1 < /tmp/r01814.patch

          test "$(wc -c < index.html)" -eq 173865
          echo "0e0ff64535fc7d460e29fe3d108a53144f007dbf4b49ca4d43553fe897f321b2  index.html" | sha256sum -c -
          grep -q "0.3.14-island-r018-safe-default" index.html
          grep -q "r01814-safe-default-and-surface-query" index.html
          grep -q "wantsFull?FRAG:SAFE_FRAG" index.html
          grep -q "尝试完整海景" index.html
          grep -q "if(queryCompileStarted||queryReady||contextLost||surfaceQaOnly)return" index.html
          if grep -qE '<script[^>]+src=|<img[^>]+src=|https://cdn\.|https://unpkg\.|https://jsdelivr\.' index.html; then
            echo "External runtime asset detected" >&2
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:[^>]*)>(.*?)</script>', text, re.S | re.I)
          assert scripts, 'no inline scripts'
          Path('/tmp/r01814-main.js').write_text(scripts[0], encoding='utf-8')
          PY
          node --check /tmp/r01814-main.js

      - name: Run ordinary-entry desktop and mobile black-screen gate
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          cp ocean-mother/releases/r01813-build/qa_startup.py /tmp/qa_r01814.py
          sed -i 's/0.3.13-island-r018-startup-recovery/0.3.14-island-r018-safe-default/g' /tmp/qa_r01814.py
          python3 -m py_compile /tmp/qa_r01814.py
          python3 -m http.server 8124 --bind 127.0.0.1 > evidence/server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 1
          python3 /tmp/qa_r01814.py \
            --chrome "$CHROME" \
            --url "http://127.0.0.1:8124/candidate/index.html" \
            --output evidence

      - name: Record and commit fixed single HTML
        shell: bash
        run: |
          set -euo pipefail
          target=ocean-mother/releases/Ocean_Mother_R01814_Safe_Default_Direct_Open.html
          receipt=ocean-mother/releases/Ocean_Mother_R01814_Safe_Default_RECEIPT.json
          cp candidate/index.html "$target"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json
          html = Path('ocean-mother/releases/Ocean_Mother_R01814_Safe_Default_Direct_Open.html')
          qa = json.loads(Path('evidence/STARTUP_QA.json').read_text(encoding='utf-8'))
          receipt = {
              'schema': 'ocean-fixed-single-html-receipt/3',
              'version': '0.3.14',
              'runtimeIdentity': '0.3.14-island-r018-safe-default',
              'sourceBaselineCommit': 'c59fdf8ed7f04a1a7eadb42d9dd68a3151bbf4a6',
              'htmlPath': str(html),
              'htmlBytes': html.stat().st_size,
              'htmlSha256': hashlib.sha256(html.read_bytes()).hexdigest(),
              'singleFileHtml': True,
              'externalRuntimeAssets': False,
              'frozenDeepModified': False,
              'safeOceanDefault': True,
              'fullOceanManualOptIn': True,
              'normalEntryDesktopChecked': True,
              'normalEntryMobile390x844Checked': True,
              'blackScreenGatePassed': True,
              'desktopStartupStage': qa['desktop']['qa'].get('startupStage'),
              'desktopSafeMode': qa['desktop']['qa'].get('safeMode'),
              'desktopQueryAvailable': qa['desktop']['qa'].get('queryAvailable'),
              'desktopQueryVerified': qa['desktop']['qa'].get('queryVerified'),
              'mobileStartupStage': qa['mobile']['qa'].get('startupStage'),
              'mobileSafeMode': qa['mobile']['qa'].get('safeMode'),
              'mobilePanelClosed': qa['mobile']['panelClosed'],
              'hardwareGpuVerified': False,
              'visualAcceptance': False,
              'productionReady': False,
          }
          Path('ocean-mother/releases/Ocean_Mother_R01814_Safe_Default_RECEIPT.json').write_text(
              json.dumps(receipt, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add "$target" "$receipt"
          git commit -m "release(ocean): publish R018.14 safe-default single HTML [skip ci]"
          git rev-parse HEAD > evidence/FINAL_COMMIT.txt
          git push origin HEAD

      - name: Verify immutable raw.githack delivery
        shell: bash
        run: |
          set -euo pipefail
          FINAL_SHA="$(cat evidence/FINAL_COMMIT.txt)"
          PATH_IN_REPO=ocean-mother/releases/Ocean_Mother_R01814_Safe_Default_Direct_Open.html
          URL="https://raw.githack.com/haihao0307/guilin-dem-pipeline/${FINAL_SHA}/${PATH_IN_REPO}"
          printf '%s\n' "$URL" > evidence/RAW_GITHACK_URL.txt
          ok=0
          for attempt in $(seq 1 24); do
            if curl --fail --location --silent --show-error --connect-timeout 10 --max-time 45 "$URL" -o evidence/raw.githack.html; then
              if test "$(wc -c < evidence/raw.githack.html)" -eq 173865 && echo "0e0ff64535fc7d460e29fe3d108a53144f007dbf4b49ca4d43553fe897f321b2  evidence/raw.githack.html" | sha256sum -c -; then
                ok=1
                break
              fi
            fi
            sleep 5
          done
          test "$ok" -eq 1
          grep -q "0.3.14-island-r018-safe-default" evidence/raw.githack.html

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Ocean_Mother_R01814_Safe_Default
          path: |
            candidate/index.html
            ocean-mother/releases/Ocean_Mother_R01814_Safe_Default_Direct_Open.html
            ocean-mother/releases/Ocean_Mother_R01814_Safe_Default_RECEIPT.json
            evidence/
          if-no-files-found: warn
          retention-days: 30
