name: farmland-r045-round27-micro-preview
on:
  push:
    branches:
      - restart/farmland-object-dna-v020-20260907
    paths:
      - '.github/workflows/farmland-r045-round27-micro-preview.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  micro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build micro visual review copy
        shell: bash
        run: |
          set -euo pipefail
          OUT='farmland-object-dna/research/r045-autonomous-rebuild/round-27'
          export OUT
          python3 - <<'PY'
          import os,struct,zlib,binascii,base64
          src=os.path.join(os.environ['OUT'],'r045_round27_fixed_view.png')
          data=open(src,'rb').read(); assert data[:8]==b'\x89PNG\r\n\x1a\n'
          p=8; ids=[]
          while p<len(data):
              n=struct.unpack('>I',data[p:p+4])[0]; typ=data[p+4:p+8]; payload=data[p+8:p+8+n]; p+=12+n
              if typ==b'IHDR': w,h,depth,ctype,comp,filt,interlace=struct.unpack('>IIBBBBB',payload)
              elif typ==b'IDAT': ids.append(payload)
              elif typ==b'IEND': break
          assert depth==8 and ctype in (2,6) and interlace==0
          bpp=3 if ctype==2 else 4; raw=zlib.decompress(b''.join(ids)); stride=w*bpp
          rows=[]; pos=0; prev=bytearray(stride)
          def paeth(a,b,c):
              q=a+b-c; pa=abs(q-a); pb=abs(q-b); pc=abs(q-c); return a if pa<=pb and pa<=pc else (b if pb<=pc else c)
          for y in range(h):
              ft=raw[pos]; pos+=1; scan=bytearray(raw[pos:pos+stride]); pos+=stride
              for i in range(stride):
                  a=scan[i-bpp] if i>=bpp else 0; b=prev[i]; c=prev[i-bpp] if i>=bpp else 0
                  if ft==1: scan[i]=(scan[i]+a)&255
                  elif ft==2: scan[i]=(scan[i]+b)&255
                  elif ft==3: scan[i]=(scan[i]+((a+b)//2))&255
                  elif ft==4: scan[i]=(scan[i]+paeth(a,b,c))&255
                  elif ft!=0: raise ValueError(ft)
              rows.append(scan); prev=scan
          tw=120; th=max(1,round(h*tw/w)); out=[]
          for yy in range(th):
              sy=min(h-1,round((yy+.5)*h/th-.5)); s=rows[sy]; r=bytearray(tw*3)
              for xx in range(tw):
                  sx=min(w-1,round((xx+.5)*w/tw-.5)); si=sx*bpp; di=xx*3; r[di:di+3]=s[si:si+3]
              out.append(b'\x00'+bytes(r))
          def chunk(t,p): return struct.pack('>I',len(p))+t+p+struct.pack('>I',binascii.crc32(t+p)&0xffffffff)
          png=b'\x89PNG\r\n\x1a\n'+chunk(b'IHDR',struct.pack('>IIBBBBB',tw,th,8,2,0,0,0))+chunk(b'IDAT',zlib.compress(b''.join(out),9))+chunk(b'IEND',b'')
          open(os.path.join(os.environ['OUT'],'r045_round27_fixed_view_micro.png'),'wb').write(png)
          b64=base64.b64encode(png).decode('ascii')
          open(os.path.join(os.environ['OUT'],'r045_round27_fixed_view_micro.b64.txt'),'w').write(b64+'\n')
          print({'source':[w,h],'micro':[tw,th],'bytes':len(png),'b64':len(b64)})
          PY
      - name: Persist micro review evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add farmland-object-dna/research/r045-autonomous-rebuild/round-27/r045_round27_fixed_view_micro.png farmland-object-dna/research/r045-autonomous-rebuild/round-27/r045_round27_fixed_view_micro.b64.txt
          git commit -m 'farmland R045.27 persist micro visual review evidence [skip ci]'
          git push origin HEAD:${GITHUB_REF_NAME}
