name: Joey isolated native observation probe
on:
  push:
    branches: ['qa/joey-native-large-shape-r39-20261011']
    paths: ['kaopu-unified-human-workbench/joey-observation-r01/**', '.github/workflows/joey-native-probe-qa.yml']
permissions:
  contents: read
concurrency:
  group: joey-native-observation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: kaopu-unified-human-workbench/joey-observation-r01/appearance-r54
      - name: Install pinned matching official package
        timeout-minutes: 3
        run: |
          df -h /dev/shm || true
          npm install --prefix "$RUNNER_TEMP/joey-native" --no-save --ignore-scripts playwright@1.57.0
          echo "NODE_PATH=$RUNNER_TEMP/joey-native/node_modules" >> "$GITHUB_ENV"
      - name: Compare unchanged final geometry and frames after deferred initial render
        env:
          R54_CANDIDATE_DIR: kaopu-unified-human-workbench/joey-observation-r01/appearance-r54/
          R54_BROWSER: ${{ matrix.browser }}
        run: |
          node kaopu-unified-human-workbench/joey-observation-r01/appearance-r54/verify-initial-render-r06.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r54-initial-render-r06-linux-${{ matrix.browser }}
          path: r54-initial-render-r06-*/
          retention-days: 7
  apple:
    runs-on: macos-14
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: kaopu-unified-human-workbench/joey-observation-r01/appearance-r54
      - name: Install pinned official package and WebKit
        timeout-minutes: 5
        run: |
          npm install --prefix "$RUNNER_TEMP/joey-native" --no-save --ignore-scripts playwright@1.57.0
          "$RUNNER_TEMP/joey-native/node_modules/.bin/playwright" install webkit
          echo "NODE_PATH=$RUNNER_TEMP/joey-native/node_modules" >> "$GITHUB_ENV"
      - name: Compare unchanged final geometry and frames after deferred initial render
        env:
          R54_CANDIDATE_DIR: kaopu-unified-human-workbench/joey-observation-r01/appearance-r54/
          R54_BROWSER: webkit
        run: |
          node kaopu-unified-human-workbench/joey-observation-r01/appearance-r54/verify-initial-render-r06.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r54-initial-render-r06-apple-webkit
          path: r54-initial-render-r06-*/
          retention-days: 7
