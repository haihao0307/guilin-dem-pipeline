name: Joey isolated native observation probe
on:
  push:
    branches: ['qa/joey-native-large-shape-r39-20261011']
    paths:
      - 'kaopu-unified-human-workbench/joey-observation-r01/**'
      - '.github/workflows/joey-native-probe-qa.yml'
permissions:
  contents: read
concurrency:
  group: joey-native-observation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: kaopu-unified-human-workbench/joey-observation-r01/appearance-r54
      - name: Install pinned official browser package
        run: |
          npm install --prefix "$RUNNER_TEMP/joey-native" --no-save --ignore-scripts playwright@1.57.0
          "$RUNNER_TEMP/joey-native/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/joey-native/node_modules" >> "$GITHUB_ENV"
      - name: Await the authorized isolated Pages candidate
        run: |
          python3 - <<'PYWAIT'
          import json,time,urllib.request
          url='https://haihao0307.github.io/guilin-dem-pipeline/kaopu-unified-human-workbench/joey-observation-r01/appearance-r54/RELEASE.json'
          for attempt in range(24):
              try:
                  r=json.load(urllib.request.urlopen(url,timeout=20))
                  if r.get('qaCommit')=='61f69d2d4a481e18d5284d599f2d4dd922227663':
                      print('Verified published candidate release',r['qaCommit']);break
              except Exception as e: print(type(e).__name__,str(e))
              time.sleep(5)
          else: raise SystemExit('Candidate Pages release not yet available; public verification incomplete')
          PYWAIT
      - name: Verify actual public cold load, views, controls and visible error
        env:
          R54_PREVIEW_URL: https://haihao0307.github.io/guilin-dem-pipeline/kaopu-unified-human-workbench/joey-observation-r01/appearance-r54/index.html
        run: node kaopu-unified-human-workbench/joey-observation-r01/appearance-r54/test-preview.cjs
      - name: Keep actual public verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: joey-r54-public-${{ github.sha }}
          path: joey-appearance-r54-preview/
          retention-days: 7
          compression-level: 0
          if-no-files-found: warn
