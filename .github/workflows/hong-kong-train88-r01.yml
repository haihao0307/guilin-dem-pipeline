name: Hong Kong train 88 same-scene integration
on:
  push:
    branches: ['qa/hong-kong-train88-r01-20261013']
    paths: ['kaopu-geography-workbench/hong-kong-train88-r01/**', '.github/workflows/hong-kong-train88-r01.yml']
permissions:
  contents: read
env:
  CASE: kaopu-geography-workbench/hong-kong-train88-r01
jobs:
  city_split_sampling:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            kaopu-geography-workbench/hong-kong-train88-r01
            kaopu-geography-workbench/hong-kong-map-sea-r03
      - run: |
          cp -r "$CASE" "$RUNNER_TEMP/direct-overlays"
          python3 -m zipfile -e "$CASE/source-bundle.zip" "$CASE"
          python3 -m zipfile -e "$CASE/patch-bundle.zip" "$CASE"
          cp -r "$RUNNER_TEMP/direct-overlays/." "$CASE/"
          python3 -m zipfile -e "$CASE/city-split-bundle.zip" "$CASE"
      - run: |
          npm install --prefix "$RUNNER_TEMP/runner" --no-save --ignore-scripts --no-audit --no-fund playwright@1.57.0
          echo "NODE_PATH=$RUNNER_TEMP/runner/node_modules" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/runner/node_modules/.bin/playwright" install --with-deps chromium
      - run: |
          SAMPLE_MODEL=walled-pair node "$CASE/candidates/qa/run-sampling.cjs"
          SAMPLE_MODEL=walled-pair node "$CASE/candidates/qa/pack-samples.mjs"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: city-split-${{ github.sha }}
          path: |
            kaopu-geography-workbench/hong-kong-train88-r01/candidates/qa/results
            kaopu-geography-workbench/hong-kong-train88-r01/candidates/data
          retention-days: 7