name: Deploy Kunming real OSM hydrology V001

on:
  workflow_dispatch:
  push:
    branches:
      - project/kunming-dem-v001
    paths:
      - .github/workflows/deploy-kunming-osm-hydrology-v001.yml
      - scripts/build_kunming_osm_hydrology_web_v001.py
      - projects/kunming/web/osm-hydrology-v001/**

permissions:
  contents: write
  actions: read

concurrency:
  group: deploy-kunming-osm-hydrology-v001
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_DIR: kunming-osm-hydrology-v001
      SOURCE_RUN_ID: "32925496927"
      SOURCE_ARTIFACT: kunming-hydrology-knowledge-v001
    steps:
      - name: Checkout project branch
        uses: actions/checkout@v4
        with:
          ref: project/kunming-dem-v001
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deterministic builder dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow pyproj shapely

      - name: Download successful hydrology artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hydrology"
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$SOURCE_ARTIFACT" --dir "$RUNNER_TEMP/hydrology"
          test -f "$RUNNER_TEMP/hydrology/distilled/osm-current/waterways.geojson"
          test -f "$RUNNER_TEMP/hydrology/distilled/osm-current/water_areas.geojson"
          test -f "$RUNNER_TEMP/hydrology/distilled/ohm-history/waterways.geojson"
          test -f "$RUNNER_TEMP/hydrology/QA_REPORT.json"

      - name: Fetch frozen clean terrain height asset
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/gh-pages/kunming-clean-3d-v001/assets/height_rg16.png" \
            --output "$RUNNER_TEMP/height_rg16.png"
          test "$(stat -c%s "$RUNNER_TEMP/height_rg16.png")" -gt 8000000

      - name: Build real OSM water geometry and web package
        run: |
          set -euo pipefail
          DIST="$RUNNER_TEMP/site/$TARGET_DIR"
          mkdir -p "$DIST"
          cp projects/kunming/web/osm-hydrology-v001/index.html "$DIST/index.html"
          cp projects/kunming/web/osm-hydrology-v001/styles.css "$DIST/styles.css"
          cp projects/kunming/web/osm-hydrology-v001/app.js "$DIST/app.js"
          python scripts/build_kunming_osm_hydrology_web_v001.py \
            --artifact-dir "$RUNNER_TEMP/hydrology" \
            --height-image "$RUNNER_TEMP/height_rg16.png" \
            --output-dir "$DIST"
          node --check "$DIST/app.js"

      - name: Fail closed on provenance, geometry and display rules
        run: |
          set -euo pipefail
          python - <<'PY'
          import gzip, hashlib, json, pathlib
          root=pathlib.Path("${{ runner.temp }}/site/${{ env.TARGET_DIR }}")
          m=json.loads((root/'data/manifest.json').read_text(encoding='utf-8'))
          r=json.loads((root/'BUILD_REPORT.json').read_text(encoding='utf-8'))
          assert m['sourceArtifact']['runId']==32925496927
          assert m['sourceArtifact']['sha256']=='919b1bb0d06b1fb479e0681deeb3c4fc2867dc78ee229a0a5af3723ba20e4c01'
          assert m['authoritativeDem']['sha256']=='9f672e16714d98b7bc7f002826cdf788379bcb54db84227a21f53539b083f3a2'
          assert m['authoritativeDem']['compression']=='NONE'
          assert m['authoritativeDem']['resampled'] is False
          assert m['displayRules']['handDrawnWaterCount']==0
          assert m['historical']['acceptedHistoricalTruthCount']==0
          assert r['riverFeatureCount']>=1600 and r['waterAreaFeatureCount']>=1600
          assert r['riverSegmentCount']>7000 and r['waterTriangleCount']>20000
          for item in m['binary'].values():
              path=root/item['file']
              assert hashlib.sha256(path.read_bytes()).hexdigest()==item['compressedSha256']
              raw=gzip.decompress(path.read_bytes())
              assert len(raw)%4==0 and len(raw)>0
          text=(root/'app.js').read_text(encoding='utf-8')
          assert 'riverLines' not in text and 'lakePolygons' not in text
          print(json.dumps({'status':'pass','riverFeatures':r['riverFeatureCount'],'waterAreas':r['waterAreaFeatureCount'],'historicalVerified':0,'handDrawnWater':0},ensure_ascii=False))
          PY

      - name: Deploy into existing gh-pages without replacing other projects
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch gh-pages "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$RUNNER_TEMP/pages"
          rm -rf "$RUNNER_TEMP/pages/$TARGET_DIR"
          cp -a "$RUNNER_TEMP/site/$TARGET_DIR" "$RUNNER_TEMP/pages/$TARGET_DIR"
          cd "$RUNNER_TEMP/pages"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$TARGET_DIR"
          git commit -m "Deploy Kunming real OSM hydrology V001 from run ${SOURCE_RUN_ID}"
          for attempt in 1 2 3; do
            git fetch origin gh-pages
            git rebase origin/gh-pages
            if git push origin HEAD:gh-pages; then exit 0; fi
            sleep $((attempt*5))
          done
          exit 1

      - name: Verify public files
        run: |
          set -euo pipefail
          BASE="https://haihao0307.github.io/guilin-dem-pipeline/$TARGET_DIR"
          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error "$BASE/index.html?v=${GITHUB_SHA}" -o "$RUNNER_TEMP/public-index.html" \
              && curl --fail --silent --show-error "$BASE/data/manifest.json?v=${GITHUB_SHA}" -o "$RUNNER_TEMP/public-manifest.json"; then
              python - <<'PY'
          import json, pathlib
          m=json.loads(pathlib.Path("${{ runner.temp }}/public-manifest.json").read_text(encoding='utf-8'))
          assert m['osmCurrent']['sourceCounts']['waterways']==1634
          assert m['osmCurrent']['sourceCounts']['water_areas']==1652
          assert m['historical']['acceptedHistoricalTruthCount']==0
          assert m['displayRules']['handDrawnWaterCount']==0
          print('public verification passed')
          PY
              exit 0
            fi
            sleep 10
          done
          exit 1

      - name: Upload deployment evidence
        uses: actions/upload-artifact@v4
        with:
          name: kunming-osm-hydrology-v001-deployment-evidence
          path: |
            ${{ runner.temp }}/site/${{ env.TARGET_DIR }}/BUILD_REPORT.json
            ${{ runner.temp }}/site/${{ env.TARGET_DIR }}/data/manifest.json
            ${{ runner.temp }}/public-manifest.json
          if-no-files-found: error
          retention-days: 30
