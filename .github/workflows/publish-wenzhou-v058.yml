name: Publish Wenzhou V0.5.8 continuous world

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-wenzhou-v058.yml"
      - "tools/wenzhou/v058/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-wenzhou-v058
  cancel-in-progress: false

jobs:
  build-publish-and-prove:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out production source
        uses: actions/checkout@v4
        with:
          path: source

      - name: Check out GitHub Pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
          fetch-depth: 0

      - name: Reassemble verified build inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          test "$(find source/tools/wenzhou/v058 -maxdepth 1 -name 'build.part-*' | wc -l | tr -d ' ')" = '4'
          test "$(find source/tools/wenzhou/v058 -maxdepth 1 -name 'detail.part-*' | wc -l | tr -d ' ')" = '6'
          cat source/tools/wenzhou/v058/build.part-* > build/build_wenzhou_v058.py
          cat source/tools/wenzhou/v058/detail.part-* > build/dongtou_513_i16.bin.gz.b64
          python - <<'PY'
          from pathlib import Path
          path = Path('build/build_wenzhou_v058.py')
          text = path.read_text('utf-8')
          replacements = {
              "  void main(){vWorld=(modelMatrix*vec4(position,1.)).xyz;vN=normalize(mat3(modelMatrix)*normal);vFeather=feather;gl_Position=projectionMatrix*viewMatrix*vec4(vWorld,1.);}`;": "  void main(){{vWorld=(modelMatrix*vec4(position,1.)).xyz;vN=normalize(mat3(modelMatrix)*normal);vFeather=feather;gl_Position=projectionMatrix*viewMatrix*vec4(vWorld,1.);}}`;",
              "  float h21(vec2 p){p=fract(p*vec2(123.34,345.45));p+=dot(p,p+34.345);return fract(p.x*p.y);}": "  float h21(vec2 p){{p=fract(p*vec2(123.34,345.45));p+=dot(p,p+34.345);return fract(p.x*p.y);}}",
              "  float n2(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h21(i),h21(i+vec2(1,0)),f.x),mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),f.x),f.y);}": "  float n2(vec2 p){{vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h21(i),h21(i+vec2(1,0)),f.x),mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),f.x),f.y);}}",
              "  void main(){\n    if(uIsDetail>.5){float a=vFeather*uDetail;float d=h21(gl_FragCoord.xy+floor(uTime*3.));if(d>a)discard;}": "  void main(){{\n    if(uIsDetail>.5){{float a=vFeather*uDetail;float d=h21(gl_FragCoord.xy+floor(uTime*3.));if(d>a)discard;}}",
              "  }`;\nfunction terrainMaterial": "  }}`;\nfunction terrainMaterial",
              "vertexShader:`varying vec3 vD;void main(){vD=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,fragmentShader:`varying vec3 vD;uniform float uMorning;void main(){float h=clamp(vD.y*.5+.5,0.,1.);": "vertexShader:`varying vec3 vD;void main(){{vD=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}}`,fragmentShader:`varying vec3 vD;uniform float uMorning;void main(){{float h=clamp(vD.y*.5+.5,0.,1.);",
              ";gl_FragColor=vec4(c,1.);}`}});\nconst sky=": ";gl_FragColor=vec4(c,1.);}}`}});\nconst sky=",
              "vertexShader:`uniform float uTime;varying vec3 vW;varying vec3 vN;void main(){vec3 p=position;": "vertexShader:`uniform float uTime;varying vec3 vW;varying vec3 vN;void main(){{vec3 p=position;",
              "vW=(modelMatrix*vec4(p,1.)).xyz;gl_Position=projectionMatrix*viewMatrix*vec4(vW,1.);}`,fragmentShader:`uniform vec3 uCam;uniform vec3 uSun;varying vec3 vW;varying vec3 vN;void main(){vec3 V=normalize(uCam-vW),N=normalize(vN);": "vW=(modelMatrix*vec4(p,1.)).xyz;gl_Position=projectionMatrix*viewMatrix*vec4(vW,1.);}}`,fragmentShader:`uniform vec3 uCam;uniform vec3 uSun;varying vec3 vW;varying vec3 vN;void main(){{vec3 V=normalize(uCam-vW),N=normalize(vN);",
              ";gl_FragColor=vec4(c,1.);}`}});\nconst ocean=": ";gl_FragColor=vec4(c,1.);}}`}});\nconst ocean=",
          }
          missing = [old for old in replacements if old not in text]
          if missing:
              raise SystemExit(f'build source patch anchors missing: {len(missing)}')
          for old, new in replacements.items():
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
          echo "patched_build_script_sha256=$(sha256sum build/build_wenzhou_v058.py | awk '{print $1}')"
          echo "detail_container_sha256=$(sha256sum build/dongtou_513_i16.bin.gz.b64 | awk '{print $1}')"
          grep -q 'wenzhou_continuous_world_v058_build@1' build/build_wenzhou_v058.py
          grep -q '小温州 V0.5.8' build/build_wenzhou_v058.py
          python -m py_compile build/build_wenzhou_v058.py

      - name: Restore verified Dongtou 12.5 m payload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib
          src = Path('build/dongtou_513_i16.bin.gz.b64')
          out = Path('build/v057_candidate_0_526338.bin')
          raw = gzip.decompress(base64.b64decode(src.read_text('ascii').strip()))
          expected = '25f2ad68043ee03f0e0a9b20380b03b6bef58c13ec17d96e8bb2802fcf3abf0c'
          actual = hashlib.sha256(raw).hexdigest()
          if len(raw) != 526338 or actual != expected:
              raise SystemExit(f'Verified detail payload mismatch: bytes={len(raw)} sha256={actual}')
          out.write_bytes(raw)
          print(f'restored {out} bytes={len(raw)} sha256={actual}')
          PY

      - name: Build the continuous-world page
        shell: bash
        env:
          WZ_BUILD_ROOT: ${{ github.workspace }}/build
          WZ_REPO_ROOT: ${{ github.workspace }}/site
          WZ_OUTPUT: ${{ github.workspace }}/site/wenzhou-v7-full/workbench-v058/index.html
          WZ_REPORT: ${{ github.workspace }}/site/wenzhou-v7-full/workbench-v058/BUILD_REPORT.json
        run: |
          set -euo pipefail
          python build/build_wenzhou_v058.py
          test -s site/wenzhou-v7-full/workbench-v058/index.html
          grep -q '小温州 V0.5.8' site/wenzhou-v7-full/workbench-v058/index.html

      - name: Commit the published page
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          cd site
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wenzhou-v7-full/workbench-v058/index.html wenzhou-v7-full/workbench-v058/BUILD_REPORT.json
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            git commit -m 'publish: Wenzhou V0.5.8 continuous-world workbench'
            git push origin gh-pages
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Public HTTP deployment gate
        shell: bash
        run: |
          set -euo pipefail
          url="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/wenzhou-v7-full/workbench-v058/?build=${GITHUB_RUN_ID}"
          echo "Checking $url"
          ok=0
          for attempt in $(seq 1 48); do
            status="$(curl -L -sS -o /tmp/page.html -w '%{http_code}' --connect-timeout 10 --max-time 30 "$url" || true)"
            if [ "$status" = '200' ] \
               && grep -q '<!doctype html' /tmp/page.html \
               && grep -q '小温州 V0.5.8' /tmp/page.html \
               && ! grep -qi 'File not found' /tmp/page.html; then
              ok=1
              break
            fi
            echo "attempt=$attempt status=$status waiting for Pages propagation"
            sleep 10
          done
          if [ "$ok" != '1' ]; then
            echo 'Public page did not pass the HTTP gate.' >&2
            sed -n '1,40p' /tmp/page.html 2>/dev/null || true
            exit 1
          fi
          bytes="$(wc -c </tmp/page.html | tr -d ' ')"
          sha="$(sha256sum /tmp/page.html | awk '{print $1}')"
          echo "PUBLIC_URL=$url" >> "$GITHUB_ENV"
          echo "PUBLIC_BYTES=$bytes" >> "$GITHUB_ENV"
          echo "PUBLIC_SHA256=$sha" >> "$GITHUB_ENV"
          echo "public HTTP gate passed: status=200 bytes=$bytes sha256=$sha"

      - name: Write deployment proof to the branch
        shell: bash
        run: |
          set -euo pipefail
          cd site
          git pull --ff-only origin gh-pages
          mkdir -p wenzhou-v7-full/workbench-v058
          cat > wenzhou-v7-full/workbench-v058/PUBLICATION_PROOF.json <<JSON
          {
            "schema": "public_web_delivery_gate@1",
            "url": "${PUBLIC_URL}",
            "httpStatus": 200,
            "bytes": ${PUBLIC_BYTES},
            "sha256": "${PUBLIC_SHA256}",
            "workflowRunId": "${GITHUB_RUN_ID}",
            "commit": "${GITHUB_SHA}",
            "verifiedAtUtc": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "shareAllowed": true
          }
          JSON
          git add wenzhou-v7-full/workbench-v058/PUBLICATION_PROOF.json
          git commit -m 'qa: record Wenzhou V0.5.8 public HTTP proof' || true
          git push origin gh-pages
