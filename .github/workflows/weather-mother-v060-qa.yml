name: Weather Mother V060 public browser QA
on:
  push:
    branches: [gh-pages]
    paths:
      - 'weather-mother/v060/**'
      - '.github/workflows/weather-mother-v060-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: weather-mother-v060-qa
  cancel-in-progress: true
jobs:
  public-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser and numeric image inspection dependencies
        run: |
          python -m pip install playwright==1.57.0 Pillow==11.3.0
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y xvfb
      - name: Verify syntax
        run: |
          node --check weather-mother/v060/engine.js
          node --check weather-mother/v060/field-worker.js
          python -m py_compile weather-mother/v060/qa-public.py
      - name: Live public HTML, shaders, controls and continuity
        run: xvfb-run -a python -u weather-mother/v060/qa-public.py
      - name: Upload numeric evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weather-mother-v060-numeric-qa
          path: weather-mother-v060-qa.json
          if-no-files-found: warn
          retention-days: 14
      - name: Summary
        if: always()
        run: |
          python - <<'PY'
          import os,json
          from pathlib import Path
          p=Path('weather-mother-v060-qa.json')
          r=json.loads(p.read_text()) if p.exists() else {'passed':False,'errors':['No QA receipt generated']}
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('# Weather Mother V0.6.0\n\n')
              f.write('Public browser QA passed: '+str(r.get('passed',False))+'\n\n')
              f.write('Stored image files: 0. Visual acceptance and AAA approval remain false.\n\n')
              for c in r.get('checks',[]):
                  f.write(('* PASS ' if c['passed'] else '* FAIL ')+c['name']+'\n')
              for e in r.get('errors',[]): f.write('\n```text\n'+e+'\n```\n')
          PY
