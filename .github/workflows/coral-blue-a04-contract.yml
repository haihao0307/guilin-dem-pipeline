name: Blue Coral A04 Exact Contract

on:
  push:
    branches: [work/coral-blue-a04-hdf-exact-20260923]
    paths:
      - apps/coral-restart-20260923/blue-coral-a04-hdf/**
      - .github/workflows/coral-blue-a04-contract.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coral-blue-a04-exact-contract
  cancel-in-progress: false

jobs:
  exact-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify single canonical package and all 36 source accessors
        run: |
          python apps/coral-restart-20260923/blue-coral-a04-hdf/tests/test_exact_contract.py \
            apps/coral-restart-20260923/blue-coral-a04-hdf

      - name: Verify frozen execution boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('apps/coral-restart-20260923/blue-coral-a04-hdf')
          boundary=json.loads((root/'contracts/EXECUTION_BOUNDARY.json').read_text())
          receipt=json.loads((root/'contracts/EXACT_VERIFICATION.json').read_text())
          package=json.loads((root/'teacher-package.json').read_text())
          assert boundary['methodChangeAuthorized'] is False
          assert boundary['structureGrammarUnlocked'] is False
          assert boundary['finalGenerator'] is False
          assert receipt['passed'] is True
          assert receipt['accessorByteMismatchCount'] == 0
          assert receipt['forbiddenMethodCount'] == 0
          assert receipt['workbench']['bytes'] == 52830447
          assert receipt['workbench']['sha256'] == 'ba27dce0c4d5e89eed70ffdd391fe8fe3fe8de7561020edcdd9a84d5023138fb'
          assert package['boundary']['oneToOneVisualRestatementApproved'] is False
          assert package['boundary']['structureGrammarUnlocked'] is False
          assert package['boundary']['isFinalCoralGenerator'] is False
          print('BLUE_CORAL_A04_BOUNDARY_AND_RECEIPT_PASS')
          PY

      - name: Verify compiler and builder contain no downgrade implementation
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path('apps/coral-restart-20260923/blue-coral-a04-hdf')
          implementation='\n'.join((root/name).read_text() for name in [
            'tools/compile_exact_teacher.py',
            'tools/build_exact_workbench.py',
          ])
          complete='\n'.join((root/name).read_text() for name in [
            'tools/compile_exact_teacher.py',
            'tools/verify_exact_fields.py',
            'tools/build_exact_workbench.py',
          ])
          for marker in [
            'c65bc1b9c389b3b1c3f4c09fc345619ad4ad4994666a06eb294822eafa503857',
            'allSourceAccessorsPreservedByteExact',
            'separateCandidateBuffersRequired',
            'sameScaleSameCameraComparisonRequired',
          ]: assert marker in complete, marker
          for marker in [
            'trimesh.simplify',
            'MarchingCubes(',
            'meshopt_simplify(',
            'voxelize(',
            'simplify_quadratic_decimation',
          ]: assert marker not in implementation, marker
          print('BLUE_CORAL_A04_COMPILER_AND_BUILDER_METHOD_PASS')
          PY

      - name: Syntax-check runtime and deterministic builder
        run: |
          node --check apps/coral-restart-20260923/blue-coral-a04-hdf/runtime/exact-field-decoder.mjs
          node --check apps/coral-restart-20260923/blue-coral-a04-hdf/runtime/workbench.mjs
          python -m py_compile \
            apps/coral-restart-20260923/blue-coral-a04-hdf/tools/compile_exact_teacher.py \
            apps/coral-restart-20260923/blue-coral-a04-hdf/tools/verify_exact_fields.py \
            apps/coral-restart-20260923/blue-coral-a04-hdf/tools/build_exact_workbench.py

      - name: Bundle the independent candidate runtime
        run: |
          npm install --no-save three@0.170.0 esbuild@0.24.2
          npx esbuild \
            apps/coral-restart-20260923/blue-coral-a04-hdf/runtime/workbench.mjs \
            --bundle \
            --format=esm \
            --target=es2022 \
            --minify \
            --legal-comments=none \
            --outfile=/tmp/blue-coral-a04-runtime.js
          test -s /tmp/blue-coral-a04-runtime.js
          ! grep -q 'SkeletonUtils' /tmp/blue-coral-a04-runtime.js
          grep -q 'BLUE_CORAL_CANONICAL_A04' /tmp/blue-coral-a04-runtime.js
          grep -Eq 'sourceCloneUsed:(!1|false)' /tmp/blue-coral-a04-runtime.js
          echo "BLUE_CORAL_A04_RUNTIME_BUNDLE_BYTES=$(wc -c </tmp/blue-coral-a04-runtime.js)"

      - uses: actions/upload-artifact@v4
        with:
          name: blue-coral-a04-runtime-source-and-bundle
          path: |
            /tmp/blue-coral-a04-runtime.js
            apps/coral-restart-20260923/blue-coral-a04-hdf/runtime
            apps/coral-restart-20260923/blue-coral-a04-hdf/tools
            apps/coral-restart-20260923/blue-coral-a04-hdf/contracts
          retention-days: 30
