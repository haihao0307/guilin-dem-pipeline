name: farmland-r045-round59-qa
on:
  push:
    branches: [restart/farmland-object-dna-v020-20260907]
    paths:
      - 'farmland-object-dna/research/r045-autonomous-rebuild/round-59/**'
      - '.github/workflows/farmland-r045-round59-qa.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Generate authoritative numeric result
        run: node farmland-object-dna/research/r045-autonomous-rebuild/round-59/r045_round59_qa.mjs
      - name: Gate numeric QA
        if: always()
        run: node -e "let r=require('./farmland-object-dna/research/r045-autonomous-rebuild/round-59/r045_round59_qa_result.json');console.log(r.passedCount+'/'+r.gateCount);if(!r.passed){for(const c of r.checks.filter(x=>!x.pass))console.error('FAIL',c.name,JSON.stringify(c.value),'limit',c.limit);process.exit(2)}"
      - name: Build bounded fixed-view cache
        if: always()
        run: node farmland-object-dna/research/r045-autonomous-rebuild/round-59/r045_round59_build_audit_cache.mjs
      - name: Browser fixed-view gate
        if: always()
        shell: bash
        run: |
          set +e
          ROOT="$PWD";PAGE='http://127.0.0.1:8159/farmland-object-dna/research/r045-autonomous-rebuild/round-59/r045_round59_audit.html';OUT="$ROOT/farmland-object-dna/research/r045-autonomous-rebuild/round-59";CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)";rm -f "$OUT/r045_round59_fixed_view.png";python3 -m http.server 8159 --bind 127.0.0.1 >/tmp/r59-http.log 2>&1 & PID=$!;sleep 2
          if [ -z "$CHROME_BIN" ];then SHOT_STATUS=127;DOM_STATUS=127;: >/tmp/r59-dom.html;else unset DBUS_SESSION_BUS_ADDRESS;FLAGS=(--headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-background-networking --disable-component-update --disable-sync --disable-extensions --disable-default-apps --no-first-run --no-default-browser-check --metrics-recording-only --hide-scrollbars --window-size=1400,900 --force-device-scale-factor=1 --virtual-time-budget=3000);timeout 45s "$CHROME_BIN" "${FLAGS[@]}" --screenshot="$OUT/r045_round59_fixed_view.png" "$PAGE";SHOT_STATUS=$?;timeout 45s "$CHROME_BIN" "${FLAGS[@]}" --dump-dom "$PAGE" >/tmp/r59-dom.html;DOM_STATUS=$?;fi;kill "$PID" 2>/dev/null||true;grep -q 'data-ready="true"' /tmp/r59-dom.html;READY_STATUS=$?;export SHOT_STATUS DOM_STATUS READY_STATUS CHROME_BIN OUT
          python3 - <<'PY'
          import json,os
          out=os.environ['OUT'];p=os.path.join(out,'r045_round59_fixed_view.png');r={'chrome_bin':os.environ.get('CHROME_BIN',''),'screenshot_status':int(os.environ['SHOT_STATUS']),'dom_status':int(os.environ['DOM_STATUS']),'ready_marker_status':int(os.environ['READY_STATUS']),'screenshot_exists':os.path.exists(p),'screenshot_bytes':os.path.getsize(p) if os.path.exists(p) else 0};r['render_evidence_present']=r['screenshot_exists'] and r['screenshot_bytes']>20000;r['page_startup_passed']=r['dom_status']==0 and r['ready_marker_status']==0;r['passed']=r['screenshot_status']==0 and r['render_evidence_present'] and r['page_startup_passed'];open(os.path.join(out,'r045_round59_browser_result.json'),'w').write(json.dumps(r,indent=2));print(json.dumps(r,indent=2));raise SystemExit(0 if r['passed'] else 3)
          PY
      - name: Build summary
        if: always()
        run: node -e "const fs=require('fs'),p='farmland-object-dna/research/r045-autonomous-rebuild/round-59/';let q=null,b=null;try{q=JSON.parse(fs.readFileSync(p+'r045_round59_qa_result.json'))}catch{}try{b=JSON.parse(fs.readFileSync(p+'r045_round59_browser_result.json'))}catch{}fs.writeFileSync(p+'r045_round59_summary.json',JSON.stringify({version:q?.version||'R045.59',passed:Boolean(q?.passed)&&Boolean(b?.passed),numericPassed:Boolean(q?.passed),passedCount:q?.passedCount??0,gateCount:q?.gateCount??0,failed:q?.checks?.filter(c=>!c.pass)||[],browser:b,metrics:q?.metrics||null},null,2))"
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: farmland-r045-round59-audit
          if-no-files-found: warn
          path: |
            farmland-object-dna/research/r045-autonomous-rebuild/round-59/r045_round59_qa_result.json
            farmland-object-dna/research/r045-autonomous-rebuild/round-59/r045_round59_browser_result.json
            farmland-object-dna/research/r045-autonomous-rebuild/round-59/r045_round59_summary.json
            farmland-object-dna/research/r045-autonomous-rebuild/round-59/r045_round59_audit_cache.mjs
            farmland-object-dna/research/r045-autonomous-rebuild/round-59/r045_round59_fixed_view.png
      - name: Persist fixed evidence without racing branch head
        if: always()
        shell: bash
        run: |
          set -e
          git config user.name 'github-actions[bot]';git config user.email '41898242+github-actions[bot]@users.noreply.github.com'
          git add farmland-object-dna/research/r045-autonomous-rebuild/round-59/r045_round59_qa_result.json farmland-object-dna/research/r045-autonomous-rebuild/round-59/r045_round59_browser_result.json farmland-object-dna/research/r045-autonomous-rebuild/round-59/r045_round59_summary.json farmland-object-dna/research/r045-autonomous-rebuild/round-59/r045_round59_audit_cache.mjs farmland-object-dna/research/r045-autonomous-rebuild/round-59/r045_round59_fixed_view.png
          git stash push --include-untracked --keep-index -m r59-evidence >/dev/null || true
          git reset >/dev/null 2>&1 || true
          git pull --rebase origin ${GITHUB_REF_NAME}
          git stash pop >/dev/null || true
          git add farmland-object-dna/research/r045-autonomous-rebuild/round-59/r045_round59_qa_result.json farmland-object-dna/research/r045-autonomous-rebuild/round-59/r045_round59_browser_result.json farmland-object-dna/research/r045-autonomous-rebuild/round-59/r045_round59_summary.json farmland-object-dna/research/r045-autonomous-rebuild/round-59/r045_round59_audit_cache.mjs farmland-object-dna/research/r045-autonomous-rebuild/round-59/r045_round59_fixed_view.png
          if git diff --cached --quiet;then exit 0;fi
          git commit -m 'farmland R045.59 persist fixed QA evidence [skip ci]'
          git push origin HEAD:${GITHUB_REF_NAME}
