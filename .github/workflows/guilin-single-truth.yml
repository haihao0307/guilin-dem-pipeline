name: Guilin native 12.5 m single truth

on:
  push:
    branches:
      - project/guilin-native-12p5m-single-truth
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: guilin-native-12p5m-single-truth
  cancel-in-progress: true

jobs:
  canonicalize:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
      CANONICAL_BRANCH: project/guilin-native-12p5m-single-truth
      CANONICAL_TAG: guilin-native-12p5m-single-truth-v001
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deterministic raster and browser dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check numpy==2.1.3 rasterio==1.4.3 Pillow==11.1.0
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          command -v google-chrome || command -v chromium || command -v chromium-browser
      - name: Canonicalize the sole Guilin DEM truth line
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f pipeline/canonicalize.sh ]]; then
            bash pipeline/canonicalize.sh
          else
            cat .canonical/bootstrap/pipeline/canonicalize.part*.sh > /tmp/guilin-canonicalize.sh
            bash /tmp/guilin-canonicalize.sh
          fi
