name: QA Haiyu source organism WebGL
on:
  push:
    branches: [gh-pages]
    paths:
      - kaopu-haiyu-workbench/index.html
      - kaopu-haiyu-workbench/r24/index.html
      - kaopu-haiyu-workbench/r24/tests/browser-qa.cjs
      - .github/workflows/kaopu-haiyu-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: kaopu-haiyu-workbench
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned official browser test dependency
        run: |
          npm install --prefix .haiyu-qa --no-save --ignore-scripts --no-audit --no-fund playwright@1.55.0
          ./.haiyu-qa/node_modules/.bin/playwright install chromium
      - name: Install readable Chinese test fonts
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Verify exact public bytes and software WebGL depth path
        env:
          NODE_PATH: ${{ github.workspace }}/.haiyu-qa/node_modules
          HAIYU_HTML: ${{ github.workspace }}/kaopu-haiyu-workbench/r24/index.html
          HAIYU_PUBLIC_URL: https://haihao0307.github.io/guilin-dem-pipeline/kaopu-haiyu-workbench/r24/
          HAIYU_QA_OUT: ${{ github.workspace }}/haiyu-r24-browser-results
        run: node kaopu-haiyu-workbench/r24/tests/browser-qa.cjs
      - name: Preserve browser verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: haiyu-r24-browser-${{ github.sha }}
          path: haiyu-r24-browser-results/
          if-no-files-found: error
