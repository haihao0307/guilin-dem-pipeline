name: QA Haiyu source organism WebGL
on:
  push:
    branches: [qa/haiyu-pointfields-20261007, gh-pages]
    paths:
      - kaopu-haiyu-workbench/index.html
      - kaopu-haiyu-workbench/r24/**
      - kaopu-haiyu-workbench/studies/20261007-pointfields/**
      - .github/workflows/kaopu-haiyu-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: kaopu-haiyu-workbench
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned official browser test dependency
        run: |
          npm install --prefix .haiyu-qa --no-save --ignore-scripts --no-audit --no-fund playwright@1.55.0
          ./.haiyu-qa/node_modules/.bin/playwright install chromium
      - name: Install readable Chinese test fonts
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Verify both screenshot formulas and actual browser interactions
        env:
          NODE_PATH: ${{ github.workspace }}/.haiyu-qa/node_modules
          HAIYU_HTML: ${{ github.workspace }}/kaopu-haiyu-workbench/index.html
          HAIYU_POINTFIELD_OUT: ${{ github.workspace }}/haiyu-pointfield-results
          HAIYU_POINTFIELD_URL: https://haihao0307.github.io/guilin-dem-pipeline/kaopu-haiyu-workbench/
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import urllib.request,time,json,hashlib
          expected=hashlib.sha256(Path('kaopu-haiyu-workbench/index.html').read_bytes()).hexdigest()
          url='https://haihao0307.github.io/guilin-dem-pipeline/kaopu-haiyu-workbench/'
          deadline=time.monotonic()+900
          while True:
              try:
                  response=urllib.request.urlopen(url+'?verify=2a53d77f87bb932ed8381b33e86f937712b66b28',timeout=45)
                  body=response.read();actual=hashlib.sha256(body).hexdigest()
                  if actual==expected:break
                  print('Waiting for exact Pages bytes',actual,flush=True)
              except Exception as error:print(str(error),flush=True)
              if time.monotonic()>deadline:raise RuntimeError('Expected Pages bytes did not arrive')
              time.sleep(15)
          out=Path('haiyu-pointfield-results');out.mkdir(exist_ok=True)
          (out/'public-bytes.json').write_text(json.dumps({'url':url,'status':response.status,'bytes':len(body),'expectedSha256':expected,'actualSha256':actual,'productionCommit':'2a53d77f87bb932ed8381b33e86f937712b66b28','exact':True},indent=2))
          PYCODE
          node kaopu-haiyu-workbench/studies/20261007-pointfields/tests/fidelity.cjs
          node kaopu-haiyu-workbench/studies/20261007-pointfields/tests/browser-qa.cjs
      - name: Run unmodified R24 assertions in local-file mode before publication
        if: github.ref == 'refs/heads/qa/haiyu-pointfields-20261007'
        env:
          NODE_PATH: ${{ github.workspace }}/.haiyu-qa/node_modules
          HAIYU_HTML: ${{ github.workspace }}/kaopu-haiyu-workbench/index.html
          HAIYU_QA_OUT: ${{ github.workspace }}/haiyu-r24-file-only-results
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import re
          original=Path('kaopu-haiyu-workbench/r24/tests/browser-qa.cjs').read_text()
          pattern=r'const deadline=Date\.now\(\)\+12\*60e3;[\s\S]*?save\(\);browser='
          script,count=re.subn(pattern, 'report.public={prepublicationSkipped:true};save();browser=',original,count=1)
          assert count==1
          old="for(const mode of ['file','public'])"
          assert script.count(old)==1
          script=script.replace(old,"for(const mode of ['file'])")
          Path('.haiyu-qa/r24-file-only.cjs').write_text(script)
          PYCODE
          node .haiyu-qa/r24-file-only.cjs
      - name: Verify existing full workbench on exact published bytes
        if: github.ref == 'refs/heads/gh-pages'
        env:
          NODE_PATH: ${{ github.workspace }}/.haiyu-qa/node_modules
          HAIYU_HTML: ${{ github.workspace }}/kaopu-haiyu-workbench/index.html
          HAIYU_PUBLIC_URL: https://haihao0307.github.io/guilin-dem-pipeline/kaopu-haiyu-workbench/
          HAIYU_QA_OUT: ${{ github.workspace }}/haiyu-r24-browser-results
        run: |
          node kaopu-haiyu-workbench/r24/tests/phase-volume.test.cjs kaopu-haiyu-workbench/r24
          node kaopu-haiyu-workbench/r24/tests/angular-volume.test.cjs
          node kaopu-haiyu-workbench/r24/tests/browser-qa.cjs
      - name: Preserve browser verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: haiyu-pointfields-${{ github.sha }}
          path: |
            haiyu-pointfield-results/
            haiyu-r24-browser-results/
            haiyu-r24-file-only-results/
          if-no-files-found: error
