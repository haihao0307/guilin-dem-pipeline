name: Hong Kong background sea R01 isolated QA
on:
  push:
    branches: ['qa/hong-kong-background-sea-r01-20261012']
    paths: ['kaopu-geography-workbench/hong-kong-background-sea-r01/**', '.github/workflows/hong-kong-background-sea-r01.yml']
permissions:
  contents: read
jobs:
  sea:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: kaopu-geography-workbench/hong-kong-background-sea-r01
      - name: Build unchanged mother kernel and test static identity
        run: |
          python3 kaopu-geography-workbench/hong-kong-background-sea-r01/build.py
          python3 kaopu-geography-workbench/hong-kong-background-sea-r01/qa/static_check.py
      - name: Install official pinned browser test runner
        run: |
          python3 -m pip install playwright==1.57.0 pillow==11.3.0
          python3 -m playwright install --with-deps chromium
      - name: Normal perspective desktop and mobile software WebGL QA
        run: python3 kaopu-geography-workbench/hong-kong-background-sea-r01/qa/browser_check.py
      - name: Matched dimensions live-weather versus background cache comparison
        run: python3 kaopu-geography-workbench/hong-kong-background-sea-r01/qa/background_cache_check.py
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: hong-kong-background-sea-${{ github.sha }}
          path: |
            kaopu-geography-workbench/hong-kong-background-sea-r01/qa/
            kaopu-geography-workbench/hong-kong-background-sea-r01/SOURCE_MANIFEST.json
          retention-days: 7
