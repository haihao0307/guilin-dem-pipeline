name: Published geography09 observation and private08 UI QA
on:
  push:
    branches: [qa/geography-submarine-original10-20261006]
    paths:
      - 'kaopu-geography-workbench/**'
      - '.github/workflows/geography-submarine-original10-qa.yml'
permissions:
  contents: read
jobs:
  original-main-app:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: kaopu-geography-workbench
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install official pinned browser tooling
        run: |
          python -m pip install playwright==1.57.0 pillow
          python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Verify main09 observation, private08 UI and locked10 pixels
        env:
          KAOPU_PUBLIC_URL: https://haihao0307.github.io/guilin-dem-pipeline/kaopu-geography-workbench/
          KAOPU_BROWSER: ${{ matrix.browser }}
        run: |
          python - <<'PY_PUBLIC'
          import hashlib,os,time,urllib.request
          from pathlib import Path
          names=['index.html','runtime.js','manta-observe09.js','canyon-local08.js','original-study-controls.css','qa_public.py','qa_catalog.py','README.md']
          deadline=time.time()+600
          while True:
              try:
                  for name in names:
                      expected=Path('kaopu-geography-workbench',name).read_bytes()
                      with urllib.request.urlopen(os.environ['KAOPU_PUBLIC_URL']+name+'?interaction=fd05c9f1-'+str(time.time()),timeout=30)as response: actual=response.read()
                      assert hashlib.sha256(actual).digest()==hashlib.sha256(expected).digest(),name
                  print('PUBLIC_EXACT_EIGHT_FILES',names,flush=True)
                  break
              except Exception as error:
                  if time.time()>=deadline: raise
                  print('Waiting for exact public files:',str(error),flush=True)
                  time.sleep(15)
          PY_PUBLIC
          python kaopu-geography-workbench/qa_manta09_main.py
          python kaopu-geography-workbench/qa_canyon08_local_ui.py
          python kaopu-geography-workbench/qa_submarine10_main.py
          if [ "$KAOPU_BROWSER" = "chromium" ]; then
            python kaopu-geography-workbench/qa_catalog.py
            python kaopu-geography-workbench/qa_public.py
          fi
      - name: Preserve camera and UI browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geography-interaction-${{ matrix.browser }}-${{ github.sha }}
          path: |
            manta09-browser-qa/
            submarine10-browser-qa/
            canyon08-ui-qa/
          retention-days: 7
          if-no-files-found: warn
      - name: Preserve original-seven regression evidence
        if: always() && matrix.browser == 'chromium'
        uses: actions/upload-artifact@v4
        with:
          name: geography-original-regression-${{ github.sha }}
          path: geography-qa/
          retention-days: 7
          if-no-files-found: warn
