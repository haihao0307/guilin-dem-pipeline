name: Published geography09 continuous camera clock QA
on:
  push:
    branches: [qa/geography-submarine-original10-20261006]
    paths:
      - 'kaopu-geography-workbench/**'
      - '.github/workflows/geography-submarine-original10-qa.yml'
permissions:
  contents: read
jobs:
  original-main-app:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: kaopu-geography-workbench
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install official pinned browser tooling
        run: |
          python -m pip install playwright==1.57.0 pillow
          python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Verify continuous09 input clock and locked10 pixels
        env:
          KAOPU_PUBLIC_URL: https://haihao0307.github.io/guilin-dem-pipeline/kaopu-geography-workbench/
          KAOPU_BROWSER: ${{ matrix.browser }}
        run: |
          python - <<'PY_PUBLIC'
          import hashlib,os,time,urllib.request
          from pathlib import Path
          expected=Path('kaopu-geography-workbench/runtime.js').read_bytes()
          deadline=time.time()+600
          while True:
              try:
                  with urllib.request.urlopen(os.environ['KAOPU_PUBLIC_URL']+'runtime.js?clock=c8d87b84-'+str(time.time()),timeout=30)as response: actual=response.read()
                  assert hashlib.sha256(actual).digest()==hashlib.sha256(expected).digest(),'runtime.js mismatch'
                  print('PUBLIC_RUNTIME_SHA256',hashlib.sha256(actual).hexdigest(),flush=True)
                  break
              except Exception as error:
                  if time.time()>=deadline: raise
                  print('Waiting for exact public runtime:',str(error),flush=True)
                  time.sleep(15)
          PY_PUBLIC
          python kaopu-geography-workbench/qa_manta09_main.py
          python kaopu-geography-workbench/qa_submarine10_main.py
      - name: Preserve camera and UI browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geography-interaction-${{ matrix.browser }}-${{ github.sha }}
          path: |
            manta09-browser-qa/
            submarine10-browser-qa/
          retention-days: 7
          if-no-files-found: warn
