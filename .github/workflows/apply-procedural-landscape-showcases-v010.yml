name: Apply procedural landscape three-region showcases v0.1

on:
  push:
    branches:
      - skill/dem-procedural-landscape-v010
    paths:
      - ops/apply_procedural_landscape_showcases_v010.py
      - .github/workflows/apply-procedural-landscape-showcases-v010.yml

permissions:
  contents: write

concurrency:
  group: apply-procedural-landscape-showcases-v010
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: skill/dem-procedural-landscape-v010
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply ownership and registry update
        run: python ops/apply_procedural_landscape_showcases_v010.py
      - name: Validate existing production-line contracts
        run: |
          python tools/procedural_landscape/validate.py --root . --json-report reports/SHOWCASES_V010_FOUNDATION_VALIDATION.json
          python -m unittest discover -s tests/procedural_landscape -p 'test_*.py' -v
          python -m py_compile tools/procedural_landscape/showcase_v010_qa.py
          python -m json.tool web/procedural-landscape-showcases-v010/showcase.json >/dev/null
      - name: Install Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Verify all showcase pages before commit
        run: python tools/procedural_landscape/showcase_v010_qa.py --root . --output reports/procedural-landscape-showcases-v010-bootstrap
      - name: Upload pre-commit evidence
        uses: actions/upload-artifact@v4
        with:
          name: procedural-landscape-showcases-v010-bootstrap-evidence
          path: |
            reports/SHOWCASES_V010_FOUNDATION_VALIDATION.json
            reports/procedural-landscape-showcases-v010-bootstrap/**
            ops/tasks/DEM_PROCEDURAL_LANDSCAPE_SHOWCASES_V010_APPLY_RECEIPT.json
          if-no-files-found: error
          retention-days: 30
      - name: Commit by fast-forward only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          test -n "$(git diff --cached --name-only)"
          git commit -m 'Register Xiaohua and three 100 km2 ecology showcases'
          for attempt in 1 2 3; do
            git fetch origin skill/dem-procedural-landscape-v010
            git rebase origin/skill/dem-procedural-landscape-v010
            if git push origin HEAD:skill/dem-procedural-landscape-v010; then exit 0; fi
            sleep $((attempt * 5))
          done
          exit 1
