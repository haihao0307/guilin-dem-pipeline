name: Verify evidence-floor function and material composition
on:
  push:
    branches: ['trial/kcc-evidence-floor-r01-20261021']
permissions:
  contents: read
jobs:
  floor-field:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            kaopu-geography-workbench/kowloon-building-mother-r01
            kaopu-geography-workbench/hk-three-buildings-r01
      - name: Human eye support and unchanged-room camera guards
        run: node --test kaopu-geography-workbench/kowloon-building-mother-r01/tests/floor-human-views.test.mjs
      - name: Install pinned browser
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Start isolated local server
        run: python -m http.server 8765 >/tmp/server.log 2>&1 &
      - name: Real compile and two natural-field-of-view room captures
        run: timeout 300s python -u kaopu-geography-workbench/kowloon-building-mother-r01/tests/floor-human-views-browser.py --output kaopu-geography-workbench/kowloon-building-mother-r01/evidence/floor-human-view-r01
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: floor-human-views-${{ github.sha }}
          path: kaopu-geography-workbench/kowloon-building-mother-r01/evidence/floor-human-view-r01
          retention-days: 1
