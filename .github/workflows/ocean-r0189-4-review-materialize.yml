name: Ocean R018.9.4 review materialization

on:
  push:
    branches: [review/ocean-r0189-4-coast-surface-20260915]
    paths:
      - .github/workflows/ocean-r0189-4-review-materialize.yml
      - ocean-mother/recovery/r0189-3/Ocean_Mother_R018.9.3_Rock_Form_Candidate.html
      - ocean-mother/recovery/r0189-4/build_r0189_4_coast_surface.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ocean-r0189-4-review-materialize
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Build candidate from R018.9.3
        run: |
          set -euo pipefail
          python ocean-mother/recovery/r0189-4/build_r0189_4_coast_surface.py

      - name: Verify protected inheritance and JavaScript
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json,re,subprocess
          root=Path('ocean-mother/recovery/r0189-4')
          html=root/'Ocean_Mother_R018.9.4_Coast_Surface_Candidate.html'
          report=json.loads((root/'R0189_4_BUILD_REPORT.json').read_text())
          assert report['candidate']=='R018.9.4'
          assert report['protectedHashesUnchanged'] is True
          assert report['deepOceanByteIdentityInsideCandidate'] is True
          assert report['deepOcean']=='frozen original V001'
          assert report['smokeFireDefaultOff'] is True
          assert report['visualApproved'] is False
          s=html.read_text()
          assert 'ISLAND GOLD COAST / R018.9.4' in s
          assert 'r0189.4-coast-surface-v001-deep-frozen' in s
          for i,code in enumerate(re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)):
              p=Path('/tmp')/f'r0189-4-review-{i}.js'; p.write_text(code)
              subprocess.run(['node','--check',str(p)],check=True)
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY

      - name: Commit fixed review candidate
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add ocean-mother/recovery/r0189-4/Ocean_Mother_R018.9.4_Coast_Surface_Candidate.html \
                  ocean-mother/recovery/r0189-4/R0189_4_BUILD_REPORT.json
          if ! git diff --cached --quiet; then
            git commit -m 'ocean: materialize fixed R018.9.4 review candidate'
            git push origin HEAD:review/ocean-r0189-4-coast-surface-20260915
          fi

      - name: Preserve candidate package
        uses: actions/upload-artifact@v4
        with:
          name: Ocean_Mother_R0189_4_Coast_Surface_Review
          path: ocean-mother/recovery/r0189-4
          retention-days: 30
          if-no-files-found: error
