name: Wenzhou v1.1.1 high-resolution truthful assets

on:
  push:
    branches:
      - project/wenzhou-v110-3d-satellite-osm-water
    paths:
      - .github/workflows/wenzhou-v111-hires-build.yml
      - projects/wenzhou/web/v111/scripts/build_v111_hires_assets.py
      - tools/build_wenzhou_v111_runtime.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wenzhou-v111-hires-build
  cancel-in-progress: false

jobs:
  build-hires:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout exact branch with Git LFS
        uses: actions/checkout@v4
        with:
          ref: project/wenzhou-v110-3d-satellite-osm-water
          fetch-depth: 0
          lfs: true

      - name: Pull and verify immutable source data
        shell: bash
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs pull --include='projects/wenzhou/archive/truth/WENZHOU_QINGJIANG_22000KM2_12_5M_COG.tif,projects/wenzhou/archive/truth/evidence/WENZHOU_QINGJIANG_marine_mask_COG.tif,projects/wenzhou/coastal/data/derived/WENZHOU_COASTAL_BATHY_100M_EPSG32651_COG.tif'
          LAND='projects/wenzhou/archive/truth/WENZHOU_QINGJIANG_22000KM2_12_5M_COG.tif'
          MARINE='projects/wenzhou/archive/truth/evidence/WENZHOU_QINGJIANG_marine_mask_COG.tif'
          BATHY='projects/wenzhou/coastal/data/derived/WENZHOU_COASTAL_BATHY_100M_EPSG32651_COG.tif'
          COAST='projects/wenzhou/coastal/data/hydrology/osm/WENZHOU_COASTLINE_EPSG32651.geojson'
          RIVERS='projects/wenzhou/coastal/data/hydrology/osm/WENZHOU_RIVER_CENTERLINES_EPSG32651.geojson'
          test "$(stat -c '%s' "$LAND")" = '54638031'
          test "$(stat -c '%s' "$BATHY")" = '17637178'
          test "$(stat -c '%s' "$MARINE")" -gt 900000
          echo '8a1bc6ee17dd731007804a0281f9e083e01f5745468f90cf2c11c108ec0b1c6e  '"$LAND" | sha256sum --check --strict
          echo '591e92eef61699088a87e32bfd83417498f89cfe3a6a84f4ce6a2e2ac3b689fc  '"$BATHY" | sha256sum --check --strict
          echo '5cfeb0465df59590c78c6b163f60ae8764731e1ea65e3adcbc5052813b299181  '"$COAST" | sha256sum --check --strict
          echo '585220c369ed8ec6b588f1913489870c585cc98ddd7c5357beaff9ddaae7a9d9  '"$RIVERS" | sha256sum --check --strict
          git lfs fsck

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install geospatial builder
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check 'numpy>=2.0,<3' 'rasterio>=1.4,<2' 'Pillow>=11,<12'

      - name: Static checks
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile projects/wenzhou/web/v111/scripts/build_v111_hires_assets.py
          python -m py_compile tools/build_wenzhou_v111_runtime.py

      - name: Build high-resolution runtime code and truthful assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf web/wenzhou-v111 projects/wenzhou/reports/WENZHOU_V111_HIRES_ASSET_BUILD.json
          python tools/build_wenzhou_v111_runtime.py
          python projects/wenzhou/web/v111/scripts/build_v111_hires_assets.py | tee /tmp/wenzhou-v111-hires-build.log

      - name: Validate precision, clipping, draping and lossless outputs
        shell: bash
        run: |
          set -euo pipefail
          node --check web/wenzhou-v111/runtime.js
          python - <<'PY'
          import hashlib
          import json
          import math
          from pathlib import Path

          root = Path('.')
          manifest_path = root / 'web/wenzhou-v111/assets/hires/manifest.json'
          report_path = root / 'projects/wenzhou/reports/WENZHOU_V111_HIRES_ASSET_BUILD.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          report = json.loads(report_path.read_text(encoding='utf-8'))
          assert report['passed'] is True
          assert manifest['truth']['sha256'] == '8a1bc6ee17dd731007804a0281f9e083e01f5745468f90cf2c11c108ec0b1c6e'
          assert manifest['terrainOverview']['grid'] == [1025, 1025]
          assert manifest['terrainOverview']['triangleCount'] == 2097152
          assert manifest['terrainOverview']['spacingMeters'][0] < 145
          assert manifest['offlineSatelliteColor']['size'] == [4096, 4096]
          assert manifest['offlineSatelliteColor']['losslessPng'] is True
          assert manifest['offlineSatelliteColor']['asset'].endswith('.png')
          assert manifest['bathymetryOverview']['grid'] == [1025, 1025]
          assert manifest['bathymetryOverview']['landCellsEncodedAsNoData'] is True
          hydrology = manifest['hydrology']
          assert hydrology['truthAoiClipped'] is True
          assert hydrology['sourceDemDraped'] is True
          assert hydrology['riverSampleSpacingMaximumMeters'] <= 25.01
          assert set(manifest['detailTiles']) == {'wenzhou','xianxi','haimen','yandang','oujiang','yueqing','kanmen'}
          assert all(tile['sourceSpacingMeters'] == 12.5 for tile in manifest['detailTiles'].values())

          coast = json.loads((root / 'web/wenzhou-v111/assets/hires' / hydrology['coastlineAsset']).read_text(encoding='utf-8'))
          rivers = json.loads((root / 'web/wenzhou-v111/assets/hires' / hydrology['riverAsset']).read_text(encoding='utf-8'))
          half_x = manifest['terrainOverview']['widthMeters'] / 2 + 0.1
          half_z = manifest['terrainOverview']['heightMeters'] / 2 + 0.1
          for collection in (coast, rivers):
              for part in collection['parts']:
                  for point in part['coords']:
                      assert len(point) == 3
                      assert all(math.isfinite(float(value)) for value in point)
                      assert -half_x <= point[0] <= half_x
                      assert -half_z <= point[2] <= half_z
          max_spacing = 0.0
          for part in rivers['parts']:
              coords = part['coords']
              for index in range(1, len(coords)):
                  spacing = math.hypot(coords[index][0] - coords[index-1][0], coords[index][2] - coords[index-1][2])
                  max_spacing = max(max_spacing, spacing)
          assert max_spacing <= 25.01, max_spacing

          checked = []
          for item in manifest['assets']:
              path = root / item['path']
              assert path.is_file(), path
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              assert path.stat().st_size == item['bytes'], item
              assert digest == item['sha256'], item
              checked.append(item['path'])
          print(json.dumps({
              'passed': True,
              'terrainGrid': manifest['terrainOverview']['grid'],
              'terrainSpacingMeters': manifest['terrainOverview']['spacingMeters'],
              'bathymetryGrid': manifest['bathymetryOverview']['grid'],
              'riverParts': rivers['partCount'],
              'riverSamples': rivers['sampleCount'],
              'maximumRiverSampleSpacingMeters': max_spacing,
              'coastlineParts': coast['partCount'],
              'detailTiles': list(manifest['detailTiles']),
              'checkedAssets': len(checked),
          }, ensure_ascii=False, indent=2))
          PY

      - name: Commit high-resolution candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- web/wenzhou-v111 projects/wenzhou/reports/WENZHOU_V111_HIRES_ASSET_BUILD.json
          if git diff --cached --quiet; then
            echo 'No high-resolution changes.'
            exit 0
          fi
          git commit -m 'Build Wenzhou v1.1.1 lossless high-resolution 3D candidate [skip v111 hires]'
          git push origin HEAD:project/wenzhou-v110-3d-satellite-osm-water

      - name: Preserve high-resolution build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wenzhou-v111-hires-build
          path: |
            projects/wenzhou/reports/WENZHOU_V111_HIRES_ASSET_BUILD.json
            web/wenzhou-v111/assets/hires/manifest.json
            /tmp/wenzhou-v111-hires-build.log
          if-no-files-found: warn
          compression-level: 0
          retention-days: 90
