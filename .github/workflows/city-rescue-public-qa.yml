name: City rescue independent public entry verification
on:
  push:
    branches: ['gh-pages']
    paths:
      - 'kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01/walled-city-rescue-r01/**'
      - '.github/workflows/city-rescue-public-qa.yml'
permissions:
  contents: read
jobs:
  public-entry:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01/walled-city-rescue-r01
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.3
      - name: Install existing official browser runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/city-browser" --registry=https://registry.npmjs.org --no-save --ignore-scripts --no-audit --no-fund playwright@1.57.0
          "$RUNNER_TEMP/city-browser/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/city-browser/node_modules" >> "$GITHUB_ENV"
      - name: Verify actual published source, original actors, buttons and mobile
        timeout-minutes: 14
        run: node kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01/walled-city-rescue-r01/rescue-qa/run-public.cjs
      - name: Retain public evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: city-public-${{ github.sha }}
          path: city-rescue-public-results/
          retention-days: 7
          compression-level: 0
