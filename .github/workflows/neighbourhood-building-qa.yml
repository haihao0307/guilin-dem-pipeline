name: Complete walled building original-material GPU
on:
  push:
    branches: ['qa/walled-neighbours-20261011']
    paths:
      - 'kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01/walled-city-neighbourhood-r01/**'
      - '.github/workflows/neighbourhood-building-qa.yml'
permissions:
  contents: read
jobs:
  whole-building:
    if: ${{ contains(github.event.head_commit.message, '[building-probe]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    env:
      NEIGHBOUR_TIMEOUT_MS: '600000'
      NEIGHBOUR_OUT: building-qa-results
      NEIGHBOUR_STRIPE_ONLY: ${{ contains(github.event.head_commit.message, '[stripe-only]') && '1' || '0' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01
            kaopu-minigame-workbench/voxel-train-study/vendor
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.3
      - name: Lock original material and geometry contract
        run: node --test kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01/walled-city-neighbourhood-r01/building-plan.test.mjs kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01/walled-city-neighbourhood-r01/rescue-contract.test.mjs kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01/walled-city-neighbourhood-r01/surface-plan.test.mjs kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01/walled-city-neighbourhood-r01/coated-brick-visibility.test.mjs kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01/walled-city-neighbourhood-r01/plaster-native/plaster-native.test.mjs kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01/walled-city-neighbourhood-r01/plaster-native/metric-field-domain.test.mjs kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01/walled-city-neighbourhood-r01/qa/plaster-stripe-diagnostics.test.mjs kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01/walled-city-neighbourhood-r01/weather-cache/cache.test.mjs kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01/walled-city-neighbourhood-r01/brick-native/brick-native.test.mjs
      - name: Install official pinned browser test runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/room-browser" --registry=https://registry.npmjs.org --no-save --ignore-scripts --no-audit --no-fund playwright@1.57.0
          "$RUNNER_TEMP/room-browser/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/room-browser/node_modules" >> "$GITHUB_ENV"
      - name: Full ten-storey original-material completed GPU frames
        timeout-minutes: 11
        run: node kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01/walled-city-neighbourhood-r01/qa/building-scene.cjs
      - name: Preserve successful and failed evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: neighbourhood-building-${{ github.sha }}
          path: building-qa-results/
          compression-level: 0
          retention-days: 7
