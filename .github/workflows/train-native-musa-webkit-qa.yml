name: Train native Musa isolated WebKit source collection
# Separate read-only source qualification. No Pages publication or game rewrite.
# Linux Playwright WebKit does not establish physical iPhone/Safari acceptance.
on:
  push:
    branches: ['qa/train-native-musa-webkit-20261011']
    paths:
      - 'tests/train-native-musa-webkit-qualification.cjs'
      - '.github/workflows/train-native-musa-webkit-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: train-native-musa-webkit-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source-collection:
    if: github.ref == 'refs/heads/qa/train-native-musa-webkit-20261011'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CANDIDATE: kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r03
      MUSA_WEBKIT_OUT: train-plants-r03-results/webkit-qualification
      PLANTS_QA_ORIGIN: http://127.0.0.1:8765/
    steps:
      - name: Read this exact isolated QA commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            tests
            kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r03/plants
      - name: Use the actual reference Node22 runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
      - name: Prepare evidence and statically validate the new harness
        run: |
          mkdir -p "$MUSA_WEBKIT_OUT"
          printf 'Node: ' > "$MUSA_WEBKIT_OUT/runtime.txt"
          node --version >> "$MUSA_WEBKIT_OUT/runtime.txt"
          printf 'Commit: %s\n' "$GITHUB_SHA" >> "$MUSA_WEBKIT_OUT/runtime.txt"
          node --check tests/train-native-musa-webkit-qualification.cjs
      - name: Install official pinned Playwright and only WebKit
        run: |
          npm install --prefix "$RUNNER_TEMP/musa-webkit" --registry=https://registry.npmjs.org --no-save --ignore-scripts --no-audit --no-fund playwright@1.57.0
          "$RUNNER_TEMP/musa-webkit/node_modules/.bin/playwright" install --with-deps webkit
          echo "NODE_PATH=$RUNNER_TEMP/musa-webkit/node_modules" >> "$GITHUB_ENV"
      - name: Serve exact checked-out rule bytes on CI localhost only
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > "$MUSA_WEBKIT_OUT/http-server.log" 2>&1 &
          for n in $(seq 1 30); do
            if curl --fail --silent "http://127.0.0.1:8765/$CANDIDATE/plants/native-codec/objects/establishing-musa.KaoPu" >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Collect actual Node22 and WebKit raw native outputs without admission
        timeout-minutes: 8
        run: node tests/train-native-musa-webkit-qualification.cjs
      - name: Preserve actual measurements and raw evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: train-native-musa-webkit-${{ github.sha }}
          path: train-plants-r03-results/webkit-qualification/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
