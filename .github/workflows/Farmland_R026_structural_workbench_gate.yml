name: Farmland R026 structural truth workbench gate

on:
  push:
    branches:
      - restart/farmland-object-dna-v020-20260907
    paths:
      - '.github/workflows/Farmland_R026_structural_workbench_gate.yml'
      - 'farmland-object-dna/Farmland_Mother_R026_Structural_Truth_Workbench_2026-09-11/index.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  public-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      VERSION_MARKER: FARMLAND_MOTHER_R026_STRUCTURAL_TRUTH_WB_20260911
      PAGE_PATH: farmland-object-dna/Farmland_Mother_R026_Structural_Truth_Workbench_2026-09-11/index.html
      DIAG_PATH: farmland-object-dna/diagnostics/Farmland_R026_Browser_Gate_Diagnostic.txt
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Build fixed-commit public URL
        shell: bash
        run: |
          set -euo pipefail
          echo "PUBLIC_URL=https://rawcdn.githack.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/${PAGE_PATH}" >> "$GITHUB_ENV"

      - name: HTTP readback and dependency check
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 50); do
            if curl --fail --location --silent --show-error --output /tmp/farmland-r026.html "$PUBLIC_URL"; then
              if grep -q "$VERSION_MARKER" /tmp/farmland-r026.html; then break; fi
            fi
            if [ "$attempt" = 50 ]; then echo 'Fixed-commit public workbench did not become readable with expected marker.'; exit 1; fi
            sleep 5
          done
          test -s /tmp/farmland-r026.html
          grep -q 'three@0.179.1' /tmp/farmland-r026.html
          grep -q 'SYNTHETIC QA' /tmp/farmland-r026.html
          grep -q 'data-runtime-ready="false"' /tmp/farmland-r026.html
          curl --fail --location --silent --show-error --output /tmp/three.module.js 'https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js'
          curl --fail --location --silent --show-error --output /tmp/orbit-controls.js 'https://cdn.jsdelivr.net/npm/three@0.179.1/examples/jsm/controls/OrbitControls.js'
          test -s /tmp/three.module.js
          test -s /tmp/orbit-controls.js
          grep -q 'REVISION' /tmp/three.module.js

      - name: Install browser driver library
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet selenium
          google-chrome --version
          (chromedriver --version || true)

      - name: Desktop and mobile browser interaction gate
        id: browser
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$(dirname "$DIAG_PATH")"
          cat > /tmp/farmland_r026_browser_gate.py <<'PY'
          import os, json, time, traceback
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC
          from selenium.webdriver.common.action_chains import ActionChains
          from selenium.webdriver.common.keys import Keys

          url=os.environ['PUBLIC_URL']
          marker=os.environ['VERSION_MARKER']
          diag=os.environ['DIAG_PATH']
          results=[]

          def log(msg):
              results.append(str(msg))

          def make_driver(w,h):
              options=webdriver.ChromeOptions()
              for arg in ['--headless=new','--no-sandbox','--disable-dev-shm-usage','--enable-webgl','--ignore-gpu-blocklist','--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader','--ignore-certificate-errors']:
                  options.add_argument(arg)
              options.set_capability('goog:loggingPrefs', {'browser':'ALL'})
              d=webdriver.Chrome(options=options)
              d.set_window_size(w,h)
              return d

          def open_through_notice(d):
              d.get(url)
              WebDriverWait(d,20).until(lambda x: x.execute_script('return document.readyState') in ('interactive','complete'))
              if 'External Content Notice' in d.title:
                  log('githack_notice=seen')
                  btn=WebDriverWait(d,12).until(EC.element_to_be_clickable((By.CSS_SELECTOR,'button.url-action-button')))
                  if btn.text.strip()!='Open the page':
                      raise AssertionError(f'unexpected notice button: {btn.text!r}')
                  btn.click()
              WebDriverWait(d,25).until(lambda x: x.execute_script("return document.body && document.body.dataset.runtimeReady === 'true'"))

          def check_view(label,w,h):
              d=make_driver(w,h)
              try:
                  log(f'=== {label} {w}x{h} ===')
                  open_through_notice(d)
                  assert marker in d.page_source, 'version marker missing'
                  assert len(d.find_elements(By.TAG_NAME,'canvas'))>=1, 'canvas missing'
                  assert d.execute_script("return document.body.dataset.version") == marker, 'runtime version mismatch'
                  # Camera interaction
                  terrace=d.find_element(By.CSS_SELECTOR,'button[data-cam="terrace"]')
                  terrace.click(); time.sleep(.25)
                  assert 'active' in terrace.get_attribute('class').split(), 'terrace camera did not activate'
                  human=d.find_element(By.CSS_SELECTOR,'button[data-cam="human"]')
                  human.click(); time.sleep(.25)
                  assert 'active' in human.get_attribute('class').split(), 'human camera did not activate'
                  # Toggle interaction
                  flow=d.find_element(By.ID,'flowToggle')
                  before=flow.is_selected(); flow.click(); time.sleep(.15)
                  assert flow.is_selected()!=before, 'flow toggle did not change'
                  flow.click()
                  # Rice lifecycle interaction: move to stage 13 Stubble
                  slider=d.find_element(By.ID,'stageSlider')
                  d.execute_script("arguments[0].value='13'; arguments[0].dispatchEvent(new Event('input',{bubbles:true}));",slider)
                  time.sleep(.25)
                  stage=d.find_element(By.ID,'stageName').text
                  assert ('残茬' in stage) or ('Stubble' in stage), f'stage interaction failed: {stage}'
                  # Viewport containment checks for user-facing controls
                  metrics=d.execute_script("""
                    const c=document.getElementById('controls').getBoundingClientRect();
                    const t=document.getElementById('title').getBoundingClientRect();
                    return {iw:innerWidth,ih:innerHeight,controls:{left:c.left,right:c.right,top:c.top,bottom:c.bottom,width:c.width,height:c.height},title:{left:t.left,right:t.right,top:t.top,bottom:t.bottom,width:t.width,height:t.height}};
                  """)
                  assert metrics['controls']['left']>=-1 and metrics['controls']['right']<=metrics['iw']+1, f'controls horizontal overflow {metrics}'
                  assert metrics['title']['left']>=-1 and metrics['title']['right']<=metrics['iw']+1, f'title horizontal overflow {metrics}'
                  if label=='mobile':
                      assert metrics['controls']['bottom']<=metrics['ih']+1, f'mobile controls bottom overflow {metrics}'
                      assert metrics['title']['bottom']<metrics['controls']['top'], f'mobile title/controls overlap {metrics}'
                  severe=[e for e in d.get_log('browser') if e.get('level')=='SEVERE']
                  severe=[e for e in severe if 'favicon' not in e.get('message','').lower()]
                  if severe:
                      raise AssertionError('SEVERE browser logs: '+json.dumps(severe,ensure_ascii=False))
                  log('runtime_ready=true')
                  log('canvas=pass')
                  log('camera_interaction=pass')
                  log('flow_toggle=pass')
                  log('rice_stage_13=pass')
                  log('viewport_containment=pass')
                  log('browser_severe_logs=0')
              finally:
                  d.quit()

          ok=True
          try:
              check_view('desktop',1440,960)
              check_view('mobile',390,844)
          except Exception:
              ok=False
              log('ERROR:\n'+traceback.format_exc())
          with open(diag,'w',encoding='utf-8') as f:
              f.write('commit='+os.environ['GITHUB_SHA']+'\n')
              f.write('url='+url+'\n')
              f.write('\n'.join(results)+'\n')
          raise SystemExit(0 if ok else 1)
          PY
          python /tmp/farmland_r026_browser_gate.py

      - name: Persist browser diagnostic on failure
        if: steps.browser.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$DIAG_PATH"
          git commit -m 'Farmland R026: capture browser gate diagnostic'
          git push origin HEAD:restart/farmland-object-dna-v020-20260907

      - name: Enforce browser result
        if: steps.browser.outcome == 'failure'
        shell: bash
        run: exit 1

      - name: Summary
        if: steps.browser.outcome == 'success'
        shell: bash
        run: |
          cat "$DIAG_PATH" >> "$GITHUB_STEP_SUMMARY"
          {
            echo
            echo 'HTTP readback: PASS'
            echo 'Version marker: PASS'
            echo 'Three.js dependency: PASS'
            echo 'Githack first-visit notice: PASS'
            echo 'Desktop runtime + interactions: PASS'
            echo '390x844 runtime + interactions: PASS'
            echo 'Status: internal structural diagnostic only; visualAcceptance=false; productionReady=false.'
          } >> "$GITHUB_STEP_SUMMARY"
