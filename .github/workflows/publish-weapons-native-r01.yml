name: Publish Aircraft native R01 isolated page
on:
  push:
    branches: [gh-pages]
    paths: [.github/workflows/publish-weapons-native-r01.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: weapons-native-r01-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SOURCE: ff2edb8ed49e37c497bc6123ce7843bf47a3d0d0
      REVIEW_RUN: '34001682325'
    steps:
      - name: Require successful source browser review
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 24); do
            curl -fLsS "https://api.github.com/repos/haihao0307/AIRCRAFT/actions/runs/$REVIEW_RUN" > /tmp/source-run.json
            status=$(python3 -c "import json;d=json.load(open('/tmp/source-run.json'));print(d['status'])")
            conclusion=$(python3 -c "import json;d=json.load(open('/tmp/source-run.json'));print(d.get('conclusion'))")
            if [ "$status" = completed ]; then
              test "$conclusion" = success
              break
            fi
            sleep 10
          done
          python3 -c "import json,os;d=json.load(open('/tmp/source-run.json'));assert d['head_sha']==os.environ['SOURCE'] and d['conclusion']=='success'"
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          sparse-checkout: |
            aircraft/weapons-native-r01
            .github/workflows
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build exact reviewed source without reference assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/wm-r01/vendor /tmp/wm-r01/source aircraft/weapons-native-r01
          base=https://raw.githubusercontent.com/haihao0307/AIRCRAFT/$SOURCE/native/weapons-visual/web/r01
          for f in build.py model.js surface.js app.js index.template.html; do
            curl -fLsS --retry 2 "$base/$f" -o /tmp/wm-r01/source/$f
          done
          renderer=https://raw.githubusercontent.com/mrdoob/three.js/r170
          curl -fLsS --retry 2 "$renderer/build/three.module.js" -o /tmp/wm-r01/vendor/three.module.js
          curl -fLsS --retry 2 "$renderer/examples/jsm/controls/OrbitControls.js" -o /tmp/wm-r01/vendor/OrbitControls.js
          curl -fLsS --retry 2 "$renderer/LICENSE" -o /tmp/wm-r01/vendor/THREE_LICENSE.txt
          python /tmp/wm-r01/source/build.py --vendor /tmp/wm-r01/vendor --output aircraft/weapons-native-r01/index.html
          printf '%s\n' "$SOURCE" > aircraft/weapons-native-r01/SOURCE_COMMIT.txt
      - name: Commit only the isolated Aircraft page
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add aircraft/weapons-native-r01/index.html aircraft/weapons-native-r01/index.receipt.json aircraft/weapons-native-r01/SOURCE_COMMIT.txt
          git diff --cached --name-only | tee /tmp/wm-files.txt
          python -c "from pathlib import Path;assert all(x.startswith('aircraft/weapons-native-r01/') for x in Path('/tmp/wm-files.txt').read_text().splitlines())"
          git diff --cached --quiet || git commit -m "publish(aircraft): add reviewed native R01 workbench from $SOURCE"
          for i in 1 2 3; do
            git pull --rebase origin gh-pages
            git push origin HEAD:gh-pages && break
            test "$i" != 3
          done
      - uses: actions/upload-artifact@v4
        with:
          name: WM_NATIVE_R01_PUBLISHED_${{ env.SOURCE }}
          path: aircraft/weapons-native-r01/
          retention-days: 30
