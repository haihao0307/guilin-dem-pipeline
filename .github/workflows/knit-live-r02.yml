name: Knit three-route live R02
on:
  push:
    branches: [feature/knit-three-live-r02-20261110]
    paths:
      - kaopu-fabric-workbench/knit-three-live-r02/**
      - .github/workflows/knit-live-r02.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: knit-three-live-r02
  cancel-in-progress: false
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            kaopu-fabric-workbench/knit-three-live-r02
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build and static checks
        run: |
          python kaopu-fabric-workbench/knit-three-live-r02/build.py
          node --check kaopu-fabric-workbench/knit-three-live-r02/engine.js
          node --check kaopu-fabric-workbench/knit-three-live-r02/ui.js
          node --check kaopu-fabric-workbench/knit-three-live-r02/scheduler.js
      - name: Install browser test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers xvfb xauth
          mkdir -p /tmp/knit-qa
          cd /tmp/knit-qa
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium
      - name: Real WebGPU browser test
        id: browser
        run: |
          SITE="$GITHUB_WORKSPACE/kaopu-fabric-workbench/knit-three-live-r02"
          python -m http.server 8925 --bind 127.0.0.1 > /tmp/knit-server.log 2>&1 &
          if test -f "$SITE/PUBLIC_URL.txt"; then
            export QA_URL="$(cat "$SITE/PUBLIC_URL.txt")"
            cp "$SITE/qa-public.mjs" /tmp/knit-qa/qa.mjs
          else
            cp "$SITE/qa.mjs" /tmp/knit-qa/qa.mjs
          fi
          SITE_DIR="$SITE" QA_OUT="$SITE/evidence" xvfb-run -a node /tmp/knit-qa/qa.mjs
      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: knit-live-r02-browser
          path: |
            kaopu-fabric-workbench/knit-three-live-r02/evidence
            kaopu-fabric-workbench/knit-three-live-r02/index.html
            kaopu-fabric-workbench/knit-three-live-r02/BUILD.json
          retention-days: 7
      - name: Save build and truthful test result on isolated branch
        if: always()
        run: |
          git config user.name 'Knit workbench verification'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A kaopu-fabric-workbench/knit-three-live-r02
          for file in BROWSER_QA.json PUBLIC_QA.json; do
            if test -f "kaopu-fabric-workbench/knit-three-live-r02/evidence/$file"; then
              git add -f "kaopu-fabric-workbench/knit-three-live-r02/evidence/$file"
            fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'Record standalone build and actual browser QA result [skip ci]'
            git push origin HEAD:feature/knit-three-live-r02-20261110
          fi
