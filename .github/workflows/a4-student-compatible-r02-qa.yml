name: A4 full student WebGL compatibility QA
on:
  push:
    branches: ['qa/a4-student-compatible-r02-20261022']
    paths:
      - 'kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01/a4-mark3-rule-conversion-r01/a4-student-compatible-r02/**'
      - '.github/workflows/a4-student-compatible-r02-qa.yml'
permissions:
  contents: read
concurrency:
  group: a4-student-compatible-${{ github.ref }}
  cancel-in-progress: false
jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01/a4-mark3-rule-conversion-r01/a4-student-compatible-r02
      - name: Install pinned browser runner
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Context creation branch tests
        run: node --test kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01/a4-mark3-rule-conversion-r01/a4-student-compatible-r02/webgl-compat.test.mjs
      - name: Complete student rendering animation and forced failure
        run: python kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01/a4-mark3-rule-conversion-r01/a4-student-compatible-r02/browser-qa.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: a4-student-compatible-r02-${{ github.sha }}
          path: kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01/a4-mark3-rule-conversion-r01/a4-student-compatible-r02/evidence
          if-no-files-found: warn
          retention-days: 1
