name: Brow Lash R03 actual field diagnosis
on:
  push:
    branches: [diagnostics/brow-lash-r03-field-20261014]
    paths: ['.github/workflows/brow-lash-r03-field.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_PATH: /tmp/field-tools/node_modules
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Actual native mesh and corrective gradient
        run: |
          npm install --prefix /tmp/field-tools playwright@1.57.0
          /tmp/field-tools/node_modules/.bin/playwright install --with-deps chromium
          mkdir field
          node - <<'NODE'
          const fs=require('fs'),{chromium}=require('playwright');
          (async()=>{
          const browser=await chromium.launch({headless:true,args:['--no-sandbox','--use-angle=swiftshader','--enable-unsafe-swiftshader']});const p=await browser.newPage({viewport:{width:1180,height:850}});p.setDefaultTimeout(180000);
          await p.goto('https://htmlpreview.github.io/?https://raw.githubusercontent.com/haihao0307/guilin-dem-pipeline/3510bb7ca7d7463866accce54d34f1952ebc2665/kaopu-unified-human-workbench/brow-lash-r03/preview.html',{waitUntil:'domcontentloaded'});await p.waitForFunction(()=>window.browLash?.ready);await p.evaluate(()=>browLash.prepareBlink());
          const report=await p.evaluate(()=>{
           const groom=browLash.groom(),b=groom.focusBlink,g=b.geometry,P=g.attributes.position.array,T=g.morphAttributes.position.map(a=>a.array),f=groom.frame,I=g.index.array;
           const point=i=>[P[i*3],P[i*3+1],P[i*3+2]],delta=i=>[0,1,2].map(k=>T[2][i*3+k]+T[3][i*3+k]);
           const list=[],seen=new Set();let max=0;
           for(let k=0;k<I.length;k+=3)for(let j=0;j<3;j++){
            let a=I[k+j],c=I[k+(j+1)%3];if(a>c)[a,c]=[c,a];const key=a+':'+c;if(seen.has(key))continue;seen.add(key);
            const da=delta(a),dc=delta(c);if(!da.some(v=>v!==0)&&!dc.some(v=>v!==0))continue;
            const qa=point(a),qc=point(c),len=Math.hypot(...qa.map((v,i)=>v-qc[i])),change=Math.hypot(...da.map((v,i)=>v-dc[i])),ratio=change/Math.max(len,1e-7);max=Math.max(max,ratio);
            if(ratio>.3)list.push({a,c,ratio,lengthMM:len*1000,deltaChangeMM:change*1000,restA:f.project(qa),restB:f.project(qc),deltaA:da,deltaB:dc,selectedA:b.correctionDomains.map(d=>d.indices.includes(a)),selectedB:b.correctionDomains.map(d=>d.indices.includes(c))});
           }
           list.sort((a,b)=>b.ratio-a.ratio);return{report:b.report(),badEdgeCount:list.length,maxEdgeChangeRatio:max,edges:list.slice(0,60),profiles:b.correctionDomains.map(d=>({side:d.side,eye:d.eye}))};
          });fs.writeFileSync('field/diagnosis.json',JSON.stringify(report,null,2));console.log(JSON.stringify({max:report.maxEdgeChangeRatio,count:report.badEdgeCount,edges:report.edges.slice(0,5)},null,2));
          await browser.close();
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brow-lash-r03-field-diagnosis
          path: field/
          retention-days: 14
