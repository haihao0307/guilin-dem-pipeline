name: Brow Lash R03 final angle inspection
on:
  push:
    branches: [diagnostics/brow-lash-r03-field-20261014]
    paths: ['.github/workflows/brow-lash-r03-field.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NODE_PATH: /tmp/field-tools/node_modules
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Actual final public closed-eye angles
        run: |
          npm install --prefix /tmp/field-tools playwright@1.57.0
          /tmp/field-tools/node_modules/.bin/playwright install --with-deps chromium
          mkdir field
          node - <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),{chromium}=require('playwright');
          (async()=>{
          const browser=await chromium.launch({headless:true,args:['--no-sandbox','--use-angle=swiftshader','--enable-unsafe-swiftshader']}),p=await browser.newPage({viewport:{width:1180,height:850}});p.setDefaultTimeout(180000);
          const url='https://htmlpreview.github.io/?https://raw.githubusercontent.com/haihao0307/guilin-dem-pipeline/8679677af3aad45ba71ad10e54705bdd35b647a8/kaopu-unified-human-workbench/brow-lash-r03/preview.html';const report={url,completed:false,pageErrors:[],consoleErrors:[],screens:[]};p.on('pageerror',e=>report.pageErrors.push(String(e)));p.on('console',m=>{if(m.type()==='error')report.consoleErrors.push(m.text())});
          try{
          await p.goto(url,{waitUntil:'domcontentloaded'});await p.waitForFunction(()=>window.browLash?.ready);await p.evaluate(()=>browLash.prepareBlink());
          for(const closure of[1,.5,0])for(const view of['oblique','side']){
           await p.evaluate(({closure,view})=>{browLash.closure(closure);browLash.view(view)},{closure,view});
           const session=await p.context().newCDPSession(p),data=await session.send('Page.captureScreenshot',{format:'png',captureBeyondViewport:false});await session.detach();const file='closed-'+Math.round(closure*100)+'-'+view+'.png',buffer=Buffer.from(data.data,'base64');fs.writeFileSync('field/'+file,buffer);report.screens.push({name:file,sha256:crypto.createHash('sha256').update(buffer).digest('hex')});
          }
          report.groom=await p.evaluate(()=>browLash.report());report.corrective=await p.evaluate(()=>browLash.groom().focusBlink.report());if(report.pageErrors.length||report.consoleErrors.length)throw Error('Application errors during actual angle inspection');report.completed=true;
          }finally{fs.writeFileSync('field/angles.json',JSON.stringify(report,null,2));await browser.close();}
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brow-lash-r03-final-angles
          path: field/
          retention-days: 14
