name: Apply Guilin hydrology semantics v6

on:
  push:
    branches: [main]
    paths:
      - pipeline/distill_online_runtime_v6.py
      - tools/apply_guilin_hydrology_semantics_v6.py
      - .github/workflows/apply-guilin-hydrology-semantics-v6.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-guilin-hydrology-semantics-v6
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply connected-route migration
        run: |
          set -euo pipefail
          python tools/apply_guilin_hydrology_semantics_v6.py
          python -m py_compile pipeline/distill_online_runtime.py pipeline/distill_online_runtime_v6.py
          node --check viewer/app.js
          grep -q 'knowledge-indexed-connected-routes-v6' .github/workflows/guilin-online-full-map.yml
          grep -q 'li_gui_mainstem_must_continue_south_of_yangshuo' contracts/GUILIN_DISTILLED_RUNTIME_CONTRACT_V1.json
          test -f knowledge/GUILIN_HYDROLOGY_SEMANTICS_V6.json
      - name: Remove one-time migration files and commit production changes
        run: |
          set -euo pipefail
          rm -f tools/apply_guilin_hydrology_semantics_v6.py
          rm -f .github/workflows/apply-guilin-hydrology-semantics-v6.yml
          git config user.name 'Haihao_Nature Grace HK'
          git config user.email 'haihao0307@gmail.com'
          git add -A
          git commit -m 'fix(guilin): correct Li Gui direction and preserve connected tributary routes'
          git push origin HEAD:main
