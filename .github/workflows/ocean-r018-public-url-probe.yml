name: Ocean R018 public URL probe

"on":
  push:
    branches:
      - feature/ocean-mother-r018
    paths:
      - .github/workflows/ocean-r018-public-url-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Wait for the public directory and verify every runtime dependency
        shell: bash
        run: |
          set -euo pipefail
          base="https://haihao0307.github.io/guilin-dem-pipeline/ocean-mother/island-r018"
          code="000"
          for i in $(seq 1 90); do
            code=$(curl -L -sS -o /tmp/index.html -w '%{http_code}' "$base/index.html?cb=${GITHUB_RUN_ID}-${i}" || true)
            if [ "$code" = "200" ] && grep -qi 'Ocean' /tmp/index.html && grep -q 'app.mjs' /tmp/index.html; then
              echo "index ready on attempt $i"
              break
            fi
            echo "attempt $i returned $code"
            sleep 5
          done
          test "$code" = "200"
          grep -qi 'Ocean' /tmp/index.html
          grep -q 'app.mjs' /tmp/index.html

          directory_code=$(curl -L -sS -o /tmp/directory.html -w '%{http_code}' "$base/?cb=${GITHUB_RUN_ID}")
          echo "directory URL $directory_code $(wc -c < /tmp/directory.html) bytes"
          test "$directory_code" = "200"
          grep -qi 'Ocean' /tmp/directory.html
          grep -q 'app.mjs' /tmp/directory.html

          for path in coast.css app.mjs params.mjs shaders.mjs geometry.mjs core.mjs BUILD.json PARAMETER_CATALOG.json; do
            output="/tmp/${path//\//_}"
            asset_code=$(curl -L -sS -o "$output" -w '%{http_code}' "$base/$path?cb=${GITHUB_RUN_ID}")
            echo "$path $asset_code $(wc -c < "$output") bytes"
            test "$asset_code" = "200"
            test -s "$output"
          done

          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          expected = {
              'index.html': '2a2d5637149e953b32f8c8421018fb5c7e34f58a70aa6b008828b4f100cba49a',
              'coast.css': '43dbd2eb08f6c0e4be6d3adb173c79e402f69caa8ac132ed54be9ed3f8e3f8b7',
              'app.mjs': '96f803c18b4ae71ff5199ac442cc17f4486777f883fdd88d18e063d0a731053e',
              'params.mjs': '80b5006b2ce28b2625197af2bd6d997d65b99132a52aaad2c3bff9e3b65df5be',
              'shaders.mjs': '4ba89644c6691266d9725693f3bd60c5cb1358d489a35d953d753e89bd042898',
              'geometry.mjs': 'b19bb34ea2057b60e19c374d33f947e443e8607c986e0bc3d18557ba940b757a',
              'core.mjs': '2f2c3ca429db66903d6cd2ad560e4f487b8a7ab3c0429f891ebd16284a090fa3',
              'BUILD.json': 'f0f83bb5d70687ab0c2a2216758104394a4cc166804aee820a1cbae888800389',
              'PARAMETER_CATALOG.json': '70950be59fc5a681b89f54e15a983bb29739224ffe37fe9a5e968b75bf1a6eba',
          }
          for name, digest in expected.items():
              data = Path('/tmp', name).read_bytes()
              actual = hashlib.sha256(data).hexdigest()
              assert actual == digest, (name, actual, digest)

          build=json.loads(Path('/tmp/BUILD.json').read_text(encoding='utf-8'))
          assert build['version']=='0.3.0-island-r018', build
          assert build['buildId']=='island-r018-relationship-convergence', build
          assert build['runtimeImageAssets']==0, build
          assert build['externalModels']==0, build
          catalog=json.loads(Path('/tmp/PARAMETER_CATALOG.json').read_text(encoding='utf-8'))
          assert catalog['count']==102, catalog
          print({'publicDirectory': 'HTTP 200', 'version': build['version'], 'buildId': build['buildId'], 'parameterCount': catalog['count'], 'byteIdentity': 'verified'})
          PY
