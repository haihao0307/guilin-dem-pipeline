name: farmland-r045-round67-probe
on:
  push:
    branches: [restart/farmland-object-dna-v020-20260907]
    paths:
      - 'farmland-object-dna/research/r045-autonomous-rebuild/round-67/r045_round67_kernel.mjs'
      - 'farmland-object-dna/research/r045-autonomous-rebuild/round-67/r045_round67_probe.mjs'
      - '.github/workflows/farmland-r045-round67-probe.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run frozen contour-run diagnostic
        run: node farmland-object-dna/research/r045-autonomous-rebuild/round-67/r045_round67_probe.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: farmland-r045-round67-probe
          path: farmland-object-dna/research/r045-autonomous-rebuild/round-67/r045_round67_probe_result.json
      - name: Persist diagnostic
        run: |
          git config user.name 'github-actions[bot]'; git config user.email '41898242+github-actions[bot]@users.noreply.github.com'
          git add farmland-object-dna/research/r045-autonomous-rebuild/round-67/r045_round67_probe_result.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'farmland R045.67 persist contour-run probe [skip ci]'
          git pull --rebase origin ${GITHUB_REF_NAME}
          git push origin HEAD:${GITHUB_REF_NAME}
