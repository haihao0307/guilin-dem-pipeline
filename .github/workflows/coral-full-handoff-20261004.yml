name: Coral Mother Frozen Handoff 20261004
on:
  push:
    branches: [handoff/coral-mother-full-20261004]
    paths: [.github/workflows/coral-full-handoff-20261004.yml]
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: coral-mother-handoff-20261004
  cancel-in-progress: true
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - name: Stop only the superseded archive attempt
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          from urllib.request import Request,urlopen
          from urllib.error import HTTPError
          import os,json
          root='https://api.github.com/repos/haihao0307/guilin-dem-pipeline/actions/runs/37187715373'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}
          with urlopen(Request(root,headers=headers),timeout=20) as r: job=json.load(r)
          assert job['head_branch']=='handoff/coral-mother-full-20261004'
          if job['status']!='completed':
              try:
                  with urlopen(Request(root+'/cancel',data=b'',method='POST',headers=headers),timeout=20) as r:print('Superseded archive stopped',r.status)
              except HTTPError as e:
                  if e.code not in [409,422]:raise
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            CORAL_HANDOFF_20261004
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch frozen source object
        run: git fetch --depth=1 --filter=blob:none origin 71204339af530ff3da9d8f717bf0434e799b55b2
      - name: Validate cumulative log and prepare selected-source export
        run: python CORAL_HANDOFF_20261004/prepare_package.py
      - name: Archive verify and publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python CORAL_HANDOFF_20261004/package-execute.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coral-mother-frozen-handoff-20261004
          path: /tmp/coral-release/
          retention-days: 90
          if-no-files-found: warn
