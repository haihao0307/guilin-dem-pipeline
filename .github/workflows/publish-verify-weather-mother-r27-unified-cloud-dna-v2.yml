name: Publish and verify Weather Mother R27 unified cloud DNA v2

on:
  push:
    branches:
      - feature/weather-mother-r27-unified-cloud-dna-20260912
    paths:
      - .github/workflows/publish-verify-weather-mother-r27-unified-cloud-dna-v2.yml

permissions:
  contents: write

jobs:
  publish-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OUT_DIR: weather-mother/full-weather-r27-unified-cloud-dna-20260912
      EXPECTED_SHA256: a238fca33599b85361704e8e4aa2233ba5aaeb5d988ea048aa0ab018547bb188
      EXPECTED_BYTES: '37702'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble exact single-file R27
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR"
          gzip -dc weather-mother/r27-assembly-v2/index.html.gz > "$OUT_DIR/index.html"
          test "$(wc -c < "$OUT_DIR/index.html" | tr -d ' ')" = "$EXPECTED_BYTES"
          test "$(sha256sum "$OUT_DIR/index.html" | awk '{print $1}')" = "$EXPECTED_SHA256"
          grep -Fq 'Weather Mother · Cloud DNA Flight R27' "$OUT_DIR/index.html"
          grep -Fq 'sameCloudForObserveAndFlight:true' "$OUT_DIR/index.html"
          grep -Fq 'Cloud Seed' "$OUT_DIR/index.html"
          grep -Fq 'Detail Seed' "$OUT_DIR/index.html"
          grep -Fq 'physicalRainClaim:false' "$OUT_DIR/index.html"

      - name: Freeze immutable page commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Weather Mother CI'
          git config user.email 'weather-mother-ci@users.noreply.github.com'
          git add "$OUT_DIR/index.html"
          git rm -r weather-mother/r27-parts weather-mother/r27-assembly-v2
          git commit -m 'publish(weather-mother): R27 unified Cloud Object DNA [skip ci]'
          git push origin HEAD:feature/weather-mother-r27-unified-cloud-dna-20260912
          git rev-parse HEAD > /tmp/page_commit.txt

      - name: Verify fixed raw.githack bytes
        shell: bash
        run: |
          set -euo pipefail
          PAGE_COMMIT=$(cat /tmp/page_commit.txt)
          PUBLIC_URL="https://raw.githack.com/haihao0307/guilin-dem-pipeline/${PAGE_COMMIT}/${OUT_DIR}/index.html"
          echo "PAGE_COMMIT=$PAGE_COMMIT" >> "$GITHUB_ENV"
          echo "PUBLIC_URL=$PUBLIC_URL" >> "$GITHUB_ENV"
          status=''
          for attempt in $(seq 1 15); do
            status=$(curl -L --silent --show-error --connect-timeout 15 --max-time 60 -w '%{http_code}' -o /tmp/public-r27.html "$PUBLIC_URL" || true)
            [ "$status" = '200' ] && break
            sleep 8
          done
          test "$status" = '200'
          test "$(wc -c < /tmp/public-r27.html | tr -d ' ')" = "$EXPECTED_BYTES"
          test "$(sha256sum /tmp/public-r27.html | awk '{print $1}')" = "$EXPECTED_SHA256"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install public browser harness
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet playwright==1.55.0 pillow
          python -m playwright install --with-deps chromium

      - name: Run focused desktop and 390x844 public QA
        shell: bash
        run: |
          set -euo pipefail
          python weather-mother/r27-tools/qa_public.py

      - name: Commit public evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Weather Mother CI'
          git config user.email 'weather-mother-ci@users.noreply.github.com'
          git add "$OUT_DIR/PUBLIC_QA.json" "$OUT_DIR/PUBLIC_R27_DESKTOP_640x400.png" "$OUT_DIR/PUBLIC_R27_MOBILE_390x844.png"
          git commit -m 'qa(weather-mother): prove fixed public R27 Cloud Object DNA [skip ci]'
          git push origin HEAD:feature/weather-mother-r27-unified-cloud-dna-20260912
