name: Complete original A4 source replica QA
on:
  push:
    branches: ['qa/a4-full-source-replica-r01-20261017', 'gh-pages']
    paths:
      - '.github/workflows/a4-source-replica-qa.yml'
      - 'kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01/a4-full-source-replica-r01/**'
permissions:
  contents: read
jobs:
  original-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01/a4-full-source-replica-r01
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01/a4-full-source-replica-r01
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned registry dependencies and official Chromium
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify complete source bytes materials textures and animations
        run: npm test
      - name: Load full original scene in real WebGL and test original animation
        run: npm run test:browser
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: original-a4-replica-${{ github.sha }}
          path: kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01/a4-full-source-replica-r01/qa/
          retention-days: 14
          if-no-files-found: error
