name: R24 independent native eye-shape comparison
on:
  push:
    branches: ['qa/joey-face-r55-20261013']
    paths: ['kaopu-unified-human-workbench/joey-observation-r01/detail-r24-study/**', '.github/workflows/joey-r24-detail-qa.yml']
permissions:
  contents: read
concurrency:
  group: joey-r24-detail-${{ github.ref }}
  cancel-in-progress: false
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            kaopu-unified-human-workbench/joey-observation-r01/detail-r24-study
            kaopu-unified-human-workbench/joey-observation-r01/interactive-r23
            kaopu-unified-human-workbench/joey-observation-r01/full-material-r21/eye
            kaopu-unified-human-workbench/joey-observation-r01/full-material-r23
            kaopu-unified-human-workbench/joey-observation-r01/hair-f13-static-r17/browser
            kaopu-unified-human-workbench/joey-observation-r01/hair-f13-static-r17/generator
      - name: Use established official package versions
        timeout-minutes: 3
        run: |
          npm install --prefix "$RUNNER_TEMP/joey-r24" --no-save --ignore-scripts esbuild@0.25.5 playwright@1.57.0
          echo "NODE_PATH=$RUNNER_TEMP/joey-r24/node_modules" >> "$GITHUB_ENV"
      - name: Build independent page from fixed existing layers
        timeout-minutes: 3
        run: node kaopu-unified-human-workbench/joey-observation-r01/detail-r24-study/build.cjs
      - name: Render unchanged baseline and one native candidate, then restore
        timeout-minutes: 26
        run: |
          ROOT=kaopu-unified-human-workbench/joey-observation-r01/detail-r24-study
          mkdir -p "$ROOT/evidence"
          node "$ROOT/verify.cjs" 2>&1 | tee "$ROOT/evidence/run.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: joey-r24-detail-${{ github.sha }}
          path: |
            kaopu-unified-human-workbench/joey-observation-r01/detail-r24-study/evidence/
            kaopu-unified-human-workbench/joey-observation-r01/detail-r24-study/BUILD.json
          retention-days: 14
