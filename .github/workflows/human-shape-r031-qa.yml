name: R031 native bone and scanned identity probes
on:
  push:
    branches: [qa/human-shape-r031-20261009]
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            kaopu-unified-human-workbench
            kaopu-anny-workbench
            kaopu-mhr-workbench
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          npm install --prefix .human-qa --no-save --ignore-scripts --no-audit --no-fund playwright@1.55.0
          ./.human-qa/node_modules/.bin/playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/r031-http.log 2>&1 &
          sleep 2
      - name: Validate all original head triangles, rest, weights and poses
        run: node kaopu-unified-human-workbench/full/shape-r031/qa.mjs
      - name: Render 80 actual geometry and expression views
        env:
          NODE_PATH: ${{ github.workspace }}/.human-qa/node_modules
        run: node kaopu-unified-human-workbench/tests/shape-r031-browser.cjs
      - name: Compare all native and browser mesh hashes
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const a=JSON.parse(fs.readFileSync('shape-r031-results/numeric.json')),b=JSON.parse(fs.readFileSync('shape-r031-results/browser.json'));assert(b.passed);assert.equal(b.cases.length,4);for(const c of b.cases)assert.equal(c.geometrySHA256,a.cases.find(x=>x.id===c.id).geometrySHA256);console.log('PASS all four exact full mesh fingerprints');
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shape-r031-${{ github.sha }}
          path: shape-r031-results/
