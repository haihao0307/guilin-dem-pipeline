name: R034 reversible local display subdivision experiment
on:
  push:
    branches: [qa/human-shape-r031-20261009]
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            kaopu-unified-human-workbench
            kaopu-anny-workbench
            kaopu-mhr-workbench
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          npm install --prefix .human-qa --no-save --ignore-scripts --no-audit --no-fund playwright@1.55.0
          ./.human-qa/node_modules/.bin/playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/r031-http.log 2>&1 &
          sleep 2
      - name: One local display subdivision experiment, 24 off/on views
        env:
          NODE_PATH: ${{ github.workspace }}/.human-qa/node_modules
        run: node kaopu-unified-human-workbench/tests/shape-r034-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shape-r034-${{ github.sha }}
          path: shape-r034-results/
