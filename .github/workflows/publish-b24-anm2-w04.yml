name: B24 ANM2 W04 detail publish and public check
on:
  push:
    branches: [gh-pages]
    paths: [.github/workflows/publish-b24-anm2-w04.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: b24-anm2-w04-only
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      SOURCE: 1f4f7c0c001c43a2fd393a469f7ef9051ee8a331
      HTML_SHA: 6165cf788701d0d5cbf23e8a2d2869eb92e5c70da7684e97cbf19cb26cc77eb4
      ENTRY: https://haihao0307.github.io/guilin-dem-pipeline/aircraft/b24-anm2-w04/
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          sparse-checkout: |
            .github/workflows
            aircraft/b24-anm2-w04
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch only fixed native scripts and generic rendering library
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/w04/source /tmp/w04/vendor /tmp/w04/reports aircraft/b24-anm2-w04
          base=https://raw.githubusercontent.com/haihao0307/AIRCRAFT/$SOURCE/production/aircraft-anm2/workbench/w04
          for f in build.py reference-reader.js sideplate.js surface.js workbench.js index.template.html test_recipe.mjs public_check.py README.md LOCAL_CHECKS.json; do
            curl -fLsS --retry 2 "$base/$f" -o /tmp/w04/source/$f
          done
          renderer=https://raw.githubusercontent.com/mrdoob/three.js/r170
          curl -fLsS --retry 2 "$renderer/build/three.module.js" -o /tmp/w04/vendor/three.module.js
          curl -fLsS --retry 2 "$renderer/examples/jsm/controls/OrbitControls.js" -o /tmp/w04/vendor/OrbitControls.js
          curl -fLsS --retry 2 "$renderer/LICENSE" -o /tmp/w04/vendor/THREE_LICENSE.txt
          printf '{"type":"module"}\n' > /tmp/w04/package.json
          python /tmp/w04/source/build.py --vendor /tmp/w04/vendor --output aircraft/b24-anm2-w04/index.html > /tmp/w04/reports/build.json
          echo "$HTML_SHA  aircraft/b24-anm2-w04/index.html" | sha256sum -c -
          THREE_MODULE=/tmp/w04/vendor/three.module.js node --test /tmp/w04/source/test_recipe.mjs > /tmp/w04/reports/node-tests.txt
          printf '%s\n' "$SOURCE" > aircraft/b24-anm2-w04/SOURCE_COMMIT.txt
      - name: Install isolated headless test browser
        run: |
          python -m pip install playwright==1.55.0 Pillow==11.3.0
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Verify complete HTML by actual local-file navigation
        shell: bash
        run: |
          file_url=$(python -c "from pathlib import Path;print(Path('aircraft/b24-anm2-w04/index.html').resolve().as_uri())")
          python /tmp/w04/source/public_check.py "$file_url" --out /tmp/w04/reports/offline
      - name: Publish only this new isolated directory
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add aircraft/b24-anm2-w04/index.html aircraft/b24-anm2-w04/index.receipt.json aircraft/b24-anm2-w04/SOURCE_COMMIT.txt
          git diff --cached --name-only > /tmp/w04/files.txt
          python -c "from pathlib import Path;assert all(p.startswith('aircraft/b24-anm2-w04/') for p in Path('/tmp/w04/files.txt').read_text().splitlines())"
          git diff --cached --quiet || git commit -m "publish(aircraft): W04 detail candidate from $SOURCE"
          for i in 1 2 3; do
            git pull --rebase origin gh-pages
            git push origin HEAD:gh-pages && break
            test "$i" != 3
          done
          git rev-parse HEAD > /tmp/w04/reports/PUBLISH_COMMIT.txt
      - name: Await existing Pages deployment and check public bytes
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request, time, os, hashlib, json
          from pathlib import Path
          base=os.environ['ENTRY'];expected=os.environ['HTML_SHA'];source=os.environ['SOURCE']
          for n in range(45):
              try:
                  b=urllib.request.urlopen(base+'?w04check='+str(n),timeout=20).read()
                  marker=urllib.request.urlopen(base+'SOURCE_COMMIT.txt?w04check='+str(n),timeout=20).read().decode().strip()
                  assert hashlib.sha256(b).hexdigest()==expected and marker==source
                  Path('/tmp/w04/reports/public-bytes.json').write_text(json.dumps({'url':base,'sha256':expected,'bytes':len(b),'source':source,'httpSuccess':True},indent=2)+'\n')
                  break
              except Exception as e:
                  print(n,str(e),flush=True);time.sleep(10)
          else:raise RuntimeError('Matching public page was not served')
          PY
      - name: Test actual public URL on desktop and mobile-sized viewports
        run: python /tmp/w04/source/public_check.py "$ENTRY" --out /tmp/w04/reports/public
      - name: Archive finite execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: B24_ANM2_W04_REVIEW_${{ env.SOURCE }}
          path: |
            /tmp/w04/reports/
            /tmp/w04/source/
            /tmp/w04/vendor/
          retention-days: 30
          if-no-files-found: error
