name: Build and verify Weather Mother R26 observation bandwidth

on:
  push:
    branches:
      - feature/weather-mother-r26-observation-bandwidth-20260911
    paths:
      - weather-mother/r26-observation-bandwidth-src/**
      - .github/workflows/build-verify-weather-r26-observation-bandwidth.yml

permissions:
  contents: write

concurrency:
  group: weather-mother-r26-observation-bandwidth
  cancel-in-progress: false

jobs:
  public-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build R26 from frozen R22 plus proven mobile cloud path
        shell: bash
        run: |
          set -euo pipefail
          python3 weather-mother/r26-observation-bandwidth-src/build-r26.py
          OUT=weather-mother/full-weather-r26-observation-bandwidth-20260911/index.html
          GLSL=weather-mother/r26-observation-bandwidth-src/observation-bandwidth.glsl
          test -s "$OUT"
          grep -q 'Weather Mother · 完整天气恢复 R22' "$OUT"
          grep -q 'weather-mother-r26-observation-bandwidth' "$OUT"
          grep -q 'bandsOB' "$GLSL"
          grep -q 'prefix-preserving' weather-mother/r26-observation-bandwidth-src/build-r26.py
          grep -q 'smoothstep(14.,26.,dist)' "$GLSL"
          ! grep -q 'createFramebuffer' weather-mother/r26-observation-bandwidth-src/observation-bandwidth.glsl

      - name: Freeze page commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Weather Mother CI'
          git config user.email 'weather-mother-ci@users.noreply.github.com'
          git add weather-mother/full-weather-r26-observation-bandwidth-20260911/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'build(weather-mother): R26 observation-bandwidth candidate [skip ci]'
            git push origin HEAD:feature/weather-mother-r26-observation-bandwidth-20260911
          fi
          PAGE_SHA=$(git rev-parse HEAD)
          PUBLIC_URL="https://raw.githack.com/haihao0307/guilin-dem-pipeline/$PAGE_SHA/weather-mother/full-weather-r26-observation-bandwidth-20260911/index.html"
          echo "PAGE_SHA=$PAGE_SHA" >> "$GITHUB_ENV"
          echo "PUBLIC_URL=$PUBLIC_URL" >> "$GITHUB_ENV"

      - name: Wait for immutable public page
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 40); do
            code=$(curl -L -sS -o /tmp/r26.html -w '%{http_code}' --connect-timeout 10 --max-time 45 "$PUBLIC_URL?probe=$attempt" || true)
            if [ "$code" = 200 ] && grep -q 'weather-mother-r26-observation-bandwidth' /tmp/r26.html; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = 1
          echo "fixed public R26 is live: $PUBLIC_URL"

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install playwright==1.55.0 >/dev/null
          python3 -m playwright install chromium >/dev/null

      - name: Verify prefix-preserving bandwidth optical invariant and mobile flight
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a python3 -u weather-mother/r26-observation-bandwidth-src/qa-public-r26.py

      - name: Commit public evidence
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p weather-mother/full-weather-r26-observation-bandwidth-20260911
          cat > weather-mother/full-weather-r26-observation-bandwidth-20260911/PUBLICATION_PROOF.json <<JSON
          {
            "schema": "weather-mother-r26-observation-bandwidth-publication-proof/1",
            "pageCommit": "$PAGE_SHA",
            "url": "$PUBLIC_URL",
            "baseR22Commit": "8aeb8dac519f8bda851cfc998e07266870d3eaef",
            "provenR23CloudPageCommit": "001a9e3dc028b3a7719ff8ab96bacdd7b8b1cac8",
            "r25EvidenceHead": "fc84a4b8603af0dceb0b548990c7c80b811b3219",
            "yoheiCloudAtlasR02Commit": "029d2e564b65a0874af439232ca8856c42981a14",
            "publicBrowser390x844": true,
            "observationBandwidth": true,
            "prefixPreserving": true,
            "nearFullKm": 14,
            "farCoarseKm": 26,
            "cloudVisibilityInvariant": true,
            "aircraftOpticalOcclusion": true,
            "depthFramebufferUsed": false,
            "sharedDepth": false,
            "flightInputChangedState": true,
            "silverSeaSwitch": true,
            "realIPhoneAcceptance": false,
            "productionReady": false
          }
          JSON
          git config user.name 'Weather Mother CI'
          git config user.email 'weather-mother-ci@users.noreply.github.com'
          git add weather-mother/full-weather-r26-observation-bandwidth-20260911/PUBLIC_QA_MOBILE_OBSERVATION_BANDWIDTH_2026-09-11.json weather-mother/full-weather-r26-observation-bandwidth-20260911/PUBLIC_R26_MOBILE_OBSERVATION_BANDWIDTH_390x844.png weather-mother/full-weather-r26-observation-bandwidth-20260911/PUBLICATION_PROOF.json
          git commit -m 'qa(weather-mother): prove R26 observation bandwidth publicly [skip ci]'
          git push origin HEAD:feature/weather-mother-r26-observation-bandwidth-20260911
