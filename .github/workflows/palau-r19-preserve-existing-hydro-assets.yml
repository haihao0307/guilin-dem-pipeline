name: Palau R19 preserve existing hydro assets

on:
  push:
    branches:
      - work/palau-airai-r19-authority-locked-restart-20260922
    paths:
      - .github/workflows/palau-r19-preserve-existing-hydro-assets.yml
      - games/survivor-palau/palau-world/airai-r19/evidence-cache/airai-reef-bathy-r01/**
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: palau-r19-preserve-existing-hydro-assets
  cancel-in-progress: false

jobs:
  recover-verify-persist:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/palau-airai-r19-authority-locked-restart-20260922
          fetch-depth: 0

      - name: Recover the already-downloaded Airai hydro artifact
        uses: actions/download-artifact@v4
        with:
          name: palau-airai-reef-bathy-r01
          path: /tmp/palau-airai-recovered
          repository: haihao0307/guilin-dem-pipeline
          run-id: 35543393597
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify the original download and derived evidence manifests
        shell: bash
        run: |
          set -euo pipefail
          INTAKE="$(find /tmp/palau-airai-recovered -type d -path '*/tmp/airai-reef-intake' -print -quit)"
          RESULTS="$(find /tmp/palau-airai-recovered -type d -path '*/games/survivor-palau/palau-world/airai-r04/results-r01' -print -quit)"
          test -n "$INTAKE" && test -d "$INTAKE"
          test -n "$RESULTS" && test -d "$RESULTS"
          (cd "$INTAKE" && sha256sum -c SHA256SUMS.txt)
          (cd "$RESULTS" && sha256sum -c MANIFEST.sha256)
          echo "INTAKE=$INTAKE" >> "$GITHUB_ENV"
          echo "RESULTS=$RESULTS" >> "$GITHUB_ENV"

      - name: Persist raw intake and raster grids on the active R19 branch
        shell: bash
        run: |
          set -euo pipefail
          DEST="games/survivor-palau/palau-world/airai-r19/evidence-cache/airai-reef-bathy-r01"
          rm -rf "$DEST"
          mkdir -p "$DEST/raw-intake" "$DEST/grids"
          cp -a "$INTAKE/." "$DEST/raw-intake/"
          cp -a "$RESULTS/grids/." "$DEST/grids/"
          cp "$RESULTS/MANIFEST.sha256" "$DEST/RESULTS_MANIFEST.sha256"
          cp "$RESULTS/PALAU_WORLD_BATHYMETRY_BINDING_R11.json" "$DEST/PALAU_WORLD_BATHYMETRY_BINDING_R11.json"
          python - <<'PY'
          import json
          from pathlib import Path
          dest = Path('games/survivor-palau/palau-world/airai-r19/evidence-cache/airai-reef-bathy-r01')
          receipt = {
            'schema': 'kaopu.survivor-palau.r19-hydro-evidence-cache/1.0',
            'status': 'RECOVERED_VERIFIED_AND_PERSISTED',
            'sourceWorkflowRunId': 35543393597,
            'sourceArtifactId': 10615334057,
            'sourceArtifactName': 'palau-airai-reef-bathy-r01',
            'sourceArtifactSha256': '63eaf6cf9095847cf7510a1b0adb35208c828027ece42b6c07089414c4fd0960',
            'sourceArtifactExpiresAt': '2026-10-20T23:03:41Z',
            'rawIntakeManifest': 'raw-intake/SHA256SUMS.txt',
            'derivedResultsManifest': 'RESULTS_MANIFEST.sha256',
            'persistedRawIntakeFiles': 33,
            'persistedGridFiles': 23,
            'existingVectorAndReportRoot': 'games/survivor-palau/palau-world/airai-r04/results-r01',
            'existingGhPagesMirror': 'games/palau-airai-stone-money/airai-reef-bathy-r01',
            'rules': {
              'redownloadRequired': False,
              'deleteOrRegenerateWithoutEvidenceReview': False,
              'noDataMustRemainNoData': True,
              'candidateBathymetryIsSurveyTruth': False,
              'chartDatumMayBeSilentlyConvertedToMSL': False
            }
          }
          (dest / 'RECOVERY_RECEIPT.json').write_text(json.dumps(receipt, ensure_ascii=False, indent=2) + '\n')
          PY

      - name: Re-verify persisted cache
        shell: bash
        run: |
          set -euo pipefail
          DEST="games/survivor-palau/palau-world/airai-r19/evidence-cache/airai-reef-bathy-r01"
          (cd "$DEST/raw-intake" && sha256sum -c SHA256SUMS.txt)
          python - <<'PY'
          import hashlib
          from pathlib import Path
          root = Path('games/survivor-palau/palau-world/airai-r19/evidence-cache/airai-reef-bathy-r01')
          wanted = {}
          for line in (root / 'RESULTS_MANIFEST.sha256').read_text().splitlines():
              if not line.strip():
                  continue
              digest, rel = line.split(None, 1)
              rel = rel.strip()
              if rel.startswith('grids/'):
                  wanted[rel.removeprefix('grids/')] = digest
          present = {p.name for p in (root / 'grids').glob('*.tif')}
          if present != set(wanted):
              raise SystemExit(f'grid set mismatch: missing={sorted(set(wanted)-present)} extra={sorted(present-set(wanted))}')
          for name, expected in wanted.items():
              actual = hashlib.sha256((root / 'grids' / name).read_bytes()).hexdigest()
              if actual != expected:
                  raise SystemExit(f'{name}: {actual} != {expected}')
          print(f'verified {len(wanted)} persisted grids')
          PY

      - name: Commit the recovered evidence cache
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add games/survivor-palau/palau-world/airai-r19/evidence-cache/airai-reef-bathy-r01
          if git diff --cached --quiet; then
            echo 'Evidence cache already matches the verified artifact.'
            exit 0
          fi
          git commit -m 'data(palau): persist recovered NOAA shoreline and bathymetry evidence'
          git pull --rebase origin work/palau-airai-r19-authority-locked-restart-20260922
          git push origin HEAD:work/palau-airai-r19-authority-locked-restart-20260922
