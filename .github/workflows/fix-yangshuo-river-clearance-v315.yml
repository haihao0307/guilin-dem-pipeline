name: Fix Yangshuo river clearance v3.1.5

on:
  push:
    branches:
      - skill/dem-procedural-landscape-v010
    paths:
      - .github/workflows/fix-yangshuo-river-clearance-v315.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-yangshuo-river-clearance-v315
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Patch runtime and QA by structural anchors
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def line_index(lines: list[str], marker: str, label: str) -> int:
              matches = [i for i, line in enumerate(lines) if marker in line]
              if len(matches) != 1:
                  raise SystemExit(f'{label}: expected one line, found {len(matches)}')
              return matches[0]

          html_path = Path('web/yangshuo-noise-terrain-v310/index.html')
          lines = html_path.read_text(encoding='utf-8').splitlines()

          i = line_index(lines, 'for (let i = 0; i < points.length; i++) points[i].water = levels[i];', 'water profile')
          indent = lines[i][:len(lines[i]) - len(lines[i].lstrip())]
          lines[i:i+1] = [
              f'{indent}for (let i = 0; i < points.length; i++) {{',
              f'{indent}  const localWater = points[i].rawWater;',
              f'{indent}  points[i].water = clamp(levels[i], localWater - .20, localWater + .45);',
              f'{indent}}}',
          ]

          i = line_index(lines, 'let paddyCount = 0, karstCount = 0, riverCount = 0, minimumBedDepth = Infinity;', 'clearance accumulators')
          indent = lines[i][:len(lines[i]) - len(lines[i].lstrip())]
          lines[i:i+1] = [
              f'{indent}let paddyCount = 0, karstCount = 0, riverCount = 0;',
              f'{indent}let minimumBedDepth = Infinity, maximumBedDepth = -Infinity;',
              f'{indent}let riverClearanceSum = 0, riverClearanceSamples = 0, maximumWaterTerrainPenetration = 0;',
          ]

          i = line_index(lines, 'const bedDepth = 2.25 +', 'old river carve')
          if 'minimumBedDepth' not in lines[i+3]:
              raise SystemExit('old river carve block shape changed')
          indent = lines[i][:len(lines[i]) - len(lines[i].lstrip())]
          lines[i:i+4] = [
              f'{indent}const lateral = 1 - clamp(river.distance/Math.max(halfWidth,1),0,1);',
              f'{indent}const bedDepth = .32 + Math.pow(lateral,.72) * 3.28;',
              f'{indent}const targetBed = river.water - bedDepth;',
              f'{indent}const bankCarve = 1 - smooth01(halfWidth, halfWidth+10, river.distance);',
              f'{indent}const carveWeight = river.distance <= halfWidth ? 1 : bankCarve;',
              f'{indent}const carve = carveWeight * Math.min(0, targetBed - h);',
              f'{indent}if (river.distance <= halfWidth) {{',
              f'{indent}  const clearance = (river.water + .10) - (h + carve);',
              f'{indent}  minimumBedDepth = Math.min(minimumBedDepth, clearance);',
              f'{indent}  maximumBedDepth = Math.max(maximumBedDepth, clearance);',
              f'{indent}  riverClearanceSum += clearance;',
              f'{indent}  riverClearanceSamples++;',
              f'{indent}  maximumWaterTerrainPenetration = Math.max(maximumWaterTerrainPenetration, Math.max(0,-clearance));',
              f'{indent}}}',
          ]

          i = line_index(lines, 'return { geometry, grid, spacing, min, max, paddyCount, karstCount, riverCount, minimumBedDepth, riverSegments:segmentsRiver };', 'return contract')
          indent = lines[i][:len(lines[i]) - len(lines[i].lstrip())]
          lines[i:i+1] = [
              f'{indent}if (!riverClearanceSamples || !Number.isFinite(minimumBedDepth) || !Number.isFinite(maximumBedDepth)) {{',
              f"{indent}  throw new Error('河道水面与河床净空采样失败');",
              f'{indent}}}',
              f'{indent}const meanRiverClearance = riverClearanceSum / riverClearanceSamples;',
              f'{indent}return {{',
              f'{indent}  geometry, grid, spacing, min, max, paddyCount, karstCount, riverCount,',
              f'{indent}  minimumBedDepth, maximumBedDepth, meanRiverClearance, riverClearanceSamples,',
              f'{indent}  maximumWaterTerrainPenetration, riverSegments:segmentsRiver',
              f'{indent}}};',
          ]

          i = line_index(lines, 'minimumRiverBedDepthMeters:Number(gridResult.minimumBedDepth.toFixed(3)),tubeGeometryUsed:false,', 'online QA clearance fields')
          indent = lines[i][:len(lines[i]) - len(lines[i].lstrip())]
          lines[i:i+1] = [
              f'{indent}minimumRiverBedDepthMeters:Number(gridResult.minimumBedDepth.toFixed(3)),',
              f'{indent}minimumRiverClearanceMeters:Number(gridResult.minimumBedDepth.toFixed(3)),',
              f'{indent}maximumRiverClearanceMeters:Number(gridResult.maximumBedDepth.toFixed(3)),',
              f'{indent}meanRiverClearanceMeters:Number(gridResult.meanRiverClearance.toFixed(3)),',
              f'{indent}riverClearanceSampleCount:gridResult.riverClearanceSamples,',
              f'{indent}maximumWaterTerrainPenetrationMeters:Number(gridResult.maximumWaterTerrainPenetration.toFixed(3)),',
              f'{indent}tubeGeometryUsed:false,',
          ]

          html = '\n'.join(lines) + '\n'
          html = html.replace(
              "schema: 'yangshuo-noise-terrain-online-qa/v3.1.0'",
              "schema: 'yangshuo-noise-terrain-online-qa/v3.1.1'",
          )
          html_path.write_text(html, encoding='utf-8')

          qa_path = Path('tools/procedural_landscape/yangshuo_noise_v310_browser_qa.py')
          qa = qa_path.read_text(encoding='utf-8')

          old = "          loadingOpacity: Number(getComputedStyle(document.querySelector('#loading')).opacity)"
          new = """          loadingOpacity: Number(getComputedStyle(document.querySelector('#loading')).opacity),
          loadingDisplay: getComputedStyle(document.querySelector('#loading')).display,
          loadingVisibility: getComputedStyle(document.querySelector('#loading')).visibility,
          loadingVisible: (() => {
            const loading = document.querySelector('#loading');
            if (!loading) return false;
            const style = getComputedStyle(loading);
            return !loading.hidden && style.display !== 'none' && style.visibility !== 'hidden' && Number(style.opacity) > .05;
          })()"""
          if qa.count(old) != 1:
              raise SystemExit(f'loading snapshot: expected one match, found {qa.count(old)}')
          qa = qa.replace(old, new, 1)

          old = """    bed_depth = float(qa.get("minimumRiverBedDepthMeters") or 0)
          if not 0.25 <= bed_depth <= 6:
              raise RuntimeError(f"{expected_preset}: riverbed clearance failed: {state}")"""
          new = """    minimum_clearance = float(qa.get("minimumRiverClearanceMeters") or qa.get("minimumRiverBedDepthMeters") or 0)
          maximum_clearance = float(qa.get("maximumRiverClearanceMeters") or 0)
          mean_clearance = float(qa.get("meanRiverClearanceMeters") or 0)
          clearance_samples = int(qa.get("riverClearanceSampleCount") or 0)
          penetration = float(qa.get("maximumWaterTerrainPenetrationMeters") or 0)
          if not 0.25 <= minimum_clearance <= 1.25:
              raise RuntimeError(f"{expected_preset}: minimum river clearance failed: {state}")
          if not minimum_clearance <= mean_clearance <= maximum_clearance <= 4.25:
              raise RuntimeError(f"{expected_preset}: river clearance envelope failed: {state}")
          if clearance_samples < 100 or penetration > 0.01:
              raise RuntimeError(f"{expected_preset}: water terrain intersection failed: {state}")"""
          if qa.count(old) != 1:
              raise SystemExit(f'clearance gate: expected one match, found {qa.count(old)}')
          qa = qa.replace(old, new, 1)

          old = "    if state.get(\"loadingOpacity\", 1) > 0.05:\n        raise RuntimeError(f\"{expected_preset}: loading overlay remains visible: {state}\")"
          new = "    if state.get(\"loadingVisible\", True):\n        raise RuntimeError(f\"{expected_preset}: loading overlay remains visible: {state}\")"
          if qa.count(old) != 1:
              raise SystemExit(f'loading gate: expected one match, found {qa.count(old)}')
          qa = qa.replace(old, new, 1)

          marker = '\n\ndef run(args: argparse.Namespace) -> int:'
          capture = """

          def capture(page: Page, path: Path) -> None:
              page.screenshot(
                  path=str(path),
                  full_page=False,
                  animations="disabled",
                  caret="hide",
                  timeout=120_000,
              )
          """
          if qa.count(marker) != 1:
              raise SystemExit(f'capture helper anchor: expected one match, found {qa.count(marker)}')
          qa = qa.replace(marker, capture + marker, 1)

          replacements = {
              'page.screenshot(path=str(output / "karst-desktop.png"), full_page=True)': 'capture(page, output / "karst-desktop.png")',
              'page.screenshot(path=str(output / "paddy-desktop.png"), full_page=True)': 'capture(page, output / "paddy-desktop.png")',
              'page.screenshot(path=str(output / "river-desktop.png"), full_page=True)': 'capture(page, output / "river-desktop.png")',
              'page.screenshot(path=str(output / "truth-rollback-desktop.png"), full_page=True)': 'capture(page, output / "truth-rollback-desktop.png")',
              'mobile.screenshot(path=str(output / "paddy-mobile-390x844.png"), full_page=True)': 'capture(mobile, output / "paddy-mobile-390x844.png")',
              'page.screenshot(path=str(output / "failure-desktop.png"), full_page=True)': 'capture(page, output / "failure-desktop.png")',
          }
          for old, new in replacements.items():
              if qa.count(old) != 1:
                  raise SystemExit(f'screenshot anchor: expected one match, found {qa.count(old)}: {old}')
              qa = qa.replace(old, new, 1)

          qa = qa.replace(
              '"schema": "yangshuo-noise-terrain-browser-qa/v3.1.0"',
              '"schema": "yangshuo-noise-terrain-browser-qa/v3.1.1"',
          )
          qa_path.write_text(qa, encoding='utf-8')
          PY

          python - <<'PY'
          import re
          from pathlib import Path
          html = Path('web/yangshuo-noise-terrain-v310/index.html').read_text(encoding='utf-8')
          module = re.search(r'<script type="module">\s*(.*?)\s*</script>', html, re.S)
          if not module:
              raise SystemExit('module script not found')
          Path('/tmp/yangshuo-noise-v315.mjs').write_text(module.group(1), encoding='utf-8')
          for marker in (
              'minimumRiverClearanceMeters',
              'maximumRiverClearanceMeters',
              'maximumWaterTerrainPenetrationMeters',
              'river.distance <= halfWidth ? 1 : bankCarve',
          ):
              if marker not in html:
                  raise SystemExit(f'missing corrected marker: {marker}')
          PY
          node --check /tmp/yangshuo-noise-v315.mjs
          python -m py_compile tools/procedural_landscape/yangshuo_noise_v310_browser_qa.py

      - name: Commit corrected runtime and QA
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/yangshuo-noise-terrain-v310/index.html tools/procedural_landscape/yangshuo_noise_v310_browser_qa.py
          git commit -m "fix(guilin): enforce terrain-contact river clearance"
          git push origin HEAD:skill/dem-procedural-landscape-v010
