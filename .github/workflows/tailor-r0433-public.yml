name: Tailor R0433 real public delivery
on:
  push:
    branches: [fix/tailor-all-category-display-r0433-20261011]
    paths: [.github/workflows/tailor-r0433-public.yml]
permissions:
  contents: write
concurrency:
  group: tailor-r0433-public-delivery
  cancel-in-progress: false
jobs:
  publish-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: kaopu-tailor-workbench/presets/r04
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare real browser and original seam/view invariant tests
        run: |
          pip install playwright==1.57.0 pillow
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
          node kaopu-tailor-workbench/presets/r04/test_display_r0433.mjs
      - name: Publish new immutable snapshot without changing any old entrance
        run: python kaopu-tailor-workbench/presets/r04/release_r0433.py publish
      - name: Verify actual public bytes and decode every real 3D card
        run: python kaopu-tailor-workbench/presets/r04/release_r0433.py verify
      - name: Actual HTTPS all-category, outfit and fresh native sewing acceptance
        run: |
          P=kaopu-tailor-workbench/presets/r04
          export R0433_BASE=$(python -c "import json;print(json.load(open('$P/R0433_RELEASE_STATE.json'))['fixedURL'].split('?')[0])")
          python "$P/qa_r0433.py"
          python "$P/qa_fresh_r0433.py"
          python "$P/release_r0433.py" finish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tailor-r0433-real-public-evidence
          path: |
            kaopu-tailor-workbench/presets/r04/R0433_*.json
            kaopu-tailor-workbench/presets/r04/qa-r0433-public/
            kaopu-tailor-workbench/presets/r04/qa-r0433-fresh-public/
          retention-days: 14
