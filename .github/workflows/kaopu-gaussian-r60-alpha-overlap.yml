name: KAOPU Gaussian R60 Alpha Overlap

on:
  push:
    branches:
      - coordination/kaopu-learning-flywheel-r1-20260909
    paths:
      - docs/mother_coordination/kaopu_learning_flywheel_v1/PROBES/gaussian_three_alpha_overlap_r60.html
      - docs/mother_coordination/kaopu_learning_flywheel_v1/PROBES/run_gaussian_three_alpha_overlap_r60.js
      - docs/mother_coordination/kaopu_learning_flywheel_v1/ADAPTERS/gaussian_three_alpha_overlap_gate_r60.mjs
      - .github/workflows/kaopu-gaussian-r60-alpha-overlap.yml

permissions:
  contents: read

jobs:
  r60-alpha-overlap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned renderer and browser harness
        run: |
          npm init -y
          npm pkg set type=module
          npm install --no-save three@0.186.0 playwright@1.57.0 pngjs@7.0.0
          npx playwright install --with-deps chromium
      - name: Start local fixture server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/r60-http.log 2>&1 &
          sleep 2
          curl --fail --silent http://127.0.0.1:8765/docs/mother_coordination/kaopu_learning_flywheel_v1/PROBES/gaussian_three_alpha_overlap_r60.html > /dev/null
      - name: Run actual SPZLoader and GaussianSplat alpha-overlap grid
        run: node docs/mother_coordination/kaopu_learning_flywheel_v1/PROBES/run_gaussian_three_alpha_overlap_r60.js
      - name: Validate R60 evidence contract
        run: |
          cat r60-comparison.json | node docs/mother_coordination/kaopu_learning_flywheel_v1/ADAPTERS/gaussian_three_alpha_overlap_gate_r60.mjs > r60-gate.json
          cat r60-gate.json
          node -e "const d=require('./r60-gate.json');if(d.status!=='Candidate-pass')process.exit(10)"
      - name: Upload R60 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaopu-gaussian-r60-alpha-overlap
          path: |
            r60-*.json
          if-no-files-found: warn
          retention-days: 30
