name: Guilin v0.7.5 3D visual evidence

on:
  push:
    branches:
      - project/guilin-v075-approved-aoi-terrain3d-preview
    paths:
      - .github/workflows/guilin-v075-bootstrap.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: guilin-v075-visual-evidence
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEST: guilin-v075-approved-aoi-terrain3d
      HEIGHT_BYTES: "2273280"
    steps:
      - name: Checkout source branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          lfs: false

      - name: Verify deployed page and capture browser evidence
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          rm -rf /tmp/v075-pages /tmp/v075-evidence
          git worktree add -b "v075-visual-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" /tmp/v075-pages origin/gh-pages
          page="/tmp/v075-pages/${DEST}"
          evidence="/tmp/v075-evidence"
          mkdir -p "${evidence}"

          test -s "${page}/index.html"
          test -s "${page}/styles.css"
          test -s "${page}/app.js"
          test -s "${page}/data/accepted_aoi.json"
          test -s "${page}/data/source/terrain_manifest.json"
          test -s "${page}/data/source/terrain_height_u16.bin"
          test "$(wc -c < "${page}/data/source/terrain_height_u16.bin" | tr -d ' ')" = "${HEIGHT_BYTES}"
          node --check "${page}/app.js"

          python - "${page}" "${GITHUB_SHA}" <<'PY'
          import hashlib, json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          source_sha = sys.argv[2]
          aoi = json.loads((root / "data/accepted_aoi.json").read_text())
          manifest = json.loads((root / "data/source/terrain_manifest.json").read_text())
          height = (root / "data/source/terrain_height_u16.bin").read_bytes()
          assert aoi["status"] == "ACCEPTED"
          assert aoi["geometry_sha256"] == "36b750be56ae0dea906996258068eaf9aaa71e01667eb328b9ce6bd1b48cbe80"
          assert aoi["bounds_epsg32649"] == [380331.8, 2705928.1, 530128.2, 2926987.2]
          assert manifest["crs"] == "EPSG:32649"
          assert manifest["source_resolution_m"] == [12.5, 12.5]
          assert manifest["height"]["width"] == 1024
          assert manifest["height"]["height"] == 1110
          assert manifest["height"]["nodata_code"] == 65535
          assert manifest["gap_fill_applied"] is False
          assert len(height) == 2273280
          receipt = {
              "schema": "guilin-v075-visual-evidence/v1",
              "workflow_source_commit": source_sha,
              "aoi_status": "ACCEPTED",
              "aoi_geometry_sha256": aoi["geometry_sha256"],
              "source_resolution_m": 12.5,
              "height_bytes": len(height),
              "height_sha256": hashlib.sha256(height).hexdigest(),
              "gap_fill_applied": False,
              "fallback_30m_used": False,
          }
          pathlib.Path("/tmp/v075-evidence/static-receipt.json").write_text(json.dumps(receipt, indent=2) + "\n")
          PY

          python -m http.server 8125 --bind 127.0.0.1 --directory "${page}" >"${evidence}/server.log" 2>&1 &
          server_pid=$!
          trap 'kill "${server_pid}" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8125/ >/dev/null; then break; fi
            sleep 0.25
          done
          curl -fsS http://127.0.0.1:8125/ >/dev/null

          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -x "${browser}"
          printf '%s\n' "${browser}" > "${evidence}/browser-path.txt"
          url="http://127.0.0.1:8125/?visualEvidence=${GITHUB_RUN_ID}"
          common=(
            --headless=new
            --no-sandbox
            --disable-dev-shm-usage
            --hide-scrollbars
            --disable-background-networking
            --disable-component-update
            --disable-default-apps
            --disable-extensions
            --disable-sync
            --metrics-recording-only
            --no-first-run
            --use-angle=swiftshader
            --enable-unsafe-swiftshader
            --force-device-scale-factor=1
          )

          "${browser}" "${common[@]}" --window-size=1600,1000 --virtual-time-budget=30000 --dump-dom "${url}" > "${evidence}/desktop-dom.html" 2> "${evidence}/desktop-chrome.log"
          grep -Fq 'data-ready="true"' "${evidence}/desktop-dom.html"
          grep -Fq 'ACCEPTED' "${evidence}/desktop-dom.html"
          grep -Fq 'WebGL2' "${evidence}/desktop-dom.html"

          "${browser}" "${common[@]}" --window-size=1600,1000 --virtual-time-budget=30000 --screenshot="${evidence}/desktop-1600x1000.png" "${url}" 2>> "${evidence}/desktop-chrome.log"
          "${browser}" "${common[@]}" --window-size=390,844 --virtual-time-budget=30000 --screenshot="${evidence}/mobile-390x844.png" "${url}" 2> "${evidence}/mobile-chrome.log"
          test -s "${evidence}/desktop-1600x1000.png"
          test -s "${evidence}/mobile-390x844.png"

          python - "${evidence}" "${GITHUB_RUN_ID}" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          payload = {
              "schema": "guilin-v075-browser-visual-qa/v1",
              "passed": True,
              "workflow_run_id": int(sys.argv[2]),
              "data_ready": True,
              "webgl2_text_present": True,
              "desktop_screenshot_bytes": (root / "desktop-1600x1000.png").stat().st_size,
              "mobile_screenshot_bytes": (root / "mobile-390x844.png").stat().st_size,
              "aoi_status": "ACCEPTED",
              "source_resolution_m": 12.5,
              "gap_fill_applied": False,
              "fallback_30m_used": False,
          }
          (root / "browser-qa.json").write_text(json.dumps(payload, indent=2) + "\n")
          PY

          target="${page}/evidence"
          mkdir -p "${target}"
          cp "${evidence}/desktop-1600x1000.png" "${target}/current-desktop.png"
          cp "${evidence}/mobile-390x844.png" "${target}/current-mobile.png"
          cp "${evidence}/browser-qa.json" "${target}/browser-qa.json"
          cp "${evidence}/static-receipt.json" "${target}/static-receipt.json"

          git -C /tmp/v075-pages config user.name github-actions[bot]
          git -C /tmp/v075-pages config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C /tmp/v075-pages add "${DEST}/evidence"
          git -C /tmp/v075-pages commit -m "Add Guilin v0.7.5 browser visual evidence ${GITHUB_SHA}"
          git -C /tmp/v075-pages push origin HEAD:gh-pages

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdf959f0f0fb45cf08
        with:
          name: guilin-v075-visual-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/v075-evidence/
          if-no-files-found: error
          retention-days: 90
