name: Bootstrap Guilin v0.7.5 3D page

on:
  push:
    branches: [project/guilin-v075-approved-aoi-terrain3d-preview]
    paths:
      - .github/workflows/guilin-v075-bootstrap.yml
      - projects/guilin-v075-approved-aoi-terrain3d-preview/bootstrap_payload.part-*
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: guilin-v075-bootstrap
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PROJECT_DIR: projects/guilin-v075-approved-aoi-terrain3d-preview
      PARTS: projects/guilin-v075-approved-aoi-terrain3d-preview/bootstrap_payload.part-*
      DEST: guilin-v075-approved-aoi-terrain3d
      PAYLOAD_SHA: 9c1275d49a6ca76390cad574b8d1baccd96320c44700b88f2b0ddf12924228cd
      HEIGHT_BYTES: "2273280"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          lfs: false
      - name: Materialize source, verify and publish
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "project/guilin-v075-approved-aoi-terrain3d-preview"
          compgen -G "${PARTS}" >/dev/null
          cat ${PARTS} > /tmp/payload.b64
          base64 -d /tmp/payload.b64 > /tmp/payload.tar.gz
          printf '%s  %s\n' "${PAYLOAD_SHA}" /tmp/payload.tar.gz | sha256sum -c -
          tar -xzf /tmp/payload.tar.gz -C .
          rm -f ${PARTS} .github/workflows/guilin-v075-approved-aoi-terrain3d.yml
          node --check "${PROJECT_DIR}/web/app.js"
          node "${PROJECT_DIR}/tests/static_contract_test.mjs"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A "${PROJECT_DIR}"
          git commit -m "feat(v075): materialize accepted AOI 3D preview"
          git push origin HEAD:project/guilin-v075-approved-aoi-terrain3d-preview
          SOURCE_SHA="$(git rev-parse HEAD)"
          git fetch origin gh-pages
          rm -rf /tmp/v075-dist /tmp/v075-pages
          mkdir -p /tmp/v075-dist/data/source
          rsync -a --exclude 'data/source/' "${PROJECT_DIR}/web/" /tmp/v075-dist/
          git show origin/gh-pages:guilin-v072-terrain-rivers/data/terrain_manifest.json > /tmp/v075-dist/data/source/terrain_manifest.json
          git show origin/gh-pages:guilin-v072-terrain-rivers/data/terrain_height_u16.bin > /tmp/v075-dist/data/source/terrain_height_u16.bin
          test "$(wc -c < /tmp/v075-dist/data/source/terrain_height_u16.bin | tr -d ' ')" = "${HEIGHT_BYTES}"
          python - /tmp/v075-dist "${SOURCE_SHA}" <<'PY'
          import hashlib,json,pathlib,sys
          root=pathlib.Path(sys.argv[1]); sha=sys.argv[2]
          manifest=json.loads((root/'data/source/terrain_manifest.json').read_text())
          height=(root/'data/source/terrain_height_u16.bin').read_bytes()
          assert manifest['crs']=='EPSG:32649'
          assert manifest['source_resolution_m']==[12.5,12.5]
          assert manifest['height']['width']==1024 and manifest['height']['height']==1110
          assert manifest['height']['nodata_code']==65535
          assert manifest['vertical_scale']==1.0
          assert manifest['gap_fill_applied'] is False
          assert len(height)==2273280
          receipt={'schema':'guilin-v075-build-provenance/v1','source_commit':sha,'aoi_status':'ACCEPTED','aoi_geometry_sha256':'36b750be56ae0dea906996258068eaf9aaa71e01667eb328b9ce6bd1b48cbe80','source_resolution_m':12.5,'preview_grid':[1024,1110],'height_sha256':hashlib.sha256(height).hexdigest(),'default_vertical_scale':1.0,'gap_fill_applied':False,'fallback_30m_used':False,'stage':'numeric-crop-3d-preview'}
          (root/'build_provenance.json').write_text(json.dumps(receipt,indent=2)+'\n')
          PY
          git worktree add -b "v075-pages-${GITHUB_RUN_ID}" /tmp/v075-pages origin/gh-pages
          rm -rf "/tmp/v075-pages/${DEST}"
          mkdir -p "/tmp/v075-pages/${DEST}"
          rsync -a /tmp/v075-dist/ "/tmp/v075-pages/${DEST}/"
          touch /tmp/v075-pages/.nojekyll
          git -C /tmp/v075-pages config user.name github-actions[bot]
          git -C /tmp/v075-pages config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C /tmp/v075-pages add .nojekyll "${DEST}"
          git -C /tmp/v075-pages commit -m "Publish Guilin v0.7.5 accepted AOI 3D ${SOURCE_SHA}"
          git -C /tmp/v075-pages push origin HEAD:gh-pages
      - name: Upload static evidence
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: guilin-v075-bootstrap-${{ github.run_id }}
          path: /tmp/v075-dist/build_provenance.json
          if-no-files-found: warn
          retention-days: 30
