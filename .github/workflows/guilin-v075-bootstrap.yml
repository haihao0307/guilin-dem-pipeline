name: Guilin accepted AOI 2048 hydrology

on:
  push:
    branches:
      - project/guilin-v075-approved-aoi-terrain3d-preview
    paths:
      - .github/workflows/guilin-v075-bootstrap.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: guilin-v075-approved-aoi-2048-hydrology
  cancel-in-progress: false

env:
  PROJECT_DIR: projects/guilin-v075-approved-aoi-terrain3d-preview
  PUBLISH_DIR: guilin-v075-approved-aoi-terrain3d
  RAW_TIFF_URL: https://github.com/haihao0307/guilin-dem-pipeline/releases/download/guilin-v070-raw-mosaic-v001/guilin_raw_union_12_5m.tif
  RAW_TIFF_SHA256: 9490b1bd34f67336352cf448729f763ae4e241637d821961efd0290e29d6c9d4
  RAW_TIFF_BYTES: "124348471"
  HEIGHT_BYTES: "8388608"
  PUBLIC_URL: https://haihao0307.github.io/guilin-dem-pipeline/guilin-v075-approved-aoi-terrain3d/
  BUILD_ROOT: /tmp/guilin-v075-build
  DIST_DIR: /tmp/guilin-v075-dist
  EVIDENCE_DIR: /tmp/guilin-v075-evidence
  PAGES_DIR: /tmp/guilin-v075-pages

jobs:
  build-verify-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout exact production source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          lfs: false

      - name: Materialize clean 2048 hydrology source
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "project/guilin-v075-approved-aoi-terrain3d-preview"
          test "${GITHUB_SHA}" = "$(git rev-parse HEAD)"
          shopt -s nullglob
          parts=("${PROJECT_DIR}"/bootstrap_v2048_xz.part-*)
          if ((${#parts[@]} > 0)); then
            test "${#parts[@]}" = "15"
            cat "${parts[@]}" | base64 --decode > /tmp/v075-source.tar.xz
            test "$(wc -c < /tmp/v075-source.tar.xz | tr -d ' ')" = "25572"
            printf '%s  %s\n' "5a331ce9fcb9c1a2c9f7d7000119108a4db4239835ec28bf70daf475e828f500" /tmp/v075-source.tar.xz | sha256sum -c -
            tar -xJf /tmp/v075-source.tar.xz -C "${PROJECT_DIR}"
            rm -f "${parts[@]}"
            test -s "${PROJECT_DIR}/build_2048_hydrology.py"
            test -s "${PROJECT_DIR}/tests/validate_2048.py"
            test -s "${PROJECT_DIR}/web/app.js"
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add "${PROJECT_DIR}"
            git commit -m "feat(v075): materialize accepted AOI 2048 hydrology source"
            git push origin HEAD:project/guilin-v075-approved-aoi-terrain3d-preview
          fi
          test -s "${PROJECT_DIR}/build_2048_hydrology.py"
          test -s "${PROJECT_DIR}/sources/osm_hydrology.geojson"
          echo "MATERIALIZED_SOURCE_SHA=$(git rev-parse HEAD)" >> "${GITHUB_ENV}"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install numeric and browser QA dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "project/guilin-v075-approved-aoi-terrain3d-preview"
          test "${MATERIALIZED_SOURCE_SHA}" = "$(git rev-parse HEAD)"
          rm -rf "${BUILD_ROOT}" "${DIST_DIR}" "${EVIDENCE_DIR}" "${PAGES_DIR}"
          mkdir -p "${BUILD_ROOT}/data" "${DIST_DIR}" "${EVIDENCE_DIR}/local" "${EVIDENCE_DIR}/public"
          python -m pip install --disable-pip-version-check \
            numpy==2.2.6 \
            rasterio==1.4.3 \
            shapely==2.1.1 \
            pyproj==3.7.1 \
            requests==2.32.4 \
            websocket-client==1.8.0
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f
          fc-match "Noto Sans CJK SC" | tee "${EVIDENCE_DIR}/cjk-font-match.txt"

      - name: Materialize locked 12.5 m DEM and verify sources
        shell: bash
        run: |
          set -euo pipefail
          hydrology="${PROJECT_DIR}/sources/osm_hydrology.geojson"
          test -s "${hydrology}"
          test "$(wc -c < "${hydrology}" | tr -d ' ')" = "5832414"
          test "$(git hash-object "${hydrology}")" = "c00174242b68106cec9febcf24e0b94464b3727c"

          raw="${BUILD_ROOT}/guilin_raw_union_12_5m.tif"
          curl -fL --retry 6 --retry-all-errors --connect-timeout 30 --max-time 1800 \
            "${RAW_TIFF_URL}" -o "${raw}"
          test "$(wc -c < "${raw}" | tr -d ' ')" = "${RAW_TIFF_BYTES}"
          printf '%s  %s\n' "${RAW_TIFF_SHA256}" "${raw}" | sha256sum -c -

          python "${PROJECT_DIR}/build_2048_hydrology.py" \
            --mosaic "${raw}" \
            --hydrology "${hydrology}" \
            --output-dir "${BUILD_ROOT}/data" \
            | tee "${EVIDENCE_DIR}/build-output.json"

      - name: Validate exact 2048 terrain and sampled hydrology
        shell: bash
        run: |
          set -euo pipefail
          node --check "${PROJECT_DIR}/web/app.js"
          node "${PROJECT_DIR}/tests/static_contract_test.mjs" "${PROJECT_DIR}/web" \
            | tee "${EVIDENCE_DIR}/source-contract-qa.json"
          python "${PROJECT_DIR}/tests/validate_2048.py" "${BUILD_ROOT}/data" \
            --output "${EVIDENCE_DIR}/static-data-qa.json"
          test "$(wc -c < "${BUILD_ROOT}/data/terrain_2048_u16.bin" | tr -d ' ')" = "${HEIGHT_BYTES}"

          rsync -a "${PROJECT_DIR}/web/" "${DIST_DIR}/"
          rm -rf "${DIST_DIR}/data/generated"
          cp "${BUILD_ROOT}/data/terrain_2048_u16.bin" "${DIST_DIR}/data/"
          cp "${BUILD_ROOT}/data/terrain_2048_manifest.json" "${DIST_DIR}/data/"
          cp "${BUILD_ROOT}/data/hydrology_ribbons.f32.bin" "${DIST_DIR}/data/"
          cp "${BUILD_ROOT}/data/hydrology_sample_manifest.json" "${DIST_DIR}/data/"
          cp "${BUILD_ROOT}/data/build_receipt.json" "${DIST_DIR}/data/"
          mkdir -p "${DIST_DIR}/evidence"
          cp "${EVIDENCE_DIR}/source-contract-qa.json" "${DIST_DIR}/evidence/"
          cp "${EVIDENCE_DIR}/static-data-qa.json" "${DIST_DIR}/evidence/"

          SOURCE_SHA="${MATERIALIZED_SOURCE_SHA}" python - "${DIST_DIR}" <<'PY'
          import json, os, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          terrain = json.loads((root / "data/terrain_2048_manifest.json").read_text())
          water = json.loads((root / "data/hydrology_sample_manifest.json").read_text())
          payload = {
              "schema": "guilin-v075-2048-hydrology-build-provenance/v1",
              "source_commit": os.environ["SOURCE_SHA"],
              "aoi_status": "ACCEPTED",
              "aoi_geometry_sha256": terrain["aoi_geometry_sha256"],
              "source_resolution_m": 12.5,
              "terrain_grid": terrain["output_grid"],
              "terrain_sha256": terrain["sha256"],
              "terrain_bytes": terrain["stored_bytes"],
              "hydrology_source_git_blob_sha1": water["source_git_blob_sha1"],
              "hydrology_centerline_sha256": water["source_centerline_coordinate_sha256"],
              "hydrology_vertex_count": water["vertex_count"],
              "hydrology_segment_count": water["emitted_segment_count"],
              "default_vertical_scale": 1.0,
              "gap_fill_applied": False,
              "fallback_30m_used": False,
              "stage": "accepted-aoi-2048-hydrology-preview",
          }
          (root / "build_provenance.json").write_text(json.dumps(payload, ensure_ascii=False, indent=2) + "\n")
          PY

      - name: Run local WebGL2 browser QA
        shell: bash
        run: |
          set -euo pipefail
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -x "${browser}"
          printf '%s\n' "${browser}" > "${EVIDENCE_DIR}/browser-path.txt"
          python -m http.server 8125 --bind 127.0.0.1 --directory "${DIST_DIR}" >"${EVIDENCE_DIR}/local/server.log" 2>&1 &
          server_pid=$!
          trap 'kill "${server_pid}" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 80); do
            if curl -fsS http://127.0.0.1:8125/ >/dev/null; then break; fi
            sleep 0.25
          done
          curl -fsS http://127.0.0.1:8125/ >/dev/null
          python "${PROJECT_DIR}/tests/browser_cdp.py" \
            --chromium "${browser}" \
            --url "http://127.0.0.1:8125/?qa=1&v=${MATERIALIZED_SOURCE_SHA}" \
            --timeout 240 \
            --evidence-dir "${EVIDENCE_DIR}/local"
          cp "${EVIDENCE_DIR}/local/browser-qa.json" "${DIST_DIR}/evidence/local-browser-qa.json"
          cp "${EVIDENCE_DIR}/local/desktop-1600x1000.png" "${DIST_DIR}/evidence/local-desktop.png"
          cp "${EVIDENCE_DIR}/local/mobile-390x844.png" "${DIST_DIR}/evidence/local-mobile.png"

      - name: Publish one approved Guilin page
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          git worktree add -b "v075-2048-pages-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "${PAGES_DIR}" origin/gh-pages
          rm -rf "${PAGES_DIR}/${PUBLISH_DIR}"
          mkdir -p "${PAGES_DIR}/${PUBLISH_DIR}"
          rsync -a "${DIST_DIR}/" "${PAGES_DIR}/${PUBLISH_DIR}/"
          touch "${PAGES_DIR}/.nojekyll"
          git -C "${PAGES_DIR}" config user.name github-actions[bot]
          git -C "${PAGES_DIR}" config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C "${PAGES_DIR}" add .nojekyll "${PUBLISH_DIR}"
          if ! git -C "${PAGES_DIR}" diff --cached --quiet; then
            git -C "${PAGES_DIR}" commit -m "Publish Guilin accepted AOI 2048 hydrology ${MATERIALIZED_SOURCE_SHA}"
            git -C "${PAGES_DIR}" push origin HEAD:gh-pages
          fi

      - name: Verify public page and capture public evidence
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 120); do
            cache="${MATERIALIZED_SOURCE_SHA}-${GITHUB_RUN_ID}-${attempt}"
            if curl -fsSL --connect-timeout 20 --max-time 90 "${PUBLIC_URL}?v=${cache}" -o "${EVIDENCE_DIR}/public/index.html" \
              && grep -Fq 'guilin-v075-accepted-aoi-2048-hydrology' "${EVIDENCE_DIR}/public/index.html"; then
              ready=1
              break
            fi
            sleep 10
          done
          test "${ready}" = 1
          browser="$(cat "${EVIDENCE_DIR}/browser-path.txt")"
          python "${PROJECT_DIR}/tests/browser_cdp.py" \
            --chromium "${browser}" \
            --url "${PUBLIC_URL}?qa=1&v=${MATERIALIZED_SOURCE_SHA}-${GITHUB_RUN_ID}" \
            --timeout 300 \
            --evidence-dir "${EVIDENCE_DIR}/public"

          target="${PAGES_DIR}/${PUBLISH_DIR}/evidence"
          mkdir -p "${target}"
          cp "${EVIDENCE_DIR}/public/browser-qa.json" "${target}/public-browser-qa.json"
          cp "${EVIDENCE_DIR}/public/desktop-1600x1000.png" "${target}/current-desktop.png"
          cp "${EVIDENCE_DIR}/public/mobile-390x844.png" "${target}/current-mobile.png"
          SOURCE_SHA="${MATERIALIZED_SOURCE_SHA}" RUN_ID="${GITHUB_RUN_ID}" python - "${target}" <<'PY'
          import json, os, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          qa = json.loads((root / "public-browser-qa.json").read_text())
          assert qa["passed"] is True
          receipt = {
              "schema": "guilin-v075-2048-hydrology-public-receipt/v1",
              "source_commit": os.environ["SOURCE_SHA"],
              "workflow_run_id": int(os.environ["RUN_ID"]),
              "public_browser_qa_passed": True,
              "aoi_status": "ACCEPTED",
              "terrain_grid": [2048, 2048],
              "source_resolution_m": 12.5,
              "hydrology_loaded": True,
              "gap_fill_applied": False,
              "fallback_30m_used": False,
          }
          (root / "public-receipt.json").write_text(json.dumps(receipt, indent=2) + "\n")
          PY
          git -C "${PAGES_DIR}" add "${PUBLISH_DIR}/evidence"
          git -C "${PAGES_DIR}" commit -m "Add Guilin 2048 hydrology public evidence ${MATERIALIZED_SOURCE_SHA}"
          git -C "${PAGES_DIR}" push origin HEAD:gh-pages

      - name: Upload complete QA evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: guilin-v075-2048-hydrology-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/guilin-v075-evidence/
          if-no-files-found: error
          retention-days: 90
