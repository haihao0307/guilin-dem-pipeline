name: Hong Kong R03 public startup compatibility QA
on:
  push:
    branches: ['trial/hongkong-r03-startup-20261021']
    paths:
      - 'kaopu-geography-workbench/hong-kong-map-sea-r03/tests/startup-r01/**'
      - '.github/workflows/hongkong-r03-startup-qa.yml'
permissions:
  contents: read
concurrency:
  group: hongkong-r03-startup-${{ github.ref }}
  cancel-in-progress: false
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            kaopu-geography-workbench/hong-kong-map-sea-r03
      - name: Install pinned browser and image-check dependencies
        run: |
          python -m pip install playwright==1.57.0 pillow==12.0.0
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Bounded bootstrap mock tests
        run: node kaopu-geography-workbench/hong-kong-map-sea-r03/tests/startup-r01/create-webgl2.test.cjs
      - name: Frozen baseline, original scene interactions and real WebGL2 fallback
        run: python -u kaopu-geography-workbench/hong-kong-map-sea-r03/tests/startup-r01/browser-qa.py kaopu-geography-workbench/hong-kong-map-sea-r03 /tmp/hongkong-startup-evidence https://haihao0307.github.io/guilin-dem-pipeline/kaopu-geography-workbench/hong-kong-map-sea-r03/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: hongkong-r03-startup-${{ github.sha }}
          path: |
            /tmp/hongkong-startup-evidence/results.json
            /tmp/hongkong-startup-evidence/*.png
            kaopu-geography-workbench/hong-kong-map-sea-r03/tests/startup-r01/mock-results.json
          if-no-files-found: warn
          retention-days: 1
