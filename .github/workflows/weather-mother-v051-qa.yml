name: Weather Mother V1.5 live QA
on:
  push:
    branches: [gh-pages]
    paths:
      - 'weather-mother/index.html'
      - 'weather-mother/master-v150/**'
      - 'weather-mother/HANDOFF.json'
      - 'weather-mother/MASTER_SHELL_POLICY.json'
      - 'weather-mother/UNIFIED_STUDIO_POLICY.json'
      - '.github/workflows/weather-mother-v051-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: weather-mother-master-v150-live-qa
  cancel-in-progress: true
jobs:
  public-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Install browser test tools
        run: |
          python3 -m pip install playwright==1.51.0
          python3 -m playwright install --with-deps chromium
      - name: Verify public Weather Mother master shell
        env:
          QA_SHA: ${{ github.sha }}
        run: |
          cat > /tmp/weather_master_qa.py <<'PY'
          import os,json,time,hashlib,urllib.request
          from playwright.sync_api import sync_playwright

          base='https://haihao0307.github.io/guilin-dem-pipeline/weather-mother/'
          sha=os.environ['QA_SHA']
          def get(url):
              req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'weather-mother-v150-qa'})
              with urllib.request.urlopen(req,timeout=30) as response:
                  return response.status,response.read()

          manifest=None
          for _ in range(30):
              try:
                  status,root=get(base+'index.html?qa='+sha)
                  status_m,data_m=get(base+'master-v150/MANIFEST.json?qa='+sha)
                  if status==200 and status_m==200 and b'master-v150' in root:
                      candidate=json.loads(data_m)
                      if candidate.get('version')=='1.5.0' and len(candidate.get('chunks',[]))==9:
                          manifest=candidate
                          break
              except Exception:
                  pass
              time.sleep(5)
          assert manifest is not None,'V1.5 public root or manifest unavailable'

          total=0
          for item in manifest['chunks']:
              code,data=get(base+'master-v150/'+item['file']+'?qa='+sha)
              assert code==200,(item['file'],code)
              assert len(data)==item['bytes'],(item['file'],len(data),item['bytes'])
              assert hashlib.sha256(data).hexdigest()==item['sha256'],item['file']
              total+=len(data)
          assert total==manifest['base64Bytes'],(total,manifest['base64Bytes'])

          result={'sourceCommit':sha,'payloadChunks':9,'payloadBytes':total}
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=['--no-sandbox','--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader'])
              page=browser.new_page(viewport={'width':1440,'height':900})
              errors=[];console=[];failed=[]
              page.on('pageerror',lambda e:errors.append(str(e)))
              page.on('console',lambda m:console.append(m.text) if m.type=='error' else None)
              page.on('requestfailed',lambda r:failed.append(r.url))
              response=page.goto(base+'?qa='+sha,wait_until='domcontentloaded',timeout=60000)
              assert response and response.status==200
              page.wait_for_function("document.body.dataset.weatherMotherMaster==='1.5.0'",timeout=70000)
              page.wait_for_timeout(1200)
              structure=page.evaluate("""() => ({
                title:document.title,
                master:document.body.dataset.weatherMotherMaster,
                root:document.body.dataset.weatherMotherRoot,
                module:document.body.dataset.wmModule,
                iframeCount:document.querySelectorAll('iframe').length,
                navCount:document.querySelectorAll('#wmRail [data-wm-module]').length,
                brand:document.querySelector('.wm-brand-copy strong')?.textContent?.trim(),
                rainVersion:window.WeatherLiquid?.version||null
              })""")
              assert structure['master']=='1.5.0',structure
              assert structure['root']=='true',structure
              assert structure['module']=='home',structure
              assert structure['iframeCount']==0,structure
              assert structure['navCount']==7,structure
              assert structure['brand']=='Weather Mother',structure
              result['structure']=structure

              modules={}
              for module in ['world','rain','fog','snow','cloud','storm','home']:
                  page.locator(f'#wmRail [data-wm-module="{module}"]').click()
                  page.wait_for_function('(m)=>document.body.dataset.wmModule===m',arg=module,timeout=15000)
                  modules[module]=page.locator('#wmPanel').inner_text()[:180]
                  assert modules[module].strip(),module
                  assert page.locator('.wm-brand-copy strong').inner_text().strip()=='Weather Mother'
              result['modules']=list(modules)

              page.locator('#wmRail [data-wm-module="rain"]').click()
              page.wait_for_function("window.WeatherLiquid && WeatherLiquid.getState().frames>0",timeout=60000)
              before=page.evaluate('WeatherLiquid.getState()')
              page.locator('#wmGlassTest').click()
              page.wait_for_timeout(1500)
              after=page.evaluate('WeatherLiquid.getState()')
              assert max(after['material']['glassWet'])>=max(before['material']['glassWet'])
              assert abs(after['residualKg'])<1e-8,after['residualKg']
              assert page.evaluate('WeatherLiquid.debug().error')==0
              result['rain']={'version':after['version'],'frames':after['frames'],'residualKg':after['residualKg']}
              assert not errors and not console and not failed,(errors,console,failed)
              page.close()

              mobile=browser.new_page(viewport={'width':390,'height':844})
              mobile_errors=[];mobile_console=[]
              mobile.on('pageerror',lambda e:mobile_errors.append(str(e)))
              mobile.on('console',lambda m:mobile_console.append(m.text) if m.type=='error' else None)
              response=mobile.goto(base+'?module=snow&qa='+sha,wait_until='domcontentloaded',timeout=60000)
              assert response and response.status==200
              mobile.wait_for_function("document.body.dataset.weatherMotherMaster==='1.5.0' && document.body.dataset.wmModule==='snow'",timeout=70000)
              mobile.locator('#wmMobileMenu').click()
              mobile.locator('#wmRail [data-wm-module="fog"]').click()
              mobile.wait_for_function("document.body.dataset.wmModule==='fog'",timeout=10000)
              assert mobile.locator('.wm-brand-copy strong').inner_text().strip()=='Weather Mother'
              assert mobile.locator('#wmRail [data-wm-module]').count()==7
              assert mobile.locator('iframe').count()==0
              assert not mobile_errors and not mobile_console,(mobile_errors,mobile_console)
              result['mobile']={'module':'fog','navCount':7,'passed':True}
              mobile.close();browser.close()

          result['automaticQA']='passed'
          print(json.dumps(result,ensure_ascii=False,indent=2))
          PY
          xvfb-run -a python3 -u /tmp/weather_master_qa.py
