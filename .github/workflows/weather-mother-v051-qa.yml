name: Weather Mother live QA
on:
  push:
    branches: [gh-pages]
    paths:
      - 'weather-mother/index.html'
      - 'weather-mother/engine.js'
      - 'weather-mother/cloud.glsl'
      - '.github/workflows/weather-mother-v051-qa.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: weather-mother-live-qa
  cancel-in-progress: true
jobs:
  public-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Install pinned browser test tools
        run: |
          python3 -m pip install playwright==1.51.0 Pillow==11.1.0
          python3 -m playwright install --with-deps chromium
      - name: Verify public WebGL weather and publish JSON evidence
        env:
          GH_TOKEN: ${{ github.token }}
          QA_SHA: ${{ github.sha }}
        run: |
          cat > /tmp/weather_qa.py <<'PY'
          import os,json,time,hashlib,io,base64,urllib.request,urllib.error
          from playwright.sync_api import sync_playwright
          from PIL import Image,ImageStat
          BASE='https://haihao0307.github.io/guilin-dem-pipeline/weather-mother/'
          sha=os.environ['QA_SHA']
          result={'productionLine':'Weather Mother','version':'0.5.1','sourceCommit':sha,'publicURL':BASE,'method':'live public GitHub Pages in Chromium; screenshots inspected in memory only','storedImageFiles':0,'visualAcceptance':False,'productionReady':False,'scenarios':[],'controls':{},'errors':[]}
          def get(url):
              with urllib.request.urlopen(url,timeout=25) as r:return r.status,r.read()
          def publish():
              path='weather-mother/qa-v051.json'
              url='https://api.github.com/repos/haihao0307/guilin-dem-pipeline/contents/'+path
              token=os.environ['GH_TOKEN']
              headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'}
              body={'message':'test(weather-mother): record live browser evidence','branch':'gh-pages','content':base64.b64encode(json.dumps(result,ensure_ascii=False,indent=2).encode()).decode()}
              try:
                  req=urllib.request.Request(url+'?ref=gh-pages',headers=headers)
                  with urllib.request.urlopen(req,timeout=25) as r:body['sha']=json.load(r)['sha']
              except urllib.error.HTTPError as e:
                  if e.code!=404:raise
              req=urllib.request.Request(url,data=json.dumps(body).encode(),headers=headers,method='PUT')
              with urllib.request.urlopen(req,timeout=25) as r:assert r.status in (200,201)
          try:
              html=None
              for attempt in range(18):
                  try:
                      status,html=get(BASE+'?qa='+sha)
                      if status==200 and b'WEATHER MOTHER' in html:break
                  except Exception:pass
                  time.sleep(5)
              assert html and b'WEATHER MOTHER' in html,'Public entry did not become available'
              result['http']={}
              for name in ['index.html','engine.js','cloud.glsl']:
                  status,data=get(BASE+name+'?qa='+sha)
                  assert status==200,(name,status)
                  result['http'][name]={'status':status,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()}
              with sync_playwright() as p:
                  browser=p.chromium.launch(headless=True,args=['--no-sandbox','--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader'])
                  result['browser']=browser.version
                  cases=[('fair',14.4,900,600),('fair',6.6,640,426),('fair',17.4,640,426),('fair',22,640,426),('storm',16,640,426),('snow',12,640,426),('high',15,640,426),('rainbow',17.2,640,426),('fair',14.4,390,844)]
                  for mode,hour,width,height in cases:
                      page=browser.new_page(viewport={'width':width,'height':height},device_scale_factor=1)
                      pe=[];ce=[];failed=[]
                      page.on('pageerror',lambda e:pe.append(str(e)))
                      page.on('console',lambda m:ce.append(m.text) if m.type=='error' else None)
                      page.on('requestfailed',lambda r:failed.append({'url':r.url,'failure':r.failure}))
                      page.add_init_script('window.WeatherMotherBoot='+json.dumps({'weather':mode,'hour':hour,'still':True})+';')
                      response=page.goto(BASE+'?qa='+sha,wait_until='domcontentloaded',timeout=40000)
                      assert response.status==200
                      page.wait_for_function('window.WeatherMother?.qa?.frames>=1 || window.WeatherMother?.qa?.errors?.length',timeout=50000)
                      qa=page.evaluate('WeatherMother.qa')
                      assert qa['ready'] and qa['frames']>=1 and not qa['errors'],qa
                      assert qa['borderInputMax']==0,qa
                      png=page.screenshot(timeout=50000)
                      im=Image.open(io.BytesIO(png)).convert('RGB')
                      crop=im.crop((min(width-20,max(235,width//3)),30,width,height-35))
                      stats=ImageStat.Stat(crop)
                      assert max(stats.stddev)>1,'Uniform/blank canvas'
                      assert not pe and not ce and not failed,(pe,ce,failed)
                      result['scenarios'].append({'weather':mode,'hour':hour,'viewport':[width,height],'qa':qa,'screenshotSha256':hashlib.sha256(png).hexdigest(),'canvasRgbStddev':stats.stddev,'pageErrors':pe,'consoleErrors':ce,'failedRequests':failed})
                      del png,im,crop
                      page.close()
                  page=browser.new_page(viewport={'width':600,'height':400})
                  page.add_init_script('window.WeatherMotherBoot={still:true};')
                  page.goto(BASE+'?controls='+sha,wait_until='domcontentloaded')
                  page.wait_for_function('WeatherMother?.qa?.frames>0',timeout=40000)
                  page.locator('#density').evaluate("e=>{e.value='0.3';e.dispatchEvent(new Event('input',{bubbles:true}));}")
                  page.wait_for_function('WeatherMother.getState().density<0.85',timeout=25000)
                  result['controls']['densityResponds']=True
                  page.locator('#count').evaluate("e=>{e.value='1';e.dispatchEvent(new Event('input',{bubbles:true}));}")
                  page.wait_for_function('WeatherMother.qa.groups===1',timeout=30000)
                  result['controls']['oneCloudGroup']=True
                  before=page.evaluate('WeatherMother.getState().yaw')
                  page.mouse.move(430,180);page.mouse.down();page.mouse.move(495,205,steps=4);page.mouse.up()
                  assert page.evaluate('WeatherMother.getState().yaw')!=before
                  result['controls']['orbit']=True
                  before=page.evaluate('WeatherMother.getState().distance')
                  page.mouse.wheel(0,200)
                  page.wait_for_function('(v)=>WeatherMother.getState().distance!==v',arg=before,timeout=10000)
                  result['controls']['zoom']=True
                  page.locator('[data-hour="6.6"]').click()
                  page.wait_for_function('WeatherMother.getState().hour<14',timeout=25000)
                  result['controls']['continuousDaylightTransition']=True
                  page.evaluate('WeatherMother.play()')
                  page.wait_for_function('WeatherMother.qa.windOffset[0]>0',timeout=25000)
                  assert abs(page.evaluate('WeatherMother.qa.windOffset[2]'))<0.001
                  result['controls']['westWindMovesEast']=True
                  page.evaluate('WeatherMother.pause()')
                  assert not page.evaluate('WeatherMother.getState().playing')
                  result['controls']['pause']=True
                  assert not page.evaluate('WeatherMother.qa.errors')
                  page.close();browser.close()
              result['automaticQA']='passed'
          except Exception as e:
              result['automaticQA']='failed';result['errors'].append(str(e));raise
          finally:
              result['finishedUTC']=time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime())
              print(json.dumps(result,ensure_ascii=False,indent=2))
              publish()
          PY
          xvfb-run -a python3 -u /tmp/weather_qa.py
