name: Landscape R5.K2 Microscope Geometry R1

on:
  push:
    branches:
      - feature/landscape-microscope-geometry-lab-r1-20260916
    paths:
      - workbenches/landscape-surface-r5-k2-geometry-r1/build.py
      - .github/workflows/landscape-r5-k2-geometry-r1.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build locked R5.K2 geometry candidate
        run: |
          python -m py_compile workbenches/landscape-surface-r5-k2-geometry-r1/build.py
          python workbenches/landscape-surface-r5-k2-geometry-r1/build.py

      - name: Static candidate QA
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re
          p = Path('workbenches/landscape-surface-r5-k2-geometry-r1/index.html')
          s = p.read_text(encoding='utf-8')
          b = json.loads(Path('workbenches/landscape-surface-r5-k2-geometry-r1/build.json').read_text(encoding='utf-8'))
          assert 'microscopeGeometryR1' in s
          assert 'protectedDriftCount' in s
          assert 'triangleFlipCount' in s
          assert 'fieldCoupled:false' in s
          assert b['macroGeometryReplacement'] is False
          assert b['indexOrderChangedByIntegration'] is False
          assert b['geometryFieldCoupled'] is False
          blocks = []
          for sid in ('worldSource','generateSource'):
              m = re.search(r'<script id="%s" type="text/plain">(.*?)</script>' % sid, s, re.S)
              assert m, sid
              blocks.append(m.group(1))
          Path('/tmp/landscape-worker.js').write_text('\n'.join(blocks), encoding='utf-8')
          print(json.dumps(b, ensure_ascii=False, indent=2))
          PY
          node --check /tmp/landscape-worker.js

      - name: Materialize generated candidate
        run: |
          git config user.name "Landscape Mother"
          git config user.email "actions@users.noreply.github.com"
          git add workbenches/landscape-surface-r5-k2-geometry-r1/index.html workbenches/landscape-surface-r5-k2-geometry-r1/build.json
          if git diff --cached --quiet; then
            echo "candidate already materialized"
            exit 0
          fi
          git commit -m "build(landscape): materialize R5.K2 Microscope geometry R1 [skip ci]"
          git push
