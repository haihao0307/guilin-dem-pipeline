name: Guilin continuous full map and OSM waterways

on:
  push:
    branches:
      - main
    paths:
      - viewer/**
      - pipeline/build_public_view_assets.py
      - .github/workflows/guilin-continuous-full-map.yml
      - truth/NATIVE_ELEVATION_MANIFEST.json
      - truth/OSM_HYDROLOGY_IMMUTABLE.geojson
      - contracts/**
      - knowledge/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: guilin-continuous-full-map
  cancel-in-progress: true

env:
  CANONICAL_TAG: guilin-native-12p5m-single-truth-v001
  SOURCE_FILE: guilin_raw_union_12_5m.tif
  SOURCE_BYTES: '124348471'
  SOURCE_SHA256: 9490b1bd34f67336352cf448729f763ae4e241637d821961efd0290e29d6c9d4
  HYDROLOGY_FILE: truth/OSM_HYDROLOGY_IMMUTABLE.geojson
  SITE_DIR: out/continuous-site
  ASSET_DIR: out/view-assets
  EVIDENCE_DIR: out/evidence
  PUBLIC_URL: https://haihao0307.github.io/guilin-dem-pipeline/guilin/

jobs:
  build-publish-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout unique truth main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deterministic numeric and browser dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            numpy==2.1.3 \
            rasterio==1.4.3 \
            pyproj==3.7.1 \
            shapely==2.1.1
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          command -v google-chrome || command -v chromium || command -v chromium-browser
          node --check viewer/app.js
          python -m py_compile pipeline/build_public_view_assets.py

      - name: Download and verify the locked source and all raw native tiles
        shell: bash
        run: |
          set -euo pipefail
          rm -rf out
          mkdir -p out/cache out/native-tiles "$ASSET_DIR" "$SITE_DIR/data" "$SITE_DIR/contracts" "$SITE_DIR/knowledge" "$EVIDENCE_DIR"
          gh release download "$CANONICAL_TAG" --pattern "$SOURCE_FILE" --dir out/cache --clobber
          gh release download "$CANONICAL_TAG" --pattern 'native-r*-2048x2048-i16.bin' --dir out/native-tiles --clobber
          test "$(stat -c '%s' out/cache/$SOURCE_FILE)" = "$SOURCE_BYTES"
          echo "$SOURCE_SHA256  out/cache/$SOURCE_FILE" | sha256sum -c -
          test "$(find out/native-tiles -maxdepth 1 -name 'native-r*-2048x2048-i16.bin' | wc -l)" = 54
          test "$(du -cb out/native-tiles/native-r*-2048x2048-i16.bin | tail -1 | cut -f1)" = 452984832
          test "$(stat -c '%s' "$HYDROLOGY_FILE")" = 5832414

      - name: Build one full-map numeric LOD and OSM line-waterway geometry
        shell: bash
        run: |
          set -euo pipefail
          python pipeline/build_public_view_assets.py \
            --source-tiff "out/cache/$SOURCE_FILE" \
            --hydrology "$HYDROLOGY_FILE" \
            --output-dir "$ASSET_DIR" \
            | tee "$EVIDENCE_DIR/build-public-view-assets.log"
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("out/view-assets")
          combined = json.loads((root / "continuous-full-map-assets.json").read_text(encoding="utf-8"))
          overview = json.loads((root / "overview-direct-samples-manifest.json").read_text(encoding="utf-8"))
          hydro = json.loads((root / "osm-waterways-manifest.json").read_text(encoding="utf-8"))

          assert combined["passed"] is True
          assert combined["source_sha256"] == "9490b1bd34f67336352cf448729f763ae4e241637d821961efd0290e29d6c9d4"
          assert combined["native_spacing_m"] == 12.5
          assert combined["native_tile_count"] == 54
          assert combined["height_image_texture_used"] is False
          assert overview["asset"]["selection"] == "direct_integer_source_indices"
          assert overview["asset"]["interpolation"] == "none"
          assert overview["asset"]["compression"] == "none"
          assert overview["asset"]["height_texture"] is False
          assert hydro["source"]["centerline_coordinates_mutated"] is False
          assert hydro["source"]["manual_centerline_added"] is False
          assert hydro["source"]["synthetic_gap_line_added"] is False
          assert hydro["filter"]["lake_surface_asset_emitted"] is False
          assert hydro["filter"]["reservoir_surface_asset_emitted"] is False
          assert hydro["filter"]["synthetic_surface_asset_emitted"] is False
          assert hydro["topology"]["emitted_segment_count"] > 0
          assert hydro["segments"]["compression"] == "none"
          assert hydro["nodes"]["compression"] == "none"
          PY

      - name: Assemble the online continuous map
        shell: bash
        run: |
          set -euo pipefail
          cp viewer/index.html viewer/styles.css viewer/app.js "$SITE_DIR/"
          cp truth/NATIVE_ELEVATION_MANIFEST.json "$SITE_DIR/data/"
          cp out/native-tiles/native-r*-2048x2048-i16.bin "$SITE_DIR/data/"
          cp "$ASSET_DIR"/overview-direct-samples-i16.bin "$SITE_DIR/data/"
          cp "$ASSET_DIR"/overview-direct-samples-manifest.json "$SITE_DIR/data/"
          cp "$ASSET_DIR"/osm-waterway-segments-f32.bin "$SITE_DIR/data/"
          cp "$ASSET_DIR"/osm-waterway-nodes-f32.bin "$SITE_DIR/data/"
          cp "$ASSET_DIR"/osm-waterways-manifest.json "$SITE_DIR/data/"
          cp "$ASSET_DIR"/continuous-full-map-assets.json "$SITE_DIR/data/"
          cp contracts/*.json "$SITE_DIR/contracts/"
          cp knowledge/*.json "$SITE_DIR/knowledge/"
          touch "$SITE_DIR/.nojekyll"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              "schema": "guilin-continuous-full-map-online-version/v1",
              "head": os.environ["GITHUB_SHA"],
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "source_sha256": os.environ["SOURCE_SHA256"],
              "native_spacing_m": 12.5,
              "native_tile_count": 54,
              "one_continuous_map": True,
              "continuous_zoom": True,
              "osm_linear_waterways": True,
              "lake_surface_asset_count": 0,
              "reservoir_surface_asset_count": 0,
              "height_image_texture_used": False,
              "source_tile_compression": "none",
          }
          Path("out/continuous-site/version.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          test "$(find "$SITE_DIR/data" -name 'native-r*-2048x2048-i16.bin' | wc -l)" = 54
          test "$(find "$SITE_DIR" -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.webp' \) | wc -l)" = 0
          ! grep -Eqi 'createTexture|texImage2D|texSubImage2D|sampler2D|sampler2DArray' "$SITE_DIR/app.js"
          grep -q 'one_continuous_map' "$SITE_DIR/version.json"
          grep -q '"reservoir_surface_asset_count": 0' "$SITE_DIR/version.json"
          (cd "$SITE_DIR" && find . -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)

      - name: Run local real-browser acceptance
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          python -m http.server 8765 --bind 127.0.0.1 --directory "$SITE_DIR" > "$EVIDENCE_DIR/local-http.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 80); do
            if curl --fail --silent http://127.0.0.1:8765/ >/dev/null; then break; fi
            sleep .25
          done
          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-dev-shm-usage \
            --ignore-gpu-blocklist \
            --enable-webgl \
            --use-angle=swiftshader \
            --enable-unsafe-swiftshader \
            --window-size=1600,1000 \
            --virtual-time-budget=150000 \
            --dump-dom \
            http://127.0.0.1:8765/?qa=local \
            > "$EVIDENCE_DIR/local-dom.html"
          grep -q 'data-ready="true"' "$EVIDENCE_DIR/local-dom.html"
          grep -q 'data-full-map="true"' "$EVIDENCE_DIR/local-dom.html"
          grep -q 'data-continuous-zoom="true"' "$EVIDENCE_DIR/local-dom.html"
          grep -q 'data-hydrology="true"' "$EVIDENCE_DIR/local-dom.html"
          grep -q 'data-reservoir-surface-count="0"' "$EVIDENCE_DIR/local-dom.html"
          grep -q 'data-texture-count="0"' "$EVIDENCE_DIR/local-dom.html"
          rm -f "$EVIDENCE_DIR/local-dom.html"
          kill "$SERVER_PID" 2>/dev/null || true
          trap - EXIT

      - name: Publish only the new Guilin full map path
        shell: bash
        run: |
          set -euo pipefail
          rm -rf out/gh-pages
          git clone --depth 1 --branch gh-pages \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            out/gh-pages
          rm -rf out/gh-pages/guilin
          cp -a "$SITE_DIR" out/gh-pages/guilin
          touch out/gh-pages/.nojekyll
          cd out/gh-pages
          git config user.name "Haihao_Nature Grace HK"
          git config user.email "haihao0307@gmail.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "deploy(guilin): restore continuous total map and OSM waterways"
            git push origin gh-pages
          fi

      - name: Wait for exact public version and verify public contract
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 150); do
            if curl --fail --silent "$PUBLIC_URL/version.json?run=$GITHUB_RUN_ID" > "$EVIDENCE_DIR/public-version.json" \
              && grep -q "$GITHUB_RUN_ID" "$EVIDENCE_DIR/public-version.json"; then
              break
            fi
            sleep 5
          done
          grep -q "$GITHUB_RUN_ID" "$EVIDENCE_DIR/public-version.json"
          grep -q '"one_continuous_map": true' "$EVIDENCE_DIR/public-version.json"
          grep -q '"osm_linear_waterways": true' "$EVIDENCE_DIR/public-version.json"
          grep -q '"reservoir_surface_asset_count": 0' "$EVIDENCE_DIR/public-version.json"
          curl --fail --silent "$PUBLIC_URL/data/overview-direct-samples-manifest.json?run=$GITHUB_RUN_ID" > "$EVIDENCE_DIR/public-overview.json"
          curl --fail --silent "$PUBLIC_URL/data/osm-waterways-manifest.json?run=$GITHUB_RUN_ID" > "$EVIDENCE_DIR/public-waterways.json"
          grep -q '"interpolation": "none"' "$EVIDENCE_DIR/public-overview.json"
          grep -q '"reservoir_surface_asset_emitted": false' "$EVIDENCE_DIR/public-waterways.json"
          grep -q '"centerline_coordinates_mutated": false' "$EVIDENCE_DIR/public-waterways.json"

      - name: Upload receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guilin-continuous-full-map-receipts
          path: out/evidence
          retention-days: 90

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Guilin continuous full map'
            echo
            echo "* public: $PUBLIC_URL"
            echo '* one full AOI map: yes'
            echo '* continuous zoom: yes'
            echo '* native detail: 12.5 m raw int16 tiles'
            echo '* OSM linear waterways: river, stream, canal'
            echo '* lake surfaces: 0'
            echo '* reservoir surfaces: 0'
            echo '* height textures: 0'
            echo '* source elevation delta: 0 m'
          } >> "$GITHUB_STEP_SUMMARY"
