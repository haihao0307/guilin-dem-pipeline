name: Knit P03 wool envelope candidate
on:
  push:
    branches: [feature/knit-public-p03-wool-envelope-20261015]
    paths:
      - kaopu-fabric-workbench/knit-public-p03/build.py
      - kaopu-fabric-workbench/knit-public-p03/wool-envelope.mjs
      - kaopu-fabric-workbench/knit-public-p03/refine-c2.py
      - kaopu-fabric-workbench/knit-public-p03/qa.py
      - .github/workflows/knit-public-p03.yml
permissions:
  contents: write
jobs:
  build-and-review:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          sparse-checkout: |
            kaopu-fabric-workbench/knit-public-p02
            kaopu-fabric-workbench/knit-public-p03
      - name: Generate C2 softness source and build from frozen P02 baseline
        run: |
          python kaopu-fabric-workbench/knit-public-p03/refine-c2.py
          python kaopu-fabric-workbench/knit-public-p03/build.py
      - name: Install real-browser test tools
        run: |
          python -m pip install playwright==1.56.0 pillow==11.3.0
          python -m playwright install --with-deps chromium
      - name: Render default, close, grazing and fuzz-range evidence
        run: |
          python -m http.server 8873 --directory kaopu-fabric-workbench >/tmp/p03-http.log 2>&1 &
          python kaopu-fabric-workbench/knit-public-p03/qa.py
      - name: Save C2 candidate without declaring visual acceptance
        run: |
          python - <<'PY'
          import json,pathlib,shutil
          p=pathlib.Path('kaopu-fabric-workbench/knit-public-p03')
          r=json.loads(pathlib.Path('p03-evidence/REPORT.json').read_text())
          assert r['passed']
          shutil.copytree('p03-evidence',p/'qa',dirs_exist_ok=True)
          m=json.loads((p/'BUILD_MANIFEST.json').read_text())
          m['revision']='C2'
          m['runtimeChecksPassed']=len(r['checks'])
          m['runtimeReport']='qa/REPORT.json'
          m['status']='C2_RUNTIME_CHECKED_AWAITING_USER_VISUAL_REVIEW'
          (p/'BUILD_MANIFEST.json').write_text(json.dumps(m,ensure_ascii=False,indent=2))
          PY
          BRANCH=feature/knit-public-p03-wool-envelope-20261015
          CURRENT=$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)
          test "$CURRENT" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kaopu-fabric-workbench/knit-public-p03/wool-envelope-c2.mjs \
                  kaopu-fabric-workbench/knit-public-p03/main.mjs \
                  kaopu-fabric-workbench/knit-public-p03/jacket-refined.mjs \
                  kaopu-fabric-workbench/knit-public-p03/template.html \
                  kaopu-fabric-workbench/knit-public-p03/index.html \
                  kaopu-fabric-workbench/knit-public-p03/BUILD_MANIFEST.json \
                  kaopu-fabric-workbench/knit-public-p03/THIRD_PARTY_NOTICES.txt \
                  kaopu-fabric-workbench/knit-public-p03/qa
          git commit -m 'build(knit-p03): save C2 wool softness candidate and evidence'
          git push origin "HEAD:refs/heads/$BRANCH"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: knit-p03-c2-wool-envelope-review
          path: |
            p03-evidence/
            kaopu-fabric-workbench/knit-public-p03/BUILD_MANIFEST.json
          retention-days: 14
