name: Wenzhou R3.3 JRC Global Surface Water

on:
  push:
    branches:
      - feature/wenzhou-r33-environmental-data-intake-20260908
    paths:
      - .github/workflows/wenzhou-r33-jrc-global-surface-water.yml
      - experiments/wenzhou-r33-environmental-data-intake/scripts/acquire_jrc_gsw_r33.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install geospatial tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gdal-bin python3-gdal
          python3 -m pip install --disable-pip-version-check requests
          gdalinfo --version

      - name: Read official versioned COGs by HTTP range and crop to locked domain
        run: |
          set -euo pipefail
          python3 experiments/wenzhou-r33-environmental-data-intake/scripts/acquire_jrc_gsw_r33.py \
            --output "${{ github.workspace }}/artifacts/wenzhou-r33-jrc-gsw-v1-5"

      - name: Verify payload hashes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json
          root = Path('artifacts/wenzhou-r33-jrc-gsw-v1-5')
          manifest = json.loads((root / 'PAYLOAD_MANIFEST.json').read_text(encoding='utf-8'))
          errors = []
          for item in manifest['payloads']:
              path = root / item['path']
              if not path.is_file():
                  errors.append([item['path'], 'missing'])
                  continue
              if path.stat().st_size != item['bytes']:
                  errors.append([item['path'], 'size'])
                  continue
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              if digest != item['sha256']:
                  errors.append([item['path'], 'sha256'])
          result = {'passed': bool(manifest.get('passed')) and not errors, 'checked': len(manifest['payloads']), 'errors': errors}
          (root / 'reports' / 'MANIFEST_VERIFICATION.json').write_text(json.dumps(result, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(result, indent=2))
          if not result['passed']:
              raise SystemExit(2)
          PY

      - name: Upload versioned domain subset
        uses: actions/upload-artifact@v4
        with:
          name: wenzhou-r33-jrc-global-surface-water-v1-5
          path: artifacts/wenzhou-r33-jrc-gsw-v1-5
          if-no-files-found: error
          retention-days: 14
          compression-level: 2
