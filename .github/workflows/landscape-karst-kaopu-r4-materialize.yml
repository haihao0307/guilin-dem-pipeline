name: Landscape Karst KAOPU R4 materialize

on:
  push:
    branches:
      - feature/landscape-karst-kaopu-r4-final
    paths:
      - .github/workflows/landscape-karst-kaopu-r4-materialize.yml
      - workbenches/landscape-karst-kaopu-r4/payload/**

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/landscape-karst-kaopu-r4-final
          fetch-depth: 1
          sparse-checkout: |
            workbenches/landscape-karst-kaopu-r4/payload
            .github/workflows/landscape-karst-kaopu-r4-materialize.yml
          sparse-checkout-cone-mode: false
      - name: Rebuild fixed single-file R4
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p workbenches/landscape-karst-kaopu-r4
          cat workbenches/landscape-karst-kaopu-r4/payload/part.*.b64 | base64 -d | gzip -dc > workbenches/landscape-karst-kaopu-r4/index.html
          sed -i 's/从 R4 派生的喀斯特主形重构/从 R3 派生的喀斯特主形重构/g' workbenches/landscape-karst-kaopu-r4/index.html
          sed -i 's/R4 已就绪 · R2\/R4 均保留 · 主形、断面与结构材质重构/R4 已就绪 · R2\/R3 均保留 · 主形、断面与结构材质重构/g' workbenches/landscape-karst-kaopu-r4/index.html
          test "$(sha256sum workbenches/landscape-karst-kaopu-r4/index.html | awk '{print $1}')" = "8b9b85b6a6a7d699abe49043e531ad0911cfac263672f102e8b614f18e09e66a"
          python - <<'PY'
          import json,hashlib,pathlib
          p=pathlib.Path('workbenches/landscape-karst-kaopu-r4/index.html')
          qa={
            'version':'R4',
            'htmlBytes':p.stat().st_size,
            'htmlSHA256':hashlib.sha256(p.read_bytes()).hexdigest(),
            'runtimeAssets':0,
            'textures':0,
            'externalModels':0,
            'synthetic':True,
            'visualApproved':False,
            'productionReady':False,
            'truthApproved':False,
            'notes':['R2/R3 preserved; R4 derived candidate','macro body/crown/apron rebuilt','meso bedding/fluting/fracture precede material derivation','roughness independent of albedo']
          }
          pathlib.Path('workbenches/landscape-karst-kaopu-r4/QA.json').write_text(json.dumps(qa,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Commit generated R4
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Landscape Mother"
          git config user.email "actions@users.noreply.github.com"
          git add -f workbenches/landscape-karst-kaopu-r4/index.html workbenches/landscape-karst-kaopu-r4/QA.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build(landscape): correct and materialize KAOPU karst R4"
          git push origin HEAD:feature/landscape-karst-kaopu-r4-final
