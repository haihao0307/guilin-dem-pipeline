name: Knit public P01 build and browser
on:
  push:
    branches: [feature/knit-public-lookdev-p01-20261014]
    paths:
      - kaopu-fabric-workbench/knit-public-p01/main.mjs
      - kaopu-fabric-workbench/knit-public-p01/template.html
      - kaopu-fabric-workbench/knit-public-p01/qa.py
      - kaopu-fabric-workbench/knit-public-p01/refine.py
      - .github/workflows/knit-public-p01.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          sparse-checkout: |
            kaopu-fabric-workbench/knit-public-p01
      - name: Build using only new public source and public dependencies
        run: |
          cd kaopu-fabric-workbench/knit-public-p01
          python refine.py
          npm install --no-audit --no-fund --no-save three@0.180.0 esbuild@0.25.10
          python - <<'PY'
          import urllib.request,hashlib,pathlib
          url='https://raw.githubusercontent.com/haihao0307/Humanoid-Rig-Lab-Next/7dcbcaeaf20af630195e1be2c6ff7ec8ba63467f/lighting/eb1/eb1.js'
          data=urllib.request.urlopen(url,timeout=30).read()
          assert hashlib.sha256(data).hexdigest()=='39f747e36f905eaf9e760236315ae649bcab4ffd4feb62290017c7c5da650572'
          pathlib.Path('eb1-public.js').write_bytes(data)
          PY
          node --check main.mjs
          ./node_modules/.bin/esbuild main.mjs --bundle --minify --format=iife --target=es2022 --legal-comments=inline --outfile=bundle.js
          python - <<'PY'
          import pathlib,hashlib,json,os
          r=pathlib.Path('.');code=(r/'bundle.js').read_text().replace('</script','<\/script')
          page=(r/'template.html').read_text().replace('/*__BUNDLE__*/',code)
          (r/'index.html').write_text(page)
          notices=(r/'node_modules/three/LICENSE').read_text()+'\n\nKAOPU EB1: already-public user-owned procedural lighting core. Source: haihao0307/Humanoid-Rig-Lab-Next@7dcbcaeaf20af630195e1be2c6ff7ec8ba63467f/lighting/eb1/eb1.js. Khronos PBR Neutral equations: Apache-2.0, attribution retained in embedded core.\n'
          (r/'THIRD_PARTY_NOTICES.txt').write_text(notices)
          manifest={'version':'KNIT-PUBLIC-P01','refinement':1,'sourceCommit':os.environ['GITHUB_SHA'],'status':'BUILT_REQUIRES_BROWSER_VERIFICATION','htmlSHA256':hashlib.sha256((r/'index.html').read_bytes()).hexdigest(),'htmlBytes':(r/'index.html').stat().st_size,'three':'0.180.0','EB1SHA256':hashlib.sha256((r/'eb1-public.js').read_bytes()).hexdigest(),'privateRuntimeImported':False,'nativeR15':False,'nativeR01_2Published':False,'clothPhysics':False,'externalRuntimeRequests':0,'publicURLVerified':False}
          (r/'BUILD_MANIFEST.json').write_text(json.dumps(manifest,indent=2)+'\n')
          print(json.dumps(manifest))
          PY
      - name: Install test browser
        run: |
          python -m pip install playwright==1.56.0 pillow==11.3.0
          python -m playwright install --with-deps chromium
      - name: Render and interact with compiled file
        run: |
          python -m http.server 8873 --directory kaopu-fabric-workbench/knit-public-p01 >/tmp/knit-public.log 2>&1 &
          python kaopu-fabric-workbench/knit-public-p01/qa.py
      - name: Save verified outputs without replacing existing sites
        run: |
          python - <<'PY'
          import json,pathlib,shutil
          root=pathlib.Path('kaopu-fabric-workbench/knit-public-p01');report=json.loads(pathlib.Path('qa-output/REPORT.json').read_text());assert report['passed']
          m=json.loads((root/'BUILD_MANIFEST.json').read_text());assert m['htmlSHA256']==report['htmlSHA256'];m['status']='BROWSER_VERIFIED_INDEPENDENT_SPECIMEN';m['checksPassed']=len(report['checks']);m['visualAcceptedByUser']=False;(root/'BUILD_MANIFEST.json').write_text(json.dumps(m,indent=2)+'\n')
          shutil.copytree('qa-output',root/'qa',dirs_exist_ok=True)
          PY
          BRANCH=feature/knit-public-lookdev-p01-20261014
          CURRENT=$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)
          test "$CURRENT" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kaopu-fabric-workbench/knit-public-p01/index.html kaopu-fabric-workbench/knit-public-p01/BUILD_MANIFEST.json kaopu-fabric-workbench/knit-public-p01/THIRD_PARTY_NOTICES.txt kaopu-fabric-workbench/knit-public-p01/qa kaopu-fabric-workbench/knit-public-p01/main.mjs kaopu-fabric-workbench/knit-public-p01/template.html
          git commit -m 'build(knit-public): save refined self-contained specimen and actual browser evidence'
          git push origin "HEAD:refs/heads/$BRANCH"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: knit-public-p01-browser-evidence
          path: |
            qa-output/
            kaopu-fabric-workbench/knit-public-p01/BUILD_MANIFEST.json
          retention-days: 14
