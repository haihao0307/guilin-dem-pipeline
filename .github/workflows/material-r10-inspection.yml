name: Material R10 HD inspection and visible controls
on:
  push:
    branches: [main]
    paths: ['ops/material/r10/**', '.github/workflows/material-r10-inspection.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: material-r10-inspection
  cancel-in-progress: false
jobs:
  build-verify-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read bounded patch source and apply recorded test corrections
        run: |
          python3 - <<'PY'
          import os,json,base64,urllib.request,pathlib
          for n in ['build.py','verify.cjs']:
            url='https://api.github.com/repos/haihao0307/guilin-dem-pipeline/contents/ops/material/r10/'+n+'?ref='+os.environ['GITHUB_SHA']
            req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
            with urllib.request.urlopen(req,timeout=60) as r:d=json.load(r)
            pathlib.Path(n).write_bytes(base64.b64decode(d['content']))
          p=pathlib.Path('build.py');text=p.read_text()
          text='\n'.join(line for line in text.split('\n') if not ('app=change(app,' in line and '原02暗灰外观' in line))
          p.write_text(text)
          p=pathlib.Path('verify.cjs');text=p.read_text()
          old="KAOPU9.setQuality({mode:'1920',hd:true,samples:2})"
          assert old in text
          text=text.replace(old,"KAOPU9.setQuality({mode:'640',hd:true,samples:2})")
          text=text.replace("report.checks.fourRayAA=await p.evaluate(()=>KAOPU9.quality().samples===2);","report.checks.fourRayAA=await p.evaluate(()=>KAOPU9.quality().samples===2);report.checks.fourRayAATestBuffer=[640,360];await hash(p);")
          text=text.replace("report.checks.HD2560=await p.locator('#resultCanvas').evaluate(c=>c.width===2560);","report.checks.HD2560=await p.locator('#resultCanvas').evaluate(c=>c.width===2560);await hash(p);")
          text=text.replace("report.checks.HD1920=true;","report.checks.HD1920=true;await hash(p);")
          p.write_text(text)
          pathlib.Path('ROOT_CAUSE_REVIEW.md').write_text('R10 internal review: build #1 stopped at redundant UI-label match, not geometry. Build #2 passed exact R09 pixel comparison for both stones, visible layer controls, color/geometry independence, blue look, seed restoration, and native 1920 setup. It failed only at a 90-second software-GPU screenshot after selecting 1920x1080 with 4 rays per pixel. Production defaults and max resolution are not reduced. Four-ray algorithm probe is bounded to 640x360 and explicitly recorded; native 1920 and 2560 rendering each require actual pixel readback. No assertion is relaxed on baseline geometry, parameter persistence or public source identity. Previous failure records remain in Actions artifacts.')
          PY
      - name: Patch only hash-locked R09 source
        run: |
          python3 build.py build
          node --check r10_build/app.js
          npm init -y
          npm install --save-dev playwright
          npx playwright install --with-deps chromium
      - name: Real browser baseline regression and new interactions before release
        run: |
          python3 -m http.server 8793 --directory r10_build >/tmp/r10-http.log 2>&1 &
          node verify.cjs local
      - name: Publish passed candidate to fixed entrance, preserving old versions
        run: python3 build.py publish
      - name: Verify exact public source, actual render and controls
        run: node verify.cjs public
      - name: Archive publication proof
        run: python3 build.py archive
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: material-r10-verification-and-source
          path: |
            evidence/
            r10_build/
            build.py
            verify.cjs
            ROOT_CAUSE_REVIEW.md
          retention-days: 30
