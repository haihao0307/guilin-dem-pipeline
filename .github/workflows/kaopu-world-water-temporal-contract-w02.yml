name: KAOPU W02 world water temporal contract

on:
  push:
    branches:
      - coordination/kaopu-learning-flywheel-r1-20260909
    paths:
      - 'docs/mother_coordination/kaopu_learning_flywheel_v1/PROBES/world_water_temporal_contract_w02.mjs'
      - 'docs/mother_coordination/kaopu_learning_flywheel_v1/references/world-water-temporal-contract-w02/SOURCE_LOCK.json'
      - '.github/workflows/kaopu-world-water-temporal-contract-w02.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run W02 temporal accounting probe
        run: |
          node docs/mother_coordination/kaopu_learning_flywheel_v1/PROBES/world_water_temporal_contract_w02.mjs /tmp/world_water_temporal_contract_result_w02.json
          diff -u \
            <(jq -S . docs/mother_coordination/kaopu_learning_flywheel_v1/PROBES/world_water_temporal_contract_result_w02.json) \
            <(jq -S . /tmp/world_water_temporal_contract_result_w02.json)
      - name: Upload exact result
        uses: actions/upload-artifact@v4
        with:
          name: kaopu-w02-world-water-temporal-contract
          path: /tmp/world_water_temporal_contract_result_w02.json
          if-no-files-found: error
