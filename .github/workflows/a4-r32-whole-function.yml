name: A4 R32 whole functional research QA
on:
  push:
    branches: ['trial/a4-r32-normal-chrome-20261027']
    paths:
      - 'kaopu-train-workbench/a4-steam-function-r32/**'
      - '.github/workflows/a4-r32-whole-function.yml'
permissions:
  contents: read
jobs:
  verify-r32:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: kaopu-train-workbench/a4-steam-function-r32
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            kaopu-train-workbench/a4-steam-connection-r31
            kaopu-train-workbench/a4-steam-function-r32
      - name: Actual analytic fields and retained modules
        run: |
          node r32-tests/check-upstream-geometry.cjs
          node r32-tests/check-whole-source-integration.cjs
          node r32-tests/independent/audit-actual-r32.cjs . ../a4-steam-connection-r31
          node r32-tests/independent/audit-neighbors.cjs .
          node r32-tests/independent/audit-boiler-interval.cjs .
          node r32-tests/independent/audit-interval-shader-integration.cjs .
          node test-steam-path.js .
          node test-steam-joint-hardware.js
          node test-steam-lumen-stations.js
          node test_dynamic_js.js
          node test-expression-parity.js
          node material-wave-study/test-material-waves.js
      - name: Install pinned browser test dependency
        run: |
          python -m pip install playwright==1.57.0
          google-chrome --version
          test -x /opt/google/chrome/chrome
          test -r /etc/apparmor.d/chrome
          cat /etc/apparmor.d/chrome
          ls -l /opt/google/chrome/chrome-sandbox
      - name: Diagnostic only - native ray range signs and uniform4096 interval
        run: |
          node r32-tests/check-interval-stackless.cjs
          node r32-tests/boiler-probe-capture.cjs
          set +e
          timeout 180s python r32-tests/boiler-isolated-probes.py
          result=$?
          set -e
          if [ "$result" -eq 124 ]; then
            python -c "import json,pathlib;p=pathlib.Path('r32-tests/BOILER_ISOLATED_RESULT.json');r=json.loads(p.read_text()) if p.exists() else {};r.update(status='DIAGNOSTIC_180S_TIMEOUT',whole_frame_accepted=False);p.write_text(json.dumps(r,indent=2))"
          fi
          exit "$result"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: a4-r32-whole-${{ github.sha }}
          path: |
            kaopu-train-workbench/a4-steam-function-r32/r32-tests/*RESULT.json
            kaopu-train-workbench/a4-steam-function-r32/r32-tests/*.png
            kaopu-train-workbench/a4-steam-function-r32/r32-tests/independent/*AUDIT.json
