name: Bootstrap Yangshuo noise terrain v3.1

on:
  push:
    branches:
      - skill/dem-procedural-landscape-v010
    paths:
      - .github/workflows/bootstrap-yangshuo-noise-terrain-v310.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-yangshuo-noise-terrain-v310
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Decode and validate implementation bundle
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .bootstrap -maxdepth 1 -type f -name 'yangshuo-noise-v310.part*' | wc -l)" -eq 5
          cat .bootstrap/yangshuo-noise-v310.part* | base64 --decode > "$RUNNER_TEMP/yangshuo-noise-v310.tar.gz"
          echo "0f75c698421a73f958b3210a5145dfe1aec531bdeb3d55569bf68ce73bdf666b  $RUNNER_TEMP/yangshuo-noise-v310.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/yangshuo-noise-v310.tar.gz" -C .
          test -s web/yangshuo-noise-terrain-v310/index.html
          test -s projects/guilin/config/yangshuo_noise_terrain_v310.json
          test -s skills/dem-procedural-landscape/branches/terrain-geomorphology/NOISE_DISTILLATION_V310.md
          test -s tools/procedural_landscape/yangshuo_noise_v310_browser_qa.py
          test -s .github/workflows/publish-yangshuo-noise-terrain-v310.yml
          python -m json.tool projects/guilin/config/yangshuo_noise_terrain_v310.json > /dev/null
          python -m py_compile tools/procedural_landscape/yangshuo_noise_v310_browser_qa.py
          rm -rf .bootstrap
          rm -rf tools/procedural_landscape/__pycache__
          rm -f .github/workflows/publish-yangshuo-noise-terrain-v310.yml

      - name: Commit implementation to the existing Draft PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "feat(guilin): add TSL noise terrain v3.1"
          git push origin HEAD:skill/dem-procedural-landscape-v010
