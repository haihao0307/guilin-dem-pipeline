name: Walled city pair R03 real perspective review
on:
  push:
    branches: ['qa/walled-city-pair-r03-20261012']
permissions:
  contents: read
jobs:
  pair-perspective-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 48
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01/walled-city-pair-r03
      - name: Install official pinned Playwright
        run: |
          npm install --prefix "$RUNNER_TEMP/wgpu" --no-save --ignore-scripts --no-audit --no-fund playwright@1.57.0
          "$RUNNER_TEMP/wgpu/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/wgpu/node_modules" >> "$GITHUB_ENV"
      - name: Check compact world and original source binding
        run: node --test kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01/walled-city-pair-r03/tests/*.test.mjs
      - name: Render two whole buildings through actual WebGPU
        run: DEBUG=pw:browser node kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01/walled-city-pair-r03/qa/run.cjs
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: walled-city-pair-r03-${{ github.sha }}
          path: walled-city-pair-r03-results/
          retention-days: 7
