name: Guard warm A-B and complete isolated inspection package
on:
  push:
    branches: ['trial/lowrise-glass-fix-20261022']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            kaopu-geography-workbench/kowloon-building-mother-r01
            kaopu-geography-workbench/hk-three-buildings-r01
      - name: Freeze runtime and build full dependency closure
        run: |
          python kaopu-geography-workbench/kowloon-building-mother-r01/tests/build-glass-inspection.py kaopu-geography-workbench inspection-c69a5f19
      - name: Install pinned supported browser
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Start isolated server
        run: python -m http.server 8765 >/tmp/server.log 2>&1 &
      - name: Same-process warm guard A-B and exact-package desktop/mobile first frame
        run: timeout 780s python -u kaopu-geography-workbench/kowloon-building-mother-r01/tests/glass-inspection-browser.py --output inspection-evidence
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: inspection-guard-ab-${{ github.sha }}
          path: |
            inspection-evidence
            PUBLISH_PLAN.json
          retention-days: 1
