name: Verify published c69 inspection entry and exact dependency closure
on:
  push:
    branches: ['trial/lowrise-glass-fix-20261022']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            kaopu-geography-workbench/kowloon-building-mother-r01
            kaopu-geography-workbench/hk-three-buildings-r01
      - name: Freeze runtime and build full dependency closure
        run: |
          python kaopu-geography-workbench/kowloon-building-mother-r01/tests/build-glass-inspection.py kaopu-geography-workbench inspection-c69a5f19
      - name: Install pinned supported browser
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Public exact82 hashes and desktop/mobile UI case switching
        run: timeout 780s python -u kaopu-geography-workbench/kowloon-building-mother-r01/tests/glass-public-browser.py --output public-inspection-evidence --skip-ab --url https://haihao0307.github.io/guilin-dem-pipeline/kaopu-geography-workbench/kowloon-building-mother-r01/inspection-c69a5f19/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: inspection-public-${{ github.sha }}
          path: |
            public-inspection-evidence
            PUBLISH_PLAN.json
          retention-days: 1
