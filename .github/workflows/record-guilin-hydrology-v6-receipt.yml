name: Record Guilin hydrology v6 receipt

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/record-guilin-hydrology-v6-receipt.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read the exact successful public build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_JSON="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?branch=main&per_page=100" --jq '[.workflow_runs[] | select(.name=="Guilin distilled knowledge runtime" and .status=="completed" and .conclusion=="success")][0]')"
          test "$RUN_JSON" != null
          RUN_ID="$(jq -r .id <<<"$RUN_JSON")"
          BUILD_SHA="$(jq -r .head_sha <<<"$RUN_JSON")"
          echo "RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          echo "BUILD_SHA=$BUILD_SHA" >> "$GITHUB_ENV"
          BASE='https://haihao0307.github.io/guilin-dem-pipeline/guilin'
          mkdir -p /tmp/guilin-v6-public
          curl --fail --silent "$BASE/version.json?build=$BUILD_SHA" -o /tmp/guilin-v6-public/version.json
          curl --fail --silent "$BASE/data/osm-waterways-manifest.json?build=$BUILD_SHA" -o /tmp/guilin-v6-public/hydrology.json
          curl --fail --silent "$BASE/data/guilin-distilled-knowledge.json?build=$BUILD_SHA" -o /tmp/guilin-v6-public/knowledge.json
          jq -e --arg sha "$BUILD_SHA" '.head==$sha and .distilled_knowledge_runtime==true and .full_truth_downloaded_on_page_open==false' /tmp/guilin-v6-public/version.json >/dev/null
          jq -e '.direction.li_gui_continuity.connected==true and .direction.li_gui_continuity.continues_south_of_yangshuo==true and .topology.runtime_route_fragment_count==0 and .topology.runtime_downstream_closure_failure_count==0' /tmp/guilin-v6-public/hydrology.json >/dev/null
      - name: Replace stale receipts with the current semantic receipt
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          root=Path('/tmp/guilin-v6-public')
          version=json.loads((root/'version.json').read_text())
          hydro=json.loads((root/'hydrology.json').read_text())
          knowledge=json.loads((root/'knowledge.json').read_text())
          li=hydro['styling']['mainstem_routes']['li']
          selection=hydro['runtime']['selection']
          receipt={
            'schema':'guilin-hydrology-v6-public-receipt/v1',
            'status':'AUTOMATED_PUBLIC_QA_PASSED_AWAITING_USER_VISUAL_ACCEPTANCE',
            'public_url':f"https://haihao0307.github.io/guilin-dem-pipeline/guilin/?build={os.environ['BUILD_SHA']}",
            'workflow_run_id':int(os.environ['RUN_ID']),
            'public_build_head':os.environ['BUILD_SHA'],
            'semantic_revision':hydro['styling']['semantic_revision'],
            'li_gui_mainstem':{
              'connected':hydro['direction']['li_gui_continuity']['connected'],
              'continues_south_of_yangshuo':hydro['direction']['li_gui_continuity']['continues_south_of_yangshuo'],
              'segment_count':li['segment_count'],
              'named_source_segment_count':li['named_source_segment_count'],
              'downstream_extension_segment_count':li['downstream_extension_segment_count'],
              'length_m':li['length_m'],
              'headwater_width_m':li['headwater_width_m'],
              'downstream_bankfull_width_m':li['downstream_bankfull_width_m'],
              'downstream_northing_epsg32649':li['downstream_northing_epsg32649'],
              'progress_range':[li['progress_min'],li['progress_max']],
              'colour_direction':'upstream light to downstream dark',
            },
            'flow_direction':{
              'segment_vertex_order':hydro['direction']['segment_vertex_order'],
              'flow_progress_monotonic':hydro['direction']['flow_progress_monotonic'],
              'flow_distance_monotonic':hydro['direction']['flow_distance_monotonic'],
              'future_flow_animation_ready':hydro['direction']['future_flow_animation_ready'],
            },
            'minor_waterways':{
              'selected_segment_count':hydro['topology']['segment_count'],
              'selected_route_count':selection['selected_route_count'],
              'runtime_route_fragment_count':hydro['topology']['runtime_route_fragment_count'],
              'downstream_closure_failure_count':selection['downstream_closure_failure_count'],
              'segment_level_random_sampling':selection['segment_level_random_sampling'],
              'mid_chain_segment_cutting':selection['mid_chain_segment_cutting'],
              'selection_policy':selection['selection_policy'],
            },
            'online_runtime':{
              'viewer_directory_bytes_excluding_sha256s':version['viewer_directory_bytes_excluding_sha256s'],
              'initial_numeric_data_bytes':version['initial_numeric_data_bytes'],
              'native_tile_delivery':version['native_tile_delivery'],
              'native_tiles_in_viewer_directory':version['native_tiles_in_viewer_directory'],
              'full_truth_downloaded_on_page_open':version['full_truth_downloaded_on_page_open'],
              'stale_public_assets_allowed':version['stale_public_assets_allowed'],
            },
            'truth':knowledge['truth'],
            'water_surfaces':{
              'lake_surface_asset_count':0,
              'reservoir_surface_asset_count':0,
              'synthetic_surface_asset_count':0,
            },
            'approvals':{'visualAcceptance':False,'productionReady':False},
          }
          qa=Path('qa')
          qa.mkdir(exist_ok=True)
          for path in qa.glob('*.json'):
              path.unlink()
          (qa/'GUILIN_HYDROLOGY_V6_PUBLIC_RECEIPT.json').write_text(json.dumps(receipt,ensure_ascii=False,indent=2)+'\n')
          PY
          rm -f .github/workflows/record-guilin-hydrology-v6-receipt.yml
      - name: Commit one current receipt and align canonical branch
        run: |
          set -euo pipefail
          git config user.name 'Haihao_Nature Grace HK'
          git config user.email 'haihao0307@gmail.com'
          git add -A
          git commit -m 'docs(guilin): record connected Li Gui hydrology v6 public receipt'
          FINAL_SHA="$(git rev-parse HEAD)"
          git push origin HEAD:main
          git push origin HEAD:truth/guilin-dem-12p5m-canonical --force
          echo "FINAL_SHA=$FINAL_SHA" >> "$GITHUB_ENV"
      - name: Summary
        run: |
          {
            echo '## Guilin hydrology v6 receipt'
            echo
            echo "* public build: $BUILD_SHA"
            echo "* workflow run: $RUN_ID"
            echo "* main and canonical receipt commit: $FINAL_SHA"
            echo '* Li to Gui direction: upstream to downstream'
            echo '* continuation south of Yangshuo: verified'
            echo '* minor route fragments: zero by contract'
          } >> "$GITHUB_STEP_SUMMARY"
