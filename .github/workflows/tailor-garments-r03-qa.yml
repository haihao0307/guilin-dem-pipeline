name: Tailor basic sleeveless top R04 PUBLIC read-only QA
on:
  pull_request:
    branches: [gh-pages]
    paths:
      - 'kaopu-tailor-workbench/garments-r04/**'
      - '.github/workflows/tailor-garments-r03-qa.yml'
permissions:
  contents: read
concurrency:
  group: tailor-garments-r04-${{ github.ref }}
  cancel-in-progress: true
jobs:
  garment-browser:
    if: github.head_ref == 'qa/tailor-garments-r03-20261006'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            kaopu-tailor-workbench
            kaopu-human-overview
          sparse-checkout-cone-mode: true
      - name: Install exact official test dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/tailor-test" --no-save --ignore-scripts playwright@1.57.0
          "$RUNNER_TEMP/tailor-test/node_modules/.bin/playwright" install --with-deps chromium webkit
          cd kaopu-tailor-workbench/garments-r04
          npm install --ignore-scripts
      - name: Original and structured cases unchanged
        run: cd kaopu-tailor-workbench && npm run check
      - name: Nine bounded paper parameter combinations
        run: cd kaopu-tailor-workbench/garments-r04 && npm test
      - name: Verify all published case bytes over HTTPS
        run: |
          python3 - <<'PY2'
