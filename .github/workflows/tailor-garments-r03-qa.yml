      - name: Actual browser reconstruction in two engines
        env:
          TAILOR_URL: https://haihao0307.github.io/guilin-dem-pipeline/kaopu-tailor-workbench/garments-r04/
          NODE_PATH: ${{ runner.temp }}/tailor-test/node_modules
          TAILOR_BROWSER: ${{ matrix.browser }}
        run: |
          node kaopu-tailor-workbench/garments-r04/tests/browser.cjs
      - name: Keep actual screenshots and numerical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tailor-garments-r04-public-evidence-${{ matrix.browser }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            garments-chromium/*
            garments-webkit/*
