name: Tailor short-sleeve construction R05 PUBLIC read-only QA
on:
  pull_request:
    branches: [gh-pages]
    paths:
      - 'kaopu-tailor-workbench/garments-r05/**'
      - '.github/workflows/tailor-garments-r03-qa.yml'
permissions:
  contents: read
concurrency:
  group: tailor-garments-r05-${{ github.ref }}
  cancel-in-progress: true
jobs:
  garment-browser:
    if: github.head_ref == 'qa/tailor-garments-r03-20261006'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            kaopu-tailor-workbench
            kaopu-human-overview
          sparse-checkout-cone-mode: true
      - name: Install exact official test dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/tailor-test" --no-save --ignore-scripts playwright@1.57.0
          "$RUNNER_TEMP/tailor-test/node_modules/.bin/playwright" install --with-deps chromium webkit
      - name: Original and structured cases unchanged
        run: cd kaopu-tailor-workbench && npm run check
      - name: Fixed scope and shared dependencies
        run: cd kaopu-tailor-workbench/garments-r05 && node tests/files.test.mjs
      - name: Nine bounded paper parameter combinations
        run: cd kaopu-tailor-workbench/garments-r05 && npm test
      - name: Verify every public tailor file and shared dependency
        run: |
          python3 - <<'PY2'
          import subprocess,hashlib,json,urllib.request,time,concurrent.futures,os
          rows=[]
          for line in subprocess.check_output(['git','ls-tree','-r','HEAD','--','kaopu-tailor-workbench'],text=True).splitlines():
              meta,path=line.split('\t',1)
              mode,kind,sha=meta.split()
              if kind=='blob': rows.append({'path':path,'expectedGitBlobSha1':sha})
          def check(item):
              errors=[]
              for attempt in range(5):
                  try:
                      url='https://haihao0307.github.io/guilin-dem-pipeline/'+item['path']+'?verify='+os.environ['GITHUB_SHA']
                      with urllib.request.urlopen(url,timeout=60) as response: data=response.read();status=response.status
                      actual=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
                      assert actual==item['expectedGitBlobSha1'],item['path']
                      return {**item,'actual':actual,'status':status,'bytes':len(data),'retryErrors':errors,'passed':True}
                  except Exception as e: errors.append(str(e));time.sleep(5)
              return {**item,'retryErrors':errors,'passed':False}
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool: result=list(pool.map(check,rows))
          report={'passed':all(x['passed'] for x in result),'files':len(result),'newFiles':sum('/garments-r05/' in x['path'] for x in result),'results':result}
          print('R05_PUBLIC_HASH_RESULT '+json.dumps(report))
          assert report['passed']
          PY2
      - name: Actual browser reconstruction in two engines
        env:
          TAILOR_URL: https://haihao0307.github.io/guilin-dem-pipeline/kaopu-tailor-workbench/garments-r05/
          NODE_PATH: ${{ runner.temp }}/tailor-test/node_modules
          TAILOR_BROWSER: ${{ matrix.browser }}
        run: node kaopu-tailor-workbench/garments-r05/tests/browser.cjs
      - name: Keep actual screenshots and numerical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tailor-garments-r05-public-evidence-${{ matrix.browser }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            garments-chromium/*
            garments-webkit/*
