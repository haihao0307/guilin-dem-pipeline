name: Tailor unified published desktop and new-dimension full solve QA
on:
  pull_request:
    branches: [gh-pages]
    paths:
      - 'kaopu-tailor-workbench/**'
      - '.github/workflows/tailor-garments-r03-qa.yml'
      - '.github/tailor-public/**'
permissions:
  contents: read
concurrency:
  group: tailor-unified-public-${{ github.ref }}
  cancel-in-progress: true
jobs:
  interface:
    if: github.head_ref == 'qa/tailor-garments-r03-20261006'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            kaopu-tailor-workbench
            .github/tailor-public
      - name: Official browser test dependency
        run: |
          npm install --prefix "$RUNNER_TEMP/tailor-test" --no-save --ignore-scripts playwright@1.57.0
          "$RUNNER_TEMP/tailor-test/node_modules/.bin/playwright" install --with-deps chromium webkit
      - name: Published bytes and desktop case transitions
        env:
          NODE_PATH: ${{ runner.temp }}/tailor-test/node_modules
          TAILOR_BROWSER: ${{ matrix.browser }}
          TAILOR_SUITE: layout
          TAILOR_URL: https://haihao0307.github.io/guilin-dem-pipeline/kaopu-tailor-workbench/
        run: |
          node .github/tailor-public/public-files.mjs
          node .github/tailor-public/public-browser.cjs
      - name: Actual published desktop evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tailor-public-interface-${{ matrix.browser }}
          retention-days: 7
          path: |
            tailor-layout-*/**
            tailor-public-hash/**
  garments:
    needs: interface
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
        case: [shorts, sleeveless, shortsleeve]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: .github/tailor-public
      - name: Official browser test dependency
        run: |
          npm install --prefix "$RUNNER_TEMP/tailor-test" --no-save --ignore-scripts playwright@1.57.0
          "$RUNNER_TEMP/tailor-test/node_modules/.bin/playwright" install --with-deps chromium webkit
      - name: Public HTTPS actual new dimensions and complete unchanged solve
        env:
          NODE_PATH: ${{ runner.temp }}/tailor-test/node_modules
          TAILOR_BROWSER: ${{ matrix.browser }}
          TAILOR_CASE: ${{ matrix.case }}
          TAILOR_SUITE: garment
          TAILOR_URL: https://haihao0307.github.io/guilin-dem-pipeline/kaopu-tailor-workbench/
        run: node .github/tailor-public/public-browser.cjs
      - name: Actual new garment 2048 front and back views
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tailor-public-${{ matrix.case }}-${{ matrix.browser }}
          retention-days: 7
          path: tailor-garment-*/**
