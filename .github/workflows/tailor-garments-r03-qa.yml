name: Tailor complete shorts R03 read-only QA
on:
  pull_request:
    branches: [gh-pages]
    paths:
      - 'kaopu-tailor-workbench/garments-r03/**'
      - '.github/workflows/tailor-garments-r03-qa.yml'
permissions:
  contents: read
concurrency:
  group: tailor-garments-r03-${{ github.ref }}
  cancel-in-progress: true
jobs:
  garment-browser:
    if: github.head_ref == 'qa/tailor-garments-r03-20261006'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            kaopu-tailor-workbench
            kaopu-human-overview
          sparse-checkout-cone-mode: true
      - name: Install exact official test dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/tailor-test" --no-save --ignore-scripts playwright@1.57.0
          "$RUNNER_TEMP/tailor-test/node_modules/.bin/playwright" install --with-deps chromium webkit
          cd kaopu-tailor-workbench/garments-r03
          npm install --ignore-scripts
      - name: Original and structured cases unchanged
        run: cd kaopu-tailor-workbench && npm run check
      - name: Nine bounded paper parameter combinations
        run: cd kaopu-tailor-workbench/garments-r03 && npm test
      - name: Verify all published case bytes over HTTPS
        run: |
          python3 - <<'PY2'
          import hashlib,json,time,urllib.request
          from pathlib import Path
          root=Path('kaopu-tailor-workbench/garments-r03')
          base='https://haihao0307.github.io/guilin-dem-pipeline/kaopu-tailor-workbench/garments-r03/'
          expected={x['path']:x['sha256'] for x in json.loads((root/'MANIFEST.json').read_text())['files']}
          for path in ['MANIFEST.json','SHA256SUMS.txt']:
              expected[path]=hashlib.sha256((root/path).read_bytes()).hexdigest()
          for path,digest in expected.items():
              last=None
              for attempt in range(5):
                  try:
                      with urllib.request.urlopen(base+path+'?verify=3186499c3e3705a03edab608b759b8a3ea25bdfe',timeout=60) as response:
                          data=response.read()
                      assert hashlib.sha256(data).hexdigest()==digest,path
                      last=None
                      break
                  except Exception as error:
                      last=error
                      time.sleep(8)
              if last: raise last
          print('R03_PUBLIC_BYTES_VERIFIED',len(expected))
          PY2
      - name: Actual browser reconstruction in two engines
        env:
          TAILOR_URL: https://haihao0307.github.io/guilin-dem-pipeline/kaopu-tailor-workbench/garments-r03/
          NODE_PATH: ${{ runner.temp }}/tailor-test/node_modules
          TAILOR_BROWSER: ${{ matrix.browser }}
        run: |
          node kaopu-tailor-workbench/garments-r03/tests/browser.cjs
      - name: Keep actual screenshots and numerical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tailor-garments-r03-evidence-${{ matrix.browser }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            garments-chromium/*
            garments-webkit/*
