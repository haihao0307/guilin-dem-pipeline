name: MP05 fast start and physical replay acceptance
on:
  push:
    branches: [perf/tailor-mp05-fast-runtime-20261013]
    paths: ['kaopu-tailor-workbench/material-products/mp05-build/**','.github/workflows/tailor-mp05-fast-runtime.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    permissions:
      contents: write
    outputs:
      url: ${{ steps.publish.outputs.url }}
      source: ${{ steps.publish.outputs.source }}
      public: ${{ steps.publish.outputs.public }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: project
          sparse-checkout: |
            kaopu-tailor-workbench/material-products/r04-4-2
            kaopu-tailor-workbench/material-products/mp05-build
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build exact reference-solved default states and explicit material aggregation
        run: |
          cp -a project/kaopu-tailor-workbench/material-products/r04-4-2 runtime
          python project/kaopu-tailor-workbench/material-products/mp05-build/prepare.py runtime
          python -m pip install numpy pillow
          python runtime/bake-tiles.py
          node runtime/build-fast-cache.mjs
          node --check runtime/app.mjs
          node --check runtime/adaptive-solid.mjs
          node --check runtime/fast-motion-controller.mjs
          node runtime/unit.mjs
          node runtime/test-fast.mjs
      - name: First actual Chromium execution before publishing
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
          python -m http.server 8765 --bind 127.0.0.1 --directory runtime >/tmp/http.log 2>&1 &
          QA_URL=http://127.0.0.1:8765/ QA_LOOK=D01 node runtime/qa-fast.cjs
      - name: Save readable complete source and a new fixed public directory
        id: publish
        run: |
          rm -rf runtime/recovery-evidence
          python runtime/_build/publish-snapshot.py runtime project
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mp05-stage-evidence
          path: |
            /tmp/MP04_PUBLIC_STAGE.json
            runtime/FAST_UNIT_REPORT.json
            runtime/UNIT_REPORT.json
            runtime/evidence-D01
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: mp05-runtime
          path: runtime
          retention-days: 30
  bytes:
    needs: stage
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Read and verify the frozen public bytes
        env:
          URL: ${{ needs.stage.outputs.url }}
          SOURCE: ${{ needs.stage.outputs.source }}
        run: |
          python - <<'PY'
          import os,json,urllib.request,time,hashlib,concurrent.futures
          base=os.environ['URL'];source=os.environ['SOURCE'];manifest=None
          def read(n):
              with urllib.request.urlopen(base+n,timeout=45) as r:return r.read()
          for attempt in range(85):
              try:
                  manifest=json.loads(read('BUILD_MANIFEST.json'))
                  if manifest.get('sourceCommit')==source:break
              except Exception:pass
              time.sleep(8)
          assert manifest and manifest['sourceCommit']==source and manifest['version']=='MP05-R1'
          def check(item):
              n,e=item
              for i in range(3):
                  try:
                      b=read(n);assert len(b)==e['bytes'] and hashlib.sha256(b).hexdigest()==e['sha256'],n;return n
                  except Exception:
                      if i==2:raise
                      time.sleep(1)
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:files=list(pool.map(check,manifest['files'].items()))
          state={'passed':True,'source':source,'url':base,'files':len(files),'manifest':manifest}
          json.dump(state,open('/tmp/PUBLIC_BYTES.json','w'),indent=2);print('FIXED_PUBLIC_BYTES_PASS',len(files))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mp05-public-bytes
          path: /tmp/PUBLIC_BYTES.json
          retention-days: 30
  browser:
    needs: [stage,bytes]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        look: [K04,L04,D01]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mp05-runtime
          path: runtime
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.58.2 && npx playwright install --with-deps chromium
      - name: Cold warm real wall-clock motion and actual completed GPU frames on HTTPS
        env:
          QA_URL: ${{ needs.stage.outputs.url }}
          RUNTIME_SOURCE: ${{ needs.stage.outputs.source }}
          QA_LOOK: ${{ matrix.look }}
          QA_DETAIL: '1'
        run: node runtime/qa-fast.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mp05-public-${{ matrix.look }}
          path: runtime/evidence-${{ matrix.look }}
          retention-days: 30
  receipt:
    needs: [stage,bytes,browser]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.stage.outputs.source }}
          sparse-checkout: kaopu-tailor-workbench/material-products/r05
      - uses: actions/download-artifact@v4
        with:
          pattern: mp05-public-*
          path: /tmp/evidence
      - name: Record measured scope without claiming live physics or hardware FPS
        env:
          URL: ${{ needs.stage.outputs.url }}
          SOURCE: ${{ needs.stage.outputs.source }}
          PUBLIC: ${{ needs.stage.outputs.public }}
        run: |
          python - <<'PY'
          import os,json,pathlib,datetime,shutil
          e=pathlib.Path('/tmp/evidence');reports=[json.loads(p.read_text()) for p in e.rglob('BROWSER_REPORT.json')]
          assert len(reports)==3 and all(r['passed'] and r['realPublicNetwork'] for r in reports)
          states=[]
          for r in reports:
              motions=[c for c in r['cases'] if 'motion' in c]
              assert len(motions)==4 and all(c['solverMessages']==0 and c['sdfLoads']==0 and c['finalFrame']==180 for c in motions)
              states.append({'look':r['look'],'coldFirstCompleteFrameMS':r['coldFirstCompleteFrameMS'],'warmFirstCompleteFrameMS':r['warmFirstCompleteFrameMS'],'motions':[{k:c[k] for k in ['motion','activationMS','wallMS','deliveredFrames','deliveredFPS']} for c in motions]})
          state={'version':'MP05-R1','fixedURL':os.environ['URL'],'sourceCommit':os.environ['SOURCE'],'publicCommit':os.environ['PUBLIC'],'verifiedPreview':True,'fullUserTaskComplete':False,'livePhysicsRealtime':False,'allHardware60FPS':False,'userAccepted':False,'physicalDeviceTested':False,'referencePhysicsPreserved':True,'cachedMotionLooks':['K04','L04','D01','D04'],'normalViewMaterialApproximation':True,'measurements':states,'workflowRun':os.environ['GITHUB_RUN_ID'],'verifiedAt':datetime.datetime.now(datetime.timezone.utc).isoformat()}
          p=pathlib.Path('kaopu-tailor-workbench/material-products/r05');(p/'PUBLIC_DELIVERY.json').write_text(json.dumps(state,ensure_ascii=False,indent=2));shutil.copytree(e,p/'public-evidence',dirs_exist_ok=True)
          (p/'CURRENT_HANDOFF.md').write_text('# MP05-R1\n\n'+state['fixedURL']+'?look=K04\n\n标准衣形与缓存动作公网验证完成；完整即时自由布料交付未完成。\n\n'+json.dumps(state,ensure_ascii=False,indent=2)+'\n\n缓存之外的物理组合明确禁用标准动作，原慢速自由物理仍保留。普通显示使用同一细网格的有限厚度材质聚合，原生逐纱特写按需加载，不声称完整R15毛羽迁入或微观图像相同。\n')
          print(json.dumps(state,ensure_ascii=False,indent=2))
          PY
      - name: Fast-forward evidence without replacing any old page
        env:
          SOURCE: ${{ needs.stage.outputs.source }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin perf/tailor-mp05-fast-runtime-20261013 --depth=1
          test "$(git rev-parse origin/perf/tailor-mp05-fast-runtime-20261013)" = "$SOURCE"
          git add -f kaopu-tailor-workbench/material-products/r05/PUBLIC_DELIVERY.json kaopu-tailor-workbench/material-products/r05/CURRENT_HANDOFF.md kaopu-tailor-workbench/material-products/r05/public-evidence
          git commit -m 'docs(mp05): retain measured public start and playback scope, not live physics certification [skip ci]'
          git push origin HEAD:refs/heads/perf/tailor-mp05-fast-runtime-20261013
