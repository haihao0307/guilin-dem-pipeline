name: Human boxing R02 published equipment verification
on:
  push:
    branches: ['qa/human-boxing-r02-20261009']
permissions:
  contents: read
concurrency:
  group: human-boxing-r02-stage1
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            kaopu-unified-human-workbench
            kaopu-anny-workbench
            kaopu-mhr-workbench
      - run: node kaopu-unified-human-workbench/full/boxing-r02/geometry.test.mjs
      - run: npm install --prefix "$RUNNER_TEMP/human-qa" --no-save --ignore-scripts playwright@1.57.0
      - run: '"$RUNNER_TEMP/human-qa/node_modules/.bin/playwright" install --with-deps chromium'
      - run: echo "NODE_PATH=$RUNNER_TEMP/human-qa/node_modules" >> "$GITHUB_ENV"
      - run: python3 -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/human-server.log" 2>&1 &
      - name: Wait for tested equipment release marker
        run: |
          python3 - <<'PYWAIT'
          import urllib.request,json,time
          expected='6bbe26d90c3bde6b1a370e5b2e8ee17767c26102'
          url='https://haihao0307.github.io/guilin-dem-pipeline/kaopu-unified-human-workbench/full/boxing-r02/RELEASE.json?qa='+expected
          deadline=time.monotonic()+900
          while time.monotonic()<deadline:
              try:
                  result=json.load(urllib.request.urlopen(url,timeout=20))
                  if result.get('testedRuntimeCommit')==expected:
                      print('Tested R02 equipment release is public');break
              except Exception as e: print(type(e).__name__)
              time.sleep(15)
          else: raise RuntimeError('Expected public equipment marker did not arrive')
          PYWAIT
      - run: node kaopu-unified-human-workbench/tests/boxing-r02-browser.cjs
        env:
          BOXING_R02_BASE: https://haihao0307.github.io/guilin-dem-pipeline/kaopu-unified-human-workbench/
          BOXING_R02_MANIFEST: kaopu-unified-human-workbench/tests/boxing-r02-release.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: human-boxing-r02-${{ github.sha }}
          path: |
            boxing-r02-qa-results/*.png
            boxing-r02-qa-results/*.json
            kaopu-unified-human-workbench/full/boxing-r02/GEOMETRY-QA.json
          retention-days: 7
