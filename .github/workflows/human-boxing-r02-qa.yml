name: Human boxing R02 stage-one ring and glove validation
on:
  push:
    branches: ['qa/human-boxing-r02-20261009']
permissions:
  contents: read
concurrency:
  group: human-boxing-r02-stage1
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            kaopu-unified-human-workbench
            kaopu-anny-workbench
            kaopu-mhr-workbench
      - run: node kaopu-unified-human-workbench/full/boxing-r02/geometry.test.mjs
      - run: npm install --prefix "$RUNNER_TEMP/human-qa" --no-save --ignore-scripts playwright@1.57.0
      - run: '"$RUNNER_TEMP/human-qa/node_modules/.bin/playwright" install --with-deps chromium'
      - run: echo "NODE_PATH=$RUNNER_TEMP/human-qa/node_modules" >> "$GITHUB_ENV"
      - run: python3 -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/human-server.log" 2>&1 &
      - run: node kaopu-unified-human-workbench/tests/boxing-r02-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: human-boxing-r02-${{ github.sha }}
          path: |
            boxing-r02-qa-results/*.png
            boxing-r02-qa-results/*.json
            kaopu-unified-human-workbench/full/boxing-r02/GEOMETRY-QA.json
          retention-days: 7
