name: R06 native topology debug fixture
on:
  push:
    branches: [test/human-r06-ocular-pose-20261013]
    paths: ['.github/workflows/human-r06-native-audit.yml']
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 696f2317362fd53ad3c9a9de4078b01e13a02527
          sparse-checkout: kaopu-unified-human-workbench/human-integrated-r06
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - name: Read-only exact public runtime fixture
        run: |
          node - <<'JS'
          const fs=require('fs'),crypto=require('crypto'),{chromium}=require('playwright');fs.mkdirSync('native-audit/bodies',{recursive:true});
          (async()=>{const b=await chromium.launch({headless:true,args:['--no-sandbox','--use-angle=swiftshader','--enable-unsafe-swiftshader']}),p=await b.newPage(),rows=[],pending=[],errors=[];p.setDefaultTimeout(180000);p.on('pageerror',e=>errors.push(String(e)));p.on('response',r=>{pending.push((async()=>{try{const url=r.url(),body=await r.body(),name=crypto.createHash('sha256').update(url).digest('hex');fs.writeFileSync('native-audit/bodies/'+name,body);rows.push({url,status:r.status(),mime:r.headers()['content-type'],file:name,bytes:body.length});}catch(e){rows.push({url:r.url(),error:String(e)});}})());});
          await p.goto('https://htmlpreview.github.io/?https://raw.githubusercontent.com/haihao0307/guilin-dem-pipeline/696f2317362fd53ad3c9a9de4078b01e13a02527/kaopu-unified-human-workbench/human-integrated-r06/preview.html',{waitUntil:'domcontentloaded',timeout:90000});await p.waitForFunction(()=>window.__LIP_P3__?.ready);await p.evaluate(()=>portraitBank.apply('P02'));await p.evaluate(()=>headMorphology.set({enabled:false}));const data=await p.evaluate(()=>{const m=__IDENTITY_QA__.model(),e=m.eyeSurface;return{bodyCount:m.bodyCount,positions:Array.from(m.positions),faces:Array.from(m.faces),rest:Array.from(e.rest),skin:Array.from(e.skin),eyes:e.eyes,landmarkRecipes:e.landmarkRecipes,settings:headMorphology.settings(),archive:fullCommonWorkbench.archive(),gnmRecipes:m.canonical.gnmRecipes,template:Array.from(m.gnm.template),materialId:Array.from(m.gnm.materialId),componentId:Array.from(m.gnm.componentId)};});fs.writeFileSync('native-audit/native-P02.json',JSON.stringify(data));await Promise.all(pending);fs.writeFileSync('native-audit/routes.json',JSON.stringify(rows));fs.writeFileSync('native-audit/errors.json',JSON.stringify(errors));await b.close();console.log('Captured responses',rows.length,'bytes',rows.reduce((a,r)=>a+(r.bytes||0),0));if(errors.length)throw Error(errors.join(';'));})();
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r06-native-fixture-${{ github.run_number }}
          path: |
            native-audit/
            kaopu-unified-human-workbench/human-integrated-r06/HeadMorphology.mjs
            kaopu-unified-human-workbench/human-integrated-r06/preview.html
          retention-days: 7
