name: Stone Money V0220 physical beach
on:
  push:
    branches: [work/stone-money-island-v0220-physical-beach-20260919]
    paths:
      - .github/workflows/stone-money-v0220-physical-beach.yml
      - games/survivor-palau/source/v0200/**
permissions:
  contents: write
concurrency:
  group: stone-money-v0220-physical-beach
  cancel-in-progress: true
jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/stone-money-island-v0220-physical-beach-20260919
      - name: Build the actual V0.2.2 workbench from the frozen ocean baseline
        run: python games/survivor-palau/source/v0200/build.py
      - name: Verify beach scale, continuity, physical water permission and source relations
        run: python games/survivor-palau/source/v0200/verify_v022_relations.py
      - name: Run desktop and 390x844 real-browser evidence
        run: |
          python -m pip install playwright pillow
          python -m playwright install --with-deps chromium
          timeout 720s python -u games/survivor-palau/source/v0200/verify_v022_browser.py
      - name: Preserve runtime, tests and evidence without overwriting concurrent source edits
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add games/survivor-palau/releases/v0.2.2 games/survivor-palau/source/v0200/KNOWN_LIMITATIONS_V0220.md
          git diff --cached --quiet || git commit -m 'build(stone-money): record V0.2.2 physical beach and browser evidence'
          git pull --rebase origin work/stone-money-island-v0220-physical-beach-20260919
          git push origin HEAD:work/stone-money-island-v0220-physical-beach-20260919
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stone-money-v0220-physical-beach
          path: |
            games/survivor-palau/releases/v0.2.2/
            games/survivor-palau/source/v0200/KNOWN_LIMITATIONS_V0220.md
            /tmp/stone-money-v0220-qa/
          if-no-files-found: error
