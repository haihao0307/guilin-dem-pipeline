name: Isolated official elevator teacher observation
on:
  push:
    branches: ['trial/elevator-teacher-isolated-r01-20261021']
    paths:
      - 'kaopu-geography-workbench/elevator-learning-qa-r01/**'
      - '.github/workflows/elevator-teacher-isolated-r01.yml'
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: kaopu-geography-workbench/elevator-learning-qa-r01
      - name: Complete the one verified Ubuntu runtime dependency
        run: |
          mkdir -p elevator-qa-text
          apt-cache policy libnotify4 | tee elevator-qa-text/apt-policy.txt
          sudo apt-get install -y --no-install-recommends libnotify4 2>&1 | tee elevator-qa-text/apt-install.txt
      - name: Check existing display and libraries then observe official runtime
        env:
          QA_LOG_DIR: elevator-qa-text
        run: python3 -u kaopu-geography-workbench/elevator-learning-qa-r01/run.py
      - name: Retain selected plain text only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: elevator-teacher-text-${{ github.sha }}
          path: |
            elevator-qa-text/apt-policy.txt
            elevator-qa-text/apt-install.txt
            elevator-qa-text/result.json
            elevator-qa-text/dependencies.txt
            elevator-qa-text/execution.txt
          retention-days: 1
