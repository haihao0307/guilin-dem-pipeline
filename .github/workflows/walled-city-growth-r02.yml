name: Walled city integer stair and sparse ray audit
on:
  push:
    branches: ['qa/walled-city-growth-r02-20261011']
permissions:
  contents: read
jobs:
  same-world-observed-spatial-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01/walled-city-growth-r02
      - name: Install official pinned Playwright
        run: |
          npm install --prefix "$RUNNER_TEMP/wgpu" --no-save --ignore-scripts --no-audit --no-fund playwright@1.57.0
          "$RUNNER_TEMP/wgpu/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/wgpu/node_modules" >> "$GITHUB_ENV"
      - name: Validate observed spatial source and frozen mother closure
        run: |
          P=kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01/walled-city-growth-r02
          node --test "$P/qa/whole-life/runtime.test.mjs"
          node "$P/qa/whole-life/points-build.mjs"
      - name: Recheck integer-authority route and nine failed rays only
        run: |
          DEBUG=pw:browser node kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01/walled-city-growth-r02/qa/whole-life/run.cjs
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: city-whole-life-correctness-${{ github.sha }}
          path: walled-city-whole-life-results/
          retention-days: 7
