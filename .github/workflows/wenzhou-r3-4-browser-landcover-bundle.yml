name: Wenzhou R3.4 Browser LandCover Bundle

on:
  push:
    branches:
      - feature/wenzhou-r3-4-landcover-context-20260910
    paths:
      - .github/workflows/wenzhou-r3-4-browser-landcover-bundle.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install GDAL
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gdal-bin python3-gdal python3-numpy
          gdalinfo --version

      - name: Download permanently archived WorldCover evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r34-wc-release /tmp/r34-wc-source
          URL='https://github.com/haihao0307/guilin-dem-pipeline/releases/download/wenzhou-r3.4-environment-evidence-20260910/Wenzhou_R3_4_ESA_WorldCover_Evidence_20260910.zip'
          curl -fL --retry 4 --retry-delay 2 "$URL" -o /tmp/r34-wc-release/worldcover-evidence.zip
          echo 'f558037e82ce38fac604291c6dc0327c931488c5167c7015e0dbdeae5a9ba0ad  /tmp/r34-wc-release/worldcover-evidence.zip' | sha256sum -c -
          unzip -q /tmp/r34-wc-release/worldcover-evidence.zip -d /tmp/r34-wc-source
          SOURCE=$(find /tmp/r34-wc-source -type f -name 'ESA_WORLDCOVER_10M_2021_V200_EPSG32651_COG.tif' -print -quit)
          test -n "$SOURCE"
          echo "$SOURCE" > /tmp/r34-wc-release/source-path.txt
          gdalinfo "$SOURCE" | head -n 30

      - name: Derive patch-scoped class-byte bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site/dist/r3-4/data/worldcover
          mkdir -p site/dist/r3-4/data/worldcover /tmp/r34-wc-work
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,subprocess
          from osgeo import gdal
          import numpy as np

          source=Path('/tmp/r34-wc-release/source-path.txt').read_text().strip()
          contract=json.loads(Path('site/dist/r3-1/data/terrain.json').read_text(encoding='utf-8'))
          out=Path('site/dist/r3-4/data/worldcover')
          work=Path('/tmp/r34-wc-work')
          classes={0:'no-data',10:'tree-cover',20:'shrubland',30:'grassland',40:'cropland',50:'built-up',60:'bare-sparse',70:'snow-ice',80:'permanent-water',90:'herbaceous-wetland',95:'mangroves',100:'moss-lichen'}
          transform=contract['source']['transform']
          def centre(col,row):
              e=transform[2]+transform[0]*(col+.5)
              n=transform[5]+transform[4]*(row+.5)
              return e,n
          def policy(pid):
              if pid.startswith('query-'): return 10,'near','native-10m-crop'
              if pid.startswith('river-'): return 20,'mode','20m-mode-display-context'
              if pid=='mountains': return 40,'mode','40m-mode-display-context'
              if pid=='overview': return 80,'mode','80m-mode-display-context'
              return 40,'mode','40m-mode-display-context'
          manifest={
            'schema':'wenzhou-r3.4-worldcover-browser-bundle/r1',
            'sourceReleaseTag':'wenzhou-r3.4-environment-evidence-20260910',
            'sourceReleaseAsset':'Wenzhou_R3_4_ESA_WorldCover_Evidence_20260910.zip',
            'sourceReleaseAssetSha256':'f558037e82ce38fac604291c6dc0327c931488c5167c7015e0dbdeae5a9ba0ad',
            'sourceDataset':'ESA WorldCover 2021 v200',
            'sourceIdentity':'external_observation',
            'sourceNativeResolutionM':10,
            'sourceCrs':'EPSG:32651',
            'canonicalTruth':False,
            'individualObjectTruth':False,
            'productionReady':False,
            'classCodes':{str(k):v for k,v in classes.items()},
            'patches':[]
          }
          total=0
          allowed=set(classes)
          for p in contract['patches']:
              pid=p['id']; res,resampling,representation=policy(pid)
              e0,n0=centre(p['columnIndices'][0],p['rowIndices'][0])
              e1,n1=centre(p['columnIndices'][-1],p['rowIndices'][-1])
              xmin,xmax=sorted((e0,e1)); ymin,ymax=sorted((n0,n1))
              pad=res
              tif=work/f'{pid}.tif'
              cmd=['gdalwarp','-q','-overwrite','-te',str(xmin-pad),str(ymin-pad),str(xmax+pad),str(ymax+pad),'-tr',str(res),str(res),'-tap','-r',resampling,'-srcnodata','0','-dstnodata','0','-ot','Byte','-co','COMPRESS=DEFLATE',source,str(tif)]
              subprocess.run(cmd,check=True)
              ds=gdal.Open(str(tif)); assert ds is not None
              arr=ds.GetRasterBand(1).ReadAsArray(); assert arr is not None
              arr=np.asarray(arr,dtype=np.uint8)
              uniq={int(x) for x in np.unique(arr)}
              unexpected=sorted(uniq-allowed)
              if unexpected: raise RuntimeError(f'{pid}: unexpected class codes {unexpected}')
              gt=ds.GetGeoTransform(); cols=ds.RasterXSize; rows=ds.RasterYSize
              ds=None
              raw=out/f'{pid}.u8'; raw.write_bytes(arr.tobytes(order='C'))
              h=hashlib.sha256(raw.read_bytes()).hexdigest(); size=raw.stat().st_size; total+=size
              counts={str(int(k)):int(v) for k,v in zip(*np.unique(arr,return_counts=True))}
              manifest['patches'].append({
                'id':pid,'path':f'./data/worldcover/{pid}.u8','bytes':size,'sha256':h,
                'rows':rows,'columns':cols,'resolutionM':res,'resampling':resampling,
                'representation':representation,
                'geotransform':[float(x) for x in gt],
                'bounds':[float(gt[0]),float(gt[3]+rows*gt[5]),float(gt[0]+cols*gt[1]),float(gt[3])],
                'classCounts':counts,
                'exactNativeObservationCrop':res==10 and resampling=='near',
                'displayAggregation':res>10,
                'canonicalTruth':False,'individualObjectTruth':False
              })
          manifest['totalBytes']=total
          manifest['patchCount']=len(manifest['patches'])
          if total>64*1024*1024: raise RuntimeError(f'browser bundle too large: {total} bytes')
          (out/'worldcover-2021-context.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'passed':True,'patchCount':manifest['patchCount'],'totalBytes':total,'patchBytes':{p['id']:p['bytes'] for p in manifest['patches']}},indent=2))
          PY

      - name: Verify browser bundle byte-for-byte
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('site/dist/r3-4/data/worldcover')
          m=json.loads((root/'worldcover-2021-context.json').read_text(encoding='utf-8'))
          errors=[]
          for p in m['patches']:
              f=Path('site/dist/r3-4')/p['path'].removeprefix('./')
              if not f.is_file(): errors.append([p['id'],'missing']); continue
              if f.stat().st_size!=p['bytes']: errors.append([p['id'],'bytes']); continue
              h=hashlib.sha256(f.read_bytes()).hexdigest()
              if h!=p['sha256']: errors.append([p['id'],'sha256'])
              if f.stat().st_size!=p['rows']*p['columns']: errors.append([p['id'],'shape'])
          assert not errors,errors
          assert m['sourceIdentity']=='external_observation'
          assert m['canonicalTruth'] is False
          assert m['individualObjectTruth'] is False
          assert m['productionReady'] is False
          assert len(m['patches'])==len(json.loads(Path('site/dist/r3-1/data/terrain.json').read_text())['patches'])
          print(json.dumps({'passed':True,'patchCount':len(m['patches']),'totalBytes':m['totalBytes'],'errors':errors},indent=2))
          PY

      - name: Commit generated browser bundle only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/dist/r3-4/data/worldcover
          if git diff --cached --quiet; then
            echo 'No bundle changes.'
            exit 0
          fi
          git commit -m 'data(wenzhou): add R3.4 WorldCover browser context bundle'
          git push origin HEAD:feature/wenzhou-r3-4-landcover-context-20260910
