name: Ear ET18 extended controls and 36-person regression
on:
  push:
    branches: [feature/ear-anatomy-et18-20261011]
    paths:
      - kaopu-unified-human-workbench/ear-structure/preview.html
      - kaopu-unified-human-workbench/ear-structure/BUILD.json
concurrency:
  group: ear-et18-full-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  extended-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            kaopu-unified-human-workbench/ear-structure
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pinned browser dependencies
        run: |
          mkdir -p /tmp/ear-tools
          cd /tmp/ear-tools
          npm init -y >/dev/null
          npm install playwright@1.56.1 pngjs@7.0.0
          npx playwright install --with-deps chromium
      - name: Full controls, 36 person presets, expressions and archive regression
        env:
          NODE_PATH: /tmp/ear-tools/node_modules
          EAR_EVIDENCE: ear-full-evidence/browser
        run: |
          mkdir -p ear-full-evidence/browser
          git rev-parse HEAD > ear-full-evidence/PUBLISHED_COMMIT.txt
          cp kaopu-unified-human-workbench/ear-structure/BUILD.json ear-full-evidence/BUILD.json
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/ear-full-http.log 2>&1 &
          node kaopu-unified-human-workbench/ear-structure/verify.cjs
      - name: Retain full evidence without blocking preview availability
        if: always()
        run: |
          mkdir -p ear-full-evidence/build
          cp -r kaopu-unified-human-workbench/ear-structure/. ear-full-evidence/build/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ear-et18-full-regression
          path: ear-full-evidence
          retention-days: 14
