name: Math rescue finite bottleneck public scene proof
on:
  push:
    branches: [qa/math-rescue-learning-20261009]
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RESCUE_URL: https://haihao0307.github.io/guilin-dem-pipeline/kaopu-minigame-workbench/experiments/math-rescue-r01/
    defaults:
      run:
        working-directory: kaopu-minigame-workbench/experiments/math-rescue-r01
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: kaopu-minigame-workbench/experiments/math-rescue-r01
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: |
          npx playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - run: node tests/public-check.mjs
      - run: node tests/learning-capture.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: math-rescue-learning-${{ github.sha }}
          path: kaopu-minigame-workbench/experiments/math-rescue-r01/evidence/
