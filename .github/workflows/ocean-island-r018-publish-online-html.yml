name: Ocean Island R018 verified online HTML

on:
  push:
    branches: [feature/ocean-mother-r018]
    paths:
      - ocean-mother/island-r018-build/**
      - .github/workflows/ocean-island-r018-publish-online-html.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: ocean-island-r018-verified-online-html
  cancel-in-progress: false

jobs:
  verify-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Materialize exact R018 source payload
        run: |
          set -euo pipefail
          mkdir -p evidence/static
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib,json,lzma
          source=Path('ocean-mother/island-r018-build')
          parts=sorted(source.glob('source.*.b64'))
          assert [p.name for p in parts]==['source.01.b64','source.02.b64','source.03.b64'],parts
          encoded=''.join(p.read_text(encoding='utf-8').strip() for p in parts)
          assert len(encoded)==59532,len(encoded)
          compressed=base64.b64decode(encoded,validate=True)
          assert len(compressed)==44648,len(compressed)
          digest=hashlib.sha256(compressed).hexdigest()
          assert digest=='f4371d8151b680a5411f5cbaaf3b33f9986b8f8e54502dfb30b733c70151cc95',digest
          data=json.loads(lzma.decompress(compressed))
          runtime=data['runtime']
          expected={'BUILD.json','PARAMETER_CATALOG.json','README.md','REFERENCE_STUDY.md','app.mjs','coast.css','core.mjs','core.test.mjs','geometry.mjs','index.html','params.mjs','shaders.mjs'}
          assert set(runtime)==expected,(set(runtime),expected)
          root=Path('ocean-mother/island-r018');root.mkdir(parents=True,exist_ok=True)
          for name,content in runtime.items():
              assert Path(name).name==name
              (root/name).write_text(content,encoding='utf-8')
          tools=Path('ocean-mother/island-r018-tools');tools.mkdir(parents=True,exist_ok=True)
          (tools/'qa_runner.py').write_text(data['qa_runner.py'],encoding='utf-8')
          Path('evidence/static/PAYLOAD.json').write_text(json.dumps({'status':'MATERIALIZED','encoding':'base64+xz+json','parts':len(parts),'encodedChars':len(encoded),'compressedBytes':len(compressed),'compressedSha256':digest,'runtimeFiles':len(runtime)},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Verify source identity, syntax, tests and asset policy
        run: |
          set -euo pipefail
          mkdir -p evidence/static
          for f in ocean-mother/island-r018/*.mjs; do node --check "$f"; done
          node ocean-mother/island-r018/core.test.mjs | tee evidence/static/NODE_TESTS.txt
          python3 - <<'PY'
          from pathlib import Path
          import json,re,hashlib
          root=Path('ocean-mother/island-r018')
          build=json.loads((root/'BUILD.json').read_text())
          catalog=json.loads((root/'PARAMETER_CATALOG.json').read_text())
          assert build['version']=='0.3.1-island-r018'
          assert build['buildId']=='island-r018-causal-polish'
          assert build['deliveryPolicy']=='verified online HTML only'
          assert build['runtimeImageAssets']==0 and build['externalModels']==0 and build['externalCdn']==0
          assert catalog['count']==102 and catalog['pages']==3
          banned={'.png','.jpg','.jpeg','.webp','.gif','.avif','.hdr','.exr','.ktx','.ktx2','.glb','.gltf','.obj'}
          assert not [str(p) for p in root.rglob('*') if p.suffix.lower() in banned]
          for p in root.iterdir():
              if not p.is_file(): continue
              text=p.read_text(encoding='utf-8')
              assert not re.search(r'data\s*:\s*image/',text,re.I),p
              assert not re.search(r'https?://',text,re.I),p
          files={p.name:{'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in sorted(root.iterdir()) if p.is_file()}
          Path('evidence/static/SOURCE.json').write_text(json.dumps({'status':'PASS','version':build['version'],'buildId':build['buildId'],'files':files,'visualApproved':False,'productionApproved':False},ensure_ascii=False,indent=2)+'\n')
          PY

      - name: Install browser QA dependencies
        run: |
          python3 -m pip install --quiet playwright pillow
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk

      - name: Verify local desktop, mobile, controls, restart and rendering
        run: |
          set -euo pipefail
          python3 -m http.server 8172 --bind 127.0.0.1 > evidence/local-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          python3 -u ocean-mother/island-r018-tools/qa_runner.py http://127.0.0.1:8172/ocean-mother/island-r018/ evidence/local | tee evidence/LOCAL_QA_LOG.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          q=json.loads(Path('evidence/local/BROWSER_QA.json').read_text())
          assert q['status']=='PASS',q
          required=['correct_identity','continuous_runtime','geometry_control_applies_paused','geometry_change_while_running_continues','restart_auto_resumes','restart_preserves_parameters','mobile_restart_works','no_GL_errors','no_js_or_console_errors']
          assert all(q['checks'].get(k) for k in required),{k:q['checks'].get(k) for k in required}
          PY

      - name: Persist verified R018 runtime on feature branch
        run: |
          set -euo pipefail
          git config user.name 'Ocean Mother Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add ocean-mother/island-r018 ocean-mother/island-r018-tools/qa_runner.py
          if git diff --cached --quiet; then
            echo 'Verified runtime already materialized'
          else
            git commit -m 'feat(ocean): materialize verified R018 runtime [skip ci]'
            git push origin HEAD:feature/ocean-mother-r018
          fi

      - name: Publish R018 atomically to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,json,os,time,urllib.request
          from pathlib import Path
          repo='haihao0307/guilin-dem-pipeline';branch='gh-pages'
          source=Path('ocean-mother/island-r018');target='ocean-mother/island-r018'
          base='https://api.github.com/repos/'+repo;token=os.environ['GH_TOKEN']
          def api(path,body=None,method=None):
              req=urllib.request.Request(base+path,data=None if body is None else json.dumps(body).encode(),method=method or ('GET' if body is None else 'POST'),headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','Content-Type':'application/json','Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=90) as response:return json.load(response)
          head=api('/git/ref/heads/'+branch+'?nonce='+str(time.time_ns()))['object']['sha']
          base_tree=api('/git/commits/'+head)['tree']['sha'];entries=[];files={}
          for p in sorted(source.iterdir()):
              if not p.is_file():continue
              data=p.read_bytes();blob=api('/git/blobs',{'content':base64.b64encode(data).decode(),'encoding':'base64'})['sha']
              entries.append({'path':target+'/'+p.name,'mode':'100644','type':'blob','sha':blob})
              files[p.name]={'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'gitBlobSha':blob}
          tree=api('/git/trees',{'base_tree':base_tree,'tree':entries})['sha']
          commit=api('/git/commits',{'message':'feat(ocean): publish verified R018 island HTML','tree':tree,'parents':[head]})['sha']
          assert api('/git/ref/heads/'+branch+'?nonce='+str(time.time_ns()))['object']['sha']==head
          api('/git/refs/heads/'+branch,{'sha':commit,'force':False},'PATCH')
          assert api('/git/ref/heads/'+branch+'?nonce='+str(time.time_ns()))['object']['sha']==commit
          receipt={'status':'PUBLISHED','version':'0.3.1-island-r018','buildId':'island-r018-causal-polish','publicCommit':commit,'url':'https://haihao0307.github.io/guilin-dem-pipeline/ocean-mother/island-r018/','files':files,'forcePush':False,'persistentImageAssets':0,'visualApproved':False,'productionApproved':False}
          Path('evidence/PUBLISH.json').write_text(json.dumps(receipt,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(receipt,ensure_ascii=False,indent=2))
          PY

      - name: Verify public bytes, HTML and browser interactions
        run: |
          set -euo pipefail
          URL='https://haihao0307.github.io/guilin-dem-pipeline/ocean-mother/island-r018/'
          ready=0
          for attempt in $(seq 1 42); do
            code=$(curl -L -sS -o evidence/public-index.html -w '%{http_code}' -H 'Cache-Control: no-cache' "${URL}?readback=$RANDOM-$attempt" || true)
            if [ "$code" = 200 ] && grep -q 'island-r018-causal-polish' evidence/public-index.html; then ready=1;break;fi
            sleep 10
          done
          test "$ready" = 1
          for file in index.html coast.css app.mjs core.mjs shaders.mjs params.mjs geometry.mjs BUILD.json PARAMETER_CATALOG.json README.md REFERENCE_STUDY.md; do
            test "$(curl -L -sS -o "evidence/public-$file" -w '%{http_code}' -H 'Cache-Control: no-cache' "${URL}${file}?readback=$RANDOM")" = 200
            cmp "ocean-mother/island-r018/$file" "evidence/public-$file"
          done
          python3 -u ocean-mother/island-r018-tools/qa_runner.py "$URL" evidence/public | tee evidence/PUBLIC_QA_LOG.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          q=json.loads(Path('evidence/public/BROWSER_QA.json').read_text())
          assert q['status']=='PASS',q
          required=['http_200','ready','correct_identity','restart_auto_resumes','geometry_change_while_running_continues','mobile_http_ready','mobile_restart_works','deep_controls_present','deep_glass_skin_applied','return_to_island','no_request_failures','no_js_or_console_errors']
          assert all(q['checks'].get(k) for k in required),{k:q['checks'].get(k) for k in required}
          Path('evidence/ONLINE_HTML_VERIFIED.json').write_text(json.dumps({'status':'ONLINE_HTML_VERIFIED','version':'0.3.1-island-r018','url':'https://haihao0307.github.io/guilin-dem-pipeline/ocean-mother/island-r018/','desktop':True,'mobileViewport':True,'http200':True,'byteExact':True,'interactive':True,'restartVerified':True,'persistentImageAssets':0,'visualApproved':False,'productionApproved':False},ensure_ascii=False,indent=2)+'\n')
          PY

      - name: Preserve internal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ocean-island-r018-verified-online-html
          path: evidence/
          if-no-files-found: error
          retention-days: 90
          compression-level: 9
