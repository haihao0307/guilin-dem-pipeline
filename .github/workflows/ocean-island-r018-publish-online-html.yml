name: Ocean Island R018 verified online HTML

on:
  push:
    branches: [feature/ocean-mother-r018]
    paths:
      - .github/workflows/ocean-island-r018-publish-online-html.yml
      - ocean-mother/island-r018-build/**
      - tools/build_standalone_r018.py
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: ocean-island-r018-verified-online-html
  cancel-in-progress: false

jobs:
  verify-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Materialize and verify exact R018 payload
        run: |
          set -euo pipefail
          mkdir -p evidence/static
          printf 'R018 verification started\n' > evidence/START.txt
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib,json,lzma,re
          source=Path('ocean-mother/island-r018-build')
          manifest=json.loads((source/'PAYLOAD.json').read_text(encoding='utf-8'))
          assert manifest['version']=='0.3.1-island-r018'
          assert manifest['buildId']=='island-r018-causal-polish'
          names=[x['name'] for x in manifest['parts']]
          assert names and names==[f'source.{i:02d}.b64' for i in range(1,len(names)+1)]
          chunks=[];verified=[]
          for item in manifest['parts']:
              path=source/item['name'];raw=path.read_bytes();digest=hashlib.sha256(raw).hexdigest()
              assert len(raw)==item['bytes'],(path,len(raw),item['bytes'])
              assert digest==item['sha256'],(path,digest,item['sha256'])
              text=raw.decode('ascii');assert text==text.strip(),path
              chunks.append(text);verified.append({'name':path.name,'bytes':len(raw),'sha256':digest})
          encoded=''.join(chunks);assert len(encoded)==manifest['encodedChars']
          compressed=base64.b64decode(encoded,validate=True)
          assert len(compressed)==manifest['compressedBytes']
          digest=hashlib.sha256(compressed).hexdigest();assert digest==manifest['compressedSha256'],digest
          data=json.loads(lzma.decompress(compressed));runtime=data['runtime']
          expected={'BUILD.json','PARAMETER_CATALOG.json','README.md','REFERENCE_STUDY.md','app.mjs','coast.css','core.mjs','core.test.mjs','geometry.mjs','index.html','params.mjs','shaders.mjs'}
          assert set(runtime)==expected,(set(runtime),expected)
          root=Path('ocean-mother/island-r018');root.mkdir(parents=True,exist_ok=True)
          for name,content in runtime.items():
              assert Path(name).name==name;(root/name).write_text(content,encoding='utf-8')
          tools=Path('ocean-mother/island-r018-tools');tools.mkdir(parents=True,exist_ok=True)
          (tools/'qa_runner.py').write_text(data['qa_runner.py'],encoding='utf-8')
          result={'status':'MATERIALIZED','parts':verified,'encodedChars':len(encoded),'compressedBytes':len(compressed),'compressedSha256':digest,'runtimeFiles':len(runtime)}
          Path('evidence/static/PAYLOAD.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n')
          PY

      - name: Build single-file direct-open HTML
        run: |
          set -euo pipefail
          python3 tools/build_standalone_r018.py | tee evidence/static/STANDALONE_BUILD.json
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          p=Path('ocean-mother/island-r018/Ocean_Mother_R018_Direct_Open.html')
          text=p.read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',text,re.S)
          assert len(scripts)==1,len(scripts)
          assert '<link rel="stylesheet"' not in text
          assert 'src="app.mjs' not in text
          assert 'EMBEDDED DEEP FIELD' in text
          assert not re.search(r'https?://|data\s*:\s*image/',text,re.I)
          Path('evidence/static/standalone-inline.js').write_text(scripts[0],encoding='utf-8')
          Path('evidence/static/STANDALONE_IDENTITY.json').write_text(json.dumps({'status':'PASS','bytes':p.stat().st_size,'singleHtml':True,'embeddedDeep':True,'externalUrls':False},ensure_ascii=False,indent=2)+'\n')
          PY
          node --check evidence/static/standalone-inline.js

      - name: Verify syntax, numeric core and asset policy
        run: |
          set -euo pipefail
          for f in ocean-mother/island-r018/*.mjs; do node --check "$f"; done
          node ocean-mother/island-r018/core.test.mjs | tee evidence/static/NODE_TESTS.txt
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,re
          root=Path('ocean-mother/island-r018')
          build=json.loads((root/'BUILD.json').read_text());catalog=json.loads((root/'PARAMETER_CATALOG.json').read_text())
          assert build['version']=='0.3.1-island-r018' and build['buildId']=='island-r018-causal-polish'
          assert build['deliveryPolicy']=='verified online HTML only'
          assert build['runtimeImageAssets']==build['externalModels']==build['externalCdn']==0
          assert catalog['count']==102 and catalog['pages']==3
          assert (root/'Ocean_Mother_R018_Direct_Open.html').stat().st_size<250000
          banned={'.png','.jpg','.jpeg','.webp','.gif','.avif','.hdr','.exr','.ktx','.ktx2','.glb','.gltf','.obj'}
          assert not [p for p in root.rglob('*') if p.suffix.lower() in banned]
          for path in root.iterdir():
              if path.is_file():
                  text=path.read_text(encoding='utf-8')
                  assert not re.search(r'data\s*:\s*image/|https?://',text,re.I),path
          files={p.name:{'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in sorted(root.iterdir()) if p.is_file()}
          Path('evidence/static/SOURCE.json').write_text(json.dumps({'status':'PASS','files':files,'visualApproved':False,'productionApproved':False},indent=2)+'\n')
          PY

      - name: Install browser QA dependencies
        run: |
          python3 -m pip install --quiet playwright pillow
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk

      - name: Verify local desktop, mobile, controls and restart
        run: |
          set -euo pipefail
          python3 -m http.server 8172 --bind 127.0.0.1 > evidence/local-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          python3 -u ocean-mother/island-r018-tools/qa_runner.py http://127.0.0.1:8172/ocean-mother/island-r018/ evidence/local | tee evidence/LOCAL_QA_LOG.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          q=json.loads(Path('evidence/local/BROWSER_QA.json').read_text())
          required=['correct_identity','continuous_runtime','geometry_control_applies_paused','geometry_change_while_running_continues','restart_auto_resumes','restart_preserves_parameters','mobile_restart_works','no_GL_errors','no_js_or_console_errors']
          assert q['status']=='PASS' and all(q['checks'].get(k) for k in required),q
          PY

      - name: Verify direct-open file in Chromium
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,os,shutil
          from playwright.sync_api import sync_playwright
          target=Path('ocean-mother/island-r018/Ocean_Mother_R018_Direct_Open.html').resolve().as_uri()+'?qa=1'
          errors=[];failed=[]
          with sync_playwright() as p:
              exe=shutil.which('google-chrome') or shutil.which('chromium') or shutil.which('chromium-browser')
              assert exe, 'Chrome or Chromium missing'
              browser=p.chromium.launch(executable_path=exe,headless=True,args=['--no-sandbox','--disable-dev-shm-usage','--allow-file-access-from-files','--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader'])
              page=browser.new_page(viewport={'width':1280,'height':820},device_scale_factor=1)
              page.on('pageerror',lambda e:errors.append(str(e)))
              page.on('console',lambda m:errors.append(m.text) if m.type=='error' else None)
              page.on('requestfailed',lambda r:failed.append({'url':r.url,'failure':r.failure}))
              page.goto(target,wait_until='load',timeout=90000)
              page.wait_for_function('window.OceanIsland?.qa.ready === true',timeout=90000)
              page.wait_for_timeout(1200)
              t0=page.evaluate('OceanIsland.getState().physicalTime')
              page.locator('#restart').click();page.wait_for_timeout(700)
              state=page.evaluate('OceanIsland.getState()')
              page.locator('#deepTab').click();page.wait_for_timeout(900)
              deep_panel=page.frame_locator('#deepFrame').locator('#panel').count()==1
              deep_skin=page.evaluate("document.getElementById('deepFrame').contentDocument.documentElement.dataset.oceanGlassSkin==='r018'")
              page.screenshot(path='evidence/local/standalone-direct-open.png',full_page=True)
              page.locator('#coastTab').click();page.wait_for_timeout(250)
              result={'status':'PASS' if not errors and not failed and state['runtime']['restarts']>=1 and state['physicalTime']<t0+1 and deep_panel and deep_skin else 'FAIL','fileUriLoaded':True,'ready':True,'restart':state['runtime']['restarts']>=1,'embeddedDeep':deep_panel,'deepGlassSkin':deep_skin,'returnToIsland':page.locator('#scene').is_visible(),'errors':errors,'requestFailures':failed}
              browser.close()
          Path('evidence/local/STANDALONE_BROWSER_QA.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n')
          assert result['status']=='PASS',result
          PY

      - name: Persist verified R018 runtime
        run: |
          set -euo pipefail
          git config user.name 'Ocean Mother Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add ocean-mother/island-r018 ocean-mother/island-r018-tools/qa_runner.py
          if ! git diff --cached --quiet; then
            git commit -m 'feat(ocean): materialize verified R018 runtime [skip ci]'
            git push origin HEAD:feature/ocean-mother-r018
          fi

      - name: Publish verified runtime to gh-pages
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          rm -rf /tmp/ocean-r018-pages
          git worktree add /tmp/ocean-r018-pages origin/gh-pages
          target=/tmp/ocean-r018-pages/ocean-mother/island-r018
          rm -rf "$target";mkdir -p "$target"
          cp -a ocean-mother/island-r018/. "$target/"
          cd /tmp/ocean-r018-pages
          git config user.name 'Ocean Mother Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add ocean-mother/island-r018
          if ! git diff --cached --quiet; then git commit -m 'feat(ocean): publish verified R018 island HTML';fi
          git push origin HEAD:gh-pages
          public_commit=$(git rev-parse HEAD)
          cd "$GITHUB_WORKSPACE"
          python3 - "$public_commit" <<'PY'
          from pathlib import Path
          import hashlib,json,sys
          root=Path('ocean-mother/island-r018')
          files={p.name:{'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in sorted(root.iterdir()) if p.is_file()}
          out={'status':'PUBLISHED','version':'0.3.1-island-r018','buildId':'island-r018-causal-polish','publicCommit':sys.argv[1],'url':'https://haihao0307.github.io/guilin-dem-pipeline/ocean-mother/island-r018/','directOpenUrl':'https://haihao0307.github.io/guilin-dem-pipeline/ocean-mother/island-r018/Ocean_Mother_R018_Direct_Open.html','files':files,'forcePush':False,'persistentImageAssets':0,'visualApproved':False,'productionApproved':False}
          Path('evidence/PUBLISH.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          PY

      - name: Verify public bytes and browser interactions
        run: |
          set -euo pipefail
          URL='https://haihao0307.github.io/guilin-dem-pipeline/ocean-mother/island-r018/'
          ready=0
          for attempt in $(seq 1 42); do
            code=$(curl -L -sS -o evidence/public-index.html -w '%{http_code}' -H 'Cache-Control: no-cache' "${URL}?readback=$RANDOM-$attempt" || true)
            if [ "$code" = 200 ] && grep -q 'island-r018-causal-polish' evidence/public-index.html; then ready=1;break;fi
            sleep 10
          done
          test "$ready" = 1
          for file in index.html coast.css app.mjs core.mjs core.test.mjs shaders.mjs params.mjs geometry.mjs BUILD.json PARAMETER_CATALOG.json README.md REFERENCE_STUDY.md Ocean_Mother_R018_Direct_Open.html; do
            test "$(curl -L -sS -o "evidence/public-$file" -w '%{http_code}' -H 'Cache-Control: no-cache' "${URL}${file}?readback=$RANDOM")" = 200
            cmp "ocean-mother/island-r018/$file" "evidence/public-$file"
          done
          python3 -u ocean-mother/island-r018-tools/qa_runner.py "$URL" evidence/public | tee evidence/PUBLIC_QA_LOG.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          q=json.loads(Path('evidence/public/BROWSER_QA.json').read_text())
          required=['http_200','ready','correct_identity','restart_auto_resumes','geometry_change_while_running_continues','mobile_http_ready','mobile_restart_works','deep_controls_present','deep_glass_skin_applied','return_to_island','no_request_failures','no_js_or_console_errors']
          assert q['status']=='PASS' and all(q['checks'].get(k) for k in required),q
          result={'status':'ONLINE_HTML_VERIFIED','version':'0.3.1-island-r018','url':'https://haihao0307.github.io/guilin-dem-pipeline/ocean-mother/island-r018/','directOpenUrl':'https://haihao0307.github.io/guilin-dem-pipeline/ocean-mother/island-r018/Ocean_Mother_R018_Direct_Open.html','desktop':True,'mobileViewport':True,'http200':True,'byteExact':True,'interactive':True,'restartVerified':True,'standaloneByteExact':True,'persistentImageAssets':0,'visualApproved':False,'productionApproved':False}
          Path('evidence/ONLINE_HTML_VERIFIED.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n')
          PY

      - name: Preserve internal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ocean-island-r018-verified-online-html
          path: evidence/
          if-no-files-found: error
          retention-days: 90
          compression-level: 9
