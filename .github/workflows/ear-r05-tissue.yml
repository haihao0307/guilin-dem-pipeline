name: EAR-R05 surface tissue
on:
  push:
    branches: [fix/ear-r05-surface-tissue-20261013]
    paths: ['kaopu-unified-human-workbench/ear-tissue-r05/**', '.github/workflows/ear-r05-tissue.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ear-r05-tissue
  cancel-in-progress: false
jobs:
  tissue:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
          sparse-checkout: |
            kaopu-unified-human-workbench
            .github/workflows
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tools
        run: |
          npm install --no-save --package-lock=false esbuild@0.25.11 playwright@1.56.1 pngjs@7.0.0
          npx playwright install --with-deps chromium
          python3 -m http.server 8765 >/tmp/ear-r05-http.log 2>&1 &
      - name: Baseline audit and source snapshot
        if: ${{ hashFiles('kaopu-unified-human-workbench/ear-tissue-r05/build.cjs') == '' }}
        run: |
          mkdir -p ear-r05-inspect
          git ls-files '*AGENTS.md' > ear-r05-inspect/agent-rule-paths.txt
          python3 - <<'PY'
          import zipfile,subprocess,os
          files=subprocess.check_output(['git','ls-files'],text=True).splitlines()
          with zipfile.ZipFile('ear-r05-inspect/source.zip','w',zipfile.ZIP_DEFLATED) as z:
            for p in files:
              if not os.path.isfile(p):continue
              ext=os.path.splitext(p)[1]
              if p.startswith('kaopu-unified-human-workbench/') and not any(x in p for x in ['/acceptance/','/evidence/']) and ((ext in ['.js','.mjs','.cjs','.css','.json','.md'] and os.path.getsize(p)<2500000) or p.endswith('/index.html') or p.endswith(('ear-root-r04/preview.html','ear-refinement-r03/preview.html','ear-growth/preview.html','ear-structure/preview.html','lip-structure/preview.html'))):z.write(p)
            for root,dirs,names in os.walk('node_modules'):
              for f in names:
                p=os.path.join(root,f)
                if any(p.startswith('node_modules/'+x+'/') for x in ['esbuild','@esbuild/linux-x64','playwright','playwright-core','pngjs']):z.write(p)
          PY
          node kaopu-unified-human-workbench/ear-tissue-r05/audit.cjs
      - name: Build and test
        if: ${{ hashFiles('kaopu-unified-human-workbench/ear-tissue-r05/build.cjs') != '' }}
        run: |
          node kaopu-unified-human-workbench/ear-tissue-r05/build.cjs
          node kaopu-unified-human-workbench/ear-tissue-r05/unit.mjs
          EAR_OUT=ear-r05-evidence/candidate node kaopu-unified-human-workbench/ear-tissue-r05/verify.cjs
      - name: Publish isolated build
        id: publish
        if: ${{ hashFiles('kaopu-unified-human-workbench/ear-tissue-r05/build.cjs') != '' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- kaopu-unified-human-workbench/ear-tissue-r05
          if ! git diff --cached --quiet; then git commit -m 'build(ear-r05): publish tested tissue candidate [skip ci]'; fi
          git push origin HEAD:${{ github.ref_name }}
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Verify exact public build
        if: ${{ steps.publish.outputs.sha != '' }}
        env:
          EAR_MODE: public
          EAR_OUT: ear-r05-evidence/public
          EAR_URL: https://htmlpreview.github.io/?https://raw.githubusercontent.com/haihao0307/guilin-dem-pipeline/${{ steps.publish.outputs.sha }}/kaopu-unified-human-workbench/ear-tissue-r05/preview.html
        run: node kaopu-unified-human-workbench/ear-tissue-r05/verify.cjs
      - name: Permanent evidence
        if: ${{ steps.publish.outputs.sha != '' }}
        run: |
          mkdir -p kaopu-unified-human-workbench/ear-tissue-r05/acceptance
          cp -r ear-r05-evidence/candidate ear-r05-evidence/public kaopu-unified-human-workbench/ear-tissue-r05/acceptance/
          echo '${{ steps.publish.outputs.sha }}' > kaopu-unified-human-workbench/ear-tissue-r05/acceptance/BUILD_COMMIT.txt
          git add -- kaopu-unified-human-workbench/ear-tissue-r05/acceptance
          git commit -m 'test(ear-r05): retain fixed-public evidence [skip ci]'
          git push origin HEAD:${{ github.ref_name }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ear-r05-${{ github.run_id }}
          path: |
            ear-r05-inspect
            ear-r05-evidence
          retention-days: 7
