name: Material R14 motion quality check
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/material-r14-motion.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm init -y
          npm install --save-dev playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify public R14 mobile motion path
        run: |
          cat > check.cjs <<'JS'
          const {chromium}=require('playwright');const fs=require('fs');
          const url='https://haihao0307.github.io/guilin-dem-pipeline/kaopu-material-workbench/?case=iq&v=r14';
          const wait=ms=>new Promise(r=>setTimeout(r,ms));const assert=(x,m)=>{if(!x)throw Error(m)};
          async function waitPublic(){for(let i=0;i<36;i++){const r=await fetch(url+'&probe='+Date.now());const t=await r.text();if(r.status===200&&t.includes('MATERIAL STUDIO / R14')&&t.includes('lab-r14/iq-raster.js'))return;await wait(10000)}throw Error('R14 not propagated')}
          (async()=>{await waitPublic();const browser=await chromium.launch({headless:true,args:['--no-sandbox','--enable-unsafe-swiftshader','--use-angle=swiftshader']});const errors=[];try{
            const page=await browser.newPage({viewport:{width:390,height:844}});page.on('pageerror',e=>errors.push(e.message));await page.goto(url,{waitUntil:'load',timeout:90000});await page.waitForFunction(()=>window.KAOPU10?.ready&&KAOPU10.frames()>0,{timeout:90000});
            await page.locator('#rotate').click();await wait(1200);
            const during=await page.evaluate(()=>KAOPU10.performance());
            await page.screenshot({path:'r14-mobile-motion.png'});
            await page.locator('#rotate').click();await wait(400);
            const after=await page.evaluate(()=>KAOPU10.performance());
            const report={version:'R14',url,environment:'Public HTTPS Chromium 390px viewport + SwiftShader (not physical iPhone)',during,after,errors,checkedAt:new Date().toISOString()};
            report.trianglePass=during.raster?.triangles===5120;
            report.motionResolutionPass=during.raster?.width<=600;
            report.staticResolutionPass=after.width<=960;
            report.noErrors=errors.length===0;
            report.shareAllowed=report.trianglePass&&report.motionResolutionPass&&report.staticResolutionPass&&report.noErrors;
            fs.writeFileSync('R14_MOTION_PROOF.json',JSON.stringify(report,null,2));console.log(JSON.stringify(report,null,2));
            assert(report.shareAllowed,'R14 structural checks failed');
          }finally{await browser.close()}})().catch(e=>{console.error(e);process.exit(1)});
          JS
          node check.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: material-r14-motion-proof
          path: |
            R14_MOTION_PROOF.json
            r14-mobile-motion.png
          retention-days: 14
