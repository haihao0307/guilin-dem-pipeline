name: Coral R07 Massive P00

on:
  push:
    branches:
      - work/coral-mother-r07-massive-porites-p00-20260921
    paths:
      - tools/coral/coral_r07_massive_p00_builder.py
      - tools/coral/coral_r07_massive_p00_browser_qa.py
      - .github/workflows/coral-r07-massive-p00.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coral-r07-massive-p00
  cancel-in-progress: true

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out R07 work branch
        uses: actions/checkout@v4
        with:
          ref: work/coral-mother-r07-massive-porites-p00-20260921
          fetch-depth: 1
          path: work

      - name: Check out current GitHub Pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 1
          path: pages

      - name: Build NOAA massive coral P00
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/coral-r07-p00
          python3 work/tools/coral/coral_r07_massive_p00_builder.py /tmp/coral-r07-p00
          printf '%s\n' \
            'https://haihao0307.github.io/guilin-dem-pipeline/coral-mother-r07-massive-porites-p00/' \
            > /tmp/coral-r07-p00/PUBLIC_URL.txt
          grep -q 'HARD_MASSIVE' /tmp/coral-r07-p00/index.html
          grep -q 'Massive coral' /tmp/coral-r07-p00/index.html
          grep -q 'Porites lutea morphology prototype' /tmp/coral-r07-p00/index.html
          grep -q 'visualAcceptance:false' /tmp/coral-r07-p00/index.html
          test "$(grep -o 'type="range"' /tmp/coral-r07-p00/index.html | wc -l)" -eq 12
          test "$(grep -o 'id="gl"' /tmp/coral-r07-p00/index.html | wc -l)" -eq 1

      - name: Browser and geometry gates
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet websocket-client pillow
          python3 -m http.server 8773 --directory /tmp/coral-r07-p00 >/tmp/coral-r07-p00-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          python3 work/tools/coral/coral_r07_massive_p00_browser_qa.py /tmp/coral-r07-p00

      - name: Upload complete P00 evidence
        uses: actions/upload-artifact@v4
        with:
          name: CORAL_R07_MASSIVE_P00_EVIDENCE_${{ github.sha }}
          path: /tmp/coral-r07-p00
          if-no-files-found: error
          retention-days: 90

      - name: Publish fixed P00 workbench
        shell: bash
        run: |
          set -euo pipefail
          TARGET=coral-mother-r07-massive-porites-p00
          rm -rf "pages/$TARGET"
          mkdir -p "pages/$TARGET"
          cp -a /tmp/coral-r07-p00/. "pages/$TARGET/"
          cd pages
          git config user.name 'Haihao_Nature Grace HK'
          git config user.email 'haihao0307@gmail.com'
          git add "$TARGET/"
          if git diff --cached --quiet; then
            echo 'No publication changes.'
          else
            git commit -m "publish(coral): R07 massive Porites P00"
            git pull --rebase origin gh-pages
            git push origin gh-pages
          fi

      - name: Write run summary
        shell: bash
        run: |
          {
            echo '## Coral Mother R07-P00'
            echo
            echo '- NOAA broad type: Hard / stony coral'
            echo '- NOAA growth form: Massive coral'
            echo '- Candidate: Porites lutea morphology prototype'
            echo '- Palau occurrence: UNRESOLVED'
            echo '- Geometry: anchored dome + macro lobes + warp + microscope'
            echo '- Runtime assets: 0 GLB / 0 texture / 0 fetch'
            echo '- visualAcceptance: false'
            echo '- productionReady: false'
            echo
            echo 'Public workbench:'
            echo 'https://haihao0307.github.io/guilin-dem-pipeline/coral-mother-r07-massive-porites-p00/'
          } >> "$GITHUB_STEP_SUMMARY"
