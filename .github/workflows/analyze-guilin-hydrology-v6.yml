name: Analyze Guilin hydrology v6

on:
  push:
    branches: [main]
    paths:
      - tools/analyze_guilin_hydrology_v6.py
      - .github/workflows/analyze-guilin-hydrology-v6.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pyproj==3.7.1
      - run: python tools/analyze_guilin_hydrology_v6.py
      - uses: actions/upload-artifact@v4
        with:
          name: guilin-hydrology-v6-source-audit
          path: out/guilin-hydrology-v6-analysis.json
          retention-days: 14
