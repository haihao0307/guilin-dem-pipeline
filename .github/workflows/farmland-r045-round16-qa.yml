name: farmland-r045-round16-qa
on:
  push:
    branches:
      - restart/farmland-object-dna-v020-20260907
    paths:
      - 'farmland-object-dna/research/r045-autonomous-rebuild/round-16/r045_round16_kernel.mjs'
      - 'farmland-object-dna/research/r045-autonomous-rebuild/round-16/r045_round16_qa.mjs'
      - 'farmland-object-dna/research/r045-autonomous-rebuild/round-16/r045_round16_audit.html'
      - '.github/workflows/farmland-r045-round16-qa.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Generate numeric result
        id: numeric
        shell: bash
        run: |
          set +e
          node farmland-object-dna/research/r045-autonomous-rebuild/round-16/r045_round16_qa.mjs
          echo "code=$?" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Gate numeric QA
        if: always()
        run: node -e "let r=require('./farmland-object-dna/research/r045-autonomous-rebuild/round-16/r045_round16_qa_result.json');console.log(r.passedCount+'/'+r.gateCount);if(!r.passed){for(const c of r.checks.filter(x=>!x.pass))console.error('FAIL',c.name,JSON.stringify(c.value),'limit',c.limit);process.exit(2)}"
      - name: Browser fixed-view A-B gate
        if: always()
        shell: bash
        run: |
          set +e
          ROOT="$PWD"
          PAGE='http://127.0.0.1:8123/farmland-object-dna/research/r045-autonomous-rebuild/round-16/r045_round16_audit.html'
          OUT="$ROOT/farmland-object-dna/research/r045-autonomous-rebuild/round-16"
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          python3 -m http.server 8123 --bind 127.0.0.1 > /tmp/r045-r16-http.log 2>&1 & SERVER_PID=$!; sleep 2
          if [ -z "$CHROME_BIN" ]; then SHOT_STATUS=127; DOM_STATUS=127; : > /tmp/r045-round16-dom.html; else
            unset DBUS_SESSION_BUS_ADDRESS
            FLAGS=(--headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-background-networking --disable-component-update --disable-sync --disable-extensions --disable-default-apps --disable-domain-reliability --no-first-run --no-default-browser-check --metrics-recording-only --hide-scrollbars --window-size=1400,900 --force-device-scale-factor=1 --virtual-time-budget=3500)
            timeout 30s "$CHROME_BIN" "${FLAGS[@]}" --screenshot="$OUT/r045_round16_fixed_view.png" "$PAGE"; SHOT_STATUS=$?
            timeout 30s "$CHROME_BIN" "${FLAGS[@]}" --dump-dom "$PAGE" > /tmp/r045-round16-dom.html; DOM_STATUS=$?
          fi
          kill "$SERVER_PID" 2>/dev/null || true; grep -q 'data-ready="true"' /tmp/r045-round16-dom.html; READY_STATUS=$?
          export SHOT_STATUS DOM_STATUS READY_STATUS CHROME_BIN OUT
          python3 - <<'PY'
          import json, os
          out=os.environ['OUT']; shot=os.path.join(out,'r045_round16_fixed_view.png')
          r={'chrome_bin':os.environ.get('CHROME_BIN',''),'screenshot_status':int(os.environ.get('SHOT_STATUS','999')),'dom_status':int(os.environ.get('DOM_STATUS','999')),'ready_marker_status':int(os.environ.get('READY_STATUS','999')),'screenshot_exists':os.path.exists(shot),'screenshot_bytes':os.path.getsize(shot) if os.path.exists(shot) else 0}
          r['passed']=r['screenshot_status']==0 and r['dom_status']==0 and r['ready_marker_status']==0 and r['screenshot_bytes']>20000
          with open(os.path.join(out,'r045_round16_browser_result.json'),'w') as f: json.dump(r,f,indent=2)
          print(json.dumps(r,indent=2)); raise SystemExit(0 if r['passed'] else 3)
          PY
      - name: Build concise QA summary
        if: always()
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p='farmland-object-dna/research/r045-autonomous-rebuild/round-16/';
          const q=JSON.parse(fs.readFileSync(p+'r045_round16_qa_result.json','utf8'));
          let b=null;try{b=JSON.parse(fs.readFileSync(p+'r045_round16_browser_result.json','utf8'))}catch(e){}
          const summary={version:q.version,passed:q.passed,passedCount:q.passedCount,gateCount:q.gateCount,failed:q.checks.filter(c=>!c.pass),browser:b,metrics:{delta:q.metrics.delta,maxLongitudinalDeltaStep:q.metrics.maxLongitudinalDeltaStep,oldWall:q.metrics.oldWall,newWall:q.metrics.newWall,candidate:q.metrics.candidate,terraceNearDrainageMean:q.metrics.terraceNearDrainageMean,terraceFarDrainageMean:q.metrics.terraceFarDrainageMean,signatures:q.metrics.signatures}};
          fs.writeFileSync(p+'r045_round16_summary.json',JSON.stringify(summary,null,2));
          NODE
      - name: Upload R045.16 audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: farmland-r045-round16-audit
          if-no-files-found: warn
          path: |
            farmland-object-dna/research/r045-autonomous-rebuild/round-16/r045_round16_qa_result.json
            farmland-object-dna/research/r045-autonomous-rebuild/round-16/r045_round16_browser_result.json
            farmland-object-dna/research/r045-autonomous-rebuild/round-16/r045_round16_summary.json
            farmland-object-dna/research/r045-autonomous-rebuild/round-16/r045_round16_fixed_view.png
      - name: Persist machine-readable QA evidence
        if: always()
        shell: bash
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add farmland-object-dna/research/r045-autonomous-rebuild/round-16/r045_round16_qa_result.json farmland-object-dna/research/r045-autonomous-rebuild/round-16/r045_round16_browser_result.json farmland-object-dna/research/r045-autonomous-rebuild/round-16/r045_round16_summary.json || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'farmland R045.16 persist QA evidence [skip ci]'
          git push origin HEAD:${GITHUB_REF_NAME}
