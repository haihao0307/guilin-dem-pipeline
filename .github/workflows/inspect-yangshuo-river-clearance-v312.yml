name: Inspect Yangshuo river clearance v3.1.2

on:
  push:
    branches:
      - skill/dem-procedural-landscape-v010
    paths:
      - .github/workflows/inspect-yangshuo-river-clearance-v312.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v6

      - name: Print river metric and QA contexts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def contexts(path, terms, radius=12):
              lines = Path(path).read_text(encoding='utf-8').splitlines()
              selected = set()
              for i, line in enumerate(lines):
                  if any(term in line for term in terms):
                      selected.update(range(max(0, i-radius), min(len(lines), i+radius+1)))
              print(f'===== {path} =====')
              last = -2
              for i in sorted(selected):
                  if i > last + 1:
                      print('...')
                  print(f'{i+1:05d}: {lines[i]}')
                  last = i

          contexts(
              'web/yangshuo-noise-terrain-v310/index.html',
              [
                  'minimumRiverBedDepthMeters',
                  'riverBed',
                  'waterHeight',
                  'waterLevel',
                  'riverClearance',
                  'riverMesh',
                  'buildRiver',
                  'riverProfile',
                  'riverDelta',
              ],
              radius=16,
          )
          contexts(
              'tools/procedural_landscape/yangshuo_noise_v310_browser_qa.py',
              [
                  'minimumRiverBedDepthMeters',
                  'riverbed clearance',
                  'screenshot',
                  'full_page',
                  'assert_state',
              ],
              radius=14,
          )
          PY
