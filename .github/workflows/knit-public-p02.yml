name: Knit P02 visible fibre correction
on:
  push:
    branches: [fix/knit-p02-visible-fiber-20261014]
    paths:
      - kaopu-fabric-workbench/knit-public-p02/jacket.mjs
      - kaopu-fabric-workbench/knit-public-p02/build.py
      - kaopu-fabric-workbench/knit-public-p02/qa.py
      - kaopu-fabric-workbench/knit-public-p02/polish.py
      - .github/workflows/knit-public-p02.yml
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          sparse-checkout: |
            kaopu-fabric-workbench/knit-public-p01
            kaopu-fabric-workbench/knit-public-p02
      - name: Build and correct the first reviewed images
        run: |
          python kaopu-fabric-workbench/knit-public-p02/build.py
          python kaopu-fabric-workbench/knit-public-p02/polish.py
      - name: Install rendering test tools
        run: |
          python -m pip install playwright==1.56.0 pillow==11.3.0
          python -m playwright install --with-deps chromium
      - name: Render actual default scale, near and grazing images
        run: |
          python -m http.server 8873 --directory kaopu-fabric-workbench >/tmp/p02-http.log 2>&1 &
          python kaopu-fabric-workbench/knit-public-p02/qa-refined.py
      - name: Save candidate and tests without declaring visual acceptance
        run: |
          python - <<'PY'
          import json,pathlib,shutil
          p=pathlib.Path('kaopu-fabric-workbench/knit-public-p02');r=json.loads(pathlib.Path('p02-evidence/REPORT.json').read_text());assert r['passed']
          shutil.copytree('p02-evidence',p/'qa',dirs_exist_ok=True)
          m=json.loads((p/'BUILD_MANIFEST.json').read_text());m['runtimeChecksPassed']=len(r['checks']);m['status']='RUNTIME_CHECKED_AWAITING_VISUAL_REVIEW';(p/'BUILD_MANIFEST.json').write_text(json.dumps(m,ensure_ascii=False,indent=2))
          PY
          BRANCH=fix/knit-p02-visible-fiber-20261014
          CURRENT=$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)
          test "$CURRENT" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kaopu-fabric-workbench/knit-public-p02/main.mjs kaopu-fabric-workbench/knit-public-p02/jacket-refined.mjs kaopu-fabric-workbench/knit-public-p02/qa-refined.py kaopu-fabric-workbench/knit-public-p02/template.html kaopu-fabric-workbench/knit-public-p02/index.html kaopu-fabric-workbench/knit-public-p02/BUILD_MANIFEST.json kaopu-fabric-workbench/knit-public-p02/THIRD_PARTY_NOTICES.txt kaopu-fabric-workbench/knit-public-p02/qa
          git commit -m 'build(knit-p02): save corrected candidate and default-scale visual evidence'
          git push origin "HEAD:refs/heads/$BRANCH"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: knit-p02-visual-review
          path: |
            p02-evidence/
            kaopu-fabric-workbench/knit-public-p02/BUILD_MANIFEST.json
          retention-days: 14
