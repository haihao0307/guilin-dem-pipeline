name: Human R04 eye geometry diagnosis
on:
  push:
    branches: [fix/human-r04-latest-specialists-eye-20261013]
    paths: ['.github/workflows/human-r04-eye-audit.yml']
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - name: Inspect same character, exact R03, eyes open and closed
        run: |
          mkdir -p audit
          cat > audit.cjs <<'JS'
          const fs=require('fs'),{chromium}=require('playwright');
          (async()=>{const b=await chromium.launch({headless:true,args:['--no-sandbox','--use-angle=swiftshader','--enable-unsafe-swiftshader']}),p=await b.newPage({viewport:{width:1300,height:1000}}),r={errors:[],screens:[],source:'3a4443bab9ee5a830024e7cbf3de51dc13160a8b'};p.on('pageerror',e=>r.errors.push(String(e)));p.on('console',m=>{if(m.type()==='error')r.errors.push(m.text())});const cdp=await p.context().newCDPSession(p),snap=async n=>{const s=await cdp.send('Page.captureScreenshot',{format:'png',captureBeyondViewport:false});fs.writeFileSync('audit/'+n+'.png',Buffer.from(s.data,'base64'));r.screens.push(n);};
          try{await p.goto('https://htmlpreview.github.io/?https://raw.githubusercontent.com/haihao0307/guilin-dem-pipeline/3a4443bab9ee5a830024e7cbf3de51dc13160a8b/kaopu-unified-human-workbench/human-integrated-r03/preview.html',{waitUntil:'domcontentloaded',timeout:120000});await p.waitForFunction(()=>window.unifiedHuman,null,{timeout:240000});await p.evaluate(()=>lifelikeIdle.pause(true));await p.waitForFunction(()=>lifelikeIdle.ready(),null,{timeout:180000});await p.evaluate(async()=>{const v=__IDENTITY_QA__.viewer(),m=__IDENTITY_QA__.model();await v.skin.faceReady;await v.skin.naturalEyesReady;lifelikeIdle.seek(0);lifelikeIdle.runtime().suppressed++;window.__eyeAudit={eye:{...m.eyeSurface.settings},fold:{...m.foldProfile.settings},face:{...m.regionalFace.settings}};m.foldProfile.settings.gray=true;v.view('face');v.camera.zoom=2.1;v.camera.updateProjectionMatrix();v.orbit.target.y+=.045;v.camera.position.y+=.045;v.orbit.update();v.render();});await snap('01-full-gray');
          for(const [name,mode]of [['02-no-broad-anatomy',1],['03-no-folds',2],['04-native-eyelid',3]]){await p.evaluate(mode=>{const m=__IDENTITY_QA__.model(),v=__IDENTITY_QA__.viewer();if(mode===1)m.regionalFace.settings.enabled=false;if(mode===2)Object.assign(m.foldProfile.settings,{strength:0});if(mode===3){m.eyeSurface.settings.enabled=false;m.compute(m.state);}v.update();v.render();},mode);await snap(name);}
          await p.evaluate(()=>{const m=__IDENTITY_QA__.model(),v=__IDENTITY_QA__.viewer();Object.assign(m.eyeSurface.settings,__eyeAudit.eye);Object.assign(m.foldProfile.settings,__eyeAudit.fold,{gray:true});Object.assign(m.regionalFace.settings,__eyeAudit.face);m.compute(m.state);v.update();v.render();lifelikeIdle.runtime().suppressed--;lifelikeIdle.runtime().apply(0,{blinkL:1,blinkR:1,events:[]});});await snap('05-closed-gray');r.report=await p.evaluate(()=>unifiedHuman.report());r.pass=r.errors.length===0;
          }catch(e){r.failure=String(e);}finally{fs.writeFileSync('audit/report.json',JSON.stringify(r,null,2));await b.close();}})();
          JS
          node audit.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: human-r04-eye-diagnosis, path: audit/, retention-days: 7}
