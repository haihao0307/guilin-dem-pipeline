name: Landscape R5 full handoff package
on:
  push:
    branches: [feature/landscape-mother-field-graph-v002]
    paths:
      - workbenches/landscape-surface-r5/package_full_handoff.py
      - .github/workflows/landscape-full-handoff-r5.yml
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build exact full handoff from fixed R5 source
        run: |
          set -euo pipefail
          test "$(git rev-parse 039d3a7f32c73ff3ac292c5bbb18c3f6f5535b90:landscape-mother)" = 468aacd827f72eec3c245ad9e85abfa42a4ff097
          sed -i "/release:'karst-surface-shell-r5'/d" workbenches/landscape-surface-r5/package_full_handoff.py
          python3 workbenches/landscape-surface-r5/package_full_handoff.py | tee /tmp/package-result.json
          unzip -t handoffs/landscape-mother/full-r5-20260907/Landscape_Mother_Full_Handoff_R5_2026-09-07.zip
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('handoffs/landscape-mother/full-r5-20260907/Landscape_Mother_Full_Handoff_R5_2026-09-07.zip')
          recorded=Path('handoffs/landscape-mother/full-r5-20260907/PACKAGE_SHA256.txt').read_text().split()[0]
          assert hashlib.sha256(p.read_bytes()).hexdigest()==recorded
          assert p.stat().st_size>10000
          PY
      - name: Publish dedicated restart branch
        run: |
          set -euo pipefail
          BRANCH='handoff/landscape-mother-r5-full-20260907'
          SOURCE='039d3a7f32c73ff3ac292c5bbb18c3f6f5535b90'
          git config user.name 'Landscape Mother'
          git config user.email 'actions@users.noreply.github.com'
          git restore workbenches/landscape-surface-r5/package_full_handoff.py
          git checkout -B "$BRANCH" "$SOURCE"
          git add -f handoffs/landscape-mother/full-r5-20260907/
          git commit -m 'handoff(landscape): full R5 restart package 2026-09-07'
          if git ls-remote --exit-code origin "refs/heads/$BRANCH" >/dev/null 2>&1; then
            git push --force-with-lease origin "HEAD:refs/heads/$BRANCH"
          else
            git push origin "HEAD:refs/heads/$BRANCH"
          fi
          echo "HANDOFF_COMMIT=$(git rev-parse HEAD)"
