name: Wenzhou ASF local execution contract

on:
  push:
    branches:
      - project/wenzhou-qingjiang-22000km2-dem-v001
    paths:
      - 'projects/wenzhou/local_tools/**'
      - 'projects/wenzhou/config/**'
      - 'projects/wenzhou/metadata/resolved_aoi.json'
      - 'projects/wenzhou/metadata/asf_search_results_jsonlite2.json'
      - 'tools/asf-local/**'
      - '08_WENZHOU_12_5M_DOWNLOAD_NO_FLASH.cmd'
      - '.github/workflows/wenzhou-asf-local-contract.yml'
  pull_request:
    paths:
      - 'projects/wenzhou/local_tools/**'
      - 'projects/wenzhou/config/**'
      - 'projects/wenzhou/metadata/resolved_aoi.json'
      - 'tools/asf-local/**'
      - '08_WENZHOU_12_5M_DOWNLOAD_NO_FLASH.cmd'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-local-contract:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate PowerShell syntax
        shell: powershell
        run: |
          $paths = @(
            'projects/wenzhou/local_tools/LocalDownload.ps1',
            'tools/asf-local/InvokeChromeSessionDownload.ps1',
            'tools/asf-local/RepairChromeSessionDownloader.ps1'
          )
          foreach ($path in $paths) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path),
              [ref]$tokens,
              [ref]$errors
            )
            if (@($errors).Count -gt 0) {
              $errors | Format-List *
              throw "PowerShell syntax validation failed: $path"
            }
            Write-Host "validated $path"
          }

      - name: Validate Wenzhou launcher
        shell: powershell
        run: |
          $path = '08_WENZHOU_12_5M_DOWNLOAD_NO_FLASH.cmd'
          if (-not (Test-Path -LiteralPath $path)) {
            throw "Missing local launcher: $path"
          }
          $entry = Get-Content -Raw -LiteralPath $path
          if ($entry -notmatch 'projects\\wenzhou\\local_tools') {
            throw 'Root launcher does not call the Wenzhou local tools.'
          }

      - name: Rebuild deterministic ASF plan from fixture
        shell: python
        run: |
          import subprocess
          import sys

          command = [
              sys.executable,
              'DEM-Map-Pipeline/guilin-zhenbaoding-yangshuo-pingle/scripts/asf_download_stdlib.py',
              '--config', 'projects/wenzhou/config/asf_download_config.json',
              '--root', 'projects/wenzhou',
              '--search-fixture', 'projects/wenzhou/metadata/asf_search_results_jsonlite2.json',
              '--plan-only',
          ]
          raise SystemExit(subprocess.call(command))

      - name: Validate selected products
        shell: python
        run: |
          import json
          from pathlib import Path

          plan = json.loads(Path('projects/wenzhou/metadata/selected_products.json').read_text(encoding='utf-8'))
          selected = plan['selectedNewProducts']
          diagnostics = plan['searchDiagnostics']
          assert len(selected) == 11
          assert diagnostics['selectedCoverageFraction'] >= diagnostics['targetCoverageFraction']
          print(json.dumps({
              'selectedProductCount': len(selected),
              'selectedCoverageFraction': diagnostics['selectedCoverageFraction'],
              'targetCoverageFraction': diagnostics['targetCoverageFraction'],
          }, indent=2))
