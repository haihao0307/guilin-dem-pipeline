name: Landscape historical screenshot thumbnails

on:
  push:
    branches:
      - review/landscape-prepack-compare-20260911
    paths:
      - .github/workflows/landscape-history-thumbnails.yml

permissions:
  contents: write

jobs:
  thumbnails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/landscape-prepack-compare-20260911
          fetch-depth: 1
      - name: Make compact JPEG proofs
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          root=Path('qa/landscape-history')
          for n in ['A_R5_APPROVED_BASELINE','B_R5_SURFACE','C_R10_PREPACK']:
              im=Image.open(root/f'{n}.png').convert('RGB')
              im.thumbnail((480,300),Image.Resampling.LANCZOS)
              im.save(root/f'{n}_SMALL.jpg',quality=42,optimize=True)
          PY
          ls -lh qa/landscape-history/*_SMALL.jpg
      - name: Commit compact proofs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Landscape Mother'
          git config user.email 'actions@users.noreply.github.com'
          git add -f qa/landscape-history/*_SMALL.jpg
          git commit -m 'qa(landscape): add compact historical screenshot proofs'
          git push origin HEAD:review/landscape-prepack-compare-20260911
