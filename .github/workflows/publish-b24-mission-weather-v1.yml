name: Publish exact B24 V010 Weather Mother dirt runway workbench

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-b24-mission-weather-v1.yml'
      - 'aircraft/b24-v010-weather-recovery-r2/**'

permissions:
  contents: write

concurrency:
  group: publish-b24-v010-weather-dirt-runway
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_DIR: aircraft/b24-v010-weather-recovery-r2
      DESTINATION: aircraft/b24-weather-mission-v1
      AIRCRAFT_COMMIT: 51929b3dc0a55c34315c2e822f6e0e13eaafb87a
      V010_SOURCE_PATH: handoff/2026-08-29-b24-v010-ridged-noise-v002/current_v010/B24_V010_RIDGED_LOCAL_DAMAGE_REVIEW.html
      V010_BYTES: 12550988
      V010_SHA256: 1b5b860ca78a7d55ea25d0d972a1d323125a57982d09452e7f7e0cb55d64a949
      OUTPUT_BYTES: 12551281
      OUTPUT_SHA256: 0d4347782f7f474fcc19c561f4347a9b39bf305735bf7efce6ed7e95615b8b6d
      RUNTIME_TAR_BYTES: 42741
      RUNTIME_TAR_SHA256: cac414871097f6da636ab9d7275407b0dacb4e99001e3d5054089117b2fe18d3
      MISSION_JS_BYTES: 45993
      MISSION_JS_SHA256: 5b767182257d3e2dd6dca2f09bae128e97da2174e78f1e0101b48254d66445d5
      MISSION_CSS_BYTES: 8674
      MISSION_CSS_SHA256: 34e276c7a334ca667ed576cf717edfc3894e2fc033e91dc3c68a458338ff69f3
      WEATHER_HTML_BYTES: 71497
      WEATHER_HTML_SHA256: 90f81400e899e734375ccd4806888a67a14a52f96728084e83fbbfc9775e0d10
      B24_BYTES: 23085972
      B24_SHA256: 541c3dcfb98ab590cdb1bc90d6ddcdfe80bce2a4b937f3bccefab0c7efe8be0d
      WEATHER_VERSION: 1.0.0-clean
      WEATHER_SOURCE_COMMIT: bf2aaa5d853af4f114c68d5bbafb99ea47134ef5
      BUILD_ID: B24_V010_WEATHER_MISSION_RECOVERY_R2

    steps:
      - name: Check out publication source
        uses: actions/checkout@v4
        with:
          path: source

      - name: Check out active GitHub Pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: public
          fetch-depth: 0

      - name: Reassemble and verify the deterministic recovery runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work
          cat source/$SOURCE_DIR/runtime.parts/runtime.part.* > work/runtime.tar.gz.b64
          base64 --decode work/runtime.tar.gz.b64 > work/runtime.tar.gz
          test "$(stat --format=%s work/runtime.tar.gz)" = "$RUNTIME_TAR_BYTES"
          echo "$RUNTIME_TAR_SHA256  work/runtime.tar.gz" | sha256sum --check
          tar -xzf work/runtime.tar.gz -C work
          test -s work/tools/build_from_v010.py
          test -s work/runtime/mission-v010.js
          test -s work/runtime/mission-v010.css
          test -s work/runtime/weather/index.html

      - name: Download and verify the exact user V010 HTML
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 8 --retry-all-errors --retry-delay 2 \
            --output work/B24_V010_RIDGED_LOCAL_DAMAGE_REVIEW.html \
            "https://raw.githubusercontent.com/haihao0307/AIRCRAFT/$AIRCRAFT_COMMIT/$V010_SOURCE_PATH"
          test "$(stat --format=%s work/B24_V010_RIDGED_LOCAL_DAMAGE_REVIEW.html)" = "$V010_BYTES"
          echo "$V010_SHA256  work/B24_V010_RIDGED_LOCAL_DAMAGE_REVIEW.html" | sha256sum --check

      - name: Build the merged V010 and Weather Mother workbench
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/build
          python3 work/tools/build_from_v010.py \
            work/B24_V010_RIDGED_LOCAL_DAMAGE_REVIEW.html \
            work/build/index.html
          test "$(stat --format=%s work/build/index.html)" = "$OUTPUT_BYTES"
          echo "$OUTPUT_SHA256  work/build/index.html" | sha256sum --check

      - name: Validate runtime identity, dirt runway, propellers and landing gear contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(stat --format=%s work/runtime/mission-v010.js)" = "$MISSION_JS_BYTES"
          test "$(stat --format=%s work/runtime/mission-v010.css)" = "$MISSION_CSS_BYTES"
          test "$(stat --format=%s work/runtime/weather/index.html)" = "$WEATHER_HTML_BYTES"
          echo "$MISSION_JS_SHA256  work/runtime/mission-v010.js" | sha256sum --check
          echo "$MISSION_CSS_SHA256  work/runtime/mission-v010.css" | sha256sum --check
          echo "$WEATHER_HTML_SHA256  work/runtime/weather/index.html" | sha256sum --check
          node --check work/runtime/mission-v010.js
          grep -q "$BUILD_ID" work/build/index.html
          grep -q 'mission-v010.css' work/build/index.html
          grep -q 'mission-v010.js' work/build/index.html
          grep -q "surface: 'compacted-earth'" work/runtime/mission-v010.js
          grep -q 'runwayMarkings: false' work/runtime/mission-v010.js
          grep -q 'propellerRootCount' work/runtime/mission-v010.js
          grep -q 'propellerDirections' work/runtime/mission-v010.js
          grep -q 'gearCount' work/runtime/mission-v010.js
          grep -q "parked: { label: '停机坪'" work/runtime/mission-v010.js
          grep -q 'sourcePhase: 0.3' work/runtime/mission-v010.js
          if grep -Eqi 'RUNWAY_24_06|asphalt|跑道中心线|跑道边灯' work/runtime/mission-v010.js work/runtime/mission-v010.css; then
            echo 'A paved or marked runway token remains in the R2 runtime.'
            exit 1
          fi

      - name: Replace the old public workbench with the exact R2 payload
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "public/$DESTINATION"
          mkdir -p "public/$DESTINATION/weather"
          cp work/build/index.html "public/$DESTINATION/index.html"
          cp work/runtime/mission-v010.js "public/$DESTINATION/mission-v010.js"
          cp work/runtime/mission-v010.css "public/$DESTINATION/mission-v010.css"
          cp work/runtime/weather/index.html "public/$DESTINATION/weather/index.html"
          cp "source/$SOURCE_DIR/README.md" "public/$DESTINATION/SOURCE_LOCKS.md"

      - name: Write publication provenance and static verification receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path('public') / os.environ['DESTINATION']
          files = {}
          for name in ('index.html', 'mission-v010.js', 'mission-v010.css', 'weather/index.html', 'SOURCE_LOCKS.md'):
              path = root / name
              data = path.read_bytes()
              files[name] = {
                  'bytes': len(data),
                  'sha256': hashlib.sha256(data).hexdigest(),
              }

          provenance = {
              'schema': 'haihao.aircraft/b24-v010-weather-pages-publication@2.0.0',
              'generatedAt': datetime.now(timezone.utc).isoformat(),
              'build': os.environ['BUILD_ID'],
              'sourceRepository': 'haihao0307/AIRCRAFT',
              'sourceCommit': os.environ['AIRCRAFT_COMMIT'],
              'sourcePath': os.environ['V010_SOURCE_PATH'],
              'exactV010': {
                  'bytes': int(os.environ['V010_BYTES']),
                  'sha256': os.environ['V010_SHA256'],
              },
              'authoritativeB24': {
                  'bytes': int(os.environ['B24_BYTES']),
                  'sha256': os.environ['B24_SHA256'],
                  'sourceMode': 'embedded-in-exact-v010',
              },
              'weatherMother': {
                  'version': os.environ['WEATHER_VERSION'],
                  'sourceCommit': os.environ['WEATHER_SOURCE_COMMIT'],
                  'sameWorkbench': True,
                  'separateWindow': False,
              },
              'runway': {
                  'surface': 'compacted-earth',
                  'markings': False,
              },
              'aircraftRuntime': {
                  'identifiedPropellerRoots': 15,
                  'propellerDirections': {'0': 1, '1': 1, '2': 1, '3': 1},
                  'identifiedGearNodes': 288,
                  'parkedSourcePhase': 0.3,
                  'landingSourcePhase': 0.3,
              },
              'frozen': {
                  'v010GeometryChanged': False,
                  'v010SourceAnimationChanged': False,
                  'v010MaterialsChanged': False,
                  'proceduralAircraftFallback': False,
              },
              'files': files,
              'localBrowserQa': {
                  'passed': True,
                  'reportSha256': 'b0137050724a0bc8dee9b46e29d55aa19f9bb600f0ea4dfd8d623a195141b416',
                  'consoleErrors': [],
                  'pageErrors': [],
                  'failedRequests': [],
              },
              'visualAcceptance': False,
              'productionReady': False,
          }
          (root / 'PUBLISH_PROVENANCE.json').write_text(
              json.dumps(provenance, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )

          receipt = {
              'schema': 'haihao.aircraft/b24-v010-weather-static-publication-qa@1.0.0',
              'passed': True,
              'build': os.environ['BUILD_ID'],
              'checks': {
                  'exactV010ShaLock': True,
                  'deterministicOutputShaLock': True,
                  'weatherMotherBundled': True,
                  'dirtRunway': True,
                  'runwayMarkingsAbsent': True,
                  'propellerContractPresent': True,
                  'landingGearContractPresent': True,
                  'oldPublicPayloadRemoved': True,
              },
              'files': files,
              'visualAcceptance': False,
              'productionReady': False,
          }
          (root / 'PUBLICATION_QA.json').write_text(
              json.dumps(receipt, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Validate the final Pages directory
        shell: bash
        run: |
          set -euo pipefail
          root="public/$DESTINATION"
          test -s "$root/index.html"
          test -s "$root/mission-v010.js"
          test -s "$root/mission-v010.css"
          test -s "$root/weather/index.html"
          test -s "$root/PUBLISH_PROVENANCE.json"
          test -s "$root/PUBLICATION_QA.json"
          test ! -e "$root/app.js"
          test ! -e "$root/styles.css"
          test ! -e "$root/b24.glb"
          echo "$OUTPUT_SHA256  $root/index.html" | sha256sum --check
          echo "$MISSION_JS_SHA256  $root/mission-v010.js" | sha256sum --check
          echo "$MISSION_CSS_SHA256  $root/mission-v010.css" | sha256sum --check
          echo "$WEATHER_HTML_SHA256  $root/weather/index.html" | sha256sum --check
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('public/aircraft/b24-weather-mission-v1')
          provenance = json.loads((root / 'PUBLISH_PROVENANCE.json').read_text(encoding='utf-8'))
          qa = json.loads((root / 'PUBLICATION_QA.json').read_text(encoding='utf-8'))
          assert provenance['build'] == 'B24_V010_WEATHER_MISSION_RECOVERY_R2'
          assert provenance['runway'] == {'surface': 'compacted-earth', 'markings': False}
          assert provenance['aircraftRuntime']['identifiedPropellerRoots'] == 15
          assert provenance['aircraftRuntime']['identifiedGearNodes'] == 288
          assert provenance['frozen']['v010GeometryChanged'] is False
          assert qa['passed'] is True
          PY

      - name: Commit and push the exact R2 workbench to GitHub Pages
        shell: bash
        run: |
          set -euo pipefail
          cd public
          git config user.name 'B24 V010 workbench publisher'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$DESTINATION"
          if git diff --cached --quiet; then
            echo 'GitHub Pages already contains the exact R2 payload.'
          else
            git commit -m 'fix(b24): publish exact V010 Weather workbench with dirt runway'
            git push origin HEAD:gh-pages
          fi

      - name: Upload exact public payload as workflow evidence
        uses: actions/upload-artifact@v4
        with:
          name: b24-v010-weather-dirt-runway-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: public/aircraft/b24-weather-mission-v1

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Exact B24 V010 plus Weather Mother publication'
            echo
            echo 'Build: B24_V010_WEATHER_MISSION_RECOVERY_R2'
            echo 'Exact user V010 SHA-256: locked'
            echo 'Weather Mother: 1.0.0-clean'
            echo 'Runway: compacted earth, no modern markings'
            echo 'Propeller roots: 15, unified continuous rotation contract'
            echo 'Landing gear nodes: 288, parked and landing phases down'
            echo 'V010 geometry, materials and source animation: unchanged'
            echo 'visualAcceptance=false'
            echo 'productionReady=false'
          } >> "$GITHUB_STEP_SUMMARY"
