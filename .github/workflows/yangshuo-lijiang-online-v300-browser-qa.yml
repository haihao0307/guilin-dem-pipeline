name: Yangshuo Lijiang 2048 online browser QA

on:
  push:
    branches:
      - skill/dem-procedural-landscape-v010
    paths:
      - .github/workflows/yangshuo-lijiang-online-v300-browser-qa.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yangshuo-lijiang-online-v300-browser-qa
  cancel-in-progress: true

env:
  PAGE_URL: https://haihao0307.github.io/guilin-dem-pipeline/yangshuo-lijiang-2048-v300/?candidate=D&qa=4

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Chromium QA dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium

      - name: Run real online Chromium QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/yangshuo-lijiang-online-v300-browser
          cat > "$RUNNER_TEMP/yangshuo_online_qa.py" <<'PY'
          import json
          import os
          import time
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          out = Path('reports/yangshuo-lijiang-online-v300-browser')
          out.mkdir(parents=True, exist_ok=True)
          url = os.environ['PAGE_URL']
          console = []
          page_errors = []
          request_failures = []
          data_responses = []
          started = time.time()
          initial = {}
          switched = {}
          failure = None

          def snapshot(page):
              return page.evaluate("""() => ({
                title: document.title,
                heading: document.querySelector('#title')?.textContent || null,
                status: document.querySelector('#statusMain')?.textContent || null,
                statusSub: document.querySelector('#statusSub')?.textContent || null,
                loadingTitle: document.querySelector('#loadingTitle')?.textContent || null,
                loadingText: document.querySelector('#loadingText')?.textContent || null,
                progressValue: document.querySelector('#progressValue')?.textContent || null,
                validFraction: document.querySelector('#validFraction')?.textContent || null,
                elevationRange: document.querySelector('#elevationRange')?.textContent || null,
                sourceGrid: document.querySelector('#sourceGrid')?.textContent || null,
                displayGrid: document.querySelector('#displayGrid')?.textContent || null,
                canvasCount: document.querySelectorAll('#viewer canvas').length,
                canvasWidth: document.querySelector('#viewer canvas')?.width || 0,
                canvasHeight: document.querySelector('#viewer canvas')?.height || 0,
                sourceOk: document.querySelector('#sourceCheck')?.classList.contains('ok') || false,
                windowOk: document.querySelector('#windowCheck')?.classList.contains('ok') || false,
                loadingOpacity: Number(getComputedStyle(document.querySelector('#loading')).opacity)
              })""")

          def assert_loaded(state, candidate):
              if state['status'] != '2048 原生窗口已加载':
                  raise RuntimeError(f'{candidate} did not reach loaded state: {state}')
              if f'候选 {candidate}' not in (state['statusSub'] or ''):
                  raise RuntimeError(f'{candidate} status label mismatch: {state}')
              if state['sourceGrid'] != '2048 × 2048':
                  raise RuntimeError(f'{candidate} source grid mismatch: {state}')
              if state['canvasCount'] < 1 or state['canvasWidth'] < 1000 or state['canvasHeight'] < 600:
                  raise RuntimeError(f'{candidate} WebGL canvas invalid: {state}')
              valid = float(state['validFraction'].replace('%', ''))
              if valid < 99.5 or not state['sourceOk'] or not state['windowOk']:
                  raise RuntimeError(f'{candidate} native-data gate failed: {state}')
              if state['loadingOpacity'] > 0.05:
                  raise RuntimeError(f'{candidate} loading overlay remains visible: {state}')

          with sync_playwright() as p:
              browser = p.chromium.launch(
                  headless=True,
                  args=['--use-gl=swiftshader', '--enable-webgl', '--ignore-gpu-blocklist'],
              )
              page = browser.new_page(viewport={'width': 1440, 'height': 900}, device_scale_factor=1)
              page.on('console', lambda msg: console.append({'type': msg.type, 'text': msg.text}))
              page.on('pageerror', lambda exc: page_errors.append(str(exc)))
              page.on('requestfailed', lambda request: request_failures.append({
                  'url': request.url,
                  'method': request.method,
                  'failure': request.failure,
              }))
              page.on('response', lambda response: data_responses.append({
                  'url': response.url,
                  'status': response.status,
                  'contentLength': response.headers.get('content-length'),
                  'contentType': response.headers.get('content-type'),
              }) if '/yangshuo-lijiang-2048-v300/data/' in response.url else None)
              try:
                  response = page.goto(url, wait_until='domcontentloaded', timeout=120_000)
                  if response is None or response.status != 200:
                      raise RuntimeError(f'Page HTTP status failed: {None if response is None else response.status}')
                  page.wait_for_selector('#statusMain', timeout=30_000)
                  page.wait_for_function(
                      "document.querySelector('#statusMain')?.textContent === '2048 原生窗口已加载' && Number(getComputedStyle(document.querySelector('#loading')).opacity) <= 0.05",
                      timeout=180_000,
                  )
                  initial = snapshot(page)
                  assert_loaded(initial, 'D')
                  page.screenshot(path=str(out / 'candidate-D-desktop.png'), full_page=True)

                  page.locator('.candidate').filter(has_text='A ·').click()
                  page.wait_for_function(
                      "document.querySelector('#statusSub')?.textContent.includes('候选 A') && document.querySelector('#statusMain')?.textContent === '2048 原生窗口已加载' && Number(getComputedStyle(document.querySelector('#loading')).opacity) <= 0.05",
                      timeout=180_000,
                  )
                  switched = snapshot(page)
                  assert_loaded(switched, 'A')
                  page.screenshot(path=str(out / 'candidate-A-desktop.png'), full_page=True)
              except Exception as exc:
                  failure = str(exc)
                  try:
                      if not initial:
                          initial = snapshot(page)
                      page.screenshot(path=str(out / 'failure-desktop.png'), full_page=True)
                  except Exception as capture_exc:
                      failure += f'; capture failed: {capture_exc}'
              finally:
                  browser.close()

          hard_console_errors = [x for x in console if x['type'] == 'error']
          bad_data_responses = [x for x in data_responses if x['status'] not in (200, 206)]
          passed = failure is None and not page_errors and not hard_console_errors and not request_failures and not bad_data_responses
          report = {
              'schema': 'yangshuo-lijiang-online-browser-qa/v3.0.2',
              'url': url,
              'elapsedSeconds': round(time.time() - started, 3),
              'initialCandidateD': initial,
              'switchedCandidateA': switched,
              'failure': failure,
              'pageErrors': page_errors,
              'consoleErrors': hard_console_errors,
              'requestFailures': request_failures,
              'dataResponses': data_responses,
              'badDataResponses': bad_data_responses,
              'console': console,
              'passed': passed,
          }
          (out / 'report.json').write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8')
          print('FINAL_REPORT ' + json.dumps(report, ensure_ascii=False), flush=True)
          PY
          python "$RUNNER_TEMP/yangshuo_online_qa.py"

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: yangshuo-lijiang-online-v300-browser-${{ github.sha }}
          path: reports/yangshuo-lijiang-online-v300-browser/**
          if-no-files-found: error
          retention-days: 30

      - name: Enforce native DEM live gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('reports/yangshuo-lijiang-online-v300-browser/report.json').read_text(encoding='utf-8'))
          if not report.get('passed'):
              raise SystemExit(json.dumps(report, ensure_ascii=False))
          PY
