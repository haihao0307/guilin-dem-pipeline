name: Motion R02 Readonly Native Hand Fixture
on:
  push:
    branches: [feature/motion-r02-thumb-cycles-20261013]
    paths: [.github/workflows/motion-r02-hand-fixture.yml]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Existing R01 full R04 geometry, no product changes
        run: |
          mkdir -p hand-fixture
          cat > fixture.cjs <<'JS'
          const fs=require('fs'),zlib=require('zlib'),{chromium}=require('playwright');
          (async()=>{const b=await chromium.launch({headless:true,args:['--no-sandbox','--use-angle=swiftshader','--enable-unsafe-swiftshader']}),p=await b.newPage({viewport:{width:1000,height:800}});await p.goto('https://htmlpreview.github.io/?https://raw.githubusercontent.com/haihao0307/guilin-dem-pipeline/773f717b38ff5adf776c99fc30f06c113b4727a6/kaopu-unified-human-workbench/motion-review-r01/preview.html',{waitUntil:'domcontentloaded',timeout:100000});await p.waitForFunction(()=>window.motionReview?.ready&&!motionReview.busy&&motionReview.clip,null,{timeout:190000});const data=await p.evaluate(()=>{const r=motionReview,h=r.binding;r.play(false);return{sourceBuild:'773f717b38ff5adf776c99fc30f06c113b4727a6',purpose:'readonly actual retained R04 hand geometry diagnostic, not a substitute delivery model',rig:h.rig,positions:Array.from(h.positions),range:Array.from(h.range),packed:Array.from(h.packed),faces:Array.from(r.model.faces),height:h.height,floorOffset:h.floorOffset,N:h.N,bodyCount:r.model.bodyCount,report:h.report,display:{positions:Array.from(h.geometry.attributes.position.array),normals:Array.from(h.geometry.attributes.normal.array),indices:Array.from(h.geometry.index.array)},state:r.model.state};});fs.writeFileSync('hand-fixture/native-r04.json.gz',zlib.gzipSync(Buffer.from(JSON.stringify(data))));await b.close();})();
          JS
          timeout 260 node fixture.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: motion-r02-actual-native-hand
          path: hand-fixture
          retention-days: 7
