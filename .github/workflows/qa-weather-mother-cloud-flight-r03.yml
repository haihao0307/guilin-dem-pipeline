name: QA Weather Mother Cloud Flight R0.3

on:
  push:
    branches:
      - feature/weather-mother-cloud-flight-r03
    paths:
      - .github/workflows/qa-weather-mother-cloud-flight-r03.yml

permissions:
  contents: write

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install browser harness
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/wm-r03-qa
          cd /tmp/wm-r03-qa
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null
          npx playwright install chromium

      - name: Run WebGL2 flight QA
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/wm-r03-qa/qa.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import path from 'node:path';

          const root=process.cwd();
          const htmlPath=path.join(root,'weather-mother/deliveries/weather-mother-cloud-flight-r03.html');
          let html=fs.readFileSync(htmlPath,'utf8');
          html=html.replace("const qaCapture=new URLSearchParams(location.search).get('qa')==='1';","const qaCapture=true;");
          const outDir=path.join(root,'weather-mother/deliveries');
          const sha=b=>crypto.createHash('sha256').update(b).digest('hex');
          const browser=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-webgl','--ignore-gpu-blocklist','--disable-dev-shm-usage']});
          const page=await browser.newPage({viewport:{width:1280,height:800},deviceScaleFactor:1});
          const consoleErrors=[],pageErrors=[],requests=[];
          page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
          page.on('pageerror',e=>pageErrors.push(String(e)));
          page.on('request',r=>requests.push(r.url()));
          await page.setContent(html,{waitUntil:'domcontentloaded'});
          await page.waitForFunction(()=>typeof window.__WM_R03==='object',{timeout:120000});
          await page.evaluate(()=>{const s=window.__WM_R03.state;s.paused=true;s.time=4.25;s.quality=0;});
          await page.waitForTimeout(700);

          const state0=await page.evaluate(()=>JSON.parse(JSON.stringify(window.__WM_R03.state)));
          const errText=await page.locator('#errText').textContent();
          const errorDisplay=await page.locator('#error').evaluate(e=>getComputedStyle(e).display);
          await page.screenshot({path:path.join(outDir,'wm-r03-orbit.png')});

          const canvasHash=async()=>sha(Buffer.from((await page.locator('#c').screenshot())));
          const orbitHash=await canvasHash();

          await page.evaluate(()=>{window.__WM_R03.setCamMode(1);window.__WM_R03.resetFlight();const s=window.__WM_R03.state;s.paused=true;s.time=4.25;s.quality=0;});
          await page.waitForTimeout(700);
          const flightOutsideHash=await canvasHash();
          await page.screenshot({path:path.join(outDir,'wm-r03-flight-outside.png')});
          const densityBefore=await page.evaluate(()=>{const s=window.__WM_R03.state;return {type:s.type,detail:s.detail,oct:s.oct,scale:s.scale,cover:s.cover,ext:s.ext,wet:s.wet,speed:s.speed,time:s.time}});

          await page.evaluate(()=>{const s=window.__WM_R03.state;s.flightPos=[-2.8,1.10,8.15];s.flightYaw=0;s.flightPitch=.01;});
          await page.waitForTimeout(700);
          const flightCoreHash=await canvasHash();
          await page.screenshot({path:path.join(outDir,'wm-r03-flight-core.png')});
          const densityAfter=await page.evaluate(()=>{const s=window.__WM_R03.state;return {type:s.type,detail:s.detail,oct:s.oct,scale:s.scale,cover:s.cover,ext:s.ext,wet:s.wet,speed:s.speed,time:s.time}});

          await page.evaluate(()=>{window.__WM_R03.resetFlight();const s=window.__WM_R03.state;s.paused=true;s.time=4.25;});
          await page.waitForTimeout(500);
          const resetA=await canvasHash();
          await page.evaluate(()=>{const s=window.__WM_R03.state;s.flightPos=[5.1,3.2,-18.0];s.flightYaw=.7;s.flightPitch=-.2;});
          await page.waitForTimeout(400);
          await page.evaluate(()=>{window.__WM_R03.resetFlight();const s=window.__WM_R03.state;s.paused=true;s.time=4.25;});
          await page.waitForTimeout(500);
          const resetB=await canvasHash();

          const z0=await page.evaluate(()=>window.__WM_R03.state.flightPos[2]);
          await page.keyboard.down('KeyW');await page.waitForTimeout(350);await page.keyboard.up('KeyW');await page.waitForTimeout(150);
          const z1=await page.evaluate(()=>window.__WM_R03.state.flightPos[2]);

          await page.evaluate(()=>{window.__WM_R03.resetFlight();window.__WM_R03.state.flightAuto=true;});
          const az0=await page.evaluate(()=>window.__WM_R03.state.flightPos[2]);
          await page.waitForTimeout(500);
          const az1=await page.evaluate(()=>window.__WM_R03.state.flightPos[2]);
          await page.evaluate(()=>window.__WM_R03.state.flightAuto=false);

          const genus=[];
          for(let i=0;i<10;i++){
            await page.evaluate(i=>{window.__WM_R03.selectType(i,false);const s=window.__WM_R03.state;s.paused=true;s.time=4.25;},i);
            await page.waitForTimeout(180);
            genus.push({i,code:await page.evaluate(()=>window.__WM_R03.cloudTypes[window.__WM_R03.state.type].code),hash:await canvasHash()});
          }

          await page.setViewportSize({width:390,height:844});
          await page.evaluate(()=>{window.__WM_R03.selectType(0,false);window.__WM_R03.setCamMode(1);window.__WM_R03.resetFlight();const s=window.__WM_R03.state;s.paused=true;s.time=4.25;s.quality=0;});
          await page.waitForTimeout(600);
          await page.screenshot({path:path.join(outDir,'wm-r03-mobile-390x844.png')});
          const mobile=await page.evaluate(()=>{const pad=document.getElementById('flightPad').getBoundingClientRect(),can=document.getElementById('c').getBoundingClientRect(),toggle=document.getElementById('mobileToggle').getBoundingClientRect();return {pad:{x:pad.x,y:pad.y,w:pad.width,h:pad.height},canvas:{w:can.width,h:can.height},toggle:{x:toggle.x,y:toggle.y,w:toggle.width,h:toggle.height},padOn:document.getElementById('flightPad').classList.contains('on'),hudOn:document.getElementById('flightHud').classList.contains('on')}});

          const report={
            schema:'weather-mother-cloud-flight-qa/r0.3',
            version:'R0.3',
            artifact:path.basename(htmlPath),
            artifactBytes:fs.statSync(htmlPath).size,
            artifactSHA256:sha(fs.readFileSync(htmlPath)),
            browser:'Playwright Chromium / ANGLE SwiftShader',
            tests:{
              webgl2:{pass:errorDisplay==='none' && !errText},
              globalContract:{pass:state0.type===0 && state0.camMode===0},
              orbitRenders:{pass:!!orbitHash,hash:orbitHash},
              flightModeRenders:{pass:flightOutsideHash!==orbitHash,outsideHash:flightOutsideHash},
              cameraDoesNotMutateDensity:{pass:JSON.stringify(densityBefore)===JSON.stringify(densityAfter),before:densityBefore,after:densityAfter},
              coreCrossingChangesView:{pass:flightCoreHash!==flightOutsideHash,coreHash:flightCoreHash},
              deterministicFlightReset:{pass:resetA===resetB,hashA:resetA,hashB:resetB},
              manualForwardMotion:{pass:z1<z0-0.05,z0,z1},
              autoFlightMotion:{pass:az1<az0-0.05,z0:az0,z1:az1},
              tenGeneraInFlight:{pass:new Set(genus.map(x=>x.hash)).size===10,uniqueHashes:new Set(genus.map(x=>x.hash)).size,genus},
              mobile390x844:{pass:mobile.padOn&&mobile.hudOn&&mobile.canvas.w===390&&mobile.canvas.h===844&&mobile.pad.y>=0&&mobile.pad.y+mobile.pad.h<=844,mobile},
              runtimeRequests:{pass:requests.length===0,count:requests.length,requests},
              console:{pass:consoleErrors.length===0&&pageErrors.length===0,consoleErrors,pageErrors}
            },
            evidenceFiles:['wm-r03-orbit.png','wm-r03-flight-outside.png','wm-r03-flight-core.png','wm-r03-mobile-390x844.png'],
            visualAcceptance:false,
            productionReady:false
          };
          report.overallPass=Object.values(report.tests).every(t=>t.pass===true);
          fs.writeFileSync(path.join(outDir,'weather-mother-cloud-flight-r03-qa.json'),JSON.stringify(report,null,2)+'\n');
          console.log(JSON.stringify(report,null,2));
          await browser.close();
          if(!report.overallPass)process.exit(2);
          JS
          cd /tmp/wm-r03-qa
          node qa.mjs

      - name: Commit QA evidence
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Weather Mother CI'
          git config user.email 'weather-mother-ci@users.noreply.github.com'
          git add \
            weather-mother/deliveries/weather-mother-cloud-flight-r03-qa.json \
            weather-mother/deliveries/wm-r03-orbit.png \
            weather-mother/deliveries/wm-r03-flight-outside.png \
            weather-mother/deliveries/wm-r03-flight-core.png \
            weather-mother/deliveries/wm-r03-mobile-390x844.png
          git commit -m 'qa(weather-mother): validate cloud flight R0.3 [skip ci]'
          git push origin HEAD:feature/weather-mother-cloud-flight-r03
