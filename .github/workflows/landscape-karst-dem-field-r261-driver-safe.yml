name: Landscape Karst DEM Field R2.6.1 Driver Safe

on:
  push:
    branches:
      - feature/landscape-karst-dem-field-r26-cracks-20260921
    paths:
      - workbenches/landscape-karst-dem-field-r2-6-1-driver-safe/build_r261.py
      - .github/workflows/landscape-karst-dem-field-r261-driver-safe.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build R2.6.1 driver-safe DEM field
        run: |
          python -m py_compile workbenches/landscape-karst-dem-field-r2-6-1-driver-safe/build_r261.py
          python workbenches/landscape-karst-dem-field-r2-6-1-driver-safe/build_r261.py

      - name: Static contract and shader compilation
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,re
          root=Path('workbenches/landscape-karst-dem-field-r2-6-1-driver-safe')
          s=(root/'index.html').read_text(encoding='utf-8')
          b=json.loads((root/'build.json').read_text(encoding='utf-8'))
          required=[
            'PALAU_KARST_DEM_FIELD_R261_DRIVER_SAFE',
            'DEM 连续山体（默认生产验证）',
            'crackNetwork','pocketField','demFieldBase',
            'geometryVisible','karstColorProbe',
            'uCrackDepth','uCrackWidth','uCrackBranch','uPocketStrength',
            '__KARST_FIELD_CONTRACT__','dataset.karstOutputVisible'
          ]
          for token in required: assert token in s, token
          assert b['schema']=='LANDSCAPE_KARST_DEM_FIELD_R261_DRIVER_SAFE'
          assert b['defaultMode']=='DEM_CONTINUOUS_FIELD'
          assert 'conservative DEM distance bound' in b['driverFixes']
          for name,file in [('VS','/tmp/r261.vert'),('GEOMETRY_FS','/tmp/r261-geom.frag'),('MATERIAL_FS','/tmp/r261-mat.frag')]:
            m=re.search(rf'const {name}=`(.*?)`;',s,re.S);assert m,name
            Path(file).write_text(m.group(1),encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',s,re.S);assert scripts
          Path('/tmp/r261-app.js').write_text(scripts[-1],encoding='utf-8')
          PY
          node --check /tmp/r261-app.js
          sudo apt-get update -qq
          sudo apt-get install -y -qq glslang-tools
          glslangValidator -S vert /tmp/r261.vert
          glslangValidator -S frag /tmp/r261-geom.frag
          glslangValidator -S frag /tmp/r261-mat.frag

      - name: Run Chromium and validate non-uniform output
        run: |
          python3 -m http.server 8000 >/tmp/http.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/ >/dev/null; then break; fi
            sleep .25
          done
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)
          if [ -z "$CHROME" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq chromium-browser || sudo apt-get install -y -qq chromium
            CHROME=$(command -v chromium || command -v chromium-browser)
          fi
          URL=http://127.0.0.1:8000/workbenches/landscape-karst-dem-field-r2-6-1-driver-safe/index.html
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage \
            --use-angle=swiftshader --enable-unsafe-swiftshader --ignore-gpu-blocklist \
            --run-all-compositor-stages-before-draw --virtual-time-budget=36000 \
            --dump-dom "$URL" >/tmp/r261-dom.html 2>/tmp/r261-chrome.log
          grep -q 'data-karst-ready="true"' /tmp/r261-dom.html
          grep -q 'data-karst-output-visible="true"' /tmp/r261-dom.html
          ! grep -q 'data-karst-failure' /tmp/r261-dom.html
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage \
            --use-angle=swiftshader --enable-unsafe-swiftshader --ignore-gpu-blocklist \
            --run-all-compositor-stages-before-draw --virtual-time-budget=36000 \
            --window-size=1600,900 --screenshot=/tmp/r261.png "$URL" \
            >/tmp/r261-shot.log 2>&1
          test -s /tmp/r261.png
          python -m pip install -q pillow
          python - <<'PY'
          from PIL import Image, ImageStat
          im=Image.open('/tmp/r261.png').convert('RGB')
          stat=ImageStat.Stat(im)
          extrema=stat.extrema
          spread=sum(hi-lo for lo,hi in extrema)
          pixels=list(im.resize((80,45)).getdata())
          bright=sum(1 for r,g,b in pixels if r>245 and g>245 and b>245)/len(pixels)
          dark=sum(1 for r,g,b in pixels if r<18 and g<18 and b<18)/len(pixels)
          assert spread>55, (extrema,spread)
          assert bright<0.92, bright
          assert dark<0.92, dark
          print({'extrema':extrema,'spread':spread,'bright_ratio':bright,'dark_ratio':dark})
          PY
          mkdir -p /tmp/r261-proof
          cp /tmp/r261.png /tmp/r261-proof/r261.png
          cp /tmp/r261-dom.html /tmp/r261-proof/dom.html
          cp /tmp/r261-chrome.log /tmp/r261-proof/chrome.log
          cp workbenches/landscape-karst-dem-field-r2-6-1-driver-safe/build.json /tmp/r261-proof/build.json

      - uses: actions/upload-artifact@v4
        with:
          name: landscape-karst-dem-field-r261-driver-safe-proof
          path: /tmp/r261-proof
          retention-days: 7

      - name: Materialize browser-tested R2.6.1
        run: |
          git config user.name "Landscape Mother"
          git config user.email "actions@users.noreply.github.com"
          git add workbenches/landscape-karst-dem-field-r2-6-1-driver-safe/index.html \
                  workbenches/landscape-karst-dem-field-r2-6-1-driver-safe/build.json
          if git diff --cached --quiet; then
            echo "R2.6.1 already materialized"
            exit 0
          fi
          git commit -m "fix(landscape): materialize browser-tested R2.6.1 driver-safe DEM field [skip ci]"
          git push
