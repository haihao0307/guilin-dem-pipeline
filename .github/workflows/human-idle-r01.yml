name: Human lifelike idle R01
on:
  push:
    branches: [feature/human-lifelike-idle-r01-20261011]
    paths: ['.github/workflows/human-idle-r01.yml', 'kaopu-unified-human-workbench/idle-r01/**']
permissions:
  contents: read
concurrency:
  group: human-idle-r01
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            kaopu-unified-human-workbench
            kaopu-anny-workbench
            .github/workflows
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install --no-save --package-lock=false playwright@1.58.2 esbuild@0.25.11
      - run: npx playwright install --with-deps chromium
      - run: node kaopu-unified-human-workbench/idle-r01/probe.cjs
      - name: Snapshot build tools and missing source
        if: always()
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path
          Path('idle-evidence').mkdir(exist_ok=True)
          with zipfile.ZipFile('idle-evidence/build-tools.zip','w',zipfile.ZIP_DEFLATED) as z:
            for root in ['kaopu-unified-human-workbench','node_modules']:
              for p in Path(root).rglob('*'):
                if p.is_file() and (root=='node_modules' or p.suffix in ['.cjs','.png']):z.write(p)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: human-idle-probe-${{ github.run_number }}
          path: idle-evidence/
          retention-days: 2
