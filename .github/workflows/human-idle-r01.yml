name: Human lifelike idle R01
on:
  push:
    branches: [feature/human-lifelike-idle-r01-20261011]
    paths: ['.github/workflows/human-idle-r01.yml', 'kaopu-unified-human-workbench/idle-r01/**']
permissions:
  contents: write
concurrency:
  group: human-idle-r01
  cancel-in-progress: false
jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          sparse-checkout: |
            kaopu-unified-human-workbench
            kaopu-anny-workbench
            .github/workflows
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install --no-save --package-lock=false playwright@1.58.2 esbuild@0.25.11
      - run: npx playwright install --with-deps chromium
      - name: Source identity and timeline regression
        run: |
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          mkdir -p idle-evidence
          node kaopu-unified-human-workbench/idle-r01/test-timeline.mjs | tee idle-evidence/timeline.json
      - name: Build original character with native idle
        run: node kaopu-unified-human-workbench/idle-r01/build.cjs
      - name: Actual source browser QA
        run: node kaopu-unified-human-workbench/idle-r01/verify.cjs
      - name: Publish immutable candidate on this branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p kaopu-unified-human-workbench/idle-r01/evidence
          cp idle-evidence/qa.json kaopu-unified-human-workbench/idle-r01/evidence/source-qa.json
          cp idle-evidence/timeline.json kaopu-unified-human-workbench/idle-r01/evidence/timeline.json
          git add kaopu-unified-human-workbench/idle-r01/preview.html kaopu-unified-human-workbench/idle-r01/BUILD.json kaopu-unified-human-workbench/idle-r01/evidence/
          git commit -m 'build(idle): native character idle candidate with source-browser QA'
          git push origin HEAD:feature/human-lifelike-idle-r01-20261011
          echo "BUILD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Real fixed-public URL browser QA
        env:
          QA_OUT: public-evidence
          PUBLIC_ONLY: '1'
        run: |
          export PREVIEW_URL="https://htmlpreview.github.io/?https://raw.githubusercontent.com/haihao0307/guilin-dem-pipeline/${BUILD_SHA}/kaopu-unified-human-workbench/idle-r01/preview.html"
          node kaopu-unified-human-workbench/idle-r01/verify.cjs
      - name: Preserve public evidence and delivery receipt
        run: |
          cp public-evidence/qa.json kaopu-unified-human-workbench/idle-r01/evidence/public-qa.json
          python - <<'PY'
          import os,json
          from pathlib import Path
          p=Path('kaopu-unified-human-workbench/idle-r01')
          qa=json.loads(Path('public-evidence/qa.json').read_text())
          assert qa['completed'] and not qa['pageErrors'] and not qa['consoleErrors']
          build=os.environ['BUILD_SHA'];source=os.environ['SOURCE_SHA'];run=os.environ['GITHUB_RUN_ID']
          url=f'https://htmlpreview.github.io/?https://raw.githubusercontent.com/haihao0307/guilin-dem-pipeline/{build}/kaopu-unified-human-workbench/idle-r01/preview.html'
          receipt={'version':'ET19-IDLE-R01','sourceCommit':source,'buildCommit':build,'publicURL':url,'run':run,'publicBrowserVerified':True,'userVisualAccepted':False,'productionReady':False,'referenceVideoMeasuredMocap':False,'bodyLocomotionChanged':False,'realPhoneTested':False,'hardwarePerformanceCertified':False}
          (p/'DELIVERY.json').write_text(json.dumps(receipt,ensure_ascii=False,indent=2)+'\n')
          (p/'DELIVERY.md').write_text(f'# ET19-IDLE-R01 待机候选\n\n固定网页：{url}\n\n源码：`{source}`；构建：`{build}`。\n\nActions：https://github.com/haihao0307/guilin-dem-pipeline/actions/runs/{run}\n\n真实源码与固定公网浏览器测试已执行；具体检查见 evidence/source-qa.json 与 evidence/public-qa.json。截图在同一运行的 artifact，需人工检查后才可讨论视觉质量。自动测试不得代替用户视觉验收。\n\n这是原人物上的自然待机候选，不是影视级成品。只增加当前人物形体模式的待机；原走跑、多人擂台、所有旧页面保留。动作来自原生参数的有界临时形变；呼吸为姿态近似，未新增肌肉、组织或口腔碰撞。皮肤只做已有频带和反射分区改进；未取得视频作者的贴图或完整技术。\n\n1280×960 桌面与390×844手机视口；后者不是实机。软件GPU不是用户显卡帧率证明。首次需要原平台固定在线原生资产，并非完整离线版。\n\n保留 Draft，不合并、不强推。原 ET18 链接不变。\n')
          PY
          git add kaopu-unified-human-workbench/idle-r01/DELIVERY.md kaopu-unified-human-workbench/idle-r01/DELIVERY.json kaopu-unified-human-workbench/idle-r01/evidence/public-qa.json
          git commit -m 'docs(idle): record actual fixed-public browser delivery evidence'
          git push origin HEAD:feature/human-lifelike-idle-r01-20261011
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: human-idle-r01-${{ github.run_number }}
          path: |
            idle-evidence/
            public-evidence/
            kaopu-unified-human-workbench/idle-r01/
          retention-days: 14
