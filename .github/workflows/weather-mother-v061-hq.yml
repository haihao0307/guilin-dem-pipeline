name: Weather Mother V061 HQ
on:
  push:
    branches: [gh-pages]
    paths:
      - weather-mother/v061-hq/build.py
      - weather-mother/v061-hq/polish.py
      - weather-mother/v061-hq/qa.py
      - weather-mother/v061-hq/public-verify.py
      - weather-mother/v061-hq/PUBLIC_CHECK.json
      - .github/workflows/weather-mother-v061-hq.yml
permissions:
  contents: write
concurrency:
  group: weather-mother-v061-hq
  cancel-in-progress: false
jobs:
  build-and-test:
    if: ${{ !contains(github.event.head_commit.message, '[weather-public]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 1
          sparse-checkout: |
            weather-mother/v060
            weather-mother/v061-hq
            .github/workflows
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and apply the inspected visual refinement
        run: |
          python weather-mother/v061-hq/build.py
          python weather-mother/v061-hq/polish.py
      - name: Install Chromium test dependencies
        run: |
          python -m pip install playwright pillow
          python -m playwright install --with-deps chromium
      - name: Real browser, full workbench and independent motion QA
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/weather-hq-http.log 2>&1 &
          python weather-mother/v061-hq/qa.py
      - name: Commit only tested HQ files
        run: |
          python -c 'import json;from pathlib import Path;r=Path("weather-mother/v061-hq");q=json.loads((r/"QA.json").read_text());assert q["status"]=="AUTOMATIC_QA_PASS";m=json.loads((r/"MANIFEST.json").read_text());m["status"]="AUTOMATIC_QA_PASS";m["qaChecks"]=len(q["checks"]);(r/"MANIFEST.json").write_text(json.dumps(m,ensure_ascii=False,indent=2)+"\n")'
          git config user.name 'Weather Mother build'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add weather-mother/v061-hq/index.html weather-mother/v061-hq/engine.js weather-mother/v061-hq/cloud.glsl weather-mother/v061-hq/field-worker.js weather-mother/v061-hq/MANIFEST.json weather-mother/v061-hq/QA.json
          if ! git diff --cached --quiet; then
            git commit -m 'feat(weather-mother): publish browser-tested HQ revision 2 with finer cloud structure'
            for attempt in 1 2 3; do
              git pull --rebase origin gh-pages
              if git push origin HEAD:gh-pages; then exit 0; fi
              sleep 2
            done
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weather-mother-v061-hq-source-and-qa
          retention-days: 7
          path: |
            weather-mother/v061-hq/index.html
            weather-mother/v061-hq/engine.js
            weather-mother/v061-hq/cloud.glsl
            weather-mother/v061-hq/field-worker.js
            weather-mother/v061-hq/MANIFEST.json
            weather-mother/v061-hq/QA.json
      - name: Summary
        if: always()
        run: |
          echo '## Weather Mother HQ' >> "$GITHUB_STEP_SUMMARY"
          echo 'Isolated candidate only. No images stored. AAA and manual visual approval remain false.' >> "$GITHUB_STEP_SUMMARY"
          if [ -f weather-mother/v061-hq/QA.json ]; then python -c 'import json;d=json.load(open("weather-mother/v061-hq/QA.json"));print(d["status"],len(d["checks"]),"checks")' >> "$GITHUB_STEP_SUMMARY"; fi
  public-verification:
    if: ${{ contains(github.event.head_commit.message, '[weather-public]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          sparse-checkout: weather-mother/v061-hq
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install playwright pillow
          python -m playwright install --with-deps chromium
      - name: Verify live Pages bytes and real browser
        run: python weather-mother/v061-hq/public-verify.py
      - name: Record public receipt only
        run: |
          git config user.name 'Weather Mother public QA'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add weather-mother/v061-hq/PUBLIC_QA.json
          if ! git diff --cached --quiet; then
            git commit -m 'test(weather-mother): record live HQ publication and browser verification'
            git pull --rebase origin gh-pages
            git push origin HEAD:gh-pages
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weather-mother-v061-public-qa
          path: weather-mother/v061-hq/PUBLIC_QA.json
          retention-days: 7
