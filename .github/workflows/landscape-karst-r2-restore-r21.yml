name: Landscape Karst R2 Restore R2.1

on:
  push:
    branches:
      - feature/landscape-karst-r2-restore-20260910
    paths:
      - .github/workflows/landscape-karst-r2-restore-r21.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/landscape-karst-r2-restore-20260910
          fetch-depth: 1
      - name: Derive R2.1 from exact R2 geometry
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re, hashlib, json
          src = Path('workbenches/landscape-karst-kaopu-r2/index.html').read_text()
          pat = r'(float ground\(vec2 x\).*?vec3 nor\(vec3 p\).*?\}\n)(?=float micro)'
          m = re.search(pat, src, re.S)
          assert m
          base_geom = m.group(1)
          assert hashlib.sha256(base_geom.encode()).hexdigest() == '2fb61a81d91aa8efd0e792146a04ee3b483188bbb500f926597898bd9c819ea4'
          text = src
          text = text.replace('data-kaopu="candidate-0.2"','data-kaopu="candidate-0.2.1"')
          text = text.replace('Landscape Mother · 喀斯特峰丛 KAOPU R2</title>','Landscape Mother · 喀斯特峰丛 KAOPU R2.1 RESTORE</title>')
          text = text.replace('喀斯特峰丛轻量样板 R2</div>','喀斯特峰丛轻量样板 R2.1 · 回退续作</div>')
          text = text.replace('五座非同构峰体、洞拱切削与坡脚—鞍部连续关系。先生成高度、边缘与破损，再由曲率和结构派生色区；粗糙度保持独立。合成研究样板，不冒充 DEM 或地质调查。','完整保留 R2 的五峰、洞拱、峰脚—鞍部与几何字段；本轮只调整显微法线和结构派生材质，不改变主形。合成研究样板，不冒充 DEM 或地质调查。')
          text = text.replace('"id":"KAOPU:SYNTHETIC:LANDSCAPE:KARST_CLUSTER:R2"','"id":"KAOPU:SYNTHETIC:LANDSCAPE:KARST_CLUSTER:R2.1"')
          text = text.replace('"name":"喀斯特峰丛轻量样板 R2"','"name":"喀斯特峰丛轻量样板 R2.1 · 回退续作"')
          text = text.replace('"version":"landscape-karst-kaopu-r2"','"version":"landscape-karst-kaopu-r2.1-restore"')
          old = re.search(r'float micro\(vec3 p\).*?vec3 microN\(vec3 p,vec3 n\).*?\}\n', text, re.S)
          assert old
          new = '''mat3 microFrame(vec3 p){vec3 b=floor((p+vec3(31.7,17.3,-11.9))*.055),m=floor((p+vec3(-7.2,23.4,19.1))*.11);float sb=n3(b*.173+vec3(17.1,3.7,9.2))-.5,smn=n3(m*.219+vec3(5.4,29.1,13.8))-.5;float lx=n3(p*.065+vec3(71.3,-4.7,22.6))-.5,lz=n3(p*.082+vec3(-13.2,37.5,8.1))-.5;vec3 z=normalize(vec3(.18*sb+.09*lx,1.,.18*smn+.09*lz));vec3 ref=normalize(vec3(.29,.84,.46));vec3 x=normalize(cross(ref,z)+vec3(1e-4,0.,0.));vec3 y=normalize(cross(z,x));return mat3(x,y,z);}float micro(vec3 p){mat3 F=microFrame(p);vec3 a=transpose(F)*(p+vec3(6.2,-2.1,3.7));float L=log2(max(length(a*.18),.18)),A=.50,S=0.,f=1.;for(int i=0;i<7;i++){vec3 z=a*.255*f;float w=cos(z.x+.58*cos(z.y*1.27))+cos(z.z*1.13-L*f*.39)+.48*cos(dot(z,normalize(vec3(.34,.78,.52))));S+=A*cos(w);f*=1.94;A*=.50;}return S;}vec3 microN(vec3 p,vec3 n){float e=.014,a=micro(p),x=micro(p+vec3(e,0,0))-a,y=micro(p+vec3(0,e,0))-a,z=micro(p+vec3(0,0,e))-a;vec3 g=vec3(x,y,z)/e;return normalize(n-.024*(g-n*dot(g,n)));}\n'''
          text = text[:old.start()] + new + text[old.end():]
          oldm = re.search(r'float curv\(vec3 p\).*?vec3 matc\(vec3 p,vec3 n,float A,float cv,out float wet,out float rough\).*?return c;\}', text, re.S)
          assert oldm
          newm = '''float curv(vec3 p){float e=.115,c=field(p),l=field(p+vec3(e,0,0))+field(p-vec3(e,0,0))+field(p+vec3(0,e,0))+field(p-vec3(0,e,0))+field(p+vec3(0,0,e))+field(p-vec3(0,0,e))-6.*c;return clamp(l/(e*e)*.11,-1.,1.);}float roughv(vec3 p,vec3 n,float A,float cv,float wet){float sl=1.-clamp(n.y,0.,1.),pit=smoothstep(.06,.62,-cv),grain=.5+.5*micro(p*.88+vec3(4.2,-1.7,3.6)),pore=smoothstep(.72,.94,n3(p*.34+vec3(19.,7.,31.)));return clamp(.59+.13*grain+.09*pit+.06*sl+.06*pore-.42*wet,.19,.91);}vec3 matc(vec3 p,vec3 n,float A,float cv,out float wet,out float rough){float sl=1.-clamp(n.y,0.,1.),low=1.-smoothstep(1.,12.,p.y),cav=1.-A,edge=smoothstep(.06,.58,cv),pit=smoothstep(.06,.62,-cv),mineral=smoothstep(.24,.76,n3(p*.052+vec3(307.,41.,-23.)));wet=clamp(low*.44+cav*.73+pit*.24+sl*.08,0.,1.);float mo=clamp((.72-sl)*1.52*(.27+.88*fb(p*.21+503.)),0.,1.)*(1.-smoothstep(.70,1.,wet));vec3 limestone=mix(vec3(.455,.455,.405),vec3(.585,.558,.468),mineral),fresh=vec3(.67,.635,.545),weathered=vec3(.335,.345,.305),dark=vec3(.155,.19,.17),moss=vec3(.18,.285,.17);vec3 c=limestone;c=mix(c,fresh,edge*.22);c=mix(c,weathered,clamp(pit*.40+cav*.25,0.,.62));c=mix(c,dark,wet*.46);c=mix(c,moss,mo*.46);rough=roughv(p,n,A,cv,wet);return c;}'''
          text = text[:oldm.start()] + newm + text[oldm.end():]
          text = text.replace("status.textContent='R2 字段图已就绪 · 全屏覆盖修复 · 合成候选'","status.textContent='R2.1 回退续作 · R2 主形/洞拱/几何字段锁定不变'")
          m2 = re.search(r'(float ground\(vec2 x\).*?vec3 nor\(vec3 p\).*?\}\n)(?=mat3 microFrame)', text, re.S)
          assert m2 and m2.group(1) == base_geom
          out = Path('workbenches/landscape-karst-kaopu-r2-1-restore/index.html')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(text)
          qa = {
            'version':'R2.1-RESTORE',
            'sourceR2Commit':'efec9e4abd6d85ba1374ee78b66c3d40009513c4',
            'r2GeometrySHA256':'2fb61a81d91aa8efd0e792146a04ee3b483188bbb500f926597898bd9c819ea4',
            'geometryIdenticalToR2':True,
            'htmlBytes':out.stat().st_size,
            'htmlSHA256':hashlib.sha256(out.read_bytes()).hexdigest(),
            'changes':['micro-normal orientation only','structure-derived material tuning only'],
            'abandoned':['R4','R5','R6'],
            'visualApproved':False,
            'productionReady':False
          }
          Path('workbenches/landscape-karst-kaopu-r2-1-restore/QA.json').write_text(json.dumps(qa,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Commit R2.1 restore candidate
        shell: bash
        run: |
          git config user.name "Landscape Mother"
          git config user.email "actions@users.noreply.github.com"
          git add workbenches/landscape-karst-kaopu-r2-1-restore/index.html workbenches/landscape-karst-kaopu-r2-1-restore/QA.json
          git commit -m "build(landscape): restore R2 geometry and continue material-only"
          git push origin HEAD:feature/landscape-karst-r2-restore-20260910
