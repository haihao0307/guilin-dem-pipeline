name: Coral R07 Massive P08 Localized QA

on:
  push:
    branches:
      - work/coral-mother-r07-massive-porites-p02-outward-surface-20260921
    paths:
      - tools/coral/coral_r07_massive_p08_browser_qa_runner.py
      - .github/workflows/coral-r07-massive-p08-localized.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coral-r07-massive-p08
  cancel-in-progress: true

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out R07 P08 work branch
        uses: actions/checkout@v4
        with:
          ref: work/coral-mother-r07-massive-porites-p02-outward-surface-20260921
          fetch-depth: 1
          path: work

      - name: Check out current GitHub Pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 1
          path: pages

      - name: Build P00 and apply P01-P08 corrections
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/coral-r07-p08
          python3 work/tools/coral/coral_r07_massive_p00_builder.py /tmp/coral-r07-p08
          python3 work/tools/coral/coral_r07_massive_p01_patch.py /tmp/coral-r07-p08
          python3 work/tools/coral/coral_r07_massive_p02_patch.py /tmp/coral-r07-p08
          python3 work/tools/coral/coral_r07_massive_p03_patch.py /tmp/coral-r07-p08
          python3 work/tools/coral/coral_r07_massive_p04_patch.py /tmp/coral-r07-p08
          python3 work/tools/coral/coral_r07_massive_p04_tune.py /tmp/coral-r07-p08
          python3 work/tools/coral/coral_r07_massive_p05_runner.py /tmp/coral-r07-p08
          python3 work/tools/coral/coral_r07_massive_p06_surface_normal_corallites.py /tmp/coral-r07-p08
          python3 work/tools/coral/coral_r07_massive_p07_runner.py /tmp/coral-r07-p08
          python3 work/tools/coral/coral_r07_massive_p08_integrated_fibonacci_corallites.py /tmp/coral-r07-p08
          printf '%s\n' \
            'https://haihao0307.github.io/guilin-dem-pipeline/coral-mother-r07-massive-porites-p08/' \
            > /tmp/coral-r07-p08/PUBLIC_URL.txt
          grep -q 'R07-P08' /tmp/coral-r07-p08/index.html
          grep -q "microDisplacementSpace:'integrated-surface-normal'" /tmp/coral-r07-p08/index.html
          grep -q "coralliteDistribution:'jittered-fibonacci-hemisphere'" /tmp/coral-r07-p08/index.html
          grep -q "latitudeBanding:false" /tmp/coral-r07-p08/index.html
          grep -q "meshResolution:'160x320-integrated-fibonacci'" /tmp/coral-r07-p08/index.html
          grep -q 'CORAL_MOTHER_R07_MASSIVE_P08_BUILD' /tmp/coral-r07-p08/BUILD_R07_P00.json
          test -s /tmp/coral-r07-p08/PALAU_OCCURRENCE_EVIDENCE.json

      - name: Browser integrated-corallite localized gates
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet websocket-client pillow
          python3 -m http.server 8773 --directory /tmp/coral-r07-p08 >/tmp/coral-r07-p08-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          python3 work/tools/coral/coral_r07_massive_p08_browser_qa_runner.py /tmp/coral-r07-p08

      - name: Assert P08 evidence survived localized QA
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'integratedFibonacciCorallites' /tmp/coral-r07-p08/BUILD_R07_P00.json
          grep -q 'latitudeBandingRejected' /tmp/coral-r07-p08/BUILD_R07_P00.json
          test -s /tmp/coral-r07-p08/QA_SCREENSHOT_ULTRAWIDE_2560X1080.png
          test -s /tmp/coral-r07-p08/QA_CLOSEUP_ULTRAWIDE_2560X1080.png
          test -s /tmp/coral-r07-p08/QA_MICROSCOPE_0.png
          test -s /tmp/coral-r07-p08/QA_MICROSCOPE_1.png
          test -s /tmp/coral-r07-p08/QA_WARP_1.png

      - name: Upload complete P08 evidence
        uses: actions/upload-artifact@v4
        with:
          name: CORAL_R07_MASSIVE_P08_LOCALIZED_EVIDENCE_${{ github.sha }}
          path: /tmp/coral-r07-p08
          if-no-files-found: error
          retention-days: 90

      - name: Publish fixed P08 workbench
        shell: bash
        run: |
          set -euo pipefail
          TARGET=coral-mother-r07-massive-porites-p08
          rm -rf "pages/$TARGET"
          mkdir -p "pages/$TARGET"
          cp -a /tmp/coral-r07-p08/. "pages/$TARGET/"
          cd pages
          git config user.name 'Haihao_Nature Grace HK'
          git config user.email 'haihao0307@gmail.com'
          git add "$TARGET/"
          if git diff --cached --quiet; then
            echo 'No publication changes.'
          else
            git commit -m "publish(coral): R07 massive Porites P08 integrated corallites localized QA"
            git pull --rebase origin gh-pages
            git push origin gh-pages
          fi

      - name: Write run summary
        shell: bash
        run: |
          {
            echo '## Coral Mother R07-P08 · Localized QA'
            echo
            echo '- NOAA: Hard / stony coral → Massive coral'
            echo '- Species candidate: Porites lutea morphology prototype'
            echo '- Palau Archipelago occurrence: NOAA NCEI confirmed'
            echo '- Local Airai / Stone Money Island placement: unresolved'
            echo '- Corallites: integrated surface-normal Fibonacci field'
            echo '- Whole-canvas change threshold adapted to shallow localized cups'
            echo '- Affected-region strength remains strictly gated'
            echo '- visualAcceptance: false'
            echo '- productionReady: false'
            echo '- ecologicalPlacementReady: false'
            echo
            echo 'Public workbench:'
            echo 'https://haihao0307.github.io/guilin-dem-pipeline/coral-mother-r07-massive-porites-p08/'
          } >> "$GITHUB_STEP_SUMMARY"
