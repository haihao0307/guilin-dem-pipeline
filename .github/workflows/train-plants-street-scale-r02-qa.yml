name: Train native KAOPU juvenile Ficus R02 review only
on:
  push:
    branches: ['qa/train-plants-street-scale-r02-20261010']
    paths:
      - 'kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r02/**'
      - '.github/workflows/train-plants-street-scale-r02-qa.yml'
permissions:
  contents: read
concurrency:
  group: train-plants-street-scale-r02-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GAME: kaopu-minigame-workbench/voxel-train-study/game
      CANDIDATE: kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r02
      PANDANUS_REFERENCE_SOURCE: kaopu-tree-fractal-wave-lab/mobile-r05-seasons/runtime-pandanus-r05.js
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            kaopu-minigame-workbench/voxel-train-study
            kaopu-tree-fractal-wave-lab/mobile-r05-seasons
      - name: Native source, metre comparison, clearances and regressions
        run: node --test "$CANDIDATE/plants/"*.test.mjs "$CANDIDATE/tests/"*.test.mjs
      - name: Real KAOPU container and rule-resource integrity
        run: |
          node "$CANDIDATE/plants/native-codec/tests/test-codec.mjs"
          python3 "$CANDIDATE/plants/native-codec/tests/verify_sqlite.py"
      - name: Install official pinned browser
        run: |
          npm install --prefix "$RUNNER_TEMP/plant-scale-qa" --no-save --ignore-scripts --no-audit --no-fund playwright@1.57.0
          "$RUNNER_TEMP/plant-scale-qa/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/plant-scale-qa/node_modules" >> "$GITHUB_ENV"
      - name: Serve preserved R20 and native KAOPU plant candidate
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/plant-scale-http.log" 2>&1 &
          for n in $(seq 1 30); do curl --fail --silent http://127.0.0.1:8765/$CANDIDATE/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Compare original Node and Chromium native generation before any render
        run: node "$CANDIDATE/plants/browser-native-hash-diagnostic.cjs"
      - name: Preserve pure native diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: train-native-ficus-hash-diagnostic-${{ github.sha }}
          path: train-plants-r02-results/hash-diagnostic/
          retention-days: 7
          compression-level: 0
      - name: Actual Worker responsiveness, strict output and cancellation
        run: node "$CANDIDATE/plants/browser-worker-probe.cjs"
      - name: Preserve isolated Worker evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: train-native-ficus-worker-${{ github.sha }}
          path: train-plants-r02-results/worker-probe/
          retention-days: 7
          compression-level: 0
      - name: First native KAOPU Ficus look before full comparison
        env:
          PLANTS_QA_FIRST_LOOK: '1'
          PLANTS_QA_OUT: train-plants-r02-results/native-first-look
        run: node "$CANDIDATE/plants/browser-comparison.cjs"
      - name: Preserve first actual native plant screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: train-native-ficus-first-look-${{ github.sha }}
          path: train-plants-r02-results/native-first-look/
          retention-days: 7
          compression-level: 0
      - name: Read exact preserved R20 baseline with its original dependencies
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fdbc36e17a34c21c14cc9566a533bb080e3dacc2
          path: r20-reference
          persist-credentials: false
          sparse-checkout: kaopu-minigame-workbench/voxel-train-study
      - name: Actual same-camera before and after, native juvenile Ficus
        run: node "$CANDIDATE/plants/browser-comparison.cjs"
      - name: Preserve evidence without publishing Pages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: train-plants-street-scale-r02-${{ github.sha }}
          path: train-plants-r02-results/comparison/
          retention-days: 7
          compression-level: 0
