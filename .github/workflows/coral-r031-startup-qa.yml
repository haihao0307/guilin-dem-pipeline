name: Coral R03.1 startup and entry QA
on:
  push:
    branches: [gh-pages]
    paths:
      - 'game-coral-mother-wave-r03/index.html'
      - '.github/workflows/coral-r031-startup-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Install test browser
        run: |
          mkdir -p evidence
          npm install playwright
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Verify deployed bytes and entry behavior
        run: |
          cat > test.cjs <<'JS'
          const {chromium}=require('playwright');
          const fs=require('fs'),crypto=require('crypto');
          const root='https://haihao0307.github.io/guilin-dem-pipeline/game-coral-mother-wave-r03/';
          const url=root+'?v=R03.1';
          const hashes={'index.html':'87162fcc5a662790c0e71e046ef1f901536b759a288a24e892e5028cdeec5fa4','runtime.js':'386155f04742d677acbfcac6e4069f7753f2d17112e97f35f11d0c15d06e4ae9','object.kaopu.json':'0b01177d72f6b75453f1334ca6ed13366ca96c614b86271ead0e5ac560fdef9c','pore-reference.json':'7e8479286912cef5a865e99ec5096222b3baf6adf0104fabb7408f2ceb115855'};
          const report={url,sourceCommit:'b3d414c2f48b033662bff5279690a9796c394eb4',physicalIPhoneTested:false,safariTested:false,checks:{},errors:[],unchangedGeometryAndRuntime:true};
          const hash=b=>crypto.createHash('sha256').update(b).digest('hex');
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{let browser;
          try{
            let exact=false;
            for(let i=0;i<48;i++){
              try{const r=await fetch(root+'index.html?v=R03.1&probe='+Date.now());const b=Buffer.from(await r.arrayBuffer());if(r.ok&&hash(b)===hashes['index.html']){exact=true;break;}}catch(e){}
              await sleep(5000);
            }
            if(!exact)throw Error('R03.1 deployment bytes not available');
            for(const [file,sha] of Object.entries(hashes)){
              const r=await fetch(root+file+'?v=R03.1');const b=Buffer.from(await r.arrayBuffer());
              if(!r.ok||hash(b)!==sha)throw Error('byte mismatch: '+file);
              fs.writeFileSync('evidence/'+file,b);
            }
            report.checks.publicFilesByteExact=true;
            browser=await chromium.launch({args:['--use-gl=angle','--use-angle=swiftshader']});
            let c=await browser.newContext({viewport:{width:390,height:844}}),p=await c.newPage();
            p.on('pageerror',e=>report.errors.push(String(e)));
            await p.goto(url,{waitUntil:'domcontentloaded'});
            await p.waitForFunction(()=>document.body.dataset.boot==='ready',{},{timeout:60000});
            report.boot=await p.evaluate(()=>window.__coralBoot);
            report.checks.completedFirstFrame=report.boot.firstFrame===true;
            report.checks.loadingHidden=!(await p.locator('#loading').isVisible());
            async function frame(t,mode){
              const old=await p.evaluate(()=>CoralDemo.getState().completedFrames);
              await p.evaluate(({t,mode})=>{CoralDemo.quality(180);if(mode)CoralDemo.setMode(mode);CoralDemo.setTime(t);},{t,mode});
              await p.waitForFunction(({t,old})=>{const s=CoralDemo.getState();return s.completedFrames>old&&s.renderedTime===t;},{t,old},{timeout:60000});
              return await p.evaluate(()=>({pixels:CoralDemo.pixelDigest(),state:CoralDemo.getState()}));
            }
            const a=await frame(0),b=await frame(20);
            report.checks.actualGeometryChanges=a.pixels.hash!==b.pixels.hash&&b.pixels.bright>a.pixels.bright;
            report.checks.mobileNoOverflow=await p.evaluate(()=>document.documentElement.scrollWidth<=innerWidth);
            await p.screenshot({path:'evidence/mobile-working.png'});
            await frame(4);const old=await p.evaluate(()=>CoralDemo.getState().completedFrames);await p.click('#play');
            await p.waitForFunction(x=>CoralDemo.getState().completedFrames>x+4,old,{timeout:60000});await p.click('#play');
            await p.waitForTimeout(700);const t=await p.evaluate(()=>CoralDemo.getState().renderedTime);
            report.checks.playAdvancesCompletedFrames=t>4;await p.waitForTimeout(500);
            report.checks.pauseStable=(await p.evaluate(()=>CoralDemo.getState().renderedTime))===t;
            const group=await frame(20,'patch9');report.checks.groupStillWorks=group.state.instanceCount===9&&group.pixels.bright>0;
            const pore=await frame(20,'pore');report.checks.poreStillWorks=pore.pixels.bright>0&&pore.state.glError===0;
            await frame(20,'single');report.checks.returnFromPoreNoError=(await p.evaluate(()=>CoralDemo.getState().glError))===0;
            await c.close();
            c=await browser.newContext({javaScriptEnabled:false,viewport:{width:390,height:844}});p=await c.newPage();await p.goto(url);
            report.checks.noScriptLinkVisible=await p.locator('#loading .online-entry').isVisible();
            report.checks.noScriptNotFalselyGrowing=(await p.locator('#state').innerText())==='尚未启动';
            await p.screenshot({path:'evidence/no-script-entry.png'});await c.close();
            c=await browser.newContext({viewport:{width:390,height:844}});p=await c.newPage();
            await p.route('**/runtime.js*',r=>r.abort());await p.goto(url);
            await p.waitForFunction(()=>document.body.dataset.boot==='failed',{},{timeout:30000});
            report.checks.failedScriptVisible=await p.locator('#error').isVisible();
            report.checks.failureHasOnlineEntry=await p.locator('#error .online-entry').isVisible();
            await p.screenshot({path:'evidence/script-failed.png'});await c.close();
            c=await browser.newContext({viewport:{width:390,height:844}});p=await c.newPage();
            await p.addInitScript(()=>{const get=HTMLCanvasElement.prototype.getContext;HTMLCanvasElement.prototype.getContext=function(type,...args){return type==='webgl2'?null:get.call(this,type,...args);};});
            await p.goto(url);await p.waitForFunction(()=>document.body.dataset.boot==='failed',{},{timeout:30000});
            report.checks.webGLUnavailableVisible=await p.locator('#error').isVisible();await c.close();
            report.checks.normalPageErrorsZero=report.errors.length===0;
            if(!Object.values(report.checks).every(Boolean))throw Error('Some checks failed');
          }catch(e){report.failure=String(e);process.exitCode=1;}
          finally{if(browser)await browser.close();fs.writeFileSync('evidence/STARTUP_QA.json',JSON.stringify(report,null,2));console.log(JSON.stringify(report,null,2));}
          })();
          JS
          node test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CORAL-R031-STARTUP-EVIDENCE
          path: evidence/
          retention-days: 30
