name: Tailor R04.3.2 actual public wardrobe delivery
on:
  push:
    branches: [feature/tailor-cabinet-r03-garment-surfaces-20261009]
    paths:
      - '.github/workflows/tailor-r0432-public-delivery.yml'
      - 'kaopu-tailor-workbench/presets/r04/R0432_RELEASE_TRIGGER.json'
permissions:
  contents: write
concurrency:
  group: tailor-r0432-public-delivery
  cancel-in-progress: false
jobs:
  publish-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: kaopu-tailor-workbench/presets/r04
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install actual public browser
        run: |
          pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Publish only reviewed runtime and fixed snapshot
        run: python kaopu-tailor-workbench/presets/r04/release_r0432.py publish
      - name: Wait for real Pages deployment and verify both public entrances
        run: python kaopu-tailor-workbench/presets/r04/release_r0432.py verify
      - name: Real HTTPS garment, parameter, outfit and new P06 solve acceptance
        run: |
          P=kaopu-tailor-workbench/presets/r04
          export R043_BASE=$(python -c "import json;print(json.load(open('$P/R0432_RELEASE_STATE.json'))['fixedURL'].split('?')[0])")
          python "$P/qa_r043.py"
          python "$P/qa_integrated_r0431.py"
          python "$P/qa_fresh_r0432.py"
          python "$P/release_r0432.py" alias
          python "$P/release_r0432.py" finish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tailor-r0432-real-public-evidence
          path: |
            kaopu-tailor-workbench/presets/r04/R0432_*.json
            kaopu-tailor-workbench/presets/r04/R043_PUBLIC_REPORT.json
            kaopu-tailor-workbench/presets/r04/R0431_PUBLIC_BROWSER_REPORT.json
            kaopu-tailor-workbench/presets/r04/qa-r043-public
            kaopu-tailor-workbench/presets/r04/qa-r0431-public
            kaopu-tailor-workbench/presets/r04/qa-r0432-public
          retention-days: 14
