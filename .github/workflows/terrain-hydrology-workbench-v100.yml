name: Terrain hydrology workbench v1.0

on:
  push:
    branches:
      - skill/dem-procedural-landscape-v010
    paths:
      - web/terrain-hydrology-workbench-v100/**
      - tools/terrain_hydrology/**
      - skills/dem-procedural-landscape/TERRAIN_HYDROLOGY_SCOPE.md
      - skills/dem-procedural-landscape/schemas/*knowledge-v1.schema.json
      - skills/dem-procedural-landscape/schemas/reference-intake-v1.schema.json
      - knowledge/terrain-hydrology/**
      - ops/tasks/TERRAIN_HYDROLOGY_WORKBENCH_V100.md
      - .github/workflows/terrain-hydrology-workbench-v100.yml
  pull_request:
    paths:
      - web/terrain-hydrology-workbench-v100/**
      - tools/terrain_hydrology/**
      - skills/dem-procedural-landscape/TERRAIN_HYDROLOGY_SCOPE.md
      - skills/dem-procedural-landscape/schemas/**
      - knowledge/terrain-hydrology/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terrain-hydrology-workbench-v100-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate files, scope and truth locks
        run: python tools/terrain_hydrology/validate_workbench.py --root .
      - name: Compile scripts
        run: python -m py_compile tools/terrain_hydrology/*.py tools/terrain_hydrology/local_package/*.py
      - name: Check browser JavaScript syntax
        run: node --check web/terrain-hydrology-workbench-v100/app.js

  browser:
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Run repository workbench browser QA
        run: python tools/terrain_hydrology/browser_qa.py --root . --output reports/terrain-hydrology-workbench-v100
      - name: Build complete Windows local package
        run: python tools/terrain_hydrology/package_local.py --root . --output dist
      - name: Run packaged workbench browser QA
        run: >-
          python tools/terrain_hydrology/browser_qa.py
          --root dist/terrain-hydrology-workbench-v100
          --output ${{ github.workspace }}/reports/terrain-hydrology-workbench-v100-package
      - name: Upload reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terrain-hydrology-workbench-v100-qa-${{ github.sha }}
          path: |
            reports/terrain-hydrology-workbench-v100/**
            reports/terrain-hydrology-workbench-v100-package/**
          if-no-files-found: error
          retention-days: 30
      - name: Upload complete local package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: terrain-hydrology-workbench-v100-local-${{ github.sha }}
          path: dist/terrain-hydrology-workbench-v100-local.zip
          if-no-files-found: error
          retention-days: 30
