name: QA animal method learning standalone
on:
  push:
    branches: [qa/animal-learning-r01-20261006]
    paths:
      - kaopu-animal-learning/**
      - .github/workflows/kaopu-animal-learning-qa.yml
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: kaopu-animal-learning
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned browser QA dependency
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Install Chinese QA fonts
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Static and numerical checks
        run: node kaopu-animal-learning/tests/static-numeric.mjs
      - name: Exact committed standalone file browser checks
        env:
          ANIMAL_QA_OUT: ${{ github.workspace }}/animal-learning-browser-results
        run: python kaopu-animal-learning/tests/browser_qa.py
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: animal-learning-browser-${{ github.sha }}
          path: |
            animal-learning-browser-results/
            kaopu-animal-learning/qa/LEARNING_STATIC_NUMERIC.json
          if-no-files-found: error
