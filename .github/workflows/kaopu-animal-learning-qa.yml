name: QA animal local video observation
on:
  push:
    branches: [qa/animal-learning-r01-20261006]
    paths:
      - kaopu-animal-learning/**
      - .github/workflows/kaopu-animal-learning-qa.yml
permissions:
  contents: read
jobs:
  browser:
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: kaopu-animal-learning
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned real browser runtime
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps ${{ matrix.engine }}
          sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk ffmpeg
      - name: Reproducible bundle and source animation checks
        run: |
          cp kaopu-animal-learning/index.html /tmp/animal-before.html
          node kaopu-animal-learning/tools/build.mjs
          cmp /tmp/animal-before.html kaopu-animal-learning/index.html
          ffprobe -v error -count_frames -select_streams v:0 -show_entries stream=width,height,r_frame_rate,nb_read_frames,duration -of json kaopu-animal-learning/assets/muybridge-horse.mp4 > kaopu-animal-learning/qa/VIDEO_PROBE.json
          node kaopu-animal-learning/tests/static-numeric.mjs
          node kaopu-animal-learning/tests/motion-numeric.mjs
      - name: Real desktop video, timeline, 3D and recovery checks
        env:
          MOTION_ENGINE: ${{ matrix.engine }}
          MOTION_QA_OUT: ${{ github.workspace }}/animal-motion-${{ matrix.engine }}
        run: python kaopu-animal-learning/tests/motion-browser.py
      - name: Preserve exact-commit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: animal-motion-${{ matrix.engine }}-${{ github.sha }}
          path: |
            animal-motion-${{ matrix.engine }}/
            kaopu-animal-learning/qa/*.json
          if-no-files-found: error
