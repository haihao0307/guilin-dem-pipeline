name: QA animal method learning standalone
on:
  push:
    branches: [qa/animal-learning-r01-20261006]
    paths:
      - kaopu-animal-learning/**
      - .github/workflows/kaopu-animal-learning-qa.yml
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: kaopu-animal-learning
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned browser QA dependency
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Static and numerical checks
        run: node kaopu-animal-learning/tests/static-numeric.mjs
      - name: Exact standalone file checks
        env:
          ANIMAL_QA_OUT: ${{ github.workspace }}/animal-learning-file-results
        run: python kaopu-animal-learning/tests/browser_qa.py
      - name: Read back and test exact public page
        env:
          ANIMAL_QA_URL: https://haihao0307.github.io/guilin-dem-pipeline/kaopu-animal-learning/?qa=f45e392a6af5fa7cc8863677bbca8179ff36ae68
          ANIMAL_PUBLIC_COMMIT: f45e392a6af5fa7cc8863677bbca8179ff36ae68
          ANIMAL_QA_OUT: ${{ github.workspace }}/animal-learning-public-results
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib,time,urllib.request,subprocess
          expected=pathlib.Path('kaopu-animal-learning/index.html').read_bytes()
          url=os.environ['ANIMAL_QA_URL']
          last='No request yet'
          for attempt in range(60):
              try:
                  req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'KAOPU-Animal-Readonly-QA/1.0'})
                  with urllib.request.urlopen(req,timeout=20) as response:
                      actual=response.read();status=response.status
                  if status==200 and actual==expected:break
                  last=f'HTTP {status}; {len(actual)} bytes; exactBytes={actual==expected}'
              except Exception as e:last=str(e)
              print('Propagation check',attempt,last,flush=True)
              time.sleep(10)
          else:raise SystemExit('Public bytes not available in propagation window: '+last)
          subprocess.run(['python','kaopu-animal-learning/tests/browser_qa.py'],check=True)
          report_path=pathlib.Path(os.environ['ANIMAL_QA_OUT'])/'BROWSER_REPORT.json'
          report=json.loads(report_path.read_text())
          report['publishedCommit']=os.environ['ANIMAL_PUBLIC_COMMIT']
          report['publicHttpStatus']=200
          report['publicExactBytes']=True
          report['expectedHtmlSha256']=hashlib.sha256(expected).hexdigest()
          report_path.write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps({'publishedCommit':report['publishedCommit'],'status':report['status'],'checks':report['totalChecks'],'htmlSha256':report['htmlSha256']},indent=2))
          import re
          entries=json.loads(pathlib.Path('kaopu-animal-learning/src/learning-teachers.json').read_text())['existingOverview']['entries']
          legacy=[]
          for entry in entries:
              if not entry.get('url'):continue
              result={'name':entry['name'],'url':entry['url'],'runtimeVerified':False}
              try:
                  with urllib.request.urlopen(urllib.request.Request(entry['url'],headers={'User-Agent':'KAOPU-Animal-Readonly-QA/1.0'}),timeout=30) as response:
                      fragment=response.read(262144).decode('utf-8','replace')
                      result['httpStatus']=response.status
                      result['finalUrl']=response.url
                      title=re.search(r'<title[^>]*>(.*?)</title>',fragment,re.I|re.S)
                      result['title']=title.group(1).strip() if title else None
              except Exception as e:result['error']=str(e)
              legacy.append(result)
          (pathlib.Path(os.environ['ANIMAL_QA_OUT'])/'LEGACY_HTTP_REPORT.json').write_text(json.dumps({'checkedAtUtc':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),'entries':legacy,'scope':'HTTP/title only; original runtime not revalidated'},ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: animal-learning-public-${{ github.sha }}
          path: |
            animal-learning-file-results/
            animal-learning-public-results/
            kaopu-animal-learning/qa/LEARNING_STATIC_NUMERIC.json
          if-no-files-found: error
