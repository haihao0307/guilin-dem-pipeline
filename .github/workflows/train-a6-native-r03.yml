name: A6 native R03 valve linkage QA
on:
  push:
    branches: ['qa/a4-mark3-rule-conversion-r01-20261017']
    paths:
      - '.github/workflows/train-a6-native-r03.yml'
      - 'kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01/a4-mark3-rule-conversion-r01/a6-native-r03/**'
      - 'kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01/a4-mark3-rule-conversion-r01/a6-valve-gear-experiment-r01/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  connected-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    defaults:
      run:
        working-directory: kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01/a4-mark3-rule-conversion-r01
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01/a4-mark3-rule-conversion-r01
            kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01/a4-a6-source-comparison-r03/vendor
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned browser
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Native geometry regression and A6 interaction checks
        run: |
          for f in student-native-r01/tests/*.mjs; do node "$f"; done
          node student-native-r02/interaction.test.mjs
          for f in a6-valve-gear-experiment-r01/tests/*.mjs; do node "$f"; done
          for f in a6-native-r03/src/*.mjs; do node --check "$f"; done
          node a6-native-r03/tests/coupling-motion.test.mjs
          for f in a6-native-r03/tests/*.mjs; do [ ! -f "$f" ] || node "$f"; done
          node a6-native-r03/src/a6-connected-shells.test.mjs
          node a6-native-r03/interaction.test.mjs
          node --check a6-native-r03/view.mjs
          node --check a6-native-r03/browser.cjs
      - name: Wait for exact public R03 publication
        env:
          NATIVE_URL: https://haihao0307.github.io/guilin-dem-pipeline/kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01/a4-mark3-rule-conversion-r01/a6-native-r03/index.html
        run: |
          matched=0
          for i in $(seq 1 90); do
            curl -fsSL --max-time 30 "$NATIVE_URL?verify=$i" -o /tmp/a6-public.html || true
            if [ "$(sha256sum /tmp/a6-public.html 2>/dev/null | cut -d' ' -f1)" = "af2ff9aed1bd253b8a96a7929ce1e0cd89320cbfc72c9eb94e06ac3e99a42042" ]; then matched=1; break; fi
            sleep 20
          done
          test "$matched" = 1
      - name: Actual PUBLIC desktop and mobile interaction
        env:
          NATIVE_URL: https://haihao0307.github.io/guilin-dem-pipeline/kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01/a4-mark3-rule-conversion-r01/a6-native-r03/index.html
        run: node a6-native-r03/browser.cjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: train-a6-native-r03-${{ github.sha }}-${{ github.run_attempt }}
          path: kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01/a4-mark3-rule-conversion-r01/a6-native-r03/qa/
          retention-days: 14
          if-no-files-found: error
