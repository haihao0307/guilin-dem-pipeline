name: A4 A6 R03 public Pages actual viewport verification
on:
  push:
    branches: ['qa/a4-a6-source-comparison-r03-20261017']
    paths: ['.github/workflows/a4-a6-design-r03-qa.yml', 'kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01/a4-a6-source-comparison-r03/tests/browser.cjs']
permissions:
  contents: read
jobs:
  public-pages:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01/a4-a6-source-comparison-r03
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01/a4-a6-source-comparison-r03
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install approved pinned Chromium testing dependencies
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Wait for exact repaired public entry bytes, never test stale deployment
        env:
          ENTRY: https://haihao0307.github.io/guilin-dem-pipeline/kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01/a4-a6-source-comparison-r03/
        run: |
          for attempt in $(seq 1 80); do
            curl -fsSL --max-time 30 "$ENTRY?commit=61897fc8fd2252ee58bb803d9f5a025a8114e2d5&attempt=$attempt" -o /tmp/public-entry.html || true
            if echo '551b551e5c3e3acb6fdabb405a9946c3b7e60d0733f32c65f0ba8c5e1a53708c  /tmp/public-entry.html' | sha256sum -c -; then exit 0; fi
            sleep 10
          done
          echo 'Expected repaired entry never became public'; exit 1
      - name: Verify actual public WebGL source scenes, animation and interactions
        env:
          TEST_URL: https://haihao0307.github.io/guilin-dem-pipeline/kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01/a4-a6-source-comparison-r03/?commit=61897fc8fd2252ee58bb803d9f5a025a8114e2d5
          TEST_QA_DIR: qa/r03-public-final
          TEST_TIMEOUT_MS: '240000'
        run: npm run test:browser
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: a4-a6-r03-public-final-${{ github.sha }}
          path: kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01/a4-a6-source-comparison-r03/qa/r03-public-final/
          retention-days: 14
          if-no-files-found: error
