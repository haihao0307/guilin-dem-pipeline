name: Verify real whole-building interaction
on:
  push:
    branches: ['trial/kowloon-whole-building-r01-20261021']
    paths:
      - 'kaopu-geography-workbench/kowloon-building-mother-r01/whole-building-interaction-r01/**'
      - 'kaopu-geography-workbench/kowloon-building-mother-r01/whole-building-interaction-r01.html'
      - 'kaopu-geography-workbench/kowloon-building-mother-r01/tests/whole-interaction-*'
      - '.github/workflows/kowloon-whole-interaction-r01-qa.yml'
permissions:
  contents: read
jobs:
  real-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            kaopu-geography-workbench/kowloon-building-mother-r01
            kaopu-geography-workbench/hk-three-buildings-r01
      - name: Camera controls and unchanged building invariants
        run: node --test kaopu-geography-workbench/kowloon-building-mother-r01/tests/whole-interaction-camera.test.mjs kaopu-geography-workbench/kowloon-building-mother-r01/tests/whole-tower.test.mjs kaopu-geography-workbench/kowloon-building-mother-r01/tests/whole-rails.test.mjs
      - name: Install pinned browser
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Actual orbit zoom pan cancellation and automatic lift
        run: |
          python -m http.server 8765 >/tmp/whole-interaction-http.log 2>&1 &
          timeout 540s python -u kaopu-geography-workbench/kowloon-building-mother-r01/tests/whole-interaction-browser.py --output kaopu-geography-workbench/kowloon-building-mother-r01/evidence/whole-interaction-r01
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: whole-interaction-${{ github.sha }}
          path: kaopu-geography-workbench/kowloon-building-mother-r01/evidence/whole-interaction-r01
          retention-days: 1
