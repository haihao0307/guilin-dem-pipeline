name: Guilin canonical elevation runtime cutover V1

on:
  workflow_dispatch:
  push:
    branches:
      - project/guilin-canonical-elevation-store-v1
    paths:
      - .github/workflows/guilin-canonical-store-cutover-v1.yml

permissions:
  contents: write

env:
  CANONICAL_RELEASE_TAG: guilin-canonical-elevation-store-12p5m-v1
  CANONICAL_STREAM_SHA256: 91154cbe7c29220c9da41efc98105f1d36b614a343636543f7dd230735da079a
  SOURCE_COLD_BACKUP_SHA256: 9490b1bd34f67336352cf448729f763ae4e241637d821961efd0290e29d6c9d4
  CANONICAL_BYTES: '423838710'
  CANONICAL_SAMPLES: '211919355'
  STORE_CACHE: .cache/canonical-elevation-store
  GENERATED_DIR: out/generated
  DISTILLED_DIR: out/distilled
  SITE_DIR: out/site
  STORE_SITE_DIR: out/store-site
  LOCAL_ROOT: out/local-root
  EVIDENCE_DIR: out/evidence
  PUBLIC_URL: https://haihao0307.github.io/guilin-dem-pipeline/guilin/
  PUBLIC_STORE_URL: https://haihao0307.github.io/guilin-dem-pipeline/guilin-elevation-store-v1/

concurrency:
  group: guilin-canonical-elevation-runtime-cutover-v1
  cancel-in-progress: false

jobs:
  build-verify-cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout the dedicated canonical-store branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deterministic geospatial and browser dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            numpy==2.1.3 rasterio==1.4.3 pyproj==3.7.1 shapely==2.1.1 \
            requests==2.32.4 websocket-client==1.8.0
          if ! command -v google-chrome >/dev/null 2>&1 && \
             ! command -v google-chrome-stable >/dev/null 2>&1 && \
             ! command -v chromium >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y chromium
          fi

      - name: Verify the cutover source contracts
        run: |
          set -euo pipefail
          python -m py_compile \
            pipeline/canonical_elevation_store.py \
            pipeline/build_online_assets_from_canonical_store.py \
            pipeline/build_online_assets.py \
            pipeline/hydrology_network_v6.py \
            pipeline/distill_online_runtime.py \
            tests/browser_full_map_cdp.py \
            tests/browser_canonical_store_cdp.py \
            tests/range_static_server.py
          node --check viewer/canonical-store-runtime.js
          node --check viewer/app.js
          grep -q 'canonical-store-runtime.js' viewer/index.html
          grep -q "$CANONICAL_STREAM_SHA256" viewer/canonical-store-runtime.js
          grep -q 'source_tiff_read: false' viewer/canonical-store-runtime.js
          grep -q 'HTTP 206' viewer/canonical-store-runtime.js
          ! grep -E 'createTexture|texImage2D|sampler2D|heightmap' viewer/app.js viewer/canonical-store-runtime.js
          python - <<'PY'
          import json
          from pathlib import Path
          pointer=json.loads(Path('truth/CANONICAL_ELEVATION_STORE_POINTER.json').read_text())
          validation=json.loads(Path('truth/CANONICAL_ELEVATION_VALIDATION_V1.json').read_text())
          assert pointer['canonical_stream_sha256']=='91154cbe7c29220c9da41efc98105f1d36b614a343636543f7dd230735da079a'
          assert pointer['sample_count']==211919355
          assert pointer['data_bytes']==423838710
          assert pointer['chunk_count']==840
          assert pointer['shard_count']==7
          assert pointer['pixel_mismatch_count']==0
          assert pointer['source_tiff_role_after_cutover']=='cold_backup_only'
          assert pointer['normal_production_source_tiff_reads_allowed_after_cutover'] is False
          assert validation['passed'] is True
          assert validation['pixel_mismatch_count']==0
          assert validation['maximum_absolute_elevation_difference_m']==0
          assert validation['post_cutover_daily_source_tiff_reads_allowed'] is False
          PY

      - name: Download only the verified canonical elevation store
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf "$STORE_CACHE"
          mkdir -p "$STORE_CACHE/shards" "$EVIDENCE_DIR"
          gh release download "$CANONICAL_RELEASE_TAG" \
            --pattern CANONICAL_ELEVATION_MANIFEST.json \
            --dir "$STORE_CACHE" --clobber
          for index in 000 001 002 003 004 005 006; do
            gh release download "$CANONICAL_RELEASE_TAG" \
              --pattern "elevation-shard-${index}.i16pack" \
              --dir "$STORE_CACHE/shards" --clobber
          done
          test "$(find "$STORE_CACHE/shards" -maxdepth 1 -name 'elevation-shard-*.i16pack' | wc -l)" = 7
          test "$(du -cb "$STORE_CACHE"/shards/elevation-shard-*.i16pack | tail -1 | cut -f1)" = "$CANONICAL_BYTES"
          test "$(find "$STORE_CACHE" -type f -iname '*.tif' | wc -l)" = 0
          test "$(find "$STORE_CACHE" -type f -iname '*.tiff' | wc -l)" = 0

      - name: Verify every canonical chunk and reconstruct the complete stream without TIFF
        run: |
          set -euo pipefail
          python - <<'PY' | tee "$EVIDENCE_DIR/CANONICAL_STORE_ONLY_VALIDATION.log"
          import hashlib
          import json
          from pathlib import Path
          from pipeline.canonical_elevation_store import CanonicalElevationStore

          root=Path('.cache/canonical-elevation-store')
          manifest_path=root/'CANONICAL_ELEVATION_MANIFEST.json'
          manifest=json.loads(manifest_path.read_text())
          assert manifest['schema']=='guilin-canonical-elevation-store/v1'
          assert manifest['status'] in {'pixel_exact_verified_cutover_pending','authoritative_production_source'}
          assert manifest['source_cold_backup']['sha256']=='9490b1bd34f67336352cf448729f763ae4e241637d821961efd0290e29d6c9d4'
          assert manifest['canonical_row_major_stream']['sha256']=='91154cbe7c29220c9da41efc98105f1d36b614a343636543f7dd230735da079a'
          assert manifest['canonical_row_major_stream']['bytes']==423838710
          assert manifest['canonical_row_major_stream']['sample_count']==211919355
          assert manifest['logical_chunks']['chunk_count']==840
          assert manifest['logical_chunks']['overlap_samples']==0
          assert manifest['logical_chunks']['padding_samples']==0
          assert manifest['logical_chunks']['each_source_sample_stored_once'] is True
          assert manifest['physical_shards']['shard_count']==7
          assert manifest['physical_shards']['total_bytes']==423838710
          assert manifest['physical_shards']['compression']=='none'

          verified_chunks=0
          for chunk in manifest['chunks']:
              shard=root/chunk['shard']
              assert shard.is_file(), shard
              with shard.open('rb') as handle:
                  handle.seek(int(chunk['shard_byte_offset']))
                  payload=handle.read(int(chunk['bytes']))
              assert len(payload)==chunk['bytes']
              assert hashlib.sha256(payload).hexdigest()==chunk['sha256']
              verified_chunks+=1
          assert verified_chunks==840

          digest=hashlib.sha256()
          byte_count=0
          with CanonicalElevationStore(manifest_path) as store:
              assert store.width==11983 and store.height==17685
              for row in range(0, store.height, 64):
                  height=min(64,store.height-row)
                  values=store.read_aoi_window(0,row,store.width,height)
                  payload=values.astype('<i2',copy=False).tobytes(order='C')
                  digest.update(payload)
                  byte_count+=len(payload)
          assert byte_count==423838710
          assert digest.hexdigest()=='91154cbe7c29220c9da41efc98105f1d36b614a343636543f7dd230735da079a'
          receipt={
              'schema':'guilin-canonical-store-only-validation/v1',
              'passed':True,
              'source_tiff_read':False,
              'source_tiff_role':'cold-backup-only',
              'canonical_stream_sha256':digest.hexdigest(),
              'sample_count':211919355,
              'data_bytes':byte_count,
              'verified_chunk_count':verified_chunks,
              'shard_count':7,
              'overlap_samples':0,
              'padding_samples':0,
              'compression':'none',
              'resampling':'none',
              'quantization':'none',
              'interpolation':'none',
          }
          Path('out/evidence/CANONICAL_STORE_ONLY_VALIDATION.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps(receipt,indent=2))
          PY

      - name: Build the full-map knowledge assets from the canonical store only
        run: |
          set -euo pipefail
          rm -rf "$GENERATED_DIR" "$DISTILLED_DIR"
          mkdir -p "$GENERATED_DIR" "$DISTILLED_DIR"
          python pipeline/build_online_assets_from_canonical_store.py \
            --elevation-store-manifest "$STORE_CACHE/CANONICAL_ELEVATION_MANIFEST.json" \
            --native-spatial-index truth/NATIVE_ELEVATION_MANIFEST.json \
            --store-pointer truth/CANONICAL_ELEVATION_STORE_POINTER.json \
            --hydrology truth/OSM_HYDROLOGY_IMMUTABLE.geojson \
            --output-dir "$GENERATED_DIR" \
            | tee "$EVIDENCE_DIR/CANONICAL_ASSET_BUILD.log"
          cp "$GENERATED_DIR/FULL_MAP_BUILD_RECEIPT.json" "$EVIDENCE_DIR/"
          python tests/validate_hydrology_flow_contract.py \
            --manifest "$GENERATED_DIR/osm-waterways-manifest.json" \
            --segments "$GENERATED_DIR/osm-waterway-segments.f32.bin" \
            | tee "$EVIDENCE_DIR/HYDROLOGY_CONTRACT.log"
          python - <<'PY'
          import json
          from pathlib import Path
          receipt=json.loads(Path('out/generated/FULL_MAP_BUILD_RECEIPT.json').read_text())
          assert receipt['passed'] is True
          assert receipt.get('source_tiff_read') is False
          assert receipt.get('elevation_source')=='canonical-pixel-exact-store'
          assert receipt.get('canonical_stream_sha256')=='91154cbe7c29220c9da41efc98105f1d36b614a343636543f7dd230735da079a'
          overview=json.loads(Path('out/generated/overview-direct-samples-manifest.json').read_text())
          hydro=json.loads(Path('out/generated/osm-waterways-manifest.json').read_text())
          assert overview['asset']['grid']==[768,768]
          assert overview['asset']['interpolation']=='none'
          assert overview['asset']['compression']=='none'
          assert overview['asset']['height_texture'] is False
          assert hydro['topology']['segment_count']==155429
          assert hydro['topology']['dropped_segment_count']==0
          assert hydro['filter']['lake_surface_asset_emitted'] is False
          assert hydro['filter']['reservoir_surface_asset_emitted'] is False
          PY

      - name: Distill complete connected waterway routes for first load
        run: |
          set -euo pipefail
          python pipeline/distill_online_runtime.py \
            --native-manifest truth/NATIVE_ELEVATION_MANIFEST.json \
            --overview-manifest "$GENERATED_DIR/overview-direct-samples-manifest.json" \
            --hydrology-manifest "$GENERATED_DIR/osm-waterways-manifest.json" \
            --segments "$GENERATED_DIR/osm-waterway-segments.f32.bin" \
            --nodes "$GENERATED_DIR/osm-waterway-nodes.f32.bin" \
            --output-dir "$DISTILLED_DIR" \
            | tee "$EVIDENCE_DIR/DISTILLED_RUNTIME_BUILD.log"
          cp "$DISTILLED_DIR/DISTILLED_RUNTIME_BUILD_RECEIPT.json" "$EVIDENCE_DIR/"
          python - <<'PY'
          import json
          from pathlib import Path
          receipt=json.loads(Path('out/distilled/DISTILLED_RUNTIME_BUILD_RECEIPT.json').read_text())
          manifest=json.loads(Path('out/distilled/osm-waterways-manifest.json').read_text())
          assert receipt['passed'] is True
          assert receipt['full_source_segment_count']==155429
          assert receipt['runtime_route_break_count']==0
          assert receipt['native_tiles_on_page_open']==0
          assert receipt['initial_numeric_data_bytes']<5_500_000
          assert manifest['topology']['runtime_route_break_count']==0
          assert manifest['source']['centerline_coordinates_mutated'] is False
          assert manifest['filter']['lake_surface_asset_emitted'] is False
          assert manifest['filter']['reservoir_surface_asset_emitted'] is False
          PY

      - name: Assemble the small viewer and the same-origin canonical store mirror
        run: |
          set -euo pipefail
          rm -rf "$SITE_DIR" "$STORE_SITE_DIR"
          mkdir -p "$SITE_DIR/data" "$STORE_SITE_DIR/shards"
          cp viewer/index.html viewer/styles.css viewer/app.js viewer/canonical-store-runtime.js "$SITE_DIR/"
          cp truth/NATIVE_ELEVATION_MANIFEST.json "$SITE_DIR/data/"
          cp truth/CANONICAL_ELEVATION_STORE_POINTER.json "$SITE_DIR/data/"
          cp truth/CANONICAL_ELEVATION_VALIDATION_V1.json "$SITE_DIR/data/"
          cp contracts/GUILIN_DISTILLED_RUNTIME_CONTRACT_V1.json "$SITE_DIR/data/"
          cp "$GENERATED_DIR/overview-direct-heights.i16.bin" "$SITE_DIR/data/"
          cp "$GENERATED_DIR/overview-direct-samples-manifest.json" "$SITE_DIR/data/"
          cp "$DISTILLED_DIR/osm-waterway-segments.f32.bin" "$SITE_DIR/data/"
          cp "$DISTILLED_DIR/osm-waterway-nodes.f32.bin" "$SITE_DIR/data/"
          cp "$DISTILLED_DIR/osm-waterways-manifest.json" "$SITE_DIR/data/"
          cp "$DISTILLED_DIR/guilin-distilled-knowledge.json" "$SITE_DIR/data/"
          touch "$SITE_DIR/.nojekyll"

          cp "$STORE_CACHE/CANONICAL_ELEVATION_MANIFEST.json" "$STORE_SITE_DIR/"
          cp "$STORE_CACHE"/shards/elevation-shard-*.i16pack "$STORE_SITE_DIR/shards/"
          cp truth/CANONICAL_ELEVATION_STORE_POINTER.json "$STORE_SITE_DIR/"
          cp truth/CANONICAL_ELEVATION_VALIDATION_V1.json "$STORE_SITE_DIR/"
          touch "$STORE_SITE_DIR/.nojekyll"

          python - <<'PY'
          import json,os
          from pathlib import Path
          site=Path('out/site')
          store=Path('out/store-site')
          knowledge=json.loads((site/'data/guilin-distilled-knowledge.json').read_text())
          version={
              'schema':'guilin-canonical-elevation-online-version/v1',
              'head':os.environ['GITHUB_SHA'],
              'run_id':int(os.environ['GITHUB_RUN_ID']),
              'source_tiff_role':'cold-backup-only',
              'source_tiff_read':False,
              'source_tiff_sha256':'9490b1bd34f67336352cf448729f763ae4e241637d821961efd0290e29d6c9d4',
              'canonical_stream_sha256':'91154cbe7c29220c9da41efc98105f1d36b614a343636543f7dd230735da079a',
              'canonical_sample_count':211919355,
              'canonical_data_bytes':423838710,
              'canonical_chunk_count':840,
              'canonical_shard_count':7,
              'canonical_overlap_samples':0,
              'canonical_padding_samples':0,
              'canonical_compression':'none',
              'native_spacing_m':12.5,
              'one_continuous_map':True,
              'continuous_zoom':True,
              'distilled_knowledge_runtime':True,
              'initial_numeric_data_bytes':knowledge['runtime']['initial_numeric_data_bytes'],
              'native_detail_delivery':'same-origin-canonical-byte-range',
              'canonical_store_path':'../guilin-elevation-store-v1/',
              'legacy_native_tile_store_required':False,
              'full_truth_downloaded_on_page_open':False,
              'height_image_texture_used':False,
              'lake_surface_asset_count':0,
              'reservoir_surface_asset_count':0,
              'visualAcceptance':False,
              'productionReady':False,
          }
          path=site/'version.json'
          path.write_text(json.dumps(version,ensure_ascii=False,indent=2)+'\n')
          site_bytes=sum(p.stat().st_size for p in site.rglob('*') if p.is_file())
          assert site_bytes<=6_291_456,site_bytes
          shard_bytes=sum(p.stat().st_size for p in (store/'shards').glob('*.i16pack'))
          assert shard_bytes==423838710,shard_bytes
          store_version={
              'schema':'guilin-canonical-elevation-public-store/v1',
              'status':'pixel-exact-verified',
              'canonical_stream_sha256':'91154cbe7c29220c9da41efc98105f1d36b614a343636543f7dd230735da079a',
              'sample_count':211919355,
              'data_bytes':423838710,
              'logical_chunk_count':840,
              'physical_shard_count':7,
              'overlap_samples':0,
              'padding_samples':0,
              'compression':'none',
              'source_tiff_read':False,
              'source_tiff_role':'cold-backup-only',
          }
          (store/'STORE_VERSION.json').write_text(json.dumps(store_version,indent=2)+'\n')
          evidence=Path('out/evidence')
          (evidence/'PUBLIC_SITE_SIZE.json').write_text(json.dumps({
              'viewer_directory_bytes':site_bytes,
              'canonical_store_data_bytes':shard_bytes,
              'initial_numeric_data_bytes':knowledge['runtime']['initial_numeric_data_bytes'],
              'source_tiff_read':False,
              'legacy_native_tile_store_required':False,
          },indent=2)+'\n')
          PY
          (cd "$SITE_DIR" && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
          (cd "$STORE_SITE_DIR" && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)

      - name: Run local full-map and canonical byte-range browser QA
        run: |
          set -euo pipefail
          rm -rf "$LOCAL_ROOT"
          mkdir -p "$LOCAL_ROOT/guilin" "$LOCAL_ROOT/guilin-elevation-store-v1"
          cp -a "$SITE_DIR/." "$LOCAL_ROOT/guilin/"
          cp -a "$STORE_SITE_DIR/." "$LOCAL_ROOT/guilin-elevation-store-v1/"
          python tests/range_static_server.py --root "$LOCAL_ROOT" --port 8765 > "$EVIDENCE_DIR/local-range-server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 80); do
            curl --fail --silent http://127.0.0.1:8765/guilin/ >/dev/null && break
            sleep .25
          done
          curl --fail --silent --header 'Range: bytes=0-1023' \
            --dump-header "$EVIDENCE_DIR/local-range-headers.txt" \
            --output "$EVIDENCE_DIR/local-range.bin" \
            http://127.0.0.1:8765/guilin-elevation-store-v1/shards/elevation-shard-000.i16pack
          test "$(stat -c '%s' "$EVIDENCE_DIR/local-range.bin")" = 1024
          grep -q '206 Partial Content' "$EVIDENCE_DIR/local-range-headers.txt"
          python tests/browser_full_map_cdp.py \
            --url http://127.0.0.1:8765/guilin/?build="$GITHUB_SHA" \
            --evidence-dir "$EVIDENCE_DIR/local-full-map" \
            --timeout 900
          python tests/browser_canonical_store_cdp.py \
            --url http://127.0.0.1:8765/guilin/?build="$GITHUB_SHA" \
            --evidence-dir "$EVIDENCE_DIR/local-canonical" \
            --timeout 900
          kill "$SERVER_PID" 2>/dev/null || true
          trap - EXIT

      - name: Cut the public site over to the canonical store
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'Haihao_Nature Grace HK'
          git config user.email 'haihao0307@gmail.com'
          git fetch origin gh-pages
          OLD_SHA="$(git rev-parse origin/gh-pages)"
          echo "OLD_GH_PAGES_SHA=$OLD_SHA" >> "$GITHUB_ENV"
          rm -rf /tmp/guilin-canonical-gh-pages
          git worktree add /tmp/guilin-canonical-gh-pages origin/gh-pages
          cd /tmp/guilin-canonical-gh-pages
          git switch -C gh-pages origin/gh-pages
          rm -rf guilin guilin-truth-data guilin-elevation-store-v1
          mkdir -p guilin guilin-elevation-store-v1
          cp -a "$GITHUB_WORKSPACE/$SITE_DIR/." guilin/
          cp -a "$GITHUB_WORKSPACE/$STORE_SITE_DIR/." guilin-elevation-store-v1/
          git add -A
          git commit -m "deploy(guilin): use pixel-exact canonical elevation store $GITHUB_SHA"
          NEW_SHA="$(git rev-parse HEAD)"
          git push origin HEAD:gh-pages
          echo "CUTOVER_DEPLOYED=true" >> "$GITHUB_ENV"
          echo "NEW_GH_PAGES_SHA=$NEW_SHA" >> "$GITHUB_ENV"

      - name: Wait for exact public cutover and verify HTTP byte ranges
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR/public-range"
          for attempt in $(seq 1 180); do
            if curl --fail --silent "$PUBLIC_URL/version.json?build=$GITHUB_SHA" > "$EVIDENCE_DIR/public-version.json" && \
               grep -q "$CANONICAL_STREAM_SHA256" "$EVIDENCE_DIR/public-version.json" && \
               grep -q "$GITHUB_SHA" "$EVIDENCE_DIR/public-version.json"; then
              break
            fi
            sleep 5
          done
          grep -q "$CANONICAL_STREAM_SHA256" "$EVIDENCE_DIR/public-version.json"
          grep -q "$GITHUB_SHA" "$EVIDENCE_DIR/public-version.json"
          curl --fail --silent "$PUBLIC_STORE_URL/STORE_VERSION.json?build=$GITHUB_SHA" > "$EVIDENCE_DIR/public-store-version.json"
          grep -q "$CANONICAL_STREAM_SHA256" "$EVIDENCE_DIR/public-store-version.json"
          RANGE_OK=false
          for attempt in $(seq 1 120); do
            rm -f "$EVIDENCE_DIR/public-range/headers.txt" "$EVIDENCE_DIR/public-range/body.bin"
            if curl --fail --silent --header 'Range: bytes=0-1023' \
                 --dump-header "$EVIDENCE_DIR/public-range/headers.txt" \
                 --output "$EVIDENCE_DIR/public-range/body.bin" \
                 "$PUBLIC_STORE_URL/shards/elevation-shard-000.i16pack?build=$GITHUB_SHA" && \
               test "$(stat -c '%s' "$EVIDENCE_DIR/public-range/body.bin")" = 1024 && \
               grep -q '206' "$EVIDENCE_DIR/public-range/headers.txt"; then
              RANGE_OK=true
              break
            fi
            sleep 5
          done
          test "$RANGE_OK" = true

      - name: Run public full-map and canonical-store browser QA
        run: |
          set -euo pipefail
          python tests/browser_full_map_cdp.py \
            --url "$PUBLIC_URL?build=$GITHUB_SHA" \
            --evidence-dir "$EVIDENCE_DIR/public-full-map" \
            --timeout 1200
          python tests/browser_canonical_store_cdp.py \
            --url "$PUBLIC_URL?build=$GITHUB_SHA" \
            --evidence-dir "$EVIDENCE_DIR/public-canonical" \
            --timeout 1200
          python - <<'PY'
          import json,os
          from pathlib import Path
          runtime=json.loads(Path('out/evidence/public-canonical/canonical-browser-qa.json').read_text())
          viewer=json.loads(Path('out/evidence/public-full-map/browser-qa.json').read_text())
          assert runtime['passed'] is True
          assert viewer['passed'] is True
          receipt={
              'schema':'guilin-canonical-elevation-cutover-receipt/v1',
              'passed':True,
              'source_tiff_read':False,
              'source_tiff_role':'cold-backup-only',
              'canonical_stream_sha256':'91154cbe7c29220c9da41efc98105f1d36b614a343636543f7dd230735da079a',
              'canonical_sample_count':211919355,
              'canonical_data_bytes':423838710,
              'logical_chunk_count':840,
              'physical_shard_count':7,
              'pixel_mismatch_count':0,
              'overlap_samples':0,
              'padding_samples':0,
              'compression':'none',
              'http_range_required':True,
              'http_range_verified':True,
              'legacy_native_tile_store_removed':True,
              'public_url':'https://haihao0307.github.io/guilin-dem-pipeline/guilin/',
              'public_store_url':'https://haihao0307.github.io/guilin-dem-pipeline/guilin-elevation-store-v1/',
              'branch_head':os.environ['GITHUB_SHA'],
              'gh_pages_head':os.environ['NEW_GH_PAGES_SHA'],
              'visualAcceptance':False,
              'productionReady':False,
          }
          Path('out/evidence/CANONICAL_ELEVATION_CUTOVER_RECEIPT.json').write_text(json.dumps(receipt,indent=2)+'\n')
          PY

      - name: Roll back the public site if post-cutover verification failed
        if: failure() && env.CUTOVER_DEPLOYED == 'true'
        run: |
          set -euo pipefail
          git push origin "$OLD_GH_PAGES_SHA:refs/heads/gh-pages" --force
          echo "Public cutover failed verification and gh-pages was restored to $OLD_GH_PAGES_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload compact cutover evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guilin-canonical-elevation-cutover-v1-${{ github.run_id }}
          path: out/evidence
          retention-days: 90
          compression-level: 6

      - name: Summarize
        if: always()
        run: |
          {
            echo '## Guilin canonical elevation runtime cutover V1'
            echo
            echo "* public map: $PUBLIC_URL"
            echo "* public canonical store: $PUBLIC_STORE_URL"
            echo '* canonical samples: 211,919,355'
            echo '* canonical data bytes: 423,838,710'
            echo '* canonical chunks: 840'
            echo '* physical shards: 7'
            echo '* overlap and padding: 0'
            echo '* compression and resampling: none'
            echo '* source TIFF read during normal build: false'
            echo '* source TIFF role: cold backup only'
            echo '* legacy 54-tile public store: removed after verified cutover'
          } >> "$GITHUB_STEP_SUMMARY"
