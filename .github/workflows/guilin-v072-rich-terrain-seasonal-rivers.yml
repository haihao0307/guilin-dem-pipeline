              assert entry["stored_bytes"] < 100 * 1024 * 1024
              assert hashlib.sha256(path.read_bytes()).hexdigest() == entry["sha256"]

          direct = qa["grounding_by_season"]
          topology = qa["joins_and_topology"]
          alias = topology["serialized_global_display_mesh_by_season"]
          assert set(runtime["seasons"]) == set(direct) == set(alias) == set(seasons)
          report = {"schema": "guilin-v072-river-workflow-gate/v1", "passed": True, "seasons": {}}

          for season in seasons:
              season_runtime = runtime["seasons"][season]
