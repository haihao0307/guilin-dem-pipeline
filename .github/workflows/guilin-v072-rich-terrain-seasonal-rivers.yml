          assert len(runtime["indexed_assets"]) == 13
          assert all(set(entry) == {"file", "sha256", "stored_bytes"} for entry in runtime["indexed_assets"])
          indexed_by_file = {entry["file"]: entry for entry in runtime["indexed_assets"]}
