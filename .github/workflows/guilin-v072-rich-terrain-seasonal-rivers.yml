                  assert indexed_by_file[path.name]["sha256"] == final_asset[sha_key]
                  assert indexed_by_file[path.name]["stored_bytes"] == final_asset[bytes_key]
              with gzip.open(position_path, "rb") as stream:
                  position_bytes = stream.read()
              with gzip.open(index_path, "rb") as stream:
