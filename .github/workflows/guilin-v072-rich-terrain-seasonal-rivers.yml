name: Guilin v0.7.2 native terrain LOD and serialized rivers

on:
  push:
    branches:
      - project/guilin-v072-rich-terrain-seasonal-rivers
    paths:
      - .github/workflows/guilin-v072-rich-terrain-seasonal-rivers.yml
      - projects/guilin-v072-rich-terrain-seasonal-rivers/**
      - projects/guilin-v070-raw-mosaic-aoi-draw/build_raw_mosaic.py
      - canonical/guilin-dem-12_5m-core/**
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: guilin-v072-rich-terrain-seasonal-rivers
  cancel-in-progress: false

jobs:
  build-qa-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      EXPECTED_BRANCH: project/guilin-v072-rich-terrain-seasonal-rivers
      EXPECTED_PR: "54"
      PROJECT_DIR: projects/guilin-v072-rich-terrain-seasonal-rivers
      MOSAIC_PROJECT: projects/guilin-v070-raw-mosaic-aoi-draw
      SOURCE_DIR: canonical/guilin-dem-12_5m-core/data/raw/asf
      SOURCE_MANIFEST: canonical/guilin-dem-12_5m-core/catalog/source_manifest.json
      RAW_DIR: ${{ runner.temp }}/guilin-v072-raw
      EVIDENCE_DIR: ${{ runner.temp }}/guilin-v072-evidence
      DESTINATION_DIR: guilin-v072-terrain-rivers
      PUBLIC_BASE_URL: https://haihao0307.github.io/guilin-dem-pipeline/guilin-v072-terrain-rivers/
      EXPECTED_OSM_SHA256: be3e8e67f625fa87c843e2d7ea423c48b98e750c6912cae8cf3863df6ae6d4df
      EXPECTED_CENTERLINE_SHA256: fc69d8197106de229af2ecb9ca1d77cafe3e7ed291b5d119c0689682e68473d0
      EXPECTED_OSM_FEATURES: "1426"

    steps:
      - name: Checkout the triggering commit without automatic LFS smudge
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          lfs: false

      - name: Confirm remote HEAD and Draft PR identity
        id: source_identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF_TYPE}" = branch
          test "${GITHUB_REF_NAME}" = "${EXPECTED_BRANCH}"
          test "${GITHUB_SHA}" = "$(git rev-parse HEAD)"
          remote_sha="$(git ls-remote --exit-code origin "refs/heads/${EXPECTED_BRANCH}" | awk '{print $1}')"
          test -n "${remote_sha}"
          test "${remote_sha}" = "${GITHUB_SHA}"
          pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${EXPECTED_PR}")"
          PR_JSON="${pr_json}" python - <<'PY'
          import json, os
          pr = json.loads(os.environ["PR_JSON"])
          expected_sha = os.environ["GITHUB_SHA"]
          expected_branch = os.environ["EXPECTED_BRANCH"]
          assert pr["number"] == int(os.environ["EXPECTED_PR"])
          assert pr["state"] == "open"
          assert pr["draft"] is True
          assert pr["merged"] is False and pr["merged_at"] is None
          assert pr["head"]["ref"] == expected_branch
          assert pr["head"]["sha"] == expected_sha
          assert pr["base"]["ref"] == "main"
          PY
          printf 'source_sha=%s\n' "${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Set up pinned Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - name: Install deterministic build and QA dependencies
        id: dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            numpy==2.2.4 \
            pillow==11.1.0 \
            rasterio==1.4.3 \
            pyproj==3.7.1 \
            shapely==2.1.0
          python - <<'PY'
          import numpy, PIL, pyproj, rasterio, shapely
          assert numpy.__version__ == "2.2.4"
          assert PIL.__version__ == "11.1.0"
          assert pyproj.__version__ == "3.7.1"
          assert rasterio.__version__ == "1.4.3"
          assert shapely.__version__ == "2.1.0"
          PY

      - name: Verify and materialize the exact 12 canonical LFS DEM objects
        id: source_qa
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, re, subprocess
          from pathlib import Path

          manifest_path = Path("canonical/guilin-dem-12_5m-core/catalog/source_manifest.json")
          source_dir = Path("canonical/guilin-dem-12_5m-core/data/raw/asf")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          assert manifest["schema"] == "guilin-dem-12_5m-clean-rebuild/v2"
          assert manifest["source_count"] == 12
          assert manifest["truth_policy"] == {
              "source_resolution_m": 12.5,
              "source_dem_read_only": True,
              "active_30m_dem_allowed": False,
              "derived_web_or_mosaic_is_measured_source": False,
          }
          sources = manifest["sources"]
          assert len(sources) == 12
          assert len({entry["file"] for entry in sources}) == 12
          for entry in sources:
              assert entry["file"].endswith(".dem.tif")
              assert entry["bytes"] > 70_000_000
              assert re.fullmatch(r"[0-9a-f]{64}", entry["sha256"])
              assert entry["crs"] == "EPSG:32649"
              assert entry["pixel_size_m"] == [12.5, 12.5]
              relative = (source_dir / entry["file"]).as_posix()
              pointer = subprocess.check_output(["git", "show", f"HEAD:{relative}"], text=True)
              assert pointer.startswith("version https://git-lfs.github.com/spec/v1\n")
              assert f"oid sha256:{entry['sha256']}\n" in pointer
              assert f"size {entry['bytes']}\n" in pointer
          PY
          git lfs install --local
          git lfs pull --include="${SOURCE_DIR}/*.dem.tif" --exclude=""
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          manifest = json.loads(Path("canonical/guilin-dem-12_5m-core/catalog/source_manifest.json").read_text())
          source_dir = Path("canonical/guilin-dem-12_5m-core/data/raw/asf")
          actual = sorted(source_dir.glob("*.dem.tif"))
          expected = {entry["file"]: entry for entry in manifest["sources"]}
          assert [path.name for path in actual] == sorted(expected)
          for path in actual:
              entry = expected[path.name]
              assert path.stat().st_size == entry["bytes"]
              digest = hashlib.sha256()
              with path.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(8 * 1024 * 1024), b""):
                      digest.update(chunk)
              assert digest.hexdigest() == entry["sha256"]
          print("SOURCE_LFS_QA_OK", len(actual))
          PY

      - name: Rebuild the uncropped source mosaic
        id: mosaic_build
        shell: bash
        run: |
          set -euo pipefail
          test ! -e "${RAW_DIR}"
          mkdir -p "${RAW_DIR}/raw" "${RAW_DIR}/selection-data" "${EVIDENCE_DIR}"
          python "${MOSAIC_PROJECT}/build_raw_mosaic.py" \
            --source-dir "${SOURCE_DIR}" \
            --source-manifest "${SOURCE_MANIFEST}" \
            --output-dir "${RAW_DIR}/raw" \
            --web-data-dir "${RAW_DIR}/selection-data" \
            --preview-max-width 2048 \
            >"${EVIDENCE_DIR}/mosaic-build.log" 2>&1
          test -s "${RAW_DIR}/raw/guilin_raw_union_12_5m.tif"
          test -s "${RAW_DIR}/raw/mosaic_qa.json"
          cp "${RAW_DIR}/raw/mosaic_qa.json" "${EVIDENCE_DIR}/mosaic_qa.json"

      - name: Gate exact mosaic truth without filling NoData
        id: mosaic_qa
        shell: bash
        run: |
          set -euo pipefail
          python - "${RAW_DIR}/raw/mosaic_qa.json" "${RAW_DIR}/raw/guilin_raw_union_12_5m.tif" <<'PY'
          import hashlib, json, math, sys
          from pathlib import Path
          import rasterio

          qa_path, mosaic_path = map(Path, sys.argv[1:])
          qa = json.loads(qa_path.read_text())
          assert qa["schema"] == "guilin-v070-raw-union/v1"
          assert qa["source_policy"] == "12 new 12.5 m DEM files only"
          assert qa["source_count"] == 12 and len(qa["source_order"]) == 12
          assert qa["merge_policy"] == "nearest-neighbour, first-valid, target-aligned 12.5 m grid"
          assert qa["crop_applied"] is False
          assert qa["gap_fill_applied"] is False
          assert qa["edge_trim_applied"] is False
          expected = {
              "width": 17408,
              "height": 18867,
              "bounds": [349862.5, 2703012.5, 567462.5, 2938850.0],
              "transform": [12.5, 0.0, 349862.5, 0.0, -12.5, 2938850.0],
              "crs": "EPSG:32649",
              "resolution_m": [12.5, 12.5],
              "valid_pixels": 284579268,
              "nodata_pixels": 43857468,
              "total_pixels": 328436736,
              "valid_fraction": 0.8664660094539486,
              "nodata_fraction": 0.13353399054605147,
              "minimum_elevation_m": -6,
              "maximum_elevation_m": 2093,
          }
          mosaic = qa["mosaic"]
          for key, value in expected.items():
              if isinstance(value, float):
                  assert math.isclose(mosaic[key], value, rel_tol=0, abs_tol=1e-15)
              else:
                  assert mosaic[key] == value, (key, mosaic[key], value)
          assert mosaic["valid_pixels"] + mosaic["nodata_pixels"] == mosaic["total_pixels"]
          assert qa["mosaic_bytes"] == 124348471
          assert qa["mosaic_sha256"] == "9c9a042fa57a95107012aabd8613158566e3cddc33d99f55903f809adf903aaf"
          assert mosaic_path.stat().st_size == qa["mosaic_bytes"]
          digest = hashlib.sha256()
          with mosaic_path.open("rb") as stream:
              for chunk in iter(lambda: stream.read(8 * 1024 * 1024), b""):
                  digest.update(chunk)
          assert digest.hexdigest() == qa["mosaic_sha256"]
          with rasterio.open(mosaic_path) as ds:
              assert ds.width == 17408 and ds.height == 18867
              assert str(ds.crs) == "EPSG:32649"
              assert list(ds.bounds) == expected["bounds"]
              assert [ds.transform.a, ds.transform.b, ds.transform.c,
                      ds.transform.d, ds.transform.e, ds.transform.f] == expected["transform"]
              assert ds.nodata == 0
          print("MOSAIC_QA_OK", qa["mosaic_sha256"])
          PY

      - name: Fetch and reject any OSM drift from the reviewed network
        id: osm_qa
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/data
          python "${PROJECT_DIR}/fetch_osm_hydrology.py" \
            --terrain-manifest "${RAW_DIR}/raw/mosaic_qa.json" \
            --output dist/data/osm_hydrology.geojson \
            --allow-live-overpass \
            --expected-reviewed-source-sha256 "${EXPECTED_OSM_SHA256}" \
            --expected-feature-count "${EXPECTED_OSM_FEATURES}" \
            --expected-centerline-coordinates-sha256 "${EXPECTED_CENTERLINE_SHA256}" \
            >"${EVIDENCE_DIR}/osm-fetch.log" 2>&1
          python - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path("dist/data/osm_hydrology.geojson").read_text())
          assert data["source_mode"] == "live-overpass"
          assert data["reviewed_source_sha256"] == os.environ["EXPECTED_OSM_SHA256"]
          assert data["expected_reviewed_source_sha256"] == os.environ["EXPECTED_OSM_SHA256"]
          assert data["reviewed_source_digest_verified"] is True
          assert data["centerline_coordinates_sha256"] == os.environ["EXPECTED_CENTERLINE_SHA256"]
          assert data["expected_centerline_coordinates_sha256"] == os.environ["EXPECTED_CENTERLINE_SHA256"]
          assert data["centerline_digest_verified"] is True
          assert len(data["features"]) == int(os.environ["EXPECTED_OSM_FEATURES"])
          assert data["overpass_query_sha256"] and data["overpass_payload_sha256"]
          assert data["overpass_endpoint"]
          PY
          cp dist/data/osm_hydrology.geojson "${EVIDENCE_DIR}/osm_hydrology.geojson"

      - name: Build complete terrain LOD and serialized river release assets
        id: full_build
        shell: bash
        run: |
          set -euo pipefail
          python "${PROJECT_DIR}/build_terrain3d_runtime.py" \
            --mosaic "${RAW_DIR}/raw/guilin_raw_union_12_5m.tif" \
            --output-dir dist/data \
            --hydrology dist/data/osm_hydrology.geojson \
            --height-max-width 1024 \
            --texture-max-width 2560 \
            --tile-intervals 256 \
            --river-sample-step 50 \
            >"${EVIDENCE_DIR}/terrain-river-build.log" 2>&1
          test -s dist/data/terrain_manifest.json
          test -s dist/data/terrain_lod_manifest.json
          test -s dist/data/terrain_lod_qa.json
          test -s dist/data/river_drape_runtime.json
          test -s dist/data/river_drape_qa.json

      - name: Gate all terrain assets and every native/coarse LOD tile
        id: terrain_qa
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import gzip, hashlib, json, math, re, struct
          from pathlib import Path
          import numpy as np

          root = Path("dist/data")
          terrain = json.loads((root / "terrain_manifest.json").read_text())
          manifest = json.loads((root / "terrain_lod_manifest.json").read_text())
          qa = json.loads((root / "terrain_lod_qa.json").read_text())
          seasons = ("winter", "spring", "summer", "autumn")
          expected_stats = {
              "valid_pixels": 284579268,
              "nodata_pixels": 43857468,
              "total_pixels": 328436736,
              "valid_fraction": 0.8664660094539486,
              "nodata_fraction": 0.13353399054605147,
              "minimum_m": -6.0,
              "maximum_m": 2093.0,
          }
          assert terrain["schema"] == "guilin-v072-terrain-seasonal-rivers/v2"
          assert terrain["crs"] == "EPSG:32649"
          assert terrain["source_resolution_m"] == [12.5, 12.5]
          assert terrain["source_grid"] == [17408, 18867]
          assert terrain["bounds_epsg32649"] == [349862.5, 2703012.5, 567462.5, 2938850.0]
          assert terrain["vertical_scale"] == 1.0
          assert terrain["source_elevation_modified_m"] == 0.0
          assert terrain["crop_applied"] is False
          assert terrain["smoothing_applied"] is False
          assert terrain["gap_fill_applied"] is False
          assert terrain["fallback_resolution_m"] is None
          assert terrain["fallback_30m_allowed"] is False
          assert terrain["overview_only"] is True
          height = terrain["height"]
          assert height["file"] == "terrain_height_u16.bin"
          assert height["width"] == 1024 and height["height"] == 1110
          assert height["encoding"] == "uint16-little-endian"
          assert height["nodata_code"] == 65535
          assert height["valid_min_code"] == 0 and height["valid_max_code"] == 65534
          assert height["overview_only"] is True
          west, south, east, north = terrain["bounds_epsg32649"]
          center_e, center_n = terrain["center_epsg32649"]
          dx = (east - west) / height["width"]
          dy = (north - south) / height["height"]
          expected_sample_bounds = [west + dx / 2, south + dy / 2, east - dx / 2, north - dy / 2]
          sample_west, sample_south, sample_east, sample_north = expected_sample_bounds
          expected_world_bounds = [
              sample_west - center_e,
              center_n - sample_north,
              sample_east - center_e,
              center_n - sample_south,
          ]
          assert len(height["sample_center_bounds_epsg32649"]) == 4
          assert len(height["bounds_world_xz"]) == 4
          assert len(height["actual_vertex_spacing_xy_m"]) == 2
          assert np.allclose(height["sample_center_bounds_epsg32649"], expected_sample_bounds, rtol=0, atol=1e-9)
          assert np.allclose(height["bounds_world_xz"], expected_world_bounds, rtol=0, atol=1e-9)
          assert np.allclose(height["actual_vertex_spacing_xy_m"], [dx, dy], rtol=0, atol=1e-12)
          assert math.isclose(height["actual_vertex_spacing_m"], max(dx, dy), rel_tol=0, abs_tol=1e-12)
          assert math.isclose(terrain["actual_vertex_spacing_m"], height["actual_vertex_spacing_m"], rel_tol=0, abs_tol=1e-12)
          assert terrain["overview_vertex_spacing_xy_m"] == height["actual_vertex_spacing_xy_m"]
          assert height["actual_vertex_spacing_m"] > 200.0
          assert height["nodata_policy"] == (
              "source GDAL mask; conservative overview samples and cells remain transparent on any "
              "NoData contribution; no smoothing; no gap fill"
          )
          height_path = root / height["file"]
          assert height_path.stat().st_size == height["width"] * height["height"] * 2
          decoded_overview = np.fromfile(height_path, dtype="<u2")
          assert decoded_overview.size == height["width"] * height["height"]
          assert np.count_nonzero(decoded_overview == height["nodata_code"]) > 0
          assert np.count_nonzero(decoded_overview <= height["valid_max_code"]) > 0
          assert terrain["source_statistics"] == manifest["source_statistics"]
          for key, value in expected_stats.items():
              actual = terrain["source_statistics"][key]
              if isinstance(value, float):
                  assert math.isclose(actual, value, rel_tol=0, abs_tol=1e-15), (key, actual)
              else:
                  assert actual == value
          assert terrain["lod_manifest_file"] == "terrain_lod_manifest.json"
          assert terrain["lod_qa_file"] == "terrain_lod_qa.json"
          assert terrain["river_runtime_file"] == "river_drape_runtime.json"
          assert terrain["river_qa_file"] == "river_drape_qa.json"
          assert not ({
              "terrain_lod_manifest_file", "terrain_lod_qa_file",
              "river_drape_runtime_file", "river_drape_qa_file",
          } & set(terrain))
          assert terrain["lod_qa_passed"] is True and terrain["river_qa_passed"] is True
          assert terrain["surface_color_semantics"] == "programmatic composite; not satellite or orthophoto imagery"
          assert terrain["texture"]["surface_color_semantics"] == terrain["surface_color_semantics"]
          assert terrain["karst_detail"]["file"] == "terrain_karst_detail.webp"
          assert terrain["karst_detail"]["runtime_binding_required"] is True
          assert "independent strength" in terrain["karst_detail"]["policy"]

          for asset_key in ("height", "texture", "normal", "roughness", "karst_detail"):
              asset = terrain[asset_key]
              path = root / asset["file"]
              assert path.is_file() and path.stat().st_size > 0
              if "stored_bytes" in asset:
                  assert path.stat().st_size == asset["stored_bytes"]
              if "sha256" in asset:
                  assert hashlib.sha256(path.read_bytes()).hexdigest() == asset["sha256"]

          assert manifest["schema"] == "guilin-v072-terrain-lod/v4"
          assert qa["schema"] == "guilin-v072-terrain-lod-qa/v4"
          assert manifest["source_grid"] == [17408, 18867]
          assert manifest["source_resolution_m"] == [12.5, 12.5]
          assert manifest["bounds_epsg32649"] == terrain["bounds_epsg32649"]
          assert manifest["vertical_scale"] == 1.0
          assert manifest["source_elevation_modified_m"] == 0.0
          assert manifest["smoothing_applied"] is False
          assert manifest["gap_fill_applied"] is False
          assert manifest["fallback_resolution_m"] is None
          assert manifest["fallback_30m_allowed"] is False
          assert manifest["coarse_level_full_domain_claimed"] is False
          assert manifest["native_full_domain"] is True
          assert qa["coarse_level_full_domain_claimed"] is False
          assert qa["native_full_domain"] is True
          assert manifest["overview_only_backdrop_policy"] == qa["overview_only_backdrop_policy"]
          assert "coarse" in manifest["overview_only_backdrop_policy"]
          assert "native" in manifest["overview_only_backdrop_policy"]
          assert manifest["tile_count"] == qa["tile_count"] == 6742
          assert manifest["tile_format"] == {
              "magic": "GLTILE4\\0",
              "header_struct_little_endian": "<8sIIII3d",
              "payload_order": ["height_f32", "vertex_mask_u8", "conservative_cell_mask_u8"],
              "file_pattern": "terrain_lod/{level_id}/r{row:03d}_c{col:03d}.tile.gz",
              "deterministic_gzip": True,
          }
          expected_ids = ["lod1600m", "lod800m", "lod400m", "lod200m", "lod100m", "lod50m", "lod25m", "native12_5m"]
          expected_strides = [128, 64, 32, 16, 8, 4, 2, 1]
          expected_counts = [1, 4, 9, 25, 90, 323, 1258, 5032]
          expected_spacings = [1600.0, 800.0, 400.0, 200.0, 100.0, 50.0, 25.0, 12.5]
          levels = manifest["levels"]
          assert [level["id"] for level in levels] == expected_ids
          assert [level["level_id"] for level in levels] == expected_ids
          assert [level["stride"] for level in levels] == expected_strides
          assert [level["spacing_m"] for level in levels] == expected_spacings
          assert [level["resolution_m"] for level in levels] == expected_spacings
          assert [level["tile_count"] for level in levels] == expected_counts
          coverage = qa["level_domain_coverage"]
          assert coverage == [
              {
                  "id": level["id"],
                  "full_source_center_domain_coverage": level["full_source_center_domain_coverage"],
                  "source_center_edge_gaps_m": level["source_center_edge_gaps_m"],
              }
              for level in levels
          ]
          for level in levels[:-1]:
              assert level["full_source_center_domain_coverage"] is False
              assert max(level["source_center_edge_gaps_m"].values()) > 0.0
              assert level["domain_coverage_policy"] == "native full-domain; coarse grids never invent non-uniform edge samples"
          native = levels[-1]
          assert native["full_source_center_domain_coverage"] is True
          assert max(native["source_center_edge_gaps_m"].values()) <= 1e-9

          seen_files = set()
          total = 0
          maximum_bytes = 0
          for level, expected_count in zip(levels, expected_counts, strict=True):
              assert len(level["tiles"]) == expected_count
              assert level["tile_intervals"] == 256
              assert level["smoothing_applied"] is False
              assert level["gap_fill_applied"] is False
              assert level["height_encoding"] == "source float32 little-endian"
              for tile in level["tiles"]:
                  relative = tile["file"]
                  assert re.fullmatch(rf"terrain_lod/{re.escape(level['id'])}/r\d{{3}}_c\d{{3}}\.tile\.gz", relative)
                  assert relative not in seen_files
                  seen_files.add(relative)
                  path = root / relative
                  assert path.is_file()
                  assert path.stat().st_size == tile["stored_bytes"]
                  assert tile["stored_bytes"] < 100 * 1024 * 1024
                  maximum_bytes = max(maximum_bytes, tile["stored_bytes"])
                  assert hashlib.sha256(path.read_bytes()).hexdigest() == tile["sha256"]
                  assert tile["width"] == tile["sample_width"]
                  assert tile["height"] == tile["sample_height"]
                  assert tile["cell_width"] == tile["width"] - 1
                  assert tile["cell_height"] == tile["height"] - 1
                  assert tile["smoothing_applied"] is False
                  assert tile["gap_fill_applied"] is False
                  assert tile["fallback_resolution_m"] is None
                  assert tile["fallback_30m_allowed"] is False
                  assert tile["decode_receipt"] and all(tile["decode_receipt"].values())
                  with gzip.open(path, "rb") as stream:
                      header = stream.read(48)
                      magic, width, height, cell_width, cell_height, origin_e, origin_n, spacing = struct.unpack("<8sIIII3d", header)
                      payload = stream.read()
                  assert magic == b"GLTILE4\0"
                  assert [width, height, cell_width, cell_height] == [tile["width"], tile["height"], tile["cell_width"], tile["cell_height"]]
                  assert math.isclose(spacing, level["spacing_m"], rel_tol=0, abs_tol=1e-12)
                  assert math.isclose(origin_e, tile["bounds_epsg32649"][0], rel_tol=0, abs_tol=1e-9)
                  assert math.isclose(origin_n, tile["bounds_epsg32649"][3], rel_tol=0, abs_tol=1e-9)
                  assert len(payload) == width * height * 5 + cell_width * cell_height
                  total += 1
          assert total == 6742 and len(seen_files) == 6742
          assert maximum_bytes == qa["maximum_stored_tile_bytes"]

          assert qa["passed"] is True
          assert qa["checks"] and all(qa["checks"].values())
          correspondence = qa["source_correspondence"]
          assert correspondence["passed"] is True
          assert correspondence["decoded_valid_samples"] > 0
          assert correspondence["maximum_error_m"] == 0.0
          assert correspondence["p95_error_m"] == 0.0
          assert correspondence["mask_mismatch_count"] == 0
