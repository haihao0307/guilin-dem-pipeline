          receipt = {
              "schema": "guilin-v072-browser-process-receipt/v1", "mode": "public-live-vendor",
              "exit_code": status, "node_host_deadline_ms": 3_600_000,
              "shell_timeout_minutes": 70, "step_timeout_minutes": 75,
              "evidence_flush_margin_minutes": 10,
          }
          (root / "process-receipt.json").write_text(json.dumps(receipt, indent=2) + "\n")
          required = ["browser-qa-report.json", "diagnostics.json", "browser-console.json", "browser-network.json"]
          missing = [name for name in required if not (root / name).is_file()]
          if missing:
