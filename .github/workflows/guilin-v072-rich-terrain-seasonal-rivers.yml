              assert final_asset["index_file"] == final_asset["indices_file"] == f"river_drape_{season}_indices.u32.gz"
              assert final_asset["position_compression"] == final_asset["index_compression"] == "gzip"
              assert final_asset["positions_global"] is True and final_asset["indices_global"] is True
              assert "terrain-world local" in final_asset["vertex_space"]
