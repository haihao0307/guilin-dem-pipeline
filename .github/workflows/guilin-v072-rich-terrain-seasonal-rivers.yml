              assert partition["invalid_or_self_intersecting_partition_count"] == 0
              assert partition["new_global_interior_ring_count"] == 0
              assert partition["desired_union_interior_ring_count"] == partition["owned_union_interior_ring_count"]
              assert partition["maximum_join_gap_m"] <= 1e-6
