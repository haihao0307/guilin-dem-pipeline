              assert final["shared_endpoint_count"] == partition["shared_endpoint_junction_count"]
              assert final["shared_endpoint_uncovered_count"] == 0
              assert final["shared_endpoint_distance_maximum_m"] <= 0.03
              assert final["shared_endpoint_distance_p95_m"] <= 0.03
              assert final["preclip_owned_to_accounted_after_terrain_clipping_boundary_hausdorff_m"] <= 0.03
              assert final["preclip_owned_boundary_outside_accounted_3cm_buffer_length_m"] <= 1e-6
              assert final["accounted_boundary_outside_preclip_owned_3cm_buffer_length_m"] <= 1e-6
