          ASSEMBLE_OUTCOME: ${{ steps.assemble.outcome }}
          RELEASE_INVENTORY_OUTCOME: ${{ steps.release_inventory.outcome }}
          LOCAL_BROWSER_OUTCOME: ${{ steps.local_browser.outcome }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          gates = {
              key.removesuffix("_OUTCOME").lower(): value
              for key, value in os.environ.items() if key.endswith("_OUTCOME")
          }
          failed = {key: value for key, value in gates.items() if value != "success"}
          if failed:
              raise AssertionError(f"pre-publish QA outcomes are not all successful: {failed}")
          report = json.loads((Path(os.environ["EVIDENCE_DIR"]) / "local/browser-qa-report.json").read_text())
          diagnostics = json.loads((Path(os.environ["EVIDENCE_DIR"]) / "local/diagnostics.json").read_text())
          assert report["passed"] is True and diagnostics["passed"] is True
          inventory = json.loads((Path(os.environ["EVIDENCE_DIR"]) / "release-inventory.json").read_text())
          assert inventory["source_commit"] == os.environ["GITHUB_SHA"]
          assert inventory["terrain_lod_tile_count"] == 6742
          assert inventory["resource_count"] == len(inventory["resources"])
          PY
          remote_sha="$(git ls-remote --exit-code origin "refs/heads/${EXPECTED_BRANCH}" | awk '{print $1}')"
          test "${remote_sha}" = "${GITHUB_SHA}"
          pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${EXPECTED_PR}")"
          PR_JSON="${pr_json}" python - <<'PY'
          import json, os
          pr = json.loads(os.environ["PR_JSON"])
          assert pr["state"] == "open" and pr["draft"] is True
          assert pr["merged"] is False and pr["merged_at"] is None
          assert pr["head"]["ref"] == os.environ["EXPECTED_BRANCH"]
          assert pr["head"]["sha"] == os.environ["GITHUB_SHA"]
          assert pr["base"]["ref"] == "main"
          PY

      - name: Capture gh-pages ancestry and non-destination tree before publication
        id: pages_before
        if: steps.pre_publish_gate.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/gh-pages:refs/remotes/origin/gh-pages
          before="$(git rev-parse refs/remotes/origin/gh-pages)"
          test -n "${before}"
          printf 'commit=%s\n' "${before}" >> "${GITHUB_OUTPUT}"
          BEFORE_COMMIT="${before}" python - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          before = os.environ["BEFORE_COMMIT"]
          destination = os.environ["DESTINATION_DIR"].rstrip("/") + "/"
          raw = subprocess.check_output(["git", "ls-tree", "-rz", "--full-tree", before])
          entries = []
          for record in raw.split(b"\0"):
              if not record:
                  continue
              metadata, path_bytes = record.split(b"\t", 1)
              path = path_bytes.decode("utf-8")
              if not path.startswith(destination):
                  entries.append({"metadata": metadata.decode("ascii"), "path": path})
          payload = json.dumps(entries, ensure_ascii=False, separators=(",", ":")).encode()
          receipt = {
              "schema": "guilin-v072-pages-before/v1",
              "commit": before,
              "outside_destination_entry_count": len(entries),
              "outside_destination_tree_sha256": hashlib.sha256(payload).hexdigest(),
              "entries": entries,
          }
          out = Path(os.environ["EVIDENCE_DIR"]) / "pages-before.json"
          out.write_text(json.dumps(receipt, ensure_ascii=False, indent=2) + "\n")
          PY

      - name: Publish only the QA-approved destination tree to gh-pages
        id: publish
        if: steps.pages_before.outcome == 'success' && steps.pre_publish_gate.outcome == 'success'
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
          destination_dir: guilin-v072-terrain-rivers
          keep_files: true
          force_orphan: false
          enable_jekyll: false
          commit_message: "Publish Guilin v0.7.2 from source ${{ github.sha }}"

      - name: Verify non-force Pages ancestry, destination-only delta, and every published byte
        id: pages_verify
        if: steps.publish.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          BEFORE_COMMIT: ${{ steps.pages_before.outputs.commit }}
        run: |
          set -euo pipefail
          test -n "${BEFORE_COMMIT}"
          git fetch --no-tags origin refs/heads/gh-pages:refs/remotes/origin/gh-pages
          after="$(git rev-parse refs/remotes/origin/gh-pages)"
          test "${after}" != "${BEFORE_COMMIT}"
          git merge-base --is-ancestor "${BEFORE_COMMIT}" "${after}"
          parent_count="$(git rev-list --parents -n 1 "${after}" | awk '{print NF-1}')"
          test "${parent_count}" -eq 1
          test "$(git rev-parse "${after}^")" = "${BEFORE_COMMIT}"
          git log -1 --format=%B "${after}" | grep -F "${GITHUB_SHA}"
          while IFS= read -r changed; do
            test -n "${changed}"
            case "${changed}" in
              "${DESTINATION_DIR}"/*) ;;
              *) echo "Unexpected gh-pages path changed: ${changed}" >&2; exit 1 ;;
            esac
          done < <(git diff-tree --no-commit-id --name-only -r "${BEFORE_COMMIT}" "${after}")
          AFTER_COMMIT="${after}" python - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          before = json.loads((Path(os.environ["EVIDENCE_DIR"]) / "pages-before.json").read_text())
          after = os.environ["AFTER_COMMIT"]
          destination = os.environ["DESTINATION_DIR"].rstrip("/") + "/"
          raw = subprocess.check_output(["git", "ls-tree", "-rz", "--full-tree", after])
          entries = []
          for record in raw.split(b"\0"):
              if not record:
                  continue
              metadata, path_bytes = record.split(b"\t", 1)
              path = path_bytes.decode("utf-8")
              if not path.startswith(destination):
                  entries.append({"metadata": metadata.decode("ascii"), "path": path})
          payload = json.dumps(entries, ensure_ascii=False, separators=(",", ":")).encode()
          assert entries == before["entries"]
          assert hashlib.sha256(payload).hexdigest() == before["outside_destination_tree_sha256"]
          PY
          published_tree="$(mktemp -d)"
          git archive "${after}:${DESTINATION_DIR}" | tar -x -C "${published_tree}"
          PUBLISHED_TREE="${published_tree}" AFTER_COMMIT="${after}" python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ["PUBLISHED_TREE"])
          inventory = json.loads((Path(os.environ["EVIDENCE_DIR"]) / "release-inventory.json").read_text())
          expected = {entry["path"]: entry for entry in inventory["resources"]}
          actual_paths = sorted(path.relative_to(root).as_posix() for path in root.rglob("*") if path.is_file())
          assert actual_paths == sorted(expected), (len(actual_paths), len(expected))
          for relative, entry in expected.items():
              path = root / relative
              data = path.read_bytes()
              assert len(data) == entry["bytes"], relative
              assert hashlib.sha256(data).hexdigest() == entry["sha256"], relative
          receipt = {
              "schema": "guilin-v072-pages-tree-verification/v1",
              "source_commit": os.environ["GITHUB_SHA"],
              "before_commit": json.loads((Path(os.environ["EVIDENCE_DIR"]) / "pages-before.json").read_text())["commit"],
              "published_commit": os.environ["AFTER_COMMIT"],
              "destination_dir": os.environ["DESTINATION_DIR"],
              "resource_count": len(expected),
              "all_bytes_match": True,
              "outside_destination_unchanged": True,
              "single_non_force_parent": True,
              "passed": True,
          }
          (Path(os.environ["EVIDENCE_DIR"]) / "pages-tree-verification.json").write_text(json.dumps(receipt, indent=2) + "\n")
          PY
          printf 'pages_commit=%s\n' "${after}" >> "${GITHUB_OUTPUT}"

      - name: Poll the real public origin for the exact source deployment receipt
        id: public_freshness
        if: steps.publish.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time
          from pathlib import Path
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          started = time.monotonic()
          deadline_seconds = 18 * 60
          base = os.environ["PUBLIC_BASE_URL"]
          expected = os.environ["GITHUB_SHA"]
          attempts = []
          matched = False
          while time.monotonic() - started < deadline_seconds:
              url = f"{base}deployment_receipt.json?source={expected}&attempt={len(attempts) + 1}"
              item = {"url": url, "status": None, "source_commit": None, "error": None}
              try:
                  request = Request(url, headers={"Cache-Control": "no-cache", "User-Agent": "guilin-v072-public-freshness"})
                  with urlopen(request, timeout=20) as response:
                      item["status"] = response.status
                      payload = json.loads(response.read())
                  item["source_commit"] = payload.get("source_commit")
                  matched = response.status == 200 and payload.get("schema") == "guilin-v072-deployment-receipt/v1" and payload.get("source_commit") == expected
              except HTTPError as error:
                  item["status"] = error.code
                  item["error"] = str(error)
              except (URLError, TimeoutError, json.JSONDecodeError) as error:
                  item["error"] = str(error)
              attempts.append(item)
              if matched:
                  break
              time.sleep(10)
          elapsed = time.monotonic() - started
          report = {
              "schema": "guilin-v072-public-freshness/v1",
              "public_url": base,
              "expected_source_commit": expected,
              "matched": matched,
              "passed": matched and elapsed < 20 * 60,
              "elapsed_seconds": elapsed,
              "attempts": attempts,
          }
          path = Path(os.environ["EVIDENCE_DIR"]) / "public-freshness.json"
          path.write_text(json.dumps(report, indent=2) + "\n")
          assert report["passed"], report
          PY

      - name: Run Chromium QA against the unmodified real public origin
        id: public_browser
