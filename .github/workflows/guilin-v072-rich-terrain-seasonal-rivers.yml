          report = json.loads((root / "browser-qa-report.json").read_text())
          diagnostics = json.loads((root / "diagnostics.json").read_text())
          console = json.loads((root / "browser-console.json").read_text())
          network = json.loads((root / "browser-network.json").read_text())
          assert status == 0, receipt
          assert report["schema"] == "guilin-v072-browser-qa-report/v3" and report["passed"] is True
          assert report["browser_mode"] == "public-live-vendor"
          assert diagnostics["passed"] is True and diagnostics["fatal_error"] is None
          assert report["screenshot_count"] >= 80
          assert console["errors"] == [] and console["page_errors"] == []
          assert network["http_404"] == [] and network["responses_ge_400"] == []
          assert network["request_failed"] == []
          PY

      - name: Check every published resource and every observed HTTP attempt
        id: public_resources
        if: steps.publish.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import concurrent.futures, hashlib, json, os, time
          from pathlib import Path
          from urllib.error import HTTPError, URLError
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          inventory = json.loads((Path(os.environ["EVIDENCE_DIR"]) / "release-inventory.json").read_text())
          resources = inventory["resources"]
          assert inventory["terrain_lod_tile_count"] == 6742
          assert inventory["resource_count"] == len(resources)
          base = os.environ["PUBLIC_BASE_URL"]
          started = time.monotonic()
          deadline = started + 18 * 60

          def check_resource(entry):
              attempts = []
              success = False
              for attempt_number in (1, 2):
                  remaining = deadline - time.monotonic()
                  if remaining <= 1:
                      attempts.append({"attempt": attempt_number, "status": None, "error": "global deadline exhausted"})
                      break
                  encoded_path = "/".join(quote(part, safe="") for part in entry["path"].split("/"))
                  url = f"{base}{encoded_path}?qa={entry['sha256'][:16]}&attempt={attempt_number}"
                  item = {"attempt": attempt_number, "url": url, "status": None, "bytes": None, "sha256": None, "error": None}
                  try:
                      request = Request(url, headers={"Cache-Control": "no-cache", "User-Agent": "guilin-v072-public-resource-qa"})
                      with urlopen(request, timeout=min(8.0, max(1.0, remaining))) as response:
                          body = response.read()
                          item["status"] = response.status
                      item["bytes"] = len(body)
                      item["sha256"] = hashlib.sha256(body).hexdigest()
                      success = item["status"] == 200 and item["bytes"] == entry["bytes"] and item["sha256"] == entry["sha256"]
                  except HTTPError as error:
                      item["status"] = error.code
                      item["error"] = str(error)
                  except (URLError, TimeoutError, OSError) as error:
                      item["error"] = str(error)
                  attempts.append(item)
                  if success:
                      break
                  time.sleep(0.1)
              return {"path": entry["path"], "expected_bytes": entry["bytes"], "expected_sha256": entry["sha256"], "passed": success, "attempts": attempts}

          with concurrent.futures.ThreadPoolExecutor(max_workers=128) as executor:
              results = list(executor.map(check_resource, resources))
          elapsed = time.monotonic() - started
          failures = [result["path"] for result in results if not result["passed"]]
          observed_attempt_404 = sum(
              1 for result in results for attempt in result["attempts"] if attempt.get("status") == 404
          )
          report = {
              "schema": "guilin-v072-public-all-resources-http/v2",
              "public_base_url": base,
              "source_commit": os.environ["GITHUB_SHA"],
              "expected_resource_count": len(resources),
              "checked_resource_count": len(results),
              "terrain_lod_tile_count": inventory["terrain_lod_tile_count"],
              "failed_resource_count": len(failures),
              "failed_resources": failures,
              "http_404_count": observed_attempt_404,
              "observed_attempt_http_404_count": observed_attempt_404,
              "attempt_count": sum(len(result["attempts"]) for result in results),
              "elapsed_seconds": elapsed,
              "deadline_seconds": 18 * 60,
              "completed_before_deadline": elapsed < 20 * 60,
              "results": results,
          }
          report["passed"] = (
              report["checked_resource_count"] == report["expected_resource_count"]
              and report["terrain_lod_tile_count"] == 6742
              and report["failed_resource_count"] == 0
              and report["http_404_count"] == 0
              and report["observed_attempt_http_404_count"] == 0
              and report["completed_before_deadline"]
          )
          path = Path(os.environ["EVIDENCE_DIR"]) / "public-all-resources-http.json"
          path.write_text(json.dumps(report, indent=2) + "\n")
          assert report["passed"], {
              "failed_resource_count": len(failures),
              "observed_attempt_http_404_count": observed_attempt_404,
              "elapsed_seconds": elapsed,
          }
          PY

      - name: Inventory all available evidence even when QA failed
        id: evidence_inventory
        if: always()
        shell: bash
        env:
          SOURCE_IDENTITY_OUTCOME: ${{ steps.source_identity.outcome }}
          DEPENDENCIES_OUTCOME: ${{ steps.dependencies.outcome }}
          SOURCE_QA_OUTCOME: ${{ steps.source_qa.outcome }}
          MOSAIC_BUILD_OUTCOME: ${{ steps.mosaic_build.outcome }}
          MOSAIC_QA_OUTCOME: ${{ steps.mosaic_qa.outcome }}
          OSM_QA_OUTCOME: ${{ steps.osm_qa.outcome }}
          FULL_BUILD_OUTCOME: ${{ steps.full_build.outcome }}
          TERRAIN_QA_OUTCOME: ${{ steps.terrain_qa.outcome }}
          RIVER_QA_OUTCOME: ${{ steps.river_qa.outcome }}
          BROWSER_DEPENDENCIES_OUTCOME: ${{ steps.browser_dependencies.outcome }}
          ASSEMBLE_OUTCOME: ${{ steps.assemble.outcome }}
          RELEASE_INVENTORY_OUTCOME: ${{ steps.release_inventory.outcome }}
          LOCAL_BROWSER_OUTCOME: ${{ steps.local_browser.outcome }}
          PRE_PUBLISH_GATE_OUTCOME: ${{ steps.pre_publish_gate.outcome }}
          PAGES_BEFORE_OUTCOME: ${{ steps.pages_before.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          PAGES_VERIFY_OUTCOME: ${{ steps.pages_verify.outcome }}
          PUBLIC_FRESHNESS_OUTCOME: ${{ steps.public_freshness.outcome }}
          PUBLIC_BROWSER_OUTCOME: ${{ steps.public_browser.outcome }}
          PUBLIC_RESOURCES_OUTCOME: ${{ steps.public_resources.outcome }}
          PAGES_COMMIT: ${{ steps.pages_verify.outputs.pages_commit }}
        run: |
          set -euo pipefail
          mkdir -p "${EVIDENCE_DIR}/contracts"
          for path in \
            "${RAW_DIR}/raw/mosaic_qa.json" \
            dist/deployment_receipt.json \
            dist/data/terrain_manifest.json \
            dist/data/terrain_lod_manifest.json \
            dist/data/terrain_lod_qa.json \
            dist/data/osm_hydrology.geojson \
            dist/data/river_drape_runtime.json \
            dist/data/river_drape_qa.json; do
            if [ -f "${path}" ]; then
              cp "${path}" "${EVIDENCE_DIR}/contracts/$(basename "${path}")"
            fi
          done
          git fetch --no-tags origin main >/dev/null 2>&1 || true
          git diff --name-only "origin/main...${GITHUB_SHA}" >"${EVIDENCE_DIR}/modified-files.txt" || \
            git show --pretty='' --name-only "${GITHUB_SHA}" >"${EVIDENCE_DIR}/modified-files.txt"
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ["EVIDENCE_DIR"])
          outcomes = {
              key.removesuffix("_OUTCOME").lower(): value
              for key, value in os.environ.items() if key.endswith("_OUTCOME")
          }
          (root / "workflow-step-outcomes.json").write_text(json.dumps({
              "schema": "guilin-v072-workflow-step-outcomes/v1",
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "source_commit": os.environ["GITHUB_SHA"],
              "pages_commit": os.environ.get("PAGES_COMMIT") or None,
              "outcomes": outcomes,
          }, indent=2) + "\n")
          files = []
          for path in sorted(root.rglob("*")):
              if not path.is_file() or path.name == "evidence-inventory.json":
                  continue
              data = path.read_bytes()
              files.append({
                  "path": path.relative_to(root).as_posix(),
                  "bytes": len(data),
                  "sha256": hashlib.sha256(data).hexdigest(),
              })
          assert files
          inventory = {
              "schema": "guilin-v072-evidence-inventory/v1",
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "source_commit": os.environ["GITHUB_SHA"],
              "artifact_name": f"guilin-v072-rich-terrain-seasonal-rivers-evidence-{os.environ['GITHUB_RUN_ID']}",
              "file_count": len(files),
              "files": files,
          }
          (root / "evidence-inventory.json").write_text(json.dumps(inventory, indent=2) + "\n")
          print("EVIDENCE_INVENTORY_OK", len(files))
          PY

      - name: Upload logs, contracts, diagnostics, and screenshots on success or failure
        id: evidence_artifact
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: guilin-v072-rich-terrain-seasonal-rivers-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/guilin-v072-evidence/
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

      - name: Write truthful run, artifact, public, and QA summary
        id: job_summary
        if: always()
        shell: bash
        env:
          SOURCE_IDENTITY_OUTCOME: ${{ steps.source_identity.outcome }}
          SOURCE_QA_OUTCOME: ${{ steps.source_qa.outcome }}
          MOSAIC_QA_OUTCOME: ${{ steps.mosaic_qa.outcome }}
          OSM_QA_OUTCOME: ${{ steps.osm_qa.outcome }}
          TERRAIN_QA_OUTCOME: ${{ steps.terrain_qa.outcome }}
          RIVER_QA_OUTCOME: ${{ steps.river_qa.outcome }}
          LOCAL_BROWSER_OUTCOME: ${{ steps.local_browser.outcome }}
          PRE_PUBLISH_GATE_OUTCOME: ${{ steps.pre_publish_gate.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          PAGES_VERIFY_OUTCOME: ${{ steps.pages_verify.outcome }}
          PUBLIC_FRESHNESS_OUTCOME: ${{ steps.public_freshness.outcome }}
          PUBLIC_BROWSER_OUTCOME: ${{ steps.public_browser.outcome }}
          PUBLIC_RESOURCES_OUTCOME: ${{ steps.public_resources.outcome }}
          EVIDENCE_ARTIFACT_OUTCOME: ${{ steps.evidence_artifact.outcome }}
          ARTIFACT_URL: ${{ steps.evidence_artifact.outputs.artifact-url }}
          ARTIFACT_ID: ${{ steps.evidence_artifact.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.evidence_artifact.outputs.artifact-digest }}
          PAGES_COMMIT: ${{ steps.pages_verify.outputs.pages_commit }}
        run: |
          set -euo pipefail
          python - <<'PY' >>"${GITHUB_STEP_SUMMARY}"
          import json, os
          from pathlib import Path

          evidence = Path(os.environ["EVIDENCE_DIR"])
          def load(relative):
              path = evidence / relative
              try:
                  return json.loads(path.read_text())
              except (FileNotFoundError, json.JSONDecodeError):
                  return None
          outcomes = {
              key.removesuffix("_OUTCOME").lower(): value
              for key, value in os.environ.items() if key.endswith("_OUTCOME")
          }
          run_url = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          artifact_name = f"guilin-v072-rich-terrain-seasonal-rivers-evidence-{os.environ['GITHUB_RUN_ID']}"
          local_report, public_report = load("local/browser-qa-report.json"), load("public/browser-qa-report.json")
          local_console, public_console = load("local/browser-console.json"), load("public/browser-console.json")
          local_network, public_network = load("local/browser-network.json"), load("public/browser-network.json")
          resources = load("public-all-resources-http.json")
          freshness = load("public-freshness.json")
          river = load("river-grounding-topology-report.json")
          print("## Guilin v0.7.2 Draft release evidence")
          print()
          print(f"- Actions run: [{os.environ['GITHUB_RUN_ID']}]({run_url}) (attempt {os.environ['GITHUB_RUN_ATTEMPT']})")
          print(f"- Source commit: `{os.environ['GITHUB_SHA']}`")
          print(f"- Pages commit: `{os.environ.get('PAGES_COMMIT') or 'not verified'}`")
          print(f"- Public URL: {os.environ['PUBLIC_BASE_URL']}")
          print(f"- Artifact: `{artifact_name}`; ID `{os.environ.get('ARTIFACT_ID') or 'not uploaded'}`")
          if os.environ.get("ARTIFACT_URL"):
              print(f"- Artifact download: {os.environ['ARTIFACT_URL']}")
          if os.environ.get("ARTIFACT_DIGEST"):
              print(f"- Artifact digest: `{os.environ['ARTIFACT_DIGEST']}`")
          print("- PR policy: remains open, Draft, unmerged; this workflow never changes readiness or merges.")
          print()
          print("### Step outcomes")
          print()
          print("| Gate | Outcome |")
          print("| --- | --- |")
          for key in sorted(outcomes):
              print(f"| `{key}` | `{outcomes[key]}` |")
          print()
          print("### Browser and public origin")
          print()
          print("| Evidence | Local | Public |")
          print("| --- | ---: | ---: |")
          def flag(report): return "pass" if report and report.get("passed") is True else "not passed"
          def count(record, key): return len(record.get(key, [])) if record else "not available"
          print(f"| Browser contract | {flag(local_report)} | {flag(public_report)} |")
          print(f"| Console errors | {count(local_console, 'errors')} | {count(public_console, 'errors')} |")
          print(f"| Page errors | {count(local_console, 'page_errors')} | {count(public_console, 'page_errors')} |")
          print(f"| Browser HTTP 404 | {count(local_network, 'http_404')} | {count(public_network, 'http_404')} |")
          print(f"| Failed requests | {count(local_network, 'request_failed')} | {count(public_network, 'request_failed')} |")
          if resources:
              print(f"- Exhaustive public resources: {resources.get('checked_resource_count')}/{resources.get('expected_resource_count')}; all-attempt 404 count: {resources.get('observed_attempt_http_404_count')}; passed: {resources.get('passed')}.")
          else:
              print("- Exhaustive public resources: not available.")
          print(f"- Exact public freshness: {freshness.get('passed') if freshness else 'not available'}.")
          if river:
              print()
              print("### Final decoded river grounding")
              print()
              print("| Season | Width | Depth | P95 error m | Maximum error m | Maximum clearance m | Penetration minimum m |")
              print("| --- | ---: | ---: | ---: | ---: | ---: | ---: |")
              for season in ("winter", "spring", "summer", "autumn"):
                  item = river["seasons"][season]
                  print(f"| {season} | {item['width']} | {item['depth']} | {item['grounding_p95_m']:.9g} | {item['grounding_maximum_m']:.9g} | {item['maximum_clearance_m']:.9g} | {item['penetration_minimum_m']:.9g} |")
          print()
          print("### Modified files in this PR")
          print()
          modified_path = evidence / "modified-files.txt"
          modified = [line for line in modified_path.read_text().splitlines() if line] if modified_path.exists() else []
          if modified:
              for path in modified:
                  print(f"- `{path}`")
          else:
              print("- Not available")
          PY

      - name: Final fail-closed public release and Draft PR gate
        id: final_gate
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_IDENTITY_OUTCOME: ${{ steps.source_identity.outcome }}
          DEPENDENCIES_OUTCOME: ${{ steps.dependencies.outcome }}
          SOURCE_QA_OUTCOME: ${{ steps.source_qa.outcome }}
          MOSAIC_BUILD_OUTCOME: ${{ steps.mosaic_build.outcome }}
          MOSAIC_QA_OUTCOME: ${{ steps.mosaic_qa.outcome }}
          OSM_QA_OUTCOME: ${{ steps.osm_qa.outcome }}
          FULL_BUILD_OUTCOME: ${{ steps.full_build.outcome }}
          TERRAIN_QA_OUTCOME: ${{ steps.terrain_qa.outcome }}
          RIVER_QA_OUTCOME: ${{ steps.river_qa.outcome }}
          BROWSER_DEPENDENCIES_OUTCOME: ${{ steps.browser_dependencies.outcome }}
          ASSEMBLE_OUTCOME: ${{ steps.assemble.outcome }}
          RELEASE_INVENTORY_OUTCOME: ${{ steps.release_inventory.outcome }}
          LOCAL_BROWSER_OUTCOME: ${{ steps.local_browser.outcome }}
          PRE_PUBLISH_GATE_OUTCOME: ${{ steps.pre_publish_gate.outcome }}
          PAGES_BEFORE_OUTCOME: ${{ steps.pages_before.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          PAGES_VERIFY_OUTCOME: ${{ steps.pages_verify.outcome }}
          PUBLIC_FRESHNESS_OUTCOME: ${{ steps.public_freshness.outcome }}
          PUBLIC_BROWSER_OUTCOME: ${{ steps.public_browser.outcome }}
          PUBLIC_RESOURCES_OUTCOME: ${{ steps.public_resources.outcome }}
          EVIDENCE_INVENTORY_OUTCOME: ${{ steps.evidence_inventory.outcome }}
          EVIDENCE_ARTIFACT_OUTCOME: ${{ steps.evidence_artifact.outcome }}
          JOB_SUMMARY_OUTCOME: ${{ steps.job_summary.outcome }}
          ARTIFACT_ID: ${{ steps.evidence_artifact.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.evidence_artifact.outputs.artifact-url }}
          PAGES_COMMIT: ${{ steps.pages_verify.outputs.pages_commit }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          evidence = Path(os.environ["EVIDENCE_DIR"])
          outcomes = {
              key.removesuffix("_OUTCOME").lower(): value
              for key, value in os.environ.items() if key.endswith("_OUTCOME")
          }
          failed = {key: value for key, value in outcomes.items() if value != "success"}
          if failed:
              raise AssertionError(f"final required step outcomes are not all successful: {failed}")
          assert os.environ.get("ARTIFACT_ID") and os.environ.get("ARTIFACT_URL")
          pages = json.loads((evidence / "pages-tree-verification.json").read_text())
          assert pages["passed"] is True
          assert pages["source_commit"] == os.environ["GITHUB_SHA"]
          assert pages["published_commit"] == os.environ["PAGES_COMMIT"]
          assert pages["resource_count"] > 6742
          freshness = json.loads((evidence / "public-freshness.json").read_text())
          assert freshness["passed"] is True and freshness["matched"] is True
          assert freshness["expected_source_commit"] == os.environ["GITHUB_SHA"]
          for mode in ("local", "public"):
              report = json.loads((evidence / mode / "browser-qa-report.json").read_text())
              diagnostics = json.loads((evidence / mode / "diagnostics.json").read_text())
              console = json.loads((evidence / mode / "browser-console.json").read_text())
              network = json.loads((evidence / mode / "browser-network.json").read_text())
              assert report["passed"] is True and report["screenshot_count"] >= 80
              assert diagnostics["passed"] is True and diagnostics["fatal_error"] is None
              assert console["errors"] == [] and console["page_errors"] == []
              assert network["http_404"] == [] and network["responses_ge_400"] == []
              assert network["request_failed"] == []
          resources = json.loads((evidence / "public-all-resources-http.json").read_text())
          observed = sum(1 for result in resources["results"] for attempt in result["attempts"] if attempt.get("status") == 404)
          assert resources["passed"] is True
          assert resources["expected_resource_count"] == resources["checked_resource_count"]
          assert resources["failed_resource_count"] == 0 and resources["failed_resources"] == []
          assert resources["terrain_lod_tile_count"] == 6742
          assert resources["http_404_count"] == resources["observed_attempt_http_404_count"] == observed == 0
          assert resources["completed_before_deadline"] is True
          inventory = json.loads((evidence / "evidence-inventory.json").read_text())
          assert inventory["source_commit"] == os.environ["GITHUB_SHA"]
          assert inventory["artifact_name"] == f"guilin-v072-rich-terrain-seasonal-rivers-evidence-{os.environ['GITHUB_RUN_ID']}"
          assert inventory["file_count"] > 0
          print("FINAL_REPORT_GATES_OK")
          PY
          remote_sha="$(git ls-remote --exit-code origin "refs/heads/${EXPECTED_BRANCH}" | awk '{print $1}')"
          test "${remote_sha}" = "${GITHUB_SHA}"
          pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${EXPECTED_PR}")"
          PR_JSON="${pr_json}" python - <<'PY'
          import json, os
          pr = json.loads(os.environ["PR_JSON"])
          assert pr["state"] == "open" and pr["draft"] is True
          assert pr["merged"] is False and pr["merged_at"] is None
          assert pr["head"]["ref"] == os.environ["EXPECTED_BRANCH"]
          assert pr["head"]["sha"] == os.environ["GITHUB_SHA"]
          assert pr["base"]["ref"] == "main"
          PY
          git fetch --no-tags origin refs/heads/gh-pages:refs/remotes/origin/gh-pages
          test "$(git rev-parse refs/remotes/origin/gh-pages)" = "${PAGES_COMMIT}"
          git merge-base --is-ancestor "${{ steps.pages_before.outputs.commit }}" "${PAGES_COMMIT}"
          echo "Final public QA passed for source ${GITHUB_SHA}, Pages ${PAGES_COMMIT}; PR #${EXPECTED_PR} remains Draft."
