          print("RIVER_SERIALIZED_V2_QA_OK", qa["display_run_count"])
          PY
          cp dist/data/river_drape_runtime.json "${EVIDENCE_DIR}/river_drape_runtime.json"
          cp dist/data/river_drape_qa.json "${EVIDENCE_DIR}/river_drape_qa.json"

      - name: Install pinned browser runtime and verify Traditional Chinese font
        id: browser_dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk fontconfig
          fc-cache -f
          font_family="$(fc-match -f '%{family}\n' 'Noto Sans CJK TC' | head -n 1)"
          printf '%s\n' "${font_family}" | grep -F 'Noto Sans CJK'
          FONT_FAMILY="${font_family}" python - <<'PY'
          import json, os
          from pathlib import Path
          family = os.environ["FONT_FAMILY"]
          assert "Noto Sans CJK" in family
          out = Path(os.environ["EVIDENCE_DIR"]) / "font-receipt.json"
          out.write_text(json.dumps({
              "schema": "guilin-v072-font-receipt/v1",
              "requested_family": "Noto Sans CJK TC",
              "matched_family": family,
              "passed": True,
          }, ensure_ascii=False, indent=2) + "\n")
          PY
          npm install --no-save --ignore-scripts \
            playwright@1.51.1 \
            three@0.170.0 \
            proj4@2.11.0
          npx playwright install --with-deps chromium
          node - <<'JS'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const version = name => JSON.parse(fs.readFileSync(`node_modules/${name}/package.json`, 'utf8')).version;
          assert.equal(version('playwright'), '1.51.1');
          assert.equal(version('three'), '0.170.0');
          assert.equal(version('proj4'), '2.11.0');
          JS

      - name: Assemble same-origin viewer and checksum pinned vendor modules
        id: assemble
        shell: bash
        run: |
          set -euo pipefail
          install -m 0644 "${PROJECT_DIR}/web/index.html" dist/index.html
          install -m 0644 "${PROJECT_DIR}/web/app.js" dist/app.js
          install -m 0644 "${PROJECT_DIR}/web/styles.css" dist/styles.css
          mkdir -p dist/vendor
          install -m 0644 node_modules/three/build/three.module.js dist/vendor/three.module.js
          install -m 0644 node_modules/three/examples/jsm/controls/OrbitControls.js dist/vendor/OrbitControls.js
          install -m 0644 node_modules/proj4/dist/proj4.js dist/vendor/proj4.js
          printf '%s  %s\n' \
            ce1fa418de16a19495a9f72495580e3015d7745c296d3ce0485897f902ddedfb dist/vendor/three.module.js \
            80efaadea4f8a636a65fb0bd08bfef62f3d93a0bb94e2e7500f23176c5c07f4e dist/vendor/OrbitControls.js \
            4975fbf411fac1842c5b91d362d323d3f01ca0cb52385a2ea219790ffaa20a80 dist/vendor/proj4.js \
