                  "penetration_minimum_m": min(grounding["indexed_vertex_clearance_penetration_minimum_m"], grounding["face_probe_clearance_penetration_minimum_m"]),
                  "boundary_hausdorff_m": final["terrain_expected_to_serialized_boundary_hausdorff_m"],
