      - name: Freeze exact publish tree and exhaustive public resource inventory
        id: release_inventory
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, re
          from pathlib import Path

          dist = Path("dist")
          evidence = Path(os.environ["EVIDENCE_DIR"])
          files = sorted(path for path in dist.rglob("*") if path.is_file())
          assert files
          paths = [path.relative_to(dist).as_posix() for path in files]
          assert len(paths) == len(set(paths))
          assert not any(path.startswith("/") or ".." in Path(path).parts for path in paths)
          tile_paths = [path for path in paths if re.fullmatch(r"data/terrain_lod/[^/]+/r\d{3}_c\d{3}\.tile\.gz", path)]
          assert len(tile_paths) == 6742
          required = {
              "index.html", "app.js", "styles.css", "deployment_receipt.json",
              "vendor/three.module.js", "vendor/OrbitControls.js", "vendor/proj4.js",
              "data/terrain_manifest.json", "data/terrain_lod_manifest.json", "data/terrain_lod_qa.json",
              "data/terrain_height_u16.bin", "data/terrain_texture.webp", "data/terrain_normal.png",
              "data/terrain_roughness.webp", "data/terrain_karst_detail.webp",
              "data/osm_hydrology.geojson", "data/river_drape_runtime.json", "data/river_drape_qa.json",
          }
          assert required <= set(paths)
          resources = []
          for path in files:
              data = path.read_bytes()
              assert data
              resources.append({
                  "path": path.relative_to(dist).as_posix(),
                  "bytes": len(data),
                  "sha256": hashlib.sha256(data).hexdigest(),
              })
          inventory = {
              "schema": "guilin-v072-publish-inventory/v1",
              "source_commit": os.environ["GITHUB_SHA"],
              "destination_dir": os.environ["DESTINATION_DIR"],
              "resource_count": len(resources),
              "terrain_lod_tile_count": len(tile_paths),
              "resources": resources,
          }
          evidence.mkdir(parents=True, exist_ok=True)
          (evidence / "release-inventory.json").write_text(json.dumps(inventory, indent=2) + "\n")
          print("RELEASE_INVENTORY_OK", len(resources), len(tile_paths))
          PY

      - name: Run local Chromium interaction and visual evidence QA
        id: local_browser
        continue-on-error: true
        timeout-minutes: 100
        shell: bash
        run: |
          set -euo pipefail
          local_evidence="${EVIDENCE_DIR}/local"
          mkdir -p "${local_evidence}"
          python -m http.server 8000 --bind 127.0.0.1 --directory dist \
            >"${local_evidence}/http-server.log" 2>&1 &
          server_pid=$!
          cleanup() {
            kill "${server_pid}" 2>/dev/null || true
            wait "${server_pid}" 2>/dev/null || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error --max-time 2 http://127.0.0.1:8000/ >/dev/null; then
              break
            fi
            if [ "${attempt}" -eq 60 ]; then
              echo 'Local server failed to become ready' >&2
              exit 1
            fi
            sleep 1
          done
          set +e
          EVIDENCE_DIR="${local_evidence}" \
          XIAOGUI_BASE_URL="http://127.0.0.1:8000/" \
          BROWSER_MODE="local" \
          HOST_DEADLINE_MS="4500000" \
            timeout --signal=TERM --kill-after=5m 90m \
            node "${PROJECT_DIR}/browser_smoke.mjs" \
            >"${local_evidence}/browser-smoke.log" 2>&1
          browser_status=$?
          set -e
          BROWSER_STATUS="${browser_status}" python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["EVIDENCE_DIR"]) / "local"
          status = int(os.environ["BROWSER_STATUS"])
          receipt = {
              "schema": "guilin-v072-browser-process-receipt/v1",
              "mode": "local",
              "exit_code": status,
              "node_host_deadline_ms": 4_500_000,
              "shell_timeout_minutes": 90,
              "step_timeout_minutes": 100,
              "evidence_flush_margin_minutes": 15,
          }
          (root / "process-receipt.json").write_text(json.dumps(receipt, indent=2) + "\n")
          required = ["browser-qa-report.json", "diagnostics.json", "browser-console.json", "browser-network.json"]
          missing = [name for name in required if not (root / name).is_file()]
          if missing:
              raise AssertionError(f"local browser failed to persist required evidence: {missing}")
          report = json.loads((root / "browser-qa-report.json").read_text())
          diagnostics = json.loads((root / "diagnostics.json").read_text())
          console = json.loads((root / "browser-console.json").read_text())
          network = json.loads((root / "browser-network.json").read_text())
          assert status == 0, receipt
          assert report["schema"] == "guilin-v072-browser-qa-report/v3" and report["passed"] is True
          assert report["browser_mode"] == "local"
          assert diagnostics["passed"] is True and diagnostics["fatal_error"] is None
          assert report["screenshot_count"] >= 80
          assert console["errors"] == [] and console["page_errors"] == []
          assert network["http_404"] == [] and network["responses_ge_400"] == []
          assert network["request_failed"] == []
          PY

      - name: Recheck release prerequisites immediately before Pages publication
