name: Guilin v0.7.2 rich terrain and seasonal river ribbons

on:
  push:
    branches:
      - project/guilin-v072-rich-terrain-seasonal-rivers
    paths:
      - .github/workflows/guilin-v072-rich-terrain-seasonal-rivers.yml
      - projects/guilin-v072-rich-terrain-seasonal-rivers/**
      - projects/guilin-v070-raw-mosaic-aoi-draw/build_raw_mosaic.py
      - canonical/guilin-dem-12_5m-core/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: guilin-v072-rich-terrain-seasonal-rivers
  cancel-in-progress: true

jobs:
  build-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PROJECT_DIR: projects/guilin-v072-rich-terrain-seasonal-rivers
      MOSAIC_PROJECT: projects/guilin-v070-raw-mosaic-aoi-draw
      SOURCE_DIR: canonical/guilin-dem-12_5m-core/data/raw/asf
      SOURCE_MANIFEST: canonical/guilin-dem-12_5m-core/catalog/source_manifest.json
    steps:
      - name: Checkout without automatic LFS smudge
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Pull the 12 canonical DEM objects
        shell: bash
        run: |
          git lfs install --local
          git lfs pull --include="${SOURCE_DIR}/*.dem.tif" --exclude=""
          test "$(find "${SOURCE_DIR}" -maxdepth 1 -type f -name '*.dem.tif' | wc -l)" -eq 12

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pillow rasterio pyproj

      - name: Rebuild raw mosaic and rich terrain assets
        run: |
          rm -rf "${PROJECT_DIR}/derived" dist
          python "${MOSAIC_PROJECT}/build_raw_mosaic.py" \
            --source-dir "${SOURCE_DIR}" \
            --source-manifest "${SOURCE_MANIFEST}" \
            --output-dir "${PROJECT_DIR}/derived/raw" \
            --web-data-dir "${PROJECT_DIR}/derived/selection-data" \
            --preview-max-width 2048
          mkdir -p dist/data
          python "${PROJECT_DIR}/build_terrain3d.py" \
            --mosaic "${PROJECT_DIR}/derived/raw/guilin_raw_union_12_5m.tif" \
            --output-dir dist/data \
            --height-max-width 1024 \
            --texture-max-width 2560

      - name: Fetch OSM hydrology with width metadata
        run: |
          python "${PROJECT_DIR}/fetch_osm_hydrology.py" \
            --terrain-manifest dist/data/terrain_manifest.json \
            --output dist/data/osm_hydrology.geojson

      - name: Assemble web viewer
        run: |
          cp "${PROJECT_DIR}/web/index.html" dist/index.html
          cp "${PROJECT_DIR}/web/app.js" dist/app.js
          cp "${PROJECT_DIR}/web/styles.css" dist/styles.css

      - name: Browser smoke test and visual evidence
        run: |
          npm install --no-save playwright@1.51.1
          npx playwright install --with-deps chromium
          python -m http.server 8000 --directory dist >/tmp/guilin-v072-http.log 2>&1 &
          server_pid=$!
          trap 'kill ${server_pid} || true' EXIT
          node "${PROJECT_DIR}/browser_smoke.mjs"

      - name: Upload evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: guilin-v072-rich-terrain-seasonal-rivers-evidence
          path: |
            dist/data/terrain_manifest.json
            dist/data/osm_hydrology.geojson
            dist/evidence/
          if-no-files-found: error
          retention-days: 90

      - name: Publish v0.7.2 viewer to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
          destination_dir: guilin-v072-terrain-rivers
          keep_files: true
          force_orphan: false
          commit_message: "Publish Guilin v0.7.2 rich terrain and seasonal rivers from ${{ github.sha }}"

      - name: Write job summary
        run: |
          {
            echo '## Xiaogui Guilin v0.7.2'
            echo
            echo '- Online: https://haihao0307.github.io/guilin-dem-pipeline/guilin-v072-terrain-rivers/'
            echo '- Source: 12 new 12.5 m DEM files'
            echo '- Vertical scale: 1.00x locked'
            echo '- Terrain: richer satellite color + higher-resolution normal/roughness detail'
            echo '- Hydrology: ground-draped ribbon meshes with width, depth, color and four seasonal presets'
            echo '- Centerlines: immutable OSM coordinates'
          } >> "$GITHUB_STEP_SUMMARY"
