name: Weather Mother Full Restart Handoff V110 V2
on:
  push:
    branches:
      - gh-pages
    paths:
      - weather-mother/restart-v110/build.py
      - weather-mother/restart-v110/build_release.py
      - weather-mother/restart-v110/verify_public.py
      - .github/workflows/weather-mother-full-restart-handoff-v110-v2.yml
permissions:
  contents: write
concurrency:
  group: weather-mother-full-restart-handoff-v110-v2
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          sparse-checkout: |
            weather-mother
            .github/workflows
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and verify the clean restart archive
        run: |
          python -m py_compile weather-mother/restart-v110/build.py weather-mother/restart-v110/build_release.py weather-mother/restart-v110/verify_public.py
          python weather-mother/restart-v110/build_release.py _weather_restart_stage
          unzip -t _weather_restart_stage/Weather_Mother_Full_Restart_Handoff_2026-09-02_V1.1.0.zip
          rm -rf _weather_restart_extract
          mkdir _weather_restart_extract
          unzip -q _weather_restart_stage/Weather_Mother_Full_Restart_Handoff_2026-09-02_V1.1.0.zip -d _weather_restart_extract
          for f in engine.js field-worker.js motion.js optics.js; do node --check "_weather_restart_extract/Weather_Mother_Full_Restart_Handoff_2026-09-02_V1.1.0/$f"; done
      - name: Publish the package and preliminary receipt
        run: |
          mkdir -p weather-mother/handoffs
          cp _weather_restart_stage/Weather_Mother_Full_Restart_Handoff_2026-09-02_V1.1.0.zip weather-mother/handoffs/
          cp _weather_restart_stage/Weather_Mother_Full_Restart_Handoff_2026-09-02_V1.1.0.receipt.json weather-mother/handoffs/
          git config user.name 'Weather Mother restart handoff'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add weather-mother/handoffs/Weather_Mother_Full_Restart_Handoff_2026-09-02_V1.1.0.zip weather-mother/handoffs/Weather_Mother_Full_Restart_Handoff_2026-09-02_V1.1.0.receipt.json
          git commit -m 'release(weather-mother): publish full restart handoff V1.1.0'
          for attempt in 1 2 3; do
            git fetch origin gh-pages
            git rebase origin/gh-pages
            if git push origin HEAD:gh-pages; then break; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 3
          done
          echo "PACKAGE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Verify the public archive and write restart pointers
        run: |
          python weather-mother/restart-v110/verify_public.py weather-mother/handoffs/Weather_Mother_Full_Restart_Handoff_2026-09-02_V1.1.0.receipt.json weather-mother/HANDOFF.json weather-mother/RESTART_START_HERE.md
          git add weather-mother/handoffs/Weather_Mother_Full_Restart_Handoff_2026-09-02_V1.1.0.receipt.json weather-mother/HANDOFF.json weather-mother/RESTART_START_HERE.md
          git commit -m 'test(weather-mother): record public restart ZIP and exact publication commit'
          git fetch origin gh-pages
          git rebase origin/gh-pages
          git push origin HEAD:gh-pages
          echo "FINAL_HANDOFF_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Weather-Mother-Full-Restart-Handoff-V1.1.0
          retention-days: 30
          path: |
            _weather_restart_stage/Weather_Mother_Full_Restart_Handoff_2026-09-02_V1.1.0.zip
            _weather_restart_stage/Weather_Mother_Full_Restart_Handoff_2026-09-02_V1.1.0.receipt.json
      - name: Summary
        if: always()
        run: |
          echo '## Weather Mother full restart handoff' >> "$GITHUB_STEP_SUMMARY"
          echo 'One verified runtime, current state, policy snapshot and next-window instructions. No images, old runtime copies or other Mother assets.' >> "$GITHUB_STEP_SUMMARY"
          if [ -f _weather_restart_stage/Weather_Mother_Full_Restart_Handoff_2026-09-02_V1.1.0.receipt.json ]; then cat _weather_restart_stage/Weather_Mother_Full_Restart_Handoff_2026-09-02_V1.1.0.receipt.json >> "$GITHUB_STEP_SUMMARY"; fi
