name: Guilin v0.7 raw 12.5m mosaic and AOI drawing page

on:
  push:
    branches:
      - project/guilin-v070-raw-mosaic-aoi-draw
    paths:
      - .github/workflows/guilin-v070-raw-mosaic-aoi-draw.yml
      - projects/guilin-v070-raw-mosaic-aoi-draw/**
      - canonical/guilin-dem-12_5m-core/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: guilin-v070-raw-mosaic-aoi-draw
  cancel-in-progress: false

jobs:
  build-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PROJECT_DIR: projects/guilin-v070-raw-mosaic-aoi-draw
      SOURCE_DIR: canonical/guilin-dem-12_5m-core/data/raw/asf
      SOURCE_MANIFEST: canonical/guilin-dem-12_5m-core/catalog/source_manifest.json
      RELEASE_TAG: guilin-v070-raw-mosaic-v001
    steps:
      - name: Checkout project branch without automatic LFS smudge
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Pull only the 12 canonical DEM LFS objects
        shell: bash
        run: |
          git lfs install --local
          git lfs pull --include="${SOURCE_DIR}/*.dem.tif" --exclude=""
          count=$(find "${SOURCE_DIR}" -maxdepth 1 -type f -name '*.dem.tif' | wc -l)
          test "$count" -eq 12

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install geospatial build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pillow rasterio pyproj

      - name: Build the untrimmed raw union mosaic and web preview
        run: |
          rm -rf "${PROJECT_DIR}/derived" dist
          python "${PROJECT_DIR}/build_raw_mosaic.py" \
            --source-dir "${SOURCE_DIR}" \
            --source-manifest "${SOURCE_MANIFEST}" \
            --output-dir "${PROJECT_DIR}/derived" \
            --web-data-dir "dist/data" \
            --preview-max-width 8192
          cp "${PROJECT_DIR}/web/index.html" dist/index.html
          cp "${PROJECT_DIR}/web/app.js" dist/app.js
          cp "${PROJECT_DIR}/web/styles.css" dist/styles.css
          cp "${PROJECT_DIR}/derived/mosaic_qa.json" dist/data/mosaic_qa.json

      - name: Browser smoke test and visual evidence
        shell: bash
        run: |
          npm install --no-save playwright@1.51.1
          npx playwright install --with-deps chromium
          python -m http.server 8000 --directory dist >/tmp/guilin-v070-http.log 2>&1 &
          server_pid=$!
          trap 'kill ${server_pid} || true' EXIT
          node "${PROJECT_DIR}/browser_smoke.mjs"

      - name: Upload QA and browser evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: guilin-v070-raw-mosaic-evidence
          path: |
            dist/data/mosaic_manifest.json
            dist/data/mosaic_qa.json
            dist/evidence/
          if-no-files-found: error
          retention-days: 90

      - name: Publish full raw mosaic as GitHub pre-release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" --target "${GITHUB_SHA}" --title "Guilin v0.7 raw 12.5m union mosaic" --prerelease
          else
            gh release create "${RELEASE_TAG}" --target "${GITHUB_SHA}" --title "Guilin v0.7 raw 12.5m union mosaic" --notes "Untrimmed first-valid union of the 12 new 12.5 m DEM sources. Natural protruding edges and NoData gaps are preserved. Use the online selection page to draw the next crop AOI." --prerelease
          fi
          gh release upload "${RELEASE_TAG}" \
            "${PROJECT_DIR}/derived/guilin_raw_union_12_5m.tif#guilin_raw_union_12_5m.tif" \
            "${PROJECT_DIR}/derived/mosaic_qa.json#mosaic_qa.json" \
            "dist/data/mosaic_manifest.json#mosaic_manifest.json" \
            "dist/evidence/guilin-v070-raw-mosaic-selection.png#guilin-v070-raw-mosaic-selection.png" \
            "dist/evidence/browser-console.json#browser-console.json" \
            --clobber

      - name: Publish AOI drawing page to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
          destination_dir: guilin-v070-selection
          keep_files: true
          force_orphan: false
          commit_message: "Publish Guilin v0.7 raw mosaic AOI page from ${{ github.sha }}"

      - name: Write job summary
        run: |
          {
            echo '## Guilin v0.7 raw mosaic selection page'
            echo
            echo '- Online: https://haihao0307.github.io/guilin-dem-pipeline/guilin-v070-selection/'
            echo '- Release: https://github.com/haihao0307/guilin-dem-pipeline/releases/tag/guilin-v070-raw-mosaic-v001'
            echo '- Source elevation unchanged; no crop; no gap fill.'
            echo '- Old four-core runtime is not loaded.'
          } >> "$GITHUB_STEP_SUMMARY"
