name: Verify visible cache invalidation witnesses only
on:
  push:
    branches: ['qa/kcc-cache-visible-invalidation-20261022']
permissions:
  contents: read
jobs:
  visible-invalidation:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            kaopu-geography-workbench/kowloon-building-mother-r01
            kaopu-geography-workbench/hk-three-buildings-r01
      - name: Install pinned supported browser
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Start isolated server
        run: python -m http.server 8765 >/tmp/server.log 2>&1 &
      - name: Six nonempty exact invalidations against frozen runtime
        run: timeout 360s python -u kaopu-geography-workbench/kowloon-building-mother-r01/tests/floor-cache-visible-invalidation.py --output kaopu-geography-workbench/kowloon-building-mother-r01/evidence/cache-visible-invalidation
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: cache-visible-invalidation-${{ github.sha }}
          path: kaopu-geography-workbench/kowloon-building-mother-r01/evidence/cache-visible-invalidation
          retention-days: 1
