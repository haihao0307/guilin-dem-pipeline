name: Knit material R04 verification
on:
  push:
    branches: [feature/knit-material-r04-20261110]
    paths:
      - kaopu-fabric-workbench/knit-material-r04/**
      - .github/workflows/knit-material-r04.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: knit-material-r04
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            kaopu-fabric-workbench/knit-material-r04
            kaopu-fabric-workbench/knit-distance-r03
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build standalone workbench
        run: |
          python kaopu-fabric-workbench/knit-material-r04/build.py
          node --check kaopu-fabric-workbench/knit-material-r04/app.js
      - name: Install browser
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers xvfb xauth
          mkdir -p /tmp/knit-r04
          cd /tmp/knit-r04
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium
      - name: Actual browser tests
        run: |
          SITE="$GITHUB_WORKSPACE/kaopu-fabric-workbench/knit-material-r04"
          python -m http.server 8925 --bind 127.0.0.1 >/tmp/knit-r04-http.log 2>&1 &
          if test -f "$SITE/PUBLIC_URL.txt"; then
            export QA_URL="$(cat "$SITE/PUBLIC_URL.txt")"
            cp "$SITE/qa-public.mjs" /tmp/knit-r04/qa.mjs
          else
            cp "$SITE/qa.mjs" /tmp/knit-r04/qa.mjs
          fi
          SITE_DIR="$SITE" xvfb-run -a node /tmp/knit-r04/qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: knit-material-r04
          path: kaopu-fabric-workbench/knit-material-r04
          retention-days: 7
      - name: Preserve actual result without changing main
        if: always()
        run: |
          git config user.name 'Knit runtime verifier'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A kaopu-fabric-workbench/knit-material-r04
          for f in QA.json PUBLIC_QA.json; do
            if test -f "kaopu-fabric-workbench/knit-material-r04/evidence/$f"; then git add -f "kaopu-fabric-workbench/knit-material-r04/evidence/$f"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'Save R04 standalone build and real browser evidence [skip ci]'
            git push origin HEAD:feature/knit-material-r04-20261110
          fi
