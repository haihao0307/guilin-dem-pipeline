name: Apply Blue Coral A04 Projected Envelope

on:
  push:
    branches: [work/coral-blue-a04-hdf-exact-20260923]
    paths:
      - .github/workflows/coral-blue-a04-apply-projected-envelope.yml

permissions:
  contents: write

concurrency:
  group: coral-blue-a04-apply-projected-envelope
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Replace the heavy raster audit with the exact projected-envelope audit
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('apps/coral-restart-20260923/blue-coral-a04-hdf')

          workbench_path = root / 'runtime/workbench.mjs'
          workbench = workbench_path.read_text(encoding='utf-8')
          replacements = [
              ("import { runSameCameraSilhouetteAudit } from './silhouette-audit.mjs';",
               "import { runSameCameraProjectedEnvelopeAudit } from './projected-envelope-audit.mjs';"),
              ('lastSilhouetteAudit', 'lastProjectedEnvelopeAudit'),
              ('runSameCameraSilhouetteAudit', 'runSameCameraProjectedEnvelopeAudit'),
              ('runSilhouetteAudit', 'runProjectedEnvelopeAudit'),
              ('silhouetteAudit', 'projectedEnvelopeAudit'),
              ('__CORAL_SILHOUETTE__', '__CORAL_PROJECTED_ENVELOPE__'),
              ('四视角同相机轮廓核验', '四视角同相机投影轮廓核验'),
          ]
          for before, after in replacements:
              count = workbench.count(before)
              assert count > 0, (before, count)
              workbench = workbench.replace(before, after)
          assert 'silhouette-audit.mjs' not in workbench
          assert 'runSameCameraSilhouetteAudit' not in workbench
          assert 'runSilhouetteAudit' not in workbench
          assert 'silhouetteAudit' not in workbench
          assert "from './projected-envelope-audit.mjs'" in workbench
          assert 'runProjectedEnvelopeAudit' in workbench
          assert 'projectedEnvelopeAudit' in workbench
          workbench_path.write_text(workbench, encoding='utf-8')

          template_path = root / 'runtime/index.template.html'
          template = template_path.read_text(encoding='utf-8')
          before = '<button id="runSilhouetteAudit">四视角轮廓核验</button>'
          after = '<button id="runProjectedEnvelopeAudit">四视角投影轮廓核验</button>'
          assert template.count(before) == 1, template.count(before)
          template = template.replace(before, after)
          assert 'runSilhouetteAudit' not in template
          template_path.write_text(template, encoding='utf-8')

          qa_path = root / 'public-qa.mjs'
          qa = qa_path.read_text(encoding='utf-8')
          qa_replacements = [
              ('runSilhouetteAudit', 'runProjectedEnvelopeAudit'),
              ('silhouetteAudit', 'projectedEnvelopeAudit'),
              ('silhouette', 'projectedEnvelope'),
          ]
          for before, after in qa_replacements:
              count = qa.count(before)
              assert count > 0, (before, count)
              qa = qa.replace(before, after)
          assert 'runSilhouetteAudit' not in qa
          assert 'silhouetteAudit' not in qa
          assert 'const projectedEnvelope' in qa
          assert 'runProjectedEnvelopeAudit' in qa
          assert 'projectedEnvelopeAudit' in qa
          qa_path.write_text(qa, encoding='utf-8')
          PY

      - name: Remove the superseded raster audit module
        run: |
          test -f apps/coral-restart-20260923/blue-coral-a04-hdf/runtime/projected-envelope-audit.mjs
          git rm -f apps/coral-restart-20260923/blue-coral-a04-hdf/runtime/silhouette-audit.mjs

      - name: Commit the exact projected-envelope runtime wiring
        run: |
          git config user.name 'Coral Mother Build'
          git config user.email 'coral-mother@users.noreply.github.com'
          git add \
            apps/coral-restart-20260923/blue-coral-a04-hdf/runtime/workbench.mjs \
            apps/coral-restart-20260923/blue-coral-a04-hdf/runtime/index.template.html \
            apps/coral-restart-20260923/blue-coral-a04-hdf/public-qa.mjs
          git commit -m 'coral: wire exact four-view projected-envelope audit [skip ci]'
          git push origin HEAD:work/coral-blue-a04-hdf-exact-20260923
