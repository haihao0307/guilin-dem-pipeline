name: 88 authored function field QA
on:
  push:
    branches: ['qa/88-native-field-r03-20261021']
    paths:
      - 'kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01/a4-to88-native-field-r03/**'
      - '.github/workflows/88-native-field-r03-qa.yml'
permissions:
  contents: read
concurrency:
  group: 88-native-field-r03-${{ github.ref }}
  cancel-in-progress: false
jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01/a4-to88-native-field-r03
      - name: CPU geometry and provenance boundaries
        run: |
          set -o pipefail
          mkdir -p kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01/a4-to88-native-field-r03/evidence
          node --test kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01/a4-to88-native-field-r03/tests/*.test.mjs | tee kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01/a4-to88-native-field-r03/evidence/cpu-results.log
      - name: Install pinned official browser test packages
        run: |
          python -m pip install playwright==1.57.0 Pillow==12.0.0
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Direct field GPU parity and actual browser lifecycle
        run: |
          python -m http.server 8765 >/tmp/train-field-http.log 2>&1 &
          python kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01/a4-to88-native-field-r03/tests/browser.py --url http://127.0.0.1:8765/kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01/a4-to88-native-field-r03/index.html --output kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01/a4-to88-native-field-r03/evidence
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: 88-native-field-r03-${{ github.sha }}
          path: kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01/a4-to88-native-field-r03/evidence
          if-no-files-found: warn
          retention-days: 1

