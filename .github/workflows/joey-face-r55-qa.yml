name: GNM independent initialization comparison
on:
  push:
    branches: ['qa/joey-face-r55-20261013']
    paths: ['kaopu-unified-human-workbench/joey-observation-r01/gnm-reinitialize-r01/**', '.github/workflows/joey-face-r55-qa.yml']
permissions:
  contents: read
concurrency:
  group: joey-face-r55-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    strategy:
      fail-fast: false
      matrix:
        portrait: [baseline, new]
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            kaopu-unified-human-workbench/joey-observation-r01/gnm-reinitialize-r01
            kaopu-unified-human-workbench/joey-observation-r01/whole-face-fit-r63
            kaopu-unified-human-workbench/joey-observation-r01/appearance-r65
            kaopu-unified-human-workbench/joey-observation-r01/nasal-shape-r64
            kaopu-unified-human-workbench/joey-observation-r01/cheek-continuity-r55
            kaopu-unified-human-workbench/joey-observation-r01/brow-direction-r58
            kaopu-unified-human-workbench/joey-observation-r01/lower-face-relations-r57
            kaopu-unified-human-workbench/joey-observation-r01/appearance-r54
      - name: Install matching official browser package
        timeout-minutes: 3
        run: |
          npm install --prefix "$RUNNER_TEMP/joey-r55" --no-save --ignore-scripts playwright@1.57.0
          echo "NODE_PATH=$RUNNER_TEMP/joey-r55/node_modules" >> "$GITHUB_ENV"
      - name: Verify bounded cosmetics and brow contracts
        run: node kaopu-unified-human-workbench/joey-observation-r01/appearance-r65/test.mjs
      - name: Check original native response bridge syntax
        run: node --check kaopu-unified-human-workbench/joey-observation-r01/gnm-reinitialize-r01/render-native.cjs
      - name: Render native initialization with same appearance
        env:
          PORTRAIT_STATE: ${{ matrix.portrait }}
        run: node kaopu-unified-human-workbench/joey-observation-r01/gnm-reinitialize-r01/render-native.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: joey-reinitialize-${{ matrix.portrait }}-${{ github.sha }}
          path: joey-gnm-reinitialize-${{ matrix.portrait }}/
          retention-days: 7

