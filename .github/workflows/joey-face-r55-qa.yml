name: R23 complete interactive public preview
on:
  push:
    branches: ['qa/joey-face-r55-20261013']
    paths: ['kaopu-unified-human-workbench/joey-observation-r01/interactive-r23/**', '.github/workflows/joey-face-r55-qa.yml']
permissions:
  contents: read
concurrency:
  group: joey-face-r55-${{ github.ref }}
  cancel-in-progress: true
jobs:
  interactive:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            kaopu-unified-human-workbench/joey-observation-r01/interactive-r23
      - name: Install matching official browser package
        timeout-minutes: 3
        run: |
          npm install --prefix "$RUNNER_TEMP/joey-r23" --no-save --ignore-scripts playwright@1.57.0
          echo "NODE_PATH=$RUNNER_TEMP/joey-r23/node_modules" >> "$GITHUB_ENV"
      - name: Start fixed public verification
        run: |
          ROOT=kaopu-unified-human-workbench/joey-observation-r01/interactive-r23
          mkdir -p "$ROOT/evidence"
          nohup node "$ROOT/verify.cjs" > "$ROOT/evidence/run.log" 2>&1 &
          echo $! > "$ROOT/evidence/process.pid"
      - name: Verify first stage
        run: node kaopu-unified-human-workbench/joey-observation-r01/interactive-r23/wait-stage.cjs first
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: joey-r23-first-${{ github.sha }}
          path: kaopu-unified-human-workbench/joey-observation-r01/interactive-r23/evidence/
          retention-days: 14
      - name: Verify controls stage
        run: node kaopu-unified-human-workbench/joey-observation-r01/interactive-r23/wait-stage.cjs controls
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: joey-r23-controls-${{ github.sha }}
          path: kaopu-unified-human-workbench/joey-observation-r01/interactive-r23/evidence/
          retention-days: 14
      - name: Verify camera stage
        run: node kaopu-unified-human-workbench/joey-observation-r01/interactive-r23/wait-stage.cjs camera
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: joey-r23-camera-${{ github.sha }}
          path: kaopu-unified-human-workbench/joey-observation-r01/interactive-r23/evidence/
          retention-days: 14
      - name: Verify complete stage
        run: node kaopu-unified-human-workbench/joey-observation-r01/interactive-r23/wait-stage.cjs complete
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: joey-r23-complete-${{ github.sha }}
          path: kaopu-unified-human-workbench/joey-observation-r01/interactive-r23/evidence/
          retention-days: 14
