name: Native single eye corner control audit
on:
  push:
    branches: ['qa/joey-face-r55-20261013']
    paths: ['kaopu-unified-human-workbench/joey-observation-r01/eye-corner-control-check/**', '.github/workflows/joey-face-r55-qa.yml']
permissions:
  contents: read
concurrency:
  group: joey-face-r55-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            kaopu-unified-human-workbench/joey-observation-r01/eye-corner-control-check
            kaopu-unified-human-workbench/joey-observation-r01/whole-face-fit-r63
            kaopu-unified-human-workbench/joey-observation-r01/appearance-r65
            kaopu-unified-human-workbench/joey-observation-r01/eye-response-r59
      - name: Install matching official browser package
        timeout-minutes: 3
        run: |
          npm install --prefix "$RUNNER_TEMP/joey-r55" --no-save --ignore-scripts playwright@1.57.0
          echo "NODE_PATH=$RUNNER_TEMP/joey-r55/node_modules" >> "$GITHUB_ENV"
      - name: Check isolated control probe syntax
        run: node --check kaopu-unified-human-workbench/joey-observation-r01/eye-corner-control-check/probe.cjs
      - name: Evaluate three states and exact rollback on native engine
        timeout-minutes: 9
        run: node kaopu-unified-human-workbench/joey-observation-r01/eye-corner-control-check/probe.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: joey-eye-corner-${{ github.sha }}
          path: joey-eye-corner-control-check/
          retention-days: 7
