name: Joey R56 compact native crease comparison
on:
  push:
    branches: ['qa/joey-face-r55-20261013']
    paths: ['kaopu-unified-human-workbench/joey-observation-r01/cheek-continuity-r55/**', 'kaopu-unified-human-workbench/joey-observation-r01/native-crease-r56/**', '.github/workflows/joey-face-r55-qa.yml']
permissions:
  contents: read
concurrency:
  group: joey-face-r55-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 19
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            kaopu-unified-human-workbench/joey-observation-r01/cheek-continuity-r55
            kaopu-unified-human-workbench/joey-observation-r01/native-crease-r56
            kaopu-unified-human-workbench/joey-observation-r01/appearance-r54
      - name: Install matching official browser package
        timeout-minutes: 3
        run: |
          npm install --prefix "$RUNNER_TEMP/joey-r55" --no-save --ignore-scripts playwright@1.57.0
          echo "NODE_PATH=$RUNNER_TEMP/joey-r55/node_modules" >> "$GITHUB_ENV"
      - name: Check bounded original GNM direction in complete native engine
        run: |
          node --test kaopu-unified-human-workbench/joey-observation-r01/native-crease-r56/native-guards.test.cjs kaopu-unified-human-workbench/joey-observation-r01/native-crease-r56/local-intersections.test.cjs
          node kaopu-unified-human-workbench/joey-observation-r01/native-crease-r56/local.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: joey-face-r55-${{ github.sha }}
          path: joey-native-local-r56/
          retention-days: 7
