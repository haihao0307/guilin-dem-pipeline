name: R23 complete interactive public preview
on:
  push:
    branches: ['qa/joey-face-r55-20261013']
    paths: ['kaopu-unified-human-workbench/joey-observation-r01/interactive-r23/**', '.github/workflows/joey-face-r55-qa.yml']
permissions:
  contents: read
concurrency:
  group: joey-face-r55-${{ github.ref }}
  cancel-in-progress: true
jobs:
  interactive:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            kaopu-unified-human-workbench/joey-observation-r01/interactive-r23
      - name: Install matching official browser package
        timeout-minutes: 3
        run: |
          npm install --prefix "$RUNNER_TEMP/joey-r23" --no-save --ignore-scripts playwright@1.57.0
          echo "NODE_PATH=$RUNNER_TEMP/joey-r23/node_modules" >> "$GITHUB_ENV"
      - name: Verify fixed public complete interactive portrait
        run: node kaopu-unified-human-workbench/joey-observation-r01/interactive-r23/verify.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: joey-r23-interactive-${{ github.sha }}
          path: kaopu-unified-human-workbench/joey-observation-r01/interactive-r23/evidence/
          retention-days: 14
