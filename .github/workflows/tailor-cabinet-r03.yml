name: Tailor R03 wardrobe validation
on:
  push:
    branches: [feature/tailor-cabinet-r03-garment-surfaces-20261009]
    paths:
      - 'kaopu-tailor-workbench/presets/r03/BUILD_TRIGGER.json'
      - '.github/workflows/tailor-cabinet-r03.yml'
permissions:
  contents: write
concurrency:
  group: tailor-r03-cabinet-validation
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            kaopu-tailor-workbench/presets/r01
            kaopu-tailor-workbench/presets/r02
            kaopu-tailor-workbench/presets/r03
            kaopu-tailor-workbench/garments-r04/vendor
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser dependencies
        run: |
          pip install playwright==1.56.0 Pillow==11.3.0
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Refine only authored garment display surfaces
        run: |
          python kaopu-tailor-workbench/presets/r03/polish_r034.py
          for f in kaopu-tailor-workbench/presets/r03/*.mjs; do node --check "$f"; done
          python - <<'PY'
          import pathlib,json,hashlib,os
          p=pathlib.Path('kaopu-tailor-workbench/presets/r03')
          names=['index.html','style.css','app.mjs','surfaces.mjs','surface-kernel.mjs','garment-surfaces.mjs','anatomical-cloth.mjs','surface-refine.mjs','catalogue.json','mannequin.json','MANNEQUIN_MANIFEST.json','FIT_PROFILE_REPORT.json','README.md']
          d={'schema':'kaopu-tailor-r03-build@1','version':'R03.4','sourceCommit':os.environ['GITHUB_SHA'],'sourceBranch':os.environ['GITHUB_REF_NAME'],'originalBaseline':'a9148f6860b9fa9f892b97456f4601c34ea95e04','originalCount':60,'combinationCount':432,'physicalFitAccepted':False,'files':{n:{'bytes':(p/n).stat().st_size,'sha256':hashlib.sha256((p/n).read_bytes()).hexdigest()} for n in names}}
          (p/'BUILD_MANIFEST.json').write_text(json.dumps(d,indent=2))
          PY
      - name: Actual Chromium interactions and 492 geometry checks
        run: |
          python -m http.server 8765 >/tmp/tailor-r03-server.log 2>&1 &
          python kaopu-tailor-workbench/presets/r03/qa_browser.py
      - name: Retain tested source and browser evidence
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin "$GITHUB_REF_NAME" --depth=1
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git add kaopu-tailor-workbench/presets/r03
          if ! git diff --cached --quiet; then
            git commit -m 'build(tailor-r03): retain R03.4 source and real browser evidence; no physical-fit claim'
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tailor-r034-source-and-browser-evidence
          path: |
            kaopu-tailor-workbench/presets/r03
            kaopu-tailor-workbench/presets/r01
            kaopu-tailor-workbench/garments-r04/vendor
          retention-days: 14
