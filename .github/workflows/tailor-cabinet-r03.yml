name: Tailor R03 wardrobe validation
on:
  push:
    branches: [feature/tailor-cabinet-r03-garment-surfaces-20261009]
    paths:
      - 'kaopu-tailor-workbench/presets/r03/**'
      - '.github/workflows/tailor-cabinet-r03.yml'
permissions:
  contents: write
concurrency:
  group: tailor-r03-cabinet-validation
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            kaopu-tailor-workbench/presets/r01
            kaopu-tailor-workbench/presets/r02
            kaopu-tailor-workbench/presets/r03
            kaopu-tailor-workbench/garments-r04/vendor
            kaopu-tailor-workbench/garments-r04/assets
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: |
          pip install numpy==2.2.6 playwright==1.56.0 Pillow==11.3.0
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Build from exact inherited anatomy and recipes
        env:
          R03_INTAKE: /tmp/tailor-r03-inputs
        run: |
          mkdir -p "$R03_INTAKE"
          git fetch origin 976d315ef8bfd7a7351bbac88cd8c7425b363970 --depth=1
          git show 976d315ef8bfd7a7351bbac88cd8c7425b363970:kaopu-tailor-workbench/r07/continuation/assets/original-anny-rig.json.gz > "$R03_INTAKE/original-anny-rig.json.gz"
          git show HEAD:kaopu-tailor-workbench/garments-r04/assets/body-anny-adult.json > "$R03_INTAKE/body-anny-adult.json"
          python kaopu-tailor-workbench/presets/r03/apply_refinement.py
          python kaopu-tailor-workbench/presets/r03/prepare_assets.py
          python kaopu-tailor-workbench/presets/r03/fit_assets.py
          for f in kaopu-tailor-workbench/presets/r03/*.mjs; do node --check "$f"; done
          python - <<'PY'
          import pathlib,json,hashlib,os
          p=pathlib.Path('kaopu-tailor-workbench/presets/r03')
          names=['index.html','style.css','app.mjs','surfaces.mjs','surface-kernel.mjs','garment-surfaces.mjs','anatomical-cloth.mjs','catalogue.json','mannequin.json','MANNEQUIN_MANIFEST.json','FIT_PROFILE_REPORT.json','README.md']
          d={'schema':'kaopu-tailor-r03-build@1','version':'R03.2','sourceCommit':os.environ['GITHUB_SHA'],'sourceBranch':os.environ['GITHUB_REF_NAME'],'originalBaseline':'a9148f6860b9fa9f892b97456f4601c34ea95e04','originalCount':60,'combinationCount':432,'physicalFitAccepted':False,'files':{n:{'bytes':(p/n).stat().st_size,'sha256':hashlib.sha256((p/n).read_bytes()).hexdigest()} for n in names}}
          (p/'BUILD_MANIFEST.json').write_text(json.dumps(d,indent=2))
          PY
      - name: Retain generated sources without overwriting other branches
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin "$GITHUB_REF_NAME" --depth=1
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git add kaopu-tailor-workbench/presets/r03/*.mjs kaopu-tailor-workbench/presets/r03/README.md kaopu-tailor-workbench/presets/r03/catalogue.json kaopu-tailor-workbench/presets/r03/mannequin.json kaopu-tailor-workbench/presets/r03/MANNEQUIN_MANIFEST.json kaopu-tailor-workbench/presets/r03/FIT_PROFILE_REPORT.json kaopu-tailor-workbench/presets/r03/BUILD_MANIFEST.json
          if ! git diff --cached --quiet; then
            git commit -m 'build(tailor-r03): retain connected fitted clothing and unchanged anatomical mannequin'
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
      - name: Actual Chromium interactions and rendering
        run: |
          python -m http.server 8765 >/tmp/tailor-r03-server.log 2>&1 &
          python kaopu-tailor-workbench/presets/r03/qa_browser.py
      - name: Collect actual source and browser evidence
        if: always()
        run: |
          python - <<'PY'
          import pathlib,shutil
          dst=pathlib.Path('/tmp/tailor-r03-evidence')
          for src in ['kaopu-tailor-workbench/presets/r03','kaopu-tailor-workbench/presets/r01','kaopu-tailor-workbench/garments-r04/vendor']:
              if pathlib.Path(src).exists():shutil.copytree(src,dst/src,dirs_exist_ok=True)
          if pathlib.Path('/tmp/tailor-r03-inputs').exists():shutil.copytree('/tmp/tailor-r03-inputs',dst/'inputs',dirs_exist_ok=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tailor-r03-source-and-browser-evidence
          path: /tmp/tailor-r03-evidence
          retention-days: 14
      - name: Retain candidate test report
        if: always()
        run: |
          if [ -f kaopu-tailor-workbench/presets/r03/BROWSER_REPORT.json ]; then
            git add kaopu-tailor-workbench/presets/r03/BROWSER_REPORT.json
            git diff --cached --quiet || git commit -m 'test(tailor-r03): retain actual browser result, not physical fit certification'
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
