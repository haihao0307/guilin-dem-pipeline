name: Wenzhou Full Score V0.1 public preview QA

on:
  push:
    branches:
      - feature/wenzhou-full-score-multiconductor-v001-20260908
    paths:
      - .github/workflows/wenzhou-full-score-v001-public-qa.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUBLIC_URL: https://haihao0307.github.io/guilin-dem-pipeline/wenzhou/full-score-v001/
      EXPECTED_SCORE_ID: ffb081eaddf6c7034e2e2e252a90c2f934626e37496636e2539a035072e93cfd
      PAGES_COMMIT: f903b04847393ee9a37887c6116ba2a3d69e63da
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Wait for the versioned public page and verify HTTP content
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            if curl --fail --silent --show-error --location "$PUBLIC_URL" --output /tmp/wenzhou-full-score.html \
              && grep -q "$EXPECTED_SCORE_ID" /tmp/wenzhou-full-score.html \
              && grep -q '<title>Wenzhou Full Score V0.1</title>' /tmp/wenzhou-full-score.html; then
              echo "Public page identity verified on attempt $attempt."
              exit 0
            fi
            sleep 5
          done
          echo 'Public page did not expose the expected version and score identity.' >&2
          exit 2

      - name: Install browser driver
        run: python -m pip install selenium==4.35.0

      - name: Open the public page and exercise every conductor option
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          import hashlib
          import json
          import os
          from pathlib import Path
          import time

          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import Select, WebDriverWait

          url = os.environ['PUBLIC_URL']
          expected_score = os.environ['EXPECTED_SCORE_ID']
          options = webdriver.ChromeOptions()
          options.add_argument('--headless=new')
          options.add_argument('--no-sandbox')
          options.add_argument('--disable-dev-shm-usage')
          options.add_argument('--window-size=390,844')
          driver = webdriver.Chrome(options=options)
          errors = []
          selected = []
          screenshot = Path('/tmp/wenzhou-full-score-v001-mobile.png')
          try:
              driver.get(url)
              WebDriverWait(driver, 30).until(lambda d: d.title == 'Wenzhou Full Score V0.1')
              score_text = driver.find_element(By.ID, 'id').text
              if expected_score not in score_text:
                  errors.append('score identity missing from rendered page')
              selector = Select(driver.find_element(By.ID, 'c'))
              if len(selector.options) != 6:
                  errors.append(f'expected 6 conductors, found {len(selector.options)}')
              for index, option in enumerate(selector.options):
                  selector.select_by_index(index)
                  time.sleep(0.08)
                  selected.append({
                      'index': index,
                      'value': selector.first_selected_option.get_attribute('value'),
                      'text': selector.first_selected_option.text,
                  })
              canvases = driver.find_elements(By.TAG_NAME, 'canvas')
              canvas_checks = []
              for index, canvas in enumerate(canvases):
                  data_url = driver.execute_script("return arguments[0].toDataURL('image/png')", canvas)
                  canvas_checks.append({
                      'index': index,
                      'nonEmpty': len(data_url) > 200,
                      'dataUrlSha256': hashlib.sha256(data_url.encode()).hexdigest(),
                  })
              if len(canvases) != 2 or not all(item['nonEmpty'] for item in canvas_checks):
                  errors.append('two non-empty terrain canvases were not rendered')
              driver.save_screenshot(str(screenshot))
          finally:
              driver.quit()

          output = Path('projects/wenzhou/full-score-v001/05_QA/PUBLIC_PREVIEW_QA.json')
          output.parent.mkdir(parents=True, exist_ok=True)
          report = {
              'schema': 'wenzhou-full-score-public-preview-qa/v0.1.0',
              'testedAtUtc': datetime.now(timezone.utc).isoformat(),
              'publicUrl': url,
              'pagesCommit': os.environ['PAGES_COMMIT'],
              'expectedScoreId': expected_score,
              'title': 'Wenzhou Full Score V0.1',
              'viewport': [390, 844],
              'selectedConductors': selected,
              'canvasChecks': canvas_checks,
              'screenshotArtifact': screenshot.name,
              'passed': not errors,
              'errors': errors,
          }
          output.write_text(json.dumps(report, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(report, ensure_ascii=False, indent=2))
          if errors:
              raise SystemExit(2)
          PY

      - name: Commit public browser evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'wenzhou-public-qa-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add projects/wenzhou/full-score-v001/05_QA/PUBLIC_PREVIEW_QA.json
          if git diff --cached --quiet; then
            echo 'Public QA evidence already matches.'
          else
            git commit -m 'qa(wenzhou): record V0.1 public browser proof [skip ci]'
            git push origin HEAD:feature/wenzhou-full-score-multiconductor-v001-20260908
          fi

      - name: Upload public browser evidence
        uses: actions/upload-artifact@v4
        with:
          name: WENZHOU_FULL_SCORE_V001_PUBLIC_PREVIEW_QA
          path: |
            projects/wenzhou/full-score-v001/05_QA/PUBLIC_PREVIEW_QA.json
            /tmp/wenzhou-full-score-v001-mobile.png
            /tmp/wenzhou-full-score.html
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
