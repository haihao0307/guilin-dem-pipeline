name: Coral R06 T05 Continuous Tube

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/coral-r06-t05-continuous-tube.yml
      - tools/coral/coral_r06_t05_build.py
      - tools/coral/coral_r06_t05_browser_qa.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main tools
        uses: actions/checkout@v4
        with:
          ref: main
          path: repo

      - name: Check out GitHub Pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
          path: pages

      - name: Build T05 continuous-tube workbench
        run: python3 repo/tools/coral/coral_r06_t05_build.py pages

      - name: Desktop and mobile browser gate
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet websocket-client
          python3 -m http.server 8769 --directory pages/coral-mother-r06-pocillopora-t05-continuous-tube >/tmp/coral-t05-http.log 2>&1 &
          HTTP_PID=$!
          trap 'kill $HTTP_PID 2>/dev/null || true' EXIT
          python3 repo/tools/coral/coral_r06_t05_browser_qa.py pages/coral-mother-r06-pocillopora-t05-continuous-tube

      - name: Publish T05
        shell: bash
        run: |
          set -euo pipefail
          cd pages
          git config user.name 'Haihao_Nature Grace HK'
          git config user.email 'haihao0307@gmail.com'
          git add coral-mother-r06-pocillopora-t05-continuous-tube/
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'publish(coral): R06 T05 continuous tube growth'
            git pull --rebase origin gh-pages
            git push origin gh-pages
          fi
