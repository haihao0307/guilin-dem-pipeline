name: Weather Mother V1.7.2 payload identity probe
on:
  push:
    branches: [gh-pages]
    paths:
      - '.github/workflows/weather-mother-v072-hash-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,gzip,hashlib,json
          root=Path('weather-mother/studio-v072')
          files=[]
          for p in sorted(root.glob('payload-*.txt')):
              b=p.read_bytes()
              files.append({'file':p.name,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()})
          print(json.dumps(files,indent=2))
          encoded=''.join((root/x['file']).read_text() for x in files)
          print('base64Bytes',len(encoded),'base64SHA256',hashlib.sha256(encoded.encode()).hexdigest())
          try:
              source=gzip.decompress(base64.b64decode(encoded))
              print('sourceBytes',len(source),'sourceSHA256',hashlib.sha256(source).hexdigest())
          except Exception as e:
              print('DECODE_ERROR',repr(e))
          PY
