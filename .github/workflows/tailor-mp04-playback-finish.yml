name: MP04.4 playback recovery public acceptance
on:
  push:
    branches: [fix/tailor-mp04-playback-finish-20261013]
    paths: ['.github/workflows/tailor-mp04-playback-finish.yml','kaopu-tailor-workbench/material-products/r04-recovery/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    outputs:
      url: ${{ steps.publish.outputs.url }}
      source: ${{ steps.publish.outputs.source }}
      public: ${{ steps.publish.outputs.public }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: project
          sparse-checkout: |
            kaopu-tailor-workbench/material-products/r04
            kaopu-tailor-workbench/material-products/r04-recovery
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch the frozen parent without modifying its geometry or physical states
        run: |
          cp -a project/kaopu-tailor-workbench/material-products/r04 runtime
          python project/kaopu-tailor-workbench/material-products/r04-recovery/prepare.py runtime
          node --check runtime/app.mjs
          node --check runtime/motion-transport.mjs
          node --check runtime/qa-case.cjs
          node runtime/unit.mjs
      - name: Save complete source and a new immutable public snapshot
        id: publish
        run: python runtime/_build/publish-snapshot.py runtime project
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mp044-stage
          path: |
            /tmp/MP04_PUBLIC_STAGE.json
            runtime/UNIT_REPORT.json
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: mp044-runtime
          path: runtime
          retention-days: 30
  bytes:
    needs: stage
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Verify all actual public bytes against the frozen source manifest
        env:
          URL: ${{ needs.stage.outputs.url }}
          SOURCE: ${{ needs.stage.outputs.source }}
        run: |
          python - <<'PY'
          import os,json,urllib.request,time,hashlib,concurrent.futures
          base=os.environ['URL'];source=os.environ['SOURCE'];manifest=None
          def read(name):
              with urllib.request.urlopen(base+name,timeout=90) as r:return r.read()
          for attempt in range(85):
              try:
                  manifest=json.loads(read('BUILD_MANIFEST.json'))
                  if manifest.get('sourceCommit')==source:break
              except Exception:pass
              time.sleep(10)
          assert manifest and manifest['sourceCommit']==source and manifest['version']=='MP04.4'
          def check(item):
              n,e=item
              for attempt in range(4):
                  try:
                      b=read(n);assert len(b)==e['bytes'] and hashlib.sha256(b).hexdigest()==e['sha256'],n
                      return {'path':n,**e}
                  except Exception:
                      if attempt==3:raise
                      time.sleep(2)
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:files=list(pool.map(check,manifest['files'].items()))
          json.dump({'passed':True,'sourceCommit':source,'fixedURL':base,'files':files},open('/tmp/PUBLIC_BYTES.json','w'),indent=2)
          print('PUBLIC_BYTES_PASS',source,len(files))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mp044-public-bytes
          path: /tmp/PUBLIC_BYTES.json
          retention-days: 30
  browser:
    needs: [stage,bytes]
    runs-on: ubuntu-latest
    timeout-minutes: 14
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        case: [K04,L04,D01,K04-raise,L04-raise,D01-raise,K04-twist,L04-twist,D01-twist,K04-step,L04-step,D01-step,K01,K02,K03,L01,L02,L03,D02,D03,D04,K04-detail,L04-detail,D01-detail]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mp044-runtime
          path: runtime
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.58.2 && npx playwright install --with-deps chromium
      - name: Actual public browser case with original thresholds and complete frames
        env:
          QA_CASE: ${{ matrix.case }}
          QA_URL: ${{ needs.stage.outputs.url }}
          RUNTIME_SOURCE: ${{ needs.stage.outputs.source }}
        run: node runtime/qa-case.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mp044-public-${{ matrix.case }}
          path: runtime/public-${{ matrix.case }}
          retention-days: 30
  receipt:
    needs: [stage,bytes,browser]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.stage.outputs.source }}
          sparse-checkout: kaopu-tailor-workbench/material-products/r04-4
      - uses: actions/download-artifact@v4
        with:
          pattern: mp044-public-*
          path: /tmp/evidence
      - name: Record verified preview separately from unfinished full-material goals
        env:
          URL: ${{ needs.stage.outputs.url }}
          SOURCE: ${{ needs.stage.outputs.source }}
          PUBLIC: ${{ needs.stage.outputs.public }}
        run: |
          python - <<'PY'
          import pathlib,json,datetime,os
          e=pathlib.Path('/tmp/evidence');reports=[json.loads(p.read_text()) for p in e.rglob('BROWSER_REPORT.json')]
          expected={c+str(i).zfill(2) for c in ['K','L','D'] for i in range(1,5)}|{a+'-'+b for a in ['K04','L04','D01'] for b in ['raise','twist','step','detail']}
          assert len(reports)==24 and {r['case'] for r in reports}==expected and all(r['passed'] for r in reports)
          hashes=json.loads(next(e.rglob('PUBLIC_BYTES.json')).read_text());assert hashes['passed']
          state={'version':'MP04.4','fixedURL':os.environ['URL'],'sourceCommit':os.environ['SOURCE'],'publicCommit':os.environ['PUBLIC'],'publicBrowserVerified':True,'publicBytesVerified':True,'thisRecoveryPreviewVerified':True,'fullUserTaskComplete':False,'remaining':['complete native knit R15 fuzz/distance renderer migration','native denim R12 damaged-fabric force integration','all material/garment combinations','full self-collision and continuous collision','real-device performance certification'],'testedCases':sorted(expected),'originalFailedRun':38356384181,'physicsSourcesAndClipsPreserved':True,'actionMode':'real solved cache with bounded presentation clock; new recipe requires new solve','userAccepted':False,'physicalDeviceTested':False,'workflowRun':os.environ['GITHUB_RUN_ID'],'verifiedAt':datetime.datetime.now(datetime.timezone.utc).isoformat()}
          p=pathlib.Path('kaopu-tailor-workbench/material-products/r04-4');(p/'PUBLIC_DELIVERY.json').write_text(json.dumps(state,ensure_ascii=False,indent=2));(p/'PUBLIC_BROWSER_REPORTS.json').write_text(json.dumps({'state':state,'reports':reports,'publicBytes':hashes},ensure_ascii=False,indent=2))
          (p/'DELIVERY.md').write_text('# MP04.4 接续候选公网验证\n\n'+state['fixedURL']+'?look=K04\n\n本轮新增动作时间轴、继续/半速/定位和动作开始时恢复人体及棚拍；原材料、物理和实算动作保留。24 个独立真实公网测试通过。\n\n本轮候选可用，不等于整个最新面料整合任务已完成：完整 R15 毛羽/距离渲染尚未移植，其他剩余项见 PUBLIC_DELIVERY.json。不是实机帧率认证，也不是全部动态状态零穿模证明。\n')
          print(json.dumps(state,ensure_ascii=False,indent=2))
          PY
      - name: Fast-forward evidence without changing frozen public bytes
        env:
          SOURCE: ${{ needs.stage.outputs.source }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin fix/tailor-mp04-playback-finish-20261013 --depth=1
          test "$(git rev-parse origin/fix/tailor-mp04-playback-finish-20261013)" = "$SOURCE"
          git add -f kaopu-tailor-workbench/material-products/r04-4/PUBLIC_DELIVERY.json kaopu-tailor-workbench/material-products/r04-4/PUBLIC_BROWSER_REPORTS.json kaopu-tailor-workbench/material-products/r04-4/DELIVERY.md
          git commit -m 'docs(mp04.4): save verified public recovery scope and remaining work [skip ci]'
          git push origin HEAD:refs/heads/fix/tailor-mp04-playback-finish-20261013
