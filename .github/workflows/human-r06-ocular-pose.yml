name: R06 independent public eyelid and head pose review
on:
  push:
    branches: [test/human-r06-ocular-pose-20261013]
    paths: ['.github/workflows/human-r06-ocular-pose.yml', 'kaopu-unified-human-workbench/human-integrated-r06/verify-ocular.cjs']
permissions: {contents: read}
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: kaopu-unified-human-workbench/human-integrated-r06
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: node kaopu-unified-human-workbench/human-integrated-r06/verify-ocular.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r06-ocular-pose-${{ github.run_number }}
          path: r06-ocular-evidence/
          retention-days: 14
