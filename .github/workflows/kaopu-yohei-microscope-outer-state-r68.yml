name: KAOPU Yohei Microscope Outer State R68

on:
  workflow_dispatch:
  push:
    paths:
      - 'docs/mother_coordination/kaopu_learning_flywheel_v1/PROBES/run_yohei_microscope_outer_state_r68.mjs'
      - 'docs/mother_coordination/kaopu_learning_flywheel_v1/PROBES/yohei_microscope_outer_state_result_r68.json'
      - '.github/workflows/kaopu-yohei-microscope-outer-state-r68.yml'

jobs:
  outer-state-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run outer-state audit
        run: |
          node docs/mother_coordination/kaopu_learning_flywheel_v1/PROBES/run_yohei_microscope_outer_state_r68.mjs > /tmp/r68.json
      - name: Compare locked result
        run: |
          node --input-type=module -e "import fs from 'node:fs'; import assert from 'node:assert/strict'; const locked=JSON.parse(fs.readFileSync('docs/mother_coordination/kaopu_learning_flywheel_v1/PROBES/yohei_microscope_outer_state_result_r68.json')); const actual=JSON.parse(fs.readFileSync('/tmp/r68.json')); assert.deepStrictEqual(actual, locked);"
