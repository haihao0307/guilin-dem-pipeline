name: Human R03 reference WebGL fallback inspection
on:
  push:
    branches: [test/human-r03-reference-recovery-20261013]
    paths: ['.github/workflows/human-r03-reference-webgl.yml']
permissions: {contents: read}
jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {sparse-checkout: .github}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - name: Explicit fallback inspection; no product changes or external asset import
        run: |
          mkdir -p reference-gl
          cat > reference.cjs <<'JS'
          const fs=require('fs'),{chromium}=require('playwright');
          (async()=>{const b=await chromium.launch({headless:true,args:['--no-sandbox','--use-angle=swiftshader','--enable-unsafe-swiftshader']});const p=await b.newPage({viewport:{width:1600,height:1200},deviceScaleFactor:1});
          const r={url:'https://lo-th.github.io/head/',backend:'explicit navigator.gpu=undefined to exercise built-in WebGL fallback',screens:[],errors:[],failedRequests:[],notPhysicalGPU:true,originalAssetsImported:false};
          await p.addInitScript(()=>Object.defineProperty(navigator,'gpu',{value:undefined,configurable:true}));
          p.on('pageerror',e=>{if(r.errors.length<15)r.errors.push(String(e))});p.on('console',m=>{if(m.type()==='error'&&r.errors.length<15)r.errors.push(m.text().slice(0,7000))});p.on('requestfailed',q=>r.failedRequests.push({url:q.url(),error:q.failure()?.errorText}));
          try{await p.goto(r.url,{waitUntil:'domcontentloaded',timeout:90000});await p.waitForFunction(()=>document.querySelector('canvas'),null,{timeout:90000});await p.waitForTimeout(18000);await p.screenshot({path:'reference-gl/front.png',timeout:90000});r.screens.push('front.png');r.body=await p.locator('body').innerText();
          const c=p.locator('canvas').first(),z=await c.boundingBox();if(z){await p.mouse.move(z.x+z.width*.5,z.y+z.height*.52);await p.mouse.down();await p.mouse.move(z.x+z.width*.57,z.y+z.height*.52,{steps:12});await p.mouse.up();await p.waitForTimeout(1500);await p.screenshot({path:'reference-gl/oblique.png',timeout:90000});r.screens.push('oblique.png');await p.mouse.move(z.x+z.width*.5,z.y+z.height*.5);await p.mouse.wheel(0,-300);await p.waitForTimeout(1500);await p.screenshot({path:'reference-gl/close.png',timeout:90000});r.screens.push('close.png');}
          }catch(e){r.failure=String(e);await p.screenshot({path:'reference-gl/failure.png',timeout:20000}).catch(()=>{})}finally{fs.writeFileSync('reference-gl/report.json',JSON.stringify(r,null,2));await b.close();}})().catch(e=>{console.error(e);process.exitCode=1});
          JS
          node reference.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: human-r03-reference-webgl
          path: reference-gl/
          retention-days: 7
