name: Kowloon actual window material QA
on:
  push:
    branches: ['trial/kowloon-material-quality-r01-20261021']
    paths:
      - 'kaopu-geography-workbench/kowloon-building-mother-r01/material-quality-r01/**'
      - 'kaopu-geography-workbench/kowloon-building-mother-r01/material-quality-r01.html'
      - 'kaopu-geography-workbench/kowloon-building-mother-r01/tests/material-quality*'
      - '.github/workflows/kowloon-material-quality-r01-qa.yml'
  workflow_dispatch:
    inputs:
      suite:
        type: choice
        default: corner
        options: [corner, full]
        description: Focused actual first-image study or complete material and lifecycle regression
permissions:
  contents: read
concurrency:
  group: kowloon-material-quality-${{ github.ref }}
  cancel-in-progress: false
jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            kaopu-geography-workbench/kowloon-building-mother-r01
            kaopu-geography-workbench/hk-three-buildings-r01
      - name: Install pinned browser runner
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: All old and new CPU tests
        id: cpu
        run: node --test kaopu-geography-workbench/kowloon-building-mother-r01/tests/*.test.mjs
      - name: Start same-window corner study with immediate evidence markers
        if: ${{ github.event_name == 'push' || inputs.suite == 'corner' }}
        run: |
          python -m http.server 8765 >/tmp/window-corner-http.log 2>&1 &
          nohup timeout 1200s python -u kaopu-geography-workbench/kowloon-building-mother-r01/tests/material-quality-corner-browser.py --url http://127.0.0.1:8765/kaopu-geography-workbench/kowloon-building-mother-r01/material-quality-r01.html --output kaopu-geography-workbench/kowloon-building-mother-r01/evidence/material-quality-r01/corner >/tmp/window-corner-live.log 2>&1 &
      - name: Wait only for the first actual complete corner image
        if: ${{ github.event_name == 'push' || inputs.suite == 'corner' }}
        run: python kaopu-geography-workbench/kowloon-building-mother-r01/tests/material-quality-wait.py --output kaopu-geography-workbench/kowloon-building-mother-r01/evidence/material-quality-r01/corner --marker first-ready --seconds 500
      - name: Make first image independently downloadable now
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ always() && (github.event_name == 'push' || inputs.suite == 'corner') }}
        with:
          name: material-first-corner-${{ github.sha }}
          path: |
            kaopu-geography-workbench/kowloon-building-mother-r01/evidence/material-quality-r01/corner/window-corner-timber-640aa*.png
            kaopu-geography-workbench/kowloon-building-mother-r01/evidence/material-quality-r01/corner/corner-results.json
            kaopu-geography-workbench/kowloon-building-mother-r01/evidence/material-quality-r01/corner/corner-failure*.png
          if-no-files-found: warn
          retention-days: 1
      - name: Finish the same browser session wood-paint and whole-window comparisons
        if: ${{ !cancelled() && steps.cpu.outcome == 'success' && (github.event_name == 'push' || inputs.suite == 'corner') }}
        run: python kaopu-geography-workbench/kowloon-building-mother-r01/tests/material-quality-wait.py --output kaopu-geography-workbench/kowloon-building-mother-r01/evidence/material-quality-r01/corner --marker done --seconds 850
      - name: Full material and subpixel rendering regression
        if: ${{ inputs.suite == 'full' }}
        run: |
          python -m http.server 8765 >/tmp/gpu-recovery-http.log 2>&1 &
          timeout 900s python -u kaopu-geography-workbench/kowloon-building-mother-r01/tests/material-quality-browser.py --url http://127.0.0.1:8765/kaopu-geography-workbench/kowloon-building-mother-r01/material-quality-r01.html --output kaopu-geography-workbench/kowloon-building-mother-r01/evidence/material-quality-r01
      - name: Actual normal initialization and AA lifecycle
        if: ${{ !cancelled() && steps.cpu.outcome == 'success' && inputs.suite == 'full' }}
        run: timeout 720s python -u kaopu-geography-workbench/kowloon-building-mother-r01/tests/material-quality-lifecycle-browser.py --url http://127.0.0.1:8765/kaopu-geography-workbench/kowloon-building-mother-r01/material-quality-r01.html --output kaopu-geography-workbench/kowloon-building-mother-r01/evidence/material-quality-r01/lifecycle
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: material-quality-r01-${{ github.sha }}
          path: kaopu-geography-workbench/kowloon-building-mother-r01/evidence/material-quality-r01
          if-no-files-found: warn
          retention-days: 1
