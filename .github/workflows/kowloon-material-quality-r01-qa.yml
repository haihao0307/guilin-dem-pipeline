name: Kowloon actual window material QA
on:
  push:
    branches: ['trial/kowloon-material-quality-r01-20261021']
    paths:
      - 'kaopu-geography-workbench/kowloon-building-mother-r01/material-quality-r01/**'
      - 'kaopu-geography-workbench/kowloon-building-mother-r01/material-quality-r01.html'
      - 'kaopu-geography-workbench/kowloon-building-mother-r01/tests/material-quality*'
      - '.github/workflows/kowloon-material-quality-r01-qa.yml'
permissions:
  contents: read
concurrency:
  group: kowloon-material-quality-${{ github.ref }}
  cancel-in-progress: false
jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            kaopu-geography-workbench/kowloon-building-mother-r01
            kaopu-geography-workbench/hk-three-buildings-r01
      - name: Install pinned browser runner
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: All old and new CPU tests
        run: node --experimental-default-type=module --test kaopu-geography-workbench/kowloon-building-mother-r01/tests/*.test.mjs
      - name: Actual material and subpixel tiled rendering
        run: |
          python -m http.server 8765 >/tmp/gpu-recovery-http.log 2>&1 &
          python kaopu-geography-workbench/kowloon-building-mother-r01/tests/material-quality-browser.py --url http://127.0.0.1:8765/kaopu-geography-workbench/kowloon-building-mother-r01/material-quality-r01.html --output kaopu-geography-workbench/kowloon-building-mother-r01/evidence/material-quality-r01
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: material-quality-r01-${{ github.sha }}
          path: kaopu-geography-workbench/kowloon-building-mother-r01/evidence/material-quality-r01
          if-no-files-found: warn
          retention-days: 1
