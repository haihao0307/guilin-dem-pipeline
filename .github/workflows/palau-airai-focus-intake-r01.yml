name: Palau Airai focused evidence intake R01
on:
  push:
    branches: [work/palau-airai-stone-money-world-r01-20260920]
    paths:
      - .github/workflows/palau-airai-focus-intake-r01.yml
      - games/survivor-palau/palau-world/airai-r01/collect_focus_sources.py
      - games/survivor-palau/palau-world/airai-r01/README.md
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: palau-airai-focus-intake-r01
  cancel-in-progress: true
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/palau-airai-stone-money-world-r01-20260920
      - name: Install S-57 and geospatial tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin unzip
          python -m pip install --upgrade requests
      - name: Collect only the Airai / candidate-island AOI
        run: |
          python games/survivor-palau/palau-world/airai-r01/collect_focus_sources.py \
            --output /tmp/palau-airai-focus-r01
      - name: Preserve compact evidence receipts on the production branch
        if: always()
        run: |
          mkdir -p games/survivor-palau/palau-world/airai-r01/evidence
          cp /tmp/palau-airai-focus-r01/FOCUS_SOURCE_RECEIPT.json \
             games/survivor-palau/palau-world/airai-r01/evidence/FOCUS_SOURCE_RECEIPT.json || true
          cp /tmp/palau-airai-focus-r01/noaa_enc/selected_cells.json \
             games/survivor-palau/palau-world/airai-r01/evidence/SELECTED_ENC_CELLS.json || true
          cp /tmp/palau-airai-focus-r01/sentinel2/selected_scenes.json \
             games/survivor-palau/palau-world/airai-r01/evidence/SENTINEL_SCENES.json || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add games/survivor-palau/palau-world/airai-r01/evidence
          git diff --cached --quiet || git commit -m 'data(palau): record Airai focused source receipts'
          git pull --rebase origin work/palau-airai-stone-money-world-r01-20260920
          git push origin HEAD:work/palau-airai-stone-money-world-r01-20260920
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: palau-airai-focus-r01
          path: /tmp/palau-airai-focus-r01/
          if-no-files-found: warn
          retention-days: 30
