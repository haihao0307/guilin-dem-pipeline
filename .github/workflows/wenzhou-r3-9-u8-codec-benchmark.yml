name: Wenzhou R3.9 U8 Evidence Codec Benchmark

on:
  push:
    branches:
      - feature/wenzhou-r3-8-overlay-transform-contract-20260913
    paths:
      - 'tools/r3-9/benchmark_u8_evidence_codec.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Benchmark current WRB and JRC uint8 payloads
        run: |
          set -euo pipefail
          python tools/r3-9/benchmark_u8_evidence_codec.py | tee /tmp/u8-codec-benchmark.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/u8-codec-benchmark.json'))
          assert r['passed'] is True
          assert [x['family'] for x in r['families']] == ['wrb','water']
          print({k:r[k] for k in ['rawBytes','gzipBytes','reduction']})
          for x in r['families']: print({k:x[k] for k in ['family','fileCount','rawBytes','gzipBytes','reduction']})
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wenzhou-r3-9-u8-codec-benchmark-${{ github.sha }}
          path: /tmp/u8-codec-benchmark.json
          if-no-files-found: error
          retention-days: 30
