name: Ocean Mother Coast R011.2 final gate

on:
  push:
    branches:
      - work/ocean-mother-handoff-20260901
    paths:
      - .github/workflows/ocean-mother-coast-r0112-final-gate.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ocean-mother-coast-r0112-final-gate
  cancel-in-progress: false

jobs:
  final-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/ocean-mother-handoff-20260901
          fetch-depth: 1

      - name: Reconstruct and repair candidate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, json, re, zlib

          payload = Path('ocean-mother/coast-r011-payload')
          pieces = [payload / f'part{i:02d}.b64' for i in range(1, 6)]
          assert all(p.is_file() for p in pieces), pieces
          encoded = ''.join(p.read_text('ascii').strip() for p in pieces)
          assert len(encoded) == 32156
          packed = base64.b64decode(encoded, validate=True)
          assert len(packed) == 24115
          assert hashlib.sha256(packed).hexdigest() == 'fa65eb23367bf792f0708f78cada38c89a97063352f745ba3bbb36ba300599ce'
          original = zlib.decompress(packed)
          assert len(original) == 78062
          assert hashlib.sha256(original).hexdigest() == '73ab8cae453fb824774a734fd14f0f7ac98ff66106b4cce9460a2ad12c9b7486'
          text = original.decode('utf-8')

          text = text.replace('0.2.1-coast-r011.1', '0.2.1-coast-r011.2')
          text = text.replace('coast-0.2.1-r011.1-daylight-complete', 'coast-0.2.1-r011.2-daylight-complete')
          text, first = re.subn(r'gl\.COLOR_BUFFER_BIT\s*\|\s*gl\.DEPTH_BUFFER_BIT', 'gl.COLOR_BUFFER_BIT', text)
          text, second = re.subn(r'gl\.DEPTH_BUFFER_BIT\s*\|\s*gl\.COLOR_BUFFER_BIT', 'gl.COLOR_BUFFER_BIT', text)
          assert first + second >= 1

          if not re.search(r'<pre[^>]+id=["\']qaProbe["\']', text, re.I):
              text = text.replace('</body>', '<pre id="qaProbe" hidden></pre></body>', 1)

          reporter = r'''
<script>
(() => {
  const requestedView = () => new URLSearchParams(location.search).get('view') || 'overview';
  function updateProbe() {
    requestAnimationFrame(() => {
      const output = document.getElementById('qaProbe');
      const canvas = document.querySelector('canvas');
      const errorNode = document.getElementById('error');
      const visibleError = !!errorNode && !errorNode.hidden && getComputedStyle(errorNode).display !== 'none' && errorNode.textContent.trim().length > 0;
      let gl = null;
      let glError = 0;
      let visualProbe = {averageLuminance:0,topLuminance:0,nonDarkRatio:0,blueWaterSkyRatio:0,earthSandRockRatio:0,warmFireRatio:0};
      try {
        gl = canvas && canvas.getContext('webgl2');
        if (gl && canvas.width > 1 && canvas.height > 1) {
          const width = canvas.width;
          const height = canvas.height;
          const pixels = new Uint8Array(width * height * 4);
          gl.readPixels(0, 0, width, height, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
          glError = gl.getError();
          const stride = Math.max(1, Math.floor(Math.sqrt((width * height) / 180000)));
          let luminance = 0, topLuminance = 0, topCount = 0, nonDark = 0, blue = 0, earth = 0, warm = 0, count = 0;
          for (let y = 0; y < height; y += stride) {
            for (let x = 0; x < width; x += stride) {
              const index = (y * width + x) * 4;
              const r = pixels[index] / 255;
              const g = pixels[index + 1] / 255;
              const b = pixels[index + 2] / 255;
              const l = .2126 * r + .7152 * g + .0722 * b;
              luminance += l;
              count++;
              if (y > height * .72) { topLuminance += l; topCount++; }
              if (l > .055) nonDark++;
              if (b > r * 1.08 && (b + g) * .5 > .15) blue++;
              if (r > .16 && g > .10 && r > b * 1.10 && r / Math.max(g, .001) < 2.35) earth++;
              if (r > .48 && r > g * 1.18 && g > b * 1.12) warm++;
            }
          }
          visualProbe = {
            averageLuminance: count ? luminance / count : 0,
            topLuminance: topCount ? topLuminance / topCount : 0,
            nonDarkRatio: count ? nonDark / count : 0,
            blueWaterSkyRatio: count ? blue / count : 0,
            earthSandRockRatio: count ? earth / count : 0,
            warmFireRatio: count ? warm / count : 0
          };
        }
      } catch (error) {
        glError = String(error && error.message || error);
      }
      const external = performance.getEntriesByType('resource').filter(entry => {
        try { return new URL(entry.name, location.href).origin !== location.origin; }
        catch { return true; }
      });
      if (output) {
        output.textContent = JSON.stringify({
          version: '0.2.1-coast-r011.2',
          ready: !!gl && !visibleError,
          webgl2: !!gl,
          error: visibleError ? errorNode.textContent.trim() : null,
          glError,
          wallTime: performance.now() / 1000,
          currentView: requestedView(),
          persistentImageAssets: document.images.length,
          externalModels: 0,
          externalCdn: external.length,
          visualProbe
        });
      }
      setTimeout(updateProbe, 450);
    });
  }
  setTimeout(updateProbe, 1200);
})();
</script>
'''
          text = text.replace('</body>', reporter + '</body>', 1)

          lower = text.lower()
          forbidden = ('data:image/', '.png', '.jpg', '.jpeg', '.webp', '.gif', '.hdr', '.exr', '.ktx', '.dds', 'image_gen', 'text2im')
          for token in forbidden:
              assert token not in lower, token
          assert 'gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT' not in text
          assert 'gl.DEPTH_BUFFER_BIT|gl.COLOR_BUFFER_BIT' not in text
          assert '0.2.1-coast-r011.2' in text
          assert 'coast-0.2.1-r011.2-daylight-complete' in text

          out = Path('candidate')
          out.mkdir()
          data = text.encode('utf-8')
          (out / 'index.html').write_bytes(data)
          modules = re.findall(r'<script type="module">(.*?)</script>', text, re.S)
          assert len(modules) == 1
          (out / 'runtime.mjs').write_text(modules[0], encoding='utf-8')
          build = {
              'status': 'R0112_REPAIRED',
              'runtimeVersion': '0.2.1-coast-r011.2',
              'bytes': len(data),
              'sha256': hashlib.sha256(data).hexdigest(),
              'combinedDepthBlitsRemoved': first + second,
              'persistentImageAssets': 0,
              'visualApproved': False,
              'productionApproved': False
          }
          (out / 'BUILD.json').write_text(json.dumps(build, indent=2) + '\n')
          print(json.dumps(build, indent=2))
          PY
          node --check candidate/runtime.mjs

      - name: Run local five-view WebGL2 gate
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 -m http.server 8123 --bind 127.0.0.1 > evidence/server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 1
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          COMMON=(--headless=new --no-sandbox --disable-dev-shm-usage --enable-webgl --ignore-gpu-blocklist --use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader --disable-gpu-sandbox --hide-scrollbars --window-size=1600,900 --virtual-time-budget=20000)
          for VIEW in overview fire shore breaker rocks; do
            URL="http://127.0.0.1:8123/candidate/?qa=1&view=${VIEW}"
            "$CHROME" "${COMMON[@]}" --dump-dom "$URL" > "evidence/${VIEW}-dom.html" 2> "evidence/${VIEW}-chrome.log"
            "$CHROME" "${COMMON[@]}" --screenshot="evidence/${VIEW}.png" "$URL" >> "evidence/${VIEW}-chrome.log" 2>&1
          done
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, html, json, re

          root = Path('evidence')
          views = ('overview', 'fire', 'shore', 'breaker', 'rocks')
          probes, errors, hashes = {}, [], {}
          for view in views:
              dom = (root / f'{view}-dom.html').read_text(errors='replace')
              log = (root / f'{view}-chrome.log').read_text(errors='replace')
              bad = re.search(r'illegal use of reserved word|ERROR:\s*0:|shader.{0,80}(compile|link)|GL_INVALID_OPERATION:\s*glBlitFramebuffer|当前浏览器未提供 WebGL2', log, re.I)
              if bad:
                  errors.append({'view': view, 'error': bad.group(0), 'tail': log[-2200:]})
              match = re.search(r'<pre[^>]*id="qaProbe"[^>]*>(.*?)</pre>', dom, re.S)
              if not match or not match.group(1).strip():
                  errors.append({'view': view, 'error': 'qaProbe missing or empty'})
              else:
                  try:
                      probes[view] = json.loads(html.unescape(match.group(1)))
                  except Exception as exc:
                      errors.append({'view': view, 'error': f'qaProbe parse failed: {exc}'})
              shot = root / f'{view}.png'
              if not shot.is_file() or shot.stat().st_size < 30000:
                  errors.append({'view': view, 'error': 'capture missing or too small'})
              elif shot.is_file():
                  hashes[view] = hashlib.sha256(shot.read_bytes()).hexdigest()

          overview = probes.get('overview', {}).get('visualProbe') or {}
          fire = probes.get('fire', {}).get('visualProbe') or {}
          shore = probes.get('shore', {}).get('visualProbe') or {}
          rocks = probes.get('rocks', {}).get('visualProbe') or {}
          checks = {
              'fiveViewsLoaded': len(probes) == 5,
              'allReady': all(probes.get(v, {}).get('ready') is True for v in views),
              'allWebGL2': all(probes.get(v, {}).get('webgl2') is True for v in views),
              'allRuntimeErrorsEmpty': all(not probes.get(v, {}).get('error') for v in views),
              'allGlErrorsClear': all(probes.get(v, {}).get('glError') in (0, None) for v in views),
              'viewRouting': all(probes.get(v, {}).get('currentView') == v for v in views),
              'viewsDistinct': len(set(hashes.values())) == 5,
              'daylightAverage': overview.get('averageLuminance', 0) > .16,
              'daylightSky': overview.get('topLuminance', 0) > .19,
              'sceneNotBlack': overview.get('nonDarkRatio', 0) > .78,
              'waterSkyVisible': overview.get('blueWaterSkyRatio', 0) > .025,
              'sandRockVisible': overview.get('earthSandRockRatio', 0) > .008,
              'overviewFireVisible': overview.get('warmFireRatio', 0) > .000008,
              'fireCloseupVisible': fire.get('warmFireRatio', 0) > .00005,
              'shoreBright': shore.get('averageLuminance', 0) > .14,
              'shoreWaterVisible': shore.get('blueWaterSkyRatio', 0) > .02,
              'rocksVisible': rocks.get('earthSandRockRatio', 0) > .008,
              'zeroImages': all(probes.get(v, {}).get('persistentImageAssets') == 0 for v in views),
              'zeroExternalCdn': all(probes.get(v, {}).get('externalCdn') == 0 for v in views),
              'logsClean': len(errors) == 0
          }
          report = {
              'status': 'R0112_LOCAL_PASS' if all(checks.values()) else 'R0112_LOCAL_FAIL',
              'checksPassed': sum(bool(v) for v in checks.values()),
              'checksFailed': sum(not bool(v) for v in checks.values()),
              'checks': checks,
              'probes': probes,
              'screenshotSha256': hashes,
              'errors': errors,
              'internalScreenshotsOnly': True,
              'visualApproved': False,
              'productionApproved': False
          }
          (root / 'LOCAL_QA.json').write_text(json.dumps(report, ensure_ascii=False, indent=2) + '\n')
          print(json.dumps({k: v for k, v in report.items() if k != 'probes'}, ensure_ascii=False, indent=2))
          if report['status'] != 'R0112_LOCAL_PASS':
              raise SystemExit(1)
          PY

      - name: Publish passed standalone page
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, time, urllib.request

          repo = 'haihao0307/guilin-dem-pipeline'
          branch = 'gh-pages'
          target = 'ocean-mother/coast-v021-r0112/index.html'
          data = pathlib.Path('candidate/index.html').read_bytes()
          base = 'https://api.github.com/repos/' + repo
          token = os.environ['GH_TOKEN']

          def api(path, body=None, method=None):
              req = urllib.request.Request(
                  base + path,
                  data=None if body is None else json.dumps(body).encode(),
                  method=method or ('GET' if body is None else 'POST'),
                  headers={'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json', 'Cache-Control': 'no-cache'}
              )
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.load(response)

          head = api('/git/ref/heads/' + branch + '?nonce=' + str(time.time_ns()))['object']['sha']
          base_tree = api('/git/commits/' + head)['tree']['sha']
          blob = api('/git/blobs', {'content': base64.b64encode(data).decode(), 'encoding': 'base64'})['sha']
          tree = api('/git/trees', {'base_tree': base_tree, 'tree': [{'path': target, 'mode': '100644', 'type': 'blob', 'sha': blob}]})['sha']
          commit = api('/git/commits', {'message': 'feat(ocean): publish Coast R011.2 complete daylight candidate', 'tree': tree, 'parents': [head]})['sha']
          assert api('/git/ref/heads/' + branch + '?nonce=' + str(time.time_ns()))['object']['sha'] == head
          api('/git/refs/heads/' + branch, {'sha': commit, 'force': False}, 'PATCH')
          assert api('/git/ref/heads/' + branch + '?nonce=' + str(time.time_ns()))['object']['sha'] == commit
          receipt = {'status': 'R0112_PUBLISHED', 'runtimeVersion': '0.2.1-coast-r011.2', 'publicCommit': commit, 'publicPath': target, 'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest(), 'forcePush': False, 'persistentImageAssets': 0, 'visualApproved': False, 'productionApproved': False}
          pathlib.Path('evidence/PUBLISH.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps(receipt, indent=2))
          PY

      - name: Verify live page in Chrome
        run: |
          set -euo pipefail
          URL='https://haihao0307.github.io/guilin-dem-pipeline/ocean-mother/coast-v021-r0112/'
          READY=0
          for ATTEMPT in $(seq 1 30); do
            curl -fsSL -H 'Cache-Control: no-cache' "${URL}?readback=${RANDOM}-${ATTEMPT}" -o evidence/public-index.html
            if grep -q 'coast-0.2.1-r011.2-daylight-complete' evidence/public-index.html; then
              READY=1
              break
            fi
            sleep 10
          done
          test "$READY" = 1
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --enable-webgl --ignore-gpu-blocklist --use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader --disable-gpu-sandbox --hide-scrollbars --window-size=1600,900 --virtual-time-budget=20000 --dump-dom "${URL}?qa=1&view=overview&public=${RANDOM}" > evidence/public-dom.html 2> evidence/public-chrome.log
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --enable-webgl --ignore-gpu-blocklist --use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader --disable-gpu-sandbox --hide-scrollbars --window-size=1600,900 --virtual-time-budget=20000 --screenshot=evidence/public-overview.png "${URL}?qa=1&view=overview&public-shot=${RANDOM}" >> evidence/public-chrome.log 2>&1
          python3 - <<'PY'
          from pathlib import Path
          import html, json, re

          dom = Path('evidence/public-dom.html').read_text(errors='replace')
          log = Path('evidence/public-chrome.log').read_text(errors='replace')
          match = re.search(r'<pre[^>]*id="qaProbe"[^>]*>(.*?)</pre>', dom, re.S)
          probe = json.loads(html.unescape(match.group(1))) if match and match.group(1).strip() else {}
          visual = probe.get('visualProbe') or {}
          checks = {
              'buildIdentity': 'coast-0.2.1-r011.2-daylight-complete' in dom,
              'ready': probe.get('ready') is True,
              'webgl2': probe.get('webgl2') is True,
              'errorFree': not probe.get('error'),
              'glClean': probe.get('glError') in (0, None),
              'daylight': visual.get('averageLuminance', 0) > .16 and visual.get('topLuminance', 0) > .19,
              'sceneVisible': visual.get('nonDarkRatio', 0) > .78,
              'waterVisible': visual.get('blueWaterSkyRatio', 0) > .025,
              'sandRockVisible': visual.get('earthSandRockRatio', 0) > .008,
              'fireVisible': visual.get('warmFireRatio', 0) > .000008,
              'capturePresent': Path('evidence/public-overview.png').is_file() and Path('evidence/public-overview.png').stat().st_size > 30000,
              'logClean': not re.search(r'illegal use of reserved word|ERROR:\s*0:|shader.{0,80}(compile|link)|GL_INVALID_OPERATION:\s*glBlitFramebuffer', log, re.I)
          }
          report = {'status': 'R0112_PUBLIC_PASS' if all(checks.values()) else 'R0112_PUBLIC_FAIL', 'checksPassed': sum(bool(v) for v in checks.values()), 'checksFailed': sum(not bool(v) for v in checks.values()), 'checks': checks, 'probe': probe, 'url': 'https://haihao0307.github.io/guilin-dem-pipeline/ocean-mother/coast-v021-r0112/'}
          Path('evidence/PUBLIC_QA.json').write_text(json.dumps(report, ensure_ascii=False, indent=2) + '\n')
          print(json.dumps(report, ensure_ascii=False, indent=2))
          if report['status'] != 'R0112_PUBLIC_PASS':
              raise SystemExit(1)
          PY

      - name: Record successful publication in source branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import base64, json, os, pathlib, time, urllib.request

          repo = 'haihao0307/guilin-dem-pipeline'
          branch = 'work/ocean-mother-handoff-20260901'
          base = 'https://api.github.com/repos/' + repo
          token = os.environ['GH_TOKEN']
          public = json.loads(pathlib.Path('evidence/PUBLISH.json').read_text())
          qa = json.loads(pathlib.Path('evidence/PUBLIC_QA.json').read_text())
          receipt = {
              'format': 'ocean-coast-r0112-publication-receipt',
              'version': 1,
              'runtimeVersion': '0.2.1-coast-r011.2',
              'status': 'PUBLIC_BROWSER_VERIFIED',
              'publicUrl': qa['url'],
              'publicCommit': public['publicCommit'],
              'publicChecksPassed': qa['checksPassed'],
              'publicChecksFailed': qa['checksFailed'],
              'persistentImageAssets': 0,
              'externalModels': 0,
              'visualApproved': False,
              'productionApproved': False
          }
          data = (json.dumps(receipt, ensure_ascii=False, indent=2) + '\n').encode()
          path = 'ocean-mother/coast-v021-r0112/PUBLICATION.json'

          def api(endpoint, body=None, method=None):
              req = urllib.request.Request(base + endpoint, data=None if body is None else json.dumps(body).encode(), method=method or ('GET' if body is None else 'POST'), headers={'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json', 'Cache-Control': 'no-cache'})
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.load(response)

          head = api('/git/ref/heads/' + branch + '?nonce=' + str(time.time_ns()))['object']['sha']
          base_tree = api('/git/commits/' + head)['tree']['sha']
          blob = api('/git/blobs', {'content': base64.b64encode(data).decode(), 'encoding': 'base64'})['sha']
          tree = api('/git/trees', {'base_tree': base_tree, 'tree': [{'path': path, 'mode': '100644', 'type': 'blob', 'sha': blob}]})['sha']
          commit = api('/git/commits', {'message': 'test(ocean): record Coast R011.2 public browser verification', 'tree': tree, 'parents': [head]})['sha']
          assert api('/git/ref/heads/' + branch + '?nonce=' + str(time.time_ns()))['object']['sha'] == head
          api('/git/refs/heads/' + branch, {'sha': commit, 'force': False}, 'PATCH')
          assert api('/git/ref/heads/' + branch + '?nonce=' + str(time.time_ns()))['object']['sha'] == commit
          print(json.dumps({'status': 'RECORDED', 'commit': commit, 'path': path}, indent=2))
          PY

      - name: Preserve final evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ocean-coast-r0112-final-gate-evidence
          path: |
            candidate/
            evidence/
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
