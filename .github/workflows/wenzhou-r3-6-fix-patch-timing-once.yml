name: Wenzhou R3.6 One-shot Patch Timing Fix

on:
  push:
    branches:
      - feature/wenzhou-r3-6-osm-runtime-20260911
    paths:
      - '.github/workflows/wenzhou-r3-6-fix-patch-timing-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/wenzhou-r3-6-osm-runtime-20260911
          fetch-depth: 0
      - name: Restore inherited one-frame patch binding contract
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('site/dist/r3-6/osm-runtime.js')
          s=p.read_text(encoding='utf-8')
          old="""    disposeActive();captureRenderer(terrain,scene);\n    const patchId=canvas()?.dataset.patch||document.getElementById('location')?.value||'';\n    setDataset({osmRuntime:'indexed-r36',osmIndexed:true,osmLoading:true,osmLoaded:false,osmPatch:patchId,osmAbortController:true,osmAbortCount:abortCount,osmFetchAbortCount:fetchAbortCount,osmError:null});\n    const buildStart=performance.now();\n    try{\n      const[manifest,contract]=await Promise.all([manifestPromise,contractPromise]);throwIfAborted(signal);if(token!==buildToken)throw abortError('superseded-token');\n"""
          new="""    disposeActive();captureRenderer(terrain,scene);\n    let patchId='';\n    const buildStart=performance.now();\n    try{\n      // R3.1 writes canvas.dataset.patch after scene.add(terrain). R3.5 already\n      // waited one frame before binding evidence to the view; preserve that\n      // inherited timing contract so R3.6 never attaches the previous patch.\n      await new Promise(resolve=>requestAnimationFrame(resolve));\n      throwIfAborted(signal);if(token!==buildToken)throw abortError('superseded-token');\n      patchId=canvas()?.dataset.patch||document.getElementById('location')?.value||'';\n      setDataset({osmRuntime:'indexed-r36',osmIndexed:true,osmLoading:true,osmLoaded:false,osmPatch:patchId,osmAbortController:true,osmAbortCount:abortCount,osmFetchAbortCount:fetchAbortCount,osmError:null});\n      const[manifest,contract]=await Promise.all([manifestPromise,contractPromise]);throwIfAborted(signal);if(token!==buildToken)throw abortError('superseded-token');\n"""
          if s.count(old)!=1:
              raise SystemExit(f'exact timing block count != 1: {s.count(old)}')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          node --check site/dist/r3-6/osm-runtime.js
          grep -q 'await new Promise(resolve=>requestAnimationFrame(resolve))' site/dist/r3-6/osm-runtime.js
          rm .github/workflows/wenzhou-r3-6-fix-patch-timing-once.yml
      - name: Commit exact runtime fix
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/dist/r3-6/osm-runtime.js .github/workflows/wenzhou-r3-6-fix-patch-timing-once.yml
          git commit -m 'fix(wenzhou): bind R3.6 OSM after patch state settles'
          git push origin HEAD:feature/wenzhou-r3-6-osm-runtime-20260911
