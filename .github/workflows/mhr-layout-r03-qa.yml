name: MHR enlarged workspace R03 public QA
on:
  push:
    branches: [qa/mhr-layout-r03-20261006]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: kaopu-mhr-workbench
      - name: Original numerical parity
        run: cd kaopu-mhr-workbench && node tests/model.mjs
      - name: Official Playwright browser install
        run: |
          npm install --prefix "$RUNNER_TEMP/mhr-test" --no-save --ignore-scripts playwright@1.57.0
          "$RUNNER_TEMP/mhr-test/node_modules/.bin/playwright" install --with-deps chromium webkit
      - name: Verify exact public release assets
        run: |
          for file in index.html style.css; do
            expected=$(sha256sum "kaopu-mhr-workbench/$file" | cut -d' ' -f1)
            matched=0
            for i in $(seq 1 60); do
              curl --max-time 15 -fsS "https://haihao0307.github.io/guilin-dem-pipeline/kaopu-mhr-workbench/$file?qa=${GITHUB_SHA}" -o "$RUNNER_TEMP/public-$file" || true
              actual=$(sha256sum "$RUNNER_TEMP/public-$file" | cut -d' ' -f1)
              if [ "$actual" = "$expected" ]; then matched=1; break; fi
              sleep 5
            done
            test "$matched" = 1
          done
      - name: Real public 1440 2048 and 390 pixel layout and interaction
        env:
          MHR_URL: https://haihao0307.github.io/guilin-dem-pipeline/kaopu-mhr-workbench/
        run: |
          curl -fsS https://haihao0307.github.io/guilin-dem-pipeline/kaopu-human-overview/ > /dev/null
          for browser in chromium webkit; do
            mkdir -p "qa-$browser"
            (cd "qa-$browser" && MHR_BROWSER="$browser" NODE_PATH="$RUNNER_TEMP/mhr-test/node_modules" node ../kaopu-mhr-workbench/tests/layout.cjs)
            (cd "qa-$browser" && MHR_BROWSER="$browser" NODE_PATH="$RUNNER_TEMP/mhr-test/node_modules" node ../kaopu-mhr-workbench/tests/browser.cjs)
          done
      - name: Upload real browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mhr-layout-r03-public-evidence
          retention-days: 7
          path: |
            qa-*/*
            kaopu-mhr-workbench/tests/*parity*.json
