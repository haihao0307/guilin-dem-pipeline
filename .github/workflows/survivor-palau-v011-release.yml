name: Survivor Palau V0.1.1 visual foundation release

on:
  push:
    branches:
      - game/survivor-palau-v001-20260917
    paths:
      - .github/workflows/survivor-palau-v011-release.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: survivor-palau-v011-release
  cancel-in-progress: true

jobs:
  rebuild-verify-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Rebuild V0.1.1 from verified V0.1.0
        shell: bash
        run: |
          set -euo pipefail
          cat games/survivor-palau/source/v011_patch.part01.txt | base64 -d | gzip -d > /tmp/patch_v011_visual.py
          echo 'f6cbb4d7df480f7fed83e6a4e8c9ec1225a6391b14299d6f7c956bdd95659903  /tmp/patch_v011_visual.py' | sha256sum -c -
          python3 /tmp/patch_v011_visual.py
          OUT=games/survivor-palau/releases/v0.1.1/Survivor_Palau_V0.1.1_Visual_Foundation_Direct_Open.html
          echo '625150a1e36009da265921d95049e57fe38c1449a08f0fbd2f6fda79b55263c3  '"$OUT" | sha256sum -c -
          test "$(wc -c < "$OUT")" -eq 145678

      - name: Static identity and JavaScript validation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,re
          p=Path('games/survivor-palau/releases/v0.1.1/Survivor_Palau_V0.1.1_Visual_Foundation_Direct_Open.html')
          b=p.read_bytes();s=b.decode('utf-8')
          assert hashlib.sha256(b).hexdigest()=='625150a1e36009da265921d95049e57fe38c1449a08f0fbd2f6fda79b55263c3'
          for marker in ['SURVIVOR: PALAU','survivor-palau-visual-foundation-v011','karstFormationCount','canoePrototype','visibleClouds','naturalBreakerField','data-view="deepfish"','data-view="karst"']:
              assert marker in s,marker
          assert s.count('<canvas')==1 and '<iframe' not in s
          m=re.search(r'<script type="module">(.*)</script>',s,re.S);assert m
          Path('/tmp/survivor-palau-v011.mjs').write_text(m.group(1),encoding='utf-8')
          Path('/tmp/static_identity_v011.json').write_text(json.dumps({'sha256':hashlib.sha256(b).hexdigest(),'bytes':len(b),'canvasCount':1,'iframeCount':0,'passed':True},indent=2)+'\n')
          PY
          node --check /tmp/survivor-palau-v011.mjs

      - name: Real Chromium WebGL2 and visual QA
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -q playwright
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          cat >/tmp/survivor_v011_qa.py <<'PY'
          from playwright.sync_api import sync_playwright
          from pathlib import Path
          import json,shutil
          root=Path('games/survivor-palau/releases/v0.1.1')
          page_path=root/'Survivor_Palau_V0.1.1_Visual_Foundation_Direct_Open.html'
          report={'format':'survivor-palau-v011-browser-qa','consoleErrors':[],'pageErrors':[],'requestFailures':[],'passed':False}
          chrome=shutil.which('google-chrome') or shutil.which('google-chrome-stable') or shutil.which('chromium');assert chrome
          with sync_playwright() as p:
              browser=p.chromium.launch(executable_path=chrome,headless=False,args=['--no-sandbox','--enable-webgl','--ignore-gpu-blocklist','--use-angle=swiftshader','--enable-unsafe-swiftshader','--allow-file-access-from-files'])
              page=browser.new_page(viewport={'width':1600,'height':950})
              page.on('console',lambda m: report['consoleErrors'].append(m.text) if m.type=='error' else None)
              page.on('pageerror',lambda e: report['pageErrors'].append(str(e)))
              page.on('requestfailed',lambda r: report['requestFailures'].append({'url':r.url,'failure':str(r.failure)}))
              page.goto(page_path.resolve().as_uri()+'?qa=1',wait_until='load',timeout=30000)
              page.wait_for_function("() => document.body.dataset.qaReady==='true' && window.OceanMotherR018?.qa?.ready",timeout=120000)
              qa=page.evaluate("() => window.OceanMotherR018.qa")
              assert qa['webgl2'] is True and qa.get('glError',0)==0 and not qa.get('errors')
              assert qa.get('karstFormationCount',0)>=9,qa
              assert qa.get('treeCount',0)>=45,qa
              assert qa.get('canoeCount',0)==1,qa
              assert qa.get('foamActiveCells',0)>=18,qa
              assert page.locator('canvas').count()==1 and page.locator('iframe').count()==0
              for view in ['overview','karst','breaker','canoe','deepfish']:
                  page.locator(f'[data-view="{view}"]').click();page.wait_for_timeout(1700);page.screenshot(path=f'/tmp/v011-{view}.png',full_page=True)
              page.locator('#panelToggle').click();page.wait_for_timeout(250);assert page.locator('#panel').evaluate("e=>!e.classList.contains('closed')")
              page.locator('#pause').click();page.wait_for_timeout(250);assert page.evaluate("() => window.OceanMotherR018.getState().config.paused") is True
              page.locator('#pause').click();page.wait_for_timeout(250);assert page.evaluate("() => window.OceanMotherR018.getState().config.paused") is False
              report.update({'webgl2':qa['webgl2'],'glError':qa.get('glError',0),'qaErrors':qa.get('errors',[]),'visualProbe':qa.get('visualProbe'),'karstFormationCount':qa.get('karstFormationCount'),'treeCount':qa.get('treeCount'),'canoeCount':qa.get('canoeCount'),'foamActiveCells':qa.get('foamActiveCells'),'curlLayerTriangles':qa.get('curlLayerTriangles'),'canvasCount':1,'iframeCount':0,'viewsChecked':['overview','karst','breaker','canoe','deepfish']})
              report['passed']=not report['consoleErrors'] and not report['pageErrors'] and not report['requestFailures']
              browser.close()
          assert report['passed'],report
          Path('/tmp/browser_qa_v011.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          xvfb-run -a python3 /tmp/survivor_v011_qa.py

      - name: Commit verified V0.1.1 direct-open and QA receipt
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          ROOT=games/survivor-palau/releases/v0.1.1
          cp /tmp/static_identity_v011.json "$ROOT/STATIC_IDENTITY.json"
          cp /tmp/browser_qa_v011.json "$ROOT/BROWSER_QA.json"
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add "$ROOT"
          git commit -m 'publish(game): Survivor Palau V0.1.1 visual foundation verified'
          git push origin HEAD:game/survivor-palau-v001-20260917
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify fixed-commit public bytes
        shell: bash
        env:
          COMMIT: ${{ steps.publish.outputs.commit }}
        run: |
          set -euo pipefail
          PATHNAME=games/survivor-palau/releases/v0.1.1/Survivor_Palau_V0.1.1_Visual_Foundation_Direct_Open.html
          for HOST in raw.githack.com rawcdn.githack.com; do
            URL="https://$HOST/haihao0307/guilin-dem-pipeline/$COMMIT/$PATHNAME"
            for n in $(seq 1 30); do
              if curl -fsSL --retry 2 "$URL" -o "/tmp/v011-${HOST}.html"; then
                SHA=$(sha256sum "/tmp/v011-${HOST}.html" | awk '{print $1}')
                [ "$SHA" = '625150a1e36009da265921d95049e57fe38c1449a08f0fbd2f6fda79b55263c3' ] && break
              fi
              sleep 4
            done
            echo "625150a1e36009da265921d95049e57fe38c1449a08f0fbd2f6fda79b55263c3  /tmp/v011-${HOST}.html" | sha256sum -c -
          done

      - name: Verify fixed-commit public runtime in Chromium
        shell: bash
        env:
          COMMIT: ${{ steps.publish.outputs.commit }}
        run: |
          set -euo pipefail
          cat >/tmp/survivor_v011_public_qa.py <<'PY'
          from playwright.sync_api import sync_playwright
          from pathlib import Path
          import json,os,shutil
          commit=os.environ['COMMIT']
          path='games/survivor-palau/releases/v0.1.1/Survivor_Palau_V0.1.1_Visual_Foundation_Direct_Open.html'
          url=f'https://raw.githack.com/haihao0307/guilin-dem-pipeline/{commit}/{path}?qa=1'
          report={'format':'survivor-palau-v011-public-browser-qa','url':url,'commit':commit,'consoleErrors':[],'pageErrors':[],'requestFailures':[],'passed':False}
          chrome=shutil.which('google-chrome') or shutil.which('google-chrome-stable') or shutil.which('chromium');assert chrome
          with sync_playwright() as p:
              browser=p.chromium.launch(executable_path=chrome,headless=False,args=['--no-sandbox','--enable-webgl','--ignore-gpu-blocklist','--use-angle=swiftshader','--enable-unsafe-swiftshader'])
              context=browser.new_context(viewport={'width':1600,'height':950})
              context.add_cookies([{'name':'__Http-phish','value':'1','url':'https://raw.githack.com/','secure':True,'httpOnly':True,'sameSite':'Lax'}])
              page=context.new_page()
              page.on('console',lambda m: report['consoleErrors'].append(m.text) if m.type=='error' else None)
              page.on('pageerror',lambda e: report['pageErrors'].append(str(e)))
              page.on('requestfailed',lambda r: report['requestFailures'].append({'url':r.url,'failure':str(r.failure)}))
              response=page.goto(url,wait_until='load',timeout=60000);assert response and response.ok
              page.wait_for_function("() => document.body.dataset.qaReady==='true' && window.OceanMotherR018?.qa?.ready",timeout=120000)
              qa=page.evaluate("() => window.OceanMotherR018.qa")
              assert qa['webgl2'] is True and qa.get('glError',0)==0 and not qa.get('errors')
              assert qa.get('karstFormationCount',0)>=9 and qa.get('treeCount',0)>=45 and qa.get('canoeCount',0)==1 and qa.get('foamActiveCells',0)>=18
              for view in ['overview','karst','breaker','canoe','deepfish']:
                  page.locator(f'[data-view="{view}"]').click();page.wait_for_timeout(1500);page.screenshot(path=f'/tmp/v011-public-{view}.png',full_page=True)
              report.update({'httpStatus':response.status,'webgl2':qa['webgl2'],'glError':qa.get('glError',0),'qaErrors':qa.get('errors',[]),'visualProbe':qa.get('visualProbe'),'karstFormationCount':qa.get('karstFormationCount'),'treeCount':qa.get('treeCount'),'canoeCount':qa.get('canoeCount'),'foamActiveCells':qa.get('foamActiveCells'),'viewsChecked':['overview','karst','breaker','canoe','deepfish']})
              report['passed']=not report['consoleErrors'] and not report['pageErrors'] and not report['requestFailures']
              browser.close()
          Path('/tmp/public_browser_qa_v011.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          assert report['passed'],report
          PY
          xvfb-run -a python3 /tmp/survivor_v011_public_qa.py

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Survivor_Palau_V0.1.1_Visual_Foundation_QA
          path: |
            /tmp/static_identity_v011.json
            /tmp/browser_qa_v011.json
            /tmp/v011-overview.png
            /tmp/v011-karst.png
            /tmp/v011-breaker.png
            /tmp/v011-canoe.png
            /tmp/v011-deepfish.png
            /tmp/v011-raw.githack.com.html
            /tmp/v011-rawcdn.githack.com.html
            /tmp/public_browser_qa_v011.json
            /tmp/v011-public-overview.png
            /tmp/v011-public-karst.png
            /tmp/v011-public-breaker.png
            /tmp/v011-public-canoe.png
            /tmp/v011-public-deepfish.png
          if-no-files-found: warn
          retention-days: 90
