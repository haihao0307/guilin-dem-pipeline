name: Landscape R5 surface-shell build
on:
  push:
    branches: [feature/landscape-mother-field-graph-v002]
    paths:
      - workbenches/landscape-surface-r5/patch.py
      - .github/workflows/landscape-surface-r5.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify protected core and build exact candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:landscape-mother)" = 468aacd827f72eec3c245ad9e85abfa42a4ff097
          python3 workbenches/landscape-surface-r5/patch.py
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('workbenches/landscape-surface-r5/index.html')
          b=p.read_bytes()
          assert len(b)==81724
          assert hashlib.sha256(b).hexdigest()=='989ca4f976daa205f8e87699d23b1bf68f94b12a486395c7272df6b38d8304e7'
          s=p.read_text()
          assert 'Microscope 壳层' in s and "release:'karst-surface-shell-r5'" in s
          assert 'for(int j=0;j<17;j++)' in s
          PY
      - name: Commit fixed R5 HTML
        run: |
          set -euo pipefail
          git config user.name 'Landscape Mother'
          git config user.email 'actions@users.noreply.github.com'
          git add workbenches/landscape-surface-r5/index.html
          git diff --cached --quiet && exit 0
          git commit -m 'feat(landscape): add R5 surface-only microscope candidate [skip ci]'
          git push origin HEAD:feature/landscape-mother-field-graph-v002
