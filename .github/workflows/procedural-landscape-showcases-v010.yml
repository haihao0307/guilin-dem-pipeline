name: Procedural landscape three-region showcases v0.1

on:
  push:
    branches:
      - skill/dem-procedural-landscape-v010
    paths:
      - web/procedural-landscape-showcases-v010/**
      - web/procedural-landscape-skill/showcase-v010-link.json
      - tools/procedural_landscape/showcase_v010_qa.py
      - ops/tasks/DEM_PROCEDURAL_LANDSCAPE_SHOWCASES_V010.md
      - skills/dem-procedural-landscape/BRANCH_REGISTRY.json
  pull_request:
    paths:
      - web/procedural-landscape-showcases-v010/**
      - tools/procedural_landscape/showcase_v010_qa.py
      - ops/tasks/DEM_PROCEDURAL_LANDSCAPE_SHOWCASES_V010.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: procedural-landscape-showcases-v010-${{ github.ref }}
  cancel-in-progress: false

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Static contracts
        run: |
          python -m py_compile tools/procedural_landscape/showcase_v010_qa.py
          python -m json.tool web/procedural-landscape-showcases-v010/showcase.json >/dev/null
          grep -q '10 km × 10 km' web/procedural-landscape-showcases-v010/index.html
          grep -q '小华' web/procedural-landscape-showcases-v010/index.html
      - name: Install Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Run eight-page browser QA
        run: python tools/procedural_landscape/showcase_v010_qa.py --root . --output reports/procedural-landscape-showcases-v010
      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: procedural-landscape-showcases-v010-browser-${{ github.sha }}
          path: reports/procedural-landscape-showcases-v010/**
          if-no-files-found: error
          retention-days: 30
