name: Native wall units existing-game GPU QA
on:
  push:
    branches: ['qa/wall-units-r01-20261011']
    paths:
      - 'kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01/wall-units/**'
      - 'tests/wall-units-scene.cjs'
      - '.github/workflows/wall-units-r01-qa.yml'
permissions:
  contents: read
jobs:
  native-wall-gpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      WALL_GAME: kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01
      WALL_OUT: wall-unit-results
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01
            kaopu-minigame-workbench/voxel-train-study/vendor
            tests/wall-units-scene.cjs
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
      - name: Verify native sources and generate the actual SQLite objects
        run: |
          mkdir -p "$WALL_OUT"
          WALL_HOST_GAME_ROOT="$GITHUB_WORKSPACE/$WALL_GAME" node --test "$WALL_GAME/wall-units/wall-unit.test.mjs" | tee "$WALL_OUT/unit-tests.txt"
          node "$WALL_GAME/wall-units/native-codec/write_samples.mjs" --input "$WALL_GAME/wall-units/native-codec/samples-input.json" | tee "$WALL_OUT/sample-manifest.json"
      - name: Install official pinned browser test runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/wall-browser" --registry=https://registry.npmjs.org --no-save --ignore-scripts --no-audit --no-fund playwright@1.57.0
          "$RUNNER_TEMP/wall-browser/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/wall-browser/node_modules" >> "$GITHUB_ENV"
      - name: Render the three SQLite objects in the existing game scene
        timeout-minutes: 7
        run: node tests/wall-units-scene.cjs
      - name: Preserve real screenshots and errors
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-wall-units-${{ github.sha }}
          path: wall-unit-results/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
