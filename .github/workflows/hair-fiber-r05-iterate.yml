name: Hair R05 Bending and Render Coalescing
on:
  push:
    branches: [research/hair-fiber-lookdev-physics-r01-20261014]
    paths: ['kaopu-hair-workbench/research/fiber-r05/**','.github/workflows/hair-fiber-r05-iterate.yml']
permissions:
  contents: write
concurrency:
  group: hair-r05-isolated
  cancel-in-progress: false
jobs:
  original-look-and-real-motion:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ROOT: kaopu-hair-workbench/research/fiber-r05
      BASE_SHA: 254ff866885e2581156cac8f3956615bfe027944
      BRANCH: research/hair-fiber-lookdev-physics-r01-20261014
    steps:
      - name: Isolated checkout and numerical checks
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git config remote.origin.promisor true
          git config remote.origin.partialclonefilter blob:none
          git sparse-checkout init --cone
          git sparse-checkout set kaopu-hair-workbench/research kaopu-hair-workbench/foundation/f03/src/approved
          git fetch --no-tags --filter=blob:none --depth=1 origin "$GITHUB_SHA" "$BASE_SHA"
          git checkout --detach "$GITHUB_SHA"
          git diff --name-only "$BASE_SHA" "$GITHUB_SHA" > /tmp/scope.txt
          if grep -Ev '^(kaopu-hair-workbench/research/fiber-r05/|\.github/workflows/hair-fiber-r05-iterate\.yml$)' /tmp/scope.txt; then exit 1; fi
          REQUIRE_BASELINE=1 node --test kaopu-hair-workbench/research/fiber-r01/tests/probes.test.mjs
          node --test "$ROOT/tests/core.mjs"
      - name: Pinned self-contained build
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/hair-r05" --ignore-scripts --no-audit --no-fund three@0.169.0 playwright@1.55.1 pngjs@7.0.0
          ln -s "$RUNNER_TEMP/hair-r05/node_modules" "$ROOT/node_modules"
          "$ROOT/node_modules/.bin/playwright" install --with-deps chromium
          mkdir -p "$ROOT/licenses"
          cp "$ROOT/node_modules/three/LICENSE" "$ROOT/licenses/THREE-MIT.txt"
          python "$ROOT/build.py" "$ROOT/node_modules/three/build/three.module.min.js"
      - name: Test moving frames, preserve evidence and publish fixed HTTPS
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          push_safe() {
            test "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" = "$1"
            local header
            header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
            git -c "http.https://github.com/.extraheader=$header" push origin "HEAD:refs/heads/$BRANCH"
          }
          python -m http.server 8765 --directory "$ROOT/site" >/tmp/hair-r05-server.log 2>&1 &
          SERVER=$!
          trap 'kill "$SERVER" || true' EXIT
          set +e
          (cd "$ROOT" && node tests/browser.mjs http://127.0.0.1:8765/preview.html candidate)
          CODE=$?
          set -e
          git add "$ROOT/app.mjs" "$ROOT/index.html" "$ROOT/BUILD_MANIFEST.json" "$ROOT/licenses" "$ROOT/evidence"
          if [ "$CODE" != 0 ]; then
            git commit -m 'test(hair-r05): retain failed iteration evidence; no public delivery [skip ci]'
            push_safe "$GITHUB_SHA"
            exit "$CODE"
          fi
          cp "$ROOT/site/preview.html" "$ROOT/preview.html"
          git add "$ROOT/preview.html"
          git commit -m 'build(hair-r05): three-mode bending and coalesced original-quality render [skip ci]'
          BUILD_SHA=$(git rev-parse HEAD)
          push_safe "$GITHUB_SHA"
          RAW="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$BUILD_SHA/$ROOT/preview.html"
          PUBLIC="https://htmlpreview.github.io/?$RAW"
          curl --fail --location --retry 5 --retry-delay 2 "$RAW" -o /tmp/r05-public.html
          cmp "$ROOT/preview.html" /tmp/r05-public.html
          set +e
          (cd "$ROOT" && node tests/browser.mjs "$PUBLIC" public)
          CODE=$?
          set -e
          export BUILD_SHA PUBLIC CODE
          python - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ['ROOT'])
          d={'version':'HAIR-FIBER-R05-M3','source':os.environ['GITHUB_SHA'],'build':os.environ['BUILD_SHA'],'url':os.environ['PUBLIC'],'publicVerified':os.environ['CODE']=='0','status':'candidate_for_user_review' if os.environ['CODE']=='0' else '交付未完成','run':os.environ['GITHUB_RUN_ID'],'hardwareFPSCertified':False,'physicalPhoneTested':False,'filmQualityAccepted':False,'fullRodSolver':False,'collision':False}
          (p/'DELIVERY.json').write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
          git add "$ROOT/evidence" "$ROOT/DELIVERY.json"
          git commit -m 'test(hair-r05): immutable public look and native interaction verification [skip ci]'
          push_safe "$BUILD_SHA"
          echo "PUBLIC_URL=$PUBLIC"
          exit "$CODE"
