name: Wenzhou V7 full-domain tested online preview
on:
  push:
    branches: [project/wenzhou-v200-17tile-truth-hydrology-rebuild]
    paths:
      - .github/workflows/wenzhou-v7-full-deliver.yml
      - projects/wenzhou/v200/web/v7-full/**
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: wenzhou-v7-scoped-publication
  cancel-in-progress: false
jobs:
  build-check-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ROOT: projects/wenzhou/v200/web/v7-full
      SITE: /tmp/wenzhou-full-site
      EVIDENCE: /tmp/wenzhou-full-evidence
      PUBLIC_URL: https://haihao0307.github.io/guilin-dem-pipeline/wenzhou-v7-full/?v=full-review-r3
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
          sparse-checkout: |
            projects/wenzhou/v200
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical and actual Chromium test dependencies
        run: |
          python -m pip install --quiet 'numpy<3' 'shapely==2.1.2' pillow playwright
          python -m playwright install --with-deps chromium
          python - <<'PY'
          import os
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              with open(os.environ['GITHUB_ENV'],'a') as f:f.write('CHROMIUM_PATH='+p.chromium.executable_path+'\n')
          PY
      - name: Build only source-traceable numerical inputs and procedural code
        run: |
          mkdir -p "$EVIDENCE"
          python projects/wenzhou/v200/web/v7/build_vectors.py --source projects/wenzhou/v200/data/hydrology/osm --polygons projects/wenzhou/v200/data/hydrology/osm_water_polygons/WENZHOU_OSM_WATER_POLYGONS_EPSG32651.geojson --output "$ROOT/data/vectors.json.gz"
          python "$ROOT/build.py" "$ROOT" "$SITE"
          for f in runtime.js math.js shaders.js; do node --check "$SITE/$f"; done
          cp "$ROOT/SCOPE.md" "$EVIDENCE/"
      - name: Real browser tests before publication
        run: |
          set -euo pipefail
          python -m http.server 8765 --directory "$SITE" > "$EVIDENCE/server.log" 2>&1 &
          PID=$!
          trap 'kill "$PID" || true' EXIT
          sleep 2
          python "$ROOT/qa.py" --url http://127.0.0.1:8765/ --out "$EVIDENCE/local" --chromium "$CHROMIUM_PATH" --commit "$GITHUB_SHA"
      - name: Bind tested site bytes to exact source commit
        run: |
          python - <<'PY'
          import os,json,hashlib
          from pathlib import Path
          from datetime import datetime,timezone
          site=Path(os.environ['SITE'])
          files={p.relative_to(site).as_posix():{'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in sorted(site.rglob('*')) if p.is_file()}
          manifest=json.loads((site/'manifest.json').read_text())
          obj={'schema':'wenzhou-v7-full-online-build-1','version':manifest['version'],'sourceCommit':os.environ['GITHUB_SHA'],'builtUtc':datetime.now(timezone.utc).isoformat(),'files':files,'localBrowserTestsPassed':True,'publicBrowserEvidence':'separate exact-build receipt after public tests','overviewSpacingM':800,'fullNativeOnline':False,'sourceDeleted':False,'visualApproved':False,'productionApproved':False}
          (site/'ONLINE_BUILD.json').write_text(json.dumps(obj,indent=2)+'\n')
          PY
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: publication
          fetch-depth: 1
          lfs: false
          sparse-checkout: |
            wenzhou-v7-full
      - name: Publish scoped research preview without modifying other production lines
        run: |
          set -euo pipefail
          mkdir -p publication/wenzhou-v7-full
          rsync -a --delete "$SITE/" publication/wenzhou-v7-full/
          cd publication
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- wenzhou-v7-full
          if ! git diff --cached --quiet; then
            test -z "$(git diff --cached --name-only | grep -v '^wenzhou-v7-full/' || true)"
            git commit -m "Publish tested Wenzhou full-domain numerical research preview from ${GITHUB_SHA}"
            pushed=0
            for attempt in 1 2 3; do
              if git push origin HEAD:gh-pages; then pushed=1; break; fi
              git fetch origin gh-pages --depth=30
              git rebase origin/gh-pages
            done
            test "$pushed" = '1'
          fi
          git rev-parse HEAD > "$EVIDENCE/publication-commit.txt"
      - name: Re-read exact public URL and all numerical and code bytes
        run: |
          gh api --method POST repos/haihao0307/guilin-dem-pipeline/pages/builds > "$EVIDENCE/pages-build-request.json" 2> "$EVIDENCE/pages-build-request-error.txt" || true
          python - <<'PY'
          import os,json,hashlib,urllib.request,time
          from pathlib import Path
          from datetime import datetime,timezone
          site=Path(os.environ['SITE']);evidence=Path(os.environ['EVIDENCE']);base='https://haihao0307.github.io/guilin-dem-pipeline/wenzhou-v7-full/'
          def get(url):
              req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','Accept-Encoding':'identity'})
              with urllib.request.urlopen(req,timeout=40) as r:return r.status,r.read()
          sha=lambda b:hashlib.sha256(b).hexdigest()
          expected=sha((site/'index.html').read_bytes());passed=False
          report={'schema':'wenzhou-full-public-http-1','url':os.environ['PUBLIC_URL'],'checkedUtc':datetime.now(timezone.utc).isoformat(),'sourceCommit':os.environ['GITHUB_SHA'],'publicationCommit':(evidence/'publication-commit.txt').read_text().strip(),'passed':False,'attempts':[],'files':[]}
          try:
              for i in range(80):
                  try:
                      status,data=get(os.environ['PUBLIC_URL']);same=status==200 and sha(data)==expected;report['attempts'].append({'attempt':i,'status':status,'exactIndexMatch':same})
                      if same:passed=True;break
                  except Exception as e:report['attempts'].append({'attempt':i,'error':str(e)})
                  time.sleep(6)
              assert passed,'Exact publicly served entry did not match tested HTML'
              for path in sorted(site.rglob('*')):
                  if not path.is_file():continue
                  name=path.relative_to(site).as_posix();status,data=get(base+name);wanted=sha(path.read_bytes());actual=sha(data)
                  assert status==200 and actual==wanted,(name,status,actual,wanted)
                  report['files'].append({'path':name,'status':status,'bytes':len(data),'sha256':actual,'matchesTestedBytes':True})
              report['passed']=True
          finally:(evidence/'PUBLIC_HTTP_QA.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          PY
      - name: Open actual public page in fresh desktop and mobile Chromium
        run: python "$ROOT/qa.py" --url "$PUBLIC_URL" --out "$EVIDENCE/public" --chromium "$CHROMIUM_PATH" --commit "$GITHUB_SHA"
      - name: Commit actual receipts, never grant user approval
        run: |
          set -euo pipefail
          TARGET=projects/wenzhou/v200/reports/v7-full-r3
          mkdir -p "$TARGET"
          cp "$EVIDENCE/PUBLIC_HTTP_QA.json" "$TARGET/"
          cp "$EVIDENCE/public/browser-qa.json" "$TARGET/PUBLIC_BROWSER_QA.json"
          cp "$SITE/DATA_QA.json" "$TARGET/"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$TARGET"
          git diff --cached --quiet || git commit -m 'Record actual full-domain public HTTP and browser evidence [skip ci]'
          for attempt in 1 2 3; do
            if git push origin HEAD:project/wenzhou-v200-17tile-truth-hydrology-rebuild; then exit 0; fi
            git fetch origin project/wenzhou-v200-17tile-truth-hydrology-rebuild --depth=30
            git rebase origin/project/wenzhou-v200-17tile-truth-hydrology-rebuild || exit 1
          done
          exit 1
      - name: Always retain tested bytes and real screenshots including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wenzhou-v7-full-r3-real-evidence
          path: |
            /tmp/wenzhou-full-evidence
            /tmp/wenzhou-full-site
          retention-days: 30
          if-no-files-found: warn
      - name: Report true completion status
        if: always()
        run: |
          python - <<'PY'
          import os,json
          from pathlib import Path
          p=Path(os.environ['EVIDENCE'])/'public/browser-qa.json'
          passed=p.exists() and json.loads(p.read_text()).get('passed') is True
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('Actual public browser tests passed: '+str(passed)+'\n\n800 m full-domain overview only. Full native archive: pending. Source TIFF deleted: false. Visual and production approvals: false.\n')
          PY
