name: Publish KAOPU Score Instrument R01

on:
  push:
    branches:
      - work/kaopu-score-instrument-r01-20260929
    paths:
      - 'kaopu-score-instrument-r01/**'
      - '.github/workflows/kaopu-score-instrument-r01.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kaopu-score-instrument-r01-publish
  cancel-in-progress: false

env:
  PROJECT_DIR: kaopu-score-instrument-r01
  PUBLIC_SUBDIR: kaopu-score-instrument/r01-20260929
  PUBLIC_URL: https://haihao0307.github.io/guilin-dem-pipeline/kaopu-score-instrument/r01-20260929/

jobs:
  build-publish-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out production branch
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install deterministic project dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm install --no-audit --no-fund

      - name: Install Chromium for real-browser QA
        working-directory: ${{ env.PROJECT_DIR }}
        run: npx playwright install --with-deps chromium

      - name: Build one standalone HTML
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm run build

      - name: Verify standalone package shape
        shell: bash
        run: |
          set -euo pipefail
          DIST="$PROJECT_DIR/dist"
          test -s "$DIST/index.html"
          test "$(find "$DIST" -maxdepth 1 -type f | wc -l)" -eq 1
          grep -q 'KAOPU · Score Instrument R01' "$DIST/index.html"
          grep -q 'kaopu-instrument-bytes' "$DIST/index.html"
          if grep -Eqi '<script[^>]+src=' "$DIST/index.html"; then
            echo 'External script reference found in standalone HTML.'
            exit 1
          fi
          if grep -Eqi '<link[^>]+stylesheet' "$DIST/index.html"; then
            echo 'External stylesheet reference found in standalone HTML.'
            exit 1
          fi
          echo "STANDALONE_BYTES $(wc -c < "$DIST/index.html")"
          echo "STANDALONE_SHA256 $(sha256sum "$DIST/index.html" | awk '{print $1}')"

      - name: Run file protocol desktop and mobile QA
        shell: bash
        run: |
          set -euo pipefail
          LOCAL_URL=$(node -e "const {pathToFileURL}=require('node:url'); console.log(pathToFileURL(process.argv[1]).href)" "$GITHUB_WORKSPACE/$PROJECT_DIR/dist/index.html")
          TARGET_URL="$LOCAL_URL" node "$PROJECT_DIR/tests/smoke.mjs"

      - name: Publish without touching other gh-pages directories
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          rm -rf /tmp/kaopu-r01-gh-pages
          git worktree add --detach /tmp/kaopu-r01-gh-pages origin/gh-pages
          TARGET="/tmp/kaopu-r01-gh-pages/$PUBLIC_SUBDIR"
          rm -rf "$TARGET"
          mkdir -p "$TARGET"
          cp "$PROJECT_DIR/dist/index.html" "$TARGET/index.html"
          cd /tmp/kaopu-r01-gh-pages
          git config user.name 'KAOPU Score Instrument CI'
          git config user.email 'kaopu-score-ci@users.noreply.github.com'
          git add "$PUBLIC_SUBDIR/index.html"
          if git diff --cached --quiet; then
            echo 'Published HTML is unchanged.'
          else
            git commit -m 'publish(kaopu-score): R01 standalone instrument [skip ci]'
            git push origin HEAD:gh-pages
          fi

      - name: Verify live HTTP payload
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 36); do
            code=$(curl -L -sS -o /tmp/kaopu-live.html -w '%{http_code}' "$PUBLIC_URL" || true)
            if [ "$code" = '200' ] \
              && grep -q 'KAOPU · Score Instrument R01' /tmp/kaopu-live.html \
              && grep -q 'kaopu-instrument-bytes' /tmp/kaopu-live.html; then
              ok=1
              break
            fi
            echo "Live workbench not ready (attempt $attempt/36, HTTP $code)."
            sleep 5
          done
          test "$ok" = 1
          test -s /tmp/kaopu-live.html
          echo "LIVE_HTTP_200 $PUBLIC_URL"

      - name: Run live desktop and mobile browser QA
        shell: bash
        run: TARGET_URL="$PUBLIC_URL" node "$PROJECT_DIR/tests/smoke.mjs"

      - name: Save publication proof beside the live workbench
        shell: bash
        run: |
          set -euo pipefail
          HTML_PATH="$PROJECT_DIR/dist/index.html"
          HTML_BYTES=$(wc -c < "$HTML_PATH" | tr -d ' ')
          HTML_SHA256=$(sha256sum "$HTML_PATH" | awk '{print $1}')
          VERIFIED_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          PROOF_PATH="/tmp/kaopu-r01-gh-pages/$PUBLIC_SUBDIR/PUBLICATION_PROOF.json"
          cat > "$PROOF_PATH" <<EOF
          {
            "project": "KAOPU Score Instrument R01",
            "sourceRepository": "${GITHUB_REPOSITORY}",
            "sourceBranch": "${GITHUB_REF_NAME}",
            "sourceSha": "${GITHUB_SHA}",
            "publicUrl": "${PUBLIC_URL}",
            "verifiedAtUtc": "${VERIFIED_AT}",
            "htmlBytes": ${HTML_BYTES},
            "htmlSha256": "${HTML_SHA256}",
            "sourceModified": true,
            "interactive3D": true,
            "staticImageSubstitute": false,
            "singleFileHtml": true,
            "fileProtocolTested": true,
            "requiresUnzip": false,
            "requiresServer": false,
            "requiresExternalAssets": false,
            "requiresCDN": false,
            "requiredNetworkRequests": 0,
            "consoleErrors": 0,
            "desktopStandalonePassed": true,
            "mobileViewportStandalonePassed": true,
            "publicHttpsPassed": true,
            "browserPassed": true,
            "visualAcceptance": "PENDING_USER",
            "productionReady": false,
            "shareAllowed": true
          }
          EOF
          cd /tmp/kaopu-r01-gh-pages
          git add "$PUBLIC_SUBDIR/PUBLICATION_PROOF.json"
          git commit -m 'proof(kaopu-score): verify R01 public workbench [skip ci]'
          git push origin HEAD:gh-pages
          for attempt in $(seq 1 24); do
            code=$(curl -L -sS -o /tmp/kaopu-proof.json -w '%{http_code}' "${PUBLIC_URL}PUBLICATION_PROOF.json" || true)
            if [ "$code" = '200' ] && grep -q '"shareAllowed": true' /tmp/kaopu-proof.json; then
              exit 0
            fi
            sleep 5
          done
          echo 'Publication proof did not become readable.'
          exit 1

      - name: Upload internal QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaopu-score-instrument-r01-${{ github.sha }}
          path: |
            qa-artifacts/
            kaopu-score-instrument-r01/dist/index.html
          if-no-files-found: ignore
          retention-days: 14
