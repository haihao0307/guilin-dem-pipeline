name: Publish KAOPU Score Instrument R01
on:
  push:
    branches: [work/kaopu-score-instrument-r01-20260929]
    paths: ['kaopu-score-instrument-r01/**', '.github/workflows/kaopu-score-instrument-r01.yml']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: kaopu-score-instrument-r01-publish
  cancel-in-progress: false
env:
  PROJECT_DIR: kaopu-score-instrument-r01
  PUBLIC_SUBDIR: kaopu-score-instrument/r01-20260929
  PUBLIC_URL: https://haihao0307.github.io/guilin-dem-pipeline/kaopu-score-instrument/r01-20260929/
jobs:
  build-publish-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install project dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm install --no-audit --no-fund
      - name: Instrument unit and regression tests
        run: node "$PROJECT_DIR/tests/unit.mjs" | tee unit-results.txt
      - name: Install real browser
        working-directory: ${{ env.PROJECT_DIR }}
        run: npx playwright install --with-deps chromium
      - name: Build standalone instrument
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm run build
      - name: Standalone desktop and mobile-viewport QA
        shell: bash
        run: |
          set -euo pipefail
          LOCAL_URL=$(node -e "console.log(require('node:url').pathToFileURL(process.argv[1]).href)" "$GITHUB_WORKSPACE/$PROJECT_DIR/dist/index.html")
          TARGET_URL="$LOCAL_URL" node "$PROJECT_DIR/tests/smoke.mjs"
      - name: Publish only isolated project path
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          git worktree add --detach /tmp/kaopu-pages origin/gh-pages
          TARGET="/tmp/kaopu-pages/$PUBLIC_SUBDIR"
          mkdir -p "$TARGET"
          cp "$PROJECT_DIR/dist/index.html" "$TARGET/index.html"
          cd /tmp/kaopu-pages
          git config user.name 'KAOPU Score Instrument CI'
          git config user.email 'kaopu-score-ci@users.noreply.github.com'
          git add "$PUBLIC_SUBDIR/index.html"
          if ! git diff --cached --quiet; then
            git commit -m 'publish(kaopu-score): K1.0.1 verified-output instrument [skip ci]'
            git push origin HEAD:gh-pages
          fi
      - name: Request Pages build when branch publishing is configured
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          type=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type' || echo unknown)
          echo "Pages build type: $type"
          if [ "$type" = legacy ]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --jq '.status' || echo 'Pages build request unavailable; exact public payload still required below.'
          fi
      - name: Verify exact live bytes, not a stale page with the same title
        shell: bash
        run: |
          set -euo pipefail
          expected=$(sha256sum "$PROJECT_DIR/dist/index.html" | awk '{print $1}')
          ok=0
          for attempt in $(seq 1 90); do
            code=$(curl --max-time 20 --location --silent --show-error -H 'Cache-Control: no-cache' -o /tmp/kaopu-live.html -w '%{http_code}' "$PUBLIC_URL" || true)
            actual=$(sha256sum /tmp/kaopu-live.html 2>/dev/null | awk '{print $1}' || true)
            if [ "$code" = 200 ] && [ "$actual" = "$expected" ]; then ok=1; break; fi
            echo "Waiting for exact build ($attempt/90), HTTP=$code actual=$actual expected=$expected"
            sleep 5
          done
          test "$ok" = 1
          echo "EXACT_PUBLIC_SHA256 $expected"
      - name: Live desktop and mobile-viewport QA
        run: TARGET_URL="$PUBLIC_URL" node "$PROJECT_DIR/tests/smoke.mjs"
      - name: Write exact-head publication proof
        shell: bash
        run: |
          set -euo pipefail
          export HTML_BYTES=$(wc -c < "$PROJECT_DIR/dist/index.html" | tr -d ' ')
          export HTML_SHA256=$(sha256sum "$PROJECT_DIR/dist/index.html" | awk '{print $1}')
          node --input-type=module <<'JS'
          import {writeFile,readFile} from 'node:fs/promises';
          const e=process.env;
          const standalone=JSON.parse(await readFile('qa-artifacts/standalone-results.json','utf8'));
          const live=JSON.parse(await readFile('qa-artifacts/public-results.json','utf8'));
          const proof={project:'KAOPU Score Instrument R01',instrumentVersion:'K1.0.1',sourceRepository:e.GITHUB_REPOSITORY,sourceBranch:e.GITHUB_REF_NAME,sourceSha:e.GITHUB_SHA,publicUrl:e.PUBLIC_URL,verifiedAtUtc:new Date().toISOString(),htmlBytes:Number(e.HTML_BYTES),htmlSha256:e.HTML_SHA256,exactPublicBytesMatched:true,sourceModified:true,interactive3D:true,staticImageSubstitute:false,singleFileHtml:true,fileProtocolTested:true,requiresExternalAssets:false,requiresCDN:false,requiredNetworkRequests:0,consoleErrors:0,desktopStandalonePassed:true,mobileViewportStandalonePassed:true,publicHttpsPassed:true,browserPassed:true,outputReplayByteComparison:true,equivalentScoresSameOutput:true,physicalMobileDeviceTested:false,pixelIdenticalAcrossGPUsClaimed:false,visualAcceptance:'PENDING_USER',productionReady:false,shareAllowed:true,standalone,live};
          await writeFile(`/tmp/kaopu-pages/${e.PUBLIC_SUBDIR}/PUBLICATION_PROOF.json`,JSON.stringify(proof,null,2)+'\n');
          JS
          cd /tmp/kaopu-pages
          git add "$PUBLIC_SUBDIR/PUBLICATION_PROOF.json"
          git commit -m 'proof(kaopu-score): exact-head K1.0.1 verification [skip ci]'
          git fetch origin gh-pages
          git rebase origin/gh-pages
          git push origin HEAD:gh-pages
          echo "VERIFIED_PUBLIC_WORKBENCH $PUBLIC_URL"
      - name: Upload internal evidence and standalone build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaopu-score-instrument-r01-${{ github.sha }}
          path: |
            unit-results.txt
            qa-artifacts/
            kaopu-score-instrument-r01/dist/index.html
            kaopu-score-instrument-r01/src/
            kaopu-score-instrument-r01/tests/
            kaopu-score-instrument-r01/scripts/
            kaopu-score-instrument-r01/package.json
          retention-days: 14
