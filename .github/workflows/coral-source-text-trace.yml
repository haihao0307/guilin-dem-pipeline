name: Coral original source text trace
on:
  push:
    branches: [work/coral-original-artifact-trace-20261003]
    paths: [.github/workflows/coral-source-text-trace.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: git fetch --no-tags origin '+refs/pull/*/head:refs/remotes/recovery-pr/*'
      - name: Inspect real source without a coral filename filter
        shell: python
        run: |
          import subprocess,re,json,hashlib
          from pathlib import Path
          O=Path('/tmp/source-text-trace');O.mkdir(exist_ok=True)
          report={'scope':'All reachable HTML/JS/MJS/TS/TXT/JSON/MD/GLSL/WGSL, no coral filename filter; strip long encoded tokens and decode Unicode escapes before matching','blobsRead':0,'bytesRead':0,'matches':[],'skipped':[],'errors':[],'productionChanged':False}
          objects=subprocess.check_output(['git','rev-list','--objects','--all'],text=True).splitlines()
          proc=subprocess.Popen(['git','cat-file','--batch'],stdin=subprocess.PIPE,stdout=subprocess.PIPE)
          terms=['沿着生长','指根浅脊','大形保留','老师完整源码','BLUE CORAL','COLOR CORAL','Coral.kaopu','BLUE_CORAL','COLOR_CORAL']
          for line in objects:
              q=line.split(' ',1)
              if len(q)!=2:continue
              sha,path=q
              if Path(path.lower()).suffix not in ['.html','.htm','.js','.mjs','.ts','.txt','.json','.md','.glsl','.wgsl']:continue
              proc.stdin.write((sha+'\n').encode());proc.stdin.flush();header=proc.stdout.readline().decode().split()
              if len(header)!=3:continue
              size=int(header[2]);b=proc.stdout.read(size);proc.stdout.read(1);report['blobsRead']+=1;report['bytesRead']+=size
              if size>120_000_000:report['skipped'].append([sha,path,size]);continue
              try:t=b.decode('utf8')
              except UnicodeDecodeError:continue
              t=re.sub(r'[A-Za-z0-9+/_=-]{250,}','<ENCODED_DATA>',t)
              t=re.sub(r'\\u([a-fA-F0-9]{4})',lambda m:chr(int(m.group(1),16)),t)
              t=re.sub(r'\\x([a-fA-F0-9]{2})',lambda m:chr(int(m.group(1),16)),t)
              hits=[s for s in terms if s.lower() in t.lower()]
              key=bool(re.search(r'(?i)(?:blue[\s_-]*coral|color[\s_-]*coral|coral[\s_-]*color)',t))
              version=bool(re.search(r'(?i)(?<![a-z0-9])r\s*[0_-]?4[01](?![a-z0-9])',t))
              if not hits and not(key and version):continue
              row={'path':path,'blob':sha,'bytes':size,'hits':hits,'r40or41':version,'title':re.findall(r'<title[^>]*>(.*?)</title>',t,re.S|re.I)[:5],'webglCalls':len(re.findall(r'(?i)drawarrays|drawelements|webglrenderer',t)),'sha256':hashlib.sha256(b).hexdigest()}
              row['contexts']=[t[max(0,m.start()-140):m.end()+180] for m in list(re.finditer(r'(?i)r[ _-]?0?4[01]|指根浅脊|沿着生长|大形保留|老师完整源码',t))[:15]]
              report['matches'].append(row)
              if any(s in hits for s in ['沿着生长','指根浅脊','大形保留','老师完整源码']) or (key and version):
                  (O/(sha+Path(path).suffix)).write_bytes(b)
          proc.stdin.close();proc.wait()
          (O/'REPORT.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          print(json.dumps({k:v for k,v in report.items() if k not in ['matches']},ensure_ascii=False))
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coral-original-source-text-trace
          path: /tmp/source-text-trace/
          retention-days: 30
