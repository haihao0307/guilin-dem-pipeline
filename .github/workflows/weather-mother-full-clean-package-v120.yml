name: Weather Mother full clean package V1.2.0

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/weather-mother-full-clean-package-v120.yml
      - .github/scripts/weather_mother_full_clean_package_v120.py
      - .github/scripts/weather_mother_finalize_clean_package_v120.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weather-mother-full-clean-package-v120
  cancel-in-progress: false

jobs:
  clean-package-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout controller
        uses: actions/checkout@v4
        with:
          ref: main
          path: controller

      - name: Checkout publication branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
          fetch-depth: 0

      - name: Build clean package
        run: python controller/.github/scripts/weather_mother_full_clean_package_v120.py site

      - name: Synchronize clean documentation and archive
        run: python controller/.github/scripts/weather_mother_finalize_clean_package_v120.py site

      - name: Verify clean result
        shell: bash
        run: |
          set -euo pipefail
          test -f site/weather-mother/liquid-rain-v100/index.html
          test -f site/weather-mother/v110-full/index.html
          test -f site/weather-mother/studio-v060/index.html
          test -f site/weather-mother/handoffs/Weather_Mother_Full_Clean_Handoff_2026-09-03_V1.2.0.zip
          test -f site/weather-mother/handoffs/Weather_Mother_Full_Clean_Handoff_2026-09-03_V1.2.0.receipt.json
          grep -q '../liquid-rain-v100/' site/weather-mother/studio-v060/index.html
          grep -q 'liquid-rain-v100' site/weather-mother/README.md
          for path in \
            site/weather-mother/easy-rain-lab-v010 \
            site/weather-mother/rain-puddle-study-v010 \
            site/weather-mother/rain-puddle-study-v020 \
            site/weather-mother/rain-puddle-study-v030 \
            site/weather-mother/rain-v020 \
            site/weather-mother/rain-v030 \
            site/weather-mother/rain-v040 \
            site/weather-mother/studio-v040; do
            test ! -e "$path"
          done
          python - <<'PY'
          import json
          import zipfile
          from pathlib import Path

          package_name = 'Weather_Mother_Full_Clean_Handoff_2026-09-03_V1.2.0'
          archive = Path('site/weather-mother/handoffs') / f'{package_name}.zip'
          receipt = Path('site/weather-mother/handoffs') / f'{package_name}.receipt.json'
          with zipfile.ZipFile(archive) as package:
              assert package.testzip() is None
              names = package.namelist()
              forbidden = (
                  'easy-rain-lab-v010',
                  'rain-puddle-study-v010',
                  'rain-puddle-study-v020',
                  'rain-puddle-study-v030',
                  'rain-v020',
                  'rain-v030',
                  'rain-v040',
                  'studio-v040',
              )
              assert not [name for name in names if any(token in name for token in forbidden)]
              internal_readme = package.read(f'{package_name}/web/weather-mother/README.md').decode('utf-8')
              assert 'liquid-rain-v100' in internal_readme
              assert '旧平面村落' in internal_readme
          data = json.loads(receipt.read_text(encoding='utf-8'))
          assert data['archiveIntegrityVerified'] is True
          assert data['cleanupApplied'] is True
          assert data['legacyRainRouteCount'] == 0
          assert data['documentationSynchronized'] is True
          print(json.dumps(data, ensure_ascii=False, indent=2))
          PY

      - name: Commit and push publication branch
        working-directory: site
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Weather Mother clean packager'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A weather-mother
          if git diff --cached --quiet; then
            echo 'No Weather Mother changes to publish.'
            exit 0
          fi
          git commit -m 'release(weather-mother): publish synchronized full clean handoff V1.2.0'
          for attempt in 1 2 3; do
            git fetch origin gh-pages
            if git rebase origin/gh-pages && git push origin HEAD:gh-pages; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 4))
          done
          echo 'Failed to push gh-pages after three attempts.' >&2
          exit 1
