name: Head procedural R01 frozen-host probe
on:
  push:
    branches: [research/head-procedural-skin-r01-20261014]
    paths: ['.github/workflows/head-procedural-skin-r01-probe.yml']
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - name: Read-only native host capture
        run: |
          mkdir -p evidence
          cat > probe.cjs <<'JS'
          const {chromium}=require('playwright'),fs=require('fs');
          (async()=>{
            const b=await chromium.launch({headless:true,args:['--no-sandbox','--use-angle=swiftshader','--enable-unsafe-swiftshader']});
            const c=await b.newContext({viewport:{width:1200,height:900},recordHar:{path:'evidence/native.har',content:'embed',mode:'full'}}),p=await c.newPage();
            const report={source:'f5017cb7cb9c2024df6a08328564c3f4ae502509',errors:[],requests:[]};
            p.on('pageerror',e=>report.errors.push(String(e)));p.on('console',m=>{if(m.type()==='error')report.errors.push(m.text())});
            try{
              await p.goto('https://htmlpreview.github.io/?https://raw.githubusercontent.com/haihao0307/guilin-dem-pipeline/f5017cb7cb9c2024df6a08328564c3f4ae502509/kaopu-unified-human-workbench/human-integrated-r06/preview.html',{waitUntil:'domcontentloaded',timeout:90000});
              await p.waitForFunction(()=>window.__LIP_P3__?.ready,{},{timeout:240000});
              await p.evaluate(()=>headMorphology.view('oblique'));
              const cd=await c.newCDPSession(p);const shot=await cd.send('Page.captureScreenshot',{format:'png',captureBeyondViewport:false});fs.writeFileSync('evidence/native.png',Buffer.from(shot.data,'base64'));
              report.native=await p.evaluate(()=>{const v=__IDENTITY_QA__.viewer(),m=__IDENTITY_QA__.model(),g=v.geometry,gl=v.renderer.getContext();const attrs={};for(const[k,a]of Object.entries(g.attributes)){let min=Array(a.itemSize).fill(Infinity),max=min.map(()=>-Infinity);for(let i=0;i<a.count;i++)for(let j=0;j<a.itemSize;j++){min[j]=Math.min(min[j],a.array[i*a.itemSize+j]);max[j]=Math.max(max[j],a.array[i*a.itemSize+j]);}attrs[k]={count:a.count,size:a.itemSize,min,max};}return{viewerKeys:Object.keys(v),attributes:attrs,groups:g.groups,indexCount:g.index.count,skin:v.skin.report(),material:v.skin.material.type,lights:v.scene.children.filter(o=>o.isLight).map(o=>({type:o.type,intensity:o.intensity,color:o.color.toArray(),position:o.position.toArray()})),maxTextures:gl.getParameter(gl.MAX_TEXTURE_IMAGE_UNITS),modelBodyCount:m.bodyCount,report:unifiedHuman.report()}});
              fs.writeFileSync('evidence/dom.html',await p.content());
              const dump=await p.evaluate(()=>{const v=__IDENTITY_QA__.viewer(),g=v.geometry;let a={};for(const k of ['position','normal','fRest','fA','fB','csRest','csRegion','csExtra','csType','eOwned','eTissue','l19State','l19Detail','fEye']){const t=g.attributes[k];if(t)a[k]={size:t.itemSize,values:Array.from(t.array)}}return{attributes:a,index:Array.from(g.index.array),camera:v.camera.toJSON(),matrix:v.mesh.matrix.toArray()}});
              fs.writeFileSync('evidence/geometry.json',JSON.stringify(dump));
              report.success=true;
            }catch(e){report.failure=String(e);process.exitCode=1;}finally{fs.writeFileSync('evidence/report.json',JSON.stringify(report,null,2));await c.close();await b.close();}
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
          node probe.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: head-procedural-r01-native-probe
          path: evidence/
          retention-days: 7
