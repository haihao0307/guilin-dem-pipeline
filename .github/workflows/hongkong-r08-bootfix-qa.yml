name: Hong Kong R08 startup recovery QA
on:
  push:
    branches: ['trial/hongkong-r08-bootfix-20261021']
    paths:
      - 'kaopu-geography-workbench/hong-kong-main-city-r08/tests/bootfix-r01/**'
      - '.github/workflows/hongkong-r08-bootfix-qa.yml'
permissions:
  contents: read
concurrency:
  group: hongkong-r08-bootfix-${{ github.ref }}
  cancel-in-progress: false
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            kaopu-geography-workbench/hong-kong-main-city-r08/tests/bootfix-r01
      - name: Install pinned browser dependencies
        run: |
          python -m pip install playwright==1.57.0 pillow==12.0.0
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Validate same-quality R08 startup and original driving
        run: python -u kaopu-geography-workbench/hong-kong-main-city-r08/tests/bootfix-r01/profile-r08.py kaopu-geography-workbench/hong-kong-main-city-r08/tests/bootfix-r01/candidate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: hongkong-r08-bootfix-${{ github.sha }}
          path: /tmp/r08-evidence/
          if-no-files-found: warn
          retention-days: 1
