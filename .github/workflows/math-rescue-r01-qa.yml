name: Math rescue R01 playable verification
on:
  push:
    branches: [qa/math-rescue-r01-20261009]
permissions:
  contents: read
jobs:
  play:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: kaopu-minigame-workbench/experiments/math-rescue-r01
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: kaopu-minigame-workbench/experiments/math-rescue-r01
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: |
          npx playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - run: npm test
      - run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/rescue-server.log 2>&1 &
          sleep 2
          node tests/browser.cjs
          node tests/capture.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: math-rescue-r01-${{ github.sha }}
          path: kaopu-minigame-workbench/experiments/math-rescue-r01/evidence/
