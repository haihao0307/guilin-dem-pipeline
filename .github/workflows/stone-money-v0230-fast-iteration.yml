name: Stone Money V0230 rapid iteration
on:
  push:
    branches: [work/stone-money-island-v0230-fast-iteration-20260919]
    paths:
      - .github/workflows/stone-money-v0230-fast-iteration.yml
      - games/survivor-palau/source/v0200/**
permissions:
  contents: write
concurrency:
  group: stone-money-v0230-fast-iteration
  cancel-in-progress: true
jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/stone-money-island-v0230-fast-iteration-20260919
      - name: Build V0.2.3
        run: python games/survivor-palau/source/v0200/build_v023.py
      - name: Verify requested relations
        run: python games/survivor-palau/source/v0200/verify_v023_relations.py
      - name: Browser QA desktop and 390x844
        run: |
          python -m pip install playwright pillow
          python -m playwright install --with-deps chromium
          timeout 780s python -u games/survivor-palau/source/v0200/verify_v023_browser.py
      - name: Preserve runtime and receipts
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add games/survivor-palau/releases/v0.2.3
          git diff --cached --quiet || git commit -m 'build(stone-money): record V0.2.3 rapid iteration evidence'
          git pull --rebase origin work/stone-money-island-v0230-fast-iteration-20260919
          git push origin HEAD:work/stone-money-island-v0230-fast-iteration-20260919
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stone-money-v0230-rapid-iteration
          path: |
            games/survivor-palau/releases/v0.2.3/
            /tmp/stone-money-v0230-qa/
          if-no-files-found: error
