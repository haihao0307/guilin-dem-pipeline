name: Stone Money fish wet-domain regression
on:
  push:
    branches: [fix/stone-money-island-fish-retreat-20260918]
    paths:
      - .github/workflows/stone-money-fish-retreat.yml
      - games/survivor-palau/source/v0200/**
permissions:
  contents: write
concurrency:
  group: stone-money-fish-retreat
  cancel-in-progress: true
jobs:
  fish-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Build and exercise deterministic navigation
        run: |
          node games/survivor-palau/source/v0200/fish_wet_navigation.test.cjs
          python games/survivor-palau/source/v0200/build.py
      - name: Exercise actual island in desktop and touch Chromium
        run: |
          python -m pip install playwright
          command -v google-chrome
          timeout 660s python -u games/survivor-palau/source/v0200/verify_fish_browser.py
      - name: Retain bounded regression evidence on the review branch
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if test -f /tmp/smi-fish-qa/REPORT.json; then
            cp /tmp/smi-fish-qa/REPORT.json games/survivor-palau/releases/v0.2.1/FISH_BROWSER_QA.json
          fi
          git add games/survivor-palau/releases/v0.2.1
          if ! git diff --cached --quiet; then
            git commit -m 'test(palau): record actual fish integration outcome'
            git pull --rebase origin fix/stone-money-island-fish-retreat-20260918
            git push origin HEAD:fix/stone-money-island-fish-retreat-20260918
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stone-money-fish-regression
          path: /tmp/smi-fish-qa/
