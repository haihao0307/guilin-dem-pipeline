name: Build and verify Weather Mother R25 mobile cloud occlusion

on:
  push:
    branches:
      - feature/weather-mother-r25-mobile-cloud-occlusion-20260911
    paths:
      - weather-mother/r25-mobile-cloud-occlusion-src/**
      - .github/workflows/build-verify-weather-r25-mobile-cloud-occlusion.yml

permissions:
  contents: write

concurrency:
  group: weather-mother-r25-mobile-cloud-occlusion
  cancel-in-progress: false

jobs:
  public-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build R25 from frozen R22 plus proven R23 cloud path
        shell: bash
        run: |
          set -euo pipefail
          python3 weather-mother/r25-mobile-cloud-occlusion-src/build-r25.py
          OUT=weather-mother/full-weather-r25-mobile-cloud-occlusion-20260911/index.html
          test -s "$OUT"
          grep -q 'Weather Mother · 完整天气恢复 R22' "$OUT"
          grep -q 'weather-mother-r25-mobile-cloud-occlusion' "$OUT"
          grep -q 'OPTICAL OCCLUSION' "$OUT"
          grep -q 'cpu-mirror-beer-lambert' "$OUT"
          ! grep -q 'createFramebuffer' weather-mother/r25-mobile-cloud-occlusion-src/aircraft-cloud-occlusion.js

      - name: Freeze page commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Weather Mother CI'
          git config user.email 'weather-mother-ci@users.noreply.github.com'
          git add weather-mother/full-weather-r25-mobile-cloud-occlusion-20260911/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'build(weather-mother): R25 mobile cloud occlusion candidate [skip ci]'
            git push origin HEAD:feature/weather-mother-r25-mobile-cloud-occlusion-20260911
          fi
          PAGE_SHA=$(git rev-parse HEAD)
          PUBLIC_URL="https://raw.githack.com/haihao0307/guilin-dem-pipeline/$PAGE_SHA/weather-mother/full-weather-r25-mobile-cloud-occlusion-20260911/index.html"
          echo "PAGE_SHA=$PAGE_SHA" >> "$GITHUB_ENV"
          echo "PUBLIC_URL=$PUBLIC_URL" >> "$GITHUB_ENV"

      - name: Wait for immutable public page
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 40); do
            code=$(curl -L -sS -o /tmp/r25.html -w '%{http_code}' --connect-timeout 10 --max-time 45 "$PUBLIC_URL?probe=$attempt" || true)
            if [ "$code" = 200 ] && grep -q 'weather-mother-r25-mobile-cloud-occlusion' /tmp/r25.html; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = 1
          echo "fixed public R25 is live: $PUBLIC_URL"

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install playwright==1.55.0 >/dev/null
          python3 -m playwright install chromium >/dev/null

      - name: Verify optical attenuation cloud invariant flight input and mobile layout
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a python3 -u weather-mother/r25-mobile-cloud-occlusion-src/qa-public-r25.py

      - name: Commit public evidence
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p weather-mother/full-weather-r25-mobile-cloud-occlusion-20260911
          cat > weather-mother/full-weather-r25-mobile-cloud-occlusion-20260911/PUBLICATION_PROOF.json <<JSON
          {
            "schema": "weather-mother-r25-mobile-cloud-occlusion-publication-proof/1",
            "pageCommit": "$PAGE_SHA",
            "url": "$PUBLIC_URL",
            "baseR22Commit": "8aeb8dac519f8bda851cfc998e07266870d3eaef",
            "acceptedR21CoreCommit": "d6796df38a2cb872f58ff1f8ce72b5f36d8d2322",
            "provenR23CloudPageCommit": "001a9e3dc028b3a7719ff8ab96bacdd7b8b1cac8",
            "r24EvidenceCommit": "9466cce7ea0c0ad38b24324aa9ea2800872c99c5",
            "publicBrowser390x844": true,
            "cloudVisibilityInvariant": true,
            "aircraftOpticalOcclusion": true,
            "depthFramebufferUsed": false,
            "sharedDepth": false,
            "flightInputChangedState": true,
            "silverSeaSwitch": true,
            "realIPhoneAcceptance": false,
            "productionReady": false
          }
          JSON
          git config user.name 'Weather Mother CI'
          git config user.email 'weather-mother-ci@users.noreply.github.com'
          git add weather-mother/full-weather-r25-mobile-cloud-occlusion-20260911/PUBLIC_QA_MOBILE_CLOUD_OCCLUSION_2026-09-11.json weather-mother/full-weather-r25-mobile-cloud-occlusion-20260911/PUBLIC_R25_MOBILE_CLOUD_OCCLUSION_390x844.png weather-mother/full-weather-r25-mobile-cloud-occlusion-20260911/PUBLICATION_PROOF.json
          git commit -m 'qa(weather-mother): prove R25 mobile cloud occlusion publicly [skip ci]'
          git push origin HEAD:feature/weather-mother-r25-mobile-cloud-occlusion-20260911
