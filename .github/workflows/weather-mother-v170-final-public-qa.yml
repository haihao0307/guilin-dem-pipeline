name: Weather Mother V1.7 final public QA
on:
  push:
    branches: [gh-pages]
    paths:
      - '.github/workflows/weather-mother-v170-final-public-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install browser tools
        run: |
          python3 -m pip install playwright==1.51.0
          python3 -m playwright install --with-deps chromium
      - name: Verify converged public Weather Mother V1.7
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          cat > /tmp/qa.py <<'PY'
          import json,os,time,urllib.request
          from playwright.sync_api import sync_playwright
          base='https://haihao0307.github.io/guilin-dem-pipeline/weather-mother/'
          sha=os.environ['SOURCE_SHA']
          def read(path):
              sep='&' if '?' in path else '?'
              req=urllib.request.Request(base+path+sep+'qa='+sha+'&t='+str(time.time_ns()),headers={'Cache-Control':'no-cache','Pragma':'no-cache'})
              with urllib.request.urlopen(req,timeout=25) as r:
                  assert r.status==200,(path,r.status)
                  return r.read()
          ready=False;last=''
          for _ in range(48):
              try:
                  root=read('');loader=read('studio-v070/index.html')
                  sm=json.loads(read('studio-v070/MANIFEST.json'))
                  p0=read('studio-v070/payload-00.txt');p1=read('studio-v070/payload-01.txt')
                  rloader=read('liquid-rain-v130/index.html');rm=json.loads(read('liquid-rain-v130/MANIFEST.json'))
                  rp=[read('liquid-rain-v130/patch-%02d.txt'%i) for i in range(3)]
                  ready=(b'studio-v070' in root and b'for(const c of m.chunks)' in loader and sm.get('version')=='0.7.0-liquid-glass-hierarchy-v3' and [len(p0),len(p1)]==[4000,4040] and b'patchChunks' in rloader and rm.get('version')=='1.3.0-liquid-glass-ground-material-candidate' and list(map(len,rp))==[8000,8000,6532])
                  if ready: break
                  last=str((len(root),len(loader),sm.get('version'),len(p0),len(p1),len(rloader),rm.get('version'),list(map(len,rp))))
              except Exception as e: last=repr(e)
              time.sleep(5)
          assert ready,'public resources did not converge: '+last
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=['--no-sandbox','--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader'])
              page=browser.new_page(viewport={'width':720,'height':480})
              errors=[];failed=[]
              page.on('pageerror',lambda e:errors.append(str(e)))
              page.on('console',lambda m:errors.append(m.text) if m.type=='error' else None)
              page.on('requestfailed',lambda r:failed.append(r.url))
              page.add_init_script("window.WeatherMotherBoot={quality:'low',still:true,weather:'fair'}")
              page.goto(base+'?qa='+sha+'&t='+str(time.time_ns()),wait_until='domcontentloaded',timeout=50000)
              page.wait_for_url('**/studio-v070/**',timeout=30000)
              page.wait_for_function("window.__WEATHER_MOTHER_STUDIO__?.version==='0.7.0-liquid-glass-hierarchy-v3'",timeout=60000)
              page.wait_for_function("document.querySelector('#stage')?.contentWindow?.WeatherMother?.qa?.ready",timeout=90000)
              shell=page.evaluate('__WEATHER_MOTHER_STUDIO__.getState()')
              world=page.evaluate("document.querySelector('#stage').contentWindow.WeatherMother.qa")
              assert shell=={'module':'world','menuOpen':False,'level':'root'}
              assert world['ready'] and world['lastGLerror']==0 and not world['errors']
              assert page.locator('.top').count()==0 and page.locator('#launcher').is_visible()
              page.locator('#launcher').click();page.wait_for_function('__WEATHER_MOTHER_STUDIO__.getState().menuOpen')
              assert page.locator('#rootPage .menu-item').count()==6
              page.locator('[data-child="rain"]').click();page.wait_for_function("__WEATHER_MOTHER_STUDIO__.getState().level==='rain'")
              assert page.locator('#rainPage .menu-item').count()==1
              page.locator('[data-child="liquid"]').click();page.wait_for_function("__WEATHER_MOTHER_STUDIO__.getState().level==='liquid'")
              assert page.locator('#liquidPage .menu-item').count()==6
              page.locator('[data-rain-section="glass"]').click()
              page.wait_for_function("document.querySelector('#stage')?.contentWindow?.WeatherLiquid?.getState()?.frames>0",timeout=120000)
              page.wait_for_function("document.querySelector('#stage')?.contentWindow?.WeatherLiquidUI?.getSection?.()==='glass'",timeout=30000)
              rain=page.evaluate("""()=>{const w=document.querySelector('#stage').contentWindow,d=document.querySelector('#stage').contentDocument,a=w.WeatherLiquid;a.stop();for(const [id,v] of [['glassIor','1.57'],['flowScale','1.45'],['roofFlowScale','1.30'],['brickAbsorptionScale','1.40'],['puddleThreshold','0.80']]){const e=d.getElementById(id);e.value=v;e.dispatchEvent(new Event('input',{bubbles:true}))}const b=a.getReceiverState('glass-pavilion-front'),ok=a.injectExternalWater('glass-pavilion-front',.02,{producer:'actions-v170-final',revision:170701}),c=a.getReceiverState('glass-pavilion-front'),s=a.getState();return{version:a.version,groups:d.querySelectorAll('.group').length,sliders:d.querySelectorAll('input[type=range]').length,overflow:d.documentElement.scrollWidth-d.documentElement.clientWidth,ok,film:c.filmKg-b.filmKg,residual:s.residualKg,error:a.debug().error}}""")
              assert rain['version']=='1.3.0-liquid-glass-ground-material-candidate'
              assert rain['groups']==6 and rain['sliders']==38 and rain['overflow']==0
              assert rain['ok'] and rain['film']>0 and abs(rain['residual'])<1e-8 and rain['error']==0
              assert not errors and not failed,(errors,failed)
              mobile=browser.new_page(viewport={'width':390,'height':844})
              merr=[];mfail=[]
              mobile.on('pageerror',lambda e:merr.append(str(e)))
              mobile.on('console',lambda m:merr.append(m.text) if m.type=='error' else None)
              mobile.on('requestfailed',lambda r:mfail.append(r.url))
              mobile.add_init_script("window.WeatherMotherBoot={quality:'low',still:true,weather:'fair'}")
              mobile.goto(base+'?mobile='+sha+'&t='+str(time.time_ns()),wait_until='domcontentloaded',timeout=50000)
              mobile.wait_for_url('**/studio-v070/**',timeout=30000)
              mobile.wait_for_function("window.__WEATHER_MOTHER_STUDIO__?.getState?.().module==='world'",timeout=60000)
              state=mobile.evaluate('__WEATHER_MOTHER_STUDIO__.getState()');box=mobile.locator('#launcher').bounding_box()
              assert state['module']=='world' and not state['menuOpen'] and round(box['width'])==44 and round(box['height'])==44
              mobile.locator('#launcher').click();mobile.wait_for_function('__WEATHER_MOTHER_STUDIO__.getState().menuOpen')
              menu=mobile.locator('#menu').bounding_box()
              assert menu['width']<=374 and mobile.evaluate('document.documentElement.scrollWidth-document.documentElement.clientWidth')==0
              assert not merr and not mfail,(merr,mfail)
              browser.close()
          print('Weather Mother V1.7 public browser checks passed')
          PY
          xvfb-run -a python3 -u /tmp/qa.py
