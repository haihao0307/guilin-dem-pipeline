name: farmland-r045-round73-qa
on:
  push:
    branches: [restart/farmland-object-dna-v020-20260907]
    paths:
      - 'farmland-object-dna/research/r045-autonomous-rebuild/round-73/r045_round73_kernel.mjs'
      - 'farmland-object-dna/research/r045-autonomous-rebuild/round-73/r045_round73_qa.mjs'
      - 'farmland-object-dna/research/r045-autonomous-rebuild/round-73/r045_round73_build_audit_cache.mjs'
      - 'farmland-object-dna/research/r045-autonomous-rebuild/round-73/r045_round73_audit.html'
      - '.github/workflows/farmland-r045-round73-qa.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  qa-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run R73 authoritative numeric QA
        id: numeric
        continue-on-error: true
        run: node farmland-object-dna/research/r045-autonomous-rebuild/round-73/r045_round73_qa.mjs
      - name: Build fixed-view audit cache
        if: always()
        run: node farmland-object-dna/research/r045-autonomous-rebuild/round-73/r045_round73_build_audit_cache.mjs
      - name: Real Chrome fixed-view startup and screenshot
        if: always()
        run: |
          set +e
          cd farmland-object-dna/research/r045-autonomous-rebuild/round-73
          python3 -m http.server 8000 >/tmp/r73-http.log 2>&1 & echo $! >/tmp/r73-http.pid
          sleep 1
          CHROME=/usr/bin/google-chrome
          timeout 30s $CHROME --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1400,900 --screenshot=r045_round73_fixed_view.png http://127.0.0.1:8000/r045_round73_audit.html
          SS=$?
          timeout 30s $CHROME --headless --no-sandbox --disable-gpu --dump-dom http://127.0.0.1:8000/r045_round73_audit.html > r045_round73_dom.html
          DOM=$?
          grep -q 'data-ready="true"' r045_round73_dom.html
          READY=$?
          BYTES=$(wc -c < r045_round73_fixed_view.png 2>/dev/null || echo 0)
          STARTUP=$([ $SS -eq 0 ] && [ $DOM -eq 0 ] && [ $BYTES -gt 10000 ] && echo true || echo false)
          ACCEPTED=$([ $SS -eq 0 ] && [ $DOM -eq 0 ] && [ $READY -eq 0 ] && [ $BYTES -gt 10000 ] && echo true || echo false)
          printf '{"source_sha":"%s","qa_contract":"R045.73-identity-clipped-full-carrier-ribbons-v1","chrome":"%s","screenshot_status":%d,"dom_status":%d,"ready_status":%d,"png_bytes":%d,"page_startup_passed":%s,"passed":%s}\n' "$GITHUB_SHA" "$CHROME" "$SS" "$DOM" "$READY" "$BYTES" "$STARTUP" "$ACCEPTED" > r045_round73_browser_result.json
          cat r045_round73_browser_result.json
          kill $(cat /tmp/r73-http.pid) 2>/dev/null || true
          [ $SS -eq 0 ] && [ $DOM -eq 0 ] && [ $BYTES -gt 10000 ]
      - name: Farmland contract validator smoke
        if: always()
        run: |
          set -euo pipefail
          python -m json.tool farmland-object-dna/QUALITY_GATES.json >/dev/null
          python farmland-object-dna/tools/validate_farmland_dna.py farmland-object-dna/examples/traditional-paddy-v002-research.json > /tmp/r73-farmland-validator.json
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('/tmp/r73-farmland-validator.json').read_text())
          assert data['ok'] is True
          assert data['mode']=='research'
          assert data['visualAcceptance'] is False
          assert data['productionReady'] is False
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: farmland-r045-round73-fixed-view
          path: |
            farmland-object-dna/research/r045-autonomous-rebuild/round-73/r045_round73_fixed_view.png
            farmland-object-dna/research/r045-autonomous-rebuild/round-73/r045_round73_qa_result.json
            farmland-object-dna/research/r045-autonomous-rebuild/round-73/r045_round73_browser_result.json
            farmland-object-dna/research/r045-autonomous-rebuild/round-73/r045_round73_audit_cache.mjs
          if-no-files-found: warn
      - name: Verify result provenance before persistence
        if: always()
        run: |
          node -e "const q=require('./farmland-object-dna/research/r045-autonomous-rebuild/round-73/r045_round73_qa_result.json'); if(q.sourceSha!==process.env.GITHUB_SHA||q.qaContract!=='R045.73-identity-clipped-full-carrier-ribbons-v1') process.exit(3); console.log('provenance ok',q.sourceSha,q.qaContract)"
          git fetch origin ${GITHUB_REF_NAME}
          REMOTE=$(git rev-parse origin/${GITHUB_REF_NAME})
          test "$REMOTE" = "$GITHUB_SHA" || { echo "branch moved from $GITHUB_SHA to $REMOTE; refusing stale evidence persistence"; exit 4; }
      - name: Persist machine and fixed-view evidence
        if: always()
        run: |
          git config user.name 'github-actions[bot]'; git config user.email '41898242+github-actions[bot]@users.noreply.github.com'
          git add farmland-object-dna/research/r045-autonomous-rebuild/round-73/r045_round73_qa_result.json farmland-object-dna/research/r045-autonomous-rebuild/round-73/r045_round73_browser_result.json farmland-object-dna/research/r045-autonomous-rebuild/round-73/r045_round73_audit_cache.mjs farmland-object-dna/research/r045-autonomous-rebuild/round-73/r045_round73_fixed_view.png || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'farmland R045.73 persist QA browser and fixed-view evidence [skip ci]'
          git push origin HEAD:${GITHUB_REF_NAME}
      - name: Require authoritative numeric and browser gates
        if: always()
        run: node -e "const fs=require('fs'),q=require('./farmland-object-dna/research/r045-autonomous-rebuild/round-73/r045_round73_qa_result.json');const p='./farmland-object-dna/research/r045-autonomous-rebuild/round-73/r045_round73_browser_result.json';const b=fs.existsSync(p)?require(p):{passed:false};if(q.sourceSha!==process.env.GITHUB_SHA||b.source_sha!==process.env.GITHUB_SHA||q.qaContract!=='R045.73-identity-clipped-full-carrier-ribbons-v1'||b.qa_contract!=='R045.73-identity-clipped-full-carrier-ribbons-v1'||!q.passed||!b.passed)process.exit(2);console.log(q.passedCount+'/'+q.gateCount+'; browser '+b.passed+'; source '+q.sourceSha)"
