name: Landscape R4 one-shot visual patch
on:
  push:
    branches:
      - feature/landscape-mother-field-graph-v002
    paths:
      - .github/workflows/landscape-r4-one-shot.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/landscape-mother-field-graph-v002
          fetch-depth: 1
      - name: Apply exact reviewed patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('workbenches/landscape-full-r4/index.html')
          s=p.read_text()
          assert hashlib.sha256(s.encode()).hexdigest()=='7ce88e1265d625c6197f8d023ee0abb0a15908f6877a9a0a1a317b74453279eb'
          old="float peakMacro(vec3 p,int id,out vec3 qout,out float Rout,out float Hout){vec4 d=peakData(id);vec3 q=peakLocal(p,id,d);qout=q;float H=d.z*(.90+.20*hash11(float(id)*4.2+2.)),R=d.w*(.91+.18*hash11(float(id)*6.6+5.));Rout=R;Hout=H;float t=sat(q.y/H);float shoulder=.08*sin(q.y*.17+float(id))+(.08+.10*(1.-uSteep))*sin(q.y*.39+float(id)*1.3);float profile=R*(1.-(.24+.36*uSteep)*t+.10*sin(t*PI*3.1+float(id))+.045*sin(q.x*.11+q.z*.07+q.y*.045+float(id)))+R*shoulder;float radial=length(q.xz*vec2(1.,.90+.18*hash11(float(id)+2.)));float side=radial-profile;float top=q.y-H+R*.08*sin(q.x*.16+q.z*.13+float(id));return max(side,max(top,-q.y));}\nfloat peakDetailed(float macro,vec3 q,int id,float R,float H){float field=macro;field+=uDetail*(.29*mmSignal(q,id,6)+.09*(n3(q*.26+float(id))-.5));field=max(field,-caveCutter(q,id,R,H)*uCave);field=max(field,-crackCutter(q,id,R,H));return field;}"
          new="float peakMacro(vec3 p,int id,out vec3 qout,out float Rout,out float Hout){vec4 d=peakData(id);vec3 q=peakLocal(p,id,d);qout=q;float H=d.z*(.90+.20*hash11(float(id)*4.2+2.)),R=d.w*(.91+.18*hash11(float(id)*6.6+5.));Rout=R;Hout=H;float t=sat(q.y/H),ang=atan(q.z,q.x);float shoulder=.10*sin(q.y*.14+float(id))+(.10+.12*(1.-uSteep))*sin(q.y*.34+float(id)*1.3);float angular=1.+.13*sin(ang*3.0+q.y*.055+float(id)*1.7)+.08*sin(ang*5.0-q.y*.081+float(id));float crown=1.-(.22+.39*uSteep)*t+.13*sin(t*PI*3.1+float(id))+.06*sin(t*PI*7.0+ang*2.0);float profile=R*crown*angular+R*shoulder;float radial=length(q.xz*vec2(1.,.88+.20*hash11(float(id)+2.)));float side=radial-profile;vec2 lobeCenter=vec2(sin(float(id)*1.7),cos(float(id)*1.1))*R*.30*(.35+.65*sin(t*PI));float lobe=length((q.xz-lobeCenter)*vec2(1.05,.92))-profile*.72;side=smin(side,lobe,R*.22);float top=q.y-H+R*(.07*sin(q.x*.17+q.z*.11+float(id))+.035*sin(ang*5.));float foot=-q.y-R*.10*sin(ang*2.+float(id));return max(side,max(top,foot));}\nfloat peakDetailed(float macro,vec3 q,int id,float R,float H){float field=macro;float mm=mmSignal(q,id,8);float pores=(n3(q*.56+float(id)*3.1)-.5)+.45*(n3(q*1.35-float(id)*2.2)-.5);field+=uDetail*(.46*mm+.13*pores);float cave=caveCutter(q,id,R,H)+(1.-uCave)*R*.72;field=max(field,-cave);field=max(field,-crackCutter(q,id,R,H));return field;}"
          assert old in s
          s=s.replace(old,new)
          s=s.replace("region:{cam:[66,38,86],tar:[0,15,1]},ground:{cam:[38,9,52],tar:[0,10,2]},cliff:{cam:[18,23,35],tar:[0,23,2]},micro:{cam:[7,20,18],tar:[0,20,1]}","region:{cam:[50,31,68],tar:[0,15,1]},ground:{cam:[32,8,44],tar:[0,10,2]},cliff:{cam:[15,22,30],tar:[0,23,2]},micro:{cam:[6,19,14],tar:[0,20,1]}")
          for a,b in [("a=vec3(.56,.60,.58);b=vec3(.88,.90,.82);c=vec3(1.00,.95,.78)","a=vec3(.42,.48,.47);b=vec3(.86,.91,.84);c=vec3(1.00,.96,.76)"),("a=vec3(.07,.095,.10);b=vec3(.25,.30,.30);c=vec3(.55,.57,.51)","a=vec3(.018,.030,.034);b=vec3(.20,.27,.29);c=vec3(.64,.67,.58)"),("a=vec3(.18,.17,.14);b=vec3(.48,.42,.31);c=vec3(.82,.72,.54)","a=vec3(.10,.085,.060);b=vec3(.50,.40,.25);c=vec3(.91,.74,.45)"),("a=vec3(.08,.10,.10);b=vec3(.40,.43,.38);c=vec3(.91,.88,.70)","a=vec3(.025,.040,.043);b=vec3(.36,.44,.40);c=vec3(.98,.91,.62)"),("vec3 light=amb+vec3(1.18,.98,.76)*nl*sh*1.65+vec3(.18,.25,.28)","vec3 light=amb+vec3(1.28,1.02,.72)*nl*sh*2.05+vec3(.16,.27,.32)"),("float fog=1.-exp(-t*.010);col=mix(col,vec3(.28,.43,.44),fog*.52);","float fog=1.-exp(-t*.008);col=mix(col,vec3(.25,.42,.44),fog*.38);"),("vec3 sky=mix(vec3(.055,.095,.11),vec3(.55,.72,.72),h);","vec3 sky=mix(vec3(.035,.075,.095),vec3(.61,.80,.80),h);")]:
              assert a in s
              s=s.replace(a,b)
          raw=s.encode()
          assert len(raw)==25431
          assert hashlib.sha256(raw).hexdigest()=='5cabdb7d1921d9666915f7a140ce2a3c7bf53f978ed9f72fac35a1c1d19f67b3'
          p.write_bytes(raw)
          PY
          git config user.name "Landscape Mother"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/landscape-r4-one-shot.yml
          git add workbenches/landscape-full-r4/index.html
          git commit -m "feat(landscape): strengthen R4 peak form, microscope detail and lighting"
          git push origin HEAD:feature/landscape-mother-field-graph-v002
