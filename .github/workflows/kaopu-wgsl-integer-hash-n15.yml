name: KAOPU WGSL integer hash runtime N15

on:
  workflow_dispatch:
  push:
    branches:
      - coordination/kaopu-learning-flywheel-r1-20260909
    paths:
      - docs/mother_coordination/kaopu_learning_flywheel_v1/PROBES/wgpu_integer_hash_n15/**
      - .github/workflows/kaopu-wgsl-integer-hash-n15.yml

permissions:
  contents: read

jobs:
  wgsl-wgpu-native-lavapipe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Mesa Vulkan software adapter
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools
          find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name '*.json' -print
          icd="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f \( -name '*lvp*.json' -o -name '*lavapipe*.json' \) | head -n1)"
          test -n "$icd"
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
          VK_ICD_FILENAMES="$icd" vulkaninfo --summary | tee /tmp/n15-vulkaninfo.txt
      - name: Execute pinned wgpu 29 WGSL vectors
        env:
          WGPU_BACKEND: vulkan
        working-directory: docs/mother_coordination/kaopu_learning_flywheel_v1/PROBES/wgpu_integer_hash_n15
        run: |
          cargo generate-lockfile
          cargo run --release --locked 2>/tmp/n15-wgpu-stderr.log | tee /tmp/wgpu_integer_hash_runtime_result_n15.json
          jq -e '.summary.status == "pass" and .exactMatch == true and (.hashes|length) == 12' /tmp/wgpu_integer_hash_runtime_result_n15.json
      - name: Preserve bounded evidence
        uses: actions/upload-artifact@v4
        with:
          name: kaopu-wgpu-native-wgsl-n15
          path: |
            /tmp/n15-vulkaninfo.txt
            /tmp/n15-wgpu-stderr.log
            /tmp/wgpu_integer_hash_runtime_result_n15.json
            docs/mother_coordination/kaopu_learning_flywheel_v1/PROBES/wgpu_integer_hash_n15/Cargo.lock
          if-no-files-found: error
