name: Brow Lash R03 closure recovery
on:
  push:
    branches: [fix/brow-lash-r03-closure-recovery-20261014]
    paths:
      - 'kaopu-unified-human-workbench/brow-lash-r03/**'
      - '.github/workflows/brow-lash-r03.yml'
permissions:
  contents: write
concurrency:
  group: brow-lash-r03
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_PATH: /tmp/bl-r03-tools/node_modules
      BL_DIR: kaopu-unified-human-workbench/brow-lash-r03
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /kaopu-unified-human-workbench/brow-lash-r01/
            /kaopu-unified-human-workbench/brow-lash-r02/
            /kaopu-unified-human-workbench/brow-lash-r03/
            /kaopu-unified-human-workbench/human-integrated-r06/preview.html
            /kaopu-unified-human-workbench/full/source/registration-vendor/
            /kaopu-unified-human-workbench/vendor/
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned test tools
        run: |
          npm install --prefix /tmp/bl-r03-tools esbuild@0.25.9 playwright@1.57.0
          /tmp/bl-r03-tools/node_modules/.bin/playwright install --with-deps chromium
      - name: Build and unit checks
        run: |
          node "$BL_DIR/test.mjs" > "$BL_DIR/UNIT_QA.json"
          SOURCE_SHA=${{ github.sha }} node "$BL_DIR/build.cjs"
      - name: Candidate closure and real-image comparisons
        env:
          QA_MODE: smoke
          QA_OUT: kaopu-unified-human-workbench/brow-lash-r03/acceptance/candidate
        run: node "$BL_DIR/verify.cjs"
      - name: Early actual images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brow-lash-r03-early
          path: kaopu-unified-human-workbench/brow-lash-r03/
          retention-days: 14
      - name: Publish fixed research snapshot only
        run: |
          git config user.name 'KAOPU Workbench Builder'
          git config user.email 'kaopu-builder@users.noreply.github.com'
          git add "$BL_DIR/preview.html" "$BL_DIR/BUILD_MANIFEST.json" "$BL_DIR/UNIT_QA.json" "$BL_DIR/"*.adapted.txt
          git commit -m 'build(brow-lash-r03): closure-tested immutable candidate [skip ci]'
          git push origin HEAD:fix/brow-lash-r03-closure-recovery-20261014
          BUILD_SHA=$(git rev-parse HEAD)
          echo "BUILD_SHA=$BUILD_SHA" >> "$GITHUB_ENV"
          echo "PREVIEW_URL=https://htmlpreview.github.io/?https://raw.githubusercontent.com/haihao0307/guilin-dem-pipeline/$BUILD_SHA/$BL_DIR/preview.html" >> "$GITHUB_ENV"
      - name: Exact public page controls and closure verification
        env:
          QA_MODE: full
          QA_OUT: kaopu-unified-human-workbench/brow-lash-r03/acceptance/public
        run: node "$BL_DIR/verify.cjs"
      - name: Preserve final receipt and evidence
        run: |
          node - <<'NODE'
          const fs=require('fs'),dir=process.env.BL_DIR,q=JSON.parse(fs.readFileSync(dir+'/acceptance/public/qa.json'));if(!q.completed)throw Error('Public QA incomplete');const receipt={version:'BROW-LASH-R03',sourceCommit:process.env.GITHUB_SHA,buildCommit:process.env.BUILD_SHA,preview:process.env.PREVIEW_URL,workflowRun:process.env.GITHUB_RUN_ID,checks:q.checks.length,screens:q.screens.length,publicRuntimeVerified:true,userVisualAccepted:false,filmQualityAccepted:false,consumerGPUCertified:false,physicalPhone:false};fs.writeFileSync(dir+'/DELIVERY.json',JSON.stringify(receipt,null,2));
          NODE
          git add "$BL_DIR/acceptance" "$BL_DIR/DELIVERY.json"
          git commit -m 'test(brow-lash-r03): preserve exact-public recovery evidence [skip ci]'
          git push origin HEAD:fix/brow-lash-r03-closure-recovery-20261014
      - name: Complete evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brow-lash-r03-full
          path: kaopu-unified-human-workbench/brow-lash-r03/
          if-no-files-found: error
          retention-days: 14
