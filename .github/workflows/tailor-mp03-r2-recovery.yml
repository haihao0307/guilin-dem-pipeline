name: MP03 R2 recovery audit
on:
  push:
    branches: [fix/tailor-mp03-r2-recovery-20261013]
    paths: ['.github/workflows/tailor-mp03-r2-recovery.yml', 'kaopu-tailor-workbench/material-products/r03-r2/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mp03-r2-recovery
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            .github
            kaopu-tailor-workbench/material-products
            kaopu-tailor-workbench/presets/r04/assets
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recover source, native fixtures and existing browser evidence
        run: |
          python kaopu-tailor-workbench/material-products/r03/bootstrap.py
          mkdir -p /tmp/mp03-recovery
          cp -a kaopu-tailor-workbench/material-products/r03 /tmp/mp03-recovery/r03
          cp kaopu-tailor-workbench/presets/r04/assets/common-body.json /tmp/mp03-recovery/
          printf '%s\n' "$GITHUB_SHA" > /tmp/mp03-recovery/SOURCE_COMMIT.txt
          git fetch origin gh-pages --depth=1
          P=kaopu-tailor-workbench/presets/r0434-8c8245dd87e5/person-core
          mkdir -p /tmp/frozen-core
          git archive origin/gh-pages "$P" | tar -x -C /tmp/frozen-core
          cp -a "/tmp/frozen-core/$P" /tmp/mp03-recovery/person-core
          E=kaopu-tailor-workbench/material-products/mp03-r1-fbbef8bc7df2
          git archive origin/gh-pages "$E/local-release-evidence" "$E/BROWSER_REPORT.json" | tar -x -C /tmp/frozen-core
          cp -a "/tmp/frozen-core/$E/local-release-evidence" /tmp/mp03-recovery/r1-images
          cp "/tmp/frozen-core/$E/BROWSER_REPORT.json" /tmp/mp03-recovery/R1_BROWSER_REPORT.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mp03-r2-recovery-source
          path: /tmp/mp03-recovery
          retention-days: 7
