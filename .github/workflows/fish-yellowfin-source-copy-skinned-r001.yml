name: Fish Mother Yellowfin Source Copy Skinned R001

on:
  workflow_dispatch:
  push:
    branches:
      - work/ocean-life-fish-mother-yellowfin-source-copy-r001-20260921
    paths:
      - .github/workflows/fish-yellowfin-source-copy-skinned-r001.yml
      - apps/ocean-life-mother/fish-mother/yellowfin-source-copy-r001/tools/build_source_copy_skinned.py
      - apps/ocean-life-mother/fish-mother/yellowfin-source-copy-r001/tools/classify_source_components.py
      - apps/ocean-life-mother/fish-mother/yellowfin-source-copy-r001/tests/source-copy-skinned-r001.test.mjs
      - apps/ocean-life-mother/fish-mother/yellowfin-source-copy-r001/skinned-qa.html
      - apps/ocean-life-mother/fish-mother/yellowfin-source-copy-r001/skinned-qa/**
      - apps/ocean-life-mother/fish-mother/yellowfin-source-copy-r001/SOURCE_COMPONENT_CLASSIFICATION_R001.json
      - apps/ocean-life-mother/fish-mother/yellowfin-source-copy-r001/source-workspace/source/tuna_fish_4k.glb
      - apps/ocean-life-mother/fish-mother/yellowfin-study-r006/tools/build_kaopu_source_copy_package.py

permissions:
  contents: write

concurrency:
  group: fish-yellowfin-source-copy-skinned-r001
  cancel-in-progress: true

env:
  COPY_ROOT: apps/ocean-life-mother/fish-mother/yellowfin-source-copy-r001
  SOURCE_GLB: apps/ocean-life-mother/fish-mother/yellowfin-source-copy-r001/source-workspace/source/tuna_fish_4k.glb
  PACKAGE_ROOT: /tmp/yellowfin-source-copy-skinned-r001-package
  CLASSIFICATION: apps/ocean-life-mother/fish-mother/yellowfin-source-copy-r001/SOURCE_COMPONENT_CLASSIFICATION_R001.json
  SKINNED_GLB: apps/ocean-life-mother/fish-mother/yellowfin-source-copy-r001/geometry/YELLOWFIN_SOURCE_COPY_SKINNED_R001.glb
  SKINNED_RECEIPT: apps/ocean-life-mother/fish-mother/yellowfin-source-copy-r001/SOURCE_COPY_SKINNED_R001.json
  QA_SKINNED_OUT: apps/ocean-life-mother/fish-mother/yellowfin-source-copy-r001/evidence/skinned-browser
  QA_SKINNED_URL: http://127.0.0.1:4173/apps/ocean-life-mother/fish-mother/yellowfin-source-copy-r001/skinned-qa.html

jobs:
  build-skinned-source-copy:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out the Source Copy branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install exact-source transfer dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install numpy matplotlib

      - name: Build a temporary exact-source package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$PACKAGE_ROOT"
          python apps/ocean-life-mother/fish-mother/yellowfin-study-r006/tools/build_kaopu_source_copy_package.py \
            "$SOURCE_GLB" \
            --out "$PACKAGE_ROOT"

      - name: Build the lossless skinned and animated source copy
        shell: bash
        run: |
          set -euo pipefail
          python "$COPY_ROOT/tools/build_source_copy_skinned.py" \
            --source "$SOURCE_GLB" \
            --package "$PACKAGE_ROOT" \
            --classification "$CLASSIFICATION" \
            --out-glb "$SKINNED_GLB" \
            --out-receipt "$SKINNED_RECEIPT"

      - name: Install Playwright and Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium

      - name: Start the skinned QA workbench server
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/yellowfin-skinned-http.log 2>&1 &
          echo $! >/tmp/yellowfin-skinned-http.pid
          for i in $(seq 1 30); do
            if curl --fail --silent "$QA_SKINNED_URL" >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/yellowfin-skinned-http.log
          exit 1

      - name: Capture synchronized rest-pose and Swim evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$QA_SKINNED_OUT"
          node "$COPY_ROOT/skinned-qa/capture-skinned-qa.cjs"

      - name: Record passed skinned-copy status
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path

          root = Path(os.environ['COPY_ROOT'])
          receipt_path = Path(os.environ['SKINNED_RECEIPT'])
          browser_path = Path(os.environ['QA_SKINNED_OUT']) / 'SKINNED_BROWSER_QA_RECEIPT.json'
          receipt = json.loads(receipt_path.read_text())
          browser = json.loads(browser_path.read_text())
          if not browser.get('passed'):
              raise SystemExit('Skinned browser QA receipt did not pass')
          if browser.get('copySha256') != receipt['output']['sha256']:
              raise SystemExit('Skinned browser QA is not bound to generated copy SHA')
          receipt['gates']['browserRestPoseQAPassed'] = True
          receipt['gates']['browserAnimationQAPassed'] = True
          receipt['visualEvidence'] = {
              'receipt': 'evidence/skinned-browser/SKINNED_BROWSER_QA_RECEIPT.json',
              'animationName': browser['animationName'],
              'duration': browser['duration'],
              'samples': browser['samples'],
              'maximumDynamicBoundsDelta': browser['maximumDynamicBoundsDelta'],
              'maximumBoneMatrixDelta': browser['maximumBoneMatrixDelta'],
              'boundsTolerance': browser['boundsTolerance'],
              'boneTolerance': browser['boneTolerance'],
              'consoleZeroErrors': len(browser['consoleErrors']) == 0,
              'pageZeroErrors': len(browser['pageErrors']) == 0,
              'views': [item['name'] for item in browser['screenshots']],
          }
          receipt['next'] = 'Close region-by-region visibility and material-boundary acceptance, then freeze Source Copy R001 before Yellowfin biological correction.'
          receipt_path.write_text(json.dumps(receipt, ensure_ascii=False, indent=2) + '\n')

          status_path = root / 'CURRENT_STATUS.json'
          status = json.loads(status_path.read_text())
          status['phase'] = 'SOURCE_COPY_SKINNED_R001_BROWSER_QA_PASSED'
          status['gates'].update({
              'sourceCopySkinTransferred': True,
              'sourceCopyAnimationTransferred': True,
              'sourceCopyMaterialsTransferred': True,
              'sourceCopySkinnedBrowserQAPassed': True,
              'sourceCopySkinnedFixedViewsCaptured': True,
              'sourceCopySkinnedConsoleZeroErrors': True,
              'sourceCopySkinnedPageErrorsZero': True,
              'independentReconstructionUnlocked': False,
              'generationLocked': True,
          })
          status['sourceCopySkinned'] = {
              'receipt': 'SOURCE_COPY_SKINNED_R001.json',
              'glb': 'geometry/YELLOWFIN_SOURCE_COPY_SKINNED_R001.glb',
              'qaWorkbench': 'skinned-qa.html',
              'browserReceipt': 'evidence/skinned-browser/SKINNED_BROWSER_QA_RECEIPT.json',
              'sha256': receipt['output']['sha256'],
              'bytes': receipt['output']['bytes'],
              'semanticPrimitiveCount': receipt['output']['semanticPrimitiveCount'],
              'meshCount': receipt['output']['meshCount'],
              'skinCount': receipt['output']['skinCount'],
              'animationCount': receipt['output']['animationCount'],
              'materialCount': receipt['output']['materialCount'],
              'maximumDynamicBoundsDelta': browser['maximumDynamicBoundsDelta'],
              'maximumBoneMatrixDelta': browser['maximumBoneMatrixDelta'],
              'sourceBinaryPrefixByteIdentical': True,
              'sourceSkinWeightsRetained': True,
              'sourceAnimationsRetained': True,
              'sourceMaterialsRetained': True,
          }
          status['next'] = 'Close region-by-region visibility and material-boundary acceptance, then freeze Source Copy R001 before Yellowfin biological correction.'
          status_path.write_text(json.dumps(status, ensure_ascii=False, indent=2) + '\n')

          baseline_path = Path('CURRENT_BASELINE.json')
          baseline = json.loads(baseline_path.read_text())
          active = baseline.setdefault('activeState', {})
          active.update({
              'phase': 'YELLOWFIN_SOURCE_COPY_R001_SKINNED_BROWSER_QA_PASSED',
              'workBranch': 'work/ocean-life-fish-mother-yellowfin-source-copy-r001-20260921',
              'activeWorkbench': 'apps/ocean-life-mother/fish-mother/yellowfin-source-copy-r001/index.html',
              'skinnedQaWorkbench': 'apps/ocean-life-mother/fish-mother/yellowfin-source-copy-r001/skinned-qa.html',
              'sourceCopySkinnedGlb': 'apps/ocean-life-mother/fish-mother/yellowfin-source-copy-r001/geometry/YELLOWFIN_SOURCE_COPY_SKINNED_R001.glb',
              'sourceCopySkinnedReceipt': 'apps/ocean-life-mother/fish-mother/yellowfin-source-copy-r001/SOURCE_COPY_SKINNED_R001.json',
              'sourceCopySkinnedSha256': receipt['output']['sha256'],
              'sourceCopySkinTransferred': True,
              'sourceCopyAnimationTransferred': True,
              'sourceCopyMaterialsTransferred': True,
              'sourceCopySkinnedBrowserQAPassed': True,
              'sourceCopyUnlocked': False,
              'generationLocked': True,
              'nextAllowedBuild': 'YELLOWFIN-SOURCE-COPY-R001-REGION-MATERIAL-ACCEPTANCE',
          })
          baseline_path.write_text(json.dumps(baseline, ensure_ascii=False, indent=2) + '\n')
          PY

      - name: Run skinned-copy contracts
        shell: bash
        run: |
          set -euo pipefail
          node "$COPY_ROOT/tests/source-copy-skinned-r001.test.mjs"
          node "$COPY_ROOT/tests/source-component-classification-r001.test.mjs"
          node "$COPY_ROOT/tests/source-copy-r001-contract.test.mjs"

      - name: Upload skinned source copy and browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: YELLOWFIN-SOURCE-COPY-SKINNED-R001
          path: |
            ${{ env.SKINNED_GLB }}
            ${{ env.SKINNED_RECEIPT }}
            ${{ env.QA_SKINNED_OUT }}
            ${{ env.COPY_ROOT }}/CURRENT_STATUS.json
            CURRENT_BASELINE.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Commit the accepted skinned source copy
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Fish Mother R001"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config http.postBuffer 262144000
          git add \
            CURRENT_BASELINE.json \
            "$COPY_ROOT/CURRENT_STATUS.json" \
            "$SKINNED_RECEIPT" \
            "$SKINNED_GLB" \
            "$QA_SKINNED_OUT"
          if git diff --cached --quiet; then
            echo "No skinned source-copy delta to commit."
            exit 0
          fi
          git commit -m "feat(fish): validate lossless skinned Yellowfin source copy"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:${GITHUB_REF_NAME}"
