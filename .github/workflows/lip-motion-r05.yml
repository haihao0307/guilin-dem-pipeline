name: Lip motion R05 public candidate
on:
  push:
    branches: [feature/lip-motion-r05-20261020]
    paths:
      - kaopu-unified-human-workbench/lip-motion-r05/**
      - .github/workflows/lip-motion-r05.yml
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: lip-motion-r05-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            kaopu-unified-human-workbench/lip-motion-r05
            kaopu-unified-human-workbench/lip-inner-r04
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify reviewed source and diagnostic provenance
        run: |
          python - <<'PYVERIFY'
          import hashlib,json
          from pathlib import Path
          p=Path('kaopu-unified-human-workbench/lip-motion-r05')
          a=json.loads((p/'CANDIDATE_ANCHOR.json').read_text())
          for name,expected in a['reviewedFiles'].items():
            actual=hashlib.sha256((p/name).read_bytes()).hexdigest()
            assert actual==expected,(name,actual,expected)
          q=json.loads((p/'evidence/diagnosis-02/qa.json').read_text())
          assert hashlib.sha256((p/'evidence/diagnosis-02/qa.json').read_bytes()).hexdigest()==a['diagnosis']['qaSHA256']
          assert q['completed'] and q['cleanup']['completed'] and all(t['passed'] for t in q['tests'])
          first=json.loads((p/'evidence/diagnosis-01/qa.json').read_text())
          assert first['completed'] is False and first['failure']
          for previous in a.get('previousCandidates',[]):
              raw=p/previous['originalEvidence']
              assert hashlib.sha256(raw.read_bytes()).hexdigest()==previous['qaSHA256']
              failed=json.loads(raw.read_text())
              assert failed['completed'] is False and failed['failure']
          print('Reviewed candidate hashes and all original failed diagnostic/candidate evidence retained.')
          PYVERIFY
      - name: Build exact inherited R04 plus native R05 candidate
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: node kaopu-unified-human-workbench/lip-motion-r05/build.cjs
      - name: Publish immutable candidate build to isolated draft branch
        id: build
        env:
          EXPECTED_HEAD: ${{ github.sha }}
          TASK_BRANCH: feature/lip-motion-r05-20261020
        run: |
          git fetch origin "$TASK_BRANCH"
          CURRENT_HEAD=$(git rev-parse FETCH_HEAD)
          test "$CURRENT_HEAD" = "$EXPECTED_HEAD"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f -- kaopu-unified-human-workbench/lip-motion-r05/preview.html kaopu-unified-human-workbench/lip-motion-r05/BUILD_MANIFEST.json
          git commit -m "Build immutable native lip-motion R05 candidate [skip ci]"
          git push origin "HEAD:refs/heads/$TASK_BRANCH"
          R05_BUILD_SHA=$(git rev-parse HEAD)
          echo "BUILD_SHA=$R05_BUILD_SHA" >> "$GITHUB_ENV"
          echo "BUILD_SHA=$R05_BUILD_SHA" >> "$GITHUB_OUTPUT"
          python - <<'PYRECEIPT'
          import json,os,subprocess
          from pathlib import Path
          p=Path('kaopu-unified-human-workbench/lip-motion-r05')
          build=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          m=json.loads((p/'BUILD_MANIFEST.json').read_text())
          r={'schema':'kaopu/lip-motion-candidate-build@1','sourceCommit':os.environ['GITHUB_SHA'],'buildCommit':build,'previewSHA256':m['previewSHA256'],'publicURL':'https://htmlpreview.github.io/?https://raw.githubusercontent.com/haihao0307/guilin-dem-pipeline/'+build+'/kaopu-unified-human-workbench/lip-motion-r05/preview.html','workflowRun':int(os.environ['GITHUB_RUN_ID']),'technicalVerification':'pending','visualAcceptance':False,'productionReady':False}
          (p/'CANDIDATE_BUILD.json').write_text(json.dumps(r,indent=2)+'\n')
          PYRECEIPT
      - name: Install fixed browser runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2 pngjs@7.0.0
          npx playwright install --with-deps chromium
      - name: Verify actual immutable public workbench
        env:
          MODE: public
          SOURCE_SHA: ${{ github.sha }}
          PUBLIC_URL: https://htmlpreview.github.io/?https://raw.githubusercontent.com/haihao0307/guilin-dem-pipeline/${{ steps.build.outputs.BUILD_SHA }}/kaopu-unified-human-workbench/lip-motion-r05/preview.html
          QA_OUT: kaopu-unified-human-workbench/lip-motion-r05/evidence/candidate-01
          QA_BUDGET_MS: 900000
        run: timeout --signal=TERM --kill-after=20s 16m node kaopu-unified-human-workbench/lip-motion-r05/verification/verify-motion.cjs
      - name: Verify candidate completion without aesthetic promotion
        run: |
          node - <<'JSVERIFY'
          const fs=require('fs'),assert=require('assert/strict');
          const p='kaopu-unified-human-workbench/lip-motion-r05/';
          const q=JSON.parse(fs.readFileSync(p+'evidence/candidate-01/qa.json'));
          const a=JSON.parse(fs.readFileSync(p+'CANDIDATE_ANCHOR.json'));
          const m=JSON.parse(fs.readFileSync(p+'BUILD_MANIFEST.json'));
          assert.equal(q.completed,true);assert.equal(q.cleanup.completed,true);
          for(const k of ['failure','restorationError','cleanupError'])assert(!q[k],k);
          for(const k of ['pageErrors','consoleErrors','failedRequests','resourceErrors'])assert.equal(q[k].length,0,k);
          assert(q.tests.length>=12);assert(q.tests.every(t=>t.passed));
          for(const k of ['publicHttpsPassed','browserPassed','shareAllowed'])assert.equal(q[k],true,k);
          assert.equal(q.cleanup.browserDisconnected,true);
          assert(q.frames.filter(f=>f.saved).length>=24);assert(q.frames.length>=25);
          assert.equal(q.sourceSHA,process.env.GITHUB_SHA);assert.equal(q.buildSHA,process.env.BUILD_SHA);
          assert.equal(q.previewSHA256,m.previewSHA256);assert.equal(q.verifierSHA256,a.reviewedFiles['verification/verify-motion.cjs']);
          assert.equal(q.visualAcceptance,false);assert.equal(q.productionReady,false);
          console.log('Actual public candidate checks completed; aesthetic acceptance remains separate.');
          JSVERIFY
      - name: Preserve actual completed or failed candidate evidence
        if: always() && steps.build.outcome == 'success'
        env:
          TASK_BRANCH: feature/lip-motion-r05-20261020
        run: |
          git fetch origin "$TASK_BRANCH"
          CURRENT_HEAD=$(git rev-parse FETCH_HEAD)
          test "$CURRENT_HEAD" = "$BUILD_SHA"
          git add -f -- kaopu-unified-human-workbench/lip-motion-r05/CANDIDATE_BUILD.json
          if test -d kaopu-unified-human-workbench/lip-motion-r05/evidence/candidate-01; then
            git add -f -- kaopu-unified-human-workbench/lip-motion-r05/evidence/candidate-01
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Record actual public R05 candidate evidence [skip ci]"
            git push origin "HEAD:refs/heads/$TASK_BRANCH"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lip-motion-r05-public-${{ github.sha }}
          path: |
            kaopu-unified-human-workbench/lip-motion-r05/evidence/candidate-01
            kaopu-unified-human-workbench/lip-motion-r05/CANDIDATE_BUILD.json
            kaopu-unified-human-workbench/lip-motion-r05/CANDIDATE_ANCHOR.json
            kaopu-unified-human-workbench/lip-motion-r05/BUILD_MANIFEST.json
            kaopu-unified-human-workbench/lip-motion-r05/src/MotionContinuity.js
            kaopu-unified-human-workbench/lip-motion-r05/src/MotionLip.js
            kaopu-unified-human-workbench/lip-motion-r05/verification/verify-motion.cjs
          if-no-files-found: error
          retention-days: 30
