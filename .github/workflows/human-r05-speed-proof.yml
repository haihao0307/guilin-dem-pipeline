name: Human R05 independent speed and portrait proof
on:
  push:
    branches: [test/human-r05-speed-portrait-proof-20261013]
    paths: ['.github/workflows/human-r05-speed-proof.yml']
permissions: {contents: read}
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {sparse-checkout: .github}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - name: Benchmark both immutable pages on one runner, with explicit readiness scope
        run: |
          mkdir -p proof
          cat > proof.cjs <<'JS'
          const fs=require('fs'),assert=require('node:assert/strict'),{chromium}=require('playwright');
          const old='https://htmlpreview.github.io/?https://raw.githubusercontent.com/haihao0307/guilin-dem-pipeline/e5df3bcba13ba566d6da27d5cb051e91956055b3/kaopu-unified-human-workbench/human-integrated-r04/preview.html',current='https://htmlpreview.github.io/?https://raw.githubusercontent.com/haihao0307/guilin-dem-pipeline/475ead2759159b83927a1aa8ae6879595e1d18bc/kaopu-unified-human-workbench/human-integrated-r05/preview.html';
          (async()=>{const browser=await chromium.launch({headless:true,args:['--no-sandbox','--use-angle=swiftshader','--enable-unsafe-swiftshader']}),report={baseline:old,candidate:current,hardware:'GitHub Actions / Chromium / SwiftShader; not consumer GPU',ready:'entry reports original person, complete face/eye material and actual rendered frame ready; R05 optional weights and idle are separately on-demand',runs:[],errors:[],screens:[]};
          const save=()=>fs.writeFileSync('proof/report.json',JSON.stringify(report,null,2));
          async function measure(label,url,throttled=false){const ctx=await browser.newContext({viewport:{width:1280,height:960},deviceScaleFactor:1}),p=await ctx.newPage(),cdp=await ctx.newCDPSession(p);p.setDefaultTimeout(240000);const r={label,url,throttled,errors:[],failedRequests:[],cold:null,warm:null};report.runs.push(r);p.on('pageerror',e=>r.errors.push(String(e)));p.on('console',m=>{if(m.type()==='error')r.errors.push(m.text())});p.on('requestfailed',q=>r.failedRequests.push({url:q.url(),error:q.failure()?.errorText}));await cdp.send('Network.enable');if(throttled)await cdp.send('Network.emulateNetworkConditions',{offline:false,latency:80,downloadThroughput:2500000,uploadThroughput:1250000});let bytes=0;cdp.on('Network.loadingFinished',e=>bytes+=e.encodedDataLength);await p.addInitScript(()=>{window.__long=[];new PerformanceObserver(list=>{for(const e of list.getEntries())__long.push({start:e.startTime,duration:e.duration});}).observe({entryTypes:['longtask']});});
          for(const mode of ['cold','warm']){bytes=0;const t=performance.now();if(mode==='cold')await p.goto(url,{waitUntil:'domcontentloaded',timeout:90000});else await p.reload({waitUntil:'domcontentloaded',timeout:90000});await p.waitForFunction(()=>window.__LIP_P3__?.ready||window.__LIP_P3__?.errors?.length,null,{timeout:240000});assert(await p.evaluate(()=>!!__LIP_P3__.ready),label+' '+mode+' ready');r[mode]={readyMS:performance.now()-t,networkBytes:bytes,...await p.evaluate(()=>({load:__LIP_P3__.snapshot(),stages:__LIP_STARTUP__.events,longTasks:__long,idleReady:lifelikeIdle.ready(),displayVertices:__IDENTITY_QA__.viewer().geometry.attributes.position.count,portraitTimings:window.portraitBank?.timings()}))};await p.evaluate(()=>lifelikeIdle.pause(true));save();}
          if(label==='R05'){for(const id of ['P01','P03','P05']){await p.evaluate(id=>portraitBank.apply(id),id);await p.evaluate(()=>portraitBank.view('side'));const image=await cdp.send('Page.captureScreenshot',{format:'jpeg',quality:92,captureBeyondViewport:false});fs.writeFileSync('proof/'+id+'-side.jpg',Buffer.from(image.data,'base64'));report.screens.push(id+'-side.jpg');save();}const start=performance.now();await p.evaluate(()=>window.__R05_START_IDLE__());await p.evaluate(()=>lifelikeIdle.pause(true));r.idle={readyMS:performance.now()-start,...await p.evaluate(()=>({ready:lifelikeIdle.ready(),report:lifelikeIdle.report()}))};assert(r.idle.ready);await p.evaluate(()=>{portraitBank.view('oblique');lifelikeIdle.seek(2);});const image=await cdp.send('Page.captureScreenshot',{format:'jpeg',quality:92,captureBeyondViewport:false});fs.writeFileSync('proof/idle-ready.jpg',Buffer.from(image.data,'base64'));report.screens.push('idle-ready.jpg');save();}
          assert.equal(r.errors.length,0,label+' page/shader errors');assert.equal(r.failedRequests.length,0,label+' asset failures');await ctx.close();}
          try{await measure('R04',old);await measure('R05',current);await measure('R04-20Mbps',old,true);await measure('R05-20Mbps',current,true);report.completed=true;}catch(e){report.failure=String(e);report.errors.push(String(e));process.exitCode=1;}finally{save();await browser.close();}})().catch(e=>{console.error(e);process.exitCode=1});
          JS
          node proof.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: human-r05-independent-speed-proof-release
          path: proof/
          retention-days: 14
