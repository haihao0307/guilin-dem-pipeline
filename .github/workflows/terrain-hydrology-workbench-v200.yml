name: Bootstrap terrain hydrology workbench v200

on:
  push:
    branches:
      - skill/dem-procedural-landscape-v010
    paths:
      - .github/workflows/terrain-hydrology-workbench-v200.yml
      - tools/terrain_hydrology_v200/bootstrap_parts/**
      - tools/terrain_hydrology_v200/v200_source_bundle.zip
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: terrain-hydrology-workbench-v200-bootstrap
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Verify, extract, and commit source
        shell: bash
        run: |
          set -euo pipefail
          PARTS="tools/terrain_hydrology_v200/bootstrap_parts"
          test -d "$PARTS"
          cat "$PARTS"/chunk_*.txt | base64 --decode > "$RUNNER_TEMP/v200-full-source.zip"
          echo "043147975f9b68ff9e6029b992358c28d1dfa91078598644ed352cf8537e56a2  $RUNNER_TEMP/v200-full-source.zip" | sha256sum -c -
          python - "$RUNNER_TEMP/v200-full-source.zip" "$GITHUB_WORKSPACE" <<'PY'
          import sys, zipfile
          from pathlib import Path
          archive_path, root_text = sys.argv[1:]
          root = Path(root_text).resolve()
          with zipfile.ZipFile(archive_path) as archive:
              for info in archive.infolist():
                  target = (root / info.filename).resolve()
                  if target != root and root not in target.parents:
                      raise SystemExit(f"unsafe path: {info.filename}")
              archive.extractall(root)
          PY
          rm -rf "$PARTS" tools/terrain_hydrology_v200/v200_source_bundle.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/terrain-hydrology-workbench-v200.yml web/terrain-hydrology-workbench-v200 tools/terrain_hydrology_v200
          git commit -m "Materialize high precision terrain hydrology workbench v200"
          git push origin HEAD:skill/dem-procedural-landscape-v010
