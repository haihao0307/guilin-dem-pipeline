name: Fractal Wave Tree Workbench R05 public QA

on:
  push:
    branches:
      - work/fractal-wave-organ-life-r05-20261004
    paths:
      - .github/workflows/fractal-wave-tree-workbench-r01-public-qa.yml
      - kaopu-tree-fractal-wave-lab/index.html
      - kaopu-tree-fractal-wave-lab/workbench-r01.js
      - kaopu-tree-fractal-wave-lab/INTEGRATION_MANIFEST_R01.json
      - kaopu-tree-fractal-wave-lab/INTEGRATION_R01_ZH.md
      - kaopu-tree-fractal-wave-lab/kuko-day123-branching-r01/runtime.js
      - kaopu-tree-fractal-wave-lab/kuko-day123-branching-r01/SOURCE_LOCK.json
      - kaopu-tree-fractal-wave-lab/kuko-day123-3d-lift-r01/index.html
      - kaopu-tree-fractal-wave-lab/kuko-day123-3d-lift-r01/runtime.js
      - kaopu-tree-fractal-wave-lab/kuko-day123-3d-lift-r01/LIFT_RULES_R01.json
      - kaopu-tree-fractal-wave-lab/kuko-day123-native-3d-r02/index.html
      - kaopu-tree-fractal-wave-lab/kuko-day123-native-3d-r02/runtime.js
      - kaopu-tree-fractal-wave-lab/kuko-day123-native-3d-r02/NATIVE_3D_GRAMMAR_R02.json
      - kaopu-tree-fractal-wave-lab/kuko-day123-native-3d-r03/index.html
      - kaopu-tree-fractal-wave-lab/kuko-day123-native-3d-r03/runtime.js
      - kaopu-tree-fractal-wave-lab/kuko-day123-native-3d-r03/NATIVE_3D_GRAMMAR_R03.json
      - kaopu-tree-fractal-wave-lab/native-3d-life-r04/index.html
      - kaopu-tree-fractal-wave-lab/native-3d-life-r04/runtime.js
      - kaopu-tree-fractal-wave-lab/native-3d-life-r04/LIVING_TREE_R04.json
      - kaopu-tree-fractal-wave-lab/native-3d-life-r05/index.html
      - kaopu-tree-fractal-wave-lab/native-3d-life-r05/runtime.js
      - kaopu-tree-fractal-wave-lab/native-3d-life-r05/LIVING_TREE_R05.json
      - kaopu-tree-fractal-wave-lab/native-3d-life-r05/RESEARCH_NOTES.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-public:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Wait for matching public files
        shell: python
        run: |
          import hashlib, json, time, urllib.request
          base='https://haihao0307.github.io/guilin-dem-pipeline/kaopu-tree-fractal-wave-lab/'
          expected={
            'index.html':['分形造波树 综合工作台 R05','treeFrame','teacherFrame','liftFrame','nativeFrame','native3Frame','life4Frame','life5Frame','workbench-r01.js'],
            'workbench-r01.js':['window.__fractalTreeWorkbenchReady','decodePath','KAOPU_KUKO_PLAY','__treeReady'],
            'INTEGRATION_MANIFEST_R01.json':['KAOPU.fractal-wave.tree-workbench/1','branch.pathAddressing','TreeLifeR05.Pandanus'],
            'mobile-r05-seasons/index.html':['PANDANUS TECTORIUS TEACHER','runtime-pandanus-r05.js'],
            'kuko-day123-branching-r01/index.html':['KuKo Day 123','teacherCanvas','runtime.js'],
            'kuko-day123-branching-r01/runtime.js':['const EMBEDDED = window.parent !== window','KuKoDay123Teacher','needsRender'],
            'kuko-day123-branching-r01/SOURCE_LOCK.json':['stop repeated draw calls while paused','teacher_replication_only'],
            'kuko-day123-3d-lift-r01/index.html':['KuKo Day 123 三维化学习 R01','runtime.js','不套用露兜树'],
            'kuko-day123-3d-lift-r01/runtime.js':['window.__kuko3dLiftReady','projectionLocked: true','appliesToPandanus: false'],
            'kuko-day123-3d-lift-r01/LIFT_RULES_R01.json':['projectionInvariant','notAssignedTo','Pandanus tectorius'],
            'kuko-day123-native-3d-r02/index.html':['Native 3D Fractal Grammar R02','BUD → 3D LOCAL FRAME','runtime.js'],
            'kuko-day123-native-3d-r02/runtime.js':['window.__native3dR02Ready','cameraAffectsGeneration:false','appliesToSpecies:false'],
            'kuko-day123-native-3d-r02/NATIVE_3D_GRAMMAR_R02.json':['KAOPU.fractal-wave.native-3d/2','camera orientation never participates in generation','Pandanus tectorius'],
            'kuko-day123-native-3d-r03/index.html':['Native 3D Fractal Grammar R03','SPATIAL HASH','runtime.js'],
            'kuko-day123-native-3d-r03/runtime.js':['window.__native3dR03Ready','spatialHash:true','supportBackprop:true'],
            'kuko-day123-native-3d-r03/NATIVE_3D_GRAMMAR_R03.json':['KAOPU.fractal-wave.native-3d/3','SpatialHash occupancy index','support is back-propagated'],
            'native-3d-life-r04/index.html':['Living 3D Tree R04','RESOURCE FLOW','CONTINUOUS IMPLICIT SKIN'],
            'native-3d-life-r04/runtime.js':['window.__livingTreeR04Ready','MarchingCubes','rootShootConnected:true','terminalTaper:true'],
            'native-3d-life-r04/LIVING_TREE_R04.json':['KAOPU.fractal-wave.living-tree/4','rootUptakeParticipatesInFutureGrowthBudget','continuousWoodSurfaceUsesImplicitField'],
            'native-3d-life-r05/index.html':['Living 3D Tree R05','叶龄 / Phenology','花果 Sink 强度'],
            'native-3d-life-r05/runtime.js':['window.__livingTreeR05Ready','sourceSinkCompetition:true','fineTwigs:true','secondaryGrowth:P.secondary'],
            'native-3d-life-r05/LIVING_TREE_R05.json':['KAOPU.fractal-wave.living-tree/5','leafLifecycleStates','reproductiveInvestmentCanReduceVegetativeGrowth'],
            'native-3d-life-r05/RESEARCH_NOTES.md':['叶片不是永久装饰','果实是强 sink','次生加粗']
          }
          report={'base':base,'files':{},'attempts':0}
          last=None
          for attempt in range(1,121):
            report['attempts']=attempt
            try:
              ok=True; current={}
              for name,markers in expected.items():
                req=urllib.request.Request(base+name+'?qa='+str(attempt),headers={'User-Agent':'KAOPU-FRACTAL-TREE-R01-QA/1.1','Cache-Control':'no-cache'})
                with urllib.request.urlopen(req,timeout=35) as response:
                  data=response.read(); status=response.status
                text=data.decode('utf-8','replace')
                checks={m:(m in text) for m in markers}
                current[name]={'status':status,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'markers':checks}
                ok=ok and status==200 and all(checks.values())
              report['files']=current
              if ok:
                report['success']=True; break
            except Exception as exc:
              last=repr(exc); report['last_error']=last
            time.sleep(10)
          else:
            report['success']=False
          print(json.dumps(report,ensure_ascii=False,indent=2))
          if not report.get('success'):
            raise SystemExit('Public integrated workbench did not become ready: '+str(last))

      - name: Install browser QA dependencies
        run: |
          python -m pip install --disable-pip-version-check playwright pillow
          python -m playwright install --with-deps chromium

      - name: Verify desktop and mobile workbench
        shell: python
        run: |
          from pathlib import Path
          import json, traceback
          from PIL import Image, ImageStat
          from playwright.sync_api import sync_playwright

          root=Path('evidence-fractal-tree-r05'); root.mkdir(exist_ok=True)
          url='https://haihao0307.github.io/guilin-dem-pipeline/kaopu-tree-fractal-wave-lab/'
          report={'url':url,'checks':{},'errors':[]}
          C=report['checks']

          def digest(path):
            image=Image.open(path).convert('RGB')
            stat=ImageStat.Stat(image)
            return {'bytes':path.stat().st_size,'mean':sum(stat.mean)/3,'stddev':sum(stat.stddev)/3}

          try:
            with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              page=browser.new_page(viewport={'width':1440,'height':900},device_scale_factor=1)
              page.on('pageerror',lambda e:report['errors'].append('pageerror: '+str(e)))
              page.on('console',lambda m:report['errors'].append('console: '+m.text) if m.type=='error' else None)
              page.goto(url+'?browserqa=2',wait_until='domcontentloaded',timeout=120000)
              page.wait_for_function('window.__fractalTreeWorkbenchReady===true',timeout=180000)
              page.wait_for_timeout(1800)
              C['titleCorrect']='分形造波树' in page.title()
              C['sevenFramesPresent']=page.locator('iframe').count()==7
              C['defaultLivingR05Mode']=page.evaluate("document.body.dataset.mode==='life5'")
              C['desktopNoHorizontalOverflow']=page.evaluate('document.documentElement.scrollWidth<=innerWidth')
              C['embeddedTeacherInitiallyPaused']=page.evaluate("document.getElementById('teacherFrame').contentWindow.KuKoDay123Teacher.getState().playing===false")
              compare=root/'desktop-tree.png'; page.screenshot(path=str(compare),full_page=False)

              page.evaluate("FractalWaveTreeWorkbenchR01.setMode('map')")
              page.wait_for_timeout(150)
              C['mapModeVisible']=page.evaluate("getComputedStyle(document.getElementById('mapView')).display!=='none'")
              mapshot=root/'desktop-map.png'; page.screenshot(path=str(mapshot),full_page=False)

              page.evaluate("FractalWaveTreeWorkbenchR01.setMode('tree')")
              page.wait_for_timeout(100)
              C['treeModeHidesTeacher']=page.evaluate("getComputedStyle(document.querySelector('.teacher-card')).display==='none'")

              page.evaluate("FractalWaveTreeWorkbenchR01.setMode('teacher')")
              page.wait_for_timeout(250)
              C['teacherModeHidesTree']=page.evaluate("getComputedStyle(document.querySelector('.tree-card')).display==='none'")
              C['teacherModePlaysTeacher']=page.evaluate("document.getElementById('teacherFrame').contentWindow.KuKoDay123Teacher.getState().playing===true")

              page.evaluate("FractalWaveTreeWorkbenchR01.setMode('compare')")
              page.wait_for_timeout(250)
              C['compareRestored']=page.evaluate("getComputedStyle(document.querySelector('.tree-card')).display!=='none' && getComputedStyle(document.querySelector('.teacher-card')).display!=='none' && getComputedStyle(document.querySelector('.lift-card')).display==='none'")
              C['compareFreezesTeacher']=page.evaluate("document.getElementById('teacherFrame').contentWindow.KuKoDay123Teacher.getState().playing===false")

              page.evaluate("FractalWaveTreeWorkbenchR01.setMode('lift')")
              page.wait_for_timeout(700)
              C['liftModePairsTeacherAnd3D']=page.evaluate("getComputedStyle(document.querySelector('.tree-card')).display==='none' && getComputedStyle(document.querySelector('.teacher-card')).display!=='none' && getComputedStyle(document.querySelector('.lift-card')).display!=='none'")
              C['liftProjectionLocked']=page.evaluate("document.getElementById('liftFrame').contentWindow.KuKoDay123Lift3D.getState().projectionLocked===true")
              C['liftNotAssignedToPandanus']=page.evaluate("document.getElementById('liftFrame').contentWindow.KuKoDay123Lift3D.getState().appliesToPandanus===false")
              page.evaluate("document.getElementById('liftFrame').contentWindow.KuKoDay123Lift3D.setDepth(0.58)")
              page.wait_for_timeout(250)
              liftshot=root/'desktop-lift.png'; page.screenshot(path=str(liftshot),full_page=False)
              C['liftPixelsNonBlank']=digest(liftshot)['stddev']>8

              page.evaluate("FractalWaveTreeWorkbenchR01.setMode('native')")
              page.wait_for_timeout(900)
              C['nativeModeOnlyR02']=page.evaluate("getComputedStyle(document.querySelector('.native-card')).display!=='none' && getComputedStyle(document.querySelector('.tree-card')).display==='none' && getComputedStyle(document.querySelector('.teacher-card')).display==='none' && getComputedStyle(document.querySelector('.lift-card')).display==='none'")
              native_state=page.evaluate("document.getElementById('nativeFrame').contentWindow.Native3DFractalR02.getState()")
              C['native3DNonPlanar']=native_state['signature']['native3D'] and native_state['signature']['zSpan']>0.2
              C['nativeCameraIndependent']=native_state['signature']['cameraAffectsGeneration'] is False
              C['nativeNotAssignedToSpecies']=native_state['signature']['appliesToSpecies'] is False
              C['nativeHasActiveAndDormantBuds']=native_state['signature']['activeBudCount']>0 and native_state['signature']['dormantBudCount']>0
              before=native_state['signature']
              page.evaluate("document.getElementById('nativeFrame').contentWindow.Native3DFractalR02.setObstacle(false)")
              page.wait_for_timeout(350)
              after=page.evaluate("document.getElementById('nativeFrame').contentWindow.Native3DFractalR02.getState().signature")
              C['obstacleChangesNativeGrowth']=before['segmentCount']!=after['segmentCount'] or before['centroid']!=after['centroid'] or before['bounds']!=after['bounds']
              page.evaluate("document.getElementById('nativeFrame').contentWindow.Native3DFractalR02.setObstacle(true)")
              page.wait_for_timeout(350)
              nativeshot=root/'desktop-native-r02.png'; page.screenshot(path=str(nativeshot),full_page=False)
              C['nativePixelsNonBlank']=digest(nativeshot)['stddev']>8

              page.evaluate("FractalWaveTreeWorkbenchR01.setMode('native3')")
              page.wait_for_timeout(900)
              C['native3IsLargeIntegratedMode']=page.evaluate("getComputedStyle(document.querySelector('.native3-card')).display!=='none' && getComputedStyle(document.querySelector('.side')).display==='none'")
              r03=page.evaluate("document.getElementById('native3Frame').contentWindow.Native3DFractalR03.getState()")
              C['r03SpatialHash']=r03['signature']['spatialHash'] is True
              C['r03PerceptionVolume']=r03['signature']['perceptionVolume'] is True
              C['r03SupportBackprop']=r03['signature']['supportBackprop'] is True
              C['r03Native3DNonPlanar']=r03['signature']['native3D'] and r03['signature']['zSpan']>0.3
              C['r03HasOccupancySamples']=r03['signature']['occupancySamples']>r03['signature']['segmentCount']
              C['r03HasProbeCandidates']=r03['signature']['probeCandidates']>0
              C['r03NotAssignedToSpecies']=r03['signature']['appliesToSpecies'] is False
              before_pass=r03['signature']['segmentCount']
              page.evaluate("document.getElementById('native3Frame').contentWindow.Native3DFractalR03.setPass(5)")
              page.wait_for_timeout(500)
              pass5=page.evaluate("document.getElementById('native3Frame').contentWindow.Native3DFractalR03.getState().signature.segmentCount")
              C['growthPassChangesTopology']=pass5!=before_pass
              page.evaluate("document.getElementById('native3Frame').contentWindow.Native3DFractalR03.setPass(9)")
              page.wait_for_timeout(500)
              r03shot=root/'desktop-native-r03.png'; page.screenshot(path=str(r03shot),full_page=False)
              C['r03PixelsNonBlank']=digest(r03shot)['stddev']>8

              page.evaluate("FractalWaveTreeWorkbenchR01.setMode('nativecompare3')")
              page.wait_for_timeout(400)
              C['r02R03CompareVisible']=page.evaluate("getComputedStyle(document.querySelector('.native-card')).display!=='none' && getComputedStyle(document.querySelector('.native3-card')).display!=='none' && getComputedStyle(document.querySelector('.teacher-card')).display==='none'")

              page.evaluate("FractalWaveTreeWorkbenchR01.setMode('life4')")
              page.wait_for_timeout(1800)
              C['life4LargeIntegratedMode']=page.evaluate("getComputedStyle(document.querySelector('.life4-card')).display!=='none' && getComputedStyle(document.querySelector('.side')).display==='none'")
              life=page.evaluate("document.getElementById('life4Frame').contentWindow.LivingTreeR04.getState()")
              sig=life['signature']
              C['life4RootShoot']=sig['rootSegments']>=10 and sig['shootSegments']>=25 and sig['rootShootConnected'] is True
              C['life4Resources']=sig['waterUptake']>0 and sig['resourceFlow'] is True
              C['life4ContinuousSkin']=sig['implicitSurface'] is True and sig['continuousSkinVisible'] is True and sig['implicitVertices']>300
              C['life4TerminalTaper']=sig['terminalTaper'] is True and sig['apicalMeristem'] is True
              C['life4RootsBelowGround']=sig['yMin']<-0.25 and sig['rootSegments']>=10
              C['life4Leaves']=sig['leafCount']>=8
              C['life4SpeciesBoundary']=sig['appliesToSpecies'] is False
              before_alloc=(sig['shootSegments'],sig['rootSegments'],sig['lastBudget'])
              page.evaluate("document.getElementById('life4Frame').contentWindow.LivingTreeR04.setAllocation(0.58)")
              page.wait_for_timeout(1400)
              after_alloc=page.evaluate("(() => { const s=document.getElementById('life4Frame').contentWindow.LivingTreeR04.getState().signature; return [s.shootSegments,s.rootSegments,s.lastBudget]; })()")
              C['resourceAllocationChangesGrowth']=before_alloc!=tuple(after_alloc)
              page.evaluate("document.getElementById('life4Frame').contentWindow.LivingTreeR04.setAllocation(0.38)")
              page.wait_for_timeout(1400)
              life4shot=root/'desktop-life-r04.png'; page.screenshot(path=str(life4shot),full_page=False)
              C['life4PixelsNonBlank']=digest(life4shot)['stddev']>10
              C['life4VisuallyDistinctFromR03']=digest(life4shot)['bytes']!=digest(r03shot)['bytes']

              page.evaluate("FractalWaveTreeWorkbenchR01.setMode('lifecompare')")
              page.wait_for_timeout(500)
              C['r03R04CompareVisible']=page.evaluate("getComputedStyle(document.querySelector('.native3-card')).display!=='none' && getComputedStyle(document.querySelector('.life4-card')).display!=='none'")

              page.evaluate("FractalWaveTreeWorkbenchR01.setMode('life5')")
              page.wait_for_timeout(2200)
              C['life5LargeIntegratedMode']=page.evaluate("getComputedStyle(document.querySelector('.life5-card')).display!=='none' && getComputedStyle(document.querySelector('.side')).display==='none'")
              life5=page.evaluate("document.getElementById('life5Frame').contentWindow.LivingTreeR05.getState()")
              s5=life5['signature']
              C['life5FineTwigs']=s5['fineTwigs'] is True and s5['shootSegments']>=25
              C['life5OrganLifecycle']=s5['organLifecycle'] is True and sum(s5['leafStates'].values())>0
              C['life5SourceSink']=s5['sourceSinkCompetition'] is True and s5['reserveCarbon']>0
              C['life5SecondaryGrowth']=s5['secondaryGrowth'] is True and s5['implicitVertices']>300
              C['life5PhyllotaxisVoice']=s5['phyllotaxisVoice'] in ['spiral','opposite','whorl3']
              C['life5ReproductiveBudget']=s5['reproductiveInvestment']>=0
              C['life5StillHasRoots']=s5['rootSegments']>=10 and s5['yMin']<0
              beforeFruit=(s5['fruitCount'],s5['shootSegments'],s5['reserveCarbon'])
              page.evaluate("document.getElementById('life5Frame').contentWindow.LivingTreeR05.setFruitLoad(0.55)")
              page.wait_for_timeout(1600)
              highFruit=page.evaluate("document.getElementById('life5Frame').contentWindow.LivingTreeR05.getState().signature")
              C['fruitSinkChangesAllocation']=highFruit['reproductiveInvestment']>s5['reproductiveInvestment'] and (highFruit['shootSegments']!=s5['shootSegments'] or highFruit['reserveCarbon']!=s5['reserveCarbon'])
              page.evaluate("document.getElementById('life5Frame').contentWindow.LivingTreeR05.setFruitLoad(0.18)")
              page.evaluate("document.getElementById('life5Frame').contentWindow.LivingTreeR05.setPhenology(0.92)")
              page.wait_for_timeout(1400)
              late=page.evaluate("document.getElementById('life5Frame').contentWindow.LivingTreeR05.getState().signature")
              C['phenologyChangesLeafStates']=late['leafStates']!=s5['leafStates']
              page.evaluate("document.getElementById('life5Frame').contentWindow.LivingTreeR05.setPhenology(0.58)")
              page.evaluate("document.getElementById('life5Frame').contentWindow.LivingTreeR05.setPhyllotaxis('opposite')")
              page.wait_for_timeout(1000)
              C['phyllotaxisSwitchWorks']=page.evaluate("document.getElementById('life5Frame').contentWindow.LivingTreeR05.getState().signature.phyllotaxisVoice==='opposite'")
              page.evaluate("document.getElementById('life5Frame').contentWindow.LivingTreeR05.setPhyllotaxis('spiral')")
              page.wait_for_timeout(900)
              life5shot=root/'desktop-life-r05.png'; page.screenshot(path=str(life5shot),full_page=False)
              C['life5PixelsNonBlank']=digest(life5shot)['stddev']>10

              page.evaluate("FractalWaveTreeWorkbenchR01.setMode('lifecompare5')")
              page.wait_for_timeout(600)
              C['r04R05CompareVisible']=page.evaluate("getComputedStyle(document.querySelector('.life4-card')).display!=='none' && getComputedStyle(document.querySelector('.life5-card')).display!=='none'")

              page.locator('#branchIndex').evaluate("el=>{el.value='137';el.dispatchEvent(new Event('input',{bubbles:true}))}")
              page.wait_for_timeout(100)
              C['decoderProducesSevenDigits']=page.locator('#pathDigits .digit').count()==7
              C['desktopPixelsNonBlank']=digest(compare)['stddev']>8

              page.set_viewport_size({'width':390,'height':844})
              page.evaluate("FractalWaveTreeWorkbenchR01.setMode('life5')")
              page.wait_for_timeout(1800)
              C['mobileNoHorizontalOverflow']=page.evaluate('document.documentElement.scrollWidth<=innerWidth')
              mobile=root/'mobile-tree.png'; page.screenshot(path=str(mobile),full_page=False)
              C['mobilePixelsNonBlank']=digest(mobile)['stddev']>8
              C['pageErrorsZero']=not report['errors']
              report['screens']={'tree':digest(compare),'map':digest(mapshot),'lift':digest(liftshot),'nativeR02':digest(nativeshot),'nativeR03':digest(r03shot),'livingR04':digest(life4shot),'livingR05':digest(life5shot),'mobile':digest(mobile)}
              report['state']=page.evaluate('FractalWaveTreeWorkbenchR01.getState()')
              browser.close()
          except Exception:
            report['failure']=traceback.format_exc()
          (root/'report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          if report.get('failure') or not all(C.values()):
            raise SystemExit('Integrated browser QA failed')

      - name: Upload integrated workbench evidence
        uses: actions/upload-artifact@v4
        with:
          name: FRACTAL_WAVE_TREE_WORKBENCH_R05_QA
          path: evidence-fractal-tree-r05
          if-no-files-found: error
          retention-days: 90
