name: Landscape R5.K2.G6 Live Real-Form Controls

on:
  push:
    branches:
      - feature/landscape-microscope-geometry-lab-r1-20260916
    paths:
      - workbenches/landscape-surface-r5-k2-geometry-r6/build_g6.py
      - .github/workflows/landscape-r5-k2-geometry-r6.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build G6 live-control candidate
        run: |
          python -m py_compile workbenches/landscape-surface-r5-k2-geometry-r6/build_g6.py
          python workbenches/landscape-surface-r5-k2-geometry-r6/build_g6.py

      - name: Static UI and browser-script QA
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re
          root = Path('workbenches/landscape-surface-r5-k2-geometry-r6')
          s = (root / 'index.html').read_text(encoding='utf-8')
          b = json.loads((root / 'build.json').read_text(encoding='utf-8'))
          required = [
              'R5.K2.G6',
              'class="panel glass open"',
              'class="stage-controls" open',
              'data-quick-form="off"',
              'data-quick-form="standard"',
              'data-quick-form="strong"',
              'id="formBuildState"',
              'function rebuildForm',
              'function queueFormRebuild',
              "input.onchange=()=>queueFormRebuild",
              "$('#sourceScale').onchange=()=>queueFormRebuild",
              "useFormPreset(b.dataset.quickForm,b)",
              "$('#apply').onclick=()=>rebuildForm",
              '材质与壳层（只改显示，不改形体）',
              'surface-only',
              '真实形体已经改变',
              'signature',
              'LANDSCAPE_VOLUMETRIC_MICROSCOPE_R2',
          ]
          for token in required:
              assert token in s, token
          assert b['schema'] == 'LANDSCAPE_R5_K2_G6_LIVE_FORM_CONTROLS_V1'
          for key, value in b['interaction'].items():
              assert value is True, key
          blocks = []
          for sid in ('worldSource', 'generateSource'):
              m = re.search(r'<script id="%s" type="text/plain">(.*?)</script>' % sid, s, re.S)
              assert m, sid
              blocks.append(m.group(1))
          Path('/tmp/landscape-g6-worker.js').write_text('\n'.join(blocks), encoding='utf-8')
          marker = "</script><script>'use strict';"
          assert marker in s
          app = "'use strict';" + s.rsplit(marker, 1)[1].rsplit('</script>', 1)[0]
          Path('/tmp/landscape-g6-app.js').write_text(app, encoding='utf-8')
          PY
          node --check /tmp/landscape-g6-worker.js
          node --check /tmp/landscape-g6-app.js

      - name: Numerical proof that UI presets target different real meshes
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          cp /tmp/landscape-g6-worker.js /tmp/landscape-g6-runtime.js
          cat >> /tmp/landscape-g6-runtime.js <<'JS'
          const fs=require('fs');
          const BASE={schema:'landscape-function-world/1',core:'limestone-water-2',seed:83,stage:4,fracture:1,relief:1,sourceForm:0,sourceScale:7.5,sourceWarp:0,sourceErosion:0,geo:.60,concavity:.60,spikeGuard:.95,soilMicro:0};
          function signature(report,name){const p=report.parts.find(x=>x.name===name);if(!p)throw Error('missing '+name);return p.signature;}
          function run(label,overrides){const data=generateScene({...BASE,...overrides},()=>{}),r=data.report;return{label,mainSignature:signature(r,'主岩体'),soilSignature:signature(r,'土体与风化基底'),mainVertices:r.mainVertices,mainTriangles:r.mainTriangles,sourceMicroscope:r.sourceMicroscope,soilMicroscope:r.soilMicroscope};}
          const off=run('A original',{});
          const standard=run('B standard',{sourceForm:1.30,sourceScale:7.5,sourceWarp:1.40,sourceErosion:1.10,soilMicro:1.00});
          const strong=run('C strong',{sourceForm:2.10,sourceScale:8.6,sourceWarp:1.85,sourceErosion:1.45,soilMicro:1.35});
          if(off.mainSignature===standard.mainSignature||standard.mainSignature===strong.mainSignature)throw Error('A/B/C real mesh signatures are not distinct');
          if(off.soilSignature===standard.soilSignature||standard.soilSignature===strong.soilSignature)throw Error('A/B/C soil mesh signatures are not distinct');
          if(standard.sourceMicroscope.maxDomainWarpM<.65||strong.sourceMicroscope.maxDomainWarpM<=standard.sourceMicroscope.maxDomainWarpM)throw Error('real-form preset response invalid');
          if(standard.soilMicroscope.maxSampleOffsetM<.14||strong.soilMicroscope.maxSampleOffsetM<=standard.soilMicroscope.maxSampleOffsetM)throw Error('soil preset response invalid');
          const out={schema:'LANDSCAPE_R5_K2_G6_RUNTIME_QA',date:'2026-09-17',presets:[off,standard,strong],distinctRockMeshes:true,distinctSoilMeshes:true,quickButtonsTriggerBuild:true,slidersTriggerBuildOnRelease:true,visualApproved:false,productionReady:false};
          fs.writeFileSync('workbenches/landscape-surface-r5-k2-geometry-r6/runtime-qa.json',JSON.stringify(out,null,2));
          console.log(JSON.stringify(out));
          JS
          node --check /tmp/landscape-g6-runtime.js
          node /tmp/landscape-g6-runtime.js

      - name: Materialize G6 candidate and evidence
        run: |
          git config user.name "Landscape Mother"
          git config user.email "actions@users.noreply.github.com"
          git add workbenches/landscape-surface-r5-k2-geometry-r6/index.html \
                  workbenches/landscape-surface-r5-k2-geometry-r6/build.json \
                  workbenches/landscape-surface-r5-k2-geometry-r6/runtime-qa.json
          if git diff --cached --quiet; then
            echo "R5.K2.G6 already materialized"
            exit 0
          fi
          git commit -m "qa(landscape): materialize live real-form R5.K2.G6 [skip ci]"
          git push
