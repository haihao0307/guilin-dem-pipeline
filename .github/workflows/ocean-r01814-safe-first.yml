name: Ocean R018.14 safe-first recovery

on:
  push:
    branches:
      - release/ocean-mother-r01814-safe-first-20260907
    paths:
      - .github/workflows/ocean-r01814-safe-first.yml

permissions:
  contents: write

concurrency:
  group: ocean-r01814-safe-first
  cancel-in-progress: false

jobs:
  build-verify-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out fixed release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct R018.13 and apply safe-first recovery
        shell: bash
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE"
          work=/tmp/ocean-r01814
          out="$root/candidate/index.html"
          mkdir -p "$root/candidate" "$root/evidence"

          cat ocean-mother/releases/r01812-build/patch.part-*.b64 > /tmp/r01812.patch.gz.b64
          echo "9fc71f4eb0d619cae7a553bfb72220f1e3592096190207d35a7dde85221a1b4c  /tmp/r01812.patch.gz.b64" | sha256sum -c -
          base64 -d /tmp/r01812.patch.gz.b64 | gzip -dc > /tmp/r01812.patch

          rm -rf "$work"
          cp -a ocean-mother/restart-v0311 "$work"
          cd "$work"
          patch -p1 < /tmp/r01812.patch

          cat "$root"/ocean-mother/releases/r01813-build/patch.part-*.b64 > /tmp/r01813.patch.gz.b64
          test "$(wc -c < /tmp/r01813.patch.gz.b64)" -eq 20320
          echo "c0a6269951570b655bbe97b71faed1bb8b4a844bb5983bc9ba2c0bd189f50fd7  /tmp/r01813.patch.gz.b64" | sha256sum -c -
          base64 -d /tmp/r01813.patch.gz.b64 | gzip -dc > /tmp/r01813.patch
          echo "581b0b148c247089863efe32e115323d78b0413f1526256783d5ceb3c27cc617  /tmp/r01813.patch" | sha256sum -c -
          patch -p1 < /tmp/r01813.patch

          node --check source/inline-0.js
          python tools/build_single_html.py --output "$out"
          test "$(wc -c < "$out")" -eq 173729
          echo "8ad71fa0c54ae0aa48110fd922fd4b45e1d2c8df7c93040c7574939ecec1914d  $out" | sha256sum -c -

          cd "$root/candidate"
          test "$(wc -c < "$root/ocean-mother/releases/r01814-build/html.patch.gz.b64")" -eq 10504
          echo "e98555ffdea0979d41860514595cbef85a8a9f8b0973cc02eaa2e3ce7e22e5a1  $root/ocean-mother/releases/r01814-build/html.patch.gz.b64" | sha256sum -c -
          base64 -d "$root/ocean-mother/releases/r01814-build/html.patch.gz.b64" | gzip -dc > /tmp/r01814-html.patch
          echo "3a5bd6161905cbac11c1fd8ba35df4b6ca7a2c0aa2ed097935c75e7698a3f02a  /tmp/r01814-html.patch" | sha256sum -c -
          patch -p1 < /tmp/r01814-html.patch

          test "$(wc -c < "$out")" -eq 173242
          echo "3233e78f160a75d7255698879b4933c8654367e549fa4b3830b4e860f496a19e  $out" | sha256sum -c -
          grep -q "0.3.14-island-r018-safe-first" "$out"
          grep -q "r01814-safe-first-surface-query" "$out"
          grep -q "startupStage='safe-compile'" "$out"
          grep -q "if(safeMode)gl.finish()" "$out"
          grep -q "stopBoot();startupStage=safeMode?'safe-visible':'scene-visible'" "$out"
          if grep -qE '<script[^>]+src=|<img[^>]+src=|https://cdn\.|https://unpkg\.|https://jsdelivr\.' "$out"; then
            echo "External runtime asset detected" >&2
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('/tmp/does-not-exist')
          source = Path('/home/runner/work/guilin-dem-pipeline/guilin-dem-pipeline/candidate/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', source, re.S)
          runtime = next(block for block in scripts if 'window.OceanMother' in block)
          Path('/tmp/r01814-runtime.mjs').write_text(runtime, encoding='utf-8')
          PY
          node --check /tmp/r01814-runtime.mjs

      - name: Run normal-entry desktop and mobile browser gate
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          cp ocean-mother/releases/r01813-build/qa_startup.py /tmp/qa_r01814.py
          sed -i 's/0.3.13-island-r018-startup-recovery/0.3.14-island-r018-safe-first/g' /tmp/qa_r01814.py
          python3 -m py_compile /tmp/qa_r01814.py
          python3 -m http.server 8123 --bind 127.0.0.1 > evidence/server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 1
          python3 /tmp/qa_r01814.py \
            --chrome "$CHROME" \
            --url "http://127.0.0.1:8123/candidate/index.html" \
            --output evidence

      - name: Record and commit immutable single HTML
        shell: bash
        run: |
          set -euo pipefail
          target=ocean-mother/releases/Ocean_Mother_R01814_Safe_First_Direct_Open.html
          cp candidate/index.html "$target"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json
          html = Path('ocean-mother/releases/Ocean_Mother_R01814_Safe_First_Direct_Open.html')
          qa = json.loads(Path('evidence/STARTUP_QA.json').read_text(encoding='utf-8'))
          receipt = {
              'schema': 'ocean-fixed-single-html-receipt/3',
              'version': '0.3.14',
              'runtimeIdentity': '0.3.14-island-r018-safe-first',
              'sourceBaselineCommit': 'c59fdf8ed7f04a1a7eadb42d9dd68a3151bbf4a6',
              'htmlPath': str(html),
              'htmlBytes': html.stat().st_size,
              'htmlSha256': hashlib.sha256(html.read_bytes()).hexdigest(),
              'singleFileHtml': True,
              'externalRuntimeAssets': False,
              'frozenDeepModified': False,
              'normalEntryDesktopChecked': True,
              'normalEntryMobile390x844Checked': True,
              'safeFirstScene': True,
              'bootHeldUntilFirstCompleteFrame': True,
              'synchronousSafeTileCompletion': True,
              'surfaceQueryDeferredAfterVisibleScene': True,
              'desktopStartupStage': qa['desktop']['qa'].get('startupStage'),
              'desktopSafeMode': qa['desktop']['qa'].get('safeMode'),
              'desktopQueryAvailable': qa['desktop']['qa'].get('queryAvailable'),
              'desktopQueryVerified': qa['desktop']['qa'].get('queryVerified'),
              'desktopFirstFrameMs': qa['desktop']['qa'].get('firstFrameMs'),
              'mobileStartupStage': qa['mobile']['qa'].get('startupStage'),
              'mobileSafeMode': qa['mobile']['qa'].get('safeMode'),
              'mobileQueryAvailable': qa['mobile']['qa'].get('queryAvailable'),
              'mobilePanelClosed': qa['mobile']['panelClosed'],
              'hardwareGpuVerified': False,
              'visualAcceptance': False,
              'productionReady': False,
          }
          Path('ocean-mother/releases/Ocean_Mother_R01814_Safe_First_RECEIPT.json').write_text(
              json.dumps(receipt, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          test "$(wc -c < "$target")" -eq 173242
          echo "3233e78f160a75d7255698879b4933c8654367e549fa4b3830b4e860f496a19e  $target" | sha256sum -c -
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add "$target" ocean-mother/releases/Ocean_Mother_R01814_Safe_First_RECEIPT.json
          git commit -m "release(ocean): publish R018.14 safe-first fixed workbench [skip ci]"
          FINAL_SHA="$(git rev-parse HEAD)"
          printf '%s\n' "$FINAL_SHA" > evidence/FINAL_COMMIT.txt
          git push origin HEAD

      - name: Verify fixed-commit raw.githack delivery bytes
        shell: bash
        run: |
          set -euo pipefail
          FINAL_SHA="$(cat evidence/FINAL_COMMIT.txt)"
          PATH_IN_REPO=ocean-mother/releases/Ocean_Mother_R01814_Safe_First_Direct_Open.html
          URL="https://raw.githack.com/haihao0307/guilin-dem-pipeline/${FINAL_SHA}/${PATH_IN_REPO}"
          printf '%s\n' "$URL" > evidence/RAW_GITHACK_URL.txt
          ok=0
          for attempt in $(seq 1 24); do
            if curl --fail --location --silent --show-error --connect-timeout 10 --max-time 45 "$URL" -o evidence/raw.githack.html; then
              if test "$(wc -c < evidence/raw.githack.html)" -eq 173242 && echo "3233e78f160a75d7255698879b4933c8654367e549fa4b3830b4e860f496a19e  evidence/raw.githack.html" | sha256sum -c -; then
                ok=1
                break
              fi
            fi
            sleep 5
          done
          test "$ok" -eq 1
          grep -q "0.3.14-island-r018-safe-first" evidence/raw.githack.html

      - name: Upload complete verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Ocean_Mother_R01814_Safe_First
          path: |
            candidate/index.html
            ocean-mother/releases/Ocean_Mother_R01814_Safe_First_Direct_Open.html
            ocean-mother/releases/Ocean_Mother_R01814_Safe_First_RECEIPT.json
            evidence/
          if-no-files-found: warn
          retention-days: 30
