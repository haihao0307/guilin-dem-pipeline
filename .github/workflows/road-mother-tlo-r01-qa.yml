name: Road Mother TLO R01 browser QA
on:
  push:
    branches: [main]
    paths:
      - 'kaopu-geography-workbench/road-mother-tlo-r01/**'
      - '.github/workflows/road-mother-tlo-r01-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate semantic model
        run: node kaopu-geography-workbench/road-mother-tlo-r01/test-model.mjs
      - name: Prepare official browser test tool
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Test exact source on desktop and phone viewports
        env:
          QA_URL: http://127.0.0.1:8080/kaopu-geography-workbench/road-mother-tlo-r01/
          QA_OUT: qa-output
        run: |
          python3 -m http.server 8080 > /tmp/road-server.log 2>&1 &
          node kaopu-geography-workbench/road-mother-tlo-r01/browser-qa.mjs
      - name: Verify published bytes and public interactions
        env:
          QA_URL: https://haihao0307.github.io/guilin-dem-pipeline/kaopu-geography-workbench/road-mother-tlo-r01/
          QA_OUT: public-qa-output
        run: |
          for attempt in $(seq 1 60); do
            curl -fsSL "$QA_URL/renderer.mjs?verify=$GITHUB_SHA" -o /tmp/live-road-renderer.mjs && cmp -s /tmp/live-road-renderer.mjs kaopu-geography-workbench/road-mother-tlo-r01/renderer.mjs && break
            sleep 10
          done
          cmp /tmp/live-road-renderer.mjs kaopu-geography-workbench/road-mother-tlo-r01/renderer.mjs
          node kaopu-geography-workbench/road-mother-tlo-r01/browser-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: road-mother-tlo-r01-browser-proof
          path: |
            qa-output
            public-qa-output
          retention-days: 14

