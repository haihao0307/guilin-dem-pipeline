name: Wenzhou uncropped source coverage scope review

on:
  push:
    branches:
      - project/wenzhou-v110-3d-satellite-osm-water
    paths:
      - .github/workflows/wenzhou-scope-review.yml
      - web/wenzhou-scope-review/**
      - tests/wenzhou_scope_review_browser.mjs
      - projects/wenzhou/reports/WENZHOU_SCOPE_REVIEW_V001.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wenzhou-scope-review
  cancel-in-progress: false

jobs:
  qa-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout latest Wenzhou Draft branch
        uses: actions/checkout@v4
        with:
          ref: project/wenzhou-v110-3d-satellite-osm-water
          fetch-depth: 0
          lfs: false

      - name: Static scope checks
        shell: bash
        run: |
          set -euo pipefail
          test -f web/wenzhou-scope-review/index.html
          test -f tests/wenzhou_scope_review_browser.mjs
          test -f projects/wenzhou/reports/WENZHOU_SCOPE_REVIEW_V001.json
          python3 -m json.tool projects/wenzhou/reports/WENZHOU_SCOPE_REVIEW_V001.json >/dev/null
          node --check tests/wenzhou_scope_review_browser.mjs
          grep -q '原始未裁切源覆盖与范围复核' web/wenzhou-scope-review/index.html
          grep -q 'AP_12115_FBD_F0550_RT1' web/wenzhou-scope-review/index.html
          grep -q '文成县玉壶镇' web/wenzhou-scope-review/index.html
          grep -q '永嘉自然岛' web/wenzhou-scope-review/index.html
          grep -q '208500' web/wenzhou-scope-review/index.html

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local review server
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 18993 --bind 127.0.0.1 >/tmp/wenzhou-scope-http.log 2>&1 &
          echo $! >/tmp/wenzhou-scope-http.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:18993/web/wenzhou-scope-review/index.html >/dev/null; then
              exit 0
            fi
            sleep 0.5
          done
          cat /tmp/wenzhou-scope-http.log
          exit 1

      - name: Run desktop and mobile scope browser QA
        shell: bash
        env:
          WENZHOU_SCOPE_URL: http://127.0.0.1:18993/web/wenzhou-scope-review/
        run: |
          set -euo pipefail
          rm -rf projects/wenzhou/evidence/scope-review
          mkdir -p projects/wenzhou/evidence/scope-review
          node tests/wenzhou_scope_review_browser.mjs | tee /tmp/wenzhou-scope-browser.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('projects/wenzhou/reports/WENZHOU_SCOPE_REVIEW_BROWSER_QA.json').read_text(encoding='utf-8'))
          assert report['passed'] is True
          assert report['checks']['rawSourceFootprints'] == 11
          assert report['checks']['yuhuMarker'] is True
          assert report['checks']['naturalIslandReferenceMarker'] is True
          assert report['checks']['screenshotCount'] == 8
          assert report['checks']['distinctScreenshotCount'] == 8
          assert all(item['consoleErrors'] == [] for item in report['results'])
          assert all(item['pageErrors'] == [] for item in report['results'])
          print(json.dumps({'passed': True, 'screenshots': 8, 'desktopAndMobile': True}, ensure_ascii=False, indent=2))
          PY

      - name: Commit scope review browser evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- projects/wenzhou/evidence/scope-review projects/wenzhou/reports/WENZHOU_SCOPE_REVIEW_BROWSER_QA.json
          git commit -m 'Add verified Wenzhou uncropped scope review evidence [skip scope review]'
          git pull --rebase origin project/wenzhou-v110-3d-satellite-osm-water
          git push origin HEAD:project/wenzhou-v110-3d-satellite-osm-water

      - name: Publish scope review to gh-pages
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/wenzhou-scope-gh-pages
          git fetch origin gh-pages
          git worktree add -B gh-pages /tmp/wenzhou-scope-gh-pages origin/gh-pages
          rm -rf /tmp/wenzhou-scope-gh-pages/wenzhou-scope-review
          cp -a web/wenzhou-scope-review /tmp/wenzhou-scope-gh-pages/wenzhou-scope-review
          cp projects/wenzhou/reports/WENZHOU_SCOPE_REVIEW_V001.json /tmp/wenzhou-scope-gh-pages/wenzhou-scope-review/SCOPE_REVIEW.json
          touch /tmp/wenzhou-scope-gh-pages/.nojekyll
          cd /tmp/wenzhou-scope-gh-pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .nojekyll wenzhou-scope-review
          git commit -m 'Publish Wenzhou uncropped source coverage scope review'
          git push origin HEAD:gh-pages

      - name: Verify public scope page
        shell: bash
        run: |
          set -euo pipefail
          URL='https://haihao0307.github.io/guilin-dem-pipeline/wenzhou-scope-review/'
          success=0
          for attempt in $(seq 1 120); do
            if curl --fail --silent --show-error --location "$URL" -o /tmp/wenzhou-scope-online.html; then
              if grep -q '原始未裁切源覆盖与范围复核' /tmp/wenzhou-scope-online.html; then
                success=1
                break
              fi
            fi
            sleep 2
          done
          test "$success" = '1'
          curl --fail --silent --show-error --location "${URL}SCOPE_REVIEW.json" -o /tmp/wenzhou-scope-online.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/wenzhou-scope-online.json').read_text(encoding='utf-8'))
          assert data['uncroppedSourceCoverage']['selectedProductCount'] == 11
          assert data['anchors']['yuhuTown']['insideCurrentTruthCog'] is False
          assert data['anchors']['naturalIsland']['insideCurrentTruthCog'] is True
          assert data['proposedExpandedAoi']['includesYuhuTown'] is True
          print(json.dumps({'onlineVerified': True, 'url': 'https://haihao0307.github.io/guilin-dem-pipeline/wenzhou-scope-review/', 'selectedProducts': 11}, ensure_ascii=False, indent=2))
          PY

      - name: Upload scope review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wenzhou-scope-review
          path: |
            projects/wenzhou/evidence/scope-review/**
            projects/wenzhou/reports/WENZHOU_SCOPE_REVIEW_V001.json
            projects/wenzhou/reports/WENZHOU_SCOPE_REVIEW_BROWSER_QA.json
            /tmp/wenzhou-scope-browser.log
            /tmp/wenzhou-scope-http.log
            /tmp/wenzhou-scope-online.html
            /tmp/wenzhou-scope-online.json
          if-no-files-found: warn
          compression-level: 0
          retention-days: 90
