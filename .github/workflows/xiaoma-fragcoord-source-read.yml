name: Xiaoma one-shot public shader read
on:
  push:
    branches: ['handoff/xiaoma-mentor-v1.1-20260905']
    paths: ['.github/workflows/xiaoma-fragcoord-source-read.yml']
permissions:
  contents: read
jobs:
  read-public-source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read public shader data only; no source execution or production writes
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, re, urllib.request, urllib.parse
          from datetime import datetime, timezone

          def get_text(url, headers=None, limit=1048576):
              req=urllib.request.Request(url, headers={'User-Agent':'Xiaoma-Public-Source-Review/1.0', **(headers or {})})
              with urllib.request.urlopen(req, timeout=35) as response:
                  payload=response.read(limit+1)
                  if len(payload)>limit:
                      raise RuntimeError('Response exceeds read budget')
                  return payload.decode('utf-8')

          # Read this immutable adapter as text only to locate its published,
          # anonymous read API. No downloaded Python or shader is executed.
          adapter_url='https://raw.githubusercontent.com/jheidt/twiglterm/d7a815b48c604d9a6fca34b81fd8c7157002a0eb/src/twiglterm/sources.py'
          adapter=get_text(adapter_url)
          endpoint=re.search(r'^FRAGCOORD_URL = "([^\"]+)"',adapter,re.M).group(1)
          key=re.search(r'^FRAGCOORD_KEY = "([^\"]+)"',adapter,re.M).group(1)
          if endpoint != 'https://ixyhaetjrmcgekzydqit.supabase.co/rest/v1/shaders' or not key.startswith('sb_publishable_'):
              raise RuntimeError('Unexpected public API identity')
          print('::add-mask::'+key)
          query=urllib.parse.urlencode({'select':'*,shader_passes(*)','slug':'eq.cltuv8os'})
          raw=get_text(endpoint+'?'+query, {'apikey':key,'Authorization':'Bearer '+key})
          rows=json.loads(raw)
          if not isinstance(rows,list) or len(rows)!=1 or rows[0].get('slug')!='cltuv8os':
              raise RuntimeError('Exact public shader not returned')
          record=rows[0]
          # Keep only artwork fields. Never log account tokens or user profiles.
          allowed=('slug','title','description','created_at','updated_at','license','visibility','is_public','mode','tags')
          out={k:record[k] for k in allowed if k in record}
          out['read_at']=datetime.now(timezone.utc).isoformat()
          out['source']='https://fragcoord.xyz/s/cltuv8os'
          out['pass_count']=len(record.get('shader_passes') or [])
          out['passes']=[]
          for p in sorted(record.get('shader_passes') or [],key=lambda p:p.get('sort_order') or 0):
              code=p.get('code') or ''
              if len(code)>18000:
                  raise RuntimeError('Shader exceeds excerpt budget')
              item={k:p[k] for k in ('name','type','language','sort_order') if k in p}
              item.update(code_characters=len(code),code_sha256=hashlib.sha256(code.encode()).hexdigest(),code=code)
              out['passes'].append(item)
          print('PUBLIC_SHADER_READ_BEGIN')
          # JSON string escaping stops fetched newlines becoming workflow commands.
          print(json.dumps(out,ensure_ascii=True))
          print('PUBLIC_SHADER_READ_END')
          PY
