name: KAOPU W01 world water handoff contract

on:
  push:
    branches:
      - coordination/kaopu-learning-flywheel-r1-20260909
    paths:
      - 'docs/mother_coordination/kaopu_learning_flywheel_v1/PROBES/world_water_handoff_contract_w01.mjs'
      - 'docs/mother_coordination/kaopu_learning_flywheel_v1/references/world-water-handoff-contract-w01/SOURCE_LOCK.json'
      - '.github/workflows/kaopu-world-water-handoff-contract-w01.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run W01 continuity and counterexample probe
        run: |
          node docs/mother_coordination/kaopu_learning_flywheel_v1/PROBES/world_water_handoff_contract_w01.mjs /tmp/world_water_handoff_contract_result_w01.json
          diff -u \
            <(jq -S . docs/mother_coordination/kaopu_learning_flywheel_v1/PROBES/world_water_handoff_contract_result_w01.json) \
            <(jq -S . /tmp/world_water_handoff_contract_result_w01.json)
      - name: Upload exact result
        uses: actions/upload-artifact@v4
        with:
          name: kaopu-w01-world-water-handoff-contract
          path: /tmp/world_water_handoff_contract_result_w01.json
          if-no-files-found: error
