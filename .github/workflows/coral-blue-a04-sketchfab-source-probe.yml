name: Probe Blue Coral Teacher Asset Transport

on:
  push:
    branches: [work/coral-blue-a04-hdf-exact-20260923]
    paths:
      - .github/workflows/coral-blue-a04-sketchfab-source-probe.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coral-blue-a04-source-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser probe
        run: |
          npm install --no-save playwright@1.51.1
          npx playwright install --with-deps chromium
      - name: Capture official public viewer network with software WebGL
        run: |
          rm -rf apps/coral-restart-20260923/blue-coral-a04-hdf/source-probe
          cat > probe.mjs <<'JS'
          import { chromium } from 'playwright';
          import { createHash } from 'node:crypto';
          import fs from 'node:fs';
          import path from 'node:path';
          const uid='28a6da41dc6b40bfaaec9a8a4eea4fc0';
          const expected={
            sceneBin:'23f65069936dc9316b975617beb9a07991a24b20bba8de5f45ff6bb0afecadb3',
            sceneGltf:'6a13fc948469db72878528f4941a734bfac256dc1d2939ab6dcc9e2fe1818e0a',
            texture:'27734e7adaa0657fb314715088f74c707c12c8029965cb12172fef104a673906'
          };
          const root='apps/coral-restart-20260923/blue-coral-a04-hdf/source-probe';
          const bodies=path.join(root,'bodies');
          fs.mkdirSync(bodies,{recursive:true});
          const hash=b=>createHash('sha256').update(b).digest('hex');
          const directUrls=[
            `https://api.sketchfab.com/v3/models/${uid}`,
            `https://api.sketchfab.com/v3/models/${uid}/download`,
            `https://sketchfab.com/i/models/${uid}`,
            `https://sketchfab.com/i/models/${uid}/fallback`,
            `https://sketchfab.com/i/models/${uid}/download`,
            `https://sketchfab.com/i/models/${uid}/textures`,
            `https://sketchfab.com/i/models/${uid}/archives`,
            `https://sketchfab.com/i/browser-support`,
            `https://sketchfab.com/oembed?url=https://sketchfab.com/3d-models/blue-coral-${uid}`
          ];
          const direct=[];
          for(let i=0;i<directUrls.length;i++){
            const url=directUrls[i];
            try{
              const r=await fetch(url,{redirect:'follow',headers:{'user-agent':'Coral-A04-Source-Probe/2.0','accept':'*/*'}});
              const body=Buffer.from(await r.arrayBuffer());
              const type=r.headers.get('content-type')||'';
              const sha256=hash(body);
              const ext=/json/.test(type)?'.json':/zip/.test(type)?'.zip':/image/.test(type)?'.img':'.bin';
              const name=`direct-${String(i).padStart(2,'0')}-${sha256.slice(0,16)}${ext}`;
              fs.writeFileSync(path.join(bodies,name),body);
              direct.push({url,finalUrl:r.url,status:r.status,contentType:type,bytes:body.length,sha256,matchesKnown:Object.entries(expected).filter(([,v])=>v===sha256).map(([k])=>k),savedAs:name});
            }catch(error){direct.push({url,error:String(error)})}
          }
          const browser=await chromium.launch({
            headless:false,
            args:['--ignore-gpu-blocklist','--enable-webgl','--enable-webgl2-compute-context','--enable-unsafe-swiftshader','--use-gl=angle','--use-angle=swiftshader','--disable-dev-shm-usage']
          });
          const context=await browser.newContext({viewport:{width:1280,height:900},deviceScaleFactor:1});
          const page=await context.newPage();
          const webgl=await page.evaluate(()=>{
            const c=document.createElement('canvas');
            const g2=c.getContext('webgl2');
            const g1=g2||c.getContext('webgl');
            return {webgl2:!!g2,webgl:!!g1,renderer:g1?g1.getParameter(g1.RENDERER):null,vendor:g1?g1.getParameter(g1.VENDOR):null};
          });
          const rows=[];const pending=[];let serial=0;
          page.on('response',response=>{
            const task=(async()=>{
              const url=response.url();
              let headers={};try{headers=await response.allHeaders();}catch{}
              const type=headers['content-type']||'';
              const reqType=response.request().resourceType();
              const isBuild=/static\.sketchfab\.com\/static\/builds/.test(url);
              const possibleAsset=/media\.sketchfab|cloudfront|amazonaws|cdn\.|models\/.*\/(files|archives|textures|fallback)|\.bin(\?|$)|\.gz(\?|$)|\.zip(\?|$)|\.osgjs(\?|$)/i.test(url);
              const keepMeta=!isBuild && (/sketchfab|cloudfront|amazonaws|cdn/i.test(url));
              if(!keepMeta)return;
              const row={url,status:response.status(),contentType:type,declaredBytes:Number(headers['content-length']||0),resourceType:reqType};
              if(response.status()===200 && (possibleAsset || ['xhr','fetch','other'].includes(reqType))){
                try{
                  const body=Buffer.from(await response.body());
                  row.bodyBytes=body.length;row.sha256=hash(body);row.matchesKnown=Object.entries(expected).filter(([,v])=>v===row.sha256).map(([k])=>k);
                  if(body.length>1000 && body.length<50000000){
                    const ext=/json/.test(type)?'.json':/image/.test(type)?'.img':/zip/.test(type)?'.zip':'.bin';
                    const name=`net-${String(serial++).padStart(3,'0')}-${row.sha256.slice(0,16)}${ext}`;
                    fs.writeFileSync(path.join(bodies,name),body);row.savedAs=name;
                  }
                }catch(error){row.bodyError=String(error)}
              }
              rows.push(row);
            })();pending.push(task);
          });
          const consoleErrors=[];page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
          const pageErrors=[];page.on('pageerror',e=>pageErrors.push(String(e)));
          const target=`https://sketchfab.com/models/${uid}/embed?autostart=1&preload=1&ui_hint=0&ui_infos=0&ui_controls=0`;
          let navigation=null;
          try{
            const r=await page.goto(target,{waitUntil:'domcontentloaded',timeout:120000});
            navigation={status:r?.status(),url:page.url()};
            for(const selector of ['button[aria-label*="play" i]','.viewer-start-button','.start-button','button:has-text("Play")']){
              try{const el=page.locator(selector).first();if(await el.count()){await el.click({timeout:3000});break}}catch{}
            }
            await page.waitForTimeout(120000);
          }catch(error){navigation={error:String(error),url:page.url()}}
          await Promise.allSettled(pending);
          await page.screenshot({path:path.join(root,'viewer.png'),fullPage:false}).catch(()=>{});
          await browser.close();
          rows.sort((a,b)=>(b.bodyBytes||b.declaredBytes||0)-(a.bodyBytes||a.declaredBytes||0));
          const matches=rows.filter(r=>r.matchesKnown?.length);
          const result={schema:'kaopu.coral-source-probe/2.0',uid,target,navigation,webgl,expected,direct,requests:rows,matches,consoleErrors,pageErrors,generatedAt:new Date().toISOString()};
          fs.writeFileSync(path.join(root,'NETWORK_PROBE.json'),JSON.stringify(result,null,2));
          console.log('WEBGL',JSON.stringify(webgl));
          console.log('DIRECT',JSON.stringify(direct,null,2));
          console.log('PROBE_ROWS',rows.length,'MATCHES',JSON.stringify(matches));
          console.log(JSON.stringify(rows.slice(0,50),null,2));
          JS
          xvfb-run -a node probe.mjs
      - name: Commit probe evidence only
        run: |
          git config user.name 'Coral Mother Probe'
          git config user.email 'coral-probe@users.noreply.github.com'
          git add apps/coral-restart-20260923/blue-coral-a04-hdf/source-probe
          git diff --cached --quiet && exit 0
          git commit -m 'coral: record official Blue Coral viewer transport probe v2 [skip ci]'
          git push origin HEAD:work/coral-blue-a04-hdf-exact-20260923
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coral-blue-a04-source-probe-v2
          path: apps/coral-restart-20260923/blue-coral-a04-hdf/source-probe
          retention-days: 7
