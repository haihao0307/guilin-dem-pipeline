name: Tailor R0434 native replay diagnosis
on:
  push:
    branches: [fix/tailor-display-r0434-20261011]
    paths: [.github/workflows/tailor-r0434-replay.yml]
permissions:
  contents: read
  actions: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: kaopu-tailor-workbench/presets/r04
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Retrieve original public acceptance artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: haihao0307/guilin-dem-pipeline
          run-id: 38110665349
          name: tailor-r0434-actual-public-evidence
          path: original-public-evidence
      - name: Preserve exact first public acceptance including failed comparison
        run: |
          mkdir -p replay-evidence
          python - <<'PY'
          import hashlib,shutil
          from pathlib import Path
          expected={'R0434_PUBLIC_REPORT.json':'cef725c76807ee40389010a52cfa8b8a1798487537e673bcc4fa245d00c963ad','R0434_SAFETY_PUBLIC_REPORT.json':'d6dde95f09d19dfc38111749512fa89a09d30e7c6bfc3461baac6bfad95127b8','R0434_FRESH_PUBLIC_REPORT.json':'264bc9137875c586a2afc283ab4d77cc740f3a5851c7c64c291f7d80aa0fedcc','R0434_PUBLIC_BYTES.json':'0c2c13a3aa0c973e076a4dbd369148df1187c2f74f05870319e4eb9373662b67','public-fresh.log':'4758f734e7a1a7f9261756c536a85ae03f4694379ba41eb7d66fc9e171516c6c','finish.log':'1f2754f76950405a2816fc4c67f78be186681cbc103e31e4a8032f7e06bab827'}
          p=Path('kaopu-tailor-workbench/presets/r04/qa-r0434-first-public');p.mkdir()
          for n,h in expected.items():
            f=Path('original-public-evidence')/n
            assert hashlib.sha256(f.read_bytes()).hexdigest()==h,n
            shutil.copy2(f,p/n)
          PY
      - name: Prepare actual browser
        run: |
          pip install playwright==1.57.0 pillow
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Two independent public native solves with strict unchanged output tolerance
        run: python kaopu-tailor-workbench/presets/r04/qa_replay_r0434.py 2>&1 | tee replay-evidence/replay.log
      - name: Preserve complete native packets and visual evidence
        if: always()
        run: |
          mkdir -p replay-evidence
          P=kaopu-tailor-workbench/presets/r04
          cp "$P/qa_replay_r0434.py" replay-evidence/
          cp "$P/R0434_REPLAY_REPORT.json" replay-evidence/ 2>/dev/null || true
          cp -r "$P/qa-r0434-replay" "$P/qa-r0434-first-public" replay-evidence/ 2>/dev/null || true
          git rev-parse HEAD > replay-evidence/COMMIT.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tailor-r0434-native-replay-evidence
          path: replay-evidence/
          retention-days: 14
