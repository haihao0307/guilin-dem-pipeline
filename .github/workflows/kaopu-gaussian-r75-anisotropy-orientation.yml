name: KAOPU Gaussian R75 Anisotropy Orientation

on:
  push:
    branches:
      - coordination/kaopu-learning-flywheel-r1-20260909
    paths:
      - docs/mother_coordination/kaopu_learning_flywheel_v1/PROBES/gaussian_three_anisotropy_orientation_r75.html
      - docs/mother_coordination/kaopu_learning_flywheel_v1/PROBES/run_gaussian_anisotropy_orientation_r75.js
      - docs/mother_coordination/kaopu_learning_flywheel_v1/ADAPTERS/gaussian_anisotropy_orientation_gate_r75.mjs
      - .github/workflows/kaopu-gaussian-r75-anisotropy-orientation.yml

permissions:
  contents: read

jobs:
  r75-anisotropy-orientation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned renderer and browser harness
        run: |
          npm init -y
          npm pkg set type=module
          npm install --no-save three@0.186.0 playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Start local fixture server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/r75-http.log 2>&1 &
          sleep 2
          curl --fail --silent http://127.0.0.1:8765/docs/mother_coordination/kaopu_learning_flywheel_v1/PROBES/gaussian_three_anisotropy_orientation_r75.html > /dev/null
      - name: Run preregistered anisotropy-orientation probe
        run: node docs/mother_coordination/kaopu_learning_flywheel_v1/PROBES/run_gaussian_anisotropy_orientation_r75.js
      - name: Validate R75 evidence contract
        run: |
          cat r75-comparison.json | node docs/mother_coordination/kaopu_learning_flywheel_v1/ADAPTERS/gaussian_anisotropy_orientation_gate_r75.mjs > r75-gate.json
          cat r75-gate.json
          node -e "const d=require('./r75-gate.json');if(d.status!=='Candidate-pass')process.exit(10)"
      - name: Upload R75 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaopu-gaussian-r75-anisotropy-orientation
          path: r75-*.json
          if-no-files-found: warn
          retention-days: 30
