name: Landscape R5.K2.G3 Warped Microscope Soil

on:
  push:
    branches:
      - feature/landscape-microscope-geometry-lab-r1-20260916
    paths:
      - workbenches/landscape-surface-r5-k2-geometry-r3/build_r3.py
      - .github/workflows/landscape-r5-k2-geometry-r3.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build G3 candidate
        run: |
          python -m py_compile workbenches/landscape-surface-r5-k2-geometry-r3/build_r3.py
          python workbenches/landscape-surface-r5-k2-geometry-r3/build_r3.py

      - name: Static workbench QA
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re
          root = Path('workbenches/landscape-surface-r5-k2-geometry-r3')
          s = (root / 'index.html').read_text(encoding='utf-8')
          b = json.loads((root / 'build.json').read_text(encoding='utf-8'))
          required = [
              'R5.K2.G3', 'soilMicroscopeR1', 'LANDSCAPE_SOIL_MICROSCOPE_R1',
              'id="soilMicro"', 'id="shellWarp"', 'id="shellBreakup"',
              'uShellWarp', 'uShellBreakup', 'uGroundMicro',
              'terrainSupportUsesDisplacedMesh:true',
              'warp:.92', 'phase*(.36+1.24*uShellBreakup)'
          ]
          for token in required:
              assert token in s, token
          assert b['schema'] == 'LANDSCAPE_R5_K2_G3_WARPED_MICROSCOPE_SOIL_R1'
          assert b['geometry']['macroReplacement'] is False
          assert b['soil']['topSurfaceOnly'] is True
          assert b['soil']['terrainSupportUsesDisplacedMesh'] is True
          blocks = []
          for sid in ('worldSource', 'generateSource'):
              m = re.search(r'<script id="%s" type="text/plain">(.*?)</script>' % sid, s, re.S)
              assert m, sid
              blocks.append(m.group(1))
          Path('/tmp/landscape-g3-worker.js').write_text('\n'.join(blocks), encoding='utf-8')
          print(json.dumps(b, ensure_ascii=False, indent=2))
          PY
          node --check /tmp/landscape-g3-worker.js

      - name: Prepare numerical runtime QA
        run: |
          cp /tmp/landscape-g3-worker.js /tmp/landscape-g3-runtime.js
          cat >> /tmp/landscape-g3-runtime.js <<'JS'
          const fs=require('fs');
          function run(label,overrides={}){
            const cfg={schema:'landscape-function-world/1',core:'limestone-water-2',seed:83,stage:4,fracture:1,relief:1,geo:1.65,concavity:.85,spikeGuard:.95,soilMicro:.80,...overrides};
            const data=generateScene(cfg,()=>{});
            const g=data.report.microscopeGeometry;
            const soil=data.report.soilMicroscope;
            console.log(label.toUpperCase()+'_ROCK='+JSON.stringify(g));
            console.log(label.toUpperCase()+'_SOIL='+JSON.stringify(soil));
            if(!g||g.schema!=='LANDSCAPE_MICROSCOPE_GEOMETRY_R2')throw Error(label+': rock geometry report missing');
            if(g.protectedDriftCount!==0)throw Error(label+': protected drift '+g.protectedDriftCount);
            if(g.triangleFlipCount!==0||g.baseTriangleFlipCount!==0)throw Error(label+': rock triangle flip');
            if(g.warp<.90)throw Error(label+': main geometry warp not restored');
            if(!soil||soil.schema!=='LANDSCAPE_SOIL_MICROSCOPE_R1')throw Error(label+': soil microscope missing');
            if(soil.triangleFlipCount!==0)throw Error(label+': soil triangle flips '+soil.triangleFlipCount);
            if(!soil.terrainSupportUsesDisplacedMesh)throw Error(label+': terrain support not using displaced soil');
            if(soil.effectiveScale<=0)throw Error(label+': soil safety gate disabled displacement');
            if(soil.maxDisplacementM<.001)throw Error(label+': soil response too weak '+soil.maxDisplacementM);
            if(soil.maxDisplacementM>.05)throw Error(label+': soil response too large '+soil.maxDisplacementM);
            if(soil.activeVertexCount<1000)throw Error(label+': too few soil vertices active '+soil.activeVertexCount);
            return {label,config:cfg,microscopeGeometry:g,soilMicroscope:soil,mainVertices:data.report.mainVertices,mainTriangles:data.report.mainTriangles,geometryGridM:data.report.geometryGridM};
          }
          const standard=run('standard');
          const strongerSoil=run('strongerSoil',{soilMicro:1.35});
          if(strongerSoil.soilMicroscope.maxDisplacementM+1e-9<standard.soilMicroscope.maxDisplacementM)throw Error('stronger soil setting reduced displacement');
          const out={schema:'LANDSCAPE_R5_K2_G3_RUNTIME_QA',date:'2026-09-17',variants:[standard,strongerSoil],geometryFieldCoupled:false,visualApproved:false,productionReady:false};
          fs.writeFileSync('workbenches/landscape-surface-r5-k2-geometry-r3/runtime-qa.json',JSON.stringify(out,null,2));
          console.log(JSON.stringify(out));
          JS
          node --check /tmp/landscape-g3-runtime.js

      - name: Run numerical geometry QA
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: node /tmp/landscape-g3-runtime.js

      - name: Materialize candidate and evidence
        run: |
          git config user.name "Landscape Mother"
          git config user.email "actions@users.noreply.github.com"
          git add workbenches/landscape-surface-r5-k2-geometry-r3/index.html \
                  workbenches/landscape-surface-r5-k2-geometry-r3/build.json \
                  workbenches/landscape-surface-r5-k2-geometry-r3/runtime-qa.json
          if git diff --cached --quiet; then
            echo "R5.K2.G3 already materialized"
            exit 0
          fi
          git commit -m "qa(landscape): materialize warped G3 Microscope and soil [skip ci]"
          git push
