name: Tailor R03 source intake
on:
  push:
    branches: [feature/tailor-cabinet-r03-garment-surfaces-20261009]
    paths: ['.github/workflows/tailor-r03-source-intake.yml']
permissions:
  contents: read
jobs:
  intake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            kaopu-tailor-workbench/presets/r01
            kaopu-tailor-workbench/presets/r02
            kaopu-tailor-workbench/garments-r04/vendor
          fetch-depth: 1
      - name: Read frozen anatomy and face topology without changing originals
        run: |
          mkdir -p /tmp/tailor-r03-intake
          git fetch origin 976d315ef8bfd7a7351bbac88cd8c7425b363970 --depth=1
          git show 976d315ef8bfd7a7351bbac88cd8c7425b363970:kaopu-tailor-workbench/r07/continuation/assets/original-anny-rig.json.gz > /tmp/tailor-r03-intake/original-anny-rig.json.gz
          git show HEAD:kaopu-tailor-workbench/garments-r04/assets/body-anny-adult.json > /tmp/tailor-r03-intake/body-anny-adult.json
          git show HEAD:kaopu-tailor-workbench/garments-r04/SOURCES.md > /tmp/tailor-r03-intake/BODY-SOURCES.md
          git show HEAD:kaopu-tailor-workbench/garments-r04/assets/measurements.json > /tmp/tailor-r03-intake/measurements.json
          git show 976d315ef8bfd7a7351bbac88cd8c7425b363970:kaopu-tailor-workbench/catalogue/r074-workbench-app.mjs > /tmp/tailor-r03-intake/r074-workbench-app.mjs
          python - <<'PY'
          import json,gzip,pathlib,shutil
          p=pathlib.Path('/tmp/tailor-r03-intake')
          d=json.loads(gzip.decompress((p/'original-anny-rig.json.gz').read_bytes()))
          (p/'original-anny-rig.json').write_text(json.dumps(d))
          lib=json.loads(pathlib.Path('kaopu-tailor-workbench/presets/r01/library.json').read_text())
          rows=[{k:r.get(k) for k in ['id','name','category','style','overrides','intent']} for r in lib['presets']]
          (p/'recipes-compact.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2))
          for src in ['kaopu-tailor-workbench/presets/r01','kaopu-tailor-workbench/presets/r02','kaopu-tailor-workbench/garments-r04/vendor']:
              shutil.copytree(src,p/src,dirs_exist_ok=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: tailor-r03-frozen-source-intake
          path: /tmp/tailor-r03-intake
          retention-days: 7
