name: Coral R06 Pocillopora Publish

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/coral-r06-pocillopora-publish.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out R06 source branch
        uses: actions/checkout@v4
        with:
          ref: work/coral-mother-r06-pocillopora-specimen-first-20260920
          fetch-depth: 0
          path: source

      - name: Reconstruct and verify direct single-file workbench
        shell: bash
        run: |
          set -euo pipefail
          SHORT="$(git -C source rev-parse --short=7 HEAD)"
          echo "SOURCE_COMMIT=$(git -C source rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "OUT_NAME=coral-mother-r06-pocillopora-t01-${SHORT}" >> "$GITHUB_ENV"
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import base64, gzip, hashlib, json, subprocess

          root = Path('source/workbenches/coral-mother-r06-pocillopora-specimen-first')
          manifest = json.loads((root / 'build.json').read_text(encoding='utf-8'))
          chunks = []
          for item in manifest['payload']:
              p = root / 'payload' / item['file']
              data = p.read_bytes()
              assert len(data) == item['bytes'], (p, len(data), item['bytes'])
              assert hashlib.sha256(data).hexdigest() == item['sha256'], p
              chunks.append(data)
          b64 = b''.join(chunks)
          assert len(b64) == manifest['source']['base64Bytes']
          packed = base64.b64decode(b64, validate=True)
          assert len(packed) == manifest['source']['gzipBytes']
          assert hashlib.sha256(packed).hexdigest() == manifest['source']['gzipSha256']
          html = gzip.decompress(packed)
          assert len(html) == manifest['source']['bytes']
          assert hashlib.sha256(html).hexdigest() == manifest['source']['sha256']
          low = html.lower()
          assert low.startswith(b'<!doctype html>')
          assert b'<canvas' in low and b'</html>' in low
          assert b'fetch(' not in html
          assert b'.glb' not in low

          out = Path('/tmp/r06-direct')
          out.mkdir(parents=True, exist_ok=True)
          (out / 'index.html').write_bytes(html)

          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=False)
                  self.inside = False
                  self.buf = []
                  self.scripts = []
              def handle_starttag(self, tag, attrs):
                  if tag.lower() == 'script':
                      self.inside = True
                      self.buf = []
              def handle_endtag(self, tag):
                  if tag.lower() == 'script' and self.inside:
                      self.scripts.append(''.join(self.buf))
                      self.inside = False
              def handle_data(self, data):
                  if self.inside:
                      self.buf.append(data)

          parser = Scripts()
          parser.feed(html.decode('utf-8'))
          assert parser.scripts
          script_dir = Path('/tmp/r06-scripts')
          script_dir.mkdir(exist_ok=True)
          for i, script in enumerate(parser.scripts):
              p = script_dir / f'script-{i:02d}.js'
              p.write_text(script, encoding='utf-8')
              subprocess.run(['node', '--check', str(p)], check=True)

          qa = {
              'schema': 'CORAL_MOTHER_R06_POCILLOPORA_T01_QA',
              'sourceCommit': None,
              'bytes': len(html),
              'sha256': hashlib.sha256(html).hexdigest(),
              'gzipSha256': hashlib.sha256(packed).hexdigest(),
              'payloadChunks': len(chunks),
              'payloadIntegrity': True,
              'inlineScriptSyntax': True,
              'runtimeGLB': 0,
              'runtimeTextures': 0,
              'networkFetchCalls': 0,
              'colorFirewall': True,
              'visualAcceptance': False,
              'productionReady': False,
          }
          (out / 'QA_DIRECT.json').write_text(json.dumps(qa, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(qa, ensure_ascii=False))
          PY

      - name: Desktop and mobile browser gate
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet websocket-client
          python3 -m http.server 8766 --directory /tmp/r06-direct >/tmp/r06-http.log 2>&1 &
          HTTP_PID=$!
          trap 'kill $HTTP_PID 2>/dev/null || true' EXIT
          python3 - <<'PY'
          import base64, json, os, shutil, subprocess, time, urllib.request
          from pathlib import Path
          import websocket

          chrome = shutil.which('google-chrome') or shutil.which('chromium') or shutil.which('chromium-browser')
          assert chrome, 'Chrome/Chromium unavailable'

          def wait_json(url, attempts=100):
              last = None
              for _ in range(attempts):
                  try:
                      with urllib.request.urlopen(url, timeout=2) as r:
                          return json.load(r)
                  except Exception as exc:
                      last = exc
                      time.sleep(.2)
              raise last

          def run_view(label, width, height, port):
              profile = f'/tmp/r06-chrome-{label}'
              shutil.rmtree(profile, ignore_errors=True)
              proc = subprocess.Popen([
                  chrome, '--headless=new', '--no-sandbox', '--disable-dev-shm-usage',
                  f'--remote-debugging-port={port}', '--remote-allow-origins=*',
                  '--use-angle=swiftshader', '--enable-webgl', '--ignore-gpu-blocklist',
                  f'--window-size={width},{height}', f'--user-data-dir={profile}', 'about:blank'
              ], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              try:
                  targets = wait_json(f'http://127.0.0.1:{port}/json/list')
                  target = next(t for t in targets if t.get('type') == 'page')
                  ws = websocket.create_connection(target['webSocketDebuggerUrl'], timeout=20, origin='http://127.0.0.1')
                  seq = 0
                  def call(method, params=None):
                      nonlocal seq
                      seq += 1
                      ident = seq
                      ws.send(json.dumps({'id': ident, 'method': method, 'params': params or {}}))
                      while True:
                          msg = json.loads(ws.recv())
                          if msg.get('id') == ident:
                              if 'error' in msg:
                                  raise RuntimeError(msg['error'])
                              return msg.get('result', {})
                  call('Page.enable')
                  call('Runtime.enable')
                  call('Page.addScriptToEvaluateOnNewDocument', {
                      'source': "window.__qaErrors=[];addEventListener('error',e=>window.__qaErrors.push(String(e.message||e.error||e)));addEventListener('unhandledrejection',e=>window.__qaErrors.push(String(e.reason||e)));"
                  })
                  call('Page.navigate', {'url': 'http://127.0.0.1:8766/'})
                  time.sleep(9)
                  expr = r'''JSON.stringify((()=>{
                    const c=document.querySelector('canvas');
                    let gl=false; try{gl=!!(c&&(c.getContext('webgl2')||c.getContext('webgl')))}catch(e){}
                    const s=document.querySelector('#stage')?.getBoundingClientRect();
                    const k=document.querySelector('#controls')?.getBoundingClientRect();
                    const q=window.__CORAL_R06_QA__||{};
                    return {
                      ready:document.readyState,title:document.title,
                      canvas:document.querySelectorAll('canvas').length,
                      controls:document.querySelectorAll('button,input,select').length,
                      gl,qa:q,errors:window.__qaErrors||[],
                      body:(document.body.innerText||'').slice(0,5000),
                      stageTop:s?.top,stageBottom:s?.bottom,controlsTop:k?.top,
                      stageBeforeControls:!!(s&&k&&s.top<k.top&&s.bottom<=k.top+20),
                      innerWidth,scrollWidth:document.documentElement.scrollWidth,
                      horizontalOverflow:document.documentElement.scrollWidth>innerWidth+1
                    }
                  })())'''
                  r = call('Runtime.evaluate', {'expression': expr, 'returnByValue': True})
                  q = json.loads(r['result']['value'])
                  assert q['ready'] == 'complete', q
                  assert q['canvas'] == 1 and q['controls'] >= 20, q
                  assert q['gl'] is True, q
                  assert q['stageBeforeControls'] is True, q
                  assert q['horizontalOverflow'] is False, q
                  assert '启动失败' not in q['body'] and 'Failed to fetch' not in q['body'], q
                  assert not q['errors'], q
                  qa = q['qa']
                  assert qa.get('ready') is True, q
                  assert qa.get('referencePoints') == 8000, q
                  assert qa.get('nodes') == 726, q
                  assert qa.get('runtimeGLB') == 0 and qa.get('runtimeTextures') == 0, q
                  assert qa.get('networkFetches') == 0 and qa.get('noExternalAssets') is True, q
                  assert qa.get('visualAcceptance') is False, q

                  call('Runtime.evaluate', {'expression': "document.querySelector('[data-view=front]').click();document.querySelector('[data-mode=overlay]').click();document.querySelector('[data-diag=order]').click();"})
                  time.sleep(1.5)
                  call('Runtime.evaluate', {'expression': "document.querySelector('[data-view=top]').click();document.querySelector('[data-mode=split]').click();document.querySelector('[data-diag=neutral]').click();"})
                  time.sleep(1.5)
                  r2 = call('Runtime.evaluate', {'expression': "JSON.stringify({errors:window.__qaErrors||[],qa:window.__CORAL_R06_QA__||{}})", 'returnByValue': True})
                  q2 = json.loads(r2['result']['value'])
                  assert not q2['errors'] and not q2['qa'].get('errors'), q2

                  shot = call('Page.captureScreenshot', {'format':'png','captureBeyondViewport':False})
                  image = base64.b64decode(shot['data'])
                  assert len(image) > 15000
                  Path(f'/tmp/r06-direct/QA_SCREENSHOT_{label.upper()}.png').write_bytes(image)
                  ws.close()
                  return {
                      'passed': True,
                      'viewport': f'{width}x{height}',
                      'title': q['title'],
                      'canvasCount': q['canvas'],
                      'controlCount': q['controls'],
                      'webglContext': q['gl'],
                      'stageBeforeControls': q['stageBeforeControls'],
                      'horizontalOverflow': q['horizontalOverflow'],
                      'runtimeErrors': q['errors'],
                      'referencePoints': qa['referencePoints'],
                      'skeletonNodes': qa['nodes'],
                      'skeletonEdges': qa['edges'],
                      'triangles': qa['triangles'],
                      'aspectErrorPct': qa['aspectErrorPct'],
                      'screenshotBytes': len(image),
                  }
              finally:
                  proc.terminate()
                  try: proc.wait(timeout=5)
                  except subprocess.TimeoutExpired: proc.kill()

          desktop = run_view('desktop_1440x1100', 1440, 1100, 9231)
          mobile = run_view('mobile_390x844', 390, 844, 9232)
          qa_path = Path('/tmp/r06-direct/QA_DIRECT.json')
          qa = json.loads(qa_path.read_text(encoding='utf-8'))
          qa['sourceCommit'] = os.environ['SOURCE_COMMIT']
          qa['browserQA'] = {'desktop': desktop, 'mobile': mobile}
          qa['desktopBrowserQA'] = True
          qa['mobile390x844QA'] = True
          qa['sourceRemovalQA'] = True
          qa_path.write_text(json.dumps(qa, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(qa, ensure_ascii=False))
          PY

      - name: Check out GitHub Pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
          path: pages

      - name: Publish browser-verified direct workbench
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "pages/$OUT_NAME"
          mkdir -p "pages/$OUT_NAME"
          cp -a /tmp/r06-direct/. "pages/$OUT_NAME/"
          cd pages
          git config user.name 'Haihao_Nature Grace HK'
          git config user.email 'haihao0307@gmail.com'
          git add "$OUT_NAME/"
          if git diff --cached --quiet; then
            echo 'No publication changes.'
          else
            git commit -m "publish(coral): R06 Pocillopora T01 $SOURCE_COMMIT"
            git pull --rebase origin gh-pages
            git push origin gh-pages
          fi
