name: Coral R03 verify exact reference
on:
  push:
    branches: [gh-pages]
    paths: [.github/workflows/kaopu-coral-r03-verify-data.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Restore complete verified sample payload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data-verification
          python - <<'PY'
          import os,json,base64,hashlib,urllib.request,pathlib
          api='https://api.github.com/repos/haihao0307/guilin-dem-pipeline/contents/game-coral-mother-wave-r03/pore-reference.json'
          def request(url,data=None):
            headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','User-Agent':'KAOPU-R03'}
            return json.load(urllib.request.urlopen(urllib.request.Request(url,data=json.dumps(data).encode() if data else None,headers=headers,method='PUT' if data else 'GET')))
          original=request(api+'?ref=gh-pages')
          d=json.loads(base64.b64decode(original['content']))
          suffix=''
          # Fail closed: never publish a numerically altered measurement.
          d['referenceSamples']['data']=d['referenceSamples']['data'].split('Jfq981XoSeWp')[0]+suffix
          raw=base64.b64decode(d['referenceSamples']['data'],validate=True)
          assert len(raw)==8192
          assert hashlib.sha256(raw).hexdigest()=='366dadca42c4ce5c9bb3e39f13ba7572d20fd23e6c2a8926522cd5ecae8e8057'
          payload=json.dumps(d,separators=(',',':')).encode()
          assert hashlib.sha256(payload).hexdigest()=='7e8479286912cef5a865e99ec5096222b3baf6adf0104fabb7408f2ceb115855'
          out=request(api,{'message':'Restore hash-verified complete R03 triangle reference payload','branch':'gh-pages','sha':original['sha'],'content':base64.b64encode(payload).decode()})
          pathlib.Path('data-verification/pore-reference.json').write_bytes(payload)
          pathlib.Path('data-verification/receipt.json').write_text(json.dumps({'bytes':len(payload),'sha256':hashlib.sha256(payload).hexdigest(),'commit':out['commit']['sha']},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CORAL-R03-DATA-VERIFICATION
          path: data-verification/
