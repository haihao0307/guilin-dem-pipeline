name: Ocean Island R018.2 refined build publish QA
on:
  push:
    branches: [work/ocean-mother-r018]
    paths: [ocean-mother/island-r018-v2-build/**, .github/workflows/ocean-island-r018-v2-build-publish.yml]
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: ocean-island-r018-v2-v5, cancel-in-progress: true}
jobs:
  build-test-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.sha }}", fetch-depth: 0}
      - name: Reconstruct and verify standalone HTML
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ocean-mother/island-r018-v2 evidence
          cat ocean-mother/island-r018-v2-build/payload.*.b64 | tr -d '\r\n' | base64 -d | xz -d > ocean-mother/island-r018-v2/index.html
          f=ocean-mother/island-r018-v2/index.html
          test "$(wc -c < "$f")" = 45236
          test "$(sha256sum "$f"|cut -d' ' -f1)" = 45b0f79484bc610067c00adc3ca067419c3812ce04240208c3eaba67b14500ba
          for t in island-r018-gold-coast-refined 泡沫墙 浪墙卷浪 岸线异形度 无限海面 浓烟火源; do grep -q "$t" "$f"; done
          python3 - <<'PY'
          from pathlib import Path
          import re
          h=Path('ocean-mother/island-r018-v2/index.html').read_text(encoding='utf-8')
          s=re.findall(r'<script>([\s\S]*?)</script>',h); assert len(s)==1
          Path('/tmp/runtime.js').write_text(s[0],encoding='utf-8')
          assert '<img' not in h.lower() and 'http://' not in h.lower() and 'https://' not in h.lower()
          PY
          node --check /tmp/runtime.js
          sha256sum "$f" | tee evidence/SHA256.txt
      - name: Install Chromium
        run: |
          python3 -m pip install --quiet playwright
          python3 -m playwright install --with-deps chromium
      - name: Browser runtime and control QA
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --directory . >/tmp/http.log 2>&1 &
          pid=$!; trap 'kill $pid 2>/dev/null||true' EXIT
          python3 - <<'PY'
          import json
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          url='http://127.0.0.1:8765/ocean-mother/island-r018-v2/'
          out={'status':'PASS','checks':{},'errors':[]}
          with sync_playwright() as p:
            b=p.chromium.launch(headless=True,args=['--enable-webgl','--ignore-gpu-blocklist','--enable-unsafe-swiftshader','--use-angle=swiftshader'])
            c=b.new_context(viewport={'width':900,'height':650}); page=c.new_page()
            page.on('pageerror',lambda e:out['errors'].append(str(e)))
            r=page.goto(url,wait_until='domcontentloaded',timeout=120000); assert r and r.status==200
            page.wait_for_function("window.__OCEAN_QA__&&window.__OCEAN_QA__.ready",timeout=120000); page.wait_for_timeout(2200)
            q=page.evaluate('window.__OCEAN_QA__')
            out['desktop']=q
            out['checks'].update({'desktop200':True,'ready':q['ready'] is True,'time':q['time']>1,'flags':q['flags']==127,'views':page.locator('[data-view]').count()==6,'effects':page.locator('[data-effect]').evaluate_all("e=>new Set(e.map(x=>x.dataset.effect)).size")==7,'fallback':not page.locator('#fallback').evaluate("e=>e.classList.contains('show')"),'glass':page.locator('.glass').first.evaluate("e=>getComputedStyle(e,'::before').animationName") not in ('','none')})
            x1=page.evaluate("getComputedStyle(document.documentElement).getPropertyValue('--mx')"); page.mouse.move(120,100); page.wait_for_timeout(100); x2=page.evaluate("getComputedStyle(document.documentElement).getPropertyValue('--mx')"); out['checks']['glassPointer']=x1!=x2
            page.locator('#pause').evaluate('e=>e.click()'); page.wait_for_timeout(250); a=page.evaluate('window.__OCEAN_QA__'); page.wait_for_timeout(450); z=page.evaluate('window.__OCEAN_QA__'); out['checks']['pause']=a['paused'] and abs(z['time']-a['time'])<.08
            page.locator('#pause').evaluate('e=>e.click()'); page.wait_for_timeout(700); n=page.evaluate('window.__OCEAN_QA__'); out['checks']['resume']=not n['paused'] and n['time']>z['time']+.15
            page.locator('[data-effect="curl"]').first.evaluate('e=>e.click()'); page.wait_for_timeout(180); out['checks']['toggle']=(page.evaluate('window.__OCEAN_QA__.flags')&4)==0
            page.locator('[data-view="top"]').evaluate('e=>e.click()'); out['checks']['top']='active' in (page.locator('[data-view="top"]').get_attribute('class') or '')
            s=page.locator('[data-param="islandIrregularity"]'); old=float(s.input_value()); s.evaluate("(e,v)=>{e.value=v;e.dispatchEvent(new Event('input',{bubbles:true}))}",str(old+.25)); out['checks']['slider']=float(s.input_value())>old+.2
            page.locator('#panelClose').evaluate('e=>e.click()'); out['checks']['close']=page.locator('#panel').evaluate("e=>e.classList.contains('closed')"); page.locator('#panelToggle').evaluate('e=>e.click()'); out['checks']['open']=not page.locator('#panel').evaluate("e=>e.classList.contains('closed')"); c.close()
            m=b.new_context(viewport={'width':390,'height':720},is_mobile=True,has_touch=True); mp=m.new_page(); mp.on('pageerror',lambda e:out['errors'].append('mobile:'+str(e))); rr=mp.goto(url,wait_until='domcontentloaded',timeout=120000); assert rr and rr.status==200; mp.wait_for_function("window.__OCEAN_QA__&&window.__OCEAN_QA__.ready",timeout=120000); mp.wait_for_timeout(1600); mq=mp.evaluate('window.__OCEAN_QA__'); out['mobile']=mq; out['checks'].update({'mobile200':True,'mobileTime':mq['time']>.5,'mobilePanel':mp.locator('#panel').is_visible()}); m.close(); b.close()
          out['checks']['noErrors']=not out['errors']; out['failed']=[k for k,v in out['checks'].items() if v is not True]; out['status']='FAIL' if out['failed'] else 'PASS'; Path('evidence/BROWSER_QA.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8'); print(json.dumps(out,ensure_ascii=False,indent=2)); assert not out['failed'],out['failed']
          PY
      - name: Publish verified HTML
        shell: bash
        env: {GIT_AUTHOR_NAME: Haihao_Nature Grace HK, GIT_AUTHOR_EMAIL: haihao0307@gmail.com, GIT_COMMITTER_NAME: Haihao_Nature Grace HK, GIT_COMMITTER_EMAIL: haihao0307@gmail.com}
        run: |
          set -euo pipefail
          git fetch origin gh-pages; rm -rf /tmp/pages; git worktree add /tmp/pages origin/gh-pages
          mkdir -p /tmp/pages/ocean-mother/island-r018-v2; cp ocean-mother/island-r018-v2/index.html /tmp/pages/ocean-mother/island-r018-v2/index.html; touch /tmp/pages/.nojekyll
          cd /tmp/pages; git add .nojekyll ocean-mother/island-r018-v2/index.html; git diff --cached --quiet && exit 0; git commit -m 'feat(ocean): publish R018.2 refined island workbench'
          for i in 1 2 3 4 5; do git push origin HEAD:gh-pages && exit 0; git fetch origin gh-pages; git rebase origin/gh-pages; done; exit 1
      - name: Verify public bytes and WebGL runtime
        shell: bash
        run: |
          set -euo pipefail
          url=https://haihao0307.github.io/guilin-dem-pipeline/ocean-mother/island-r018-v2/index.html
          for i in $(seq 1 90); do code=$(curl -L -sS -o evidence/PUBLIC_INDEX.html -w '%{http_code}' -H 'Cache-Control: no-cache' "${url}?r=${GITHUB_RUN_ID}-${i}"||true); sha=$(sha256sum evidence/PUBLIC_INDEX.html 2>/dev/null|cut -d' ' -f1||true); echo "$i $code $sha"; [ "$code" = 200 ]&&[ "$sha" = 45b0f79484bc610067c00adc3ca067419c3812ce04240208c3eaba67b14500ba ]&&break; sleep 5; done
          test "$code" = 200; test "$sha" = 45b0f79484bc610067c00adc3ca067419c3812ce04240208c3eaba67b14500ba
          URL="${url}?verified=${GITHUB_RUN_ID}" python3 - <<'PY'
          import json,os
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          errors=[]
          with sync_playwright() as p:
            b=p.chromium.launch(headless=True,args=['--enable-webgl','--ignore-gpu-blocklist','--enable-unsafe-swiftshader','--use-angle=swiftshader']); page=b.new_page(viewport={'width':760,'height':520}); page.on('pageerror',lambda e:errors.append(str(e))); r=page.goto(os.environ['URL'],wait_until='domcontentloaded',timeout=120000); assert r and r.status==200; page.wait_for_function("window.__OCEAN_QA__&&window.__OCEAN_QA__.ready",timeout=120000); page.wait_for_timeout(1000); q=page.evaluate('window.__OCEAN_QA__'); assert q['time']>.3 and q['flags']==127 and not errors,(q,errors); b.close()
          d={'status':'ONLINE_HTML_VERIFIED','url':os.environ['URL'].split('?')[0],'http':200,'sha256':'45b0f79484bc610067c00adc3ca067419c3812ce04240208c3eaba67b14500ba','singleFile':True,'externalAssets':0,'localBrowserQA':'PASS','publicRuntimeQA':'PASS','visualApproved':False,'productionApproved':False}; Path('evidence/ONLINE_VERIFIED.json').write_text(json.dumps(d,indent=2)+'\n'); print(d)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: ocean-island-r018-v2-refined-evidence, path: "ocean-mother/island-r018-v2/index.html\nevidence/", retention-days: 90, compression-level: 9}
