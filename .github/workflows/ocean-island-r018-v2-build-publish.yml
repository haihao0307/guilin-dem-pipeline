name: Ocean Island R018.2 refined build publish QA

on:
  push:
    branches:
      - work/ocean-mother-r018
    paths:
      - ocean-mother/island-r018-v2-build/**
      - .github/workflows/ocean-island-r018-v2-build-publish.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ocean-island-r018-v2-build-publish-v3
  cancel-in-progress: true

jobs:
  build-test-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Reconstruct exact single-file workbench
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ocean-mother/island-r018-v2 evidence
          cat ocean-mother/island-r018-v2-build/payload.*.b64 \
            | tr -d '\r\n' \
            | base64 -d \
            | xz -d \
            > ocean-mother/island-r018-v2/index.html
          test "$(sha256sum ocean-mother/island-r018-v2/index.html | cut -d' ' -f1)" = "45b0f79484bc610067c00adc3ca067419c3812ce04240208c3eaba67b14500ba"
          test "$(wc -c < ocean-mother/island-r018-v2/index.html)" = "45236"
          grep -q 'island-r018-gold-coast-refined' ocean-mother/island-r018-v2/index.html
          grep -q '泡沫墙' ocean-mother/island-r018-v2/index.html
          grep -q '浪墙卷浪' ocean-mother/island-r018-v2/index.html
          grep -q '岸线异形度' ocean-mother/island-r018-v2/index.html
          grep -q '无限海面' ocean-mother/island-r018-v2/index.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('ocean-mother/island-r018-v2/index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script>([\s\S]*?)</script>',html)
          assert len(blocks)==1
          Path('/tmp/ocean-r018-v2-runtime.js').write_text(blocks[0],encoding='utf-8')
          assert '<img' not in html.lower()
          assert 'http://' not in html.lower()
          assert 'https://' not in html.lower()
          print({'htmlBytes':len(html.encode()),'scripts':len(blocks),'externalAssets':0})
          PY
          node --check /tmp/ocean-r018-v2-runtime.js
          sha256sum ocean-mother/island-r018-v2/index.html | tee evidence/SHA256.txt

      - name: Install browser verification tools
        run: |
          python3 -m pip install --quiet playwright pillow
          python3 -m playwright install --with-deps chromium

      - name: Run deterministic desktop and mobile browser QA
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --directory . >/tmp/ocean-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          python3 - <<'PY'
          import base64
          import json
          from pathlib import Path
          from PIL import Image, ImageStat
          from playwright.sync_api import sync_playwright

          url='http://127.0.0.1:8765/ocean-mother/island-r018-v2/'
          result={'status':'PASS','url':url,'checks':{},'consoleErrors':[],'pageErrors':[]}

          def press(page, selector):
              page.locator(selector).evaluate('e=>e.click()')

          def sample_canvas(page, path, sw, sh):
              page.evaluate('window.requestAnimationFrame=()=>0')
              page.wait_for_timeout(700)
              info=page.locator('#ocean').evaluate("""(c,size)=>{
                const gl=c.getContext('webgl2');
                if(!gl) throw new Error('WebGL2 context unavailable during readback');
                const w=c.width,h=c.height,sw=size[0],sh=size[1];
                const raw=new Uint8Array(w*h*4);
                gl.finish();
                gl.readPixels(0,0,w,h,gl.RGBA,gl.UNSIGNED_BYTE,raw);
                const err=gl.getError();
                if(err!==gl.NO_ERROR) throw new Error('readPixels error '+err);
                const out=new Uint8Array(sw*sh*3);
                for(let y=0;y<sh;y++){
                  const sy=Math.min(h-1,Math.floor((y+.5)*h/sh));
                  for(let x=0;x<sw;x++){
                    const sx=Math.min(w-1,Math.floor((x+.5)*w/sw));
                    const src=((h-1-sy)*w+sx)*4,dst=(y*sw+x)*3;
                    out[dst]=raw[src];out[dst+1]=raw[src+1];out[dst+2]=raw[src+2];
                  }
                }
                let binary='';
                for(let i=0;i<out.length;i+=8192) binary+=String.fromCharCode(...out.subarray(i,i+8192));
                return {canvas:[w,h],sample:[sw,sh],b64:btoa(binary)};
              }""",[sw,sh])
              data=base64.b64decode(info['b64'])
              image=Image.frombytes('RGB',tuple(info['sample']),data)
              image.save(path)
              stat=ImageStat.Stat(image)
              info['mean']=[round(v,2) for v in stat.mean]
              info['stddev']=[round(v,2) for v in stat.stddev]
              info['uniqueSampleColors']=len(set(image.getdata()))
              return info

          def open_ready(browser, viewport, mobile=False):
              ctx=browser.new_context(viewport=viewport,device_scale_factor=1,is_mobile=mobile,has_touch=mobile)
              page=ctx.new_page()
              page.on('console',lambda msg: result['consoleErrors'].append(('mobile: ' if mobile else '')+msg.text) if msg.type=='error' else None)
              page.on('pageerror',lambda exc: result['pageErrors'].append(('mobile: ' if mobile else '')+str(exc)))
              response=page.goto(url,wait_until='domcontentloaded',timeout=120000)
              assert response and response.status==200
              page.wait_for_function("window.__OCEAN_QA__ && window.__OCEAN_QA__.ready===true",timeout=120000)
              return ctx,page

          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=['--enable-webgl','--ignore-gpu-blocklist','--enable-unsafe-swiftshader','--use-angle=swiftshader'])

              context,page=open_ready(browser,{'width':1440,'height':1000})
              page.wait_for_timeout(3200)
              qa1=page.evaluate('window.__OCEAN_QA__')
              result['desktopInitial']=qa1
              result['checks']['desktopHttp200']=True
              result['checks']['webglReady']=qa1['ready'] is True
              result['checks']['canvasSized']=qa1['canvas'][0]>500 and qa1['canvas'][1]>350
              result['checks']['timeAdvances']=qa1['time']>1.0
              result['checks']['allEffectsInitiallyOn']=qa1['flags']==127
              result['checks']['fiveEffectControls']=page.locator('[data-effect]').count()==5
              result['checks']['sixCameraViews']=page.locator('[data-view]').count()==6
              result['checks']['noFallback']=not page.locator('#fallback').evaluate("e=>e.classList.contains('show')")
              animation_name=page.locator('.glass').first.evaluate("e=>getComputedStyle(e,'::before').animationName")
              result['checks']['liquidGlassLightAnimation']=animation_name not in ('none','')
              mx1=page.evaluate("getComputedStyle(document.documentElement).getPropertyValue('--mx')")
              page.mouse.move(184,132)
              page.wait_for_timeout(160)
              mx2=page.evaluate("getComputedStyle(document.documentElement).getPropertyValue('--mx')")
              result['checks']['glassPointerLightResponds']=mx1!=mx2

              press(page,'#pause')
              page.wait_for_timeout(300)
              paused1=page.evaluate('window.__OCEAN_QA__')
              page.wait_for_timeout(700)
              paused2=page.evaluate('window.__OCEAN_QA__')
              result['checks']['pauseFreezesTime']=paused1['paused'] and abs(paused2['time']-paused1['time'])<0.08
              press(page,'#pause')
              page.wait_for_timeout(1000)
              resumed=page.evaluate('window.__OCEAN_QA__')
              result['checks']['resumeAdvancesTime']=not resumed['paused'] and resumed['time']>paused2['time']+.25

              before_flags=resumed['flags']
              press(page,'[data-effect="curl"]')
              page.wait_for_timeout(350)
              after_flags=page.evaluate('window.__OCEAN_QA__.flags')
              result['checks']['effectToggleWorks']=before_flags!=after_flags and (after_flags & 4)==0
              press(page,'[data-effect="curl"]')

              press(page,'[data-view="top"]')
              page.wait_for_timeout(500)
              result['checks']['topCameraWorks']='active' in (page.locator('[data-view="top"]').get_attribute('class') or '')
              slider=page.locator('[data-param="islandIrregularity"]')
              old=float(slider.input_value())
              slider.evaluate("(e,v)=>{e.value=v;e.dispatchEvent(new Event('input',{bubbles:true}))}",str(min(1.55,old+.25)))
              page.wait_for_timeout(220)
              result['checks']['islandControlWorks']=float(slider.input_value())>old+.2
              press(page,'#panelClose')
              result['checks']['panelCloses']=page.locator('#panel').evaluate("e=>e.classList.contains('closed')")
              press(page,'#panelToggle')
              result['checks']['panelReopens']=not page.locator('#panel').evaluate("e=>e.classList.contains('closed')")
              context.close()

              overview_ctx,overview=open_ready(browser,{'width':1440,'height':1000})
              overview.wait_for_timeout(2400)
              press(overview,'#pause')
              result['desktopOverview']=sample_canvas(overview,'evidence/R018_V2_OVERVIEW.png',320,220)
              result['checks']['overviewVisualVariance']=min(result['desktopOverview']['stddev'])>5 and result['desktopOverview']['uniqueSampleColors']>900
              overview_ctx.close()

              top_ctx,top=open_ready(browser,{'width':1440,'height':1000})
              press(top,'[data-view="top"]')
              top.wait_for_timeout(2400)
              press(top,'#pause')
              result['desktopTop']=sample_canvas(top,'evidence/R018_V2_TOP.png',320,220)
              result['checks']['topVisualVariance']=min(result['desktopTop']['stddev'])>5 and result['desktopTop']['uniqueSampleColors']>800
              top_ctx.close()

              mobile_ctx,mobile=open_ready(browser,{'width':390,'height':844},True)
              mobile.wait_for_timeout(2400)
              mqa=mobile.evaluate('window.__OCEAN_QA__')
              result['mobileInitial']=mqa
              result['checks']['mobileHttp200']=True
              result['checks']['mobileCanvasSized']=mqa['canvas'][0]>=160 and mqa['canvas'][1]>=340
              result['checks']['mobileTimeAdvances']=mqa['time']>1.0
              result['checks']['mobilePanelVisible']=mobile.locator('#panel').is_visible()
              press(mobile,'#pause')
              result['mobileOverview']=sample_canvas(mobile,'evidence/R018_V2_MOBILE.png',180,300)
              result['checks']['mobileVisualVariance']=min(result['mobileOverview']['stddev'])>4 and result['mobileOverview']['uniqueSampleColors']>500
              mobile_ctx.close()
              browser.close()

          result['checks']['noJsErrors']=len(result['pageErrors'])==0
          gl_errors=[x for x in result['consoleErrors'] if 'webgl' in x.lower() or 'shader' in x.lower() or 'error' in x.lower()]
          result['checks']['noGlOrConsoleErrors']=len(gl_errors)==0
          failed=[k for k,v in result['checks'].items() if v is not True]
          result['failed']=failed
          if failed:
              result['status']='FAIL'
          Path('evidence/BROWSER_QA.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(result,ensure_ascii=False,indent=2))
          assert not failed, failed
          PY

      - name: Publish verified single file to GitHub Pages
        shell: bash
        env:
          GIT_AUTHOR_NAME: Haihao_Nature Grace HK
          GIT_AUTHOR_EMAIL: haihao0307@gmail.com
          GIT_COMMITTER_NAME: Haihao_Nature Grace HK
          GIT_COMMITTER_EMAIL: haihao0307@gmail.com
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          rm -rf /tmp/ocean-gh-pages
          git worktree add /tmp/ocean-gh-pages origin/gh-pages
          mkdir -p /tmp/ocean-gh-pages/ocean-mother/island-r018-v2
          cp ocean-mother/island-r018-v2/index.html /tmp/ocean-gh-pages/ocean-mother/island-r018-v2/index.html
          touch /tmp/ocean-gh-pages/.nojekyll
          cd /tmp/ocean-gh-pages
          git add .nojekyll ocean-mother/island-r018-v2/index.html
          if git diff --cached --quiet; then
            echo 'Exact R018.2 bytes are already published'
            exit 0
          fi
          git commit -m "feat(ocean): publish R018.2 refined island workbench"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:gh-pages; then exit 0; fi
            git fetch origin gh-pages
            git rebase origin/gh-pages
          done
          exit 1

      - name: Verify public URL exact bytes and runtime
        shell: bash
        run: |
          set -euo pipefail
          url='https://haihao0307.github.io/guilin-dem-pipeline/ocean-mother/island-r018-v2/index.html'
          code=000
          for i in $(seq 1 90); do
            code=$(curl -L -sS -o evidence/PUBLIC_INDEX.html -w '%{http_code}' -H 'Cache-Control: no-cache' "${url}?r=${GITHUB_RUN_ID}-${i}" || true)
            digest=$(sha256sum evidence/PUBLIC_INDEX.html 2>/dev/null | cut -d' ' -f1 || true)
            echo "attempt $i http=$code sha=$digest"
            if [ "$code" = 200 ] && [ "$digest" = "45b0f79484bc610067c00adc3ca067419c3812ce04240208c3eaba67b14500ba" ]; then break; fi
            sleep 5
          done
          test "$code" = 200
          test "$(sha256sum evidence/PUBLIC_INDEX.html | cut -d' ' -f1)" = "45b0f79484bc610067c00adc3ca067419c3812ce04240208c3eaba67b14500ba"
          grep -q 'island-r018-gold-coast-refined' evidence/PUBLIC_INDEX.html
          PUBLIC_URL="${url}?verified=${GITHUB_RUN_ID}" python3 - <<'PY'
          import json, os
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          errors=[]
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=['--enable-webgl','--ignore-gpu-blocklist','--enable-unsafe-swiftshader','--use-angle=swiftshader'])
              page=browser.new_page(viewport={'width':1280,'height':850})
              page.on('pageerror',lambda exc: errors.append(str(exc)))
              response=page.goto(os.environ['PUBLIC_URL'],wait_until='domcontentloaded',timeout=120000)
              assert response and response.status==200, response.status if response else None
              page.wait_for_function("window.__OCEAN_QA__ && window.__OCEAN_QA__.ready===true",timeout=120000)
              page.wait_for_timeout(1600)
              qa=page.evaluate('window.__OCEAN_QA__')
              assert qa['time']>.5, qa
              assert qa['flags']==127, qa
              assert not errors, errors
              browser.close()
          receipt={
            'status':'ONLINE_HTML_VERIFIED',
            'url':os.environ['PUBLIC_URL'].split('?')[0],
            'http':200,
            'sha256':'45b0f79484bc610067c00adc3ca067419c3812ce04240208c3eaba67b14500ba',
            'singleFile':True,
            'externalAssets':0,
            'localBrowserQA':'PASS',
            'publicRuntimeQA':'PASS',
            'visualApproved':False,
            'productionApproved':False
          }
          Path('evidence/ONLINE_VERIFIED.json').write_text(json.dumps(receipt,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(receipt,ensure_ascii=False,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ocean-island-r018-v2-refined-evidence
          path: |
            ocean-mother/island-r018-v2/index.html
            evidence/
          if-no-files-found: error
          retention-days: 90
          compression-level: 9
