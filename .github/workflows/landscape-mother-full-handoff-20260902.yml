name: Landscape Mother full handoff 2026-09-02
on:
  push:
    branches: [feature/landscape-mother-field-graph-v002]
    paths:
      - handoffs/landscape-mother/Xiaowang_Landscape_Mother_Full_Handoff_2026-09-02_v1.0.0/**
      - .github/workflows/landscape-mother-full-handoff-20260902.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: landscape-mother-full-handoff-20260902
  cancel-in-progress: false
jobs:
  package-release:
    if: github.ref == 'refs/heads/feature/landscape-mother-field-graph-v002'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PACKAGE_NAME: Xiaowang_Landscape_Mother_Full_Handoff_2026-09-02_v1.0.0
      PACKAGE_DIR: handoffs/landscape-mother/Xiaowang_Landscape_Mother_Full_Handoff_2026-09-02_v1.0.0
      SOURCE_SNAPSHOT_COMMIT: 91c22b16a5466d41f398c4dc6cecbaaf0c239d49
      RELEASE_TAG: landscape-mother-handoff-2026-09-02-v1.0.0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact source snapshot and handoff gates
        shell: bash
        run: |
          set -euo pipefail
          test -f "$PACKAGE_DIR/START_HERE.md"
          test -f "$PACKAGE_DIR/FULL_HANDOFF.md"
          test -f "$PACKAGE_DIR/CONVERSATION_RECORD.md"
          test -f "$PACKAGE_DIR/CURRENT_STATE.json"
          test "$(git rev-parse "$SOURCE_SNAPSHOT_COMMIT":landscape-mother)" = "$(git rev-parse HEAD:"$PACKAGE_DIR"/SOURCE_SNAPSHOT/landscape-mother)"
          test "$(git rev-parse "$SOURCE_SNAPSHOT_COMMIT":workbenches/landscape-mother)" = "$(git rev-parse HEAD:"$PACKAGE_DIR"/SOURCE_SNAPSHOT/workbenches/landscape-mother)"
          test "$(git rev-parse "$SOURCE_SNAPSHOT_COMMIT":AGENTS.md)" = "$(git rev-parse HEAD:"$PACKAGE_DIR"/SOURCE_SNAPSHOT/ROOT_AGENTS.md)"
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('handoffs/landscape-mother/Xiaowang_Landscape_Mother_Full_Handoff_2026-09-02_v1.0.0')
          state=json.loads((root/'CURRENT_STATE.json').read_text())
          assert state['sourceSnapshotCommit']=='91c22b16a5466d41f398c4dc6cecbaaf0c239d49'
          assert state['currentCandidate']['lod'] is False
          assert state['currentCandidate']['textureSampling'] is False
          assert state['approvals']=={'truthApproved':False,'visualApproved':False,'visualAcceptance':False,'productionReady':False}
          registry=json.loads((root/'ASSET_REFERENCE_REGISTRY.json').read_text())
          assert registry['sourceGlb']['publiclyBundled'] is False
          assert registry['rejectedGeneratedImage']['mustNotEnterKnowledge'] is True
          print('Handoff state and public media boundaries verified')
          PY
      - name: Build deterministic full source package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/package"
          cp -a "$PACKAGE_DIR" "$RUNNER_TEMP/package/$PACKAGE_NAME"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'package'/os.environ['PACKAGE_NAME']
          meta={
            'schema':'landscape-mother-github-handoff-build/1.0.0',
            'handoffCommit':os.environ['GITHUB_SHA'],
            'sourceSnapshotCommit':os.environ['SOURCE_SNAPSHOT_COMMIT'],
            'branch':os.environ['GITHUB_REF_NAME'],
            'runId':os.environ['GITHUB_RUN_ID'],
            'rawUserReferenceMediaIncluded':False,
            'originalGlbIncluded':False,
            'visualApproved':False,
            'productionReady':False
          }
          (root/'AUTOGENERATED_PACKAGE_METADATA.json').write_text(json.dumps(meta,ensure_ascii=False,indent=2)+'\n')
          PY
          git log --date=iso --pretty=format:'%H %ad %s' "$SOURCE_SNAPSHOT_COMMIT"^..HEAD > "$RUNNER_TEMP/package/$PACKAGE_NAME/GIT_LOG.txt"
          cd "$RUNNER_TEMP/package"
          find "$PACKAGE_NAME" -type f ! -name CHECKSUMS.sha256 -print0 | sort -z | xargs -0 sha256sum > "$PACKAGE_NAME/CHECKSUMS.sha256"
          zip -X -r -9 "$PACKAGE_NAME.zip" "$PACKAGE_NAME"
          sha256sum "$PACKAGE_NAME.zip" > "$PACKAGE_NAME.zip.sha256"
      - name: Upload complete GitHub package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: |
            ${{ runner.temp }}/package/${{ env.PACKAGE_NAME }}.zip
            ${{ runner.temp }}/package/${{ env.PACKAGE_NAME }}.zip.sha256
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - name: Publish permanent GitHub release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$RUNNER_TEMP/package/$PACKAGE_NAME.zip"
          SUM="$RUNNER_TEMP/package/$PACKAGE_NAME.zip.sha256"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$ZIP" "$SUM" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" "$ZIP" "$SUM" --target "$GITHUB_SHA" --title "Landscape Mother Full Handoff 2026-09-02 v1.0.0" --notes-file "$PACKAGE_DIR/RELEASE_NOTES.md" --repo "$GITHUB_REPOSITORY"
          fi
      - name: Record handoff summary
        run: |
          echo '## Landscape Mother Full Handoff' >> "$GITHUB_STEP_SUMMARY"
          echo "Source snapshot: $SOURCE_SNAPSHOT_COMMIT" >> "$GITHUB_STEP_SUMMARY"
          echo "Handoff commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Release tag: $RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
          echo 'Includes core, current B3.1 workbench, workflows, GAEA knowledge, conversation semantics, rules, state and next task.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Raw user photos and original GLB are not republished. visualApproved=false; productionReady=false.' >> "$GITHUB_STEP_SUMMARY"
