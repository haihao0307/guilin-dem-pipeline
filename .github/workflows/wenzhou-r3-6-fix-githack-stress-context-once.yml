name: Wenzhou R3.6 One-shot raw.githack Stress Context Fix

on:
  push:
    branches:
      - feature/wenzhou-r3-6-osm-runtime-20260911
    paths:
      - '.github/workflows/wenzhou-r3-6-fix-githack-stress-context-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/wenzhou-r3-6-osm-runtime-20260911
          fetch-depth: 0
      - name: Give cancellation-stress context the same raw.githack admission header
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/r3-6/browser_qa.mjs')
          s=p.read_text(encoding='utf-8')
          old="const stressContext=await browser.newContext({viewport:{width:390,height:844},reducedMotion:'reduce'});let started=0,finished=0,failed=0;const failedUrls=[];"
          new="const stressContext=await browser.newContext({viewport:{width:390,height:844},reducedMotion:'reduce'});await allowGithack(stressContext);let started=0,finished=0,failed=0;const failedUrls=[];"
          if s.count(old)!=1:
              raise SystemExit(f'exact stress-context block count != 1: {s.count(old)}')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          node --check tools/r3-6/browser_qa.mjs
          grep -q 'await allowGithack(stressContext)' tools/r3-6/browser_qa.mjs
          rm .github/workflows/wenzhou-r3-6-fix-githack-stress-context-once.yml
      - name: Commit exact QA harness fix
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/r3-6/browser_qa.mjs .github/workflows/wenzhou-r3-6-fix-githack-stress-context-once.yml
          git commit -m 'test(wenzhou): admit raw.githack in R3.6 stress context'
          git push origin HEAD:feature/wenzhou-r3-6-osm-runtime-20260911
