name: Hong Kong R03 exact public browser verification
on:
  push:
    branches: ['qa/hong-kong-map-sea-r03-public-20261013']
    paths: ['.github/workflows/hong-kong-map-sea-r03-public.yml']
permissions:
  contents: read
jobs:
  public:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: kaopu-geography-workbench/hong-kong-map-sea-r03
      - name: Install pinned browser runner
        run: |
          python3 -m pip install playwright==1.57.0 pillow==11.3.0
          python3 -m playwright install --with-deps chromium
      - name: Verify exact public bytes and desktop/mobile WebGL interaction
        env:
          ALLOW_INCOMPLETE_STATION: '1'
        run: |
          echo "b8ca45c06f7558579a8d35ab692d1ccc3f4a866360fc7d107cfb636bcac08e97  kaopu-geography-workbench/hong-kong-map-sea-r03/index.html" | sha256sum --check
          python3 kaopu-geography-workbench/hong-kong-map-sea-r03/qa/public_verify.py
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: r03-public-${{ github.sha }}
          path: |
            kaopu-geography-workbench/hong-kong-map-sea-r03/qa/*.json
            kaopu-geography-workbench/hong-kong-map-sea-r03/qa/*.png
          retention-days: 7
