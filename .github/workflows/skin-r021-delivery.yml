name: Skin R02.1 cross-driver black-frame repair
on:
  push:
    branches: [fix/skin-dna-r02-1-blackframe-20261013]
    paths:
      - iteration/skin-r021/**
      - .github/workflows/skin-r021-delivery.yml
permissions:
  contents: write
concurrency:
  group: skin-r021-delivery
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      sha: ${{ steps.publish.outputs.sha }}
      url: ${{ steps.publish.outputs.url }}
    env:
      DIR: kaopu-unified-human-workbench/skin-dna-r02-1
      NODE_PATH: /tmp/skin021/node_modules
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          sparse-checkout: |
            kaopu-unified-human-workbench
            iteration/skin-r021
            .github/workflows
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --prefix /tmp/skin021 --no-audit --no-fund esbuild@0.25.11 playwright@1.56.1 pngjs@7.0.0
          node /tmp/skin021/node_modules/playwright/cli.js install --with-deps chromium
      - name: Build independent compatibility-only copy
        run: |
          mkdir -p evidence
          set -euo pipefail
          node iteration/skin-r021/build.cjs 2>&1 | tee evidence/build.log
          git diff --exit-code -- kaopu-unified-human-workbench/skin-dna-r02 kaopu-unified-human-workbench/human-integrated-r04
      - name: Actual candidate entry
        env:
          QA_OUT: evidence/smoke
          SMOKE_ONLY: '1'
        run: node "$DIR/verify.cjs"
      - name: Immutable isolated publication
        id: publish
        run: |
          set -euo pipefail
          git config user.name 'KAOPU Render Repair'
          git config user.email 'actions@users.noreply.github.com'
          git add "$DIR"
          git commit -m "build(skin-r021): exact-pixel sampler-budget repair [skip ci]"
          git push origin HEAD:refs/heads/fix/skin-dna-r02-1-blackframe-20261013
          SHA=$(git rev-parse HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "url=https://htmlpreview.github.io/?https://raw.githubusercontent.com/haihao0307/guilin-dem-pipeline/$SHA/$DIR/preview.html" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skin-r021-build-${{ github.run_number }}
          path: evidence
          retention-days: 14
  verify:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-d3d11
            backend: d3d11-warp
            dpr: '1'
            script: verify-compat.cjs
          - os: ubuntu-latest
            name: linux-regression
            backend: swiftshader
            dpr: '1'
            script: verify.cjs
          - os: ubuntu-latest
            name: linux-high-dpi
            backend: swiftshader
            dpr: '1.5'
            script: verify-compat.cjs
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      DIR: kaopu-unified-human-workbench/skin-dna-r02-1
      PREVIEW_URL: ${{ needs.build.outputs.url }}
      SKIN_BACKEND: ${{ matrix.backend }}
      SKIN_DPR: ${{ matrix.dpr }}
      QA_OUT: evidence
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.sha }}
          fetch-depth: 1
          sparse-checkout: kaopu-unified-human-workbench/skin-dna-r02-1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/skin021" --no-audit --no-fund playwright@1.56.1 pngjs@7.0.0
          echo "NODE_PATH=$RUNNER_TEMP/skin021/node_modules" >> "$GITHUB_ENV"
          if [ "$RUNNER_OS" = Linux ]; then
            node "$RUNNER_TEMP/skin021/node_modules/playwright/cli.js" install --with-deps chromium
          else
            node "$RUNNER_TEMP/skin021/node_modules/playwright/cli.js" install chromium
          fi
      - name: Exact public HTML versus canonical Git bytes and manifest
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs'),cp=require('child_process'),crypto=require('crypto');(async()=>{fs.mkdirSync('evidence',{recursive:true});const file=process.env.DIR+'/preview.html',r=await fetch(process.env.PREVIEW_URL.split('?')[1]);if(!r.ok)throw Error('Public build unavailable');const b=Buffer.from(await r.arrayBuffer()),canonical=cp.execFileSync('git',['show','HEAD:'+file],{maxBuffer:12000000}),h=x=>crypto.createHash('sha256').update(x).digest('hex'),manifest=JSON.parse(fs.readFileSync(process.env.DIR+'/BUILD.json'));const proof={public:h(b),git:h(canonical),manifest:manifest.previewSHA256,checkout:h(fs.readFileSync(file))};fs.writeFileSync('evidence/BYTE_PROOF.json',JSON.stringify(proof,null,2));if(proof.public!==proof.git||proof.public!==proof.manifest)throw Error('Public canonical hash mismatch');console.log(proof);})().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Actual unassisted browser tests
        shell: bash
        run: node "$DIR/${{ matrix.script }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skin-r021-qa-${{ matrix.name }}-${{ github.run_number }}
          path: evidence
          retention-days: 14
  receipt:
    needs: [build, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DIR: kaopu-unified-human-workbench/skin-dna-r02-1
      BUILD_SHA: ${{ needs.build.outputs.sha }}
      PREVIEW_URL: ${{ needs.build.outputs.url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.sha }}
          fetch-depth: 1
          sparse-checkout: kaopu-unified-human-workbench/skin-dna-r02-1
      - uses: actions/download-artifact@v4
        with:
          pattern: skin-r021-qa-*-${{ github.run_number }}
          path: evidence
      - name: Preserve complete actual cross-driver proof
        run: |
          node - <<'NODE'
          const fs=require('fs');const dirs=fs.readdirSync('evidence'),reports=dirs.map(n=>({name:n,qa:JSON.parse(fs.readFileSync('evidence/'+n+'/qa.json'))}));if(reports.length!==3||reports.some(r=>!r.qa.completed))throw Error('Cross-driver acceptance incomplete');const windows=reports.find(r=>r.name.includes('windows'));if(!windows.qa.opening.graphics.valid||windows.qa.opening.graphics.caps.fragmentSamplers!==16||!windows.qa.eyeProof.passed)throw Error('Actual Windows 16-sampler proof missing');const d=process.env.DIR;fs.cpSync('evidence',d+'/acceptance',{recursive:true});fs.writeFileSync(d+'/DELIVERY.json',JSON.stringify({version:'SKIN-DNA-R02.1',url:process.env.PREVIEW_URL,sourceCommit:process.env.GITHUB_SHA,buildCommit:process.env.BUILD_SHA,previewSHA256:JSON.parse(fs.readFileSync(d+'/BUILD.json')).previewSHA256,run:process.env.GITHUB_RUN_ID,publicVerified:true,windows16SamplerVerified:true,userHardwareTested:false,userVisualAccepted:false,merged:false,reports:reports.map(r=>({name:r.name,tests:r.qa.tests.length,screens:r.qa.screens.length})),scope:'black-frame compatibility repair; same R02 skin recipe and native character'},null,2));
          NODE
          git config user.name 'KAOPU Render Repair'
          git config user.email 'actions@users.noreply.github.com'
          git add "$DIR/acceptance" "$DIR/DELIVERY.json"
          git commit -m "test(skin-r021): preserve exact public Windows and Linux acceptance [skip ci]"
          git push origin HEAD:refs/heads/fix/skin-dna-r02-1-blackframe-20261013
      - uses: actions/upload-artifact@v4
        with:
          name: skin-r021-final-${{ github.run_number }}
          path: kaopu-unified-human-workbench/skin-dna-r02-1
          retention-days: 14
