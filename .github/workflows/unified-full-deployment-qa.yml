name: Validate fixed common-person deployment and public return
on:
  push:
    branches: [qa/unified-human-r01-20261006]
    paths: ['.github/workflows/unified-full-deployment-qa.yml']
  workflow_dispatch:
    inputs:
      public_url:
        description: 'Optional exact deployed common-person URL; empty tests generated candidate'
        required: false
        type: string
        default: ''
permissions:
  contents: read
jobs:
  deployment:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github/qa/unified-full-20261007
          filter: blob:none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore exact source bytes; no registration or model changes
        working-directory: .github/qa/unified-full-20261007
        run: |
          python restore_sources.py
          python tools/prepare_common.py
          python restore_registration.py
          node ui/build-runtime-metadata.mjs
          node ui/tests/controller.test.mjs
          python tools/build_deployment.py
          python tools/prepare_overview_card.py
          python -c "import json; m=json.load(open('DEPLOYMENT-MANIFEST.json')); assert m['adapterFingerprint']=='f975df925c5586eccaae60f61d888e5b1bcfa6200aad7d1763cb10ae3b736224'; assert m['mathCheckpoint']=='29109562604f9fdfa7def1aa3652258b722b0ad7'"
      - name: Independently read actual posed exports and verify skeleton evaluation
        working-directory: .github/qa/unified-full-20261007
        run: |
          node tests/common-exports.mjs
          python -m pip install trimesh==5.1.1 usd-core==26.8 numpy==2.3.5
          python tests/read_common_exports.py
      - name: Check public bytes when a deployed URL is supplied
        if: inputs.public_url != ''
        working-directory: .github/qa/unified-full-20261007
        env:
          PUBLIC_URL: ${{ inputs.public_url }}
        run: python tools/verify_public_deployment.py "$PUBLIC_URL"
      - name: Prepare real browser verification
        working-directory: .github/qa/unified-full-20261007
        run: |
          npm install --no-save --ignore-scripts --package-lock=false playwright@1.57.0
          npx playwright install --with-deps chromium webkit
          python -m http.server 8765 > /tmp/common-deployment-server.log 2>&1 &
      - name: Chromium actual parameters, archive, exports and return
        working-directory: .github/qa/unified-full-20261007
        env:
          COMMON_UI_BROWSER: chromium
          COMMON_UI_URL: ${{ inputs.public_url || 'http://127.0.0.1:8765/deployment/kaopu-unified-human-workbench/index.html' }}
          COMMON_UI_OUT: qa-output/deployment-chromium
        run: node ui/tests/browser.cjs
      - name: WebKit actual parameters, archive, exports and return
        working-directory: .github/qa/unified-full-20261007
        env:
          COMMON_UI_BROWSER: webkit
          COMMON_UI_URL: ${{ inputs.public_url || 'http://127.0.0.1:8765/deployment/kaopu-unified-human-workbench/index.html' }}
          COMMON_UI_OUT: qa-output/deployment-webkit
        run: node ui/tests/browser.cjs
      - name: Original overview card keyboard entry, history and direct return
        working-directory: .github/qa/unified-full-20261007
        run: |
          OVERVIEW_BROWSER=chromium node qa/overview-common-card.cjs
          OVERVIEW_BROWSER=webkit node qa/overview-common-card.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: common-deployment-chromium
          retention-days: 21
          path: .github/qa/unified-full-20261007/qa-output/deployment-chromium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: common-deployment-webkit
          retention-days: 21
          path: .github/qa/unified-full-20261007/qa-output/deployment-webkit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: common-deployment-receipt
          retention-days: 21
          path: |
            .github/qa/unified-full-20261007/DEPLOYMENT-MANIFEST.json
            .github/qa/unified-full-20261007/research/export-cases/manifest.json
            .github/qa/unified-full-20261007/research/export-independent-reader-report.json
            .github/qa/unified-full-20261007/research/PUBLIC-BYTE-RECEIPT.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: common-overview-card-pair
          retention-days: 21
          path: |
            .github/qa/unified-full-20261007/qa-output/overview-card-chromium
            .github/qa/unified-full-20261007/qa-output/overview-card-webkit
            .github/qa/unified-full-20261007/DEPLOYMENT-45-MANIFEST.json
            .github/qa/unified-full-20261007/OVERVIEW-CARD-PATCH.json
            .github/qa/unified-full-20261007/OVERVIEW-CARD.diff
