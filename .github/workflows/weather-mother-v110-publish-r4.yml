name: Weather Mother V110 Publish R4
on:
  push:
    branches: [gh-pages]
    paths:
      - .github/workflows/weather-mother-v110-publish-r4.yml
permissions:
  contents: write
  actions: read
concurrency:
  group: weather-mother-v110-publish-r4
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          sparse-checkout: |
            weather-mother/v110-full-src
            weather-mother/v110-full
            weather-mother/HANDOFF.json
            .github/workflows
      - name: Recover the exact R4 browser-tested artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/weather-r4
          gh run download 33477416922 -n weather-v110-full-code-and-evidence-r4 -D /tmp/weather-r4
          python - <<'PY'
          from pathlib import Path
          import json,hashlib,shutil
          roots=[p.parent for p in Path('/tmp/weather-r4').rglob('MANIFEST.json') if p.parent.name=='_weather_v110_stage']
          assert len(roots)==1,roots
          s=roots[0];q=json.loads((s/'QA.json').read_text());m=json.loads((s/'MANIFEST.json').read_text())
          assert q['status']=='BROWSER_QA_PASS' and len(q['checks'])==52 and all(x['pass'] for x in q['checks'])
          assert m['status']=='BROWSER_QA_PASS' and m['weatherCaseCount']==20 and m['storedImageAssets']==0
          for n,f in m['files'].items():
            b=(s/n).read_bytes();assert len(b)==f['bytes'] and hashlib.sha256(b).hexdigest()==f['sha256'],n
          d=Path('weather-mother/v110-full')
          if d.exists():shutil.rmtree(d)
          shutil.copytree(s,d)
          print('Recovered',len(q['checks']),'passed checks and',len(m['files']),'identified files')
          PY
      - name: Publish the unchanged tested runtime
        run: |
          git sparse-checkout add weather-mother/v110-full
          git config user.name 'Weather Mother full QA'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse weather-mother/v110-full
          git commit -m 'feat(weather-mother): publish R4 tested full weather workbench'
          for attempt in 1 2 3; do
            git fetch origin gh-pages
            git rebase origin/gh-pages
            if git push origin HEAD:gh-pages; then break; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 3
          done
          echo "WEATHER_V110_DEPLOYMENT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Verify exact public byte identities
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,time,urllib.request,os
          d=Path('weather-mother/v110-full');m=json.loads((d/'MANIFEST.json').read_text());base='https://haihao0307.github.io/guilin-dem-pipeline/weather-mother/v110-full/'
          receipt={}
          for attempt in range(42):
            try:
              for n,f in m['files'].items():
                req=urllib.request.Request(base+n+'?verify='+f['sha256'][:16],headers={'Cache-Control':'no-cache'})
                with urllib.request.urlopen(req,timeout=20) as r:
                  b=r.read();h=hashlib.sha256(b).hexdigest();assert r.status==200 and h==f['sha256'],n
                  receipt[n]={'status':200,'bytes':len(b),'sha256':h}
              break
            except Exception as e:
              print('Pages propagation',attempt,str(e),flush=True)
              if attempt==41:raise
              time.sleep(10)
          (d/'PUBLICATION_RECEIPT.json').write_text(json.dumps({'version':'1.1.0-world','sourceHead':m['buildSourceHead'],'deploymentHead':os.environ['WEATHER_V110_DEPLOYMENT'],'url':base,'files':receipt,'publicBytesVerified':True,'stableEntryReplaced':False,'visualApproved':False,'aaaQualityApproved':False,'productionReady':False},ensure_ascii=False,indent=2)+'\n')
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install public browser verification environment
        run: |
          python -m pip install 'playwright==1.62.0' 'pillow==12.3.0'
          python -m playwright install --with-deps chromium
      - name: Prepare robust public QA copy
        run: |
          python - <<'PY'
          from pathlib import Path
          q=Path('weather-mother/v110-full-src/qa.py').read_text()
          replacements={
            "state['wind']==33 and state['cloudSpeed']==5":"abs(state['wind']-33)<.01 and abs(state['cloudSpeed']-5)<.01",
            "setv('direction',270);page.evaluate('WeatherMother.play()');":"setv('direction',270);page.wait_for_function(\"Math.abs(WeatherMother.getState().direction-270)<.01\",timeout=150000);page.evaluate('WeatherMother.play()');",
            "page.locator('#seed').click()":"page.evaluate(\"document.getElementById('seed').click()\")"
          }
          for old,new in replacements.items():assert q.count(old)==1,old;q=q.replace(old,new)
          Path('/tmp/weather_v110_qa.py').write_text(q)
          PY
      - name: Verify actual public page in Chromium
        env:
          PUBLIC_CHECK: '1'
        run: python /tmp/weather_v110_qa.py weather-mother/v110-full https://haihao0307.github.io/guilin-dem-pipeline/weather-mother/v110-full/
      - name: Record public evidence and candidate handoff
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,os
          d=Path('weather-mother/v110-full');q=json.loads((d/'PUBLIC_QA.json').read_text());assert q['status']=='BROWSER_QA_PASS'
          m=json.loads((d/'MANIFEST.json').read_text());m['status']='PUBLIC_BROWSER_VERIFIED';m['publicChecks']=len(q['checks']);m['deploymentHead']=os.environ['WEATHER_V110_DEPLOYMENT'];(d/'MANIFEST.json').write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n')
          r={'motherId':'Weather Mother','version':'1.1.0-world','repository':'haihao0307/guilin-dem-pipeline','branch':'gh-pages','sourceCommit':m['buildSourceHead'],'deploymentCommit':os.environ['WEATHER_V110_DEPLOYMENT'],'policyVersion':'1.0.0','policyScope':'Full weather operator UI; neutral and diagnostic evidence remain outside this main workbench','runtimeEntry':'weather-mother/v110-full/index.html','weatherCases':20,'cloudGenera':10,'tests':{'automatic':52,'public':len(q['checks'])},'evidence':['QA.json','PUBLIC_QA.json','PUBLICATION_RECEIPT.json','MANIFEST.json','WORLD_RULES.json'],'protectedInputsChanged':False,'stableCanonicalEntryChanged':False,'unresolved':['User visual review of exact build','AAA cloud and lightning refinement','user GPU frame pacing','full fluid and numerical weather solver','live weather','scientific cyclone calibration'],'visualApproved':False,'aaaQualityApproved':False,'productionReady':False}
          (d/'ADOPTION_RECEIPT.json').write_text(json.dumps(r,ensure_ascii=False,indent=2)+'\n')
          root=Path('weather-mother/HANDOFF.json');h=json.loads(root.read_text());h['candidateEntry']='https://haihao0307.github.io/guilin-dem-pipeline/weather-mother/v110-full/';h['candidateVersion']='1.1.0-world';h['candidateDeploymentCommit']=os.environ['WEATHER_V110_DEPLOYMENT'];h['candidateStatus']='PUBLIC_BROWSER_VERIFIED_AWAITING_USER_VISUAL_REVIEW';h['canonicalEntryCurrentlyResolvesTo']='clean-v1';h['candidateAdds']=['20 weather cases','iridescent clouds','organized squall line','procedural typhoon eye eyewall spiral rainbands','integrated natural lighting presets','connected graphical lightning'];h['manualVisualAcceptanceOfCandidate']=False;h['aaaQualityApproved']=False;h['productionReady']=False;root.write_text(json.dumps(h,ensure_ascii=False,indent=2)+'\n')
          PY
          git add --sparse weather-mother/v110-full/PUBLIC_QA.json weather-mother/v110-full/PUBLICATION_RECEIPT.json weather-mother/v110-full/MANIFEST.json weather-mother/v110-full/ADOPTION_RECEIPT.json weather-mother/HANDOFF.json
          git commit -m 'test(weather-mother): record live full-weather evidence and blocked approvals'
          git fetch origin gh-pages
          git rebase origin/gh-pages
          git push origin HEAD:gh-pages
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weather-v110-public-evidence
          retention-days: 7
          path: |
            weather-mother/v110-full/QA.json
            weather-mother/v110-full/PUBLIC_QA.json
            weather-mother/v110-full/PUBLICATION_RECEIPT.json
            weather-mother/v110-full/ADOPTION_RECEIPT.json
      - name: Summary
        if: always()
        run: |
          echo '## Weather Mother 1.1 full operator workbench' >> "$GITHUB_STEP_SUMMARY"
          echo 'Recovered exact 52-check R4 runtime, published it, and re-ran the same full suite against public Pages. Stable Clean V1 and other production lines remain unchanged.' >> "$GITHUB_STEP_SUMMARY"
