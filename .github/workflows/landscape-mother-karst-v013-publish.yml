name: Landscape Mother karst material V013

on:
  push:
    branches:
      - feature/landscape-mother-field-graph-v002
    paths:
      - workbenches/landscape-mother-v013/**
      - tools/landscape-mother/v013_online_release.py
      - .github/workflows/landscape-mother-karst-v013-publish.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: landscape-mother-karst-v013-publish
  cancel-in-progress: false

jobs:
  build-test-publish:
    if: github.ref == 'refs/heads/feature/landscape-mother-field-graph-v002'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install deterministic numeric and browser toolchain
        run: |
          set -euo pipefail
          python -m pip install numpy==2.3.5 scipy==1.17.0 scikit-image==0.26.0 trimesh==4.11.1 playwright==1.55.0

      - name: Assemble and build the repository V013 candidate twice
        env:
          OUT_A: ${{ runner.temp }}/landscape-mother-v013
          OUT_B: ${{ runner.temp }}/landscape-mother-v013-repeat
        run: |
          set -euo pipefail
          cp workbenches/landscape-mother-v012/build_scene.py "$RUNNER_TEMP/build_scene_v013.py"
          python workbenches/landscape-mother-v013/patch_build.py "$RUNNER_TEMP/build_scene_v013.py"
          LANDSCAPE_OUT="$OUT_A" python "$RUNNER_TEMP/build_scene_v013.py"
          LANDSCAPE_OUT="$OUT_B" python "$RUNNER_TEMP/build_scene_v013.py"
          cp workbenches/landscape-mother-v013/runtime/{index.html,styles.css,app.js} "$OUT_A/"
          python tools/landscape-mother/v013_online_release.py prepare "$OUT_A"

      - name: Verify deterministic geometry and publication gates
        env:
          OUT_A: ${{ runner.temp }}/landscape-mother-v013
          OUT_B: ${{ runner.temp }}/landscape-mother-v013-repeat
        run: |
          set -euo pipefail
          node --check "$OUT_A/app.js"
          python - <<'PY'
          import hashlib,json,os,re,struct
          from pathlib import Path
          a=Path(os.environ['OUT_A']);b=Path(os.environ['OUT_B'])
          m=json.loads((a/'SCENE_META.json').read_text())
          data=(a/'scene.bin').read_bytes();repeat=(b/'scene.bin').read_bytes()
          sha=lambda x:hashlib.sha256(x).hexdigest()
          assert data[:4]==b'LMK3' and struct.unpack_from('<I',data,4)[0]==3
          assert data==repeat and sha(data)==m['binarySha256']
          assert len(data)==m['binaryBytes']
          assert m['schema']=='landscape-mother-karst-v013/1'
          assert m['vertices']>100000 and m['triangles']>200000
          assert m['watertight'] and m['windingConsistent']
          assert m['tinyFaceCountLt1e9']==0 and m['dissolutionEventCount']>=20
          assert m['fields'][-2:]==['cavity','manganeseDeposit']
          assert m['approvals']=={'visualApproved':False,'visualAcceptance':False,'productionReady':False}
          for k in ['textureSampling','runtimeLOD','deviceDependentGeometry','distantMountains','fog','externalModels','images']:
              assert m[k] is False
          html=(a/'index.html').read_text();js=(a/'app.js').read_text();css=(a/'styles.css').read_text()
          assert '<img' not in html.lower()
          assert not re.search(r'https?://',html+js+css)
          assert not re.search(r'sampler2D|texture2D|texImage|createTexture',js)
          assert 'min-width:44px' in css and 'backdrop-filter:blur(32px)' in css
          assert 'manganeseWeight' in js and 'event-field-splat' in js
          assert 'pointerSnapshot' in js and 'items.length>=2' in js
          assert 'id="home"' in html and 'id="hub" class="hub"' in html
          assert '<link rel="icon" href="data:">' not in html
          assert 'href="data:,"' in html and '__LANDSCAPE_RELEASE__' in js
          report={'passed':True,'repeatBinaryIdentical':True,'sourceCommit':os.environ['GITHUB_SHA'],'scene':m,'geometryUnchangedByEntryRepair':True}
          (a/'STATIC_QA.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY

      - name: Check mobile and desktop WebGL plus touch and navigation
        run: python tools/landscape-mother/v013_online_release.py check "$RUNNER_TEMP/landscape-mother-v013"

      - name: Publish only the versioned workbench and stable entry
        env:
          LANDSCAPE_OUT: ${{ runner.temp }}/landscape-mother-v013
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          git worktree add "$RUNNER_TEMP/site" origin/gh-pages
          cd "$RUNNER_TEMP/site"
          mkdir -p landscape-mother-v013 landscape-mother
          for f in index.html styles.css app.js scene.bin SCENE_META.json STATIC_QA.json BROWSER_QA.json ONLINE_RELEASE.json; do
            cp "$LANDSCAPE_OUT/$f" "landscape-mother-v013/$f"
          done
          cat > landscape-mother/index.html <<'HTML'
          <!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Landscape Mother · 在线工作台</title><link rel="icon" href="data:,"><style>html,body{margin:0;min-height:100%;background:#13252a;color:#ecf0e9;font:16px system-ui}main{padding:24px}a{color:#e9cf8d}</style></head><body><main><a id="entry" href="../landscape-mother-v013/">打开 Landscape Mother 在线三维工作台</a><p>正在进入在线页面</p></main><script>const next=new URL('../landscape-mother-v013/',location.href);next.search=location.search;next.hash=location.hash;document.getElementById('entry').href=next.href;location.replace(next.href);</script></body></html>
          HTML
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add landscape-mother-v013 landscape-mother/index.html
          python - <<'PY'
          import subprocess
          paths=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert paths
          assert all(p.startswith('landscape-mother-v013/') or p=='landscape-mother/index.html' for p in paths),paths
          PY
          git commit -m "fix(landscape-mother): publish verified V013 online entry and mobile navigation"
          for attempt in 1 2 3 4; do
            if git push origin HEAD:gh-pages; then
              git rev-parse HEAD > "$LANDSCAPE_OUT/PUBLISH_COMMIT.txt"
              exit 0
            fi
            git fetch origin gh-pages
            git rebase origin/gh-pages
          done
          exit 1

      - name: Verify actual public HTTPS bytes and browser navigation
        run: python tools/landscape-mother/v013_online_release.py public "$RUNNER_TEMP/landscape-mother-v013"

      - name: Upload reproducible runtime and actual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Landscape_Mother_V013_Online_Verified
          path: ${{ runner.temp }}/landscape-mother-v013
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0

      - name: Record verified online receipt
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'landscape-mother-v013'
          q=json.loads((root/'PUBLIC_BROWSER_QA.json').read_text())
          h=json.loads((root/'PUBLIC_HTTP_QA.json').read_text())
          print('## Landscape Mother V013 online')
          print('Public asset hashes matched:',h['matched'])
          print('Public browser checks passed:',q['passed'])
          print('Online entry: https://haihao0307.github.io/guilin-dem-pipeline/landscape-mother/?scene=karst&v=v013-online-20260903-r1')
          print('Default entry opens hub; scene=karst opens the scene directly; home returns to hub.')
          print('No screenshot delivery. Real iPhone and artistic acceptance remain pending.')
          PY
