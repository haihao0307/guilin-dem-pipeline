name: Head Look R01 public visual inspection
on:
  push:
    branches: [test/head-look-r01-visual-audit-20261013]
    paths: ['.github/workflows/head-look-r01-public-glimpse.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: |
          mkdir -p public-inspection
          cat > public-inspection/probe.cjs <<'JS'
          const fs=require('fs'),{chromium}=require('playwright');
          (async()=>{const r={url:'https://htmlpreview.github.io/?https://raw.githubusercontent.com/haihao0307/guilin-dem-pipeline/7aecc594da75f2307db50a4d99b44dc634fddea7/kaopu-unified-human-workbench/head-look-r01/preview.html',errors:[],screens:[],stage:'launch',consumerGPU:false};let b,p;const write=()=>fs.writeFileSync('public-inspection/report.json',JSON.stringify(r,null,2));try{b=await chromium.launch({headless:true,args:['--no-sandbox','--use-angle=swiftshader','--enable-unsafe-swiftshader']});p=await b.newPage({viewport:{width:1440,height:1100},deviceScaleFactor:1});p.on('pageerror',e=>{r.errors.push(String(e));write()});r.stage='navigate';write();await p.goto(r.url,{waitUntil:'domcontentloaded',timeout:120000});await p.waitForFunction(()=>window.headLook,null,{timeout:240000});await p.evaluate(()=>lifelikeIdle.pause(true));r.stage='native-ready';write();await p.waitForFunction(()=>lifelikeIdle.ready(),null,{timeout:240000});await p.evaluate(async()=>{await Promise.all([__IDENTITY_QA__.viewer().skin.faceReady,__IDENTITY_QA__.viewer().skin.naturalEyesReady]);lifelikeIdle.seek(0);});const cdp=await p.context().newCDPSession(p);for(const [name,view,mode]of [['front-new','front','both'],['front-old','front','base'],['lips-new','lip','both'],['lips-old','lip','base']]){r.stage=name;write();await p.evaluate(({view,mode})=>{headLook.view(view);headLook.mode(mode);const v=__IDENTITY_QA__.viewer();v.renderer.render(v.scene,v.camera);},{view,mode});const image=await cdp.send('Page.captureScreenshot',{format:'png',fromSurface:true,captureBeyondViewport:false});fs.writeFileSync('public-inspection/'+name+'.png',Buffer.from(image.data,'base64'));r.screens.push(name);write();}r.report=await p.evaluate(()=>headLook.report());r.complete=true;}catch(e){r.failure=String(e);process.exitCode=1;}finally{write();await b?.close();}})();
          JS
          timeout 8m node public-inspection/probe.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: head-look-public-visual-inspection
          path: public-inspection/
          retention-days: 3
