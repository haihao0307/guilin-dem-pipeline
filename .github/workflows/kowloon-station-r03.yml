name: Kowloon R03 shared fabric candidate
on:
  push:
    branches: ['qa/kowloon-station-r03-*']
    paths:
      - 'kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01/kowloon-station-r03/**'
      - '.github/workflows/kowloon-station-r03.yml'
permissions:
  contents: read
concurrency:
  group: kowloon-r03-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-scene:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: kaopu-minigame-workbench/voxel-train-study
      - name: Fabric geometry and source identity tests
        run: node --test kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01/kowloon-station-r03/qa/fabric.test.mjs
      - name: Install official pinned Playwright runner
        run: |
          npm install --prefix "$RUNNER_TEMP/station" --no-save --ignore-scripts --no-audit --no-fund playwright@1.57.0
          "$RUNNER_TEMP/station/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/station/node_modules" >> "$GITHUB_ENV"
      - name: Whole station true WebGL and close views
        run: node kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01/kowloon-station-r03/qa/station-browser.cjs
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: kowloon-r03-${{ github.sha }}
          path: kowloon-station-results/
          retention-days: 7
          compression-level: 0
