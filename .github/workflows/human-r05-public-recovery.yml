name: Human R05 exact-public bounded macro recovery
on:
  push:
    branches: [test/human-r05-speed-portrait-proof-20261013]
    paths: ['.github/workflows/human-r05-public-recovery.yml']
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 475ead2759159b83927a1aa8ae6879595e1d18bc
          sparse-checkout: kaopu-unified-human-workbench/human-integrated-r05
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - name: Same exact public source; keep all assertions, bound only software macro fill
        env:
          PREVIEW_URL: https://htmlpreview.github.io/?https://raw.githubusercontent.com/haihao0307/guilin-dem-pipeline/475ead2759159b83927a1aa8ae6879595e1d18bc/kaopu-unified-human-workbench/human-integrated-r05/preview.html
          QA_OUT: recovery
          SOURCE_SHA: 7df30da366fb809b9056dd90413d657bbe00424c
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('kaopu-unified-human-workbench/human-integrated-r05/verify.cjs');s=p.read_text()
          a="await p.evaluate(()=>{unifiedHuman.face();document.querySelector('[data-uact=\"ear-right\"]').click();});"
          assert s.count(a)==1
          s=s.replace(a,'await p.setViewportSize({width:960,height:760});'+a)
          s=s.replace("q.coldReadyMS=performance.now()-begin;","q.macroViewport={width:960,height:760,reason:'software rasterizer timeout at 1500x1050 macro; no geometry or shader quality change'};q.coldReadyMS=performance.now()-begin;")
          p.write_text(s)
          PY
          node kaopu-unified-human-workbench/human-integrated-r05/verify.cjs
          python - <<'PY'
          import urllib.request,hashlib,json
          from pathlib import Path
          p=Path('kaopu-unified-human-workbench/human-integrated-r05');b=json.loads((p/'BUILD.json').read_text());q=json.loads(Path('recovery/qa.json').read_text())
          data=urllib.request.urlopen('https://raw.githubusercontent.com/haihao0307/guilin-dem-pipeline/475ead2759159b83927a1aa8ae6879595e1d18bc/'+str(p)+'/preview.html').read()
          assert hashlib.sha256(data).hexdigest()==b['previewSHA256']
          assert q['completed'] and len(q['tests'])==20 and not q['pageErrors'] and not q['consoleErrors'] and not q['failedRequests']
          Path('recovery/public-integrity.json').write_text(json.dumps({'pass':True,'build':'475ead2759159b83927a1aa8ae6879595e1d18bc','htmlSHA256':b['previewSHA256'],'checks':len(q['tests']),'macroViewport':q['macroViewport']},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: human-r05-public-recovery
          path: recovery/
          retention-days: 14
