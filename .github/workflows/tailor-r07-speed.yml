name: Tailor R07 paired speed and geometry
on:
  push:
    branches: [fix/tailor-r07-speed-stability-20261008]
    paths:
      - 'kaopu-tailor-workbench/r07/build.py'
      - 'kaopu-tailor-workbench/r07/assembly.mjs'
      - 'kaopu-tailor-workbench/r07/global.cpp'
      - 'kaopu-tailor-workbench/r07/translate_kernel.py'
      - 'kaopu-tailor-workbench/r07/qa.py'
permissions:
  contents: read
concurrency:
  group: tailor-r07-speed
  cancel-in-progress: false
jobs:
  paired-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            kaopu-tailor-workbench
            kaopu-human-overview
          fetch-depth: 1
      - name: Build additive kernels and application
        run: |
          python kaopu-tailor-workbench/r07/translate_kernel.py
          clang++ --target=wasm32 -O3 -ffp-contract=off -nostdlib -fno-exceptions -fno-rtti -Wl,--no-entry -Wl,--export-all -Wl,-z,stack-size=32768 -Wl,--initial-memory=131072 -o kaopu-tailor-workbench/r07/global.wasm kaopu-tailor-workbench/r07/global-all.cpp
          python kaopu-tailor-workbench/r07/build.py
          node --check kaopu-tailor-workbench/catalogue/r07-worker.bundle.mjs
          node --check kaopu-tailor-workbench/catalogue/r07-workbench-app.mjs
          python - <<'PY'
          from pathlib import Path
          q=Path('kaopu-tailor-workbench/r07/qa.py')
          s=q.read_text()
          s=s.replace("control=page.locator('[data-control=\"meta.upper\"]');control.select_option", "page.locator('#parameters-list details').evaluate_all('(els)=>els.forEach(el=>el.open=true)');control=page.locator('[data-control=\"meta.upper\"]');control.select_option")
          q.write_text(s)
          PY
      - name: Install test browser
        run: |
          python -m pip install playwright==1.56.0 numpy==1.26.4
          python -m playwright install chromium --with-deps
      - name: Real paired source-input test
        run: |
          python -m http.server 8765 > /tmp/r07-server.log 2>&1 &
          python kaopu-tailor-workbench/r07/qa.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tailor-r07-evidence
          path: |
            evidence-r07
            kaopu-tailor-workbench/r07
            kaopu-tailor-workbench/catalogue/r07-*
          retention-days: 14
