name: Tailor R07 paired speed and geometry
on:
  push:
    branches: [fix/tailor-r07-speed-stability-20261008]
    paths:
      - 'kaopu-tailor-workbench/r07/**'
      - '.github/workflows/tailor-r07-speed.yml'
permissions:
  contents: write
concurrency:
  group: tailor-r07-speed
  cancel-in-progress: false
jobs:
  paired-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            kaopu-tailor-workbench
            kaopu-human-overview
          fetch-depth: 1
      - name: Build additive kernels and application
        run: |
          python kaopu-tailor-workbench/r07/translate_kernel.py
          clang++ --target=wasm32 -O3 -ffp-contract=off -nostdlib -fno-exceptions -fno-rtti -Wl,--no-entry -Wl,--export-all -Wl,-z,stack-size=32768 -Wl,--initial-memory=131072 -o kaopu-tailor-workbench/r07/global.wasm kaopu-tailor-workbench/r07/global-all.cpp
          python kaopu-tailor-workbench/r07/build.py
          node --check kaopu-tailor-workbench/catalogue/r07-worker.bundle.mjs
          node --check kaopu-tailor-workbench/catalogue/r07-workbench-app.mjs
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          r=Path('kaopu-tailor-workbench')
          # Open collapsed parameter sections before the browser exercises a nested control.
          q=r/'r07/qa.py';s=q.read_text();s=s.replace("control=page.locator('[data-control=\"meta.upper\"]');control.select_option", "page.locator('#parameters-list details').evaluate_all('(els)=>els.forEach(el=>el.open=true)');control=page.locator('[data-control=\"meta.upper\"]');control.select_option");q.write_text(s)
          paths=list((r/'r07').rglob('*'))+list((r/'catalogue').glob('r07-*'))
          manifest={'version':'R07.0','sourceCommit':os.environ['GITHUB_SHA'],'referenceCommit':'5bcf36362dd8c13caea3f4f04fd7a9713b16ed1e','files':{str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in paths if p.is_file() and p.name not in ['BUILD_MANIFEST.json','R07_REPORT.json']},'newStylePhysicalFitAccepted':False,'referenceEquivalent':False}
          (r/'r07/BUILD_MANIFEST.json').write_text(json.dumps(manifest,indent=2))
          PY
      - name: Install test browser
        run: |
          python -m pip install playwright==1.56.0 numpy==1.26.4
          python -m playwright install chromium --with-deps
      - name: Real paired source-input test
        run: |
          python -m http.server 8765 > /tmp/r07-server.log 2>&1 &
          python kaopu-tailor-workbench/r07/qa.py
      - name: Retain tested generated files on this feature branch only
        if: success()
        run: |
          test "$GITHUB_REF_NAME" = 'fix/tailor-r07-speed-stability-20261008'
          git fetch --no-tags origin "$GITHUB_REF_NAME"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          cp evidence-r07/R07_REPORT.json kaopu-tailor-workbench/r07/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kaopu-tailor-workbench/r07 kaopu-tailor-workbench/catalogue/r07-*
          git commit -m 'build(tailor): preserve R07 tested assets and paired report; clothing quality still unaccepted'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          git rev-parse HEAD > evidence-r07/GENERATED_COMMIT.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tailor-r07-evidence
          path: |
            evidence-r07
            kaopu-tailor-workbench/r07
            kaopu-tailor-workbench/catalogue/r07-*
          retention-days: 14
