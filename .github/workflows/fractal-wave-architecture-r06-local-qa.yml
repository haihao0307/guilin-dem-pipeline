name: Fractal Wave Architecture R06 local QA

on:
  push:
    branches:
      - work/fractal-wave-architecture-r06-20261004
    paths:
      - .github/workflows/fractal-wave-architecture-r06-local-qa.yml
      - kaopu-tree-fractal-wave-lab/teacher-aligned-architecture-r06/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-local:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install browser QA
        run: |
          python -m pip install --disable-pip-version-check playwright pillow
          python -m playwright install --with-deps chromium
      - name: Serve and test local R06
        shell: bash
        run: |
          python -m http.server 4173 --bind 127.0.0.1 > /tmp/r06-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          python - <<'PY'
          from pathlib import Path
          import json, traceback
          from PIL import Image, ImageStat
          from playwright.sync_api import sync_playwright
          root=Path('evidence-r06-local'); root.mkdir(exist_ok=True)
          url='http://127.0.0.1:4173/kaopu-tree-fractal-wave-lab/teacher-aligned-architecture-r06/'
          report={'url':url,'checks':{},'errors':[]}; C=report['checks']
          def digest(path):
              im=Image.open(path).convert('RGB'); st=ImageStat.Stat(im)
              return {'bytes':path.stat().st_size,'mean':sum(st.mean)/3,'stddev':sum(st.stddev)/3}
          try:
              with sync_playwright() as p:
                  browser=p.chromium.launch(headless=True)
                  page=browser.new_page(viewport={'width':1440,'height':900},device_scale_factor=1)
                  page.on('pageerror',lambda e:report['errors'].append('pageerror: '+str(e)))
                  page.on('console',lambda m:report['errors'].append('console: '+m.text) if m.type=='error' else None)
                  page.goto(url,wait_until='domcontentloaded',timeout=120000)
                  page.wait_for_function('window.__teacherArchitectureR06Ready===true',timeout=120000)
                  page.wait_for_timeout(1600)
                  sig=page.evaluate('TeacherArchitectureR06.getState().signature')
                  C['ready']=True
                  C['teacherAligned']=sig['teacherAligned'] is True
                  C['globalMetaballDisabled']=sig['globalMetaballDisabled'] is True
                  C['continuousAxisSweep']=sig['continuousAxisSweep'] is True
                  C['terminalOrganZones']=sig['organZonesTerminalOnly'] is True
                  C['trunkRatio']=sig['baseRadius']/sig['height']<0.065
                  C['hierarchy']=sig['tierCount']>=2 and sig['primaryBranches']>=3 and sig['terminalCount']>sig['primaryBranches']
                  C['roots']=sig['rootCount']>=3 and sig['rootUptake']>0
                  C['organs']=sig['leafCount']>0 and sig['fruitCount']<=3
                  desktop=root/'desktop.png'; page.screenshot(path=str(desktop),full_page=False)
                  C['desktopPixels']=digest(desktop)['stddev']>10
                  page.set_viewport_size({'width':390,'height':844}); page.wait_for_timeout(600)
                  C['mobileNoOverflow']=page.evaluate('document.documentElement.scrollWidth<=innerWidth')
                  mobile=root/'mobile.png'; page.screenshot(path=str(mobile),full_page=False)
                  C['mobilePixels']=digest(mobile)['stddev']>10
                  C['errorsZero']=not report['errors']
                  report['signature']=sig; report['screens']={'desktop':digest(desktop),'mobile':digest(mobile)}
                  browser.close()
          except Exception:
              report['failure']=traceback.format_exc()
          (root/'report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          if report.get('failure') or not all(C.values()): raise SystemExit('R06 local QA failed')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: FRACTAL_WAVE_ARCHITECTURE_R06_LOCAL_QA
          path: evidence-r06-local
          if-no-files-found: error
          retention-days: 90
