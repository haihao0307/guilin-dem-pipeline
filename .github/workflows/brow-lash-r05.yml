name: Brow Lash R05 dense follicle variants
on:
  push:
    branches: [feature/brow-lash-r05-follicle-variants-20261015]
    paths:
      - 'kaopu-unified-human-workbench/brow-lash-r05/**'
      - '.github/workflows/brow-lash-r05.yml'
permissions:
  contents: write
concurrency:
  group: brow-lash-r05
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NODE_PATH: /tmp/bl-r05-tools/node_modules
      BL_DIR: kaopu-unified-human-workbench/brow-lash-r05
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /kaopu-unified-human-workbench/brow-lash-r04/preview.html
            /kaopu-unified-human-workbench/brow-lash-r05/
            /.github/workflows/brow-lash-r05.yml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser tools
        run: |
          npm install --prefix /tmp/bl-r05-tools playwright@1.57.0
          /tmp/bl-r05-tools/node_modules/.bin/playwright install --with-deps chromium
      - name: Unit formulas and immutable-host build
        run: |
          node "$BL_DIR/test.cjs" > "$BL_DIR/UNIT_QA.json"
          SOURCE_SHA=${{ github.sha }} node "$BL_DIR/build.cjs"
      - name: Actual candidate fibers, presets and blink inspection
        env:
          QA_MODE: smoke
          QA_OUT: kaopu-unified-human-workbench/brow-lash-r05/acceptance/candidate
        run: node "$BL_DIR/verify.cjs"
      - name: Preserve early images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brow-lash-r05-early
          path: kaopu-unified-human-workbench/brow-lash-r05/
          retention-days: 14
      - name: Publish immutable review build
        run: |
          git config user.name 'KAOPU Workbench Builder'
          git config user.email 'kaopu-builder@users.noreply.github.com'
          git add "$BL_DIR/preview.html" "$BL_DIR/BUILD_MANIFEST.json" "$BL_DIR/UNIT_QA.json"
          git commit -m 'build(brow-lash-r05): dense follicle review candidate [skip ci]'
          git push origin HEAD:feature/brow-lash-r05-follicle-variants-20261015
          BUILD_SHA=$(git rev-parse HEAD)
          echo "BUILD_SHA=$BUILD_SHA" >> "$GITHUB_ENV"
          echo "PREVIEW_URL=https://htmlpreview.github.io/?https://raw.githubusercontent.com/haihao0307/guilin-dem-pipeline/$BUILD_SHA/$BL_DIR/preview.html" >> "$GITHUB_ENV"
      - name: Exact public page visual and interaction verification
        env:
          QA_MODE: full
          QA_OUT: kaopu-unified-human-workbench/brow-lash-r05/acceptance/public
        run: node "$BL_DIR/verify.cjs"
      - name: Preserve final receipt and evidence
        run: |
          node - <<'NODE'
          const fs=require('fs'),dir=process.env.BL_DIR,q=JSON.parse(fs.readFileSync(dir+'/acceptance/public/qa.json'));if(!q.completed)throw Error('Public QA incomplete');const receipt={version:'BROW-LASH-R05',sourceCommit:process.env.GITHUB_SHA,buildCommit:process.env.BUILD_SHA,preview:process.env.PREVIEW_URL,workflowRun:process.env.GITHUB_RUN_ID,checks:q.checks.length,screens:q.screens.length,publicRuntimeVerified:true,defaultRoots:q.initial.follicles.acceptedRoots,presetCount:q.initial.follicles.presetCount,externalEyebrowAssets:false,originalNative65:true,userVisualAccepted:false,filmQualityAccepted:false,consumerGPUCertified:false,physicalPhone:false};fs.writeFileSync(dir+'/DELIVERY.json',JSON.stringify(receipt,null,2));
          NODE
