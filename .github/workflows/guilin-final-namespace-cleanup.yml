name: Guilin final legacy namespace cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/guilin-final-namespace-cleanup.yml
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify sole truth before destructive cleanup
        run: |
          set -euo pipefail
          test -f TRUTH_LOCK.json
          grep -q '9490b1bd34f67336352cf448729f763ae4e241637d821961efd0290e29d6c9d4' TRUTH_LOCK.json
          grep -q '"height_texture_allowed": false' TRUTH_LOCK.json
          test "$(find . -type f -not -path './.git/*' | wc -l)" -le 21

      - name: Delete every branch outside the allowed production namespaces
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --all --prune
          git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin | while read -r branch; do
            if [[ "$branch" == "HEAD" || "$branch" == "main" || "$branch" == "gh-pages" || "$branch" == "truth/guilin-dem-12p5m-canonical" ]]; then
              continue
            fi
            lower="${branch,,}"
            if [[ "$lower" == *wenzhou* || "$lower" == *kunming* ]]; then
              continue
            fi
            git push origin --delete "$branch" || true
          done

      - name: Delete legacy releases and tags outside the allowed city namespaces
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release list --limit 1000 --json tagName --jq '.[].tagName' | while read -r tag; do
            if [[ "$tag" == "guilin-dem-truth-12p5m-v1" ]]; then continue; fi
            lower="${tag,,}"
            if [[ "$lower" == *wenzhou* || "$lower" == *kunming* ]]; then continue; fi
            gh release delete "$tag" --cleanup-tag -y || true
          done
          git fetch --tags --force
          git tag -l | while read -r tag; do
            if [[ "$tag" == "guilin-dem-truth-12p5m-v1" ]]; then continue; fi
            lower="${tag,,}"
            if [[ "$lower" == *wenzhou* || "$lower" == *kunming* ]]; then continue; fi
            git push origin ":refs/tags/$tag" || true
          done

      - name: Close remaining open legacy pull requests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh pr list --state open --limit 1000 --json number,headRefName | jq -c '.[]' | while read -r row; do
            number="$(jq -r '.number' <<<"$row")"
            ref="$(jq -r '.headRefName' <<<"$row")"
            lower="${ref,,}"
            if [[ "$ref" == "truth/guilin-dem-12p5m-canonical" || "$lower" == *wenzhou* || "$lower" == *kunming* ]]; then continue; fi
            gh pr close "$number" --comment "旧桂林试验线已经退出生产，后续只从唯一 12.5 米真值主线继续。" || true
          done

      - name: Remove this one-time workflow and align main with canonical truth
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git rm .github/workflows/guilin-final-namespace-cleanup.yml
          git config user.name "Haihao_Nature Grace HK"
          git config user.email "haihao0307@gmail.com"
          git commit -m "chore(guilin): finish legacy namespace cleanup"
          FINAL_SHA="$(git rev-parse HEAD)"
          echo "FINAL_SHA=$FINAL_SHA" >> "$GITHUB_ENV"
          git push origin HEAD:main
          git push origin HEAD:truth/guilin-dem-12p5m-canonical --force
          gh release edit guilin-dem-truth-12p5m-v1 --target "$FINAL_SHA"

      - name: Verify only the sole Guilin truth remains active
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --all --prune
          FAILED=0
          git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin | while read -r branch; do
            if [[ "$branch" == "HEAD" || "$branch" == "main" || "$branch" == "gh-pages" || "$branch" == "truth/guilin-dem-12p5m-canonical" ]]; then continue; fi
            lower="${branch,,}"
            if [[ "$lower" == *wenzhou* || "$lower" == *kunming* ]]; then continue; fi
            echo "Unexpected branch: $branch" >&2
            exit 1
          done
          test "$(git rev-parse origin/main)" = "$(git rev-parse origin/truth/guilin-dem-12p5m-canonical)"
          test "$(gh release list --limit 1000 --json tagName --jq '[.[] | select(.tagName | ascii_downcase | contains("guilin"))] | length')" = 1
          test "$(gh release list --limit 1000 --json tagName --jq -r '.[] | select(.tagName | ascii_downcase | contains("guilin")) | .tagName')" = "guilin-dem-truth-12p5m-v1"
          test "$(git ls-tree -r --name-only origin/main | wc -l)" -le 20
          ! git ls-tree -r --name-only origin/main | grep -Ei 'gaea|preview|fallback|30m|v0[0-9]|\.zip$|\.png$|\.jpg$|\.xz$'
          curl --fail --silent https://haihao0307.github.io/guilin-dem-pipeline/guilin/TRUTH_LOCK.json | grep -q '9490b1bd34f67336352cf448729f763ae4e241637d821961efd0290e29d6c9d4'

      - name: Delete older Actions history after verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq '.artifacts[].id' | while read -r id; do gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" || true; done
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" --jq '.workflow_runs[].id' | while read -r id; do if [[ "$id" != "$GITHUB_RUN_ID" ]]; then gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$id" || true; fi; done

      - name: Summary
        if: always()
        run: |
          {
            echo '## Guilin final namespace cleanup'
            echo
            echo "* final main: ${FINAL_SHA:-unknown}"
            echo '* sole Guilin branch: truth/guilin-dem-12p5m-canonical'
            echo '* sole Guilin release: guilin-dem-truth-12p5m-v1'
            echo '* old Guilin, GAEA, preview and fallback namespaces: removed'
            echo '* Wenzhou and Kunming namespaces: preserved'
          } >> "$GITHUB_STEP_SUMMARY"
