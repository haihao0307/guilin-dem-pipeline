name: Build extended Guilin DEM preview

on:
  workflow_dispatch:
    inputs:
      data_mode:
        description: Data mode
        required: true
        default: asf
        type: choice
        options:
          - asf
          - auto
          - fallback
      publish_public:
        description: Publish after controller visual approval
        required: true
        default: false
        type: boolean

concurrency:
  group: guilin-dem-zhenbaoding-yangshuo-pingle
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    defaults:
      run:
        working-directory: DEM-Map-Pipeline/guilin-zhenbaoding-yangshuo-pingle
    env:
      EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
      DEM_DATA_MODE: ${{ github.event.inputs.data_mode || 'asf' }}
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: DEM-Map-Pipeline/guilin-zhenbaoding-yangshuo-pingle/requirements.txt

      - name: Install geospatial runtime
        run: python -m pip install --disable-pip-version-check --only-binary=:all: -r requirements.txt

      - name: Build boundary, sources, mosaic and private preview
        run: python scripts/run_cloud_pipeline.py --root "$PWD"

      - name: Run release-blocking checks
        run: |
          test -f reports/QA_REPORT.json
          test -f web/index.html
          python - <<'PY'
          import json
          from pathlib import Path
          qa=json.loads(Path('reports/QA_REPORT.json').read_text(encoding='utf-8'))
          if qa.get('releaseAllowed') is not True:
              raise SystemExit('releaseAllowed is not true')
          PY

      - name: Upload COG, manifests, QA and private web preview
        uses: actions/upload-artifact@v7
        with:
          name: guilin-dem-private-preview-${{ github.sha }}
          path: |
            DEM-Map-Pipeline/guilin-zhenbaoding-yangshuo-pingle/outputs/*.tif
            DEM-Map-Pipeline/guilin-zhenbaoding-yangshuo-pingle/reports/**
            DEM-Map-Pipeline/guilin-zhenbaoding-yangshuo-pingle/metadata/**
            DEM-Map-Pipeline/guilin-zhenbaoding-yangshuo-pingle/web/**
          if-no-files-found: error
          compression-level: 3
          retention-days: 30

      - name: Configure GitHub Pages
        if: ${{ inputs.publish_public == true }}
        uses: actions/configure-pages@v6.0.0

      - name: Upload approved Pages artifact
        if: ${{ inputs.publish_public == true }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: DEM-Map-Pipeline/guilin-zhenbaoding-yangshuo-pingle/web

  deploy:
    if: ${{ inputs.publish_public == true }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy approved Guilin preview
        id: deployment
        uses: actions/deploy-pages@v5
