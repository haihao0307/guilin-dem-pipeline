name: Build extended Guilin DEM and web preview

on:
  push:
    branches:
      - dem-zhenbaoding-yangshuo-pingle
      - main
    paths:
      - .github/workflows/guilin-dem-extended.yml
      - DEM-Map-Pipeline/guilin-zhenbaoding-yangshuo-pingle/**
      - '!DEM-Map-Pipeline/guilin-zhenbaoding-yangshuo-pingle/web/**'
  workflow_dispatch:
    inputs:
      data_mode:
        description: Data mode
        required: true
        default: auto
        type: choice
        options:
          - auto
          - asf
          - fallback

concurrency:
  group: guilin-dem-zhenbaoding-yangshuo-pingle
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    defaults:
      run:
        working-directory: DEM-Map-Pipeline/guilin-zhenbaoding-yangshuo-pingle
    env:
      EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
      DEM_DATA_MODE: ${{ github.event.inputs.data_mode || 'auto' }}
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: DEM-Map-Pipeline/guilin-zhenbaoding-yangshuo-pingle/requirements.txt

      - name: Install geospatial runtime
        run: >-
          python -m pip install --disable-pip-version-check --only-binary=:all: -r requirements.txt

      - name: Build boundary, download sources, mosaic and web page
        run: python scripts/run_cloud_pipeline.py --root "$PWD"

      - name: Upload COG, manifests and QA reports
        uses: actions/upload-artifact@v7
        with:
          name: guilin-dem-zhenbaoding-yangshuo-pingle
          path: |
            DEM-Map-Pipeline/guilin-zhenbaoding-yangshuo-pingle/outputs/*.tif
            DEM-Map-Pipeline/guilin-zhenbaoding-yangshuo-pingle/reports/**
            DEM-Map-Pipeline/guilin-zhenbaoding-yangshuo-pingle/metadata/**
          if-no-files-found: error
          compression-level: 3
          retention-days: 30

      - name: Commit lightweight web result and metadata
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BASE="DEM-Map-Pipeline/guilin-zhenbaoding-yangshuo-pingle"
          git add -f -- "$BASE/web"
          for file in \
            "$BASE/reports/CLOUD_RUN_STATUS.json" \
            "$BASE/reports/QA_REPORT.json" \
            "$BASE/reports/DOWNLOAD_STATUS.json" \
            "$BASE/metadata/resolved_aoi.json" \
            "$BASE/metadata/selected_new_products.json" \
            "$BASE/metadata/runtime_source.json" \
            "$BASE/metadata/source_manifest.json"; do
            if [ -f "$file" ]; then git add -f -- "$file"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "Update extended Guilin DEM web result [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: DEM-Map-Pipeline/guilin-zhenbaoding-yangshuo-pingle/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy DEM preview to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
