name: Material R09 restore verify promote
on:
  push:
    branches: [main]
    paths:
      - 'ops/material/r09/**'
      - '.github/workflows/material-r09-restore.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: material-r09-restore
  cancel-in-progress: false
jobs:
  verify-promote:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read only the current bounded material source files
        run: |
          python3 - <<'PY'
          import os,json,base64,urllib.request,pathlib
          root=pathlib.Path('ops/material/r09');root.mkdir(parents=True,exist_ok=True)
          for name in ['app.js','index.html','ui.css','prepare_frozen.js','build_shaders.py','NOTES.md','ci.py','verify.cjs']:
            url='https://api.github.com/repos/haihao0307/guilin-dem-pipeline/contents/ops/material/r09/'+name+'?ref='+os.environ['GITHUB_SHA']
            req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
            with urllib.request.urlopen(req,timeout=60) as r:data=json.load(r)
            (root/name).write_bytes(base64.b64decode(data['content']))
          PY
      - name: Build from hash-locked originals and stage without replacing the current root
        run: python3 ops/material/r09/ci.py build
      - name: Install isolated browser test tools
        run: |
          npm init -y
          npm install --save-dev playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify actual public stage, original appearance and interactions
        run: node ops/material/r09/verify.cjs stage
      - name: Promote only after public stage passed, guarding concurrent root changes
        run: python3 ops/material/r09/ci.py promote
      - name: Verify the final fixed public URL and exact release again
        run: node ops/material/r09/verify.cjs public
      - name: Archive exact source and publication proof
        run: python3 ops/material/r09/ci.py archive
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: material-r09-real-public-evidence
          path: |
            evidence/
            build_material_r09/manifest.json
            build_material_r09/R09_STANDALONE.html
          retention-days: 30
