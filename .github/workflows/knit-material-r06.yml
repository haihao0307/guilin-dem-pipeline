name: Knit material R06 direct solver
on:
  push:
    branches: [feature/knit-material-r06-direct-solver-20261111]
    paths:
      - .github/workflows/knit-material-r06.yml
      - kaopu-fabric-workbench/knit-material-r06-source.part*
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: knit-material-r06
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            kaopu-fabric-workbench/knit-material-r04
            kaopu-fabric-workbench/knit-material-r06-source.part0
            kaopu-fabric-workbench/knit-material-r06-source.part1
            kaopu-fabric-workbench/knit-material-r06-source.part2
            kaopu-fabric-workbench/knit-material-r06-source.part3
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Create isolated R06 candidate from accepted R04 source
        run: |
          ROOT="$GITHUB_WORKSPACE/kaopu-fabric-workbench"
          mkdir -p "$ROOT/knit-material-r06"
          cp -a "$ROOT/knit-material-r04/." "$ROOT/knit-material-r06/"
          cat "$ROOT"/knit-material-r06-source.part0 "$ROOT"/knit-material-r06-source.part1 "$ROOT"/knit-material-r06-source.part2 "$ROOT"/knit-material-r06-source.part3 | tar -xz -C "$ROOT/knit-material-r06"
          cd "$ROOT/knit-material-r06"
          python patch_r06.py
          node --check app.js
      - name: Install Chromium WebGPU runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers xvfb xauth
          mkdir -p /tmp/knit-r06
          cd /tmp/knit-r06
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium
      - name: Run actual browser A/B and pixel checks
        run: |
          ROOT="$GITHUB_WORKSPACE/kaopu-fabric-workbench/knit-material-r06"
          python -m http.server 8925 --bind 127.0.0.1 >/tmp/knit-r06-http.log 2>&1 &
          cp "$ROOT/qa.mjs" /tmp/knit-r06/qa.mjs
          SITE_DIR="$ROOT" xvfb-run -a node /tmp/knit-r06/qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: knit-material-r06
          path: kaopu-fabric-workbench/knit-material-r06
          retention-days: 7
      - name: Preserve isolated R06 source and evidence
        if: always()
        run: |
          git sparse-checkout add kaopu-fabric-workbench/knit-material-r06
          git config user.name 'Knit runtime verifier'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A kaopu-fabric-workbench/knit-material-r06
          if ! git diff --cached --quiet; then
            git commit -m 'Save R06 direct solver source and browser evidence [skip ci]'
            git push origin HEAD:feature/knit-material-r06-direct-solver-20261111
          fi
