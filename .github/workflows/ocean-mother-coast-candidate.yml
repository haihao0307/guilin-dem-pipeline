name: Ocean Mother Coast candidate
on:
  push:
    branches: [work/ocean-mother-handoff-20260901]
    paths:
      - .github/workflows/ocean-mother-coast-candidate.yml
      - ocean-mother/coast-v010/**
      - ocean-mother/coast-tools/**
permissions:
  contents: read
concurrency:
  group: ocean-coast-candidate
  cancel-in-progress: true
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Stage committed Coast source and byte-identical old deep workbench
        run: |
          python3 - <<'PY'
          import os,json,hashlib,pathlib,urllib.request,concurrent.futures
          repo='haihao0307/guilin-dem-pipeline';head=os.environ['GITHUB_SHA'];assert os.environ['GITHUB_REPOSITORY']==repo
          def get(ref,path):
              with urllib.request.urlopen('https://raw.githubusercontent.com/'+repo+'/'+ref+'/'+path,timeout=60) as r:
                  assert r.status==200;return r.read()
          names=['ocean-mother/coast-v010/'+n for n in ['coast-core.mjs','coast-app.mjs','shaders.mjs','index.html','coast.css','policy.json','README.md','BUILD_TEMPLATE.json']]+['ocean-mother/coast-tools/core.test.mjs','ocean-mother/coast-tools/browser_qa.py']
          identities={}
          def store(path,ref):
              b=get(ref,path);p=pathlib.Path('stage')/path;p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(b);return b
          for n in names:
              b=store(n,head);identities[n]={'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()}
          assert identities['ocean-mother/coast-v010/policy.json']['sha256']=='fe69ea88c05d9b8c74e79e21c2c2c719dc096b677848eb40305575f08b5b8fdf'
          root=pathlib.Path('stage/ocean-mother/coast-v010');build=json.loads((root/'BUILD_TEMPLATE.json').read_text());build.update(sourceCommit=head,workflowRunId=int(os.environ['GITHUB_RUN_ID']));(root/'build.json').write_text(json.dumps(build,indent=2))
          pathlib.Path('evidence').mkdir(exist_ok=True)
          pathlib.Path('evidence/SOURCE.json').write_text(json.dumps({'sourceCommit':head,'files':identities,'visualApproved':False,'productionApproved':False},indent=2))
          ref='970aa25814e5d5f98cf10091da69666f62dbcd28';raw=store('ocean-mother/v001/MANIFEST.json',ref);m=json.loads(raw)
          def one(item):
              n,v=item;b=store('ocean-mother/v001/'+n,ref);assert len(b)==v['bytes'] and hashlib.sha256(b).hexdigest()==v['sha256'],n
          list(concurrent.futures.ThreadPoolExecutor(max_workers=6).map(one,m['files'].items()))
          assert len(m['files'])==21
          pathlib.Path('evidence/DEEP_LOCK.json').write_text(json.dumps({'ref':ref,'filesVerified':21,'runtimeModified':False,'manifestSha256':hashlib.sha256(raw).hexdigest()},indent=2))
          PY
      - name: Numerical and source syntax tests
        run: |
          set -o pipefail
          node --check stage/ocean-mother/coast-v010/coast-app.mjs
          node --check stage/ocean-mother/coast-v010/coast-core.mjs
          node --check stage/ocean-mother/coast-v010/shaders.mjs
          node --test stage/ocean-mother/coast-tools/core.test.mjs | tee evidence/CORE_TESTS.tap
      - name: Install browser test environment
        run: |
          python3 -m pip install playwright pillow
          python3 -m playwright install --with-deps chromium
      - name: Real candidate browser and three presentation modes
        run: |
          set -o pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 --directory stage >/tmp/coast-http.log 2>&1 &
          python3 stage/ocean-mother/coast-tools/browser_qa.py http://127.0.0.1:8765/ocean-mother/coast-v010/ browser-evidence | tee evidence/BROWSER_TESTS.txt
      - name: Copy machine QA and build metadata
        if: always()
        run: |
          mkdir -p evidence
          if [ -f browser-evidence/QA.json ]; then cp browser-evidence/QA.json evidence/QA.json; fi
          if [ -f stage/ocean-mother/coast-v010/build.json ]; then cp stage/ocean-mother/coast-v010/build.json evidence/build.json; fi
          echo "Source: $GITHUB_SHA. Candidate checks only; public publication and user acceptance remain separate." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ocean-coast-candidate-evidence
          path: evidence/
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ocean-coast-internal-inspection
          path: browser-evidence/*.png
          retention-days: 1
          if-no-files-found: ignore
