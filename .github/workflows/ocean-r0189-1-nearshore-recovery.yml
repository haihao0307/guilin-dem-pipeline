name: Ocean R018.9.1 bounded nearshore recovery

on:
  push:
    branches: [work/ocean-r0189-recovery-20260913]
    paths:
      - .github/workflows/ocean-r0189-1-nearshore-recovery.yml
      - ocean-mother/recovery/r0189-exact/Ocean_Mother_R018.9_Direct_Open.html
      - ocean-mother/recovery/r0189-1/build_r0189_1_nearshore.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ocean-r0189-1-nearshore-recovery
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Build bounded candidate from exact R018.9
        run: |
          set -euo pipefail
          python ocean-mother/recovery/r0189-1/build_r0189_1_nearshore.py | tee /tmp/r0189_1_build.txt

      - name: Static contract and JavaScript syntax gate
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json,re,subprocess,tempfile
          p=Path('ocean-mother/recovery/r0189-1/Ocean_Mother_R018.9.1_Nearshore_Candidate.html')
          report=json.loads(Path('ocean-mother/recovery/r0189-1/R0189_1_BUILD_REPORT.json').read_text())
          assert report['baseline']=='R018.9'
          assert report['protectedHashesUnchanged'] is True
          assert report['deepOceanByteIdentityInsideCandidate'] is True
          assert report['visualApproved'] is False
          s=p.read_text()
          assert 'ISLAND GOLD COAST / R018.9.1' in s
          assert 'r0189.1-nearshore-conservative-v001-deep-frozen' in s
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          for i,code in enumerate(scripts):
              q=Path('/tmp')/f'ocean-r0189-1-{i}.js'
              q.write_text(code)
              subprocess.run(['node','--check',str(q)],check=True)
          print('static gate passed; scripts',len(scripts))
          PY

      - name: Commit materialized candidate and evidence
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add ocean-mother/recovery/r0189-1/Ocean_Mother_R018.9.1_Nearshore_Candidate.html ocean-mother/recovery/r0189-1/R0189_1_BUILD_REPORT.json
          if ! git diff --cached --quiet; then
            git commit -m 'ocean: materialize R018.9.1 nearshore-only candidate'
            git push origin HEAD:work/ocean-r0189-recovery-20260913
          fi
