name: Published geography Manta09 same-workbench browser QA
on:
  push:
    branches: [qa/geography-manta-original09-20261006]
    paths:
      - 'kaopu-geography-workbench/**'
      - '.github/workflows/geography-manta-original09-qa.yml'
permissions:
  contents: read
jobs:
  original-main-app:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: kaopu-geography-workbench
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install official pinned browser tooling
        run: |
          python -m pip install playwright==1.57.0 pillow
          python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Click original homepage09 and verify real original pixels and controls
        env:
          KAOPU_PUBLIC_URL: https://haihao0307.github.io/guilin-dem-pipeline/kaopu-geography-workbench/
          KAOPU_BROWSER: ${{ matrix.browser }}
        run: |
          python - <<'PY'
          import hashlib, os, time, urllib.request
          from pathlib import Path
          names = ['index.html', 'runtime.js', 'manta-original09.js', 'qa_public.py', 'qa_catalog.py', 'README.md']
          deadline = time.time() + 600
          while True:
              try:
                  for name in names:
                      expected = Path('kaopu-geography-workbench', name).read_bytes()
                      with urllib.request.urlopen(os.environ['KAOPU_PUBLIC_URL'] + name + '?manta09=d1d00fec', timeout=30) as r:
                          actual = r.read()
                      assert hashlib.sha256(actual).digest() == hashlib.sha256(expected).digest(), name
                  print('PUBLIC_EXACT_SIX_FILES', names, flush=True)
                  break
              except Exception as exc:
                  if time.time() >= deadline:
                      raise
                  print('Waiting for exact public candidate:', str(exc), flush=True)
                  time.sleep(15)
          PY
          python kaopu-geography-workbench/qa_manta09_main.py
          if [ "$KAOPU_BROWSER" = "chromium" ]; then
            python kaopu-geography-workbench/qa_catalog.py
            python kaopu-geography-workbench/qa_public.py
          fi
      - name: Preserve actual browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geography-original-manta09-${{ matrix.browser }}-${{ github.sha }}
          path: |
            manta09-browser-qa/
            geography-qa/
          retention-days: 7
          if-no-files-found: warn
