name: Skin Windows software pixel-budget diagnosis
on:
  push:
    branches: [fix/skin-dna-r02-1-blackframe-20261013]
    paths: [.github/workflows/skin-r021-warp-budget.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/probe" playwright@1.56.1
          echo "NODE_PATH=$RUNNER_TEMP/probe/node_modules" >> "$GITHUB_ENV"
          node "$RUNNER_TEMP/probe/node_modules/playwright/cli.js" install chromium
      - shell: bash
        run: |
          mkdir evidence
          cat > probe.cjs <<'NODE'
          const fs=require('fs'),{chromium}=require('playwright');(async()=>{for(const dpr of [.25,.5]){const r={dpr,errors:[],console:[]},b=await chromium.launch({headless:true,args:['--use-angle=d3d11-warp','--enable-unsafe-swiftshader']}),p=await b.newPage({viewport:{width:1190,height:1190},deviceScaleFactor:dpr});p.on('pageerror',e=>r.errors.push(String(e)));p.on('console',m=>{if(['error','warning'].includes(m.type()))r.console.push(m.text());});try{await p.goto('https://htmlpreview.github.io/?https://raw.githubusercontent.com/haihao0307/guilin-dem-pipeline/25ff59621736fd73513ca25de099a3a00d2bc270/kaopu-unified-human-workbench/skin-dna-r02-1/preview.html',{waitUntil:'domcontentloaded',timeout:120000});await p.waitForFunction(()=>window.__SKIN_REVIEW__?.ready||window.__SKIN_REVIEW__?.errors?.length,null,{timeout:180000});await p.waitForTimeout(1000);r.state=await p.evaluate(()=>({opening:skinDNA.opening(),lost:__IDENTITY_QA__.viewer().renderer.getContext().isContextLost(),canvas:[__IDENTITY_QA__.viewer().renderer.domElement.width,__IDENTITY_QA__.viewer().renderer.domElement.height]}));await p.screenshot({path:'evidence/dpr-'+dpr+'.png',timeout:120000});}catch(e){r.failure=String(e);}finally{fs.writeFileSync('evidence/dpr-'+dpr+'.json',JSON.stringify(r,null,2));await b.close();}}})();
          NODE
          node probe.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skin-r021-warp-budget
          path: evidence
          retention-days: 14
