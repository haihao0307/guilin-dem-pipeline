name: Interactive native train R02 QA
on:
  push:
    branches: ['qa/a4-mark3-rule-conversion-r01-20261017']
    paths:
      - '.github/workflows/train-native-interactive-r02.yml'
      - 'kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01/a4-mark3-rule-conversion-r01/student-native-r02/**'
permissions:
  contents: read
jobs:
  interactive:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01/a4-mark3-rule-conversion-r01
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01/a4-mark3-rule-conversion-r01
            kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01/a4-a6-source-comparison-r03/vendor
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned browser
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Native geometry regression and interaction syntax
        run: |
          for f in student-native-r01/tests/*.mjs; do node "$f"; done
          node student-native-r02/interaction.test.mjs
          node --check student-native-r02/view.mjs
          node --check student-native-r02/browser.cjs
      - name: Actual desktop and mobile interaction
        env:
          NATIVE_URL: https://haihao0307.github.io/guilin-dem-pipeline/kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01/a4-mark3-rule-conversion-r01/student-native-r02/index.html
        run: |
          for attempt in $(seq 1 120); do
            if curl -fsS "$NATIVE_URL" -o /tmp/train-r02-public.html; then break; fi
            sleep 10
          done
          test -s /tmp/train-r02-public.html
          node student-native-r02/browser.cjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: train-interactive-r02-${{ github.sha }}-${{ github.run_attempt }}
          path: kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01/a4-mark3-rule-conversion-r01/student-native-r02/qa/
          retention-days: 14
          if-no-files-found: error
