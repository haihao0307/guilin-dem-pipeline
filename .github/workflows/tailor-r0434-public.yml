name: Tailor R0434 actual public acceptance
on:
  push:
    branches: [fix/tailor-display-r0434-20261011]
    paths: [.github/workflows/tailor-r0434-public.yml]
permissions:
  contents: write
concurrency:
  group: tailor-r0434-public
  cancel-in-progress: false
jobs:
  public-delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: kaopu-tailor-workbench/presets/r04
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare browser and unchanged-data regression
        run: |
          mkdir -p public-evidence
          P=kaopu-tailor-workbench/presets/r04
          node "$P/test_resources_r0434.mjs" | tee public-evidence/unit.log
          node "$P/test_display_r0433.mjs" | tee -a public-evidence/unit.log
          python -m py_compile "$P/release_r0434.py" "$P/qa_r0434.py" "$P/qa_safety_r0434.py"
          pip install playwright==1.57.0 pillow
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Render every garment and outfit and rebuild exact current previews
        env:
          R0434_GENERATE: '1'
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/tailor-public-http.log 2>&1 &
          python kaopu-tailor-workbench/presets/r04/qa_r0434.py 2>&1 | tee public-evidence/local-browser.log
          python kaopu-tailor-workbench/presets/r04/qa_safety_r0434.py 2>&1 | tee public-evidence/local-safety.log
      - name: Commit tested current previews and reports with branch lease
        run: |
          P=kaopu-tailor-workbench/presets/r04
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin "$GITHUB_REF_NAME" --depth=1
          test "$(git rev-parse origin/$GITHUB_REF_NAME)" = "$GITHUB_SHA"
          git add -- "$P/assets/results" "$P/assets/outfits" "$P/R0434_BROWSER_REPORT.json" "$P/R0434_SAFETY_REPORT.json" "$P/qa-r0434" "$P/qa-r0434-safety"
          git commit -m 'test(tailor-r0434): verify 60 native styles, 432 outfits and explicit failure recovery; refresh every current preview'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
      - name: Publish independent snapshot without replacing old pages
        run: python kaopu-tailor-workbench/presets/r04/release_r0434.py publish 2>&1 | tee public-evidence/publish.log
      - name: Verify actual HTTPS bytes and 492 active 3D images
        run: python kaopu-tailor-workbench/presets/r04/release_r0434.py verify 2>&1 | tee public-evidence/public-bytes.log
      - name: Actual public all-category, fault-recovery and native sewing acceptance
        run: |
          P=kaopu-tailor-workbench/presets/r04
          export R0434_BASE=$(python -c "import json;print(json.load(open('$P/R0434_RELEASE_STATE.json'))['fixedURL'].split('?')[0])")
          export GITHUB_SHA=$(git rev-parse HEAD)
          python "$P/qa_r0434.py" 2>&1 | tee public-evidence/public-browser.log
          python "$P/qa_safety_r0434.py" 2>&1 | tee public-evidence/public-safety.log
          python "$P/qa_fresh_r0434.py" 2>&1 | tee public-evidence/public-fresh.log
          python "$P/release_r0434.py" finish 2>&1 | tee public-evidence/finish.log
      - name: Preserve exact runtime and all acceptance evidence
        if: always()
        run: |
          P=kaopu-tailor-workbench/presets/r04
          git rev-parse HEAD > public-evidence/COMMIT.txt
          cp "$P/"R0434*.json "$P/"*r0434.py "$P/"*.mjs "$P/index.html" "$P/style.css" public-evidence/
          cp -r "$P/person-core" public-evidence/
          cp -r "$P/qa-r0434" "$P/qa-r0434-safety" public-evidence/ 2>/dev/null || true
          cp -r "$P/qa-r0434-public" "$P/qa-r0434-safety-public" "$P/qa-r0434-fresh-public" public-evidence/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tailor-r0434-actual-public-evidence
          path: public-evidence/
          retention-days: 14
