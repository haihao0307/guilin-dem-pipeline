name: Verify infinite knit surface R02
on:
  push:
    branches: [gh-pages]
    paths:
      - kaopu-knit-lab/surface-r02.html
      - kaopu-knit-lab/r02/**
      - .github/workflows/knit-surface-r02-check.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-surface:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install isolated browser verifier
        run: |
          npm install --prefix .knit-r02-qa --no-save --ignore-scripts --no-audit --no-fund playwright@1.55.0
          ./.knit-r02-qa/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify actual public rendering and interactions
        env:
          NODE_PATH: ${{ github.workspace }}/.knit-r02-qa/node_modules
        run: |
          mkdir -p knit-r02-evidence
          node <<'NODE'
          const {chromium}=require('playwright');
          const fs=require('node:fs');
          const assert=require('node:assert/strict');
          const {createHash}=require('node:crypto');
          const sha=b=>createHash('sha256').update(b).digest('hex');
          const base='https://haihao0307.github.io/guilin-dem-pipeline/kaopu-knit-lab/';
          const url=base+'surface-r02.html';
          const raw='https://raw.githubusercontent.com/haihao0307/guilin-dem-pipeline/'+process.env.GITHUB_SHA+'/kaopu-knit-lab/';
          const proof={version:'KAOPU-KNIT-SURFACE-R02.1-20261111',commit:process.env.GITHUB_SHA,url,referenceMatched:false,realMobileDeviceTested:false,hardwarePerformanceVerified:false,physicsVerified:false,checks:[],resources:[]};
          (async()=>{
            for(const path of ['surface-r02.html','r02/runtime.js']){
              const sr=await fetch(raw+path);assert.equal(sr.status,200);const expected=sha(Buffer.from(await sr.arrayBuffer()));let found=false;
              for(let i=0;i<55;i++){const r=await fetch(base+path+'?verify='+process.env.GITHUB_SHA+'&n='+i,{cache:'no-store'});const b=Buffer.from(await r.arrayBuffer());if(r.status===200&&sha(b)===expected){proof.resources.push({path,status:r.status,bytes:b.length,sha256:expected});found=true;break;}await new Promise(r=>setTimeout(r,5000));}
              assert(found,'Public bytes not current: '+path);
            }
            console.log('PUBLIC_RESOURCES_OK',JSON.stringify(proof.resources));
            const browser=await chromium.launch({headless:true,args:['--no-sandbox','--use-angle=swiftshader','--enable-unsafe-swiftshader','--disable-dev-shm-usage']});
            try{
              for(const [name,viewport] of [['desktop',{width:820,height:680}],['mobile-viewport',{width:390,height:844}]]){
                const ctx=await browser.newContext({viewport,deviceScaleFactor:1,hasTouch:name!=='desktop'});
                const page=await ctx.newPage();page.setDefaultTimeout(180000);const errors=[],failed=[];
                page.on('pageerror',e=>errors.push(String(e)));page.on('requestfailed',r=>failed.push(r.url()));page.on('console',m=>{if(m.type()==='error')errors.push(m.text());});
                const res=await page.goto(url,{waitUntil:'domcontentloaded',timeout:90000});assert.equal(res.status(),200);
                const done=async n=>{await page.waitForFunction(n=>window.KNIT_SURFACE?.error||window.KNIT_SURFACE?.completedFrames>=n,n,{timeout:240000});const e=await page.evaluate(()=>KNIT_SURFACE.error);assert.equal(e,null);};
                await done(1);
                const snap=()=>page.evaluate(()=>({version:KNIT_SURFACE.version,ready:KNIT_SURFACE.ready,error:KNIT_SURFACE.error,frames:KNIT_SURFACE.completedFrames,gl:KNIT_SURFACE.lastGLError,state:JSON.parse(JSON.stringify(KNIT_SURFACE.state)),stats:KNIT_SURFACE.stats,lastFrameWallMs:KNIT_SURFACE.lastFrameWallMs}));
                const initial=await snap();assert.equal(initial.version,proof.version);assert(initial.ready);assert.equal(initial.gl,0);
                const canvasHash=async()=>sha(Buffer.from((await page.evaluate(()=>document.querySelector('#stage').toDataURL('image/png'))).split(',')[1],'base64'));
                const firstHash=await canvasHash();
                await page.screenshot({path:'knit-r02-evidence/'+name+'-surface.png'});
                await page.getByRole('button',{name:'控制',exact:true}).click();assert(await page.locator('#panel').isVisible());
                await page.locator('#quality').focus();await page.locator('#quality').press('Home');let n=(await snap()).frames;await done(n+1);assert.equal((await snap()).state.quality,1);
                await page.getByRole('button',{name:'关闭控制',exact:true}).click();
                n=(await snap()).frames;await page.getByRole('button',{name:'微距',exact:true}).click();await done(n+1);assert.equal((await snap()).state.distance,3.2);const macroHash=await canvasHash();assert.notEqual(firstHash,macroHash);
                await page.screenshot({path:'knit-r02-evidence/'+name+'-macro.png'});
                if(name==='desktop'){
                  const before=await snap();await page.mouse.move(300,250);await page.mouse.down();await page.mouse.move(355,275,{steps:5});await page.mouse.up();await done(before.frames+1);assert.notEqual((await snap()).state.yaw,before.state.yaw);assert.notEqual(await canvasHash(),macroHash);
                  const panBefore=await snap();await page.keyboard.press('ArrowRight');await done(panBefore.frames+1);assert((await snap()).state.pan[0]>panBefore.state.pan[0]);
                  await page.getByRole('button',{name:'连续移动',exact:true}).click();const moving=await snap();await done(moving.frames+2);await page.getByRole('button',{name:'暂停移动',exact:true}).click();assert((await snap()).state.pan[1]>moving.state.pan[1]);
                  await page.getByRole('button',{name:'追光',exact:true}).click();const lit=await snap();await done(lit.frames+2);await page.getByRole('button',{name:'追光',exact:true}).click();assert.notEqual((await snap()).state.lightAz,lit.state.lightAz);
                  await page.getByRole('button',{name:'控制',exact:true}).click();const preFuzz=await snap();await page.locator('#fuzz').focus();await page.locator('#fuzz').press('Home');await done(preFuzz.frames+1);assert.equal((await snap()).state.fuzz,0);const bareHash=await canvasHash();
                  const preShadow=await snap();await page.locator('#shadow').uncheck();await done(preShadow.frames+1);assert.equal((await snap()).state.shadow,0);assert.notEqual(await canvasHash(),bareHash);
                  const preColour=await snap();await page.getByRole('button',{name:'鼠尾草',exact:true}).click();await done(preColour.frames+1);assert.equal((await snap()).state.color,2);
                  await page.getByRole('button',{name:'关闭控制',exact:true}).click();await page.getByRole('button',{name:'自然变化',exact:true}).click();assert.equal((await snap()).state.natural,0);
                  proof.checks.push({desktopDrag:true,keyboardPan:true,continuousSurfaceMotion:true,independentMovingLight:true,fuzzOff:true,shadowOffChangesPixels:true,colourSwitch:true,periodicMode:true});
                }
                assert.equal(await page.evaluate(()=>document.documentElement.scrollWidth),viewport.width);
                const final=await snap();assert.equal(final.error,null);assert.equal(final.gl,0);assert.equal(errors.length,0);assert.equal(failed.length,0);
                const pixels=await page.evaluate(()=>{const c=document.querySelector('#stage'),g=c.getContext('webgl2'),b=new Uint8Array(4),s=new Set();let lo=255,hi=0;for(let y=1;y<10;y++)for(let x=1;x<10;x++){g.readPixels(Math.floor(c.width*x/10),Math.floor(c.height*y/10),1,1,g.RGBA,g.UNSIGNED_BYTE,b);s.add([...b].join(','));for(let i=0;i<3;i++){lo=Math.min(lo,b[i]);hi=Math.max(hi,b[i]);}}return {colours:s.size,range:hi-lo,gl:g.getError()};});assert(pixels.colours>12);assert(pixels.range>25);assert.equal(pixels.gl,0);
                const result={name,viewport,initial,final,pixels,errors,failed};proof.checks.push(result);console.log('PUBLIC_BROWSER_OK',JSON.stringify(result));await ctx.close();
              }
              proof.publicHttpsPassed=true;proof.browserPassed=true;proof.shareAllowed=true;proof.verifiedAt=new Date().toISOString();
            }finally{await browser.close();}
            fs.writeFileSync('knit-r02-evidence/PUBLICATION_PROOF.json',JSON.stringify(proof,null,2));console.log('PUBLICATION_PROOF_JSON='+JSON.stringify(proof));
          })().catch(e=>{proof.error=String(e);proof.shareAllowed=false;fs.writeFileSync('knit-r02-evidence/PUBLICATION_PROOF.json',JSON.stringify(proof,null,2));console.error(e);process.exitCode=1;});
          NODE
      - name: Retain small verification evidence for one day
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: knit-surface-r02-verification-${{ github.sha }}
          path: knit-r02-evidence/
          retention-days: 1
          compression-level: 6
          if-no-files-found: ignore
