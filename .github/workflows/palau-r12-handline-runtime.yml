name: Palau R12 causal handline runtime

on:
  push:
    branches:
      - work/survivor-palau-r12-pilot-story-integration-20260921
    paths:
      - .github/workflows/palau-r12-handline-runtime.yml

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
          persist-credentials: true

      - name: Materialize bounded R12 source payload
        run: |
          set -euo pipefail
          base64 -d .r12-staging/payload.tar.xz.b64 > /tmp/r12-payload.tar.xz
          echo '2c2c79c8fa2ce271add71ef43b2cf63d350077ac2f0a44363814807a8e035a29  /tmp/r12-payload.tar.xz' | sha256sum -c -
          tar -xJf /tmp/r12-payload.tar.xz -C .
          root=games/survivor-palau/source/pilot_r12/upstream/v0230
          test "$(git hash-object "$root/fishing_core.cjs")" = 'b90b7bad470f062448621e2bd789d1e5d4b38c44'
          test "$(git hash-object "$root/fishing_core.test.cjs")" = '6623539d78e13c4e9edda98ce8f12d0e48c3e8dd'
          test "$(git hash-object "$root/handline_r01/handline_controller.cjs")" = 'd39866df1a1ebd1f9997bde171945d2053d0398f'
          test "$(git hash-object "$root/handline_r01/handline_controller.test.cjs")" = '8def0b95eb200f4cf269457b29107167cff68a4c'

      - name: Run exact upstream and R12 tests
        run: |
          set -euo pipefail
          root=games/survivor-palau/source/pilot_r12
          node --check "$root/pilot_handline_runtime.cjs"
          node --check "$root/palau_world_fishing_adapter.cjs"
          node "$root/upstream/v0230/fishing_core.test.cjs" | tee /tmp/fishing-core.log
          node "$root/upstream/v0230/handline_r01/handline_controller.test.cjs" | tee /tmp/handline-controller.json
          node "$root/pilot_handline_runtime.test.cjs" | tee /tmp/pilot-runtime.json
          node "$root/palau_world_fishing_adapter.test.cjs" | tee /tmp/world-adapter.json
          python3 games/survivor-palau/story/pilot-survival-r2-20260921/validate_story_contract.py
          python3 -m json.tool contracts/survivor-palau/pilot_handline_port_r12.json >/dev/null

      - name: Write execution receipt and preserve acceptance boundaries
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          repo = Path.cwd()
          source = repo / 'games/survivor-palau/source/pilot_r12'
          story_contract_path = repo / 'contracts/survivor-palau/pilot_survival_story_r12.json'
          story_contract = json.loads(story_contract_path.read_text(encoding='utf-8'))
          story_contract['implementation'] = {
              'pilotHandlineRuntime': {
                  'path': 'games/survivor-palau/source/pilot_r12',
                  'version': 'palau-pilot-handline-r12/0.1',
                  'sourceModified': True,
                  'logicTestsPassed': True,
                  'interactive3D': False,
                  'browserPassed': False,
                  'visualAcceptance': False,
                  'productionReady': False,
              }
          }
          story_contract_path.write_text(json.dumps(story_contract, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          controller = json.loads(Path('/tmp/handline-controller.json').read_text(encoding='utf-8'))
          runtime = json.loads(Path('/tmp/pilot-runtime.json').read_text(encoding='utf-8'))
          adapter = json.loads(Path('/tmp/world-adapter.json').read_text(encoding='utf-8'))
          def sha256(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          receipt = {
              'schema': 'kaopu.survivor-palau.pilot-handline-runtime-receipt/1.0',
              'version': 'PILOT_HANDLINE_R12_A1_20260921',
              'branch': 'work/survivor-palau-r12-pilot-story-integration-20260921',
              'canonicalWorld': 'handoff/survivor-palau-stone-money-full-r011-20260921',
              'importsOldWorld': False,
              'upstream': {
                  'fishingCore': {
                      'commit': 'c07eec73616f613acde90881ac642b0972f12391',
                      'gitBlob': 'b90b7bad470f062448621e2bd789d1e5d4b38c44',
                      'exactBlobMaterialized': True,
                  },
                  'handlineController': {
                      'commit': '4f98d6c25f6a19a44795af877e0798371a6233a9',
                      'gitBlob': 'd39866df1a1ebd1f9997bde171945d2053d0398f',
                      'exactBlobMaterialized': True,
                  },
              },
              'newFilesSha256': {
                  'pilot_handline_runtime.cjs': sha256(source / 'pilot_handline_runtime.cjs'),
                  'pilot_handline_runtime.test.cjs': sha256(source / 'pilot_handline_runtime.test.cjs'),
                  'palau_world_fishing_adapter.cjs': sha256(source / 'palau_world_fishing_adapter.cjs'),
                  'palau_world_fishing_adapter.test.cjs': sha256(source / 'palau_world_fishing_adapter.test.cjs'),
              },
              'executed': [
                  {'command': 'node upstream/v0230/fishing_core.test.cjs', 'result': 'PASS'},
                  {'command': 'node upstream/v0230/handline_r01/handline_controller.test.cjs', 'result': 'PASS', 'passed': controller['passed']},
                  {'command': 'node pilot_handline_runtime.test.cjs', 'result': 'PASS', 'passed': runtime['passed']},
                  {'command': 'node palau_world_fishing_adapter.test.cjs', 'result': 'PASS', 'passed': adapter['passed']},
                  {'command': 'python3 story/validate_story_contract.py', 'result': 'PASS'},
              ],
              'causality': {
                  'automaticFishLock': False,
                  'automaticHookset': False,
                  'automaticCatch': False,
                  'automaticFoodReward': False,
                  'finiteGearLoss': True,
                  'sameFishIdentityAcrossHook': True,
              },
              'worldPort': {
                  'conductor': 'PalauWorld.sample()',
                  'missingEvidenceStaysDegraded': True,
                  'fallbackCanPassProduction': False,
              },
              'acceptance': {
                  'sourceModified': True,
                  'interactive3D': False,
                  'staticImageSubstitute': False,
                  'publicHttpsPassed': False,
                  'browserPassed': False,
                  'visualAcceptance': False,
                  'productionReady': False,
              },
          }
          out = repo / 'handoff/survivor-palau-stone-money-full-r011-20260921/PILOT_HANDLINE_R12_RECEIPT.json'
          out.write_text(json.dumps(receipt, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          python3 -m json.tool contracts/survivor-palau/pilot_survival_story_r12.json >/dev/null
          python3 -m json.tool handoff/survivor-palau-stone-money-full-r011-20260921/PILOT_HANDLINE_R12_RECEIPT.json >/dev/null
          git diff --check

      - name: Commit verified runtime and remove one-shot staging
        run: |
          set -euo pipefail
          rm -rf .r12-staging .github/workflows/palau-r12-handline-runtime.yml
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git commit -m 'feat(palau): add causal pilot handline runtime'
          git push origin HEAD:${{ github.ref_name }}
