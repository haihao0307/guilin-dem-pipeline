name: Weather Mother V063 Coherent Optics
on:
  push:
    branches: [gh-pages]
    paths:
      - weather-mother/v063-optics/refine.py
      - weather-mother/v063-optics/qa_ready.py
      - .github/workflows/weather-mother-v063-refined.yml
permissions:
  contents: write
concurrency:
  group: weather-mother-v063-optics
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 1
          sparse-checkout: |
            weather-mother/v062-loop
            weather-mother/v063-optics
            .github/workflows
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild and synchronize light-cache epochs
        run: |
          python weather-mother/v063-optics/build.py
          python weather-mother/v063-optics/refine.py
      - name: Install actual browser tests
        run: |
          python -m pip install playwright pillow
          python -m playwright install --with-deps chromium
      - name: Coherent pixel comparisons and measured equal-quality traversal
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/weather-v063-http.log 2>&1 &
          python weather-mother/v063-optics/qa_ready.py
      - name: Publish only passing isolated runtime
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=Path('weather-mother/v063-optics');q=json.loads((r/'QA.json').read_text());assert q['status']=='AUTOMATIC_QA_PASS'
          m=json.loads((r/'MANIFEST.json').read_text());m['status']='AUTOMATIC_QA_PASS';m['qaChecks']=len(q['checks']);(r/'MANIFEST.json').write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n')
          PY
          git config user.name 'Weather Mother optics QA'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add weather-mother/v063-optics/index.html weather-mother/v063-optics/engine.js weather-mother/v063-optics/cloud.glsl weather-mother/v063-optics/field-worker.js weather-mother/v063-optics/motion.js weather-mother/v063-optics/MANIFEST.json weather-mother/v063-optics/QA.json
          if ! git diff --cached --quiet; then
            git commit -m 'feat(weather-mother): publish coherent iridescent cloud and sixteen-weather candidate'
            git pull --rebase origin gh-pages
            git push origin HEAD:gh-pages
          fi
      - name: Verify all six public runtime hashes
        run: |
          python - <<'PY'
          import hashlib,json,time,urllib.request
          from pathlib import Path
          r=Path('weather-mother/v063-optics');m=json.loads((r/'MANIFEST.json').read_text());base='https://haihao0307.github.io/guilin-dem-pipeline/weather-mother/v063-optics/'
          receipt={}
          for attempt in range(36):
            try:
              for name,f in m['files'].items():
                req=urllib.request.Request(base+name+'?verify='+f['sha256'][:16],headers={'Cache-Control':'no-cache'})
                with urllib.request.urlopen(req,timeout=20) as response:
                  data=response.read();sha=hashlib.sha256(data).hexdigest();assert response.status==200 and sha==f['sha256'],name
                  receipt[name]={'status':200,'bytes':len(data),'sha256':sha,'matches':True}
              break
            except Exception as e:
              print(attempt,str(e),flush=True)
              if attempt==35:raise
              time.sleep(10)
          (r/'PUBLICATION_RECEIPT.json').write_text(json.dumps({'version':'0.6.3-optics','revision':2,'url':base,'files':receipt,'exactPublicBytesVerified':True,'visualAcceptance':False,'aaaQualityApproved':False,'productionReady':False},indent=2)+'\n')
          PY
      - name: Verify live public browser
        env:
          WEATHER_URL: https://haihao0307.github.io/guilin-dem-pipeline/weather-mother/v063-optics/?verify=063-r2
        run: python weather-mother/v063-optics/qa_ready.py
      - name: Record public receipts without changing stable baseline
        run: |
          git add weather-mother/v063-optics/PUBLIC_QA.json weather-mother/v063-optics/PUBLICATION_RECEIPT.json
          if ! git diff --cached --quiet; then
            git commit -m 'test(weather-mother): verify public coherent iridescence and weather cases'
            git pull --rebase origin gh-pages
            git push origin HEAD:gh-pages
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weather-mother-v063-coherent-source-and-qa
          retention-days: 7
          path: |
            weather-mother/v063-optics/index.html
            weather-mother/v063-optics/engine.js
            weather-mother/v063-optics/cloud.glsl
            weather-mother/v063-optics/field-worker.js
            weather-mother/v063-optics/motion.js
            weather-mother/v063-optics/optics.js
            weather-mother/v063-optics/refine.py
            weather-mother/v063-optics/qa.py
            weather-mother/v063-optics/qa_ready.py
            weather-mother/v063-optics/MANIFEST.json
            weather-mother/v063-optics/QA.json
            weather-mother/v063-optics/PUBLIC_QA.json
            weather-mother/v063-optics/PUBLICATION_RECEIPT.json
      - name: Summary
        if: always()
        run: |
          echo '## Weather Mother V063 coherent optics' >> "$GITHUB_STEP_SUMMARY"
          echo 'Existing visual baseline preserved. No stored images. Runtime hashes and real browser tests are separate from user visual approval.' >> "$GITHUB_STEP_SUMMARY"
          if [ -f weather-mother/v063-optics/QA.json ]; then python -c 'import json;d=json.load(open("weather-mother/v063-optics/QA.json"));print(d["status"],len(d["checks"]),"checks")' >> "$GITHUB_STEP_SUMMARY"; fi
