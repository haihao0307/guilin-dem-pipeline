name: Head Look R01 teacher visual audit only
on:
  push:
    branches: [test/head-look-r01-visual-audit-20261013]
    paths: ['.github/workflows/head-look-r01-visual-audit.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: |
          mkdir -p teacher-audit
          cat > teacher-audit/probe.cjs <<'JS'
          const fs=require('fs'),{chromium}=require('playwright');
          (async()=>{const r={reference:'21462e471d53ba8c413a96989016510ca4495a34',softwareWebGLFallback:true,originalDPR:true,assetsCopiedIntoProduct:false,errors:[],screens:[]};let b,p;try{b=await chromium.launch({headless:true,args:['--no-sandbox','--use-angle=swiftshader','--enable-unsafe-swiftshader']});p=await b.newPage({viewport:{width:1000,height:1000},deviceScaleFactor:1});p.on('pageerror',e=>r.errors.push(String(e)));await p.route('https://lo-th.github.io/head/**',async route=>{const path=new URL(route.request().url()).pathname.slice('/head/'.length)||'index.html';const response=await route.fetch({url:'https://raw.githubusercontent.com/lo-th/head/'+r.reference+'/'+path,timeout:120000});if(path==='build/bundle.js'){let s=await response.text();s=s.replace('new rB({antialias:!1,forceWebGL:!1})','new rB({antialias:!1,forceWebGL:!0})');s=s.replace('function uV(){jz.update()','function uV(){window.__teacherAudit={scene:qz,camera:Wz,renderer:$z,actor:Zz,pipeline:eV};jz.update()');await route.fulfill({response,body:s,contentType:'application/javascript'});}else{const contentType=path.endsWith('.html')?'text/html':path.endsWith('.js')?'application/javascript':response.headers()['content-type'];await route.fulfill({response,headers:{...response.headers(),'content-type':contentType}});}});await p.goto('https://lo-th.github.io/head/',{waitUntil:'domcontentloaded',timeout:120000});await p.waitForFunction(()=>window.__teacherAudit?.actor&&document.body.innerText.includes('Material setting'),null,{timeout:300000});await p.addStyleTag({content:'body > :not(canvas){visibility:hidden!important}'});await p.evaluate(()=>{__teacherAudit.renderer.setAnimationLoop(null);});const cdp=await p.context().newCDPSession(p);for(const [name,pos]of [['front',[0,.135,.52]],['oblique',[-.18,.135,.49]],['lips',[0,.075,.30]]]){await p.evaluate(async pos=>{const v=__teacherAudit;v.camera.position.set(...pos);v.camera.lookAt(0,pos[1],0);v.camera.updateMatrixWorld();await v.pipeline.renderAsync();},pos);const image=await cdp.send('Page.captureScreenshot',{format:'png',fromSurface:true,captureBeyondViewport:false});fs.writeFileSync('teacher-audit/'+name+'.png',Buffer.from(image.data,'base64'));r.screens.push(name);}r.complete=true;}catch(e){r.failure=String(e);process.exitCode=1;if(p){const cdp=await p.context().newCDPSession(p);const im=await cdp.send('Page.captureScreenshot',{format:'png',fromSurface:true}).catch(()=>null);if(im)fs.writeFileSync('teacher-audit/failure.png',Buffer.from(im.data,'base64'));r.body=await p.locator('body').innerText().catch(()=>null);}}finally{fs.writeFileSync('teacher-audit/report.json',JSON.stringify(r,null,2));await b?.close();}})();
          JS
          timeout 8m node teacher-audit/probe.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: head-look-teacher-clean-views
          path: teacher-audit/
          retention-days: 3
