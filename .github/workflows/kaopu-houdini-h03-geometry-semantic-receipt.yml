name: KAOPU Houdini H03 Geometry Semantic Receipt Audit

on:
  push:
    branches:
      - coordination/kaopu-learning-flywheel-r1-20260909
    paths:
      - 'docs/mother_coordination/kaopu_learning_flywheel_v1/PROBES/houdini_geometry_semantic_receipt_h03.mjs'
      - '.github/workflows/kaopu-houdini-h03-geometry-semantic-receipt.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate cooked polygon semantic receipt counterexamples
        run: |
          node docs/mother_coordination/kaopu_learning_flywheel_v1/PROBES/houdini_geometry_semantic_receipt_h03.mjs \
            houdini_geometry_semantic_receipt_result_h03.json
      - uses: actions/upload-artifact@v4
        with:
          name: kaopu-houdini-h03-geometry-semantic-receipt
          path: houdini_geometry_semantic_receipt_result_h03.json
          if-no-files-found: error
