name: Tailor R04.3.2 decoded public cabinet
on:
  push:
    branches: [feature/tailor-cabinet-r03-garment-surfaces-20261009]
    paths: ['.github/workflows/tailor-r0432-gallery-decode.yml']
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: kaopu-tailor-workbench/presets/r04
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Browser dependencies
        run: |
          pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Read all actual decoded public images
        run: python kaopu-tailor-workbench/presets/r04/qa_gallery_decode_r0432.py
      - name: Retain real public image evidence only
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin "$GITHUB_REF_NAME" --depth=1
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git add kaopu-tailor-workbench/presets/r04/R0432_DECODED_GALLERY_REPORT.json kaopu-tailor-workbench/presets/r04/qa-r0432-decoded
          git diff --cached --quiet || git commit -m 'test(tailor-r0432): retain decoded nonblank public image audit and settled cabinet screenshots'
          git push origin HEAD:"$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tailor-r0432-decoded-gallery
          path: |
            kaopu-tailor-workbench/presets/r04/R0432_DECODED_GALLERY_REPORT.json
            kaopu-tailor-workbench/presets/r04/qa-r0432-decoded
          retention-days: 14
