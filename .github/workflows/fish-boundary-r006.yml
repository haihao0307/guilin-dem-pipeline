name: Fish Boundary R006
on:
  push:
    branches: [work/fish-yellowfin-boundary-r006-20260923]
    paths:
      - restart/fish-yellowfin-teacher-r2/web-r006/**
      - .github/workflows/fish-boundary-r006.yml
permissions:
  contents: write
concurrency:
  group: fish-yellowfin-boundary-r006
  cancel-in-progress: false
jobs:
  compile-verify-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            apps/ocean-life-mother/fish-mother/yellowfin-source-copy-r001/source-workspace/source
            restart/fish-yellowfin-teacher-r2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compile exact teacher and explain original open endpoints without caps
        run: |
          python -m pip install numpy==2.2.6 Pillow==11.2.1
          python restart/fish-yellowfin-teacher-r2/web-r004/compile_teacher.py --source apps/ocean-life-mother/fish-mother/yellowfin-source-copy-r001/source-workspace/source/tuna_fish_4k.glb --out dist/fish-mother-yellowfin/canonical-r004
          cp dist/fish-mother-yellowfin/canonical-r004/EXTRACTION_QA.json SOURCE_IDENTITY_PROOF.json
          python restart/fish-yellowfin-teacher-r2/web-r005/compile_regions.py --package dist/fish-mother-yellowfin/canonical-r004 --out dist/fish-mother-yellowfin/parts-r005
          python restart/fish-yellowfin-teacher-r2/web-r006/compile_boundary.py --canonical dist/fish-mother-yellowfin/canonical-r004 --parts dist/fish-mother-yellowfin/parts-r005 --out dist/fish-mother-yellowfin/boundary-r006
          python restart/fish-yellowfin-teacher-r2/web-r006/prepare_r006.py
      - name: Bundle unchanged pinned runtime and original texture precision
        run: |
          npm install --no-save three@0.170.0 esbuild@0.24.2 playwright@1.51.1
          node --check restart/fish-yellowfin-teacher-r2/web-r006/main.mjs
          node --check restart/fish-yellowfin-teacher-r2/web-r006/boundary.mjs
          npx esbuild restart/fish-yellowfin-teacher-r2/web-r006/main.mjs --bundle --format=esm --target=es2022 --minify --legal-comments=inline --outfile=restart/fish-yellowfin-teacher-r2/web-r006/bundle.js
          npx playwright install --with-deps chromium
          python restart/fish-yellowfin-teacher-r2/web-r006/build.py
      - name: Real offline browser; all previous checks plus 502 endpoints and 209-time interface checks
        run: node restart/fish-yellowfin-teacher-r2/web-r006/qa.mjs
      - name: Save compact internal inspection image
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          p=Path('dist/fish-mother-yellowfin/evidence/r006-open-endpoint.png')
          if p.exists():
              im=Image.open(p);im.thumbnail((720,470));im.convert('RGB').save(p.with_name('r006-review.jpg'),quality=55)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fish-r006-code-data-and-evidence
          path: |
            dist/fish-mother-yellowfin
            restart/fish-yellowfin-teacher-r2/web-r006
          retention-days: 30
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: public
          sparse-checkout: fish-mother-yellowfin
      - name: Archive R005 and update Fish only after offline verification
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil,json
          p=Path('public/fish-mother-yellowfin');old=p/'index.html';h=old.read_bytes()[:2500]
          assert b'FISH_PARTS_R005' in h or b'FISH_BOUNDARY_R006' in h,'Unexpected concurrent Fish version'
          if b'FISH_PARTS_R005' in h:
              a=p/'r005';a.mkdir(exist_ok=True);shutil.copyfile(old,a/'index.html')
              for n in ['PUBLICATION_PROOF.json','BROWSER_QA.json','PUBLIC_BROWSER_QA.json','BUILD_MANIFEST.json']:
                  if (p/n).exists():shutil.copyfile(p/n,a/n)
          shutil.copytree('dist/fish-mother-yellowfin',p,dirs_exist_ok=True)
          (p/'PUBLICATION_PROOF.json').write_text(json.dumps({'version':'FISH_BOUNDARY_R006','shareAllowed':False,'reason':'Exact public browser verification pending','productionReady':False}))
          PY
          cd public
          git config user.name 'Fish Mother Build'
          git config user.email 'fish-mother@users.noreply.github.com'
          git add fish-mother-yellowfin
          git commit -m 'Fish R006: exact source endpoint explanations; preserve R005 and other Mothers'
          for attempt in 1 2 3; do
            if git push origin HEAD:gh-pages; then exit 0; fi
            git pull --rebase origin gh-pages
          done
          exit 1
      - name: Verify complete current bytes at the fixed public URL
        run: |
          python - <<'PY'
          import pathlib,hashlib,urllib.request,time
          u='https://haihao0307.github.io/guilin-dem-pipeline/fish-mother-yellowfin/'
          expected=hashlib.sha256(pathlib.Path('dist/fish-mother-yellowfin/index.html').read_bytes()).hexdigest()
          for i in range(75):
              try:
                  with urllib.request.urlopen(u,timeout=45) as r:b=r.read();status=r.status
                  if status==200 and hashlib.sha256(b).hexdigest()==expected:
                      print('PUBLIC_CURRENT_HASH_PASS',expected,len(b),flush=True);break
              except Exception as e:print('PUBLIC_WAIT',str(e),flush=True)
              time.sleep(10)
          else:raise SystemExit('Public R006 bytes not verified')
          PY
      - name: Run all old and new checks in the final public browser
        env:
          PUBLIC_URL: https://haihao0307.github.io/guilin-dem-pipeline/fish-mother-yellowfin/
        run: node restart/fish-yellowfin-teacher-r2/web-r006/qa.mjs
      - name: Persist delivery proof without self-approving anatomy
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,os,datetime,shutil
          o=Path('dist/fish-mother-yellowfin');p=Path('public/fish-mother-yellowfin')
          q=json.loads((o/'PUBLIC_BROWSER_QA.json').read_text());b=json.loads((o/'BUILD_MANIFEST.json').read_text())
          assert q['browserPass'] and q['allPoseChecks']['passed'] and len(q['regionChecks'])==17 and len(q['interfaceChecks'])==14
          proof={'version':'FISH_BOUNDARY_R006','url':'https://haihao0307.github.io/guilin-dem-pipeline/fish-mother-yellowfin/','sourceBuildSha':os.environ['GITHUB_SHA'],'verificationRunId':os.environ['GITHUB_RUN_ID'],'verifiedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),'httpStatus':200,'htmlSha256':b['sha256'],'htmlBytes':b['bytes'],'publicFullFileHashMatchesBuild':True,'fileProtocolBrowserPass':True,'publicBrowserPass':True,'desktopPass':True,'mobileViewportPass':True,'physicalMobileDeviceTested':False,'canonical':q['canonical'],'allPoseChecks':q['allPoseChecks'],'silhouettes':q['silhouettes'],'regionChecks':q['regionChecks'],'boundary':q['boundary'],'boundaryAudit':q['boundaryAudit'],'interfaceChecks':q['interfaceChecks'],'stationChecks':q['stationChecks'],'consoleAndPageErrors':q['errors'],'sharedOriginalTexturePool':True,'anatomicalPartitionApproved':False,'stageAComplete':False,'independentGenerator':False,'productionReady':False,'manualVisualAcceptance':False,'shareAllowed':True}
          for f in [o/'PUBLICATION_PROOF.json',p/'PUBLICATION_PROOF.json']:f.write_text(json.dumps(proof,indent=2))
          shutil.copyfile(o/'PUBLIC_BROWSER_QA.json',p/'PUBLIC_BROWSER_QA.json');print('R006_PUBLIC_VERIFIED',json.dumps(proof),flush=True)
          PY
          cd public
          git add fish-mother-yellowfin/PUBLICATION_PROOF.json fish-mother-yellowfin/PUBLIC_BROWSER_QA.json
          git commit -m 'Fish R006 exact public browser and source-boundary verification receipt'
          git pull --rebase origin gh-pages
          git push origin HEAD:gh-pages
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fish-r006-public-proof
          path: |
            dist/fish-mother-yellowfin/PUBLIC_BROWSER_QA.json
            dist/fish-mother-yellowfin/PUBLICATION_PROOF.json
