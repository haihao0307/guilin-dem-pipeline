name: QA Haiyu independent bird and fish skeletons
on:
  push:
    branches: [qa/haiyu-pointfields-20261007, gh-pages]
    paths:
      - kaopu-haiyu-workbench/index.html
      - kaopu-haiyu-workbench/studies/bird-fish-skeleton-r01/**
      - .github/workflows/kaopu-haiyu-skeleton-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  skeleton:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: kaopu-haiyu-workbench
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned official Chromium and readable Chinese fonts
        run: |
          npm install --prefix .haiyu-qa --no-save --ignore-scripts --no-audit --no-fund playwright@1.55.0
          ./.haiyu-qa/node_modules/.bin/playwright install chromium
          sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Check geometry and same-world three-view framing in actual Chromium
        env:
          NODE_PATH: ${{ github.workspace }}/.haiyu-qa/node_modules
          HAIYU_CREATURE_OUT: ${{ github.workspace }}/haiyu-skeleton-evidence/standalone
        run: |
          node kaopu-haiyu-workbench/studies/bird-fish-skeleton-r01/tests/geometry.mjs
          node kaopu-haiyu-workbench/studies/bird-fish-skeleton-r01/tests/browser.cjs
      - name: Check root entries, interrupted switching, mobile, C01 and source08/09 exact return
        env:
          NODE_PATH: ${{ github.workspace }}/.haiyu-qa/node_modules
          HAIYU_CREATURE_INTEGRATION_OUT: ${{ github.workspace }}/haiyu-skeleton-evidence/integration
        run: node kaopu-haiyu-workbench/studies/bird-fish-skeleton-r01/tests/integration.cjs
      - name: Recheck preserved C01 interactions and exports
        env:
          NODE_PATH: ${{ github.workspace }}/.haiyu-qa/node_modules
          HAIYU_HTML: ${{ github.workspace }}/kaopu-haiyu-workbench/index.html
          HAIYU_STRUCTURE_OUT: ${{ github.workspace }}/haiyu-skeleton-evidence/c01
        run: node kaopu-haiyu-workbench/studies/axis-ribs-wrap-r02/tests/integration.cjs
      - name: Check accepted C01 geometry and wrapping
        run: |
          node kaopu-haiyu-workbench/studies/axis-ribs-r01/tests/geometry.mjs
          node kaopu-haiyu-workbench/studies/axis-ribs-wrap-r02/tests/geometry.mjs
      - name: Verify the exact deployed root in the public Chromium browser
        if: github.ref == 'refs/heads/gh-pages'
        env:
          NODE_PATH: ${{ github.workspace }}/.haiyu-qa/node_modules
          HAIYU_CREATURE_URL: https://haihao0307.github.io/guilin-dem-pipeline/kaopu-haiyu-workbench/
          HAIYU_CREATURE_INTEGRATION_OUT: ${{ github.workspace }}/haiyu-skeleton-evidence/public
        run: node kaopu-haiyu-workbench/studies/bird-fish-skeleton-r01/tests/integration.cjs
      - name: Preserve all rendering and interaction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: haiyu-skeletons-${{ github.sha }}
          path: haiyu-skeleton-evidence/
          if-no-files-found: error
