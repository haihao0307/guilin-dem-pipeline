name: Face workbench R01 read-only QA
on:
  workflow_dispatch:
  pull_request:
    branches: [gh-pages]
    paths:
      - 'kaopu-face-workbench/**'
      - '.github/workflows/face-workbench-r01-qa.yml'
permissions:
  contents: read
concurrency:
  group: face-r01-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  face-browser:
    if: github.event_name != 'pull_request' || github.head_ref == 'qa/face-workbench-r01-20261005'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            kaopu-face-workbench
          sparse-checkout-cone-mode: true
      - name: Install fixed official browser test dependency
        run: |
          npm install --prefix "$RUNNER_TEMP/face-test" --no-save --ignore-scripts playwright@1.57.0
          "$RUNNER_TEMP/face-test/node_modules/.bin/playwright" install --with-deps chromium webkit
      - name: Validate contracts and official model CPU geometry
        run: |
          mkdir -p "$RUNNER_TEMP/face-assets"
          python3 - <<'PY'
          import hashlib, os, urllib.request
          from pathlib import Path
          data=urllib.request.urlopen('https://raw.githubusercontent.com/xrblocks/assets-gnm/134feb02b11fa642a43ff5e7e880246255a74e86/gnm_head_web.bin',timeout=90).read()
          assert len(data)==34937952
          assert hashlib.sha256(data).hexdigest()=='fd19f46eef6f8bfb725fceab581e1bc8837209997ca3fd43f3c1735003c86961'
          Path(os.environ['RUNNER_TEMP'],'face-assets','gnm_head_web.bin').write_bytes(data)
          PY
          cd kaopu-face-workbench
          node tests/contracts.mjs
          GNM_ASSET="$RUNNER_TEMP/face-assets/gnm_head_web.bin" node tests/model.mjs
      - name: Real Chromium pixels, repeated navigation and local-only inputs
        env:
          FACE_URL: http://127.0.0.1:8765/kaopu-face-workbench/
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/face-server.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -fsS "$FACE_URL" > /dev/null && break || sleep 1; done
          mkdir -p loader-chromium loader-webkit
          (cd loader-chromium && NODE_PATH="$RUNNER_TEMP/face-test/node_modules" node ../kaopu-face-workbench/tests/loader-transfer.cjs)
          (cd loader-webkit && FACE_BROWSER=webkit NODE_PATH="$RUNNER_TEMP/face-test/node_modules" node ../kaopu-face-workbench/tests/loader-transfer.cjs)
          NODE_PATH="$RUNNER_TEMP/face-test/node_modules" node kaopu-face-workbench/tests/browser.cjs
          command -v ffmpeg >/dev/null || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          ffmpeg -hide_banner -loglevel error -f lavfi -i color=c=orange:s=128x128:d=1:r=10 -an -c:v libx264 -pix_fmt yuv420p -movflags +faststart -y "$RUNNER_TEMP/face-test/synthetic.mp4"
          mkdir -p qa-webkit
          cd qa-webkit
          FACE_BROWSER=webkit FACE_VIDEO_FIXTURE="$RUNNER_TEMP/face-test/synthetic.mp4" NODE_PATH="$RUNNER_TEMP/face-test/node_modules" node ../kaopu-face-workbench/tests/browser.cjs
      - name: Verify compact runtime on public HTTPS in both engines
        env:
          FACE_URL: https://haihao0307.github.io/guilin-dem-pipeline/kaopu-face-workbench/?loader=single-r01-20261006
        run: |
          python3 - <<'PYVERIFY'
          import hashlib, urllib.request
          expected={"PROVENANCE.json": "f9c27b76dd4538ff3a506fcd7e26828f41d84b879bb3baf41760275cf3ac3ed9", "README.md": "eaac8a971205273cd6b83c7620b33e3a007959c7de6b81bce07f55ecf68301d6", "index.html": "192298cb116ce750498682f2fa5f59d8e35b177a987f5e6ebea8d16720cadb93", "licenses/GNM-LICENSE.txt": "ba12fffb7f905c67daa3e0d9656e8638d3a0d0eee70862ec17da7db429be19f0", "licenses/THREE-LICENSE.txt": "4c40a1ef62450b857c3b2aaf294936304cd552d965fbcd9d32d4c5bcf4ba4454", "licenses/XRBLOCKS-LICENSE.txt": "33eef1d0689b439ecb31fe3eb3e14cc5a0c31c5d1489087fe45fb2d2ad13f084", "package.json": "36c92d5574b3f75e0d24e10cc8d81793c5971a1268f8c00464ded482d3c86b46", "src/GNMModel.js": "e9619714dc5a975f66fc8c9cef76220441fd8e644cf9d14e43022b4705579c5f", "src/app.js": "8980a6ae6e3b8272ed2b69ebb79c61eedcd28d55bd7b06d554d54fc7f36e1c3e", "src/profile.js": "aced33fdaa8b35276d5d3e92dacbb32c28742c9de2fdc3858bc0798b7a2bbbcc", "style.css": "dae08ce967aba7e9716b70f0c43652f5ad686581972b5379f165e4396da9d0b8", "tests/browser.cjs": "ee2d072cbfe300677741ca67a20e9cec601456f1884206c0a4748dc65c7940a2", "tests/contracts.mjs": "634862187bee8350239fbdca49d9f0403b17fea8413c4fc0698c7e645f97403f", "tests/model.mjs": "6f8104612bc116ded2d69d0254f37938064f6e75aac337b609d7e04e980d1e2a", "vendor/OrbitControls.js": "6f3052dd8860a60fe6999260d50558ff54609523724c6e374326228e5590cf55", "vendor/three.module.js": "ce1fa418de16a19495a9f72495580e3015d7745c296d3ce0485897f902ddedfb", "runtime/BUILD.json": "9c2de3073f1c996c4319d3c63ed64ef049cca66a1911dab04579f15c5d4e41e5", "runtime/face-r01-4a6168be117e.min.js": "4a6168be117ec3e992824ddd6a4c02b5e2faf43e55d398669ca94b5f9671b0e7", "runtime/face-r01-4a6168be117e.min.js.gz": "93e290bb34926ad5cdaa094993a5558cf83424b338d6b25bd3a4bf6c7520f964"}
          base='https://haihao0307.github.io/guilin-dem-pipeline/kaopu-face-workbench/'
          for name, digest in expected.items():
              response=urllib.request.urlopen(base+name+'?loader=single-r01-20261006',timeout=60)
              data=response.read()
              assert hashlib.sha256(data).hexdigest()==digest,name+' public bytes mismatch'
              print(name,response.status,response.headers.get('content-type'),len(data),digest)
          PYVERIFY
          mkdir -p public-loader-chromium public-loader-webkit public-flow-chromium public-flow-webkit
          (cd public-loader-chromium && NODE_PATH="$RUNNER_TEMP/face-test/node_modules" node ../kaopu-face-workbench/tests/loader-public.cjs)
          (cd public-loader-webkit && FACE_BROWSER=webkit NODE_PATH="$RUNNER_TEMP/face-test/node_modules" node ../kaopu-face-workbench/tests/loader-public.cjs)
          (cd public-flow-chromium && NODE_PATH="$RUNNER_TEMP/face-test/node_modules" node ../kaopu-face-workbench/tests/browser.cjs)
          (cd public-flow-webkit && FACE_BROWSER=webkit FACE_VIDEO_FIXTURE="$RUNNER_TEMP/face-test/synthetic.mp4" NODE_PATH="$RUNNER_TEMP/face-test/node_modules" node ../kaopu-face-workbench/tests/browser.cjs)
      - name: Upload synthetic-only QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: face-r01-browser-evidence
          retention-days: 7
          if-no-files-found: warn
          path: |
            face-desktop.png
            face-restored.png
            face-mobile.png
            face-qa-result.json
            qa-webkit/*.png
            qa-webkit/face-qa-result.json
            qa-public-chromium/*.png
            qa-public-chromium/face-qa-result.json
            qa-public-webkit/*.png
            qa-public-webkit/face-qa-result.json
            entry-chromium/*.png
            entry-chromium/entry-qa-result.json
            entry-webkit/*.png
            entry-webkit/entry-qa-result.json
            public-entry-chromium/*.png
            public-entry-chromium/entry-qa-result.json
            public-entry-webkit/*.png
            public-entry-webkit/entry-qa-result.json
            public-flow-chromium/*.png
            public-flow-chromium/face-qa-result.json
            public-flow-webkit/*.png
            public-flow-webkit/face-qa-result.json
            loader-chromium/*.png
            loader-chromium/loader-qa-result.json
            loader-webkit/*.png
            loader-webkit/loader-qa-result.json
            public-loader-chromium/*.png
            public-loader-chromium/loader-public-result.json
            public-loader-webkit/*.png
            public-loader-webkit/loader-public-result.json
