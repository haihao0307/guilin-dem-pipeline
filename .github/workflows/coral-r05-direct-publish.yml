name: Coral R05 Direct Publish

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/coral-r05-direct-publish.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out GitHub Pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Build direct uncompressed workbench
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, json, zlib

          src = Path('coral-mother-r05-growth-field-c7b87a4')
          out = Path('coral-mother-r05-direct-no-loader')
          out.mkdir(parents=True, exist_ok=True)

          text = ''.join((src / f'coral-runtime-{i:02d}.b64').read_text(encoding='utf-8') for i in range(8))
          payload = base64.b64decode(''.join(text.split()))
          assert payload[:2] == b'\x1f\x8b', 'payload is not gzip'

          # The archived trailer CRC is invalid, which is why browser DecompressionStream
          # rejected it. Decode the intact raw DEFLATE body and publish the HTML directly.
          flags = payload[3]
          i = 10
          if flags & 0x04:
              xlen = int.from_bytes(payload[i:i+2], 'little')
              i += 2 + xlen
          if flags & 0x08:
              i = payload.index(0, i) + 1
          if flags & 0x10:
              i = payload.index(0, i) + 1
          if flags & 0x02:
              i += 2
          html = zlib.decompress(payload[i:-8], -15)

          expected_len = 43318
          recovered_sha = 'd21714163f9bac936d82b5729203527bdcb57f00e1336b197155c9f71ea938df'
          actual_sha = hashlib.sha256(html).hexdigest()
          lower = html.lower()
          assert len(html) == expected_len, (len(html), expected_len)
          assert actual_sha == recovered_sha, (actual_sha, recovered_sha)
          assert lower.startswith(b'<!doctype html>'), 'not an html document'
          assert b'<canvas' in lower, 'workbench canvas missing'
          assert b'</html>' in lower, 'html document is incomplete'
          assert b'DecompressionStream' not in html, 'runtime still contains decompression loader'
          assert b'coral-runtime-' not in html, 'runtime still references split payloads'
          assert b'fetch(' not in html, 'runtime still performs network fetches'

          (out / 'index.html').write_bytes(html)
          q = {
              'schema': 'CORAL_MOTHER_R05_DIRECT_PUBLISH_QA',
              'bytes': len(html),
              'sha256': actual_sha,
              'externalSplitPayloadRequests': 0,
              'runtimeDecompression': False,
              'networkFetchCalls': 0,
              'gzipTrailerIgnored': True,
              'recoveredPayloadHashMatched': True,
              'source': 'gh-pages/coral-mother-r05-growth-field-c7b87a4/coral-runtime-00..07.b64',
          }
          (out / 'QA_DIRECT.json').write_text(
              json.dumps(q, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          print(q)
          PY

      - name: Headless browser gate
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet websocket-client
          python3 -m http.server 8765 >/tmp/r05-http.log 2>&1 &
          HTTP_PID=$!
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-dev-shm-usage \
            --remote-debugging-port=9222 \
            --remote-allow-origins='*' \
            --use-angle=swiftshader \
            --enable-webgl \
            --ignore-gpu-blocklist \
            --window-size=1440,1100 \
            --user-data-dir=/tmp/r05-chrome-profile \
            about:blank >/tmp/r05-chrome.out 2>/tmp/r05-chrome.err &
          CHROME_PID=$!
          trap 'kill $CHROME_PID $HTTP_PID 2>/dev/null || true' EXIT

          python3 - <<'PY'
          import base64, json, time, urllib.request
          from pathlib import Path
          import websocket

          def get_json(url, attempts=80):
              last = None
              for _ in range(attempts):
                  try:
                      with urllib.request.urlopen(url, timeout=2) as r:
                          return json.load(r)
                  except Exception as e:
                      last = e
                      time.sleep(.2)
              raise last

          targets = get_json('http://127.0.0.1:9222/json/list')
          target = next(t for t in targets if t.get('type') == 'page')
          ws = websocket.create_connection(target['webSocketDebuggerUrl'], timeout=15, origin='http://127.0.0.1')
          seq = 0

          def call(method, params=None):
              global seq
              seq += 1
              ident = seq
              ws.send(json.dumps({'id': ident, 'method': method, 'params': params or {}}))
              while True:
                  msg = json.loads(ws.recv())
                  if msg.get('id') == ident:
                      if 'error' in msg:
                          raise RuntimeError(msg['error'])
                      return msg.get('result', {})

          call('Page.enable')
          call('Runtime.enable')
          call('Page.addScriptToEvaluateOnNewDocument', {
              'source': "window.__qaErrors=[];addEventListener('error',e=>window.__qaErrors.push(String(e.message||e.error||e)));addEventListener('unhandledrejection',e=>window.__qaErrors.push(String(e.reason||e)));"
          })
          call('Page.navigate', {'url': 'http://127.0.0.1:8765/coral-mother-r05-direct-no-loader/'})
          time.sleep(8)
          expr = """JSON.stringify((()=>{const c=document.querySelector('canvas');let gl=false;try{gl=!!(c&&(c.getContext('webgl2')||c.getContext('webgl')))}catch(e){}return{ready:document.readyState,title:document.title,canvas:document.querySelectorAll('canvas').length,controls:document.querySelectorAll('button,input,select').length,gl,body:(document.body.innerText||'').slice(0,4000),errors:window.__qaErrors||[]}})())"""
          r = call('Runtime.evaluate', {'expression': expr, 'returnByValue': True})
          value = r['result']['value']
          q = json.loads(value)
          assert q['ready'] == 'complete', q
          assert q['canvas'] >= 1, q
          assert q['controls'] >= 8, q
          assert q['gl'] is True, q
          assert '启动失败' not in q['body'], q
          assert 'Failed to fetch' not in q['body'], q
          assert not q['errors'], q
          shot = call('Page.captureScreenshot', {'format': 'png', 'captureBeyondViewport': False})
          Path('/tmp/r05-direct-qa.png').write_bytes(base64.b64decode(shot['data']))
          assert Path('/tmp/r05-direct-qa.png').stat().st_size > 10000
          qa_path = Path('coral-mother-r05-direct-no-loader/QA_DIRECT.json')
          qa = json.loads(qa_path.read_text(encoding='utf-8'))
          qa['browserQA'] = {
              'passed': True,
              'viewport': '1440x1100',
              'readyState': q['ready'],
              'canvasCount': q['canvas'],
              'controlCount': q['controls'],
              'webglContext': q['gl'],
              'runtimeErrors': q['errors'],
              'startupFailureText': False,
          }
          qa_path.write_text(json.dumps(qa, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(q, ensure_ascii=False))
          ws.close()
          PY

      - name: Commit direct page
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Haihao_Nature Grace HK'
          git config user.email 'haihao0307@gmail.com'
          git add coral-mother-r05-direct-no-loader/
          if git diff --cached --quiet; then
            echo 'No direct-page changes.'
          else
            git commit -m 'fix(coral): publish browser-verified direct R05'
            git push origin gh-pages
          fi
