name: Coral R05 Direct Publish

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/coral-r05-direct-publish.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out GitHub Pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Recover and repair direct workbench
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, json, zlib

          src = Path('coral-mother-r05-growth-field-c7b87a4')
          out = Path('coral-mother-r05-direct-r2')
          out.mkdir(parents=True, exist_ok=True)

          text = ''.join((src / f'coral-runtime-{i:02d}.b64').read_text(encoding='utf-8') for i in range(8))
          payload = base64.b64decode(''.join(text.split()))
          assert payload[:2] == b'\x1f\x8b', 'payload is not gzip'

          # Recover the intact DEFLATE body while bypassing the invalid archived gzip trailer.
          flags = payload[3]
          i = 10
          if flags & 0x04:
              xlen = int.from_bytes(payload[i:i+2], 'little')
              i += 2 + xlen
          if flags & 0x08:
              i = payload.index(0, i) + 1
          if flags & 0x10:
              i = payload.index(0, i) + 1
          if flags & 0x02:
              i += 2
          recovered = zlib.decompress(payload[i:-8], -15)

          assert len(recovered) == 43318
          assert hashlib.sha256(recovered).hexdigest() == 'd21714163f9bac936d82b5729203527bdcb57f00e1336b197155c9f71ea938df'

          # Repair the one corrupted growth-expression token pair found by Node and Chromium.
          fixes = [
              (b'let e+n[0]uter*(', b'let edge=outer*('),
              (b'(e+n[-.10)', b'(edge-.10)'),
          ]
          html = recovered
          applied = []
          for bad, good in fixes:
              count = html.count(bad)
              assert count == 1, (bad, count)
              html = html.replace(bad, good)
              applied.append({'from': bad.decode(), 'to': good.decode(), 'count': count})

          lower = html.lower()
          actual_sha = hashlib.sha256(html).hexdigest()
          assert len(html) == 43318
          assert lower.startswith(b'<!doctype html>')
          assert b'<canvas' in lower
          assert b'</html>' in lower
          assert b'DecompressionStream' not in html
          assert b'coral-runtime-' not in html
          assert b'fetch(' not in html

          (out / 'index.html').write_bytes(html)
          q = {
              'schema': 'CORAL_MOTHER_R05_DIRECT_R2_QA',
              'bytes': len(html),
              'sha256': actual_sha,
              'externalSplitPayloadRequests': 0,
              'runtimeDecompression': False,
              'networkFetchCalls': 0,
              'gzipTrailerIgnored': True,
              'recoveredPayloadHashMatched': True,
              'syntaxRepairs': applied,
              'browserQA': {'passed': False},
          }
          (out / 'QA_DIRECT.json').write_text(json.dumps(q, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(q, ensure_ascii=False, indent=2))
          PY

      - name: Static JavaScript syntax gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser

          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=False)
                  self.in_script = False; self.buf = []; self.scripts = []
              def handle_starttag(self, tag, attrs):
                  if tag.lower() == 'script': self.in_script = True; self.buf = []
              def handle_endtag(self, tag):
                  if tag.lower() == 'script' and self.in_script:
                      self.scripts.append(''.join(self.buf)); self.in_script = False
              def handle_data(self, data):
                  if self.in_script: self.buf.append(data)

          html = Path('coral-mother-r05-direct-r2/index.html').read_text(encoding='utf-8')
          p = Scripts(); p.feed(html)
          assert len(p.scripts) == 1, len(p.scripts)
          Path('/tmp/r05-script.js').write_text(p.scripts[0], encoding='utf-8')
          print('INLINE_SCRIPT_BYTES', len(p.scripts[0].encode()))
          PY
          node --check /tmp/r05-script.js

      - name: Headless browser gate
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet websocket-client
          python3 -m http.server 8765 >/tmp/r05-http.log 2>&1 &
          HTTP_PID=$!
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --remote-debugging-port=9222 --remote-allow-origins='*' --use-angle=swiftshader --enable-webgl --ignore-gpu-blocklist --window-size=1440,1100 --user-data-dir=/tmp/r05-chrome-profile about:blank >/tmp/r05-chrome.out 2>/tmp/r05-chrome.err &
          CHROME_PID=$!
          trap 'kill $CHROME_PID $HTTP_PID 2>/dev/null || true' EXIT

          python3 - <<'PY'
          import base64, json, time, urllib.request
          from pathlib import Path
          import websocket

          def get_json(url, attempts=80):
              last = None
              for _ in range(attempts):
                  try:
                      with urllib.request.urlopen(url, timeout=2) as r: return json.load(r)
                  except Exception as e:
                      last = e; time.sleep(.2)
              raise last

          target = next(t for t in get_json('http://127.0.0.1:9222/json/list') if t.get('type') == 'page')
          ws = websocket.create_connection(target['webSocketDebuggerUrl'], timeout=15, origin='http://127.0.0.1')
          seq = 0
          def call(method, params=None):
              global seq
              seq += 1; ident = seq
              ws.send(json.dumps({'id': ident, 'method': method, 'params': params or {}}))
              while True:
                  msg = json.loads(ws.recv())
                  if msg.get('id') == ident:
                      if 'error' in msg: raise RuntimeError(msg['error'])
                      return msg.get('result', {})

          call('Page.enable'); call('Runtime.enable')
          call('Page.addScriptToEvaluateOnNewDocument', {'source': "window.__qaErrors=[];addEventListener('error',e=>window.__qaErrors.push({message:String(e.message||e.error||e),filename:e.filename,line:e.lineno,column:e.colno,stack:e.error&&e.error.stack}));addEventListener('unhandledrejection',e=>window.__qaErrors.push({message:String(e.reason||e),stack:e.reason&&e.reason.stack}));"})
          call('Page.navigate', {'url': 'http://127.0.0.1:8765/coral-mother-r05-direct-r2/'})
          time.sleep(9)
          expr = """JSON.stringify((()=>{const c=document.querySelector('canvas');let gl=false;try{gl=!!(c&&(c.getContext('webgl2')||c.getContext('webgl')))}catch(e){}return{ready:document.readyState,title:document.title,canvas:document.querySelectorAll('canvas').length,controls:document.querySelectorAll('button,input,select').length,gl,width:c&&c.width,height:c&&c.height,body:(document.body.innerText||'').slice(0,5000),errors:window.__qaErrors||[]}})())"""
          q = json.loads(call('Runtime.evaluate', {'expression': expr, 'returnByValue': True})['result']['value'])
          print(json.dumps(q, ensure_ascii=False, indent=2))
          assert q['ready'] == 'complete', q
          assert q['canvas'] >= 1, q
          assert q['controls'] >= 6, q
          assert q['gl'] is True, q
          assert q['width'] and q['height'], q
          assert '启动失败' not in q['body'], q
          assert 'Failed to fetch' not in q['body'], q
          assert not q['errors'], q

          shot = call('Page.captureScreenshot', {'format': 'png', 'captureBeyondViewport': False})
          shot_path = Path('coral-mother-r05-direct-r2/QA_SCREENSHOT_1440x1100.png')
          shot_path.write_bytes(base64.b64decode(shot['data']))
          assert shot_path.stat().st_size > 10000

          qa_path = Path('coral-mother-r05-direct-r2/QA_DIRECT.json')
          qa = json.loads(qa_path.read_text(encoding='utf-8'))
          qa['browserQA'] = {
              'passed': True,
              'viewport': '1440x1100',
              'readyState': q['ready'],
              'title': q['title'],
              'canvasCount': q['canvas'],
              'canvasPixels': [q['width'], q['height']],
              'controlCount': q['controls'],
              'webglContext': q['gl'],
              'runtimeErrors': q['errors'],
              'startupFailureText': False,
              'screenshotBytes': shot_path.stat().st_size,
          }
          qa_path.write_text(json.dumps(qa, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          ws.close()
          PY

      - name: Commit browser-verified direct page
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Haihao_Nature Grace HK'
          git config user.email 'haihao0307@gmail.com'
          git add coral-mother-r05-direct-r2/
          git commit -m 'fix(coral): publish browser-verified R05 direct r2'
          git push origin gh-pages
