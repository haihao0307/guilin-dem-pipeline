name: Coral R05 Direct Publish

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/coral-r05-direct-publish.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out GitHub Pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Build direct uncompressed workbench
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, json, zlib

          src = Path('coral-mother-r05-growth-field-c7b87a4')
          out = Path('coral-mother-r05-direct-no-loader')
          out.mkdir(parents=True, exist_ok=True)

          text = ''.join((src / f'coral-runtime-{i:02d}.b64').read_text(encoding='utf-8') for i in range(8))
          payload = base64.b64decode(''.join(text.split()))
          assert payload[:2] == b'\x1f\x8b', 'payload is not gzip'

          # The archived trailer CRC is invalid, which is why browser DecompressionStream
          # rejected it. Decode the intact raw DEFLATE body and publish the HTML directly.
          flags = payload[3]
          i = 10
          if flags & 0x04:
              xlen = int.from_bytes(payload[i:i+2], 'little')
              i += 2 + xlen
          if flags & 0x08:
              i = payload.index(0, i) + 1
          if flags & 0x10:
              i = payload.index(0, i) + 1
          if flags & 0x02:
              i += 2
          html = zlib.decompress(payload[i:-8], -15)

          expected_len = 43318
          recovered_sha = 'd21714163f9bac936d82b5729203527bdcb57f00e1336b197155c9f71ea938df'
          actual_sha = hashlib.sha256(html).hexdigest()
          lower = html.lower()
          assert len(html) == expected_len, (len(html), expected_len)
          assert actual_sha == recovered_sha, (actual_sha, recovered_sha)
          assert lower.startswith(b'<!doctype html>'), 'not an html document'
          assert b'<canvas' in lower, 'workbench canvas missing'
          assert b'</html>' in lower, 'html document is incomplete'
          assert b'DecompressionStream' not in html, 'runtime still contains decompression loader'
          assert b'coral-runtime-' not in html, 'runtime still references split payloads'
          assert b'fetch(' not in html, 'runtime still performs network fetches'

          (out / 'index.html').write_bytes(html)
          q = {
              'schema': 'CORAL_MOTHER_R05_DIRECT_PUBLISH_QA',
              'bytes': len(html),
              'sha256': actual_sha,
              'externalSplitPayloadRequests': 0,
              'runtimeDecompression': False,
              'networkFetchCalls': 0,
              'gzipTrailerIgnored': True,
              'recoveredPayloadHashMatched': True,
              'source': 'gh-pages/coral-mother-r05-growth-field-c7b87a4/coral-runtime-00..07.b64',
          }
          (out / 'QA_DIRECT.json').write_text(
              json.dumps(q, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          print(q)
          PY

      - name: Commit direct page
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Haihao_Nature Grace HK'
          git config user.email 'haihao0307@gmail.com'
          git add coral-mother-r05-direct-no-loader/
          if git diff --cached --quiet; then
            echo 'No direct-page changes.'
          else
            git commit -m 'fix(coral): publish direct R05 without fetch or decompression'
            git push origin gh-pages
          fi
