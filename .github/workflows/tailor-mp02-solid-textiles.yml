name: MP02 solid source validation
on:
  push:
    branches: [feature/tailor-mp02-solid-textiles-20261011]
    paths:
      - 'kaopu-tailor-workbench/material-products/r02/READY.json'
      - 'kaopu-tailor-workbench/material-products/r02/*.mjs'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tailor-mp02-solid-source
  cancel-in-progress: false
jobs:
  source-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: project
    steps:
      - uses: actions/checkout@v4
        with:
          path: project
          fetch-depth: 1
          sparse-checkout: |
            kaopu-tailor-workbench/material-products
            kaopu-tailor-workbench/presets/r04/person-core
      - uses: actions/checkout@v4
        with:
          repository: haihao0307/Humanoid-Rig-Lab-Next
          ref: bef688f8152212bf57207aa99703a9be81a0272f
          path: upstream-denim
          sparse-checkout: |
            denim-workshop/r08
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inherit pinned dependencies without overwriting canonical implementation
        env:
          COTTON_SOURCE: ${{ github.workspace }}/upstream-denim/denim-workshop/r08
        run: python kaopu-tailor-workbench/material-products/r02/bootstrap.py
      - name: JavaScript syntax and numerical topology, no browser
        env:
          THREE_PATH: ${{ github.workspace }}/project/kaopu-tailor-workbench/presets/r04/person-core/kaopu-unified-human-workbench/full/source/registration-vendor/three.module.js
          NODE_OPTIONS: --max-old-space-size=5120
        run: |
          P=kaopu-tailor-workbench/material-products/r02
          for f in "$P"/*.mjs "$P"/*.js; do node --check "$f"; done
          node --loader "./$P/node-loader.mjs" "$P/test-geometry.mjs"
          node --loader "./$P/node-loader.mjs" "$P/emit-shaders.mjs"
      - name: Compile and link custom GLSL functions, no rendering claim
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq glslang-tools
          P=kaopu-tailor-workbench/material-products/r02
          glslangValidator -l "$P/qa-shaders/yarn.vert" "$P/qa-shaders/material.frag"
          glslangValidator -l "$P/qa-shaders/leather.vert" "$P/qa-shaders/material.frag"
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('kaopu-tailor-workbench/material-products/r02')
          (p/'SHADER_REPORT.json').write_text(json.dumps({'passed':True,'compiler':'glslangValidator','scope':'custom vertex functions and varying link; not a browser frame','programs':['yarn','leather'],'visualVerified':False},indent=2))
          PY
      - name: Retain canonical implementation and source-only evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin feature/tailor-mp02-solid-textiles-20261011 --depth=1
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/feature/tailor-mp02-solid-textiles-20261011)"
          git add -- kaopu-tailor-workbench/material-products/r02
          if ! git diff --cached --quiet; then
            git commit -m 'feat(mp02-s1): retain closed material cores and source evidence; visual unverified [skip ci]'
            git push origin HEAD:refs/heads/feature/tailor-mp02-solid-textiles-20261011
          fi
      - name: Publish additive development candidate and verify bytes only
        run: python kaopu-tailor-workbench/material-products/r02/release.py
      - name: Package exact source and evidence
        if: always()
        run: tar -czf mp02-source-validation.tgz kaopu-tailor-workbench/material-products/r02
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mp02-source-validation
          path: project/mp02-source-validation.tgz
          retention-days: 14
