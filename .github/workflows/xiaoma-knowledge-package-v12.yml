name: Xiaoma knowledge archive V1.2
on:
  push:
    branches: ['handoff/xiaoma-mentor-v1.1-20260905']
    paths: ['.github/workflows/xiaoma-knowledge-package-v12.yml']
permissions:
  contents: write
concurrency:
  group: xiaoma-knowledge-archive-v12
  cancel-in-progress: false
jobs:
  package-knowledge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read only coordination source tree
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /docs/mother_coordination/
            /AGENTS.md
            /knowledge/PUBLIC_WEB_DELIVERY_GATE.md
      - name: Freeze knowledge and actual replies, publish ZIP, verify every returned byte
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I docs/mother_coordination/knowledgebase-v1.2-20260906/build_archive.py
