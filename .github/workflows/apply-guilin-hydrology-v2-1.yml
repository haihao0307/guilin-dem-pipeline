name: Apply Guilin hydrology continuity and visual QA v2.1

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-guilin-hydrology-v2-1.yml
      - tools/apply_guilin_hydrology_v2_1.py.gz.b64
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-guilin-hydrology-v2-1
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode and apply the reviewed continuity patch
        run: |
          set -euo pipefail
          base64 -d tools/apply_guilin_hydrology_v2_1.py.gz.b64 | gzip -d > /tmp/apply_guilin_hydrology_v2_1.py
          python /tmp/apply_guilin_hydrology_v2_1.py

      - name: Verify the renderer, builder and browser QA contract
        run: |
          set -euo pipefail
          python -m py_compile pipeline/build_online_assets.py tests/browser_full_map_cdp.py
          node --check viewer/app.js
          grep -q 'thin-hierarchical-continuous-v2' viewer/app.js
          grep -q 'hydrology_dropped_segment_count' viewer/app.js
          grep -q 'nearest-valid-native-dem-cell' pipeline/build_online_assets.py
          grep -q 'core_after_two_fraction' tests/browser_full_map_cdp.py
          grep -q 'source_segment_count' .github/workflows/guilin-online-full-map.yml
          test ! -e .github/workflows/guilin-continuous-full-map.yml
          git diff --check

      - name: Commit the corrected single publication pipeline
        run: |
          set -euo pipefail
          git config user.name "Haihao_Nature Grace HK"
          git config user.email "haihao0307@gmail.com"
          git add viewer/app.js viewer/HYDROLOGY_RENDER_V2.json pipeline/build_online_assets.py tests/browser_full_map_cdp.py .github/workflows/guilin-online-full-map.yml
          git rm .github/workflows/guilin-continuous-full-map.yml
          git rm tools/apply_guilin_hydrology_v2_1.py.gz.b64 .github/workflows/apply-guilin-hydrology-v2-1.yml
          git commit -m "fix(guilin): preserve every waterway segment and enforce thin visual QA"
          git push origin HEAD:main
