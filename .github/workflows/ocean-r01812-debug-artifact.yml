name: Ocean R01812 debug artifact
on:
  push:
    branches:
      - debug/ocean-r01812-black-screen-20260907
    paths:
      - .github/workflows/ocean-r01812-debug-artifact.yml
      - ocean-mother/releases/Ocean_Mother_R01812_Surface_Query_Direct_Open.html
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify source file
        shell: bash
        run: |
          set -euo pipefail
          test -s ocean-mother/releases/Ocean_Mother_R01812_Surface_Query_Direct_Open.html
          wc -c ocean-mother/releases/Ocean_Mother_R01812_Surface_Query_Direct_Open.html
          sha256sum ocean-mother/releases/Ocean_Mother_R01812_Surface_Query_Direct_Open.html
      - uses: actions/upload-artifact@v4
        with:
          name: ocean-r01812-debug-html
          path: ocean-mother/releases/Ocean_Mother_R01812_Surface_Query_Direct_Open.html
          if-no-files-found: error
          retention-days: 3
