name: Apply Guilin canonical authority status

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-canonical-authority-status.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply and verify the authoritative pointer guard
        run: |
          set -euo pipefail
          python tools/apply_canonical_authority_pointer_status.py
          python -m py_compile pipeline/build_online_assets_from_canonical_store.py
          grep -q 'AUTHORITATIVE_PRODUCTION_SOURCE' pipeline/build_online_assets_from_canonical_store.py
      - name: Commit the production source update
        run: |
          set -euo pipefail
          git config user.name 'Haihao_Nature Grace HK'
          git config user.email 'haihao0307@gmail.com'
          git add pipeline/build_online_assets_from_canonical_store.py
          git commit -m 'fix(guilin): accept authoritative canonical elevation pointer'
          git push origin HEAD:main
