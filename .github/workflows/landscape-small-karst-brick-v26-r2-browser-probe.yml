name: Landscape Small Karst Brick V2.6 R2 Browser Probe

on:
  push:
    branches:
      - feature/landscape-small-karst-brick-v26-r2-20260919
    paths:
      - workbenches/landscape-small-karst-field-r2-brick-v26/index.html
      - .github/workflows/landscape-small-karst-brick-v26-r2-browser-probe.yml

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Probe page in Chromium SwiftShader
        run: |
          python3 -m http.server 8000 >/tmp/http.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER || true' EXIT
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:8000/ >/dev/null && break; sleep .2; done
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)
          if [ -z "$CHROME" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq chromium || sudo apt-get install -y -qq chromium-browser
            CHROME=$(command -v chromium || command -v chromium-browser)
          fi
          echo "CHROME=$CHROME"
          set +e
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage \
            --use-angle=swiftshader --enable-unsafe-swiftshader \
            --run-all-compositor-stages-before-draw --virtual-time-budget=18000 \
            --enable-logging=stderr --v=1 \
            --dump-dom http://127.0.0.1:8000/workbenches/landscape-small-karst-field-r2-brick-v26/index.html \
            >/tmp/dom.html 2>/tmp/chrome.log
          CODE=$?
          set -e
          echo "chrome_exit=$CODE"
          echo '--- DOM ERROR ---'
          grep -o '<div id="error"[^>]*>[^<]*' /tmp/dom.html || true
          echo '--- ANGLE / WEBGL / SHADER ---'
          grep -Ei 'ANGLE|WebGL|shader|program|link|compile|error' /tmp/chrome.log | tail -n 240 || true
          echo '--- READY ---'
          grep -o '__KARST_READY__[^<]*' /tmp/dom.html | head || true
          grep -q '<div id="error" style="display: block;">' /tmp/dom.html && exit 1
