# Same fixed blobs: diagnosed recovery after HTTP 422, no ref writes.
name: Upload seven verified Guilin canonical blobs once
on:
  push:
    branches: ['trial/guilin-canonical-blob-upload-20261021']
    paths: ['.github/workflows/guilin-canonical-blob-upload-once.yml']
permissions:
  contents: read
concurrency:
  group: guilin-canonical-blob-transfer-once
  cancel-in-progress: false
jobs:
  transfer:
    if: github.repository == 'haihao0307/guilin-dem-pipeline' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 2
          sparse-checkout: |
            qa/guilin-canonical-blob-upload-once.py
      - name: Verify seven fixed public assets and upload blobs only
        env:
          GH_TOKEN: ${{ github.token }}
        run: python qa/guilin-canonical-blob-upload-once.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: guilin-seven-blob-transfer-receipt
          path: guilin-blob-transfer-receipt.json
          retention-days: 1
