name: Hong Kong main city map independent integration QA
on:
  push:
    branches: ['qa/hong-kong-main-city-r01-20261015']
    paths: ['kaopu-geography-workbench/hong-kong-main-city-r07/qa/public-smoke.cjs', '.github/workflows/hong-kong-main-city-r01.yml']
permissions:
  contents: read
concurrency:
  group: hk-main-city-r01-${{ github.ref }}
  cancel-in-progress: true
jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: kaopu-geography-workbench/hong-kong-main-city-r07/qa
      - name: Install pinned browser runner
        run: |
          npm install --prefix "$RUNNER_TEMP/runner" --no-save --ignore-scripts --no-audit --no-fund playwright@1.57.0
          echo "NODE_PATH=$RUNNER_TEMP/runner/node_modules" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/runner/node_modules/.bin/playwright" install --with-deps chromium
          sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Verify deployed public game controls
        run: node kaopu-geography-workbench/hong-kong-main-city-r07/qa/public-smoke.cjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: hk-main-city-r07-public-${{ github.sha }}
          path: kaopu-geography-workbench/hong-kong-main-city-r07/evidence-public
          if-no-files-found: error
          retention-days: 14
