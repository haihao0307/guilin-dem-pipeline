name: Hong Kong main city map independent integration QA
on:
  push:
    branches: ['qa/hong-kong-main-city-r01-20261015']
    paths: ['kaopu-geography-workbench/hong-kong-main-city-r01/**', '.github/workflows/hong-kong-main-city-r01.yml']
permissions:
  contents: read
concurrency:
  group: hk-main-city-r01-${{ github.ref }}
  cancel-in-progress: false
jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            kaopu-geography-workbench/hong-kong-main-city-r01
            kaopu-geography-workbench/hong-kong-map-sea-r03
      - name: Install pinned browser runner
        run: |
          npm install --prefix "$RUNNER_TEMP/runner" --no-save --ignore-scripts --no-audit --no-fund playwright@1.57.0
          echo "NODE_PATH=$RUNNER_TEMP/runner/node_modules" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/runner/node_modules/.bin/playwright" install --with-deps chromium
          sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Verify fixed host and start main map
        run: |
          cd kaopu-geography-workbench/hong-kong-main-city-r01
          mkdir -p evidence
          node --check integration.js
          node --check city-buildings/runtime.mjs
          node --check qa/browser.cjs
          node tests/data-contract.mjs > evidence/LOCAL_CONTRACT_RESULT.json
          python - <<'PY'
          import pathlib,hashlib,json
          p=pathlib.Path('../hong-kong-map-sea-r03/index.html').read_bytes()
          expected=json.loads(pathlib.Path('base-host-patches.json').read_text())['sourceSha256']
          assert hashlib.sha256(p).hexdigest()==expected
          PY
          nohup node qa/browser.cjs > evidence/browser.log 2>&1 &
          for i in $(seq 1 750); do
            test -f evidence/FIRST_FRAME.json && exit 0
            test -f evidence/browser-exit.txt && { cat evidence/browser.log; exit 1; }
            sleep 2
          done
          cat evidence/browser.log
          exit 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: hk-main-city-first-real-frame-${{ github.sha }}
          path: |
            kaopu-geography-workbench/hong-kong-main-city-r01/evidence/01-main-map-first-city.png
            kaopu-geography-workbench/hong-kong-main-city-r01/evidence/FIRST_FRAME.json
          if-no-files-found: error
          retention-days: 14
      - name: Complete main map integration checks
        run: |
          cd kaopu-geography-workbench/hong-kong-main-city-r01
          for i in $(seq 1 600); do
            if test -f evidence/browser-exit.txt; then cat evidence/browser.log; exit $(cat evidence/browser-exit.txt); fi
            sleep 2
          done
          cat evidence/browser.log
          exit 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: hk-main-city-r01-${{ github.sha }}
          path: kaopu-geography-workbench/hong-kong-main-city-r01/evidence
          if-no-files-found: error
          retention-days: 14
