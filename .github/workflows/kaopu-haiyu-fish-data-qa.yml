name: QA Haiyu local vertebra parameter sample
on:
  push:
    branches: [qa/haiyu-pointfields-20261007]
    paths:
      - kaopu-haiyu-workbench/studies/fish-data-fit-r01/**
      - .github/workflows/kaopu-haiyu-fish-data-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: kaopu-haiyu-workbench/studies/fish-data-fit-r01
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned official Chromium and Chinese fonts
        run: |
          npm install --prefix .haiyu-data-qa --no-save --ignore-scripts --no-audit --no-fund playwright@1.55.0
          ./.haiyu-data-qa/node_modules/.bin/playwright install --with-deps chromium
          sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Verify geometry and real browser interactions
        env:
          NODE_PATH: ${{ github.workspace }}/.haiyu-data-qa/node_modules
          HAIYU_FISH_DATA_OUT: ${{ github.workspace }}/haiyu-fish-data-evidence/browser
        run: |
          mkdir -p kaopu-haiyu-workbench/studies/fish-data-fit-r01/qa
          node kaopu-haiyu-workbench/studies/fish-data-fit-r01/tests/geometry.mjs
          node kaopu-haiyu-workbench/studies/fish-data-fit-r01/tests/dom-smoke.cjs
          node kaopu-haiyu-workbench/studies/fish-data-fit-r01/tests/browser.cjs
          cp kaopu-haiyu-workbench/studies/fish-data-fit-r01/qa/*.json haiyu-fish-data-evidence/
      - name: Preserve Chromium screenshots and QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: haiyu-fish-data-${{ github.sha }}
          path: haiyu-fish-data-evidence/
          if-no-files-found: error
