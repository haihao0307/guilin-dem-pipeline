name: KAOPU Yohei Microscope Source Audit R67

on:
  workflow_dispatch:
  push:
    paths:
      - 'docs/mother_coordination/kaopu_learning_flywheel_v1/PROBES/run_yohei_microscope_source_audit_r67.mjs'
      - 'docs/mother_coordination/kaopu_learning_flywheel_v1/PROBES/yohei_microscope_source_audit_result_r67.json'
      - '.github/workflows/kaopu-yohei-microscope-source-audit-r67.yml'

jobs:
  source-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run source/formula audit
        run: |
          node docs/mother_coordination/kaopu_learning_flywheel_v1/PROBES/run_yohei_microscope_source_audit_r67.mjs > /tmp/r67.json
      - name: Compare locked result
        run: |
          node --input-type=module -e "import fs from 'node:fs'; import assert from 'node:assert/strict'; const locked=JSON.parse(fs.readFileSync('docs/mother_coordination/kaopu_learning_flywheel_v1/PROBES/yohei_microscope_source_audit_result_r67.json')); const actual=JSON.parse(fs.readFileSync('/tmp/r67.json')); assert.deepStrictEqual(actual, locked);"
