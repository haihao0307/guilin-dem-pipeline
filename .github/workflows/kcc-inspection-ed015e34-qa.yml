name: Verify public unfinished ed015e34 inspection
on:
  push:
    branches: ['qa/kcc-inspection-ed015e34-20261022']
permissions:
  contents: read
jobs:
  public-inspection:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: kaopu-geography-workbench/kowloon-building-mother-r01/tests/inspection-ed015e34
      - run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Public exact hashes, real lift/stair round trip and mobile touch
        run: timeout 720s python -u kaopu-geography-workbench/kowloon-building-mother-r01/tests/inspection-ed015e34/public-inspection.py --manifest kaopu-geography-workbench/kowloon-building-mother-r01/tests/inspection-ed015e34/public-manifest.json --output evidence
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: public-inspection-ed015e34
          path: evidence
          retention-days: 1
