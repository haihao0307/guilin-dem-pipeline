name: Apply Guilin longitudinal flow taper v4

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/apply_guilin_hydrology_v4_bootstrap.py
      - .github/workflows/apply-guilin-hydrology-v4.yml

permissions:
  contents: write

concurrency:
  group: apply-guilin-hydrology-v4
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply reviewed longitudinal taper migration
        run: |
          set -euo pipefail
          python tools/apply_guilin_hydrology_v4_bootstrap.py
          python -m py_compile \
            pipeline/build_online_assets.py \
            tests/browser_full_map_cdp.py \
            tests/validate_hydrology_flow_contract.py
          node --check viewer/app.js
          grep -q 'longitudinal-flow-taper-v4' pipeline/build_online_assets.py
          grep -q 'longitudinal-flow-taper-v4' viewer/app.js
          grep -q 'start_flow_distance_m' pipeline/build_online_assets.py
          grep -q 'future_flow_animation_ready' viewer/app.js
          grep -q 'mainstem_upstream_full_width_css_px' tests/browser_full_map_cdp.py
          grep -q 'validate_hydrology_flow_contract.py' .github/workflows/guilin-online-full-map.yml

      - name: Commit the production implementation
        run: |
          set -euo pipefail
          git config user.name 'Haihao_Nature Grace HK'
          git config user.email 'haihao0307@gmail.com'
          git add \
            pipeline/build_online_assets.py \
            viewer/app.js \
            tests/browser_full_map_cdp.py \
            tests/validate_hydrology_flow_contract.py \
            .github/workflows/guilin-online-full-map.yml
          git diff --cached --check
          git commit -m 'feat(guilin): taper waterways from upstream to downstream'
          git push origin HEAD:main
