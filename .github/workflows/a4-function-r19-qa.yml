name: A4 isolated recovered 513-function whole-assembly QA
on:
  push:
    branches: ['trial/a4-function-assembly-r19-20261024']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            kaopu-train-workbench/a4-browser-r21
      - name: Install pinned test dependencies
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Whole analytic browser compilation and render
        working-directory: kaopu-train-workbench/a4-browser-r21
        run: timeout 600s python browser_qa.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: a4-whole-r21-${{ github.sha }}
          path: |
            kaopu-train-workbench/a4-browser-r21/*QA.json
            kaopu-train-workbench/a4-browser-r21/*-whole.png
          retention-days: 1
