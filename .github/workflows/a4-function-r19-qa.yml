name: A4 R19 isolated function-field assembly QA
on:
  push:
    branches: ['trial/a4-function-assembly-r19-20261024']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            kaopu-train-workbench/a4-system-r19
      - name: Install pinned test dependencies from official registry
        run: |
          python -m pip install playwright==1.57.0 numpy==2.3.3
          python -m playwright install --with-deps chromium
      - name: Numerical and real browser verification
        working-directory: kaopu-train-workbench/a4-system-r19
        run: |
          python validate.py
          timeout 480s python browser_qa.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: a4-system-r19-${{ github.sha }}
          path: |
            kaopu-train-workbench/a4-system-r19/*QA.json
            kaopu-train-workbench/a4-system-r19/VALIDATION.json
            kaopu-train-workbench/a4-system-r19/*browser.png
          retention-days: 1
