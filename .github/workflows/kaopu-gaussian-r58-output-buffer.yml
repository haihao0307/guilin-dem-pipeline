name: KAOPU Gaussian R58 Output Buffer

on:
  push:
    branches:
      - coordination/kaopu-learning-flywheel-r1-20260909
    paths:
      - docs/mother_coordination/kaopu_learning_flywheel_v1/PROBES/gaussian_three_output_buffer_r58.html
      - docs/mother_coordination/kaopu_learning_flywheel_v1/PROBES/run_gaussian_three_output_buffer_r58.js
      - docs/mother_coordination/kaopu_learning_flywheel_v1/ADAPTERS/gaussian_three_output_buffer_gate_r58.mjs
      - .github/workflows/kaopu-gaussian-r58-output-buffer.yml

permissions:
  contents: read

jobs:
  r58-output-buffer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned renderer and browser harness
        run: |
          npm init -y
          npm pkg set type=module
          npm install --no-save three@0.186.0 playwright@1.57.0 pngjs@7.0.0
          npx playwright install --with-deps chromium
      - name: Start local fixture server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/r58-http.log 2>&1 &
          sleep 2
          curl --fail --silent http://127.0.0.1:8765/docs/mother_coordination/kaopu_learning_flywheel_v1/PROBES/gaussian_three_output_buffer_r58.html > /dev/null
      - name: Compare default and Float output buffers
        run: node docs/mother_coordination/kaopu_learning_flywheel_v1/PROBES/run_gaussian_three_output_buffer_r58.js
      - name: Validate R58 output-buffer contract
        run: |
          cat r58-comparison.json | node docs/mother_coordination/kaopu_learning_flywheel_v1/ADAPTERS/gaussian_three_output_buffer_gate_r58.mjs > r58-gate.json
          cat r58-gate.json
          node -e "const d=require('./r58-gate.json');if(d.status!=='Candidate-pass')process.exit(10)"
      - name: Upload R58 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaopu-gaussian-r58-output-buffer
          path: |
            r58-*.json
          if-no-files-found: warn
          retention-days: 30
