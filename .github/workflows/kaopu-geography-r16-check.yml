name: KAOPU Geography R16 public browser check
on:
  push:
    branches: [gh-pages]
    paths:
      - 'kaopu-geography-workbench/**'
      - '.github/workflows/kaopu-geography-r16-check.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kaopu-geography-r16-public-qa
  cancel-in-progress: false
jobs:
  verify-public-page:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: kaopu-geography-workbench
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright pillow
          python -m playwright install --with-deps chromium
      - name: Verify R16.2 responsive shell and Gram-anchored scene files
        env:
          KAOPU_PUBLIC_URL: https://haihao0307.github.io/guilin-dem-pipeline/kaopu-geography-workbench/
        run: python kaopu-geography-workbench/qa_catalog.py
      - name: Verify deployed HTTPS workbench and interactions
        env:
          KAOPU_PUBLIC_URL: https://haihao0307.github.io/guilin-dem-pipeline/kaopu-geography-workbench/
        run: python kaopu-geography-workbench/qa_public.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kaopu-geography-r16-2-public-qa
          path: geography-qa
          retention-days: 14
          if-no-files-found: warn
