name: Unified live garment catalogue UI
on:
  pull_request:
    branches: [gh-pages]
    paths: ['kaopu-tailor-workbench/catalogue/**', 'kaopu-tailor-workbench/entry.mjs', 'kaopu-tailor-workbench/garment-pattern-catalogue-r01/browser/pattern-engine.mjs', '.github/tailor-catalogue/**', '.github/workflows/tailor-catalogue-ui-qa.yml']
permissions:
  contents: read
concurrency:
  group: tailor-catalogue-ui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    if: github.head_ref == 'qa/tailor-garments-r03-20261006'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            kaopu-tailor-workbench
            kaopu-human-overview
            .github/tailor-catalogue
      - name: Official browser driver
        run: |
          npm install --prefix "$RUNNER_TEMP/catalogue-qa" --no-save --ignore-scripts playwright@1.57.0
          "$RUNNER_TEMP/catalogue-qa/node_modules/.bin/playwright" install --with-deps ${{ matrix.browser }}
      - name: Same worker, live generation, garment recomputation and release
        env:
          NODE_PATH: ${{ runner.temp }}/catalogue-qa/node_modules
          BROWSER: ${{ matrix.browser }}
        run: |
          node .github/tailor-catalogue/source-controls.mjs
          node .github/tailor-catalogue/catalogue-ui.cjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalogue-ui-${{ matrix.browser }}
          retention-days: 7
          path: catalogue-ui-*/**
