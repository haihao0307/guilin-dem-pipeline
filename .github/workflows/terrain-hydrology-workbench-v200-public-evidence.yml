name: Terrain hydrology workbench v2.0 public evidence

on:
  push:
    branches:
      - skill/dem-procedural-landscape-v010
    paths:
      - .github/workflows/terrain-hydrology-workbench-v200-public-evidence.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: terrain-hydrology-workbench-v200-public-evidence
  cancel-in-progress: false

env:
  TARGET_DIR: terrain-hydrology-workbench-v200
  PUBLIC_URL: https://haihao0307.github.io/guilin-dem-pipeline/terrain-hydrology-workbench-v200/

jobs:
  verify-and-record:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'

    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          ref: skill/dem-procedural-landscape-v010
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install public browser QA dependency
        run: python -m pip install --disable-pip-version-check playwright

      - name: Verify direct public files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/public-check"
          for attempt in $(seq 1 24); do
            STATUS="$(curl --silent --show-error --output "$RUNNER_TEMP/public-check/index.html" --write-out '%{http_code}' -H 'Cache-Control: no-cache' "$PUBLIC_URL")"
            if [ "$STATUS" = '200' ] \
              && curl --fail --silent --show-error -H 'Cache-Control: no-cache' "${PUBLIC_URL}manifest.json" -o "$RUNNER_TEMP/public-check/manifest.json" \
              && curl --fail --silent --show-error -H 'Cache-Control: no-cache' "${PUBLIC_URL}assets/guilin/height_u16.bin" -o "$RUNNER_TEMP/public-check/guilin-height.bin" \
              && curl --fail --silent --show-error -H 'Cache-Control: no-cache' "${PUBLIC_URL}assets/wenzhou/height_u16.bin" -o "$RUNNER_TEMP/public-check/wenzhou-height.bin" \
              && curl --fail --silent --show-error -H 'Cache-Control: no-cache' "${PUBLIC_URL}assets/kunming/height_u16.bin" -o "$RUNNER_TEMP/public-check/kunming-height.bin"; then
              break
            fi
            sleep 10
          done
          for region in guilin wenzhou kunming; do
            test "$(stat -c%s "$RUNNER_TEMP/public-check/${region}-height.bin")" -eq 1280000
          done
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path("${{ runner.temp }}/public-check/manifest.json").read_text(encoding='utf-8'))
          assert manifest['directPublicPath']=='/terrain-hydrology-workbench-v200/'
          assert [r['id'] for r in manifest['regions']]==['guilin','wenzhou','kunming']
          assert all(r['grid']=={'width':800,'height':800,'spacingMeters':[12.5,12.5]} for r in manifest['regions'])
          assert all(r['exactMetricSlice'] is True and r['source']['resampled'] is False for r in manifest['regions'])
          assert manifest['release']['visualAcceptance'] is False
          print('direct public file contract passed')
          PY

      - name: Run fresh public Chromium QA
        run: |
          python tools/terrain_hydrology/browser_qa_v200.py \
            --url "$PUBLIC_URL" \
            --output "$RUNNER_TEMP/public-browser-qa"

      - name: Create immutable public evidence record
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          manifest=json.loads(Path("${{ runner.temp }}/public-check/manifest.json").read_text(encoding='utf-8'))
          report=json.loads(Path("${{ runner.temp }}/public-browser-qa/report.json").read_text(encoding='utf-8'))
          evidence={
            'schema':'terrain-hydrology-workbench-public-evidence@2.0.0',
            'verifiedAtUtc':datetime.now(timezone.utc).isoformat(),
            'repository':os.environ['GITHUB_REPOSITORY'],
            'branch':os.environ['GITHUB_REF_NAME'],
            'branchHead':os.environ['GITHUB_SHA'],
            'workflowRunId':int(os.environ['GITHUB_RUN_ID']),
            'workflowRunAttempt':int(os.environ['GITHUB_RUN_ATTEMPT']),
            'publicUrl':os.environ['PUBLIC_URL'],
            'entryHttpStatus':200,
            'directEntry':True,
            'redirectShell':False,
            'queryRoutingRequired':False,
            'regions':[{'id':r['id'],'grid':r['grid'],'exactMetricSlice':r['exactMetricSlice'],'sourceResampled':r['source']['resampled'],'truthLabel':r['truthLabel'],'assetHashes':r['assets']['hashes']} for r in manifest['regions']],
            'browserQa':{'passed':report['passed'],'viewports':[run['viewport'] for run in report['runs']],'consoleErrors':sum(len(run['consoleErrors']) for run in report['runs']),'pageErrors':sum(len(run['pageErrors']) for run in report['runs']),'failedRequests':sum(len(run['failedRequests']) for run in report['runs'])},
            'truthBoundary':manifest['release'],
          }
          out=Path("${{ runner.temp }}/release-evidence.json")
          out.write_text(json.dumps(evidence,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(evidence,ensure_ascii=False,indent=2))
          PY

      - name: Publish evidence beside the verified site
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch gh-pages "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$RUNNER_TEMP/pages"
          test -s "$RUNNER_TEMP/pages/$TARGET_DIR/index.html"
          cp "$RUNNER_TEMP/release-evidence.json" "$RUNNER_TEMP/pages/$TARGET_DIR/release-evidence.json"
          cd "$RUNNER_TEMP/pages"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$TARGET_DIR/release-evidence.json"
          if git diff --cached --quiet; then
            echo 'Evidence record already current.'
          else
            git commit -m "Record public terrain hydrology v2.0 evidence from ${GITHUB_SHA}"
            for attempt in 1 2 3; do
              git fetch origin gh-pages
              git rebase origin/gh-pages
              if git push origin HEAD:gh-pages; then break; fi
              if [ "$attempt" -eq 3 ]; then exit 1; fi
              sleep $((attempt * 5))
            done
          fi

      - name: Verify published evidence endpoint
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error -H 'Cache-Control: no-cache' "${PUBLIC_URL}release-evidence.json" -o "$RUNNER_TEMP/published-evidence.json"; then
              python - <<'PY'
          import json, os
          from pathlib import Path
          evidence=json.loads(Path("${{ runner.temp }}/published-evidence.json").read_text(encoding='utf-8'))
          assert evidence['branchHead']==os.environ['GITHUB_SHA']
          assert evidence['workflowRunId']==int(os.environ['GITHUB_RUN_ID'])
          assert evidence['entryHttpStatus']==200 and evidence['browserQa']['passed'] is True
          print('published public evidence verified')
          PY
              exit 0
            fi
            sleep 10
          done
          exit 1

      - name: Upload fresh public evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terrain-hydrology-workbench-v200-public-evidence-${{ github.sha }}
          path: |
            ${{ runner.temp }}/release-evidence.json
            ${{ runner.temp }}/published-evidence.json
            ${{ runner.temp }}/public-browser-qa/**
            ${{ runner.temp }}/public-check/manifest.json
          if-no-files-found: warn
          retention-days: 90
          compression-level: 0

      - name: Write direct URL to summary
        if: success()
        run: |
          {
            echo '## 三地区高精度真实地貌与水系工作台 v2.0'
            echo
            echo "$PUBLIC_URL"
            echo
            echo "Public HTTP 200 and fresh desktop/mobile Chromium QA passed."
          } >> "$GITHUB_STEP_SUMMARY"
