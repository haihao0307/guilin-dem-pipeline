name: Kowloon heritage controlled baseline smoke
on:
  push:
    branches: ['qa/kowloon-heritage-r05-20261013']
concurrency:
  group: kowloon-heritage-r05-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  controlled-native-smoke:
    strategy:
      fail-fast: false
      matrix:
        mode: [baseline, candidate]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          path: revision
          sparse-checkout: kaopu-minigame-workbench/voxel-train-study
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 25c460991397665e2ad9068e79a93b2b16b80484
          persist-credentials: false
          path: baseline
          sparse-checkout: kaopu-minigame-workbench/voxel-train-study
      - name: Apply only station-module candidate to fixed successful receiver
        run: python revision/kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01/kowloon-station-r05-heritage/qa/prepare-controlled-review.py ${{ matrix.mode }}
      - name: Emit original stage boundaries with R05 field
        working-directory: baseline/kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01/kowloon-train88-r01
        run: |
          node emit-shader-inputs.mjs >/dev/null
          node ../bureau-train88-r01/emit-shader-inputs.mjs >/dev/null
          node ../bureau-train88-r01/qa/emit-probes.mjs >/dev/null
          node emit-geometry-groups.mjs >/dev/null
          node emit-group-runtime.mjs >/dev/null
          node experiments/spatial-query-r01/emit.mjs
          node experiments/spatial-query-r01/emit-flat.mjs
          node experiments/compact-trace-r01/emit-contracts.mjs
          node experiments/compact-trace-r01/emit.mjs
          node experiments/bureau-query-r01/emit.mjs
      - name: Compile pinned Naga and all exact compact runtime entries
        working-directory: baseline/kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01/kowloon-train88-r01/compiler
        run: |
          python - <<'PYLOCK'
          import tomllib
          p=next(p for p in tomllib.load(open('Cargo.lock','rb'))['package'] if p['name']=='naga')
          assert p['version']=='27.0.3' and p['checksum']=='066cf25f0e8b11ee0df221219010f213ad429855f57c494f995590c861a9a7d8'
          PYLOCK
          cargo build --release --locked
          for i in $(seq 0 11); do
            target/release/kaopu-station-shader-bridge ../experiments/compact-trace-r01/generated/runtime-$i.wgsl ../experiments/compact-trace-r01/generated/runtime-$i.frag stationCompactQuery
          done
          for variant in advance-full advance-compact; do
            target/release/kaopu-station-shader-bridge ../experiments/compact-trace-r01/generated/$variant.wgsl ../experiments/compact-trace-r01/generated/$variant.frag advanceGroupedRays
          done
          target/release/kaopu-station-shader-bridge ../experiments/compact-trace-r01/generated/merge-contract.wgsl ../experiments/compact-trace-r01/generated/merge-contract.frag mergeContract
          for i in $(seq 0 11); do
            target/release/kaopu-station-shader-bridge ../generated/group-runtime-$i.wgsl ../generated/group-runtime-$i.frag stationGroupQuery
          done
          target/release/kaopu-station-shader-bridge ../generated/group-init.wgsl ../generated/group-init.frag initializeGroupedRays
          target/release/kaopu-station-shader-bridge ../generated/group-advance.wgsl ../generated/group-advance.frag advanceGroupedRays
          target/release/kaopu-station-shader-bridge ../generated/group-normal-pack.wgsl ../generated/group-normal-pack.frag packGroupedGeometry
          target/release/kaopu-station-shader-bridge ../generated/matter.wgsl ../generated/matter.frag recordMatter
          for pair in 'step stepRays' 'glass transmitGlass' 'normal recordGeometry' 'matter recordMatter'; do
            read -r stage entry <<< "$pair"
            target/release/kaopu-station-shader-bridge ../../bureau-train88-r01/generated/$stage.wgsl ../../bureau-train88-r01/generated/$stage.frag "$entry"
          done
      - name: Install pinned official browser QA runner
        run: |
          npm install --prefix "$RUNNER_TEMP/station-bridge" --no-save --ignore-scripts --no-audit --no-fund playwright@1.57.0
          "$RUNNER_TEMP/station-bridge/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/station-bridge/node_modules" >> "$GITHUB_ENV"
      - name: Fixed native camera and two source-bound blocks, with full shader diagnostics
        working-directory: baseline
        run: node kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01/kowloon-train88-r01/qa/native-focus-host.cjs
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: controlled-${{ matrix.mode }}
          path: |
            baseline/train88-native-focus-results/
            baseline/source-control.json
            baseline/kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01/kowloon-train88-r01/experiments/compact-trace-r01/generated/
          retention-days: 7
