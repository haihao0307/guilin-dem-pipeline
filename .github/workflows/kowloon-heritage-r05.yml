name: Kowloon heritage isolated source diagnostics
on:
  push:
    branches: ['qa/kowloon-heritage-r05-20261013']
concurrency:
  group: kowloon-heritage-r05-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  state-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          path: revision
          sparse-checkout: kaopu-minigame-workbench/voxel-train-study
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 25c460991397665e2ad9068e79a93b2b16b80484
          persist-credentials: false
          path: baseline
          sparse-checkout: kaopu-minigame-workbench/voxel-train-study
      - name: Copy isolated candidate and build pinned compiler
        run: |
          R=kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01
          cp -a revision/$R/kowloon-station-r05-heritage baseline/$R/
          cd baseline/$R/kowloon-train88-r01/compiler
          cargo build --release --locked
      - name: Install pinned official browser QA runner
        run: |
          npm install --prefix "$RUNNER_TEMP/station-bridge" --no-save --ignore-scripts --no-audit --no-fund playwright@1.57.0
          "$RUNNER_TEMP/station-bridge/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/station-bridge/node_modules" >> "$GITHUB_ENV"
      - name: Reproduce history mismatch then verify isolated once-only fix
        working-directory: baseline/kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01/kowloon-station-r05-heritage
        run: |
          node qa/heritage-state-emit.mjs
          C=../kowloon-train88-r01/compiler/target/release/kaopu-station-shader-bridge
          timeout 240s $C qa/heritage-state-generated/probe.wgsl qa/heritage-state-generated/probe.frag heritageStateProbe
          if node qa/heritage-state-run.cjs; then echo 'Expected unfixed state distance regression'; exit 1; fi
          node -e "const r=require('./qa/heritage-state-results/receipt.json');if(!r.probe?.compile?.linkOK||!r.probe.failures?.some(f=>f.message.includes('geometry/matter distance error')))throw Error('Did not establish material-state regression')"
          cp -a qa/heritage-state-results qa/heritage-state-before
          python qa/prepare-state-once.py
          node qa/heritage-state-emit.mjs
          timeout 240s $C qa/heritage-state-generated/probe.wgsl qa/heritage-state-generated/probe.frag heritageStateProbe
          node qa/heritage-state-run.cjs
          node -e "const a=require('./qa/heritage-state-before/readback.json'),b=require('./qa/heritage-state-results/readback.json');for(let i=0;i<3;i++)for(let j=5;j<9;j++)if(JSON.stringify(a.cases[i].rows[j])!==JSON.stringify(b.cases[i].rows[j]))throw Error('Control member changed');console.log('Four original controls identical before/after at all three ages')"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: heritage-state-regression
          path: baseline/kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01/kowloon-station-r05-heritage/qa/heritage-state-*/
          retention-days: 7
  compile-isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          path: revision
          sparse-checkout: kaopu-minigame-workbench/voxel-train-study
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 25c460991397665e2ad9068e79a93b2b16b80484
          persist-credentials: false
          path: baseline
          sparse-checkout: kaopu-minigame-workbench/voxel-train-study
      - name: Copy isolated candidate and build pinned compiler
        run: |
          R=kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01
          cp -a revision/$R/kowloon-station-r05-heritage baseline/$R/
          cd baseline/$R/kowloon-train88-r01/compiler
          cargo build --release --locked
      - name: Install pinned official browser QA runner
        run: |
          npm install --prefix "$RUNNER_TEMP/station-bridge" --no-save --ignore-scripts --no-audit --no-fund playwright@1.57.0
          "$RUNNER_TEMP/station-bridge/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/station-bridge/node_modules" >> "$GITHUB_ENV"
      - name: Emit exact R04 group three
        working-directory: baseline/kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01/kowloon-train88-r01
        run: |
          node emit-shader-inputs.mjs >/dev/null
          node ../bureau-train88-r01/emit-shader-inputs.mjs >/dev/null
          node ../bureau-train88-r01/qa/emit-probes.mjs >/dev/null
          node emit-geometry-groups.mjs >/dev/null
          node emit-group-runtime.mjs >/dev/null
          node experiments/spatial-query-r01/emit.mjs
          node experiments/spatial-query-r01/emit-flat.mjs
          node experiments/compact-trace-r01/emit-contracts.mjs
          node experiments/compact-trace-r01/emit.mjs
          node experiments/bureau-query-r01/emit.mjs
          mkdir -p ../kowloon-station-r05-heritage/qa/heritage-compile-generated
          cp experiments/compact-trace-r01/generated/runtime-3.wgsl ../kowloon-station-r05-heritage/qa/heritage-compile-generated/baseline-3.wgsl
      - name: Rebind same receiver to unchanged R05 and emit candidate groups
        run: python revision/kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01/kowloon-station-r05-heritage/qa/prepare-controlled-review.py candidate
      - name: Emit and compile only three diagnostic programs
        working-directory: baseline/kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01/kowloon-train88-r01
        run: |
          node emit-shader-inputs.mjs >/dev/null
          node ../bureau-train88-r01/emit-shader-inputs.mjs >/dev/null
          node ../bureau-train88-r01/qa/emit-probes.mjs >/dev/null
          node emit-geometry-groups.mjs >/dev/null
          node emit-group-runtime.mjs >/dev/null
          node experiments/spatial-query-r01/emit.mjs
          node experiments/spatial-query-r01/emit-flat.mjs
          node experiments/compact-trace-r01/emit-contracts.mjs
          node experiments/compact-trace-r01/emit.mjs
          node experiments/bureau-query-r01/emit.mjs
          D=../kowloon-station-r05-heritage/qa/heritage-compile-generated
          for i in 2 3; do cp experiments/compact-trace-r01/generated/runtime-$i.wgsl $D/candidate-$i.wgsl; done
          for n in baseline-3 candidate-2 candidate-3; do timeout 240s compiler/target/release/kaopu-station-shader-bridge $D/$n.wgsl $D/$n.frag stationCompactQuery; done
          node ../kowloon-station-r05-heritage/qa/heritage-compile-run.cjs $D
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: heritage-compile-isolation
          path: baseline/kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01/kowloon-station-r05-heritage/qa/heritage-compile-generated/
          retention-days: 7
  timber-equivalence:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          path: revision
          sparse-checkout: kaopu-minigame-workbench/voxel-train-study
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 25c460991397665e2ad9068e79a93b2b16b80484
          persist-credentials: false
          path: baseline
          sparse-checkout: kaopu-minigame-workbench/voxel-train-study
      - name: Copy isolated candidate and build pinned compiler
        run: |
          R=kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01
          cp -a revision/$R/kowloon-station-r05-heritage baseline/$R/
          cd baseline/$R/kowloon-train88-r01/compiler
          cargo build --release --locked
      - name: Install pinned official browser QA runner
        run: |
          npm install --prefix "$RUNNER_TEMP/station-bridge" --no-save --ignore-scripts --no-audit --no-fund playwright@1.57.0
          "$RUNNER_TEMP/station-bridge/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/station-bridge/node_modules" >> "$GITHUB_ENV"
      - name: Compare original-order unrolled and loop timber physical fields
        working-directory: baseline/kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01/kowloon-station-r05-heritage
        run: |
          node qa/heritage-timber-emit.mjs
          timeout 240s ../kowloon-train88-r01/compiler/target/release/kaopu-station-shader-bridge qa/heritage-timber-generated/probe.wgsl qa/heritage-timber-generated/probe.frag heritageTimberProbe
          node qa/heritage-timber-run.cjs
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: heritage-timber-equivalence
          path: baseline/kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01/kowloon-station-r05-heritage/qa/heritage-timber-*/
          retention-days: 7
