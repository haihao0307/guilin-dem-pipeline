name: Train R12 original desktop mouse diagnosis
on:
  push:
    branches: ['qa/voxel-train-r01-20261006']
    paths: ['kaopu-minigame-workbench/voxel-train-study/game/**', '.github/workflows/train-driver-r01-qa.yml']
permissions:
  contents: read
concurrency:
  group: kcr-r12-diagnostic-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mouse:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    env:
      TRAIN_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: kaopu-minigame-workbench/voxel-train-study
      - run: npm install --prefix "$RUNNER_TEMP/kcr" --no-save --ignore-scripts playwright@1.57.0
      - run: '"$RUNNER_TEMP/kcr/node_modules/.bin/playwright" install --with-deps ${{ matrix.browser }}'
      - run: echo "NODE_PATH=$RUNNER_TEMP/kcr/node_modules" >> "$GITHUB_ENV"
      - run: node kaopu-minigame-workbench/voxel-train-study/game/tests/r12-mouse-diagnostic.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: train-r12-${{ matrix.browser }}-mouse-diagnostic
          path: r12-${{ matrix.browser }}-mouse-diagnostic/*
          retention-days: 7
