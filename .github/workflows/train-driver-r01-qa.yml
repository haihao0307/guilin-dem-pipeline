name: KCR R07 steam gameplay candidate QA
on:
  push:
    branches: ['qa/voxel-train-r01-20261006']
    paths: ['kaopu-minigame-workbench/voxel-train-study/game/**', '.github/workflows/train-driver-r01-qa.yml']
permissions:
  contents: read
concurrency:
  group: kcr-r07-${{ github.ref }}
  cancel-in-progress: true
jobs:
  deterministic:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: kaopu-minigame-workbench/voxel-train-study
      - run: |
          for test in kcr-session.test.mjs steam-model.test.mjs render-quality.test.mjs anchored-zoom.test.mjs recommended-fit.test.mjs view-profile-storage.test.mjs; do
            node kaopu-minigame-workbench/voxel-train-study/game/tests/$test
          done
          node --check kaopu-minigame-workbench/voxel-train-study/game/app.mjs
  browser:
    needs: deterministic
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
        suite: [hero, visual, gameplay, zoom]
    env:
      TRAIN_BROWSER: ${{ matrix.browser }}
      KCR_SUITE: ${{ matrix.suite }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: kaopu-minigame-workbench/voxel-train-study
      - run: npm install --prefix "$RUNNER_TEMP/kcr" --no-save --ignore-scripts playwright@1.57.0
      - run: "$RUNNER_TEMP/kcr/node_modules/.bin/playwright install --with-deps ${{ matrix.browser }}"
      - run: echo "NODE_PATH=$RUNNER_TEMP/kcr/node_modules" >> "$GITHUB_ENV"
      - name: Start candidate and verify real browser
        run: |
          python3 -m http.server 8765 > "$RUNNER_TEMP/kcr-server.log" 2>&1 &
          if [ "${{ matrix.suite }}" = "zoom" ]; then node kaopu-minigame-workbench/voxel-train-study/game/tests/anchored-zoom-browser.cjs; else node kaopu-minigame-workbench/voxel-train-study/game/tests/kcr-browser.cjs; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kcr-r07-${{ matrix.browser }}-${{ matrix.suite }}
          path: |
            kcr-${{ matrix.browser }}-${{ matrix.suite }}/*
            anchored-zoom-${{ matrix.browser }}/*
          retention-days: 7
