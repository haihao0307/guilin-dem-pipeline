name: Train Driver public six-stop HUD QA
on:
  workflow_dispatch:
  pull_request:
    branches: [gh-pages]
    paths:
      - 'kaopu-minigame-workbench/voxel-train-study/game/**'
      - '.github/workflows/train-driver-r01-qa.yml'
permissions:
  contents: read
concurrency:
  group: train-driver-r01-${{ github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true
jobs:
  deterministic-session:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      browser_required: ${{ steps.changed.outputs.browser_required }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
          persist-credentials: false
          sparse-checkout: kaopu-minigame-workbench/voxel-train-study
      - name: Check this commit for driver changes
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || ! git diff --quiet HEAD^ HEAD -- kaopu-minigame-workbench/voxel-train-study .github/workflows/train-driver-r01-qa.yml; then
            echo "browser_required=true" >> "$GITHUB_OUTPUT"
          else
            echo "browser_required=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Protect the approved classic source
        run: node kaopu-minigame-workbench/voxel-train-study/game/tests/classic-anchor.mjs
      - name: Complete seeded sessions, recovery and carriage tests
        run: |
          node --check kaopu-minigame-workbench/voxel-train-study/game/app.mjs
          node kaopu-minigame-workbench/voxel-train-study/game/tests/session.test.mjs
          node kaopu-minigame-workbench/voxel-train-study/game/tests/model.test.mjs
          node kaopu-minigame-workbench/voxel-train-study/game/tests/route-map.test.mjs
  game-browsers:
    needs: deterministic-session
    if: needs.deterministic-session.outputs.browser_required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          sparse-checkout: kaopu-minigame-workbench
      - name: Install official Playwright package with bounded network retries
        timeout-minutes: 4
        run: timeout 180s npm install --prefix "$RUNNER_TEMP/driver-test" --no-save --ignore-scripts --fetch-timeout=30000 --fetch-retries=2 playwright@1.57.0
      - name: Download official browser engines
        timeout-minutes: 5
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: 30000
        run: timeout 240s "$RUNNER_TEMP/driver-test/node_modules/.bin/playwright" install chromium webkit
      - name: Install browser system dependencies
        timeout-minutes: 4
        run: timeout 180s "$RUNNER_TEMP/driver-test/node_modules/.bin/playwright" install-deps chromium webkit
      - name: Verify all 31 public asset hashes including the 16 protected classic files
        run: node kaopu-minigame-workbench/voxel-train-study/game/tests/public-hashes.cjs
      - name: Upload verified public asset receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: train-hud-public-assets
          retention-days: 7
          path: driver-public-hashes.json
      - name: Verify immersive HUD and actual six-stop map
        env:
          NODE_PATH: ${{ runner.temp }}/driver-test/node_modules
          TRAIN_GAME_URL: https://haihao0307.github.io/guilin-dem-pipeline/kaopu-minigame-workbench/voxel-train-study/game/
        run: |
          result=0
          timeout 300s node kaopu-minigame-workbench/voxel-train-study/game/tests/hit-targets.cjs || result=$?
          TRAIN_BROWSER=webkit timeout 300s node kaopu-minigame-workbench/voxel-train-study/game/tests/hit-targets.cjs || result=$?
          timeout 240s node kaopu-minigame-workbench/voxel-train-study/game/tests/hud.cjs || result=$?
          TRAIN_BROWSER=webkit timeout 240s node kaopu-minigame-workbench/voxel-train-study/game/tests/hud.cjs || result=$?
          exit "$result"
      - name: Upload HUD evidence immediately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: train-hud-public-first-evidence
          retention-days: 7
          path: |
            hud-chromium/*
            hud-webkit/*
            hit-targets-chromium/*
            hit-targets-webkit/*
      - name: Play a real first stop and verify both browser engines
        if: ${{ !cancelled() }}
        env:
          NODE_PATH: ${{ runner.temp }}/driver-test/node_modules
          TRAIN_GAME_URL: https://haihao0307.github.io/guilin-dem-pipeline/kaopu-minigame-workbench/voxel-train-study/game/
        run: |
          result=0
          TRAIN_GAME_QA_DIR=driver-chromium timeout 420s node kaopu-minigame-workbench/voxel-train-study/game/tests/browser.cjs || result=$?
          TRAIN_BROWSER=webkit TRAIN_GAME_QA_DIR=driver-webkit timeout 420s node kaopu-minigame-workbench/voxel-train-study/game/tests/browser.cjs || result=$?
          timeout 300s node kaopu-minigame-workbench/voxel-train-study/game/tests/views.cjs || result=$?
          TRAIN_BROWSER=webkit timeout 300s node kaopu-minigame-workbench/voxel-train-study/game/tests/views.cjs || result=$?
          exit "$result"
      - name: Upload real game screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: train-driver-public-evidence
          retention-days: 7
          if-no-files-found: warn
          path: |
            driver-chromium/*
            driver-webkit/*
            views-chromium/*
            views-webkit/*
            hud-chromium/*
            hud-webkit/*
            hit-targets-chromium/*
            hit-targets-webkit/*
