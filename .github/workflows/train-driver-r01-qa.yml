name: Train R13 reference smoke and body motion public
on:
  push:
    branches: ['qa/voxel-train-r01-20261006']
    paths: ['kaopu-minigame-workbench/voxel-train-study/game/**', '.github/workflows/train-driver-r01-qa.yml']
permissions:
  contents: read
concurrency:
  group: kcr-r13-public-${{ github.ref }}
  cancel-in-progress: true
jobs:
  deterministic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: kaopu-minigame-workbench/voxel-train-study
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Verify dynamics, original geometry, rolling gear, replay and controls
        run: |
          node --test kaopu-minigame-workbench/voxel-train-study/game/{audio-spatial.test.mjs,audio.test.mjs,music.test.mjs,station-room.test.mjs} kaopu-minigame-workbench/voxel-train-study/game/tests/{anchored-zoom,body-motion,crew-state,driver-input,kcr-session,r08-smoke,r09-camera,r09-smoke-driver,r09-world,r11-integration,recommended-fit,render-quality,station-platform,steam-dynamics,steam-model,view-profile-storage}.test.mjs
          node --check kaopu-minigame-workbench/voxel-train-study/game/app.mjs
          node --check kaopu-minigame-workbench/voxel-train-study/game/smoke.mjs
      - name: Verify current release and preserved version hashes
        run: node kaopu-minigame-workbench/voxel-train-study/game/tests/public-hashes.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: train-r13-public-hashes
          path: driver-public-hashes.json
          retention-days: 7
  browser:
    needs: deterministic
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { browser: chromium, suite: departure }
          - { browser: chromium, suite: approach }
          - { browser: chromium, suite: detail }
          - { browser: chromium, suite: regressions }
          - { browser: webkit, suite: regressions }
          - { browser: chromium, suite: gameplay }
          - { browser: webkit, suite: gameplay }
    env:
      TRAIN_GAME_URL: https://haihao0307.github.io/guilin-dem-pipeline/kaopu-minigame-workbench/voxel-train-study/game/
      TRAIN_BROWSER: ${{ matrix.browser }}
      R13_SUITE: ${{ matrix.suite }}
      KCR_SUITE: ${{ matrix.suite }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: kaopu-minigame-workbench/voxel-train-study
      - run: npm install --prefix "$RUNNER_TEMP/kcr" --no-save --ignore-scripts playwright@1.57.0
      - run: '"$RUNNER_TEMP/kcr/node_modules/.bin/playwright" install --with-deps ${{ matrix.browser }}'
      - run: sudo apt-get install -y --no-install-recommends ffmpeg
      - run: echo "NODE_PATH=$RUNNER_TEMP/kcr/node_modules" >> "$GITHUB_ENV"
      - name: Capture actual browser frames and verify live emitters
        run: |
          case "${{ matrix.suite }}" in
            gameplay) node kaopu-minigame-workbench/voxel-train-study/game/tests/kcr-browser.cjs && node kaopu-minigame-workbench/voxel-train-study/game/tests/r13-archive.cjs ;;
            *) node kaopu-minigame-workbench/voxel-train-study/game/tests/r13-browser.cjs ;;
          esac
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: train-r13-public-${{ matrix.browser }}-${{ matrix.suite }}
          path: |
            r13-${{ matrix.browser }}-${{ matrix.suite }}/*
            r13-${{ matrix.browser }}-archive/*
            kcr-${{ matrix.browser }}-${{ matrix.suite }}/*
          retention-days: 7

