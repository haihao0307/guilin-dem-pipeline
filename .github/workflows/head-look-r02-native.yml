name: Native skin R02 restore and public acceptance
on:
  push:
    branches: [fix/head-look-r02-native-skin-20261013]
    paths: ['kaopu-unified-human-workbench/head-look-r02-native/**', '.github/workflows/head-look-r02-native.yml']
permissions:
  contents: write
concurrency:
  group: native-skin-r02
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            kaopu-unified-human-workbench
            kaopu-anny-workbench
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install --no-save --package-lock=false esbuild@0.25.11 playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - name: Build exact native host and test strict archive migration
        run: |
          set -o pipefail
          mkdir -p native-r02-evidence
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          node kaopu-unified-human-workbench/head-look-r02-native/test.mjs | tee native-r02-evidence/unit.txt
          node kaopu-unified-human-workbench/human-integrated-r03/test.mjs | tee native-r02-evidence/retained-unit.txt
          node kaopu-unified-human-workbench/head-look-r02-native/build.cjs
      - name: Actual own-skin frame and reversible lighting smoke
        env:
          QA_OUT: native-r02-evidence/smoke
          SMOKE_ONLY: '1'
        run: node kaopu-unified-human-workbench/head-look-r02-native/verify.cjs
      - name: Publish immutable candidate without replacing R01
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kaopu-unified-human-workbench/head-look-r02-native/preview.html kaopu-unified-human-workbench/head-look-r02-native/BUILD.json
          git commit -m 'build(native-skin-r02): restore original surface and isolate optional light'
          git push origin HEAD:fix/head-look-r02-native-skin-20261013
          echo "BUILD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Verify exact external-browser URL
        env:
          QA_OUT: native-r02-evidence/public
        run: |
          export PREVIEW_URL="https://htmlpreview.github.io/?https://raw.githubusercontent.com/haihao0307/guilin-dem-pipeline/${BUILD_SHA}/kaopu-unified-human-workbench/head-look-r02-native/preview.html"
          node kaopu-unified-human-workbench/head-look-r02-native/verify.cjs
      - name: Record passed checks and preserve original modules
        run: |
          git fetch --depth=1 origin c1e0fd1982322ae5a11e5473a69061e3d359df4d
          python - <<'PY'
          import os,json,subprocess,re
          from pathlib import Path
          p=Path('kaopu-unified-human-workbench/head-look-r02-native');q=json.loads(Path('native-r02-evidence/public/qa.json').read_text());b=json.loads((p/'BUILD.json').read_text())
          assert q['completed'] and not q['errors'] and not q['consoleErrors'] and not q['failedRequests'] and not q['referenceRequests']
          changes=subprocess.check_output(['git','diff','--name-only','c1e0fd1982322ae5a11e5473a69061e3d359df4d','HEAD'],text=True).splitlines()
          assert all(x.startswith(str(p)+'/') or x=='.github/workflows/head-look-r02-native.yml' for x in changes),changes
          receipt={'version':b['version'],'sourceCommit':os.environ['SOURCE_SHA'],'buildCommit':os.environ['BUILD_SHA'],'previewURL':q['url'],'previewSHA256':b['previewSHA256'],'previewBytes':b['previewBytes'],'run':os.environ['GITHUB_RUN_ID'],'publicBrowserVerified':True,'publicChecks':len(q['tests']),'unitChecks':int(re.search(r'NATIVE_SKIN_UNIT_CHECKS=(\d+)',Path('native-r02-evidence/unit.txt').read_text()).group(1)),'skinSource':b['skinSource'],'rejectedSurfaceBundled':False,'originalSourcesChanged':False,'defaultLighting':'native','userVisualAccepted':False,'realPhoneTested':False,'final':q['final'],'limitations':b['limitations']}
          (p/'DELIVERY.json').write_text(json.dumps(receipt,ensure_ascii=False,indent=2)+'\n');(p/'PUBLIC_QA.json').write_text(json.dumps(q,ensure_ascii=False,indent=2)+'\n')
          PY
          git add kaopu-unified-human-workbench/head-look-r02-native/DELIVERY.json kaopu-unified-human-workbench/head-look-r02-native/PUBLIC_QA.json
          git commit -m 'docs(native-skin-r02): exact public evidence and restoration boundary'
          git push origin HEAD:fix/head-look-r02-native-skin-20261013
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-skin-r02-evidence-${{ github.run_number }}
          path: |
            native-r02-evidence/
            kaopu-unified-human-workbench/head-look-r02-native/
          retention-days: 14
