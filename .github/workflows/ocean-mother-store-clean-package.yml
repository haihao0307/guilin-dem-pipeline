name: Ocean Mother store exact clean full package
on:
  push:
    branches: [work/ocean-mother-handoff-20260901]
    paths: [.github/workflows/ocean-mother-store-clean-package.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: ocean-mother-store-clean-package
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Read exact publisher from this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, json, base64, hashlib, urllib.request
          repo = 'haihao0307/guilin-dem-pipeline'
          assert os.environ['GITHUB_REPOSITORY'] == repo
          url = 'https://api.github.com/repos/'+repo+'/contents/ocean-mother/tools/publish_exact_archive.py?ref='+os.environ['GITHUB_SHA']
          req = urllib.request.Request(url, headers={'Authorization':'Bearer '+os.environ['GH_TOKEN']})
          with urllib.request.urlopen(req, timeout=30) as response:
              value = json.load(response)
          content = base64.b64decode(value['content'])
          assert hashlib.sha256(content).hexdigest() == 'b69315318f2315a45a900c110a16a4add66c6d6214d75cfcf357441b394bf42f'
          with open('publish_exact.py','wb') as target:
              target.write(content)
          PY
      - name: Verify exact ZIP, store clean sources, commit and read back
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -B publish_exact.py
      - name: Preserve machine-readable upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ocean-clean-full-github-publication
          path: upload-evidence/
          if-no-files-found: warn
          retention-days: 90
