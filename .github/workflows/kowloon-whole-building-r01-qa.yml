name: Kowloon whole-building function relations QA
on:
  push:
    branches: ['trial/kowloon-whole-building-r01-20261021']
    paths:
      - 'kaopu-geography-workbench/kowloon-building-mother-r01/whole-building-r01/**'
      - 'kaopu-geography-workbench/kowloon-building-mother-r01/whole-building-r01.html'
      - 'kaopu-geography-workbench/kowloon-building-mother-r01/tests/whole-*'
      - '.github/workflows/kowloon-whole-building-r01-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kowloon-whole-building-${{ github.ref }}
  cancel-in-progress: false
jobs:
  field-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            kaopu-geography-workbench/kowloon-building-mother-r01
            kaopu-geography-workbench/hk-three-buildings-r01
      - name: CPU whole-building relations and original invariants
        run: node --test kaopu-geography-workbench/kowloon-building-mother-r01/tests/whole-*.test.mjs
      - name: Pinned real browser
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Start one bounded actual browser run
        run: |
          python -m http.server 8765 >/tmp/whole-building-http.log 2>&1 &
          nohup timeout 600s python -u kaopu-geography-workbench/kowloon-building-mother-r01/tests/whole-building-browser.py --url http://127.0.0.1:8765/kaopu-geography-workbench/kowloon-building-mother-r01/whole-building-r01.html --output kaopu-geography-workbench/kowloon-building-mother-r01/evidence/whole-building-r01 >/tmp/whole-building-live.log 2>&1 &
      - name: First actual whole-building image
        run: |
          end=$((SECONDS+190))
          while [ $SECONDS -lt $end ]; do
            test -f kaopu-geography-workbench/kowloon-building-mother-r01/evidence/whole-building-r01/first-ready && exit 0
            if test -f kaopu-geography-workbench/kowloon-building-mother-r01/evidence/whole-building-r01/done; then cat /tmp/whole-building-live.log; exit 1; fi
            tail -3 /tmp/whole-building-live.log || true
            sleep 5
          done
          cat /tmp/whole-building-live.log
          exit 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: whole-building-first-${{ github.sha }}
          path: kaopu-geography-workbench/kowloon-building-mother-r01/evidence/whole-building-r01
          retention-days: 1
      - name: Same-session remaining views and parameter propagation
        run: |
          end=$((SECONDS+420))
          while [ $SECONDS -lt $end ]; do
            if test -f kaopu-geography-workbench/kowloon-building-mother-r01/evidence/whole-building-r01/done; then cat /tmp/whole-building-live.log; grep -q '^passed$' kaopu-geography-workbench/kowloon-building-mother-r01/evidence/whole-building-r01/done; exit $?; fi
            tail -3 /tmp/whole-building-live.log || true
            sleep 10
          done
          exit 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: whole-building-r01-${{ github.sha }}
          path: kaopu-geography-workbench/kowloon-building-mother-r01/evidence/whole-building-r01
          retention-days: 1
