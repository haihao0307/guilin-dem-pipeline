name: Stone Money Island V0.2.9 Palau Sea Cut

on:
  push:
    branches:
      - work/stone-money-island-v0290-palau-seacut-20260920
    paths:
      - games/survivor-palau/source/build_v0290_palau_seacut.py
      - .github/workflows/stone-money-island-v0290-palau-seacut.yml

permissions:
  contents: write

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Stone Money Island V0.2.9
        run: |
          python -m py_compile games/survivor-palau/source/build_v0290_palau_seacut.py
          python games/survivor-palau/source/build_v0290_palau_seacut.py

      - name: Static contract and JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,re
          root=Path('games/survivor-palau/releases/v0.2.9')
          s=(root/'index.html').read_text(encoding='utf-8')
          b=json.loads((root/'build.json').read_text(encoding='utf-8'))
          required=[
            'stone-money-island-0.2.9-palau-seacut',
            'palauSeaCutProfileV029',
            'threeLandscapeMotherForms',
            'const cutY=seaUy',
            'const aboveCut=',
            'const bottomFlare=',
            'const neckProfile=',
            'smiKarstView',
            "cameraMode==='karst'",
            'karstReview'
          ]
          for token in required: assert token in s, token
          assert b['schema']=='STONE_MONEY_ISLAND_V029_PALAU_SEA_CUT'
          assert len(b['landscapeSource']['forms'])==3
          assert b['profile']['steepInwardCut'] is True
          assert b['profile']['descendingNarrowNeck'] is True
          assert b['profile']['gradualSubmergedBaseFlare'] is True
          scripts=re.findall(r'<script type="module">(.*?)</script>',s,re.S);assert scripts
          Path('/tmp/v029.mjs').write_text(scripts[-1],encoding='utf-8')
          PY
          node --check /tmp/v029.mjs

      - name: Run Chromium and capture main-scene proof
        run: |
          python3 -m http.server 8000 >/tmp/http.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER || true' EXIT
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:8000/ >/dev/null && break; sleep .25; done
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)
          if [ -z "$CHROME" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq chromium-browser || sudo apt-get install -y -qq chromium
            CHROME=$(command -v chromium || command -v chromium-browser)
          fi
          URL='http://127.0.0.1:8000/games/survivor-palau/releases/v0.2.9/index.html?qa=1&karstReview=1'
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage \
            --use-angle=swiftshader --enable-unsafe-swiftshader --ignore-gpu-blocklist \
            --run-all-compositor-stages-before-draw --virtual-time-budget=60000 \
            --dump-dom "$URL" >/tmp/v029-dom.html 2>/tmp/v029-chrome.log
          grep -q 'data-qa-ready="true"' /tmp/v029-dom.html
          grep -q 'stone-money-island-0.2.9-palau-seacut' /tmp/v029-dom.html
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage \
            --use-angle=swiftshader --enable-unsafe-swiftshader --ignore-gpu-blocklist \
            --run-all-compositor-stages-before-draw --virtual-time-budget=60000 \
            --window-size=1440,900 --screenshot=/tmp/v029.png "$URL" \
            >/tmp/v029-shot.log 2>&1
          test -s /tmp/v029.png
          test $(stat -c%s /tmp/v029.png) -gt 100000
          mkdir -p /tmp/v029-proof
          cp /tmp/v029.png /tmp/v029-proof/v029.png
          cp /tmp/v029-dom.html /tmp/v029-proof/dom.html
          cp games/survivor-palau/releases/v0.2.9/build.json /tmp/v029-proof/build.json

      - uses: actions/upload-artifact@v4
        with:
          name: stone-money-island-v029-palau-seacut-proof
          path: /tmp/v029-proof
          retention-days: 7

      - name: Materialize browser-tested V0.2.9
        run: |
          git config user.name "Game Mother"
          git config user.email "actions@users.noreply.github.com"
          git add games/survivor-palau/releases/v0.2.9/index.html \
                  games/survivor-palau/releases/v0.2.9/build.json
          if git diff --cached --quiet; then
            echo "V0.2.9 already materialized"
            exit 0
          fi
          git commit -m "feat(game): materialize Stone Money Island V0.2.9 Palau sea-cut [skip ci]"
          git push
