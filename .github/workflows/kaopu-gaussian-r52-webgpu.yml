name: KAOPU Gaussian R52 Confirmed WebGPU

on:
  push:
    branches:
      - coordination/kaopu-learning-flywheel-r1-20260909
    paths:
      - docs/mother_coordination/kaopu_learning_flywheel_v1/PROBES/gaussian_three_tsl_cutoff_r51.html
      - docs/mother_coordination/kaopu_learning_flywheel_v1/PROBES/run_gaussian_three_tsl_cutoff_r52_webgpu.js
      - docs/mother_coordination/kaopu_learning_flywheel_v1/ADAPTERS/gaussian_three_tsl_webgpu_gate_r52.mjs
      - .github/workflows/kaopu-gaussian-r52-webgpu.yml

permissions:
  contents: read

jobs:
  r52-webgpu:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout coordination branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned renderer and WebGPU-capable browser harness
        shell: bash
        run: |
          npm init -y
          npm pkg set type=module
          npm install --no-save three@0.186.0 playwright@1.57.0
          npx playwright install --with-deps chromium

      - name: Start local fixture server
        shell: bash
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/r52-http.log 2>&1 &
          echo $! > /tmp/r52-http.pid
          sleep 2
          curl --fail --silent http://127.0.0.1:8765/docs/mother_coordination/kaopu_learning_flywheel_v1/PROBES/gaussian_three_tsl_cutoff_r51.html > /dev/null

      - name: Run locked fixture on confirmed WebGPU
        run: node docs/mother_coordination/kaopu_learning_flywheel_v1/PROBES/run_gaussian_three_tsl_cutoff_r52_webgpu.js

      - name: Validate locked R52 WebGPU evidence contract
        shell: bash
        run: |
          cat r52-result-webgpu.json | node docs/mother_coordination/kaopu_learning_flywheel_v1/ADAPTERS/gaussian_three_tsl_webgpu_gate_r52.mjs > r52-gate-webgpu.json
          cat r52-gate-webgpu.json
          python3 - <<'PY'
          import json
          d = json.load(open('r52-gate-webgpu.json'))
          if d.get('status') != 'Candidate-pass':
              raise SystemExit(f"R52 WebGPU gate failed: {d}")
          PY

      - name: Upload R52 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaopu-gaussian-r52-webgpu
          path: |
            r52-result-webgpu.json
            r52-gate-webgpu.json
          if-no-files-found: warn
          retention-days: 30
