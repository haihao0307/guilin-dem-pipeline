name: Wenzhou R3.3 SoilGrids WCS catalog

on:
  push:
    branches:
      - feature/wenzhou-r33-environmental-data-intake-20260908
    paths:
      - .github/workflows/wenzhou-r33-soilgrids-catalog.yml
      - experiments/wenzhou-r33-environmental-data-intake/scripts/discover_soilgrids_catalog.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install request client
        run: python3 -m pip install --disable-pip-version-check requests
      - name: Discover official WCS layers
        env:
          WENZHOU_R33_CATALOG_OUTPUT: ${{ github.workspace }}/artifacts/soilgrids-wcs-catalog
        run: python3 experiments/wenzhou-r33-environmental-data-intake/scripts/discover_soilgrids_catalog.py
      - name: Upload catalog evidence
        uses: actions/upload-artifact@v4
        with:
          name: wenzhou-r33-soilgrids-wcs-catalog
          path: artifacts/soilgrids-wcs-catalog
          if-no-files-found: error
          retention-days: 14
          compression-level: 9
