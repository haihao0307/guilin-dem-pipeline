name: Voxel train R02 public layout QA
on:
  workflow_dispatch:
  pull_request:
    branches: [gh-pages]
    paths:
      - 'kaopu-minigame-workbench/voxel-train-study/**'
      - 'kaopu-minigame-workbench/index.html'
      - '.github/workflows/voxel-train-r01-qa.yml'
permissions:
  contents: read
concurrency:
  group: voxel-train-r01-${{ github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true
jobs:
  train-browser:
    if: github.event_name != 'pull_request' || github.head_ref == 'qa/voxel-train-r01-20261006'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
          persist-credentials: false
          sparse-checkout: kaopu-minigame-workbench
          sparse-checkout-cone-mode: true
      - name: Check this commit for classic scene changes
        id: classic_changed
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || ! git diff --quiet HEAD^ HEAD -- kaopu-minigame-workbench/voxel-train-study kaopu-minigame-workbench/index.html .github/workflows/voxel-train-r01-qa.yml ':(exclude)kaopu-minigame-workbench/voxel-train-study/game/**'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Classic source unchanged; heavy browser replay skipped."
          fi
      - name: Validate continuous geometry
        if: steps.classic_changed.outputs.run == 'true'
        run: |
          node --check kaopu-minigame-workbench/voxel-train-study/app.mjs
          node kaopu-minigame-workbench/voxel-train-study/tests/geometry.mjs
      - name: Verify all 17 published layout asset hashes
        if: steps.classic_changed.outputs.run == 'true'
        run: python3 kaopu-minigame-workbench/voxel-train-study/tests/public-hashes.py
      - name: Install official browser test dependency
        if: steps.classic_changed.outputs.run == 'true'
        run: |
          npm install --prefix "$RUNNER_TEMP/train-test" --no-save --ignore-scripts playwright@1.57.0
          "$RUNNER_TEMP/train-test/node_modules/.bin/playwright" install --with-deps chromium webkit
      - name: Test browser controls and capture seven loop phases
        if: steps.classic_changed.outputs.run == 'true'
        env:
          TRAIN_URL: https://haihao0307.github.io/guilin-dem-pipeline/kaopu-minigame-workbench/voxel-train-study/?release=e3793211b40ec76a456b2735a0158dc970cab0aa&layout=reference
          NODE_PATH: ${{ runner.temp }}/train-test/node_modules
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/train-server.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -fsS "$TRAIN_URL" > /dev/null && break || sleep 1; done
          TRAIN_QA_DIR=train-chromium timeout 300s node kaopu-minigame-workbench/voxel-train-study/tests/public-browser.cjs
          TRAIN_BROWSER=webkit TRAIN_QA_DIR=train-webkit timeout 300s node kaopu-minigame-workbench/voxel-train-study/tests/public-browser.cjs
          TRAIN_LAYOUT_DIR=layout-chromium timeout 240s node kaopu-minigame-workbench/voxel-train-study/tests/layout-browser.cjs
          TRAIN_BROWSER=webkit TRAIN_LAYOUT_DIR=layout-webkit timeout 240s node kaopu-minigame-workbench/voxel-train-study/tests/layout-browser.cjs
      - name: Upload browser screenshots and results
        if: always() && steps.classic_changed.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: voxel-train-r02-public-evidence
          retention-days: 7
          if-no-files-found: warn
          path: |
            train-chromium/*
            train-webkit/*
            train-public-hashes.json
            layout-chromium/*
            layout-webkit/*
