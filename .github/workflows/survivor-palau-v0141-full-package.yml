name: Palau Survival V0.1.4.1 full baseline package
on:
  push:
    branches: [work/survivor-palau-v0150-canoe-control-20260917]
    paths: [.github/workflows/survivor-palau-v0141-full-package.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e3987961baade384b99539936167fef1ae31cd7d
          fetch-depth: 1
      - name: Verify frozen V0.1.4.1 baseline
        run: |
          set -euo pipefail
          test -f games/survivor-palau/releases/v0.1.4.1/Survivor_Palau_V0.1.4.1_Cloud_Restore_Direct_Open.html
          test -f games/survivor-palau/releases/v0.1.4.1/BROWSER_QA.json
          test -f games/survivor-palau/source/build_v0141.py
          printf 'repository=haihao0307/guilin-dem-pipeline\nbranch=game/survivor-palau-v001-20260917\ncommit=e3987961baade384b99539936167fef1ae31cd7d\nrelease=V0.1.4.1\n' > games/survivor-palau/FULL_BASELINE_MANIFEST.txt
          sha256sum games/survivor-palau/releases/v0.1.4.1/Survivor_Palau_V0.1.4.1_Cloud_Restore_Direct_Open.html >> games/survivor-palau/FULL_BASELINE_MANIFEST.txt
          find games/survivor-palau -type f | sort > /tmp/files.txt
          cat /tmp/files.txt
      - name: Upload full project subtree
        uses: actions/upload-artifact@v4
        with:
          name: Palau_Survival_V0.1.4.1_FULL_BASELINE_e3987961
          path: games/survivor-palau
          if-no-files-found: error
          retention-days: 90
