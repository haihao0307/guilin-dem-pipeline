name: Coral R07 Massive P05

on:
  push:
    branches:
      - work/coral-mother-r07-massive-porites-p02-outward-surface-20260921
    paths:
      - tools/coral/coral_r07_massive_p00_builder.py
      - tools/coral/coral_r07_massive_p00_browser_qa.py
      - tools/coral/coral_r07_massive_p01_patch.py
      - tools/coral/coral_r07_massive_p02_patch.py
      - tools/coral/coral_r07_massive_p03_patch.py
      - tools/coral/coral_r07_massive_p04_patch.py
      - tools/coral/coral_r07_massive_p04_tune.py
      - tools/coral/coral_r07_massive_p05_palua_smooth_filled.py
      - tools/coral/coral_r07_massive_p05_runner.py
      - tools/coral/coral_r07_massive_p05_browser_qa.py
      - .github/workflows/coral-r07-massive-p05.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coral-r07-massive-p05
  cancel-in-progress: true

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out R07 P05 work branch
        uses: actions/checkout@v4
        with:
          ref: work/coral-mother-r07-massive-porites-p02-outward-surface-20260921
          fetch-depth: 1
          path: work

      - name: Check out current GitHub Pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 1
          path: pages

      - name: Build P00 and apply P01-P05 corrections
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/coral-r07-p05
          python3 work/tools/coral/coral_r07_massive_p00_builder.py /tmp/coral-r07-p05
          python3 work/tools/coral/coral_r07_massive_p01_patch.py /tmp/coral-r07-p05
          python3 work/tools/coral/coral_r07_massive_p02_patch.py /tmp/coral-r07-p05
          python3 work/tools/coral/coral_r07_massive_p03_patch.py /tmp/coral-r07-p05
          python3 work/tools/coral/coral_r07_massive_p04_patch.py /tmp/coral-r07-p05
          python3 work/tools/coral/coral_r07_massive_p04_tune.py /tmp/coral-r07-p05
          python3 work/tools/coral/coral_r07_massive_p05_runner.py /tmp/coral-r07-p05
          printf '%s\n' \
            'https://haihao0307.github.io/guilin-dem-pipeline/coral-mother-r07-massive-porites-p05/' \
            > /tmp/coral-r07-p05/PUBLIC_URL.txt
          grep -q 'R07-P05' /tmp/coral-r07-p05/index.html
          grep -q "palauArchipelagoOccurrenceEvidence:'NOAA_NCEI_CONFIRMED'" /tmp/coral-r07-p05/index.html
          grep -q "localSitePlacementEvidence:'UNRESOLVED_AIRAI_STONE_MONEY_ISLAND'" /tmp/coral-r07-p05/index.html
          grep -q "meshResolution:'160x320'" /tmp/coral-r07-p05/index.html
          grep -q "surfaceProfile:'usually-smooth'" /tmp/coral-r07-p05/index.html
          grep -q "coralliteTopology:'shallow-pit-fine-rim-filled-elements'" /tmp/coral-r07-p05/index.html
          grep -q 'CORAL_MOTHER_R07_MASSIVE_P05_BUILD' /tmp/coral-r07-p05/BUILD_R07_P00.json
          test -s /tmp/coral-r07-p05/PALAU_OCCURRENCE_EVIDENCE.json
          test "$(grep -o 'type="range"' /tmp/coral-r07-p05/index.html | wc -l)" -eq 12
          test "$(grep -o 'data-view="micro"' /tmp/coral-r07-p05/index.html | wc -l)" -eq 1

      - name: Browser morphology and evidence gates
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet websocket-client pillow
          python3 -m http.server 8773 --directory /tmp/coral-r07-p05 >/tmp/coral-r07-p05-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          python3 work/tools/coral/coral_r07_massive_p05_browser_qa.py /tmp/coral-r07-p05

      - name: Assert P05 evidence survived browser QA
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'NOAA_NCEI_CONFIRMED' /tmp/coral-r07-p05/BUILD_R07_P00.json
          grep -q 'hemispherical-or-helmet-shaped' /tmp/coral-r07-p05/BUILD_R07_P00.json
          grep -q 'shallow-pit-fine-rim-filled-elements' /tmp/coral-r07-p05/BUILD_R07_P00.json
          test -s /tmp/coral-r07-p05/QA_SCREENSHOT_ULTRAWIDE_2560X1080.png
          test -s /tmp/coral-r07-p05/QA_CLOSEUP_ULTRAWIDE_2560X1080.png
          test -s /tmp/coral-r07-p05/QA_MICROSCOPE_1.png
          test -s /tmp/coral-r07-p05/QA_WARP_1.png

      - name: Upload complete P05 evidence
        uses: actions/upload-artifact@v4
        with:
          name: CORAL_R07_MASSIVE_P05_EVIDENCE_${{ github.sha }}
          path: /tmp/coral-r07-p05
          if-no-files-found: error
          retention-days: 90

      - name: Publish fixed P05 workbench
        shell: bash
        run: |
          set -euo pipefail
          TARGET=coral-mother-r07-massive-porites-p05
          rm -rf "pages/$TARGET"
          mkdir -p "pages/$TARGET"
          cp -a /tmp/coral-r07-p05/. "pages/$TARGET/"
          cd pages
          git config user.name 'Haihao_Nature Grace HK'
          git config user.email 'haihao0307@gmail.com'
          git add "$TARGET/"
          if git diff --cached --quiet; then
            echo 'No publication changes.'
          else
            git commit -m "publish(coral): R07 massive Porites P05 Palau smooth filled"
            git pull --rebase origin gh-pages
            git push origin gh-pages
          fi

      - name: Write run summary
        shell: bash
        run: |
          {
            echo '## Coral Mother R07-P05'
            echo
            echo '- NOAA: Hard / stony coral → Massive coral'
            echo '- Species candidate: Porites lutea morphology prototype'
            echo '- Palau Archipelago occurrence: NOAA NCEI confirmed at Ulong Channel'
            echo '- Local Airai / Stone Money Island placement: unresolved'
            echo '- Colony: hemispherical / helmet-shaped, usually smooth'
            echo '- Surface: dense shallow pits, fine rims, filled skeletal elements'
            echo '- Mesh: 160×320'
            echo '- Runtime assets: 0 GLB / 0 texture / 0 fetch'
            echo '- visualAcceptance: false'
            echo '- productionReady: false'
            echo '- ecologicalPlacementReady: false'
            echo
            echo 'Public workbench:'
            echo 'https://haihao0307.github.io/guilin-dem-pipeline/coral-mother-r07-massive-porites-p05/'
          } >> "$GITHUB_STEP_SUMMARY"
