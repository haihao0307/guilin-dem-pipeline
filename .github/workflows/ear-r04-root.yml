name: EAR-R04 root domain
on:
  push:
    branches: [fix/ear-r04-root-domain-20261013]
    paths: ['kaopu-unified-human-workbench/ear-root-r04/**', '.github/workflows/ear-r04-root.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ear-r04-root-domain
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
          sparse-checkout: |
            kaopu-unified-human-workbench
            .github/workflows
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tools
        run: |
          npm install --no-save --package-lock=false esbuild@0.25.11 playwright@1.56.1 pngjs@7.0.0
          npx playwright install --with-deps chromium
          mkdir -p ear-r04-audit
          cp kaopu-unified-human-workbench/full/source/registration-vendor/three.module.js ear-r04-audit/three.mjs
          find . -name AGENTS.md -print > ear-r04-audit/agent-rule-paths.txt
          python3 -m http.server 8765 >/tmp/ear-r04-http.log 2>&1 &
      - name: Baseline ownership audit
        if: ${{ hashFiles('kaopu-unified-human-workbench/ear-root-r04/build.cjs') == '' }}
        run: node kaopu-unified-human-workbench/ear-root-r04/audit.cjs
      - name: Build and unit-test
        if: ${{ hashFiles('kaopu-unified-human-workbench/ear-root-r04/build.cjs') != '' }}
        run: |
          node kaopu-unified-human-workbench/ear-root-r04/build.cjs
          node kaopu-unified-human-workbench/ear-root-r04/unit.mjs
      - name: Candidate browser test
        if: ${{ hashFiles('kaopu-unified-human-workbench/ear-root-r04/build.cjs') != '' }}
        env:
          EAR_OUT: ear-r04-audit/candidate
        run: node kaopu-unified-human-workbench/ear-root-r04/verify.cjs
      - name: Publish tested isolated build
        id: publish
        if: ${{ hashFiles('kaopu-unified-human-workbench/ear-root-r04/build.cjs') != '' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- kaopu-unified-human-workbench/ear-root-r04
          if ! git diff --cached --quiet; then git commit -m 'build(ear-r04): publish root-domain candidate [skip ci]'; fi
          git push origin HEAD:${{ github.ref_name }}
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Fixed public browser test
        if: ${{ steps.publish.outputs.sha != '' }}
        env:
          EAR_MODE: public
          EAR_OUT: ear-r04-audit/public
          EAR_URL: https://htmlpreview.github.io/?https://raw.githubusercontent.com/haihao0307/guilin-dem-pipeline/${{ steps.publish.outputs.sha }}/kaopu-unified-human-workbench/ear-root-r04/preview.html
        run: node kaopu-unified-human-workbench/ear-root-r04/verify.cjs
      - name: Permanent evidence
        if: ${{ steps.publish.outputs.sha != '' }}
        run: |
          mkdir -p kaopu-unified-human-workbench/ear-root-r04/acceptance
          cp -r ear-r04-audit/candidate ear-r04-audit/public kaopu-unified-human-workbench/ear-root-r04/acceptance/
          echo '${{ steps.publish.outputs.sha }}' > kaopu-unified-human-workbench/ear-root-r04/acceptance/BUILD_COMMIT.txt
          git add -- kaopu-unified-human-workbench/ear-root-r04/acceptance
          git commit -m 'test(ear-r04): retain actual candidate and public evidence [skip ci]'
          git push origin HEAD:${{ github.ref_name }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ear-r04-${{ github.run_id }}
          path: ear-r04-audit
          retention-days: 14
