name: KAOPU Gaussian R66 Block Bound

on:
  push:
    branches:
      - coordination/kaopu-learning-flywheel-r1-20260909
    paths:
      - docs/mother_coordination/kaopu_learning_flywheel_v1/PROBES/run_gaussian_block_bound_r66.js
      - docs/mother_coordination/kaopu_learning_flywheel_v1/ADAPTERS/gaussian_block_bound_gate_r66.mjs
      - .github/workflows/kaopu-gaussian-r66-block-bound.yml

permissions:
  contents: read

jobs:
  r66-block-bound:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned renderer and browser harness
        run: |
          npm init -y
          npm pkg set type=module
          npm install --no-save three@0.186.0 playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Start local fixture server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/r66-http.log 2>&1 &
          sleep 2
          curl --fail --silent http://127.0.0.1:8765/docs/mother_coordination/kaopu_learning_flywheel_v1/PROBES/gaussian_three_spatial_residual_r64.html > /dev/null
      - name: Run preregistered checkpointed block bound
        run: node docs/mother_coordination/kaopu_learning_flywheel_v1/PROBES/run_gaussian_block_bound_r66.js
      - name: Validate R66 evidence contract
        run: |
          cat r66-comparison.json | node docs/mother_coordination/kaopu_learning_flywheel_v1/ADAPTERS/gaussian_block_bound_gate_r66.mjs > r66-gate.json
          cat r66-gate.json
          node -e "const d=require('./r66-gate.json');if(d.status!=='Candidate-pass')process.exit(10)"
      - name: Upload R66 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaopu-gaussian-r66-block-bound
          path: r66-*.json
          if-no-files-found: warn
          retention-days: 30
