name: Ocean R019.6 mobile lite quality

on:
  push:
    branches:
      - work/ocean-mother-r0196-mobile-lite-quality-20260911
    paths:
      - 'ocean-mother/r0196-mobile-lite/**'
      - '.github/workflows/ocean-r0196-mobile-lite-quality.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-compile-public-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build R019.6 from frozen R019.5
        run: |
          set -euo pipefail
          python ocean-mother/r0196-mobile-lite/apply_r0196.py
          FILE='ocean-mother/releases/Ocean_Mother_R0196_Mobile_Lite_Quality_Direct_Open.html'
          ACTUAL=$(sha256sum "$FILE" | awk '{print $1}')
          echo "EXPECTED_SHA=$ACTUAL" >> "$GITHUB_ENV"
          echo "R0196_SHA256=$ACTUAL"
          grep -Fq 'R019.6 · MOBILE LITE QUALITY' "$FILE"

      - name: JavaScript and changed GLSL compile gates
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq glslang-tools
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('ocean-mother/releases/Ocean_Mother_R0196_Mobile_Lite_Quality_Direct_Open.html').read_text(encoding='utf-8')
          js=re.search(r'<script>\s*(.*?)\s*</script>',s,re.S)
          assert js
          Path('/tmp/ocean-r0196.js').write_text(js.group(1),encoding='utf-8')
          lite=re.search(r'const LITE_FRAG=`(.*?)`;\nconst WAVE_DECL',s,re.S)
          assert lite
          Path('/tmp/lite.frag').write_text(lite.group(1),encoding='utf-8')
          assert s.count('readPixels(')==1
          assert 'waveStateL' in lite.group(1)
          assert 'landColorL' in lite.group(1)
          assert 'vec3 n=normalBedL(lp.xz);vec3 base=landColorL(lp,n);' in lite.group(1)
          assert 'liteOnly?175000:90000' in s
          print('STATIC_CONTRACT_PASS')
          PY
          node --check /tmp/ocean-r0196.js
          glslangValidator -S frag /tmp/lite.frag

      - name: Publish fixed R019.6 HTML
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          FILE='ocean-mother/releases/Ocean_Mother_R0196_Mobile_Lite_Quality_Direct_Open.html'
          git add "$FILE"
          git commit -m 'release(ocean): publish R019.6 mobile lite quality [skip ci]'
          git push

      - name: Verify fixed public HTTPS URLs
        run: |
          set -euo pipefail
          FILE='ocean-mother/releases/Ocean_Mother_R0196_Mobile_Lite_Quality_Direct_Open.html'
          SHA=$(git rev-parse HEAD)
          EXPECT="$EXPECTED_SHA"
          for HOST in raw.githack.com rawcdn.githack.com; do
            URL="https://${HOST}/haihao0307/guilin-dem-pipeline/${SHA}/${FILE}"
            ok=0
            for i in 1 2 3 4 5 6; do
              if curl -LfsS --connect-timeout 10 --max-time 30 "$URL" -o /tmp/public.html; then
                GOT=$(sha256sum /tmp/public.html | awk '{print $1}')
                if [ "$GOT" = "$EXPECT" ]; then ok=1; break; fi
              fi
              sleep 5
            done
            test "$ok" -eq 1
            echo "PUBLIC_OK $HOST $SHA $EXPECT"
          done
