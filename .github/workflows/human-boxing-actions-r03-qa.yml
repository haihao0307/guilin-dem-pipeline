name: Human boxing R03 actions-only candidate evidence
on:
  workflow_dispatch:
    inputs:
      capture_video:
        description: 'Capture full-cycle and worst-elbow offline fixed-step videos'
        required: false
        default: true
        type: boolean
  push:
    branches: ['qa/human-boxing-actions-r03-20261009']
permissions:
  contents: read
concurrency:
  group: human-boxing-actions-r03-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            kaopu-unified-human-workbench
            kaopu-anny-workbench
            kaopu-mhr-workbench
      - name: Install pinned official test dependencies without package scripts
        run: npm install --prefix "$RUNNER_TEMP/human-actions-r03-qa" --no-save --ignore-scripts playwright@1.57.0
      - name: Install real Chromium and Ubuntu video encoder
        run: |
          "$RUNNER_TEMP/human-actions-r03-qa/node_modules/.bin/playwright" install --with-deps chromium
          command -v ffmpeg || (sudo apt-get update && sudo apt-get install --no-install-recommends -y ffmpeg)
          echo "NODE_PATH=$RUNNER_TEMP/human-actions-r03-qa/node_modules" >> "$GITHUB_ENV"
      - name: Syntax and small deterministic unit checks
        run: |
          node --check kaopu-unified-human-workbench/tests/boxing-r03/boxing-r03-actions.cjs
          node --test kaopu-unified-human-workbench/tests/boxing-r03/assertions.test.cjs
          node kaopu-unified-human-workbench/full/boxing-r03/simulation-clock.test.mjs
      - name: Serve the exact candidate checkout
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/human-r03-server.log" 2>&1 &
          for n in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8765/kaopu-unified-human-workbench/boxing-r03.html > /dev/null && exit 0
            sleep 1
          done
          exit 1
      - name: Run real SwiftShader UI, phase-one boundary, source and fixed-step video evidence
        env:
          BOXING_R03_WORKBENCH: kaopu-unified-human-workbench
          BOXING_R03_BASE: http://127.0.0.1:8765/kaopu-unified-human-workbench/
          BOXING_R03_OUT: boxing-r03-actions-results
          BOXING_R03_VIDEO: ${{ (github.event_name != 'workflow_dispatch' || inputs.capture_video) && '1' || '0' }}
        run: node kaopu-unified-human-workbench/tests/boxing-r03/boxing-r03-actions.cjs
      # Separate already-compressed images/videos to keep evidence downloads small.
      # Eleven bounded categories target <20 MiB each; report JSON is independent.
      - name: Upload evidence report-json
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: human-boxing-actions-r03-${{ github.sha }}-report-json
          path: |
            boxing-r03-actions-results/*.json
          compression-level: 6
          if-no-files-found: warn
          retention-days: 7
      - name: Upload evidence programstills-01-09
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: human-boxing-actions-r03-${{ github.sha }}-programstills-01-09
          path: |
            boxing-r03-actions-results/program-0[1-9]-*.png
          compression-level: 0
          if-no-files-found: warn
          retention-days: 7
      - name: Upload evidence programstills-10-18
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: human-boxing-actions-r03-${{ github.sha }}-programstills-10-18
          path: |
            boxing-r03-actions-results/program-1[0-8]-*.png
          compression-level: 0
          if-no-files-found: warn
          retention-days: 7
      - name: Upload evidence otherstills
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: human-boxing-actions-r03-${{ github.sha }}-otherstills
          path: |
            boxing-r03-actions-results/*.png
            !boxing-r03-actions-results/program-*.png
            !boxing-r03-actions-results/cuff-*.png
          compression-level: 0
          if-no-files-found: warn
          retention-days: 7
      - name: Upload evidence worstframes-speed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: human-boxing-actions-r03-${{ github.sha }}-worstframes-speed
          path: |
            boxing-r03-actions-results/worst-pose-frames/max-angular-speed/*.png
          compression-level: 0
          if-no-files-found: warn
          retention-days: 7
      - name: Upload evidence worstframes-acceleration
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: human-boxing-actions-r03-${{ github.sha }}-worstframes-acceleration
          path: |
            boxing-r03-actions-results/worst-pose-frames/max-angular-acceleration/*.png
          compression-level: 0
          if-no-files-found: warn
          retention-days: 7
      - name: Upload evidence videos-full-cycle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: human-boxing-actions-r03-${{ github.sha }}-videos-full-cycle
          path: |
            boxing-r03-actions-results/12-adult-full-cycle-offline.mp4
          compression-level: 0
          if-no-files-found: warn
          retention-days: 7
      - name: Upload evidence videos-worst-speed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: human-boxing-actions-r03-${{ github.sha }}-videos-worst-speed
          path: |
            boxing-r03-actions-results/13-worst-elbow-angularSpeed-offline.mp4
          compression-level: 0
          if-no-files-found: warn
          retention-days: 7
      - name: Upload evidence videos-worst-acceleration
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: human-boxing-actions-r03-${{ github.sha }}-videos-worst-acceleration
          path: |
            boxing-r03-actions-results/13-worst-elbow-angularAcceleration-offline.mp4
          compression-level: 0
          if-no-files-found: warn
          retention-days: 7
      - name: Upload evidence corrected-cuffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: human-boxing-actions-r03-${{ github.sha }}-corrected-cuffs
          path: boxing-r03-actions-results/cuff-*.png
          compression-level: 0
          if-no-files-found: warn
          retention-days: 7
      - name: Upload evidence slow-video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: human-boxing-actions-r03-${{ github.sha }}-slow-video
          path: boxing-r03-actions-results/14-slow-half-cycle-offline.mp4
          compression-level: 0
          if-no-files-found: warn
          retention-days: 7
