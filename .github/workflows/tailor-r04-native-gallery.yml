name: Tailor R04.1 native result gallery review
on:
  push:
    branches: [feature/tailor-cabinet-r03-garment-surfaces-20261009]
    paths:
      - '.github/workflows/tailor-r04-native-gallery.yml'
      - 'kaopu-tailor-workbench/presets/r04/GALLERY_TRIGGER.json'
permissions:
  contents: write
concurrency:
  group: tailor-r041-native-gallery
  cancel-in-progress: false
jobs:
  verify-gallery:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: kaopu-tailor-workbench/presets/r04
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install actual browser
        run: |
          pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Change only presentation; retain exact solver packets
        run: |
          P=kaopu-tailor-workbench/presets/r04
          sha256sum "$P"/assets/results/*.json.gz > /tmp/native-before.txt
          python "$P/review_gallery.py"
          node --check "$P/app.mjs"
          node "$P/contract_test.mjs"
          sha256sum -c /tmp/native-before.txt
      - name: Real CommonViewer captures and original person/result checks
        env:
          R04_MODE: render
        run: |
          python -m http.server 8765 >/tmp/r041-gallery-http.log 2>&1 &
          python kaopu-tailor-workbench/presets/r04/sweep_native.py
          sha256sum -c /tmp/native-before.txt
      - name: Retain actual gallery source and evidence without rewriting history
        if: always()
        run: |
          P=kaopu-tailor-workbench/presets/r04
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin "$GITHUB_REF_NAME" --depth=1
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git add -- "$P"
          if ! git diff --cached --quiet; then
            git commit -m 'test(tailor-r04): retain genuine native result gallery and original person identity checks'
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tailor-r041-native-gallery-reviewed
          path: kaopu-tailor-workbench/presets/r04
          retention-days: 14
