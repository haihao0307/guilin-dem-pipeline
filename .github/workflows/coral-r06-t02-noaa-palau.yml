name: Coral R06 T02 NOAA Palau Classification

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/coral-r06-t02-noaa-palau.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out GitHub Pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
          path: pages

      - name: Build direct T02 from browser-verified T01
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json

          src_path = Path('pages/coral-mother-r06-pocillopora-t01-4824c87/index.html')
          assert src_path.exists(), src_path
          html = src_path.read_text(encoding='utf-8')

          html = html.replace(
              '<title>Coral Mother R06 · Pocillopora Specimen-First T01</title>',
              '<title>Coral Mother R06 · NOAA / Palau Classification T02</title>'
          )
          html = html.replace('PROCEDURAL · R06-T01', 'PROCEDURAL · R06-T02')
          html = html.replace(
              'Coral Mother R06 · Pocillopora 单物种复刻 T01',
              'Coral Mother R06 · Pocillopora 单物种复刻 T02'
          )
          html = html.replace(
              'SPECIMEN-FIRST · visualAcceptance=false',
              'NOAA / PALAU CONTRACT · visualAcceptance=false'
          )
          html = html.replace(
              '<span class="chip"><strong>COLOR LOCK</strong> · 中性骨骼</span>',
              '<span class="chip"><strong>NOAA TYPE</strong> · HARD / STONY CORAL</span><span class="chip"><strong>NOAA FORM</strong> · BRANCHING CORAL</span><span class="chip"><strong>COLOR LOCK</strong> · 中性骨骼</span>'
          )

          css = r'''
          .classGrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
          .classCard{padding:11px 12px;border:1px solid #79d8cf22;border-radius:13px;background:#061815a8;min-height:82px}
          .classCard span{display:block;color:#7f978f;font-size:8px;text-transform:uppercase;letter-spacing:.1em}
          .classCard b{display:block;margin-top:4px;color:#e9efe8;font-size:11px;line-height:1.35}
          .classCard small{display:block;margin-top:5px;color:#799089;font-size:8px;line-height:1.35}
          .classCard.official{border-color:#79d8cf45}.classCard.official b{color:#91e1d6}
          .classCard.unresolved{border-color:#e7b46f45}.classCard.unresolved b{color:#f1c47c}
          @media(max-width:720px){.classGrid{grid-template-columns:repeat(2,minmax(0,1fr))}.classCard{min-height:94px}}
          '''
          assert '</style>' in html
          html = html.replace('</style>', css + '\n</style>', 1)

          section = r'''
          <div class="sectionTitle">Official Classification / NOAA + Palau 官方分类</div>
          <div class="classGrid" id="officialClassification">
            <div class="classCard official"><span>Formal Taxonomy</span><b>Animalia → Cnidaria → Anthozoa → Scleractinia → Pocilloporidae</b><small>Pocillopora damicornis</small></div>
            <div class="classCard official"><span>NOAA Broad Type</span><b>Hard / stony coral</b><small>刚性钙质骨骼；大类不替代正式分类</small></div>
            <div class="classCard official"><span>NOAA Growth Form</span><b>Branching Coral</b><small>生长形态，不是科、属或种</small></div>
            <div class="classCard unresolved"><span>Palau Occurrence Evidence</span><b>UNRESOLVED</b><small>当前 Smithsonian 标本不是帕劳出现记录；不猜测</small></div>
          </div>
          <div class="note"><strong>分类边界：</strong>“紧凑团块、短粗分枝、疣突丰富、钝端”只作为物种形态描述；不再建立“菜花珊瑚类”等自造类别。Palau 层保存 CRRF 物种记录、深度／群落语境和 PICRC 监测字段，不另造一套分类。</div>
          '''
          marker = '<div class="sectionTitle">View / 同步观察</div>'
          assert marker in html
          html = html.replace(marker, section + marker, 1)

          old_note = '<div class="note"><strong>边界：</strong>右侧目前是“标本拟合的枝图复刻”，不是已经完成的通用 Pocillopora DNA。下一步要把扫描标本的个体枝图转成可变的生长规则，并用 Seriatopora hystrix 作为反例，防止两个物种退化成同一个分枝参数。</div>'
          new_note = '<div class="note"><strong>形态边界：</strong>右侧仍是“标本拟合的枝图复刻”，不是已完成的通用 Pocillopora DNA。下一步只继续收敛 Branching Coral 下的 P. damicornis 物种规则；Seriatopora hystrix 将作为同属生长形态下的反例验证，而不是新造分类。</div>'
          assert old_note in html
          html = html.replace(old_note, new_note, 1)

          classification = {
              'ready': True,
              'contract': 'NOAA_PALAU_R01',
              'customClassesAllowed': False,
              'scientificName': 'Pocillopora damicornis',
              'taxonomicOrder': 'Scleractinia',
              'family': 'Pocilloporidae',
              'noaaBroadType': 'Hard / stony coral',
              'noaaGrowthForm': 'Branching Coral',
              'palauOccurrenceEvidence': 'UNRESOLVED',
              'informalMorphologyDescriptors': ['compact clump','short robust branches','verrucae-rich surface','blunt irregular tips'],
              'visualAcceptance': False,
          }
          inject = '<script>window.__CORAL_R06_CLASSIFICATION__=' + json.dumps(classification, ensure_ascii=False, separators=(',',':')) + ';</script>'
          assert '</body>' in html
          html = html.replace('</body>', inject + '</body>', 1)

          low = html.lower()
          assert 'fetch(' not in html
          assert '.glb' not in low
          assert 'cauliflower coral' not in low
          assert 'palau occurrence evidence' in low
          assert 'unresolved' in low

          out = Path('pages/coral-mother-r06-pocillopora-t02-noaa-palau')
          out.mkdir(parents=True, exist_ok=True)
          (out / 'index.html').write_text(html, encoding='utf-8')
          (out / 'CLASSIFICATION_NOAA_PALAU_R01.json').write_text(json.dumps(classification, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          qa = {
              'schema': 'CORAL_MOTHER_R06_T02_NOAA_PALAU_QA',
              'bytes': len(html.encode('utf-8')),
              'sha256': hashlib.sha256(html.encode('utf-8')).hexdigest(),
              'directSingleFile': True,
              'runtimeGLB': 0,
              'runtimeTextures': 0,
              'networkFetchCalls': 0,
              'customClassesAllowed': False,
              'noaaBroadType': 'Hard / stony coral',
              'noaaGrowthForm': 'Branching Coral',
              'palauOccurrenceEvidence': 'UNRESOLVED',
              'desktopBrowserQA': False,
              'mobile390x844QA': False,
              'visualAcceptance': False,
              'productionReady': False,
          }
          (out / 'QA_DIRECT.json').write_text(json.dumps(qa, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(qa, ensure_ascii=False))
          PY

      - name: Desktop and mobile browser gate
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet websocket-client
          python3 -m http.server 8767 --directory pages/coral-mother-r06-pocillopora-t02-noaa-palau >/tmp/coral-t02-http.log 2>&1 &
          HTTP_PID=$!
          trap 'kill $HTTP_PID 2>/dev/null || true' EXIT
          python3 - <<'PY'
          import base64, json, shutil, subprocess, time, urllib.request
          from pathlib import Path
          import websocket

          chrome = shutil.which('google-chrome') or shutil.which('chromium') or shutil.which('chromium-browser')
          assert chrome, 'Chrome/Chromium unavailable'

          def wait_json(url):
              last = None
              for _ in range(100):
                  try:
                      with urllib.request.urlopen(url, timeout=2) as r: return json.load(r)
                  except Exception as exc:
                      last = exc; time.sleep(.2)
              raise last

          def run(label, width, height, port):
              profile = f'/tmp/coral-t02-{label}'
              shutil.rmtree(profile, ignore_errors=True)
              proc = subprocess.Popen([
                  chrome,'--headless=new','--no-sandbox','--disable-dev-shm-usage',
                  f'--remote-debugging-port={port}','--remote-allow-origins=*',
                  '--use-angle=swiftshader','--enable-webgl','--ignore-gpu-blocklist',
                  f'--window-size={width},{height}',f'--user-data-dir={profile}','about:blank'
              ], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              try:
                  target = next(t for t in wait_json(f'http://127.0.0.1:{port}/json/list') if t.get('type')=='page')
                  ws = websocket.create_connection(target['webSocketDebuggerUrl'],timeout=20,origin='http://127.0.0.1')
                  seq=0
                  def call(method,params=None):
                      nonlocal seq
                      seq+=1; ident=seq
                      ws.send(json.dumps({'id':ident,'method':method,'params':params or {}}))
                      while True:
                          msg=json.loads(ws.recv())
                          if msg.get('id')==ident:
                              if 'error' in msg: raise RuntimeError(msg['error'])
                              return msg.get('result',{})
                  call('Page.enable'); call('Runtime.enable')
                  call('Page.addScriptToEvaluateOnNewDocument',{'source':"window.__qaErrors=[];addEventListener('error',e=>window.__qaErrors.push(String(e.message||e.error||e)));addEventListener('unhandledrejection',e=>window.__qaErrors.push(String(e.reason||e)));"})
                  call('Page.navigate',{'url':'http://127.0.0.1:8767/'})
                  time.sleep(9)
                  expr=r'''JSON.stringify((()=>{const c=document.querySelector('canvas');let gl=false;try{gl=!!(c&&(c.getContext('webgl2')||c.getContext('webgl')))}catch(e){}const s=document.querySelector('#stage')?.getBoundingClientRect();const k=document.querySelector('#controls')?.getBoundingClientRect();return{ready:document.readyState,title:document.title,canvas:document.querySelectorAll('canvas').length,controls:document.querySelectorAll('button,input,select').length,gl,qa:window.__CORAL_R06_QA__||{},cls:window.__CORAL_R06_CLASSIFICATION__||{},errors:window.__qaErrors||[],body:(document.body.innerText||'').slice(0,9000),stageBeforeControls:!!(s&&k&&s.top<k.top&&s.bottom<=k.top+20),innerWidth,scrollWidth:document.documentElement.scrollWidth,horizontalOverflow:document.documentElement.scrollWidth>innerWidth+1}})())'''
                  res=call('Runtime.evaluate',{'expression':expr,'returnByValue':True})
                  q=json.loads(res['result']['value'])
                  assert q['ready']=='complete' and q['canvas']==1 and q['controls']>=20 and q['gl'] is True,q
                  assert q['stageBeforeControls'] is True and q['horizontalOverflow'] is False,q
                  assert not q['errors'],q
                  assert q['qa'].get('ready') is True and q['qa'].get('runtimeGLB')==0 and q['qa'].get('networkFetches')==0,q
                  cls=q['cls']; assert cls.get('ready') is True and cls.get('customClassesAllowed') is False,q
                  assert cls.get('noaaBroadType')=='Hard / stony coral' and cls.get('noaaGrowthForm')=='Branching Coral',q
                  assert cls.get('palauOccurrenceEvidence')=='UNRESOLVED',q
                  assert 'NOAA Broad Type' in q['body'] and 'Palau Occurrence Evidence' in q['body'] and 'UNRESOLVED' in q['body'],q
                  shot=call('Page.captureScreenshot',{'format':'png','captureBeyondViewport':False})
                  image=base64.b64decode(shot['data']); assert len(image)>15000
                  Path(f'pages/coral-mother-r06-pocillopora-t02-noaa-palau/QA_SCREENSHOT_{label.upper()}.png').write_bytes(image)
                  ws.close()
                  return {'passed':True,'viewport':f'{width}x{height}','webgl':True,'runtimeErrors':0,'horizontalOverflow':False,'screenshotBytes':len(image)}
              finally:
                  proc.terminate()
                  try: proc.wait(timeout=5)
                  except subprocess.TimeoutExpired: proc.kill()

          desktop=run('desktop_1440x1100',1440,1100,9241)
          mobile=run('mobile_390x844',390,844,9242)
          p=Path('pages/coral-mother-r06-pocillopora-t02-noaa-palau/QA_DIRECT.json')
          qa=json.loads(p.read_text(encoding='utf-8'))
          qa['desktopBrowserQA']=True; qa['mobile390x844QA']=True; qa['browserQA']={'desktop':desktop,'mobile':mobile}
          p.write_text(json.dumps(qa,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(qa,ensure_ascii=False))
          PY

      - name: Publish verified T02
        shell: bash
        run: |
          set -euo pipefail
          cd pages
          git config user.name 'Haihao_Nature Grace HK'
          git config user.email 'haihao0307@gmail.com'
          git add coral-mother-r06-pocillopora-t02-noaa-palau/
          if git diff --cached --quiet; then
            echo 'No publication changes.'
          else
            git commit -m 'publish(coral): R06 T02 NOAA Palau classification'
            git pull --rebase origin gh-pages
            git push origin gh-pages
          fi
