name: Weather Mother V1.7.3 geometry probe
on:
  push:
    branches: [gh-pages]
    paths:
      - '.github/workflows/weather-mother-v173-geometry-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - run: |
          python3 -m pip install playwright==1.51.0
          python3 -m playwright install --with-deps chromium
      - run: |
          cat >/tmp/probe.py <<'PY'
          import json,time
          from playwright.sync_api import sync_playwright
          url='https://haihao0307.github.io/guilin-dem-pipeline/weather-mother/studio-v073/?module=world&t='+str(time.time_ns())
          with sync_playwright() as p:
            b=p.chromium.launch(headless=True,args=['--no-sandbox','--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader'])
            c=b.new_context(viewport={'width':430,'height':932},screen={'width':430,'height':932},is_mobile=True,has_touch=True,device_scale_factor=3)
            page=c.new_page();page.goto(url,wait_until='domcontentloaded',timeout=60000)
            page.wait_for_function("window.__WEATHER_MOTHER_STUDIO__?.version==='0.7.3-iphone-max-adaptive'",timeout=60000)
            before=page.evaluate("""()=>({state:__WEATHER_MOTHER_STUDIO__.getState(),inner:[innerWidth,innerHeight],client:[document.documentElement.clientWidth,document.documentElement.clientHeight],screen:[screen.width,screen.height],visual:visualViewport&&[visualViewport.width,visualViewport.height,visualViewport.scale],app:getComputedStyle(document.documentElement).getPropertyValue('--app-h'),launcher:document.querySelector('#launcher').getBoundingClientRect().toJSON(),sheet:document.querySelector('#sheet').getBoundingClientRect().toJSON(),sheetHeight:document.querySelector('#sheet').style.height})""")
            page.locator('#launcher').click();page.wait_for_timeout(200)
            after=page.evaluate("""()=>{const e=document.querySelector('#sheet'),b=e.getBoundingClientRect();return{state:__WEATHER_MOTHER_STUDIO__.getState(),inner:[innerWidth,innerHeight],client:[document.documentElement.clientWidth,document.documentElement.clientHeight],screen:[screen.width,screen.height],visual:visualViewport&&[visualViewport.width,visualViewport.height,visualViewport.scale],app:getComputedStyle(document.documentElement).getPropertyValue('--app-h'),sheet:{...b.toJSON(),heightCSS:getComputedStyle(e).height,inline:e.style.height,transform:getComputedStyle(e).transform,snap:e.dataset.snap},launcher:document.querySelector('#launcher').getBoundingClientRect().toJSON()}}""")
            print(json.dumps({'before':before,'after':after},ensure_ascii=False,indent=2))
            b.close()
          PY
          xvfb-run -a python3 -u /tmp/probe.py
