name: Human R03 reference and native recovery audit
on:
  push:
    branches: [test/human-r03-reference-recovery-20261013]
    paths: ['.github/workflows/human-r03-reference-recovery.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install --no-save --package-lock=false playwright@1.58.2 esbuild@0.25.11
      - run: npx playwright install --with-deps chromium
      - name: Inspect public reference, then recover own pinned baseline for local debugging
        run: |
          mkdir -p audit/reference audit/native
          cat > audit.cjs <<'JS'
          const {chromium}=require('playwright'),fs=require('fs'),crypto=require('crypto');
          const sha=b=>crypto.createHash('sha256').update(b).digest('hex');
          (async()=>{
            let browser=await chromium.launch({headless:true,args:['--no-sandbox','--use-angle=swiftshader','--enable-unsafe-swiftshader','--enable-unsafe-webgpu']});
            const p=await browser.newPage({viewport:{width:1600,height:1200},deviceScaleFactor:1});
            const r={url:'https://lo-th.github.io/head/',errors:[],requests:[],screens:[],physicalGPU:false,assetsImported:false};
            p.on('pageerror',e=>r.errors.push(String(e)));p.on('console',m=>{if(m.type()==='error')r.errors.push(m.text().slice(0,6000));});p.on('response',q=>r.requests.push({url:q.url(),status:q.status()}));
            try{
              await p.goto(r.url,{waitUntil:'domcontentloaded',timeout:90000});
              await p.waitForFunction(()=>document.querySelector('canvas'),null,{timeout:90000});
              await p.waitForTimeout(20000);
              await p.screenshot({path:'audit/reference/initial.png',timeout:90000});r.screens.push('initial.png');
              r.body=await p.locator('body').innerText();
              r.controls=await p.evaluate(()=>Array.from(document.querySelectorAll('input,select,button')).map(e=>({tag:e.tagName,type:e.type,title:e.title,text:e.innerText,value:e.value,options:e.options?Array.from(e.options).map(x=>({text:x.text,value:x.value})):undefined})));
              await p.waitForTimeout(15000);
              await p.screenshot({path:'audit/reference/settled.png',timeout:90000});r.screens.push('settled.png');
              const box=await p.locator('canvas').first().boundingBox();if(box){await p.mouse.move(box.x+box.width*.5,box.y+box.height*.5);await p.mouse.wheel(0,-260);await p.waitForTimeout(1500);await p.screenshot({path:'audit/reference/closer.png',timeout:90000});r.screens.push('closer.png');}
            }catch(e){r.failure=String(e);await p.screenshot({path:'audit/reference/failure.png',timeout:30000}).catch(()=>{});}
            fs.writeFileSync('audit/reference/report.json',JSON.stringify(r,null,2));await p.close();
            const q=await browser.newPage({viewport:{width:1400,height:1000},deviceScaleFactor:1});const n={url:'https://htmlpreview.github.io/?https://raw.githubusercontent.com/haihao0307/guilin-dem-pipeline/518cc9bd85b9aec53d8abbeffe303d1c0d03ddd9/kaopu-unified-human-workbench/skin-folds-r02/preview.html',resources:[],errors:[]},pending=[];
            q.on('pageerror',e=>n.errors.push(String(e)));q.on('response',res=>{if(res.ok()&&/^https:\/\/(raw\.githubusercontent\.com\/haihao0307\/|haihao0307\.github\.io\/)/.test(res.url()))pending.push((async()=>{try{const b=await res.body(),h=sha(b);fs.writeFileSync('audit/native/'+h,b);n.resources.push({url:res.url(),sha256:h,bytes:b.length,type:res.headers()['content-type']});}catch(e){n.errors.push('recover '+res.url()+' '+String(e));}})());});
            try{await q.goto(n.url,{waitUntil:'domcontentloaded',timeout:90000});await q.waitForFunction(()=>window.lifelikeIdle&&window.geometricSkin,null,{timeout:240000});await q.evaluate(()=>lifelikeIdle.pause(true));await q.waitForFunction(()=>lifelikeIdle.ready(),null,{timeout:240000});await q.evaluate(()=>{__IDENTITY_QA__.viewer().view('face');lifelikeIdle.seek(0);});await q.screenshot({path:'audit/native/base-r02.png',timeout:90000});n.report=await q.evaluate(()=>__IDENTITY_QA__.viewer().report());}catch(e){n.failure=String(e);await q.screenshot({path:'audit/native/failure.png',timeout:30000}).catch(()=>{});}
            await Promise.all(pending);fs.writeFileSync('audit/native/resources.json',JSON.stringify(n,null,2));await browser.close();
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
          node audit.cjs
          tar -czf audit/build-tools.tgz node_modules/esbuild node_modules/@esbuild
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: human-r03-reference-native-audit
          path: audit/
          retention-days: 7
