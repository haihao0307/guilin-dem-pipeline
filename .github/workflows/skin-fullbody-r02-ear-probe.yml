name: Skin R02 ear light direction visibility probe
on:
  push:
    branches: [feature/skin-fullbody-r02-20261014]
    paths: ['kaopu-unified-human-workbench/skin-fullbody-r02/ear-light-probe.cjs', '.github/workflows/skin-fullbody-r02-ear-probe.yml']
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            kaopu-unified-human-workbench/skin-fullbody-r02
            kaopu-unified-human-workbench/head-procedural-r01
            kaopu-unified-human-workbench/human-integrated-r06
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: node kaopu-unified-human-workbench/skin-fullbody-r02/build.cjs
      - run: node kaopu-unified-human-workbench/skin-fullbody-r02/ear-light-probe.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skin-fullbody-ear-light-probe-${{ github.run_number }}
          path: ear-light-probe/
          retention-days: 14
