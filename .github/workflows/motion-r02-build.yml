name: Motion R02 Build and Public Verification
on:
  push:
    branches: [feature/motion-r02-thumb-cycles-20261013]
    paths:
      - .github/workflows/motion-r02-build.yml
      - kaopu-unified-human-workbench/motion-review-r02/**
permissions:
  contents: write
concurrency:
  group: motion-r02-build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WORK: kaopu-unified-human-workbench/motion-review-r02
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/motion-r02-thumb-cycles-20261013
          sparse-checkout: |
            kaopu-unified-human-workbench
            .github/workflows
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save esbuild@0.25.10 playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: python -m pip install numpy scipy
      - name: Generate new R02 sources and correct explicit test API argument
        run: |
          python "$WORK/prepare_sources.py"
          python "$WORK/install.py"
          python - <<'PY'
          import os,pathlib
          p=pathlib.Path(os.environ['WORK'])/'verify.cjs';s=p.read_text();a=',{timeout:200000})';b=',null,{timeout:200000})'
          if a in s:assert s.count(a)==1;s=s.replace(a,b);p.write_text(s)
          assert b in s
          PY
          node --check "$WORK/Workbench.mjs"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$WORK"
          if ! git diff --cached --quiet; then git commit -m 'source(motion-r02): captured cycles, thumb runtime and correct startup test API'; fi
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Build new fixed-person preview
        run: node "$WORK/build.cjs"
      - name: Candidate actual-browser tests and thumb images
        env:
          QA_OUT: r02-evidence/candidate
        run: timeout 420 node "$WORK/verify.cjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: motion-r02-candidate-${{ github.run_number }}
          path: r02-evidence/candidate
          retention-days: 14
      - name: Publish immutable new workbench only
        run: |
          git add "$WORK"
          git commit -m 'build(motion-r02): verified candidate preview and provenance'
          git push origin HEAD:feature/motion-r02-thumb-cycles-20261013
          echo "BUILD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "QA_URL=https://htmlpreview.github.io/?https://raw.githubusercontent.com/haihao0307/guilin-dem-pipeline/$(git rev-parse HEAD)/$WORK/preview.html" >> "$GITHUB_ENV"
      - name: Check public build bytes
        run: |
          python - <<'PY'
          import os,json,urllib.request,hashlib
          work=os.environ['WORK'];url='https://raw.githubusercontent.com/haihao0307/guilin-dem-pipeline/'+os.environ['BUILD_SHA']+'/'+work+'/preview.html'
          data=urllib.request.urlopen(url,timeout=100).read();assert hashlib.sha256(data).hexdigest()==json.load(open(work+'/BUILD.json'))['outputHTMLSHA256']
          PY
      - name: Exact-public continuous motion, thumb and natural gesture verification
        env:
          QA_OUT: r02-evidence/public
          QA_FULL: '1'
        run: timeout 540 node "$WORK/verify.cjs"
      - name: Record public result without implying artistic acceptance
        run: |
          python - <<'PY'
          import os,pathlib,json
          p=pathlib.Path(os.environ['WORK']);q=json.load(open('r02-evidence/public/qa.json'));assert q['pass']
          (p/'PUBLIC_QA.json').write_text(json.dumps(q,ensure_ascii=False,indent=2))
          (p/'DELIVERY.json').write_text(json.dumps({'version':'MOTION-REVIEW-R02','sourceCommit':os.environ['SOURCE_SHA'],'buildCommit':os.environ['BUILD_SHA'],'publicURL':os.environ['QA_URL'],'run':os.environ['GITHUB_RUN_ID'],'checks':len(q['checks']),'publicVerified':True,'visualReview':'pending actual screenshot inspection','userAccepted':False,'productionReady':False,'physicalPhoneTested':False,'consumerGPU60FPSCertified':False},ensure_ascii=False,indent=2))
          PY
          git add "$WORK/PUBLIC_QA.json" "$WORK/DELIVERY.json"
          git commit -m 'test(motion-r02): exact public QA with explicit performance and acceptance limits'
          git push origin HEAD:feature/motion-r02-thumb-cycles-20261013
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: motion-r02-${{ github.run_number }}
          path: |
            r02-evidence
            kaopu-unified-human-workbench/motion-review-r02
          retention-days: 14
