name: MP05-R2 recovered public runtime
on:
  push:
    branches: [perf/tailor-mp05-fast-runtime-20261013]
    paths: [.github/workflows/tailor-mp05-resume-release.yml,kaopu-tailor-workbench/material-products/mp05-resume/**]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    outputs:
      source: ${{ steps.publish.outputs.source }}
      public: ${{ steps.publish.outputs.public }}
      url: ${{ steps.publish.outputs.url }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: project
          sparse-checkout: kaopu-tailor-workbench/material-products/mp05-resume
      - uses: actions/download-artifact@v4
        with:
          repository: haihao0307/guilin-dem-pipeline
          run-id: 38379326592
          github-token: ${{ github.token }}
          name: mp05-inspected-runtime
          path: runtime
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply recovery and retain complete normative source
        run: |
          python project/kaopu-tailor-workbench/material-products/mp05-resume/resume-runtime.py runtime
          cp project/kaopu-tailor-workbench/material-products/mp05-resume/qa-resume.cjs runtime/qa-resume.cjs
          python - <<'PY'
          import pathlib
          p=pathlib.Path('runtime/qa-resume.cjs');s=p.read_text();s=s.replace('window.__MP05__?.audit().bootReadyMS!==null&&','');p.write_text(s)
          PY
          node --check runtime/app.mjs
          node --check runtime/fast-motion-controller.mjs
          node --check runtime/adaptive-solid.mjs
          node --check runtime/qa-resume.cjs
          node runtime/unit.mjs
          node runtime/test-fast.mjs
          node runtime/test-render.mjs
      - name: Add new immutable candidate without overwriting earlier public versions
        id: publish
        run: python runtime/_build/publish-snapshot.py runtime project
      - uses: actions/upload-artifact@v4
        with:
          name: mp052-runtime
          path: runtime
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mp052-stage
          path: /tmp/MP04_PUBLIC_STAGE.json
          retention-days: 30
  bytes:
    needs: stage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate actual public bytes and version
        env:
          URL: ${{ needs.stage.outputs.url }}
          SOURCE: ${{ needs.stage.outputs.source }}
        run: |
          python - <<'PY'
          import os,json,time,urllib.request,hashlib,concurrent.futures
          base=os.environ['URL'];source=os.environ['SOURCE'];m=None
          def read(n):
              with urllib.request.urlopen(base+n,timeout=60) as r:return r.read()
          for i in range(72):
              try:
                  m=json.loads(read('BUILD_MANIFEST.json'))
                  if m['sourceCommit']==source:break
              except Exception:pass
              time.sleep(10)
          assert m and m['sourceCommit']==source and m['version']=='MP05-R2'
          def check(item):
              n,e=item;b=read(n);assert len(b)==e['bytes'] and hashlib.sha256(b).hexdigest()==e['sha256'],n;return n
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:checked=list(pool.map(check,m['files'].items()))
          json.dump({'passed':True,'source':source,'url':base,'fileCount':len(checked),'files':checked},open('/tmp/PUBLIC_BYTES.json','w'),indent=2)
          print('PUBLIC_BYTES',source,len(checked))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mp052-public-bytes
          path: /tmp/PUBLIC_BYTES.json
  browser:
    needs: [stage,bytes]
    runs-on: ubuntu-latest
    timeout-minutes: 14
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        look: [K04,L04,D01]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mp052-runtime
          path: runtime
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.58.2 && npx playwright install --with-deps chromium
      - name: Functional proof plus separately recorded original and thirty FPS criteria
        env:
          QA_URL: ${{ needs.stage.outputs.url }}
          RUNTIME_SOURCE: ${{ needs.stage.outputs.source }}
          QA_LOOK: ${{ matrix.look }}
        run: node runtime/qa-resume.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mp052-public-${{ matrix.look }}
          path: runtime/evidence-${{ matrix.look }}
          retention-days: 30
  receipt:
    if: ${{ always() && needs.stage.result == 'success' && needs.bytes.result == 'success' }}
    needs: [stage,bytes,browser]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.stage.outputs.source }}
          sparse-checkout: kaopu-tailor-workbench/material-products/r05-2
      - uses: actions/download-artifact@v4
        with:
          pattern: mp052-public-*
          path: /tmp/evidence
      - name: Archive both met and unmet targets without reclassifying performance failure
        env:
          URL: ${{ needs.stage.outputs.url }}
          SOURCE: ${{ needs.stage.outputs.source }}
          PUBLIC: ${{ needs.stage.outputs.public }}
        run: |
          python - <<'PY'
          import pathlib,json,os,shutil
          e=pathlib.Path('/tmp/evidence');reports=[json.loads(p.read_text()) for p in e.rglob('BROWSER_REPORT.json')]
          valid=len(reports)==3 and all(r['functionalPassed'] for r in reports)
          state={'version':'MP05-R2','fixedURL':os.environ['URL'],'sourceCommit':os.environ['SOURCE'],'publicCommit':os.environ['PUBLIC'],'candidateFunctionallyVerified':valid,'performanceTargetPassed':valid and all(r['performanceTargetPassed'] for r in reports),'fullUserTaskComplete':False,'userAccepted':False,'physicalDeviceTested':False,'freeClothRealtime':False,'referencePhysicsUnchanged':True,'standardMotionBakes':sum(m['solverMessages'] for r in reports for m in r['motions']),'cachedMotionLooks':['K04','L04','D01','D04'],'run':os.environ['GITHUB_RUN_ID'],'summaries':[{'look':r['look'],'coldMS':r.get('coldFirstCompleteFrameMS'),'warmMS':r.get('warmFirstCompleteFrameMS'),'functionalPassed':r['functionalPassed'],'originalMP05TimingCriterionPassed':r.get('originalMP05TimingCriterionPassed'),'performanceTargetPassed':r['performanceTargetPassed'],'motions':[{'id':m['motion'],'activationMS':m['activationMS'],'playbackMS':m['playbackMS'],'actualCompletedFPS':m['deliveredFPS']} for m in r['motions']],'errors':r['errors']} for r in reports]}
          p=pathlib.Path('kaopu-tailor-workbench/material-products/r05-2');shutil.copytree(e,p/'recovery-evidence',dirs_exist_ok=True);(p/'PUBLIC_DELIVERY.json').write_text(json.dumps(state,ensure_ascii=False,indent=2))
          text='# MP05-R2 当前接续\n\n'+state['fixedURL']+'?look=K04\n\n原任务12557b931cfe7ea6da4f4ef65fffaa8577530093停在软件渲染诊断，不应重新做MP03。现在完整运行源在本目录，旧网页保留。\n\n本轮修复图形忙时CPU重复更新、外观切换丢失姿势、串行载入、同步着色器预热和错误缓存无法重试。标准动作不启动整段bake，不读取人体SDF；同一人体和衣形、原物理约束与缓存保持。\n\n功能验证：'+str(valid)+'。30FPS/秒级目标验证：'+str(state['performanceTargetPassed'])+'。两者不得混为一谈，工作流成功不代表用户的全部性能目标达成。\n\n完整交付未完成：任意身材/材料自由实时求解、全动作连续过渡、完整自碰撞/CCD、最新R15微毛羽整合及真实设备帧率认证仍欠缺。软件Chromium不是消费GPU或手机实机；标准屏幕尺度材料是近似，特写原生纱线保留。所有实测结果见PUBLIC_DELIVERY.json与recovery-evidence。\n'
          (p/'CURRENT_HANDOFF.md').write_text(text)
          print(json.dumps(state,ensure_ascii=False,indent=2))
          PY
      - name: Preserve factual evidence by fast-forward only
        env:
          SOURCE: ${{ needs.stage.outputs.source }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin perf/tailor-mp05-fast-runtime-20261013 --depth=1
          test "$(git rev-parse origin/perf/tailor-mp05-fast-runtime-20261013)" = "$SOURCE"
          git add -f kaopu-tailor-workbench/material-products/r05-2/PUBLIC_DELIVERY.json kaopu-tailor-workbench/material-products/r05-2/CURRENT_HANDOFF.md kaopu-tailor-workbench/material-products/r05-2/recovery-evidence
          git commit -m 'docs(mp05-r2): retain actual public timings and unmet real-time targets [skip ci]'
          git push origin HEAD:refs/heads/perf/tailor-mp05-fast-runtime-20261013
