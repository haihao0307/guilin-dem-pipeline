name: Palau R19 EGM96 Grid Intake

on:
  push:
    branches:
      - work/palau-airai-r19-authority-locked-restart-20260922
    paths:
      - .github/workflows/palau-r19-egm96-grid-intake.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  geoid-grid:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download official PROJ/NGA EGM96 15-minute geoid grid
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p r19-egm96
          curl --fail --location --retry 5 --retry-all-errors \
            https://cdn.proj.org/us_nga_egm96_15.tif \
            -o r19-egm96/us_nga_egm96_15.tif
          test -s r19-egm96/us_nga_egm96_15.tif
          sha256sum r19-egm96/us_nga_egm96_15.tif | tee r19-egm96/SHA256SUMS.txt

      - name: Record source identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          p=Path('r19-egm96/us_nga_egm96_15.tif')
          receipt={
            'schema':'kaopu.palau.r19-egm96-grid-intake/1.0',
            'sourceUrl':'https://cdn.proj.org/us_nga_egm96_15.tif',
            'producer':'US NGA; converted and distributed by OSGeo PROJ-data',
            'model':'EGM96 15-minute geoid undulation grid',
            'bytes':p.stat().st_size,
            'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),
            'purpose':'Reverse ASF MapReady EGM96 orthometric-to-ellipsoid adjustment for the uploaded ALOS RTC ancillary DEMs.',
            'productionRasterCreated':False,
            'visualAcceptance':False,
            'productionReady':False,
          }
          Path('r19-egm96/RECEIPT.json').write_text(json.dumps(receipt,indent=2),encoding='utf-8')
          print(json.dumps(receipt,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: palau-r19-egm96-grid
          path: r19-egm96/
          if-no-files-found: error
          retention-days: 30
