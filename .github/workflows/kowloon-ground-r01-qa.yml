name: Verify source-bound ground and basement fields
on:
  push:
    branches: ['trial/kowloon-ground-basement-r01-20261021']
permissions:
  contents: read
jobs:
  ground-field:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            kaopu-geography-workbench/kowloon-building-mother-r01
            kaopu-geography-workbench/hk-three-buildings-r01
      - name: Datum, field joins, holes and immutable source tests
        run: node --test kaopu-geography-workbench/kowloon-building-mother-r01/tests/ground-*.test.mjs
      - name: Install pinned browser
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Exact HTTPS files, all three basement cases and preserved mobile entry
        run: timeout 420s python -u kaopu-geography-workbench/kowloon-building-mother-r01/tests/ground-field-browser.py --public --base https://haihao0307.github.io/guilin-dem-pipeline/kaopu-geography-workbench/kowloon-building-mother-r01/ --output kaopu-geography-workbench/kowloon-building-mother-r01/evidence/ground-public-r01
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: ground-public-r01-${{ github.sha }}
          path: kaopu-geography-workbench/kowloon-building-mother-r01/evidence/ground-public-r01
          retention-days: 1
