name: Survivor Palau V0.1.2 visual gate v2

on:
  push:
    branches:
      - game/survivor-palau-v001-20260917
    paths:
      - .github/workflows/survivor-palau-v012-release-v2.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: survivor-palau-v012-release-v2
  cancel-in-progress: true

jobs:
  rebuild-verify-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Rebuild exact V0.1.2 candidate
        shell: bash
        run: |
          set -euo pipefail
          cat games/survivor-palau/source/v012_patch.part01.txt | base64 -d | gzip -d > /tmp/patch_v012_visual.py
          echo '4b7715c1073ce1ddde3d07baec07c245b27e93e736a4d56637c74a4e8125ac56  /tmp/patch_v012_visual.py' | sha256sum -c -
          python3 /tmp/patch_v012_visual.py
          OUT=games/survivor-palau/releases/v0.1.2/Survivor_Palau_V0.1.2_Karst_Surf_Canoe_Direct_Open.html
          echo '333215c87a28707748f6df52b56e6e2f521b071f18b7c24c3c65a3a3cc99e4e4  '"$OUT" | sha256sum -c -
          test "$(wc -c < "$OUT")" -eq 146454
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('games/survivor-palau/releases/v0.1.2/Survivor_Palau_V0.1.2_Karst_Surf_Canoe_Direct_Open.html')
          s=p.read_text(encoding='utf-8')
          assert s.count('<canvas')==1 and '<iframe' not in s
          for m in ['SURVIVOR: PALAU','survivor-palau-karst-surf-canoe-v012','karstFormationCount','canoePrototype','naturalBreakerField']:
              assert m in s,m
          q=re.search(r'<script type="module">(.*)</script>',s,re.S); assert q
          Path('/tmp/v012.mjs').write_text(q.group(1),encoding='utf-8')
          PY
          node --check /tmp/v012.mjs

      - name: Screenshot-first local Chromium QA
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -q playwright
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          cat >/tmp/v012_local.py <<'PY'
          from playwright.sync_api import sync_playwright
          from pathlib import Path
          import json,shutil
          pth=Path('games/survivor-palau/releases/v0.1.2/Survivor_Palau_V0.1.2_Karst_Surf_Canoe_Direct_Open.html').resolve()
          report={'format':'survivor-palau-v012-local-visual-gate-v2','consoleErrors':[],'pageErrors':[],'requestFailures':[],'passed':False}
          chrome=shutil.which('google-chrome') or shutil.which('google-chrome-stable') or shutil.which('chromium'); assert chrome
          with sync_playwright() as p:
              browser=p.chromium.launch(executable_path=chrome,headless=False,args=['--no-sandbox','--enable-webgl','--ignore-gpu-blocklist','--use-angle=swiftshader','--enable-unsafe-swiftshader','--allow-file-access-from-files'])
              page=browser.new_page(viewport={'width':1600,'height':950})
              page.on('console',lambda m: report['consoleErrors'].append(m.text) if m.type=='error' else None)
              page.on('pageerror',lambda e: report['pageErrors'].append(str(e)))
              page.on('requestfailed',lambda r: report['requestFailures'].append({'url':r.url,'failure':str(r.failure)}))
              page.goto(pth.as_uri()+'?qa=1',wait_until='load',timeout=30000)
              page.wait_for_function("() => document.body.dataset.qaReady==='true' && window.OceanMotherR018?.qa?.ready",timeout=120000)
              qa=page.evaluate("() => window.OceanMotherR018.qa")
              for view in ['overview','karst','breaker','canoe','deepfish']:
                  page.locator(f'[data-view="{view}"]').click(); page.wait_for_timeout(1700); page.screenshot(path=f'/tmp/v012-{view}.png',full_page=True)
              probe=qa.get('visualProbe') or {}
              report.update({'webgl2':qa.get('webgl2'),'glError':qa.get('glError',0),'qaErrors':qa.get('errors',[]),'visualProbe':probe,'karstFormationCount':qa.get('karstFormationCount'),'treeCount':qa.get('treeCount'),'canoeCount':qa.get('canoeCount'),'foamActiveCells':qa.get('foamActiveCells'),'curlLayerTriangles':qa.get('curlLayerTriangles')})
              assert qa.get('webgl2') is True and qa.get('glError',0)==0 and not qa.get('errors')
              assert qa.get('karstFormationCount',0)>=10 and qa.get('treeCount',0)>=50 and qa.get('canoeCount',0)==1 and qa.get('foamActiveCells',0)>=20
              assert probe.get('nearWhiteRatio',0)>=0.00030,probe
              report['passed']=not report['consoleErrors'] and not report['pageErrors'] and not report['requestFailures']
              browser.close()
          Path('/tmp/v012_local_qa.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          assert report['passed'],report
          PY
          xvfb-run -a python3 /tmp/v012_local.py

      - name: Commit verified candidate
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          ROOT=games/survivor-palau/releases/v0.1.2
          cp /tmp/v012_local_qa.json "$ROOT/BROWSER_QA_V2.json"
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add "$ROOT"
          git commit -m 'publish(game): Survivor Palau V0.1.2 screenshot-first verified'
          git push origin HEAD:game/survivor-palau-v001-20260917
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Fixed-commit public Chromium QA
        shell: bash
        env:
          COMMIT: ${{ steps.publish.outputs.commit }}
        run: |
          set -euo pipefail
          PATHNAME=games/survivor-palau/releases/v0.1.2/Survivor_Palau_V0.1.2_Karst_Surf_Canoe_Direct_Open.html
          URL="https://raw.githack.com/haihao0307/guilin-dem-pipeline/$COMMIT/$PATHNAME"
          for n in $(seq 1 30); do
            if curl -fsSL --retry 2 "$URL" -o /tmp/v012-public.html; then
              SHA=$(sha256sum /tmp/v012-public.html | awk '{print $1}'); [ "$SHA" = '333215c87a28707748f6df52b56e6e2f521b071f18b7c24c3c65a3a3cc99e4e4' ] && break
            fi
            sleep 4
          done
          echo '333215c87a28707748f6df52b56e6e2f521b071f18b7c24c3c65a3a3cc99e4e4  /tmp/v012-public.html' | sha256sum -c -
          cat >/tmp/v012_public.py <<'PY'
          from playwright.sync_api import sync_playwright
          from pathlib import Path
          import json,os,shutil
          commit=os.environ['COMMIT']; path='games/survivor-palau/releases/v0.1.2/Survivor_Palau_V0.1.2_Karst_Surf_Canoe_Direct_Open.html'
          url=f'https://raw.githack.com/haihao0307/guilin-dem-pipeline/{commit}/{path}?qa=1'
          report={'format':'survivor-palau-v012-public-visual-gate-v2','url':url,'commit':commit,'consoleErrors':[],'pageErrors':[],'requestFailures':[],'passed':False}
          chrome=shutil.which('google-chrome') or shutil.which('google-chrome-stable') or shutil.which('chromium'); assert chrome
          with sync_playwright() as p:
              browser=p.chromium.launch(executable_path=chrome,headless=False,args=['--no-sandbox','--enable-webgl','--ignore-gpu-blocklist','--use-angle=swiftshader','--enable-unsafe-swiftshader'])
              context=browser.new_context(viewport={'width':1600,'height':950})
              context.add_cookies([{'name':'__Http-phish','value':'1','url':'https://raw.githack.com/','secure':True,'httpOnly':True,'sameSite':'Lax'}])
              page=context.new_page()
              page.on('console',lambda m: report['consoleErrors'].append(m.text) if m.type=='error' else None)
              page.on('pageerror',lambda e: report['pageErrors'].append(str(e)))
              page.on('requestfailed',lambda r: report['requestFailures'].append({'url':r.url,'failure':str(r.failure)}))
              response=page.goto(url,wait_until='load',timeout=60000); assert response and response.ok
              page.wait_for_function("() => document.body.dataset.qaReady==='true' && window.OceanMotherR018?.qa?.ready",timeout=120000)
              qa=page.evaluate("() => window.OceanMotherR018.qa"); probe=qa.get('visualProbe') or {}
              for view in ['overview','karst','breaker','canoe','deepfish']:
                  page.locator(f'[data-view="{view}"]').click(); page.wait_for_timeout(1500); page.screenshot(path=f'/tmp/v012-public-{view}.png',full_page=True)
              assert qa.get('webgl2') is True and qa.get('glError',0)==0 and not qa.get('errors')
              assert qa.get('karstFormationCount',0)>=10 and qa.get('treeCount',0)>=50 and qa.get('canoeCount',0)==1 and qa.get('foamActiveCells',0)>=20
              assert probe.get('nearWhiteRatio',0)>=0.00030,probe
              report.update({'httpStatus':response.status,'webgl2':qa.get('webgl2'),'glError':qa.get('glError',0),'qaErrors':qa.get('errors',[]),'visualProbe':probe,'karstFormationCount':qa.get('karstFormationCount'),'treeCount':qa.get('treeCount'),'canoeCount':qa.get('canoeCount'),'foamActiveCells':qa.get('foamActiveCells')})
              report['passed']=not report['consoleErrors'] and not report['pageErrors'] and not report['requestFailures']; browser.close()
          Path('/tmp/v012_public_qa.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8'); assert report['passed'],report
          PY
          xvfb-run -a python3 /tmp/v012_public.py

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Survivor_Palau_V0.1.2_Visual_Gate_V2
          path: |
            /tmp/v012_local_qa.json
            /tmp/v012-overview.png
            /tmp/v012-karst.png
            /tmp/v012-breaker.png
            /tmp/v012-canoe.png
            /tmp/v012-deepfish.png
            /tmp/v012-public.html
            /tmp/v012_public_qa.json
            /tmp/v012-public-overview.png
            /tmp/v012-public-karst.png
            /tmp/v012-public-breaker.png
            /tmp/v012-public-canoe.png
            /tmp/v012-public-deepfish.png
          if-no-files-found: warn
          retention-days: 90
