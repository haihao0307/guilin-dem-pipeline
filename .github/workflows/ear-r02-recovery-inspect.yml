name: Ear R02 recover frozen runtime evidence
on:
  push:
    branches: [fix/ear-growth-r02-recovery-20261011]
    paths: [.github/workflows/ear-r02-recovery-inspect.yml]
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: kaopu-unified-human-workbench/ear-structure
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pinned inspection browser
        run: |
          mkdir -p /tmp/ear-tools
          cd /tmp/ear-tools
          npm init -y >/dev/null
          npm install playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Cache immutable dependencies and write index before capture
        run: |
          mkdir -p ear-recovery-evidence/http
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/ear-recovery-http.log 2>&1 &
          cat >/tmp/ear-tools/recover.cjs <<'JS'
          const {chromium}=require('playwright'),fs=require('fs'),path=require('path'),crypto=require('crypto');
          (async()=>{
            const out=path.resolve(process.env.GITHUB_WORKSPACE,'ear-recovery-evidence'),b=await chromium.launch({headless:true,args:['--no-sandbox','--use-angle=swiftshader','--enable-unsafe-swiftshader']}),p=await b.newPage({viewport:{width:1000,height:760}}),pending=[],rows=[],errors=[];
            p.setDefaultTimeout(90000);
            p.on('pageerror',e=>{errors.push(String(e));fs.writeFileSync(out+'/errors.json',JSON.stringify(errors));});
            p.on('response',r=>{if(!/^https:\/\/raw\.githubusercontent\.com\//.test(r.url())||!r.ok())return;pending.push((async()=>{try{const bytes=await r.body(),hash=crypto.createHash('sha256').update(bytes).digest('hex');fs.writeFileSync(out+'/http/'+hash,bytes);rows.push({url:r.url(),sha256:hash,bytes:bytes.length,contentType:r.headers()['content-type']||'application/octet-stream'});fs.writeFileSync(out+'/http/index.json',JSON.stringify(rows,null,2));}catch(e){rows.push({url:r.url(),error:String(e)});}})());});
            await p.goto('http://127.0.0.1:8765/kaopu-unified-human-workbench/ear-structure/preview.html',{waitUntil:'domcontentloaded',timeout:120000});
            await p.waitForFunction(()=>window.earWorkbench&&__IDENTITY_QA__.viewer().skin.naturalEyeExtension.ready,null,{timeout:180000});
            await Promise.all(pending);fs.writeFileSync(out+'/http/index.json',JSON.stringify(rows,null,2));
            const report=await p.evaluate(()=>earWorkbench.report());fs.writeFileSync(out+'/A1-report.json',JSON.stringify(report,null,2));
            const d=await p.evaluate(()=>{const v=__IDENTITY_QA__.viewer(),s=v.currentEar.source;const attrs=Object.fromEntries(Object.entries(s.attributes).map(([k,a])=>[k,{size:a.itemSize,array:Array.from(a.array)}]));return {source:{attributes:attrs,index:Array.from(s.index.array)},settings:earWorkbench.settings()};});fs.writeFileSync(out+'/A1-source-geometry.json',JSON.stringify(d));
            await p.evaluate(()=>{earWorkbench.open();earWorkbench.view('left');earWorkbench.view('macro');});
            await p.screenshot({path:out+'/A1-macro.png',timeout:90000});
            fs.writeFileSync(out+'/inspection.json',JSON.stringify({errors,responses:rows.length},null,2));await b.close();if(errors.length)throw Error(errors.join('\n'));
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node /tmp/ear-tools/recover.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ear-r02-runtime-index
          path: ear-recovery-evidence
          retention-days: 14
