name: farmland-r045-round34-qa
on:
  push:
    branches:
      - restart/farmland-object-dna-v020-20260907
    paths:
      - 'farmland-object-dna/research/r045-autonomous-rebuild/round-34/r045_round34_kernel.mjs'
      - 'farmland-object-dna/research/r045-autonomous-rebuild/round-34/r045_round34_qa.mjs'
      - 'farmland-object-dna/research/r045-autonomous-rebuild/round-34/r045_round34_audit.html'
      - '.github/workflows/farmland-r045-round34-qa.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Generate numeric result
        shell: bash
        run: node farmland-object-dna/research/r045-autonomous-rebuild/round-34/r045_round34_qa.mjs
      - name: Gate numeric QA
        if: always()
        run: node -e "let r=require('./farmland-object-dna/research/r045-autonomous-rebuild/round-34/r045_round34_qa_result.json');console.log(r.passedCount+'/'+r.gateCount);if(!r.passed){for(const c of r.checks.filter(x=>!x.pass))console.error('FAIL',c.name,JSON.stringify(c.value),'limit',c.limit);process.exit(2)}"
      - name: Browser fixed-view A-B gate
        if: always()
        shell: bash
        run: |
          set +e
          ROOT="$PWD"
          PAGE='http://127.0.0.1:8134/farmland-object-dna/research/r045-autonomous-rebuild/round-34/r045_round34_audit.html'
          OUT="$ROOT/farmland-object-dna/research/r045-autonomous-rebuild/round-34"
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          rm -f "$OUT/r045_round34_fixed_view.png"
          python3 -m http.server 8134 --bind 127.0.0.1 > /tmp/r045-r34-http.log 2>&1 & SERVER_PID=$!; sleep 2
          if [ -z "$CHROME_BIN" ]; then SHOT_STATUS=127; DOM_STATUS=127; : > /tmp/r045-round34-dom.html; else
            unset DBUS_SESSION_BUS_ADDRESS
            FLAGS=(--headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-background-networking --disable-component-update --disable-sync --disable-extensions --disable-default-apps --disable-domain-reliability --no-first-run --no-default-browser-check --metrics-recording-only --hide-scrollbars --window-size=1400,900 --force-device-scale-factor=1 --virtual-time-budget=2400)
            timeout 45s "$CHROME_BIN" "${FLAGS[@]}" --screenshot="$OUT/r045_round34_fixed_view.png" "$PAGE"; SHOT_STATUS=$?
            timeout 45s "$CHROME_BIN" "${FLAGS[@]}" --dump-dom "$PAGE" > /tmp/r045-round34-dom.html; DOM_STATUS=$?
          fi
          kill "$SERVER_PID" 2>/dev/null || true; grep -q 'data-ready="true"' /tmp/r045-round34-dom.html; READY_STATUS=$?
          export SHOT_STATUS DOM_STATUS READY_STATUS CHROME_BIN OUT
          python3 - <<'PY'
          import json, os
          out=os.environ['OUT']; shot=os.path.join(out,'r045_round34_fixed_view.png')
          r={'chrome_bin':os.environ.get('CHROME_BIN',''),'screenshot_status':int(os.environ.get('SHOT_STATUS','999')),'dom_status':int(os.environ.get('DOM_STATUS','999')),'ready_marker_status':int(os.environ.get('READY_STATUS','999')),'screenshot_exists':os.path.exists(shot),'screenshot_bytes':os.path.getsize(shot) if os.path.exists(shot) else 0}
          r['screenshot_process_clean_exit']=r['screenshot_status']==0;r['render_evidence_present']=r['screenshot_exists'] and r['screenshot_bytes']>20000;r['page_startup_passed']=r['dom_status']==0 and r['ready_marker_status']==0;r['passed']=r['page_startup_passed'] and r['render_evidence_present']
          with open(os.path.join(out,'r045_round34_browser_result.json'),'w') as f: json.dump(r,f,indent=2)
          print(json.dumps(r,indent=2)); raise SystemExit(0 if r['passed'] else 3)
          PY
      - name: Build concise QA summary
        if: always()
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs'); const p='farmland-object-dna/research/r045-autonomous-rebuild/round-34/';
          const q=JSON.parse(fs.readFileSync(p+'r045_round34_qa_result.json','utf8'));let b=null;try{b=JSON.parse(fs.readFileSync(p+'r045_round34_browser_result.json','utf8'))}catch(e){}
          fs.writeFileSync(p+'r045_round34_summary.json',JSON.stringify({version:q.version,passed:q.passed,passedCount:q.passedCount,gateCount:q.gateCount,failed:q.checks.filter(c=>!c.pass),browser:b,metrics:q.metrics},null,2));
          NODE
      - name: Upload R045.34 audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: farmland-r045-round34-audit
          if-no-files-found: warn
          path: |
            farmland-object-dna/research/r045-autonomous-rebuild/round-34/r045_round34_qa_result.json
            farmland-object-dna/research/r045-autonomous-rebuild/round-34/r045_round34_browser_result.json
            farmland-object-dna/research/r045-autonomous-rebuild/round-34/r045_round34_summary.json
            farmland-object-dna/research/r045-autonomous-rebuild/round-34/r045_round34_fixed_view.png
      - name: Persist machine-readable and visual QA evidence
        if: always()
        shell: bash
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add farmland-object-dna/research/r045-autonomous-rebuild/round-34/r045_round34_qa_result.json farmland-object-dna/research/r045-autonomous-rebuild/round-34/r045_round34_browser_result.json farmland-object-dna/research/r045-autonomous-rebuild/round-34/r045_round34_summary.json
          if [ -f farmland-object-dna/research/r045-autonomous-rebuild/round-34/r045_round34_fixed_view.png ]; then git add farmland-object-dna/research/r045-autonomous-rebuild/round-34/r045_round34_fixed_view.png; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'farmland R045.34 persist QA evidence [skip ci]'
          git push origin HEAD:${GITHUB_REF_NAME}
