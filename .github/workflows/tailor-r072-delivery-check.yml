name: Tailor R072 delivery check
on:
  push:
    branches: [fix/tailor-r07-speed-stability-20261008]
    paths:
      - 'kaopu-tailor-workbench/r07/stability/build_r072.py'
      - 'kaopu-tailor-workbench/r07/stability/qa_r072.py'
      - 'kaopu-tailor-workbench/r07/stability/preflight.test.mjs'
      - 'kaopu-tailor-workbench/r07/stability/fit-preflight.mjs'
      - 'kaopu-tailor-workbench/r07/stability/gathering.mjs'
      - 'kaopu-tailor-workbench/catalogue/r072-viewer.mjs'
      - '.github/workflows/tailor-r072-delivery-check.yml'
permissions:
  contents: write
concurrency:
  group: tailor-r072-delivery
  cancel-in-progress: false
jobs:
  full-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            kaopu-tailor-workbench
            kaopu-human-overview
          fetch-depth: 1
      - name: Build R072 and verify unchanged reference bytes
        run: |
          mkdir -p evidence-r072
          sha256sum kaopu-tailor-workbench/catalogue/r06-worker.bundle.mjs kaopu-tailor-workbench/catalogue/r06-workbench-app.mjs kaopu-tailor-workbench/catalogue/r07-worker.bundle.mjs kaopu-tailor-workbench/catalogue/r07-workbench-app.mjs kaopu-tailor-workbench/unified/physics/kernel.ts kaopu-tailor-workbench/unified/physics/kernel.wasm kaopu-tailor-workbench/garments-r04/assets/body-anny-adult.json > evidence-r072/REFERENCE_SHA256.txt
          python kaopu-tailor-workbench/r07/stability/build_r072.py
          node kaopu-tailor-workbench/r07/stability/preflight.test.mjs
          node kaopu-tailor-workbench/r07/stability/audit.test.mjs
          sha256sum -c evidence-r072/REFERENCE_SHA256.txt
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          root=Path('kaopu-tailor-workbench')
          names=['catalogue/r072-workbench-app.mjs','catalogue/r072-worker.bundle.mjs','catalogue/r072-workbench-style.css','catalogue/r072-viewer.mjs','catalogue/r07-workbench-style.css','r07/assembly.mjs','r07/stability/refinement.mjs','r07/stability/audit.mjs','r07/stability/gathering.mjs','r07/stability/fit-preflight.mjs','r07/stability/joint-r072.wasm','r07/stability/r072.html']
          manifest={'version':'R07.2','sourceCommit':os.environ['GITHUB_SHA'],'referenceCommit':'51774b2a0f9c718b11eb5613a7a8268cecb91ed7','runtimeFiles':{str(root/n):hashlib.sha256((root/n).read_bytes()).hexdigest() for n in names},'newSourceBuild':'isolated original R071 builder plus source gathering and sizing preflight','allGarmentsAccepted':False,'dynamicWearCertified':False}
          (root/'r07/stability/R072_MANIFEST.json').write_text(json.dumps(manifest,indent=2))
          PY
      - name: Install test browser
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install chromium --with-deps
      - name: Run full live-source garment and interaction matrix
        run: |
          python -m http.server 8765 >/tmp/tailor-r072-http.log 2>&1 &
          python kaopu-tailor-workbench/r07/stability/qa_r072.py
      - name: Retain only fully tested generated files on feature branch
        if: success()
        run: |
          test "$GITHUB_REF_NAME" = 'fix/tailor-r07-speed-stability-20261008'
          git fetch --no-tags origin "$GITHUB_REF_NAME"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          cp evidence-r072/R072_REPORT.json kaopu-tailor-workbench/r07/stability/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kaopu-tailor-workbench/catalogue/r072-workbench-app.mjs kaopu-tailor-workbench/catalogue/r072-worker.bundle.mjs kaopu-tailor-workbench/catalogue/r072-workbench-style.css kaopu-tailor-workbench/r07/stability/joint-r072.wasm kaopu-tailor-workbench/r07/stability/r072.html kaopu-tailor-workbench/r07/stability/R072_MANIFEST.json kaopu-tailor-workbench/r07/stability/R072_REPORT.json
          git commit -m 'build(tailor): retain R072 full-browser-tested candidate and static geometry results'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          git rev-parse HEAD > evidence-r072/GENERATED_COMMIT.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tailor-r072-evidence
          path: |
            evidence-r072
            kaopu-tailor-workbench/catalogue/r072-*
            kaopu-tailor-workbench/r07/stability/*r072*
            kaopu-tailor-workbench/r07/stability/R072_*
          retention-days: 14
