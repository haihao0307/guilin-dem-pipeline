name: Landscape Karst DEM Field R2.6 Cracks

on:
  push:
    branches:
      - feature/landscape-karst-dem-field-r26-cracks-20260921
    paths:
      - workbenches/landscape-karst-dem-field-r2-6-cracks/build_r26.py
      - workbenches/landscape-karst-dem-field-r2-6-cracks/KARST_DEM_FIELD_PIPELINE_R1.md
      - .github/workflows/landscape-karst-dem-field-r26-cracks.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build R2.6 DEM karst field
        run: |
          python -m py_compile workbenches/landscape-karst-dem-field-r2-6-cracks/build_r26.py
          python workbenches/landscape-karst-dem-field-r2-6-cracks/build_r26.py

      - name: Static contract and shader compilation
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,re
          root=Path('workbenches/landscape-karst-dem-field-r2-6-cracks')
          s=(root/'index.html').read_text(encoding='utf-8')
          b=json.loads((root/'build.json').read_text(encoding='utf-8'))
          required=[
            'PALAU_KARST_DEM_FIELD_R26_CRACKS',
            'DEM 连续山体（默认生产验证）',
            'crackNetwork','pocketField','demFieldBase',
            'uCrackDepth','uCrackWidth','uCrackBranch','uPocketStrength',
            '__KARST_FIELD_CONTRACT__','dataset.karstOutputVisible'
          ]
          for token in required: assert token in s, token
          assert b['schema']=='LANDSCAPE_KARST_DEM_FIELD_R26_CRACKS'
          assert b['defaultMode']=='DEM_CONTINUOUS_FIELD'
          assert b['specimensAreProbes'] is True
          assert b['geometryOperators']['cracksAffectGeometry'] is True
          assert b['geometryOperators']['cracksAreNotMaterialLines'] is True
          for name,file in [('VS','/tmp/r26.vert'),('GEOMETRY_FS','/tmp/r26-geom.frag'),('MATERIAL_FS','/tmp/r26-mat.frag')]:
            m=re.search(rf'const {name}=`(.*?)`;',s,re.S);assert m,name
            Path(file).write_text(m.group(1),encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',s,re.S);assert scripts
          Path('/tmp/r26-app.js').write_text(scripts[-1],encoding='utf-8')
          PY
          node --check /tmp/r26-app.js
          sudo apt-get update -qq
          sudo apt-get install -y -qq glslang-tools
          glslangValidator -S vert /tmp/r26.vert
          glslangValidator -S frag /tmp/r26-geom.frag
          glslangValidator -S frag /tmp/r26-mat.frag

      - name: Run Chromium and capture DEM-field proof
        run: |
          python3 -m http.server 8000 >/tmp/http.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/ >/dev/null; then break; fi
            sleep .25
          done
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)
          if [ -z "$CHROME" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq chromium-browser || sudo apt-get install -y -qq chromium
            CHROME=$(command -v chromium || command -v chromium-browser)
          fi
          URL=http://127.0.0.1:8000/workbenches/landscape-karst-dem-field-r2-6-cracks/index.html
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage \
            --use-angle=swiftshader --enable-unsafe-swiftshader --ignore-gpu-blocklist \
            --run-all-compositor-stages-before-draw --virtual-time-budget=32000 \
            --dump-dom "$URL" >/tmp/r26-dom.html 2>/tmp/r26-chrome.log
          grep -q 'data-karst-ready="true"' /tmp/r26-dom.html
          grep -q 'data-karst-output-visible="true"' /tmp/r26-dom.html
          ! grep -q 'data-karst-failure' /tmp/r26-dom.html
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage \
            --use-angle=swiftshader --enable-unsafe-swiftshader --ignore-gpu-blocklist \
            --run-all-compositor-stages-before-draw --virtual-time-budget=32000 \
            --window-size=1600,1000 --screenshot=/tmp/r26.png "$URL" \
            >/tmp/r26-shot.log 2>&1
          test -s /tmp/r26.png
          test $(stat -c%s /tmp/r26.png) -gt 100000
          mkdir -p /tmp/r26-proof
          cp /tmp/r26.png /tmp/r26-proof/r26.png
          cp /tmp/r26-dom.html /tmp/r26-proof/dom.html
          cp /tmp/r26-chrome.log /tmp/r26-proof/chrome.log
          cp workbenches/landscape-karst-dem-field-r2-6-cracks/build.json /tmp/r26-proof/build.json

      - uses: actions/upload-artifact@v4
        with:
          name: landscape-karst-dem-field-r26-cracks-proof
          path: /tmp/r26-proof
          retention-days: 7

      - name: Materialize browser-tested R2.6
        run: |
          git config user.name "Landscape Mother"
          git config user.email "actions@users.noreply.github.com"
          git add workbenches/landscape-karst-dem-field-r2-6-cracks/index.html \
                  workbenches/landscape-karst-dem-field-r2-6-cracks/build.json
          if git diff --cached --quiet; then
            echo "R2.6 already materialized"
            exit 0
          fi
          git commit -m "feat(landscape): materialize browser-tested R2.6 DEM karst field [skip ci]"
          git push
