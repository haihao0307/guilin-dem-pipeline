name: Material master R01 R02 R03 browser check
on:
  push:
    branches: [main]
    paths:
      - 'kaopu-material-workbench/material-master-r01/**'
      - 'kaopu-material-workbench/material-master-r02/**'
      - 'kaopu-material-workbench/material-master-r03/**'
      - '.github/workflows/material-master-r01-check.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            kaopu-material-workbench/material-master-r01
            kaopu-material-workbench/material-master-r02
            kaopu-material-workbench/material-master-r03
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser tools
        run: |
          mkdir -p "$RUNNER_TEMP/material-qa"
          cd "$RUNNER_TEMP/material-qa"
          npm init -y
          npm install --save-dev playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Check actual rendering and interactions
        env:
          NODE_PATH: ${{ runner.temp }}/material-qa/node_modules
        run: |
          node kaopu-material-workbench/material-master-r01/qa/browser.cjs
          node kaopu-material-workbench/material-master-r02/qa/browser.cjs
          node kaopu-material-workbench/material-master-r03/qa/browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: material-master-r01-r02-r03-browser-evidence
          path: |
            kaopu-material-workbench/material-master-r01/qa/*.png
            kaopu-material-workbench/material-master-r01/qa/browser-receipt.json
            kaopu-material-workbench/material-master-r02/qa/*.png
            kaopu-material-workbench/material-master-r02/qa/browser-receipt.json
            kaopu-material-workbench/material-master-r03/qa/*.png
            kaopu-material-workbench/material-master-r03/qa/browser-receipt.json
          retention-days: 14
