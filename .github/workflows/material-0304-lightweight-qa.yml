name: Material anchor recovery focused QA
on:
  push:
    branches: [qa/material-0304-lightweight-bff7aa6]
    paths:
      - '.github/workflows/material-0304-lightweight-qa.yml'
      - 'kaopu-material-workbench/qa/teacher-0304-public.cjs'
      - 'kaopu-material-workbench/candidate-r16/**'
      - 'kaopu-material-workbench/recovery-candidate/**'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            kaopu-material-workbench/candidate-r16
            kaopu-material-workbench/recovery-candidate
            kaopu-material-workbench/qa
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install official browser test dependencies
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify anchor recovery without deployment
        run: timeout --signal=TERM --kill-after=15s 12m node kaopu-material-workbench/qa/teacher-0304-public.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: material-anchor-recovery-proof
          path: material-anchor-protection-qa/
          retention-days: 14
