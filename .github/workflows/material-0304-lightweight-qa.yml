name: Material 03-04 lightweight public QA
on:
  push:
    branches: [qa/material-0304-lightweight-bff7aa6]
    paths:
      - '.github/workflows/material-0304-lightweight-qa.yml'
      - 'kaopu-material-workbench/qa/teacher-0304-public.cjs'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: kaopu-material-workbench/qa
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install official Playwright 1.55.0 and Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify only the public material workbench
        run: node kaopu-material-workbench/qa/teacher-0304-public.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: material-0304-lightweight-proof
          path: material-qa-output/
          retention-days: 14
