name: Material R16 Wet Stone diagnosis
on:
  push:
    branches: [qa/material-0304-lightweight-bff7aa6]
    paths:
      - '.github/workflows/material-0304-lightweight-qa.yml'
      - 'kaopu-material-workbench/qa/repair-r16/**'
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: kaopu-material-workbench
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install official browser test dependencies
        run: |
          npm install --no-save --ignore-scripts playwright@1.57.0
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: Reproduce unmodified public R16
        run: timeout --signal=TERM --kill-after=15s 12m node kaopu-material-workbench/qa/repair-r16/repro.cjs ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: material-r16-repro-${{ matrix.browser }}
          path: material-r16-repro/
          retention-days: 7
