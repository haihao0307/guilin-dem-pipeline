name: Skin workbench R01 read-only QA
on:
  push:
    branches: [qa/skin-workbench-r01-20261006]
    paths: ['kaopu-skin-workbench/**', '.github/workflows/skin-workbench-r01-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: kaopu-skin-workbench
          filter: blob:none
      - name: Fetch existing public Anny assets
        run: |
          python kaopu-skin-workbench/tools/fetch_anny_public.py
          python kaopu-skin-workbench/tools/unpack_anny.py kaopu-anny-workbench
          mkdir -p kaopu-face-workbench/assets
          curl -fL --retry 2 'https://raw.githubusercontent.com/xrblocks/assets-gnm/134feb02b11fa642a43ff5e7e880246255a74e86/gnm_head_web.bin' -o kaopu-face-workbench/assets/gnm_head_web.bin
          echo 'fd19f46eef6f8bfb725fceab581e1bc8837209997ca3fd43f3c1735003c86961  kaopu-face-workbench/assets/gnm_head_web.bin' | sha256sum -c -
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test browser
        run: |
          npm install --no-save --ignore-scripts --package-lock=false playwright@1.57.0
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: Static server
        run: python -m http.server 8765 > /tmp/skin-server.log 2>&1 &
      - name: Actual browser QA
        working-directory: kaopu-skin-workbench
        env:
          SKIN_BROWSER: ${{ matrix.browser }}
        run: node tests/browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skin-workbench-r01-${{ matrix.browser }}
          path: |
            kaopu-skin-workbench/skin-*.png
            kaopu-skin-workbench/skin-browser-report.json
            /tmp/skin-server.log
