name: Publish KaoPu Coast World R01

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-kaopu-coast-world-r01.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout publisher
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Recover and assemble the self-contained coast world
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsSL \
            https://raw.githubusercontent.com/haihao0307/guilin-dem-pipeline/1e2162f0b49751f3bb16f94ae6f1adb0ce8c1905/.github/workflows/publish-kaopu-coast-world-r01.yml \
            -o /tmp/old-publisher.yml
          awk '/^\/Td6WFo/{copy=1} /^B64$/{if(copy){exit}} copy{print}' \
            /tmp/old-publisher.yml > /tmp/kaopu-coast-world.xz.b64
          test -s /tmp/kaopu-coast-world.xz.b64
          base64 -d /tmp/kaopu-coast-world.xz.b64 | xz -d > /tmp/index.html

          python3 <<'PY'
          from pathlib import Path
          p = Path('/tmp/index.html')
          s = p.read_text(encoding='utf-8')
          old = "init().catch(err=>{console.error(err);loadText.textContent='初始化失败：'+err.message;enterBtn.textContent='Initialization failed'});\nrequestAnimationFrame(animate);"
          new = "init().then(()=>requestAnimationFrame(animate)).catch(err=>{console.error(err);loadText.textContent='初始化失败：'+err.message;enterBtn.textContent='Initialization failed'});"
          if old not in s:
              raise SystemExit('startup race pattern not found')
          s = s.replace(old, new)
          if '<link rel="icon"' not in s:
              s = s.replace(
                  '<title>KaoPu Coast World R01</title>',
                  '<title>KaoPu Coast World R01</title>\n<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2714%27 fill=%27%230b2630%27/%3E%3Cpath d=%27M8 37c9-10 17 8 27-2s15 4 21-4v15H8z%27 fill=%27%237cc8cf%27/%3E%3Ccircle cx=%2742%27 cy=%2719%27 r=%277%27 fill=%27%23e4d0a5%27/%3E%3C/svg%3E">'
              )
          p.write_text(s, encoding='utf-8')
          assert 'init().then(()=>requestAnimationFrame(animate))' in s
          PY

          grep -q 'KaoPu Coast World R01' /tmp/index.html
          grep -q '__KAOPU_READY__' /tmp/index.html
          grep -q 'FIELD ATLAS' /tmp/index.html

          rm -rf site
          git init site
          cd site
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -c protocol.version=2 fetch --depth=1 --filter=blob:none origin gh-pages
          git update-ref refs/heads/gh-pages FETCH_HEAD
          git symbolic-ref HEAD refs/heads/gh-pages
          git reset --mixed HEAD
          rm -rf kaopu-coast-world/r01-20260930
          mkdir -p kaopu-coast-world/r01-20260930
          cp /tmp/index.html kaopu-coast-world/r01-20260930/index.html
          : > kaopu-coast-world/r01-20260930/.nojekyll

      - name: Install browser smoke-test tool
        shell: bash
        run: npm install --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.55.0

      - name: Real Chromium smoke test
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory site >/tmp/kaopu-coast-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill ${SERVER_PID} 2>/dev/null || true' EXIT
          SERVER_READY=false
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/kaopu-coast-world/r01-20260930/ >/dev/null; then
              SERVER_READY=true
              break
            fi
            sleep 1
          done
          test "${SERVER_READY}" = true
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "${CHROME_PATH}"
          export CHROME_PATH
          node <<'NODE'
          const { chromium } = require('playwright-core');
          (async () => {
            const browser = await chromium.launch({
              headless: true,
              executablePath: process.env.CHROME_PATH,
              args: ['--no-sandbox','--disable-dev-shm-usage','--use-gl=angle','--use-angle=swiftshader-webgl','--enable-unsafe-swiftshader']
            });
            const page = await browser.newPage({ viewport: { width: 1440, height: 900 } });
            const errors = [];
            page.on('pageerror', e => errors.push(`pageerror: ${e.message}`));
            page.on('console', m => {
              const text = m.text();
              if (m.type() === 'error' && !text.startsWith('Failed to load resource:')) errors.push(`console: ${text}`);
            });
            page.on('requestfailed', r => errors.push(`requestfailed: ${r.url()} :: ${r.failure()?.errorText}`));
            page.on('response', r => { if (r.status() >= 400 && !r.url().endsWith('/favicon.ico')) errors.push(`http ${r.status()}: ${r.url()}`); });
            const response = await page.goto('http://127.0.0.1:4173/kaopu-coast-world/r01-20260930/?smoke=1', { waitUntil: 'domcontentloaded', timeout: 45000 });
            if (!response || !response.ok()) throw new Error(`HTTP ${response?.status()}`);
            await page.waitForFunction(() => window.__KAOPU_READY__ === true, null, { timeout: 30000 });
            await page.evaluate(() => document.getElementById('loading')?.classList.add('hide'));
            await page.waitForTimeout(2200);
            const result = await page.evaluate(() => ({
              ready: window.__KAOPU_READY__,
              webgl2: Boolean(document.querySelector('#world')?.getContext('webgl2')),
              canvas: [document.querySelector('#world')?.width, document.querySelector('#world')?.height],
              mode: document.querySelector('#modeState')?.textContent,
              atlasButtons: document.querySelectorAll('[data-field]').length,
              title: document.title
            }));
            await page.screenshot({ path: 'kaopu-coast-world-r01-proof.png', fullPage: true });
            console.log(JSON.stringify({ result, errors }, null, 2));
            if (!result.ready || !result.webgl2) throw new Error(`not ready: ${JSON.stringify(result)}`);
            if (!(result.canvas[0] > 0 && result.canvas[1] > 0)) throw new Error('canvas has no size');
            if (result.atlasButtons !== 4) throw new Error('Field Atlas incomplete');
            if (errors.length) throw new Error(errors.join('\n'));
            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Publish verified world into gh-pages
        shell: bash
        run: |
          set -euo pipefail
          cd site
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A kaopu-coast-world/r01-20260930
          if git diff --cached --quiet; then
            echo "KaoPu Coast World R01 already current."
          else
            git commit -m "publish: KaoPu Coast World R01 browser-verified preview"
            git push origin HEAD:gh-pages
          fi

      - name: Upload browser proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaopu-coast-world-r01-browser-proof
          path: kaopu-coast-world-r01-proof.png
          if-no-files-found: warn
