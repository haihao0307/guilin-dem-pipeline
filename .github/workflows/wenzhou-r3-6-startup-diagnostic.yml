name: Wenzhou R3.6 Startup Diagnostic

on:
  push:
    branches:
      - feature/wenzhou-r3-6-osm-runtime-20260911
    paths:
      - 'site/dist/r3-6/**'
      - 'tools/r3-6/startup_diagnostic.mjs'
      - '.github/workflows/wenzhou-r3-6-startup-diagnostic.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Diagnose local startup
        run: |
          set -euo pipefail
          python -m http.server 8765 --directory . >/tmp/r36-startup-http.log 2>&1 &
          ready=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/site/dist/r3-6/ >/dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          R36_URL=http://127.0.0.1:8765/site/dist/r3-6/ node tools/r3-6/startup_diagnostic.mjs | tee /tmp/r36-startup-diagnostic.json
      - uses: actions/upload-artifact@v4
        with:
          name: wenzhou-r3-6-startup-diagnostic-${{ github.sha }}
          path: |
            /tmp/r36-startup-diagnostic.json
            /tmp/r36-startup-http.log
          retention-days: 30
