name: Lip R03 bounded fine-relief verification
on:
  push:
    branches: [feature/lip-detail-r03-20261018]
    paths:
      - 'kaopu-unified-human-workbench/lip-realism-r03/LipSurface.js'
      - 'kaopu-unified-human-workbench/lip-realism-r03/build.cjs'
      - 'kaopu-unified-human-workbench/lip-realism-r03/verify-detail.cjs'
      - '.github/workflows/lip-detail-r03.yml'
permissions:
  contents: write
concurrency:
  group: lip-detail-r03-${{ github.ref }}
  cancel-in-progress: false
env:
  LIP_BRANCH: feature/lip-detail-r03-20261018
  LIP_DIR: kaopu-unified-human-workbench/lip-realism-r03
jobs:
  verify:
    if: github.repository == 'haihao0307/guilin-dem-pipeline' && github.ref == 'refs/heads/feature/lip-detail-r03-20261018'
    runs-on: ubuntu-latest
    timeout-minutes: 42
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          sparse-checkout: |
            .github/workflows
            kaopu-unified-human-workbench/human-integrated-r07
            kaopu-unified-human-workbench/lip-realism-r01-1
            kaopu-unified-human-workbench/lip-realism-r03
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Freeze exact source and evidence paths
        run: |
          test "$GITHUB_REF" = "refs/heads/$LIP_BRANCH"
          test "$GITHUB_REPOSITORY" = haihao0307/guilin-dem-pipeline
          lip_source_sha="$(git rev-parse HEAD)"
          test "$lip_source_sha" = "$GITHUB_SHA"
          echo "SOURCE_SHA=$lip_source_sha" >> "$GITHUB_ENV"
          echo "LIP_VERIFICATION_SHA=$lip_source_sha" >> "$GITHUB_ENV"
          echo "LIP_RUN_KEY=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          echo "LIP_QA_OUT=$LIP_DIR/qa/detail-r03/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - name: Install isolated official browser tooling pinned to the verified baseline
        run: |
          npm install --prefix "$RUNNER_TEMP/lip-detail-runtime" --no-save --package-lock=false playwright@1.58.2 pngjs@7.0.0
          echo "NODE_PATH=$RUNNER_TEMP/lip-detail-runtime/node_modules" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/lip-detail-runtime/node_modules/.bin/playwright" install --with-deps chromium
      - name: Syntax, frozen host and unchanged original production checks
        run: |
          node --check "$LIP_DIR/LipSurface.js"
          node --check "$LIP_DIR/build.cjs"
          node --check "$LIP_DIR/verify-detail.cjs"
          python - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          expected={
            'kaopu-unified-human-workbench/human-integrated-r07/preview.html':'d1bd7940b885cb872143bc0e68ce85fd2f663c81be36a18e58fc6086781cf31a',
            'kaopu-unified-human-workbench/lip-realism-r01-1/preview.html':'29d2e2bcf30cacd10af822de9acfd26dcf1908a212291df0398f1e9cc3b09e5a',
            'kaopu-unified-human-workbench/lip-realism-r01-1/LipSurface.js':'4f680a4ab00b40de66b42aef8adcb64e50f3fd3df202d3c6039d412d6a7f31b3'
          }
          for file,digest in expected.items():
            assert sha256(Path(file).read_bytes()).hexdigest()==digest,file+' changed'
          PY
      - name: Build only the separate R03 candidate directory
        run: node "$LIP_DIR/build.cjs"
      - name: Publish fixed unverified candidate bytes with fast-forward race guard
        run: |
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          from hashlib import sha256
          directory=Path(os.environ['LIP_DIR'])
          allowed={str(directory/'preview.html'),str(directory/'BUILD_MANIFEST.json')}
          changed=subprocess.check_output(['git','diff','--name-only','HEAD'],text=True).splitlines()
          untracked=subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines()
          assert set(changed+untracked)<=allowed,'Build modified paths outside the two declared outputs'
          manifest=json.loads((directory/'BUILD_MANIFEST.json').read_text())
          assert manifest['version']=='LIP-REALISM-R03'
          assert manifest['sourceCommit']==os.environ['SOURCE_SHA']
          assert manifest['hostRestorationExact']
          assert manifest['previewSHA256']==sha256((directory/'preview.html').read_bytes()).hexdigest()
          assert manifest['moduleSHA256']==sha256((directory/'LipSurface.js').read_bytes()).hexdigest()
          assert manifest['hostSHA256']=='d1bd7940b885cb872143bc0e68ce85fd2f663c81be36a18e58fc6086781cf31a'
          assert manifest['inheritedLipModuleSHA256']=='4f680a4ab00b40de66b42aef8adcb64e50f3fd3df202d3c6039d412d6a7f31b3'
          assert manifest['referenceAssetsImported']==0 and manifest['newImageMaps']==0
          PY
          git fetch --no-tags origin "refs/heads/$LIP_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$SOURCE_SHA"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f -- "$LIP_DIR/preview.html" "$LIP_DIR/BUILD_MANIFEST.json"
          git commit -m "build: fixed unverified lip R03 fine-relief candidate"
          lip_build_sha="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/$LIP_BRANCH"
          echo "LIP_BUILD_SHA=$lip_build_sha" >> "$GITHUB_ENV"
          echo "LIP_EXPECTED_PREVIEW_SHA256=$(sha256sum "$LIP_DIR/preview.html" | cut -d ' ' -f 1)" >> "$GITHUB_ENV"
      - name: Bounded fixed public R03 comparisons and one fresh reader
        run: timeout --signal=TERM --kill-after=20s 34m node "$LIP_DIR/verify-detail.cjs"
      - name: Validate actual completion and persist this run only
        run: |
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          from hashlib import sha256
          directory=Path(os.environ['LIP_DIR'])
          evidence=Path(os.environ['LIP_QA_OUT'])
          qa=json.loads((evidence/'qa.json').read_text())
          assert qa['completed'] and qa['shareAllowed'] and qa['publicHttpsPassed'] and qa['browserPassed']
          assert qa['cleanup']['completed'] and qa['cleanup']['browserClosed'] and not qa.get('cleanupError')
          assert qa['tests'] and all(t['passed'] for t in qa['tests'])
          required=['protected production source','original defaults retained','ancient host archive compatibility',
            *['same person '+name for name in ['P01-closed','P01-open','P02-closed','P02-open']],
            'schema migrations reject before mutation','R07 original and mode round trips','synchronized macro performance',
            'fine-relief zero and real slider','all v2 complete-person saves','fresh reader exact disk restore',
            'mobile viewport controls','zero runtime and resource errors']
          assert sorted(t['name'] for t in qa['tests'])==sorted(required),'Required gate absent or duplicated'
          assert qa['sourceCommit']==os.environ['SOURCE_SHA']
          assert qa['buildCommit']==os.environ['LIP_BUILD_SHA']
          assert qa['verificationCommit']==os.environ['LIP_VERIFICATION_SHA']
          assert qa['candidate']['previewSHA256']==os.environ['LIP_EXPECTED_PREVIEW_SHA256']
          assert len(qa['contexts'])==3 and all(c['closed'] for c in qa['contexts'])
          assert [c['label'] for c in qa['contexts']]==['fixed-r01-1-baseline','r03-producer','r03-fresh-reader']
          assert qa['contexts'][1]['closedAt']<=qa['contexts'][2]['createdAt']
          assert all(not c['storageStateSupplied'] for c in qa['contexts'])
          assert all(not qa[key] for key in ['errors','consoleErrors','failedRequests','resourceErrors'])
          assert qa['diskTransfer']['sha256']==sha256((evidence/'saved-person-v2.json').read_bytes()).hexdigest()
          assert [s['id'] for s in qa['scenarios']]==['P01-closed','P01-open','P02-closed','P02-open']
          for s in qa['scenarios']:
            assert all(s[k] for k in ['completed','geometryExact','calibrationExact','oldModePublicPixelsExact','albedoExact','roughnessExact'])
            assert s['normalChangedInside']>10 and s['changedOutside']==0
          assert qa['performance']['passed'] and qa['performance']['medianRatio']<=1.20
          assert qa['performance']['baseline']['count']==8 and qa['performance']['candidate']['count']==8
          assert qa['canvasComparison']['pixelTolerance']==0 and qa['canvasComparison']['channels']=='RGBA'
          assert qa['source']['candidateModuleSHA256']==sha256((directory/'LipSurface.js').read_bytes()).hexdigest()
          assert qa['source']['verificationScriptSHA256']==sha256((directory/'verify-detail.cjs').read_bytes()).hexdigest()
          assert qa['source']['builderSHA256']==sha256((directory/'build.cjs').read_bytes()).hexdigest()
          assert qa['source']['taskAnchorSHA256']==sha256((directory/'TASK_ANCHOR.json').read_bytes()).hexdigest()
          assert not qa['visualAcceptance'] and not qa['userVisualAccepted'] and not qa['productionReady']
          for download in qa['downloads']:
            assert download['sha256']==sha256((evidence/download['file']).read_bytes()).hexdigest()
          for frame in qa['screenshots']:
            assert frame['sha256']==sha256((evidence/(frame['name']+'.png')).read_bytes()).hexdigest()
          receipt={
            'schema':'kaopu/lip-detail-publication@1','version':'LIP-REALISM-R03',
            'sourceCommit':qa['sourceCommit'],'buildCommit':qa['buildCommit'],'verificationCommit':qa['verificationCommit'],
            'publicURL':qa['candidate']['publicURL'],'previewSHA256':qa['candidate']['previewSHA256'],
            'verifiedAt':qa['finishedAt'],'runId':qa['runId'],'runAttempt':qa['runAttempt'],
            'qaPath':str(evidence/'qa.json'),'sourceModified':True,'archiveSchemaChanged':True,'archiveRoutingChanged':False,
            'productionRenderingChanged':True,'changeScope':'Fine-relief shader normal field only; native R01.1 colour, roughness and geometry retained',
            'baselineBuildCommit':qa['original']['commit'],'baselinePreviewSHA256':qa['original']['previewSHA256'],
            'moduleSHA256':qa['source']['candidateModuleSHA256'],'verificationScriptSHA256':qa['source']['verificationScriptSHA256'],
            'performance':qa['performance'],'interactive3D':True,'staticImageSubstitute':False,
            'publicHttpsPassed':True,'browserPassed':True,'shareAllowed':True,
            'visualAcceptance':False,'userVisualAccepted':False,'productionReady':False,
            'softwareRenderer':True,'physicalPhone':False,'knownLimitations':qa['limitations']
          }
          (directory/'PUBLICATION_PROOF.json').write_text(json.dumps(receipt,ensure_ascii=False,indent=2)+'\n')
          changed=subprocess.check_output(['git','diff','--name-only','HEAD'],text=True).splitlines()
          untracked=subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines()
          assert all(p==str(directory/'PUBLICATION_PROOF.json') or p.startswith(str(evidence)+'/') for p in changed+untracked),'Unrelated changes appeared during QA'
          for p in evidence.rglob('*'):
            if p.is_file():assert p.suffix in {'.json','.jsonl','.png'},'Unexpected evidence file type'
          PY
          git fetch --no-tags origin "refs/heads/$LIP_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$LIP_BUILD_SHA"
          git add -f -- "$LIP_QA_OUT" "$LIP_DIR/PUBLICATION_PROOF.json"
          git commit -m "test: public R03 fine-relief comparisons and archive recovery evidence"
          git push origin "HEAD:refs/heads/$LIP_BRANCH"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lip-detail-r03-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.LIP_QA_OUT }}/
            kaopu-unified-human-workbench/lip-realism-r03/BUILD_MANIFEST.json
            kaopu-unified-human-workbench/lip-realism-r03/PUBLICATION_PROOF.json
          if-no-files-found: warn
          retention-days: 30
