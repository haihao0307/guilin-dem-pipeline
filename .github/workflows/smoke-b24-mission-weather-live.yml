name: Verify restored authoritative B24 public workbench

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/smoke-b24-mission-weather-live.yml'

permissions:
  contents: read

concurrency:
  group: verify-restored-authoritative-b24-live
  cancel-in-progress: false

jobs:
  live-browser-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PUBLIC_URL: https://haihao0307.github.io/guilin-dem-pipeline/aircraft/b24-weather-mission-v1/
      EXPECTED_BYTES: 23085972
      EXPECTED_SHA256: 541c3dcfb98ab590cdb1bc90d6ddcdfe80bce2a4b937f3bccefab0c7efe8be0d
      EVIDENCE_DIR: evidence/b24-v010-restored-live
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Wait for the restored public payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          for attempt in $(seq 1 80); do
            curl --fail --location --silent --show-error \
              --output "$EVIDENCE_DIR/index.html" \
              "${PUBLIC_URL}?restore=${GITHUB_SHA}-${attempt}" || true
            curl --fail --location --silent --show-error \
              --output "$EVIDENCE_DIR/app.js" \
              "${PUBLIC_URL}app.js?restore=${GITHUB_SHA}-${attempt}" || true
            if grep -q 'V010 RESTORED' "$EVIDENCE_DIR/index.html" 2>/dev/null \
              && grep -q "url:'./b24.glb'" "$EVIDENCE_DIR/app.js" 2>/dev/null \
              && grep -q 'proceduralAircraftFallback:false' "$EVIDENCE_DIR/app.js" 2>/dev/null; then
              echo "Restored runtime visible after attempt $attempt"
              break
            fi
            if [ "$attempt" = 80 ]; then
              echo 'Restored public runtime did not become visible.'
              exit 1
            fi
            sleep 5
          done

      - name: Verify exact same-origin B24 and forbidden-route removal
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 8 --retry-all-errors --retry-delay 3 \
            --output "$EVIDENCE_DIR/b24.glb" \
            "${PUBLIC_URL}b24.glb?restore=${GITHUB_SHA}"
          test "$(stat --format=%s "$EVIDENCE_DIR/b24.glb")" = "$EXPECTED_BYTES"
          echo "$EXPECTED_SHA256  $EVIDENCE_DIR/b24.glb" | sha256sum --check
          grep -q 'RUNWAY_24_06' "$EVIDENCE_DIR/app.js"
          grep -q 'contactEvents' "$EVIDENCE_DIR/app.js"
          grep -q 'drop(false' "$EVIDENCE_DIR/app.js"
          if grep -Eqi 'img2threejs|image2three|function fallback\(|aircraft=fallback\(|程序化占位机继续演示' "$EVIDENCE_DIR/index.html" "$EVIDENCE_DIR/app.js"; then
            echo 'A forbidden substitute aircraft route remains.'
            exit 1
          fi

      - name: Install Chromium QA
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify the public page in a real browser
        shell: bash
        run: |
          set -euo pipefail
          cat > verify-b24-live.cjs <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const { chromium } = require('playwright');

          const publicUrl = process.env.PUBLIC_URL;
          const outputDir = process.env.EVIDENCE_DIR;
          fs.mkdirSync(outputDir, { recursive: true });

          (async () => {
            const browser = await chromium.launch({
              headless: true,
              args: [
                '--disable-dev-shm-usage',
                '--enable-webgl',
                '--ignore-gpu-blocklist',
                '--use-gl=angle',
                '--use-angle=swiftshader-webgl',
                '--enable-unsafe-swiftshader'
              ]
            });
            const page = await browser.newPage({ viewport: { width: 1600, height: 1000 }, deviceScaleFactor: 1 });
            page.setDefaultTimeout(180000);
            const consoleErrors = [];
            const pageErrors = [];
            const failedRequests = [];
            page.on('console', message => {
              if (message.type() === 'error') consoleErrors.push(message.text());
            });
            page.on('pageerror', error => pageErrors.push(error.message || String(error)));
            page.on('requestfailed', request => failedRequests.push({
              url: request.url(),
              error: request.failure()?.errorText || 'unknown'
            }));

            await page.goto(`${publicUrl}?restore=${Date.now()}&autostart=0`, {
              waitUntil: 'domcontentloaded',
              timeout: 180000
            });
            await page.waitForFunction(() => {
              const api = window.__B24_MISSION_WEATHER__;
              const status = document.querySelector('#model-status');
              return Boolean(api?.ready && api.runtime?.modelLoaded && status?.dataset.state === 'pass');
            }, null, { timeout: 240000, polling: 250 });

            await page.evaluate(() => {
              const api = window.__B24_MISSION_WEATHER__;
              api.reset();
              api.setWeather('fair');
              api.runtime.rate = 1;
            });
            await page.waitForTimeout(1600);

            const baseline = await page.evaluate(() => ({
              title: document.title,
              heading: document.querySelector('h1')?.textContent?.trim() || '',
              modelState: document.querySelector('#model-status')?.dataset.state || '',
              modelTitle: document.querySelector('#model-status-title')?.textContent || '',
              modelDetail: document.querySelector('#model-status-detail')?.textContent || '',
              errorText: document.querySelector('#error-card')?.textContent || '',
              runtime: window.__B24_MISSION_WEATHER__.getState(),
              contract: window.__B24_MISSION_WEATHER__.contract,
              bodyText: document.body.innerText
            }));

            const checks = [];
            const check = (name, pass, detail) => checks.push({ name, pass: Boolean(pass), detail });
            check('restored V010 heading', baseline.heading.includes('V010 RESTORED'), baseline.heading);
            check('authoritative gate passed', baseline.modelState === 'pass', baseline.modelState);
            check('authoritative status shown', baseline.modelTitle.includes('权威 B-24 已锁定'), baseline.modelTitle);
            check('exact source gate shown', baseline.modelDetail.includes('23,085,972') && baseline.modelDetail.includes('SHA256'), baseline.modelDetail);
            check('real B24 loaded', baseline.runtime.modelLoaded === true, baseline.runtime.modelLoaded);
            check('runway ready', baseline.runtime.runwayReady === true, baseline.runtime.runwayReady);
            check('authoritative-only contract', baseline.contract.authoritativeAircraftOnly === true, baseline.contract);
            check('substitute route disabled', baseline.contract.proceduralAircraftFallback === false, baseline.contract);
            check('no substitute warning', !baseline.bodyText.includes('程序化占位机'), baseline.errorText);

            await page.screenshot({
              path: path.join(outputDir, '01-restored-v010-authoritative-b24.png'),
              fullPage: false,
              timeout: 120000
            });

            await page.evaluate(() => {
              const api = window.__B24_MISSION_WEATHER__;
              api.runtime.rate = 8;
              api.start();
            });
            await page.waitForFunction(() => {
              const state = window.__B24_MISSION_WEATHER__?.getState?.();
              return state && state.missionProgress > 0.18 && state.modelLoaded;
            }, null, { timeout: 90000, polling: 100 });
            await page.waitForTimeout(700);
            const airborne = await page.evaluate(() => window.__B24_MISSION_WEATHER__.getState());
            check('mission advances with real B24', airborne.missionProgress > 0.18, airborne);
            check('real B24 remains loaded', airborne.modelLoaded === true, airborne.modelLoaded);

            await page.screenshot({
              path: path.join(outputDir, '02-restored-v010-takeoff.png'),
              fullPage: false,
              timeout: 120000
            });

            check('no page errors', pageErrors.length === 0, pageErrors);
            check('no console errors', consoleErrors.length === 0, consoleErrors);
            check('no failed requests', failedRequests.length === 0, failedRequests);

            const failed = checks.filter(item => !item.pass);
            const report = {
              schema: 'haihao.aircraft/b24-v010-restored-live-browser-qa@1.0.0',
              status: failed.length ? 'FAIL' : 'PASS',
              publicUrl,
              checks: checks.length,
              passed: checks.length - failed.length,
              failed: failed.length,
              failures: failed,
              consoleErrors,
              pageErrors,
              failedRequests,
              baseline,
              airborne,
              visualAcceptance: false,
              productionReady: false,
              results: checks
            };
            fs.writeFileSync(path.join(outputDir, 'browser-qa.json'), JSON.stringify(report, null, 2) + '\n');
            console.log(JSON.stringify(report, null, 2));
            await browser.close();
            if (failed.length) process.exit(1);
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE
          node verify-b24-live.cjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b24-v010-restored-live-${{ github.sha }}
          retention-days: 90
          if-no-files-found: error
          path: |
            evidence/b24-v010-restored-live/index.html
            evidence/b24-v010-restored-live/app.js
            evidence/b24-v010-restored-live/browser-qa.json
            evidence/b24-v010-restored-live/01-restored-v010-authoritative-b24.png
            evidence/b24-v010-restored-live/02-restored-v010-takeoff.png

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Restored authoritative B24 public workbench'
            echo
            echo "Public URL: $PUBLIC_URL"
            if [ -f "$EVIDENCE_DIR/browser-qa.json" ]; then
              node -e "const r=require('./$EVIDENCE_DIR/browser-qa.json'); console.log('Live browser QA: '+r.status+' '+r.passed+'/'+r.checks);"
            else
              echo 'Live browser QA report was not produced.'
            fi
            echo 'Authoritative B24 payload: exact same-origin file'
            echo 'Substitute aircraft route: removed'
            echo 'visualAcceptance=false'
            echo 'productionReady=false'
          } >> "$GITHUB_STEP_SUMMARY"
