name: KAOPU Gaussian R62 Half ULP

on:
  push:
    branches:
      - coordination/kaopu-learning-flywheel-r1-20260909
    paths:
      - docs/mother_coordination/kaopu_learning_flywheel_v1/PROBES/gaussian_three_half_ulp_r62.html
      - docs/mother_coordination/kaopu_learning_flywheel_v1/PROBES/run_gaussian_three_half_ulp_r62.js
      - docs/mother_coordination/kaopu_learning_flywheel_v1/ADAPTERS/gaussian_three_half_ulp_gate_r62.mjs
      - .github/workflows/kaopu-gaussian-r62-half-ulp.yml

permissions:
  contents: read

jobs:
  r62-half-ulp:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned renderer and browser harness
        run: |
          npm init -y
          npm pkg set type=module
          npm install --no-save three@0.186.0 playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Start local fixture server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/r62-http.log 2>&1 &
          sleep 2
          curl --fail --silent http://127.0.0.1:8765/docs/mother_coordination/kaopu_learning_flywheel_v1/PROBES/gaussian_three_half_ulp_r62.html > /dev/null
      - name: Run actual SPZLoader and GaussianSplat Half-ULP test
        run: node docs/mother_coordination/kaopu_learning_flywheel_v1/PROBES/run_gaussian_three_half_ulp_r62.js
      - name: Validate R62 evidence contract
        run: |
          cat r62-comparison.json | node docs/mother_coordination/kaopu_learning_flywheel_v1/ADAPTERS/gaussian_three_half_ulp_gate_r62.mjs > r62-gate.json
          cat r62-gate.json
          node -e "const d=require('./r62-gate.json');if(d.status!=='Candidate-pass')process.exit(10)"
      - name: Upload R62 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaopu-gaussian-r62-half-ulp
          path: r62-*.json
          if-no-files-found: warn
          retention-days: 30
