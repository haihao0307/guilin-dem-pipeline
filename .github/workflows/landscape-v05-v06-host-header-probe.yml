name: Landscape V05 V06 Host Header Probe

on:
  push:
    branches:
      - feature/stone-money-landscape-influence-tool-v05-20261002
    paths:
      - .github/workflows/landscape-v05-v06-host-header-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe response headers and browser document mode
        env:
          V05: https://raw.githack.com/haihao0307/guilin-dem-pipeline/f6fcaa81c3a25a704862a35e5624f97881897321/workbenches/landscape-terrain-influence-tool-v05/index.html
          V06: https://raw.githack.com/haihao0307/guilin-dem-pipeline/fbaa49e0e0ef076bb72734a9b48862dcd57329e1/workbenches/landscape-terrain-influence-tool-v06/index.html
        run: |
          echo '===== V05 HEADERS ====='
          curl -fsSIL "$V05" || true
          echo '===== V06 HEADERS ====='
          curl -fsSIL "$V06" || true
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)
          if [ -z "$CHROME" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq chromium || sudo apt-get install -y -qq chromium-browser
            CHROME=$(command -v chromium || command -v chromium-browser)
          fi
          python -m pip install -q playwright
          export CHROME V05 V06
          python - <<'PY'
          import json,os
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,executable_path=os.environ['CHROME'],args=['--no-sandbox','--disable-dev-shm-usage'])
              for name in ('V05','V06'):
                  page=browser.new_page()
                  logs=[];errors=[]
                  page.on('console',lambda m,logs=logs:logs.append(f'{m.type}:{m.text}'))
                  page.on('pageerror',lambda e,errors=errors:errors.append(str(e)))
                  r=page.goto(os.environ[name],wait_until='domcontentloaded',timeout=60000)
                  page.wait_for_timeout(3000)
                  result=page.evaluate("""() => ({
                    url:location.href,
                    contentType:document.contentType,
                    title:document.title,
                    bodyText:(document.body?.innerText||'').slice(0,180),
                    scripts:document.scripts.length,
                    canvas:!!document.getElementById('view'),
                    step:document.getElementById('step')?.textContent||'',
                    tool:!!document.getElementById('ltiPanel'),
                    bridge:!!document.getElementById('landscapeTerrainWorkerBridge'),
                    workerMode:document.documentElement.dataset.landscapeWorkerMode||'',
                    ready:window.__LM_READY__===true,
                    error:window.__LM_ERROR__||null
                  })""")
                  result.update({'status':r.status if r else None,'logs':logs,'pageErrors':errors})
                  print(name,json.dumps(result,ensure_ascii=False))
                  page.close()
              browser.close()
          PY
