name: Verify original KAOPU elevator mother
on:
  push:
    branches: ['trial/kaopu-elevator-r01-20261021']
permissions:
  contents: read
jobs:
  elevator:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            kaopu-geography-workbench/kowloon-building-mother-r01
            kaopu-material-workbench/material-master-r06
      - name: Independent state and field contracts
        run: node --test kaopu-geography-workbench/kowloon-building-mother-r01/elevator-mother-r01/tests/*.test.mjs
      - name: Install pinned browser
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Browser actions and actual rendered screenshots
        run: timeout 300s python -u kaopu-geography-workbench/kowloon-building-mother-r01/elevator-mother-r01/tests/browser.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: kaopu-elevator-r01-${{ github.sha }}
          path: elevator-evidence
          retention-days: 2
