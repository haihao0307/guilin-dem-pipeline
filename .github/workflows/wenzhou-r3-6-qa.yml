name: Wenzhou R3.6 QA

on:
  push:
    branches:
      - feature/wenzhou-r3-6-osm-runtime-20260911
    paths:
      - 'site/dist/r3-6/**'
      - 'tools/r3-6/**'
      - '.github/workflows/wenzhou-r3-6-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Freeze R3.2 through R3.5 visual/data implementation
        run: |
          set -euo pipefail
          BASE=58ae114d61442d5f5f86d00f29d0e34fdf95f15e
          git diff --exit-code "$BASE" HEAD -- \
            site/dist/r3-2 site/dist/r3-3 site/dist/r3-4 site/dist/r3-5 \
            records/R3_2 records/R3_3 records/R3_4 \
            inputs/knowledge-r2-2/OBJECT_EVIDENCE_R2_2.json

      - name: Static runtime-only evidence boundary and syntax gate
        run: |
          set -euo pipefail
          python tools/r3-6/validate_static.py | tee /tmp/r36-static.json
          grep -q '"passed": true' /tmp/r36-static.json
          node --check site/dist/r3-6/bootstrap.js
          node --check site/dist/r3-6/osm-runtime.js
          node --check tools/r3-6/browser_qa.mjs
          grep -q 'id="approximation-info"' site/dist/r3-6/index.html
          grep -q 'await new Promise(resolve=>requestAnimationFrame(resolve))' site/dist/r3-6/osm-runtime.js
          grep -q 'await allowGithack(stressContext)' tools/r3-6/browser_qa.mjs

      - name: Install Chromium runner
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Local functional browser QA
        run: |
          set -euo pipefail
          python -m http.server 8765 --directory . >/tmp/r36-http.log 2>&1 &
          ready=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/site/dist/r3-6/ >/dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          R36_URL=http://127.0.0.1:8765/site/dist/r3-6/ node tools/r3-6/browser_qa.mjs | tee /tmp/r36-local.json
          grep -q '"passed": true' /tmp/r36-local.json

      - name: Fixed-commit raw.githack browser QA
        env:
          R36_SHA: ${{ github.sha }}
          R36_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          URL="https://raw.githack.com/${R36_REPO}/${R36_SHA}/site/dist/r3-6/index.html"
          ready=0
          for i in $(seq 1 40); do
            if curl -fsS -H 'Cookie: __Http-phish=1' "$URL" | grep -q '真实 DEM · R3.6'; then ready=1; break; fi
            sleep 4
          done
          test "$ready" = 1
          R36_URL="$URL" node tools/r3-6/browser_qa.mjs | tee /tmp/r36-public.json
          grep -q '"passed": true' /tmp/r36-public.json
          echo "$URL" > /tmp/r36-preview.txt

      - name: Upload QA evidence
        uses: actions/upload-artifact@v4
        with:
          name: wenzhou-r3-6-qa-${{ github.sha }}
          path: |
            /tmp/r36-static.json
            /tmp/r36-local.json
            /tmp/r36-public.json
            /tmp/r36-preview.txt
            /tmp/r36-http.log
          if-no-files-found: error
          retention-days: 30
