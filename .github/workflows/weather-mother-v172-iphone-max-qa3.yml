name: Weather Mother V1.7.2 iPhone Max QA 3
on:
  push:
    branches: [gh-pages]
    paths:
      - '.github/workflows/weather-mother-v172-iphone-max-qa3.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  iphone-max:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - run: |
          python3 -m pip install playwright==1.51.0
          python3 -m playwright install --with-deps chromium webkit
      - run: |
          cat > /tmp/qa.py <<'PY'
          import json,time,urllib.request
          from playwright.sync_api import sync_playwright
          base='https://haihao0307.github.io/guilin-dem-pipeline/weather-mother/studio-v072/'
          def get(path):
              sep='&' if '?' in path else '?'
              req=urllib.request.Request(base+path+sep+'t='+str(time.time_ns()),headers={'Cache-Control':'no-cache','Pragma':'no-cache'})
              with urllib.request.urlopen(req,timeout=25) as r:
                  assert r.status==200
                  return r.read()
          ok=False
          for _ in range(48):
              try:
                  loader=get('index.html');m=json.loads(get('MANIFEST.json'))
                  sizes=[len(get(c['file'])) for c in m.get('chunks',[])]
                  ok=(m.get('version')=='0.7.2-iphone-max-adaptive' and sizes==[4800,2300,2476] and b'Math.min(innerHeight' in loader)
                  if ok:break
              except Exception:pass
              time.sleep(5)
          assert ok
          out={}
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=['--no-sandbox','--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader'])
              for name,w,h,ori,full in [('p430',430,932,'portrait',True),('p440',440,956,'portrait',False),('l932',932,430,'landscape',True),('l956',956,440,'landscape',False)]:
                  ctx=browser.new_context(viewport={'width':w,'height':h},screen={'width':w,'height':h},is_mobile=True,has_touch=True,device_scale_factor=3)
                  page=ctx.new_page();errors=[];failed=[]
                  page.on('pageerror',lambda e,errors=errors:errors.append(str(e)))
                  page.on('console',lambda m,errors=errors:errors.append(m.text) if m.type=='error' else None)
                  page.on('requestfailed',lambda r,failed=failed:failed.append(r.url))
                  page.add_init_script("window.WeatherMotherBoot={quality:'low',still:true,weather:'fair'}")
                  page.goto(base+'?module=world&case='+name+'&t='+str(time.time_ns()),wait_until='domcontentloaded',timeout=60000)
                  page.wait_for_function("window.__WEATHER_MOTHER_STUDIO__?.version==='0.7.2-iphone-max-adaptive'",timeout=60000)
                  state=page.evaluate('__WEATHER_MOTHER_STUDIO__.getState()')
                  assert state['module']=='world' and not state['sheetOpen'] and state['orientation']==ori
                  launcher=page.locator('#launcher').bounding_box();assert round(launcher['width'])==48 and round(launcher['height'])==48
                  assert page.evaluate('document.documentElement.scrollWidth-document.documentElement.clientWidth')==0
                  page.locator('#launcher').click();page.wait_for_function('__WEATHER_MOTHER_STUDIO__.getState().sheetOpen');page.wait_for_timeout(650)
                  sheet=page.locator('#sheet').bounding_box();print(name,'sheet',sheet)
                  assert page.locator('[data-module]').count()==6
                  assert sheet['x']>=0 and sheet['y']>=0 and sheet['x']+sheet['width']<=w+1 and sheet['y']+sheet['height']<=h+1
                  if ori=='portrait':assert sheet['width']>=w-20 and sheet['height']<h*.55
                  else:assert sheet['width']<=391 and sheet['height']>=h-20
                  if full:
                      page.locator('[data-module="rain"]').click()
                      page.wait_for_function("__WEATHER_MOTHER_STUDIO__.getState().module==='rain' && !__WEATHER_MOTHER_STUDIO__.getState().sheetOpen",timeout=30000)
                      page.wait_for_function("document.querySelector('#stage')?.contentWindow?.WeatherLiquid?.getState()?.frames>0",timeout=120000)
                      page.locator('#launcher').click();page.wait_for_function("__WEATHER_MOTHER_STUDIO__.getState().sheetOpen && __WEATHER_MOTHER_STUDIO__.getState().tab==='controls'",timeout=30000);page.wait_for_timeout(650)
                      assert page.locator('[data-rain-section]').count()==6
                      page.locator('[data-rain-section="glass"]').click()
                      page.wait_for_function("document.querySelector('#stage')?.contentWindow?.WeatherLiquidUI?.isOpen?.() && document.querySelector('#stage')?.contentWindow?.WeatherLiquidUI?.getSection?.()==='glass'",timeout=30000);page.wait_for_timeout(500)
                      panel=page.evaluate("""()=>{const f=document.querySelector('#stage'),d=f.contentDocument,p=d.querySelector('#panel'),b=p.getBoundingClientRect(),ui=f.contentWindow.WeatherLiquidUI;return{x:b.x,y:b.y,width:b.width,height:b.height,right:b.right,bottom:b.bottom,open:ui.isOpen(),section:ui.getSection(),launcher:getComputedStyle(document.querySelector('#launcher')).pointerEvents}}""")
                      print(name,'panel',panel)
                      assert panel['open'] and panel['section']=='glass' and panel['launcher']=='none'
                      assert panel['x']>=0 and panel['y']>=0 and panel['right']<=w+1 and panel['bottom']<=h+1
                      if ori=='portrait':assert panel['width']>=w-24 and panel['height']<=h*.62
                      else:assert panel['width']<=391 and panel['x']>w*.5
                      page.evaluate("document.querySelector('#stage').contentDocument.querySelector('#done').click()")
                      page.wait_for_function("!document.querySelector('#stage')?.contentWindow?.WeatherLiquidUI?.isOpen?.()",timeout=30000)
                  assert not errors and not failed,(name,errors,failed)
                  out[name]={'sheet':sheet}
                  ctx.close()
              browser.close()
              wk=p.webkit.launch(headless=True)
              for name,w,h,ori in [('wkp',430,932,'portrait'),('wkl',932,430,'landscape')]:
                  ctx=wk.new_context(viewport={'width':w,'height':h},screen={'width':w,'height':h},is_mobile=True,has_touch=True,device_scale_factor=3)
                  page=ctx.new_page();errors=[];failed=[]
                  page.on('pageerror',lambda e,errors=errors:errors.append(str(e)))
                  page.on('requestfailed',lambda r,failed=failed:failed.append(r.url))
                  page.goto(base+'?module=world&case='+name+'&t='+str(time.time_ns()),wait_until='domcontentloaded',timeout=60000)
                  page.wait_for_function("window.__WEATHER_MOTHER_STUDIO__?.version==='0.7.2-iphone-max-adaptive'",timeout=60000)
                  assert page.evaluate('__WEATHER_MOTHER_STUDIO__.getState().orientation')==ori
                  page.locator('#launcher').click();page.wait_for_function('__WEATHER_MOTHER_STUDIO__.getState().sheetOpen');page.wait_for_timeout(650)
                  sheet=page.locator('#sheet').bounding_box();print(name,'sheet',sheet)
                  assert sheet['x']>=0 and sheet['y']>=0 and sheet['x']+sheet['width']<=w+1 and sheet['y']+sheet['height']<=h+1
                  assert page.evaluate('document.documentElement.scrollWidth-document.documentElement.clientWidth')==0
                  assert not errors and not failed,(name,errors,failed)
                  out[name]={'sheet':sheet}
                  ctx.close()
              wk.close()
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
          xvfb-run -a python3 -u /tmp/qa.py
