name: Stone Money V0230 arch flyview
on:
  push:
    branches: [work/stone-money-island-v0230-arch-flyview-20260920]
    paths:
      - .github/workflows/stone-money-v0230-arch-flyview.yml
      - games/survivor-palau/source/v0200/harden_v023.py
      - games/survivor-palau/source/v0200/build_v023.py
      - games/survivor-palau/source/v0200/verify_v023.py
      - games/survivor-palau/source/v0200/verify_v023_browser.py
permissions:
  contents: write
concurrency:
  group: stone-money-v0230-arch-flyview
  cancel-in-progress: true
jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/stone-money-island-v0230-arch-flyview-20260920
      - name: Build the actual V0.2.3 workbench from the frozen ocean baseline
        run: python games/survivor-palau/source/v0200/build_v023.py
      - name: Verify shoreline, Rock Island stone money, archipelago, trench, aerial and Fish Mother relation
        run: python games/survivor-palau/source/v0200/verify_v023.py
      - name: Run desktop and 390x844 real-browser evidence
        run: |
          python -m pip install playwright pillow
          python -m playwright install --with-deps chromium
          timeout 700s python -u games/survivor-palau/source/v0200/verify_v023_browser.py
      - name: Preserve runtime and QA receipts
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add games/survivor-palau/releases/v0.2.3
          git diff --cached --quiet || git commit -m 'build(stone-money): record V0.2.3 arch flyview and browser evidence'
          git pull --rebase origin work/stone-money-island-v0230-arch-flyview-20260920
          git push origin HEAD:work/stone-money-island-v0230-arch-flyview-20260920
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stone-money-v0230-arch-flyview
          path: |
            games/survivor-palau/releases/v0.2.3/
            games/survivor-palau/source/v0200/harden_v023.py
            games/survivor-palau/source/v0200/verify_v023.py
            games/survivor-palau/source/v0200/verify_v023_browser.py
            /tmp/stone-money-v0230-qa/
          if-no-files-found: error
