name: Guilin V077 native 12.5m LOD foundation

on:
  push:
    branches:
      - project/guilin-v077-native-12p5m-lod-foundation
    paths:
      - projects/guilin-v075-approved-aoi-terrain3d-preview/build_native_lod_tiles.py
      - projects/guilin-v075-approved-aoi-terrain3d-preview/tests/validate_native_lod.py
      - projects/guilin-v075-approved-aoi-terrain3d-preview/config/native_lod_v077.json
      - ops/tasks/GUILIN_V077_NATIVE_12P5M_LOD_FOUNDATION.md
      - .github/workflows/guilin-v077-native-lod-foundation.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guilin-v077-native-lod-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-native-anchor-tiles:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install raster dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.1.3 rasterio==1.4.3

      - name: Download locked 12.5 m truth TIFF
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/guilin-v077
          curl --fail --location --retry 5 --retry-all-errors \
            --output .cache/guilin-v077/guilin_raw_union_12_5m.tif \
            https://github.com/haihao0307/guilin-dem-pipeline/releases/download/guilin-v070-raw-mosaic-v001/guilin_raw_union_12_5m.tif
          test "$(stat -c '%s' .cache/guilin-v077/guilin_raw_union_12_5m.tif)" = "124348471"
          echo "9490b1bd34f67336352cf448729f763ae4e241637d821961efd0290e29d6c9d4  .cache/guilin-v077/guilin_raw_union_12_5m.tif" | sha256sum -c -

      - name: Build four-anchor native tile set
        run: |
          set -euo pipefail
          mkdir -p out
          rm -rf out/guilin-v077-native-lod
          python projects/guilin-v075-approved-aoi-terrain3d-preview/build_native_lod_tiles.py \
            --mosaic .cache/guilin-v077/guilin_raw_union_12_5m.tif \
            --output-dir out/guilin-v077-native-lod \
            --anchors zhenbaoding guilin yangtang yangshuo \
            --tile 5,2 \
            --tile 6,1 \
            | tee out/guilin-v077-build.log

      - name: Validate native identity and shared edges
        run: |
          set -euo pipefail
          python projects/guilin-v075-approved-aoi-terrain3d-preview/tests/validate_native_lod.py \
            --mosaic .cache/guilin-v077/guilin_raw_union_12_5m.tif \
            --output-dir out/guilin-v077-native-lod \
            | tee out/guilin-v077-validation.log

      - name: Record artifact checksums
        run: |
          set -euo pipefail
          find out/guilin-v077-native-lod -maxdepth 1 -type f -printf '%f\n' | sort > out/guilin-v077-native-lod/FILE_LIST.txt
          (cd out/guilin-v077-native-lod && find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%P\0' | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          (cd out/guilin-v077-native-lod && sha256sum -c SHA256SUMS.txt)

      - name: Upload native LOD foundation artifact
        uses: actions/upload-artifact@v4
        with:
          name: guilin-v077-native-lod-foundation
          path: |
            out/guilin-v077-native-lod
            out/guilin-v077-build.log
            out/guilin-v077-validation.log
          if-no-files-found: error
          retention-days: 90

      - name: Write job summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Guilin v0.7.7 native LOD foundation'
            echo
            echo '* source TIFF: locked 12.5 m truth'
            echo '* tile grid: 2048 × 2048 raw int16'
            echo '* stride: 2047 samples with one shared edge sample'
            echo '* resampling: none'
            echo '* gap fill: false'
            echo '* 30 m fallback: false'
            echo '* public deployment: false'
            echo
            if [[ -f out/guilin-v077-native-lod/native_lod_validation.json ]]; then
              echo '```json'
              cat out/guilin-v077-native-lod/native_lod_validation.json
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
