name: Ocean Mother Coast R012 404 repair v2

on:
  push:
    branches:
      - work/ocean-mother-handoff-20260901
    paths:
      - .github/workflows/ocean-mother-coast-r012-404-repair-v2.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ocean-mother-coast-r012-404-repair-v2
  cancel-in-progress: false

jobs:
  repair-verify-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/ocean-mother-handoff-20260901
          fetch-depth: 1

      - name: Apply multisample-safe render and deterministic QA repair
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 - <<'PY'
          from pathlib import Path
          path=Path('ocean-mother/coast-v022-r012/app.mjs')
          text=path.read_text(encoding='utf-8')
          text=text.replace("antialias:true,alpha:false","antialias:false,alpha:false",1)
          old="function blitOpaque(){gl.bindFramebuffer(gl.READ_FRAMEBUFFER,sceneFbo);gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER,null);gl.blitFramebuffer(0,0,fboW,fboH,0,0,canvas.width,canvas.height,gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT,gl.NEAREST);gl.bindFramebuffer(gl.FRAMEBUFFER,null)}"
          new="function blitOpaque(){gl.bindFramebuffer(gl.READ_FRAMEBUFFER,sceneFbo);gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER,null);gl.blitFramebuffer(0,0,fboW,fboH,0,0,canvas.width,canvas.height,gl.COLOR_BUFFER_BIT,gl.NEAREST);gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.depthMask(true);gl.clearDepth(1);gl.clear(gl.DEPTH_BUFFER_BIT)}\nfunction rebuildOpaqueDepth(sun){gl.colorMask(false,false,false,false);drawSolid(terrainGeo,sun);drawSolid(rocksGeo,sun);drawSolid(ringGeo,sun);drawSolid(logsGeo,sun);gl.colorMask(true,true,true,true)}"
          if old in text: text=text.replace(old,new,1)
          elif 'function rebuildOpaqueDepth(sun)' not in text: raise SystemExit('blit source not found')
          old_frame="gl.viewport(0,0,canvas.width,canvas.height);blitOpaque();const sun=sunDirection();drawWater(sun);drawMedia();"
          new_frame="gl.viewport(0,0,canvas.width,canvas.height);blitOpaque();const sun=sunDirection();rebuildOpaqueDepth(sun);drawWater(sun);drawMedia();"
          if old_frame in text: text=text.replace(old_frame,new_frame,1)
          elif 'rebuildOpaqueDepth(sun);drawWater(sun)' not in text: raise SystemExit('frame source not found')
          text=text.replace("query.has('qa')&&!qaScheduled&&physicalTime>4.5","query.has('qa')&&!qaScheduled&&physicalTime>.35",1)
          text=text.replace('setTimeout(captureVisualProbe,250)','setTimeout(captureVisualProbe,80)',1)
          path.write_text(text,encoding='utf-8')
          PY
          node --check ocean-mother/coast-v022-r012/core.mjs
          node --check ocean-mother/coast-v022-r012/shaders.mjs
          node --check ocean-mother/coast-v022-r012/app.mjs
          grep -q "export const VERSION='0.2.2-coast-r012'" ocean-mother/coast-v022-r012/core.mjs
          grep -q 'coast-0.2.2-r012-complete-daylight-scene' ocean-mother/coast-v022-r012/index.html
          grep -q 'antialias:false' ocean-mother/coast-v022-r012/app.mjs
          grep -q 'rebuildOpaqueDepth' ocean-mother/coast-v022-r012/app.mjs
          if find ocean-mother/coast-v022-r012 -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.webp' -o -iname '*.gif' -o -iname '*.bmp' -o -iname '*.tif' -o -iname '*.tiff' -o -iname '*.hdr' -o -iname '*.exr' -o -iname '*.ktx' -o -iname '*.ktx2' -o -iname '*.dds' -o -iname '*.avif' \) | grep -q .; then
            echo 'Persistent image asset found'; exit 1
          fi

      - name: Run real Chrome WebGL2 visual gates
        run: |
          set -euo pipefail
          python3 -m http.server 8127 --bind 127.0.0.1 > evidence/server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 1
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          BASE='http://127.0.0.1:8127/ocean-mother/coast-v022-r012/'
          COMMON=(--headless=new --no-sandbox --disable-dev-shm-usage --enable-webgl --ignore-gpu-blocklist --use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader --disable-gpu-sandbox --hide-scrollbars --virtual-time-budget=12000)
          for VIEW in overview shore breaker fire rocks; do
            "$CHROME" "${COMMON[@]}" --window-size=1600,900 --dump-dom "${BASE}?qa=1&view=${VIEW}" > "evidence/${VIEW}.dom.html" 2> "evidence/${VIEW}.chrome.log"
            "$CHROME" "${COMMON[@]}" --window-size=1600,900 --screenshot="evidence/${VIEW}.png" "${BASE}?qa=1&view=${VIEW}" >> "evidence/${VIEW}.chrome.log" 2>&1
          done
          "$CHROME" "${COMMON[@]}" --window-size=390,844 --dump-dom "${BASE}?qa=1&view=overview&mobile=1" > evidence/mobile.dom.html 2> evidence/mobile.chrome.log
          "$CHROME" "${COMMON[@]}" --window-size=390,844 --screenshot=evidence/mobile.png "${BASE}?qa=1&view=overview&mobile=1" >> evidence/mobile.chrome.log 2>&1
          python3 - <<'PY'
          from pathlib import Path
          import html,json,re
          root=Path('evidence'); views=('overview','shore','breaker','fire','rocks'); probes={}; errors=[]; imageBytes={}
          bad_pattern=re.compile(r'illegal use of reserved word|ERROR:\s*0:|shader.{0,30}compile|当前浏览器未提供 WebGL2|Uncaught\s+(?:TypeError|ReferenceError|Error)|GL_INVALID_OPERATION:\s*glBlitFramebuffer',re.I)
          for view in views:
              dom=(root/f'{view}.dom.html').read_text(errors='replace'); log=(root/f'{view}.chrome.log').read_text(errors='replace')
              bad=bad_pattern.search(dom+'\n'+log)
              if bad: errors.append({'view':view,'error':bad.group(0),'tail':(dom+'\n'+log)[-3500:]})
              match=re.search(r'<pre id="qaProbe"[^>]*>(.*?)</pre>',dom,re.S)
              if not match or not match.group(1).strip(): errors.append({'view':view,'error':'qaProbe missing'}); continue
              probes[view]=json.loads(html.unescape(match.group(1)))
              shot=root/f'{view}.png'; imageBytes[view]=shot.stat().st_size if shot.exists() else 0
              if imageBytes[view]<30000: errors.append({'view':view,'error':'screenshot missing or too small'})
          mdom=(root/'mobile.dom.html').read_text(errors='replace'); mlog=(root/'mobile.chrome.log').read_text(errors='replace'); mm=re.search(r'<pre id="qaProbe"[^>]*>(.*?)</pre>',mdom,re.S); mobile=json.loads(html.unescape(mm.group(1))) if mm and mm.group(1).strip() else {}
          if bad_pattern.search(mdom+'\n'+mlog): errors.append({'view':'mobile','error':'mobile runtime error'})
          if not mobile: errors.append({'view':'mobile','error':'qaProbe missing'})
          overview=probes.get('overview',{}); shore=probes.get('shore',{}); fire=probes.get('fire',{}); ov=overview.get('visualProbe') or {}; sv=shore.get('visualProbe') or {}; fv=fire.get('visualProbe') or {}; comp=overview.get('composition') or {}
          checks={
            'fiveDesktopViewsLoaded':len(probes)==5,
            'allDesktopViewsReady':all(probes.get(v,{}).get('ready') is True and not probes.get(v,{}).get('error') for v in views),
            'runtimeAdvanced':overview.get('physicalTime',0)>.35,
            'daylightAverage':ov.get('averageLuminance',0)>.16,
            'daylightSky':ov.get('topLuminance',0)>.20,
            'sceneNotBlack':ov.get('nonDarkRatio',0)>.72,
            'waterSkyVisible':ov.get('blueWaterSkyRatio',0)>.015,
            'earthRockVisible':ov.get('earthSandRockRatio',0)>.002,
            'fireVisible':fv.get('warmFireRatio',0)>.00001,
            'shoreVisible':sv.get('averageLuminance',0)>.12,
            'compositionPresent':comp.get('rockCount',0)>=20 and comp.get('fireRingRockCount',0)>=12 and comp.get('logCount',0)>=4,
            'mediaPresent':comp.get('smokeParticles',0)>=20 and comp.get('flameParticles',0)>=20,
            'foamPresent':comp.get('foamActiveCells',0)>=50,
            'screenshotsPresent':all(imageBytes.get(v,0)>=30000 for v in views),
            'mobileReady':mobile.get('ready') is True and not mobile.get('error') and mobile.get('physicalTime',0)>.35,
            'logsClean':not errors,
          }
          report={'status':'LOCAL_BROWSER_PASS' if all(checks.values()) else 'LOCAL_BROWSER_FAIL','checksPassed':sum(bool(v) for v in checks.values()),'checksFailed':sum(not bool(v) for v in checks.values()),'checks':checks,'probes':probes,'mobileProbe':mobile,'imageBytes':imageBytes,'errors':errors,'screenshotsInternalEvidenceOnly':True,'persistentImageAssets':0}
          (root/'LOCAL_BROWSER_QA.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps({k:v for k,v in report.items() if k not in {'probes','mobileProbe'}},ensure_ascii=False,indent=2))
          if report['status']!='LOCAL_BROWSER_PASS': raise SystemExit(1)
          PY

      - name: Persist repaired runtime source
        run: |
          set -euo pipefail
          git config user.name 'Ocean Mother CI'
          git config user.email 'actions@users.noreply.github.com'
          git add ocean-mother/coast-v022-r012/app.mjs
          if ! git diff --cached --quiet; then
            git commit -m 'fix(ocean): make R012 render cache multisample-safe'
            git push origin HEAD:work/ocean-mother-handoff-20260901
          fi

      - name: Publish verified runtime atomically to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,os,time,urllib.request
          from pathlib import Path
          repo='haihao0307/guilin-dem-pipeline'; branch='gh-pages'; source=Path('ocean-mother/coast-v022-r012'); target='ocean-mother/coast-v022-r012'; base='https://api.github.com/repos/'+repo; token=os.environ['GH_TOKEN']
          def api(path,body=None,method=None):
              req=urllib.request.Request(base+path,data=None if body is None else json.dumps(body).encode(),method=method or ('GET' if body is None else 'POST'),headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','Content-Type':'application/json','Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=60) as response:return json.load(response)
          head=api('/git/ref/heads/'+branch+'?nonce='+str(time.time_ns()))['object']['sha']; base_tree=api('/git/commits/'+head)['tree']['sha']; entries=[]; files={}
          for p in sorted(source.iterdir()):
              if not p.is_file(): continue
              data=p.read_bytes(); blob=api('/git/blobs',{'content':base64.b64encode(data).decode(),'encoding':'base64'})['sha']; entries.append({'path':target+'/'+p.name,'mode':'100644','type':'blob','sha':blob}); files[p.name]={'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'gitBlobSha':blob}
          tree=api('/git/trees',{'base_tree':base_tree,'tree':entries})['sha']; commit=api('/git/commits',{'message':'fix(ocean): publish verified Coast R012 after 404','tree':tree,'parents':[head]})['sha']
          assert api('/git/ref/heads/'+branch+'?nonce='+str(time.time_ns()))['object']['sha']==head
          api('/git/refs/heads/'+branch,{'sha':commit,'force':False},'PATCH'); assert api('/git/ref/heads/'+branch+'?nonce='+str(time.time_ns()))['object']['sha']==commit
          receipt={'status':'PUBLISHED','runtimeVersion':'0.2.2-coast-r012','publicCommit':commit,'targetPath':target,'files':files,'forcePush':False,'persistentImageAssets':0,'visualApproved':False,'productionApproved':False}
          Path('evidence/PUBLISH.json').write_text(json.dumps(receipt,ensure_ascii=False,indent=2)+'\n'); print(json.dumps(receipt,ensure_ascii=False,indent=2))
          PY

      - name: Verify public URL and public Chrome WebGL2
        run: |
          set -euo pipefail
          URL='https://haihao0307.github.io/guilin-dem-pipeline/ocean-mother/coast-v022-r012/'
          ready=0
          for attempt in $(seq 1 42); do
            curl -fsSL -H 'Cache-Control: no-cache' "${URL}?readback=$RANDOM-$attempt" -o evidence/public-index.html || true
            if grep -q 'coast-0.2.2-r012-complete-daylight-scene' evidence/public-index.html 2>/dev/null; then ready=1; break; fi
            sleep 10
          done
          test "$ready" = 1
          curl -fsSL -H 'Cache-Control: no-cache' "${URL}core.mjs?readback=$RANDOM" -o evidence/public-core.mjs
          curl -fsSL -H 'Cache-Control: no-cache' "${URL}app.mjs?readback=$RANDOM" -o evidence/public-app.mjs
          grep -q "export const VERSION='0.2.2-coast-r012'" evidence/public-core.mjs
          grep -q 'antialias:false' evidence/public-app.mjs
          grep -q 'rebuildOpaqueDepth' evidence/public-app.mjs
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          COMMON=(--headless=new --no-sandbox --disable-dev-shm-usage --enable-webgl --ignore-gpu-blocklist --use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader --disable-gpu-sandbox --hide-scrollbars --virtual-time-budget=12000)
          "$CHROME" "${COMMON[@]}" --window-size=1600,900 --dump-dom "${URL}?qa=1&view=overview&public=$RANDOM" > evidence/public.dom.html 2> evidence/public.chrome.log
          "$CHROME" "${COMMON[@]}" --window-size=1600,900 --screenshot=evidence/public.png "${URL}?qa=1&view=overview&public=$RANDOM" >> evidence/public.chrome.log 2>&1
          python3 - <<'PY'
          from pathlib import Path
          import html,json,re
          dom=Path('evidence/public.dom.html').read_text(errors='replace'); log=Path('evidence/public.chrome.log').read_text(errors='replace'); m=re.search(r'<pre id="qaProbe"[^>]*>(.*?)</pre>',dom,re.S); probe=json.loads(html.unescape(m.group(1))) if m and m.group(1).strip() else {}; v=probe.get('visualProbe') or {}; c=probe.get('composition') or {}; bad=re.search(r'illegal use of reserved word|ERROR:\s*0:|shader.{0,30}compile|当前浏览器未提供 WebGL2|Uncaught\s+(?:TypeError|ReferenceError|Error)|GL_INVALID_OPERATION:\s*glBlitFramebuffer',dom+'\n'+log,re.I)
          checks={'buildIdentity':'coast-0.2.2-r012-complete-daylight-scene' in dom,'runtimeReady':probe.get('ready') is True,'runtimeNoError':not probe.get('error'),'runtimeAdvanced':probe.get('physicalTime',0)>.35,'daylight':v.get('averageLuminance',0)>.16 and v.get('topLuminance',0)>.20,'sceneNotBlack':v.get('nonDarkRatio',0)>.72,'coastVisible':v.get('earthSandRockRatio',0)>.002,'waterVisible':v.get('blueWaterSkyRatio',0)>.015,'compositionPresent':c.get('rockCount',0)>=20 and c.get('smokeParticles',0)>=20 and c.get('flameParticles',0)>=20 and c.get('foamActiveCells',0)>=50,'logsClean':bad is None}
          report={'status':'PUBLIC_BROWSER_PASS' if all(checks.values()) else 'PUBLIC_BROWSER_FAIL','checksPassed':sum(bool(x) for x in checks.values()),'checksFailed':sum(not bool(x) for x in checks.values()),'checks':checks,'probe':probe,'errorMatch':bad.group(0) if bad else None,'url':'https://haihao0307.github.io/guilin-dem-pipeline/ocean-mother/coast-v022-r012/','persistentImageAssets':0}
          Path('evidence/PUBLIC_BROWSER_QA.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n'); print(json.dumps(report,ensure_ascii=False,indent=2))
          if report['status']!='PUBLIC_BROWSER_PASS': raise SystemExit(1)
          PY

      - name: Preserve QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ocean-coast-r012-404-repair-v2-evidence
          path: evidence/
          if-no-files-found: error
          retention-days: 90
          compression-level: 9
