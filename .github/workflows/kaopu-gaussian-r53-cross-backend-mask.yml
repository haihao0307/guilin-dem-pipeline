name: KAOPU Gaussian R53 Cross Backend Mask

on:
  push:
    branches:
      - coordination/kaopu-learning-flywheel-r1-20260909
    paths:
      - docs/mother_coordination/kaopu_learning_flywheel_v1/PROBES/gaussian_three_cross_backend_mask_r53.html
      - docs/mother_coordination/kaopu_learning_flywheel_v1/PROBES/run_gaussian_three_cross_backend_mask_r53.js
      - docs/mother_coordination/kaopu_learning_flywheel_v1/ADAPTERS/gaussian_three_cross_backend_mask_gate_r53.mjs
      - .github/workflows/kaopu-gaussian-r53-cross-backend-mask.yml

permissions:
  contents: read

jobs:
  r53-cross-backend-mask:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout coordination branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned renderer and common browser harness
        shell: bash
        run: |
          npm init -y
          npm pkg set type=module
          npm install --no-save three@0.186.0 playwright@1.57.0
          npx playwright install --with-deps chromium

      - name: Start local fixture server
        shell: bash
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/r53-http.log 2>&1 &
          echo $! > /tmp/r53-http.pid
          sleep 2
          curl --fail --silent http://127.0.0.1:8765/docs/mother_coordination/kaopu_learning_flywheel_v1/PROBES/gaussian_three_cross_backend_mask_r53.html > /dev/null

      - name: Run exact WebGL-WebGPU mask comparison
        run: node docs/mother_coordination/kaopu_learning_flywheel_v1/PROBES/run_gaussian_three_cross_backend_mask_r53.js

      - name: Validate R53 exact comparison contract
        shell: bash
        run: |
          cat r53-comparison.json | node docs/mother_coordination/kaopu_learning_flywheel_v1/ADAPTERS/gaussian_three_cross_backend_mask_gate_r53.mjs > r53-gate.json
          cat r53-gate.json
          python3 - <<'PY'
          import json
          d = json.load(open('r53-gate.json'))
          if d.get('status') != 'Candidate-pass':
              raise SystemExit(f"R53 gate failed: {d}")
          PY

      - name: Upload R53 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaopu-gaussian-r53-cross-backend-mask
          path: |
            r53-result-webgl.json
            r53-result-webgpu.json
            r53-comparison.json
            r53-gate.json
          if-no-files-found: warn
          retention-days: 30
