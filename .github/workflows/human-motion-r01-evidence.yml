name: Human Motion R01 Preserve Verified Evidence
on:
  push:
    branches: [feature/human-motion-workbench-r01-20261013]
    paths: [.github/workflows/human-motion-r01-evidence.yml]
permissions:
  contents: write
  actions: read
jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/human-motion-workbench-r01-20261013
          sparse-checkout: |
            kaopu-unified-human-workbench/motion-review-r01
            docs/handoffs
      - name: Preserve already-executed browser evidence without rerunning or altering runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os,urllib.request,zipfile,io,json,pathlib,hashlib
          root=pathlib.Path('docs/handoffs/motion-review-r01-20261013');root.mkdir(parents=True,exist_ok=True)
          def artifact(id,digest):
            req=urllib.request.Request('https://api.github.com/repos/haihao0307/guilin-dem-pipeline/actions/artifacts/'+str(id)+'/zip',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
            data=urllib.request.urlopen(req,timeout=90).read();assert hashlib.sha256(data).hexdigest()==digest,'Artifact digest mismatch';return zipfile.ZipFile(io.BytesIO(data))
          a=artifact(11802592127,'9012ba25f51ade914bebd60d341fb44a6735d6b3c294d85a545274b505f2de38')
          def matching(z,suffix):
            names=[n for n in z.namelist() if n.endswith(suffix)];assert len(names)==1,(suffix,names);return z.read(names[0])
          qa=json.loads(matching(a,'motion-evidence/public/qa.json'));assert qa['pass'] and len(qa['checks'])==65 and len(qa['clips'])==53
          build='773f717b38ff5adf776c99fc30f06c113b4727a6';url='https://htmlpreview.github.io/?https://raw.githubusercontent.com/haihao0307/guilin-dem-pipeline/'+build+'/kaopu-unified-human-workbench/motion-review-r01/preview.html';assert qa['url']==url
          (root/'PUBLIC_QA_FULL.json').write_text(json.dumps(qa,ensure_ascii=False,indent=2))
          catalogue=json.loads(matching(a,'motion-review-r01/CATALOGUE.json'));(root/'CATALOGUE.json').write_text(json.dumps(catalogue,ensure_ascii=False,indent=2))
          for image in qa['images']:(root/image).write_bytes(matching(a,'motion-evidence/public/'+image))
          b=artifact(11803700255,'8145935b10ed2f2dfb99d30a36bde9da6681db9af89b14fe437e944175a4a500')
          repeat=json.loads(matching(b,'motion-accept/qa.json'));assert len(repeat['clips'])==53 and not repeat['pass']
          (root/'REPEAT_QA_WITH_SCREENSHOT_TIMEOUT.json').write_text(json.dumps(repeat,ensure_ascii=False,indent=2))
          body=[c for c in qa['clips'] if 'prepareMS' in c];face_switch=next(s for s in qa['final']['switches'] if s['id']=='face:idle')
          summary={'version':'MOTION-REVIEW-R01','publicURL':url,'sourceCommit':'2505ea9d994026a648ec48a84e3e5194deb0301b','buildCommit':build,'character':'HUMAN-INTEGRATED-R04','characterCommit':'e5df3bcba13ba566d6da27d5cb051e91956055b3','counts':catalogue['counts'],'publicQA':{'run':38378225234,'checksPassed':65,'entriesChecked':53,'firstReadyMS':qa['startupMS'],'bodyPrepareMinMS':min(c['prepareMS'] for c in body),'bodyPrepareMaxMS':max(c['prepareMS'] for c in body),'fullBodyModelRegenerationCalls':sum(c['modelComputes'] for c in body),'firstFacialSelectionMS':face_switch['milliseconds'],'softwareRenderFPS':qa['softwarePlayback']['fps'],'softwareFrameP95MS':qa['softwarePlayback']['frameP95MS'],'softwareCPUSubmitMS':qa['softwarePlayback']['meanSubmitMS'],'pageErrors':qa['pageErrors'],'consoleErrors':qa['consoleErrors']},'repeatQA':{'run':38380507521,'checksBeforeScreenshotTimeout':len(repeat['checks']),'entriesChecked':len(repeat['clips']),'completed':False,'failure':repeat['error'],'pageErrors':repeat['errors']},'userVisualAcceptance':False,'allActionsNatural':False,'stable60FPSCertified':False,'physicalPhoneTested':False,'physicsCertified':False,'unportedLegacyCount':10,'artifactDigestsVerified':True,'originalR04AndMotionRuntimeUnchanged':True}
          (root/'DELIVERY.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2))
          text='# 人物动作检查台 R01：交付与当前质量\n\n固定网页：'+url+'\n\n人物：R04；原总台、原动作采样器和旧版入口不改。独立工作台把同一个最新人物完整表面接到原生骨架，而不是隐藏最新人、换旧简化演员。\n\n## 实际验证结果\n\n公开固定页面完成65项检查、53个可播放入口。全身/手部40个入口各采样三处时间；另有13个待机/面部通道。原始人物顶点、拓扑、存档、同一表皮与材质保持；动作固定骨长。此范围不是所有动作每一帧的人工视频审阅，也不是物理或艺术质量通过。原完整报告及10张真实截图在同目录。\n\n全身条目准备实测约34–740毫秒；缓存复用不重新造人。全身条目准备/播放未调用人物形体重算。公开测试首次人物就绪23.147秒；第一次面部选择额外需要约'+str(round(face_switch['milliseconds']/1000,1))+'秒。原模型资产约84 MB，面部基底缓存约95.8 MB，尚未消除这些成本。\n\n软件图形渲染测试约4.9 FPS、P95帧间隔3200 ms，出现长停顿；CPU提交约0.65 ms并不等于GPU已达到实时。不能宣称稳定60FPS或流畅度已合格。这不是用户真实显卡或手机帧率；页面显示用户本机的实时FPS和帧间隔。\n\n第二次独立公开复测再次完成53入口、60项检查，但最终手机尺寸截图超时，整轮未通过；失败报告原样保存，不隐藏、不改写成绿色。第一轮390×844手机尺寸布局已通过，但没有手机实机验证。\n\n## 肉眼抽查判断与未通过项\n\n行走和拳击的动作大形能够辨认，最新头部、耳唇与身体随动作保留。拳击守架仍偏姿势编排，不能当作会对抗的角色；握拳没有完全紧握感。抱物抽查中手与箱体贴合/支撑感不足，且没有负载物理。闭眼截图存在睑缘弯曲及细褶不自然。小跳、跑步和停止的脚底接触、缓冲、重播边界仍要继续修。循环只是重播原片段，不是无缝连续行走。\n\n骨骼插值和快速切换不自动修复原动作、触地、抓握、肌肉体积、衣服或碰撞。旧R2的坐、躺、挥手、敬礼、负载搬运等仍与最新骨架/接触体系不兼容，本页灰色列明、不用旧人冒充迁移完成。\n\n## 数量口径及全部条目\n\n28个全身/手部/完整套路（3+7+18），12个拳击摘段另列，13个面部待机通道；共53可选入口。摘段、松握配置和组合不是新增独立动捕。另10个旧R2分类、3个双人/群体场景只列现状未迁入。\n'
          group=''
          for r in catalogue['records']:
            if r['group']!=group:group=r['group'];text+='\n### '+group+'\n\n'
            text+='- '+r['label']+' (`'+r['id']+'`)：'+('可播放。' if r['playable'] else '未迁入此人物。')+r['note']+'\n'
          (root/'README.md').write_text(text)
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/handoffs/motion-review-r01-20261013
          git commit -m 'docs(motion): immutable public evidence, complete catalogue and honest quality limits [skip ci]'
          git push origin HEAD:feature/human-motion-workbench-r01-20261013
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: human-motion-r01-permanent-handoff
          path: docs/handoffs/motion-review-r01-20261013
          retention-days: 14
