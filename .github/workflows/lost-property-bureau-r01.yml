name: Lost property bureau whole machine QA
on:
  push:
    branches: ['qa/lost-property-bureau-r01-*', 'gh-pages']
    paths:
      - 'kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01/lost-property-bureau-r01/**'
      - '.github/workflows/lost-property-bureau-r01.yml'
permissions:
  contents: read
jobs:
  full-machine:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: kaopu-minigame-workbench/voxel-train-study
      - name: SI-clock and logistics regression
        run: node --test kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01/lost-property-bureau-r01/qa/simulation.test.mjs
      - name: Install official pinned browser runner
        run: |
          npm install --prefix "$RUNNER_TEMP/bureau" --no-save --ignore-scripts --no-audit --no-fund playwright@1.57.0
          "$RUNNER_TEMP/bureau/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/bureau/node_modules" >> "$GITHUB_ENV"
      - name: Actual WebGL desktop and mobile viewport
        run: node kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01/lost-property-bureau-r01/qa/browser.cjs
      - name: Verify deployed source bytes and public WebGL
        if: github.ref_name == 'gh-pages'
        run: node kaopu-minigame-workbench/voxel-train-study/game/r20-plants-r01/lost-property-bureau-r01/qa/public-check.cjs
      - name: Retain real screenshots and receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: bureau-${{ github.sha }}
          path: bureau-results/
          retention-days: 7
          compression-level: 0
