name: Ocean Mother fixed-ref handoff audit

on:
  push:
    branches: [work/ocean-mother-handoff-20260901]
    paths: [.github/workflows/ocean-mother-handoff-audit.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download exact sources and independently verify archive and manifest
        shell: bash
        run: |
          mkdir -p evidence
          python3 - <<'PY'
          import hashlib, io, json, os, pathlib, sys, traceback, urllib.request, zipfile
          from datetime import datetime, timezone

          repo = 'haihao0307/guilin-dem-pipeline'
          release_ref = '2619725efe236d2df8f2a55031bdae9e60a51555'
          startup_ref = 'c762658e22d76f9d833c726140831ed257162b75'
          expected_zip = '596b963fef0cc2eafe7855178ae9f93c3e2aef2b78bdf98dd5e9e49c1a443bae'
          runtime = ['index.html', 'engine.js', 'field-worker.js', 'cloud.glsl', 'motion.js', 'reuse.js']
          out = pathlib.Path('evidence')
          report = {
              'productionLine': 'Ocean Mother',
              'stage': 'handoff-integrity-audit',
              'repository': repo,
              'releaseRef': release_ref,
              'startupRef': startup_ref,
              'runId': os.environ.get('GITHUB_RUN_ID'),
              'auditCommit': os.environ.get('GITHUB_SHA'),
              'environment': 'GitHub Actions runner, separate from chat container',
              'timestampUTC': datetime.now(timezone.utc).isoformat(),
              'status': 'FAILED',
              'checks': [],
              'files': {},
              'visualAcceptance': False,
              'productionReady': False,
              'oceanImplemented': False,
              'weatherRuntimeModified': False,
          }

          def sha(data):
              return hashlib.sha256(data).hexdigest()

          def check(name, condition, **details):
              report['checks'].append({'name': name, 'passed': bool(condition), **details})
              if not condition:
                  raise AssertionError(name)

          def get(path, ref=release_ref):
              url = f'https://raw.githubusercontent.com/{repo}/{ref}/{path}'
              request = urllib.request.Request(url, headers={'User-Agent': 'Ocean-Mother-Handoff-Audit/1'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  if response.status != 200:
                      raise RuntimeError(f'HTTP {response.status}: {path}')
                  return response.read()

          try:
              startup = get('weather-mother/OCEAN_START_HERE.md', startup_ref)
              (out / 'OCEAN_START_HERE.md').write_bytes(startup)
              check('startup identifies exact publication ref', release_ref.encode() in startup)
              check('startup identifies exact archive hash', expected_zip.encode() in startup)
              archive = get('weather-mother/distributions/Weather_Mother_Clean_V1.0.0.zip')
              (out / 'Weather_Mother_Clean_V1.0.0.zip').write_bytes(archive)
              report['zip'] = {'bytes': len(archive), 'sha256': sha(archive), 'downloadedOnRunner': True, 'extractedOnRunner': False}
              check('archive byte count', len(archive) == 37906, actual=len(archive))
              check('archive SHA256', sha(archive) == expected_zip, actual=sha(archive))
              prefix = 'Weather_Mother_Clean_V1.0.0/'
              with zipfile.ZipFile(io.BytesIO(archive)) as z:
                  check('archive CRC', z.testzip() is None)
                  names = z.namelist()
                  check('archive has exactly twelve files', len(names) == 12 and all(not n.endswith('/') for n in names))
                  check('archive safe root and flat entries', all(n.startswith(prefix) and pathlib.PurePosixPath(n).parts[0] == prefix[:-1] and len(pathlib.PurePosixPath(n).parts) == 2 and '..' not in pathlib.PurePosixPath(n).parts for n in names))
                  payload = {n[len(prefix):]: z.read(n) for n in names}
                  check('archive uncompressed byte count', sum(map(len, payload.values())) == 92160)
                  for name, data in payload.items():
                      target = out / 'extracted' / prefix[:-1] / name
                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.write_bytes(data)
              report['zip']['extractedOnRunner'] = True
              manifest = json.loads(payload['MANIFEST.json'])
              handoff = json.loads(payload['HANDOFF.json'])
              check('package version', manifest['packageVersion'] == handoff['packageVersion'] == '1.0.0-clean')
              check('render baseline', handoff['renderBaseline'] == '0.6.2-loop')
              check('runtime file list', handoff['runtimeFiles'] == runtime)
              check('manifest covers all other files', set(manifest['files']) == set(payload) - {'MANIFEST.json'})
              for name, spec in manifest['files'].items():
                  data = payload[name]
                  check(f'manifest bytes: {name}', len(data) == spec['bytes'], actual=len(data))
                  check(f'manifest SHA256: {name}', sha(data) == spec['sha256'], actual=sha(data))
              for name, data in payload.items():
                  repository_data = get(f'weather-mother/clean-v1/{name}')
                  target = out / 'repository-clean-v1' / name
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(repository_data)
                  check(f'repository bytes identical to archive: {name}', repository_data == data)
                  report['files'][name] = {'bytes': len(data), 'sha256': sha(data), 'gitBlobSHA1': hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest(), 'repositoryEqualsArchive': repository_data == data}
              runtime_bytes = sum(len(payload[n]) for n in runtime)
              check('runtime byte count', runtime_bytes == manifest['runtimeBytes'] == 72337, actual=runtime_bytes)
              for name in ['cloud.glsl', 'field-worker.js', 'motion.js']:
                  check(f'frozen kernel identity: {name}', sha(payload[name]) == manifest['baselineSHA256'][name] and manifest['kernelIdentity'][name] is True)
              check('ten cloud genera retained', len(handoff['cloudGenera']) == 10)
              check('eight weather cases retained', len(handoff['weatherCases']) == 8)
              check('no ocean completion claim', handoff['claims']['oceanImplemented'] is False)
              check('no production approval claim', handoff['claims']['productionReady'] is False)
              report['runtimeBytes'] = runtime_bytes
              report['status'] = 'HANDOFF_INTEGRITY_VERIFIED'
          except Exception as exc:
              report['error'] = f'{type(exc).__name__}: {exc}'
              traceback.print_exc()
          finally:
              report['passedChecks'] = sum(c['passed'] for c in report['checks'])
              report['failedChecks'] = sum(not c['passed'] for c in report['checks'])
              text = json.dumps(report, ensure_ascii=False, indent=2) + '\n'
              (out / 'OCEAN_HANDOFF_VERIFICATION.json').write_text(text, encoding='utf-8')
              print(text)
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
                  summary.write('# Ocean Mother handoff audit\n\n' + report['status'] + '\n\n')
                  summary.write('Publication ref: `' + release_ref + '`\n\n')
                  summary.write(f"Passed checks: {report['passedChecks']}; failed checks: {report['failedChecks']}\n\n")
                  summary.write('Verification only. No weather runtime changes, no deployment, no visual or ocean completion approval.\n')
          if report['status'] != 'HANDOFF_INTEGRITY_VERIFIED':
              sys.exit(1)
          PY
      - name: Preserve verification evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ocean-mother-handoff-verification
          path: evidence/
          if-no-files-found: error
          retention-days: 30
