<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><meta name="color-scheme" content="dark"><title>KAOPU · Fab Fabric Material Lab R02</title><style>
*{box-sizing:border-box}body{margin:0;background:#171819;color:#e8e5df;font:14px/1.5 system-ui,-apple-system,sans-serif}header{height:54px;border-bottom:1px solid #383a3b;display:flex;align-items:center;padding:0 20px;gap:18px}header strong{letter-spacing:.04em}header small,.device{color:#9b9b96}.device{margin-left:auto;font-size:10px}main{height:calc(100vh - 54px);display:grid;grid-template-columns:minmax(500px,1.08fr) minmax(430px,.92fr);gap:14px;padding:14px}.left{min-width:0;display:grid;grid-template-rows:minmax(310px,1fr) auto;gap:12px}.viewport{position:relative;background:#252728;border:1px solid #3a3c3d;min-height:0}canvas{width:100%;height:100%;display:block;touch-action:none;cursor:grab}canvas:active{cursor:grabbing}.overlay{position:absolute;left:15px;top:12px;pointer-events:none}.overlay b{display:block}.overlay span{color:#aaa;font-size:11px}.hint{position:absolute;bottom:10px;left:14px;color:#999;font-size:11px}.panel{border:1px solid #3a3c3d;background:#202223;padding:13px 15px;display:grid;grid-template-columns:1fr 1fr;gap:12px 18px}.panel h2{grid-column:1/-1;margin:0;font-size:13px;color:#d9c9ae}.control{display:grid;grid-template-columns:1fr auto;gap:6px}.control label{color:#bbb;font-size:12px}.control output{color:#e3d0b0;font-size:12px}.control input[type=range],.control select,.control input[type=color]{grid-column:1/-1;width:100%}input[type=range]{accent-color:#c7a77c}select,button{background:#2a2c2d;color:#eee;border:1px solid #505253;border-radius:3px;padding:7px 9px;font:inherit}button{cursor:pointer}.buttons{grid-column:1/-1;display:flex;gap:7px}.right{min-width:0;border:1px solid #3a3c3d;background:#1e2021;display:grid;grid-template-rows:auto 1fr auto;min-height:0}.rightHead,.rightFoot{padding:11px 14px;border-bottom:1px solid #3a3c3d;display:flex;align-items:center;justify-content:space-between}.rightFoot{border-top:1px solid #3a3c3d;border-bottom:0}.rightHead span,.status{color:#999;font-size:11px}textarea{width:100%;height:100%;min-height:0;resize:none;border:0;outline:none;background:#17191a;color:#c7d5c2;padding:15px;font:12px/1.55 ui-monospace,Consolas,monospace;white-space:pre;overflow:auto}.primary{background:#c8ad87;color:#1b1b1a;border-color:#c8ad87}.sources{grid-column:1/-1;font-size:11px;color:#898b8a}.sources a{color:#cbb18c;margin-right:10px}.error{color:#e7a28b}@media(max-width:950px){main{height:auto;min-height:calc(100vh - 54px);grid-template-columns:1fr;grid-template-rows:minmax(420px,60vh) minmax(500px,70vh)}.right{min-height:500px}}@media(max-width:560px){main{padding:8px;grid-template-rows:48vh auto}.panel{grid-template-columns:1fr}.right{min-height:65vh}}
</style></head><body><header><strong>KAOPU / FAB FABRIC LAB</strong><small>真实三维布片 · WebGPU · R02</small><span id="device" class="device">WebGPU starting…</span></header><main><section class="left"><div class="viewport"><canvas id="view" width="960" height="600"></canvas><div class="overlay"><b id="name">Plain cotton · 平纹棉</b><span id="description">三维网格布片</span></div><div class="hint">拖动旋转三维布片 · 滚轮缩放 · 真实网格与深度缓冲</div></div><section class="panel"><h2>材质参数 · 即时作用于三维布片</h2><div class="control"><label for="material">织物样本</label><output>8 类</output><select id="material"></select></div><div class="control"><label for="freq">织造密度</label><output id="freqValue">44</output><input id="freq" type="range" min="10" max="100" value="44"></div><div class="control"><label for="relief">纤维 / 织造起伏</label><output id="reliefValue">0.24</output><input id="relief" type="range" min="0" max="1" step=".01" value=".24"></div><div class="control"><label for="rough">粗糙度</label><output id="roughValue">0.90</output><input id="rough" type="range" min=".05" max="1" step=".01" value=".9"></div><div class="control"><label for="colorA">主色</label><input id="colorA" type="color" value="#c9c1b2"></div><div class="control"><label for="colorB">纱线 / 图案副色</label><input id="colorB" type="color" value="#8c8171"></div><div class="buttons"><button id="reset">恢复预设</button><button id="import">导入</button><button id="export" class="primary">导出 JSON</button><input id="file" type="file" accept=".json" hidden></div><div class="sources">Fab 免费参考：<a href="https://www.fab.com/listings/5b36dee7-0dfc-4d85-929f-85e07554b807" target="_blank">Plain Weave Cotton</a><a href="https://www.fab.com/listings/0d239be9-d45d-41c9-947c-831dca389d36" target="_blank">Cotton Twill</a><a href="https://www.fab.com/listings/2a4a568a-56de-4f3d-a8e2-16c4468d134e" target="_blank">Dobby Weave</a><a href="https://www.fab.com/listings/bb875143-5df0-42be-a8f7-5937b25660e4" target="_blank">Plain Wool</a><a href="https://www.fab.com/listings/85bf282f-33f3-4ab8-846a-d7916cd0ba4c" target="_blank">Free Weave</a></div></section></section><section class="right"><div class="rightHead"><b>完整材质函数 · WGSL</b><span>Ctrl + Enter 编译</span></div><textarea id="code" spellcheck="false"></textarea><div class="rightFoot"><span id="status" class="status">等待 WebGPU…</span><button id="compile" class="primary">编译并应用</button></div></section></main><script src="./app.js"></script></body></html>
