const main="#version 300 es\nprecision highp float;\nprecision highp int;\nout vec4 fragColor;\n// SPDX-License-Identifier: CC-BY-NC-SA-4.0\n// Copyright (c) 2026 @teadrinker\n//[LICENSE] https://creativecommons.org/licenses/by-nc-sa/4.0/\n\nuniform vec2 u_resolution;    // viewport size in pixels (width, height)\nuniform float u_time;         // seconds since playback started\nuniform vec4 u_mouse;         // xy: mouse pos, zw: click pos (negative when not pressed)\n\n// SPDX-License-Identifier: CC-BY-NC-SA-4.0\n// Copyright (c) 2026 @teadrinker\n//[LICENSE] https://creativecommons.org/licenses/by-nc-sa/4.0/\n\n// SPDX-License-Identifier: CC-BY-NC-SA-4.0\n// Copyright (c) 2026 @teadrinker\n//[LICENSE] https://creativecommons.org/licenses/by-nc-sa/4.0/\n\n// SPDX-License-Identifier: CC-BY-NC-SA-4.0\n// Copyright (c) 2026 @teadrinker\n//[LICENSE] https://creativecommons.org/licenses/by-nc-sa/4.0/\n\nuniform sampler2D u_pass1;\nuniform sampler2D u_main;\n\n#define NOISE_LOOKUP_SIZE 256\n// SPDX-License-Identifier: CC-BY-NC-SA-4.0\n// Copyright (c) 2026 @teadrinker\n//[LICENSE] https://creativecommons.org/licenses/by-nc-sa/4.0/\n\n//\n// Clouds shader from Goodbye Dream, released at Outline 2024\n// by teadrinker 2024, License: CC BY-NC-SA\n//\n//   https://youtu.be/ZXXnBtW2NcI\n//   https://demozoo.org/productions/345947/\n//\n\n#define _BaseSize         0.18\n#define _BaseOffset       0.2\n#define _BaseGradient    -1.8\n#define _Animate          1.0\n#define _AnimateBase      0.53\n#define _AnimateDetail   -0.11\n#define _AnimateDetail2   0.1\n#define _AnimateBaseV     vec3(0.0, 0.00, 1.00)\n#define _AnimateDetailV   vec3(1.0, 0.31, 0.55)\n#define _AnimateDetail2V  vec3(1.0, 0.00, 0.00)\n#define _BaseShape        1.54\n#define _BaseWeight       2.06\n#define _DetailWeight     0.93\n#define _DetailCombine   -0.25\n#define _DensityCutoff    0.47\n#define _LowDensityColor  vec4(0.668, 0.586, 0.801, 0.043)\n#define _HighDensityColor vec4(0.317, 0.250, 0.368, 0.270)\n#define _SunColor         vec4(1.000, 0.572, 0.410, 0.620)\n#define _BackgroundC      vec4(0.317, 0.250, 0.368, 0.886)\n#define _BackgroundSunC   vec4(0.698, 0.321, 0.239, 0.317)\n#define _BackgroundSunSize 0.22\n#define _Near             6.0\n#define _Far              42.0\n#define _FarFade          0.75\n#define _SunDir           vec3(-0.61, -0.1, 1.96)\n#define _SunCurve         0.286\n#define _SunOffset        0.963\n#define _Gamma            4.0\n#define _DetailCutoff    -0.4\n#define _AlphaMax         0.93\n#define _StepSizeInside   0.27\n#define _StepSizeOutside  0.66\n#define _Jitter           2.0\n#define _Debug            0.0  // 0.8 to see iterations, 0.6 to see 1st density hit\n#define Loop_Max 159\n\nfloat hashu(uvec2 q) {   // cc0 https://www.shadertoy.com/view/MdcfDj\n    q *= uvec2(1597334677U, 3812015801U);\n    uint n = (q.x ^ q.y) * 1597334677U;\n    return float(n) * (1.0 / float(0xffffffffU));\n}\n\nfloat hash(vec2 n) {\n    return hashu(uvec2(n * 9e5));\n}\n\nfloat noise(vec3 c)\n{\n    vec3 p = floor(c);\n    vec3 f = fract(c);\n    f = f * f * (3.0 - 2.0 * f);\n    vec2 zShift = vec2(99.0, 111.0) * mod(p.z, float(NOISE_LOOKUP_SIZE));\n    vec2 base = mod(p.xy + zShift, float(NOISE_LOOKUP_SIZE));\n    vec2 uv = base + f.xy + 0.5;\n    vec2 rg = textureLod(u_pass1, uv / u_resolution, 0.0).rg;\n    return mix(rg.r, rg.g, f.z) * 2.0 - 1.0;  \n}\n\n// Weather Mother own implementation. Value noise, not a stored image.\n// uint overflow is modulo 2^32. Lattice period 65536 cells per axis.\n// Coordinate unit: noise lattice cell; use a local/rebased frame.\n\nuint kaopuHash(uint x){x^=x>>16u;x*=0x7feb352du;x^=x>>15u;x*=0x846ca68bu;x^=x>>16u;return x;}\nfloat kaopuCorner(ivec2 p,uint seed){uvec2 q=uvec2(p)&uvec2(65535u);return float(kaopuHash(q.x^(q.y*0x9e3779b9u)^seed)>>8u)/16777216.;}\nvec2 kaopuFade(vec2 x){return x*x*x*(x*(x*6.-15.)+10.);}\nfloat kaopuNoise2(vec2 p,uint seed){\n ivec2 i=ivec2(floor(p));vec2 f=kaopuFade(fract(p));\n return mix(mix(kaopuCorner(i,seed),kaopuCorner(i+ivec2(1,0),seed),f.x),mix(kaopuCorner(i+ivec2(0,1),seed),kaopuCorner(i+ivec2(1,1),seed),f.x),f.y);\n}\nfloat kaopuFiltered2(vec2 p,uint seed,float footprint){return mix(kaopuNoise2(p,seed),.5,smoothstep(.25,.75,footprint));}\n\nfloat cloudDensity(vec3 p, float len) {\n    float linearField = (p.y * _BaseGradient + _BaseOffset) * _BaseWeight;\n    if (linearField < -_BaseWeight)\n        return -1000.;\n    float time = u_time * _Animate;\n    p += time * _AnimateBase * _AnimateBaseV;\n    \n    float basenoise = noise(mat3(0.5, -0.5, 0.70711, 0.85355, 0.14644, -0.5, 0.14644, 0.85355, 0.5) * p);\n    \n    float nd = 0.5 + 0.5 * basenoise; // normalized course density noise (0 to 1)\n    nd = pow(nd, _BaseShape);\n    float d = _BaseWeight * (nd*2.-1.);\n    d += linearField;\n    \n    // d here represents the course/larger cloud shape \n    \n    if (d > _DetailCutoff)\n    {\n        // detail density\n        p += time * _AnimateDetail * _AnimateDetailV;\n        float f = 0.28 * noise(p * 5.);\n        f += 0.2 * noise(p * 10.1);\n        p += time * _AnimateDetail2 * _AnimateDetail2V;\n        f += 0.1 * noise(p * 22.52);\n        \n        \n        float fadeDist = 6.;\n        if (len < fadeDist)\n        {\n            f += 0.057 * noise(p * 54.28);\n            \n            // fade fine detail by distance to avoid alias\n            // and increase detail on very close clouds\n            // (not ideal impl, tweaked for a lower resolution...)\n            float fadeByDist = (fadeDist - len) * (1. / fadeDist);\n            f += 0.1 * fadeByDist * noise(p * 154.28);\n            f += 0.025 * fadeByDist * (kaopuNoise2(p.xz * 27.0 + vec2(p.y * 3.1), 1297u) - 0.5);\n        }\n        \n        // comment out this line to see only course cloud shape \n        d += _DetailWeight * f * (1.0 - _DetailCombine * (nd - 0.5));\n\n    }    \n    return d;\n}\n\nfloat gm(float c) { return pow(c, _Gamma); }\nvec3 gm(vec3 c) { return pow(c.rgb, vec3(_Gamma)); }\nvec4 gm(vec4 c) { c.rgb = pow(c.rgb, vec3(_Gamma)); return c; }\n\nvec4 rm(vec3 ro, vec3 rd, vec2 uv) {\n\n    float len = 0.0;\n    vec4 sum = vec4(0.0);\n    float depthAlphaSum = 0.0;\n    \n    // As the ray-marching step size is \n    // quite large, each ray actually misses\n    // a lot of detail. Randomly offsetting\n    // initial distance helps a lot.\n    // The result is noisy though...\n    len = _Jitter * hash(uv+fract(u_time));\n\n    vec4 ldColor = gm(_LowDensityColor);  \n    vec4 hdColor = gm(_HighDensityColor);\n    vec3 sunColor = gm(_SunColor).rgb;\n    float ambient = gm(_SunColor.a);\n\n    int n = 0;\n    for (; n < Loop_Max; ++n)\n    {\n        vec3 p = ro + len * rd;\n        p *= _BaseSize;\n        float d = cloudDensity(p, len * _BaseSize);\n\n        if (d < -100. && sign(_BaseGradient)*rd.y < 0.)\n            break;\n            \n        if (d > _DensityCutoff) {\n\n            if(_Debug > 0.5 && _Debug < 0.75)\n            { \n                vec4 col = vec4(d, d, d, 1.0);\n                sum += col * (1.0 - sum.a);\n            }\n            else\n            {\n                // Approximate lighting with a single extra sample of the\n                // density function. Thanks to iq for this delightful trick:\n                //\n                //    https://iquilezles.org/articles/derivative/\n                //\n                float sundiff = cloudDensity(p+0.06*normalize(_SunDir), len * _BaseSize)-d;\n                \n                // Fake the appearance of shadowed valleys, just assume sun is low on the\n                // horizon, so the lower a point is, the more likely it is in shadow\n                float sunCurve = pow(max(0.0, _SunOffset - p.y*_BaseGradient*_SunCurve), 8.);\n            \n                float sun = max(0.0, -sunCurve * sundiff / 0.2);\n                            \n                d = clamp(d, 0., 1.);\n                vec4 col = mix(ldColor, hdColor, d);\n                col.rgb *= ambient + sunColor * sun * 5.;\n              \n                // make close clouds more transparent\n                col.a *= min(1.0, len / _Near);\n\n                // accumulate color and depth alpha\n                float weight = col.a * (1.0 - sum.a);\n                depthAlphaSum += weight * smoothstep(1.0 - _FarFade, 1.0, len / _Far);                               \n                sum.rgb += weight * col.rgb;\n                sum.a += weight;\n            }\n        }\n\n        len += d > _DetailCutoff ? _StepSizeInside : _StepSizeOutside;\n\n        if (len > _Far || sum.a > _AlphaMax)\n            break;\n    }\n\n    if (_Debug >= 0.75)\n        return vec4(vec3((float(n)/float(Loop_Max))), 1.0);\n\n    float depthAlpha = 1.0 - depthAlphaSum / (sum.a + 0.00001);\n\n    // if alpha has reached _AlphaMax\n    // clouds should be fully opaque\n    sum.a = sum.a / _AlphaMax;\n    \n    // \"fog\" / fade out by depth\n    sum.a *= depthAlpha;\n    \n    \n    // If you want to blend the clouds with other stuff\n    // the bright parts sort of disappear, to have more\n    // of an expected look, this hack tries to make bright\n    // parts more opaque, so that the final composite\n    // is more like the result of mixing the rgb with\n    // the sort of extreme gamma of 4.0 \n    \n    // sum.a += depthAlpha * depthAlpha * dot(vec3(2.0), sum.rgb);\n\n    sum.a = min(1.0, sum.a);\n    return sum;\n}\n\nvec4 renderPixel(vec3 ro, vec3 rd, vec2 uv) {\n\n    vec4 col = rm(ro, rd, uv);\n    float sun = 0.5 + 0.5 * dot(normalize(_SunDir), rd);\n    sun = pow((1. - pow(1. - sun, _BackgroundSunSize) ),1./ _BackgroundSunSize)* 5.;\n    \n    \n    // cheap/fake corona simulation:\n    //\n    // Make it so that background is brighter when overlayed with\n    // thin clouds close to the sun.\n    //  ( it actually brightens thicker clouds even more, but that\n    //    takes care of itself when blending bg and col later )\n    //\n    // together with the alpha-depth-fade-out/fog, this also\n    // contribute to a slight subsurface-scattering-look at\n    // further distances...\n    sun *= 1. + col.a * 6.;\n    \n    \n    // Note! there is an error in this line, bg.a might get larger than 1.0\n    // however, this looks better, so... (constants were tweaked before I found this out)\n    vec4 bg = gm(_BackgroundC) + _BackgroundSunC.a * sun * gm(_BackgroundSunC);\n    \n  \n    col = mix(bg, vec4(col.rgb,1.0), col.a);\n   \n    // inverse gamma\n    col.rgb = pow(col.rgb, vec3(1.0 / _Gamma));\n    \n    \n    // Make sure output alpha don't exceed 1,\n    // and if it does, apply it to color, \n    // (treat it as if it was blended from 0)\n    col.rgb *= max(1.0, col.a);\n    col.a = min(1.0, col.a);\n    return col;\n\n}\n\nvec2 rot(vec2 p, float r) { float s = sin(r),  c = cos(r); return vec2(p.x * c - p.y * s, p.x * s + p.y * c); } \n\n// uv = fragCoord/iResolution.xy\n// aspect = iResolution.x/iResolution.y\nvec3 camraydir(vec2 uv, float aspect, vec3 pos, vec3 target, float fov, float roll) { \n    vec3 forward = normalize(target - pos);\n    vec3 right = normalize(cross(vec3(0.0, 1.0, 0.0), forward));\n    vec3 up = normalize(cross(forward, right));\n    float halfH = tan(fov * 0.5);\n    uv = (2.0 * uv - 1.0) * vec2(halfH * aspect, halfH);\n    vec2 rotatedUV = mat2(cos(roll), -sin(roll), sin(roll), cos(roll)) * uv;\n    return normalize(forward + rotatedUV.x * right + rotatedUV.y * up);\n}\n\nvoid main()\n{\n    vec2 uv = gl_FragCoord.xy / u_resolution.xy;\n    float aspect = u_resolution.x / u_resolution.y;\n    vec2 mouse = (u_mouse.xy-0.5*u_resolution.xy)/u_resolution.y;\n    \n    vec3 campos = vec3(0.0,1.7,-3.0);\n    vec3 camtarget = vec3(0.0,1.7,6.0);\n    \n    float orbit = 0.0;\n    float updown = 0.0;\n    if (u_mouse.z > 0.) {\n        updown = clamp(-4.*mouse.y, -3.14159/2.0, 3.14159/2.0);\n        orbit = -4.*mouse.x;\n    }\n    campos -= camtarget;\n    campos.yz = rot(campos.yz, updown);\n    campos.xz = rot(campos.xz, orbit);    \n    campos += camtarget;\n \n    vec3 ro = campos;\n    vec3 rd = camraydir(uv, aspect, campos, camtarget, radians(40.), 0.0);\n    ro += vec3(125.,0.,64.); // start position\n    fragColor = renderPixel(ro, rd, uv);\n}\n ",aux="#version 300 es\nprecision highp float;\nprecision highp int;\nout vec4 fragColor;\n// SPDX-License-Identifier: CC-BY-NC-SA-4.0\n// Copyright (c) 2026 @teadrinker\n//[LICENSE] https://creativecommons.org/licenses/by-nc-sa/4.0/\n\nuniform vec2 u_resolution;    // viewport size in pixels (width, height)\nuniform float u_time;         // seconds since playback started\nuniform vec4 u_mouse;         // xy: mouse pos, zw: click pos (negative when not pressed)\n\n// SPDX-License-Identifier: CC-BY-NC-SA-4.0\n// Copyright (c) 2026 @teadrinker\n//[LICENSE] https://creativecommons.org/licenses/by-nc-sa/4.0/\n\n// SPDX-License-Identifier: CC-BY-NC-SA-4.0\n// Copyright (c) 2026 @teadrinker\n//[LICENSE] https://creativecommons.org/licenses/by-nc-sa/4.0/\n\n// SPDX-License-Identifier: CC-BY-NC-SA-4.0\n// Copyright (c) 2026 @teadrinker\n//[LICENSE] https://creativecommons.org/licenses/by-nc-sa/4.0/\n\nuniform sampler2D u_pass1;\nuniform sampler2D u_main;\n\n#define NOISE_LOOKUP_SIZE 256\n// SPDX-License-Identifier: CC-BY-NC-SA-4.0\n// Copyright (c) 2026 @teadrinker\n//[LICENSE] https://creativecommons.org/licenses/by-nc-sa/4.0/\n\nfloat hash(uvec2 q) {\n    q *= uvec2(1597334677U, 3812015801U);\n    uint n = (q.x ^ q.y) * 1597334677U;\n    return float(n ^ (n >> 15)) * (1.0 / float(0xffffffffU));\n}\n\nvoid main() {\n    ivec2 coord = ivec2(gl_FragCoord.xy);\n    \n    if (coord.x >= NOISE_LOOKUP_SIZE + 1 || coord.y >= NOISE_LOOKUP_SIZE + 1) { // + 1 since we can't use texture wrap mode\n        fragColor = vec4(0.0, 0.0, 0.0, 0.0);\n        return;\n    }\n    uvec2 pos = uvec2(coord) % uint(NOISE_LOOKUP_SIZE);\n    uvec2 zOffset = uvec2(99, 111);\n    float r = hash(pos);\n    float g = hash((pos + zOffset) % uint(NOISE_LOOKUP_SIZE));\n    fragColor = vec4(r, g, 0.0, 1.0);\n}";const c=document.getElementById('c'),gl=c.getContext('webgl2',{antialias:false,alpha:false});window.qa={ready:false,errors:[],frames:0};try{if(!gl)throw Error('需要 WebGL2');const vs='#version 300 es\nvoid main(){vec2 p=vec2((gl_VertexID<<1)&2,gl_VertexID&2);gl_Position=vec4(p*2.-1.,0.,1.);}';function shader(type,code){let a=gl.createShader(type);gl.shaderSource(a,code);gl.compileShader(a);if(!gl.getShaderParameter(a,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(a));return a}function program(fs){let p=gl.createProgram();gl.attachShader(p,shader(gl.VERTEX_SHADER,vs));gl.attachShader(p,shader(gl.FRAGMENT_SHADER,fs));gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(p));return p}let pr=program(main),ap=aux?program(aux):null,tex=null,fb=null;let w,h;function size(){let scale=Math.min(1,960/innerWidth,540/innerHeight);w=c.width=Math.max(1,Math.round(innerWidth*scale));h=c.height=Math.max(1,Math.round(innerHeight*scale));gl.viewport(0,0,w,h);if(ap){if(tex)gl.deleteTexture(tex);if(fb)gl.deleteFramebuffer(fb);tex=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tex);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA8,w,h,0,gl.RGBA,gl.UNSIGNED_BYTE,null);fb=gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,fb);gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,tex,0);gl.useProgram(ap);gl.uniform2f(gl.getUniformLocation(ap,'u_resolution'),w,h);gl.drawArrays(gl.TRIANGLES,0,3);gl.bindFramebuffer(gl.FRAMEBUFFER,null)}}addEventListener('resize',size);size();let mouse=[w*.5,h*.5,0,0],down=false;c.onpointerdown=e=>{down=true;c.setPointerCapture(e.pointerId);move(e)};c.onpointermove=move;c.onpointerup=()=>down=false;function move(e){let r=c.getBoundingClientRect();mouse=[(e.clientX-r.left)/r.width*w,(1-(e.clientY-r.top)/r.height)*h,down?1:0,0]}let last=0,t=0,playing=true,count=0,mark=0;document.getElementById('pause').onclick=()=>{playing=!playing;document.getElementById('pause').textContent=playing?'暂停':'播放'};function tick(now){if(!last)last=now;if(playing)t+=Math.min(.1,(now-last)/1000);last=now;gl.useProgram(pr);gl.uniform2f(gl.getUniformLocation(pr,'u_resolution'),w,h);gl.uniform1f(gl.getUniformLocation(pr,'u_time'),t);if(aux)gl.uniform4fv(gl.getUniformLocation(pr,'u_mouse'),mouse);else gl.uniform2f(gl.getUniformLocation(pr,'u_mouse'),mouse[0],mouse[1]);if(tex){gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,tex);gl.uniform1i(gl.getUniformLocation(pr,'u_pass1'),0)}gl.drawArrays(gl.TRIANGLES,0,3);qa.ready=true;qa.frames++;count++;if(now-mark>1000){document.getElementById('perf').textContent=w+'×'+h+' · '+Math.round(count*1000/(now-mark))+' FPS';count=0;mark=now}requestAnimationFrame(tick)}requestAnimationFrame(tick)}catch(e){qa.errors.push(String(e));document.getElementById('error').textContent=String(e)}</script></html>
