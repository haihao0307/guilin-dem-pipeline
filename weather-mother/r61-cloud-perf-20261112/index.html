<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Weather Mother</title>
<style>*{box-sizing:border-box}body{margin:0;background:#162d3b;color:#edf5fa;font:14px system-ui}header{height:96px;padding:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}nav{display:flex;gap:6px;overflow:auto}button{white-space:nowrap;color:inherit;background:#284d63;border:1px solid #5d8196;border-radius:20px;padding:9px 13px;cursor:pointer}button[aria-pressed=true]{background:#d6e8fa;color:#18374b}iframe{display:block;border:0;width:100%;height:calc(100dvh - 96px)}small{color:#b4c9d7}#error{color:#ffc6b4}button:focus-visible{outline:3px solid white}@media(max-width:700px){header{height:140px}iframe{height:calc(100dvh - 140px)}}</style><style>body{background:#fff;color:#172f42}header{height:54px;padding:8px 14px;background:#fff;border-bottom:1px solid #dbe3e7}.brand{display:flex;align-items:center;gap:8px}.brand img{width:34px;height:30px;object-fit:contain}.wm-symbol{font-size:19px}nav{position:fixed;bottom:0;left:0;right:0;z-index:10;background:#fff;border-top:1px solid #dbe3e7;padding:8px;display:flex;overflow-x:auto}nav button{color:#234257;background:#eef3f6;border:1px solid #cad8df}nav button[aria-pressed=true]{background:#234c64;color:white}header small{display:none}iframe{height:calc(100dvh - 110px)}@media(max-width:700px){header{height:54px}iframe{height:calc(100dvh - 110px)}}</style>
<style>body{margin:0;background:white}header{height:58px;display:flex;flex-wrap:nowrap;gap:8px;padding:4px 8px}.brand{flex:none;white-space:nowrap;gap:5px}.brand-mark{width:46px;height:37px;overflow:hidden;flex:0 0 46px}.brand .brand-logo{display:block;width:46px;height:auto;max-width:none;object-fit:initial}nav{position:static;flex:1;min-width:0;padding:0;border:0;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin}nav button{padding:7px 9px;font-size:12px;flex:none}iframe{height:calc(100dvh - 58px);width:100%}@media(max-width:700px){header{height:58px}iframe{height:calc(100dvh - 58px)}}</style>
<header><strong class="brand"><span class="brand-mark"><img class="brand-logo" src="wood-logo.png" alt="靠谱"></span>Weather Mother</strong><nav aria-label="云场景"><button data-scene="edge">云境流岚</button><button data-scene="pink">粉色天空</button><button data-scene="interactive">互动云</button><button data-scene="own1">云塔穿行</button><button data-scene="own2">晚霞云海</button><button data-scene="own3">晴空疏云</button><button data-scene="own4">夕照云海</button><button data-scene="tiny">程序噪声云海</button><button data-scene="waves">新造波云 · 三维</button><button data-scene="silver">银边积云</button><button data-scene="sea">层叠云海</button><button data-scene="flight">自由观察</button><button data-scene="weather">原天气系统</button><button data-scene="protean">云中飞行</button><button data-scene="lab">解析云实验</button></nav><small>无录像 · 无旧飞机 · 无噪声图片｜切换场景重新开始，释放上一场景资源。R33 连续噪声试换；原参考主体仍在，研究候选。</small><span id="error" role="alert"></span></header>
<main id="view"></main><script>
const SOURCES={"pink": "pages/pink.html", "interactive": "pages/interactive.html", "scapes": "pages/scapes.html", "flight": "pages/flight.html", "protean": "pages/protean.html", "lab": "pages/lab.html", "waves": "pages/waves.html", "own1": "pages/own1.html", "own2": "pages/own2.html", "own3": "pages/own3.html", "own4": "pages/own4.html", "edge": "pages/edge.html", "tiny": "pages/tiny.html", "weather": "pages/weather.html"};
let frame=null,ticket=0;
async function activate(scene){
 const key=['silver','sea'].includes(scene)?'scapes':scene;
 if(!SOURCES[key])return;
 document.getElementById('error').textContent='';const id=++ticket;frame?.remove();frame=document.createElement('iframe');frame.title='Weather Mother '+scene;
 frame.onload=()=>{if(id!==ticket)return;try{if(key==='scapes')frame.contentWindow.Cloudscape.setState({mode:scene==='silver'?1:0});window.WeatherR61.qa.loaded=true}catch(e){document.getElementById('error').textContent=String(e)}};
 try {
 const response=await fetch(SOURCES[key]);
 if(!response.ok)throw Error('场景加载失败 '+response.status);
 const source=await response.text();if(id!==ticket)return;
 frame.srcdoc=source;
 }catch(e){if(id===ticket)document.getElementById('error').textContent=String(e);return;}document.getElementById('view').replaceChildren(frame);
 document.querySelectorAll('[data-scene]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.scene===scene)));
 window.WeatherR61.qa.scene=scene;window.WeatherR61.qa.loaded=false;
}
window.WeatherR61={version:'WM-R61-20261112',qa:{loaded:false,visualAcceptance:false},activate};
document.querySelectorAll('[data-scene]').forEach(b=>b.onclick=()=>activate(b.dataset.scene));
addEventListener('message',e=>{if(e.source===frame?.contentWindow&&e.data?.type==='weather-r31-open-original')activate('weather')});
const selected=new URLSearchParams(location.search).get('scene');activate(['silver','sea',...Object.keys(SOURCES)].includes(selected)?selected:'own1');
</script></html>
