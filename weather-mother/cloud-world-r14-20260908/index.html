 if($('#fly'))$('#fly').onclick=()=>{S.flying=!S.flying;$('#fly').textContent=S.flying?'停止飞行':'向前飞行';};if($('#wind'))$('#wind').onclick=()=>{S.weatherPlaying=!S.weatherPlaying;$('#wind').textContent=S.weatherPlaying?'暂停风':'开启风';};
 window.addEventListener('resize',resize);canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();lost=true;});canvas.addEventListener('webglcontextrestored',()=>{history=[];framebuffers=[];try{init();}catch(e){fail(e);}});

window.CloudWorld={qa,getState:()=>structuredClone(S),setState:o=>{for(const [k,v] of Object.entries(o)){if(!(k in S))throw Error('Unknown state: '+k);if(Array.isArray(S[k])){if(!Array.isArray(v)||v.length!==3||!v.every(Number.isFinite))throw Error('Invalid vector');S[k]=v.slice();}else if(typeof S[k]==='boolean')S[k]=!!v;else{if(!Number.isFinite(v))throw Error('Invalid number');S[k]=v;}}S.pitch=clamp(S.pitch,-1.56,1.56);S.position[1]=clamp(S.position[1],.04,15);cacheDirty=true;invalidate();},preset,getCamera:()=>({positionMeters:S.position.map(x=>x*1000),...vectors()}),setCameraWorld:(p,yaw,pitch)=>{if(!Array.isArray(p)||p.length!==3||!p.every(Number.isFinite)||!Number.isFinite(yaw)||!Number.isFinite(pitch))throw Error('Invalid camera');S.position=p.map(x=>x/1000);S.position[1]=clamp(S.position[1],.04,15);S.yaw=yaw;S.pitch=clamp(pitch,-1.56,1.56);invalidate();},capture:()=>{gl.finish();return canvas.toDataURL();},gl:()=>gl};
bind();try{init();requestAnimationFrame(tick);}catch(e){fail(e);}

// Metre-based integration boundary for future aircraft and city scenes.
(()=>{
const mix=(a,b,t)=>a+(b-a)*t,clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const smooth=(a,b,x)=>{let t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)};
const add=(p,v)=>p.map((x,i)=>x+v[i]),scale=(p,s)=>p.map(x=>x*s);
function noise(p){let a=p.map(Math.floor),f=p.map((x,i)=>x-a[i]),n=window.__noiseData;
 const at=(x,y,z)=>n[((x%64+64)%64)+64*((y%64+64)%64)+4096*((z%64+64)%64)]/255;
 return mix(mix(mix(at(...a),at(a[0]+1,a[1],a[2]),f[0]),mix(at(a[0],a[1]+1,a[2]),at(a[0]+1,a[1]+1,a[2]),f[0]),f[1]),mix(mix(at(a[0],a[1],a[2]+1),at(a[0]+1,a[1],a[2]+1),f[0]),mix(at(a[0],a[1]+1,a[2]+1),at(a[0]+1,a[1]+1,a[2]+1),f[0]),f[1]),f[2]);
}
const fb=p=>.57*noise(p)+.28*noise(add(scale(p,2.03),[11.7,3.4,5.2]))+.15*noise(add(scale(p,4.11),[-3.2,-11.7,-8.9]));
function density(p,s){
 if(p[0]<-16||p[0]>16||p[1]<1.55||p[1]>5.9||p[2]<-16||p[2]>16)return 0;
 const edge=(1-smooth(12.5,16,Math.abs(p[0])))*(1-smooth(12.5,16,Math.abs(p[2]))),cover=fb([p[0]*.24,7.4,p[2]*.24]),bank=smooth(.36,.60,cover+s.coverage-.5),h=(p[1]-(s.type===0?1.7:1.85))/(s.type===0?2:3.7),env=smooth(0,.065,h)*(1-smooth(.72,1,h));
 if(env*bank*edge<.0001)return 0;
 let q=add(p,[noise(add(scale(p,.52),[3,3,3])),noise(add(scale(p,.48),[17,17,17])),noise(add(scale(p,.55),[31,31,31]))].map(x=>x*.65));q[1]*=s.type===0?1.6:.85;
 let field=.72*fb(scale(q,.82))+.28*fb(add(scale(q,2.4),[9,9,9]))-.46-Math.pow(Math.max(h,0),1.25)*.25*.65+(cover-.5)*.32;
 for(const [f,w] of [[8,.022],[16,.011],[32,.0055]]){let a=scale(q,f);field-=Math.abs(Math.sin(a[1])*Math.cos(a[0])+Math.sin(a[2])*Math.cos(a[2])+Math.sin(a[0])*Math.cos(a[2]))*w;}
 field-=(1-fb(add(scale(q,9.3),[19,19,19])))*.043;return Math.max(0,field)*18.5*env*bank*edge*s.density;
}
CloudWorld.sampleWorld=p=>{
 if(!Array.isArray(p)||p.length!==3||!p.every(Number.isFinite))throw TypeError('Expected [x,y,z] in metres');
 const s=CloudWorld.getState(),a=s.windDirection*Math.PI/180,d=density(p.map((v,i)=>v/1000-s.offset[i]),s);
 return{density:d,extinctionPerMeter:d*3.2/1000,windMetersPerSecond:[Math.sin(a)*s.windSpeed,0,Math.cos(a)*s.windSpeed],sunAzimuthDegrees:s.sunAzimuth,sunElevationDegrees:s.sunElevation,coordinateSystem:'local x/y-up/z, metres; no geodetic anchor'};
};
})();

(()=>{
