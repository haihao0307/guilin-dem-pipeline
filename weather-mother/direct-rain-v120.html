<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#202c2e"><title>Weather Mother · Rain V1.2 直开版</title><style>:root{color-scheme:dark}html,body{margin:0;width:100%;height:100%;display:grid;place-items:center;background:#202c2e;color:#e9f1ed;font:13px system-ui}.box{max-width:520px;padding:28px;text-align:center}.spin{width:26px;height:26px;margin:0 auto 18px;border:2px solid #ffffff30;border-top-color:#e9f1ed;border-radius:50%;animation:s .8s linear infinite}small{display:block;margin-top:9px;color:#b6c2bd;line-height:1.7}@keyframes s{to{transform:rotate(1turn)}}</style></head><body><div class="box" id="status"><div class="spin"></div>正在进入 Weather Mother · Rain<small>Liquid V1.2 · Wet Glass Optics · direct-open route</small></div><script>(async()=>{try{const base='./liquid-rain-v120/';const fs=['payload-00.txt','payload-01.txt','payload-02.txt','payload-03.txt','payload-04.txt','payload-05.txt','payload-06.txt','payload-07.txt','payload-08.txt'];const ps=await Promise.all(fs.map(f=>fetch(base+f,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(f+' '+r.status);return r.text()})));const b=atob(ps.join(''));const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);if(typeof DecompressionStream!=='function')throw Error('当前浏览器缺少 gzip DecompressionStream 支持');const html=await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).text();document.open();document.write(html);document.close()}catch(e){document.querySelector('#status').innerHTML='Rain 直开启动失败<small>'+String(e)+'</small>'}})();</script></body></html>
