(()=>{'use strict';const c=document.querySelector('#c'),gl=c.getContext('webgl2',{antialias:false,alpha:false,powerPreference:'high-performance'});if(!gl){document.body.innerHTML='<p>WebGL2 unavailable</p>';return}const $=s=>document.querySelector(s),V=`#version 300 es
in vec2 p;out vec2 uv;void main(){uv=p*.5+.5;gl_Position=vec4(p,0,1);}`,F=`#version 300 es
precision highp float;in vec2 uv;out vec4 O;uniform vec2 R;uniform float T,P,W,S,H,L;uniform float Seed;
float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}vec2 h2(vec2 p){return vec2(h(p),h(p+19.19));}float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+1.),f.x),f.y);}float fb(vec2 p){float a=.5,v=0.;for(int i=0;i<5;i++){v+=a*n(p);p=mat2(1.7,-1.2,1.2,1.7)*p+3.1;a*=.5;}return v;}float sat(float x){return clamp(x,0.,1.);}vec3 sky(vec2 q){float y=sat(q.y*.5+.5);vec3 c=mix(vec3(.035,.055,.085),vec3(.12,.18,.24),y);float glow=pow(max(0.,1.-length(q-vec2(.52,.18))),5.);c+=vec3(.55,.32,.12)*glow*.36;return c;}float rip(vec2 x){vec2 g=x*3.,i=floor(g),f=fract(g)-.5;float v=0.;for(int y=-1;y<=1;y++)for(int z=-1;z<=1;z++){vec2 id=i+vec2(y,z),r=h2(id+Seed);vec2 d=f-vec2(y,z)-r+.5;float a=fract(T*.55+r.x*7.);float rr=a*(.35+.55*r.y);v+=sin((length(d)-rr)*55.)*exp(-abs(length(d)-rr)*28.)*exp(-a*2.7);}return v;}float puddle(vec2 x){float a=fb(x*.32+vec2(2.3,-1.7)),b=fb(x*.91+4.);return smoothstep(.43,.66,a*.72+b*.28+P*.52);}float roadMark(vec2 x){float line=smoothstep(.07,.02,abs(x.x+1.55));return line*smoothstep(-8.,-2.,x.y)*smoothstep(8.,3.,x.y);}float debris(vec2 x){vec2 g=floor(x*1.4);float q=h(g+5.);vec2 f=fract(x*1.4)-.5;return step(.965,q)*smoothstep(.24,.05,length(f));}
float rain(vec2 q,float scale,float speed,float alpha){vec2 p=q*vec2(R.x/R.y,1.);p.x+=p.y*W*.24;vec2 g=p*vec2(46.,22.)/scale;g.y+=T*speed;vec2 id=floor(g),f=fract(g)-.5,r=h2(id+Seed);f.x-=(r.x-.5)*.72;float len=(.035+.15*S)/scale;float streak=(1.-smoothstep(.006,.020,abs(f.x)))*(1.-smoothstep(len,len+.08,abs(f.y-(r.y-.5)*.55)));return streak*step(1.-alpha,r.x);}float splash(vec2 q){float z=sat((q.y+.15)*1.25);vec2 p=vec2(q.x/(.35+z),z*12.);vec2 id=floor(p*5.),f=fract(p*5.)-.5,r=h2(id+Seed);float a=fract(T*(1.4+P*1.7)+r.x*9.);float ring=exp(-abs(length(f)-a*.33)*42.)*exp(-a*4.);float spike=exp(-abs(f.x)*70.)*smoothstep(.34,.0,abs(f.y-a*.25))*exp(-a*3.);return (ring+spike*.35)*step(.62,r.y)*P;}
void main(){vec2 q=(gl_FragCoord.xy*2.-R)/R.y;float horizon=.13;vec3 col=sky(q);float gy=q.y-horizon;if(gy<0.){float z=.58/max(.02,-gy),x=q.x*z;vec2 w=vec2(x,z);float fine=fb(w*4.5),coarse=fb(w*.35);vec3 asphalt=mix(vec3(.035,.038,.041),vec3(.10,.105,.105),fine*.48+coarse*.28);float pm=puddle(w);float rn=rip(w);vec2 eps=vec2(.015,0);vec3 N=normalize(vec3((rip(w-eps)-rip(w+eps))*pm*.08,1.,(rip(w-eps.yx)-rip(w+eps.yx))*pm*.08));vec3 refl=sky(vec2(N.x*.8,.45+N.z*.4));float fres=pow(1.-sat(N.y),5.)+.22;float wet=sat(P*.72+pm*.45);col=mix(asphalt,asphalt*.42,wet);col=mix(col,refl,pm*(.48+fres*.35));float lr=exp(-abs(w.x-.92)*3.7)*exp(-w.y*.055)*pm*(.55+.45*sin(w.y*3.2+rn*8.));col+=vec3(.95,.42,.12)*lr*.40;col+=roadMark(w)*mix(vec3(.22,.20,.12),vec3(.65,.48,.19),wet)*.36;col=mix(col,vec3(.12,.075,.045),debris(w)*.65);col+=abs(rn)*pm*vec3(.20,.26,.30)*.08;float fog=1.-exp(-z*(.025+.06*P));col=mix(col,vec3(.065,.085,.105),fog*.42);}else{float y=q.y-horizon;float city=0.;float win=0.;for(int i=0;i<7;i++){float fi=float(i),cx=-1.45+fi*.48+.08*sin(fi*7.3),bw=.18+.08*h(vec2(fi,2.)),bh=.16+.34*h(vec2(fi,5.));float bx=1.-smoothstep(bw,bw+.015,abs(q.x-cx));float by=1.-smoothstep(bh,bh+.015,y);city=max(city,bx*by);vec2 g=vec2((q.x-cx)/(bw*.42),y/(bh*.24));vec2 gc=floor(g);float cell=(1.-smoothstep(.26,.34,abs(fract(g.x)-.5)))*(1.-smoothstep(.22,.32,abs(fract(g.y)-.5)));win+=bx*by*cell*step(.73,h(gc+fi*13.+Seed));}col=mix(col,vec3(.012,.019,.027),city*.88);col+=vec3(.95,.48,.16)*win*.34;float lamp=exp(-pow((q.x-.58)*8.,2.)-pow((y-.15)*9.,2.));col+=vec3(1.15,.55,.18)*lamp*.7;}float r=rain(uv,.62,8.4,.28*P)+rain(uv,1.2,5.6,.20*P)*.68+rain(uv,2.3,3.1,.13*P)*.42;float contrast=.35+.65*(1.-dot(col,vec3(.299,.587,.114)));col+=vec3(.68,.78,.86)*r*P*contrast;col+=vec3(.64,.76,.84)*splash(q)*.23;float curtains=fb(vec2(q.x*5.+T*.03,q.y*10.-T*.16));col=mix(col,vec3(.075,.095,.115),smoothstep(.53,.78,curtains)*P*.12);col+=L*vec3(.70,.78,.95)*(1.-length(q)*.16);float vig=sat(1.-dot(q,q)*.14);col function sh(t,s){let x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);if(!gl.getShaderParameter(x,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(x));return x}let p=gl.createProgram();gl.attachShader(p,sh(gl.VERTEX_SHADER,V));gl.attachShader(p,sh(gl.FRAGMENT_SHADER,F));gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(p));let b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);let a=gl.getAttribLocation(p,'p');gl.enableVertexAttribArray(a);gl.vertexAttribPointer(a,2,gl.FLOAT,false,0,0);gl.useProgram(p);let U={};['R','T','P','W','S','H','L','Seed'].forEach(k=>U[k]=gl.getUniformLocation(p,k));let st={go:0,t0:0,p:.08,wet:0,flash:0,seed:7,last:0,idle:0,started:false};function resize(){let d=Math.min(devicePixelRatio||1,1.7),w=Math.floor(innerWidth*d),h=Math.floor(innerHeight*d),m=innerWidth<700?1.0:.92;if(w*h>2600000){let s=Math.sqrt(2600000/(w*h));w*=s;h*=s}w*=m;h*=m;if(c.width!=w||c.height!=h){c.width=w;c.height=h;gl.viewport(0,0,w,h)}}
let AC,mix,rainG,nightG,windG,impactTimer,thTimer;function noise(ctx,d=2){let n=ctx.sampleRate*d,z=ctx.createBuffer(1,n,ctx.sampleRate),v=z.getChannelData(0);for(let i=0;i<n;i++)v[i]=Math.random()*2-1;let s=ctx.createBufferSource();s.buffer=z;s.loop=true;return s}function audio(){if(AC)return;AC=new (AudioContext||webkitAudioContext)();mix=AC.createGain();mix.gain.value=.7;mix.connect(AC.destination);let r=noise(AC),hp=AC.createBiquadFilter();hp.type='highpass';hp.frequency.value=1800;rainG=AC.createGain();rainG.gain.value=0;r.connect(hp).connect(rainG).connect(mix);r.start();let n=noise(AC,3),lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=420;nightG=AC.createGain();nightG.gain.value=0;n.connect(lp).connect(nightG).connect(mix);n.start();let w=noise(AC,4),bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=650;bp.Q.value=.55;windG=AC.createGain();windG.gain.value=0;w.connect(bp).connect(windG).connect(mix);w.start();impactTimer=setInterval(()=>{if(st.p<.15)return;let o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;o.type='sine';o.frequency.setValueAtTime(520+Math.random()*1100,t);o.frequency.exponentialRampToValueAtTime(110,t+.06);g.gain.setValueAtTime(.02*st.p,t);g.gain.exponentialRampToValueAtTime(.0001,t+.08);o.connect(g).connect(mix);o.start(t);o.stop(t+.09)},90)}function thunder(){if(!AC)return;let dist=420+Math.random()*1400;st.flash=1;setTimeout(()=>{let t=AC.currentTime,n=noise(AC,2),lp=AC.createBiquadFilter(),g=AC.createGain(),o=AC.createOscillator();lp.type='lowpass';lp.frequency.value=210;o.type='sine';o.frequency.value=38+Math.random()*12;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.65,t+.035);g.gain.exponentialRampToValueAtTime(.0001,t+2.8);n.connect(lp).connect(g).connect(mix);o.connect(g);n.start(t);o.start(t);n.stop(t+3);o.stop(t+3)},dist/343*1000)}function autoThunder(){clearTimeout(thTimer);thTimer=setTimeout(()=>{if(st.started)thunder();autoThunder()},9000+Math.random()*12000)}
function uiIdle(on){document.body.classList.toggle('idle',on);parent!==window&&parent.postMessage({type:'WEATHER_MOTHER_IMMERSIVE',value:on},'*')}function resetIdle(){clearTimeout(st.idle);uiIdle(false);st.idle=setTimeout(()=>uiIdle(true),3200)}$('#begin').onclick=()=>{audio();AC.resume();st.started=true;st.t0=performance.now();st.go=1;$('#start').classList.add('hide');autoThunder();resetIdle()};$('#ctrl').onclick=()=>{$('#panel').classList.toggle('open');resetIdle()};$('#view').onclick=()=>{$('#panel').classList.remove('open');uiIdle(true)};$('#reveal').onclick=()=>resetIdle();$('#thunder').onclick=()=>{audio();AC.resume();thunder();resetIdle()};document.addEventListener('pointerdown',e=>{if(st.started&&!e.target.closest('.panel,.top,.reveal'))resetIdle()});document.querySelectorAll('.row input').forEach(x=>{x.oninput=()=>{x.nextElementSibling.textContent=(+x.value).toFixed(2);resetIdle()}});
function frame(t){resize();let dt=Math.min(.05,(t-(st.last||t))/1000);st.last=t;if(st.go){let q=Math.min(1,(t-st.t0)/5000);st.p+=(+$('#rain').value*q-st.p)*(1-Math.exp(-dt*2.3));st.wet+=(st.p-st.wet)*(1-Math.exp(-dt*.75))}st.flash*=Math.exp(-dt*9);if(AC){let s=+$('#sound').value,now=AC.currentTime;rainG.gain.setTargetAtTime(Math.min(st.p,.5)*s,now,.08);nightG.gain.setTargetAtTime(Math.sqrt(st.p)*.22*s,now,.3);windG.gain.setTargetAtTime(+$('#wind').value*.20*s,now,.2)}gl.uniform2f(U.R,c.width,c.height);gl.uniform1f(U.T,t/1000);gl.uniform1f(U.P,st.wet*+$('#water').value);gl.uniform1f(U.W,+$('#wind').value);gl.uniform1f(U.S,+$('#shutter').value);gl.uniform1f(U.H,0);gl.uniform1f(U.L,st.flash);gl.uniform1f(U.Seed,st.seed);gl.drawArrays(gl.TRIANGLES,0,3);$('#rval').textContent=Math.round(st.p*100)+'%';$('#pval').textContent=Math.round(st.wet*+$('#water').value*100)+'%';requestAnimationFrame(frame)}requestAnimationFrame(frame);window.__WEATHER_MOTHER_RAIN_PUDDLE_STUDY__={version:'0.2.0',source:'Faraz clean-room distillation',getState:()=>({rain:st.p,wetness:st.wet,audio:!!AC,visualApproved:false,productionReady:false})};})();
