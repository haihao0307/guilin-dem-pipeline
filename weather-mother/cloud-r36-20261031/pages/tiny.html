</style></head><body>
<canvas id="c" aria-label="2017 Tiny Clouds teacher formula faithful replica"></canvas>
<div class="hud"><div class="brand">WEATHER MOTHER / TEACHER REPLICA</div><h1>程序噪声云海 · R33 候选</h1><p>保留云海步进结构，以自有程序噪声替换旧图片；外观与性能待对照验收。</p><div class="badges"><span class="badge">TINY CLOUDS / lsBfDz</span><span class="badge">连续坐标 · 无图片</span><span class="badge">SEEDED NOISE</span></div></div>

<script>(()=>{'use strict';
const canvas=document.getElementById('c'),loading=document.getElementById('loading'),errorBox=document.getElementById('error'),$=s=>document.querySelector(s),clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const ORIGINAL_SOURCE=`float cloudTap(vec4 p,inout float s){float v=kaopuFiltered2((s*p.zw+ceil(s*p.x))*1.28*uNoiseDetail,uNoiseSeed,s*1.28*uNoiseDetail*10./iResolution.y);s*=2.;return v/s*4.;}
#define T cloudTap(p,s)
void mainImage(out vec4 O,vec2 x){
    vec4 p,d=vec4(.8,0,x/iResolution.y-.8),c=vec4(.6,.7,d);
    O=c-d.w;
    for(float f,s,t=2e2+sin(dot(x,x));--t>0.;p=.05*t*d)
        p.xz+=iTime,
        s=2.,
        f=p.w+1.,
        f-=T, f-=T, f-=T, f-=T,
        f<0.?O+=(O-1.-f*c.zyxw)*f*.4:O;
}`;

const qa={version:'WM-R33-PROCEDURAL-NOISE-20261026',ready:false,frames:0,errors:[],context:null,renderSize:[0,0],variance:0,formula:'lsBfDz-derived-procedural-noise',teacherFormulaExact:false,teacherConstantsFrozen:false,raySteps:'199-200',proceduralNoiseCallsPerStep:4,noiseBytes:0,noiseGenerator:'kaopu-weather-value2/1',noiseSource:'procedural uint32 hash and quintic interpolation; no image',singleFileRuntime:true,pixelIdentityToUploadedVideo:false,visualAcceptance:false,realDeviceQA:false,productionReady:false};
let gl,program,buf,loc={},playing=true,timeS=0,last=performance.now(),raf=0,fullQuality=false,lost=false,frameStamp=performance.now(),frameCount=0;
const VS=`#version 300 es
in vec2 a;void main(){gl_Position=vec4(a,0.,1.);}`;
const FS=`#version 300 es
precision highp float;
out vec4 fragColor;
uniform vec2 iResolution;
uniform float iTime;
// Weather Mother own implementation. Value noise, not a stored image.
// uint overflow is modulo 2^32. Lattice period 65536 cells per axis.
// Coordinate unit: noise lattice cell; use a local/rebased frame.
precision highp int;
uint kaopuHash(uint x){x^=x>>16u;x*=0x7feb352du;x^=x>>15u;x*=0x846ca68bu;x^=x>>16u;return x;}
float kaopuCorner(ivec2 p,uint seed){uvec2 q=uvec2(p)&uvec2(65535u);return float(kaopuHash(q.x^(q.y*0x9e3779b9u)^seed)>>8u)/16777216.;}
vec2 kaopuFade(vec2 x){return x*x*x*(x*(x*6.-15.)+10.);}
float kaopuNoise2(vec2 p,uint seed){
 ivec2 i=ivec2(floor(p));vec2 f=kaopuFade(fract(p));
 return mix(mix(kaopuCorner(i,seed),kaopuCorner(i+ivec2(1,0),seed),f.x),mix(kaopuCorner(i+ivec2(0,1),seed),kaopuCorner(i+ivec2(1,1),seed),f.x),f.y);
}
float kaopuFiltered2(vec2 p,uint seed,float footprint){return mix(kaopuNoise2(p,seed),.5,smoothstep(.25,.75,footprint));}

uniform uint uNoiseSeed; uniform float uNoiseDetail;
float cloudTap(vec4 p,inout float s){float v=kaopuFiltered2((s*p.zw+ceil(s*p.x))*1.28*uNoiseDetail,uNoiseSeed,s*1.28*uNoiseDetail*10./iResolution.y);s*=2.;return v/s*4.;}
#define T cloudTap(p,s)
void mainImage(out vec4 O,vec2 x){
    vec4 p,d=vec4(.8,0,x/iResolution.y-.8),c=vec4(.6,.7,d);
    O=c-d.w;
    for(float f,s,t=2e2+sin(dot(x,x));--t>0.;p=.05*t*d)
        p.xz+=iTime,
        s=2.,
        f=p.w+1.,
        f-=T, f-=T, f-=T, f-=T,
        f<0.?O+=(O-1.-f*c.zyxw)*f*.4:O;
}
void main(){mainImage(fragColor,gl_FragCoord.xy);}`;
function fail(e){const m=e&&e.message?e.message:String(e);qa.errors.push(m);qa.ready=false;loading.hidden=true;errorBox.textContent='老师云启动失败：'+m;errorBox.classList.add('open')}
function shader(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s)||'shader compile failed');return s}
function initProgram(){const vs=shader(gl.VERTEX_SHADER,VS),fs=shader(gl.FRAGMENT_SHADER,FS);program=gl.createProgram();gl.attachShader(program,vs);gl.attachShader(program,fs);gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program)||'program link failed');gl.deleteShader(vs);gl.deleteShader(fs);buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);const a=gl.getAttribLocation(program,'a');gl.enableVertexAttribArray(a);gl.vertexAttribPointer(a,2,gl.FLOAT,false,0,0);loc.iResolution=gl.getUniformLocation(program,'iResolution');loc.iTime=gl.getUniformLocation(program,'iTime');loc.uNoiseSeed=gl.getUniformLocation(program,'uNoiseSeed');loc.uNoiseDetail=gl.getUniformLocation(program,'uNoiseDetail')}
function resize(){if(!gl)return;const mobile=innerWidth<=700||matchMedia('(pointer:coarse)').matches,scale=fullQuality?(mobile?.68:.82):(mobile?.39:.43),dpr=Math.min(devicePixelRatio||1,fullQuality?1.25:1),cap=fullQuality?(mobile?230000:520000):(mobile?90000:170000);let w=Math.max(1,Math.round(innerWidth*dpr*scale)),h=Math.max(1,Math.round(innerHeight*dpr*scale));const k=Math.min(1,Math.sqrt(cap/(w*h)));w=Math.max(1,Math.round(w*k));h=Math.max(1,Math.round(h*k));if(canvas.width===w&&canvas.height===h)return;canvas.width=w;canvas.height=h;qa.renderSize=[w,h];$('#size').textContent=w+'×'+h;gl.viewport(0,0,w,h)}
function draw(){if(!gl||lost||!program)return;gl.useProgram(program);gl.uniform1ui(loc.uNoiseSeed,Number($('#seed').value)>>>0);gl.uniform1f(loc.uNoiseDetail,Number($('#detail').value));gl.uniform2f(loc.iResolution,canvas.width,canvas.height);gl.uniform1f(loc.iTime,timeS);gl.drawArrays(gl.TRIANGLES,0,3);qa.frames++;frameCount++;if(qa.frames===3||qa.frames===8)measureVariance()}
function measureVariance(){try{const vals=[],w=canvas.width,h=canvas.height;for(let gy=1;gy<=4;gy++)for(let gx=1;gx<=6;gx++){const px=new Uint8Array(4);gl.readPixels(Math.floor(w*gx/7),Math.floor(h*gy/5),1,1,gl.RGBA,gl.UNSIGNED_BYTE,px);vals.push(px[0]+px[1]+px[2])}const mean=vals.reduce((a,b)=>a+b,0)/vals.length;qa.variance=vals.reduce((a,b)=>a+(b-mean)*(b-mean),0)/vals.length;qa.ready=qa.frames>=3&&qa.variance>4&&qa.errors.length===0;if(qa.ready)loading.hidden=true}catch(e){qa.errors.push(String(e))}}
function tick(now){raf=requestAnimationFrame(tick);const dt=clamp((now-last)/1000,0,.05);last=now;if(playing)timeS+=dt;draw();if(now-frameStamp>=1000){$('#fps').textContent=Math.round(frameCount*1000/(now-frameStamp));frameStamp=now;frameCount=0}}
function setPlaying(v){playing=!!v;$('#play').textContent=playing?'运行中':'已暂停';$('#play').setAttribute('aria-pressed',String(playing))}function setTime(v){timeS=Math.max(0,Number(v)||0);draw();return timeS}function restart(){timeS=0;setPlaying(true);draw()}function setCode(v){const open=!!v;$('#code').classList.toggle('open',open);$('#codeBtn').setAttribute('aria-pressed',String(open))}function setFullQuality(v){fullQuality=!!v;$('#quality').setAttribute('aria-pressed',String(fullQuality));resize();draw();return fullQuality}
$('#seed').oninput=draw;$('#detail').onchange=draw;$('#source').textContent=ORIGINAL_SOURCE;$('#play').onclick=()=>setPlaying(!playing);$('#restart').onclick=restart;$('#codeBtn').onclick=()=>setCode(!$('#code').classList.contains('open'));$('#closeCode').onclick=()=>setCode(false);$('#quality').onclick=()=>setFullQuality(!fullQuality);addEventListener('resize',resize);addEventListener('keydown',e=>{if(e.code==='Space'){setPlaying(!playing);e.preventDefault()}if(e.key==='Home'){restart();e.preventDefault()}});canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();lost=true;qa.ready=false;qa.errors.push('contextlost')});canvas.addEventListener('webglcontextrestored',()=>location.reload());
window.WeatherTinyCloudsTeacher={qa,getState:()=>({playing,timeS,fullQuality,codeOpen:$('#code').classList.contains('open')}),setPlaying,setTime,restart,setCode,setFullQuality,capture:()=>canvas.toDataURL(),gl:()=>gl};
(async()=>{try{gl=canvas.getContext('webgl2',{alpha:false,antialias:false,depth:false,powerPreference:'high-performance',preserveDrawingBuffer:true});if(!gl)throw Error('WebGL2 unavailable: exact teacher loop requires WebGL2');qa.context='webgl2';initProgram();resize();last=performance.now();raf=requestAnimationFrame(tick)}catch(e){fail(e)}})();
})();</script></body></html>
