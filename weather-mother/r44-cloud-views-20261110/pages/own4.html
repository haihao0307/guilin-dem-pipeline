<!doctype html><style>html,body{margin:0;background:#152c3c;height:100%;display:flex;align-items:center;justify-content:center}canvas{width:100%;height:100%;object-fit:contain}</style><meta charset="utf-8"><canvas id="c" width="640" height="360"></canvas><div id="bar"><label>显示质量 <select id="res"><option value="auto" selected>自动适配</option><option value="960">清晰 · 960 宽</option><option value="1280">精细 · 1280 宽</option><option value="1600">更精细 · 1600 宽</option></select></label><button id="pause">暂停</button><span id="perf"></span><details id="noise-info"><summary>连续噪声</summary><div>程序计算，非图片 · 三维格点周期每轴 65536 格<br>实际画面像素见左侧，自动质量按性能调整。<br>实时按镜头采样；主体仍含参考代码。</div></details><pre id="error"></pre></div><style>#bar{position:fixed;bottom:8px;left:50%;transform:translateX(-50%);background:#fffffff2;color:#173246;border:1px solid #ccd5da;border-radius:10px;padding:8px 12px;font:13px system-ui;display:flex;align-items:center;gap:12px;white-space:nowrap}select,button{font:inherit}#noise-info{position:relative}#noise-info div{position:absolute;bottom:28px;right:0;width:270px;white-space:normal;background:white;padding:10px;border:1px solid #ccd5da;border-radius:8px;line-height:1.5}#error{color:#a00;white-space:pre-wrap}</style><script>const src="#version 300 es\nprecision highp float;\nout vec4 fragColor;\nuniform float u_time; //Seconds since playback started\n\n//[CONVERT] GLSL\n//Seconds since playback started\n\n//[CONVERT] GLSL\nuniform vec2 u_resolution; //Pass resolution in pixels\n\n// Weather Mother own implementation. Value noise, not a stored image.\n// uint overflow is modulo 2^32. Lattice period 65536 cells per axis.\n// Coordinate unit: noise lattice cell; use a local/rebased frame.\nprecision highp int;\nuint kaopuHash(uint x){x^=x>>16u;x*=0x7feb352du;x^=x>>15u;x*=0x846ca68bu;x^=x>>16u;return x;}\nfloat kaopuCorner(ivec2 p,uint seed){uvec2 q=uvec2(p)&uvec2(65535u);return float(kaopuHash(q.x^(q.y*0x9e3779b9u)^seed)>>8u)/16777216.;}\nvec2 kaopuFade(vec2 x){return x*x*x*(x*(x*6.-15.)+10.);}\nfloat kaopuNoise2(vec2 p,uint seed){\n ivec2 i=ivec2(floor(p));vec2 f=kaopuFade(fract(p));\n return mix(mix(kaopuCorner(i,seed),kaopuCorner(i+ivec2(1,0),seed),f.x),mix(kaopuCorner(i+ivec2(0,1),seed),kaopuCorner(i+ivec2(1,1),seed),f.x),f.y);\n}\nfloat kaopuFiltered2(vec2 p,uint seed,float footprint){return mix(kaopuNoise2(p,seed),.5,smoothstep(.25,.75,footprint));}\n\n// Weather Mother experimental continuous 3D lattice; fixed uint32 seed and 65536-cell period per lattice axis.\nfloat kaopuCorner3(ivec3 p,uint seed){uvec3 q=uvec3(p)&uvec3(65535u);return float(kaopuHash(q.x^(q.y*0x9e3779b9u)^(q.z*0x85ebca6bu)^seed)>>8u)/16777216.;}\nfloat kaopuNoise3(vec3 p,uint seed){ivec3 i=ivec3(floor(p));vec3 f=fract(p);f=f*f*f*(f*(f*6.-15.)+10.);float a=mix(mix(kaopuCorner3(i,seed),kaopuCorner3(i+ivec3(1,0,0),seed),f.x),mix(kaopuCorner3(i+ivec3(0,1,0),seed),kaopuCorner3(i+ivec3(1,1,0),seed),f.x),f.y);float b=mix(mix(kaopuCorner3(i+ivec3(0,0,1),seed),kaopuCorner3(i+ivec3(1,0,1),seed),f.x),mix(kaopuCorner3(i+ivec3(0,1,1),seed),kaopuCorner3(i+ivec3(1,1,1),seed),f.x),f.y);return mix(a,b,f.z);}\n\nfloat weatherWave(vec3 p,float phase){mat3 rot=mat3(.8,.36,-.48,-.6,.48,-.64,0.,.8,.6);return (kaopuNoise3(rot*(p+phase),1297u)-.5)*2.6;}\nfloat m(vec3 p,float o){\n    p.xz+=sin(p.y*.3+p.zx*.1+u_time*.15)*1.5;\n    float s=-sin(p.x*.045)*sin(p.z*.045),d=min(max(5.4-.18*p.y-8.*s,p.y-1.-2.*sin(p.x*.05+p.z*.07)),p.y+12.);\n    p-=u_time*vec3(.6,.15,0.);\n    for (float e=.25;e<o;e+=e) {\n        d-=((weatherWave(p*e,0.)/2.6 + .04)/e)*1.2;\n    }\n    return d;\n}\nfloat n(float d){\n    d=clamp(1.-d*.8,0.,1.);\n    return d*d;\n}\nvoid main(){\n    vec3 L=vec3(.45,.25,-.85),r=normalize(vec3(gl_FragCoord.xy*2.-u_resolution,-u_resolution.x)),p,c,s=mix(vec3(1.,.64,.38),vec3(.13,.22,.5),clamp(r.y*2.5+.1,0.,1.))+vec3(1.,.55,.2)*pow(max(dot(r,vec3(.45,.05,-.89)),0.),16.)*.7,v;\n    float z,t=1.,d,a,g,o,k,i;\n    for (;i++<300.&&t>.01;z+=g){\n        p=z*r;\n        d=m(p,16.)+max(10.-z,0.);\n        g=max(d*.4,.08);\n        if (d<1.25){\n            a=n(d)*2.5*g;\n            o=0.;\n            for (k=.25;k<8.;k+=k) {\n                o+=n(m(p+L*k,8.))*k;\n            }\n            k=n(m(p+vec3(0.,2.,0.),8.));\n            v=mix(s,mix(vec3(.16,.21,.42),vec3(.21,.15,.34),k)*(1.-.7*k)*(.75+.02*p.y)+vec3(1.1,.77,.4)*exp(-o*vec3(.8,1.08,1.44))*(1.+1.2*pow(max(dot(r,L),0.),6.))+vec3(.1375,.125,.15)*exp(-o*.2),exp(-z*.006));\n            d=dot(v,vec3(.3,.55,.15));\n            c+=t*a*mix(d*vec3(.9,1.,1.35),v,clamp(d*2.5-.2,0.,1.));\n            t*=1.-a;\n        }\n    }\n    fragColor=vec4(c+t*s,1.);\n}";const defs={};const c=document.getElementById('c'),gl=c.getContext('webgl2',{preserveDrawingBuffer:true,antialias:false});let qa=window.qa={ready:false,errors:[],frames:0};try{function sh(t,s){let x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);if(!gl.getShaderParameter(x,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(x));return x}let v=sh(gl.VERTEX_SHADER,'#version 300 es\nvoid main(){vec2 p=vec2((gl_VertexID<<1)&2,gl_VertexID&2);gl_Position=vec4(p*2.-1.,0.,1.);}'),f=sh(gl.FRAGMENT_SHADER,src),p=gl.createProgram();gl.attachShader(p,v);gl.attachShader(p,f);gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(p));gl.useProgram(p);let autoScale=1,autoWindow=0,slow=0,fast=0;function resize(){const choice=document.getElementById('res').value;let w=choice==='auto'?Math.round(Math.max(640,Math.min(1280,innerWidth*(devicePixelRatio||1))*autoScale)/16)*16:Number(choice);c.width=w;c.height=Math.round(w*9/16);gl.viewport(0,0,c.width,c.height);gl.uniform2f(gl.getUniformLocation(p,'u_resolution'),c.width,c.height)}document.getElementById('res').onchange=()=>{autoScale=1;slow=fast=0;resize()};addEventListener('resize',resize);resize();for(const [k,v] of Object.entries(defs))gl.uniform1f(gl.getUniformLocation(p,k),Number(v));let last=0,clock=0,playing=true,count=0,mark=0;document.getElementById('pause').onclick=()=>{playing=!playing;document.getElementById('pause').textContent=playing?'暂停':'播放'};function tick(t){if(!last)last=t;if(playing)clock+=Math.min(.1,(t-last)/1000);last=t;gl.uniform1f(gl.getUniformLocation(p,'u_time'),clock);gl.drawArrays(gl.TRIANGLES,0,3);qa.frames++;qa.ready=true;count++;if(t-mark>1000){document.getElementById("perf").textContent=c.width+"×"+c.height+" · "+Math.round(count*1000/(t-mark))+" FPS";if(document.getElementById('res').value==='auto'&&playing&&mark>0){let fps=count*1000/(t-mark);slow=fps<27?slow+1:0;fast=fps>56?fast+1:0;if(slow>=3&&autoScale>.55){autoScale=Math.max(.55,autoScale*.8);slow=fast=0;resize()}else if(fast>=8&&autoScale<1){autoScale=Math.min(1,autoScale*1.1);slow=fast=0;resize()}}mark=t;count=0}requestAnimationFrame(tick)}requestAnimationFrame(tick)}catch(e){qa.errors.push(String(e));document.getElementById('error').textContent=String(e)}</script>
