<script id="cloudShader" type="x-shader/x-fragment">#version 300 es
precision highp float;
uniform vec2 uResolution;
uniform vec2 uPan;
uniform float uTime;
uniform float uZoom;
uniform int uMode,uCameraEnabled;
uniform vec3 uCameraOffset;
uniform vec2 uCameraAngles;
mat3 cameraRotation(){float cy=cos(uCameraAngles.x),sy=sin(uCameraAngles.x),cp=cos(uCameraAngles.y),sp=sin(uCameraAngles.y);return mat3(cy,0,-sy,0,1,0,sy,0,cy)*mat3(1,0,0,0,cp,sp,0,-sp,cp);}
out vec4 outColor;
vec3 hsv(float h,float s,float v){
 vec3 p=abs(fract(vec3(h)+vec3(1.,2./3.,1./3.))*6.-3.);
 return v*mix(vec3(1.),clamp(p-1.,0.,1.),s);
}
mat3 axisRotation(float a,vec3 v){
 v=normalize(v);float c=cos(a),s=sin(a),k=1.-c;
 return mat3(c+v.x*v.x*k,v.y*v.x*k+v.z*s,v.z*v.x*k-v.y*s,
 v.x*v.y*k-v.z*s,c+v.y*v.y*k,v.z*v.y*k+v.x*s,
 v.x*v.z*k+v.y*s,v.y*v.z*k-v.x*s,c+v.z*v.z*k);
}
// Expanded study of Yohei Nishitsuji's shared GLSL; artistic ray accumulation.
// Source references and scope are recorded in RESEARCH.md. No physical transport claim.
vec3 backlit(vec2 uv){
 vec3 sum=vec3(0),q=vec3(0,-1,-1),p=vec3(0);
 vec3 d=vec3(uv-vec2(.6),1.);
 if(uCameraEnabled==1){q+=uCameraOffset;d=cameraRotation()*d;}
 float e=0.,g=0.,R=0.,s=0.;
 for(int j=1;j<=99;j++){
  float i=float(j);e+=i/800000.;
  sum+=hsv(.6,R+g*.3,e*i/40.);
  s=4.;q+=d*e*R*.2;p=q;g+=p.y/s;
  R=max(length(p),1e-6);
  p=vec3(R-.5+sin(uTime)*.02,exp2(mod(-p.z,s)/R)-.2,p.x);
  e=--p.y;
  for(int k=0;k<8;k++){
   e+=.03-abs(dot(sin(p.yzx*s),cos(p.xzz*s))/s*.6);s*=2.;
  }
 }
 return sum;
}
vec3 sea(vec2 uv){
 vec3 sum=vec3(0);float g=0.,e=0.,s=0.;
 vec2 screen=(uv-.5)*vec2(16./9.,1.)*5.;
 float perspective=smoothstep(0.,2.,length(uCameraOffset)+length(uCameraAngles)*20.);
 vec3 cameraRay=cameraRotation()*normalize(vec3(screen/50.*perspective,1.));
 mat3 rot=axisRotation(-1.1-cos(uTime*.15)*.1,vec3(1.,11.+sin(uTime)*.15,-1.5));
 for(int j=1;j<99;j++){

  vec3 p=vec3((uv-.5)*vec2(16./9.,1.)*5.+vec2(0,9),g)*rot;
  if(uCameraEnabled==1){p=(vec3(screen*(1.-perspective)+vec2(0,9),0)+uCameraOffset+cameraRay*g)*rot;}
  s=2.;
  for(int k=0;k<19;k++){
   e=7.1/max(dot(p,p*.51),1e-6);s*=e;
   p=vec3(.08,4.,-1.)-abs(abs(p)*e-vec3(3,4,3));
  }
  g+=p.y/max(s,1e-12);
  s=log2(max(s,1e-12))/exp(clamp(e,-40.,40.));
  float colorDepth=uCameraEnabled==1?uCameraOffset.z+cameraRay.z*g:g;
  sum+=.01-hsv(.1,colorDepth*.016-e*.3,s/200.);
 }
 return sum;
}
void main(){
 vec2 uv=(gl_FragCoord.xy/uResolution-.5)/uZoom+.5+uPan;
 // Maintain reference aspect while revealing more horizontally on widescreen.
 uv.x=(uv.x-.5)*(uResolution.x/uResolution.y)/(16./9.)+.5;
 vec3 c=uMode==0?sea(uv):backlit(uv);
 if(any(isnan(c))||any(isinf(c))){outColor=vec4(1,0,1,1);return;}
 outColor=vec4(clamp(c,0.,1.),1.);
}

const qa={version:'WM-R20-NAVIGATION-20260908',frames:0,completedFrames:0,errors:[],frameTimes:[],ready:false,contextLosses:0};

let gl,program,vao,locations={},fence=null,inFlightAt=0,last=performance.now(),dirty=true,lost=false,scale=1,slow=0,pointer=null;

 if(!gl)throw Error('此浏览器没有可用的 WebGL2');

 const fs=shader(gl.FRAGMENT_SHADER,document.querySelector('#cloudShader').textContent);
 program=gl.createProgram();gl.attachShader(program,vs);gl.attachShader(program,fs);gl.linkProgram(program);
 if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));
 gl.deleteShader(vs);gl.deleteShader(fs);gl.useProgram(program);vao=gl.createVertexArray();gl.bindVertexArray(vao);
 for(const n of ['uResolution','uPan','uTime','uZoom','uMode','uCameraEnabled','uCameraOffset','uCameraAngles'])locations[n]=gl.getUniformLocation(program,n);
 const ext=gl.getExtension('WEBGL_debug_renderer_info');qa.gpu=ext?gl.getParameter(ext.UNMASKED_RENDERER_WEBGL):gl.getParameter(gl.RENDERER);
 fence=null;dirty=true;lost=false;resize();
}
function resize(){if(!gl||lost)return;const w=innerWidth,h=innerHeight;
 const settled=qualityTier==='settled';
 const maxSide=Math.min(gl.getParameter(gl.MAX_RENDERBUFFER_SIZE),8192);
 const requested=settled?Math.min(Math.max(devicePixelRatio||1,1.5),2,Math.sqrt(8294400/(w*h))):Math.min(devicePixelRatio||1,1.3,Math.sqrt(1600000/(w*h)))*scale;

 canvas.width=Math.max(1,Math.round(w*d));canvas.height=Math.max(1,Math.round(h*d));gl.viewport(0,0,canvas.width,canvas.height);qa.renderSize=[canvas.width,canvas.height];qa.qualityTier=qualityTier;dirty=true;}
function update(){
 lastInteraction=performance.now();
 document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.mode===state.mode)));
 $('#sceneTitle').textContent=state.mode===0?'层叠云海':'银边积云';
 $('#sceneDescription').textContent=state.mode===0?'云层向远处展开，细碎云群穿过大片留白。':'深蓝云腹、透光裂隙与层层展开的银色边缘。';
 $('#animationRate').value=String(state.animationRate);$('#play').textContent=state.playing?'暂停':'播放';$('#play').setAttribute('aria-pressed',String(state.playing));
 updateNavigationLabel();dirty=true;
}
function reset(){release();camera.offset=[0,0,0];camera.yaw=0;camera.pitch=0;state.time=4;state.zoom=1;state.pan=[0,0];update();}
function toggle(){state.playing=!state.playing;last=performance.now();update();}
document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{state.mode=+b.dataset.mode;reset();}));
$('#animationRate').onchange=()=>{state.animationRate=Number($('#animationRate').value);last=performance.now();update();};$('#play').addEventListener('click',toggle);$('#reset').addEventListener('click',reset);
const navigationLimits=[
 {extent:[.6,.35,15],yaw:.08,pitch:.02,speed:3},
 {extent:[.22,.15,.5],yaw:.6,pitch:.2,speed:.10}
];
const held=new Set();let velocity=[0,0,0],suspended=false;
function boundedCamera(offset,yaw=0,pitch=0){
 if(!Array.isArray(offset)||offset.length!==3||![...offset,yaw,pitch].every(Number.isFinite))throw new TypeError('Camera values must be finite numbers');
 const c=navigationLimits[state.mode];
 return {offset:offset.map((v,i)=>clamp(v,i===2?0:-c.extent[i],c.extent[i])),yaw:clamp(yaw,-c.yaw,c.yaw),pitch:clamp(pitch,-c.pitch,c.pitch)};
}
function setCamera(offset,yaw=0,pitch=0){const c=boundedCamera(offset,yaw,pitch);Object.assign(camera,c);velocity=[0,0,0];update();return structuredClone(camera);}
function navigationInput(){
 let x=+(held.has('d')||held.has('arrowright'))-+(held.has('a')||held.has('arrowleft'));
 let y=+held.has('e')-+held.has('q');
 let z=+(held.has('w')||held.has('arrowup')||held.has('forward'))-+(held.has('s')||held.has('arrowdown')||held.has('backward'));
 const length=Math.hypot(x,y,z);if(length>1){x/=length;y/=length;z/=length;}
 x*=state.mode===1?.6:.12;y*=state.mode===1?.5:.08;
 const cy=Math.cos(camera.yaw),sy=Math.sin(camera.yaw),cp=Math.cos(camera.pitch),sp=Math.sin(camera.pitch);

}
function advanceNavigation(dt){
 const input=navigationInput(),speed=navigationLimits[state.mode].speed;
 const acceleration=1-Math.exp(-dt*12);let changed=false;
 for(let i=0;i<3;i++){
  velocity[i]+=(input[i]*speed-velocity[i])*acceleration;
  if(Math.abs(velocity[i])<speed*.002)velocity[i]=0;
  const c=navigationLimits[state.mode],next=clamp(camera.offset[i]+velocity[i]*dt,i===2?0:-c.extent[i],c.extent[i]);

function nudge(direction,amount=.06){

}
function updateNavigationLabel(){
 const depth=camera.offset[2]/navigationLimits[state.mode].extent[2];
 $('#zoomValue').textContent=Math.round(depth*100)+'%';
 $('#zoomValue').setAttribute('aria-label','探索进度 '+Math.round(depth*100)+'%');
 $('#closer').disabled=depth>=.999999;$('#farther').disabled=depth<=.000001;
 if($('#closer').disabled)held.delete('forward');if($('#farther').disabled)held.delete('backward');
}
function release(){held.clear();velocity=[0,0,0];pointer=null;canvas.classList.remove('dragging');}
function installHoldButton(selector,key){const button=$(selector);let started=0,duration=0;
 button.addEventListener('pointerdown',e=>{if(!e.isPrimary||button.disabled)return;started=performance.now();duration=0;button.setPointerCapture(e.pointerId);held.add(key);lastInteraction=performance.now();});

 button.addEventListener('click',e=>{if(e.detail===0||duration<180)nudge(key,.06);});
}

canvas.addEventListener('wheel',e=>{e.preventDefault();if(suspended)return;nudge(e.deltaY<0?'forward':'backward',clamp(Math.abs(e.deltaY)*.0007,0,.12));},{passive:false});
canvas.addEventListener('pointerdown',e=>{if(!e.isPrimary||suspended)return;canvas.focus({preventScroll:true});pointer={id:e.pointerId,x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId);canvas.classList.add('dragging');});

});

canvas.addEventListener('pointerup',releasePointer);canvas.addEventListener('pointercancel',releasePointer);canvas.addEventListener('lostpointercapture',releasePointer);
window.addEventListener('blur',release);
window.addEventListener('keydown',e=>{
 if(suspended||e.target.closest?.('input,select,textarea,[contenteditable=true]'))return;

 if(['w','s','a','d','q','e','arrowup','arrowdown','arrowleft','arrowright'].includes(k)){
  e.preventDefault();if(!held.has(k)){held.add(k);lastInteraction=performance.now();}return;

function suspend(value){suspended=!!value;release();last=performance.now();return suspended;}
function getSnapshot(){return {version:1,state:structuredClone(state),camera:structuredClone(camera)};}
function validateSnapshot(snapshot){
 if(!snapshot||snapshot.version!==1||!snapshot.state||!snapshot.camera)throw new TypeError('Invalid cloud snapshot');
 const s=snapshot.state,c=snapshot.camera;
 if(![0,1].includes(s.mode)||![s.time,s.zoom,s.animationRate??.13,...(s.pan||[])].every(Number.isFinite)||!Array.isArray(s.pan)||s.pan.length!==2||typeof s.playing!=='boolean')throw new TypeError('Invalid cloud state');
 if(!Array.isArray(c.offset)||c.offset.length!==3||![...c.offset,c.yaw,c.pitch].every(Number.isFinite))throw new TypeError('Invalid cloud camera');

}
function restoreSnapshot(snapshot){

 release();state.mode=s.mode;state.time=s.time;state.zoom=clamp(s.zoom,.8,2.8);state.pan=s.pan.map((x,i)=>clamp(x,i===0?-.32:-.25,i===0?.32:.25));state.playing=s.playing;state.animationRate=clamp(s.animationRate??1,0,4);
