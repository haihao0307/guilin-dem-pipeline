<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Weather Mother · Easy Rain Lab V0.1</title>
<style>
:root{color-scheme:dark;--bg:#070a0d;--panel:rgba(11,15,19,.88);--line:rgba(255,255,255,.12);--text:#eef3f6;--muted:#9aa8b3;--accent:#cfe5f3;--good:#89d4ad}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg);font-family:Inter,"SF Pro Display","Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--text)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;background:#05080b;touch-action:none}
.topbar{position:fixed;z-index:5;top:0;left:0;right:0;height:58px;padding:0 18px;display:flex;align-items:center;gap:14px;background:linear-gradient(180deg,rgba(5,8,11,.92),rgba(5,8,11,.45),transparent);pointer-events:none}
.brand{font-weight:650;letter-spacing:.02em;font-size:15px}.version{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 8px}.gate{margin-left:auto;font-size:11px;color:var(--good);letter-spacing:.02em}
.panel{position:fixed;z-index:10;right:14px;top:66px;width:min(328px,calc(100vw - 28px));max-height:calc(100vh - 82px);overflow:auto;background:var(--panel);backdrop-filter:blur(18px) saturate(1.15);border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 70px rgba(0,0,0,.42);transition:transform .25s ease,opacity .25s ease}
.panel.collapsed{transform:translateX(calc(100% + 18px));opacity:.2;pointer-events:none}.panelHeader{position:sticky;top:0;z-index:2;background:rgba(10,14,18,.96);display:flex;align-items:center;padding:14px 14px 11px;border-bottom:1px solid var(--line)}
.panelHeader strong{font-size:13px}.panelHeader span{margin-left:auto;color:var(--muted);font-size:10px}.section{padding:12px 14px;border-bottom:1px solid var(--line)}.section:last-child{border-bottom:0}.sectionTitle{font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.row{display:grid;grid-template-columns:108px 1fr 48px;gap:8px;align-items:center;margin:8px 0}.row label{font-size:11px;color:#c8d1d7}.row output{text-align:right;font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
select,button,input[type=range]{font:inherit}select,button{border:1px solid var(--line);background:rgba(255,255,255,.055);color:var(--text);border-radius:9px;min-height:33px;padding:0 10px;outline:none}select{width:100%}button{cursor:pointer}button:hover{background:rgba(255,255,255,.10)}button.primary{background:rgba(207,229,243,.13);border-color:rgba(207,229,243,.28)}
input[type=range]{width:100%;accent-color:#cfe5f3;height:18px}.pillrow{display:flex;gap:7px;flex-wrap:wrap}.pillrow button{font-size:10px;min-height:30px;padding:0 9px}.pillrow button.active{background:rgba(207,229,243,.18);border-color:rgba(207,229,243,.38)}
.toggle{display:flex;align-items:center;justify-content:space-between;margin:8px 0;font-size:11px;color:#c8d1d7}.toggle input{accent-color:#cfe5f3}
.handle{position:fixed;z-index:11;right:14px;top:66px;width:42px;height:42px;border-radius:12px;background:rgba(10,14,18,.82);backdrop-filter:blur(12px);border:1px solid var(--line);color:#fff;display:none}.panel.collapsed+.handle{display:block}
.hud{position:fixed;z-index:4;left:16px;bottom:15px;display:flex;gap:8px;flex-wrap:wrap;max-width:calc(100vw - 380px);pointer-events:none}.chip{background:rgba(7,10,13,.62);border:1px solid rgba(255,255,255,.09);backdrop-filter:blur(8px);border-radius:10px;padding:7px 9px;font-size:10px;color:#c4ced5;font-variant-numeric:tabular-nums}.chip b{color:#f2f6f8;font-weight:550}
.centerHint{position:fixed;z-index:3;left:50%;bottom:22px;transform:translateX(-50%);font-size:10px;color:rgba(235,243,248,.62);pointer-events:none;transition:opacity 1s}.centerHint.hide{opacity:0}
.error{position:fixed;z-index:30;inset:0;display:none;place-items:center;padding:30px;background:#090b0e;color:#fff;text-align:center}.error.show{display:grid}
@media(max-width:760px){.panel{top:58px;right:8px;max-height:calc(100vh - 66px);width:min(330px,calc(100vw - 16px))}.hud{left:8px;bottom:8px;max-width:calc(100vw - 16px)}.chip:nth-child(n+3){display:none}.topbar{padding:0 10px;height:52px}.gate{display:none}.brand{font-size:13px}.handle{right:8px;top:58px}.centerHint{display:none}}
</style>
</head>
<body>
<canvas id="view" aria-label="Weather Mother Easy Rain 高分辨率实验场"></canvas>
<div class="topbar"><div class="brand">Weather Mother · Easy Rain Lab</div><div class="version">V0.1 · 高清候选</div><div class="gate">visualApproved=false · productionReady=false</div></div>
<div class="panel" id="panel">
  <div class="panelHeader"><strong>雨系统工作台</strong><span id="renderSize">初始化</span></div>
  <div class="section">
    <div class="sectionTitle">雨况与视图</div>
    <div class="grid2"><select id="preset"><option value="drizzle">毛毛雨</option><option value="steady" selected>稳定中雨</option><option value="shower">强阵雨</option><option value="storm">暴雨</option><option value="stop">停雨观察</option></select><select id="diagnostic"><option value="0">高清成片</option><option value="1">遮挡掩膜</option><option value="2">雨量通量</option><option value="3">湿润场</option><option value="4">积水场</option><option value="5">撞击分布</option></select></div>
    <div class="pillrow" style="margin-top:9px"><button class="active" data-view="wide">全景</button><button data-view="roof">屋檐</button><button data-view="puddle">水洼</button><button data-view="object">物体</button></div>
  </div>
  <div class="section">
    <div class="sectionTitle">空中降雨</div>
    <div class="row"><label>降雨强度</label><input id="rain" type="range" min="0" max="1" step="0.01" value="0.52"><output></output></div>
    <div class="row"><label>雨滴尺度</label><input id="dropSize" type="range" min="0.45" max="1.75" step="0.01" value="1"><output></output></div>
    <div class="row"><label>下落速度</label><input id="fallSpeed" type="range" min="0.55" max="1.65" step="0.01" value="1"><output></output></div>
    <div class="row"><label>风速</label><input id="windSpeed" type="range" min="0" max="28" step="0.1" value="7"><output></output></div>
    <div class="row"><label>风向</label><input id="windDir" type="range" min="0" max="360" step="1" value="235"><output></output></div>
    <div class="row"><label>阵风</label><input id="gust" type="range" min="0" max="1" step="0.01" value="0.28"><output></output></div>
    <div class="row"><label>飞溅强度</label><input id="splash" type="range" min="0" max="1.6" step="0.01" value="0.82"><output></output></div>
  </div>
  <div class="section">
    <div class="sectionTitle">地表状态</div>
    <div class="row"><label>湿润速度</label><input id="wetRate" type="range" min="0.03" max="0.8" step="0.01" value="0.30"><output></output></div>
    <div class="row"><label>排水速度</label><input id="drain" type="range" min="0" max="0.35" step="0.005" value="0.055"><output></output></div>
    <div class="row"><label>蒸发速度</label><input id="evap" type="range" min="0" max="0.14" step="0.002" value="0.012"><output></output></div>
    <div class="row"><label>水洼容量</label><input id="capacity" type="range" min="0.25" max="1.5" step="0.01" value="0.82"><output></output></div>
    <div class="row"><label>涟漪尺度</label><input id="ripple" type="range" min="0" max="1.8" step="0.01" value="1"><output></output></div>
    <div class="pillrow"><button id="resetSurface">重置地表</button><button id="seed">更换种子</button></div>
  </div>
  <div class="section">
    <div class="sectionTitle">显示与运行</div>
    <div class="grid2"><select id="quality"><option value="0.72">性能</option><option value="1">高清</option><option value="1.32" selected>2K 检查</option><option value="1.75">4K 检查</option></select><select id="tone"><option value="0.9">阴雨冷调</option><option value="1.05" selected>自然中性</option><option value="1.2">逆光强化</option></select></div>
    <div class="row"><label>曝光</label><input id="exposure" type="range" min="0.55" max="1.65" step="0.01" value="1.02"><output></output></div>
    <div class="toggle"><span>自动轻微运镜</span><input id="autoCamera" type="checkbox"></div>
    <div class="pillrow"><button id="pause" class="primary">暂停演化</button><button id="resetView">重置镜头</button><button id="fullscreen">全屏</button><button id="collapse">收起面板</button></div>
  </div>
  <div class="section"><div class="sectionTitle">当前状态</div><div style="font-size:10px;line-height:1.65;color:var(--muted)" id="stateText">雨量、湿润、水洼和涟漪读取同一时间状态。停雨后地表继续排水和干燥。</div></div>
</div>
<button class="handle" id="openPanel" aria-label="展开控制面板">☰</button>
<div class="hud"><div class="chip">完成帧率 <b id="fps">0</b> FPS</div><div class="chip">地表湿润 <b id="wetHud">0%</b></div><div class="chip">积水状态 <b id="puddleHud">0%</b></div><div class="chip">风场 <b id="windHud">0 m/s</b></div></div>
<div class="centerHint" id="hint">拖动旋转 · 滚轮缩放 · 双击重置</div>
<div class="error" id="error"><div><h2>无法启动 WebGL2</h2><p>当前浏览器或显卡环境没有提供所需的 WebGL2 能力。</p></div></div>
<script>
(()=>{'use strict';

else if(mat<3.5){wet=uWet*.55;base=mix(vec3(.25,.255,.245),vec3(.15,.16,.155),wet);rough=mix(.72,.32,wet);}
else if(mat<4.5){wet=uWet*.7;base=mix(vec3(.16,.115,.075),vec3(.08,.056,.038),wet);rough=mix(.68,.26,wet);}
