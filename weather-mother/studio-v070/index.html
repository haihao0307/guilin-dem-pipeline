<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b151b"><link rel="icon" href="data:,"><title>Weather Mother</title><style>html,body{margin:0;width:100%;height:100%;display:grid;place-items:center;background:#061016;color:#dceaf1;font:13px system-ui}small{color:#8ea5b0}</style></head><body><div id="s">正在进入 Weather Mother<br><small>World · Liquid Glass UI</small></div><script>(async()=>{try{const m=await fetch('./MANIFEST.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('manifest '+r.status);return r.json()});const p=await fetch('./'+m.chunks[0].file+'?v=070',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('payload '+r.status);return r.text()});if(p.length!==m.chunks[0].bytes)throw Error('payload length');const b=atob(p),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);const h=await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).text();document.open();document.write(h);document.close()}catch(e){document.querySelector('#s').innerHTML='Weather Mother 启动失败<br><small>'+String(e)+'</small>'}})();</script></body></html>
