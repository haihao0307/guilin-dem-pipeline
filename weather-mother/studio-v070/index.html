<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b151b"><link rel="icon" href="data:,"><title>Weather Mother</title><style>html,body{margin:0;width:100%;height:100%;display:grid;place-items:center;background:#061016;color:#dceaf1;font:13px system-ui}small{color:#8ea5b0}</style></head><body><div id="s">正在进入 Weather Mother<br><small>World · Liquid Glass UI</small></div><script>(async()=>{try{if(typeof DecompressionStream!=='function')throw Error('当前浏览器缺少 gzip 解压能力');const m=await fetch('./MANIFEST.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('manifest '+r.status);return r.json()});const parts=[];for(const c of m.chunks){const p=await fetch('./'+c.file+'?v=0703',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(c.file+' '+r.status);return r.text()});if(p.length!==c.bytes)throw Error(c.file+' length');const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(p)),hex=[...new Uint8Array(h)].map(v=>v.toString(16).padStart(2,'0')).join('');if(hex!==c.sha256)throw Error(c.file+' hash');parts.push(p)}const b=atob(parts.join('')),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);const html=await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).text();const bytes=new TextEncoder().encode(html),digest=[...new Uint8Array(await crypto.subtle.digest('SHA-256',bytes))].map(v=>v.toString(16).padStart(2,'0')).join('');if(bytes.length!==m.sourceBytes||digest!==m.sourceSHA256)throw Error('source identity');document.open();document.write(html);document.close()}catch(e){document.querySelector('#s').innerHTML='Weather Mother 启动失败<br><small>'+String(e)+'</small>'}})();</script></body></html>
