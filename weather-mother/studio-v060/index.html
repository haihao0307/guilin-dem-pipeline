(()=>{'use strict';const stage=document.querySelector('#stage'),dock=document.querySelector('#dock'),loading=document.querySelector('#loading'),title=document.querySelector('#title');const M={world:{t:'World',s:'../v110-full/?embedded=1&studio=061'},rain:{t:'Rain',s:'../liquid-rain-v100/?embedded=1&studio=061&v=100'},snow:{t:'Snow',s:'../v110-full/?weather=snow&embedded=1&studio=061'},fog:{t:'Fog',s:'../v110-full/?weather=fogbank&embedded=1&studio=061'},cloud:{t:'Cloud',s:'../v110-full/?weather=fair&embedded=1&studio=061'},storm:{t:'Storm',s:'../v110-full/?weather=nightstorm&embedded=1&studio=061'}};const current=()=>{const x=new URLSearchParams(location.search).get('module');return M[x]?x:'world'};function immersive(v){document.body.classList.toggle('immersive',!!v);if(v)dock.classList.remove('open')}function open(k,push=true){k=M[k]?k:'world';immersive(false);loading.classList.remove('hide');title.textContent=M[k].t;document.title='Weather Mother · '+M[k].t;document.querySelectorAll('.item').forEach(b=>b.classList.toggle('active',b.dataset.module===k));stage.src=M[k].s;if(push){const u=new URL(location.href);u.searchParams.set('module',k);u.searchParams.set('shell','061');history.pushState({module:k},'',u)}setTimeout(()=>dock.classList.remove('open'),150)}const vh=()=>document.documentElement.style.setProperty('--vh',(visualViewport?visualViewport.height:innerHeight)+'px');vh();visualViewport&&visualViewport.addEventListener('resize',vh);addEventListener('orientationchange',vh);document.querySelector('#toggle').onclick=()=>dock.classList.toggle('open');document.querySelectorAll('.item').forEach(b=>b.onclick=()=>open(b.dataset.module));document.querySelector('#home').onclick=()=>open('world');document.querySelector('#full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();document.querySelector('#restore').onclick=()=>{immersive(false);dock.classList.add('open')};stage.onload=()=>loading.classList.add('hide');addEventListener('message',e=>{if(e.source===stage.contentWindow&&e.data?.type==='WEATHER_MOTHER_IMMERSIVE')immersive(e.data.value)});addEventListener('popstate',()=>open(current(),false));addEventListener('keydown',e=>{if(e.key==='Escape')immersive(false)});open(current(),false);window.__WEATHER_MOTHER_STUDIO__={version:'0.6.1',open,immersive}})();
