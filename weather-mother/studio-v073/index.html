.sha256)throw Error(c.file+" identity");pp.push(t)}const patch=JSON.parse(td.decode(await ungzip(decode(pp.join(""))))),lines=td.decode(base).match(/[^\n]*\n|[^\n]+$/g)||[],out=[];for(const op of patch.ops)op[0]==="c"?out.push(lines.slice(op[1],op[2]).join("")):out.push(op[1]);const html=out.join(""),bytes=te.encode(html);if(bytes.length!==m.sourceBytes||hex(await crypto.subtle.digest("SHA-256",bytes))!==m.sourceSHA256)throw Error("source identity");document.open();document.write(html);document.close()}catch(e){document.querySelector("#s").innerHTML="Weather Mother 启动失败<br><small>"+String(e)+"</small>"}})();</script></body></html>
