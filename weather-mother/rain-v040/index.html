</style><script id="rain-mobile-controller-v041">(()=>{const mq=matchMedia('(max-width:760px)'),panel=document.getElementById('panel'),open=document.getElementById('openPanel'),collapse=document.getElementById('collapse'),canvas=document.getElementById('view');if(!panel||!open)return;const syncHeight=()=>document.documentElement.style.setProperty('--rain-mobile-height',(window.visualViewport?window.visualViewport.height:innerHeight)+'px');const apply=()=>{syncHeight();if(mq.matches){panel.classList.add('collapsed');open.textContent='控制';open.setAttribute('aria-label','展开 Rain 控制面板');if(collapse)collapse.textContent='看场景'}else{open.textContent='☰'}};apply();mq.addEventListener&&mq.addEventListener('change',apply);window.visualViewport&&window.visualViewport.addEventListener('resize',syncHeight);canvas&&canvas.addEventListener('pointerdown',()=>{if(mq.matches&&!panel.classList.contains('collapsed'))panel.classList.add('collapsed')},{passive:true});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&mq.matches)panel.classList.add('collapsed')});})();<\/script>`;const patched=html.includes('</head>')?html.replace('</head>',patch+'</head>'):patch+html;document.open();document.write(patched);document.close()}catch(e){document.body.innerHTML='<div>Rain 启动失败<br><small>'+String(e)+'</small></div>'}})();</script></body></html>
