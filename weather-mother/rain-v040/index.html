<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Weather Mother · Rain</title><style>html,body{margin:0;width:100%;height:100%;display:grid;place-items:center;background:#05070a;color:#dce7ec;font:13px system-ui}small{color:#91a0a9}</style></head><body><div>正在启动 Weather Mother · Rain<br><small>V0.4.0 Visual Truth Candidate</small></div><script>(async()=>{try{const files=['payload-00.txt','payload-01.txt'],parts=await Promise.all(files.map(f=>fetch(f,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(f+' '+r.status);return r.text()}))),b=atob(parts.join('')),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);const html=await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).text();document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div>Rain 启动失败<br><small>'+String(e)+'</small></div>'}})();</script></body></html>
