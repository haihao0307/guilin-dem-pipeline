<canvas id="c" aria-label="实时三维造波云，可拖动旋转和滚轮缩放"></canvas><section class="panel"><h1>晴空云野 · R37</h1><p>拖动调整视角 · 自动缓慢前行<br>R35 多尺度造波 · 无云纹理。<br>研究候选：尚未通过自然动态与等质量性能验收。</p><div class="controls"><button id="play">暂停</button><button id="reset">回到起点</button><button id="compare">原天气对照</button></div><details open><summary>云体与显示</summary><label>形变速度 <input id="speed" type="range" min="0" max="3" step=".05" value="1"></label><label>细节强度 <input id="detail" type="range" min="0" max="1" step=".01" value=".65"></label><label>云密度 <input id="density" type="range" min=".3" max="2" step=".05" value="1"></label><label>显示像素 <select id="pixels"><option value="960">轻量 · 约 52 万像素</option><option value="1280" selected>标准 · 约 92 万像素</option><option value="1920">精细 · 约 207 万像素</option></select></label><label>体积采样 <select id="steps"><option>64</option><option selected>96</option><option>144</option></select></label><button id="measure">测量 5 秒</button><p id="result">同像素、同设备比较。不同云体不能仅按 FPS 判定优劣。</p></details><pre id="error"></pre></section><div id="metrics">正在建立云体…</div>
<script id="fs" type="x-shader/x-fragment">#version 300 es
precision highp float;
out vec4 color;
uniform vec2 uResolution,uAngles;
uniform float uTime,uDistance,uDetail,uDensity;
uniform int uSteps;
const int SCENE=2;
// R35 wave field: fixed 3D directions and continuously evolving phases.
float wave(vec3 p,float ph){vec4 a=vec4(dot(p,vec3(.86,.37,.36)),dot(p,vec3(-.42,.86,.28)),dot(p,vec3(.26,-.43,.86)),dot(p,vec3(.73,.64,-.24)));return dot(sin(a+vec4(ph,-ph*.73,ph*.57,ph*.91)+vec4(.3,2.1,4.7,1.4)),vec4(.25));}
vec2 rnd(vec2 q){return fract(sin(vec2(dot(q,vec2(127.1,311.7)),dot(q,vec2(269.5,183.3))))*43758.5453);}
float hash3(vec3 p){p=fract(p*vec3(.1031,.1030,.0973));p+=dot(p,p.yxz+33.33);return fract((p.x+p.y)*p.z);}
float cloudNoise(vec3 p){vec3 i=floor(p),f=fract(p);f=f*f*f*(f*(f*6.-15.)+10.);return mix(mix(mix(hash3(i),hash3(i+vec3(1,0,0)),f.x),mix(hash3(i+vec3(0,1,0)),hash3(i+vec3(1,1,0)),f.x),f.y),mix(mix(hash3(i+vec3(0,0,1)),hash3(i+vec3(1,0,1)),f.x),mix(hash3(i+vec3(0,1,1)),hash3(i+vec3(1,1,1)),f.x),f.y),f.z);}

float base(vec3 p){
 vec2 cell=floor(p.xz/5.);float d=100.;
 for(int y=-1;y<=1;y++)for(int x=-1;x<=1;x++){
  vec2 id=cell+vec2(float(x),float(y)),h=rnd(id),c=(id+.2+.6*h)*5.;
  float radius=1.25+1.05*h.x;float top=(SCENE==0?4.2:2.2)+h.y*(SCENE==0?4.6:2.4);
  vec3 q=p-vec3(c.x,top*.40-1.2,c.y);
  float v=length(q/vec3(radius,top*.5+1.,radius))-1.;d=min(d,v);
 }
 return d;
}
float density(vec3 p){float e=base(p);if(e>.38)return 0.;float t=uTime*.12;
 vec3 q=p+vec3(wave(p*.8,t),wave(p.yzx*.8,t+.8),wave(p.zxy*.8,t+2.))*.19;
 float w=wave(q*1.6,t*.4)*.19+wave(q*3.3,-t*.28)*.12+uDetail*wave(q*6.0,t*.19)*.045; w+=(cloudNoise(q*2.3+vec3(1.,0.,3.))-.5)*.42+(cloudNoise(q*5.1+12.)-.5)*.18;
 return (1.-smoothstep(-.14,.04,e+w))*uDensity*smoothstep(-3.,-2.,p.y);
}
void main(){vec2 uv=(gl_FragCoord.xy-.5*uResolution)/uResolution.y;
 vec3 ro=SCENE==0?vec3(0.,8.,-13.):vec3(.0,7.2,-8.);ro.z+=uTime*.14+(10.-uDistance);
 float yaw=uAngles.x*.35;float pitch=SCENE==0?-.18:-.22;pitch+=uAngles.y*.35;
 vec3 fw=normalize(vec3(sin(yaw),pitch,cos(yaw))),right=normalize(cross(fw,vec3(0,1,0))),up=cross(right,fw),rd=normalize(fw*1.15+right*uv.x+up*uv.y);
 vec3 sky=SCENE==1?mix(vec3(.98,.57,.38),vec3(.30,.46,.70),smoothstep(-.1,.75,rd.y)):mix(vec3(.69,.80,.89),vec3(.28,.50,.73),smoothstep(-.2,.8,rd.y));
 float lo=0.,hi=42.;if(abs(rd.y)>.0001){float a=(-3.-ro.y)/rd.y,b=(9.-ro.y)/rd.y;lo=max(0.,min(a,b));hi=min(42.,max(a,b));}else if(ro.y< -3.||ro.y>9.)hi=0.;
 vec3 sum=vec3(0);float tr=1.;vec3 sun=normalize(SCENE==1?vec3(-1.,.35,-.2):vec3(-.5,1.,.3));
 if(hi>lo){float ds=(hi-lo)/float(uSteps);for(int i=0;i<144;i++){if(i>=uSteps||tr<.015)break;float t=lo+(float(i)+.5)*ds;vec3 p=ro+rd*t;float d=density(p);if(d<.003)continue;
 float shadow=density(p+sun*.45)*.45+density(p+sun*1.1)*.65;float light=exp(-shadow*2.2);
 vec3 shade=SCENE==1?vec3(.31,.25,.36):vec3(.39,.48,.59);vec3 lit=SCENE==1?vec3(.95,.49,.25):vec3(.57,.57,.55);
 vec3 L=shade+lit*(light+.1*exp(-shadow*.4));L=mix(L,sky,1.-exp(-t*.018));float alpha=1.-exp(-d*ds*1.5);sum+=tr*alpha*L;tr*=1.-alpha;}}
 color=vec4(pow(clamp(sum+tr*sky,0.,1.),vec3(.95)),1.);
}
</script>
<script>(()=>{'use strict';const $=id=>document.getElementById(id),canvas=$('c');let gl,p,vao,loc={},time=0,playing=true,angles=[.0,.06],distance=10,last=performance.now(),dirty=true,frames=0,stamp=last,intervals=[],previousFrame=last,measure=null,drag=null,hidden=false,ext=null,queries=[],gpuSamples=[];
const qa=window.WaveCloudQA={version:'R37',errors:[],frames:0,physicalWeather:false,temporalHistory:false};
function fail(e){qa.errors.push(String(e));$('error').textContent=String(e);playing=false;}
function compile(type,s){let x=gl.createShader(type);gl.shaderSource(x,s);gl.compileShader(x);if(!gl.getShaderParameter(x,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(x));return x;}
function resize(){let w=Number($('pixels').value);const aspect=innerWidth/Math.max(1,innerHeight),budget=w*w*9/16;canvas.width=Math.round(Math.sqrt(budget*aspect));canvas.height=Math.round(canvas.width/aspect);gl.viewport(0,0,canvas.width,canvas.height);dirty=true;intervals=[];}
addEventListener('resize',()=>{if(gl)resize();});
function reset(){time=0;angles=[.0,.06];distance=10;last=performance.now();dirty=true;}
function quantile(a,q){const b=[...a].sort((x,y)=>x-y);return b[Math.min(b.length-1,Math.floor(b.length*q))]||0;}
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.1,Math.max(0,(now-last)/1000));last=now;if(hidden||document.hidden||gl.isContextLost())return;if(playing){time+=dt*Number($('speed').value);dirty=true;}if(!dirty)return;
 while(queries.length&&gl.getQueryParameter(queries[0],gl.QUERY_RESULT_AVAILABLE)){const q=queries.shift(),ok=!gl.getParameter(ext.GPU_DISJOINT_EXT);if(ok)gpuSamples.push(gl.getQueryParameter(q,gl.QUERY_RESULT)/1e6);gl.deleteQuery(q);if(gpuSamples.length>120)gpuSamples.shift();}
 let query=null;if(ext&&queries.length<4){query=gl.createQuery();gl.beginQuery(ext.TIME_ELAPSED_EXT,query);}
 gl.useProgram(p);gl.uniform2f(loc.uResolution,canvas.width,canvas.height);gl.uniform2fv(loc.uAngles,angles);gl.uniform1f(loc.uTime,time);gl.uniform1f(loc.uDistance,distance);gl.uniform1f(loc.uDetail,Number($('detail').value));gl.uniform1f(loc.uDensity,Number($('density').value));gl.uniform1i(loc.uSteps,Number($('steps').value));gl.drawArrays(gl.TRIANGLES,0,3);
 if(query){gl.endQuery(ext.TIME_ELAPSED_EXT);queries.push(query);}dirty=false;qa.frames++;frames++;const delta=now-previousFrame;previousFrame=now;if(delta<500)intervals.push(delta);if(intervals.length>180)intervals.shift();
 if(now-stamp>700){$('metrics').textContent=`R37 · ${canvas.width}×${canvas.height} · ${$('steps').value} 步 · ${(frames*1000/(now-stamp)).toFixed(1)} FPS · P95 ${quantile(intervals,.95).toFixed(1)} ms · GPU ${gpuSamples.length?quantile(gpuSamples,.5).toFixed(1)+' ms':'不可用'} · ${time.toFixed(1)} s`;frames=0;stamp=now;}
 if(measure){measure.frames++;measure.times.push(delta);if(now-measure.start>=5000){const result={fps:measure.frames*1000/(now-measure.start),p95:quantile(measure.times,.95),pixels:[canvas.width,canvas.height],steps:Number($('steps').value)};qa.measurement=result;$('result').textContent=`本次 ${result.fps.toFixed(1)} FPS / P95 ${result.p95.toFixed(1)} ms；${result.pixels.join('×')}，${result.steps} 步。`;measure=null;}}
}
$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'暂停':'播放';last=previousFrame=performance.now();};$('reset').onclick=reset;$('compare').onclick=()=>parent.postMessage({type:'weather-r31-open-original'},'*');$('pixels').onchange=()=>{measure=null;resize();};for(const k of ['detail','density','steps','speed'])$(k).oninput=()=>{dirty=true;measure=null;};$('measure').onclick=()=>{playing=true;$('play').textContent='暂停';previousFrame=performance.now();measure={start:previousFrame,frames:0,times:[]};$('result').textContent='测量中，请保持参数与窗口不变…';};
canvas.onpointerdown=e=>{drag=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId);};canvas.onpointermove=e=>{if(!drag)return;angles[0]+=(e.clientX-drag[0])*.005;angles[1]=Math.max(-.8,Math.min(.8,angles[1]+(e.clientY-drag[1])*.005));drag=[e.clientX,e.clientY];dirty=true;};canvas.onpointerup=canvas.onpointercancel=()=>drag=null;canvas.addEventListener('wheel',e=>{e.preventDefault();distance=Math.max(5.5,Math.min(18,distance*Math.exp(e.deltaY*.001)));dirty=true;},{passive:false});document.addEventListener('visibilitychange',()=>{last=previousFrame=performance.now();measure=null;});addEventListener('message',e=>{if(e.data?.type==='weather-r31-host'){hidden=!!e.data.hidden;last=performance.now();}});canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();fail('图形上下文丢失，请重新进入本场景。');});
try{gl=canvas.getContext('webgl2',{alpha:false,antialias:false,powerPreference:'high-performance'});if(!gl)throw Error('需要 WebGL2');let v=compile(gl.VERTEX_SHADER,'#version 300 es\nvoid main(){vec2 p=vec2((gl_VertexID<<1)&2,gl_VertexID&2);gl_Position=vec4(p*2.-1.,0.,1.);}'),f=compile(gl.FRAGMENT_SHADER,$('fs').textContent);p=gl.createProgram();gl.attachShader(p,v);gl.attachShader(p,f);gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(p));gl.deleteShader(v);gl.deleteShader(f);vao=gl.createVertexArray();gl.bindVertexArray(vao);for(const k of ['uResolution','uAngles','uTime','uDistance','uDetail','uDensity','uSteps'])loc[k]=gl.getUniformLocation(p,k);ext=gl.getExtension('EXT_disjoint_timer_query_webgl2');resize();requestAnimationFrame(frame);}catch(e){fail(e);}
})();</script></html>
