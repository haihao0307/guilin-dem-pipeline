<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#061016">
<link rel="icon" href="data:,">
<title>Weather Mother</title>
<style>
:root{
  color-scheme:dark;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-r:env(safe-area-inset-right,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);
  --app-h:100dvh;
  --glass:rgba(10,22,30,.58);
  --glass-strong:rgba(7,17,24,.82);
  --line:rgba(255,255,255,.17);
  --text:#f3f8fb;
  --muted:#a9bbc4;
  --accent:#c9f1ff;
  --shadow:0 24px 80px rgba(0,0,0,.48);
  --sheet-height:62vh;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:var(--app-h);overflow:hidden;background:#061016;color:var(--text);font-family:Inter,"SF Pro Display","SF Pro Text","Segoe UI","PingFang SC",system-ui,sans-serif;overscroll-behavior:none}
button{font:inherit}
button:focus-visible{outline:2px solid rgba(201,241,255,.82);outline-offset:2px}
#stage{position:fixed;inset:0;width:100%;height:100%;border:0;background:#061016}
#veil{position:fixed;inset:0;z-index:8;display:grid;place-items:center;background:#061016;color:#b9c8cf;font-size:12px;letter-spacing:.08em;transition:opacity .28s ease}
#veil.hidden{opacity:0;pointer-events:none}
.liquid-glass{
  position:relative;
  overflow:hidden;
  border:1px solid var(--line);
  background:
    radial-gradient(130% 130% at 8% 0%,rgba(255,255,255,.18),transparent 42%),
    linear-gradient(145deg,rgba(255,255,255,.12),rgba(255,255,255,.025) 45%,rgba(89,192,231,.10)),
    var(--glass);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18),inset 0 -1px 0 rgba(255,255,255,.035),var(--shadow);
  -webkit-backdrop-filter:blur(28px) saturate(1.45);
  backdrop-filter:blur(28px) saturate(1.45);
}
.liquid-glass::before{
  content:"";
  position:absolute;
  inset:-90% -52%;
  pointer-events:none;
  background:
    radial-gradient(ellipse at center,rgba(255,255,255,.24),transparent 36%),
    linear-gradient(106deg,transparent 34%,rgba(175,232,255,.24) 47%,rgba(255,255,255,.12) 54%,transparent 68%);
  transform:translate3d(-37%,0,0) rotate(8deg);
  animation:glass-flow 8.6s ease-in-out infinite alternate;
  mix-blend-mode:screen;
}
@keyframes glass-flow{
  0%{transform:translate3d(-39%,-5%,0) rotate(8deg);opacity:.42}
  54%{opacity:.88}
  100%{transform:translate3d(39%,7%,0) rotate(8deg);opacity:.56}
}
#launcher{
  position:fixed;
  z-index:40;
  right:calc(10px + var(--safe-r));
  bottom:calc(10px + var(--safe-b));
  width:48px;
  height:48px;
  padding:0;
  border-radius:17px;
  color:#f7fbfd;
  cursor:pointer;
  display:grid;
  place-items:center;
  font-size:10px;
  font-weight:760;
  letter-spacing:.08em;
  touch-action:manipulation;
  transition:transform .18s ease,opacity .18s ease,filter .18s ease;
}
#launcher::after{
  content:"";
  position:absolute;
  width:5px;height:5px;border-radius:50%;
  right:7px;top:7px;
  background:#b8ecff;
  box-shadow:0 0 10px #92ddff;
  opacity:.74;
}
#launcher:active{transform:scale(.94)}
#launcher[aria-expanded="true"]{opacity:.34;filter:saturate(.7)}
body.child-panel-open #launcher{opacity:0;pointer-events:none;transform:scale(.86)}
#scrim{
  position:fixed;
  inset:0;
  z-index:30;
  background:rgba(0,0,0,.19);
  opacity:0;
  pointer-events:none;
  transition:opacity .22s ease;
}
#scrim.open{opacity:1;pointer-events:auto}
#sheet{
  position:fixed;
  z-index:36;
  left:calc(6px + var(--safe-l));
  right:calc(6px + var(--safe-r));
  bottom:calc(6px + var(--safe-b));
  height:min(var(--sheet-height),calc(var(--app-h) - var(--safe-t) - var(--safe-b) - 12px));
  min-height:286px;
  max-height:calc(var(--app-h) - var(--safe-t) - var(--safe-b) - 12px);
  border-radius:30px;
  display:flex;
  flex-direction:column;
  opacity:0;
  transform:translate3d(0,calc(100% + 24px),0);
  pointer-events:none;
  transition:opacity .16s ease,height .24s cubic-bezier(.2,.82,.2,1);
  will-change:transform,height;
}
#sheet.open{opacity:1;transform:none;pointer-events:auto}
#sheet.dragging{transition:opacity .2s ease,transform .2s ease}
#dragArea{
  position:relative;
  z-index:2;
  min-height:28px;
  display:grid;
  place-items:center;
  touch-action:none;
  cursor:ns-resize;
}
#grabber{
  width:42px;height:5px;border-radius:999px;
  background:rgba(237,248,252,.34);
  box-shadow:0 1px 0 rgba(255,255,255,.14);
}
.sheet-head{
  position:relative;
  z-index:2;
  display:flex;
  align-items:center;
  gap:10px;
  padding:0 14px 11px 16px;
}
.sheet-title{min-width:0;flex:1}
.sheet-title strong{display:block;font-size:17px;font-weight:720;letter-spacing:.005em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-title small{display:block;margin-top:3px;color:var(--muted);font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#close{
  width:42px;height:42px;flex:0 0 42px;border:1px solid rgba(255,255,255,.13);border-radius:15px;
  background:rgba(255,255,255,.055);color:#f5f9fb;cursor:pointer;font-size:20px;
  touch-action:manipulation;
}
#tabs{
  position:relative;
  z-index:2;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:4px;
  margin:0 14px 10px;
  padding:4px;
  border-radius:17px;
  background:rgba(1,8,12,.32);
  border:1px solid rgba(255,255,255,.08);
}
#tabs[hidden]{display:none}
.tab{
  min-height:40px;
  border:0;border-radius:13px;
  background:transparent;color:var(--muted);
  font-size:12px;font-weight:650;cursor:pointer;
  touch-action:manipulation;
}
.tab.active{
  color:var(--text);
  background:linear-gradient(145deg,rgba(255,255,255,.16),rgba(255,255,255,.055));
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.09),0 7px 20px rgba(0,0,0,.18);
}
#sheetBody{
  position:relative;
  z-index:2;
  flex:1;
  min-height:0;
  overflow:auto;
  padding:0 12px calc(12px + max(0px,var(--safe-b)));
  scrollbar-width:none;
  overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
}
#sheetBody::-webkit-scrollbar{display:none}
.pane{display:none}
.pane.active{display:block}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{
  position:relative;
  min-height:82px;
  border:1px solid rgba(255,255,255,.08);
  border-radius:20px;
  background:rgba(255,255,255,.038);
  color:var(--text);
  display:grid;
  grid-template-columns:40px 1fr;
  gap:10px;
  align-items:center;
  padding:11px;
  text-align:left;
  cursor:pointer;
  overflow:hidden;
  touch-action:manipulation;
}
.card::before{
  content:"";
  position:absolute;inset:0;
  background:linear-gradient(106deg,transparent 18%,rgba(255,255,255,.10),transparent 74%);
  transform:translateX(-125%);
  transition:transform .42s ease;
}
.card:active::before,.card:focus-visible::before{transform:translateX(125%)}
.card.active{
  border-color:rgba(193,239,255,.34);
  background:linear-gradient(135deg,rgba(164,222,246,.16),rgba(255,255,255,.05));
}
.icon{
  width:40px;height:40px;border-radius:15px;
  display:grid;place-items:center;
  background:linear-gradient(145deg,rgba(255,255,255,.15),rgba(255,255,255,.04));
  border:1px solid rgba(255,255,255,.12);
  font-size:15px;
}
.label{font-size:13px;font-weight:680}
.desc{display:block;margin-top:4px;color:var(--muted);font-size:9px;line-height:1.35}
.control-note{
  margin:2px 2px 10px;
  padding:10px 12px;
  border-radius:16px;
  color:#c7d8df;
  background:rgba(0,0,0,.15);
  border:1px solid rgba(255,255,255,.07);
  font-size:10px;
  line-height:1.45;
}
#toast{
  position:fixed;
  z-index:45;
  left:50%;
  top:calc(12px + var(--safe-t));
  transform:translate(-50%,-16px);
  max-width:calc(100vw - 28px - var(--safe-l) - var(--safe-r));
  padding:9px 13px;
  border-radius:15px;
  color:#eef8fb;
  font-size:10px;
  opacity:0;
  pointer-events:none;
  transition:opacity .2s ease,transform .25s ease;
  white-space:nowrap;
}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (orientation:portrait){
  #sheet[data-snap="compact"]{--sheet-height:42vh}
  #sheet[data-snap="medium"]{--sheet-height:62vh}
  #sheet[data-snap="full"]{--sheet-height:88vh}
}
@media (orientation:portrait) and (max-width:390px){
  .grid{gap:7px}
  .card{min-height:78px;padding:9px}
  .sheet-title strong{font-size:16px}
}
@media (orientation:landscape) and (max-height:560px){
  #launcher{
    right:calc(8px + var(--safe-r));
    bottom:calc(8px + var(--safe-b));
  }
  #sheet{
    left:auto;
    right:calc(6px + var(--safe-r));
    top:calc(6px + var(--safe-t));
    bottom:calc(6px + var(--safe-b));
    width:min(390px,44vw);
    height:auto!important;
    min-height:0;
    max-height:none;
    border-radius:28px;
    transform:translate3d(calc(100% + 24px),0,0);
  }
  #sheet.open{transform:none}
  #dragArea{min-height:20px;cursor:default}
  #grabber{width:5px;height:34px;position:absolute;left:6px;top:50%;transform:translateY(-50%)}
  .sheet-head{padding:7px 12px 9px 18px}
  .sheet-title strong{font-size:15px}
  #close{width:38px;height:38px;flex-basis:38px;border-radius:14px}
  #tabs{margin:0 10px 8px 16px}
  .tab{min-height:36px}
  #sheetBody{padding:0 10px calc(10px + max(0px,var(--safe-b))) 16px}
  .grid{gap:7px}
  .card{min-height:69px;border-radius:17px;padding:8px;grid-template-columns:34px 1fr}
  .icon{width:34px;height:34px;border-radius:13px;font-size:13px}
  .label{font-size:12px}
  .desc{font-size:8px;margin-top:2px}
  .control-note{display:none}
  #toast{top:calc(7px + var(--safe-t))}
}
@media (min-width:760px) and (orientation:portrait){
  #sheet{left:auto;right:calc(12px + var(--safe-r));width:430px;bottom:calc(12px + var(--safe-b))}
}
@media (prefers-reduced-motion:reduce){
  .liquid-glass::before{animation:none;opacity:.5}
  #sheet,#scrim,#toast{transition:none}
}
</style>
</head>
<body>
<div id="veil">Weather Mother 正在载入</div>
<iframe id="stage" allow="fullscreen; autoplay"></iframe>
<div id="scrim"></div>
<button id="launcher" class="liquid-glass" aria-label="打开 Weather Mother" aria-expanded="false">WM</button>
<section id="sheet" class="liquid-glass" data-snap="medium" aria-hidden="true" role="dialog" aria-modal="true">
  <div id="dragArea" aria-label="拖动调整面板高度"><span id="grabber"></span></div>
  <header class="sheet-head">
    <div class="sheet-title">
      <strong id="sheetTitle">Weather Mother</strong>
      <small id="sheetContext">World · 原云系统</small>
    </div>
    <button id="close" aria-label="关闭">×</button>
  </header>
  <div id="tabs" hidden>
    <button class="tab" data-tab="weather">天气</button>
    <button class="tab" data-tab="controls">调节</button>
  </div>
  <div id="sheetBody">
    <section id="weatherPane" class="pane active">
      <div class="grid">
        <button class="card" data-module="world"><span class="icon">◎</span><span><span class="label">World</span><span class="desc">原云系统与天气总控</span></span></button>
        <button class="card" data-module="rain"><span class="icon">◌</span><span><span class="label">Rain · Liquid</span><span class="desc">直接进入 Liquid Rain</span></span></button>
        <button class="card" data-module="fog"><span class="icon">≋</span><span><span class="label">Fog</span><span class="desc">原有 Fog 案例</span></span></button>
        <button class="card" data-module="snow"><span class="icon">✣</span><span><span class="label">Snow</span><span class="desc">原有 Snow 案例</span></span></button>
        <button class="card" data-module="cloud"><span class="icon">☁</span><span><span class="label">Cloud</span><span class="desc">原云形态与光照</span></span></button>
        <button class="card" data-module="storm"><span class="icon">ϟ</span><span><span class="label">Storm</span><span class="desc">原有 Storm 案例</span></span></button>
      </div>
    </section>
    <section id="controlsPane" class="pane">
      <div class="control-note">竖屏适合快速调节。横屏会把面板收进右侧，便于观察完整场景。</div>
      <div class="grid">
        <button class="card" data-rain-section="rain"><span class="icon">◌</span><span><span class="label">降雨</span><span class="desc">雨量、粒径、速度、风向</span></span></button>
        <button class="card" data-rain-section="cloud"><span class="icon">☁</span><span><span class="label">云源</span><span class="desc">覆盖、耦合、光学厚度</span></span></button>
        <button class="card" data-rain-section="ground"><span class="icon">⌁</span><span><span class="label">地面水</span><span class="desc">入渗、流动、蒸发、水洼</span></span></button>
        <button class="card" data-rain-section="glass"><span class="icon">◇</span><span><span class="label">湿玻璃</span><span class="desc">折射、水滴、流痕、高光</span></span></button>
        <button class="card" data-rain-section="materials"><span class="icon">▦</span><span><span class="label">屋瓦砖墙</span><span class="desc">汇流、排水、吸水与湿润</span></span></button>
        <button class="card" data-rain-section="view"><span class="icon">◉</span><span><span class="label">镜头</span><span class="desc">曝光、时刻、视角与诊断</span></span></button>
      </div>
    </section>
  </div>
</section>
<div id="toast" class="liquid-glass"></div>
<script>
(()=>{'use strict';
const MODULE_SOURCES={"world": "<!doctype html><html lang=\"zh-CN\" data-production-line=\"Weather Mother\" data-version=\"1.1.0 LOOP\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1,viewport-fit=cover\"><meta name=\"theme-color\" content=\"#142737\"><link rel=\"icon\" href=\"data:,\"><title>Weather Mother · 原天气系统 · R15 细节<\/title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#90adc8;color:#eaf4fa;font:13px/1.5 system-ui,-apple-system,\"Segoe UI\",sans-serif}canvas{width:100%;height:100%;display:block;touch-action:none}button,input,select{font:inherit}button,select{color:inherit;background:#ffffff0a;border:1px solid #ffffff25;border-radius:7px;padding:6px 9px;cursor:pointer}button:hover{background:#ffffff20}select option{background:#173247}button:focus-visible,select:focus-visible{outline:2px solid #b5e7fa}.panel{position:fixed;left:18px;top:18px;z-index:3;width:306px;max-height:calc(100% - 82px);overflow:auto;background:#122838e8;border:1px solid #ffffff26;border-radius:15px;padding:16px;backdrop-filter:blur(16px);box-shadow:0 12px 38px #10273733;scrollbar-width:thin}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:15px;letter-spacing:1.2px;margin:0}.ver{font-size:10px;letter-spacing:1.5px;color:#9ab9cb}.lede{font-size:12px;color:#bdd1df;margin:10px 0 12px}.row{display:grid;grid-template-columns:78px 1fr 39px;gap:6px;align-items:center;margin:8px 0}.row label{font-size:12px;color:#d1e1eb}.row input{width:100%;min-width:0;accent-color:#afdbef}.row select{grid-column:2/4;width:100%;min-width:0;padding:5px}.row output{font-size:11px;color:#bad0df;text-align:right;font-variant-numeric:tabular-nums}.times{display:flex;gap:4px;margin:11px 0}.times button{flex:1;padding:6px 0;font-size:12px}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:12px}summary{font-size:12px;cursor:pointer;color:#b9d3e0;border-top:1px solid #ffffff1f;padding-top:9px;margin-top:12px}.check{display:flex;gap:7px;align-items:center;color:#c2d6e3;font-size:12px;margin:7px 0}.hint{font-size:11px;line-height:1.55;color:#9fb8c9;margin:10px 0 0}.collapsed .body{display:none}#collapse{padding:0 7px;font-size:17px}.footer{position:fixed;left:18px;right:18px;bottom:15px;display:flex;justify-content:space-between;gap:8px;z-index:3;pointer-events:none;font-size:11px;font-variant-numeric:tabular-nums}.badge{padding:7px 10px;border-radius:8px;background:#112a3bd9;backdrop-filter:blur(8px);color:#e2f1fa}#loading{position:fixed;right:20px;top:20px;padding:9px 14px;border-radius:20px;z-index:4;background:#102739dd}#error{display:none;position:fixed;inset:15% 10%;z-index:8;white-space:pre-wrap;overflow:auto;border:1px solid #ffbd98;border-radius:14px;background:#132a3af5;padding:24px}input[type=checkbox]{accent-color:#afdbef}@media(max-width:650px){.panel{left:9px;top:9px;width:230px;padding:12px}h1{font-size:13px}.footer{left:9px;bottom:9px;right:9px}.footer .badge:last-child{display:none}.row{grid-template-columns:62px 1fr 35px;margin:7px 0}.lede{font-size:11px}}<\/style><\/head><body><canvas id=\"scene\" aria-label=\"实时三维体积天气\"><\/canvas><div class=\"panel\" id=\"panel\"><header><div><h1>WEATHER MOTHER<\/h1><div class=\"ver\">V1.1.0 LOOP · HIGH QUALITY WEATHER STUDIO<\/div><\/div><button id=\"collapse\" aria-label=\"收起控制台\">−<\/button><\/header><div class=\"body\"><details open><summary>新增云体细节<\/summary><div class=\"row\"><label for=\"enhanced\">细节强度<\/label><input id=\"enhanced\" type=\"range\" min=\"0\" max=\"1\" step=\".01\" value=\".8\"><output id=\"enhancedValue\">80%<\/output><\/div><button id=\"enhancedReset\">回到原云效果<\/button><p class=\"hint\">保留原天气与云形。细节同时影响云内透光与近处遮光。<\/p><\/details><p class=\"lede\" id=\"description\">层叠云峰、柔软边缘与连续日照。<\/p><div class=\"row\"><label for=\"weather\">天气案例<\/label><select id=\"weather\"><option value=\"fair\">晴日积云<\/option><option value=\"coast\">海岸层积云<\/option><option value=\"mountain\">山间湿雾<\/option><option value=\"rain\">阴天降雨<\/option><option value=\"storm\">深对流雷暴<\/option><option value=\"rainbow\">雨过天晴 · 彩虹<\/option><option value=\"snow\">雪与低云<\/option><option value=\"high\">高空冰云<\/option><option value=\"iridescent\">七彩薄云 · 虹彩<\/option><option value=\"irisEdge\">七彩云缘 · 日照<\/option><option value=\"lenticular\">山前荚状云<\/option><option value=\"mackerel\">鱼鳞状卷积云<\/option><option value=\"dawn\">晨光低云<\/option><option value=\"sunset\">落日积云<\/option><option value=\"fogbank\">湿雾云海<\/option><option value=\"nightstorm\">夜间雷暴<\/option><option value=\"warmfront\">暖锋云幕<\/option><option value=\"coldfront\">冷锋过境<\/option><option value=\"squall\">飑线雷暴<\/option><option value=\"typhoon\">台风云系 · 组织预览<\/option><\/select><\/div><div class=\"row\"><label for=\"kind\">云属<\/label><select id=\"kind\"><option value=\"Cu\">积云 Cu<\/option><option value=\"Cb\">积雨云 Cb<\/option><option value=\"Sc\">层积云 Sc<\/option><option value=\"St\">层云 St<\/option><option value=\"Ns\">雨层云 Ns<\/option><option value=\"Ac\">高积云 Ac<\/option><option value=\"As\">高层云 As<\/option><option value=\"Ci\">卷云 Ci<\/option><option value=\"Cc\">卷积云 Cc<\/option><option value=\"Cs\">卷层云 Cs<\/option><\/select><\/div><div class=\"times\"><button data-hour=\"6.6\">清晨<\/button><button data-hour=\"12\">正午<\/button><button data-hour=\"17.5\">黄昏<\/button><button data-hour=\"22\">月夜<\/button><\/div><div class=\"row\"><label for=\"hour\">时刻<\/label><input id=\"hour\" type=\"range\" min=\"0\" max=\"24\" step=\"0.05\" value=\"16\"><output><\/output><\/div><div class=\"row\"><label for=\"density\">浓度<\/label><input id=\"density\" type=\"range\" min=\"0\" max=\"2\" step=\"0.01\" value=\"0.86\"><output><\/output><\/div><div class=\"row\"><label for=\"count\">云团数<\/label><input id=\"count\" type=\"range\" min=\"1\" max=\"9\" step=\"1\" value=\"3\"><output><\/output><\/div><div class=\"row\"><label for=\"wind\">风力 m/s<\/label><input id=\"wind\" type=\"range\" min=\"0\" max=\"80\" step=\"1\" value=\"12\"><output><\/output><\/div><div class=\"row\"><label for=\"cloudSpeed\">云速 m/s<\/label><input id=\"cloudSpeed\" type=\"range\" min=\"0\" max=\"250\" step=\"1\" value=\"12\"><output><\/output><\/div><div class=\"row\"><label for=\"direction\">来风方向<\/label><input id=\"direction\" type=\"range\" min=\"0\" max=\"360\" step=\"1\" value=\"270\"><output><\/output><\/div><details id=\"cycloneSection\"><summary>台风与旋转风暴<\/summary>\n<div class=\"row\"><label for=\"cycloneSpin\">旋转强度<\/label><input id=\"cycloneSpin\" type=\"range\" min=\"0\" max=\"2.5\" step=\".02\" value=\"1\"><output><\/output><\/div>\n<div class=\"row\"><label for=\"eyeRadius\">风眼半径<\/label><input id=\"eyeRadius\" type=\"range\" min=\"1.2\" max=\"3.8\" step=\".05\" value=\"2.2\"><output><\/output><\/div>\n<div class=\"row\"><label for=\"rainbandCurl\">雨带弯曲<\/label><input id=\"rainbandCurl\" type=\"range\" min=\".4\" max=\"2\" step=\".02\" value=\"1\"><output><\/output><\/div>\n<div class=\"row\"><label for=\"stormRadius\">云系半径<\/label><input id=\"stormRadius\" type=\"range\" min=\"7\" max=\"11\" step=\".1\" value=\"10\"><output><\/output><\/div>\n<p class=\"hint\">风眼、眼墙和螺旋雨带由同一旋转场组织。当前是可操作的体积外观模型，没有气压、海温、科氏力或数值天气求解。<\/p><\/details><details open id=\"irisSection\"><summary>七彩云 · 云体虹彩<\/summary>\n<label class=\"check\"><input id=\"iridescence\" type=\"checkbox\">启用近太阳方向的云体虹彩<\/label>\n<div class=\"row\"><label for=\"iriStrength\">彩色强度<\/label><input id=\"iriStrength\" type=\"range\" min=\"0\" max=\"2\" step=\".02\" value=\"0\"><output><\/output><\/div>\n<div class=\"row\"><label for=\"dropletRadius\">滴半径 μm<\/label><input id=\"dropletRadius\" type=\"range\" min=\"1\" max=\"16\" step=\".1\" value=\"6\"><output><\/output><\/div>\n<div class=\"row\"><label for=\"dropletSpread\">粒径离散<\/label><input id=\"dropletSpread\" type=\"range\" min=\"0\" max=\"1\" step=\".02\" value=\".12\"><output><\/output><\/div>\n<button id=\"aimIris\">对准七彩云观察角度<\/button>\n<p class=\"hint\">多波段衍射外观近似。色彩取决于日照角、滴径和云体光学厚度，随观察方向变化。没有彩色图片贴片。<\/p><\/details><details open id=\"loopSection\"><summary>连续形态循环<\/summary>\n<label class=\"check\"><input id=\"loopEnabled\" type=\"checkbox\" checked>同一种子无缝演化<\/label>\n<div class=\"row\"><label for=\"loopSeconds\">周期 秒<\/label><input id=\"loopSeconds\" type=\"range\" min=\"12\" max=\"300\" step=\"1\" value=\"60\"><output><\/output><\/div>\n<div class=\"row\"><label for=\"loopAmount\">变化幅度<\/label><input id=\"loopAmount\" type=\"range\" min=\"0\" max=\"1\" step=\".01\" value=\".6\"><output><\/output><\/div>\n<div class=\"row\"><label for=\"loopPhase\">循环进度<\/label><input id=\"loopPhase\" type=\"range\" min=\"0\" max=\"100\" step=\".1\" value=\"0\"><output>0%<\/output><\/div>\n<div class=\"buttons\"><button id=\"loopPause\">冻结形态<\/button><button id=\"loopRestart\">回到循环起点<\/button><\/div>\n<p class=\"hint\">云体在生长与消散间连续变化；种子身份保持。周期按 1×、内部演化 1× 计算。漂移与日照独立，全局暂停可冻结画面。<\/p><\/details>\n<details id=\"perfSection\"><summary>性能与空区优化<\/summary><label class=\"check\"><input id=\"fastEmpty\" type=\"checkbox\" checked>保守空区排除，保留原采样数<\/label>\n<label class=\"check\"><input id=\"skipEmpty\" type=\"checkbox\" checked>距离下界跳过确定为空的采样区<\/label><pre id=\"perfReadout\" class=\"hint\" style=\"white-space:pre-wrap\">等待有效帧样本…<\/pre><button id=\"perfReset\">重新测量<\/button>\n<p class=\"hint\">显示完成帧的实际速率及 P95 耗时。GPU 计时不受支持时显示不可用。优化不删除光照，也不偷偷降低分辨率。<\/p><\/details>\n<details id=\"lightningSection\"><summary>雷电事件<\/summary><label class=\"check\"><input id=\"lightningEnabled\" type=\"checkbox\">雷暴自动放电，包含闪光<\/label>\n<div class=\"row\"><label for=\"lightningRate\">每分钟事件<\/label><input id=\"lightningRate\" type=\"range\" min=\"0\" max=\"20\" step=\"1\" value=\"6\"><output><\/output><\/div>\n<div class=\"row\"><label for=\"lightningPower\">闪电亮度<\/label><input id=\"lightningPower\" type=\"range\" min=\"0\" max=\"2\" step=\".01\" value=\".9\"><output><\/output><\/div>\n<div class=\"row\"><label for=\"dischargeMode\">放电类型<\/label><select id=\"dischargeMode\"><option value=\"auto\">混合事件<\/option><option value=\"intra\">云内放电<\/option><option value=\"ground\">云地放电<\/option><\/select><\/div><button id=\"lightningOnce\">演示一次局部放电<\/button><p class=\"hint\">连续分叉通道、短促复击与多点云内照亮。闪电仍待参考校准；台风眼、眼墙及雨带只有规则，尚无台风仿真。<\/p><\/details><details open><summary>风与运动<\/summary><div class=\"row\"><label for=\"gust\">阵风起伏<\/label><input id=\"gust\" type=\"range\" min=\"0\" max=\"1\" step=\"0.01\" value=\"0.15\"><output><\/output><\/div><div class=\"row\"><label for=\"turbulence\">湍流强度<\/label><input id=\"turbulence\" type=\"range\" min=\"0\" max=\"1\" step=\"0.01\" value=\"0.25\"><output><\/output><\/div><div class=\"row\"><label for=\"timeScale\">时间倍率<\/label><input id=\"timeScale\" type=\"range\" min=\"0\" max=\"60\" step=\"0.1\" value=\"1\"><output><\/output><\/div><div class=\"row\"><label for=\"evolution\">内部演化<\/label><input id=\"evolution\" type=\"range\" min=\"0\" max=\"5\" step=\"0.05\" value=\"1\"><output><\/output><\/div><label class=\"check\"><input id=\"windLink\" type=\"checkbox\">云速跟随风速<\/label><label class=\"check\"><input id=\"follow\" type=\"checkbox\">相机跟随云场<\/label><div id=\"windReadout\" class=\"hint\"><\/div><p class=\"hint\">风力驱动局部扰动，云速控制整片云的平移。1× 为实际秒，倍率只用于加速演示。<\/p><\/details><details><summary>大气与光照<\/summary><div class=\"row\"><label for=\"lightScene\">光影场景<\/label><select id=\"lightScene\"><option value=\"natural\">自然天气<\/option><option value=\"daylight\">日光体积<\/option><option value=\"dawn\">清晨暖光<\/option><option value=\"sunset\">黄昏透光<\/option><option value=\"silver\">逆光银边<\/option><option value=\"moon\">冷色月光<\/option><\/select><\/div><div class=\"row\"><label for=\"exposure\">曝光<\/label><input id=\"exposure\" type=\"range\" min=\"0.4\" max=\"2\" step=\"0.02\" value=\"1\"><output><\/output><\/div><div class=\"row\"><label for=\"sunlight\">直射光<\/label><input id=\"sunlight\" type=\"range\" min=\"0\" max=\"2\" step=\"0.02\" value=\"1\"><output><\/output><\/div><div class=\"row\"><label for=\"skylight\">天空补光<\/label><input id=\"skylight\" type=\"range\" min=\"0\" max=\"2\" step=\"0.02\" value=\"1\"><output><\/output><\/div><div class=\"row\"><label for=\"scatter\">内部散射<\/label><input id=\"scatter\" type=\"range\" min=\"0\" max=\"1.5\" step=\"0.02\" value=\"1\"><output><\/output><\/div><div class=\"row\"><label for=\"silver\">透光银边<\/label><input id=\"silver\" type=\"range\" min=\"0\" max=\"3\" step=\"0.01\" value=\"1\"><output><\/output><\/div><div class=\"row\"><label for=\"groundLight\">地面反照<\/label><input id=\"groundLight\" type=\"range\" min=\"0\" max=\"3\" step=\"0.01\" value=\"1\"><output><\/output><\/div><div class=\"row\"><label for=\"haze\">大气浑浊<\/label><input id=\"haze\" type=\"range\" min=\"0\" max=\"1\" step=\"0.02\" value=\"0.22\"><output><\/output><\/div><\/details><details><summary>云体、天气与交互<\/summary><div class=\"row\"><label for=\"detail\">边缘细节<\/label><input id=\"detail\" type=\"range\" min=\"0\" max=\"1\" step=\"0.02\" value=\"0.64\"><output><\/output><\/div><div class=\"row\"><label for=\"rain\">降水<\/label><input id=\"rain\" type=\"range\" min=\"0\" max=\"1\" step=\"0.02\" value=\"0\"><output><\/output><\/div><div class=\"row\"><label for=\"fog\">雾量<\/label><input id=\"fog\" type=\"range\" min=\"0\" max=\"1\" step=\"0.02\" value=\"0.03\"><output><\/output><\/div><div class=\"row\"><label for=\"humidity\">相对湿度<\/label><input id=\"humidity\" type=\"range\" min=\"20\" max=\"100\" step=\"1\" value=\"68\"><output><\/output><\/div><div class=\"row\"><label for=\"instability\">对流强度<\/label><input id=\"instability\" type=\"range\" min=\"0\" max=\"1\" step=\"0.02\" value=\"0.45\"><output><\/output><\/div><div class=\"row\"><label for=\"shear\">高空风切<\/label><input id=\"shear\" type=\"range\" min=\"0\" max=\"1\" step=\"0.02\" value=\"0.18\"><output><\/output><\/div><div class=\"row\"><label for=\"quality\">画质<\/label><select id=\"quality\"><option value=\"balanced\">交互预览 · 112 步<\/option><option value=\"adaptive\" selected>流畅细节 · 144 步<\/option><option value=\"fine\">高画质 · 192 步<\/option><option value=\"ultra\">原生精细 · 320 步<\/option><option value=\"cinema\">电影特写 · 480 步<\/option><\/select><\/div><label class=\"check\"><input id=\"temporal\" type=\"checkbox\" checked>时间重投影与降噪<\/label><div class=\"row\"><label for=\"r31TemporalPolicy\">R31 历史混合实验<\/label><select id=\"r31TemporalPolicy\"><option value=\"legacy\">旧策略 · 每帧 0.89<\/option><option value=\"new\" selected>形变感知 · 按秒衰减<\/option><option value=\"off\">无历史 · 消融对照<\/option><\/select><\/div><p class=\"hint\">新策略：变化云边少留旧颜色。仍是实验，可能增加噪声；不是残影消除验收。<\/p><label class=\"check\"><input id=\"mountains\" type=\"checkbox\">山体与迎风抬升示意<\/label><label class=\"check\"><input id=\"rainbow\" type=\"checkbox\">日照雨区中的彩虹<\/label><label class=\"check\"><input id=\"cycle\" type=\"checkbox\">自动昼夜演示<\/label><p class=\"hint\">程序化天气案例。山地、台风和降水仍有明确的近似边界，尚未接入实况天气或完整流体求解。<\/p><p class=\"hint\"><a href=\"../method-v100/lighting/?lighting=silver&quality=fine\" target=\"_blank\" rel=\"noopener\">打开独立云体光影检查页 ↗<\/a><\/p><\/details><div class=\"buttons\"><button id=\"pause\">暂停演化<\/button><button id=\"seed\">新种子<\/button><button id=\"reset\">回到全景<\/button><button id=\"match\">按天气参数生成<\/button><\/div><p class=\"hint\">拖动环绕，滚轮靠近，双击回到全景。风与云速独立控制，均为米/秒。采样与内存优先服务画质，零图片资产。<\/p><\/div><\/div><div class=\"footer\"><span id=\"status\" class=\"badge\">生成天气场<\/span><span class=\"badge\">V1.1 全天气候选 · 保留 V061 基线<\/span><\/div><div id=\"loading\">正在生成三维密度数据…<\/div><pre id=\"error\"><\/pre><script>window.__WEATHER_SHADER=\"#version 300 es\\nprecision highp float;\\nprecision highp sampler3D;\\nuniform vec2 uRes,uSurface;\\nuniform vec3 uLoop,uOccupancySize;uniform float uFastEmpty,uMicroFilter,uSolarDay;uniform vec4 uCyclone;\\nuniform sampler3D uOccupancy;uniform vec4 uLightning;\\nuniform sampler3D uDistance;uniform float uSkipEmpty;uniform sampler2D uIrisLUT,uBoltData;uniform vec4 uIris,uFlashNodes[4];uniform int uBoltCount;\\nfloat sampleFootprint=0.;\\nvec3 periodicSignal(){float t=6.28318530718*fract(uLoop.y);return vec3(cos(t)-1.,sin(t),sin(2.*t));}\\nvec3 cycleWarp(vec3 q,float t){return vec3(s const sheetContext=document.querySelector('#sheetContext');
const weatherPane=document.querySelector('#weatherPane');
const controlsPane=document.querySelector('#controlsPane');

  world:{label:'World',context:'原云系统与天气总控',src:'../v110-full/?embedded=1&studio=073'},
  rain:{label:'Rain',context:'Liquid Rain',src:'../liquid-rain-v130/?embedded=1&studio=073&v=130'},
  fog:{label:'Fog',context:'原有 Fog 案例',src:'../v110-full/?weather=fogbank&embedded=1&studio=073'},

  cloud:{label:'Cloud',context:'原云形态与光照',src:'../v110-full/?weather=fair&embedded=1&studio=073'},
  storm:{label:'Storm',context:'原有 Storm 案例',src:'../v110-full/?weather=nightstorm&embedded=1&studio=073'}
};
let active='world';
let activeTab='weather';
let toastTimer=0;
let drag=null;
const isPortrait=()=>matchMedia('(orientation:portrait)').matches;
const appHeight=()=>Math.min(innerHeight||Infinity,visualViewport?.height||Infinity,screen?.height||Infinity);
const snapRatio=()=>sheet.dataset.snap==='compact'?.42:sheet.dataset.snap==='full'?.88:.62;
function applySheetHeight(){
  if(isPortrait()){
    const safeTop=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--safe-t'))||0;
    const safeBottom=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--safe-b'))||0;
    const available=Math.max(286,appHeight()-safeTop-safeBottom-12);
    sheet.style.height=Math.min(available,Math.max(286,appHeight()*snapRatio()))+'px';
  }else sheet.style.removeProperty('height');
}
function syncViewport(){
  document.documentElement.style.setProperty('--app-h',appHeight()+'px');
  applySheetHeight();
  if(active==='rain')injectRainMobileCSS();
}
syncViewport();
visualViewport?.addEventListener('resize',syncViewport);
visualViewport?.addEventListener('scroll',syncViewport);
addEventListener('resize',syncViewport);
addEventListener('orientationchange',()=>setTimeout(()=>{syncViewport();injectRainMobileCSS()},80));
function requested(){
  const m=new URLSearchParams(location.search).get('module');
  return routes[m]?m:'world';
}
function showToast(text){
  clearTimeout(toastTimer);
  toast.textContent=text;
  toast.classList.add('show');
  toastTimer=setTimeout(()=>toast.classList.remove('show'),1700);
}
function childUI(){
  try{return stage.contentWindow?.WeatherLiquidUI||null}catch{return null}
}
function closeChildPanel(){
  try{childUI()?.close?.()}catch{}
  document.body.classList.remove('child-panel-open');
}
function updateHeader(){
  sheetTitle.textContent=active==='rain'?'Liquid Rain':'Weather Mother';
  sheetContext.textContent=routes[active].label+' · '+routes[active].context;
  tabs.hidden=active!=='rain';
  document.querySelectorAll('[data-module]').forEach(b=>b.classList.toggle('active',b.dataset.module===active));
}
function setTab(name){
  activeTab=(name==='controls'&&active==='rain')?'controls':'weather';
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===activeTab));
  weatherPane.classList.toggle('active',activeTab==='weather');
  controlsPane.classList.toggle('active',activeTab==='controls');
  sheetBody.scrollTop=0;
  if(activeTab==='weather') closeChildPanel();
}
function setSheet(open,preferredTab){
  if(open){
    updateHeader();
    setTab(preferredTab||(active==='rain'?'controls':'weather'));
    if(isPortrait()) sheet.dataset.snap=activeTab==='controls'?'medium':'compact';
    applySheetHeight();
    closeChildPanel();
  }
  sheet.classList.toggle('open',open);
  scrim.classList.toggle('open',open);
  sheet.setAttribute('aria-hidden',String(!open));
  launcher.setAttribute('aria-expanded',String(open));
}
function openModule(name,push=true){
  name=routes[name]?name:'world';
  active=name;
  veil.classList.remove('hidden');
  document.title='Weather Mother · '+routes[name].label;
  const weather=new URLSearchParams(routes[name].src.split('?')[1]||'').get('weather');
  const boot='<script>window.WeatherMotherBoot='+JSON.stringify(weather?{weather}: {})+';window.cloudModuleHidden=!!parent.cloudModuleHidden;<\/script>';
  stage.srcdoc=MODULE_SOURCES[name==='rain'?'rain':'world'].replace('<head>','<head>'+boot);
  setSheet(false);
  updateHeader();
  if(push&&/^https?:$/.test(location.protocol)){
    const u=new URL(location.href);
    u.searchParams.set('module',name);
    u.searchParams.set('shell','073');
    history.pushState({module:name},'',u);
  }
}
function findChildButton(text){
  try{return [...stage.contentDocument.querySelectorAll('button')].find(b=>b.textContent.trim()===text)||null}catch{return null}
}
function focusRainView(section){
  try{
    if(section==='glass') stage.contentDocument.getElementById('glassView')?.click();
    else if(section==='ground') findChildButton('水洼')?.click();
    else if(section==='materials') (findChildButton('受湿')||findChildButton('材料近景'))?.click();
    else if(section==='rain'||section==='cloud') findChildButton('院落')?.click();
  }catch{}
}
function openRainSection(section){
  if(active!=='rain'){openModule('rain');setTimeout(()=>openRainSection(section),700);return}
  let tries=0;
  const attempt=()=>{
    const ui=childUI();
    if(!ui?.openSection||!ui?.open){
      if(tries++<100)setTimeout(attempt,120);
      return;
    }
    injectRainMobileCSS();
    try{ui.setEmbedded?.(true)}catch{}
    ui.openSection(section);
    ui.open();
    document.body.classList.add('child-panel-open');
    requestAnimationFrame(()=>{
      try{
        ui.openSection(section);
        if(!ui.isOpen?.())ui.open();
      }catch{}
      focusRainView(section);
    });
    setSheet(false);
  };
  attempt();
}
function prepareRain(retry=0){
  if(active!=='rain')return;
  injectRainMobileCSS();
  const ui=childUI();
  if(ui){
    try{ui.setEmbedded?.(true)}catch{}
    return;
  }
  if(retry<100)setTimeout(()=>prepareRain(retry+1),100);
}
function injectRainMobileCSS(){
  if(active!=='rain')return;
  try{
    const d=stage.contentDocument;
    if(!d?.head)return;
    const host=getComputedStyle(document.documentElement);
    d.documentElement.style.setProperty('--wm-safe-t',host.getPropertyValue('--safe-t').trim()||'0px');
    d.documentElement.style.setProperty('--wm-safe-r',host.getPropertyValue('--safe-r').trim()||'0px');
    d.documentElement.style.setProperty('--wm-safe-b',host.getPropertyValue('--safe-b').trim()||'0px');
    d.documentElement.style.setProperty('--wm-safe-l',host.getPropertyValue('--safe-l').trim()||'0px');
    d.documentElement.style.setProperty('--wm-app-h',appHeight()+'px');
    d.documentElement.style.setProperty('--wm-panel-h',Math.min(590,Math.max(286,appHeight()*.58))+'px');
    let style=d.getElementById('wm-iphone-max-bridge');
    if(!style){style=d.createElement('style');style.id='wm-iphone-max-bridge';d.head.appendChild(style)}
    style.textContent=`
      body.embedded #wm,body.embedded #navigation,body.embedded #controls,body.embedded #restore{display:none!important}
      body.embedded #audio{z-index:44!important;top:calc(8px + var(--wm-safe-t,0px))!important;right:calc(8px + var(--wm-safe-r,0px))!important;left:auto!important;min-width:44px!important;min-height:44px!important;border-radius:15px!important}
      body.embedded #panel{z-index:46!important;box-shadow:0 24px 80px rgba(0,0,0,.52)!important;transition:none!important}
      body.embedded #panel button,body.embedded #panel select{min-height:44px!important}
      body.embedded #panel input[type=range]{min-height:42px!important}
      @media (orientation:portrait) and (max-width:600px){
        body.embedded #panel{left:calc(6px + var(--wm-safe-l,0px))!important;right:calc(6px + var(--wm-safe-r,0px))!important;top:auto!important;bottom:calc(6px + var(--wm-safe-b,0px))!important;width:auto!important;max-width:none!important;height:var(--wm-panel-h,min(58dvh,590px))!important;max-height:calc(var(--wm-app-h,100dvh) - var(--wm-safe-t,0px) - var(--wm-safe-b,0px) - 12px)!important;border-radius:28px!important;padding-bottom:calc(14px + var(--wm-safe-b,0px))!important}
      }
      @media (orientation:landscape) and (max-height:560px){
        body.embedded #panel{left:auto!important;right:calc(6px + var(--wm-safe-r,0px))!important;top:calc(6px + var(--wm-safe-t,0px))!important;bottom:calc(6px + var(--wm-safe-b,0px))!important;width:min(390px,43vw)!important;height:auto!important;max-height:none!important;border-radius:25px!important}
        body.embedded #panel button,body.embedded #panel select{min-height:38px!important}
        body.embedded #panel input[type=range]{min-height:34px!important}
      }`;
  }catch{}
}
setInterval(()=>{
  if(active!=='rain'){document.body.classList.remove('child-panel-open');return}
  try{document.body.classList.toggle('child-panel-open',!!childUI()?.isOpen?.())}catch{}
},240);
launcher.addEventListener('click',()=>setSheet(!sheet.classList.contains('open')));
closeBtn.addEventListener('click',()=>setSheet(false));
scrim.addEventListener('click',()=>setSheet(false));
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));
document.querySelectorAll('[data-module]').forEach(b=>b.addEventListener('click',()=>openModule(b.dataset.module)));
document.querySelectorAll('[data-rain-section]').forEach(b=>b.addEventListener('click',()=>openRainSection(b.dataset.rainSection)));
dragArea.addEventListener('click',e=>{
  if(!isPortrait()||drag?.moved)return;
  const order=['compact','medium','full'];
  sheet.dataset.snap=order[(order.indexOf(sheet.dataset.snap)+1)%order.length];
  applySheetHeight();
});
dragArea.addEventListener('pointerdown',e=>{
  if(!isPortrait())return;
  drag={id:e.pointerId,startY:e.clientY,startH:sheet.getBoundingClientRect().height,moved:false};
  dragArea.setPointerCapture(e.pointerId);
  sheet.classList.add('dragging');
});
dragArea.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.id)return;
  const dy=drag.startY-e.clientY;
  if(Math.abs(dy)>5)drag.moved=true;
  const h=Math.max(190,Math.min(appHeight()*.9,drag.startH+dy));
  sheet.style.height=h+'px';
});
function endDrag(e){
  if(!drag||e.pointerId!==drag.id)return;
  const h=sheet.getBoundingClientRect().height,vh=appHeight();
  sheet.classList.remove('dragging');
  if(h<vh*.28){setSheet(false)}
  else{
    const snaps=[['compact',vh*.42],['medium',vh*.62],['full',vh*.88]];
    sheet.dataset.snap=snaps.reduce((a,b)=>Math.abs(b[1]-h)<Math.abs(a[1]-h)?b:a)[0];
    applySheetHeight();
  }
  setTimeout(()=>{drag=null},0);
}
dragArea.addEventListener('pointerup',endDrag);
dragArea.addEventListener('pointercancel',endDrag);
stage.addEventListener('load',()=>{
  veil.classList.add('hidden');
  if(active==='rain')setTimeout(()=>prepareRain(),50);
  suspendChild(!!window.cloudModuleHidden);
});
addEventListener('popstate',()=>openModule(requested(),false));
addEventListener('keydown',e=>{if(e.key==='Escape')setSheet(false)});
openModule(requested(),false);
function suspendChild(value){
  window.cloudModuleHidden=!!value;
  const w=stage.contentWindow;
  if(!w)return;
  w.cloudModuleHidden=!!value;
  w.WeatherDetail?.suspend(!!value);
  w.document.dispatchEvent(new Event('visibilitychange'));
  if(value)w.dispatchEvent(new Event('blur'));
}
window.WeatherDetail={suspend:suspendChild};
window.__WEATHER_MOTHER_STUDIO__={
  version:'0.7.3-iphone-max-adaptive',
  open:openModule,
  menu:setSheet,
  tab:setTab,
  openRainSection,
  getState:()=>({
    module:active,
    sheetOpen:sheet.classList.contains('open'),
    tab:activeTab,
    snap:sheet.dataset.snap,
    orientation:isPortrait()?'portrait':'landscape',
    iPhoneMaxAdaptive:true
  })
};
})();
</script>
</body>
