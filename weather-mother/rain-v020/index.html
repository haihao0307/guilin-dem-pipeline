<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Weather Mother · Rain</title>
<style>
:root{color-scheme:dark;--bg:#05080b;--panel:rgba(9,13,17,.88);--panel2:rgba(15,20,25,.92);--line:rgba(255,255,255,.12);--line2:rgba(196,221,237,.22);--text:#eef4f7;--muted:#9caab3;--accent:#d9eef8;--good:#8ed1aa}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:Inter,"SF Pro Display","Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--text)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;background:#05080b;touch-action:none}
.modulebar{position:fixed;z-index:6;top:0;left:0;right:0;height:54px;display:flex;align-items:center;padding:0 18px;gap:12px;background:linear-gradient(180deg,rgba(5,8,11,.82),rgba(5,8,11,.18),transparent);pointer-events:none}
.modulebar .title{font-weight:650;letter-spacing:.025em;font-size:14px}.modulebar .tag{font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 8px}.modulebar .gate{margin-left:auto;color:var(--good);font-size:9px;letter-spacing:.03em}
body.embedded .modulebar{display:none}
.panel{position:fixed;z-index:10;right:14px;top:64px;width:min(334px,calc(100vw - 28px));max-height:calc(100vh - 80px);overflow:auto;background:var(--panel);backdrop-filter:blur(22px) saturate(1.15);border:1px solid var(--line);border-radius:17px;box-shadow:0 20px 80px rgba(0,0,0,.45);transition:transform .24s ease,opacity .24s ease}
body.embedded .panel{top:14px;max-height:calc(100vh - 28px)}
.panel.collapsed{transform:translateX(calc(100% + 20px));opacity:.15;pointer-events:none}.panelHead{position:sticky;z-index:4;top:0;display:flex;align-items:center;padding:13px 14px 11px;background:var(--panel2);border-bottom:1px solid var(--line)}.panelHead strong{font-size:13px}.panelHead span{margin-left:auto;color:var(--muted);font-size:9px;font-variant-numeric:tabular-nums}
.section{padding:12px 14px;border-bottom:1px solid var(--line)}.section:last-child{border-bottom:0}.sectionTitle{margin-bottom:9px;font-size:10px;color:var(--muted);letter-spacing:.10em;text-transform:uppercase}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
select,button,input{font:inherit}select,button{min-height:33px;border:1px solid var(--line);border-radius:9px;background:rgba(255,255,255,.052);color:var(--text);outline:none}select{width:100%;padding:0 9px}button{padding:0 9px;cursor:pointer}button:hover{background:rgba(255,255,255,.09)}button.active,button.primary{border-color:var(--line2);background:rgba(207,231,244,.13)}
.row{display:grid;grid-template-columns:106px 1fr 47px;gap:8px;align-items:center;margin:7px 0}.row label{font-size:10px;color:#cbd5da}.row output{font-size:9px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}input[type=range]{width:100%;height:18px;accent-color:#d2e8f4}.toggle{display:flex;align-items:center;justify-content:space-between;font-size:10px;color:#cbd5da;margin:8px 0}.toggle input{accent-color:#d2e8f4}.viewrow{display:flex;gap:6px;flex-wrap:wrap}.viewrow button{min-height:29px;font-size:9px}
.handle{position:fixed;z-index:11;right:14px;top:64px;width:42px;height:42px;display:none;border-radius:12px;border:1px solid var(--line);background:rgba(9,13,17,.82);backdrop-filter:blur(14px);color:#fff}.panel.collapsed+.handle{display:block}body.embedded .handle{top:14px}
.hud{position:fixed;z-index:5;left:16px;bottom:15px;display:flex;gap:7px;flex-wrap:wrap;max-width:calc(100vw - 380px);pointer-events:none}.chip{border:1px solid rgba(255,255,255,.09);border-radius:10px;background:rgba(7,10,13,.58);backdrop-filter:blur(10px);padding:7px 9px;color:#b9c6cd;font-size:9px;font-variant-numeric:tabular-nums}.chip b{color:#f1f6f8;font-weight:600}
.hint{position:fixed;z-index:4;left:50%;bottom:22px;transform:translateX(-50%);color:rgba(235,243,248,.58);font-size:9px;pointer-events:none;transition:opacity .8s}.hint.hide{opacity:0}
.error{position:fixed;z-index:40;inset:0;display:none;place-items:center;padding:30px;text-align:center;background:#070a0d;color:#fff}.error.show{display:grid}.error pre{max-width:min(900px,90vw);white-space:pre-wrap;text-align:left;color:#d8a8a8;font-size:11px}
@media(max-width:760px){.modulebar{height:48px;padding:0 10px}.modulebar .gate{display:none}.panel,.panelHead{font-size:12px}.panel{right:7px;top:54px;width:min(330px,calc(100vw - 14px));max-height:calc(100vh - 61px)}body.embedded .panel{top:7px;max-height:calc(100vh - 14px)}.handle{right:7px;top:54px}.hud{left:7px;bottom:7px;max-width:calc(100vw - 14px)}.chip:nth-child(n+4){display:none}.hint{display:none}}
</style>
</head>
<body>
<canvas id="view" aria-label="Weather Mother Rain 3A候选工作台"></canvas>
<div class="modulebar"><div class="title">Weather Mother · Rain</div><div class="tag">V0.2 · 3A 光照候选</div><div class="gate">visualApproved=false · productionReady=false</div></div>
<div class="panel" id="panel">
  <div class="panelHead"><strong>Rain</strong><span id="renderSize">初始化</span></div>
  <div class="section">
    <div class="sectionTitle">场景与摄影</div>
    <div class="grid2"><select id="preset"><option value="drizzle">细雨</option><option value="steady" selected>持续中雨</option><option value="storm">强降雨</option><option value="stop">停雨观察</option></select><select id="light"><option value="break" selected>雨幕破云</option><option value="silver">银灰阴天</option><option value="cold">冷锋暴雨</option><option value="dusk">黄昏阵雨</option></select></div>
    <div class="viewrow" style="margin-top:9px"><button class="active" data-view="cinema">成片</button><button data-view="roof">瓦面</button><button data-view="brick">砖墙</button><button data-view="puddle">水洼</button><button data-view="object">水珠</button></div>
  </div>
  <div class="section">
    <div class="sectionTitle">空中降雨</div>
    <div class="row"><label>降雨通量</label><input id="rain" type="range" min="0" max="1" step="0.01" value="0.58"><output></output></div>
    <div class="row"><label>雨滴尺度</label><input id="dropSize" type="range" min="0.45" max="1.55" step="0.01" value="0.82"><output></output></div>
    <div class="row"><label>运动拖尾</label><input id="streak" type="range" min="0.35" max="1.55" step="0.01" value="0.88"><output></output></div>
    <div class="row"><label>风速</label><input id="windSpeed" type="range" min="0" max="28" step="0.1" value="8.5"><output></output></div>
    <div class="row"><label>风向</label><input id="windDir" type="range" min="0" max="360" step="1" value="228"><output></output></div>
    <div class="row"><label>阵风</label><input id="gust" type="range" min="0" max="1" step="0.01" value="0.30"><output></output></div>
    <div class="row"><label>撞击飞溅</label><input id="splash" type="range" min="0" max="1.5" step="0.01" value="0.78"><output></output></div>
  </div>
  <div class="section">
    <div class="sectionTitle">材质与积水</div>
    <div class="row"><label>表面湿润</label><input id="wetRate" type="range" min="0.03" max="0.8" step="0.01" value="0.34"><output></output></div>
    <div class="row"><label>排水速度</label><input id="drain" type="range" min="0" max="0.30" step="0.005" value="0.052"><output></output></div>
    <div class="row"><label>蒸发速度</label><input id="evap" type="range" min="0" max="0.12" step="0.002" value="0.010"><output></output></div>
    <div class="row"><label>水洼容量</label><input id="capacity" type="range" min="0.25" max="1.5" step="0.01" value="0.88"><output></output></div>
    <div class="row"><label>涟漪能量</label><input id="ripple" type="range" min="0" max="1.6" step="0.01" value="0.92"><output></output></div>
    <div class="toggle"><span>镜头微水珠</span><input id="lens" type="checkbox"></div>
    <div class="viewrow"><button id="resetSurface">重置水量</button><button id="seed">更换种子</button></div>
  </div>
  <div class="section">
    <div class="sectionTitle">渲染与检查</div>
    <div class="grid2"><select id="quality"><option value="0.62">性能</option><option value="0.82" selected>高清</option><option value="1">2K 成片</option><option value="1.22">4K 检查</option></select><select id="diagnostic"><option value="0">成片模式</option><option value="1">遮雨区域</option><option value="2">湿润场</option><option value="3">积水场</option><option value="4">材质编号</option></select></div>
    <div class="row"><label>曝光</label><input id="exposure" type="range" min="0.55" max="1.45" step="0.01" value="1.08"><output></output></div>
    <div class="row"><label>空气密度</label><input id="atmosphere" type="range" min="0" max="1" step="0.01" value="0.34"><output></output></div>
    <div class="toggle"><span>缓慢摄影机运动</span><input id="autoCamera" type="checkbox"></div>
    <div class="viewrow"><button class="primary" id="pause">暂停演化</button><button id="resetView">重置镜头</button><button id="fullscreen">全屏</button><button id="collapse">收起面板</button></div>
  </div>
  <div class="section"><div class="sectionTitle">当前资产</div><div style="font-size:9px;line-height:1.65;color:var(--muted)">Brick Mother 烧结砖响应候选<br>Tiles Mother 板瓦与筒瓦排水候选<br>雨滴、水膜、檐滴与地面积水共用同一时间状态</div></div>
</div>
<button class="handle" id="openPanel" aria-label="展开 Rain 控制面板">☰</button>
<div class="hud"><div class="chip">完成帧率 <b id="fps">0</b> FPS</div><div class="chip">湿润 <b id="wetHud">0%</b></div><div class="chip">积水 <b id="puddleHud">0%</b></div><div class="chip">风速 <b id="windHud">0 m/s</b></div><div class="chip">画质 <b id="qualityHud">2K</b></div></div>
<div class="hint" id="hint">拖动旋转 · 滚轮缩放 · 双击恢复成片镜头</div>
<div class="error" id="error"><div><h2>Rain 工作台无法启动</h2><pre id="errorText"></pre></div></div>
<script>
(()=>{'use strict';
const query=new URLSearchParams(location.search);if(query.get('embedded')==='1')document.body.classList.add('embedded');
const canvas=document.getElementById('view');const gl=canvas.getContext('webgl2',{alpha:false,antialias:false,depth:false,stencil:false,premultipliedAlpha:false,preserveDrawingBuffer:false,powerPreference:'high-performance'});
const fail=e=>{document.getElementById('error').classList.add('show');document.getElementById('errorText').textContent=String(e&&e.stack||e)};if(!gl){fail('当前浏览器没有提供 WebGL2');return}
const VS=`#version 300 es
in vec2 a;void main(){gl_Position=vec4(a,0.,1.);}`;
const FS=`#version 300 es
precision highp float;out vec4 O;
uniform vec2 uRes,uWind;uniform vec3 uCam,uTarget;uniform float uTime,uRain,uDrop,uStreak,uGust,uSplash,uWet,uPuddle,uCapacity,uRipple,uExposure,uAtmos,uSeed,uQuality,uLens;uniform int uLight,uDiag;
#define PI 3.14159265359
float sat(float x){return clamp(x,0.,1.);}vec2 sat(vec2 x){return clamp(x,vec2(0),vec2(1));}vec3 sat(vec3 x){return clamp(x,vec3(0),vec3(1));}
float hash11(float p){p=fract(p*.1031);p*=p+33.33;p*=p+p;return fract(p);}float hash21(vec2 p){vec3 p3=fract(vec3(p.xyx)*.1031);p3+=dot(p3,p3.yzx+33.33);return fract((p3.x+p3.y)*p3.z);}vec2 hash22(vec2 p){float n=hash21(p);return vec2(n,hash21(p+n+17.31));}
float n2(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(hash21(i),hash21(i+vec2(1,0)),f.x),mix(hash21(i+vec2(0,1)),hash21(i+1.),f.x),f.y);}float fbm(vec2 p){float a=.5,s=0.;for(int i=0;i<5;i++){s+=a*n2(p);p=mat2(1.61,-1.17,1.17,1.61)*p+7.13;a*=.5;}return s;}float fbm3(vec2 p){float s=.56*n2(p);p=mat2(1.61,-1.17,1.17,1.61)*p+7.13;s+=.28*n2(p);p=mat2(1.61,-1.17,1.17,1.61)*p+7.13;return s+.16*n2(p);}
float sdBox(vec3 p,vec3 b){vec3 q=abs(p)-b;return length(max(q,0.))+min(max(q.x,max(q.y,q.z)),0.);}float sdRoundBox(vec3 p,vec3 b,float r){return sdBox(p,b-r)-r;}float sdCyl(vec3 p,vec2 h){vec2 d=abs(vec2(length(p.xz),p.y))-h;return min(max(d.x,d.y),0.)+length(max(d,0.));}float sdSphere(vec3 p,float r){return length(p)-r;}mat2 rot(float a){float c=cos(a),s=sin(a);return mat2(c,-s,s,c);}
float groundH(vec2 xz){float basin=-.14*exp(-dot((xz-vec2(1.45,1.15))*vec2(.50,.68),(xz-vec2(1.45,1.15))*vec2(.50,.68)));float slope=.015*(xz.x+2.);return basin+slope+(fbm(xz*.55+5.1)-.5)*.026;}
float roofTop(vec2 xz){float z=xz.y;float slope=2.46-(z+1.85)*.36;float lane=(xz.x+3.25)/.44;float cover=pow(max(cos(lane*PI),0.),3.)*.105;float pan=-.020*cos(lane*2.*PI);float row=fract((z+2.0)/.43);float lap=.024*(1.-smoothstep(.02,.18,row));float hand=(fbm(xz*2.1+vec2(4.2,7.7))-.5)*.018;return slope+cover+pan+lap+hand;}
float roofBounds(vec2 xz){vec2 c=vec2(-1.42,-.12),b=vec2(1.86,1.93);vec2 q=abs(xz-c)-b;return max(q.x,q.y);}float roofDistance(vec3 p){float top=roofTop(p.xz),bound=roofBounds(p.xz);float slab=max(p.y-top,(top-.105)-p.y);return max(slab,bound)*.86;}
float roofShelter(vec3 p){float inside=1.-smoothstep(-.01,.12,roofBounds(p.xz));float top=roofTop(p.xz);float below=1.-smoothstep(top-.02,top+.08,p.y);return inside*below;}
float eaveZ(){return 1.81;}float eaveY(float x){return roofTop(vec2(x,eaveZ()));}
vec2 mapScene(vec3 p){float d=p.y-groundH(p.xz),m=1.;float r=roofDistance(p);if(r<d){d=r;m=2.;}
float wall=sdRoundBox(p-vec3(1.55,1.55,-3.02),vec3(2.45,1.55,.18),.055);if(wall<d){d=wall;m=3.;}
for(int i=0;i<3;i++){float x=-3.03+float(i)*1.56;float post=sdRoundBox(p-vec3(x,1.05,1.38),vec3(.11,1.05,.11),.035);if(post<d){d=post;m=4.;}}
vec3 jar=p-vec3(1.55,.60,.42);float body=sdCyl(jar,vec2(.48,.55));float shoulder=sdSphere(jar-vec3(0,.42,0),.50);float neck=sdCyl(jar-vec3(0,.76,0),vec2(.24,.24));float vessel=min(max(body,-(jar.y-.56)),min(shoulder,neck));if(vessel<d){d=vessel;m=5.;}
float stone=sdRoundBox(p-vec3(3.15,.38,1.15),vec3(.62,.38,.53),.16);if(stone<d){d=stone;m=6.;}
return vec2(d,m);}
vec3 normalAt(vec3 p){vec2 e=vec2(.0014,0);float d=mapScene(p).x;return normalize(vec3(mapScene(p+e.xyy).x-d,mapScene(p+e.yxy).x-d,mapScene(p+e.yyx).x-d));}
float softShadow(vec3 ro,vec3 rd,float tmax){float res=1.,t=.035;for(int i=0;i<18;i++){float h=mapScene(ro+rd*t).x;res=min(res,13.*h/t);t+=clamp(h,.018,.25);if(h<.001||t>tmax)break;}return sat(res);}float ao(vec3 p,vec3 n){float s=0.,w=1.;for(int i=1;i<4;i++){float h=.052*float(i);s+=(h-mapScene(p+n*h).x)*w;w*=.61;}return sat(1.-s*2.15);}
vec3 sunDir(){if(uLight==0)return normalize(vec3(.48,.42,-.76));if(uLight==1)return normalize(vec3(.30,.72,-.56));if(uLight==2)return normalize(vec3(.62,.25,-.34));return normalize(vec3(.52,.20,-.82));}
vec3 sunCol(){if(uLight==0)return vec3(1.26,.98,.72);if(uLight==1)return vec3(.77,.88,1.0);if(uLight==2)return vec3(.58,.72,.92);return vec3(1.45,.72,.38);}
vec3 sky(vec3 rd){float h=sat(rd.y*.5+.5),az=atan(rd.z,rd.x);vec3 zen,hor;if(uLight==0){zen=vec3(.12,.18,.235);hor=vec3(.43,.45,.42);}else if(uLight==1){zen=vec3(.13,.18,.225);hor=vec3(.36,.40,.41);}else if(uLight==2){zen=vec3(.045,.078,.125);hor=vec3(.22,.26,.31);}else{zen=vec3(.12,.12,.18);hor=vec3(.49,.33,.26);}vec3 col=mix(hor,zen,pow(h,.66));vec3 sd=sunDir();float sun=max(dot(rd,sd),0.);float cloud=fbm3(vec2(az*1.35,rd.y*2.2)+vec2(uTime*.003,-uTime*.0015)+uSeed*.0007);float cover=sat((cloud-.32)*1.48);col*=.70+.34*cloud;float gate=.25+.75*(1.-cover);col+=sunCol()*pow(sun,7.)*.11*gate;col+=sunCol()*pow(sun,84.)*2.4*gate;float silver=pow(sat(dot(rd,sd)),18.)*(.35+.65*(1.-cover));col+=sunCol()*silver*.22;col+=vec3(.10,.13,.15)*pow(1.-abs(rd.y),5.)*uAtmos;return col;}
float puddleMask(vec2 xz){float basin=exp(-dot((xz-vec2(1.45,1.15))*vec2(.50,.68),(xz-vec2(1.45,1.15))*vec2(.50,.68)));float broken=.65+.35*fbm(xz*1.45+vec2(3.1,uSeed*.01));return sat((basin*broken-(1.-uPuddle/max(uCapacity,.01))*.79)*7.);}float exposed(vec3 p){return 1.-roofShelter(p+vec3(0,.08,0));}
float rippleHeight(vec2 xz){vec2 g=xz*1.34,cell=floor(g),f=fract(g)-.5;float h=0.;for(int j=-1;j<=1;j++)for(int i=-1;i<=1;i++){vec2 id=cell+vec2(i,j),r=hash22(id+uSeed),c=vec2(i,j)+r-.5;float age=fract(uTime*(.75+uRain*1.25)+r.y*9.1);float radius=age*(.29+.22*r.x)*uRipple;float ring=sin((length(f-c)-radius)*96.)*exp(-abs(length(f-c)-radius)*34.)*exp(-age*3.7);h+=ring*step(.55,r.x);}return h*.0065*uRain;}
float brickMask(vec2 uv,out vec2 cell,out vec2 f){float row=floor(uv.y),off=mod(row,2.)*.5;cell=floor(vec2(uv.x+off,uv.y));f=fract(vec2(uv.x+off,uv.y));float mx=smoothstep(.045,.095,f.x)*smoothstep(.045,.095,1.-f.x);float my=smoothstep(.055,.12,f.y)*smoothstep(.055,.12,1.-f.y);return mx*my;}
vec3 pbr(vec3 base,float rough,float metal,vec3 n,vec3 v,vec3 p,float wet,float coat){vec3 l=sunDir(),h=normalize(l+v);float nl=max(dot(n,l),0.),nv=max(dot(n,v),.001),nh=max(dot(n,h),0.),vh=max(dot(v,h),0.);float sh=softShadow(p+n*.012,l,18.);float a=max(.025,rough*rough),a2=a*a,den=nh*nh*(a2-1.)+1.;float D=a2/(PI*den*den+.0001);float k=(a+1.)*(a+1.)/8.;float G=nl/(nl*(1.-k)+k)*nv/(nv*(1.-k)+k);vec3 F0=mix(vec3(.035),base,metal);vec3 F=F0+(1.-F0)*pow(1.-vh,5.);vec3 spec=D*G*F/max(4.*nl*nv,.001);vec3 amb=sky(n)*(.27+.55*ao(p,n));vec3 diff=base*(1.-metal)/PI;vec3 col=amb*base+sunCol()*(diff+spec)*nl*sh;vec3 refl=sky(reflect(-v,n));float fres=pow(1.-nv,5.);col+=refl*(F0+(1.-F0)*fres)*(.18+.28*(1.-rough));col+=refl*(.13+.42*fres)*coat;col+=sunCol()*pow(max(dot(reflect(-l,n),v),0.),mix(18.,340.,1.-rough))*coat*.22*sh;return col;}
vec3 shade(vec3 ro,vec3 rd,float t,float mat){vec3 p=ro+rd*t,n=normalAt(p),v=-rd;vec3 base=vec3(.2);float rough=.65,metal=0.,wet=0.,coat=0.;
