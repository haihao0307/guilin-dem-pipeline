<!doctype html><style>html,body{margin:0;background:#152c3c;height:100%;display:flex;align-items:center;justify-content:center}canvas{width:100%;height:100%;object-fit:contain}</style><meta charset="utf-8"><canvas id="c" width="640" height="360"></canvas><div id="bar"><label>显示质量 <select id="res"><option value="auto" selected>自动适配</option><option value="960">清晰 · 960 宽</option><option value="1280">精细 · 1280 宽</option><option value="1600">更精细 · 1600 宽</option></select></label><button id="pause">暂停</button><span id="perf"></span><pre id="error"></pre></div><style>#bar{position:fixed;bottom:8px;left:50%;transform:translateX(-50%);background:#fffffff2;color:#173246;border:1px solid #ccd5da;border-radius:10px;padding:8px 12px;font:13px system-ui;display:flex;align-items:center;gap:12px;white-space:nowrap}select,button{font:inherit}#error{color:#a00;white-space:pre-wrap}</style><script>const src="#version 300 es\nprecision highp float;\nout vec4 fragColor;\n// Weather Mother own implementation. Value noise, not a stored image.\n// uint overflow is modulo 2^32. Lattice period 65536 cells per axis.\n// Coordinate unit: noise lattice cell; use a local/rebased frame.\nprecision highp int;\nuint kaopuHash(uint x){x^=x>>16u;x*=0x7feb352du;x^=x>>15u;x*=0x846ca68bu;x^=x>>16u;return x;}\nfloat kaopuCorner(ivec2 p,uint seed){uvec2 q=uvec2(p)&uvec2(65535u);return float(kaopuHash(q.x^(q.y*0x9e3779b9u)^seed)>>8u)/16777216.;}\nvec2 kaopuFade(vec2 x){return x*x*x*(x*(x*6.-15.)+10.);}\nfloat kaopuNoise2(vec2 p,uint seed){\n ivec2 i=ivec2(floor(p));vec2 f=kaopuFade(fract(p));\n return mix(mix(kaopuCorner(i,seed),kaopuCorner(i+ivec2(1,0),seed),f.x),mix(kaopuCorner(i+ivec2(0,1),seed),kaopuCorner(i+ivec2(1,1),seed),f.x),f.y);\n}\nfloat kaopuFiltered2(vec2 p,uint seed,float footprint){return mix(kaopuNoise2(p,seed),.5,smoothstep(.25,.75,footprint));}\n\n// SPDX-License-Identifier: MIT\n// Copyright (c) 2026 @freeborn\n//[LICENSE] https://opensource.org/licenses/MIT\n\n\n\n//[CONVERT] GLSL\n//Seconds since playback started\n\n//[CONVERT] GOLF\n//[RES] half\nuniform vec2 u_resolution; //Pass resolution in pixels\n\n// SPDX-License-Identifier: MIT\n// Copyright (c) 2026 @freeborn\n//[LICENSE] https://opensource.org/licenses/MIT\n\n// Render-resolution preset; heavy volumetric shader, so 'full' is slow on big canvases.\nuniform float u_time;\n\n// Puffy cumulus field at sunset, HDR: FragCoord GLSL (from shaders/clouds_sunset_field_fly_hdr.glsl).\n// FIELD version: one continuous cloud deck instead of separate columns. Almost every cell\n// holds a heap, all heaps are about half as tall, and the camera flies low above them.\n// FLY version: smooth pseudo-random manoeuvres (weave, descents/climbs, coordinated banks).\n//\n// Full RGB light transport instead of the photo palette: grey scattering plus a separate\n// absorption coefficient per RGB channel (blue largest), so light that travels deeper into a\n// cloud loses blue first; low warm sun, dusk-blue sky light, orange-to-blue sky.\n//\n// Shape: one low cumulus heap per jittered 2D cell, wide at the base and narrowing upward, so\n// neighbours merge into a continuous deck with domes; big and medium cauliflower lobes from\n// hemispherical caps sqrt(1 - F1^2/R^2) around Worley feature points; fine lumps from\n// billowed gradient noise (|n| octaves: rounded bumps, creases at zero crossings) pushing\n// the surface in and out, faded out below ~2 px and drifting upward so the detail boils.\n// Volume: density fades in over SOFT units inside that surface: translucent edges, but thin\n// enough that the fine lumps stay crisp and shade each other.\n// Light: sun shadow march (first steps at full detail) with multiple-scattering octaves,\n// sky ambient from a short upward occlusion march, dual-lobe phase for the silver lining,\n// exponential distance haze toward the sky colour. Linear RGB light; the brightest channel\n// is tonemapped to a shoulder at HDR_PEAK x SDR white and the others scaled with it (hue-\n// preserving, so red highlights stay red), written as extended-range sRGB.\n\n// Standing on the shoulders of:\n//   Pierre Bouguer, Johann Heinrich Lambert, August Beer - exponential attenuation of light\n//     (every exp(-sigma * od) here)\n//   Lord Rayleigh - 1/lambda^4 scattering: the blue sky and the red low sun (SUN_COL)\n//   Gustav Mie - forward scattering by droplets, approximated by the Henyey-Greenstein\n//     phase function hg() (Louis Henyey & Jesse Greenstein)\n//   Luke Howard - who named the clouds in 1802\n//   Ken Perlin - gradient noise and the quintic fade (gnoise, bumps)\n//   Steven Worley - cellular noise (worley2, the cauliflower lobes)\n//   Inigo Quilez - the smooth minimum smin() and the octave rotation matrix ROT (his code,\n//     marked below), and the culture of raymarched shapes on Shadertoy\n//   John C. Hart - sphere tracing (the empty-space steps)\n//   Magnus Wrenninge and colleagues - multiple scattering as softer octaves (the MS terms)\n//   Andrew Schneider - real-time volumetric cloudscapes (Nubis)\n//   Jorge Jimenez - interleaved gradient noise (the step jitter)\n//   Dave Hoskins - \"Hash without Sine\" (hash33, MIT)\n//   Xor - who asked for puffy clouds, and built FragCoord\n\nprecision highp int;   // default mediump int can be 16-bit on mobile GPUs, which breaks the hash\n\n#define CELL 4.0\n#define TOP 10.5\n#define BASE -4.0\n#define SIGMA 12.0      // extinction at full density\n#define SOFT 0.15       // depth over which density fades in below the surface\n#define FOG 0.025\n#define EXPOSURE 1.0\n#define AMB 0.8         // sky ambient scale\n#define MS 0.25         // multiple-scattering scale\n#define SUNK 2.2        // direct + scattered sun gain\n#define HDR 1           // 1: extended-range sRGB output (values > 1 brighter than SDR white) for\n                        //    FragCoord's WebGPU HDR presentation; WebGL2 clamps to SDR\n#define HDR_PEAK 3.0    // MacBook M4 XDR: ~1400 nit peak over ~450-500 nit SDR white\n\n#define AIRMASS 20.0    // air path to a sun ~1 deg above the horizon, in zenith air masses\n// Sun colour after that path: Rayleigh-like optical depth per channel (~1/lambda^4).\nconst vec3 SUN_COL = 2.2 * exp(-vec3(0.04, 0.10, 0.23) * AIRMASS);   // ~ (1.0, 0.30, 0.02)\nconst vec3 SKY_AMB = vec3(0.25, 0.38, 0.85);   // blue sky light from above: lights the shadowed sides\nconst vec3 ABSORB = vec3(0.02, 0.12, 0.30);    // absorption per channel, as a fraction of SIGMA\n#define MAX_OCT 3.0     // Worley lobe octaves (big/medium); fine detail comes from BUMP noise\n#define COVER 0.85      // share of cells holding a heap: high, so heaps merge into a deck\n\n// Flight path: sums of sines with unrelated frequencies, so it is C-infinity (position,\n// velocity, acceleration and every orientation derived from them are smooth) and never visibly\n// repeats. Measured field surface: median 1.37, 90th percentile 2.98, 99th 3.61, highest seen\n// 4.24. Altitude 3.6 +- 0.8 flies low over the deck and punches through the tallest tops about\n// once a minute for up to ~2.5 s (the march simply starts inside the volume).\n#define SPEED 1.2       // forward speed along +z\n#define ALT 3.6\n#define FOCAL 0.8       // wide-angle lens: ~64 degrees vertical, ~96 horizontal at 16:9\n#define BANK_K 4.5      // bank (rad) per unit of lateral acceleration: up to ~24 degrees\nconst vec3 WEAVE_A = vec3(6.0, 3.0, 1.0);          // sideways weave: amplitudes...\nconst vec3 WEAVE_W = vec3(0.071, 0.113, 0.173);    // ...angular frequencies (rad/s)...\nconst vec3 WEAVE_P = vec3(0.0, 1.7, 4.1);          // ...and phases; heading up to ~38 degrees\nconst vec3 ALT_A = vec3(0.45, 0.25, 0.1);          // climbs and descents: ALT +- 0.8\nconst vec3 ALT_W = vec3(0.083, 0.137, 0.211);      // fast enough for visible dives\nconst vec3 ALT_P = vec3(2.3, 0.4, 3.3);\n#define BUMP 0.9        // fine billow lumps: surface push std ~0.12, 99th pct ~0.3 outward\n\n// Cap height / cap radius per lobe octave (before the 0.6x island fade): soft big lobes,\n// crisp medium ones, flat fine ones.\nconst float RELIEF[6] = float[6](1.0, 1.3, 1.0, 0.75, 0.6, 0.5);\n// Inigo Quilez, https://iquilezles.org\nconst mat3 ROT = mat3(0.00, 0.80, 0.60, -0.80, 0.36, -0.48, -0.60, -0.48, 0.64);\n\nconst vec3 SUN = vec3(-0.75, 0.02, 1.0);    // ~1 deg above the horizon, ~37 deg left of view\n\n// Float-only hash: no integer maths, so it survives mediump ints and FragCoord's GLSL->WGSL\n// translation (which turns the old unsigned hash into a constant). \"Hash without Sine\" by\n// Dave Hoskins, MIT License, https://www.shadertoy.com/view/4djSRW\nvec3 hash33(ivec3 c) {\n    vec3 p = fract(vec3(c) * vec3(0.1031, 0.1030, 0.0973));\n    p += dot(p, p.yxz + 33.33);\n    return fract((p.xxy + p.yxx) * p.zyx);\n}\n\n// Gradient (Perlin-style) noise, roughly [-1, 1], quintic fade.\nfloat grad(ivec3 c, vec3 r) {\n    return dot(hash33(c) * 2.0 - 1.0, r);\n}\n\nfloat gnoise(vec3 p){p*=1.25;float z=floor(p.z),f=fract(p.z);f=f*f*f*(f*(f*6.-15.)+10.);vec2 shift=vec2(z*37.17,z*71.31);float a=kaopuNoise2(p.xy+shift,1297u),b=kaopuNoise2(p.xy+shift+vec2(37.17,71.31),1297u);return (mix(a,b,f)-.5)*1.15;}\n\n// Inigo Quilez, https://iquilezles.org\nfloat smin(float a, float b, float k) {\n    float h = max(k - abs(a - b), 0.0) / k;\n    return min(a, b) - h * h * k * 0.25;\n}\n\nfloat smax(float a, float b, float k) {\n    return -smin(-a, -b, k);\n}\n\n// Squared distance to the nearest jittered feature point (Worley F1^2), exact whenever it is\n// below 0.36, which is all the lobe caps use: feature points sit in [0.15, 0.85] of their\n// cell, so only this cell and the nearer neighbour on each axis can hold one within 0.6.\nfloat worley2(vec3 p) {\n    ivec3 i = ivec3(floor(p));\n    vec3 f = fract(p);\n    ivec3 n = ivec3(step(vec3(0.5), f)) * 2 - 1;   // vector edge: WGSL step() needs matching types\n    float m = 9.0;\n    for (int z = 0; z < 2; z++) {   // explicit braces: FragCoord's WGSL translation misplaces\n        for (int y = 0; y < 2; y++) {   // the closing braces of brace-less nested loops\n            for (int x = 0; x < 2; x++) {\n                ivec3 o = ivec3(x, y, z) * n;\n                vec3 r = vec3(o) + 0.15 + 0.7 * hash33(i + o) - f;\n                m = min(m, dot(r, r));\n            }\n        }\n    }\n    return m;\n}\n\n// Coarse shape: one tower per jittered 2D cell, wide at the base and narrowing upward.\nfloat heaps(vec3 p) {\n    ivec2 cell = ivec2(floor(p.xz / CELL));\n    float d = 1e3;   // no tower in the 3x3 block (the march has its own empty-space bound)\n    for (int j = -1; j <= 1; j++) {\n        for (int i = -1; i <= 1; i++) {\n            ivec3 c = ivec3(cell.x + i, 0, cell.y + j);\n            vec3 h = hash33(c);\n            // A continuous field: nearly every cell holds a heap, all tops in 0..2 (about half\n            // the column version). With caps, lobes and bumps (< ~3 more) everything stays\n            // below ~5, under the camera at y = 6, so the field is the same along the whole route.\n            if (h.z >= COVER) continue;\n            vec3 g = hash33(c + ivec3(0, 1, 0));\n            float r = CELL * (0.24 + 0.16 * g.x);\n            float top = 2.0 * g.y;\n            vec2 ctr = (vec2(c.xz) + 0.3 + 0.4 * h.xy) * CELL;\n            vec3 q = p - vec3(ctr.x, 0.0, ctr.y);\n            // Wobbling heap from BASE up to 'top': radius 0.65r at the rounded top, widening to\n            // 1.85r three units below it (half the column version), so neighbours close into a deck.\n            float y = clamp(q.y, BASE, top);\n            vec2 wob = vec2(sin(y * 0.7 + 6.28 * g.z), cos(y * 0.6 + 6.28 * h.x)) * 0.35 * r;\n            float rad = r * (0.65 + 1.2 * smoothstep(top, top - 3.0, y));\n            float tower = (length(q - vec3(wob.x, y, wob.y)) - rad) * 0.7;\n            d = smin(d, tower, 0.2 * CELL);\n    \n        }\n    }\n    return d;\n}\n\n// Add cauliflower lobes (at most 1.45 outward) to the tower distance d. lod = number of\n// octaves; the last one fades in fractionally so detail never pops. Each cap shrinks with\n// how far p already is outside the surface, so caps only grow out of it, never as islands.\nfloat lobes(vec3 p, float d, float lod) {\n    vec3 q = p;\n    float fr = 0.5;\n    float fine = 0.35 + 0.65 * smoothstep(-5.0, 3.0, p.y);   // smoother, broader lower bodies\n    for (int o = 0; o < 6; o++) {\n        float wgt = clamp(lod - float(o), 0.0, 1.0);\n        if (wgt <= 0.0) break;\n        float x = max(1.0 - worley2(q * fr) / 0.36, 0.0);\n        float h = 0.6 / fr * RELIEF[o] * (o == 0 ? 1.0 : fine) * wgt;\n        d -= h * x / sqrt(x + 0.04) * clamp(1.0 - d / (1.5 * h), 0.0, 1.0);\n        q = ROT * q + 3.1;\n        fr *= 2.1;\n    }\n    return d;\n}\n\n// Towers plus lobes.\nfloat cloud(vec3 p, float lod) {\n    float d = heaps(p);\n    if (d > 2.0) return d - 1.9;   // early out (a ternary becomes select(), evaluating both)\n    return lobes(p, d, lod);\n}\n\n// Soft volume density from the lobed surface distance.\nfloat puff(float d) {\n    return smoothstep(0.0, SOFT, -d);\n}\n\n// Density for lighting lookups with a ramp of width w. Coarse lookups use wide ramps so\n// the light varies smoothly instead of printing sharp lobe rims into the shadows.\nfloat puffL(float d, float w) {\n    return smoothstep(-0.3 * w, w, -d);\n}\n\n// Billowed gradient noise for 'oct' octaves (last one fading in), first period ~0.33 units.\n// Returns an outward surface push: measured n has mean 0.28, std 0.13, 99th pct 0.64.\nfloat bumps(vec3 p, float oct) {\n    p = p * 3.0 + vec3(0.0, -0.1 * u_time, 0.0);\n    float n = 0.0, a = 1.0;\n    for (int o = 0; o < 4; o++) {\n        float w = clamp(oct - float(o), 0.0, 1.0);\n        if (w <= 0.0) break;\n        n += a * w * abs(gnoise(p));\n        p = ROT * p * 2.03;\n        a *= 0.5;\n    }\n    return BUMP * (n - 0.28);\n}\n\n// Optical depth toward the sun. The first short step uses more detail so lobes shadow each\n// other; longer steps only need the bigger shapes.\nfloat sunDepth(vec3 p, vec3 L, float lod) {\n    float od = 0.0, s = 0.08;\n    for (int k = 0; k < 6; k++) {\n        p += L * s;\n        float l = 1.0;\n        if (k < 3) l = 2.0;\n        if (k == 0) l = min(lod, 4.0);\n        float d = cloud(p, l);\n        if (k < 2 && d < 0.45) d -= bumps(p, 2.0);   // fine lumps shade each other\n        od += puffL(d, SOFT * (1.0 + 2.0 * float(k))) * s;\n        s *= 1.6;\n    }\n    return od;\n}\n\n// Optical depth straight up: how much sky the point can see. Coarse shape and a soft ramp,\n// so overhangs give a broad gradient instead of a sharp projected silhouette.\nfloat skyDepth(vec3 p) {\n    return puffL(cloud(p + vec3(0.0, 0.5, 0.0), 2.0), 0.8) * 0.6\n         + puffL(cloud(p + vec3(0.0, 1.5, 0.0), 1.0), 0.8) * 1.0;\n}\n\n// Henyey-Greenstein phase, scaled by 4*pi so isotropic = 1.\nfloat hg(float c, float g) {\n    return (1.0 - g * g) / pow(1.0 + g * g - 2.0 * g * c, 1.5);\n}\n\n// sRGB encoding extended above 1 (values > 1 are brighter than SDR white on HDR canvases).\nvec3 linearToSrgb(vec3 c) {\n    return mix(12.92 * c, 1.055 * pow(c, vec3(1.0 / 2.4)) - 0.055, step(vec3(0.0031308), c));\n}\n\n// Sunset sky in linear light: blue (deep at the zenith, paler at the horizon), a warm band\n// hugging the horizon on the sun's side only, purple-grey haze below the horizon, and the red\n// glow around the sun (the HDR part).\nvec3 skyCol(vec3 rd, vec3 L) {\n    float c = max(dot(rd, L), 0.0);\n    vec3 col = mix(vec3(0.38, 0.50, 0.80), vec3(0.08, 0.16, 0.45), smoothstep(0.0, 0.5, rd.y));\n    float side = max(dot(normalize(rd.xz + 1e-6), normalize(L.xz)), 0.0);\n    col = mix(col, vec3(1.0, 0.40, 0.15), side * side * exp(-8.0 * max(rd.y, 0.0)));\n    col = mix(vec3(0.26, 0.26, 0.42), col, smoothstep(-0.2, 0.0, rd.y));\n    return col + SUN_COL * (0.5 * pow(c, 4.0) + 2.5 * pow(c, 48.0));\n}\n\nvoid main() {\n    vec2 fragCoord = gl_FragCoord.xy;\n    vec2 uv = (fragCoord - 0.5 * u_resolution.xy) / u_resolution.y;\n    vec3 L = normalize(SUN);\n    // Flight path and its analytic derivatives (see WEAVE_* / ALT_*).\n    vec3 aw = WEAVE_W * u_time + WEAVE_P;\n    vec3 ah = ALT_W * u_time + ALT_P;\n    float dx = dot(WEAVE_A * WEAVE_W, cos(aw));                // sideways velocity\n    float ddx = -dot(WEAVE_A * WEAVE_W * WEAVE_W, sin(aw));    // sideways acceleration\n    float dy = dot(ALT_A * ALT_W, cos(ah));                    // climb rate\n    vec3 ro = vec3(dot(WEAVE_A, sin(aw)), ALT + dot(ALT_A, sin(ah)), SPEED * u_time);\n    // Orientation: heading follows the velocity, the nose pitches twice the climb angle (a\n    // cinematic exaggeration) on top of a slight downward look, and the bank follows the\n    // turn's lateral acceleration (a\n    // coordinated turn: right turn = right wing down = horizon rises on the right).\n    float hv = sqrt(SPEED * SPEED + dx * dx);\n    float yaw = atan(dx, SPEED);\n    float pitch = -0.12 + 2.0 * atan(dy, hv);\n    float bank = BANK_K * ddx * SPEED / hv;\n    vec3 fw = vec3(sin(yaw) * cos(pitch), sin(pitch), cos(yaw) * cos(pitch));\n    vec3 rt = vec3(cos(yaw), 0.0, -sin(yaw));\n    vec3 up = cross(fw, rt);\n    vec3 rtb = cos(bank) * rt - sin(bank) * up;\n    vec3 upb = cos(bank) * up + sin(bank) * rt;\n    vec3 rd = normalize(uv.x * rtb + uv.y * upb + FOCAL * fw);\n\n    float ph = mix(hg(dot(rd, L), -0.2), hg(dot(rd, L), 0.6), 0.3);\n    vec3 haze = skyCol(rd, L);\n    vec3 sigT = SIGMA * (1.0 + ABSORB);   // extinction = grey scattering + per-channel absorption\n    vec3 albedo = 1.0 / (1.0 + ABSORB);   // share of extinction that scatters\n    float tEnd = min(120.0, rd.y > 0.0 ? (TOP - ro.y) / rd.y : (BASE - ro.y) / rd.y);\n    float t = 0.0;\n    vec3 T = vec3(1.0), S = vec3(0.0);\n    if (ro.y > TOP) t = (TOP - ro.y) / rd.y;\n    float jit = fract(52.9829189 * fract(dot(fragCoord, vec2(0.06711056, 0.00583715))));\n    float px = 1.0 / (u_resolution.y * FOCAL);   // pixel footprint per unit of distance\n    for (int i = 0; i < 500 && t < tEnd && T.r > 0.02; i++) {   // red has the least extinction\n        float dt = 0.03 + 0.003 * t;   // under SOFT out to the haze, so the ramp doesn't band\n        vec3 p = ro + rd * (t + jit * dt);\n        float hd = heaps(p);\n        if (hd > 2.0) {\n            // No lobe from the 3x3 block can be within 0.1. A tower plus lobes reaches at\n            // most 2.32 + 1.52 outside its own cell, so anything farther is >= edge + 0.1 away.\n            vec2 f = mod(p.xz, CELL);\n            float edge = min(min(f.x, CELL - f.x), min(f.y, CELL - f.y));\n            t += max(min(hd - 1.9, edge + CELL - 3.9), dt);\n            continue;\n        }\n        // Octaves 3+ add at most 0.14 outward, so two octaves bound the distance cheaply\n        // while crossing the lobe shell.\n        float dc = lobes(p, hd, 2.0) - 0.25;\n        if (dc > 0.0) {\n            t += max(dc * 0.5, dt);\n            continue;\n        }\n        // Octave count from footprint: octave o has lobe radius 1.2/2.1^o; keep those >= 2 px.\n        float lod = clamp(log2(0.6 / (px * max(t, 0.1))) / 1.07 + 1.0, 2.0, MAX_OCT);\n        float d = lobes(p, hd, lod);\n        if (d > 0.45) {   // fine bumps push out by ~0.3 at the 99th percentile\n            t += max((d - 0.45) * 0.5, dt);\n            continue;\n        }\n        // Fine bump octaves down to ~2 px (first period 0.33 units).\n        float foct = clamp(log2(0.33 / (2.0 * px * max(t, 0.1))) + 1.0, 1.0, 4.0);\n        d -= bumps(p, foct);\n        float dens = puff(d);\n        if (dens <= 0.0) {\n            t += dt;\n            continue;\n        }\n        float od = sunDepth(p, L, lod);\n        // Direct sun with forward-scattering phase, plus two softer multiple-scattering\n        // octaves; per-channel extinction reddens the light the deeper it has travelled.\n        vec3 sun = exp(-sigT * od) * ph\n                 + MS * (0.5 * exp(-0.25 * sigT * od) + 0.25 * exp(-0.06 * sigT * od)) * mix(ph, 1.0, 0.6);\n        float hy = smoothstep(-4.0, 8.0, p.y);\n        vec3 amb = AMB * SKY_AMB * (0.1 + 0.25 * hy) * exp(-1.5 * skyDepth(p));\n        // Exponential distance haze toward the sky colour, starting past the near row.\n        vec3 lum = mix(SUNK * SUN_COL * sun + amb, haze, 1.0 - exp(-FOG * max(t - 8.0, 0.0)));\n        vec3 tr = exp(-sigT * dens * dt);\n        S += T * albedo * (1.0 - tr) * lum;\n        T *= tr;\n        t += dt;\n    }\n    vec3 l = S + T * haze;\n    // Hue-preserving tonemap: shoulder on the brightest channel, others scaled alongside.\n#if HDR\n    float peak = HDR_PEAK;\n#else\n    float peak = 1.0;\n#endif\n    float m = max(max(l.r, l.g), max(l.b, 1e-6));\n    vec3 Y = l * (peak * (1.0 - exp(-EXPOSURE * m / peak)) / m);\n    // +-0.5/255 dither so smooth gradients don't step on 8-bit canvases.\n    fragColor = vec4(linearToSrgb(Y) + (jit - 0.5) / 255.0, 1.0);\n}";const defs={};const c=document.getElementById('c'),gl=c.getContext('webgl2',{preserveDrawingBuffer:true,antialias:false});let qa=window.qa={ready:false,errors:[],frames:0};try{function sh(t,s){let x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);if(!gl.getShaderParameter(x,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(x));return x}let v=sh(gl.VERTEX_SHADER,'#version 300 es\nvoid main(){vec2 p=vec2((gl_VertexID<<1)&2,gl_VertexID&2);gl_Position=vec4(p*2.-1.,0.,1.);}'),f=sh(gl.FRAGMENT_SHADER,src),p=gl.createProgram();gl.attachShader(p,v);gl.attachShader(p,f);gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(p));gl.useProgram(p);let autoScale=1,autoWindow=0,slow=0,fast=0;function resize(){const choice=document.getElementById('res').value;let w=choice==='auto'?Math.round(Math.max(640,Math.min(1280,innerWidth*(devicePixelRatio||1))*autoScale)/16)*16:Number(choice);c.width=w;c.height=Math.round(w*9/16);gl.viewport(0,0,c.width,c.height);gl.uniform2f(gl.getU
