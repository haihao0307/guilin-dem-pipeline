<!doctype html><style>html,body{margin:0;background:#152c3c;height:100%;display:flex;align-items:center;justify-content:center}canvas{width:100%;height:100%;object-fit:contain}</style><meta charset="utf-8"><canvas id="c" width="640" height="360"></canvas><div id="bar"><label>显示质量 <select id="res"><option value="auto" selected>自动适配</option><option value="960">清晰 · 960 宽</option><option value="1280">精细 · 1280 宽</option><option value="1600">更精细 · 1600 宽</option></select></label><button id="pause">暂停</button><details id="settings"><summary>云参数</summary><div id="params"></div></details><span id="perf"></span><pre id="error"></pre></div><style>#bar{position:fixed;bottom:8px;left:50%;transform:translateX(-50%);background:#fffffff2;color:#173246;border:1px solid #ccd5da;border-radius:10px;padding:8px 12px;font:13px system-ui;display:flex;align-items:center;gap:12px;white-space:nowrap}select,button{font:inherit}#settings{position:relative}#params{position:absolute;bottom:28px;right:0;width:280px;max-height:38vh;overflow:auto;background:white;color:#173246;padding:10px;border:1px solid #ccd5da;border-radius:8px}#params label{display:grid;grid-template-columns:112px 1fr 40px;gap:4px;margin:4px 0}#error{color:#a00;white-space:pre-wrap}</style><script>const src="#version 300 es\nprecision highp float;\nout vec4 fragColor;\n// Weather Mother own implementation. Value noise, not a stored image.\n// uint overflow is modulo 2^32. Lattice period 65536 cells per axis.\n// Coordinate unit: noise lattice cell; use a local/rebased frame.\nprecision highp int;\nuint kaopuHash(uint x){x^=x>>16u;x*=0x7feb352du;x^=x>>15u;x*=0x846ca68bu;x^=x>>16u;return x;}\nfloat kaopuCorner(ivec2 p,uint seed){uvec2 q=uvec2(p)&uvec2(65535u);return float(kaopuHash(q.x^(q.y*0x9e3779b9u)^seed)>>8u)/16777216.;}\nvec2 kaopuFade(vec2 x){return x*x*x*(x*(x*6.-15.)+10.);}\nfloat kaopuNoise2(vec2 p,uint seed){\n ivec2 i=ivec2(floor(p));vec2 f=kaopuFade(fract(p));\n return mix(mix(kaopuCorner(i,seed),kaopuCorner(i+ivec2(1,0),seed),f.x),mix(kaopuCorner(i+ivec2(0,1),seed),kaopuCorner(i+ivec2(1,1),seed),f.x),f.y);\n}\nfloat kaopuFiltered2(vec2 p,uint seed,float footprint){return mix(kaopuNoise2(p,seed),.5,smoothstep(.25,.75,footprint));}\n\nuniform float u_time; //Seconds since playback started\nuniform float u_scroll; //Linear scroll from mouse wheel; use exp(u_scroll) for zoom\nuniform vec3 u_camera_pos; //3D camera position (WASD/arrows to move)\nuniform vec3 u_camera_dir; //3D camera forward direction (drag mouse to look)\n\n// Credit: @freeborn https://fragcoord.xyz/u/freeborn\n// Original shader: https://fragcoord.xyz/s/ciytgaml\n\n//[CONVERT] GLSL\n//Seconds since playback started\n\n//[CONVERT] GOLF\n//[RES] half\nuniform vec2 u_resolution; //Pass resolution in pixels\n\n\n// Credit: @freeborn https://fragcoord.xyz/u/freeborn\n// Original shader: https://fragcoord.xyz/s/ciytgaml\n\n// Puffy cumulus field: Shadertoy-style GLSL prototype (target: XorDev's reference photo #2).\n//\n// Implemented base camera control and imporved the shapes.\n\n//\n// RGB cloud lighting with a separate world-space sky gradient.\n// Shape: broken banks, broad cumulus clusters, lower scud and high cirrus.\n// Weather-scale gaps and multiscale billows preserve open views to the ground.\n// Volume: soft-edged filled density, bounded empty-space skipping, pixel-footprint LOD.\n// Light: six sun samples, one sky-occlusion sample, short-range lighting reuse,\n// approximate multiple scattering, dual-lobe phase, distance haze and highlight compression.\n\nprecision highp int;   // default mediump int can be 16-bit on mobile GPUs, which breaks the hash\n\n#define TOP 12.0\n#define BASE -10.0\n#define MAIN_BASE -4.8\n#define GROUND_HEIGHT -24.0\n#define CIRRUS_HEIGHT 32.0\n// Volume / lighting\nuniform float u_sigma; //3.5, [0.5, 10]\nuniform float u_soft; //0.28, [0.05, 1]\nuniform float u_fog; //0.008, [0, 0.05]\n// Large-scale layout\nuniform float u_sea_relief; //1.0, [0, 1]\nuniform float u_body_cell; //19.0, [18, 40]\nuniform float u_body_coverage; //0.84, [0, 1]\nuniform float u_column_fraction; //0.18, [0, 1]\nuniform float u_clear_threshold; //0.36, [0, 0.7]\nuniform float u_sea_threshold; //0.53, [0.3, 0.9]\n// Cauliflower billows: fractal union of jittered spheres grown outward from the envelope.\nuniform float u_puff_scale; //3.2, [1, 8]\nuniform float u_puff_grow; //0.2, [0, 1]\nuniform float u_puff_blend; //0.3, [0.05, 1]\nuniform float u_low_erode; //1.6, [0, 4]\n// Regional variation: horizontal size of a region and how strongly parameters deviate in it.\nuniform float u_var_size; //80.0, [20, 300]\nuniform float u_var_amount; //0.7, [0, 1]\n\n#define PUFF_OCTAVES 5\n#define MAX_STEPS 768\n#define MAX_SKIP 3.0\n#define CAMERA_PITCH 0.10\n#define CAMERA_HEIGHT 10.0\nconst mat2 ROT2 = mat2(0.8, -0.6, 0.6, 0.8);\nconst mat3 ROT = mat3(0.00, 0.80, 0.60, -0.80, 0.36, -0.48, -0.60, -0.48, 0.64);\n\nconst vec3 SUN = vec3(-0.85, 0.65, -0.1);\nconst vec3 SKY_ZENITH = vec3(0.16, 0.40, 0.69);\nconst vec3 SKY_HORIZON = vec3(0.64, 0.80, 0.91);\nconst vec3 SKY_BELOW = vec3(0.27, 0.48, 0.69);\n\n// PCG3D (Jarzynski & Olano 2020): one round, three outputs.\nvec3 hash33(ivec3 c) {\n    uvec3 v = uvec3(c) * 1664525u + 1013904223u;\n    v.x += v.y * v.z; v.y += v.z * v.x; v.z += v.x * v.y;\n    v ^= v >> 16u;\n    v.x += v.y * v.z; v.y += v.z * v.x; v.z += v.x * v.y;\n    return vec3(v >> 8u) / 16777215.0;\n}\n\nfloat hash1(uint n) {\n    n = (n ^ (n >> 16u)) * 2246822519u;\n    n = (n ^ (n >> 13u)) * 3266489917u;\n    return float((n ^ (n >> 16u)) >> 8u) / 16777215.0;\n}\n\nfloat grad(ivec3 c, vec3 r) {\n    return dot(hash33(c) * 2.0 - 1.0, r);\n}\n\nfloat gnoise(vec3 p){p*=1.25;float z=floor(p.z),f=fract(p.z);f=f*f*f*(f*(f*6.-15.)+10.);vec2 shift=vec2(z*37.17,z*71.31);float a=kaopuNoise2(p.xy+shift,1297u),b=kaopuNoise2(p.xy+shift+vec2(37.17,71.31),1297u);return (mix(a,b,f)-.5)*1.15;}\n\nfloat noise2(vec2 p) {\n    uvec2 i = uvec2(ivec2(floor(p)));\n    vec2 f = fract(p);\n    f = f * f * (3.0 - 2.0 * f);\n    uint n = i.x + i.y * 157u;\n    return mix(mix(hash1(n), hash1(n + 1u), f.x),\n               mix(hash1(n + 157u), hash1(n + 158u), f.x), f.y);\n}\n\nvec3 cloudSpace(vec3 p) {\n    return p + vec3(0.06, 0.0, 0.02) * u_time;\n}\n\nfloat weatherCoverage(vec2 p) {\n    vec2 warp = vec2(noise2(p * 0.018 + 11.7), noise2(ROT2 * p * 0.021 - 7.4));\n    vec2 q = p + 12.0 * (warp - 0.5);\n    return 0.68 * noise2(q * 0.024 + 3.2)\n         + 0.32 * noise2(ROT2 * q * 0.061 - 9.6);\n}\n\nfloat seaHeight(vec2 p) {\n    float broad = noise2(p * 0.047 + 18.3);\n    float swell = noise2(ROT2 * p * 0.12 - 5.6);\n    float height = -2.8 + 2.3 * broad + 1.5 * swell;\n    return mix(-1.0, height, clamp(u_sea_relief, 0.0, 1.0));\n}\n\n// Low-frequency regional offsets, each in [-u_var_amount, u_var_amount].\n// Each layer is an independent pattern:\n//   SHAPE:  x: puffiness (grow / blend), y: convective strength, z: erosion.\n//   VOLUME: x: sigma, y: soft edge, z: puff scale.\n#define REGION_SHAPE 71\n#define REGION_VOLUME 72\nvec3 regionNoise(vec2 p, int layer) {\n    p = ROT2 * p / max(u_var_size, 1.0) + vec2(17.3, -4.1);\n    ivec2 i = ivec2(floor(p));\n    vec2 f = fract(p);\n    f = f * f * (3.0 - 2.0 * f);\n    vec3 n = mix(mix(hash33(ivec3(i.x, layer, i.y)), hash33(ivec3(i.x + 1, layer, i.y)), f.x),\n                 mix(hash33(ivec3(i.x, layer, i.y + 1)), hash33(ivec3(i.x + 1, layer, i.y + 1)), f.x), f.y);\n    return (smoothstep(0.2, 0.8, n) * 2.0 - 1.0) * clamp(u_var_amount, 0.0, 1.0);\n}\n\nfloat surfaceLOD(float footprint) {\n    return 4.0 - smoothstep(0.012, 0.028, footprint)\n               - smoothstep(0.025, 0.055, footprint)\n               - smoothstep(0.06, 0.15, footprint)\n               - smoothstep(0.18, 0.45, footprint);\n}\n\nfloat softUnion(float a, float b, float radius) {\n    float h = max(radius - abs(a - b), 0.0) / radius;\n    return min(a, b) - h * h * radius * 0.25;\n}\n\nfloat softMax(float a, float b, float radius) {\n    return -softUnion(-a, -b, radius);\n}\n\n// Jittered sphere at a lattice corner; reach (radius + jitter) < 1 keeps the field continuous.\nfloat puffSphere(ivec3 i, vec3 f, ivec3 c) {\n    vec3 h = hash33(i + c);\n    vec3 center = vec3(c) + 0.35 * (h.yzx - 0.5);\n    return length(f - center) - (0.3 + 0.32 * h.x);\n}\n\nfloat puffField(vec3 p) {\n    ivec3 i = ivec3(floor(p));\n    vec3 f = fract(p);\n    return min(min(min(puffSphere(i, f, ivec3(0, 0, 0)), puffSphere(i, f, ivec3(1, 0, 0))),\n                   min(puffSphere(i, f, ivec3(0, 1, 0)), puffSphere(i, f, ivec3(1, 1, 0)))),\n               min(min(puffSphere(i, f, ivec3(0, 0, 1)), puffSphere(i, f, ivec3(1, 0, 1))),\n                   min(puffSphere(i, f, ivec3(0, 1, 1)), puffSphere(i, f, ivec3(1, 1, 1)))));\n}\n\n// Per-octave outward growth; lvl = octave level below the region's largest billow.\n// tilt > 0 favours large billows, tilt < 0 fine cauliflower.\nfloat octaveGrow(float grow, float tilt, float lvl) {\n    return min(grow * exp2(0.6 * tilt * (1.5 - lvl)), 0.6);\n}\n\n// Shrinks the envelope, then grows nested sphere billows back out (never beyond the envelope).\n// Growth parameters vary by horizontal region so the field is not uniform.\n// Octaves sit on a fixed lattice (2x u_puff_scale downwards); the regional puff scale only\n// selects which octaves are active, so billows never stretch where the region scale changes.\nfloat cloudDetail(vec3 q, float y, float d, float lod, float cutoff, vec3 r, float scaleVar) {\n    float hf = mix(0.45, 1.0, smoothstep(-6.0, -4.5, y));\n    float grow = u_puff_grow * hf * exp2(0.9 * r.x);\n    float blend = max(u_puff_blend, 0.01) * hf * (1.0 - 0.4 * r.x);\n    float erode = u_low_erode * hf * (1.0 + 0.8 * r.z);\n    float top = u_puff_scale * exp2(0.8 * scaleVar);\n    // Inset = upper bound of total growth: each octave adds at most fade * s * (grow + blend / 4).\n    float inset = 0.0, s = 2.0 * u_puff_scale;\n    for (int o = 0; o <= PUFF_OCTAVES; o++) {\n        float lvl = log2(top / s);\n        float fade = clamp(lvl + 1.0, 0.0, 1.0) * clamp(lod - float(o) + 2.0, 0.0, 1.0);\n        inset += fade * s * (octaveGrow(grow, r.y, lvl) + 0.25 * blend);\n        s *= 0.5;\n    }\n    d += inset;\n    if (d + erode < -cutoff) return d;  // deep interior: density saturates regardless of detail\n    float low = gnoise(q * 0.14 + 7.3);\n    d += erode * smoothstep(-0.2 - 0.3 * r.z, 0.4, low);\n    vec3 x = ROT * q / (2.0 * u_puff_scale) + vec3(low * 0.35 - 6.1);\n    s = 2.0 * u_puff_scale;\n    for (int o = 0; o <= PUFF_OCTAVES; o++) {\n        float lodFade = clamp(lod - float(o) + 2.0, 0.0, 1.0);\n        if (lodFade <= 0.0) break;\n        float lvl = log2(top / s);\n        float fade = lodFade * clamp(lvl + 1.0, 0.0, 1.0);\n        if (fade > 0.0) {\n            float g = octaveGrow(grow, r.y, lvl) * s, b = blend * s;\n            float n = softMax(s * puffField(x), d - g, b);\n            d = mix(d, softUnion(n, d, b), fade);\n        }\n        x = o == 0 ? q / u_puff_scale + vec3(low * 0.35) : ROT * x * 2.03 + vec3(3.7, -1.9, 5.3);\n        s *= 0.5;\n    }\n    return d;\n}\n\nfloat cloudEllipsoid(vec3 p, vec3 r) {\n    return (length(p / r) - 1.0) * min(r.x, min(r.y, r.z));\n}\n\nfloat cloudBodies(vec3 p) {\n    float cellSize = max(u_body_cell, 18.0);\n    vec2 grid = p.xz / cellSize;\n    ivec2 cell = ivec2(floor(grid));\n    ivec2 side = ivec2(step(0.5, fract(grid))) * 2 - 1;\n    float d = 1e3;\n    float maxCoverage = u_body_coverage + 0.3 * clamp(u_var_amount, 0.0, 1.0);\n    // Four-cell search: omitted centres are >= 0.75 * cell (>= 13.5) away; support < 12.0 * 1.1.\n    for (int k = 0; k < 4; k++) {\n        ivec2 o = ivec2(k & 1, k >> 1) * side;\n        ivec3 id = ivec3(cell.x + o.x, 37, cell.y + o.y);\n        vec3 h = hash33(id);\n        if (h.z > maxCoverage) continue;\n        vec2 center = (vec2(id.xz) + 0.25 + 0.5 * h.xy) * cellSize;\n        // Region sampled at the body centre so each body stays self-consistent.\n        vec3 r = regionNoise(center, REGION_SHAPE);\n        if (h.z > u_body_coverage - 0.3 * r.z) continue;\n        float scale = 1.0 + r.y * (r.y > 0.0 ? 0.1 : 0.3);\n        vec3 q = p - vec3(center.x, 0.0, center.y);\n        float radial = length(q.xz) - 10.8 * scale;\n        if (radial > 2.0) {\n            d = min(d, radial);\n            continue;\n        }\n        q /= scale;\n        vec3 g = hash33(id + ivec3(0, 13, 0));\n        float angle = 6.2831853 * g.x;\n        q.xz = mat2(cos(angle), -sin(angle), sin(angle), cos(angle)) * q.xz;\n        float columns = u_column_fraction + 0.2 * r.y;\n        float tall = 1.0 - smoothstep(columns - 0.08, columns + 0.08, g.z);\n        float rise = 3.8 + 3.0 * g.y + 1.6 * tall;\n        float width = 4.8 + 2.2 * h.x + 0.4 * tall;\n        vec2 lean = (g.xy - 0.5) * 3.0;\n        float rootTop = rise - 2.2;\n        float body = cloudEllipsoid(q - vec3(0.0, (rootTop - 3.8) * 0.5, 0.0),\n                                   vec3(width * 1.08, (rootTop + 3.8) * 0.5, width));\n        vec3 crown = vec3(lean.x, rise - 2.0, lean.y);\n        body = softUnion(body, cloudEllipsoid(q - crown,\n                         vec3(width * 0.52, 2.3 + 0.6 * tall, width * 0.48)), 0.85);\n        vec3 crest = crown + vec3(-width * 0.4, -0.7 - 0.5 * h.y, width * 0.2);\n        body = softUnion(body, cloudEllipsoid(q - crest,\n                         vec3(width * 0.42, 2.1 + 0.5 * h.y, width * 0.4)), 0.8);\n        crest = crown + vec3(width * 0.34, -0.9 * g.y, -width * 0.25);\n        body = softUnion(body, cloudEllipsoid(q - crest,\n                         vec3(width * 0.4, 2.1 + 0.5 * g.x, width * 0.38)), 0.8);\n        vec3 shoulder = vec3(-2.5 - h.y, rise * 0.28, 1.2);\n        body = softUnion(body, cloudEllipsoid(q - shoulder,\n                         vec3(2.7 + 0.9 * g.x, 2.0 + 0.9 * h.y, 2.8 + 0.5 * h.x)), 0.95);\n        body = softUnion(body, cloudEllipsoid(q - vec3(2.5, rise * 0.48, -1.4),\n                         vec3(2.5 + 0.7 * g.y, 2.2, 2.6)), 0.9);\n        d = min(d, body * scale);\n    }\n    return d;\n}\n\n// x: conservative travel distance; y: unscaled density envelope.\nvec2 cloudBounds(vec3 p) {\n    float vertical = max(p.y - TOP, BASE - p.y);\n    if (vertical > 0.0) return vec2(vertical);\n    vec3 q = cloudSpace(p);\n    float weather = weatherCoverage(q.xz);\n    float clearing = (u_clear_threshold - weather) * 24.0;\n    if (clearing > 1.2) return vec2(clearing * 0.22, clearing);\n    float sea = max(p.y - seaHeight(q.xz), (u_sea_threshold - weather) * 20.0);\n    float body = cloudBodies(q);\n    float mainCloud = max(softUnion(sea, body, 1.1) - 1.05, MAIN_BASE - p.y);\n    vec2 lowerPos = ROT2 * q.xz + vec2(23.0, -41.0);\n    float patches = 0.7 * noise2(lowerPos * 0.095) + 0.3 * noise2(lowerPos * 0.23 + 5.7);\n    float lowerHeight = -7.4 + 0.7 * noise2(lowerPos * 0.06);\n    float lower = max(abs(p.y - lowerHeight) - 1.45, (0.57 - patches) * 8.0);\n    lower = max(lower, (u_clear_threshold + 0.035 - weather) * 24.0);\n    float d = max(min(mainCloud, lower), max(clearing, vertical));\n    return vec2(d * 0.22, d);\n}\n\n// x: density in [0, 1]; y: regional extinction coefficient (u_sigma with variation).\n// Edge width = max(regional u_soft + widthAdd, widthFloor).\nvec2 cloudDensity(vec3 p, vec2 bounds, float lod, float widthFloor, float widthAdd) {\n    if (bounds.y >= 0.0) return vec2(0.0);\n    vec3 q = cloudSpace(p);\n    vec3 shape = regionNoise(q.xz, REGION_SHAPE);\n    vec3 vol = regionNoise(q.xz, REGION_VOLUME);\n    float width = max(u_soft * exp2(vol.y) + widthAdd, widthFloor);\n    float d = cloudDetail(q, p.y, bounds.y, lod, max(width, 1.1), shape, vol.z);\n    float density = smoothstep(0.0, width, -d);\n    density *= mix(0.32, 1.0, smoothstep(0.0, 1.1, -d));\n    density *= mix(0.5, 1.0, smoothstep(-6.0, -4.5, p.y));\n    return vec2(density, u_sigma * exp2(0.7 * vol.x));\n}\n\n// Optical depth toward the sun, already scaled by the regional extinction coefficient.\nfloat sunDepth(vec3 p, vec3 L, float lod) {\n    float od = 0.0, travel = 0.0, stepSize = 0.08;\n    for (int k = 0; k < 6; k++) {\n        vec3 q = p + L * (travel + 0.5 * stepSize);\n        float detail = min(lod, surfaceLOD(stepSize * 0.5));\n        vec2 c = cloudDensity(q, cloudBounds(q), detail, 0.0, 0.06 * float(k));\n        od += c.x * c.y * stepSize;\n        travel += stepSize;\n        stepSize *= 2.4;\n    }\n    return od;\n}\n\nfloat skyDepth(vec3 p) {\n    vec3 q = p + vec3(0.0, 1.2, 0.0);\n    return cloudDensity(q, cloudBounds(q), 0.0, 0.8, 0.0).x;\n}\n\n// Henyey-Greenstein phase, scaled by 4*pi so isotropic = 1.\nfloat hg(float c, float g) {\n    return (1.0 - g * g) / pow(1.0 + g * g - 2.0 * g * c, 1.5);\n}\n\n// Display-space gradient converted to linear for volume compositing.\nvec3 sky(vec3 rd) {\n    float upper = 1.0 - exp(-4.5 * max(rd.y, 0.0));\n    float lower = 1.0 - exp(-6.0 * max(-rd.y, 0.0));\n    vec3 color = mix(SKY_HORIZON, SKY_ZENITH, upper);\n    color = mix(color, SKY_BELOW, lower);\n    return pow(color, vec3(2.2));\n}\n\nvec3 groundColor(vec3 p, vec3 L) {\n    vec2 q = p.xz * 0.055;\n    float hills = noise2(q) + 0.45 * noise2(ROT2 * q * 2.3 + 4.7);\n    float dx = noise2(q + vec2(0.08, 0.0)) - noise2(q - vec2(0.08, 0.0));\n    float dz = noise2(q + vec2(0.0, 0.08)) - noise2(q - vec2(0.0, 0.08));\n    vec3 normal = normalize(vec3(-4.5 * dx, 1.0, -4.5 * dz));\n    float fields = noise2(ROT2 * q * 9.0 + 17.5);\n    vec3 land = mix(vec3(0.12, 0.24, 0.12), vec3(0.47, 0.43, 0.25),\n                    smoothstep(0.28, 0.85, 0.5 * hills + 0.5 * fields));\n    float valley = abs(q.x - 1.6 * sin(q.y * 0.6) - 0.65 * sin(q.y * 1.7 + 2.1) + 1.5);\n    float river = 1.0 - smoothstep(0.018, 0.045, valley);\n    land = mix(land, vec3(0.12, 0.23, 0.26), river);\n    vec2 shadowPos = p.xz + L.xz * ((-1.0 - p.y) / L.y);\n    float shadow = smoothstep(u_clear_threshold, u_sea
