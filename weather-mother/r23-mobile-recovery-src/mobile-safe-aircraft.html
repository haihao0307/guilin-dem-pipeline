<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Weather Mother · R23 Mobile Silver Flight</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#5e7295;color:#fff;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;background:#5e7295}.hud{position:fixed;z-index:5;top:max(24px,env(safe-area-inset-top));left:24px;text-shadow:0 2px 10px #183047aa;pointer-events:none}.brand{font-size:10px;letter-spacing:.25em;opacity:.88}.hud h1{margin:8px 0 16px;font-size:26px;font-weight:650;letter-spacing:.03em}.metrics{font-size:18px;display:flex;gap:18px;font-variant-numeric:tabular-nums}.pad{position:fixed;z-index:6;left:22px;bottom:max(142px,calc(112px + env(safe-area-inset-bottom)));display:grid;grid-template-columns:repeat(3,54px);gap:8px}.pad button,.bar button{border:1px solid #ffffff25;background:#173f5bd9;color:#fff;box-shadow:0 6px 24px #10293b30;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}.pad button{width:54px;height:54px;border-radius:50%;font-size:22px}.hint{position:fixed;z-index:5;left:0;right:0;bottom:max(106px,calc(77px + env(safe-area-inset-bottom)));text-align:center;font-size:11px;text-shadow:0 2px 9px #10263f;padding:0 14px;pointer-events:none}.bar{position:fixed;z-index:6;left:20px;right:20px;bottom:max(18px,env(safe-area-inset-bottom));display:flex;gap:6px;justify-content:center;padding:6px;border-radius:30px;background:#173f5bd9;border:1px solid #ffffff25;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}.bar button{border:0;border-radius:22px;padding:10px 14px;font:inherit;white-space:nowrap}.bar button[aria-pressed=true]{background:#d9ebf7;color:#17384d}.status{position:fixed;z-index:8;left:50%;top:52%;transform:translate(-50%,-50%);padding:10px 14px;border-radius:10px;background:#173f5bdd;font-size:12px}.status[hidden]{display:none}.badge{position:fixed;z-index:5;right:18px;top:max(24px,env(safe-area-inset-top));padding:6px 9px;border-radius:12px;background:#173f5b99;font-size:9px;letter-spacing:.12em;opacity:.82;pointer-events:none}@media(max-width:430px){.hud{left:20px}.hud h1{font-size:23px}.metrics{font-size:17px;gap:14px}.pad{left:20px;grid-template-columns:repeat(3,48px);bottom:max(151px,calc(120px + env(safe-area-inset-bottom)))}.pad button{width:48px;height:48px}.hint{bottom:max(114px,calc(84px + env(safe-area-inset-bottom)));font-size:10px}.bar{left:14px;right:14px}.bar button{font-size:12px;padding:9px 11px}.badge{right:14px}}
</style>
</head>
<body>
<canvas id="c" aria-label="银边积云移动端安全渲染"></canvas>
<div class="hud"><div class="brand">WEATHER MOTHER / R23 MOBILE</div><h1 id="viewname">银边积云 · 云中飞行</h1><div class="metrics"><span id="altitude">4400 m</span><span id="airspeed">270 km/h</span><span id="heading">0°</span></div></div>
<div class="badge">CLOUD-FIRST</div>
<div class="pad" aria-label="飞行控制"><button data-key="q">↙</button><button data-key="e">＋</button><button data-key="e">↗</button><button data-key="a">←</button><button data-key="s">－</button><button data-key="d">→</button></div>
<div class="hint">W/S 加减速 · A/D 转弯 · Q/E 下降/爬升 · 拖动环顾 360° · 空格暂停</div>
<div class="bar"><button id="fly" aria-pressed="true">飞行中</button><button id="look">追尾视角</button><button id="reset">返回起点</button><button id="watch">返回观云</button></div>
<div class="status" id="status">正在建立移动端银边云体…</div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('c'),status=document.getElementById('status');
const $=s=>document.querySelector(s),clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const isTouch=matchMedia('(pointer:coarse)').matches||navigator.maxTouchPoints>0;
let gl,program,buf,loc={},last=performance.now(),raf=0,lost=false,scene='silver',pointer=null;
const keys=new Set();
const S={position:[0,4.4,4.8],yaw:0,pitch:-.02,lookYaw:0,lookPitch:0,roll:0,speed:75,flying:true,time:0};
const qa={version:'WM-R23-MOBILE-CLOUD-FIRST-20260910',ready:false,frames:0,errors:[],renderSize:[0,0],variance:0,scene:'silver',context:'webgl1'};
const VS=`attribute vec2 a;varying vec2 v;void main(){v=a*.5+.5;gl_Position=vec4(a,0.,1.);}`;
const FS=`precision highp float;
varying vec2 v;uniform vec2 uRes;uniform float uTime,uScene;uniform vec3 uCam,uFwd,uRight,uUp;
#define PI 3.14159265359
float sat(float x){return clamp(x,0.,1.);}float yo(vec3 p){return .5+.5*cos(cos(p.z)*cos(p.x)+cos(p.y)*cos(p.y)+cos(p.y)*cos(p.x));}
float bands(vec3 p){float a=.5,s=0.,n=0.;for(int i=0;i<5;i++){s+=a*yo(p);n+=a;p=mat3(.86,.18,.47,-.28,.95,.12,-.42,-.23,.88)*p*2.0+vec3(.37,.19,.53);a*=.5;}return s/n;}
float ell(vec3 p,vec3 c,vec3 r){return length((p-c)/r)-1.;}
float cloudSdf(vec3 p){float d=9.;if(uScene<.5){d=min(d,ell(p,vec3(-4.2,3.65,-7.0),vec3(4.3,1.55,3.7)));d=min(d,ell(p,vec3(.3,4.0,-8.7),vec3(4.1,1.85,4.0)));d=min(d,ell(p,vec3(4.4,3.7,-11.2),vec3(3.5,1.65,3.8)));d=min(d,ell(p,vec3(-1.7,5.0,-12.0),vec3(2.7,2.1,3.0)));d=min(d,ell(p,vec3(2.0,5.4,-13.7),vec3(2.35,2.0,2.7)));d=min(d,ell(p,vec3(-5.8,4.75,-13.5),vec3(2.8,1.8,3.0)));}else{d=min(d,ell(p,vec3(-4.5,3.15,-7.0),vec3(5.1,.78,4.3)));d=min(d,ell(p,vec3(2.2,3.55,-9.8),vec3(5.6,.88,5.0)));d=min(d,ell(p,vec3(-2.5,4.05,-13.8),vec3(6.0,1.0,4.2)));d=min(d,ell(p,vec3(5.2,4.4,-17.0),vec3(5.8,.82,4.0)));}return d;}
float den(vec3 p){float d=cloudSdf(p);if(d>.42||p.y<1.35||p.y>7.5)return 0.;float low=bands(p*.72+vec3(0.,0.,uTime*.004)),mid=bands(p*1.85+vec3(11.3,7.1,3.7)),hi=yo(p*7.3+vec3(2.1,5.7,13.));float erode=(low-.52)*.24+(mid-.5)*.10+(hi-.5)*.025;float shape=1.-smoothstep(-.28,.18,d+erode);float base=smoothstep(1.45,1.85,p.y),top=1.-smoothstep(6.25,7.15,p.y);return sat(shape*base*top*(uScene<.5?1.08:.78));}
vec3 sky(vec3 rd,vec3 sun){float h=sat(rd.y*.55+.5);vec3 c=mix(vec3(.34,.45,.64),vec3(.43,.62,.83),h);float haze=pow(1.-abs(rd.y),5.);c+=vec3(.16,.14,.11)*haze*.28;float s=max(dot(rd,sun),0.);c+=vec3(1.0,.88,.64)*pow(s,700.)*5.;c+=vec3(1.0,.74,.46)*pow(s,28.)*.16;return c;}
float phaseHG(float g,float c){float g2=g*g;return (1.-g2)/(4.*PI*pow(max(1.+g2-2.*g*c,.001),1.5));}
void main(){vec2 p=(gl_FragCoord.xy-.5*uRes)/uRes.y;vec3 rd=normalize(uFwd+p.x*uRight*1.22+p.y*uUp*1.22),ro=uCam,sun=normalize(vec3(-.34,.34,-.88));vec3 col=sky(rd,sun);float T=1.,t=.15,od=0.,sunView=max(dot(rd,sun),0.),phase=.62+10.*phaseHG(.72,sunView);for(int i=0;i<64;i++){if(T<.018||t>28.)break;vec3 x=ro+rd*t;float d=den(x);if(d>.006){float s1=den(x+sun*.42),s2=den(x+sun*.95),light=exp(-(s1*.42+s2*.65)*1.45),edge=sat(1.-d)*sqrt(max(d,0.)),silver=pow(sunView,9.)*edge*(1.2+2.6*light);vec3 shade=mix(vec3(.31,.39,.52),vec3(.94,.97,1.0),light*.78);shade+=vec3(1.0,.93,.79)*silver*2.1;float a=1.-exp(-d*.34*2.7);col=mix(col,shade*phase,a*T);T*=1.-a;od+=d*.34;}t+=d>.02?.34:.48;}col+=vec3(1.0,.93,.80)*pow(sunView,22.)*.09*T;col=col/(col+vec3(.72));col=pow(col,vec3(.86));gl_FragColor=vec4(clamp(col,0.,1.),1.);}`;
function sh(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s;}
function init(){gl=canvas.getContext('webgl',{alpha:false,antialias:false,depth:false,powerPreference:'high-performance',preserveDrawingBuffer:true})||canvas.getContext('experimental-webgl');if(!gl)throw Error('WebGL unavailable');const vs=sh(gl.VERTEX_SHADER,VS),fs=sh(gl.FRAGMENT_SHADER,FS);program=gl.createProgram();gl.attachShader(program,vs);gl.attachShader(program,fs);gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));gl.deleteShader(vs);gl.deleteShader(fs);buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);const a=gl.getAttribLocation(program,'a');gl.enableVertexAttribArray(a);gl.vertexAttribPointer(a,2,gl.FLOAT,false,0,0);['uRes','uTime','uScene','uCam','uFwd','uRight','uUp'].forEach(n=>loc[n]=gl.getUniformLocation(program,n));resize();status.hidden=true;qa.ready=true;}
function resize(){if(!gl)return;const mobile=innerWidth<=700||isTouch,scale=mobile?.62:.8,d=Math.min(devicePixelRatio||1,mobile?1:1.25),maxPixels=mobile?180000:560000;let w=Math.max(1,Math.round(innerWidth*d*scale)),h=Math.max(1,Math.round(innerHeight*d*scale));const k=Math.min(1,Math.sqrt(maxPixels/(w*h)));w=Math.max(1,Math.round(w*k));h=Math.max(1,Math.round(h*k));canvas.width=w;canvas.height=h;qa.renderSize=[w,h];gl.viewport(0,0,w,h);}
function basis(){const yaw=S.yaw+S.lookYaw,pitch=S.pitch+S.lookPitch,cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch);return{f:[sy*cp,sp,-cy*cp],r:[cy,0,sy],u:[-sy*sp,cp,-cy*sp]};}
function draw(){if(!gl||lost)return;const b=basis();gl.useProgram(program);gl.uniform2f(loc.uRes,canvas.width,canvas.height);gl.uniform1f(loc.uTime,S.time);gl.uniform1f(loc.uScene,scene==='silver'?0:1);gl.uniform3fv(loc.uCam,S.position);gl.uniform3fv(loc.uFwd,b.f);gl.uniform3fv(loc.uRight,b.r);gl.uniform3fv(loc.uUp,b.u);gl.drawArrays(gl.TRIANGLES,0,3);qa.frames++;if(qa.frames===3)sampleVariance();}
function sampleVariance(){try{const w=canvas.width,h=canvas.height,pts=[[.5,.5],[.25,.55],[.72,.42],[.5,.78]],vals=[];for(const [x,y]of pts){const px=new Uint8Array(4);gl.readPixels(Math.floor(w*x),Math.floor(h*y),1,1,gl.RGBA,gl.UNSIGNED_BYTE,px);vals.push(px[0]+px[1]+px[2]);}const m=vals.reduce((a,b)=>a+b,0)/vals.length;qa.variance=vals.reduce((a,b)=>a+(b-m)*(b-m),0)/vals.length;}catch(e){qa.errors.push(String(e));}}
function update(dt){if(window.cloudModuleHidden)return;if(S.flying){S.speed=clamp(S.speed+((keys.has('w')?1:0)-(keys.has('s')?1:0))*18*dt,25,120);const turn=(keys.has('d')?1:0)-(keys.has('a')?1:0),climb=(keys.has('e')?1:0)-(keys.has('q')?1:0);S.yaw+=turn*.42*dt;S.pitch=clamp(S.pitch+climb*.22*dt,-.6,.6);S.roll+=(turn*.5-S.roll)*(1-Math.exp(-dt*4));const b=basis(),kmps=S.speed/3600;for(let i=0;i<3;i++)S.position[i]+=b.f[i]*kmps*dt;S.position[1]=clamp(S.position[1],.15,14);}S.time+=dt;updateHud();}
function tick(now){raf=requestAnimationFrame(tick);const dt=clamp((now-last)/1000,0,.05);last=now;update(dt);draw();}
function updateHud(){$('#altitude').textContent=Math.round(S.position[1]*1000)+' m';$('#airspeed').textContent=Math.round(S.speed*3.6)+' km/h';$('#heading').textContent=((S.yaw*180/Math.PI%360+360)%360).toFixed(0)+'°';$('#viewname').textContent=(scene==='silver'?'银边积云':'层叠云海')+' · 云中飞行';$('#fly').textContent=S.flying?'飞行中':'已暂停';$('#fly').setAttribute('aria-pressed',String(S.flying));}
function reset(){Object.assign(S,{position:[0,4.4,4.8],yaw:0,pitch:-.02,lookYaw:0,lookPitch:0,roll:0,speed:75,flying:true,time:0});keys.clear();updateHud();}
function setScene(x){scene=x==='sea'?'sea':'silver';qa.scene=scene;updateHud();}function setFlying(x){S.flying=!!x;keys.clear();updateHud();}function getState(){return{...JSON.parse(JSON.stringify(S)),scene,cameraPositionMeters:S.position.map(x=>x*1000),mobileSafe:true};}
function setPose(p,yaw=0,pitch=0){if(Array.isArray(p)&&p.length===3)S.position=p.map(x=>x/1000);S.yaw=Number(yaw)||0;S.pitch=clamp(Number(pitch)||0,-.8,.8);updateHud();}function setLook(y,p){S.lookYaw=Number(y)||0;S.lookPitch=clamp(Number(p)||0,-1.2,1.2);}
for(const b of document.querySelectorAll('[data-key]')){const k=b.dataset.key,down=e=>{e.preventDefault();keys.add(k);S.flying=true;},up=e=>{e.preventDefault();keys.delete(k);};b.addEventListener('pointerdown',down);['pointerup','pointercancel','pointerleave'].forEach(n=>b.addEventListener(n,up));}
window.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['w','s','a','d','q','e'].includes(k)){keys.add(k);S.flying=true;e.preventDefault();}if(e.code==='Space'){S.flying=!S.flying;e.preventDefault();}if(e.key==='Home'){reset();e.preventDefault();}});window.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
canvas.addEventListener('pointerdown',e=>{pointer={x:e.clientX,y:e.clientY,id:e.pointerId};canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!pointer||e.pointerId!==pointer.id)return;const dx=e.clientX-pointer.x,dy=e.clientY-pointer.y;pointer.x=e.clientX;pointer.y=e.clientY;S.lookYaw-=dx*.0045;S.lookPitch=clamp(S.lookPitch-dy*.004,-1.15,1.15)});['pointerup','pointercancel'].forEach(n=>canvas.addEventListener(n,e=>{if(pointer&&e.pointerId===pointer.id)pointer=null}));
$('#fly').onclick=()=>setFlying(!S.flying);$('#look').onclick=()=>{S.lookYaw=0;S.lookPitch=0};$('#reset').onclick=reset;$('#watch').onclick=()=>parent.AircraftClouds?.watch?.();
window.addEventListener('resize',resize);canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();lost=true;qa.ready=false;qa.errors.push('contextlost');status.hidden=false;status.textContent='图形连接中断，正在恢复…'});canvas.addEventListener('webglcontextrestored',()=>{lost=false;qa.errors=[];try{init()}catch(e){qa.errors.push(String(e));status.textContent=String(e)}});
window.AircraftWorld={qa,getState,setScene,reset,setPose,setLook,setFlying,gl:()=>gl,capture:()=>canvas.toDataURL()};window.WeatherMobileR23={qa,getState,setScene};
try{init();updateHud();raf=requestAnimationFrame(tick)}catch(e){qa.errors.push(String(e));status.hidden=false;status.textContent='移动端云体启动失败：'+e.message}
})();
</script>
</body></html>
