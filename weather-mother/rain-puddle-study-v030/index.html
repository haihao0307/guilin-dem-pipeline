<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071018"><title>Weather Mother · Rain</title><style>html,body{margin:0;width:100%;height:100%;display:grid;place-items:center;background:#071018;color:#dce7ec;font:13px system-ui}small{color:#91a0a9}</style></head><body><div>正在启动村落雨景<br><small>Rain V0.3</small></div><script>(async()=>{try{const s=await fetch('payload.txt',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(r.status);return r.text()}),b=atob(s.trim()),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);const h=await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).text();document.open();document.write(h);document.close()}catch(e){document.body.innerHTML='<div>Rain 启动失败<br><small>'+String(e)+'</small></div>'}})();</script></body></html>
