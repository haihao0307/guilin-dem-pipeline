<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#202c2e"><title>Weather Mother · Liquid / 雨落村院</title><style>html,body{margin:0;width:100%;height:100%;display:grid;place-items:center;background:#202c2e;color:#e9f1ed;font:13px system-ui}small{color:#b6c2bd}</style></head><body><div>正在进入 Weather Mother · Liquid<br><small>Rain Village V1.0</small></div><script>(async()=>{try{const fs=['payload-00.txt','payload-01.txt','payload-02.txt','payload-03.txt','payload-04.txt','payload-05.txt'];const ps=await Promise.all(fs.map(f=>fetch(f,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(f+' '+r.status);return r.text()})));const b=atob(ps.join(''));const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);const html=await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).text();document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div>Liquid 启动失败<br><small>'+String(e)+'</small></div>'}})();</script></body></html>
