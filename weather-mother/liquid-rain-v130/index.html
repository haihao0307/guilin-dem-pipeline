<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#20302f"><link rel="icon" href="data:,"><title>Weather Mother · Rain</title><style>:root{color-scheme:dark}html,body{margin:0;width:100%;height:100%;display:grid;place-items:center;background:#20302f;color:#edf5f0;font:13px system-ui}.box{max-width:520px;padding:28px;text-align:center}.spin{width:26px;height:26px;margin:0 auto 18px;border:2px solid #ffffff30;border-top-color:#edf5f0;border-radius:50%;animation:s .8s linear infinite}small{display:block;margin-top:9px;color:#b6c6bf;line-height:1.7}@keyframes s{to{transform:rotate(1turn)}}</style></head><body><div class="box" id="status"><div class="spin"></div>正在进入 Weather Mother · Rain<small>Liquid Rain 1.3 · Liquid Glass Surface</small></div><script>(async()=>{try{if(typeof DecompressionStream!=='function')throw Error('当前浏览器缺少 gzip 解压能力');const m=await fetch('./MANIFEST.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('MANIFEST '+r.status);return r.json()});const ps=[];for(const c of m.chunks){const t=await fetch('./'+c.file+'?v=130',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(c.file+' '+r.status);return r.text()});if(t.length!==c.bytes)throw Error(c.file+' length');ps.push(t)}const b=atob(ps.join('')),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);const html=await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).text();document.open();document.write(html);document.close()}catch(e){document.querySelector('#status').innerHTML='Rain 启动失败<small>'+String(e)+'</small>'}})();</script></body></html>
