<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#20302f"><link rel="icon" href="data:,"><title>Weather Mother · Rain</title><style>:root{color-scheme:dark}html,body{margin:0;width:100%;height:100%;display:grid;place-items:center;background:#20302f;color:#edf5f0;font:13px system-ui}.box{max-width:520px;padding:28px;text-align:center}small{display:block;margin-top:9px;color:#b6c6bf;line-height:1.7}</style></head><body><div class="box" id="status">正在进入 Weather Mother · Rain<small>Liquid Rain 1.3 · Liquid Glass Surface</small></div><script>(async()=>{const td=new TextDecoder,te=new TextEncoder,hex=b=>[...new Uint8Array(b)].map(v=>v.toString(16).padStart(2,'0')).join(''),ungzip=async u=>new Uint8Array(await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer()),decode=s=>{const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u};try{if(typeof DecompressionStream!=='function')throw Error('当前浏览器缺少 gzip 解压能力');const m=await fetch('./MANIFEST.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('MANIFEST '+r.status);return r.json()});const bm=await fetch(m.baseRuntime+'MANIFEST.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('BASE '+r.status);return r.json()});const bt=[];for(const c of bm.chunks)bt.push(await fetch(m.baseRuntime+c.file+'?v=120',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(c.file+' '+r.status);return r.text()}));const baseBytes=await ungzip(decode(bt.join('')));if(baseBytes.length!==m.baseSourceBytes||hex(await crypto.subtle.digest('SHA-256',baseBytes))!==m.baseSourceSHA256)throw Error('base identity');const pt=[];for(const c of m.patchChunks){const t=await fetch('./'+c.file+'?v=130',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(c.file+' '+r.status);return r.text()});if(t.length!==c.bytes)throw Error(c.file+' length');pt.push(t)}const patch=JSON.parse(td.decode(await ungzip(decode(pt.join(''))))),lines=td.decode(baseBytes).match(/[^\n]*\n|[^\n]+$/g)||[],out=[];for(const op of patch.ops)op[0]==='c'?out.push(lines.slice(op[1],op[2]).join('')):out.push(op[1]);const html=out.join(''),bytes=te.encode(html);if(bytes.length!==m.sourceBytes||hex(await crypto.subtle.digest('SHA-256',bytes))!==m.sourceSHA256)throw Error('source identity');document.open();document.write(html);document.close()}catch(e){document.querySelector('#status').innerHTML='Rain 启动失败<small>'+String(e)+'</small>'}})();</script></body></html>
