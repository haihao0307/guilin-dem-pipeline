<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#05080c"><title>Weather Mother · Rain Puddle Study</title><style>html,body{margin:0;width:100%;height:100%;display:grid;place-items:center;background:#05080c;color:#dce7ec;font:13px system-ui}small{color:#91a0a9}</style></head><body><div>正在启动 Rain Puddle Study<br><small>Weather Mother V0.1</small></div><script>(async()=>{try{const files=["payload-00.txt", "payload-01.txt"],parts=await Promise.all(files.map(f=>fetch(f,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(f+' '+r.status);return r.text()}))),b=atob(parts.join('')),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);const html=await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).text();document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div>Rain Puddle Study 启动失败<br><small>'+String(e)+'</small></div>'}})();</script></body></html>
