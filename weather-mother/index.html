<!doctype html><html lang="zh-CN" data-production-line="Weather Mother" data-version="0.5.1"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#122333"><link rel="icon" href="data:,"><title>Weather Mother · V0.5.1</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#739bbb;color:#e9f1f5;font:13px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}canvas{width:100%;height:100%;display:block;touch-action:none}button,input,select{font:inherit}button,select{color:inherit;background:#ffffff09;border:1px solid #ffffff24;border-radius:8px;padding:6px 9px;cursor:pointer}button:hover{background:#ffffff22}select option{background:#142c3a}.panel{position:fixed;left:18px;top:18px;z-index:3;width:270px;max-height:calc(100% - 100px);overflow:auto;background:#112532e5;border:1px solid #ffffff22;border-radius:16px;padding:16px;backdrop-filter:blur(16px);box-shadow:0 14px 40px #091e3033}header{display:flex;align-items:center;justify-content:space-between}h1{margin:0;font-size:15px;letter-spacing:1.4px}.ver{font-size:10px;letter-spacing:1px;opacity:.55}.lede{margin:9px 0 13px;color:#abc4d2;font-size:12px}.times{display:flex;gap:4px;margin:10px 0}.times button{flex:1;padding:6px 0;font-size:12px}.row{display:grid;grid-template-columns:62px 1fr 35px;gap:6px;align-items:center;margin:9px 0}.row select{grid-column:2/4;width:100%;min-width:0;padding:5px}.row input{width:100%;min-width:0;accent-color:#b1dbea}.row output{font-size:11px;text-align:right;font-variant-numeric:tabular-nums;color:#b1c9d6}.row label{font-size:12px;color:#c9dae4}summary{cursor:pointer;color:#afc4d0;border-top:1px solid #ffffff18;padding-top:9px;margin-top:9px;font-size:12px}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:12px}.check{display:flex;gap:7px;align-items:center;margin:6px 0;font-size:12px;color:#bed0da}.hint{font-size:11px;color:#9eb4c2;margin-top:12px}.footer{position:fixed;bottom:16px;left:18px;right:18px;display:flex;justify-content:space-between;gap:8px;pointer-events:none;z-index:3;color:#f1f7ff;font-size:11px;text-shadow:0 1px 5px #102432}.badge{background:#102534c9;padding:6px 10px;border-radius:8px;backdrop-filter:blur(8px)}#error{display:none;position:fixed;inset:15% 10%;z-index:8;background:#102433f5;border:1px solid #e9ae82;border-radius:16px;padding:24px;white-space:pre-wrap;overflow:auto;font:13px/1.6 monospace}#loading{position:fixed;right:22px;top:22px;z-index:4;background:#102534cc;padding:8px 13px;border-radius:20px;font-size:12px}.collapsed .body{display:none}#collapse{padding:0 7px;font-size:15px}input[type=checkbox]{accent-color:#b1dbea}@media(max-width:650px){.panel{left:10px;top:10px;width:225px;padding:12px;max-height:calc(100% - 96px)}.row{grid-template-columns:56px 1fr 32px;margin:7px 0}h1{font-size:13px}.footer{left:10px;right:10px;bottom:10px;font-size:10px}.footer .badge:last-child{display:none}.lede{font-size:11px}}
</style></head><body><canvas id="scene" aria-label="实时程序化体积天气场"></canvas><div class="panel" id="panel"><header><div><h1>WEATHER MOTHER</h1><div class="ver">V0.5.1 · VISUAL CANDIDATE</div></div><button id="collapse" aria-label="收起控制台">−</button></header><div class="body"><p class="lede" id="description">有厚度的云体，有方向的风，有连续变化的光。</p>
<div class="row"><label for="weather">天气案例</label><select id="weather"><option value="fair">晴日积云</option><option value="coast">海岸层积云</option><option value="mountain">山间湿雾</option><option value="rain">阴天降雨</option><option value="storm">深对流雷暴</option><option value="rainbow">雨过天晴 · 彩虹</option><option value="snow">雪与低云</option><option value="high">高空冰云</option></select></div>
<div class="row"><label for="kind">云属</label><select id="kind"><option value="Cu">积云 Cu</option><option value="Cb">积雨云 Cb</option><option value="Sc">层积云 Sc</option><option value="St">层云 St</option><option value="Ns">雨层云 Ns</option><option value="Ac">高积云 Ac</option><option value="As">高层云 As</option><option value="Ci">卷云 Ci</option><option value="Cc">卷积云 Cc</option><option value="Cs">卷层云 Cs</option></select></div>
<div class="times"><button data-hour="6.6">清晨</button><button data-hour="12">正午</button><button data-hour="17.4">黄昏</button><button data-hour="22">月夜</button></div>
<div class="row"><label for="hour">时刻</label><input id="hour" type="range" min="0" max="24" step=".05" value="14.4"><output></output></div><div class="row"><label for="density">浓度</label><input id="density" type="range" min="0" max="2" step=".01" value=".9"><output></output></div><div class="row"><label for="count">云团数</label><input id="count" type="range" min="1" max="9" step="1" value="3"><output></output></div><div class="row"><label for="wind">风速</label><input id="wind" type="range" min="0" max="50" step="1" value="12"><output></output></div><div class="row"><label for="direction">来风方向</label><input id="direction" type="range" min="0" max="360" step="1" value="270"><output></output></div>
<details><summary>光照、天气与交互</summary><div class="row"><label for="exposure">曝光</label><input id="exposure" type="range" min=".4" max="2" step=".02" value="1"><output></output></div><div class="row"><label for="detail">边缘细节</label><input id="detail" type="range" min="0" max="1" step=".02" value=".62"><output></output></div><div class="row"><label for="rain">降水</label><input id="rain" type="range" min="0" max="1" step=".02" value="0"><output></output></div><div class="row"><label for="fog">雾量</label><input id="fog" type="range" min="0" max="1" step=".02" value=".05"><output></output></div><div class="row"><label for="humidity">相对湿度</label><input id="humidity" type="range" min="20" max="100" step="1" value="68"><output></output></div><div class="row"><label for="instability">对流强度</label><input id="instability" type="range" min="0" max="1" step=".02" value=".45"><output></output></div><div class="row"><label for="quality">画质</label><select id="quality"><option value="balanced">平衡</option><option value="fine" selected>精细</option><option value="ultra">特写</option></select></div>
<label class="check"><input id="mountains" type="checkbox">山体与迎风抬升示意</label><label class="check"><input id="aircraft" type="checkbox">飞机与局部尾流示意</label><label class="check"><input id="rainbow" type="checkbox">日照雨区中的彩虹</label><label class="check"><input id="cycle" type="checkbox">自动昼夜演示</label><p class="hint">天气为程序化案例。山地风场、尾流与彩虹采用图形近似，尚无实况天气接入或完整流体求解。</p></details>
<div class="buttons"><button id="pause">暂停演化</button><button id="seed">新种子</button><button id="reset">回到全景</button><button id="match">按天气参数生成</button></div><div class="hint">拖动环绕，滚轮靠近，双击回到全景。数据与程序生成，零图片资源。</div></div></div><div class="footer"><span class="badge" id="status">启动天气内核</span><span class="badge">图形实验候选 · 人工视觉验收待定</span></div><div id="loading">正在生成云场数据…</div><pre id="error"></pre>
<script src="engine.js?v=41d6ac88" onerror="document.getElementById('error').style.display='block';document.getElementById('error').textContent='天气程序加载失败，请稍后重新打开。'"></script></body></html>
