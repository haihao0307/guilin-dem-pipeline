<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#202c2e"><link rel="icon" href="data:,"><title>Weather Mother · Rain</title><style>html,body{margin:0;width:100%;height:100%;display:grid;place-items:center;background:#202c2e;color:#e9f1ed;font:13px system-ui}small{color:#b6c2bd}.error{max-width:680px;padding:24px;white-space:pre-wrap;line-height:1.65}</style></head><body><div id="status">正在进入 Weather Mother · Rain<br><small>Liquid V1.2 · Wet Glass</small></div><script>(async()=>{try{if(typeof DecompressionStream!=='function')throw Error('当前浏览器缺少 gzip DecompressionStream 支持');const manifest=await fetch('MANIFEST.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('MANIFEST '+r.status);return r.json()});const fs=manifest.chunks.map(x=>x.file);if(fs.length!==manifest.chunks.length)throw Error('Rain 载荷数量不一致');const parts=[];for(let i=0;i<fs.length;i++){const text=await fetch(fs[i],{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(fs[i]+' '+r.status);return r.text()});if(text.length!==manifest.chunks[i].bytes)throw Error(fs[i]+' 长度校验失败');parts.push(text)}const b=atob(parts.join(''));const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);const html=await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).text();document.open();document.write(html);document.close()}catch(e){document.querySelector('#status').className='error';document.querySelector('#status').textContent='Weather Mother · Rain 启动失败\n'+String(e)}})();</script></body></html>
