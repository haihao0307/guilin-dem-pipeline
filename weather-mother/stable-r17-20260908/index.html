ion><option value=\"Ac\">高积云 Ac</option><option value=\"As\">高层云 As</option><option value=\"Ci\">卷云 Ci</option><option value=\"Cc\">卷积云 Cc</option><option value=\"Cs\">卷层云 Cs</option></select></div><div class=\"times\"><button data-hour=\"6.6\">清晨</button><button data-hour=\"12\">正午</button><button data-hour=\"17.5\">黄昏</button><button data-hour=\"22\">月夜</button></div><div class=\"row\"><label for=\"hour\">时刻</label><input id=\"hour\" type=\"range\" min=\"0\" max=\"24\" step=\"0.05\" value=\"16\"><output></output></div><div class=\"row\"><label for=\"density\">浓度</label><input id=\"density\" type=\"range\" min=\"0\" max=\"2\" step=\"0.01\" value=\"0.86\"><output></output></div><div class=\"row\"><label for=\"count\">云团数</label><input id=\"count\" type=\"range\" min=\"1\" max=\"9\" step=\"1\" value=\"3\"><output></output></div><div class=\"row\"><label for=\"wind\">风力 m/s</label><input id=\"wind\" type=\"range\" min=\"0\" max=\"80\" step=\"1\" value=\"12\"><output></output></div><div class=\"row\"><label for=\"cloudSpeed\">云速 m/s</label><input id=\"cloudSpeed\" type=\"range\" min=\"0\" max=\"250\" step=\"1\" value=\"12\"><output></output></div><div class=\"row\"><label for=\"direction\">来风方向</label><input id=\"direction\" type=\"range\" min=\"0\" max=\"360\" step=\"1\" value=\"270\"><output></output></div><details id=\"cycloneSection\"><summary>台风与旋转风暴</summary>\r\n<div class=\"row\"><label for=\"cycloneSpin\">旋转强度</label><input id=\"cycloneSpin\" type=\"range\" min=\"0\" max=\"2.5\" step=\".02\" value=\"1\"><output></output></div>\r\n<div class=\"row\"><label for=\"eyeRadius\">风眼半径</label><input id=\"eyeRadius\" type=\"range\" min=\"1.2\" max=\"3.8\" step=\".05\" value=\"2.2\"><output></output></div>\r\n<div class=\"row\"><label for=\"rainbandCurl\">雨带弯曲</label><input id=\"rainbandCurl\" type=\"range\" min=\".4\" max=\"2\" step=\".02\" value=\"1\"><output></output></div>\r\n<div class=\"row\"><label for=\"stormRadius\">云系半径</label><input id=\"stormRadius\" type=\"range\" min=\"7\" max=\"11\" step=\".1\" value=\"10\"><output></output></div>\r\n<p class=\"hint\">风眼、眼墙和螺旋雨带由同一旋转场组织。当前是可操作的体积外观模型，没有气压、海温、科氏力或数值天气求解。</p></details><details open id=\"irisSection\"><summary>七彩云 · 云体虹彩</summary>\r\n<label class=\"check\"><input id=\"iridescence\" type=\"checkbox\">启用近太阳方向的云体虹彩</label>\r\n<div class=\"row\"><label for=\"iriStrength\">彩色强度</label><input id=\"iriStrength\" type=\"range\" min=\"0\" max=\"2\" step=\".02\" value=\"0\"><output></output></div>\r\n<div class=\"row\"><label for=\"dropletRadius\">滴半径 μm</label><input id=\"dropletRadius\" type=\"range\" min=\"1\" max=\"16\" step=\".1\" value=\"6\"><output></output></div>\r\n<div class=\"row\"><label for=\"dropletSpread\">粒径离散</label><input id=\"dropletSpread\" type=\"range\" min=\"0\" max=\"1\" step=\".02\" value=\".12\"><output></output></div>\r\n<button id=\"aimIris\">对准七彩云观察角度</button>\r\n<p class=\"hint\">多波段衍射外观近似。色彩取决于日照角、滴径和云体光学厚度，随观察方向变化。没有彩色图片贴片。</p></details><details open id=\"loopSection\"><summary>连续形态循环</summary>\r\n<label class=\"check\"><input id=\"loopEnabled\" type=\"checkbox\" checked>同一种子无缝演化</label>\r\n<div class=\"row\"><label for=\"loopSeconds\">周期 秒</label><input id=\"loopSeconds\" type=\"range\" min=\"12\" max=\"300\" step=\"1\" value=\"60\"><output></output></div>\r\n<div class=\"row\"><label for=\"loopAmount\">变化幅度</label><input id=\"loopAmount\" type=\"range\" min=\"0\" max=\"1\" step=\".01\" value=\".6\"><output></output></div>\r\n<div class=\"row\"><label for=\"loopPhase\">循环进度</label><input id=\"loopPhase\" type=\"range\" min=\"0\" max=\"100\" step=\".1\" value=\"0\"><output>0%</output></div>\r\n<div class=\"buttons\"><button id=\"loopPause\">冻结形态</button><button id=\"loopRestart\">回到循环起点</button></div>\r\n<p class=\"hint\">云体在生长与消散间连续变化；种子身份保持。周期按 1×、内部演化 1× 计算。漂移与日照独立，全局暂停可冻结画面。</p></details>\r\n<details id=\"perfSection\"><summary>性能与空区优化</summary><label class=\"check\"><input id=\"fastEmpty\" type=\"checkbox\" checked>保守空区排除，保留原采样数</label>\r\n<label class=\"check\"><input id=\"skipEmpty\" type=\"checkbox\" checked>距离下界跳过确定为空的采样区</label><pre id=\"perfReadout\" class=\"hint\" style=\"white-space:pre-wrap\">等待有效帧样本…</pre><button id=\"perfReset\">重新测量</button>\r\n<p class=\"hint\">显示完成帧的实际速率及 P95 耗时。GPU 计时不受支持时显示不可用。优化不删除光照，也不偷偷降低分辨率。</p></details>\r\n<details id=\"lightningSection\"><summary>雷电事件</summary><label class=\"check\"><input id=\"lightningEnabled\" type=\"checkbox\">雷暴自动放电，包含闪光</label>\r\n<div class=\"row\"><label for=\"lightningRate\">每分钟事件</label><input id=\"lightningRate\" type=\"range\" min=\"0\" max=\"20\" step=\"1\" value=\"6\"><output></output></div>\r\n<div class=\"row\"><label for=\"lightningPower\">闪电亮度</label><input id=\"lightningPower\" type=\"range\" min=\"0\" max=\"2\" step=\".01\" value=\".9\"><output></output></div>\r\n<div class=\"row\"><label for=\"dischargeMode\">放电类型</label><select id=\"dischargeMode\"><option value=\"auto\">混合事件</option><option value=\"intra\">云内放电</option><option value=\"ground\">云地放电</option></select></div><button id=\"lightningOnce\">演示一次局部放电</button><p class=\"hint\">连续分叉通道、短促复击与多点云内照亮。闪电仍待参考校准；台风眼、眼墙及雨带只有规则，尚无台风仿真。</p></details><details open><summary>风与运动</summary><div class=\"row\"><label for=\"gust\">阵风起伏</label><input id=\"gust\" type=\"range\" min=\"0\" max=\"1\" step=\"0.01\" value=\"0.15\"><output></output></div><div class=\"row\"><label for=\"turbulence\">湍流强度</label><input id=\"turbulence\" type=\"range\" min=\"0\" max=\"1\" step=\"0.01\" value=\"0.25\"><output></output></div><div class=\"row\"><label for=\"timeScale\">时间倍率</label><input id=\"timeScale\" type=\"range\" min=\"0\" max=\"60\" step=\"0.1\" value=\"1\"><output></output></div><div class=\"row\"><label for=\"evolution\">内部演化</label><input id=\"evolution\" type=\"range\" min=\"0\" max=\"5\" step=\"0.05\" value=\"1\"><output></output></div><label class=\"check\"><input id=\"windLink\" type=\"checkbox\">云速跟随风速</label><label class=\"check\"><input id=\"follow\" type=\"checkbox\">相机跟随云场</label><div id=\"windReadout\" class=\"hint\"></div><p class=\"hint\">风力驱动局部扰动，云速控制整片云的平移。1× 为实际秒，倍率只用于加速演示。</p></details><details><summary>大气与光照</summary><div class=\"row\"><label for=\"lightScene\">光影场景</label><select id=\"lightScene\"><option value=\"natural\">自然天气</option><option value=\"daylight\">日光体积</option><option value=\"dawn\">清晨暖光</option><option value=\"sunset\">黄昏透光</option><option value=\"silver\">逆光银边</option><option value=\"moon\">冷色月光</option></select></div><div class=\"row\"><label for=\"exposure\">曝光</label><input id=\"exposure\" type=\"range\" min=\"0.4\" max=\"2\" step=\"0.02\" value=\"1\"><output></output></div><div class=\"row\"><label for=\"sunlight\">直射光</label><input id=\"sunlight\" type=\"range\" min=\"0\" max=\"2\" step=\"0.02\" value=\"1\"><output></output></div><div class=\"row\"><label for=\"skylight\">天空补光</label><input id=\"skylight\" type=\"range\" min=\"0\" max=\"2\" step=\"0.02\" value=\"1\"><output></output></div><div class=\"row\"><label for=\"scatter\">内部散射</label><input id=\"scatter\" type=\"range\" min=\"0\" max=\"1.5\" step=\"0.02\" value=\"1\"><output></output></div><div class=\"row\"><label for=\"silver\">透光银边</label><input id=\"silver\" type=\"range\" min=\"0\" max=\"3\" step=\"0.01\" value=\"1\"><output></output></div><div class=\"row\"><label for=\"groundLight\">地面反照</label><input id=\"groundLight\" type=\"range\" min=\"0\" max=\"3\" step=\"0.01\" value=\"1\"><output></output></div><div class=\"row\"><label for=\"haze\">大气浑浊</label><input id=\"haze\" type=\"range\" min=\"0\" max=\"1\" step=\"0.02\" value=\"0.22\"><output></output></div></details><details><summary>云体、天气与交互</summary><div class=\"row\"><label for=\"detail\">边缘细节</label><input id=\"detail\" type=\"range\" min=\"0\" max=\"1\" step=\"0.02\" value=\"0.64\"><output></output></div><div class=\"row\"><label for=\"rain\">降水</label><input id=\"rain\" type=\"range\" min=\"0\" max=\"1\" step=\"0.02\" value=\"0\"><output></output></div><div class=\"row\"><label for=\"fog\">雾量</label><input id=\"fog\" type=\"range\" min=\"0\" max=\"1\" step=\"0.02\" value=\"0.03\"><output></output></div><div class=\"row\"><label for=\"humidity\">相对湿度</label><input id=\"humidity\" type=\"range\" min=\"20\" max=\"100\" step=\"1\" value=\"68\"><output></output></div><div class=\"row\"><label for=\"instability\">对流强度</label><input id=\"instability\" type=\"range\" min=\"0\" max=\"1\" step=\"0.02\" value=\"0.45\"><output></output></div><div class=\"row\"><label for=\"shear\">高空风切</label><input id=\"shear\" type=\"range\" min=\"0\" max=\"1\" step=\"0.02\" value=\"0.18\"><output></output></div><div class=\"row\"><label for=\"quality\">画质</label><select id=\"quality\"><option value=\"balanced\">交互预览 · 112 步</option><option value=\"fine\" selected>高画质 · 192 步</option><option value=\"ultra\">原生精细 · 320 步</option><option value=\"cinema\">电影特写 · 480 步</option></select></div><label class=\"check\"><input id=\"temporal\" type=\"checkbox\" checked>时间重投影与降噪</label><label class=\"check\"><input id=\"mountains\" type=\"checkbox\">山体与迎风抬升示意</label><label class=\"check\"><input id=\"aircraft\" type=\"checkbox\">飞机与局部尾流示意</label><label class=\"check\"><input id=\"rainbow\" type=\"checkbox\">日照雨区中的彩虹</label><label class=\"check\"><input id=\"cycle\" type=\"checkbox\">自动昼夜演示</label><p class=\"hint\">程序化天气案例。山地、飞机、台风和降水仍有明确的近似边界，尚未接入实况天气或完整流体求解。</p><p class=\"hint\"><a href=\"../method-v100/lighting/?lighting=silver&quality=fine\" target=\"_blank\" rel=\"noopener\">打开独立云体光影检查页 ↗</a></p></details><div class=\"buttons\"><button id=\"pause\">暂停演化</button><button id=\"seed\">新种子</button><button id=\"reset\">回到全景</button><button id=\"match\">按天气参数生成</button></div><p class=\"hint\">拖动环绕，滚轮靠近，双击回到全景。风与云速独立控制，均为米/秒。采样与内存优先服务画质，零图片资产。</p></div></div><div class=\"footer\"><span id=\"status\" class=\"badge\">生成天气场</span><span class=\"badge\">V1.1 全天气候选 · 保留 V061 基线</span></div><div id=\"loading\">正在生成三维密度数据…</div><pre id=\"error\"></pre><script>window.__WEATHER_SHADER=\"#version 300 es\\
