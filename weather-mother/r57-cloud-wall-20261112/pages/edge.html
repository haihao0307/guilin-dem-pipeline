<script id="fs" type="x-shader/x-fragment">#version 300 es
precision highp float;
out vec4 color;
uniform vec2 uResolution,uAngles;
uniform float uTime,uDistance,uDetail,uDensity;
uniform int uSteps,uVariant;
// Dimensionless object coordinates: Y is up, no rotation/shear of cloud frame.
// Analytic ray/ellipsoid intersection uses the same conservative support as density.
// Learned boundary-first idea from the retained analytic lab; no teacher shader copied.
const int LOBES=10;
const vec3 C[LOBES]=vec3[](vec3(-1.7,0,0),vec3(-.4,.05,0),vec3(1.,0,0),vec3(2.,-.05,.1),vec3(-1.25,.7,.05),vec3(.0,.9,0),vec3(1.1,.65,.05),vec3(-.35,1.35,.1),vec3(.65,1.1,.1),vec3(.35,.4,.85));
const vec3 R[LOBES]=vec3[](vec3(1.1,.65,.85),vec3(1.3,.7,1.),vec3(1.1,.7,.85),vec3(.75,.55,.7),vec3(.9,.85,.85),vec3(1.,1.,.95),vec3(.85,.85,.8),vec3(.95,1.05,.85),vec3(.8,.9,.8),vec3(.85,.8,.75));
float hash3(vec3 p){p=fract(p*vec3(.1031,.1030,.0973));p+=dot(p,p.yxz+33.33);return fract((p.x+p.y)*p.z);}
float cloudNoise(vec3 p){vec3 i=floor(p),f=fract(p);f=f*f*f*(f*(f*6.-15.)+10.);return mix(mix(mix(hash3(i),hash3(i+vec3(1,0,0)),f.x),mix(hash3(i+vec3(0,1,0)),hash3(i+vec3(1,1,0)),f.x),f.y),mix(mix(hash3(i+vec3(0,0,1)),hash3(i+vec3(1,0,1)),f.x),mix(hash3(i+vec3(0,1,1)),hash3(i+vec3(1,1,1)),f.x),f.y),f.z);}
float field(vec3 p){
 float t=uTime*.10; float v=float(uVariant);
 vec3 q=p+vec3(t*.31+v*7.13,-t*.19+v*3.97,t*.08+v*5.71);
 float warp=cloudNoise(q*1.15+2.7)-.5; q += .22*vec3(warp,warp*.73,-warp*.61);
 float macro=cloudNoise(q*1.05), billow=cloudNoise(q*2.9+7.1);
 float top=.95+(macro-.5)*.62+(billow-.5)*.30;
 float edge=1.15+(cloudNoise(vec3(q.x*.70,q.y*.65,q.z*.36))-.5)*.85;
 float shape=max(p.y-top, p.z-edge);
 shape=max(shape,-p.y-1.8);
 if(shape>.30) return 0.;
 float medium=cloudNoise(q*7.5+13.7);
 float fine=cloudNoise(q*16.0+27.1);
 float broken=shape+(.5-billow)*.53+(.5-medium)*.25+uDetail*(.5-fine)*.16;
 float body=1.-smoothstep(-.055,.075,broken);
 return body*(.34+.42*billow+.24*medium)*uDensity;
}
vec2 ellipsoid(vec3 ro,vec3 rd,vec3 c,vec3 r){vec3 o=(ro-c)/r,d=rd/r;float a=dot(d,d),b=dot(o,d),h=b*b-a*(dot(o,o)-1.);if(h<0.)return vec2(1e4,-1e4);h=sqrt(h);return vec2((-b-h)/a,(-b+h)/a);}
// Unbounded in X and behind the cloud edge; finite optical integration horizon.
vec2 bound(vec3 ro,vec3 rd){
 float invY=1./(rd.y+(rd.y>=0.?1e-7:-1e-7));
 float ya=(-2.3-ro.y)*invY,yb=(1.9-ro.y)*invY;
 float nearY=min(ya,yb),farY=max(ya,yb);
 float edgeZ=2.05;
 if(abs(rd.z)<1e-6 && ro.z>edgeZ) return vec2(1.,-1.);
 float edgeT=(edgeZ-ro.z)/(rd.z+(rd.z>=0.?1e-7:-1e-7));
 float nearZ=rd.z<0.?edgeT:-1e4,farZ=rd.z>0.?edgeT:1e4;
 float start=max(0.,max(nearY,nearZ));
 return vec2(start,min(min(farY,farZ),start+14.));
}
void main(){
 vec2 uv=(gl_FragCoord.xy-.5*uResolution)/uResolution.y;
 vec3 target=vec3(0,.35,-.5),ro=target+uDistance*vec3(sin(uAngles.x)*cos(uAngles.y),sin(uAngles.y),cos(uAngles.x)*cos(uAngles.y));
 vec3 f=normalize(target-ro),r=normalize(cross(f,vec3(0,1,0))),up=cross(r,f),rd=normalize(f*1.7+r*uv.x+up*uv.y);
 vec3 sky=mix(vec3(.68,.79,.87),vec3(.27,.51,.73),smoothstep(-.3,.65,rd.y));
 vec2 hit=bound(ro,rd);float start=max(hit.x,0.),end=hit.y;vec3 sum=vec3(0);float trans=1.;
 if(end>start){float stepSize=(end-start)/float(uSteps);vec3 sun=normalize(vec3(-.65,1.,1.));
 for(int i=0;i<144;i++){if(i>=uSteps||trans<.015)break;float jitter=fract(sin(dot(gl_FragCoord.xy,vec2(12.9898,78.233)))*43758.5453);float t=start+(float(i)+jitter)*stepSize;vec3 p=ro+rd*t;float d=field(p);if(d<.002)continue;
 float tau=0.;for(int j=0;j<4;j++){float h=.12+.18*float(j*j);tau+=field(p+sun*h)*(.22+.16*float(j));}
 float light=exp(-tau*2.0);float upper=smoothstep(-1.,2.5,p.y);
 vec3 lighting=vec3(.22,.29,.39)*(.82+.18*upper)+vec3(.69,.71,.71)*(light+.10*exp(-tau*.4));
 float opacity=1.-exp(-d*stepSize*2.3);sum+=trans*opacity*lighting;trans*=1.-opacity;
 }}
 vec3 c=sum+trans*sky;color=vec4(pow(clamp(c,0.,1.),vec3(.92)),1.);
}</script>
<script>(()=>{'use strict';const $=id=>document.getElementById(id),canvas=$('c');let gl,p,vao,loc={},time=0,playing=true,angles=[.35,.20],distance=5.7,last=performance.now(),dirty=true,frames=0,stamp=last,intervals=[],previousFrame=last,measure=null,drag=null,hidden=false,ext=null,queries=[],gpuSamples=[];
