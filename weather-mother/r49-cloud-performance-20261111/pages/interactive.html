<!doctype html><html lang="zh"><meta charset="utf-8"><style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#172534}canvas{display:block;width:100%;height:100%;touch-action:none}.bar{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);background:#fffffff0;padding:8px 12px;border-radius:8px;font:13px system-ui;white-space:nowrap}#error{color:#b11}</style><canvas id="c"></canvas><div class="bar"><button id="pause">暂停</button> <span>拖动观察 · 原作参考</span> <span id="perf"></span> <span id="error"></span></div><script>
const main="#version 300 es\nprecision highp float;\nprecision highp int;\nout vec4 fragColor;\n\nuniform float u_time;\n#define iTime u_time\n#define iResolution u_resolution\nuniform vec2 u_resolution; //Pass resolution in pixels\n\n// SPDX-License-Identifier: MIT\n// Copyright (c) 2026 @lumiey\n//[LICENSE] https://opensource.org/licenses/MIT\n\nuniform vec2 u_mouse;\n\nfloat hash12(vec2 p) {\n\tvec3 p3 = fract(p.xyx / 0.1031);\n    p3 += dot(p3, p3.yzx + 33.33);\n    return fract((p3.x + p3.y) * p3.z);\n}\n\nint hilbert_encode(int n, ivec2 p) {\n    int i = 0;\n    for (int s = n >> 1; s > 0; s >>= 1) {\n        int rx = int((p.x & s) != 0);\n        int ry = int((p.y & s) != 0);\n        i += s * s * ((rx << 1) | rx ^ ry);\n        p ^= (p.x ^ p.y) * (1 - ry) ^ (s - 1) * (rx & (1 - ry));\n    }\n    return i;\n}\n\nfloat blue(vec2 p) {\n    return fract(0.6180339887498948482 * float(hilbert_encode(512, ivec2(p)) % 262144));\n}\n\nvec3 hash33(vec3 p) {\n    p -= vec3(141.421356, 271.8281828, 161.8033988);\n    uvec3 u = floatBitsToUint(p * vec3(141421356, 2718281828, 1618033988));\n    return vec3((u.x ^ u.y ^ u.z) * uvec3(1732050807, 2645751311, 3316624790)) / float(~0u);\n}\n\nconst float softness = 3.0;   \nconst float amount = 0.55;       \nconst float height = 15.0;\nconst float thickness = 200.0; \nconst float cloud_scale = 1.0;  \n\nconst float exposure = 32.0;\nconst float light_step_factor = 1.0;\nconst float absorb = 16.0;\nconst float sun_absorb = 1.5;\nconst float sky_absorb = 1.0;\nconst float forward_scatter = 0.7;\nconst bool skylight_enable = bool(1);\nconst bool sunlight_enable = bool(1);\n\nconst int iter = 192;         \nconst int light_iter = 8;     \nconst float time_scale = 1.0;  \n\nconst vec3 sun_color = vec3(1, 0.6, 0.4) * 4.0;\nconst vec3 sky_color = vec3(0.24, 0.38, 1);\n\nconst float fov_degrees = 80.0;\nconst float FAR = 900.0;      \n\n#define PI 3.14159265359\n\nvec3 lrgb2srgb(vec3 lrgb) { return pow(lrgb, vec3(1.0 / 2.2)); }\n\nconst mat3 LINEAR_REC2020_TO_LINEAR_SRGB = mat3(\n  1.6605, -0.1246, -0.0182,\n  -0.5876, 1.1329, -0.1006,\n  -0.0728, -0.0083, 1.1187\n);\n\nconst mat3 LINEAR_SRGB_TO_LINEAR_REC2020 = mat3(\n  0.6274, 0.0691, 0.0164,\n  0.3293, 0.9195, 0.0880,\n  0.0433, 0.0113, 0.8956\n);\n\nconst mat3 AGX_INSET = mat3(\n  0.856627153315983, 0.137318972929847, 0.11189821299995,\n  0.0951212405381588, 0.761241990602591, 0.0767994186031903,\n  0.0482516061458583, 0.101439036467562, 0.811302368396859\n);\n\nconst mat3 AGX_OUTSET = mat3(\n  1.1271005818144368, -0.1413297634984383, -0.14132976349843826,\n  -0.11060664309660323, 1.157823702216272, -0.11060664309660294,\n  -0.016493938717834573, -0.016493938717834257, 1.2519364065950405\n);\n\nconst float AGX_MIN_EV = -12.47393;\nconst float AGX_MAX_EV = 4.026069;\n\nvec3 agx_cdl(vec3 color, vec3 slope, vec3 offset, vec3 power, float saturation) {\n    color = LINEAR_SRGB_TO_LINEAR_REC2020 * color;\n    color = AGX_INSET * color;\n    color = max(color, 1e-10);\n    color = clamp(log2(color), AGX_MIN_EV, AGX_MAX_EV);\n    color = (color - AGX_MIN_EV) / (AGX_MAX_EV - AGX_MIN_EV);\n    color = clamp(color, 0.0, 1.0);\n    vec3 x2 = color * color;\n    vec3 x4 = x2 * x2;\n    color = + 15.5     * x4 * x2\n            - 40.14    * x4 * color\n            + 31.96    * x4\n            - 6.868    * x2 * color\n            + 0.4298   * x2\n            + 0.1191   * color\n            - 0.00232;\n    // AgX look\n    color = pow(color * slope + offset, power);\n    const vec3 lw = vec3(0.2126, 0.7152, 0.0722);\n    float luma = dot(color, lw);\n    color = luma + saturation * (color - luma);\n    color = AGX_OUTSET * color;\n    color = pow(max(vec3(0.0), color), vec3(2.2));\n    color = LINEAR_REC2020_TO_LINEAR_SRGB * color;\n    color = clamp(color, 0.0, 1.0);\n    return color;\n}\n\nvec3 agx(vec3 color) {\n  return agx_cdl(color, vec3(1.0), vec3(0.0), vec3(1.0), 1.0);\n}\n\nvec3 agx_punchy(vec3 color) {\n  return agx_cdl(color, vec3(1.0), vec3(0.0), vec3(1.35), 1.4);\n}\n\nvec4 perm(vec4 x) { \n    x *= x * 34.0 + 1.0; \n    return x - floor(x / 289.0) * 289.0;\n}\n\nfloat noise(vec3 p) {\n    p *= 0.2;\n    vec3 a = floor(p);\n    vec3 d = p - a;\n    d *= d * (3.0 - 2.0 * d);\n    vec4 b = a.xxyy + vec4(0, 1, 0, 1);\n    vec4 k1 = perm(b.xyxy);\n    vec4 k2 = perm(k1.xyxy + b.zzww) + a.zzzz;\n    vec4 k3 = perm(k2);\n    vec4 k4 = perm(k2 + 1.0);\n    vec4 o1 = fract(k3 * 0.02439024);\n    vec4 o2 = fract(k4 * 0.02439024);\n    vec4 o3 = mix(o1, o2, d.z);\n    vec2 o4 = mix(o3.xz, o3.yw, d.x);\n    return mix(o4.x, o4.y, d.y);\n}\n\nfloat fbm(vec3 p, int octaves) {\n\tfloat s = 0.0, m = 0.0, a = 1.0;\n\tfor(int i = 0; i < octaves; i++) {\n\t\ts += a * noise(p);\n\t\tm += a;\n\t\ta *= 0.6;\n\t\tp *= 2.0;\n\t}\n\treturn s / m;\n}\n\nfloat cloud_noise(vec3 p, int octaves) {\n    float h = max(0.0, (p.y - height) / thickness);\n    float wind_time = iTime * 0.03 * time_scale;\n    p = p * 0.05 * cloud_scale + vec3(wind_time, 0.0, wind_time * 0.4);\n    float cloud = fbm(p, octaves) * (1.0 - h * h * h * h * 0.5);\n    cloud = smoothstep(0.0, (noise(-p) + 0.5) * softness, amount + cloud * smoothstep(-0.3, 0.2, h)  - 1.0);\n    return cloud;\n}\n\nfloat phase(float g, float cos_theta) {\n    float denom = 1.0 + g * (g - 2.0 * cos_theta);\n    float heyey = (1.0 - g * g) / sqrt(denom * denom * denom);\n    return heyey / (4.0 * PI);\n}\n\nvec3 get_sun_dir(float time_of_day_normalized) {\n    float angle = (time_of_day_normalized - 0.25) * PI * 2.0;\n    return normalize(vec3(sin(angle) * cos(angle * 7.0), sqrt(sin(angle * 7.0) * sin(angle * 7.0) + 0.02), cos(angle)));\n}\n\nvec3 get_sky_col(vec3 rd, vec3 sun_dir) {\n    float sun_dot = clamp(dot(rd, sun_dir), 0.0, 1.0);\n    float horizon_fade = smoothstep(0.0, 0.2, rd.y);\n    vec3 sky = sky_color * horizon_fade;\n    vec3 horizon_color = mix(vec3(1.0, 0.5, 0.3), sky_color, smoothstep(-0.1, 0.1, rd.y));\n    sky = mix(horizon_color, sky, horizon_fade);\n    sky *= (0.6 + 0.4 * clamp(rd.y, 0.0, 1.0));\n    sky += min(1.0, (1.0 - rd.y) * (1.0 - rd.y)) * 0.5;\n    return sky;\n}\n\nfloat light_march(vec3 p, vec3 light_dir, float step_size, float absorb_coeff, float jitter) {\n    float total_density = 0.0;\n    vec3 current_p = p + jitter * light_dir * step_size;\n    float base_step = step_size;\n    float prev_density = 0.0;\n    float t_enter = (height - p.y) / light_dir.y;\n    float t_exit  = (height + thickness - p.y) / light_dir.y;\n    if (t_enter > t_exit) { float tmp = t_enter; t_enter = t_exit; t_exit = tmp; }\n    float t_max = min(t_exit, FAR);\n    for (int i = 0; i < light_iter; ++i) {\n        current_p += light_dir * step_size;\n        float dist = length(p - current_p);\n        if (dist > t_max) break;\n        float density = cloud_noise(current_p, 5);\n        total_density += (prev_density + density) * 0.5 * step_size;\n        step_size = base_step / min(1.0, 0.2 + 2.0 * sqrt(abs(prev_density - density)));\n        prev_density = density;\n    }\n    float transmittance = exp(-sqrt(total_density) * absorb_coeff);\n    return transmittance;\n}\n\n// Returns:\n// - cloud color in linear RGB\n// - amount of light that escaped the clouds\n// - distance travelled [0; 1]\nvec4 render_clouds(vec3 ro, vec3 rd, vec3 sun_dir, vec3 sky_color, out float dist) {\n    float t_enter = (height - ro.y) / rd.y;\n    float t_exit = (height + thickness - ro.y) / rd.y;\n    if (t_enter > t_exit) { float temp = t_enter; t_enter = t_exit; t_exit = temp; }\n    float t_min = max(0.0, t_enter);\n    float t_max = min(t_exit, FAR);\n    dist = t_min / t_max;\n    if (t_min >= t_max || t_max <= 0.0)\n        return vec4(0, 0, 0, 1);\n\n    float step_size = (t_max - t_min) / float(iter);\n    float light_march_step_size = thickness * light_step_factor / float(light_iter);\n\n    float jitter = blue(gl_FragCoord.xy);\n    vec3 p = ro + rd * (t_min + jitter * step_size);\n\n    vec3 accumulated_light = vec3(0.0);\n\n    float cos_theta = dot(rd, sun_dir);\n    float sun_phase_val = phase(forward_scatter, cos_theta);\n    vec3 sun_light_base = sunlight_enable ? vec3(sun_phase_val) : vec3(0);\n\n    float total_density = 0.0;\n    float prev_density = 0.0;\n    for (float t = 0.0; t < 1.0; t += 1.0 / float(iter)) {\n        float dist = length(p - ro);\n        if (dist >= t_max || total_density > 4.0)\n            break;\n\n        float density = cloud_noise(p, 8);     \n            \n        // adaptive step size\n        step_size = mix(thickness, t_max - t_min, t) / float(iter) / min(1.0, 0.2 + 2.0 * sqrt(abs(prev_density - density)));\n        \n        if (density > 1e-4) {\n            float light_transmit_sun = 1.0;\n            if (sunlight_enable)\n                 light_transmit_sun = light_march(p, sun_dir, light_march_step_size, sun_absorb, jitter);\n          \n            float light_transmit_sky = 1.0;\n            if (skylight_enable) \n                light_transmit_sky = light_march(p, vec3(0, 1, 0), light_march_step_size, sky_absorb, jitter);\n\n            vec3 sun_contrib = sun_color * sun_phase_val * light_transmit_sun;\n            vec3 sky_contrib = sky_color * light_transmit_sky;\n       \n            float dens = (density + prev_density) * 0.5;\n\n            vec3 light_in_segment = dens * (sun_contrib + sky_contrib) * step_size;\n            accumulated_light += light_in_segment * exp(-total_density);\n            total_density += dens * step_size * absorb;\n        }\n\n        p += rd * step_size;\n        prev_density = density;\n    }\n    \n    return vec4(accumulated_light * exposure, exp(-total_density));\n}\n\n\nmat3 set_cam(vec3 ro, vec3 ta) {\n    vec3 cw = normalize(ta - ro);\n    vec3 cp = vec3(0, 1, 0);\n    vec3 cu = normalize(cross(cw, cp));\n    vec3 cv = normalize(cross(cu, cw));\n    return mat3(cu, cv, cw);\n}\n\nvec3 get_rd(vec2 uv, vec3 ro, vec3 ta, float fov) {\n    mat3 cam_matrix = set_cam(ro, ta);\n    float fov_rad = radians(fov);\n    float focal_length = 1.0 / tan(fov_rad * 0.5);\n    vec2 ndc = (uv - 0.5) * vec2(iResolution.x / iResolution.y, 1);\n    vec3 ray_dir_cam_space = normalize(vec3(ndc, focal_length));\n    return cam_matrix * ray_dir_cam_space;\n}\n\nvoid main() {\n    vec2 uv = gl_FragCoord.xy / u_resolution.xy;\n\n    float time_of_day = fract(iTime / 60.0 * time_scale + 0.35);\n    vec3 sun_dir = get_sun_dir(time_of_day);\n\n    vec3 ro = vec3(0);\n    ro.xy += (u_mouse.xy / u_resolution.xy * 2.0 - 1.0) * vec2(400, height * 20.0); \n    vec3 cam_look_at = vec3(0, height + thickness * 0.5, 200);\n    vec3 rd = get_rd(uv, ro, cam_look_at, fov_degrees);\n\n    float dist = 0.0;\n    vec3 sky_col = get_sky_col(rd, sun_dir);\n    vec4 cloud_result = render_clouds(ro, rd, sun_dir, sky_col, dist);\n    cloud_result.rgb = sky_col * cloud_result.a + exp(mix(log(cloud_result.rgb + 1e-5), log(sky_col * (1.0 - cloud_result.a) + 1e-5), 1.-exp(-max(0.0, dist - 0.65)*6.0)));\n    vec3 lrgb = agx_punchy(cloud_result.rgb);\n    vec3 srgb = lrgb2srgb(lrgb);\n\n    fragColor = vec4(srgb, 1);\n}",aux="";const c=document.getElementById('c'),gl=c.getContext('webgl2',{antialias:false,alpha:false});window.qa={ready:false,errors:[],frames:0};try{if(!gl)throw Error('需要 WebGL2');const vs='#version 300 es\nvoid main(){vec2 p=vec2((gl_VertexID<<1)&2,gl_VertexID&2);gl_Position=vec4(p*2.-1.,0.,1.);}';function shader(type,code){let a=gl.createShader(type);gl.shaderSource(a,code);gl.compileShader(a);if(!gl.getShaderParameter(a,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(a));return a}function program(fs){let p=gl.createProgram();gl.attachShader(p,shader(gl.VERTEX_SHADER,vs));gl.attachShader(p,shader(gl.FRAGMENT_SHADER,fs));gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(p));return p}let pr=program(main),ap=aux?program(aux):null,tex=null,fb=null;let w,h;function size(){let scale=Math.min(1,960/innerWidth,540/innerHeight);w=c.width=Math.max(1,Math.round(innerWidth*scale));h=c.height=Math.max(1,Math.round(innerHeight*scale));gl.viewport(0,0,w,h);if(ap){if(tex)gl.deleteTexture(tex);if(fb)gl.deleteFramebuffer(fb);tex=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tex);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA8,w,h,0,gl.RGBA,gl.UNSIGNED_BYTE,null);fb=gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,fb);gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,tex,0);gl.useProgram(ap);gl.uniform2f(gl.getUniformLocation(ap,'u_resolution'),w,h);gl.drawArrays(gl.TRIANGLES,0,3);gl.bindFramebuffer(gl.FRAMEBUFFER,null)}}addEventListener('resize',size);size();let mouse=[w*.5,h*.5,0,0],down=false;c.onpointerdown=e=>{down=true;c.setPointerCapture(e.pointerId);move(e)};c.onpointermove=move;c.onpointerup=()=>down=false;function move(e){let r=c.getBoundingClientRect();mouse=[(e.clientX-r.left)/r.width*w,(1-(e.clientY-r.top)/r.height)*h,down?1:0,0]}let last=0,t=0,playing=true,count=0,mark=0;document.getElementById('pause').onclick=()=>{playing=!playing;document.getElementById('pause').textContent=playing?'暂停':'播放'};function tick(now){if(!last)last=now;if(playing)t+=Math.min(.1,(now-last)/1000);last=now;gl.useProgram(pr);gl.uniform2f(gl.getUniformLocation(pr,'u_resolution'),w,h);gl.uniform1f(gl.getUniformLocation(pr,'u_time'),t);if(aux)gl.uniform4fv(gl.getUniformLocation(pr,'u_mouse'),mouse);else gl.uniform2f(gl.getUniformLocation(pr,'u_mouse'),mouse[0],mouse[1]);if(tex){gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,tex);gl.uniform1i(gl.getUniformLocation(pr,'u_pass1'),0)}gl.drawArrays(gl.TRIANGLES,0,3);qa.ready=true;qa.frames++;count++;if(now-mark>1000){document.getElementById('perf').textContent=w+'×'+h+' · '+Math.round(count*1000/(now-mark))+' FPS';count=0;mark=now}requestAnimationFrame(tick)}requestAnimationFrame(tick)}catch(e){qa.errors.push(String(e));document.getElementById('error').textContent=String(e)}</script></html>
