lize(ro - vec3(disp(time + tgtDst)*dspAmp, time + tgtDst));\n    ro.x -= bsMo.x*2.;\n    vec3 rightdir = normalize(cross(target, vec3(0,1,0)));\n    vec3 updir = normalize(cross(rightdir, target));\n    rightdir = normalize(cross(updir, target));\n    vec3 rd=normalize((p.x*rightdir + p.y*updir)*1. - target);\n    rd.xy *= rot(-disp(time + 3.5).x*0.2 + bsMo.x);\n    prm1 = smoothstep(-0.4, 0.4,sin(iTime*0.3));\n    vec4 scn = render(ro, rd, time);\n    vec3 col = scn.rgb;\n    col = iLerp(col.bgr, col.rgb, clamp(1.-prm1,0.05,1.));\n    col = pow(col, vec3(.55,0.65,0.6))*vec3(1.,.97,.9);\n    col *= pow( 16.0*q.x*q.y*(1.0-q.x)*(1.0-q.y), 0.12)*0.7+0.3;\n    fragColor = vec4( col, 1.0 );\n}\nvoid main(){mainImage(outColor,gl_FragCoord.xy);}`;\nfunction fail(e){const m=e&&e.message?e.message:String(e);qa.errors.push(m);qa.ready=false;loading.hidden=true;errorBox.textContent='Protean 老师云启动失败：'+m;errorBox.classList.add('open')}\nfunction shader(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s)||'shader compile failed');return s}\nfunction initProgram(){const vs=shader(gl.VERTEX_SHADER,VS),fs=shader(gl.FRAGMENT_SHADER,FS);program=gl.createProgram();gl.attachShader(program,vs);gl.attachShader(program,fs);gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program)||'program link failed');gl.deleteShader(vs);gl.deleteShader(fs);buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);const a=gl.getAttribLocation(program,'a');gl.enableVertexAttribArray(a);gl.vertexAttribPointer(a,2,gl.FLOAT,false,0,0);loc.iResolution=gl.getUniformLocation(program,'iResolution');loc.iTime=gl.getUniformLocation(program,'iTime');loc.iMouse=gl.getUniformLocation(program,'iMouse')}\nfunction centerMouse(){mouse=[canvas.width*.5,canvas.height*.5,0,0];draw();return mouse.slice()}\nfunction resize(){if(!gl)return;const mobile=innerWidth<=700||matchMedia('(pointer:coarse)').matches,scale=fullQuality?(mobile?.64:.76):(mobile?.34:.42),dpr=Math.min(devicePixelRatio||1,fullQuality?1.25:1),cap=fullQuality?(mobile?210000:430000):(mobile?85000:160000);let w=Math.max(1,Math.round(innerWidth*dpr*scale)),h=Math.max(1,Math.round(innerHeight*dpr*scale));const k=Math.min(1,Math.sqrt(cap/(w*h)));w=Math.max(1,Math.round(w*k));h=Math.max(1,Math.round(h*k));const oldW=canvas.width||w,oldH=canvas.height||h,wasCentered=Math.abs(mouse[0]-oldW*.5)<1&&Math.abs(mouse[1]-oldH*.5)<1;canvas.width=w;canvas.height=h;if(wasCentered||mouse[0]===0&&mouse[1]===0)mouse=[w*.5,h*.5,0,0];else mouse=[mouse[0]*w/oldW,mouse[1]*h/oldH,mouse[2],mouse[3]];qa.renderSize=[w,h];$('#size').textContent=w+'×'+h;gl.viewport(0,0,w,h)}\nfunction draw(){if(!gl||lost||!program)return;gl.useProgram(program);gl.uniform3f(loc.iResolution,canvas.width,canvas.height,1);gl.uniform1f(loc.iTime,timeS);gl.uniform4f(loc.iMouse,mouse[0],mouse[1],mouse[2],mouse[3]);gl.drawArrays(gl.TRIANGLES,0,3);qa.frames++;frameCount++;if(qa.frames===3||qa.frames===8)measureVariance()}\nfunction measureVariance(){try{const vals=[],w=canvas.width,h=canvas.height;for(let gy=1;gy<=4;gy++)for(let gx=1;gx<=6;gx++){const px=new Uint8Array(4);gl.readPixels(Math.floor(w*gx/7),Math.floor(h*gy/5),1,1,gl.RGBA,gl.UNSIGNED_BYTE,px);vals.push(px[0]+px[1]+px[2])}const mean=vals.reduce((a,b)=>a+b,0)/vals.length;qa.variance=vals.reduce((a,b)=>a+(b-mean)*(b-mean),0)/vals.length;qa.ready=qa.frames>=3&&qa.variance>4&&qa.errors.length===0;if(qa.ready)loading.hidden=true}catch(e){qa.errors.push(String(e))}}\nfunction tick(now){raf=requestAnimationFrame(tick);const dt=clamp((now-last)/1000,0,.05);last=now;if(playing)timeS+=dt;draw();if(now-frameStamp>=1000){$('#fps').textContent=Math.round(frameCount*1000/(now-frameStamp));frameStamp=now;frameCount=0}}\nfunction setPlaying(v){playing=!!v;$('#play').textContent=playing?'运行中':'已暂停';$('#play').setAttribute('aria-pressed',String(playing))}function setTime(v){timeS=Math.max(0,Number(v)||0);draw();return timeS}function restart(){timeS=0;centerMouse();setPlaying(true);draw()}function setCode(v){const open=!!v;$('#code').classList.toggle('open',open);$('#codeBtn').setAttribute('aria-pressed',String(open))}function setFullQuality(v){fullQuality=!!v;$('#quality').setAttribute('aria-pressed',String(fullQuality));resize();draw();return fullQuality}\nfunction setMousePixels(x,y,down=false){mouse[0]=clamp(Number(x)||0,0,canvas.width);mouse[1]=clamp(Number(y)||0,0,canvas.height);if(down){mouse[2]=mouse[0];mouse[3]=mouse[1]}draw();return mouse.slice()}\nfunction pointerToMouse(e){const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)/Math.max(r.width,1)*canvas.width,y=(r.bottom-e.clientY)/Math.max(r.height,1)*canvas.height;setMousePixels(x,y,pointerDown)}\n$('#source').textContent=ORIGINAL_SOURCE;$('#play').onclick=()=>setPlaying(!playing);$('#restart').onclick=restart;$('#centerMouse').onclick=()=>{centerMouse();mouseHint.classList.add('show');setTimeout(()=>mouseHint.classList.remove('show'),900)};$('#codeBtn').onclick=()=>setCode(!$('#code').classList.contains('open'));$('#closeCode').onclick=()=>setCode(false);$('#quality').onclick=()=>setFullQuality(!fullQuality);addEventListener('resize',resize);addEventListener('keydown',e=>{if(e.code==='Space'){setPlaying(!playing);e.preventDefault()}if(e.key==='Home'){restart();e.preventDefault()}});canvas.addEventListener('pointerdown',e=>{pointerDown=true;canvas.setPointerCapture?.(e.pointerId);pointerToMouse(e)});canvas.addEventListener('pointermove',e=>{if(pointerDown)pointerToMouse(e)});canvas.addEventListener('pointerup',e=>{pointerToMouse(e);pointerDown=false;canvas.releasePointerCapture?.(e.pointerId)});canvas.addEventListener('pointercancel',()=>{pointerDown=false});canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();lost=true;qa.ready=false;qa.errors.push('contextlost')});canvas.addEventListener('webglcontextrestored',()=>location.reload());\nwindow.WeatherProteanCloudsTeacher={qa,getState:()=>({playing,timeS,fullQuality,codeOpen:$('#code').classList.contains('open'),mouse:mouse.slice()}),setPlaying,setTime,restart,setCode,setFullQuality,setMousePixels,centerMouse,capture:()=>canvas.toDataURL(),gl:()=>gl};\n(async()=>{try{gl=canvas.getContext('webgl2',{alpha:false,antialias:false,depth:false,powerPreference:'high-performance',preserveDrawingBuffer:true});if(!gl)throw Error('WebGL2 unavailable: exact Protean teacher requires WebGL2');qa.context='webgl2';initProgram();resize();centerMouse();last=performance.now();raf=requestAnimationFrame(tick)}catch(e){fail(e)}})();\n})();<\/script><\/body><\/html>", "lab": "<!doctype html><html lang=\"zh-CN\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>Weather Mother R34 实时云实验<\/title><style>\n*{box-sizing:border-box}html{color-scheme:dark}body{margin:0;background:#142737;color:#edf6fb;font:15px/1.6 system-ui,\"Microsoft YaHei\",sans-serif}main{max-width:1500px;margin:auto;padding:96px 24px 40px}h1{font-size:25px;margin:0 0 6px}h2{font-size:19px;margin:0 0 12px}.lead,.hint{color:#b8cfdf;margin:6px 0 16px}.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:16px 0}button,select{font:inherit;border-radius:9px;padding:8px 13px;background:#254b63;border:1px solid #497089;color:inherit;cursor:pointer}button:hover{background:#36627d}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #bde6ff;outline-offset:3px}input[type=checkbox]{width:17px;height:17px;vertical-align:middle}.views{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}.views.comparing{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.view{overflow:hidden;border:1px solid #3c5f76;border-radius:15px;background:#0d2030}.view header{padding:10px 16px;display:flex;justify-content:space-between;align-items:center}canvas,video{display:block;width:100%;aspect-ratio:16/9;background:#0e2334;object-fit:contain}canvas{touch-action:none}video{max-height:none}.hud{padding:10px 14px;background:#173448;font:13px/1.6 ui-monospace,Consolas,monospace;min-height:42px}.card{background:#203b4d;border:1px solid #385569;border-radius:15px;padding:20px;margin:18px 0}.parameters{display:flex;gap:22px;align-items:center;flex-wrap:wrap}.parameters label{min-width:200px}.parameters input{width:120px;vertical-align:middle}.parameters output{font-variant-numeric:tabular-nums;padding-left:6px}.note{font-size:13px;color:#a8c8dc}#error{display:none;white-space:pre-wrap;color:#ffd0c1}#error:not(:empty){display:block}table{width:100%;border-collapse:collapse;text-align:left}th,td{padding:9px 12px;border-bottom:1px solid #3a5669;vertical-align:top}th{color:#a9d4ee}pre{white-space:pre-wrap;word-break:break-word;max-height:520px;overflow:auto;font:12px/1.6 ui-monospace,Consolas,monospace}summary{cursor:pointer;color:#b5dfff}#referencePane[hidden]{display:none}.pill{font-size:12px;border:1px solid #547286;border-radius:16px;padding:3px 10px}.buttonrow{display:flex;gap:10px;flex-wrap:wrap}#measureResult{white-space:pre-wrap}.disabled{opacity:.5}@media(max-width:800px){main{padding:100px 12px 24px}.views.comparing{grid-template-columns:1fr}.card{padding:15px}table{font-size:12px}th,td{padding:7px}.parameters label{min-width:180px}}\n<\/style><\/head><body><main>\n<h1>Weather Mother · R34 实时云实验<\/h1><p class=\"lead\">老师录像已移除。这里直接运行云代码，原式与天气参数实验均保留。<\/p>\n<div class=\"toolbar\"><label>运行模式 <select id=\"renderer\"><option value=\"teacher\">新云原代码 · 原式运行<\/option><option value=\"weather\">Weather Mother · 解析云融合实验<\/option><\/select><\/label><button id=\"play\">暂停<\/button><button id=\"reset\">从头运行<\/button><label>渲染尺寸 <select id=\"renderSize\"><option value=\"native\">随窗口<\/option><option value=\"960x540\">960×540<\/option><option value=\"1280x720\">1280×720<\/option><option value=\"1576x898\">1576×898 · 原截图像素<\/option><option value=\"1920x1080\">1920×1080<\/option><\/select><\/label><label><input type=\"checkbox\" id=\"fullResolution\" checked>原生像素<\/label><span class=\"pill\" id=\"compileState\">正在编译新云代码<\/span><\/div>\n<div class=\"views\" id=\"views\"><section class=\"view\"><header><strong id=\"liveTitle\">新云原代码 · 实时 WebGL<\/strong><span>实时渲染<\/span><\/header><canvas id=\"cloudCanvas\" aria-label=\"新云代码实时生成的云\" tabindex=\"0\"><\/canvas><div class=\"hud\" id=\"metrics\" aria-live=\"off\">准备渲染…<\/div><\/section><\/div>\n<pre id=\"error\" role=\"alert\"><\/pre>\n<div class=\"card\"><div class=\"parameters\"><label>时间 <input id=\"time\" type=\"range\" min=\"0\" max=\"30\" step=\"0.01\" value=\"0\"><output id=\"timeValue\">0.00 s<\/output><\/label><label id=\"densityLabel\">云密度 <input id=\"density\" type=\"range\" min=\"0.3\" max=\"1.5\" step=\"0.01\" value=\"1\"><output id=\"densityValue\">1.00<\/output><\/label><label id=\"windLabel\">云平移 <input id=\"wind\" type=\"range\" min=\"0\" max=\"2\" step=\"0.05\" value=\"0.25\"><output id=\"windValue\">0.25<\/output><\/label><label id=\"evolutionLabel\">形变速度 <input id=\"evolution\" type=\"range\" min=\"0\" max=\"2\" step=\"0.05\" value=\"1\"><output id=\"evolutionValue\">1.00<\/output><\/label><\/div><p class=\"note\" id=\"modeNote\">原式模式保留全部着色器公式、相机与天空。拖动画布对应原代码 iMouse；按空格比较轮廓项与厚度项，按 S 切换背景。密度、平移、形变参数用于融合实验。<\/p><div class=\"buttonrow\"><button id=\"measure\">测量当前模式 · 8 秒<\/button><button id=\"openWeather\">进入原天气 · 历史混合实验<\/button><\/div><p class=\"note\" id=\"measureResult\">FPS 来自实时提交的画面；录像帧率不计入。本版没有录像解码和播放。不同表示和画质的 FPS 不作为等质量提速证据。<\/p><\/div>\n<section class=\"card\"><h2>本版实际进展<\/h2><table><thead><tr><th>工作项<\/th><th>已经接入的内容<\/th><th>当前验收<\/th><\/tr><\/thead><tbody><tr><td>新代码跑通<\/td><td>完整原 GLSL 接到 WebGL2，补齐时间、分辨率、鼠标与键盘纹理；实时暂停、拖动和复位。<\/td><td id=\"sourceAcceptance\">保留既有代码；当前页面正在检查编译与实际绘制<\/td><\/tr><tr><td>老师录像清理<\/td><td>录像文件、内嵌视频数据及播放器均已移除，老师代码与学习记录保留。<\/td><td>R34 精简：无录像、无旧飞机；程序噪声在独立云海页运行。<\/td><\/tr><tr><td>低成本表示并入天气实验<\/td><td>解析交点 + 轮廓/厚度透明度 + 多尺度噪声，接入三团云、蓝天空、密度、统一演化时钟与平移。<\/td><td id=\"fusionAcceptance\">本机已跑通；仅外部观察，不支持穿云和体积光路，尚未替换全天气表示。<\/td><\/tr><tr><td>原天气残影实验<\/td><td>保留同一体积云，提供“旧混合 / 形变感知 / 无历史”切换。新策略按秒衰减历史，变化云边减少历史权重。<\/td><td>三种策略已在浏览器跑通。自然度与残影改善仍需对照验收。<\/td><\/tr><tr><td>性能<\/td><td>实时 FPS、帧间隔 P95、GPU 时间（支持时）、内部像素尺寸；8 秒独立模式测量。<\/td><td id=\"performanceAcceptance\">R31 历史实测（不是本次重测）：1576×898、从 0 秒测 8 秒，原式 / 融合实验均约 60 FPS，P95 16.9 ms。原体积天气另读约 30 FPS；不同表示，不是同画质提速证明。<\/td><\/tr><\/tbody><\/table><\/section>\n<section class=\"card\"><h2>并入 Weather Mother 的知识<\/h2><p>解析云把“射线是否命中”先算出来，再用少量噪声估算轮廓与厚度，适合作为外部观察和远云的候选表示。原天气的近云、穿云与遮挡仍需要体积采样。两种表示的质量边界应分别验收。<\/p><p>云会形变时，上一帧颜色并不一定属于当前云边。历史混合应按实际经过的时间衰减，并降低变化轮廓的信任；平移重投影不能独自解决形变。<\/p><p class=\"note\">本实验云的半径、位置与密度都是无量纲的显示参数，不是测量或真实云尺度。原式源代码署名及 CC BY-NC-SA 注释保留，当前作为研究运行。<\/p><details><summary>查看本次运行的原 GLSL 代码<\/summary><pre id=\"sourceCode\">// Gardner textured ellipsoids - https://www.cs.drexel.edu/~david/Classes/Papers/p297-gardner.pdf + bib\n\nvec3 R = vec3(2.,4.,2.);              // ellipsoid radius\nvec3 L = normalize(vec3(-.4,0.,1.));  // light source\n#define AMBIENT .4\t\t\t\t\t  // ambient luminosity\n\n#define ANIM true\n#define PI 3.1415927\nvec4 FragColor;\n\nbool keyToggle(int ascii) {\n\treturn (texture(iChannel2,vec2((.5+float(ascii))/256.,0.75)).x &gt; 0.);\n}\n\n// --- noise functions from https://www.shadertoy.com/view/XslGRr\n// Created by inigo quilez - iq/2013\n// License Creative Commons Attribution-NonCommercial-ShareAlike 3.0 Unported License.\n\nmat3 m = mat3( 0.00,  0.80,  0.60,\n              -0.80,  0.36, -0.48,\n              -0.60, -0.48,  0.64 );\n\nfloat hash( float n )    // in [0,1]\n{\n    return fract(sin(n)*43758.5453);\n}\n\nfloat noise( in vec3 x ) // in [0,1]\n{\n    vec3 p = floor(x);\n    vec3 f = fract(x);\n\n    f = f*f*(3.0-2.0*f);\n\n    float n = p.x + p.y*57.0 + 113.0*p.z;\n\n    float res = mix(mix(mix( hash(n+  0.0), hash(n+  1.0),f.x),\n                        mix( hash(n+ 57.0), hash(n+ 58.0),f.x),f.y),\n                    mix(mix( hash(n+113.0), hash(n+114.0),f.x),\n                        mix( hash(n+170.0), hash(n+171.0),f.x),f.y),f.z);\n    return res;\n}\n\nfloat fbm( vec3 p )    // in [0,1]\n{\n\tif (ANIM) p += iTime;\n    float f;\n    f  = 0.5000*noise( p ); p = m*p*2.02;\n    f += 0.2500*noise( p ); p = m*p*2.03;\n    f += 0.1250*noise( p ); p = m*p*2.01;\n    f += 0.0625*noise( p );\n    return f;\n}\n// --- End of Created by inigo quilez\n\nfloat snoise( in vec3 x ) // in [-1,1]\n{ return 2.*noise(x)-1.; }\n\nfloat sfbm( vec3 p )      // in [-1,1]\n{\n\tif (ANIM) p += iTime;\n    float f;\n    f  = 0.5000*snoise( p ); p = m*p*2.02;\n    f += 0.2500*snoise( p ); p = m*p*2.03;\n    f += 0.1250*snoise( p ); p = m*p*2.01;\n    f += 0.0625*snoise( p );\n    return f;\n}\n\n\n\n// --- view matrix when looking T from O with [-1,1]x[-1,1] screen at dist d\n\n\nmat3 lookat(vec3 O, vec3 T, float d) {\n\tmat3 M;\n\tvec3 OT = normalize(T-O);\n\tM[0] = OT;\n\tM[2] = normalize(vec3(0.,0.,1.)-OT.z*OT)/d;\n\tM[1] = cross(M[2],OT);\n\treturn M;\n}\n\n// --- ray -  ellipsoid intersection\n// if true, return P,N and thickness l\n\nbool intersect_ellipsoid(vec3 O, vec3 D, out vec3 P, out vec3 N, out float l) {\n\tvec3 OR = O/R, DR = D/R; // to space where ellipsoid is a sphere \n\t\t// P=O+tD &amp; |P|=1 -&gt; solve t in O^2 +2(O.D)t + D^2.t^2 = 1\n\tfloat OD = dot(OR,DR), OO=dot(OR,OR), DD=dot(DR,DR);\n\tfloat d = OD*OD - (OO-1.)*DD;\n\t\n\tif (!((d &gt;=0.)&amp;&amp;(OD&lt;0.)&amp;&amp;(OO&gt;1.))) return false;\n\t// ray intersects the ellipsoid (and not in our back)\n\t// note that t&gt;0 &lt;=&gt; -OD&gt;0 &amp;  OD^2 &gt; OD^ -(OO-1.)*DD -&gt; |O|&gt;1\n\t\t\n\tfloat t = (-OD-sqrt(d))/DD;\n\t// return intersection point, normal and thickness\n\tP = O+t*D;\n\tN=normalize(P/(R*R));\n\tl = 2.*sqrt(d)/DD;\n\n\treturn true;\n}\n\n// --- Gardner textured ellipsoids (sort of)\n\n// &#x27;s&#x27; index corresponds to Garner faked silhouette\n// &#x27;i&#x27; index corresponds to interior term faked by mid-surface\n\nfloat ks,ps, ki,pi;  // smoothness/thichness parameters\n\nfloat l;\nvoid draw_obj(vec3 O, mat3 M, vec2 pos, int mode) {\n\tvec3 D = normalize(M*vec3(1.,pos));\t\t// ray\n\t\n\tvec3 P,N; \n\tif (! intersect_ellipsoid(O,D, P,N,l)) return;\n\t\n\tvec3 Pm = P+.5*l*D,                \t\t// .5: deepest point inside cloud. \n\t\t Nm = normalize(Pm/(R*R)),     \t\t// it&#x27;s normal\n\t     Nn = normalize(P/R);\n\tfloat nl = clamp( dot(N,L),0.,1.), \t\t// ratio of light-facing (for lighting)\n\t\t  nd = clamp(-dot(Nn,D),0.,1.); \t// ratio of camera-facing (for silhouette)\n            // try 1.\n\n\tfloat ns = fbm(P), ni = fbm(Pm+10.);\n\tfloat A, l0 = 3.;\n\t//l += l*(l/l0-1.)/(1.+l*l/(l0*l0));     // optical depth modified at silhouette\n\tl = clamp(l-6.*ni,0.,1e10);\n\tfloat As = pow(ks*nd, ps), \t\t\t \t // silhouette\n\t\t  Ai = 1.-pow(.7,pi*l);              // interior\n\n\n\tAs =clamp(As-ns,0.,1.)*2.; // As = 2.*pow(As ,.6);\n\tif (mode==2) \n\t\tA = 1.- (1.-As)*(1.-Ai);  \t\t\t// mul Ti and Ts\n\telse\n\t\tA = (mode==0) ? Ai : As; \n\tA = clamp(A,0.,1.); \n\tnl = .8*( nl + ((mode==0) ? fbm(Pm-10.) : fbm(P+10.) ));\n\n\t#if 0 // noise bump\n\tN = normalize(N -.1*(dFdx(A)*M[1]+dFdy(A)*M[2])*iResolution.y); \n\tnl = clamp( dot(N,L),0.,1.);\n#endif\n\t\n\tvec4 col = vec4(mix(nl,1.,AMBIENT));\n\tFragColor = mix(FragColor,col,A);\n}\n\n// === main =============================================\n\nvoid mainImage( out vec4 fragColor, in vec2 fragCoord ) {\n\tfloat t = iTime;\n    vec2 uv = 2.*(fragCoord.xy / iResolution.y-vec2(.85,.5));\n\tvec2 mouse = 2.*(iMouse.xy / iResolution.xy - vec2(.85,.5));\n\tfloat z = .2;\n\tks = 1.+mouse.x, ps = mouse.y*8., ki, pi;\n\tks = 1.; ps = 3.;   ki = .9; pi = 3.;\n\t\n\tif (iMouse.z&gt;0.) {\n\t\tt = -PI/2.*mouse.x;\n\t\tz = -PI/2.*mouse.y;\n\t}\n\tvec3 O = vec3(-15.*cos(t)*cos(z),15.*sin(t)*cos(z),15.*sin(z));\t// camera\n\tfloat compas = t-.2*uv.x; vec2 dir = vec2(cos(compas),sin(compas));\n\tFragColor = (keyToggle(64+19)) \n\t\t? vec4(0.) \n\t\t: clamp(vec4(.6,.7+.3*dir,1.)*(uv.y+1.6)/1.8,0.,1.); \t\t// sky\n\n\tmat3 M = lookat(O,vec3(0.),5.); \n\tvec2 dx = vec2(1.,0.);\n\t\n\tif (!keyToggle(32))\n\t\tdraw_obj(O,M, uv, 2);\t\n\telse {\n\t\tdraw_obj(O,M, 1.5*(uv+dx), 0);\t\n\t\tdraw_obj(O,M, 1.5*(uv-dx), 1);\t\n\t}\n    \n   fragColor = FragColor; \n}\n<\/pre><\/details><details><summary>查看原天气改动与实验边界<\/summary><pre>R31 原天气实验（保留 R29/R30 原文件）\n1. 原天气仍运行原有体积云、采样步数、深度/透明度校验和邻域钳制。\n2. 旧策略：保留每帧最大 0.89 的历史混合。\n3. 新实验：基础权重 exp(-实际帧间隔 / 0.085 秒)。\n4. 当前透明度的屏幕梯度、前后透明度变化越明显，云边历史上限越低（0.28）。\n5. 按内部演化时间变化降低信任，保留原有循环相位信任。\n6. 选择无历史作为消融对照；它同时使用原系统的非时域采样，不构成只改一个变量的性能实验。\n7. GPU fence 提交调度、体积生成、光照缓存及像素尺寸保持原逻辑。\n边界：阈值是候选值，可能增加噪声或削弱降噪；尚未证明自然度、残影完全消除或等质量提速。\n低成本解析云模式尚未取代此体积渲染器。\n<\/pre><\/details><\/section>\n<\/main><script>\nconst TEACHER_SOURCE=\"// Gardner textured ellipsoids - https://www.cs.drexel.edu/~david/Classes/Papers/p297-gardner.pdf + bib\\n\\nvec3 R = vec3(2.,4.,2.);              // ellipsoid radius\\nvec3 L = normalize(vec3(-.4,0.,1.));  // light source\\n#define AMBIENT .4\\t\\t\\t\\t\\t  // ambient luminosity\\n\\n#define ANIM true\\n#define PI 3.1415927\\nvec4 FragColor;\\n\\nbool keyToggle(int ascii) {\\n\\treturn (texture(iChannel2,vec2((.5+float(ascii))/256.,0.75)).x > 0.);\\n}\\n\\n// --- noise functions from https://www.shadertoy.com/view/XslGRr\\n// Created by inigo quilez - iq/2013\\n// License Creative Commons Attribution-NonCommercial-ShareAlike 3.0 Unported License.\\n\\nmat3 m = mat3( 0.00,  0.80,  0.60,\\n              -0.80,  0.36, -0.48,\\n              -0.60, -0.48,  0.64 );\\n\\nfloat hash( float n )    // in [0,1]\\n{\\n    return fract(sin(n)*43758.5453);\\n}\\n\\nfloat noise( in vec3 x ) // in [0,1]\\n{\\n    vec3 p = floor(x);\\n    vec3 f = fract(x);\\n\\n    f = f*f*(3.0-2.0*f);\\n\\n    float n = p.x + p.y*57.0 + 113.0*p.z;\\n\\n    float res = mix(mix(mix( hash(n+  0.0), hash(n+  1.0),f.x),\\n                        mix( hash(n+ 57.0), hash(n+ 58.0),f.x),f.y),\\n                    mix(mix( hash(n+113.0), hash(n+114.0),f.x),\\n                        mix( hash(n+170.0), hash(n+171.0),f.x),f.y),f.z);\\n    return res;\\n}\\n\\nfloat fbm( vec3 p )    // in [0,1]\\n{\\n\\tif (ANIM) p += iTime;\\n    float f;\\n    f  = 0.5000*noise( p ); p = m*p*2.02;\\n    f += 0.2500*noise( p ); p = m*p*2.03;\\n    f += 0.1250*noise( p ); p = m*p*2.01;\\n    f += 0.0625*noise( p );\\n    return f;\\n}\\n// --- End of Created by inigo quilez\\n\\nfloat snoise( in vec3 x ) // in [-1,1]\\n{ return 2.*noise(x)-1.; }\\n\\nfloat sfbm( vec3 p )      // in [-1,1]\\n{\\n\\tif (ANIM) p += iTime;\\n    float f;\\n    f  = 0.5000*snoise( p ); p = m*p*2.02;\\n    f += 0.2500*snoise( p ); p = m*p*2.03;\\n    f += 0.1250*snoise( p ); p = m*p*2.01;\\n    f += 0.0625*snoise( p );\\n    return f;\\n}\\n\\n\\n\\n// --- view matrix when looking T from O with [-1,1]x[-1,1] screen at dist d\\n\\n\\nmat3 lookat(vec3 O, vec3 T, float d) {\\n\\tmat3 M;\\n\\tvec3 OT = normalize(T-O);\\n\\tM[0] = OT;\\n\\tM[2] = normalize(vec3(0.,0.,1.)-OT.z*OT)/d;\\n\\tM[1] = cross(M[2],OT);\\n\\treturn M;\\n}\\n\\n// --- ray -  ellipsoid intersection\\n// if true, return P,N and thickness l\\n\\nbool intersect_ellipsoid(vec3 O, vec3 D, out vec3 P, out vec3 N, out float l) {\\n\\tvec3 OR = O/R, DR = D/R; // to space where ellipsoid is a sphere \\n\\t\\t// P=O+tD & |P|=1 -> solve t in O^2 +2(O.D)t + D^2.t^2 = 1\\n\\tfloat OD = dot(OR,DR), OO=dot(OR,OR), DD=dot(DR,DR);\\n\\tfloat d = OD*OD - (OO-1.)*DD;\\n\\t\\n\\tif (!((d >=0.)&&(OD<0.)&&(OO>1.))) return false;\\n\\t// ray intersects the ellipsoid (and not in our back)\\n\\t// note that t>0 <=> -OD>0 &  OD^2 > OD^ -(OO-1.)*DD -> |O|>1\\n\\t\\t\\n\\tfloat t = (-OD-sqrt(d))/DD;\\n\\t// return intersection point, normal and thickness\\n\\tP = O+t*D;\\n\\tN=normalize(P/(R*R));\\n\\tl = 2.*sqrt(d)/DD;\\n\\n\\treturn true;\\n}\\n\\n// --- Gardner textured ellipsoids (sort of)\\n\\n// 's' index corresponds to Garner faked silhouette\\n// 'i' index corresponds to interior term faked by mid-surface\\n\\nfloat ks,ps, ki,pi;  // smoothness/thichness parameters\\n\\nfloat l;\\nvoid draw_obj(vec3 O, mat3 M, vec2 pos, int mode) {\\n\\tvec3 D = normalize(M*vec3(1.,pos));\\t\\t// ray\\n\\t\\n\\tvec3 P,N; \\n\\tif (! intersect_ellipsoid(O,D, P,N,l)) return;\\n\\t\\n\\tvec3 Pm = P+.5*l*D,                \\t\\t// .5: deepest point inside cloud. \\n\\t\\t Nm = normalize(Pm/(R*R)),     \\t\\t// it's normal\\n\\t     Nn = normalize(P/R);\\n\\tfloat nl = clamp( dot(N,L),0.,1.), \\t\\t// ratio of light-facing (for lighting)\\n\\t\\t  nd = clamp(-dot(Nn,D),0.,1.); \\t// ratio of camera-facing (for silhouette)\\n            // try 1.\\n\\n\\tfloat ns = fbm(P), ni = fbm(Pm+10.);\\n\\tfloat A, l0 = 3.;\\n\\t//l += l*(l/l0-1.)/(1.+l*l/(l0*l0));     // optical depth modified at silhouette\\n\\tl = clamp(l-6.*ni,0.,1e10);\\n\\tfloat As = pow(ks*nd, ps), \\t\\t\\t \\t // silhouette\\n\\t\\t  Ai = 1.-pow(.7,pi*l);              // interior\\n\\n\\n\\tAs =clamp(As-ns,0.,1.)*2.; // As = 2.*pow(As ,.6);\\n\\tif (mode==2) \\n\\t\\tA = 1.- (1.-As)*(1.-Ai);  \\t\\t\\t// mul Ti and Ts\\n\\telse\\n\\t\\tA = (mode==0) ? Ai : As; \\n\\tA = clamp(A,0.,1.); \\n\\tnl = .8*( nl + ((mode==0) ? fbm(Pm-10.) : fbm(P+10.) ));\\n\\n\\t#if 0 // noise bump\\n\\tN = normalize(N -.1*(dFdx(A)*M[1]+dFdy(A)*M[2])*iResolution.y); \\n\\tnl = clamp( dot(N,L),0.,1.);\\n#endif\\n\\t\\n\\tvec4 col = vec4(mix(nl,1.,AMBIENT));\\n\\tFragColor = mix(FragColor,col,A);\\n}\\n\\n// === main =============================================\\n\\nvoid mainImage( out vec4 fragColor, in vec2 fragCoord ) {\\n\\tfloat t = iTime;\\n    vec2 uv = 2.*(fragCoord.xy / iResolution.y-vec2(.85,.5));\\n\\tvec2 mouse = 2.*(iMouse.xy / iResolution.xy - vec2(.85,.5));\\n\\tfloat z = .2;\\n\\tks = 1.+mouse.x, ps = mouse.y*8., ki, pi;\\n\\tks = 1.; ps = 3.;   ki = .9; pi = 3.;\\n\\t\\n\\tif (iMouse.z>0.) {\\n\\t\\tt = -PI/2.*mouse.x;\\n\\t\\tz = -PI/2.*mous \\\"><details open><summary>新增云体细节<\\/summary><div class=\\\"row\\\"><label for=\\\"enhanced\\\">细节强度<\\/label><input id=\\\"enhanced\\\" type=\\\"range\\\" min=\\\"0\\\" max=\\\"1\\\" step=\\\".01\\\" value=\\\".8\\\"><output id=\\\"enhancedValue\\\">80%<\\/output><\\/div><button id=\\\"enhancedReset\\\">回到原云效果<\\/button><p class=\\\"hint\\\">保留原天气与云形。细节同时影响云内透光与近处遮光。<\\/p><\\/details><p class=\\\"lede\\\" id=\\\"description\\\">层叠云峰、柔软边缘与连续日照。<\\/p><div class=\\\"row\\\"><label for=\\\"weather\\\">天气案例<\\/label><select id=\\\"weather\\\"><option value=\\\"fair\\\">晴日积云<\\/option><option value=\\\"coast\\\">海岸层积云<\\/option><option value=\\\"mountain\\\">山间湿雾<\\/option><option value=\\\"rain\\\">阴天降雨<\\/option><option value=\\\"storm\\\">深对流雷暴<\\/option><option value=\\\"rainbow\\\">雨过天晴 · 彩虹<\\/option><option value=\\\"snow\\\">雪与低云<\\/option><option value=\\\"high\\\">高空冰云<\\/option><option value=\\\"iridescent\\\">七彩薄云 · 虹彩<\\/option><option value=\\\"irisEdge\\\">七彩云缘 · 日照<\\/option><option value=\\\"lenticular\\\">山前荚状云<\\/option><option value=\\\"mackerel\\\">鱼鳞状卷积云<\\/option><option value=\\\"dawn\\\">晨光低云<\\/option><option value=\\\"sunset\\\">落日积云<\\/option><option value=\\\"fogbank\\\">湿雾云海<\\/option><option value=\\\"nightstorm\\\">夜间雷暴<\\/option><option value=\\\"warmfront\\\">暖锋云幕<\\/option><option value=\\\"coldfront\\\">冷锋过境<\\/option><option value=\\\"squall\\\">飑线雷暴<\\/option><option value=\\\"typhoon\\\">台风云系 · 组织预览<\\/option><\\/select><\\/div><div class=\\\"row\\\"><label for=\\\"kind\\\">云属<\\/label><select id=\\\"kind\\\"><option value=\\\"Cu\\\">积云 Cu<\\/option><option value=\\\"Cb\\\">积雨云 Cb<\\/option><option value=\\\"Sc\\\">层积云 Sc<\\/option><option value=\\\"St\\\">层云 St<\\/option><option value=\\\"Ns\\\">雨层云 Ns<\\/option><option value=\\\"Ac\\\">高积云 Ac<\\/option><option value=\\\"As\\\">高层云 As<\\/option><option value=\\\"Ci\\\">卷云 Ci<\\/option><option value=\\\"Cc\\\">卷积云 Cc<\\/option><option value=\\\"Cs\\\">卷层云 Cs<\\/option><\\/select><\\/div><div class=\\\"times\\\"><button data-hour=\\\"6.6\\\">清晨<\\/button><button data-hour=\\\"12\\\">正午<\\/button><button data-hour=\\\"17.5\\\">黄昏<\\/button><button data-hour=\\\"22\\\">月夜<\\/button><\\/div><div class=\\\"row\\\"><label for=\\\"hour\\\">时刻<\\/label><input id=\\\"hour\\\" type=\\\"range\\\" min=\\\"0\\\" max=\\\"24\\\" step=\\\"0.05\\\" value=\\\"16\\\"><output><\\/output><\\/div><div class=\\\"row\\\"><label for=\\\"density\\\">浓度<\\/label><input id=\\\"density\\\" type=\\\"range\\\" min=\\\"0\\\" max=\\\"2\\\" step=\\\"0.01\\\" value=\\\"0.86\\\"><output><\\/output><\\/div><div class=\\\"row\\\"><label for=\\\"count\\\">云团数<\\/label><input id=\\\"count\\\" type=\\\"range\\\" min=\\\"1\\\" max=\\\"9\\\" step=\\\"1\\\" value=\\\"3\\\"><output><\\/output><\\/div><div class=\\\"row\\\"><label for=\\\"wind\\\">风力 m/s<\\/label><input id=\\\"wind\\\" type=\\\"range\\\" min=\\\"0\\\" max=\\\"80\\\" step=\\\"1\\\" value=\\\"12\\\"><output><\\/output><\\/div><div class=\\\"row\\\"><label for=\\\"cloudSpeed\\\">云速 m/s<\\/label><input id=\\\"cloudSpeed\\\" type=\\\"range\\\" min=\\\"0\\\" max=\\\"250\\\" step=\\\"1\\\" value=\\\"12\\\"><output><\\/output><\\/div><div class=\\\"row\\\"><label for=\\\"direction\\\">来风方向<\\/label><input id=\\\"direction\\\" type=\\\"range\\\" min=\\\"0\\\" max=\\\"360\\\" step=\\\"1\\\" value=\\\"270\\\"><output><\\/output><\\/div><details id=\\\"cycloneSection\\\"><summary>台风与旋转风暴<\\/summary>\\n<div class=\\\"row\\\"><label for=\\\"cycloneSpin\\\">旋转强度<\\/label><input id=\\\"cycloneSpin\\\" type=\\\"range\\\" min=\\\"0\\\" max=\\\"2.5\\\" step=\\\".02\\\" value=\\\"1\\\"><output><\\/output><\\/div>\\n<div class=\\\"row\\\"><label for=\\\"eyeRadius\\\">风眼半径<\\/label><input id=\\\"eyeRadius\\\" type=\\\"range\\\" min=\\\"1.2\\\" max=\\\"3.8\\\" step=\\\".05\\\" value=\\\"2.2\\\"><output><\\/output><\\/div>\\n<div class=\\\"row\\\"><label for=\\\"rainbandCurl\\\">雨带弯曲<\\/label><input id=\\\"rainbandCurl\\\" type=\\\"range\\\" min=\\\".4\\\" max=\\\"2\\\" step=\\\".02\\\" value=\\\"1\\\"><output><\\/output><\\/div>\\n<div class=\\\"row\\\"><label for=\\\"stormRadius\\\">云系半径<\\/label><input id=\\\"stormRadius\\\" type=\\\"range\\\" min=\\\"7\\\" max=\\\"11\\\" step=\\\".1\\\" value=\\\"10\\\"><output><\\/output><\\/div>\\n<p class=\\\"hint\\\">风眼、眼墙和螺旋雨带由同一旋转场组织。当前是可操作的体积外观模型，没有气压、海温、科氏力或数值天气求解。<\\/p><\\/details><details open id=\\\"irisSection\\\"><summary>七彩云 · 云体虹彩<\\/summary>\\n<label class=\\\"check\\\"><input id=\\\"iridescence\\\" type=\\\"checkbox\\\">启用近太阳方向的云体虹彩<\\/label>\\n<div class=\\\"row\\\"><label for=\\\"iriStrength\\\">彩色强度<\\/label><input id=\\\"iriStrength\\\" type=\\\"range\\\" min=\\\"0\\\" max=\\\"2\\\" step=\\\".02\\\" value=\\\"0\\\"><output><\\/output><\\/div>\\n<div class=\\\"row\\\"><label for=\\\"dropletRadius\\\">滴半径 μm<\\/label><input id=\\\"dropletRadius\\\" type=\\\"range\\\" min=\\\"1\\\" max=\\\"16\\\" step=\\\".1\\\" value=\\\"6\\\"><output><\\/output><\\/div>\\n<div class=\\\"row\\\"><label for=\\\"dropletSpread\\\">粒径离散<\\/label><input id=\\\"dropletSpread\\\" type=\\\"range\\\" min=\\\"0\\\" max=\\\"1\\\" step=\\\".02\\\" value=\\\".12\\\"><output><\\/output><\\/div>\\n<button id=\\\"aimIris\\\">对准七彩云观察角度<\\/button>\\n<p class=\\\"hint\\\">多波段衍射外观近似。色彩取决于日照角、滴径和云体光学厚度，随观察方向变化。没有彩色图片贴片。<\\/p><\\/details><details open id=\\\"loopSection\\\"><summary>连续形态循环<\\/summary>\\n<label class=\\\"check\\\"><input id=\\\"loopEnabled\\\" type=\\\"checkbox\\\" checked>同一种子无缝演化<\\/label>\\n<div class=\\\"row\\\"><label for=\\\"loopSeconds\\\">周期 秒<\\/label><input id=\\\"loopSeconds\\\" type=\\\"range\\\" min=\\\"12\\\" max=\\\"300\\\" step=\\\"1\\\" value=\\\"60\\\"><output><\\/output><\\/div>\\n<div class=\\\"row\\\"><label for=\\\"loopAmount\\\">变化幅度<\\/label><input id=\\\"loopAmount\\\" type=\\\"range\\\" min=\\\"0\\\" max=\\\"1\\\" step=\\\".01\\\" value=\\\".6\\\"><output><\\/output><\\/div>\\n<div class=\\\"row\\\"><label for=\\\"loopPhase\\\">循环进度<\\/label><input id=\\\"loopPhase\\\" type=\\\"range\\\" min=\\\"0\\\" max=\\\"100\\\" step=\\\".1\\\" value=\\\"0\\\"><output>0%<\\/output><\\/div>\\n<div class=\\\"buttons\\\"><button id=\\\"loopPause\\\">冻结形态<\\/button><button id=\\\"loopRestart\\\">回到循环起点<\\/button><\\/div>\\n<p class=\\\"hint\\\">云体在生长与消散间连续变化；种子身份保持。周期按 1×、内部演化 1× 计算。漂移与日照独立，全局暂停可冻结画面。<\\/p><\\/details>\\n<details id=\\\"perfSection\\\"><summary>性能与空区优化<\\/summary><label class=\\\"check\\\"><input id=\\\"fastEmpty\\\" type=\\\"checkbox\\\" checked>保守空区排除，保留原采样数<\\/label>\\n<label class=\\\"check\\\"><input id=\\\"skipEmpty\\\" type=\\\"checkbox\\\" checked>距离下界跳过确定为空的采样区<\\/label><pre id=\\\"perfReadout\\\" class=\\\"hint\\\" style=\\\"white-space:pre-wrap\\\">等待有效帧样本…<\\/pre><button id=\\\"perfReset\\\">重新测量<\\/button>\\n<p class=\\\"hint\\\">显示完成帧的实际速率及 P95 耗时。GPU 计时不受支持时显示不可用。优化不删除光照，也不偷偷降低分辨率。<\\/p><\\/details>\\n<details id=\\\"lightningSection\\\"><summary>雷电事件<\\/summary><label class=\\\"check\\\"><input id=\\\"lightningEnabled\\\" type=\\\"checkbox\\\">雷暴自动放电，包含闪光<\\/label>\\n<div class=\\\"row\\\"><label for=\\\"lightningRate\\\">每分钟事件<\\/label><input id=\\\"lightningRate\\\" type=\\\"range\\\" min=\\\"0\\\" max=\\\"20\\\" step=\\\"1\\\" value=\\\"6\\\"><output><\\/output><\\/div>\\n<div class=\\\"row\\\"><label for=\\\"lightningPower\\\">闪电亮度<\\/label><input id=\\\"lightningPower\\\" type=\\\"range\\\" min=\\\"0\\\" max=\\\"2\\\" step=\\\".01\\\" value=\\\".9\\\"><output><\\/output><\\/div>\\n<div class=\\\"row\\\"><label for=\\\"dischargeMode\\\">放电类型<\\/label><select id=\\\"dischargeMode\\\"><option value=\\\"auto\\\">混合事件<\\/option><option value=\\\"intra\\\">云内放电<\\/option><option value=\\\"ground\\\">云地放电<\\/option><\\/select><\\/div><button id=\\\"lightningOnce\\\">演示一次局部放电<\\/button><p class=\\\"hint\\\">连续分叉通道、短促复击与多点云内照亮。闪电仍待参考校准；台风眼、眼墙及雨带只有规则，尚无台风仿真。<\\/p><\\/details><details open><summary>风与运动<\\/summary><div class=\\\"row\\\"><label for=\\\"gust\\\">阵风起伏<\\/label><input id=\\\"gust\\\"
