<script>(()=>{'use strict';
const canvas=document.getElementById('c'),loading=document.getElementById('loading'),errorBox=document.getElementById('error'),$=s=>document.querySelector(s),clamp=(x,a,b)=>Math.max(a,Math.min(b,x));

    for(float f,s,t=2e2+sin(dot(x,x));--t>0.;p=.05*t*d)
        p.xz+=iTime,
        s=2.,
        f=p.w+1.-T-T-T-T,

}`;
const NOISE_DATA_URI='__NOISE_DATA_URI__';
const qa={version:'WM-R28-TINY-CLOUDS-TEACHER-20261001',ready:false,frames:0,errors:[],context:null,renderSize:[0,0],variance:0,formula:'lsBfDz-original-mainImage',teacherFormulaExact:true,teacherConstantsFrozen:true,raySteps:'199-200',textureTapsPerStep:4,noiseBytes:__NOISE_BYTES__,noiseGitBlob:'__NOISE_GIT_BLOB__',noiseSource:'tengbao/vanta gallery/noise.png compatible recovered asset',singleFileRuntime:true,pixelIdentityToUploadedVideo:false,visualAcceptance:false,realDeviceQA:false,productionReady:false};
let gl,program,buf,loc={},tex,playing=true,timeS=0,last=performance.now(),raf=0,fullQuality=false,lost=false,frameStamp=performance.now(),frameCount=0;
const VS=`#version 300 es
in vec2 a;void main(){gl_Position=vec4(a,0.,1.);}`;
const FS=`#version 300 es
precision highp float;
out vec4 fragColor;
uniform vec2 iResolution;
uniform float iTime;
uniform sampler2D iChannel0;
#define T texture(iChannel0,(s*p.zw+ceil(s*p.x))/2e2).y/(s+=s)*4.
void mainImage(out vec4 O,vec2 x){
    vec4 p,d=vec4(.8,0,x/iResolution.y-.8),c=vec4(.6,.7,d);
    O=c-d.w;
    for(float f,s,t=2e2+sin(dot(x,x));--t>0.;p=.05*t*d)
        p.xz+=iTime,
        s=2.,
        f=p.w+1.-T-T-T-T,
        f<0.?O+=(O-1.-f*c.zyxw)*f*.4:O;
}
void main(){mainImage(fragColor,gl_FragCoord.xy);}`;
function fail(e){const m=e&&e.message?e.message:String(e);qa.errors.push(m);qa.ready=false;loading.hidden=true;errorBox.textContent='老师云启动失败：'+m;errorBox.classList.add('open')}

function loadNoise(){return new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>{try{tex=gl.createTexture();gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,tex);gl.pixelStorei(gl.UNPACK_COLORSPACE_CONVERSION_WEBGL,gl.NONE);gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,false);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,img);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.REPEAT);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.REPEAT);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR_MIPMAP_LINEAR);gl.generateMipmap(gl.TEXTURE_2D);resolve()}catch(e){reject(e)}};img.onerror=()=>reject(Error('fixed noise texture decode failed'));img.src=NOISE_DATA_URI})}
function resize(){if(!gl)return;const mobile=innerWidth<=700||matchMedia('(pointer:coarse)').matches,scale=fullQuality?(mobile?.68:.82):(mobile?.39:.43),dpr=Math.min(devicePixelRatio||1,fullQuality?1.25:1),cap=fullQuality?(mobile?230000:520000):(mobile?90000:170000);let w=Math.max(1,Math.round(innerWidth*dpr*scale)),h=Math.max(1,Math.round(innerHeight*dpr*scale));const k=Math.min(1,Math.sqrt(cap/(w*h)));w=Math.max(1,Math.round(w*k));h=Math.max(1,Math.round(h*k));if(canvas.width===w&&canvas.height===h)return;canvas.width=w;canvas.height=h;qa.renderSize=[w,h];$('#size').textContent=w+'×'+h;gl.viewport(0,0,w,h)}
function draw(){if(!gl||lost||!program||!tex)return;gl.useProgram(program);gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,tex);gl.uniform1i(loc.iChannel0,0);gl.uniform2f(loc.iResolution,canvas.width,canvas.height);gl.uniform1f(loc.iTime,timeS);gl.drawArrays(gl.TRIANGLES,0,3);qa.frames++;frameCount++;if(qa.frames===3||qa.frames===8)measureVariance()}
function measureVariance(){try{const vals=[],w=canvas.width,h=canvas.height;for(let gy=1;gy<=4;gy++)for(let gx=1;gx<=6;gx++){const px=new Uint8Array(4);gl.readPixels(Math.floor(w*gx/7),Math.floor(h*gy/5),1,1,gl.RGBA,gl.UNSIGNED_BYTE,px);vals.push(px[0]+px[1]+px[2])}const mean=vals.reduce((a,b)=>a+b,0)/vals.length;qa.variance=vals.reduce((a,b)=>a+(b-mean)*(b-mean),0)/vals.length;qa.ready=qa.frames>=3&&qa.variance>4&&qa.errors.length===0;if(qa.ready)loading.hidden=true}catch(e){qa.errors.push(String(e))}}
function tick(now){raf=requestAnimationFrame(tick);const dt=clamp((now-last)/1000,0,.05);last=now;if(playing)timeS+=dt;draw();if(now-frameStamp>=1000){$('#fps').textContent=Math.round(frameCount*1000/(now-frameStamp));frameStamp=now;frameCount=0}}
function setPlaying(v){playing=!!v;$('#play').textContent=playing?'运行中':'已暂停';$('#play').setAttribute('aria-pressed',String(playing))}function setTime(v){timeS=Math.max(0,Number(v)||0);draw();return timeS}function restart(){timeS=0;setPlaying(true);draw()}function setCode(v){const open=!!v;$('#code').classList.toggle('open',open);$('#codeBtn').setAttribute('aria-pressed',String(open))}function setFullQuality(v){fullQuality=!!v;$('#quality').setAttribute('aria-pressed',String(fullQuality));resize();draw();return fullQuality}
$('#source').textContent=ORIGINAL_SOURCE;$('#play').onclick=()=>setPlaying(!playing);$('#restart').onclick=restart;$('#codeBtn').onclick=()=>setCode(!$('#code').classList.contains('open'));$('#closeCode').onclick=()=>setCode(false);$('#quality').onclick=()=>setFullQuality(!fullQuality);addEventListener('resize',resize);addEventListener('keydown',e=>{if(e.code==='Space'){setPlaying(!playing);e.preventDefault()}if(e.key==='Home'){restart();e.preventDefault()}});canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();lost=true;qa.ready=false;qa.errors.push('contextlost')});canvas.addEventListener('webglcontextrestored',()=>location.reload());
window.WeatherTinyCloudsTeacher={qa,getState:()=>({playing,timeS,fullQuality,codeOpen:$('#code').classList.contains('open')}),setPlaying,setTime,restart,setCode,setFullQuality,capture:()=>canvas.toDataURL(),gl:()=>gl};
(async()=>{try{gl=canvas.getContext('webgl2',{alpha:false,antialias:false,depth:false,powerPreference:'high-performance',preserveDrawingBuffer:true});if(!gl)throw Error('WebGL2 unavailable: exact teacher loop requires WebGL2');qa.context='webgl2';initProgram();resize();await loadNoise();last=performance.now();raf=requestAnimationFrame(tick)}catch(e){fail(e)}})();
})();</script></body></html>
