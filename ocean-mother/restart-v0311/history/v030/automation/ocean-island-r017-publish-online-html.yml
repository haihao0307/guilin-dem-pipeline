name: Ocean Island R017 verified online HTML

on:
  push:
    branches: [work/ocean-mother-handoff-20260901]
    paths: [.github/workflows/ocean-island-r017-publish-online-html.yml]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: ocean-island-r017-verified-online-html
  cancel-in-progress: false

jobs:
  verify-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Reconstruct R017 and repair paused geometry controls
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 - <<'PY'
          from pathlib import Path
          import base64,lzma,json,hashlib
          source=Path('ocean-mother/island-r017-build')
          b64=''.join((source/f'source.{i:02d}.b64').read_text().strip() for i in range(1,6))
          assert len(b64)==50496,len(b64)
          payload=base64.b64decode(b64,validate=True)
          assert len(payload)==37872,len(payload)
          digest=hashlib.sha256(payload).hexdigest()
          assert digest=='67c6dca047dbd17c1253ce55843f458dc80b3889a2f2f566a00ffb8fc9749092',digest
          data=json.loads(lzma.decompress(payload))
          root=Path('ocean-mother/island-r017');root.mkdir(parents=True,exist_ok=True)
          for name,content in data['runtime'].items():
              assert Path(name).name==name
              (root/name).write_text(content,encoding='utf-8')
          runner=data['qa_runner.py']
          app=(root/'app.mjs').read_text(encoding='utf-8')
          old="syncParams();if(m.kind==='geometry'){clearTimeout(geometryTimer);geometryTimer=setTimeout(()=>{geometryDirty=true;opaqueDirty=true},130)}"
          new="syncParams();if(m.kind==='geometry'){clearTimeout(geometryTimer);geometryDirty=true;opaqueDirty=true;geometryTimer=setTimeout(()=>{if(geometryDirty&&config.paused&&gl)rebuildWorld()},130)}"
          assert old in app
          app=app.replace(old,new,1)
          (root/'app.mjs').write_text(app,encoding='utf-8')
          old_test='page.evaluate("OceanIsland.setConfig(\'fireCount\',4);OceanIsland.setConfig(\'radius\',31)");page.wait_for_timeout(600)'
          new_test='page.evaluate("OceanIsland.setConfig(\'fireCount\',4);OceanIsland.setConfig(\'radius\',31)");page.wait_for_function("OceanIsland.getSources().length===4",timeout=20000)'
          assert old_test in runner
          runner=runner.replace(old_test,new_test,1)
          (source/'qa_runner.py').write_text(runner,encoding='utf-8')
          build=json.loads((root/'BUILD.json').read_text(encoding='utf-8'))
          build['runtimeRepair']='paused geometry controls commit synchronously before inspection'
          build['deliveryPolicy']='verified online HTML only'
          (root/'BUILD.json').write_text(json.dumps(build,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          files={p.name:{'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in sorted(root.iterdir()) if p.is_file()}
          Path('evidence/SOURCE.json').write_text(json.dumps({'status':'RECONSTRUCTED','payloadSha256':digest,'version':'0.3.0-island-r017','files':files,'published':False,'visualApproved':False},ensure_ascii=False,indent=2)+'\n')
          PY
          for f in ocean-mother/island-r017/*.mjs; do node --check "$f"; done
          node ocean-mother/island-r017/core.test.mjs | tee evidence/NODE_TESTS.txt
          node --input-type=module - <<'JS'
          import {PARAMS,GROUPS} from './ocean-mother/island-r017/params.mjs';
          import {writeFileSync} from 'node:fs';
          writeFileSync('ocean-mother/island-r017/PARAMETER_CATALOG.json',JSON.stringify({version:'0.3.0-island-r017',count:PARAMS.length,groups:GROUPS,parameters:PARAMS},null,2));
          JS
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('ocean-mother/island-r017')
          banned={'.png','.jpg','.jpeg','.webp','.gif','.hdr','.exr','.ktx','.ktx2','.glb','.gltf','.obj'}
          assert not [p for p in root.rglob('*') if p.suffix.lower() in banned]
          for p in root.iterdir():
              if p.is_file():
                  text=p.read_text(encoding='utf-8')
                  assert not re.search(r'data\s*:\s*image/',text,re.I),p
                  assert not re.search(r'https?://[^\s"\']+\.(?:png|jpe?g|webp|gif|hdr|exr|ktx2?)\b',text,re.I),p
          assert 'verified online HTML only' in (root/'BUILD.json').read_text(encoding='utf-8')
          PY

      - name: Install browser QA dependencies
        run: |
          python3 -m pip install --quiet playwright pillow
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk

      - name: Verify local desktop mobile controls and rendering
        run: |
          set -euo pipefail
          python3 -m http.server 8172 --bind 127.0.0.1 > evidence/local-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          python3 -u ocean-mother/island-r017-build/qa_runner.py http://127.0.0.1:8172/ocean-mother/island-r017/ evidence/local | tee evidence/LOCAL_QA_LOG.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          q=json.loads(Path('evidence/local/BROWSER_QA.json').read_text())
          assert q['status']=='PASS',q
          assert q['checks']['geometry_control_applies'] is True
          assert q['checks']['mobile_http_ready'] is True
          assert q['checks']['glass_flows_when_world_paused'] is True
          PY

      - name: Persist verified runtime on work branch
        run: |
          set -euo pipefail
          git config user.name 'Ocean Mother Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add ocean-mother/island-r017 ocean-mother/island-r017-build/qa_runner.py
          git commit -m 'feat(ocean): add verified R017 island online runtime'
          git push origin HEAD:work/ocean-mother-handoff-20260901

      - name: Publish R017 atomically to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,os,time,urllib.request
          from pathlib import Path
          repo='haihao0307/guilin-dem-pipeline';branch='gh-pages'
          source=Path('ocean-mother/island-r017');target='ocean-mother/island-r017'
          base='https://api.github.com/repos/'+repo;token=os.environ['GH_TOKEN']
          def api(path,body=None,method=None):
              req=urllib.request.Request(base+path,data=None if body is None else json.dumps(body).encode(),method=method or ('GET' if body is None else 'POST'),headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','Content-Type':'application/json','Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=90) as response:return json.load(response)
          head=api('/git/ref/heads/'+branch+'?nonce='+str(time.time_ns()))['object']['sha']
          base_tree=api('/git/commits/'+head)['tree']['sha'];entries=[];files={}
          for p in sorted(source.iterdir()):
              if not p.is_file():continue
              data=p.read_bytes();blob=api('/git/blobs',{'content':base64.b64encode(data).decode(),'encoding':'base64'})['sha']
              entries.append({'path':target+'/'+p.name,'mode':'100644','type':'blob','sha':blob})
              files[p.name]={'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'gitBlobSha':blob}
          tree=api('/git/trees',{'base_tree':base_tree,'tree':entries})['sha']
          commit=api('/git/commits',{'message':'feat(ocean): publish verified R017 island HTML','tree':tree,'parents':[head]})['sha']
          assert api('/git/ref/heads/'+branch+'?nonce='+str(time.time_ns()))['object']['sha']==head
          api('/git/refs/heads/'+branch,{'sha':commit,'force':False},'PATCH')
          assert api('/git/ref/heads/'+branch+'?nonce='+str(time.time_ns()))['object']['sha']==commit
          receipt={'status':'PUBLISHED','version':'0.3.0-island-r017','publicCommit':commit,'url':'https://haihao0307.github.io/guilin-dem-pipeline/ocean-mother/island-r017/','files':files,'forcePush':False,'persistentImageAssets':0,'visualApproved':False,'productionApproved':False}
          Path('evidence/PUBLISH.json').write_text(json.dumps(receipt,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(receipt,ensure_ascii=False,indent=2))
          PY

      - name: Verify public online HTML and interactions
        run: |
          set -euo pipefail
          URL='https://haihao0307.github.io/guilin-dem-pipeline/ocean-mother/island-r017/'
          ready=0
          for attempt in $(seq 1 36); do
            code=$(curl -L -sS -o evidence/public-index.html -w '%{http_code}' -H 'Cache-Control: no-cache' "${URL}?readback=$RANDOM-$attempt" || true)
            if [ "$code" = 200 ] && grep -q 'island-r017-additive-controls' evidence/public-index.html; then ready=1;break;fi
            sleep 10
          done
          test "$ready" = 1
          for file in index.html coast.css app.mjs core.mjs shaders.mjs params.mjs geometry.mjs BUILD.json PARAMETER_CATALOG.json; do
            test "$(curl -L -sS -o /dev/null -w '%{http_code}' -H 'Cache-Control: no-cache' "${URL}${file}?readback=$RANDOM")" = 200
          done
          python3 -u ocean-mother/island-r017-build/qa_runner.py "$URL" evidence/public | tee evidence/PUBLIC_QA_LOG.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          q=json.loads(Path('evidence/public/BROWSER_QA.json').read_text())
          assert q['status']=='PASS',q
          required=['http_200','ready','correct_identity','geometry_control_applies','mobile_http_ready','mobile_tabs_usable','deep_controls_present','deep_glass_skin_applied','return_to_island','no_request_failures','no_js_or_console_errors']
          assert all(q['checks'].get(k) for k in required),{k:q['checks'].get(k) for k in required}
          Path('evidence/ONLINE_HTML_VERIFIED.json').write_text(json.dumps({'status':'ONLINE_HTML_VERIFIED','url':'https://haihao0307.github.io/guilin-dem-pipeline/ocean-mother/island-r017/','desktop':True,'mobileViewport':True,'http200':True,'indexHtml':True,'interactive':True,'persistentImageAssets':0},ensure_ascii=False,indent=2)+'\n')
          PY

      - name: Preserve internal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ocean-island-r017-verified-online-html
          path: evidence/
          if-no-files-found: error
          retention-days: 90
          compression-level: 9
