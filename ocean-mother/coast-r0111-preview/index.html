<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Ocean Mother Coast R011.1 Preview</title>
  <style>
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#07131d;color:#eaf7ff;font:14px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    #stage{position:fixed;inset:0}
    iframe{display:block;width:100%;height:100%;border:0;background:#07131d}
    #status{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);max-width:min(720px,84vw);padding:16px 20px;border:1px solid rgba(169,224,255,.28);border-radius:14px;background:rgba(4,16,25,.88);box-shadow:0 18px 60px rgba(0,0,0,.4);text-align:center;white-space:pre-wrap}
    #status strong{display:block;margin-bottom:6px;font-size:17px}
    #status.error{color:#ffd9d9;border-color:rgba(255,132,132,.5)}
  </style>
</head>
<body>
  <main id="stage" aria-label="Ocean Mother Coast R011.1"></main>
  <div id="status"><strong>Ocean Mother Coast R011.1</strong>正在重建完整海岸工作台…</div>
  <script type="module">
    const status = document.querySelector('#status');
    const stage = document.querySelector('#stage');
    const payloads = Array.from({length:5},(_,i)=>`../coast-r011-payload/part${String(i+1).padStart(2,'0')}.b64`);

    function fail(error){
      console.error(error);
      status.classList.add('error');
      status.innerHTML = `<strong>工作台载入失败</strong>${String(error?.message || error)}`;
    }

    try{
      if(typeof DecompressionStream !== 'function'){
        throw new Error('当前浏览器缺少 DecompressionStream，请使用最新版 Chrome、Edge、Safari 或 Firefox。');
      }
      const chunks = await Promise.all(payloads.map(async url=>{
        const response = await fetch(url,{cache:'no-store'});
        if(!response.ok) throw new Error(`${url} 返回 HTTP ${response.status}`);
        return (await response.text()).trim();
      }));
      const encoded = chunks.join('').replace(/\s+/g,'');
      if(encoded.length !== 32156) throw new Error(`载荷长度异常：${encoded.length}`);
      const binary = atob(encoded);
      const packed = Uint8Array.from(binary,ch=>ch.charCodeAt(0));
      if(packed.byteLength !== 24115) throw new Error(`压缩载荷大小异常：${packed.byteLength}`);
      const stream = new Blob([packed]).stream().pipeThrough(new DecompressionStream('deflate'));
      const html = await new Response(stream).text();
      if(html.length !== 78062 || !html.includes('0.2.1-coast-r011.1') || !html.includes('coast-0.2.1-r011.1-daylight-complete')){
        throw new Error(`重建内容校验失败：${html.length} 字符`);
      }
      const frame = document.createElement('iframe');
      frame.title = 'Ocean Mother Coast R011.1 完整海岸工作台';
      frame.allow = 'fullscreen; autoplay';
      frame.addEventListener('load',()=>status.remove(),{once:true});
      frame.srcdoc = html;
      stage.append(frame);
    }catch(error){
      fail(error);
    }
  </script>
</body>
</html>
