<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#061521"><link rel="icon" href="data:,"><title>Ocean Mother · 海洋工作台</title><link rel="stylesheet" href="studio.css"></head><body>
<canvas id="sea" aria-label="Ocean Mother 实时三维海洋"></canvas>
<header id="mast"><div class="brand"><span class="sigil">O</span><div><h1>OCEAN MOTHER</h1><span>海洋工作台 / 第一版</span></div></div><div class="topActions"><button id="pause">暂停</button><button id="reset">重置视角</button><button id="togglePanel" aria-label="显示或隐藏参数">参数</button></div></header>
<aside id="panel"><div class="sectionHead">SEA STATE <span>海况与波形</span></div>
<div class="presets" id="presets"><button data-preset="breeze" class="active">晴日海风</button><button data-preset="calm">平静海面</button><button data-preset="swell">远洋涌浪</button><button data-preset="golden">金色黄昏</button><button data-preset="gale">阴天风浪</button><button data-preset="lagoon">青碧海水</button></div>
<div id="oceanControls"></div>
<details open><summary>日照与天气 <span>WEATHER LINK</span></summary><div class="times"><button data-hour="6.6">清晨</button><button data-hour="12">正午</button><button data-hour="17.4">黄昏</button><button data-hour="22">月夜</button></div><div class="row"><label for="weather">天气案例</label><select id="weather"><option value="fair">晴日积云</option><option value="coast">海岸层积云</option><option value="rain">阴天降雨</option><option value="storm">积雨云</option><option value="high">高空冰云</option><option value="rainbow">雨后天空</option><option value="snow">低层云幕</option><option value="mountain">湿润低云</option></select></div><div class="row"><label for="kind">云属</label><select id="kind"><option value="Cu">积云</option><option value="Cb">积雨云</option><option value="Sc">层积云</option><option value="St">层云</option><option value="Ns">雨层云</option><option value="Ac">高积云</option><option value="As">高层云</option><option value="Ci">卷云</option><option value="Cc">卷积云</option><option value="Cs">卷层云</option></select></div><div id="weatherControls"></div><div class="buttons"><button id="newSeed">新海浪种子</button><button id="cloudSeed">新云种子</button></div></details>
<details><summary>显示与校验 <span>RENDERING</span></summary><div class="row"><label for="quality">画质档位</label><select id="quality"><option value="balanced">流畅预览</option><option value="fine" selected>高画质</option><option value="ultra">精细检查</option></select></div><div id="viewControls"></div><label class="check"><input type="checkbox" id="foamEnabled" checked>波峰泡沫外观</label><label class="check"><input type="checkbox" id="reflections" checked>天气云层倒影</label><pre id="metrics">等待实际渲染数据</pre><button id="save">保存海况参数 JSON</button><p>海面为多尺度解析波候选。泡沫与透光是图形近似，尚未接入真实岸线、海底、潮汐或流体求解。</p><a id="weatherOriginal" href="weather/index.html" target="_blank" rel="noopener">打开原版 Weather Mother 工作台 ↗</a></details>
</aside>
<section id="titleCard"><div class="eyebrow">PROCEDURAL OCEAN LAB</div><h2 id="presetTitle">晴日海风</h2><p id="caption">长涌浪、局部风浪与微细波纹共同演化。</p></section>
<footer><span><i id="readyDot"></i><b id="status">读取天气内核</b></span><span id="source">Weather Mother Clean V1.0 · 同一日照与风场</span><span id="fps">计算中</span></footer>
<div id="loading"><strong>OCEAN MOTHER</strong><span id="loadingText">正在核验并生成三维天气场</span><small>首次进入需要生成云密度与光照缓存</small></div><pre id="error" hidden></pre><script src="weather-contract.js"></script><script src="ocean.js"></script></body></html>
