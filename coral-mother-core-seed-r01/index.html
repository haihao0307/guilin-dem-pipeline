<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08110f"><title>Coral Mother Core Seed R01</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#08110f;color:#eaf2ed;font:14px/1.6 system-ui,"Microsoft YaHei",sans-serif}main{height:100%;display:grid;place-items:center}section{width:min(430px,calc(100% - 36px));padding:26px;border:1px solid #334840;border-radius:16px;background:#0e1917;text-align:center;box-shadow:0 22px 70px #0008}.spin{width:50px;height:50px;margin:0 auto 14px;border:2px solid #466158;border-top-color:#e3eee8;border-radius:50%;animation:r 1s linear infinite}small{display:block;color:#8da198;margin-top:7px}.bar{height:4px;margin-top:16px;background:#ffffff10;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;width:20%;background:#9bc7b0;animation:p 1.8s ease-in-out infinite}@keyframes r{to{transform:rotate(1turn)}}@keyframes p{50%{width:90%}}</style></head><body><main><section><div class="spin"></div><b>Coral Mother · Core Mothers 正在启动</b><small>Blue Coral / 彩色珊瑚 / 鹿角 / Grammar / 审查总账</small><div class="bar"><i></i></div></section></main><script>(async()=>{try{if(!('DecompressionStream'in self))throw Error('浏览器不支持压缩工作台，请使用新版 Chrome / Edge');const names=["payload-00.txt","payload-01.txt","payload-02a.txt","payload-02b.txt","payload-03.txt","payload-04.txt"];let s='';for(const n of names){const r=await fetch(n,{cache:'no-store'});if(!r.ok)throw Error(n+' HTTP '+r.status);s+=await r.text()}const u=Uint8Array.from(atob(s.trim()),c=>c.charCodeAt(0));const t=await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).text();document.open();document.write(t);document.close()}catch(e){document.body.innerHTML='<main><section><b>Core Seed 启动失败</b><small>'+String(e.message||e)+'</small></section></main>';console.error(e)}})();</script></body></html>
