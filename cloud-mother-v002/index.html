<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cloud Mother V0.2</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#07101c;color:#eef7ff;font:12px system-ui,-apple-system,"Segoe UI",sans-serif}canvas{width:100%;height:100%;display:block}.p{position:fixed;z-index:3;top:12px;left:12px;width:244px;padding:12px 14px;border:1px solid #ffffff20;border-radius:14px;background:#071522ce;backdrop-filter:blur(12px);box-shadow:0 14px 42px #0008}.p h1{font-size:14px;letter-spacing:1.7px;margin:0 0 2px}.sub{opacity:.65;margin-bottom:9px}.r{display:grid;grid-template-columns:66px 1fr 32px;gap:7px;align-items:center;margin:5px 0}.r select,.r input{width:100%;min-width:0}.r select{grid-column:2/4;background:#132536;color:#eef7ff;border:1px solid #ffffff28;border-radius:7px;padding:5px}.r input{accent-color:#d8ebff}.v{text-align:right;opacity:.78;font-variant-numeric:tabular-nums}.b{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:9px}.b button{border:1px solid #ffffff28;border-radius:8px;background:#172d40;color:#eef7ff;padding:7px;cursor:pointer}.b button:hover{background:#24445f}.help{margin-top:7px;line-height:1.4;opacity:.55}.s{position:fixed;z-index:3;left:12px;bottom:12px;padding:7px 10px;border-radius:9px;background:#071522b5;backdrop-filter:blur(8px);font-variant-numeric:tabular-nums;opacity:.88}@media(max-width:600px){.p{width:214px;top:7px;left:7px;padding:9px 10px}.r{margin:3px 0}.s{left:7px;bottom:7px}}
</style></head><body><div class="p"><h1>CLOUD MOTHER · V0.2</h1><div class="sub">三维体积云 · 天气驱动 · 大气光学</div>
<div class="r"><label>天气</label><select id="weather"><option value="fair">晴空对流</option><option value="coast">湿润海岸</option><option value="warm">暖锋云幕</option><option value="rain">持续降雨</option><option value="storm" selected>强对流雷暴</option><option value="rainbow">雨后彩虹</option><option value="jet">高空急流</option></select></div>
<div class="r"><label>云属</label><select id="type"><option value="0">卷云 Ci</option><option value="1">卷积云 Cc</option><option value="2">卷层云 Cs</option><option value="3">高积云 Ac</option><option value="4">高层云 As</option><option value="5">雨层云 Ns</option><option value="6">层积云 Sc</option><option value="7">层云 St</option><option value="8">积云 Cu</option><option value="9" selected>积雨云 Cb</option></select></div>
<div class="r"><label>湿度</label><input id="humidity" type="range" min="0" max="1" step=".01"><span class="v"></span></div><div class="r"><label>不稳定度</label><input id="instability" type="range" min="0" max="1" step=".01"><span class="v"></span></div><div class="r"><label>降水</label><input id="rain" type="range" min="0" max="1" step=".01"><span class="v"></span></div><div class="r"><label>风切变</label><input id="shear" type="range" min="0" max="1" step=".01"><span class="v"></span></div><div class="r"><label>太阳高度</label><input id="sun" type="range" min="-5" max="75" step="1"><span class="v"></span></div><div class="r"><label>风速</label><input id="wind" type="range" min="0" max="1" step=".01"><span class="v"></span></div><div class="r"><label>观察高度</label><input id="alt" type="range" min=".08" max="9" step=".02"><span class="v"></span></div>
<div class="b"><button id="auto">根据天气生成</button><button id="pause">暂停演化</button></div><div class="help">拖动观察天空，滚轮改变视场。云体、云影、雨幕、闪电、彩虹和大气色彩全部实时生成。</div></div><div class="s" id="status"></div>
<script type="module" src="app.js?v=20260830b"></script></body></html>
