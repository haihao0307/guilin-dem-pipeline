<header><div><h1>KAOPU · WHITE OAK TEACHER R07</h1><div class="sub">Quercus alba · life grammar / self-organizing crown / staged roots</div></div><div class="sub">Mobile 3D · function graph</div></header>

</main>
<aside class="panel">
<h2>真实树老师：北美白栎 / White oak</h2>
<div class="note">开放地：短而粗的主干、宽阔崎岖树冠；林内：更高直主干、紧凑树冠。幼苗主根明显，随年龄逐渐转为发达的浅层侧根与纤维根系统。</div>

<script>
'use strict';
const $=id=>document.getElementById(id), C=$('view'), X=C.getContext('2d'), RC=$('ringCanvas'), RX=RC.getContext('2d'), TAU=Math.PI*2;
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const V={add:(a,b)=>a.map((v,i)=>v+b[i]),sub:(a,b)=>a.map((v,i)=>v-b[i]),mul:(a,s)=>a.map(v=>v*s),dot:(a,b)=>a.reduce((s,v,i)=>s+v*b[i],0),len:a=>Math.hypot(...a),norm:a=>{const l=Math.hypot(...a)||1;return a.map(v=>v/l)},cross:(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]]};
let P={age:80,light:.12,water:-.18,resource:.74,competition:.68,season:1,habitat:'open'};
let seed=70707,yaw=.20,pitch=.04,zoom=1.06,auto=false,playing=false,last=0,showRoots=false,showLeaves=true,colorMode=false;
let shootNodes=[],shootEdges=[],rootNodes=[],rootEdges=[],leafPoints=[],attractorStats={shoot:0,root:0};
function H(a,b=0){let x=Math.imul((a+b*157+seed)|0,1597334677);x^=x>>>15;x=Math.imul(x,3812015801);return((x^(x>>>16))>>>0)/4294967296}
function frame(d){let n=V.norm(V.cross(Math.abs(d[1])>.9?[1,0,0]:[0,1,0],d));return[n,V.norm(V.cross(d,n))]}
function randomUnit(k){let z=H(k,1)*2-1,a=H(k,2)*TAU,r=Math.sqrt(Math.max(0,1-z*z));return[r*Math.cos(a),z,r*Math.sin(a)]}
function addShoot(p,parent,birth,depth,dir){let id=shootNodes.length;shootNodes.push({p,parent,birth,depth,dir,load:1,terminal:true});if(parent>=0){shootNodes[parent].terminal=false;shootEdges.push({a:parent,b:id,birth,depth,load:1})}return id}
function addRoot(p,parent,birth,depth,dir){let id=rootNodes.length;rootNodes.push({p,parent,birth,depth,dir,load:1,terminal:true});if(parent>=0){rootNodes[parent].terminal=false;rootEdges.push({a:parent,b:id,birth,depth,load:1})}return id}
function crownEnvelope(age){let maturity=1-Math.exp(-age/48),height=(P.habitat==='open'?.92:1.16)*maturity,crownR=(P.habitat==='open'?.76:.34)*maturity,clear=(P.habitat==='open'?.16:.46)*height;return{maturity,height,crownR,clear}}
function makeCrownAttractors(env){let A=[],count=Math.floor(120+P.age*1.8);for(let i=0;i<count;i++){let t=H(i,11),ang=H(i,12)*TAU,rr=Math.sqrt(H(i,13)),y=env.clear+(env.height-env.clear)*(.05+.95*t);let profile=Math.pow(Math.sin(Math.PI*clamp((y-env.clear)/(env.height-env.clear),.02,.98)),.58);let rugged=.78+.28*Math.sin(ang*5+H(i,15)*2);let rad=env.crownR*rr*profile*rugged;let x=Math.cos(ang)*rad+P.light*.13*(y/env.height),z=Math.sin(ang)*rad;A.push({p:[x,y,z],alive:true})}return A}
function buildTrunk(env){shootNodes=[];shootEdges=[];let segments=Math.max(3,Math.floor(7+P.age/7)),parent=-1,p=[0,0,0],dir=[0,1,0];for(let i=0;i<segments;i++){let y=(i+1)/segments*(env.clear+.08*env.height),bend=P.light*.025*Math.pow(i/segments,1.4)+(H(i,20)-.5)*.008;dir=V.norm(V.add(dir,[bend,.08,(H(i,21)-.5)*.008]));p=V.add(p,V.mul(dir,(env.clear+.08*env.height)/segments));parent=addShoot(p,parent,Math.max(1,Math.round((i+1)/segments*Math.min(P.age,18))),0,dir)}return parent}
function colonizeShoot(env){let attractors=makeCrownAttractors(env),tip=buildTrunk(env),step=.026*(.72+.38*P.resource),influence=.17,kill=.045,maxIter=Math.min(72,Math.floor(10+P.age*.34));for(let iter=0;iter<maxIter&&attractors.length;iter++){let map=new Map(),keep=[];for(const a of attractors){let best=-1,bd=Infinity;for(let i=Math.max(0,shootNodes.length-520);i<shootNodes.length;i++){let d=V.len(V.sub(a.p,shootNodes[i].p));if(d<kill){bd=0;best=-1;break}if(d<influence&&d<bd){bd=d;best=i}}if(bd===0)continue;if(best>=0){if(!map.has(best))map.set(best,[]);map.get(best).push(V.norm(V.sub(a.p,shootNodes[best].p)))}keep.push(a)}attractors=keep;let created=0;for(const [ni,dirs] of map){if(shootNodes.length>720)break;let avg=[0,0,0];for(const d of dirs)avg=V.add(avg,d);avg=V.norm(avg);let n=shootNodes[ni],upBias=(P.habitat==='forest'?.18:.075)*(1-n.depth*.08),lightBias=[P.light*.10,upBias,0],memory=V.mul(n.dir,.28+.25*P.competition),j=randomUnit(ni*17+iter),noise=V.mul(j,.025*(1-P.competition));let dir=V.norm(V.add(V.add(avg,memory),V.add(lightBias,noise)));let q=V.add(n.p,V.mul(dir,step*Math.pow(.92,n.depth)));let parent=ni,depth=n.depth+(V.dot(dir,n.dir)<.93?1:0);let birth=Math.min(200,2+Math.round(iter*1.70));addShoot(q,parent,birth,Math.min(6,depth),dir);created++}if(!created)break}attractorStats.shoot=attractors.length}
function makeRootAttractors(env){let A=[],rootRadius=env.crownR*(P.habitat==='open'?2.05:1.78),count=Math.floor(140+P.age*1.5);for(let i=0;i<count;i++){let ang=H(i,31)*TAU,rr=Math.sqrt(H(i,32)),rad=rootRadius*rr,shallow=H(i,33)<.78;let y=shallow?-(.02+.18*Math.pow(H(i,34),1.8))*env.height:-(.16+.30*H(i,34))*env.height;let x=Math.cos(ang)*rad+P.water*.16*rootRadius*(1-rr),z=Math.sin(ang)*rad;A.push({p:[x,y,z]})}return A}
function buildRootStart(env){rootNodes=[];rootEdges=[];let root0=addRoot([0,0,0],-1,0,0,[0,-1,0]);let tips=[];let tap=root0,p=[0,0,0],tapN=P.age<15?6:(P.age<35?4:2),tapStep=.016+.020*env.maturity;for(let i=0;i<tapN;i++){let q=[P.water*.004*i,-(i+1)*tapStep,0];tap=addRoot(q,tap,Math.round((i+1)*1.2),0,V.norm(V.sub(q,p)));p=q}tips.push(tap);let lateralN=Math.max(4,Math.min(10,Math.floor(4+P.age/18)));for(let k=0;k<lateralN;k++){let a=TAU*k/lateralN+H(k,35)*.35,dir=V.norm([Math.cos(a),-.035,Math.sin(a)]),q=V.mul(dir,.018+.022*env.maturity);tips.push(addRoot(q,root0,Math.max(2,Math.round(2+k*.35)),0,dir))}return tips}
function colonizeRoots(env){let attractors=makeRootAttractors(env),tips=buildRootStart(env),step=.030*(.70+.42*P.resource),influence=.24,kill=.047,maxIter=Math.min(74,Math.floor(10+P.age*.34));for(let iter=0;iter<maxIter&&attractors.length;iter++){let map=new Map(),keep=[];for(const a of attractors){let best=-1,bd=Infinity;for(let i=Math.max(0,rootNodes.length-620);i<rootNodes.length;i++){let d=V.len(V.sub(a.p,rootNodes[i].p));if(d<kill){bd=0;break}if(d<influence&&d<bd){bd=d;best=i}}if(bd===0)continue;if(best>=0){if(!map.has(best))map.set(best,[]);map.get(best).push(V.norm(V.sub(a.p,rootNodes[best].p)))}keep.push(a)}attractors=keep;let created=0;for(const [ni,dirs] of map){if(rootNodes.length>760)break;let avg=[0,0,0];for(const d of dirs)avg=V.add(avg,d);avg=V.norm(avg);let n=rootNodes[ni],shallowBias=n.depth===0?[0,.055,0]:[0,-.018,0],waterBias=[P.water*.11,0,0],memory=V.mul(n.dir,.32),noise=V.mul(randomUnit(ni*29+iter),.035);let dir=V.norm(V.add(V.add(avg,memory),V.add(shallowBias,V.add(waterBias,noise))));let q=V.add(n.p,V.mul(dir,step*Math.pow(.9,n.depth)));let depth=n.depth+(V.dot(dir,n.dir)<.91?1:0),birth=Math.min(200,4+Math.round(iter*1.7));addRoot(q,ni,birth,Math.min(6,depth),dir);created++}if(!created)break}attractorStats.root=attractors.length}
function computeLoads(nodes,edges){for(const n of nodes)n.load=n.terminal?1:.2;for(let i=nodes.length-1;i>0;i--){let n=nodes[i];if(n.parent>=0)nodes[n.parent].load+=n.load}for(const e of edges)e.load=nodes[e.b].load}
function buildLeaves(){leafPoints=[];let env=crownEnvelope(P.age),visibleChild=new Set();for(const e of shootEdges)if(e.birth<=P.age)visibleChild.add(e.a);let terminals=shootNodes.filter((n,i)=>n.birth<=P.age&&!visibleChild.has(i)&&n.p[1]>Math.max(.015,env.clear*.32));for(const n of terminals){let amount=P.season===3?0:(P.season===0?5:8);for(let k=0;k<amount;k++){let r=randomUnit((n.parent<0?0:n.parent)*17+k),scale=(.0032+.0035*env.maturity)*(.65+.6*H(n.parent<0?0:n.parent,k+90));leafPoints.push({p:V.add(n.p,V.mul(r,(.005+.012*env.maturity)*(.7+.4*H(n.parent<0?0:n.parent,k+93)))),scale,birth:n.birth})}}}
function build(){let env=crownEnvelope(P.age);colonizeShoot(env);colonizeRoots(env);computeLoads(shootNodes,shootEdges);computeLoads(rootNodes,rootEdges);buildLeaves();$('status').textContent=`${shootNodes.length} shoot nodes · ${rootNodes.length} root nodes · ${leafPoints.length} leaf marks`;draw();drawRings()}
function fitScale(w,h){let maxY=.02,minY=-.02,maxR=.02;for(const n of shootNodes)if(n.birth<=P.age){maxY=Math.max(maxY,n.p[1]);maxR=Math.max(maxR,Math.hypot(n.p[0],n.p[2]))}if(showRoots)for(const n of rootNodes)if(n.birth<=P.age){minY=Math.min(minY,n.p[1]);maxR=Math.max(maxR,Math.hypot(n.p[0],n.p[2]))}let above=h*.60-72,below=h*.40-28,side=w*.48;return Math.max(45,Math.min(above/Math.max(.04,maxY),below/Math.max(.035,-minY),side/Math.max(.04,maxR)))/zoom}function project(p,w,h){let cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch),x=p[0]*cy-p[2]*sy,z=p[0]*sy+p[2]*cy,y=p[1],yy=y*cp-z*sp,zz=y*sp+z*cp,sc=fitScale(w,h),q=1/(1+zz*.34);return[w/2+x*sc*q,h*.60-yy*sc*q,zz,q]}
function seasonColor(depth){if(P.season===0)return depth>.6?'rgba(174,211,124,.88)':'rgba(133,190,87,.88)';if(P.season===1)return depth>.6?'rgba(96,164,63,.90)':'rgba(62,128,52,.90)';if(P.season===2)return depth>.6?'rgba(226,174,69,.90)':'rgba(176,105,49,.90)';return'rgba(0,0,0,0)'}
function draw(){let r=C.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,1.65),w=C.width=Math.round(r.width*dpr),h=C.height=Math.round(r.height*dpr);X.clearRect(0,0,w,h);let L=[];for(const e of shootEdges){if(e.birth>P.age)continue;let A=project(shootNodes[e.a].p,w,h),B=project(shootNodes[e.b].p,w,h);L.push({A,B,z:(A[2]+B[2])*.5,type:0,e})}if(showRoots)for(const e of rootEdges){if(e.birth>P.age)continue;let A=project(rootNodes[e.a].p,w,h),B=project(rootNodes[e.b].p,w,h);L.push({A,B,z:(A[2]+B[2])*.5,type:1,e})}L.sort((a,b)=>a.z-b.z);X.lineCap='round';for(const o of L){let age=Math.max(1,P.age-o.e.birth),load=o.e.load||1,baseLoad=o.type?Math.max(1,rootNodes[0].load):Math.max(1,shootNodes[0].load),ratio=clamp(load/baseLoad,.0001,1),th=o.type?(0.55+8.2*Math.pow(ratio,.42))*Math.pow(.86,o.e.depth):(0.60+9.0*Math.pow(ratio,.43))*Math.pow(.86,o.e.depth);th*=1+.035*Math.log1p(age);X.lineWidth=Math.max(.65,th*dpr);let fog=clamp((o.z+.8)/1.6,.25,1);let ageFrac=clamp(age/120,0,1),young=clamp(o.e.depth/6,0,1);if(colorMode){X.strokeStyle=o.type?`rgba(${Math.round(126+28*young)},${Math.round(105+38*young)},${Math.round(76+28*young)},${.48+.40*fog})`:`rgba(${Math.round(126+48*young)},${Math.round(93+56*young)},${Math.round(58+35*young)},${.56+.40*fog})`}else{X.strokeStyle=o.type?`rgba(163,176,168,${.43+.42*fog})`:`rgba(214,222,217,${.52+.44*fog})`};X.beginPath();X.moveTo(o.A[0],o.A[1]);X.lineTo(o.B[0],o.B[1]);X.stroke()}if(showLeaves&&P.season!==3){let pts=[];for(const l of leafPoints){if(l.birth>P.age)continue;let p=project(l.p,w,h);pts.push({p,l})}pts.sort((a,b)=>a.p[2]-b.p[2]);for(const q of pts){let light=clamp(.5+.45*(q.l.p[0]*P.light+q.l.p[1]),0,1);X.fillStyle=seasonColor(light);X.beginPath();X.ellipse(q.p[0],q.p[1],q.l.scale*w*.85,q.l.scale*w*.42,(q.l.p[0]+q.l.p[2])*8,0,TAU);X.fill()}}
let seedP=project([0,0,0],w,h),flare=(1.6+Math.min(P.age,140)*.010)*dpr;X.fillStyle='rgba(218,225,221,.75)';X.beginPath();X.ellipse(seedP[0],seedP[1],flare,flare*.42,0,0,TAU);X.fill();$('info').textContent=`T ${Math.round(P.age)}y · ${P.habitat==='open'?'open broad crown':'forest compact crown'} · root/crown area ≈ ${P.habitat==='open'?'4.6':'3.8'}:1`}
function drawRings(){let s=92*(devicePixelRatio||1),d=s/92;RC.width=RC.height=s;RX.clearRect(0,0,s,s);RX.fillStyle='#211b15';RX.fillRect(0,0,s,s);let max=Math.min(200,Math.round(P.age)),cx=s/2,cy=s/2;for(let y=1;y<=max;y++){let drought=(y%37>=25&&y%37<=30),gain=(.65+.42*P.resource)*(drought?.35:1),rad=(y/max)*40*d;RX.strokeStyle=drought?'rgba(82,54,32,.80)':'rgba(191,150,91,.55)';RX.lineWidth=Math.max(.35,gain*.7*d);RX.beginPath();RX.ellipse(cx,cy,rad*(1+.035*Math.sin(y*.7)),rad*(1-.025*Math.cos(y*.5)),0,0,TAU);RX.stroke()}RX.fillStyle='#5a3a21';RX.beginPath();RX.arc(cx,cy,3*d,0,TAU);RX.fill()}
function sync(){for(const k of ['age','light','water','resource','competition','season'])P[k]=+$(k).value;const seasons=['春','夏','秋','冬'];$('ageOut').textContent=Math.round(P.age)+' 年';$('lightOut').textContent=P.light.toFixed(2);$('waterOut').textContent=P.water.toFixed(2);$('resourceOut').textContent=P.resource.toFixed(2);$('competitionOut').textContent=P.competition.toFixed(2);$('seasonOut').textContent=seasons[P.season];build()}
for(const k of ['age','light','water','resource','competition','season'])$(k).oninput=()=>{playing=false;clearTimeout(window._r);window._r=setTimeout(sync,60)};
document.querySelectorAll('[data-habitat]').forEach(b=>b.onclick=()=>{P.habitat=b.dataset.habitat;document.querySelectorAll('[data-habitat]').forEach(x=>x.classList.toggle('on',x===b));build()});
$('roots').onclick=()=>{showRoots=!showRoots;$('roots').classList.toggle('on',showRoots);draw()};$('leaves').onclick=()=>{showLeaves=!showLeaves;$('leaves').classList.toggle('on',showLeaves);draw()};$('colorMode').onclick=()=>{colorMode=!colorMode;$('colorMode').classList.toggle('on',colorMode);draw()};$('rings').onclick=()=>{$('ringBox').classList.toggle('show');$('rings').classList.toggle('on')};$('orbit').onclick=()=>{auto=!auto;$('orbit').classList.toggle('on',auto)};$('front').onclick=()=>{yaw=.20;pitch=.04;zoom=1.06;draw()};$('play').onclick=()=>{P.age=1;$('age').value=1;playing=true};
let pointers=new Map(),pinch=0;C.onpointerdown=e=>{C.setPointerCapture(e.pointerId);pointers.set(e.pointerId,[e.clientX,e.clientY]);if(pointers.size===2){let p=[...pointers.values()];pinch=Math.hypot(p[0][0]-p[1][0],p[0][1]-p[1][1])}};C.onpointermove=e=>{if(!pointers.has(e.pointerId))return;let prev=pointers.get(e.pointerId);pointers.set(e.pointerId,[e.clientX,e.clientY]);if(pointers.size===1){yaw+=(e.clientX-prev[0])*.008;pitch=clamp(pitch+(e.clientY-prev[1])*.006,-.7,.8)}else{let p=[...pointers.values()],d=Math.hypot(p[0][0]-p[1][0],p[0][1]-p[1][1]);if(pinch)zoom=clamp(zoom*pinch/Math.max(1,d),.58,2.5);pinch=d}auto=false;$('orbit').classList.remove('on');draw()};function release(e){pointers.delete(e.pointerId);pinch=0}C.onpointerup=release;C.onpointercancel=release;C.onwheel=e=>{e.preventDefault();zoom=clamp(zoom*Math.exp(e.deltaY*.001),.58,2.5);draw()};
function tick(t){let dt=(t-last)/1000||0;last=t;if(auto){yaw+=dt*.15;draw()}if(playing){P.age=Math.min(200,P.age+dt*11);$('age').value=P.age;if(Math.floor(P.age)%3===0)sync();else draw();if(P.age>=200)playing=false}requestAnimationFrame(tick)}
addEventListener('resize',draw);sync();requestAnimationFrame(tick);
</script>
</body></html>
