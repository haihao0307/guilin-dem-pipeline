<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>KAOPU Tree Life R04</title><style>
*{box-sizing:border-box}body{margin:0;background:#101516;color:#e7ece9;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft Yahei",sans-serif}header{padding:12px 15px;border-bottom:1px solid #34403e;display:flex;justify-content:space-between;align-items:center}h1{font-size:17px;margin:0}.sub{font-size:10px;color:#8e9c98}.stage{height:68svh;min-height:520px;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 45%,#283230,#101516 70%)}canvas{width:100%;height:100%;display:block;touch-action:none}.bar{position:absolute;left:10px;top:10px;right:10px;display:flex;gap:5px;flex-wrap:wrap}button{background:#182220cc;color:#e7ece9;border:1px solid #4a5b55;border-radius:6px;padding:8px 9px;min-height:38px}button.on{background:#40564d}.ground{position:absolute;left:0;right:0;top:52%;border-top:1px solid rgba(194,214,205,.32);pointer-events:none}.ground span{position:absolute;right:8px;top:3px;color:#83928d;font-size:9px}.info{position:absolute;left:12px;bottom:10px;color:#9eaca7;font-size:10px}.panel{padding:16px;background:#171e1d;border-top:1px solid #34403e}.panel h2{font-size:14px;margin:0 0 4px}.note{font-size:11px;color:#93a09c;line-height:1.5}.controls{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}.row{margin:12px 0}.row label{display:flex;justify-content:space-between;font-size:12px}.row output{color:#bfd1c7}.row input{width:100%;accent-color:#c5d8ce}.status{font-size:11px;color:#a9c1b5;margin-top:8px}@media(min-width:760px){.wrap{display:grid;grid-template-columns:1fr 340px}.stage{height:calc(100vh - 64px)}.panel{border-top:0;border-left:1px solid #34403e}.controls{display:block}}
</style></head><body><header><div><h1>KAOPU · TREE LIFE GRAMMAR R04</h1><div class="sub">Seed → Root Tips + Leader/Buds → Competition → History</div></div><div class="sub">Mobile 3D · function state</div></header><div class="wrap"><main class="stage" id="stage"><canvas id="c"></canvas><div class="bar"><button id="play">生命播放</button><button id="rootBtn" class="on">Root</button><button id="budBtn" class="on">Buds</button><button id="orbit">转动</button><button id="reset">正面</button></div><div class="ground"><span>GROUND · SEED</span></div><div class="info" id="info"></div></main><aside class="panel"><h2>R04：不再把成年树缩放</h2><div class="note">年龄改变拓扑：新芽出现、部分芽休眠、leader 延续、根尖寻找湿润空间。地上与地下共用 Seed，但不是镜像。</div><div class="controls">
<div class="row"><label>年龄 T <output id="ageO"></output></label><input id="age" type="range" min="1" max="120" value="55"></div>
<div class="row"><label>光方向 <output id="lightO"></output></label><input id="light" type="range" min="-1" max="1" step=".02" value=".25"></div>
<div class="row"><label>土壤湿润偏向 <output id="soilO"></output></label><input id="soil" type="range" min="-1" max="1" step=".02" value="-.35"></div>
<div class="row"><label>顶端优势 <output id="apicalO"></output></label><input id="apical" type="range" min=".2" max="1" step=".02" value=".76"></div>
<div class="row"><label>历史资源 <output id="resourceO"></output></label><input id="resource" type="range" min=".3" max="1" step=".02" value=".72"></div>
<div class="row"><label>树冠竞争 <output id="spaceO"></output></label><input id="space" type="range" min="0" max="1" step=".02" value=".62"></div></div><div class="status" id="status"></div></aside></div><script>
const $=x=>document.getElementById(x),C=$('c'),X=C.getContext('2d'),TAU=Math.PI*2,clamp=(x,a,b)=>Math.max(a,Math.min(b,x));let P={age:55,light:.25,soil:-.35,apical:.76,resource:.72,space:.62},yaw=.18,pitch=.04,zoom=1.15,auto=false,showRoot=true,showBud=true,playing=false,last=0,seed=40404,shoot=[],roots=[],buds=[];
function hash(a,b=0){let x=Math.imul((a+b*131+seed)|0,1597334677);x^=x>>>15;x=Math.imul(x,3812015801);return((x^(x>>>16))>>>0)/4294967296}const V={add:(a,b)=>a.map((v,i)=>v+b[i]),sub:(a,b)=>a.map((v,i)=>v-b[i]),mul:(a,s)=>a.map(v=>v*s),len:a=>Math.hypot(...a),norm:a=>{let l=Math.hypot(...a)||1;return a.map(v=>v/l)},cross:(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]]};
function frame(d){let n=V.norm(V.cross(Math.abs(d[1])>.9?[1,0,0]:[0,1,0],d));return[n,V.norm(V.cross(d,n))]}
function shootAxis(o,d,len,depth,key,birth,leader){if(birth>P.age||depth>5||shoot.length>420)return;let pts=[o],pos=o,dir=V.norm(d),steps=8;for(let i=1;i<=steps;i++){let u=i/steps,lightPull=[P.light*.10*(1-depth*.08),.12*P.apical,0],noise=[(hash(key,i)-.5)*.055,0,(hash(key+7,i)-.5)*.055];dir=V.norm(V.add(dir,V.add(lightPull,noise)));let q=V.add(pos,V.mul(dir,len/steps));shoot.push({a:pos,b:q,depth,birth:birth+u*3,key,leader});pos=q;pts.push(pos)}let nextBirth=birth+5+depth*1.8;if(nextBirth>P.age)return;let leaderChance=leader?P.apical:.18;if(hash(key,91)<leaderChance)shootAxis(pos,dir,len*(.82+.08*P.resource),depth,key+101,nextBirth,true);let budN=depth<2?4:3;for(let k=0;k<budN;k++){let bu=.28+.58*k/(budN-1),idx=Math.min(steps-1,Math.floor(bu*steps)),bp=pts[idx],bd=V.norm(V.sub(pts[idx+1],pts[Math.max(0,idx-1)])),fr=frame(bd),side=k%2?1:-1,az=side*(.75+.45*hash(key,k))+k*.7,lat=V.add(V.mul(fr[0],Math.cos(az)),V.mul(fr[1],Math.sin(az))),lightScore=.5+.5*P.light*Math.sign(lat[0]),activation=(1-P.apical*.55)*lightScore*P.resource*(.72+.28*P.space),active=hash(key,k+31)<activation;buds.push({p:bp,active,birth:nextBirth});if(active)shootAxis(bp,V.norm(V.add(V.mul(bd,.42),V.mul(lat,.91))),len*(.58+.08*hash(key,k)),depth+1,key*7+k+13,nextBirth,false)}}
function rootAxis(o,d,len,depth,key,birth){if(birth>P.age||depth>5||roots.length>360)return;let pos=o,dir=V.norm(d),steps=7;for(let i=1;i<=steps;i++){let u=i/steps,moist=[P.soil*.16,-.10,0],noise=[(hash(key,i)-.5)*.11,0,(hash(key+3,i)-.5)*.11];dir=V.norm(V.add(dir,V.add(moist,noise)));let q=V.add(pos,V.mul(dir,len/steps));roots.push({a:pos,b:q,depth,birth:birth+u*3,key});pos=q}let nb=birth+6+depth*2;if(nb>P.age)return;let n=depth===0?4:2;for(let k=0;k<n;k++){let fr=frame(dir),az=k*TAU/n+hash(key,k)*.8,lat=V.add(V.mul(fr[0],Math.cos(az)),V.mul(fr[1],Math.sin(az))),aim=V.norm(V.add(V.mul(dir,.48),V.mul(lat,.88)));aim[1]-=.20+.12*depth;rootAxis(pos,aim,len*(.62+.08*P.resource),depth+1,key*5+k+71,nb)}}
function build(){shoot=[];roots=[];buds=[];let juvenile=clamp(P.age/18,.12,1),baseLen=.10+.12*P.resource;shootAxis([0,0,0],[.02,1,.01],baseLen,0,11,1,true);rootAxis([0,0,0],[.03,-1,.02],baseLen*.82,0,301,1);$('status').textContent=shoot.length+' shoot links · '+roots.length+' root links · '+buds.filter(b=>b.active).length+'/'+buds.length+' active buds';draw()}
function proj(p,w,h){let cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch),x=p[0]*cy-p[2]*sy,z=p[0]*sy+p[2]*cy,y=p[1],yy=y*cp-z*sp,zz=y*sp+z*cp,sc=Math.min(w,h)*.62/zoom,q=1/(1+zz*.35);return[w/2+x*sc*q,h*.52-yy*sc*q,zz,q]}
function draw(){let r=C.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,1.7),w=C.width=Math.round(r.width*d),h=C.height=Math.round(r.height*d);X.clearRect(0,0,w,h);let all=[];for(const s of shoot)if(s.birth<=P.age)all.push({...s,type:'shoot'});if(showRoot)for(const s of roots)if(s.birth<=P.age)all.push({...s,type:'root'});all=all.map(s=>{let a=proj(s.a,w,h),b=proj(s.b,w,h);return{s,a,b,z:(a[2]+b[2])/2}}).sort((a,b)=>a.z-b.z);X.lineCap='round';for(const o of all){let s=o.s,age=P.age-s.birth,thick=(s.depth===0?5.8:4.1)*Math.pow(.67,s.depth)*(1+Math.log1p(Math.max(0,age))*.18);X.lineWidth=Math.max(.7,thick*d);X.strokeStyle=s.type==='root'?'rgba(174,184,177,.72)':s.leader?'rgba(224,229,225,.96)':'rgba(207,215,210,.9)';X.beginPath();X.moveTo(o.a[0],o.a[1]);X.lineTo(o.b[0],o.b[1]);X.stroke()}if(showBud)for(const b of buds){if(b.birth>P.age)continue;let p=proj(b.p,w,h);X.fillStyle=b.active?'rgba(189,219,190,.95)':'rgba(133,145,140,.55)';X.beginPath();X.arc(p[0],p[1],b.active?2.4*d:1.5*d,0,TAU);X.fill()}let s=proj([0,0,0],w,h);X.fillStyle='#e3e8e5';X.beginPath();X.arc(s[0],s[1],3*d,0,TAU);X.fill();$('info').textContent='T '+Math.round(P.age)+'y · leader/bud competition · independent root tips'}
function sync(rebuild=true){for(const k of Object.keys(P)){P[k]=+$ (k).value;$(k+'O').textContent=k==='age'?Math.round(P[k])+' 年':P[k].toFixed(2)}if(rebuild)build()}for(const k of Object.keys(P))$(k).oninput=()=>{playing=false;clearTimeout(window._t);window._t=setTimeout(()=>sync(true),45)};$('rootBtn').onclick=()=>{showRoot=!showRoot;$('rootBtn').classList.toggle('on',showRoot);draw()};$('budBtn').onclick=()=>{showBud=!showBud;$('budBtn').classList.toggle('on',showBud);draw()};$('orbit').onclick=()=>{auto=!auto;$('orbit').classList.toggle('on',auto)};$('reset').onclick=()=>{yaw=.18;pitch=.04;zoom=1.15;draw()};$('play').onclick=()=>{P.age=1;$('age').value=1;playing=true};let drag=null;C.onpointerdown=e=>{drag=[e.clientX,e.clientY];C.setPointerCapture(e.pointerId)};C.onpointermove=e=>{if(!drag)return;yaw+=(e.clientX-drag[0])*.008;pitch=clamp(pitch+(e.clientY-drag[1])*.006,-.7,.8);drag=[e.clientX,e.clientY];draw()};C.onpointerup=()=>drag=null;C.onwheel=e=>{e.preventDefault();zoom=clamp(zoom*Math.exp(e.deltaY*.001),.65,2.4);draw()};function tick(t){let dt=(t-last)/1000||0;last=t;if(auto)yaw+=dt*.18;if(playing){P.age=Math.min(120,P.age+dt*7);$('age').value=P.age;sync(true);if(P.age>=120)playing=false}else if(auto)draw();requestAnimationFrame(tick)}addEventListener('resize',draw);sync(true);requestAnimationFrame(tick);
</script></body></html>
