<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#071018" />
  <title>日军巡逻艇生产线 · 三维工作台 V001</title>
  <style>
    :root{color-scheme:dark;--bg:#071018;--panel:rgba(8,18,27,.82);--line:rgba(187,217,231,.25);--text:#ecf7fb;--muted:#9fb6c1;--accent:#e8b66b}
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg);font-family:Inter,"Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;color:var(--text)}
    #stage{position:fixed;inset:0;background:radial-gradient(circle at 50% 42%,#173342 0,#0b1a24 48%,#050a0f 100%)}
    #viewer{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:transparent}
    .topbar{position:fixed;z-index:5;left:16px;right:16px;top:max(16px,env(safe-area-inset-top));height:58px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 16px;border:1px solid var(--line);border-radius:14px;background:var(--panel);backdrop-filter:blur(14px);box-shadow:0 12px 36px rgba(0,0,0,.28);pointer-events:none}
    .brand{min-width:0}.brand strong{display:block;font-size:16px;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.brand span{display:block;margin-top:3px;color:var(--muted);font-size:11px;letter-spacing:.11em;text-transform:uppercase}
    .badge{flex:none;padding:7px 10px;border:1px solid rgba(232,182,107,.45);border-radius:999px;color:#ffd99d;background:rgba(105,70,24,.28);font-size:11px;letter-spacing:.08em}
    .help{position:fixed;z-index:5;left:16px;bottom:max(16px,env(safe-area-inset-bottom));padding:10px 13px;border:1px solid var(--line);border-radius:12px;background:var(--panel);backdrop-filter:blur(12px);color:var(--muted);font-size:12px;line-height:1.45;pointer-events:none}
    .actions{position:fixed;z-index:6;right:16px;bottom:max(16px,env(safe-area-inset-bottom));display:flex;gap:8px}
    button{appearance:none;border:1px solid var(--line);border-radius:11px;background:var(--panel);color:var(--text);height:40px;padding:0 13px;font:600 12px/1 system-ui,sans-serif;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(12px)}
    button:hover{border-color:rgba(232,182,107,.7);background:rgba(33,43,50,.93)}
    #loading{position:fixed;z-index:4;inset:0;display:grid;place-items:center;pointer-events:none;transition:opacity .35s ease}#loading.done{opacity:0}
    .loader{display:flex;align-items:center;gap:12px;padding:14px 17px;border:1px solid var(--line);border-radius:14px;background:var(--panel);box-shadow:0 18px 50px rgba(0,0,0,.38)}
    .spinner{width:19px;height:19px;border:2px solid rgba(255,255,255,.18);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    @media(max-width:640px){.topbar{left:10px;right:10px;top:max(10px,env(safe-area-inset-top));height:54px;padding:0 12px}.brand strong{font-size:14px}.brand span{font-size:9px}.badge{padding:6px 8px;font-size:9px}.help{left:10px;bottom:max(10px,env(safe-area-inset-bottom));max-width:52%;font-size:10px}.actions{right:10px;bottom:max(10px,env(safe-area-inset-bottom));flex-direction:column}button{height:38px;padding:0 11px;font-size:11px}}
  </style>
</head>
<body>
  <main id="stage" aria-label="日军巡逻艇三维工作台">
    <iframe id="viewer" title="Friday The 13th Sit Boat Idle 3D model" allow="autoplay; fullscreen; xr-spatial-tracking" allowfullscreen src="https://sketchfab.com/models/87f8fa10044a4c62baf24301eb1a3375/embed?autostart=1&preload=1&ui_infos=0&ui_watermark=0&ui_help=0&ui_hint=0&ui_inspector=0&ui_annotations=0&ui_settings=0&ui_vr=0"></iframe>
  </main>
  <header class="topbar"><div class="brand"><strong>日军巡逻艇生产线 · 三维工作台</strong><span>Patrol Boat Workbench · V001</span></div><div class="badge">公开 HTML</div></header>
  <div id="loading"><div class="loader"><span class="spinner"></span><span>正在载入三维船体…</span></div></div>
  <div class="help">拖动旋转 · 滚轮缩放 · 双击聚焦<br>船体默认在首屏中央</div>
  <nav class="actions" aria-label="工作台操作"><button id="reload" type="button">重新载入</button><button id="fullscreen" type="button">全屏查看</button></nav>
  <script>
    const viewer=document.getElementById('viewer'),loading=document.getElementById('loading');
    viewer.addEventListener('load',()=>setTimeout(()=>loading.classList.add('done'),900),{once:true});
    document.getElementById('reload').addEventListener('click',()=>{loading.classList.remove('done');const src=viewer.src;viewer.src='about:blank';requestAnimationFrame(()=>viewer.src=src)});
    document.getElementById('fullscreen').addEventListener('click',async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch(e){}});
    setTimeout(()=>loading.classList.add('done'),9000);
  </script>
  <!-- Model credit: "Friday The 13th Sit Boat Idle" by JasonKills, licensed CC BY 4.0. Source: https://sketchfab.com/3d-models/friday-the-13th-sit-boat-idle-87f8fa10044a4c62baf24301eb1a3375 -->
</body>
</html>
