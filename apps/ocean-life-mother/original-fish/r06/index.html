<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Original Fish R06</title><style>html,body{margin:0;height:100%;background:#071318;color:#dfeeed;font:15px system-ui}main{height:100%;display:grid;place-content:center;text-align:center;padding:24px}button{padding:9px 16px}</style></head><body><main><h1>Original Fish R06</h1><p id="boot">正在校验并打开第一条原生整鱼生产线…</p></main><script>(async()=>{const boot=document.getElementById('boot');try{if(!crypto?.subtle||!('DecompressionStream'in self))throw Error('浏览器缺少校验或解压能力');const names=["payload/payload-00.txt", "payload/payload-01.txt", "payload/payload-02.txt"];const text=(await Promise.all(names.map(async n=>{const r=await fetch(n,{cache:'no-store'});if(!r.ok)throw Error(n+' '+r.status);return r.text()})))).join('').trim();const bytes=Uint8Array.from(atob(text),c=>c.charCodeAt(0));const html=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();const h=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(html))),x=>x.toString(16).padStart(2,'0')).join('');if(h!=='c5ae577a6d642e1623001ee16b06086eec19f08b2349c4f0815e643e8215bee4')throw Error('候选校验失败');document.open();document.write(html);document.close()}catch(e){boot.textContent=String(e.message||e);const b=document.createElement('button');b.textContent='重新打开';b.onclick=()=>location.reload();boot.after(b);console.error(e)}})()</script></body></html>
