<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ocean Mother · Fish / Bird / Coral</title><style>html,body{margin:0;width:100%;height:100%;background:#09161d;color:#e8f4f6;font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}#boot{position:fixed;inset:0;display:grid;place-items:center;background:#09161d}#boot div{text-align:center}#boot b{display:block;font-size:18px;margin-bottom:8px}#boot span{color:#9db4ba;font-size:12px}</style></head><body><div id="boot"><div><b>Ocean Mother</b><span>正在打开 Fish · Bird · Coral 工作台…</span></div></div><script>(async()=>{try{const files=['payload/payload-00.txt','payload/payload-01.txt','payload/payload-02.txt','payload/payload-03.txt','payload/payload-04.txt','payload/payload-05.txt'];const b64=(await Promise.all(files.map(async u=>{const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error('资源读取失败 '+u);return r.text()}))).join('').trim();const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));if(!('DecompressionStream'in self))throw new Error('浏览器不支持内置解压');const html=await new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'))).text();document.open();document.write(html);document.close()}catch(e){document.getElementById('boot').innerHTML='<div><b>工作台启动失败</b><span>'+String(e.message||e)+'</span></div>'}})();</script></body></html>
