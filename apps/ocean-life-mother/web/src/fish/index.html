<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FISH-R1-T01 · 大口黑鲈头—口结构工作台</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <canvas id="view" aria-label="大口黑鲈函数化头部三维视图"></canvas>
  <header>
    <div><strong>FISH-R1-T01</strong><span>大口黑鲈 · 头—口结构候选</span></div>
    <div id="status" class="status">启动中</div>
  </header>
  <aside id="panel">
    <section>
      <h1>固定视角</h1>
      <div class="button-grid" id="views">
        <button data-view="side" class="active">侧视</button><button data-view="three">斜侧</button>
        <button data-view="front">正面</button><button data-view="top">俯视</button>
      </div>
    </section>
    <section>
      <label class="label-row"><span>下颌张角</span><output id="angleOut">0.0°</output></label>
      <input id="mouth" type="range" min="0" max="0.30" step="0.005" value="0">
      <div class="button-grid"><button id="animate">呼吸式开合</button><button id="reset">复位</button></div>
    </section>
    <section>
      <h2>结构显示</h2>
      <label><input id="showCavity" type="checkbox" checked> 口腔体积</label>
      <label><input id="showJaw" type="checkbox" checked> 独立下颌</label>
      <label><input id="showAnchors" type="checkbox" checked> 铰点与眼锚</label>
      <label><input id="wire" type="checkbox"> 三角网格</label>
    </section>
    <section class="evidence">
      <h2>证据边界</h2>
      <p><b>精确输入：</b><code>c1b964…ee64</code></p>
      <p><b>原生生成：</b>头颅、下颌、口腔、唇缘、上颌骨、眼球。</p>
      <p><b>不含：</b>源网格、源贴图、源蒙皮和源动画轨道。</p>
      <p><b>状态：</b><span class="candidate">数值候选</span> · 视觉未验收 · 非生产版。</p>
    </section>
  </aside>
  <footer><span id="metrics">—</span><span>拖拽旋转 · 滚轮缩放</span></footer>
  <div id="fatal" hidden></div>
</div>
<script type="module" src="main.js"></script>
</body>
</html>
