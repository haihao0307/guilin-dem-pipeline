<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><title>Landscape Mother V008</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#8fb4c4;color:#f5f1e8;font-family:system-ui,-apple-system,"PingFang SC",sans-serif}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}.bar{position:fixed;z-index:2;left:10px;right:10px;top:calc(10px + env(safe-area-inset-top));display:flex;align-items:center;gap:6px;padding:8px 10px;border:1px solid #ffffff30;border-radius:14px;background:#071018d9;backdrop-filter:blur(10px)}.title{min-width:0;flex:1}.title b{display:block;font:600 11px/1.2 system-ui;letter-spacing:.08em}.title span{display:block;margin-top:3px;color:#afbbb5;font-size:8px}.bar button{height:33px;min-width:38px;padding:0 10px;border:1px solid #ffffff24;border-radius:9px;background:#ffffff0a;color:#f1d18f;font-size:11px}.bar button:active{background:#ddb86f30}.panel{position:fixed;z-index:2;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));width:min(270px,calc(100vw - 20px));padding:10px 12px;border:1px solid #ffffff2a;border-radius:14px;background:#071018df;backdrop-filter:blur(10px)}.panel .row{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center;margin:7px 0;color:#c2cbc6;font-size:9px}.panel input{grid-column:1/-1;width:100%;accent-color:#dcb66a}.hint{position:fixed;z-index:2;left:10px;bottom:calc(10px + env(safe-area-inset-bottom));padding:8px 10px;border:1px solid #ffffff24;border-radius:12px;background:#071018cc;color:#aeb8b2;font-size:8px}.error{position:fixed;inset:0;display:none;place-items:center;padding:30px;background:#071018;color:#f2d08c;text-align:center} @media(max-width:720px){.panel{width:210px}.hint{display:none}.bar{gap:4px}.bar button{padding:0 8px;min-width:34px}.title span{display:none}}</style></head><body><canvas id="c"></canvas><div class="bar"><div class="title"><b>LANDSCAPE MOTHER · 喀斯特近景</b><span id="status">正在启动在线三维函数场</span></div><button id="prev">‹</button><button id="next">›</button><button id="random">随机</button><button id="reset">复位</button></div><div class="panel"><div class="row"><span>岩体色彩</span><b id="colorV">1.00</b><input id="color" type="range" min="0.65" max="1.35" step="0.01" value="1"></div><div class="row"><span>太阳强度</span><b id="sunV">2.40</b><input id="sun" type="range" min="1.3" max="4.2" step="0.05" value="2.4"></div><div class="row"><span>地貌起伏</span><b id="reliefV">1.00</b><input id="relief" type="range" min="0.72" max="1.28" step="0.01" value="1"></div></div><div class="hint">拖动旋转 · 双指或滚轮缩放 · 无雾 · 无远山 · 无图片贴图</div><div id="err" class="error"></div><script>(()=>{'use strict';const $=x=>document.getElementById(x),cv=$('c'),st=$('status'),err=$('err');let gl;try{gl=cv.getContext('webgl2',{alpha:false,antialias:false,powerPreference:'high-performance'});}catch(e){}if(!gl){err.style.display='grid';err.textContent='当前内置预览没有运行网页脚本或 WebGL2。请通过正常网页链接打开。';return}const N=81,W=26,D=21,verts=N*N,inds=(N-1)*(N-1)*6;let seed=28117,relief=1,colorGain=1,sunPower=2.4,yaw=.72,pitch=.32,dist=31,target=[0,5,0],drag=0,lx=0,ly=0;const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),mix=(a,b,t)=>a+(b-a)*t,smooth=(a,b,x)=>{let t=clamp((x-a)/(b-a));return t*t*(3-2*t)};function hash(i,k,s){let n=(Math.imul(i,374761393)+Math.imul(k,668265263)+Math.imul(s,1442695041))|0;n^=n>>>13;n=Math.imul(n,1274126177);return((n^(n>>>16))>>>0)/4294967295}function noise(x,z,s){let i=Math.floor(x),k=Math.floor(z),u=x-i,v=z-k;u=u*u*(3-2*u);v=v*v*(3-2*v);return mix(mix(hash(i,k,s),hash(i+1,k,s),u),mix(hash(i,k+1,s),hash(i+1,k+1,s),u),v)*2-1}function fbm(x,z,s){let q=0,a=.5,f=1,n=0;for(let j=0;j<4;j++){q+=a*noise(x*f,z*f,s+j*97);n+=a;a*=.5;f*=2.03}return q/n}function rng(s){let a=s>>>0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}function recipe(){let r=rng(seed),b=[[-3.8,-.2,14.2,3.6,3],[3,-1,12.7,3.1,2.7],[-.1,-4.1,10.6,2.8,2.3],[.8,4,8.5,2.8,2.3]];return b.map(p=>({x:p[0]+(r()-.5)*.7,z:p[1]+(r()-.5)*.6,h:p[2]*(.92+r()*.16),rx:p[3]*(.92+r()*.16),rz:p[4]*(.92+r()*.16),a:(r()-.5)*.55,ph:r()*6.28,n:5+(r()*3|0)}))}function tower(x,z,t){let c=Math.cos(t.a),s=Math.sin(t.a),u=(x-t.x)*c+(z-t.z)*s,v=-(x-t.x)*s+(z-t.z)*c,an=Math.atan2(v,u),warp=1+.045*fbm(u*.38,v*.38,seed+17),rr=Math.pow(Math.pow(Math.abs(u)/(t.rx*warp),5.7)+Math.pow(Math.abs(v)/(t.rz*warp),5.7),1/5.7),body=Math.pow(clamp(1-smooth(.49,1.01,rr)),.30),h=t.h*relief*body;if(h<.01)return 0;let side=smooth(.35,.78,rr)*(1-smooth(.89,1.01,rr)),groove=Math.pow(Math.max(0,Math.sin(an*t.n+t.ph+fbm(u*.5,v*.5,seed+33))),12);h-=side*groove*1.15;h+=body*(.38*fbm(u*.45,v*.45,seed+51)+.14*Math.sin(u*.7+v*.31+t.ph));return Math.max(0,h)}function H(x,z,R){let g=.12+.08*fbm(x*.2,z*.2,seed+301),h=g;for(let t of R)h=Math.max(h,tower(x,z,t));let e=Math.max(Math.abs(x)/(W*.5),Math.abs(z)/(D*.5));return g+(h-g)*(1-smooth(.80,.99,e))}const VS=`#version 300 es
layout(location=0)in vec3 p;layout(location=1)in vec3 n;layout(location=2)in vec3 col;uniform mat4 vp;out vec3 N,C,P;void main(){P=p;N=n;C=col;gl_Position=vp*vec4(p,1.);}`;const FS=`#version 300 es
precision highp float;in vec3 N,C,P;uniform vec3 eye;uniform float sun;out vec4 o;vec3 s2l(vec3 c){bvec3 q=lessThanEqual(c,vec3(.04045));return mix(pow((c+.055)/1.055,vec3(2.4)),c/12.92,q);}vec3 l2s(vec3 c){bvec3 q=lessThanEqual(c,vec3(.00313));return mix(1.055*pow(max(c,0.),vec3(.416666))-.055,c*12.92,q);}void main(){vec3 n=normalize(N),v=normalize(eye-P),l=normalize(vec3(.58,.75,.34)),h=normalize(v+l);float nl=max(dot(n,l),0.),nv=max(dot(n,v),.01),nh=max(dot(n,h),0.);float rough=mix(.82,.54,clamp(P.y/15.,0.,1.));float a=rough*rough,a2=a*a,d=nh*nh*(a2-1.)+1.,D=a2/(3.14159*d*d+.001),k=(rough+1.)*(rough+1.)/8.,G=(nl/(nl*(1.-k)+k))*(nv/(nv*(1.-k)+k));vec3 F=vec3(.04)+(1.-vec3(.04))*pow(1.-max(dot(v,h),0.),5.);vec3 base=s2l(C),spec=D*G*F/max(4.*nl*nv,.01),diff=(1.-F)*base/3.14159;vec3 sky=s2l(vec3(.42,.57,.63)),ground=s2l(vec3(.31,.22,.13)),amb=base*mix(ground,sky,n.y*.5+.5)*.78;vec3 lit=(diff+spec)*s2l(vec3(1.,.91,.72))*sun*nl+amb;lit=lit/(lit+vec3(.72));o=vec4(l2s(lit),1.);}`;function shader(t,s){let q=gl.createShader(t);gl.shaderSource(q,s);gl.compileShader(q);if(!gl.getShaderParameter(q,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(q));return q}let pr=gl.createProgram();gl.attachShader(pr,shader(gl.VERTEX_SHADER,VS));gl.attachShader(pr,shader(gl.FRAGMENT_SHADER,FS));gl.linkProgram(pr);if(!gl.getProgramParameter(pr,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(pr));let vao=gl.createVertexArray(),vb=gl.createBuffer(),ib=gl.createBuffer(),idx=new Uint16Array(inds);for(let z=0,q=0;z<N-1;z++)for(let x=0;x<N-1;x++){let a=z*N+x,b=a+1,c=a+N,d=c+1;idx[q++]=a;idx[q++]=c;idx[q++]=b;idx[q++]=b;idx[q++]=c;idx[q++]=d}gl.bindVertexArray(vao);gl.bindBuffer(gl.ARRAY_BUFFER,vb);gl.bufferData(gl.ARRAY_BUFFER,verts*9*4,gl.DYNAMIC_DRAW);for(let i=0;i<3;i++){gl.enableVertexAttribArray(i);gl.vertexAttribPointer(i,3,gl.FLOAT,false,36,i*12)}gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ib);gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,idx,gl.STATIC_DRAW);gl.bindVertexArray(null);let data=new Float32Array(verts*9),heights=new Float32Array(verts);function build(){st.textContent='正在生成彩色喀斯特函数场';let R=recipe(),dx=W/(N-1),dz=D/(N-1),x0=-W/2,z0=-D/2,max=0;for(let z=0;z<N;z++)for(let x=0;x<N;x++){let i=z*N+x,h=H(x0+x*dx,z0+z*dz,R);heights[i]=h;max=Math.max(max,h)}for(let z=0;z<N;z++)for(let x=0;x<N;x++){let i=z*N+x,l=heights[z*N+Math.max(0,x-1)],r=heights[z*N+Math.min(N-1,x+1)],d=heights[Math.max(0,z-1)*N+x],u=heights[Math.min(N-1,z+1)*N+x],gx=(r-l)/(2*dx),gz=(u-d)/(2*dz),nx=-gx,ny=1,nz=-gz,nl=Math.hypot(nx,ny,nz);nx/=nl;ny/=nl;nz/=nl;let h=heights[i],slope=1-Math.abs(ny),age=.5+.5*fbm((x0+x*dx)*.27,(z0+z*dz)*.27,seed+701),flow=clamp(.25+.45*(1-ny)+.3*fbm((x0+x*dx)*.45,(z0+z*dz)*.45,seed+901)),rock=smooth(.5,1.7,h)+slope*.65,grain=.5+.5*fbm((x0+x*dx)*.8,(z0+z*dz)*.8,seed+44);let c=[.62,.60,.46];if(age>.58)c=[.49,.50,.38];if(flow>.62&&slope>.25)c=[.60,.34,.10];if(flow>.73&&slope<.45)c=[.18,.38,.10];if(rock<.48)c=[.34,.21,.09];c=c.map(v=>clamp(v*colorGain*(.88+.18*grain),.03,.95));let q=i*9;data[q]=x0+x*dx;data[q+1]=h;data[q+2]=z0+z*dz;data[q+3]=nx;data[q+4]=ny;data[q+5]=nz;data[q+6]=c[0];data[q+7]=c[1];data[q+8]=c[2]}gl.bindBuffer(gl.ARRAY_BUFFER,vb);gl.bufferSubData(gl.ARRAY_BUFFER,0,data);st.textContent='彩色喀斯特已完成 · 种子 '+seed;draw()}function persp(f,a,n,f2){let t=1/Math.tan(f/2),q=1/(n-f2);return new Float32Array([t/a,0,0,0,0,t,0,0,0,0,(f2+n)*q,-1,0,0,2*f2*n*q,0])}function look(e,t){let zx=e[0]-t[0],zy=e[1]-t[1],zz=e[2]-t[2],zl=Math.hypot(zx,zy,zz);zx/=zl;zy/=zl;zz/=zl;let xx=zz,xz=-zx,xl=Math.hypot(xx,xz);xx/=xl;xz/=xl;let yx=zy*xz,yy=zz*xx-zx*xz,yz=-zy*xx;return new Float32Array([xx,yx,zx,0,0,yy,zy,0,xz,yz,zz,0,-(xx*e[0]+xz*e[2]),-(yx*e[0]+yy*e[1]+yz*e[2]),-(zx*e[0]+zy*e[1]+zz*e[2]),1])}function mul(a,b){let o=new Float32Array(16);for(let c=0;c<4;c++)for(let r=0;r<4;r++)o[c*4+r]=a[r]*b[c*4]+a[4+r]*b[c*4+1]+a[8+r]*b[c*4+2]+a[12+r]*b[c*4+3];return o}function resize(){let d=Math.min(devicePixelRatio||1,1.35),w=cv.clientWidth*d|0,h=cv.clientHeight*d|0;if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h;gl.viewport(0,0,w,h)}}function draw(){resize();let cp=Math.cos(pitch),eye=[target[0]+Math.sin(yaw)*cp*dist,target[1]+Math.sin(pitch)*dist,target[2]+Math.cos(yaw)*cp*dist],vp=mul(persp(.78,cv.width/cv.height,.1,120),look(eye,target));gl.clearColor(.40,.61,.70,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.enable(gl.DEPTH_TEST);gl.disable(gl.CULL_FACE);gl.useProgram(pr);gl.uniformMatrix4fv(gl.getUniformLocation(pr,'vp'),false,vp);gl.uniform3f(gl.getUniformLocation(pr,'eye'),...eye);gl.uniform1f(gl.getUniformLocation(pr,'sun'),sunPower);gl.bindVertexArray(vao);gl.drawElements(gl.TRIANGLES,inds,gl.UNSIGNED_SHORT,0)}cv.onpointerdown=e=>{drag=1;lx=e.clientX;ly=e.clientY;cv.setPointerCapture(e.pointerId)};cv.onpointermove=e=>{if(!drag)return;yaw-=(e.clientX-lx)*.007;pitch=clamp(pitch-(e.clientY-ly)*.006,-.05,1.15);lx=e.clientX;ly=e.clientY;draw()};cv.onpointerup=()=>drag=0;cv.onpointercancel=()=>drag=0;cv.onwheel=e=>{e.preventDefault();dist=clamp(dist*Math.exp(e.deltaY*.001),10,48);draw()};$('prev').onclick=()=>{seed=Math.max(1,seed-1);build()};$('next').onclick=()=>{seed++;build()};$('random').onclick=()=>{seed=1+(Math.random()*900000|0);build()};$('reset').onclick=()=>{yaw=.72;pitch=.32;dist=31;draw()};function bind(id,fn){let e=$(id),v=$(id+'V');e.oninput=()=>{v.textContent=(+e.value).toFixed(2);fn(+e.value)}}bind('color',v=>{colorGain=v;build()});bind('sun',v=>{sunPower=v;draw()});bind('relief',v=>{relief=v;build()});addEventListener('resize',draw);try{build();window.__LANDSCAPE_READY__=true}catch(e){console.error(e);err.style.display='grid';err.textContent='三维函数场启动失败：'+e.message}})();</script></body></html>
